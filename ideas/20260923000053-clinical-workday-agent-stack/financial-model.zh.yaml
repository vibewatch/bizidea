  round: pre-seed
  amountM: 3.0
  runwayMonths: 18
  milestone: 拿下 3 个付费共创客户，让其中 2 个在一套主流 EHR 上转成正式生产，证明低风险就诊收尾工作包要素的 60% 无修改通过率，并在 seed 轮前看到每新增一条服务线的实施时间继续下降。
