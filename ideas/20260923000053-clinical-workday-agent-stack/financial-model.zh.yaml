slug: visit-close-work-packets
date: '2026-09-23'
currency: USD
modelStartMonth: 2026-10
assumptions:
- id: A1
  name: 模型起始月份
  value: 2026-10
  unit: YYYY-MM
  source: '[BP date 2026-09-23] 模型从这版带日期的商业计划之后的第一个完整运营月开始。'
- id: A2
  name: 起始现金 / pre-seed 融资
  value: $3.0M
  unit: USD
  source: '[BP fundingAsk.round pre-seed + BP fundingAsk.targetFundingRangeUsd $3–5M + BP fundingAsk.runwayMonths 18] 基准情景取 BP 区间下沿，因为公司先要把一个以 EHR 为先的切口跑通，再谈横向扩展。'
- id: A3
  name: 起始付费医疗系统数
  value: '0'
  unit: count
  source: '[BP milestones 0–12 months] 公司从零收入起步，先得把共创客户兴趣转成付费试点。'
- id: A4
  name: 付费试点费用
  value: $120K，周期约 4 个月（~$30K/mo）
  unit: USD/logo
  source: '[BP investorMemo.firstCustomer.initialContract $75k-$150k paid pilot] 模型取试点区间偏上的中位，因为首个部署还包含限定范围的实施和效果衡量工作。'
- id: A5
  name: 基础正式生产 ACV
  value: $420K ARR（~$35K/mo）
  unit: USD/logo/year
  source: '[BP investorMemo.firstCustomer.initialContract $300k-$700k annual spend] 基准情景在正式生产区间里取偏下的中位，对应一个服务线加核心追踪数据。'
- id: A6
  name: 扩张后正式生产 ACV
  value: $600K ARR（~$50K/mo）
  unit: USD/logo/year
  source: '[BP businessModel.expansionLevers + BP milestones 24–36 months] 扩张默认增加更多诊所或服务线，再叠加基准报告，同时仍落在 BP 的年度支出区间内。'
- id: A7
  name: 客户阶段推进节奏
  value: 先做 4 个月付费试点，再转正式生产；上线约 12 个月后再扩张
  unit: timeline
  source: '[BP gtm.pricing + BP experimentRoadmap + BP milestones] 只有先把工作流、治理和采用效果证明跑出来，付费共创客户才会转成持续订阅的软件收入。'
- id: A8
  name: 客户落地节奏
  value: M5, M8, M11, M16, M21, M27, M33
  unit: month index
  source: '[BP milestones 0–12, 12–24, 24–36 + BP gtm.funnelTargets] 基准情景默认拿下 3 个付费客户（Y1）、5 个（Q4Y2）、7 个（Q4Y3），对齐 BP 提出的 5-7 个上线系统目标。'
- id: A9
  name: 各部署阶段毛利率
  value: 试点 35%，早期正式生产 68%，扩张后正式生产 78%
  unit: percent of revenue
  source: '[BP businessModel.targetGrossMarginPct 70 + BP operatingAssumptions on reusable mappings] 试点以服务为主，而可复用的 EHR 和环境式 AI 病历记录模板一旦跑通，成熟客户的毛利率就能超过长期 70% 目标。'
- id: A10
  name: 招聘时间线
  value: M1 配置创始人、创始工程师和临床 / 产品负责人；M2 增加 0.3 FTE 安全 / 合规；M3 增加解决方案架构师；M6 增加实施负责人；M9 增加第二名工程师；M12 增加首位 GTM 人员；M18 增加第三名交付人员；M20 增加第三名工程师；M24 合规提升到 0.5 FTE；M28 增加第二位 GTM 人员
  unit: timeline
  source: '[BP team + BP sequencingRationale + startup-finance heuristic] 招聘先保交付，等第一批正式生产案例出来后，再有节奏地补 GTM 产能。'
- id: A11
  name: 创始人综合用工成本
  value: $175K
  unit: USD/year
  source: '[BP team Founder CEO + startup-finance heuristic] 创始人现金薪酬保持精简，外加薪资税和福利。'
- id: A12
  name: 工程综合用工成本
  value: $190K
  unit: USD/year
  source: '[BP team Founding eng + startup-finance heuristic] 这个水平对应集成负担较重的临床工作流工程岗位，但不预设后期公司的高现金薪酬。'
- id: A13
  name: 临床信息学 / 产品综合用工成本
  value: $180K
  unit: USD/year
  source: '[BP team Clinical informatics and product lead + startup-finance heuristic] 这个岗位要由资深人员扛起工作流和安全责任。'
- id: A14
  name: 安全 / 合规综合用工成本
  value: $140K（按 FTE 等值计）
  unit: USD/year
  source: '[BP team Fractional security and compliance lead + startup-finance heuristic] 这个岗位一开始按兼职配置，只有采购量上来后才逐步放大。'
- id: A15
  name: 解决方案 / 实施综合用工成本
  value: $145K
  unit: USD/year
  source: '[BP team Solutions architect + Implementation lead + startup-finance heuristic] 对应以部署为主的医疗工作流人才成本。'
- id: A16
  name: 销售 / GTM 综合用工成本
  value: $175K
  unit: USD/year
  source: '[BP gtm.channels + startup-finance heuristic] 企业医疗销售前期仍由创始人主导，等参考案例出来后才逐步补上配额型销售人手。'
- id: A17
  name: 薪酬分摊到 P&L 科目
  value: 创始人 55% 计入 S&M / 15% 计入 R&D / 30% 计入 G&A；工程 100% 计入 R&D；临床 / 产品 70% 计入 R&D / 30% 计入 G&A；安全 100% 计入 G&A；解决方案 45% 计入 S&M / 35% 计入 R&D / 20% 计入 G&A；销售 100% 计入 S&M
  unit: allocation
  source: '[BP team role rationales + BP operations] 这样分摊人力成本，既能反映创始人主导销售，也能反映客户导入以工作流落地为主。'
- id: A18
  name: 非薪酬运营费用爬坡
  value: S&M/R&D/G&A 的月度非薪酬支出从 $8K/$10K/$12K 起步（Y1 早期），到约 $16K/$14K/$16K（Q4Y3）
  unit: USD/month
  source: '[BP operations + startup-finance heuristic] 主要覆盖云工具、差旅、法务、保险和外包财务，不假设大规模付费获客引擎。'
- id: A19
  name: 现金口径约定
  value: 现金变动等于 EBITDA
  unit: formula
  source: '[startup-finance heuristic] 在 pre-seed 规模下，资本开支、税、债务和营运资本波动相对经营现金消耗都可以忽略。'
- id: A20
  name: 单位经济模型月度流失率假设
  value: 1.5%
  unit: percent per month
  source: '[startup-finance heuristic for early enterprise workflow SaaS] 已经嵌入医疗系统的工作流通常黏性很强，但客户数集中、采购周期又长，所以仍要给非零流失率。'
- id: A21
  name: CAC 口径约定
  value: 36 个月 S&M 支出除以 7 个落地付费客户
  unit: formula
  source: '[model calculation using base-case S&M spend + BP gtm.channels] CAC 把创始人时间、GTM 招聘、差旅和解决方案驱动销售的投入都算进去，覆盖整个铺开的销售建设期。'
- id: A22
  name: pre-seed 融资对应的里程碑
  value: 拿下 3 个付费共创客户，把 2 个转成正式生产，在低风险就诊收尾工作包要素上证明 60% 无修改通过率，并在 seed 前看到实施时间继续下降
  unit: milestone
  source: '[BP milestones 0–12 and 12–24 + BP fundingAsk.useOfFundsSummary] 这轮融资的规模就是为了拿下第一组验证，同时还留出约 6 个月缓冲。'
- id: A23
  name: 单个落地系统的覆盖深度
  value: 模型里的 ACV 只按前 1-2 条服务线和部分诊所覆盖来算，不按研究里的 SOM 完整座位等价规模来算
  unit: scope
  source: '[Research market.som $11.9M + BP product.mvp + BP strategicChoices.beachhead] 这样设定，是为了让单个系统收入相对研究里的市场规模锚点和滩头市场策略都保持保守。'
- id: A24
  name: 季度薪酬口径约定
  value: Y2-Y3 的薪酬行按各季度实际月度薪资加总，不只看季度末快照
  unit: convention
  source: '[headcount column convention + BP team + startup-finance heuristic] 这样能让季度薪酬口径保持一致，尽管 Y2 和 Y3 的人员数只展示年末快照。'
