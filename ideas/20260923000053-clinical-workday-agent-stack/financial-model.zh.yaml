scenarios:
  downside:
    description: 采购周期拉长、试点转正更慢，系统层面的扩张也更接近只覆盖一条服务线，而不是基准情景预期的范围。
    y3RevenueK: 2640.0
    y3EbitdaK: -529.9
    cashLowPointK: 200.3
    keyAssumptionChanges:
    - Q4Y3 只能做到 6 个付费系统，而不是 7 个，因为后续批次大致晚了一个季度。
    - 基础正式生产 ACV 更接近约 $396K，扩张 ACV 更接近约 $540K，而不是 $420K 和 $600K。
    - 可复用映射和实施手册改进慢于计划，期末毛利率因此只停在高 60 区间。
  base:
    description: 创始人主导直销拿下 3 个付费共创客户（Y1），随后多诊所、多服务线扩张把第一批客户扩成 7 个系统客户（Q4Y3）。
    y3RevenueK: 3135.0
    y3EbitdaK: -40.2
    cashLowPointK: 1005.3
    keyAssumptionChanges:
    - 付费客户在 M5、M8、M11、M16、M21、M27、M33 落地。
    - 正式生产合同起步约为 $420K ARR，成熟账户可扩到大致 $600K ARR，时间点在上线约 12 个月后。
    - 毛利率会从试点式的 35% 提升到约 72%（Y3），因为第一套 EHR 和环境式 AI 病历记录模板会变成可复用资产。
  upside:
    description: 首个参考部署缩短采购周期，到 Q4Y3 会落地第八个系统，第二条服务线的扩张也会更早发生。
    y3RevenueK: 3885.0
    y3EbitdaK: 621.5
    cashLowPointK: 1553.7
    keyAssumptionChanges:
    - Q4Y3 会做到 8 个付费系统，因为参考客户和合作伙伴引荐把启动时间往前拉。
    - 基础正式生产 ACV 抬升到约 $456K，扩张 ACV 抬升到约 $660K，因为更多诊所和报告模块更早接入。
    - 实施复用提速快于基准情景，所以期末毛利率可到约 75%。
sensitivity:
- variable: ARPU
  downsideCase: 基础正式生产 ACV 下探到约 $396K，扩张 ACV 下探到约 $552K。
  baseCase: 基础正式生产 ACV 约为 $420K，扩张 ACV 约为 $600K。
  upsideCase: 基础正式生产 ACV 提升到约 $444K，扩张 ACV 提升到约 $648K。
  y3RevenueImpactK: -210.0
  cashImpactK: -227.0
- variable: CAC
  downsideCase: 如果差旅、合规尽调和高触达销售一直居高不下，CAC 会抬升到约 $280K。
  baseCase: 在创始人主导销售和参考案例复用承担大部分获客工作的前提下，CAC 维持在接近 $246K。
  upsideCase: 一旦参考客户和合作伙伴引荐带来更多销售管道，CAC 会回落到约 $220K。
  y3RevenueImpactK: 0.0
  cashImpactK: -274.0
- variable: 流失率
  downsideCase: 一个早期正式生产客户没能扩张，补位时间又推迟，等于把稳态留存往下拉。
  baseCase: 模型假设客户黏性强但集中度高，因此只在单位经济模型里计入 1.5% 的月度流失率。
  upsideCase: 所有早期客户都按节奏扩张，已装机客户群也完整撑过 Y3。
  y3RevenueImpactK: -100.0
  cashImpactK: -69.0
- variable: 销售周期
  downsideCase: 从发现需求到付费试点会多拉长约一个季度，因为合规和治理审查拖得更久。
  baseCase: 从严肃需求发现到付费试点平均约 6 个月，成功试点再过约 4 个月转正。
  upsideCase: 参考架构和关键买方会把试点启动再压缩约一个季度。
  y3RevenueImpactK: -255.0
  cashImpactK: -369.0
- variable: 毛利率
  downsideCase: 实施继续保持定制化，试点和正式生产的毛利率都会比计划低几个点。
  baseCase: 试点毛利率从 35% 起步，Y3 混合毛利率到约 72%。
  upsideCase: 可复用映射让成熟系统毛利率更快进入 70 多点。
  y3RevenueImpactK: 0.0
  cashImpactK: -206.0
- variable: 招聘节奏
  downsideCase: 在需求还没完全验证前，就把一名工程师和一名交付人员提前招进来。
  baseCase: 招聘继续按里程碑卡点推进，Y3 以 10.5 FTE 收官。
  upsideCase: 第二位 GTM 人员等到合作伙伴信号更清晰时再招，也不拖签单。
  y3RevenueImpactK: 0.0
  cashImpactK: -192.0
modelDiagram:
  title: 单位经济模型流转
  mermaid: |
    flowchart LR
      Targets[Qualified target systems] --> Assessments[Workflow assessments]
      Assessments --> Pilots[Paid design-partner pilots]
      Pilots --> Production[Production packet subscriptions]
      Production --> Expansion[More clinics and service lines]
      Expansion --> Revenue[Revenue]
      Revenue --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Cash runway]
modelSanity:
- checkName: 收入引擎
  finding: 基准情景收入来自 7 个付费医疗系统客户（Q4Y3）；首批 3 个共创客户会跑出 6 个正式生产系统，其中 4 个再扩成更高价值的多服务线合同。
- checkName: 必须跑通的环节
  finding: 前两次部署必须把无修改通过率推到 60% 以上，同时明显压缩实施时间，毛利率才有可能从试点式的 35% 爬到 70% 以上。
- checkName: 模型最脆弱处
  finding: 模型最脆弱的是销售周期：只要大致晚一个季度，敏感性表里会先少掉约 $255K 的 Y3 收入，期末现金再少约 $369K。
- checkName: 下一轮融资证明点
  finding: seed 轮故事要站住，得先拿到 2 个正式生产转化、低风险要素 60% 的无修改通过率、50% 的审阅时间下降，以及第一套 EHR 和环境式 AI 病历记录模板上看得见的实施工时压缩。
sanityChecks:
  ruleOf40: Y3 增长 80.2% + EBITDA 利润率 -1.3% = 78.9%
  burnMultiple: Y2 的现金消耗倍数约 0.6x，基于大约 $0.81M 的 EBITDA 亏损和约 $1.27M 的净新增收入计算；Y3 已接近 EBITDA 盈亏平衡。
  revenuePerFte: $299K 的 Y3 人均收入，按年末 10.5 FTE 计算（垂直 SaaS 基准 $200-400K）
  flags:
  - 这套计划到 7 个付费系统（Q4Y3）就收官，所以只要有一家医疗系统采购或上线延后，全年结果就会明显变样。
  - 只有前两次部署之后，每新增一条服务线的实施时间明显下降，毛利率才过得了长期 70% 目标；如果服务继续保持定制化，下行情景里的现金会被压到约 $0.2M。
  - 正式生产 ACV 按部分服务线覆盖而不是全系统铺开计算，所以每个已落地系统内部仍得继续扩张，研究里的 SOM 才谈得上。
  - 业务到 Y3 也只是接近 EBITDA 盈亏平衡，下一轮融资能不能讲通，靠的是证明里程碑，不是单看盈利。
  - 现金直接按 EBITDA 建模，不包含回款时点、递延收入、资本开支和任何后续融资。
