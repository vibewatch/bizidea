slug: visit-close-work-packets
date: '2026-09-23'
executiveSummary: >-
  就诊收尾工作包一开始应只做美国市场，服务对象是已上线环境式 AI
  病历记录、但病历起草完后仍要让医生在不同队列里分别收尾转诊、医嘱、患者指导和后续跟进任务的 5-15
  家医院区域型医疗系统。眼下最痛的点在于，环境式 AI 病历记录减轻了写病历负担，却没把下班后的就诊收尾工作拿掉，CMIO
  和门诊运营负责人因此面对清晰可见的 ROI 缺口，以及持续不退的医生倦怠。MVP
  应先把低风险的就诊后任务汇成一个需要医生签署的工作包，把获批任务直接路由到现有协调员工作清单，并在提高自主放行比例之前，按专科和动作类型记录无修改通过率。相比泛化的临床智能体套件，这个滩头市场更窄、也更容易更快跑出证据，因为首轮验证要在一个主导
  EHR 和两条可复用服务线上证明医生复核时间更短、下游澄清回路更少，而不是展示笼统的 AI
  广度。研究支持的 TAM 约为 "$515.0M"，滩头市场 SAM 约为 "$126.0M"，初始 SOM 约为
  "$11.9M"，但这些数字建立在价格锚和雇佣制医生假设上，而不是披露出来的品类支出。公司要赢，前提是赶在现有厂商把同类跨队列签署能力打包进产品之前，先成为环境式
  AI 病历记录厂商、EHR 和转诊运营之间与厂商无关的放行层。最大的证伪风险有两个：医生修改率始终太高，工作包省不下时间；以及实施长期过度依赖服务，人力占比太重，毛利率始终拉不回正常水平。由于输入材料没有披露真实客户预算，前 12
  个月必须验证三件事：付费试点需求、可复用的实施模板，以及低风险工作包要素的无修改通过率门槛。
problem:
  - "环境式 AI 病历记录把病历先起好后，医生仍要在分散的 EHR 队列里分别收尾转诊、医嘱、患者指导和工作人员后续任务，因此下班后的补工和碎片化复核一个都没消失。"
  - "转诊和排班团队接手的常是半成品草稿、上下文又不全，只能反复重开任务、追着补澄清，也让门诊负责人更难证明环境式 AI 的 ROI。"
solution:
  - "把每次就诊里的转诊草稿、医嘱建议、患者指导、病历调取请求和后续跟进任务，汇成一个有证据支撑、带风险分层、明确下游责任人的工作包。"
  - "继续由医生做最终签署人，把获批工作立刻送进现有协调员队列，并随着本地无修改通过率上升，逐步判断哪些工作包要素可以从完整复核转向更轻量的签署。"
whyWeWin:
  - "这个切口比泛化临床智能体的故事更窄：只做一个就诊收尾放行层，卡在病历草稿和多队列运营执行之间。"
  - "按专科、医生和动作类型积累的无修改通过率遥测，能滚成护城河，而病历生成器和单队列工具天然不掌握这层数据。"
  - "现有厂商已经能起草这条流程里的部分环节，但公开定位仍围绕病历、医嘱或消息展开，而不是厂商中立的工作包放行层加下游完成度基准。"
strategicChoices:
  beachhead: >-
    滩头市场是美国区域型医疗系统：5-15 家医院、200+ 名雇佣制医生、一个主导
    EHR、环境式 AI 已在初级保健和心内科上线，并且有一个集中的转诊或收件箱支持团队。
  wedgeRationale: >-
    这块切口比做通用临床智能体平台更容易更快拿到证据，因为环境式 AI
    扩张项目里本来就有采购触发点，同一位医生同时管病历签署和下游工作，而集中的支持团队又能产出可量化的返工、闭环和周转指标。
  sequencingRationale: >-
    先守一个 EHR、两条服务线和低风险工作包要素，这样公司只要把工作流映射、治理和医生信任问题解一遍，再去扩面。只有当产品已经证明复核时间下降、修改率可接受、实施模板可复用，才该加更高风险的医嘱流程、更多服务线、伙伴分销或美国以外部署；这样才能守住早期刻意做出的取舍——先接受产品上线会以美国为中心、实施也更重服务，再等可复用软件毛利慢慢浮出来。
  notYet:
    - "非美国医疗系统，包括监管和 EHR 假设都不同的英国和欧盟市场"
    - "住院会诊、事前授权和术前准备工作流"
    - "在没有医生签署的情况下，全自动放行医嘱或转诊"
    - "替换式重做环境式 AI 病历记录或 EHR 产品"
market:
  tam: "估算 TAM 为 \"$515.0M\"，依据是美国直接面向患者的雇佣制医生人数、假设中的门诊适用比例，以及 Heidi 公开披露的医生席位价格锚。"
  sam: "估算滩头市场 SAM 为 \"$126.0M\"，依据是大约 100 家已准备好采用环境式 AI 的美国多院区大型医疗系统，每家约有 700 名目标门诊医生。"
  som: "初始 SOM 模型值为 \"$11.9M\"，假设早期拿下 12 家系统，每家平均约有 550 名医生纳入工作包覆盖。"
  segments:
    - "主要客群：美国区域型和多院区医疗系统——拥有雇佣制门诊医生团队、环境式 AI 已上线，并设有集中的转诊或收件箱团队"
    - "次级客群：心内科、初级保健、骨科和胃肠科的服务线医疗主任与转诊运营经理"
  buyingProcess: >-
    通常由 CMIO 或门诊运营副总裁担任内部推动者，再由各服务线医疗主任和转诊经理确认工作流是否贴合。交易最好在一次环境式
    AI 扩张复盘、或一轮下班后补工抱怨变得显性之后打开，然后进入信息化、安全、合规和本地治理审批，因为这个工作包会写入临床队列和运营队列。
product:
  mvp: >-
    MVP 范围先锁一个主导 EHR 和两条门诊服务线，从初级保健和心内科起步。产品要把低风险的转诊、患者指导、病历调取请求、工作人员后续任务和医嘱建议草稿，装进一条可审计的收尾流程里；医生仍是最终签署人，获批工作写回现有协调员工作清单，而不是去替换病历记录厂商或
    EHR。
  sixMonth: >-
    上线一个付费共创客户版本，覆盖单一 EHR 下的初级保健与心内科就诊收尾工作包，按动作类型抓取无修改通过率，并把获批任务路由到一个集中的转诊团队。
  twelveMonth: >-
    把 2-3 个试点转成正式商用合同，为首个环境式 AI 厂商加 EHR
    组合沉淀出模板化集成，并至少证明一项结果改善：医生复核时间、澄清回路或转诊闭环率。
  twentyFourMonth: >-
    只有在以单个 EHR 为先的工作包模型已经可复用、且基准数据本身能作为付费扩展出售之后，才扩到更多门诊服务线，以及事前授权起单、术前准备等相邻模块。
  keyBets:
    - "初级保健和心内科能产出足够多、足够可复用的就诊后动作，足以模板化首个工作包模型。"
    - "低风险工作包要素能足够快跨过有意义的无修改通过率门槛，从而真正压低复核负担。"
    - "目标系统会买一个厂商中立的工作包层，而不是等 Epic 或其环境式 AI 厂商把路线图做完。"
    - "前 2-3 家医疗系统部署之后，实施打法能把服务投入显著压下来。"
gtm:
  wedge: >-
    向正在扩张环境式 AI 项目的、由 CMIO
    牵头的门诊运营团队卖一个付费共创客户试点，先从初级保健、心内科门诊和一个集中的转诊团队切入，再去要企业级铺开。
  channels:
    - "由创始人主导销售，直接触达 CMIO、首席医疗官、门诊运营副总裁和转诊运营经理"
    - "在现有环境式 AI 项目里做扩张销售，因为病历 ROI 缺口已经在管理层复盘里摆上台面"
    - "首个标杆部署跑通后，再选择性与环境式 AI 病历记录厂商或临床信息化实施公司联合销售"
  funnelTargets: "目标客户→工作流评估 25-35%，评估→付费试点 25-35%，试点→正式商用服务线合同 50%+，首条正式商用服务线→第二条服务线或站点扩张 60%+，并在 12 个月内完成。"
  pricing: >-
    先收一个 90-120 天、单服务线的试点费和实施费，再转成年订阅，按每
    1,000 个已完成的就诊收尾工作包计费；新增服务线另收实施费。逻辑很简单：买方买的是就诊闭环和下游返工减少，不是又一个医生席位。
businessModel:
  revenueStreams:
    - "按每 1,000 个已完成的就诊收尾工作包计价的年订阅"
    - "按服务线或重大工作流模板收取的实施费"
    - "围绕无修改通过率、复核时间和下游完成指标的基准分析增值包"
  unitOfValue: "由医生签署完成的就诊收尾工作包"
  targetGrossMarginPct: 70
  expansionLevers:
    - "在同一医疗系统内，从一条服务线扩到多条门诊专科"
    - "给 CMIO 和运营管理层追加工作流基准分析与无修改通过率遥测报告"
    - "工作包采用稳定后，再上线事前授权起单、术前准备等相邻就诊流程模块"
strategyMap:
  northStarMetric: "符合条件的门诊就诊里，有多少通过工作包完成收尾，同时低风险要素无需医生修改、下游也不再回头找医生澄清。"
  inputMetrics:
    - "带有环境式 AI 扩张信号或医生下班后补工触发点的合格目标系统数"
    - "按服务线统计的每个工作包医生复核秒数中位数"
    - "按动作类型统计的无修改通过率"
    - "获批任务在下游完成且无需回头向医生澄清的比例"
    - "新诊所或新服务线上线所需的实施工时"
    - "试点转正式商用的转化率"
  moatsToBuild:
    - "按专科、医生类型和动作类别沉淀的无修改通过率数据集"
    - "连接环境式 AI 输出、EHR 队列和协调员工作清单的跨厂商映射库"
    - "把工作包质量与复核时间、转诊闭环和后续完成度关联起来的基准数据集"
  killCriteria:
    - "首批 1,000 个试点工作包跑完后，低风险工作包要素里无修改通过的比例仍低于 60%。"
    - "前 2 个付费试点没能至少把就诊收尾复核时间中位数压低 50%，或把下游澄清回路压低 30%。"
    - "第二家医疗系统上线后，每增加一条服务线的实施仍需要超过 8 周的定制化工作流映射。"
  mermaid: |
    flowchart LR
      Wedge[Visit-close packet wedge] --> MVP[Low-risk packet MVP]
      MVP --> Proof[Lower review time and fewer clarification loops]
      Proof --> Expansion[More service lines and benchmark moat]
investorMemo:
  verdict:
    call: 观察
    conviction: "买方痛点真实，切口也讲得通，但还需要真实上线证明：医生复核负担下降得比实施复杂度上升更快。"
    whyBelieve: "环境式 AI 上线潮把“病历负担降了，但收尾 ROI 还没补上”的缺口暴露得很清楚，而现有公开资料里，没有哪家把“厂商中立的就诊收尾工作包 + 跨队列无修改通过率遥测”作为主打定位。"
    whyDoubt: "Epic 和环境式 AI 现有厂商已经伸进同一段工作流；如果客户更愿意等捆绑路线图，或工作包修改率始终偏高，独立产品就可能输。"
    nextDiligence: "先在单一 EHR 的初级保健和心内科拿下一个付费试点，再在 90 天内核验无修改通过率、复核时间和下游闭环改善。"
  firstCustomer:
    title: "由 CMIO 牵头的门诊运营团队，所在机构为美国 5-15 家医院的区域型医疗系统"
    profile: "该系统拥有 200+ 名雇佣制医生、一个主导 EHR，环境式 AI 已在初级保健和心内科上线，并设有一个仍靠人工收尾就诊工作的集中式转诊管理团队。"
    trigger: "环境式 AI 上线没有把下班后工作和转诊积压打掉，因此管理层想拿到下一波 ROI，又不想直接放开自动医嘱权限。"
    buyer: "CMIO 或门诊运营副总裁"
    initialContract: "$75k-$150k 的单服务线、单转诊团队付费试点；随着更多服务线上线，再转成每年约 $300k-$700k 的工作包量付费，加上实施费。"
  mustBeTrue:
    - "至少有 3 家、且位于前 10 个合格医疗系统名单里的客户，愿意直接出钱做付费试点，而不是等 Epic 或现有环境式 AI 厂商的路线图。"
    - "初级保健和心内科的低风险工作包要素，无修改通过率能做到至少 60%，并在 60 天内达成。"
    - "在医生仍为最终签署人的前提下，每次符合条件就诊的医生复核时间中位数能压到 90 秒以下。"
    - "获批工作包能显著减少下游澄清回路或转诊闭环延迟，让门诊运营能算出足以立预算的 ROI。"
    - "前 2 次部署之后，实施足够模板化，规模化时目标毛利率仍能守在 70% 以上。"
  diligenceQuestions:
    - "在一家初级保健门诊和一家心内科门诊里，哪些工作包要素——转诊、医嘱建议、患者指导、病历调取请求，还是工作人员任务——复核通过得最快？"
    - "当环境式 AI 厂商扩张方案和第三方工作包层同时可选时，目标买方更常偏向哪一种？"
    - "什么基线指标最能推动预算负责人拍板：下班后 EHR 时间、转诊闭环率、澄清回路，还是协调员生产率？"
    - "哪些 EHR 与环境式 AI 组合占据滩头市场，这些组合之间的实施模板到底有多可复用？"
    - "在批准打包化的医嘱和转诊草稿之前，CMIO、合规和法务委员会各自要看哪些治理材料？"
operatingAssumptions:
  - assumption: "在系统为这个品类单独立预算之前，环境式 AI 扩张预算就足以为就诊收尾自动化买单。"
    basis: research.yaml
    validationTest: "做 12 场预算负责人访谈，外加 3 份付费试点方案，然后确认至少有 2 个试点能从现有的环境式 AI、数字医疗或门诊运营预算中拿到资金。"
    decisionImpact: "如果不成立，就把产品重定位成 EHR 优化方案或 OEM 路线，并接受更慢的直销爬坡。"
  - assumption: "在一个主导 EHR 上，初级保健和心内科有足够多可复用的就诊后动作，足以模板化首个工作包模型。"
    basis: idea.yaml
    validationTest: "在首个共创客户处完成至少 200 次就诊的工作流映射，并确认至少 70% 的工作包要素能套进可复用模板。"
    decisionImpact: "如果不成立，就把滩头市场收窄到一条服务线，或把切口缩成单一下游工作流，比如只做转诊。"
  - assumption: "低风险工作包要素能足够快跨过有意义的无修改通过率门槛，从而压低医生复核时间。"
    basis: idea.yaml
    validationTest: "衡量前 1,000 个试点工作包，确认低风险要素的无修改通过率至少 60%，同时复核时间中位数较基线至少下降 50%。"
    decisionImpact: "如果不成立，产品就会沦为又一个复核队列，公司要么继续收窄范围，要么放弃“省时间”这条价值主张。"
  - assumption: "靠可复用映射和实施手册，EHR 与环境式 AI 的集成工作在前两次部署后就能显著下降。"
    basis: 运营判断
    validationTest: "比较首次和第三次正式上线的实施工时与缺陷率；目标是每新增一条服务线，实施工时至少降低 40%。"
    decisionImpact: "如果不成立，服务强度就会长期偏高，只能接受更高定价、更低毛利预期，或改走伙伴优先的分销策略。"
  - assumption: "即便 Epic 和环境式 AI 厂商已经能起草相邻动作，只要下游闭环指标更好，买方仍会接受一个厂商中立的工作包层。"
    basis: research.yaml
    validationTest: "在 3 个目标客户里跑并排工作流演示，并在现有厂商路线图确实是备选项的情况下，至少拿下 2 个付费试点。"
    decisionImpact: "如果不成立，独立产品定位就会变弱，更可能走向 OEM、渠道或被收购，而不是独立平台规模化。"
experimentRoadmap:
  - horizon: 0–90 天
    experiment: "访谈 12-15 位已部署环境式 AI 的美国区域型医疗系统 CMIO、门诊运营负责人和转诊负责人。"
    hypothesis: "最强的预算触发点不是从零启动的 AI 项目，而是现有环境式 AI 扩张里迟迟没解决的下班后就诊收尾工作。"
    successMetric: "至少 8 场访谈揭示出当前采购触发点，且有 3 个账户同意进入工作流映射环节。"
    owner: 创始人/CEO
  - horizon: 0–90 天
    experiment: "在一家共创客户处，用历史的初级保健和心内科就诊记录手工拼出工作包。"
    hypothesis: "在全自动化和集成还没完工前，一个足够窄的工作包模型也能覆盖大多数低风险就诊收尾工作。"
    successMetric: "至少 70% 的样本就诊能产出可复核的工作包，且医生认为至少 60% 的低风险要素已经接近可签署状态。"
    owner: 临床信息化负责人
  - horizon: 0–90 天
    experiment: "拿着试点定价、实施范围和明确成功指标，测试 3 份付费试点方案。"
    hypothesis: "如果定价只绑定一条服务线和明确 ROI 指标，预算负责人愿意为一个边界清楚的试点买单。"
    successMetric: "至少 2 份方案推进到采购环节或付费共创客户审批。"
    owner: 创始人/CEO
  - horizon: 90–180 天
    experiment: "上线一个正式试点，把获批工作包路由到现有的集中式转诊团队。"
    hypothesis: "在真实生产工作流里，单工作包复核能同时压低医生复核时间和下游澄清回路。"
    successMetric: "在符合条件的工作包上，复核时间中位数至少下降 50%，澄清回路至少减少 30%。"
    owner: 解决方案架构师
  - horizon: 90–180 天
    experiment: "把首个环境式 AI 厂商加 EHR 集成打包成可复用部署模板。"
    hypothesis: "首个实施项目可以从按客户定制的服务，收敛成可复用、可产品化的映射。"
    successMetric: "同一技术栈上的第二家诊所在上线时，实施工作量至少比第一家少 30%。"
    owner: 创始工程师
  - horizon: 6–12 个月
    experiment: "把首个客户从一条服务线扩到同一 EHR 下的第二条门诊服务线。"
    hypothesis: "在同一个医疗系统里，工作包信任和实施资产的迁移速度，会快过拿下一个全新的账户。"
    successMetric: "第二条服务线在不到 6 周内上线，且低风险要素的无修改通过率不降反升。"
    owner: 实施负责人
  - horizon: 12–18 个月
    experiment: "与一家环境式 AI 厂商或临床信息化实施伙伴试跑一套联合销售动作。"
    hypothesis: "有了标杆部署后，沿着相邻工作流伙伴分发会变得可行，而且不用靠重折扣换量。"
    successMetric: "至少有 2 个合格机会由一个可复用伙伴带来或加速。"
    owner: 创始人/CEO
operations:
  - "为每条已上线服务线维护工作包分类、审批逻辑和各专科的无修改通过阈值。"
  - "上线前跑完实施手册：把环境式 AI 输出、EHR 回写点、协调员工作清单和本地执业范围规则全都映射清楚。"
  - "把无修改通过率、医生复核时间、澄清回路、转诊闭环率和下班后使用情况放进同一个共享客户看板。"
  - "为每个工作包及其下游动作保留审计轨迹、ONC 式透明度材料和 HIPAA 级访问控制。"
  - "每月和 CMIO 及门诊运营赞助人做一次工作流基准复盘，用量化 ROI 推动扩张决策。"
team:
  - role: 创始人/CEO
    startTiming: 第 0 个月
    rationale: "负责创始人主导销售、共创客户招募和 ROI 叙事，因为首批交易靠的是高层信任和精准的工作流定界。"
  - role: 创始工程师
    startTiming: 第 0 个月
    rationale: "搭建工作包编译器、遥测层，以及首批可复用的环境式 AI 到 EHR 映射。"
  - role: 临床信息化与产品负责人
    startTiming: 第 0 个月
    rationale: "把执业范围规则、服务线工作流和医生复核阈值翻成一个足够安全的首版产品。"
  - role: 兼职安全与合规负责人
    startTiming: 第 2 个月
    rationale: "提前准备 HIPAA、治理和透明度材料，避免首个正式客户在采购环节被拖慢。"
  - role: 解决方案架构师
    startTiming: 第 3 个月
    rationale: "负责部署打包、队列映射，并把按客户定制的工作流工作压缩成可复用模板。"
  - role: 实施负责人
    startTiming: 第 6 个月
    rationale: "推动医生上手、协调员采用，以及从试点扩到更多诊所或服务线。"
milestones:
  - horizon: 0–12 个月
    items:
      - "签下 2-3 个滩头市场里的付费共创客户。"
      - "交付一个主导 EHR 加一个环境式 AI 厂商的集成模板，支持初级保健和心内科工作包。"
      - "在首个正式试点里，把低风险工作包要素的无修改通过率做到至少 60%，并把复核时间中位数至少砍掉 50%。"
      - "在澄清回路、转诊闭环率或下班后 EHR 工作量上，至少证明一项可量化改善。"
  - horizon: 12–24 个月
    items:
      - "至少把 2 个试点转成覆盖多家诊所或多条服务线的正式商用合同。"
      - "每增加一条服务线的实施时间，相比首个部署至少下降 40%。"
      - "把基准报告和无修改通过率遥测卖成一个付费扩展模块。"
      - "在工作包通过率稳定后，加上一条相邻门诊工作流，例如事前授权起单或术前准备。"
  - horizon: 24–36 个月
    items:
      - "做到 5-7 家正式上线的医疗系统客户，覆盖 2 套可复用的 EHR 与环境式 AI 组合。"
      - "在不显著抬高服务占比的前提下，从初级保健和心内科扩到至少 2 个额外门诊专科。"
      - "证明经常性软件收入明显高于实施收入。"
risks:
  - risk: "医生修改负担如果一直太高，工作包就会像又多了一个收件箱，而不是省下时间。"
    likelihood: High
    impact: High
    mitigation: "先从低风险工作包要素起步，按动作类型测无修改通过率，在门槛达标前不降低复核深度。"
  - risk: "工作流和队列差异如果太大，部署就会长期定制化、长期重服务。"
    likelihood: High
    impact: High
    mitigation: "第一年只做一个主导 EHR 和两条服务线，激进产品化映射，并把实施与经常性软件分开定价。"
  - risk: "Epic 或环境式 AI 现有厂商如果把足够多的跨队列功能打包进去，独立部署就会被卡住。"
    likelihood: Medium
    impact: High
    mitigation: "在现有厂商路线图追平之前，先靠厂商中立的放行层、下游完成指标和基准数据拉开差异，并尽快拿下标杆账户。"
  - risk: "安全、治理和监管审查把采购周期拉得太长，超出种子前阶段能承受的销售经济模型。"
    likelihood: Medium
    impact: High
    mitigation: "继续让医生做最终签署人，预先备好审计和透明度材料，并把试点范围收得足够紧，好更快过合规审查。"
  - risk: "预算负责人也认同痛点真实，但支出仍被拖回现有的环境式 AI 或 EHR 合同。"
    likelihood: Medium
    impact: High
    mitigation: "用明确的 ROI 指标开场，把试点定价成当前工作流项目的扩展；如果直销预算卡住，就转向 OEM 或渠道路径。"
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$3–5M"
  runwayMonths: 18
  useOfFundsSummary: "十八个月现金跑道能换来 2-3 个付费共创客户、一款以 EHR 为先的工作包产品（含审计和遥测底座）、首套安全与治理包装，以及一支小型临床信息化与实施团队，用来把重服务部署拧成可复用软件。"
