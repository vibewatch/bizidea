  searchedQueries:
  - "查找最新证据，验证临床医生下班后处理 EHR、收件箱负担、转诊或医嘱跟进，以及倦怠问题，是否仍然尖锐，而且美国医疗系统已经在为此编预算。"
  - "估算滩头市场：对象是已经部署环境式 AI 病历记录、雇佣门诊医生的美国多院区医疗系统，可触达市场有多大。"
  - "查找临床医生监督下 AI 工作流的直接竞争对手和替代方案；这些产品不只做环境式 AI 代写，还延伸到医嘱、转诊、收件箱工作或就诊后跟进。"
  - "查找美国在监管、合规、采购和落地层面的阻力：针对那些在临床医生审核下起草或触发临床医嘱、转诊、患者说明或跟进任务的 AI 系统。"
  - "查找技术可行性证据：AI 智能体能否在门诊病历完成后接入临床工作流，包括 EHR 集成、医嘱草稿能力和结构化数据提取。"
  - "查找近期融资和产品动态，验证医疗系统和投资人是否正从环境式 AI 病历记录产品，转向更广义的临床智能体或临床工作日自动化。"
  - "查找公开的医疗系统岗位描述或运营模型，证明转诊协调员或门诊运营人员确实在处理转诊、排期、跟进，以及和软件工作流绑定的任务。"
  - "查找可公开获取的一手或行业协会来源，拿到美国医疗系统、医院、执业医生数量，以及医生受雇情况，用于自下而上的市场测算。"
  - "查找 Heidi、Abridge、Suki、Nabla、Epic 和 Microsoft 临床工作流 AI 产品的公开产品页或定价页原文。"
  - "查找 ONC HTI-1 预测型决策支持透明度、FDA 临床决策支持指南，以及 HIPAA Security Rule 网络安全 NPRM 的官方原文页面。"
