  searchedQueries:
    - "Find current evidence that clinician after-hours EHR work, inbox burden, referral or order follow-up, and burnout remain acute and budgeted by U.S. health systems."
    - "Estimate the reachable beachhead market for U.S. multi-hospital health systems with employed ambulatory physicians already deploying ambient AI documentation."
    - "Find direct competitors and substitutes for clinician-supervised AI workflows that go beyond ambient scribing into orders, referrals, inbox work, or visit follow-up."
    - "Find U.S. regulatory, compliance, procurement, and adoption blockers for AI systems that draft or trigger clinical orders, referrals, patient instructions, or follow-up tasks under clinician review."
    - "Find technical-feasibility evidence for integrating AI agents into ambulatory clinical workflows after note completion, including EHR integration, draft-order capability, and structured data retrieval."
    - "Find recent funding and product-news evidence that health systems and investors are moving from ambient note products toward broader clinical agents or clinical-workday automation."
    - "Find public health system job or operating-model evidence showing referral coordinators or ambulatory operations staff handle referrals, scheduling, follow-up, and software-linked workflow tasks."
    - "Find accessible primary or association sources for counts of U.S. health systems, hospitals, active physicians, and physician employment useful for bottom-up market sizing."
    - "Find exact public product or pricing pages for Heidi, Abridge, Suki, Nabla, Epic, and Microsoft clinical workflow AI products."
    - "Find exact official pages for ONC HTI-1 predictive decision support transparency, FDA clinical decision support guidance, and the HIPAA Security Rule cybersecurity NPRM."
