categoryDynamics:
  growthRate: >-
    No clean public CAGR was retained, but vendor ARR, deployment, and usage
    signals imply category growth materially above standard health-IT norms.
  growthRateSourceRefs:
    - 5
    - 7
    - 10
  tailwinds:
    - point: Enterprise ambient-AI rollouts are scaling across major health systems and moving into adjacent workflows.
      sourceRefs:
        - 5
        - 6
        - 7
    - point: EHR-native AI already drafts orders, diagnoses, instructions, follow-ups, and referral context, reducing technical risk.
      sourceRefs:
        - 9
        - 10
    - point: Health-system employment and consolidation concentrate buyers who can standardize a workflow layer across many clinics.
      sourceRefs:
        - 16
        - 20
  headwinds:
