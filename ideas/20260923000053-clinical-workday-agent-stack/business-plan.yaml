slug: visit-close-work-packets
date: '2026-09-23'
executiveSummary: >-
  Visit Close Packets should start as a U.S.-only workflow layer for 5-15
  hospital regional health systems that already deployed ambient AI but still
  force clinicians to finish referrals, orders, patient instructions, and
  follow-up tasks across separate queues after the note is drafted. The acute
  pain is that ambient documentation reduced note burden without eliminating
  after-hours visit-close work, leaving CMIOs and ambulatory operations leaders
  with a visible ROI gap and ongoing clinician burnout. The MVP should compile
  low-risk post-visit work into one clinician sign-off packet, route approved
  tasks to existing coordinator worklists, and record acceptance-without-edit
  by specialty and action type before expanding autonomy. This beachhead is
  narrower and faster to prove than a broad clinical-agent suite because the
  first proof must show lower clinician review time and fewer downstream
  clarification loops in one dominant EHR and two repeatable service lines, not
  generic AI breadth. Research supports an estimated "$515.0M" TAM, "$126.0M"
  beachhead SAM, and "$11.9M" initial SOM, but those figures rely on price
  anchors and employed-physician assumptions rather than disclosed category
  spend. The company can win if it becomes the vendor-neutral release object
  between ambient note vendors, the EHR, and referral operations before
  incumbents bundle equivalent cross-queue sign-off. The biggest disconfirming
  risks are that clinician edit rates stay too high for the packet to save time
  and that implementation remains so services-heavy that gross margins never
  normalize. Because the inputs do not disclose real customer budgets, the
  first 12 months must prove paid pilot demand, repeatable implementation
  templates, and acceptance-without-edit thresholds on low-risk packet
  elements.
problem:
  - "Clinicians still close referrals, orders, patient instructions, and staff follow-up across separate EHR queues after ambient notes are drafted, which keeps after-hours work and fragmented review alive."
  - "Referral and scheduling teams inherit partial drafts and missing context, so they reopen work, chase clarifications, and make ambient-AI ROI harder for ambulatory leaders to prove."
solution:
  - "Compile each encounter's draft referrals, order suggestions, patient instructions, records requests, and follow-up tasks into one evidence-backed packet with risk tiers and explicit downstream owners."
  - "Keep clinicians as final signers, route approved work into existing coordinator queues immediately, and learn which packet elements can move from full review to lighter sign-off as local acceptance-without-edit rates rise."
whyWeWin:
  - "The wedge is narrower than a generic clinical agent pitch: one visit-close release object that sits between the drafted note and operational execution across multiple queues."
  - "Acceptance-without-edit telemetry by specialty, clinician, and action type can become a compounding moat that note generators and single-queue tools do not naturally own."
  - "Incumbents already draft pieces of the workflow, but public positioning still centers on notes, orders, or messages rather than vendor-neutral packet release plus downstream completion benchmarks."
strategicChoices:
  beachhead: >-
    U.S. regional health systems with 5-15 hospitals, 200+ employed
    physicians, one dominant EHR, ambient AI already live in primary care and
    cardiology, and a centralized referral or inbox support team.
  wedgeRationale: >-
    This slice creates faster proof than a broad clinical-agent platform
    because the buying trigger already exists inside ambient-AI expansion
    programs, the same clinician owns both note sign-off and downstream work,
    and centralized support teams create measurable rework, close-loop, and
    turnaround metrics.
  sequencingRationale: >-
    Start with one EHR, two service lines, and low-risk packet elements so the
    company can solve workflow mapping, governance, and clinician-trust
    problems once before chasing breadth. Only after the product proves lower
    review time, acceptable edit rates, and reusable implementation templates
    should it add higher-risk order flows, more service lines, partner-led
    distribution, or non-U.S. deployments; this preserves the deliberate
    tradeoff that early launches will be U.S.-centric and services-heavy before
    repeatable software margins appear.
  notYet:
    - "Non-U.S. health systems, including UK and EU launches with different regulatory and EHR assumptions"
    - "Inpatient consult, prior-authorization, and procedure-prep workflows"
    - "Full autonomous release of orders or referrals without clinician sign-off"
    - "Rip-and-replace ambient documentation or EHR products"
market:
  tam: "$515.0M estimated TAM based on employed U.S. direct-patient-care physicians, assumed ambulatory eligibility, and Heidi's public clinician-seat price anchor."
  sam: "$126.0M estimated beachhead SAM based on roughly 100 large ambient-ready U.S. multi-hospital systems with about 700 target ambulatory clinicians each."
  som: "$11.9M modeled early SOM based on 12 landed systems averaging about 550 clinicians under packet coverage."
  segments:
    - "Primary: U.S. regional and multi-hospital health systems with employed ambulatory groups, ambient AI live, and centralized referral or inbox teams"
    - "Secondary: service-line medical directors and referral-operations managers in cardiology, primary care, orthopedics, and gastroenterology"
  buyingProcess: >-
    The operational champion is usually the CMIO or VP of ambulatory
    operations, with service-line medical directors and referral managers
    validating workflow fit. Deals should open right after an ambient-AI
    expansion review or a visible after-hours-work complaint cycle, then pass
    through informatics, security, compliance, and local governance review
    because the packet writes into clinical and operational queues.
product:
  mvp: >-
    MVP scope is one dominant EHR and two ambulatory service lines, starting
    with primary care and cardiology. The product should package low-risk
    referrals, patient instructions, records requests, staff follow-up tasks,
    and draft order suggestions into one audited closeout flow while keeping
    clinicians as final signers and routing approved work into existing
    coordinator worklists rather than replacing the note vendor or the EHR.
  sixMonth: >-
    Launch one paid design-partner release on a single EHR, support primary
    care and cardiology visit-close packets, capture acceptance-without-edit by
    action type, and route approved tasks to one centralized referral team.
  twelveMonth: >-
    Convert 2-3 pilots into production contracts, templatize integrations for
    the first ambient-vendor and EHR combination, and prove at least one
    outcome improvement in clinician review time, clarification loops, or
    referral close rate.
  twentyFourMonth: >-
    Expand to additional ambulatory service lines and adjacent modules such as
    prior-auth starters or procedure prep only after one EHR-first packet model
    is repeatable and benchmark data becomes a paid expansion.
  keyBets:
    - "Primary care and cardiology generate enough repeatable post-visit actions to templatize the first packet model."
    - "Low-risk packet elements can reach meaningful acceptance-without-edit thresholds quickly enough to reduce review burden."
    - "Target systems will buy a vendor-neutral packet layer instead of waiting for Epic or their ambient vendor roadmap."
    - "Implementation playbooks can collapse services effort materially after the first 2-3 health-system deployments."
gtm:
  wedge: >-
    Sell a paid design-partner pilot to a CMIO-led ambulatory-operations team
    that is expanding an ambient-AI program, starting with primary care and
    cardiology clinics plus one centralized referral team before asking for an
    enterprise rollout.
  channels:
    - "Founder-led direct sales to CMIOs, chief medical officers, VP ambulatory operations leaders, and referral-operations managers"
    - "Expansion sales inside existing ambient-AI programs where note ROI gaps are already under executive review"
    - "Selective co-sell with ambient documentation vendors or clinical-informatics implementation firms after the first reference deployment"
  funnelTargets: "Target account→workflow assessment 25-35%, assessment→paid pilot 25-35%, pilot→production service-line contract 50%+, first production service line→second service line or site expansion 60%+ within 12 months."
  pricing: >-
    Charge a 90-120 day pilot plus implementation fee for one service line,
    then convert to an annual subscription priced per 1,000 completed
    visit-close packets with extra implementation fees for new service lines;
    the rationale is that buyers are paying for closed visits and reduced
    downstream rework, not for another clinician seat.
businessModel:
  revenueStreams:
    - "Annual subscription priced per 1,000 completed visit-close packets"
    - "Implementation fees per service line or major workflow template"
    - "Benchmark analytics add-on for acceptance-without-edit, review-time, and downstream completion metrics"
  unitOfValue: "Completed visit-close packet under clinician sign-off"
  targetGrossMarginPct: 70
  expansionLevers:
    - "Expand from one service line to multiple ambulatory specialties inside the same health system"
    - "Add workflow benchmarks and acceptance telemetry reports for CMIO and operations leadership"
    - "Launch adjacent visit-adjacent modules such as prior-auth starters or procedure prep after packet adoption stabilizes"
strategyMap:
  northStarMetric: "Percentage of eligible ambulatory visits closed through a packet with no clinician edits on low-risk elements and no downstream clarification loop"
  inputMetrics:
    - "Qualified target systems with an ambient-AI expansion or clinician after-hours-work trigger"
    - "Median clinician review seconds per packet by service line"
    - "Acceptance-without-edit rate by action type"
    - "Percentage of approved tasks completed downstream without clarification back to the clinician"
    - "Implementation hours required to stand up a new clinic or service line"
    - "Pilot-to-production conversion rate"
  moatsToBuild:
    - "Acceptance-without-edit dataset by specialty, clinician type, and action category"
    - "Cross-vendor mapping library between ambient outputs, EHR queues, and coordinator worklists"
    - "Benchmark dataset linking packet quality to review time, referral closure, and follow-up completion"
  killCriteria:
    - "After the first 1,000 pilot packets, fewer than 60% of low-risk packet elements are accepted without clinician edits."
    - "The first 2 paid pilots fail to cut either median visit-close review time by at least 50% or downstream clarification loops by at least 30%."
    - "Implementation still requires more than 8 weeks of custom workflow mapping per service line after the second live health-system deployment."
  mermaid: |
    flowchart LR
      Wedge[Visit-close packet wedge] --> MVP[Low-risk packet MVP]
      MVP --> Proof[Lower review time and fewer clarification loops]
      Proof --> Expansion[More service lines and benchmark moat]
investorMemo:
  verdict:
    call: Watch
    conviction: "Real buyer pain and a coherent wedge, but the concept still needs live proof that clinician review burden falls faster than implementation complexity rises."
    whyBelieve: "Ambient-AI rollouts created a visible post-note ROI gap, and no retained source publicly leads with a vendor-neutral visit-close packet plus cross-queue acceptance telemetry."
    whyDoubt: "Epic and ambient incumbents already touch the same workflow surfaces, so a standalone product can lose if customers prefer bundled roadmaps or if packet edits stay high."
    nextDiligence: "Secure one paid pilot on a single EHR in primary care and cardiology, then verify acceptance-without-edit, review-time, and downstream close-loop gains within 90 days."
  firstCustomer:
    title: "CMIO-led ambulatory operations team at a 5-15 hospital U.S. regional health system"
    profile: "A system with 200+ employed physicians, one dominant EHR, ambient AI already live in primary care and cardiology, and a centralized referral-management team that still closes visit work manually."
    trigger: "Ambient rollout failed to remove after-hours work and referral backlog, so leadership wants the next ROI wave without granting autonomous order authority."
    buyer: "CMIO or VP of ambulatory operations"
    initialContract: "$75k-$150k paid pilot for one service line and one referral team, converting to roughly $300k-$700k annual packet-volume spend plus implementation fees as additional service lines go live."
  mustBeTrue:
    - "At least 3 of the first 10 qualified health systems will fund a paid pilot instead of waiting for Epic or their ambient vendor roadmap."
    - "Low-risk packet elements in primary care and cardiology can reach at least 60% acceptance without edit within 60 days."
    - "Median clinician review time per eligible visit can fall below 90 seconds while clinicians remain the final signers."
    - "Approved packets reduce downstream clarification loops or referral close delays enough to create budgeted ROI for ambulatory operations."
    - "After the first 2 deployments, implementation can be templatized enough to preserve target gross margin above 70% at scale."
  diligenceQuestions:
    - "Which packet elements—referrals, order suggestions, patient instructions, records requests, or staff tasks—clear review fastest in one primary care and one cardiology clinic?"
    - "How often do target buyers prefer an ambient-vendor expansion versus a third-party packet layer when both options are available?"
    - "What baseline metric moves the budget owner fastest: after-hours EHR time, referral close rate, clarification loops, or coordinator productivity?"
    - "Which EHR and ambient combinations dominate the beachhead, and how reusable are implementation templates across them?"
    - "What governance artifacts do CMIO, compliance, and legal committees require before approving packetized order and referral drafts?"
operatingAssumptions:
  - assumption: "Ambient-AI expansion budgets can fund visit-close automation before systems create a standalone line item for the category."
    basis: research.yaml
    validationTest: "Run 12 budget-owner interviews and 3 paid pilot proposals, then confirm at least 2 pilots are funded from an existing ambient-AI, digital-health, or ambulatory-operations budget."
    decisionImpact: "If false, reposition the product as an EHR-optimization or OEM motion and expect a slower direct-sales ramp."
  - assumption: "Primary care and cardiology on one dominant EHR contain enough repeatable post-visit actions to templatize the first packet model."
    basis: idea.yaml
    validationTest: "Workflow-map at least 200 encounters across the first design partner and confirm that at least 70% of packet elements fit reusable templates."
    decisionImpact: "If false, narrow the beachhead to one service line or reduce the wedge to a single downstream workflow such as referrals only."
  - assumption: "Low-risk packet elements can cross meaningful acceptance-without-edit thresholds quickly enough to reduce clinician review time."
    basis: idea.yaml
    validationTest: "Measure the first 1,000 pilot packets and confirm at least 60% no-edit acceptance on low-risk elements plus at least 50% lower median review time versus baseline."
    decisionImpact: "If false, the product becomes another review queue and the company must either narrow scope further or abandon the time-savings claim."
  - assumption: "EHR and ambient integration work can fall materially after the first two deployments through reusable mappings and implementation playbooks."
    basis: operator judgment
    validationTest: "Compare implementation hours and defect rates between the first and third live deployment; target at least 40% lower implementation hours per added service line."
    decisionImpact: "If false, services intensity stays too high, forcing higher pricing, lower margin expectations, or a partnership-first distribution strategy."
  - assumption: "Buyers will accept a vendor-neutral packet layer if it improves downstream closure metrics even when Epic and ambient vendors already draft adjacent actions."
    basis: research.yaml
    validationTest: "Run side-by-side workflow demos in 3 target accounts and close at least 2 paid pilots where the incumbent roadmap was a real alternative."
    decisionImpact: "If false, standalone positioning weakens and the likely path shifts toward OEM, channel, or acquisition rather than independent platform scale."
experimentRoadmap:
  - horizon: 0–90 days
    experiment: "Interview 12-15 CMIO, ambulatory-operations, and referral leaders in regional U.S. systems that already deployed ambient AI."
    hypothesis: "The fastest budget trigger is unresolved after-hours visit-close work inside an existing ambient-AI expansion, not a greenfield AI initiative."
    successMetric: "At least 8 interviews surface a current buying trigger and 3 accounts agree to a workflow-mapping session."
    owner: Founder CEO
  - horizon: 0–90 days
    experiment: "Concierge-build packets from historical primary care and cardiology encounters at one design partner."
    hypothesis: "A narrow packet model can cover most low-risk visit-close work before full automation and integrations are finished."
    successMetric: "At least 70% of sampled encounters produce a reviewable packet and clinicians rate at least 60% of low-risk elements as close to sign-off ready."
    owner: Clinical informatics lead
  - horizon: 0–90 days
    experiment: "Test 3 paid pilot proposals with pilot pricing, implementation scope, and named success metrics."
    hypothesis: "Budget owners will pay for a scoped pilot if pricing is tied to one service line and explicit ROI metrics."
    successMetric: "At least 2 proposals progress to procurement or paid design-partner approval."
    owner: Founder CEO
  - horizon: 90–180 days
    experiment: "Launch one live pilot that routes approved packets into an existing centralized referral team."
    hypothesis: "One-packet review will reduce clinician review time and downstream clarification loops in production workflow."
    successMetric: "At least 50% lower median review time and at least 30% fewer clarification loops on eligible packets versus baseline."
    owner: Solutions architect
  - horizon: 90–180 days
    experiment: "Package the first ambient-vendor plus EHR integration into a reusable deployment template."
    hypothesis: "The first implementation can be converted from customer-specific services into repeatable productized mappings."
    successMetric: "A second clinic on the same stack goes live with at least 30% less implementation effort than the first."
    owner: Founding eng
  - horizon: 6–12 months
    experiment: "Expand the first customer from one service line to a second ambulatory service line on the same EHR."
    hypothesis: "Within one health system, packet trust and implementation assets will transfer faster than landing a net-new account."
    successMetric: "Second-service-line launch occurs in less than 6 weeks and preserves or improves no-edit acceptance on low-risk elements."
    owner: Implementation lead
  - horizon: 12–18 months
    experiment: "Pilot one co-sell motion with an ambient vendor or clinical-informatics implementation partner."
    hypothesis: "A reference deployment will make distribution through adjacent workflow partners viable without forcing heavy discounting."
    successMetric: "At least 2 qualified opportunities are sourced or accelerated by one repeatable partner."
    owner: Founder CEO
operations:
  - "Maintain a packet taxonomy, approver logic, and specialty-specific acceptance thresholds for each live service line."
  - "Run implementation playbooks that map ambient output, EHR write-back points, coordinator worklists, and local scope-of-practice rules before launch."
  - "Track acceptance-without-edit, clinician review time, clarification loops, referral close rate, and after-hours usage in one shared customer dashboard."
  - "Preserve audit trails, ONC-style transparency artifacts, and HIPAA-grade access controls for every packet and downstream action."
  - "Hold monthly workflow benchmark reviews with CMIO and ambulatory-operations sponsors to drive expansion decisions by measured ROI."
team:
  - role: Founder CEO
    startTiming: Month 0
    rationale: "Owns founder-led sales, design-partner recruitment, and the ROI narrative because the first deals depend on executive trust and sharp workflow scoping."
  - role: Founding eng
    startTiming: Month 0
    rationale: "Builds the packet compiler, telemetry layer, and first repeatable ambient-to-EHR mappings."
  - role: Clinical informatics and product lead
    startTiming: Month 0
    rationale: "Translates scope-of-practice rules, service-line workflow, and clinician review thresholds into a safe first product."
  - role: Fractional security and compliance lead
    startTiming: Month 2
    rationale: "Prepares HIPAA, governance, and transparency artifacts early enough to avoid procurement drag at the first live customer."
  - role: Solutions architect
    startTiming: Month 3
    rationale: "Owns deployment packaging, queue mapping, and reduction of customer-specific workflow work into reusable templates."
  - role: Implementation lead
    startTiming: Month 6
    rationale: "Drives clinician onboarding, coordinator adoption, and expansion from pilot to additional clinics or service lines."
milestones:
  - horizon: 0–12 months
    items:
      - "Sign 2-3 paid design partners in the beachhead segment."
      - "Ship one dominant-EHR plus one ambient-vendor integration template supporting primary care and cardiology packets."
      - "Achieve at least 60% acceptance-without-edit on low-risk packet elements and cut median review time by at least 50% in the first live pilot."
      - "Show at least one measurable downstream improvement in clarification loops, referral close rate, or after-hours EHR work."
  - horizon: 12–24 months
    items:
      - "Convert at least 2 pilots into production contracts spanning multiple clinics or service lines."
      - "Reduce implementation time per added service line by at least 40% versus the first deployment."
      - "Monetize benchmark reporting and acceptance telemetry as a paid expansion module."
      - "Add one adjacent ambulatory workflow such as prior-auth starters or procedure prep after packet acceptance stabilizes."
  - horizon: 24–36 months
    items:
      - "Reach 5-7 live health-system customers on 2 repeatable EHR and ambient patterns."
      - "Expand beyond primary care and cardiology into at least 2 additional ambulatory specialties without materially increasing services ratio."
      - "Demonstrate that recurring software revenue materially exceeds implementation revenue."
risks:
  - risk: "Clinician edit burden stays high enough that the packet feels like one more inbox instead of time saved."
    likelihood: High
    impact: High
    mitigation: "Start with low-risk packet elements, measure no-edit acceptance by action type, and refuse to lighten review depth until thresholds are met."
  - risk: "Workflow and queue variability keep deployments custom and services-heavy for too long."
    likelihood: High
    impact: High
    mitigation: "Limit the first year to one dominant EHR and two service lines, productize mappings aggressively, and price implementation separately from recurring software."
  - risk: "Epic or ambient incumbents bundle enough cross-queue functionality to block standalone adoption."
    likelihood: Medium
    impact: High
    mitigation: "Differentiate on vendor-neutral release, downstream completion metrics, and benchmark data while closing reference accounts before roadmap parity arrives."
  - risk: "Security, governance, and regulatory review lengthen procurement beyond pre-seed sales economics."
    likelihood: Medium
    impact: High
    mitigation: "Keep clinicians as final signers, pre-build audit and transparency artifacts, and scope pilots tightly enough to clear compliance review faster."
  - risk: "Budget owners agree the pain is real but still defer spend to existing ambient or EHR contracts."
    likelihood: Medium
    impact: High
    mitigation: "Lead with explicit ROI metrics, price pilots as expansions of current workflow programs, and pursue OEM or channel routes if direct budget stalls."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$3–5M"
  runwayMonths: 18
  useOfFundsSummary: "Eighteen months of runway buys 2-3 paid design partners, one EHR-first packet product with audit and telemetry foundations, initial security and governance packaging, and the small clinical-informatics plus implementation team needed to turn services-heavy deployments into repeatable software."
