scenarios:
  downside:
    description: Procurement stretches, pilots convert more slowly, and system-level expansion lands closer to one service line than the base case expects.
    y3RevenueK: 2640.0
    y3EbitdaK: -529.9
    cashLowPointK: 200.3
    keyAssumptionChanges:
      - Q4Y3 reaches 6 paying systems instead of 7 because later cohorts slip by roughly one quarter.
      - Base production ACV lands closer to about $396K and expansion ACV closer to about $540K instead of $420K and $600K.
      - Gross margin exits in the high-60s because reusable mappings and implementation playbooks improve more slowly than planned.
  base:
    description: Founder-led direct sales wins 3 paid design partners in Y1, then multi-clinic and multi-service-line expansions turn the first cohort into a 7-system book by Q4Y3.
    y3RevenueK: 3135.0
    y3EbitdaK: -40.2
    cashLowPointK: 1005.3
    keyAssumptionChanges:
      - Paid logos land in M5, M8, M11, M16, M21, M27, and M33.
      - Production contracts start around $420K ARR and mature accounts expand toward roughly $600K ARR after about 12 months live.
      - Gross margin moves from pilot-like 35% to about 72% in Y3 as the first EHR and ambient templates become reusable.
  upside:
    description: The first reference deployment shortens procurement, an eighth system lands by Q4Y3, and second-service-line expansion arrives earlier.
    y3RevenueK: 3885.0
    y3EbitdaK: 621.5
    cashLowPointK: 1553.7
    keyAssumptionChanges:
      - Q4Y3 reaches 8 paying systems because reference accounts and partner introductions pull launch timing forward.
      - Base production ACV rises toward roughly $456K and expanded ACV toward roughly $660K as additional clinics and reporting modules attach sooner.
      - Gross margin exits around 75% because implementation reuse improves faster than the base case.
sensitivity:
  - variable: ARPU
    downsideCase: "Base production ACV falls toward about $396K and expanded ACV toward about $552K."
    baseCase: "Base production ACV is about $420K and expanded ACV about $600K."
    upsideCase: "Base production ACV reaches about $444K and expanded ACV about $648K."
    y3RevenueImpactK: -210.0
    cashImpactK: -227.0
  - variable: CAC
    downsideCase: "CAC rises toward about $280K if travel, compliance diligence, and high-touch selling stay elevated."
    baseCase: "CAC stays near $246K with founder-led selling and reference reuse doing most of the work."
    upsideCase: "CAC falls toward about $220K once reference logos and partner intros carry more pipeline."
    y3RevenueImpactK: 0.0
    cashImpactK: -274.0
  - variable: churn
    downsideCase: "One early production logo fails to expand and replacement timing slips, effectively reducing steady-state retention."
    baseCase: "The model assumes sticky but concentrated logos and uses 1.5% monthly churn only for unit economics."
    upsideCase: "All early logos expand on schedule and the installed base stays intact through Y3."
    y3RevenueImpactK: -100.0
    cashImpactK: -69.0
  - variable: sales cycle
    downsideCase: "Discovery-to-paid-pilot stretches by about one quarter because compliance and governance review drag out."
    baseCase: "Serious discovery to paid pilot averages about 6 months, then successful pilots convert after roughly 4 more months."
    upsideCase: "Reference architecture and champion buyers compress pilot starts by roughly one quarter."
    y3RevenueImpactK: -255.0
    cashImpactK: -369.0
  - variable: gross margin
    downsideCase: "Implementation stays bespoke, holding pilot and production margin a few points below plan."
    baseCase: "Pilot margin starts at 35% and Y3 blended gross margin reaches about 72%."
    upsideCase: "Reusable mappings move mature-system gross margin into the mid-70s faster than expected."
    y3RevenueImpactK: 0.0
    cashImpactK: -206.0
  - variable: hiring pace
    downsideCase: "One engineer and one delivery hire are pulled forward before demand fully proves out."
    baseCase: "Hiring stays milestone-gated and ends Y3 at 10.5 FTE."
    upsideCase: "The second GTM hire waits for a clearer partner signal without slowing bookings."
    y3RevenueImpactK: 0.0
    cashImpactK: -192.0
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Targets[Qualified target systems] --> Assessments[Workflow assessments]
      Assessments --> Pilots[Paid design-partner pilots]
      Pilots --> Production[Production packet subscriptions]
      Production --> Expansion[More clinics and service lines]
      Expansion --> Revenue[Revenue]
      Revenue --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Cash runway]
modelSanity:
  - checkName: Revenue engine
    finding: Base-case revenue comes from 7 paying health-system logos by Q4Y3, with the first 3 design partners converting into 6 production systems and 4 of those expanding to higher-value multi-service-line contracts.
  - checkName: Must go right
    finding: The first two deployments must push acceptance-without-edit above 60% and cut implementation time materially so gross margin can climb from pilot-like 35% to above 70%.
  - checkName: Model breaks if
    finding: The model is most fragile to sales-cycle delay, because a roughly one-quarter slip cuts about $255K of Y3 revenue and about $369K of ending cash in the sensitivity table.
  - checkName: Next-round proof
    finding: The seed story is 2 production conversions, 60% no-edit acceptance on low-risk elements, 50% lower review time, and visible implementation-hour compression on the first EHR and ambient template.
sanityChecks:
  ruleOf40: Y3 growth 80.2% + EBITDA margin -1.3% = 78.9%
  burnMultiple: Y2 burn multiple is about 0.6x using roughly $0.81M of EBITDA burn against about $1.27M of net new revenue; Y3 is near EBITDA breakeven.
  revenuePerFte: $299K Y3 using 10.5 year-end FTE (benchmark $200-400K vertical SaaS)
  flags:
    - The plan only reaches 7 paying systems by Q4Y3, so one slipped health-system procurement or go-live meaningfully changes annual results.
    - Gross margin clears the long-run 70% target only if implementation time per added service line falls materially after the first two deployments; if services stay bespoke, the downside case compresses cash to about $0.2M.
    - Production ACV assumes partial service-line coverage rather than full-system rollout, so expansion inside each landed system is still required before the research SOM is relevant.
    - The business is still only near EBITDA breakeven in Y3, so the next round depends on proof milestones and not on profitability alone.
    - Cash is modeled as EBITDA and excludes payment timing, deferred revenue, capex, and any follow-on financing.
