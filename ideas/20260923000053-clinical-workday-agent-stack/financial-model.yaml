slug: visit-close-work-packets
date: '2026-09-23'
currency: USD
modelStartMonth: '2026-10'
assumptions:
  - id: A1
    name: Model start month
    value: "2026-10"
    unit: YYYY-MM
    source: "[BP date 2026-09-23] the model starts with the first full operating month after the dated business plan."
  - id: A2
    name: Opening cash / pre-seed raise
    value: "$3.0M"
    unit: USD
    source: "[BP fundingAsk.round pre-seed + BP fundingAsk.targetFundingRangeUsd $3–5M + BP fundingAsk.runwayMonths 18] the base case uses the low end of the BP range because the company is proving one EHR-first wedge before broadening."
  - id: A3
    name: Starting paying health systems
    value: "0"
    unit: count
    source: "[BP milestones 0–12 months] the company begins pre-revenue and must first convert design-partner interest into paid pilots."
  - id: A4
    name: Paid pilot fee
    value: "$120K over about 4 months (~$30K/mo)"
    unit: USD/logo
    source: "[BP investorMemo.firstCustomer.initialContract $75k-$150k paid pilot] the model uses the upper-middle of the pilot range because the first deployment includes scoped implementation and measurement work."
  - id: A5
    name: Base production ACV
    value: "$420K ARR (~$35K/mo)"
    unit: USD/logo/year
    source: "[BP investorMemo.firstCustomer.initialContract $300k-$700k annual spend] the base case uses the lower-middle of the production range for one service line plus core telemetry."
  - id: A6
    name: Expanded production ACV
    value: "$600K ARR (~$50K/mo)"
    unit: USD/logo/year
    source: "[BP businessModel.expansionLevers + BP milestones 24–36 months] expansion assumes additional clinics or service lines plus benchmark reporting, while staying inside the BP annual-spend range."
  - id: A7
    name: Customer stage progression
    value: "4-month paid pilot, then production; expansion after about 12 months live"
    unit: timeline
    source: "[BP gtm.pricing + BP experimentRoadmap + BP milestones] this converts paid design partners into recurring software only after the workflow, governance, and adoption proof exists."
  - id: A8
    name: Logo launch cadence
    value: "M5, M8, M11, M16, M21, M27, M33"
    unit: month index
    source: "[BP milestones 0–12, 12–24, 24–36 + BP gtm.funnelTargets] the base case lands 3 paid logos in Y1, 5 by Q4Y2, and 7 by Q4Y3, matching the BP 5-7 live-system goal."
  - id: A9
    name: Gross margin by deployment stage
    value: "Pilot 35%, early production 68%, expanded production 78%"
    unit: percent of revenue
    source: "[BP businessModel.targetGrossMarginPct 70 + BP operatingAssumptions on reusable mappings] pilots are services-heavy, while repeated EHR and ambient templates let mature accounts exceed the long-run 70% target."
  - id: A10
    name: Hiring timeline
    value: "M1 founder, founding eng, and clinical/product lead; M2 0.3 FTE security/compliance; M3 solutions architect; M6 implementation lead; M9 second eng; M12 first GTM hire; M18 third delivery hire; M20 third eng; M24 compliance rises to 0.5 FTE; M28 second GTM hire"
    unit: timeline
    source: "[BP team + BP sequencingRationale + startup-finance heuristic] hiring stays delivery-first until the first production references exist, then adds measured GTM capacity."
  - id: A11
    name: Founder loaded compensation
    value: "$175K"
    unit: USD/year
    source: "[BP team Founder CEO + startup-finance heuristic] lean founder cash pay plus payroll taxes and benefits."
  - id: A12
    name: Engineering loaded compensation
    value: "$190K"
    unit: USD/year
    source: "[BP team Founding eng + startup-finance heuristic] reflects integration-heavy clinical workflow engineering without assuming later-stage cash comp."
  - id: A13
    name: Clinical informatics / product loaded compensation
    value: "$180K"
    unit: USD/year
    source: "[BP team Clinical informatics and product lead + startup-finance heuristic] reflects senior workflow and safety ownership."
  - id: A14
    name: Security / compliance loaded compensation
    value: "$140K FTE equivalent"
    unit: USD/year
    source: "[BP team Fractional security and compliance lead + startup-finance heuristic] the role begins fractional and scales only as procurement volume rises."
  - id: A15
    name: Solutions / implementation loaded compensation
    value: "$145K"
    unit: USD/year
    source: "[BP team Solutions architect + Implementation lead + startup-finance heuristic] reflects deployment-heavy healthcare workflow talent."
  - id: A16
    name: Sales / GTM loaded compensation
    value: "$175K"
    unit: USD/year
    source: "[BP gtm.channels + startup-finance heuristic] enterprise healthcare selling remains founder-led at first and adds quota capacity only after references emerge."
  - id: A17
    name: Payroll allocation to P&L lines
    value: "Founder 55% S&M / 15% R&D / 30% G&A; engineering 100% R&D; clinical/product 70% R&D / 30% G&A; security 100% G&A; solutions 45% S&M / 35% R&D / 20% G&A; sales 100% S&M"
    unit: allocation
    source: "[BP team role rationales + BP operations] this maps headcount cost into the operating lines while reflecting founder-led selling and workflow-heavy onboarding."
  - id: A18
    name: Non-payroll opex ramp
    value: "Monthly non-payroll spend rises from S&M/R&D/G&A of $8K/$10K/$12K in early Y1 to about $16K/$14K/$16K by Q4Y3"
    unit: USD/month
    source: "[BP operations + startup-finance heuristic] covers cloud tooling, travel, legal, insurance, and outsourced finance without assuming a large paid-demand engine."
  - id: A19
    name: Cash conversion convention
    value: "Cash movement equals EBITDA"
    unit: formula
    source: "[startup-finance heuristic] capex, taxes, debt, and working-capital swings are assumed immaterial relative to operating burn at pre-seed scale."
  - id: A20
    name: Monthly churn assumption for unit economics
    value: "1.5%"
    unit: percent per month
    source: "[startup-finance heuristic for early enterprise workflow SaaS] implemented health-system workflows should be sticky, but concentrated logos and long procurement cycles still justify non-zero churn."
  - id: A21
    name: CAC convention
    value: "36-month sales and marketing spend divided by 7 landed paying logos"
    unit: formula
    source: "[model calculation using base-case S&M spend + BP gtm.channels] CAC includes founder time, GTM hires, travel, and solution-led selling across the full buildout."
  - id: A22
    name: Funding milestone for the pre-seed ask
    value: "Reach 3 paid design partners, convert 2 into production, prove 60% acceptance-without-edit on low-risk packet elements, and show implementation time falling before the seed round"
    unit: milestone
    source: "[BP milestones 0–12 and 12–24 + BP fundingAsk.useOfFundsSummary] the raise is sized to clear the first proof set and still leave about 6 months of buffer."
  - id: A23
    name: Coverage depth per landed system
    value: "Modeled ACVs assume only the first 1-2 service lines and partial clinic coverage, not the full research SOM seat-equivalent"
    unit: scope
    source: "[Research market.som $11.9M + BP product.mvp + BP strategicChoices.beachhead] this keeps system-level revenue conservative relative to the research market-size anchor."
  - id: A24
    name: Quarterly salary convention
    value: "Y2-Y3 salary rows sum actual monthly payroll inside each quarter rather than relying only on quarter-end snapshots"
    unit: convention
    source: "[headcount column convention + BP team + startup-finance heuristic] this keeps quarterly payroll consistent even though Y2 and Y3 headcount are only shown at year-end snapshots."
