problem: >-
  Health systems that adopted ambient notes still leave clinicians to finish
  referrals, orders, follow-up instructions, records requests, and scheduling
  nudges across multiple EHR queues after each visit. Heidi's expansion shows
  that systems now want supervised agents to absorb that visit-adjacent work,
  but existing note tools and referral products do not package the whole
  post-visit action set into a safe, fast sign-off flow. Without one release
  packet, clinicians either retype downstream work or review fragmented drafts
  one by one, which turns promised automation into more after-hours clicks.
targetUser:
  primary: >-
    CMIOs and ambulatory operations leaders at U.S. health systems with 200+
    employed physicians, an existing ambient documentation deployment, and
    centralized referral or inbox support teams
  secondary: >-
    Service-line medical directors and referral-operations managers in
    high-volume cardiology, orthopedics, gastroenterology, and primary-care
    clinics
  buyer: >-
    CMIO, VP of ambulatory operations, or Chief Medical Officer at a
    multi-hospital U.S. health system
startupThesis:
  nonObviousInsight: >-
    The bottleneck is no longer note generation; it is compressing all
    visit-adjacent actions into a single evidence-backed packet that a
    clinician can approve in seconds while the system learns which task types
    are locally safe to advance.
  beachhead: >-
    U.S. multi-specialty health systems that have already standardized an
    ambient note product across 100+ employed-clinician clinics and still push
    referrals, orders, and follow-up tasks through separate EHR queues and
    staff pools
  wedge: >-
    A visit-close packet compiler that bundles draft referrals, order sets,
    pre-encounter record syntheses, patient instructions, records requests,
    and staff follow-up tasks into one supervised sign-off flow with
    specialty-specific acceptance thresholds
  whyNowCatalyst: >-
    Heidi's financing and enterprise traction show that ambient documentation
    budgets are already expanding into clinician-supervised action, with order
    sets, referrals, and pre-encounter records named as the next wedge.
  ventureScalePath: >-
    Start with ambulatory visit-close packets for employed clinics, then
    expand into inpatient consults, prior-authorization starters, procedure
    prep, care-gap outreach, and benchmark data on which action types can move
    safely with minimal clinician review across health systems.
solution: >-
  Visit Close Packets sits after the note draft and before work fans out
  across the EHR. For each encounter, it compiles the relevant evidence,
  proposed orders, referral language, records requests, patient instructions,
  and staff tasks into one packet with risk tiers, required approvers, and
  downstream owners. The clinician can accept, edit, or reject the whole
  packet in one flow instead of opening multiple queues, while coordinators
  receive locked context and ready-to-complete tasks the moment sign-off
  happens. Every edit is captured by specialty, clinician, and action type so
  the product can shrink future reviews into lighter cards only when local
  acceptance-without-edit rates justify it. The result is less pajama-time
  admin for clinicians and fewer dropped handoffs for referral, scheduling,
  and records teams.
goToMarketSeed:
  firstCustomer: >-
    A 5-15 hospital U.S. regional health system that already uses an ambient
    note vendor in employed primary-care and cardiology clinics and runs a
    centralized referral-management team
  buyingTrigger: >-
    Expansion of an existing ambient-documentation contract into supervised
    actions, or clinician complaints that after-hours EHR work has not fallen
    despite note automation
  currentAlternative: >-
    Ambient scribe outputs, EHR inboxes, referral coordinators, order
    favorites, MA call backs, and manual visit-close checklists
  switchingReason: >-
    One packetized sign-off replaces five separate review surfaces and gives
    downstream staff complete context instead of partial drafts and inbox
    crumbs.
  pricingHypothesis: >-
    Subscription fee per 1,000 completed visit-close packets plus
    implementation fees per service line
