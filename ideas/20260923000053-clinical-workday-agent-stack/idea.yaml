differentiator: >-
  Ambient note vendors stop at documentation, referral-intake tools stop at
  one queue, and EHR inbox tools force clinicians to complete downstream work
  item by item. This concept owns the moment between note completion and
  operational execution by turning every next step into a single visit-close
  packet with required evidence and explicit downstream ownership. Its moat is
  the local acceptance telemetry: which specialties, task types, and evidence
  layouts consistently clear clinician sign-off without edits, allowing review
  time to collapse safely over time.
