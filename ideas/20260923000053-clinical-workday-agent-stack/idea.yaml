  title: Visit close to completed work
  mermaid: |
    flowchart LR
      Visit[Completed visit] --> Packet[Visit-close packet]
      Packet --> Signoff[Clinician sign-off]
      Signoff --> Queues[Referral, order, and follow-up queues]
      Queues --> Outcome[Less after-hours work]
businessModelCanvas:
  customerSegments:
    - Multi-hospital U.S. health systems with employed ambulatory groups
    - Service-line clinics with heavy referral and follow-up work
    - Ambient documentation programs expanding into supervised task execution
  valuePropositions:
    - Collapse post-visit referrals, orders, and follow-up into one clinician review flow
    - Reduce after-hours EHR work without asking clinicians to trust full autonomy
    - Give downstream staff complete approved context instead of fragmented drafts
  channels:
    - Ambient note vendor integration partnerships
    - CMIO and ambulatory-operations sales into regional and enterprise health systems
    - Design partners in cardiology, orthopedics, gastroenterology, and primary care
  customerRelationships:
    - Services-assisted launch by specialty or service line
    - Workflow benchmarking reviews with clinical leadership
    - Expansion playbooks across additional clinics and sites
  revenueStreams:
    - Subscription fee per 1,000 completed visit-close packets
    - Implementation fees for each specialty or service line
    - Benchmarking add-on for action acceptance and review-time analytics
  keyResources:
    - Visit-close packet model and routing rules
    - Acceptance-without-edit telemetry by specialty and action type
    - Integrations into ambient note outputs, EHR queues, and staff worklists
  keyActivities:
    - Map post-visit workflows and approver logic by service line
    - Generate and route evidence-backed visit packets
    - Measure acceptance, rework, and downstream completion
  keyPartners:
    - Ambient documentation vendors
    - EHR integration and clinical-informatics teams
    - Referral, scheduling, and records operations leaders at design-partner systems
  costStructure:
    - Clinical workflow implementation staff
    - Product and EHR integration engineering
    - Customer success, compliance, and support
jobsToBeDone:
  - job: >-
      When an employed clinic has already drafted the note but still must
      complete referrals, orders, and patient follow-up, help the clinician
      approve the next steps in one pass, so they can finish visits without
      after-hours inbox work.
    currentAlternative: EHR inboxes, referral pools, and manual order entry after the visit
    successMetric: Median clinician review minutes per visit-close packet and reduction in after-hours EHR time
  - job: >-
      When referral and scheduling teams inherit incomplete post-visit work,
      help operations leaders route approved tasks with full context, so they
      can cut dropped follow-ups and rework.
    currentAlternative: Partial note drafts, phone calls, and re-created tasks in shared work queues
    successMetric: Percentage of visit-close tasks completed without clarification back to the clinician
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: >-
      Treating clinician review as a release packet for downstream work is more
      distinctive than a better ambient scribe, even if adjacent note vendors
      will describe similar ambitions over time.
  venturePotential:
    score: 4
    rationale: >-
      Every health system that already budgets for ambient documentation can
      become a buyer, but the first deployments are integration-heavy and
      initially concentrated in U.S. ambulatory care.
  whiteSpace:
    score: 5
    rationale: >-
      No incumbent owns the cross-queue packet that turns AI-drafted orders,
      referrals, and staff work into a single approved release object; note
      tools, referral systems, and EHR inboxes each stop short of that
      boundary.
  painIntensity:
    score: 5
    rationale: >-
      Post-visit administrative work directly drives clinician burnout, slower
      patient follow-through, and repeated staff rework inside already
      overloaded ambulatory systems.
  wedgeClarity:
    score: 4
    rationale: >-
      The first workflow is crisp around employed ambulatory clinics already
      using ambient notes, though EHR and service-line variability still make
      early rollouts consultative.
  evidenceFit:
    score: 5
    rationale: >-
      A primary company release plus four independent same-day sources all
      describe the shift from note capture into clinician-supervised tasks and
      name the exact visit-close actions that need new tooling.
topRisks:
  - name: Workflow variability
    description: >-
      Each health system configures orders, referrals, and downstream staff
      queues differently, which can slow onboarding and reduce repeatability.
    mitigation: >-
      Start with two or three repeatable service-line templates on common EHR
      and ambient-vendor patterns, then expand only after packet schemas
      stabilize.
  - name: Clinician trust drag
    description: >-
      If packets still require too many edits, clinicians will experience the
      product as another inbox rather than as real time savings.
    mitigation: >-
      Launch with low-risk task types and use acceptance-without-edit
      thresholds before shrinking reviews or expanding autonomy.
  - name: Vendor encroachment
    description: >-
      Ambient note vendors or EHR vendors could add their own visit-close task
      bundles once the workflow proves valuable.
    mitigation: >-
      Stay vendor-neutral across note sources and own the acceptance and
      downstream-completion benchmark data that single-vendor tools cannot
      assemble easily.
