problem: >-
  已经上了环境式 AI 病历记录的医疗系统，临床医生每次看诊后还是得在多个 EHR 队列里收尾转诊、医嘱、复诊说明、病历调取和排班提醒。Heidi
  的扩张说明，系统现在想让监督式智能体把这部分就诊相邻工作接过去；但现有病历工具和转诊产品都还不能把整套就诊后动作打包成一个既安全又高效的签字放行流程。没有统一的就诊收尾工作包，临床医生要么把下游工作重新敲一遍，要么逐条点开零散草稿复核，所谓自动化最后还是变成下班后的更多点击。
targetUser:
  primary: >-
    美国医疗系统里的 CMIO 和门诊运营负责人：机构拥有 200+ 名雇佣制医生，已经部署环境式 AI 病历记录，并设有集中的转诊或收件箱支持团队
  secondary: >-
    心内科、骨科、胃肠科和初级保健等高量门诊里的服务线医疗主任与转诊运营经理
  buyer: >-
    多院区美国医疗系统里的 CMIO、门诊运营 VP 或首席医疗官
startupThesis:
  nonObviousInsight: >-
    真正的瓶颈不再是把病历起出来，而是把所有就诊相邻动作压成一个有证据支撑的就诊收尾工作包，让临床医生几秒内就能批准，同时让系统学会哪些任务类型在本地可以安全前推。
  beachhead: >-
    已经把环境式 AI 病历记录标准化铺到 100+ 家雇佣制门诊的美国多专科医疗系统，但转诊、医嘱和后续任务仍分散在不同 EHR 队列和员工池里
  wedge: >-
    一个就诊收尾工作包编译器：把转诊草稿、医嘱集、就诊前病历汇总、患者说明、病历调取请求和员工跟进任务，汇成一条带专科化无修改通过率阈值的监督式签字放行流程
  whyNowCatalyst: >-
    Heidi 的融资和企业级落地说明，环境式病历记录预算已经在向临床医生监督下的动作执行扩张，而医嘱集、转诊和就诊前病历正是下一步切口。
  ventureScalePath: >-
    先从雇佣制门诊的就诊收尾工作包切进去，再扩到住院会诊、事前授权起单、术前准备、照护缺口触达，以及一套跨医疗系统的数据基准：哪些动作类型在极少临床医生复核下也能安全前推。
solution: >-
  就诊收尾工作包卡在病历草稿之后、各项工作还没在 EHR 里分散流转之前。每次就诊，它会把相关证据、拟议医嘱、转诊措辞、病历调取请求、患者说明和员工任务汇成一个工作包，并标出风险分层、必签角色和下游负责人。临床医生不必再逐个点开多个队列，而是在一条流程里整包接受、修改或驳回；一旦签字，协调员立刻拿到锁定的上下文和可直接完成的任务。产品会按专科、临床医生和动作类型记录每一次修改，只有当本地无修改通过率足够高时，后续复核才会安全收敛成更轻的卡片。结果就是：临床医生下班后补工更少，转诊、排班和病历团队的交接漏项也更少。
goToMarketSeed:
  firstCustomer: >-
    一家拥有 5-15 家医院的美国区域型医疗系统，已经在雇佣制初级保健和心内科门诊部署环境式 AI 病历记录，并设有集中的转诊管理团队
  buyingTrigger: >-
    现有环境式病历记录合同从病历扩到监督式动作，或临床医生抱怨病历自动化上线后，下班后的 EHR 工作仍没下降
  currentAlternative: >-
    环境式 AI 病历记录输出、EHR 收件箱、转诊协调员、常用医嘱模板、医疗助理回拨电话，以及手工就诊收尾清单
  switchingReason: >-
    一个工作包式签字放行，替代五块分散的复核界面，也让下游员工拿到完整上下文，而不是半成品草稿和零碎的收件箱残片。
  pricingHypothesis: >-
    按每 1,000 个已完成的就诊收尾工作包收订阅费，并按每条服务线收实施费
