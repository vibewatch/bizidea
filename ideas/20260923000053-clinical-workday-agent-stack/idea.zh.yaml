differentiator: >-
  环境式病历记录厂商止步于病历记录，转诊接收工具只守一个队列，EHR
  收件箱工具则逼着临床医生逐条把下游工作做完。这个概念拿下的是病历完成与运营执行之间的那一刻——把每个下一步都装进一个就诊收尾工作包，证据齐全、下游责任人明确。真正的护城河在于本地无修改通过率遥测：哪些专科、哪些任务类型、哪些证据排布，能稳定通过临床医生签字而不用修改，从而让复核时间随着时间推移安全地塌下来。
