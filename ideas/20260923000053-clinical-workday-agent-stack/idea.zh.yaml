qualityPolicyVersion: 2
slug: visit-close-work-packets
date: '2026-09-23'
sector: health-tech
pitch: >-
  就诊收尾工作包让临床医生在收件箱变成下班后负担之前，就先把转诊、医嘱和后续跟进任务签字放行。
selectionLens:
  championDimension: whiteSpace
  championScore: 5
  whyThisWins: >-
    环境式 AI 病历记录厂商大多止步于病历，而这个概念拿下的是门诊里第一个跨队列工作包——把 AI
    起草的后续动作变成一包可签字放行的实际工作。
  acceptedTradeoff: >-
    首批部署会明显偏美国、也更依赖服务交付，因为每家医疗系统的 EHR 配置、执业范围规则和工作队列都要先映射清楚，复核流程才压得进可复用软件。
originalityAudit:
  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
  rejectedCliches:
    - 只把病历写得更好的通用环境式 AI 升级
    - 给临床医生收件箱积压加一个仪表盘和提醒
    - 覆盖所有科室的宽泛临床智能体套件
    - 只在系统之间同步任务的轻量 EHR 集成层
  rareMechanism: >-
    每次就诊都会生成一个就诊收尾工作包：其中的转诊、医嘱、病历调取请求和后续任务，只有当本地按专科和动作类型统计的无修改通过率达到门槛后，才会从完整复核收敛到更轻的签字放行。
  nearestHistoricalIdeas:
    - slug: referral-intake-control-tower
      similarity: customer
      decisiveDifference: >-
        那个概念整理的是进入专科排班流程的传真转诊；这个概念则从临床医生看诊结束后起步，把外发转诊、医嘱和后续工作一起放进一个已签署的工作包。
    - slug: endoscopy-claim-proof-os
      similarity: mechanism
      decisiveDifference: >-
        那个概念把单一术式的视频转成文档和 CPT 证据；这个概念则把围绕一次就诊的多种后续动作打成一包，并靠无修改通过率遥测逐步压缩临床医生复核。
    - slug: agent-review-economics-os
      similarity: mechanism
      decisiveDifference: >-
        那个概念为内部 SaaS 智能体预算人工复核；这个概念则把临床医生监督下的医疗交付工作分流出去，而一旦批准，就会直接触发面向患者的医嘱、转诊和员工任务。
