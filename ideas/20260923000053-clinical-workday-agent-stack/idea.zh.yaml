  revenueStreams:
    - 按每 1,000 个已完成的就诊收尾工作包收订阅费
    - 按每条专科或服务线收实施费
    - 围绕动作通过率与复核时长的基准分析增值包
  keyResources:
    - 就诊收尾工作包模型和路由规则
    - 按专科和动作类型沉淀的无修改通过率遥测
    - 接入环境式病历记录输出、EHR 队列和员工工作清单的集成
  keyActivities:
    - 按服务线梳理就诊后工作流和审批逻辑
    - 生成并路由有证据支撑的就诊工作包
    - 衡量通过率、返工和下游完成情况
  keyPartners:
    - 环境式病历记录厂商
    - EHR 集成团队和临床信息化团队
    - 共创客户系统里的转诊、排班和病历运营负责人
  costStructure:
    - 临床工作流实施团队
    - 产品与 EHR 集成工程
    - 客户成功、合规与支持
jobsToBeDone:
  - job: >-
      当雇佣制门诊已经把病历起好、但转诊、医嘱和患者后续跟进还没做完时，帮临床医生一口气批完后续动作，这样他们就能在不靠下班后处理收件箱的情况下收尾。
    currentAlternative: 看诊后再回到 EHR 收件箱、转诊池里手工录入医嘱
    successMetric: 每个就诊收尾工作包的临床医生复核分钟数中位数，以及下班后 EHR 时间下降幅度
  - job: >-
      当转诊和排班团队接到的是没做完的就诊后工作时，帮运营负责人把获批任务连同完整上下文一起路由出去，这样就能减少跟进漏项和返工。
    currentAlternative: 半成品病历草稿、电话沟通，以及在共享工作队列里重新建任务
    successMetric: 无需回头找临床医生澄清就能完成的就诊收尾任务占比
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: >-
      把临床医生复核定义成下游工作的放行工作包，比做一个更好的环境式 AI 病历记录助手更有辨识度，尽管相邻病历厂商迟早也会讲出相似的野心。
  venturePotential:
    score: 4
    rationale: >-
      所有已经为环境式病历记录编预算的医疗系统都可能成为买方，但首批部署集成很重，而且早期几乎都集中在美国门诊。
  whiteSpace:
    score: 5
    rationale: >-
      还没有现有厂商拿下那个跨队列工作包：把 AI 起草的医嘱、转诊和员工工作，变成一个已获批的放行对象；病历工具、转诊系统和 EHR 收件箱都停在这道边界之外。
  painIntensity:
    score: 5
    rationale: >-
      就诊后的行政收尾，直接推高临床医生倦怠、拖慢患者后续执行，也让已经超负荷的门诊体系反复返工。
  wedgeClarity:
    score: 4
    rationale: >-
      第一条工作流很清楚：已经上线环境式病历记录的雇佣制门诊；只是 EHR 和服务线差异仍让早期上线更像咨询交付。
  evidenceFit:
    score: 5
    rationale: >-
      一手公司公告加上四篇同日独立报道，都在描述这个品类如何从病历采集走向临床医生监督的任务执行，并点名了最需要新工具的就诊收尾动作。
topRisks:
  - name: 工作流差异
    description: >-
      每家医疗系统对医嘱、转诊和下游员工队列的配置都不同，这会拖慢上线，也会削弱可复制性。
    mitigation: >-
      先在常见 EHR 和环境式厂商组合上，拿两到三条可复用的服务线模板；只有当工作包结构真正稳定后，再往外扩。
  - name: 医生信任起不来
    description: >-
      如果工作包还是需要改太多，临床医生就会把它当成又一个收件箱，而不是实打实的省时工具。
    mitigation: >-
      先从低风险任务类型起步，只有无修改通过率达到门槛后，才缩短复核或扩大自主比例。
  - name: 厂商挤压
    description: >-
      环境式病历记录厂商或 EHR 厂商一旦看见这个工作流有价值，可能很快把自己的就诊收尾任务包补上。
    mitigation: >-
      坚持对病历来源保持厂商中立，并把无修改通过率和下游完成基准数据握在自己手里——这是单一厂商工具不容易拼出来的。
