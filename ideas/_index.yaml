    slug: rolling-ind-work-packets
    date: '2026-09-22'
    sector: bio
    pitch: >-
      Work-packet system for biotech sponsors to run rolling IND review with QRIs and open phase 1 sites before full
      filing.
    beachhead: >-
      Seed-to-Series C biotech sponsors with one lead asset, limited internal regulatory operations staff, and a
      near-term U.S. first-in-human program that will either apply to the FDA pilot or imitate its sponsor-QRI model
    wedge: >-
      A sponsor-QRI workspace that versions IND packets by module, records readiness evidence and review comments, and
      automatically opens downstream IRB or site-activation tasks once a packet crosses a defined threshold
    targetUserPrimary: >-
      Regulatory operations or early clinical development leads at venture-backed biotechs preparing their first U.S.
      phase 1 study with a QRI partner
    pitchFrame: work-packet system biotech
    qualityPolicyVersion: 2
    selectionLens:
      championDimension: whiteSpace
      championScore: 5
      whyThisWins: >-
        FDA is standardizing a new sponsor-QRI startup workflow, and no incumbent system owns the module-level
        dependencies between rolling review, IRB preparation, and site activation.
      acceptedTradeoff: >-
        The first 8 to 10 pilot pairs create a narrow initial market and will likely require services-heavy onboarding
        before the workflow becomes repeatable software.
