slug: fusion-interface-acceptance-escrow
date: 2026-10-13
executiveSummary: >-
  聚变开发商即使把定制设备包交给外部供应商，仍要为集成结果负责；Type One Energy 的案例也把供应商管控和接口工作的现实问题摆到了实处。拟议公司在授标前，为一对关联供应商共同拟定验收协议，再协调独立取证，并由合格托管服务商保管买方出资、设有上限的保留款。这是范围很窄的服务切口，不声称托管、验收测试或项目管控本身具有新意，也不认证或承保整座电厂的表现。首个客户应是已有资金支持的聚变集成商，例如 Type One；但只有它有一对尚未授标、且接口边界可量化的设备包时，这项服务才适用。现有资料既未确认这组设备包，也未证明市场需要这项服务。AECOM、内部供应商团队、DNV、Aconex、传统质保金和通用托管服务都是可信替代方案；公司必须证明自己能中立地设计边界测试并取得供应商同意，而不是只卖一个门户。研究按未经验证的接口数量和每对 $50,000 的收费假设，测算出首轮建设周期 TAM 累计 $26.5M、US 和欧洲 SAM $5.6M、初期 SOM $0.6M；这些都不是年度经常性收入。建议用小型工程主导团队、外包测试和资金保管，支撑 18 个月的 pre-seed 验证周期；付费试点前不开发软件平台。投资判断为 Watch：在集成商和两家供应商接受边界清晰的付费测试与付款协议前，继续观察。
problem:
  - >-
    合作伙伴主导能减少聚变企业自建制造能力的需求，但集成商仍要为定制设备包能否协同工作负责；研究记录了这种风险，却未量化接口故障或付款纠纷。
  - >-
    设备包级工厂验收记录和项目管控流程，未必能明确跨供应商接口测试由谁负责、什么证据才够、以及结果延迟、无法定论或发生争议时如何处理有上限的保留款。
  - >-
    买方可能已有业主工程师、内部供应商质量团队、检测公司和 Aconex 流程；新增预算是否存在、是否需要切换做法，都尚未得到验证。
solution:
  - >-
    关联设备包授标前，集成商与两家供应商共同梳理一处可量化的接口边界，敲定测试条件、通过/不通过界限、证据、复测、截止时间和有时限的兜底方案。
  - >-
    协调独立见证并维护带版本号的验收记录；只有买方出资且设有上限的保留款，才按经律师审阅的指示交由合格第三方托管服务商保管。
  - >-
    常规进度款、托管资金保管、设备表现、电厂完工和监管认证均不由初创公司负责。
whyWeWin:
  - >-
    公司的差异化服务，是在授标前为一对相互关联的供应商设备包共同商定测试，再把独立证据与有上限的放款指示连起来。目前没有找到资料证明已有聚变专属服务商把三者打包提供，但这不足以证明本方案独一无二。
  - >-
    AECOM 这类工程公司可以负责集成和接口管理，DNV 这类检测机构可以见证供应商工作，Aconex 可以流转记录，通用托管服务可以保管资金。只有当买方需要中立方拟定接口协议、并把证据连到付款时，这家公司才有胜算。
  - >-
    现成测试框架和商业托管服务降低了自建基础设施的必要性；若能建立优势，靠的是可复用的协议设计、供应商信任，以及获准使用的边界测试和争议处理证据。
strategicChoices:
  beachhead: >-
    首攻有资金支持、采购定制设备包的美国（US）首堆聚变集成商。目标项目应有一对尚未授标的设备包，二者交界处可做客观测试且供应商能够参与；项目总监还须有权修改采购订单条款。只有确认 Project Infinity 存在这样的设备包组合，Type One Energy 才是目标客户。
  wedgeRationale: >-
    先聚焦一对设备包，能收窄技术和法律范围，让三方在签下长周期采购承诺前达成一致，也能在整厂调试前拿到证据。相比之下，先做全供应商仪表盘或全厂质量平台，无法更快验证核心论点。
  sequencingRationale: >-
    先确认真实接口和测试，再取得买方及供应商对条款的认可，随后借助现有托管和检测伙伴开展付费试点。先招工程和商务执行人员；只有拿到实际结果后才标准化条款，只有反复付费的协议暴露出持续存在的流程瓶颈时才开发软件。
  notYet:
    - "不做通用聚变采购门户、供应商市场或宽泛的项目管控系统。"
    - "不保管客户资金，不提供保险、电厂表现担保、安全认证或整厂验收。"
    - "至少有两家互不相关的聚变买家重复付费前，不进入非聚变能源或其他工业垂直领域。"
    - "单对设备包尚未证明测试客观、供应商同意且争议处理公平前，不推广到多组设备包。"
market:
  tam: >-
    首轮建设周期的服务规模累计估算为 $26.5M，不是年收入：FIA 调查中的 53 位受访者，按每位受访者对应一个合格项目、每项目 10 对可服务设备包、每对收费 $50,000 测算。企业总数、接口数量、客户资格和收费均未得到验证，也不代表买方需求；不含托管本金。
  sam: >-
    US 和欧洲市场累计估算为 $5.6M：42 家据报位于美国和欧洲的企业，按假设筛去三分之二，得到 14 家有资金且符合条件的买家，再按每家 8 对、每对假设收费 $50,000 测算。这是规划池，不是年度市场，也不是已核实的客户名单。
  som: >-
    初期 SOM 累计规模情景为 $0.6M，按 3–5 年测算：3 个项目，每个项目 4 对付费设备包，按每对假设收费 $50,000。该情景不是收入预测，也不是经常性收入；还取决于能否赢得三个项目，以及接口测试能否重复开展。
  segments:
    - "主要客户：有资金支持、为首堆电厂担任总集成商的聚变开发商，且采购定制供应商设备包。"
    - "次要参与方：参加买方主导接口测试的设备包供应商、独立工程或检测伙伴。"
  buyingProcess: >-
    项目总监、COO 或采购负责人必须在设备包授标或设计冻结前批准单独的协议服务费，并修改供应商条款；工程、供应商质量、两家供应商、财务和法务还须对测试证据和放款规则达成一致。研究识别了这些职能和合适的采购触发点，但未确认这项服务的预算负责人、采购周期或审批路径。
product:
  mvp: >-
    为一对关联设备包提供全程协调的协议服务：接口图、测试方法和验收界限、供应商修订条款、复测与超时规则、证据清单，以及托管放款指示。使用现有独立见证方和托管服务商；试点只需一套带版本管理的文件包。
  sixMonth: >-
    完成客户摸排，并依据真实图纸或接口记录开展一次桌面协议评审；只有买方、两家供应商、见证方和托管服务商都认可这套边界清晰的流程后，才签付费试点。
  twelveMonth: >-
    设备包进度允许时，实际开展或演练首次安装前见证测试，记录放款或争议处理结果，并将交付工作量和直接成本与每对 $50,000 的定价假设对比。
  twentyFourMonth: >-
    只有首个试点转化后，才在更多设备包组合及第二家聚变集成商处复用协议；只有反复付费的工作证明流程中存在可避免的耗时，才自动化模板版本管理和证据流转。
  keyBets:
    - "至少有一家获得资金支持的集成商，拥有一对尚未授标、且能在现场安装前测试的设备包。"
    - "即使设备包彼此依赖，中立且边界清晰的测试仍能公平对待两家供应商。"
    - "买方愿意单独为协议设计和证据付费，而不是把任务交给工程伙伴或内部团队。"
    - "测试条款和证据格式能够复用到足以改善交付毛利的程度，同时不泄露机密或受出口管制的数据。"
gtm:
  wedge: >-
    在关联设备包授标前，向项目总监或采购负责人销售首个付费接口验收试点；先确认两家供应商和测试边界，再提出托管安排。
  channels:
    - "创始人主导销售，直接接触有资金支持的聚变开发商中的项目总监、系统集成负责人、采购和供应商质量团队。"
    - "通过已负责接口管理的业主工程师获得转介或分包机会，前提是明确初创公司中立协议服务的范围。"
    - "与独立检测公司及合格托管服务商联合交付；初创公司负责协议设计和协调，不经手资金。"
  funnelTargets: >-
    以下是规划目标，不是已观察到的转化数据：接触 10 个合格项目线索，找到至少 3 对有文件佐证的候选设备包，促成 2 次供应商共同评审协议，并签下 1 个付费试点；截至第 18个月，让该客户为第二对设备包付费，或拿下第二家买方。
  pricing: >-
    验证每对关联设备包收取 $25,000–$50,000 固定试点费是否可行，费用涵盖接口梳理、协议协商以及证据和放款协调；研究测算采用每对 $50,000，但这不是已验证价格。独立测试和托管服务商费用应单独报价，或作为透明的代收代付项目。等重复需求出现后，再提供覆盖多个项目的固定顾问服务费；不按托管本金收费，也不接管资金。
businessModel:
  revenueStreams:
    - "按每对关联设备包收取接口梳理和验收协议设计固定费用。"
    - "按次收取独立见证协调、证据包整理和托管放款管理费用。"
    - "只有买方已为试点付费且重复采购后，才收取多组设备包项目保留费。"
  unitOfValue: >-
    一对符合条件的供应商设备包，其接口边界依据事先约定的证据完成验收，或形成争议处理结论；买方支付初创公司的服务费，托管本金和另行签约的测试费用不计入收入。
  targetGrossMarginPct: 70
  expansionLevers:
    - "在同一聚变项目内，使用已批准条款和证据模板复用接口协议。"
    - "通过项目工程、检测和托管转介，触达第二家及后续获得资金支持的聚变集成商。"
    - "只有重复采购证明方案可迁移后，才拓展到相邻的首台套能源或工业项目。"
strategyMap:
  northStarMetric: "在现场集成前完成记录在案的验收或争议处理、且没有未解决托管放款争议的付费接口组合数。"
  inputMetrics:
    - "有资金支持、拥有尚未授标的可量化接口组合且已确定经济决策人的合格项目数。"
    - "候选组合中，两家供应商均评审测试界限、见证方权限和复测条款的比例。"
    - "从确认买方资格到签署付费试点、以及从取得测试证据到发出放款指示分别需要的天数。"
    - "试点转为重复采购的比例，以及每对设备包的直接交付工时。"
  moatsToBuild:
    - "建立带版本管理的接口条款和协议模板，并关联测试方法、证据要求、复测安排和结果。"
    - "与集成商、参与测试的供应商、独立见证方和托管服务商建立可信的合作关系。"
    - "积累经授权且标准化的测试和争议结果；多个设计产出可比、可复用的证据前，不宣称拥有数据护城河。"
  killCriteria:
    - "90 天内，没有有资金支持的集成商愿意提供真实候选接口和测试记录供评估；停止以托管为核心的切口，不要转而开发通用门户。"
    - "共同修订协议三轮后，买方和两家供应商仍未共同接受有上限、且标准由供应商可控的保留款；移除托管这一核心机制，或停止项目。"
    - "至少与 10 个合格项目沟通后，截至第 9个月仍未签下付费试点；冻结招聘，在投入更多资金前重新评估买方、收费或服务范围。"
    - "截至第 18个月仍无重复付费设备包，且扣除直接工程和伙伴成本后的预计服务毛利率仍低于 50%；不为软件扩张融资。"
  mermaid: |
    flowchart LR
      Buyer[Funded fusion integrator] --> Pair[One unawarded supplier pair]
      Pair --> Protocol[Joint measurable interface protocol]
      Protocol --> Witness[Independent witnessed test]
      Buyer --> Escrow[ Capped holdback at third-party escrow ]
      Witness --> Evidence[Evidence and release instruction]
      Evidence --> Escrow
      Escrow --> Proof[Paid acceptance or dispute disposition]
      Proof --> Repeat[Repeat pair and second integrator]
      Repeat --> Templates[Reusable protocol library]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low：运营场景确实存在，但尚未验证买方、供应商、设备包组合或付费意愿。"
    whyBelieve: >-
      有资金支持的合作伙伴主导聚变项目、已授标的制造工作和有据可查的系统集成范围，都说明授标前的供应商接口流程值得进一步验证。
    whyDoubt: >-
      研究未发现购买意向、已量化的接口损失成本、供应商接受保留款的证据，也没有确定可测试的设备包组合；测算的聚变专属 SOM 累计仅 $0.6M，现有厂商也能打包提供替代服务。
    nextDiligence: >-
      向一家有资金支持的集成商取得真实接口记录和授标前进度安排，再拿到买方和两家供应商对付费、独立见证试点条款的修订意见。
  firstCustomer:
    title: "有资金支持、担任总集成商的美国（US）聚变开发商项目总监"
    profile: >-
      首堆项目团队正在采购定制设备包，并由内部团队或业主工程师负责供应商集成；其中一对相互依赖的设备包尚未被采购订单锁定。只有 Type One 团队确认具体符合这些条件时，它才是相关客户。
    trigger: "供应商授标或设计冻结关口临近，项目必须在长周期采购承诺前明确验收规则。"
    buyer: "有权批准供应商合同条款和保留款的项目总监或 COO；具体预算负责人尚未核实。"
    initialContract: >-
      假设方案：为单对设备包提供 $25,000–$50,000 的付费试点，涵盖接口梳理、联合协议、桌面评审或见证测试协调，以及放款文件；若首份协议获接受且下一处接口另行批准，再按每对收费。测试和托管服务商费用另计。
  mustBeTrue:
    - "90 天内，至少一家有资金支持的聚变集成商提供一对尚未授标设备包的记录，且该组合可在安装前重复进行通过/不通过测试。"
    - "至少一位经济决策人签下 $25,000–$50,000 的试点合同，而不是把全部工作交给现有工程、检测或内部团队。"
    - "对一组真实设备包，两家供应商都书面接受有上限的保留款、见证方权限、供应商可控的测试条件、复测安排，以及有时限的延误/争议兜底方案。"
    - "独立见证方能在现场集成前提供足以支持决策的证据，各方也能按约定规则放款，且不留下未解决的争议。"
    - "24 个月内，至少两家互不相关的聚变集成商为重复接口付费，且经济模型符合服务毛利率 70% 的目标；否则，只看聚变市场，研究测算的规模不足以支撑风险投资规模的回报。"
  diligenceQuestions:
    - "哪家有资金支持的集成商有尚未授标的供应商设备包组合？实际接口控制文件、测试窗口和采购订单关口如何界定它？"
    - "谁能批准费用并修改采购订单？目前哪项工程或项目管控工作本来会负责这件事？"
    - "验收结果部分取决于另一设备包时，两家供应商是否都愿意签署拟议的上限和测试条款？"
    - "见证方能做哪项客观的安装前测试？结果无法定论、下游延误、设计变更和复测如何处理？"
    - "买方预计能避免多少返工、延误或争议成本？付费试点是否证明存在独立于现有 EPC 或内部预算的资金？"
    - "律师和合格托管服务商能否在相关司法辖区、保密及出口管制约束下执行资金流转和证据处理？"
operatingAssumptions:
  - assumption: "至少有一家有资金支持的聚变集成商，拥有一对尚未授标的设备包，二者之间可在安装前开展可量化、供应商能够参与的测试。"
    basis: "research.yaml"
    validationTest: "90 天内，与集成商和两家设备包负责人审阅真实接口记录、图纸、测试窗口及采购订单进度。"
    decisionImpact: "若不存在这样的设备包，不开发托管流程；停止项目，或等未来采购关口测试范围更窄、仅做协议设计的服务。"
  - assumption: "只要常规进度款不变、测试条件由供应商掌控，两家供应商都会接受有上限的保留款。"
    basis: "research.yaml"
    validationTest: "取得买方批准、供应商修订过的条款清单，明确上限、证据、见证方、复测权、超时处理和争议途径。"
    decisionImpact: "共同修订三轮后若供应商仍拒绝该机制，就放弃托管切口或停止项目，不要把同一方案包装成仪表盘。"
  - assumption: "买方愿为单对设备包试点支付 $25,000–$50,000，且每对 $50,000 有望成为合理的重复采购收费。"
    basis: "运营者判断"
    validationTest: "针对买方当前的工程、检测和项目管控范围提交明确报价，并要求签署付费试点；口头兴趣不算验证通过。"
    decisionImpact: "若没有新增预算，只有在仍有付费需求时才调整价格或转为分包；否则这项服务没有独立商业模式。"
  - assumption: "公司不自行检测、也不持有客户资金，仍能达到服务毛利率 70% 的目标。"
    basis: "运营者判断"
    validationTest: "跟踪前两对付费设备包的创始人和员工交付工时、律师费、检测费、托管协调费及差旅费；不计托管本金和另行转付的测试费用。"
    decisionImpact: "若到第 18个月时直接交付投入仍令毛利率低于 50%，停止为软件扩张招聘，并重新评估这是否适合成为专业服务公司。"
  - assumption: "尽管采购和法律审查因项目而异，仍能在 18 个月的 pre-seed 资金跑道内签下付费试点。"
    basis: "运营者判断"
    validationTest: "记录从首次买方会谈、供应商修订到采购订单批准的日期里程碑；至少完成 10 次合格沟通后，要求截至第 9个月签下付费试点。"
    decisionImpact: "若未达到门槛，冻结招聘和资金投入，直到有买方支持的采购窗口得到书面确认。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "访谈 Type One 及至少另外两家有资金支持的聚变开发商中的项目总监、系统集成负责人、采购负责人和供应商质量负责人；逐一确认真实设备包组合，不把公司层面的兴趣当作需求。"
    hypothesis: "至少一个团队即将授标供应商，且能在安装前明确跨供应商测试。"
    successMetric: "找到一对有文件佐证的候选设备包，并确定买方、两家设备包负责人、测试窗口和采购订单关口。"
    owner: "CEO / 商务创始人"
  - horizon: "0–90 天"
    experiment: "让买方法务、两家供应商和一家独立检测伙伴共同修订有上限的保留款条款清单，写明复测、超时和争议规则。"
    hypothesis: "保留款金额有限且标准由供应商掌控时，供应商愿意参与。"
    successMetric: "收到两家供应商的书面评审，且验收边界和放款流程没有未解决的异议。"
    owner: "创始系统集成工程师"
  - horizon: "3–6 个月"
    experiment: "依据真实图纸和测量校准要求，与独立见证方及合格托管服务商开展桌面推演或模拟。"
    hypothesis: "无需声称提供安全认证，也能在整厂调试前产出可重复的通过/不通过记录。"
    successMetric: "买方、两家供应商和见证方批准带版本记录的协议及证据清单；律师和服务商批准拟议资金流。"
    owner: "创始系统集成工程师"
  - horizon: "3–9 个月"
    experiment: "向符合条件的集成商提供单对设备包付费试点，并将工作范围与现有业主工程师、QA 和项目管控职责逐项比较。"
    hypothesis: "买方有新增预算，并愿在供应商授标前签约。"
    successMetric: "截至第 9个月签下一份金额在 $25,000–$50,000 假设区间内的试点合同，或明确确认没有预算。"
    owner: "CEO / 商务创始人"
  - horizon: "6–12 个月"
    experiment: "设备包准备就绪后执行首次见证测试；只有各方认可桌面推演可作为有效试点交付物时才采用，且不得宣称整厂验收。"
    hypothesis: "协议能及时产出足以支持决策的证据，并形成无争议的放款指示。"
    successMetric: "取得签署的验收文件或有据可查的争议处理结果；测量从取得证据到放款的时间和实际直接交付成本。"
    owner: "创始系统集成工程师"
  - horizon: "12–18 个月"
    experiment: "向试点客户销售第二对付费接口，并通过业主工程师或检测转介争取第二家集成商。"
    hypothesis: "协议能迁移到另一处设备包边界，且至少一位客户会重复采购，无需重新定制整套服务。"
    successMetric: "至少新增两对付费设备包或签下第二家买方，且直接交付经济性朝服务毛利率 70% 的目标改善。"
    owner: "CEO / 商务创始人"
operations:
  - "维护带版本管理的协议，明确边界责任、测试条件、仪器与校准、访问权限、验收界限、证据、复测和超时处理。"
  - "由独立检测或工程伙伴负责见证，合格第三方托管服务商负责资金保管；合同律师批准资金流和争议指示。"
  - "把记录接入买方现有的接口控制和检验测试计划系统；买方使用 Aconex 时就接入 Aconex，不另建项目门户。"
  - "限制机密和受出口管制技术数据的访问，按项目设定权限，并在所有交付物中排除监管认证和整厂性能承诺。"
team:
  - role: "创始系统集成工程师"
    startTiming: "第 0 个月"
    rationale: "负责设备包边界评估、测试可行性、协议撰写、独立见证协调和证据质量；这是托管服务商和文件平台无法提供的核心技术判断。"
  - role: "CEO / 商务创始人"
    startTiming: "第 0 个月"
    rationale: "建立与项目总监的联系，拿下授标前付费试点，协调买方和供应商参与，并推进节奏缓慢的多方合同谈判。"
  - role: "项目合同与托管律师"
    startTiming: "第 0 个月，兼职"
    rationale: "审阅保留款条款、放款指示、司法辖区、资金保管、争议、保密和出口管制边界；聘请外部律师，不自建受监管的资金保管能力。"
  - role: "独立测试/检测伙伴"
    startTiming: "按试点需要，自第 3 个月起"
    rationale: "按明确范围提供经过校准、可信的见证服务；重复业务量足以支持更深入合作前，逐次按测试分包。"
  - role: "产品/工作流工程师"
    startTiming: "首个付费试点后，且不早于第 9 个月"
    rationale: "只有重复业务证明工作流已经稳定且足以支撑招聘后，才自动化协议版本管理和证据流转。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "确认一处真实、尚未授标的接口，并与买方、两家供应商和见证方完成联合技术及商务评审。"
      - "截至第 9个月签下一个付费试点；若完成 10 次合格买方沟通后仍未签约，就冻结招聘并重新评估。"
      - "完成一次见证测试或各方明确认可的桌面测试，形成签署的验收、放款或争议记录，并测量直接交付投入。"
  - horizon: "12–24 个月"
    items:
      - "把首个试点转为重复付费业务；只有首份协议获接受后，才向第二家聚变集成商销售更多设备包组合。"
      - "累计完成 3–5 对付费接口合作，覆盖至少两家买方，并验证直接服务毛利率能否达到 70%。"
      - "标准化可复用条款和证据格式，同时守住项目保密及出口管制隔离要求。"
  - horizon: "24–36 个月"
    items:
      - "验证研究中的 SOM 情景：三个客户项目、每个项目最多四对付费设备包；报告实际累计收费，不把市场规模年化。"
      - "至少两家互不相关的集成商重复采购前，不组建专职产品团队，也不进入相邻工业市场。"
      - "若重复采购或目标单位经济模型未达标，就维持小型专业服务业务或停止，不要从行业融资规模推断平台能做大。"
risks:
  - risk: "供应商拒绝接受与接口结果挂钩的保留款，而该接口又部分取决于另一家供应商。"
    likelihood: "High"
    impact: "High"
    mitigation: "限定保留款上限、保留正常进度款、设定供应商可控的界限、明确复测和延误兜底，并在买方承诺前取得两家供应商的修订意见。"
  - risk: "只有安装后或电厂运行时才能观察候选接口。"
    likelihood: "High"
    impact: "High"
    mitigation: "只评估有文件记录且可在安装前重复测试的设备包组合；若测试结果无法公平地决定提前付款，就不接该接口。"
  - risk: "采购和合同审查耗时超过服务所能承受的周期。"
    likelihood: "High"
    impact: "High"
    mitigation: "在设备包授标前销售，采用一份有上限的标准保留款模板，设定第 9 个月付费试点关口，并延后非必要招聘。"
  - risk: "AECOM 这类工程伙伴、内部供应商团队、DNV、Aconex 或传统质保金能打包覆盖足够多的工作。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "推介前梳理现有工作范围；只对现有厂商服务未覆盖的独立接口协议和付款放款证据收费。"
  - risk: "仅靠聚变市场，规模可能过小或需求过于间歇，无法带来风险投资规模回报。"
    likelihood: "High"
    impact: "High"
    mitigation: "把 TAM/SAM/SOM 当作累计假设；验证不同聚变项目之间的重复采购，证明方案可迁移前暂缓进入相邻行业。"
  - risk: "托管、技术数据、出口管制或争议规则带来超出初创公司服务范围的责任。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "资金由合格服务商保管，要求律师批准并采用项目专属控制措施，只对约定证据作出陈述，不认证安全或整厂表现。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$1.0–1.5M"
  runwayMonths: 18
  useOfFundsSummary: >-
    这是运营规划目标，不是经研究验证的融资基准：用 18 个月确认资格并签下一项付费接口试点，支付专业律师和独立测试伙伴费用，测算直接交付经济性，并从第二家集成商取得重复需求。创始团队保持精简，付费试点前暂缓专门的软件开发，并在第 9 个月和第 18 个月按既定证伪关口停止或调整范围。
