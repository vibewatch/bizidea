    currentAlternative: "Rely on separate supplier factory-acceptance records and EPC or in-house oversight, then negotiate rework and change orders if the packages fail to fit together."
    successMetric: "Share of covered interfaces passing the agreed test on first attempt, plus time from test evidence to final holdback release or resolved dispute."
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "It combines pre-award interface acceptance with a buyer-funded escrow release, making compatibility between separate suppliers—not an individual vendor's progress report—the payment trigger."
  venturePotential:
    score: 3
    rationale: "A repeatable contract and verification service could extend across fusion projects and other first-of-kind infrastructure, but customer count, project timing, and willingness to alter supplier terms are unproven."
  whiteSpace:
    score: 4
    rationale: "The sources identify a bespoke supplier-control and integration problem, while the history index has no directly comparable fusion procurement concept; established EPC oversight and escrow practices remain adjacent alternatives."
  painIntensity:
    score: 3
    rationale: "Supplier-control and integration risk is explicitly reported, but the evidence contains no documented interface failure, payment dispute, or quantified cost of delay."
  wedgeClarity:
    score: 4
    rationale: "One linked package pair, one measurable interface test, and one capped holdback define a concrete pilot, though procurement timing and supplier consent may constrain access."
  evidenceFit:
    score: 3
    rationale: "The funding, partner-led model, and reported integration exposure fit the concept, but no source validates demand for escrowed acceptance or the testability of a particular package boundary."
topRisks:
  - name: Supplier resistance
    description: "Suppliers may reject a holdback tied to downstream compatibility tests they do not fully control, weakening participation or worsening bid terms."
    mitigation: "Cap the holdback, define vendor-controlled test conditions and time limits before award, and involve both suppliers in the protocol."
  - name: Hard-to-test interfaces
    description: "Some package interactions may only become observable after installation or under plant conditions that a factory test cannot reproduce."
    mitigation: "Start only with interfaces that have measurable pre-installation tests and state clearly that acceptance does not certify whole-plant performance."
  - name: Slow contract adoption
    description: "Fusion procurement is early and project-specific, so legal review, escrow setup, and bespoke protocol work may consume more time than the service earns."
    mitigation: "Pilot a single package pair with a standard capped-holdback template and use an existing independent escrow provider rather than building a regulated custody or insurance business."
