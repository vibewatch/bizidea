      Integrator --> Escrow[Buyer-funded payment holdback]
      Protocol --> Witness[Independent test witness]
      Witness --> Evidence[Signed acceptance evidence]
      Evidence --> Escrow
      Escrow --> Supplier[Supplier receives released holdback]
