problem: >-
  A fusion developer that relies on industrial partners avoids recreating a full manufacturing base, but it still
  owns the system-level result when bespoke supplier packages must work together. The reported supplier-control and
  integration risk suggests that standalone vendor milestones may not prove compatibility at the handoff between
  packages. The sources do not establish existing payment disputes or buyer demand for an escrow service, so the
  commercial pain and willingness to adopt this contract structure remain hypotheses to validate.
targetUser:
  primary: "Procurement and systems-integration leads at a private fusion developer acting as prime integrator for a first-of-kind plant and buying bespoke supplier packages."
  secondary: "Supplier-quality and technical-acceptance leads at manufacturers delivering interdependent fusion-plant packages."
  buyer: "The fusion developer's project director or COO with authority over supplier contracts and milestone payments."
startupThesis:
  nonObviousInsight: >-
    A partner-led plant does not only need better supplier visibility; it needs explicit ownership of the boundary
    between suppliers. If a measurable interface test and its evidence are agreed before purchase orders are placed,
    a small payment holdback can make cross-vendor compatibility a payable acceptance event rather than a late
    commissioning argument.
  beachhead: >-
    Funded first-of-kind fusion projects using a bespoke supplier network, beginning with one pair of not-yet-awarded
    packages that meet at a measurable technical interface and have a project team willing to agree acceptance terms
    before purchase orders are issued.
  wedge: >-
    A managed interface-acceptance contract for one linked supplier pair: define the boundary test, arrange an
    independent witness, and administer a capped buyer-funded payment holdback through a third-party escrow provider.
  whyNowCatalyst: >-
    Type One Energy's $200 million Series B supports a named prototype and planned commercial plant under its
    partner-led FusionDirect model; reporting also identifies supplier-control and integration risk in its bespoke
    network. This creates a timely design question for procurement, not proof that a particular package is ready or
    that the proposed service has been requested.
  ventureScalePath: >-
    Standardize interface-test clauses and acceptance records across packages and projects, then sell a repeatable
    contract-and-verification service to other fusion developers. If the protocol proves useful beyond fusion, extend
    it to other first-of-kind energy and industrial projects with multi-vendor integration risk without underwriting
    plant performance or taking ownership of the equipment.
solution: >-
  Before linked supplier packages are awarded, the venture maps one measurable interface and writes a bounded
  acceptance protocol with both vendors and the fusion integrator, including test conditions, evidence, retest limits,
  and a time-bound fallback if a downstream test is delayed. The buyer funds a capped final-payment holdback with an
  independent escrow provider; ordinary supplier progress payments remain separate. An independent test or inspection
  partner records whether the agreed packages pass the interface check, and the escrow releases the holdback under the
  pre-agreed result and dispute procedure. The venture packages the signed protocol, test evidence, and release
  instruction into a procurement record that can be reused for later packages. It does not certify fusion safety,
  guarantee plant completion, or insure the technical performance of the whole facility.
goToMarketSeed:
  firstCustomer: "A funded fusion-plant integrator with a bespoke supplier network, a project director accountable for package integration, and a linked package pair whose acceptance terms have not yet been locked; Type One Energy's Project Infinity is a relevant target account if such a pair is available."
  buyingTrigger: "A project is preparing supplier awards or a design-freeze gate and needs to define how interdependent packages will be accepted before long-lead orders are committed."
  currentAlternative: "Individually negotiated supplier milestones, package-level factory acceptance records, EPC or in-house quality oversight, and project-specific change orders when compatibility issues surface."
  switchingReason: "It gives the integrator a neutral, pre-agreed way to test a supplier handoff and release a bounded holdback without waiting for whole-plant commissioning or relying on a status dashboard."
  pricingHypothesis: "Charge a fixed protocol-design fee per linked package pair plus a per-test independent-verification and escrow-administration fee, with escrow custody handled by a qualified third party."
