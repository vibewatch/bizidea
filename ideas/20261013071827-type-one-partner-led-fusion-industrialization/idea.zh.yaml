ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "它把授标前接口验收和买方出资的托管放款结合起来，让不同供应商之间的兼容性——而非单个供应商的进度报告——成为付款触发条件。"
  venturePotential:
    score: 3
    rationale: "可重复使用的合同和验证服务有望扩展到更多聚变项目及其他首台套基础设施；但潜在客户数量、项目时间安排，以及客户是否愿意调整供应商条款，都尚未得到验证。"
  whiteSpace:
    score: 4
    rationale: "来源指出定制供应商带来的管控和集成问题，历史索引中也没有直接可比的聚变采购创意；成熟的 EPC 监督和托管做法仍是相邻替代方案。"
  painIntensity:
    score: 3
    rationale: "报道明确提到供应商管控和集成风险，但没有证据记录接口故障或付款纠纷，也没有量化延误成本。"
  wedgeClarity:
    score: 4
    rationale: "一组关联包件、一次可量化接口测试和一笔有上限的留置款，构成了具体的试点；不过采购时点和供应商同意都可能限制项目切入。"
  evidenceFit:
    score: 3
    rationale: "融资、伙伴主导模式和报道中的集成风险都与这一创意相符，但没有来源验证托管验收的需求，也没有证据证明某个具体包件边界可供测试。"
topRisks:
  - name: 供应商抵触
    description: "供应商可能拒绝将留置款与其无法完全控制的下游兼容性测试挂钩，导致参与意愿下降或投标条款变差。"
    mitigation: "为留置款设上限，在授标前明确供应商可控的测试条件和时限，并让两家供应商共同参与规程制定。"
  - name: 接口难以测试
    description: "有些包件交互只有安装后或在电站运行条件下才会显现，工厂测试可能无法复现。"
    mitigation: "只从能在安装前进行可量化测试的接口入手，并明确说明验收不代表认证了全厂表现。"
  - name: 合同采纳缓慢
    description: "聚变采购尚处早期且因项目而异，法律审查、托管安排和定制规程可能耗时过长，服务收入未必覆盖投入。"
    mitigation: "先用一份标准的有上限留置款模板试点一组包件，并采用现有的独立托管服务商，不要自建受监管的资金保管或保险业务。"
