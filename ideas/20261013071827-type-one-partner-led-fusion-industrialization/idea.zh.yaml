problem: >-
  聚变开发商依托产业伙伴，可以不必从头搭建完整的制造体系；但定制供应商包件必须协同工作，系统层面的成败仍由开发商负责。报道提到的供应商管控和集成风险说明，单个供应商各自完成里程碑，未必能证明包件交界处彼此兼容。现有来源并未证实已发生付款纠纷，也没有证明买方需要托管服务，因此商业痛点和买方接受这种合同安排的意愿都仍是假设，有待验证。
targetUser:
  primary: "在首台套电站中担任总集成方、并采购定制供应商包件的私营聚变开发商，其采购和系统集成负责人。"
  secondary: "为聚变电站交付相互依赖包件的制造商中，负责供应商质量和技术验收的负责人。"
  buyer: "有权决定供应商合同和里程碑付款的聚变开发商项目总监或 COO。"
startupThesis:
  nonObviousInsight: >-
    伙伴主导的电站不只需要掌握供应商情况，还必须明确谁负责供应商之间的接口。若在下采购订单前就约定可量化的接口测试及证据要求，只需暂留少量尾款，就能把跨供应商兼容性变成可付款的验收节点，而不是拖到调试阶段才争论。
  beachhead: >-
    从获得资金支持、采用定制供应商网络的首台套聚变项目切入；先找一组尚未授标、在可量化技术接口处相连的包件，并要求项目团队愿意在发出采购订单前谈妥验收条款。
  wedge: >-
    为一组相互关联的供应商包件设计接口验收合同：定义边界测试、安排独立见证，再由第三方托管服务商管理买方出资的限额尾款留置款。
  whyNowCatalyst: >-
    Type One Energy 的 $200 million B 轮融资将支持一台明确命名的原型机，以及其合作伙伴主导的 FusionDirect 模式下规划中的商用电站；报道也指出，其定制供应商网络存在供应商管控和集成风险。这把一个值得及时思考的设计问题摆到了采购团队面前，但并不证明某个包件已准备就绪，也不代表有人已经提出购买这项服务。
  ventureScalePath: >-
    将接口测试条款和验收记录标准化，覆盖更多包件和项目，再把可重复使用的合同与验证服务卖给其他聚变开发商。若这套规程在聚变以外也管用，就拓展到同样面临多供应商集成风险的能源和工业领域其他首台套项目；但不承保电站表现，也不接管设备所有权。
solution: >-
  在确定有关联的供应商包件之前，团队先梳理其中一个可量化接口，再与两家供应商和聚变总集成方共同拟定边界清晰的验收规程，写明测试条件、所需证据、复测上限；若下游测试延迟，则启用时限明确的备用方案。买方将一笔设有上限的尾款交由独立托管服务商保管，供应商的常规进度款另行支付。独立测试或检验伙伴记录双方约定的包件是否通过接口检查，托管机构再按事先约定的结果和争议处理程序释放留置款。团队把签署后的规程、测试证据和放款指令整理成采购记录，供后续包件复用。这项服务不认证聚变安全，不保证电站完工，也不为整个设施的技术表现承保。
goToMarketSeed:
  firstCustomer: "获得资金支持、采用定制供应商网络的聚变电站总集成方；其项目总监须对包件集成负责，并有一组验收条款尚未敲定的关联包件。若 Type One Energy 的 Project Infinity 有这样的包件组合，它就是相关目标客户。"
  buyingTrigger: "项目即将授予供应商合同或进入设计冻结关口，需要在承诺下达长周期订单前，明确如何验收相互依赖的包件。"
  currentAlternative: "分别协商供应商里程碑、使用包件级工厂验收记录、依靠 EPC 或内部质量监督；一旦出现兼容问题，再按具体项目协商变更单。"
  switchingReason: "总集成方可用中立且事先约定的方式测试供应商交接，并释放有上限的留置款，无须等到全厂调试，也不必依赖状态仪表盘。"
  pricingHypothesis: "按每组关联包件收取固定的规程设计费，再按测试收取独立验证费和托管管理费；托管资金由合格的第三方保管。"
