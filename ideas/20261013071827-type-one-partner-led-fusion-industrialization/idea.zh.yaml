differentiator: >-
  供应商门户和项目仪表盘可以追踪文件或进度，却不会把跨公司接口测试设为明确的付款触发条件。本项目把授标前的测试设计、独立证据和买方出资的托管付款结合起来，同时将设备、托管本金和电站层面的表现风险留给现有项目各方。
conceptDiagram:
  title: 接口测试通过后释放供应商留置款
  mermaid: |
    flowchart LR
      Integrator[Fusion project integrator] --> Packages[Linked supplier packages]
      Packages --> Protocol[Pre-agreed interface test]
      Integrator --> Escrow[Buyer-funded payment holdback]
      Protocol --> Witness[Independent test witness]
      Witness --> Evidence[Signed acceptance evidence]
      Evidence --> Escrow
      Escrow --> Supplier[Supplier receives released holdback]
