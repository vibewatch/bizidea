slug: fusion-interface-acceptance-escrow
date: 2026-10-13
currency: USD
modelStartMonth: 2026-10
assumptions:
  - id: A1
    name: Model start and opening cash
    value: "2026-10; $0K cash before the pre-seed proceeds"
    unit: "month and USD thousands"
    source: "[Business-plan date; startup-finance planning convention: model from the first funded month]"
  - id: A2
    name: Pre-seed financing proceeds
    value: "1380"
    unit: "USD thousands, received in M1"
    source: "[BP fundingAsk target range $1.0-1.5M; calculated as $1,034K of first-24-month gross operating costs + $300K six-month reserve + $46K contingency]"
  - id: A3
    name: Revenue unit and customer definition
    value: "One customer unit is one paid, completed supplier-pair engagement; it is not a distinct integrator account or a recurring subscription"
    unit: "definition"
    source: "[BP businessModel.unitOfValue and GTM pricing; modelling convention for bespoke services]"
  - id: A4
    name: Fee per completed pair
    value: "50"
    unit: "USD thousands, one-time fee per pair"
    source: "[BP GTM pricing $25K-$50K per pair and research.yaml market sizing assumption of $50K; upper end of an unvalidated range]"
  - id: A5
    name: Base paid-pair volume and timing
    value: "1 in Y1 (M12); 3 in Y2 (Q2-Q4, one per quarter); 5 in Y3 (Q1-Q3 one per quarter, Q4 two)"
    unit: "completed paid pair engagements"
    source: "[BP month-9 paid-pilot gate, month-18 repeat milestone, and 3-5 year SOM of 12 cumulative pairs; unvalidated planning ramp, not contracted pipeline]"
  - id: A6
    name: Revenue recognition and EOP customer count
    value: "Recognize the full fixed fee when the paid protocol reaches documented acceptance or dispute disposition; customersEop is cumulative completed paid-pair engagements and newCustomers is the period's completed engagements"
    unit: "one-time services accounting convention"
    source: "[BP unitOfValue and twelve-month pilot milestone; model convention for fixed-fee project services]"
  - id: A7
    name: Cash collection timing
    value: "100"
    unit: "percent of recognized fees collected in the same month or quarter"
    source: "[Startup finance heuristic: conservative simple cash model assumes collection on documented completion; actual buyer payment terms are unverified and stressed separately]"
  - id: A8
    name: Base staffing plan
    value: "2 founders from M1-M12; 1 workflow engineer starts M13; 3 total FTE through M36; counsel and test/escrow partners remain fractional or project-specific external providers"
    unit: "full-time equivalent staffing plan"
    source: "[BP team and sequencingRationale; no product-platform build before the first paid pilot, with no further full-time hires before repeat demand]"
  - id: A9
    name: CEO and commercial founder cash salary
    value: "120"
    unit: "USD thousands per year, before payroll burden"
    source: "[Lean Pre-seed Compensation Planning Heuristic, internal operating estimate; not a researched market benchmark]"
  - id: A10
    name: Founding systems-integration engineer cash salary
    value: "150"
    unit: "USD thousands per year, before payroll burden"
    source: "[Lean Pre-seed Compensation Planning Heuristic, internal operating estimate; role follows BP team plan]"
  - id: A11
    name: Product and workflow engineer cash salary
    value: "140"
    unit: "USD thousands per year, before payroll burden"
    source: "[Lean Pre-seed Compensation Planning Heuristic, internal operating estimate; hire only after first paid pilot]"
  - id: A12
    name: Employer payroll taxes and benefits load
    value: "20"
    unit: "percent of base salary"
    source: "[Lean Pre-seed Compensation Planning Heuristic, internal planning allowance; not a jurisdiction-specific payroll quote]"
  - id: A13
    name: Loaded annual payroll roll-up
    value: "CEO 144; founding engineer 180; workflow engineer 168; total 324 through Y1 and 492 from M13"
    unit: "USD thousands annualized"
    source: "[Calculated from A8-A12; loaded payroll equals salary plus the 20% employer burden]"
  - id: A14
    name: Direct delivery payroll allocated to COGS
    value: "10"
    unit: "USD thousands per completed pair"
    source: "[BP 70% target gross margin translated into a transparent project labor allocation; operator estimate for direct protocol delivery hours, not observed utilization]"
  - id: A15
    name: Other direct delivery cash cost
    value: "5"
    unit: "USD thousands per completed pair"
    source: "[Lean Services Startup Costing Heuristic, internal estimate for project-specific travel and delivery administration; excludes third-party inspection, test and escrow charges]"
  - id: A16
    name: Base direct COGS and target gross margin
    value: "15 total COGS per $50K pair; 70% gross margin"
    unit: "USD thousands and percent"
    source: "[BP businessModel.targetGrossMarginPct; A14 plus A15 gives $15K direct cost, consistent with the 70% target at the unvalidated $50K fee]"
  - id: A17
    name: Escrow principal and third-party test pass-throughs
    value: "0"
    unit: "USD thousands included in startup revenue or COGS"
    source: "[BP solution and businessModel.unitOfValue; funds stay with qualified escrow provider and separately contracted testing is outside startup revenue and expense]"
  - id: A18
    name: Y1 non-payroll operating budget
    value: "Sales and marketing 2.0 per month; R&D 1.0 per month; G&A 4.5 per month"
    unit: "USD thousands per month"
    source: "[Lean Services Startup Costing Heuristic, internal estimate for founder-led account sales, basic workflow tools, outside counsel, insurance and administration]"
  - id: A19
    name: Y2 non-payroll operating budget
    value: "Sales and marketing 3.0 per month; R&D 2.0 per month; G&A 4.0 per month"
    unit: "USD thousands per month"
    source: "[Lean Services Startup Costing Heuristic, internal estimate; modest travel and workflow support after the pilot, without a broad software build]"
  - id: A20
    name: Y3 non-payroll operating budget
    value: "Sales and marketing 4.0 per month; R&D 2.0 per month; G&A 4.0 per month"
    unit: "USD thousands per month"
    source: "[Lean Services Startup Costing Heuristic, internal estimate; founder-led sales and limited workflow tooling retained]"
  - id: A21
    name: CEO acquisition-time allocation for CAC
    value: "35"
    unit: "percent of loaded CEO payroll"
    source: "[Lean Services Startup Costing Heuristic, internal unit-economics allocation for founder-led selling; memo allocation only, not an incremental payroll expense]"
  - id: A22
    name: Qualified-prospect-to-cash cycle
    value: "12"
    unit: "months"
    source: "[BP month-9 paid-pilot target plus month-12 test/evidence milestone; planning estimate for long multi-party procurement, not measured cycle data]"
  - id: A23
    name: One-time engagement lifetime proxy
    value: "100 monthly churn; 1 average customer-life month"
    unit: "percent and months"
    source: "[Modelling convention: each customer unit is a completed one-time engagement; the SaaS-style churn fields are mechanical placeholders and are not renewal metrics]"
  - id: A24
    name: Cash-flow scope
    value: "No debt, interest, tax, D&A, capitalized software, capex, or working-capital change; same-period payroll and operating expenses are paid in cash"
    unit: "cash-model convention"
    source: "[Lean Services Startup Costing Heuristic; no upstream evidence supports leverage, tax expense, capitalized software or receivables]"
  - id: A25
    name: Milestone runway
    value: "18-month proof milestone plus 6-month cash buffer equals 24 months"
    unit: "months"
    source: "[BP fundingAsk.runwayMonths of 18 and BP pre-seed proof-cycle description; funding model adds the requested six-month buffer]"
  - id: A26
    name: First-24-month gross operating cost envelope
    value: "1034"
    unit: "USD thousands"
    source: "[Calculated from A8-A20: $816K loaded payroll + $198K non-payroll operating costs + $20K other direct delivery cash costs; direct delivery payroll is already in loaded payroll]"
  - id: A27
    name: Six-month cash reserve
    value: "300"
    unit: "USD thousands"
    source: "[Startup finance heuristic: 6 months multiplied by $50K monthly post-hire gross fixed cash cost ($41K loaded payroll + $9K Y2 non-payroll spend)]"
  - id: A28
    name: Legal, escrow and data-control contingency
    value: "46"
    unit: "USD thousands"
    source: "[Operator planning allowance for unquoted counsel, jurisdiction, export-control and procurement delays identified in BP and research; not a vendor quote]"
  - id: A29
    name: Downside completed paid-pair volume
    value: "0 in Y1; 1 in Y2; 2 in Y3"
    unit: "completed paid pair engagements"
    source: "[BP kill criteria and research demand gaps; downside case assumes the first paid pilot slips and only limited later conversion]"
  - id: A30
    name: Downside paid-pair fee
    value: "40"
    unit: "USD thousands per pair"
    source: "[BP pilot range of $25K-$50K; stress case below the $50K base rate while remaining within the proposed range]"
  - id: A31
    name: Downside hiring response
    value: "Keep 2 founders; do not hire the workflow engineer through M36"
    unit: "full-time equivalent staffing plan"
    source: "[BP month-9 kill criterion and instruction to freeze hiring if no paid pilot; downside applies a cash-preserving hiring freeze]"
  - id: A32
    name: Downside non-payroll operating spend
    value: "90 in Y1; 85 in Y2; 75 in Y3"
    unit: "USD thousands per year"
    source: "[Lean Services Startup Costing Heuristic; downside reduces discretionary travel and product/tool spending after the hiring gate]"
  - id: A33
    name: Downside direct cost per pair
    value: "12 total, comprising 8 allocated delivery payroll and 4 other direct cash cost"
    unit: "USD thousands per pair"
    source: "[Downside stress against A14-A16; preserves a 70% unit gross margin at the $40K downside fee]"
  - id: A34
    name: Upside completed paid-pair volume
    value: "1 in Y1; 4 in Y2; 7 in Y3"
    unit: "completed paid pair engagements"
    source: "[BP cumulative SOM of 12 paid pairs across 3-5 years; accelerated conversion case remains below that cumulative target by the end of Y3]"
  - id: A35
    name: Fee sensitivity range
    value: "25 downside; 50 base; 50 upside"
    unit: "USD thousands per pair"
    source: "[BP pilot pricing range and research $50K-per-pair sizing assumption; no above-range pricing upside is assumed]"
  - id: A36
    name: Other delivery-cost sensitivity
    value: "15 downside; 5 base; 0 upside"
    unit: "USD thousands of non-payroll cash cost per pair"
    source: "[Stress around A15; third-party test, witness and escrow provider costs remain excluded pass-throughs in every case]"
  - id: A37
    name: Collection-delay sensitivity
    value: "90"
    unit: "days of delay on two Q4Y3 fees"
    source: "[Startup finance heuristic stress case for enterprise procurement payment terms; no public payment term for this offer is validated]"
  - id: A38
    name: Hiring-timing sensitivity
    value: "M10 downside; M13 base; M25 upside; loaded workflow-engineer payroll 168 per year"
    unit: "month and USD thousands annualized"
    source: "[BP product/workflow engineer start after the first paid pilot, no earlier than M9; salary follows A11-A13]"
  - id: A39
    name: Funding-use allocation
    value: "Engineering 600000; GTM 270000; G&A 210000; six-month buffer 300000"
    unit: "whole USD"
    source: "[Operator allocation of the $1.38M ask; operating buckets include the $46K contingency in A28, and the reserve equals A27]"
