modelSanity:
  - checkName: Revenue engine
    finding: "Base revenue is one $50K fee per completed pair, rising from one engagement in Y1 to three in Y2 and five in Y3, with escrow principal and third-party testing excluded."
  - checkName: Must go right
    finding: "The M12 pilot must convert to repeat work and a second buyer by the M18 proof gate for the base case to reach nine cumulative engagements and $28.8K blended CAC per pair."
  - checkName: Model breaks if
    finding: "If Y3 volume falls from five paid pairs to two, sensitivity shows $150K less Y3 revenue and $135K less cash before any further customer or supplier rejection."
  - checkName: Next-round proof
    finding: "Before base-case cash declines to $159K at Y3 end, show repeat paid protocols at a second integrator and validate the 70% direct gross-margin target."
sanityChecks:
  ruleOf40: "Y3 service-revenue growth 66.7% + EBITDA margin -154.8% = -88.1%; directional only because revenue is episodic and the base is small."
  burnMultiple: "Y3 EBITDA burn of $387K divided by $100K incremental annual service revenue equals 3.9x; not an ARR-based SaaS burn multiple."
  revenuePerFte: "Y3 revenue of $250K divided by 3.0 year-end FTE equals $83.3K per FTE; this reflects low-utilization validation work, not a scaled steady state."
  flags:
    - "No paid demand, eligible test pair, supplier consent, or willingness to pay is validated; base volumes are operator hypotheses, not contracted pipeline."
    - "The $50K fee is the top of the BP and research sizing range, and revenue is one-time project work rather than recurring SaaS."
    - "Base cash falls to $159K by Y3 end, below the $300K six-month reserve; arrange follow-on financing or freeze hiring and discretionary spend before then."
    - "Base EBITDA remains negative in Y3 and revenue per FTE is only $83.3K; venture-scale economics and repeatability are not established."
    - "Blended CAC of $28.8K per pair is only narrowly below the one-engagement gross profit of $35K, producing 1.2x LTV/CAC before any unproven repeat-pair value."
    - "The 70% gross margin depends on limiting direct internal delivery labor to $10K and other direct cash cost to $5K per pair; bespoke legal and delivery effort may exceed both."
