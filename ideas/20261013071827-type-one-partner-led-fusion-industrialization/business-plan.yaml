slug: fusion-interface-acceptance-escrow
date: 2026-10-13
executiveSummary: >-
  Fusion developers that outsource bespoke packages still own the integration result, and the researched Type One
  Energy example makes supplier-control and interface work concrete. The proposed company sells a pre-award,
  jointly authored acceptance protocol for one linked supplier pair, then coordinates independent evidence and a
  capped buyer-funded holdback held by a qualified escrow provider. This is a narrow services wedge, not a claim
  that escrow, acceptance testing, or project controls are novel, and it does not certify or insure whole-plant
  performance. The first account is a funded fusion integrator such as Type One only if it has an unawarded,
  measurable package boundary; the sources establish neither that package nor demand for this service. AECOM,
  internal supplier teams, DNV, Aconex, conventional retention, and general escrow are credible substitutes, so
  the venture must prove neutral boundary-test design and supplier consent rather than sell a portal. Research
  models a $26.5M cumulative first-build-wave TAM, $5.6M US-Europe SAM, and $0.6M initial SOM using unvalidated
  interface counts and $50,000-per-pair fees; none is annual recurring revenue. The recommended pre-seed plan
  funds an 18-month proof cycle with a small engineering-led team, outsourced testing and custody, and no
  software-platform build before a paid pilot. Investor stance is Watch until an integrator and both suppliers
  accept a paid, bounded test-and-payment protocol.
problem:
  - >-
    Partner-led fusion reduces the need to recreate manufacturing capacity in-house but leaves the integrator
    accountable for whether bespoke packages work together; research documents this exposure, not a quantified
    interface failure or payment dispute.
  - >-
    Package-level factory acceptance records and project controls may not establish who owns a cross-vendor
    boundary test, what evidence is sufficient, or how a bounded final payment is handled when results are late,
    inconclusive, or disputed.
  - >-
    The buyer may already have an owner-engineer, internal supplier-quality team, inspection firm, and Aconex
    workflow, so incremental budget and switching need remain unproven.
solution:
  - >-
    Before linked packages are awarded, map one measurable boundary with the integrator and both suppliers and
    agree test conditions, pass/fail limits, evidence, retests, deadlines, and a time-bound fallback.
  - >-
    Coordinate an independent witness and a versioned acceptance record; route only a capped, buyer-funded
    holdback through a qualified third-party escrow provider under counsel-reviewed instructions.
  - >-
    Keep ordinary progress payments, escrow custody, equipment performance, plant completion, and regulatory
    certification outside the startup's responsibility.
whyWeWin:
  - >-
    The differentiated unit is a jointly negotiated, pre-award test between two supplier packages linked to
    independent evidence and a capped release instruction; no fetched source documents a fusion-specific provider
    packaging all three, though uniqueness is not established.
  - >-
    AECOM-style engineering can own integration and interface management, DNV-style inspection can witness
    supplier work, Aconex can route records, and general escrow can hold funds. The venture wins only where the
    buyer needs a neutral party to author the boundary protocol and connect the evidence to payment.
  - >-
    Familiar test frameworks and commercially available escrow reduce the need to invent infrastructure; the
    defensible advantage, if earned, is repeatable protocol design, supplier trust, and permissioned evidence on
    how boundary tests and disputes resolve.
strategicChoices:
  beachhead: >-
    A funded US first-of-kind fusion integrator buying bespoke packages, with one not-yet-awarded pair that meets
    at an objective, vendor-accessible boundary test and a project director able to change purchase-order terms.
    Type One Energy's Project Infinity is a target account only if such a pair is identified.
  wedgeRationale: >-
    One pre-award package pair limits technical and legal scope, allows all three commercial parties to agree
    before long-lead commitments, and can produce evidence before whole-plant commissioning. It tests the central
    thesis faster than a broad supplier dashboard or plant-wide quality platform.
  sequencingRationale: >-
    First qualify a real boundary and test, then obtain buyer-and-supplier acceptance of terms, then run a paid
    pilot with existing escrow and inspection partners. Hire for engineering and commercial execution first;
    standardize clauses only after a live result, and add software only if repeated paid protocols expose a
    recurring workflow bottleneck.
  notYet:
    - "No general fusion procurement portal, supplier marketplace, or broad project-controls system."
    - "No custody of client funds, insurance, plant-performance guarantee, safety certification, or whole-facility acceptance."
    - "No non-fusion energy or industrial vertical until at least two unrelated fusion buyers repeat paid use."
    - "No multi-package rollout before one pair demonstrates an objective test, supplier consent, and fair dispute handling."
market:
  tam: >-
    $26.5M cumulative first-build-wave service estimate, not annual revenue: 53 FIA survey respondents multiplied
    by assumed one eligible program, 10 serviceable pairs, and $50,000 per pair. The broad company count,
    interface count, eligibility, and fee are not validated buyer demand; escrow principal is excluded.
  sam: >-
    $5.6M cumulative US-Europe estimate: 42 reported US and European companies, reduced by an assumed one-third
    to 14 funded eligible buyers, then 8 pairs each at an assumed $50,000 per pair. This is a planning pool, not
    an annual market or verified account list.
  som: >-
    $0.6M cumulative 3–5 year initial capture scenario: 3 programs times 4 paid pairs each at an assumed
    $50,000 per pair. This is neither a forecast nor recurring revenue and depends on three wins and repeatable
    testable interfaces.
  segments:
    - "Primary: funded fusion developers acting as prime integrators for first-of-kind plants with bespoke supplier packages."
    - "Secondary: package suppliers and independent engineering or inspection partners participating in a buyer-led interface test."
  buyingProcess: >-
    The project director, COO, or procurement executive must authorize a separate protocol fee and amend supplier
    terms before package award or design freeze; engineering, supplier quality, both vendors, finance, and counsel
    must agree to test evidence and release rules. Research identifies these functions and a suitable trigger, but
    does not establish the budget owner, procurement duration, or approval path for this offer.
product:
  mvp: >-
    Deliver a managed protocol for one linked pair: interface map, test method and acceptance limits, supplier
    redlines, retest and timeout rules, evidence checklist, and escrow-release instructions. Use an existing
    independent witness and escrow provider; a version-controlled document pack is sufficient for the pilot.
  sixMonth: >-
    Complete account discovery and one tabletop protocol review against actual drawings or interface records;
    sign a paid pilot only after buyer, both suppliers, witness, and escrow provider approve the bounded workflow.
  twelveMonth: >-
    Run or dry-run the first witnessed pre-installation test when package schedules permit, document the release
    or dispute outcome, and measure delivery effort and direct costs against the $50,000-per-pair pricing
    hypothesis.
  twentyFourMonth: >-
    Repeat the protocol on additional pairs and at a second fusion integrator only if the first pilot converts;
    automate template versioning and evidence routing only where repeated paid work demonstrates avoidable effort.
  keyBets:
    - "At least one funded integrator has an unawarded pair with a measurable test before site installation."
    - "A neutral, bounded test can be fair to both vendors even where the packages are interdependent."
    - "Buyers will pay separately for protocol design and evidence rather than absorb the task into an engineering partner or internal team."
    - "Test clauses and evidence formats can be reused enough to improve delivery margin without exposing confidential or export-controlled data."
gtm:
  wedge: >-
    Sell the first paid interface-acceptance pilot to the project director or procurement lead before a linked
    package award; qualify both suppliers and the test boundary before proposing escrow.
  channels:
    - "Founder-led direct account selling to project directors, systems-integration leads, procurement, and supplier-quality teams at funded fusion developers."
    - "Referrals or subcontracting through owner-engineers already handling interface management, provided the startup's neutral protocol scope is explicit."
    - "Co-delivery with independent inspection firms and a qualified escrow provider; the startup owns protocol design and orchestration, not custody."
  funnelTargets: >-
    Planning targets, not observed conversion: approach 10 qualified program prospects, identify at least 3
    document-backed candidate pairs, obtain 2 joint supplier protocol reviews, and close 1 paid pilot; by month
    18, convert that pilot to a second paid pair or secure a second buyer.
  pricing: >-
    Test a fixed $25,000–$50,000 paid pilot per linked pair for interface mapping, protocol negotiation, and
    evidence/release coordination; use $50,000 per pair as the research sizing assumption, not a validated rate.
    Quote independent testing and escrow-provider charges separately or as transparent pass-throughs. Offer
    portfolio retainers only after repeat demand; do not charge on escrow principal or take custody.
businessModel:
  revenueStreams:
    - "Fixed fee for interface mapping and acceptance-protocol design per linked package pair."
    - "Per-test fee for independent-witness coordination, evidence package, and escrow-release administration."
    - "Multi-pair project retainer only after a buyer has paid for and repeated a pilot."
  unitOfValue: >-
    One eligible supplier-pair boundary reaching a pre-agreed, evidence-backed acceptance or dispute disposition;
    the buyer pays the startup's service fee while escrow principal and separately contracted testing remain outside revenue.
  targetGrossMarginPct: 70
  expansionLevers:
    - "Repeat interfaces within the same fusion program using approved clauses and evidence templates."
    - "Second and subsequent funded fusion integrators reached through project-engineering, inspection, and escrow referrals."
    - "Adjacent first-of-kind energy or industrial projects only after repeat fusion purchases validate transferability."
strategyMap:
  northStarMetric: "Paid interface pairs reaching a documented acceptance or dispute disposition before site integration, with no unresolved escrow-release dispute."
  inputMetrics:
    - "Qualified funded programs with an unawarded, measurable interface pair and named economic buyer."
    - "Share of candidate pairs for which both suppliers review test limits, witness access, and retest terms."
    - "Days from buyer qualification to signed paid pilot and from test evidence to release instruction."
    - "Pilot-to-repeat-pair conversion and direct delivery hours per pair."
  moatsToBuild:
    - "Versioned interface clauses and protocol templates linked to test methods, evidence requirements, retests, and outcomes."
    - "Trusted working relationships among integrators, participating suppliers, independent witnesses, and escrow providers."
    - "Permissioned, normalized test and dispute outcomes; do not claim a data moat until multiple designs produce comparable reusable evidence."
  killCriteria:
    - "Within 90 days, no funded integrator will provide a real candidate interface and test records for qualification; stop the escrow-led wedge rather than build a generic portal."
    - "After three joint protocol redline attempts, no buyer and both suppliers accept a capped holdback with vendor-controllable criteria; remove escrow as the core mechanism or stop."
    - "After at least 10 qualified program conversations, no signed paid pilot by month 9; freeze hiring and reassess buyer, fee, or service scope before further capital."
    - "By month 18, no repeat paid pair and projected service gross margin remains below 50% after direct engineering and partner costs; do not finance a software scale-up."
  mermaid: |
    flowchart LR
      Buyer[Funded fusion integrator] --> Pair[One unawarded supplier pair]
      Pair --> Protocol[Joint measurable interface protocol]
      Protocol --> Witness[Independent witnessed test]
      Buyer --> Escrow[ Capped holdback at third-party escrow ]
      Witness --> Evidence[Evidence and release instruction]
      Evidence --> Escrow
      Escrow --> Proof[Paid acceptance or dispute disposition]
      Proof --> Repeat[Repeat pair and second integrator]
      Repeat --> Templates[Reusable protocol library]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low: the operational context is real, but no buyer, supplier, package pair, or willingness to pay has been validated."
    whyBelieve: >-
      Funded partner-led fusion programs, awarded manufacturing work, and a documented systems-integration
      scope make a pre-award supplier-boundary workflow a plausible problem to investigate.
    whyDoubt: >-
      Research found no purchase intent, measured interface-loss cost, supplier acceptance of a holdback, or
      named testable pair; the modeled fusion-only SOM is just $0.6M cumulative and incumbents can bundle substitutes.
    nextDiligence: >-
      Obtain an actual interface record and pre-award schedule from one funded integrator, then secure redlined
      terms from its buyer and both suppliers for a paid, independently witnessed pilot.
  firstCustomer:
    title: "Project director at a funded US fusion developer acting as prime integrator"
    profile: >-
      A first-of-kind plant team is buying bespoke packages, controls supplier integration internally or through
      an owner-engineer, and has one interdependent pair not yet locked by purchase orders; Type One is relevant
      only if its team confirms that exact condition.
    trigger: "A supplier award or design-freeze gate is imminent and the project must define acceptance before long-lead commitments."
    buyer: "Project director or COO with authority over supplier contract terms and holdback approval; exact budget owner is unverified."
    initialContract: >-
      Hypothesis: a $25,000–$50,000 paid single-pair pilot for mapping, joint protocol, tabletop or witnessed
      test coordination, and release documentation, followed by per-pair fees if the first protocol is accepted
      and the next interface is separately authorized. Test and escrow-provider charges are separate.
  mustBeTrue:
    - "Within 90 days, at least one funded fusion integrator supplies records for an unawarded pair with a repeatable, pre-installation pass/fail test."
    - "At least one economic buyer signs a $25,000–$50,000 pilot contract rather than assigning the work wholly to an existing engineering, inspection, or internal team."
    - "For one real pair, both suppliers accept a capped holdback, witness access, vendor-controllable test conditions, retests, and a time-bound delay/dispute fallback in writing."
    - "An independent witness can produce decision-grade evidence before site integration, and the parties can apply the agreed release rule without an unresolved dispute."
    - "Within 24 months, at least two unrelated fusion integrators pay for repeat interfaces at economics consistent with a 70% service gross-margin target; otherwise the researched fusion-only market does not support venture-scale investment."
  diligenceQuestions:
    - "Which funded integrator has an unawarded supplier pair, and what actual interface-control document, test window, and purchase-order gate define it?"
    - "Who can approve the fee and amend the purchase orders, and which current engineering or project-controls scope would otherwise own this work?"
    - "Will both suppliers sign the proposed cap and test terms when the acceptance outcome depends partly on another package?"
    - "What objective pre-installation test can the witness perform, and how are inconclusive results, downstream delays, design changes, and retests resolved?"
    - "What rework, delay, or dispute cost does the buyer expect to avoid, and does a paid pilot show a budget separate from existing EPC or in-house spend?"
    - "Can counsel and a qualified escrow provider execute the fund flow and evidence handling under the relevant jurisdiction, confidentiality, and export-control constraints?"
operatingAssumptions:
  - assumption: "A funded fusion integrator has at least one not-yet-awarded package pair with a measurable, vendor-accessible test before installation."
    basis: "research.yaml"
    validationTest: "Within 90 days, review an actual interface record, drawings, test window, and purchase-order schedule with an integrator and both package owners."
    decisionImpact: "If no such pair exists, do not build an escrow workflow; stop or test a narrower protocol-only service at a future procurement gate."
  - assumption: "Both suppliers will accept a capped holdback when ordinary progress payments remain intact and test conditions are within their control."
    basis: "research.yaml"
    validationTest: "Obtain a buyer-approved, supplier-redlined term sheet that names the cap, evidence, witness, retest rights, timeout, and dispute route."
    decisionImpact: "If suppliers reject the mechanism after three joint redline attempts, abandon escrow as the wedge or stop rather than disguise the offer as a dashboard."
  - assumption: "A buyer will pay $25,000–$50,000 for a single-pair pilot, with $50,000 per pair a plausible repeat fee."
    basis: "operator judgment"
    validationTest: "Submit a scoped proposal against the buyer's current engineering, inspection, and project-controls scopes and require a signed paid pilot; verbal interest does not pass."
    decisionImpact: "If no incremental budget exists, reprice or subcontract only if paid demand remains; otherwise the service lacks a standalone business model."
  - assumption: "The company can achieve a 70% service gross-margin target without performing inspections itself or holding client funds."
    basis: "operator judgment"
    validationTest: "Track founder and employee delivery hours, counsel, inspection, escrow coordination, and travel on the first two paid pairs, excluding escrow principal and separately passed-through testing."
    decisionImpact: "If direct effort keeps gross margin below 50% by month 18, stop hiring for software scale and reassess whether this is a viable specialist consultancy."
  - assumption: "A paid pilot can be signed within the 18-month pre-seed runway despite project-specific procurement and legal review."
    basis: "operator judgment"
    validationTest: "Track dated milestones from first buyer meeting through supplier redlines and purchase-order approval; require a signed paid pilot by month 9 after at least 10 qualified conversations."
    decisionImpact: "If the threshold fails, freeze hiring and capital deployment until a buyer-backed procurement window is documented."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Interview project directors, systems-integration, procurement, and supplier-quality leads at Type One and at least two other funded fusion developers; qualify actual pair candidates rather than company-level interest."
    hypothesis: "At least one team has an upcoming supplier award where a pre-installation cross-vendor test can be specified."
    successMetric: "One document-backed candidate pair with a named buyer, both package owners, test window, and purchase-order gate."
    owner: "CEO / commercial founder"
  - horizon: "0–90 days"
    experiment: "Have buyer counsel, both vendors, and an independent inspection partner redline a capped-holdback term sheet with retest, timeout, and dispute rules."
    hypothesis: "Suppliers will participate when the holdback is limited and criteria are vendor-controllable."
    successMetric: "Written review from both suppliers and no unresolved objection to the acceptance boundary or payment-release process."
    owner: "Founding systems-integration engineer"
  - horizon: "3–6 months"
    experiment: "Run a tabletop or dry run against actual drawings and calibrated-measurement requirements with an independent witness and qualified escrow provider."
    hypothesis: "A repeatable pass/fail record can be produced before whole-plant commissioning without representing it as safety certification."
    successMetric: "Buyer, both suppliers, and witness approve a versioned protocol and evidence checklist; counsel/provider approve the proposed fund flow."
    owner: "Founding systems-integration engineer"
  - horizon: "3–9 months"
    experiment: "Offer a paid single-pair pilot to the qualified integrator and compare the scoped work with existing owner-engineer, QA, and project-controls obligations."
    hypothesis: "The buyer has incremental budget and will contract before the supplier award."
    successMetric: "One signed pilot contract in the $25,000–$50,000 hypothesis range by month 9, or an explicit no-budget finding."
    owner: "CEO / commercial founder"
  - horizon: "6–12 months"
    experiment: "Execute the first witnessed test when package readiness permits; use a tabletop only if the parties agree it is a valid pilot deliverable and do not claim plant acceptance."
    hypothesis: "The protocol can yield decision-grade evidence and a timely, non-disputed release instruction."
    successMetric: "Signed acceptance or documented dispute disposition; measure evidence-to-release time and actual direct delivery cost."
    owner: "Founding systems-integration engineer"
  - horizon: "12–18 months"
    experiment: "Offer a second paid interface to the pilot customer and seek one second integrator through an owner-engineer or inspection referral."
    hypothesis: "The protocol transfers to another package boundary and at least one customer repeats without bespoke redesign of the whole service."
    successMetric: "At least two additional paid pairs or a second buyer, with direct delivery economics trending to the 70% gross-margin target."
    owner: "CEO / commercial founder"
operations:
  - "Maintain version-controlled protocols that name boundary ownership, test conditions, instruments and calibration, access, acceptance limits, evidence, retests, and timeouts."
  - "Use independent inspection or engineering partners for witnessing and qualified third-party escrow providers for custody; contract counsel approves fund flow and dispute instructions."
  - "Integrate records into the buyer's existing interface-control and inspection-and-test-plan systems, including Aconex where used, rather than requiring a new project portal."
  - "Restrict access to confidential and export-controlled technical data, use project-specific permissions, and exclude regulatory certification and plant-level performance representations from all deliverables."
team:
  - role: "Founding systems-integration engineer"
    startTiming: "Month 0"
    rationale: "Own package-boundary qualification, testability, protocol authoring, independent witness coordination, and evidence quality; this is the core technical judgment the escrow vendor and document platform do not supply."
  - role: "CEO / commercial founder"
    startTiming: "Month 0"
    rationale: "Secure access to project directors, establish a paid pre-award pilot, negotiate buyer and supplier participation, and manage the slow multi-party contract process."
  - role: "Project-contract and escrow counsel"
    startTiming: "Month 0, fractional"
    rationale: "Review holdback terms, release instructions, jurisdiction, custody, disputes, confidentiality, and export-control boundaries; use outside counsel instead of building regulated custody capability."
  - role: "Independent test / inspection partner"
    startTiming: "Pilot-specific, from Month 3"
    rationale: "Provide calibrated, credible witnessing under a defined scope; subcontract per test until repeat volume justifies a deeper partnership."
  - role: "Product / workflow engineer"
    startTiming: "After first paid pilot, no earlier than Month 9"
    rationale: "Automate protocol versioning and evidence routing only after repeat work identifies a stable workflow and supports the hire."
milestones:
  - horizon: "0–12 months"
    items:
      - "Qualify one real, pre-award interface and complete joint technical and commercial review with buyer, both suppliers, and witness."
      - "Sign one paid pilot by month 9; if not achieved after 10 qualified buyer conversations, freeze hiring and reassess."
      - "Complete one witnessed or explicitly agreed tabletop test with a signed acceptance, release, or dispute record and measure direct delivery effort."
  - horizon: "12–24 months"
    items:
      - "Convert the first pilot to repeat paid work and sell additional pairs to a second fusion integrator only after the first protocol is accepted."
      - "Complete 3–5 cumulative paid interface-pair engagements across at least two buyers and test whether direct service gross margin can reach 70%."
      - "Standardize reusable clauses and evidence schemas while preserving project confidentiality and export-control separation."
  - horizon: "24–36 months"
    items:
      - "Test the research SOM scenario of three customer programs and up to four paid pairs per program; report realized cumulative fees, not annualized market size."
      - "Require repeat purchases from at least two unrelated integrators before hiring a dedicated product team or entering adjacent industrial markets."
      - "If repeat buyers or target unit economics fail, remain a small specialist service or stop rather than infer platform scale from sector funding."
risks:
  - risk: "Suppliers reject a holdback tied to an interface partly dependent on another vendor."
    likelihood: "High"
    impact: "High"
    mitigation: "Cap the holdback, preserve normal progress payments, set vendor-controllable limits, define retests and a delay fallback, and secure both suppliers' redlines before the buyer commits."
  - risk: "The candidate interface is observable only after installation or under plant operating conditions."
    likelihood: "High"
    impact: "High"
    mitigation: "Qualify only pairs with a documented, reproducible pre-installation test; reject interfaces whose result cannot fairly control an early payment."
  - risk: "Procurement and contract review take longer than the service can support."
    likelihood: "High"
    impact: "High"
    mitigation: "Sell before package award, use one standard capped-holdback template, set a month-9 paid-pilot gate, and delay nonessential hiring."
  - risk: "AECOM-style engineering partners, internal supplier teams, DNV, Aconex, or conventional retention bundle enough of the work."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Map existing scopes before pitching and charge only for the independent boundary protocol and payment-release evidence that the incumbent scope does not cover."
  - risk: "The fusion-only market is too small or too episodic for venture-scale returns."
    likelihood: "High"
    impact: "High"
    mitigation: "Treat TAM/SAM/SOM as cumulative assumptions, prove repeat purchases across unrelated fusion programs, and defer adjacent sectors until transferability is demonstrated."
  - risk: "Escrow, technical-data, export-control, or dispute rules create liability beyond the startup's scope."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Keep custody with a qualified provider, require counsel approval and project-specific controls, limit representations to agreed evidence, and do not certify safety or plant performance."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$1.0–1.5M"
  runwayMonths: 18
  useOfFundsSummary: >-
    Operator planning target, not a researched financing benchmark: 18 months to qualify and contract one paid
    interface pilot, pay for specialist counsel and independent test partners, measure direct delivery economics,
    and secure repeat demand from a second integrator. Keep the founding team small, defer a dedicated software
    build until after a paid pilot, and stop or re-scope at the stated month-9 and month-18 falsification gates.
