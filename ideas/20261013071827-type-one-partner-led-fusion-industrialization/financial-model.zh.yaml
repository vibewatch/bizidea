modelDiagram:
  title: 单位经济模型流程
  mermaid: |
    flowchart LR
      Lead[Funded integrator lead] --> Pair[Paid supplier-pair engagement]
      Pair --> Protocol[Joint acceptance protocol and evidence]
      Protocol --> Fee[One-time service fee]
      Fee --> COGS[Internal delivery cost]
      Fee --> GrossProfit[Gross profit]
      COGS --> GrossProfit
      GrossProfit --> Cash[Cash after payroll and operating expenses]
      Escrow[Third-party escrow principal] -. excluded .-> Outside[Outside startup revenue]
      Witness[Third-party test pass-through] -. excluded .-> Outside
modelSanity:
  - checkName: 收入来源
    finding: "基准情景每项已完成的配对项目收费 $50K，一次性计费；Y1 完成一项、Y2 三项、Y3 五项，不计托管本金和第三方测试。"
  - checkName: 必须跑通的环节
    finding: "M12 试点必须转化为重复业务，并在 M18 验证门槛前拿下第二家买方；基准情景才能累计完成九项，且每对综合 CAC 为 $28.8K。"
  - checkName: 模型失效条件
    finding: "若 Y3 付费配对项目从五对降至两对，敏感性分析显示 Y3 收入减少 $150K、现金减少 $135K；尚未计入客户或供应商进一步拒绝合作的影响。"
  - checkName: 下一轮融资前的验证
    finding: "基准情景现金降至 $159K 前，应在 Y3 年末证明第二家集成商愿意为该协议重复付费，并验证 70% 的直接毛利率目标。"
sanityChecks:
  ruleOf40: "Y3 服务收入增长率 66.7% + EBITDA 利润率 -154.8% = -88.1%；仅作方向性参考，因为收入按项目零散确认且基数较小。"
  burnMultiple: "Y3 EBITDA 现金消耗 $387K ÷ 新增年度服务收入 $100K = 3.9x；这不是基于 ARR 的 SaaS 现金消耗倍数。"
  revenuePerFte: "Y3 收入 $250K ÷ 年末 3.0 名 FTE = 每名 FTE $83.3K；这反映的是低利用率的验证工作，并非规模化后的稳态水平。"
  flags:
    - "付费需求、符合测试条件的配对项目、供应商同意及付费意愿均未得到验证；基准项目量是运营方假设，并非已签约商机。"
    - "每对 $50K 的收费处于 BP 试点区间上限，也采用 research 的市场测算假设；收入来自一次性项目，而非经常性 SaaS。"
    - "基准情景现金到 Y3 年末降至 $159K，低于 $300K 的六个月储备；应在此之前安排后续融资，或冻结招聘并削减可选支出。"
    - "基准情景 EBITDA 在 Y3 仍为负，每名 FTE 收入仅 $83.3K；尚未验证其具备风险投资级别的经济性，也未证明模式可重复。"
    - "每对综合 CAC 为 $28.8K，仅略低于单次项目毛利 $35K，LTV/CAC 为 1.2x；这还未计入尚未得到验证的重复配对项目价值。"
    - "70% 毛利率有赖于将每对项目的内部直接交付人工控制在 $10K、其他直接现金成本控制在 $5K；定制法律和交付工作可能使这两项成本都超出上述水平。"
