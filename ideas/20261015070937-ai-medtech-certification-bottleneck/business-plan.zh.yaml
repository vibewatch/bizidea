slug: clinical-replay-change-gates
date: "2026-10-15"
executiveSummary: >-
  我们要卖的是一套临床回放变更关卡，服务于正准备在验证后更新模型的 AI 医疗器械厂商；它不是新的认证服务，也不替监管机构作决定。每次发布时，产品按预先确定的方案，在同一批已核实使用权的临床队列上运行已批准的基线模型和候选模型，输出各亚组差异，并记录版本、数据集和运行来源。首位使用者是 RA 或 ML 验证负责人；可能的预算决策者是监管事务、质量或临床运营部门的副总裁或总监。研究整理的行业报道显示，即使是 AI 器械的小幅更新，审查周期也有六到八个月；但现有材料并未证明市场存在独立的临床回放需求、买方有预算，或审查方会接受其结果。研究测算情景为 $144M 工作流 TAM、$36M SAM 和 $1.8M SOM；这些数字高度依赖假设，规模上限取决于符合条件的器械产品线，而非广义 AI 器械销售额。真正可守的主张是受监管的发布工作流和证据记录，不是新颖的回放算法，也不是占有客户临床数据；Scarlet、QMS 平台、顾问和内部工具都可能打包提供替代方案。这笔种子前轮资金将用于验证付费意愿、队列能否依法复用以及证据是否有用，再决定是否扩大部署、招聘或拓展地域。
problem:
  - "模型团队迭代得比审查流程快；行业报道显示，即便是 AI 器械的小幅更新，审查周期也要六到八个月。"
  - "每次提出变更，RA 和验证团队都需要可比的基线与候选模型结果、亚组分析和可追溯证据；现有研究并未说明当前人工流程能否稳定交付这些内容。"
  - "反复评估后，留存队列可能不再具备合法复用条件、代表性不足或统计独立性受损；这会压缩符合条件的客户范围，也可能导出误导性结果。"
solution:
  - "先核实队列使用权和预期用途范围，再在客户控制的环境中，对同一批有记录的临床病例运行客户选定的基线模型和候选模型。"
  - "执行前锁定方案、指标、阈值、亚组定义、模型标识符和数据集清单；报告不确定性、覆盖缺口、例外情况，以及与具体版本绑定的差异。"
  - "将可复现的证据记录导入厂商现有的审查与 QMS 流程，供临床、质量和监管人员人工评估。"
  - "输出仅作为辅助证据；它不负责判定变更分类、申报要求、符合性或审批结果。"
whyWeWin:
  - "在受监管的发布流程中，产品把成对模型运行、队列清单、预设亚组分析和可追溯报告串成可重复执行的工作流。通用评估和模型注册工具虽能提供部分组件，临床场景与变更控制仍得由厂商处理。"
  - "客户可自行托管运行；有需求时，也可采用联邦式运行，减少不必要的数据流转并适配现有数据保管约束。但部署位置本身不会授予数据使用权。"
  - "多次部署后，可沉淀经验证的方案模板和 QMS/模型注册库集成；客户临床数据始终由客户控制，不是护城河。"
strategicChoices:
  beachhead: >-
    首攻美国市场：面向已获 FDA 授权的 AI 医疗器械软件团队，团队内部有 RA 或临床验证负责人，计划在验证后更新模型，并能证明留存队列具有临床代表性且获准使用。运行证据前，须先按厂商适用的 PCCP 或变更流程完成变更定性。
  wedgeRationale: >-
    模型即将发布时，围绕单条器械产品线做一次回放，买方、队列和成功指标都能限定清楚，也能在铺开集成前验证付费需求。FDA 逾 1,600 项器械清单只能提供方向性参考，不能视为符合条件的独立买方数量；收窄市场口径，也避免把器械市场增长直接当成软件需求。
  sequencingRationale: >-
    先用付费回顾性试点验证预算、队列使用权和统计有效性；再把客户自运行流程自动化，并打通一种证据导出。客户续约后，才拓展多产品线部署，并选择性评估联邦运行或辖区监管要求映射。可重复的付费使用证明有必要全职招聘实施人员前，创始团队保持精简，以兼职临床统计和监管专家补位。
  notYet:
    - "不充当认证机构、不承诺审批，也不自动判定监管变更分类。"
    - "不把数据匮乏、又没有合法代表性队列的团队作为目标客户；替他们解决数据获取是另一门生意。"
    - "不开发通用 MLOps 监控工具、宽泛的 QMS、汇集临床数据的资产，或覆盖多个司法辖区的完整监管套件。"
    - "美国客户续约证明需求、且部署负担得到衡量之前，暂缓拓展 EU（欧盟）商业业务和联邦式多站点运行。"
market:
  tam: "TAM：年度工作流规模估算为 $144M，按全球 2,400 条等效器械产品线、每条每年假设支出 $60,000 计算；产品线数量和支出均未经核实。"
  sam: "SAM：可服务工作流规模估算为 $36M，假设 600 条产品线符合条件；按更新需求与队列使用权资格率为 25% 的假设筛算，支出仍按未经验证的每条每年 $60,000 代理值计算。"
  som: "SOM：年化收入获取情景为 $1.8M，假设拿下 30 条产品线，即估算 SAM 的 5%，并沿用同一支出代理值；这不是销售预测。"
  segments:
    - "主要客户：即将更新模型、内部有 RA/验证负责人，且拥有可依法复用临床证据的 AI 医疗器械厂商。"
    - "次要客户：拥有多条 AI 器械产品线的厂商，或按厂商批准的方案支持发布评估的临床验证实验室。"
  buyingProcess: >-
    RA 或质量部门发起使用场景；临床统计与 ML 验证团队审核方案和队列适用性，隐私/法务、安全、IT、QMS 负责人则可能否决数据访问或部署。预算可能由 RA、质量、临床运营或研发部门掌握，但实际预算负责人、采购周期和独立回放预算额度仍未核实。
product:
  mvp: >-
    为单条器械产品线提供客户自运行容器，固定基线与候选版本、队列清单和预设方案；执行成对评估，导出亚组差异、不确定性、例外情况和可复现的运行元数据。初期试点包含统计和 RA 人工审查，不宣称自动满足监管要求。
  sixMonth: >-
    六个月内，在符合条件的美国器械产品线上完成两个付费回顾性试点，记录访问日志、锁定方案控制，并交付客户认可的证据导出；部署范围限于单一客户控制的环境。
  twelveMonth: >-
    十二个月内，把重复运行做成产品，加入基于角色的访问控制、故障处理、签名运行记录，并接入客户的一个 QMS 和一个模型注册库；争取将至少两条产品线从付费试点转为年度合同。
  twentyFourMonth: >-
    二十四个月内支持单个客户部署多条产品线，并交付可重复使用的部署与验证套件。只有付费客户提出需求，且实测安全、统计和监管审查成本仍能支撑产品经济性时，才增加联邦式运行或 EU/MDR 证据映射。
  keyBets:
    - "预先设定方案的成对回放可能减少证据准备工作，但不能夸大临床有效性。"
    - "至少部分目标厂商拥有可执行的队列复用权，或能在自有控制下完成评估。"
    - "RA 和质量部门会单独为持续的发布证据付费，而不是只依赖认证机构、顾问、QMS 或内部脚本。"
    - "接入一个 QMS/模型注册库的导出功能可以降低采用阻力，无须每家客户都新增并验证一个系统。"
gtm:
  wedge: >-
    由创始人主导销售：在美国厂商计划更新模型或评估变更前，向其出售针对单条器械产品线的一次付费回顾性回放；对外提出性能主张之前，先核实队列权利和方案。
  channels:
    - "创始人直接联系已知即将更新模型的 RA、质量和 ML 验证负责人。"
    - "方案适配性确认后，争取来自 SaMD 监管顾问、临床验证实验室和临床数据保管方的转介绍。"
    - "有选择地征询审查方或公告机构对报告格式的意见；不得暗示对方背书，也不能损害其独立符合性判断。"
  funnelTargets: "运营目标，并非已观察到的基准：12 个月内，从 30 个目标账户推进到 15 次买方访谈、8 个同时满足更新计划与队列条件的商机、3 个付费试点，并签下至少 2 份年度器械产品线合同。"
  pricing: >-
    先测试运营方提出的假设：单条产品线、一次历史或即将进行的回放，付费试点报价为 $20,000-$30,000；之后转为 $40,000-$60,000 年费，再按发布次数收取固定回放费，并收取上手费。这些都是待验证假设，不是研究所得价格；研究采用的 $60,000 只是规模测算代理值，不能证明客户的付费意愿。
businessModel:
  revenueStreams:
    - "按器械产品线收取年度订阅费，覆盖方案、版本和证据工作流。"
    - "每次经验证的模型发布回放收取固定费用。"
    - "队列、方案和 QMS/模型注册库的初始配置收取费用。"
  unitOfValue: "为受监管的 AI 器械产品线交付一份可复现、获客户认可的发布证据记录，并明确所用队列和方案。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "在续约的器械产品线上增加模型发布回放次数。"
    - "向同一厂商的其他器械产品线和产品团队拓展。"
    - "标准化 QMS 和模型注册库导出，减少重复部署工作。"
    - "后续只有合同证据支持时，才拓展由客户出资的联邦式或特定司法辖区工作流。"
strategyMap:
  northStarMetric: "按付费器械产品线计，每季度有多少份回放证据记录获客户 RA 或质量团队认可、可用于内部更新审查。"
  inputMetrics:
    - "从候选模型冻结到证据记录完成并获内部认可的中位天数。"
    - "符合条件的潜在客户中，已证明拥有队列复用权，且具备有代表性、统计效能达标的评估集的比例。"
    - "按器械产品线统计的付费试点转年度合同率和年度续约率。"
    - "模型、数据集、方案和环境均按清单固定、可复现且无未解决例外的运行占比。"
    - "完成上手后，每次回放的实施工时和毛利率。"
  moatsToBuild:
    - "按器械类型沉淀客户认可的方案模板、亚组报告和经过统计控制的队列复用做法。"
    - "建立可信的来源记录、访问控制，以及接入既有 QMS/模型注册库的能力，减少重复验证工作。"
    - "建立独立合作关系以获得方案反馈，但不接管监管决策，也不汇集受保护的患者数据。"
  killCriteria:
    - "完成 15 次目标厂商访谈和至少 5 次符合条件的更新/预算审查后，若在测试的 $20,000-$30,000 区间内承诺购买付费试点的买方少于 2 个，则停止推进。"
    - "10 个符合条件的潜在客户中，若能证明合法使用代表性队列的不足 3 个，或队列更新成本抵消了预期时间收益，则停止推进。"
    - "比较四次历史发布后，若证据准备工时中位数相较客户记录的基线未实现至少 30% 的降幅，或可复现性/方案例外使比较结果无法信赖，则停止推进。"
    - "向至少两名监管顾问和两名相关审查方征求结构化意见后，若认可记录可作有用辅助证据的人数低于 3 人（受访总数 4 人），或买方经常要求公司作出符合性/变更决定，则停止推进。"
    - "前 3 个付费试点中，若转为年度合同的不足 2 个，或重复运行不依赖大量定制服务就无法达到 70% 毛利率目标，则停止推进。"
  mermaid: |
    flowchart LR
      Trigger[Planned model update] --> Qualify[Rights and cohort qualification]
      Qualify --> Replay[Paired baseline-candidate replay]
      Replay --> Evidence[Version-bound subgroup evidence]
      Evidence --> Review[Human RA and clinical review]
      Review --> Expansion[More lines and recurring releases]
investorMemo:
  verdict:
    call: "观望"
    conviction: "对狭窄工作流机会只有低至中等把握：客户紧迫感确实存在，但独立预算、可重复性和审查方对其效用的认可都尚未得到验证。"
    whyBelieve: "已有报道提到更新延误，FDA 也在推进对持续演进模型的评估；围绕版本发布的回放则是一个具体、可验证的工作流切口。"
    whyDoubt: "没有来源证明客户会单独购买回放；可触达市场只是高度依赖假设的 $36M SAM；Scarlet、QMS 厂商、顾问和内部团队都能打包提供替代方案。"
    nextDiligence: "拿下三个有队列权利证明的付费试点，在历史发布中测量基线与候选模型的证据准备工作量，并请独立人士评估导出记录的效用。"
  firstCustomer:
    title: "即将更新模型、保有临床留出集的美国 AI 医疗器械厂商"
    profile: "处于早期商业化或增长阶段的厂商，拥有一条获 FDA 授权的 AI 器械产品线、内部 RA 负责人、即将进行的模型变更，以及一批访问受控且使用权已核实的验证队列。"
    trigger: "候选模型已冻结；此前一次更新审查耗时数月后，团队必须为 PCCP 或其他适用的变更评估准备材料。"
    buyer: "监管事务、质量或临床运营部门的副总裁或总监"
    initialContract: "运营方假设：单条器械产品线、一次回放的付费试点为 $20,000-$30,000；只有验证效用和队列权利后，才转为 $40,000-$60,000 年度产品线协议，另收发布费用；没有公开可查的回放产品定价。"
  mustBeTrue:
    - "访谈的 15 家目标厂商中，至少 3 家承诺付费试点，且至少 2 家愿意按测试的 $20,000-$30,000 区间付费。"
    - "10 个符合条件的潜在客户中，至少 3 个能证明队列使用权、亚组代表性充足，并能可信地防止反复使用测试集造成污染。"
    - "在四次历史更新中，工作流将证据准备工时中位数至少降低 30%，同时保留方案锁定、可复现性和明确的不确定性说明。"
    - "结构化征询的 4 名顾问/审查方中，至少 3 名认为报告可作有用的辅助证据，且不会把回放通过误当成审批或变更分类。"
    - "前 3 个付费试点中至少 2 个转为按年签约的器械产品线合同；重复运行的毛利率须有望超过 70%，且现有厂商的捆绑方案不会挤掉这笔采购。"
  diligenceQuestions:
    - "前三家目标买方能否拿出实际更新预算、顾问发票或员工工时记录，证明有预算单独购买回放？"
    - "每个拟用队列的知情同意、合同、数据留存和参考标签条款，是否允许反复运行？需要怎样的队列更新或独立数据集方案，才能守住统计有效性？"
    - "如果当时有这套成对回放，哪些历史更新决策或亚组表现退化会因此改变？又该如何与现有流程对照衡量？"
    - "独立 RA 顾问或审查方对报告提过哪些意见？哪些部分仍需新的临床证据或正式申报？"
    - "客户能否在自有控制的环境中部署并验证运行工具，再将结果导入 QMS，且新增的供应商验证负担不超过工作流所节省的工作量？"
    - "公司形成可重复的分销渠道之前，Scarlet、Ketryx、Innolitics 或内部团队是否会提供足够好的捆绑替代方案？"
operatingAssumptions:
  - assumption: "最适合的初期客户拥有留存队列，该队列代表性足够，且获准反复用于模型比较。"
    basis: "idea.yaml"
    validationTest: "与法律顾问和临床统计师一起，审核 10 个符合条件的潜在客户的数据使用、留存、同意、参考标准和亚组条款；记录哪些客户无需与新站点签约即可开展试点。"
    decisionImpact: "若符合条件的潜在客户少于 3 个，只有买方愿意承担额外成本时才转向客户托管/联邦式评估；否则放弃这一滩头市场。"
  - assumption: "RA 或质量部门愿意为单独的回放试点和持续的产品线订阅付费。"
    basis: "research.yaml"
    validationTest: "访谈 15 家近期或即将进行模型变更的厂商；条件允许时，查看脱敏后的更新预算或发票；争取至少 3 份付费试点承诺，而非不具约束力的兴趣表达。"
    decisionImpact: "若买方不愿单独付费，只有合作伙伴愿意出资集成时，才考虑与认证机构或 QMS 厂商合作，开发渠道型或嵌入式产品。"
  - assumption: "成对回放可作为有用的辅助证据，但单靠它不足以授权器械变更。"
    basis: "research.yaml"
    validationTest: "盲测比较四次历史发布，事先固定阈值；再向至少两名顾问和两名相关审查方征求书面的方案和报告意见。"
    decisionImpact: "若这份材料不能帮助内部审查，或要求公司替客户作监管决定，就停止把产品定位为独立证据关卡。"
  - assumption: "客户控制的运行方式能满足隐私/安全约束，而无需承担过多逐客户验证工作。"
    basis: "research.yaml"
    validationTest: "搭建一套客户自运行部署，记录安全和供应商资质审查要求，并统计工程与验证工时，直到客户接受 QMS 导出。"
    decisionImpact: "若每次部署都需要超出目标毛利率承受范围的定制集成，就缩小范围，改为由合作伙伴运营的服务，或放弃扩张直销 SaaS。"
  - assumption: "即使包含统计审查和队列配置，工作流在客户上手后仍能实现超过 70% 的毛利率。"
    basis: "运营方判断"
    validationTest: "统计三个试点和五次重复运行的全部交付工作；区分可复用的产品工作与客户专属分析，核算每份获认可记录的人工和算力成本。"
    decisionImpact: "若重复运行毛利率仍低于 70%，就调整价格、收窄服务范围，或将公司视为专业服务业务，而非风险投资型软件项目。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "访谈 15 名近期或即将更新模型的 RA、质量和 ML 验证负责人；索取脱敏预算、发票或员工工时案例。"
    hypothesis: "更新负责人能指出一项独立、持续发生的证据准备成本，以及负责这笔预算的人。"
    successMetric: "至少找到 5 个符合条件的更新案例，明确其经济买方并记录支出或工时；另获得 3 份付费试点承诺。"
    owner: "创始人 CEO / 商务负责人"
  - horizon: "0–90 天"
    experiment: "与法律顾问和统计师一起，审核 10 个符合条件的潜在客户的队列权利、留存期限、预期用途匹配度、亚组覆盖和留出集污染风险。"
    hypothesis: "一部分潜在客户无需重新招募患者或签订站点协议，就能用现有数据开展有效试点。"
    successMetric: "至少 3 个潜在客户通过书面队列资格清单，并明确数据责任人。"
    owner: "临床统计负责人，与客户法律顾问共同负责"
  - horizon: "0–90 天"
    experiment: "在盲测环境中回放四次历史发布，先锁定方案和阈值，再揭盲；将工时、可复现性和发现的问题与现行流程比较。"
    hypothesis: "成对运行能给出可重复的比较结果、减少准备工作，同时不过度声称统计确定性。"
    successMetric: "证据准备工时中位数至少降低 30%，所有运行都能复现清单，且没有未解决的方案偏差。"
    owner: "创始工程师和临床统计负责人"
  - horizon: "0–90 天"
    experiment: "请两名监管顾问和两名相关审查方评阅一份样例证据导出；记录他们要求的字段，以及报告不得越界作监管主张的边界。"
    hypothesis: "版本信息明确的透明报告可作为有用辅助证据，同时由厂商和审查方负责变更分类。"
    successMetric: "4 名受访者中至少 3 名认为报告适用于内部更新审查，且无人认为它误导性地声称获得审批。"
    owner: "创始人 CEO / 监管顾问"
  - horizon: "3–6 个月"
    experiment: "为每家客户的单条器械产品线交付付费回顾性试点，并在客户环境中测试 QMS 证据导出。"
    hypothesis: "范围收窄、由客户控制的部署能以有限定制工作通过安全和质量审查。"
    successMetric: "完成两个付费试点、至少一份导出获客户接受，且每位初始客户的工程/验证工时少于 80 小时。"
    owner: "创始工程师"
  - horizon: "6–12 个月"
    experiment: "推动试点团队签订年度产品线协议，并跟踪重复回放使用、人工审查时间和交付成本。"
    hypothesis: "模型发布时会反复出现这一需求，足以支撑订阅费加单次回放费的定价。"
    successMetric: "前 3 个付费试点中至少 2 个转为年度合同，且重复运行毛利率有望超过 70%。"
    owner: "创始人 CEO / 客户实施负责人"
  - horizon: "12–18 个月"
    experiment: "与两家临床验证或监管咨询合作伙伴测试转介绍，同时确保审查保持独立。"
    hypothesis: "受信任的专业机构能比只靠创始人外联更高效地带来合格商机。"
    successMetric: "两家合作伙伴各引荐一个队列条件合格的商机，且至少一个进入付费试点；否则继续只做直销 GTM。"
    owner: "创始人 CEO"
operations:
  - "客户法律顾问确认使用权、安全审查完成前，不接收患者级数据；优先在客户控制的环境中运行，数据留在获授权的环境内。"
  - "每次运行前，记录变更范围、模型和数据集版本、方案、阈值、亚组最低样本量、留出集保护措施，并列明人工审批人。"
  - "报告缺失人群、不确定性、数据质量和例外情况；绝不能把达到阈值说成临床泛化、监管许可或审批通过。"
  - "将带签名的运行溯源记录和客户认可的报告导入现有 QMS/模型注册库；为客户审查准备供应商验证和网络安全证据包。"
  - "请临床统计和监管顾问评议方案；与公告机构的任何合作都必须保留其独立符合性审查职责。"
team:
  - role: "创始人 CEO / 商务负责人"
    startTiming: "第 0 个月"
    rationale: "开展买方访谈、拿下付费试点、摸清预算决策者，并确保产品定位为辅助证据，而非认证。"
  - role: "创始工程师"
    startTiming: "第 0 个月"
    rationale: "搭建客户自运行执行框架、固定版本清单、访问日志和可复现性控制，并完成首个 QMS/模型注册库导出。"
  - role: "临床统计师 / ML 验证负责人"
    startTiming: "第 0 个月，兼职"
    rationale: "在对外作出产品主张前，设计有效的成对评估方案、亚组和不确定性报告，以及控制留出集反复使用的机制。"
  - role: "监管与 QMS 质量顾问"
    startTiming: "第 0 个月，按合同聘用"
    rationale: "审查适用的 PCCP/变更边界、报告措辞、客户供应商资质审查和证据可追溯要求，但不取代客户法律顾问。"
  - role: "客户实施工程师"
    startTiming: "第 9 个月，以已有两个付费试点为前提"
    rationale: "只有反复出现的实施任务已经明确，才标准化客户部署和导出；没有可重复需求的证据前不提前招聘。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "第 90 天前访谈 15 家厂商、筛出至少 5 个符合条件的更新案例，并拿到 3 份付费试点承诺；否则暂停产品开发。"
      - "不晚于第6个月，完成两个付费回顾性试点，锁定方案、记录队列权利，并交付可复现报告。"
      - "不晚于第12个月，让首批 3 个付费试点中至少 2 个转为年度器械产品线合同，并证明有一份 QMS 导出获客户认可。"
      - "直销先聚焦美国市场，并始终由人工负责变更分类和临床审查。"
  - horizon: "12–24 个月"
    items:
      - "只有试点转化和重复使用都支撑扩张时，才达到 5 条付费续约产品线；按产品线跟踪续约和毛利率。"
      - "依靠经验证的部署套件和可重复的 QMS/模型注册库集成，减少客户导入工作量。"
      - "至少有两家美国续约客户提出需求、且成本和安全审查完成后，再决定是否投资联邦式运行或 EU/MDR 映射。"
  - horizon: "24–36 个月"
    items:
      - "通过续约、增购产品线和有证据支撑的合作伙伴转介绍，争取服务 10 条或更多付费产品线；前提仍是估算市场确有其规模。"
      - "至少为两种器械/更新类型标准化工作流，不汇集客户临床数据，也不延伸至认证决策。"
      - "若续约产品线少于 10 条，或估算的 $1.8M SOM 实际上已是可实现规模上限，应优先考虑嵌入式分销或更窄但盈利的业务，不要贸然进行未经验证的地域扩张。"
risks:
  - risk: "反复使用固定队列会抬高表面性能、削弱统计独立性，或依赖过时的真实标签。"
    likelihood: "High"
    impact: "High"
    mitigation: "锁定访问权限和阈值，分开开发集与评估集，报告不确定性和亚组限制；统计师判定复用不再有效时，要求使用新证据或采用有序列控制的证据方案。"
  - risk: "厂商无法证明对可复用临床队列拥有合法使用权，或无法证明队列覆盖具有代表性。"
    likelihood: "High"
    impact: "High"
    mitigation: "签约前核实权利，在客户控制的环境中运行；拒绝权利、标签或预期人群覆盖不足的队列。只有买方愿意出资时才测试联邦式方案。"
  - risk: "审查方或客户把回放当成审批捷径，或认为它不足以支撑重大变更。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "每份报告都写明证据局限，由人工负责变更分类，按客户批准的变更流程设计方案，并在宣称结果获认可前征求独立意见。"
  - risk: "Scarlet，或相邻的 QMS、服务商和开源替代方案，打包提供足够的成对评估功能，挤掉独立预算。"
    likelihood: "High"
    impact: "High"
    mitigation: "通过付费试点证明重复使用能省时，且客户控制的工作流有独立价值；只有需求获资助、且审查方保持独立时，才寻求合作或嵌入式分销。"
  - risk: "研究测算的市场规模高估了活跃更新项目数、独立买方数或年度支出。"
    likelihood: "High"
    impact: "High"
    mitigation: "把 FDA 清单条目映射到独立的活跃产品线、更新、队列权利和实际预算；没有付费转化与续约证据，不按 TAM 估算招聘或扩张。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–3M"
  runwayMonths: 18
  useOfFundsSummary: "这笔种子前轮资金计划覆盖 18 个月，用于打造安全的客户自运行回放和证据导出、补足临床统计与监管专业能力、完成付费试点和队列权利验证，并在增加部署岗位或拓展地域前验证重复使用；融资额是运营方目标，仍待财务建模。"
