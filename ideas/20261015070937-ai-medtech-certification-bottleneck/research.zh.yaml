championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: 与发布版本绑定的回放测试，会用同一份留有记录的队列对比基线模型与候选版本，直面监管科学中的实际问题：如何评估不断演进的 AI 模型。所审阅的供应商页面中，没有一家明确把完整的厂商自主回放流程和亚组证据记录作为独立产品推出。
      sourceRefs:
        - 3
        - 10
        - 13
        - 14
    - point: 拟议产品不替代公告机构的合规判定：它可以让厂商在接触审核方前，先拿到一份内部、可重复的测试记录；前提是不能暗示测试得分通过就能获准变更。
      sourceRefs:
        - 2
        - 4
        - 15
  evidenceAgainst:
    - point: 底层方法并不新。FDA 研究明确考察了如何在反复复用的固定测试数据上连续修改模型，也记录了天真复用会怎样抬高测得性能，以及受控访问如何减少偏差。
      sourceRefs:
        - 3
        - 5
        - 21
    - point: 周边工具已能支持评估、版本管理、可追溯性，甚至联邦式医疗模型基准测试。因此，新意在于受监管的发布流程和证据打包，而非回放、队列测试或可复现性这些技术基础能力。
      sourceRefs:
        - 18
        - 19
        - 20
    - point: Scarlet 已向 AI 器械厂商销售认证和持续产品变更审查服务，其中一些客户称会频繁发布版本。它可能吸收这套工作流，也可能成为合作方；现有证据并不能证明它是一个做不好的现有厂商。
      sourceRefs:
        - 10
        - 13
        - 14
        - 15
  revisedClaim: 更站得住脚的创新主张，不是某种罕见技术机制，而是一道专为受监管变更审查打造、由厂商掌控的发布关口：把预先设定的临床阈值、统计上审慎的队列复用、基线与候选版本的亚组差异，以及绑定模型版本的证据导出拼在一起。证据支持它可能成为一个垂直工作流细分市场，但尚不能证明它独一无二、现有厂商无法捆绑提供，或回放能缩短审批周期。
reportMemo:
  executiveTakeaways:
    - 痛点已经显现，也有商业信号：一家专业认证机构已有付费客户，提供订阅式持续审查，客户还提到快速更新周期；但没有公开价格，也没有独立买方预算数据能证明市场愿为单独的回放工具付费。
    - 这个机制在科学上有意义，但技术上并不稀缺。FDA 研究直接讨论如何在固定测试数据上反复评估演进中的模型；通用 ML 评估、模型注册库和联邦式医疗基准测试也已存在。
    - Scarlet 是最接近的直接竞争者，也可能成为渠道。QMS 软件、医疗器械法规咨询公司和开源评估工具栈都是可信的替代方案。
    - 可触达市场只是规模有限、假设较多的证据工作流细分市场，不是数十亿美元的 AI 器械销售市场。估算上限取决于即将更新、且验证数据依法可复用的器械项目数量。
    - 最关键的证伪问题是：买方能否证明，现有 QMS、顾问、内部统计人员或认证机构都无法妥善解决一个有预算、会反复发生的更新证据问题？
  marketDefinition: 面向受监管 AI 医疗器械软件厂商的年度证据生成与变更控制工作流：在受控临床队列上回放候选模型和已批准的基线模型，保留方案与版本记录，并把结果导入现有质量和法规审查流程。不包括器械销售、认证费用、临床试验收入或通用 AI 可观测性。
  customerAndBuyer: 日常使用者是法规事务或 ML 验证负责人；经济买方通常是法规事务、质量、临床运营或研发部门的总监或 VP。最合适的滩头市场客户，是已经有验证队列、由内部团队负责临床/统计工作、即将调整软件模型，而且有权在受控环境中运行队列的 AI 器械厂商。质量、隐私/安全、工程、法务和临床统计相关方都可能否决部署。
  buyingTriggers:
    - point: 计划中的模型更新必须依照先前审查过的变更方案评估，或在上市申报的变更评估中披露。
      sourceRefs:
        - 2
        - 4
    - point: 厂商已形成稳定更新节奏，数月的审查瓶颈会带来高昂代价；Flok 的目标是每月发布两次升级，Lucida 则称在证书转移后几天内就发布了更新。
      sourceRefs:
        - 13
        - 14
    - point: EU Class III 器械发生可能影响安全性或性能的变更时，必须先判断变更类别及是否需要公告机构批准，再用验证结果论证该变更属于轻微变更。
      sourceRefs:
        - 8
        - 12
    - point: 若在发布前发现故障或亚组表现退化，原本会因此追加临床、质量或法规工作。
      sourceRefs:
        - 3
        - 5
        - 21
  willingnessToPay:
    summary: 目前只有方向性的预算信号，还没有经验证的付费意愿。Scarlet 称其订阅服务覆盖监测、年度审计和产品变更审查；公司还宣布一轮 $50 million 的 B 轮融资，用于扩大认证能力。Scarlet 发布的客户案例提到快速更新需求。现有来源没有披露合同金额、回放与认证各自的预算占比，也没有说明厂商是否愿意单独购买工具。下一步应查看近期更新项目预算，并争取 RA/质量买方承诺付费试点，核实实际支出。
    sourceRefs:
      - 10
      - 13
      - 14
      - 15
  competitiveLandscape: 最直接的威胁是 Scarlet：它把软件/AI 器械认证与持续更新监测结合起来。Ketryx 自动落实医疗器械软件的 QMS 要求，并管理可追溯性和文档；Innolitics 提供一体化工程、AI/ML 验证和法规申报服务。Evidently 与 MLflow 提供通用测试、评估和模型版本工作流；MLCommons MedPerf 则提供开放的联邦式医疗 AI 基准测试。内部统计脚本加上厂商自己的 QMS 和顾问，仍是常见做法。
  incumbentThesis:
    - incumbentClass: 公告机构与专业认证服务
      point: Scarlet 自己的公告称更新周期更快，其持续服务也包括产品变更审查；新产品不能想当然地认定认证机构太慢或做不到。只有当买方需要独立于所选认证机构、在正式审查前生成证据时，由厂商掌控、可跨机构使用的回放工具才可能补足公告机构服务。没有来源证明 Scarlet 的流程缺少拟议的回放能力。
      sourceRefs:
        - 10
        - 13
        - 14
        - 15
    - incumbentClass: QMS 与变更控制平台
      point: Ketryx 接入开发者工具，支持可追溯性、变更影响分析、QMS 合规管控和发布文档管理，因此可能掌控工作流记录。其公开产品介绍没有明确提到在患者级队列上运行成对模型，也没有提到输出临床亚组差异。
      sourceRefs:
        - 16
    - incumbentClass: 法规工程与咨询服务
      point: Innolitics 提供一体化软件工程、AI/ML 验证、法规策略、V&V 证据和申报材料，能够满足定制需求。潜在缺口在于每次发布都要重复投入、难以摊薄边际工作量，而不是缺少有能力的服务商。
      sourceRefs:
        - 17
    - incumbentClass: 通用 MLOps 与评估工具库
      point: Evidently 和 MLflow 支持模型评估、关联数据集对比、测试、版本管理与可追溯性，降低自建相对于采购的成本。厂商仍需设计临床方案、安全复用测试数据、落实隐私控制，并补足符合监管要求的证据背景。
      sourceRefs:
        - 18
        - 19
    - incumbentClass: 开源医疗 AI 基准测试与内部自建方案
      point: MedPerf 已支持医疗 AI 联邦评估，数据可以留在参与机构。团队也能自行编写脚本分析基线与候选模型。两者的公开定位都不是面向单一厂商、产品化的法规变更关口，但都可以拼装成这样的方案。
      sourceRefs:
        - 3
        - 20
  regulatoryLandscape: FDA 指南建议 PCCP 写明计划中的改动、开发/验证/实施方法以及影响评估；FDA 会在上市申报中审查 PCCP。它并非所有 AI 器械都必须满足的普遍要求，回放测试通过也不能决定是否需要重新申报。现有 510(k) 变更指南仍然适用。在 EU，MDR 公告机构变更评估与 AI Act 高风险产品义务彼此相关，但属于两套不同制度；European Commission 页面目前列出的受监管产品内嵌高风险 AI 适用日期为 2 August 2028。UK AI Airlock 提供持续运作的监管协作渠道，但不是替代审批路径。
  technologyLandscape: 用现有 ML 工具就能实现成对推理、队列清单、亚组统计和模型/版本沿袭。难点在于反复使用测试集时仍保持统计有效性、明确患者数据的保管与使用权、确保不同模型运行时的结果可复现，并把输出接入厂商已验证的 QMS。当队列数据不能集中存放时，联邦式执行是可行选择。回放是支持决策、生成证据的工作，不等同于认证，也不能保证临床泛化。
  distributionChannels:
    - point: 围绕计划中的模型更新或 PCCP 工作流，直接触达 RA、质量和 ML 验证负责人；必须以付费试点验证预算。
      sourceRefs:
        - 2
        - 13
        - 14
        - 15
    - point: 从 SaMD 法规顾问、专业公告机构、临床验证实验室和临床数据托管方获取转介。
      sourceRefs:
        - 9
        - 15
        - 17
        - 20
  partnershipEcosystem:
    - point: 法规顾问或公告机构可以审查测试方案和报告格式，但商业合作必须保留公告机构独立作出合规判定的职责。
      sourceRefs:
        - 10
        - 12
        - 15
        - 17
    - point: 当厂商缺少广泛且可复用的数据权利时，医院、研究机构和数据托管方可以支持联邦式评估或由客户自行运行评估。
      sourceRefs:
        - 20
        - 21
  dataMoats:
    - point: 客户锁定的队列属于客户，不是初创公司的共享数据护城河；必须明确许可、真实标签权利和复用限制。
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    - point: 防御力可能来自经过验证的方案模板、变更影响映射和跨器械类别的安全执行集成，但仅限于获得买方许可、且不复用受保护临床数据的情况。
      sourceRefs:
        - 2
        - 16
        - 17
        - 20
  geographicConsiderations:
    - point: 美国是量化信息最清楚的切入市场：截至 September 2026，FDA 列出超过 1,600 款获准的 AI 器械；但这是器械数量，不是独立公司或符合更新条件的项目数。
      sourceRefs:
        - 1
        - 21
    - point: EU MDR 和 AI Act 分别增加文档与合规义务；European Commission 当前指南称，受监管产品高风险 AI 的过渡日期为 2 August 2028。
      sourceRefs:
        - 7
        - 8
    - point: UK AI Airlock 已完成两个阶段、覆盖 11 家创新企业，目前向更多参与者开放 Phase 3 申请；这是合作和学习渠道，不是产品采购的证明。
      sourceRefs:
        - 9
    - point: 各国和诊疗场景的数据权利、临床参照标准与队列代表性各不相同，单一 US 验证队列不能自动支持所有市场。
      sourceRefs:
        - 5
        - 7
        - 20
        - 21
  sensitivityCases:
    - case: FDA 器械条目高估了活跃的独立模型线数量
      impact: 如果去重和活跃更新资格筛选使模型线总体减半，在年度支出假设不变时，全球 TAM 估算将从约 $144M 降至约 $72M；实际买家数量还可能更少。
      sourceRefs:
        - 1
        - 21
    - case: 同时有近期更新和可复用队列权利的项目不到四分之一
      impact: SAM 会同比例缩小；若符合条件的项目占 10%，按相同的 $60,000 假设计算，约有 240 个器械线当量，年度支出为 $14.4M。
      sourceRefs:
        - 3
        - 5
        - 20
    - case: 重复使用同一留出集在统计上不可接受，或真实标签已经过时
      impact: 产品可能需要新队列、保护隐私的外部站点，或按顺序控制测试数据访问；数据成本和合同工作可能吃掉提速带来的收益。
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    - case: 现有认证机构、顾问或内部团队把回放证据打包提供
      impact: 独立产品可能沦为功能模块或服务合作方，而非单独的采购预算项；可服务市场和可获取份额都会低于基准情景。
      sourceRefs:
        - 15
        - 16
        - 17
        - 18
  validationPlan:
    - priority: high
      question: RA 或质量部门的买方，是否会为重复开展的模型更新回放单独付费，而不是把它归入认证、咨询或 QMS 工作？
      evidenceToGather: 访谈至少 15 家近期改过模型的厂商；查阅隐去敏感信息的预算、发票、人力投入和审批延迟记录；争取至少三份付费试点承诺。
    - priority: high
      question: 目标客户能否依法反复复用一个具有代表性、样本量充足的临床留出集来对比模型？
      evidenceToGather: 与客户律师和临床统计人员核对数据使用协议、同意/伦理审查范围、保留政策、亚组覆盖、真实标签的时效性及最低样本量要求。
    - priority: high
      question: 成对回放基线与候选模型，能否发现当前流程漏掉的发布阻断性回退，同时避免反复暴露测试集导致过拟合？
      evidenceToGather: 对若干历史版本开展盲法回顾性测试，评估前锁定阈值，检查校准度和亚组不确定性，再与独立测试集或按序保护的测试集进行对比。
    - priority: high
      question: 公告机构、对接 FDA 的法规负责人或 EU 审核方，是否会把产物视为有用的支持性证据，而不是合规判定？
      evidenceToGather: 至少两位法规顾问和两位相关审核人员提供书面反馈，覆盖方案、来源沿袭、亚组报告、例外情形及变更分类。
    - priority: medium
      question: 工具能否接入各厂商现有 QMS 和模型注册库，而不额外引入一套需要验证的系统负担？
      evidenceToGather: 制作导出到一个 QMS 和一个类似 MLflow 的模型注册库的原型；记录供应商资质审查、审计轨迹、访问控制、网络安全和验证工作量。
    - priority: medium
      question: 哪些器械类别和更新类型会持续产生需要审查的回放工作？
      evidenceToGather: 梳理 50 条 FDA AI 器械记录，逐一对应独立厂商/产品线、授权路径、模型更新节奏、队列权利和预期变更分类。
  validationSignals:
    - point: Flok Health 称希望每月发布两次器械升级，并把这一节奏归因于其专业公告机构合作关系。这只是反映紧迫性的方向性证据，并不能证明客户需要单独购买回放产品。
      sourceRefs:
        - 13
    - point: Lucida Medical 的案例称，证书转移后几天内就发布了模型更新，说明部分厂商重视更新阻力和审核方匹配度。
      sourceRefs:
        - 14
    - point: Scarlet 宣布融资 $50 million 以扩大 AI 认证机构业务；独立行业报道还介绍了其持续订阅服务，涵盖监测、审计和产品变更审查。
      sourceRefs:
        - 10
        - 15
    - point: 截至 September 2026，FDA 报告已有超过 1,600 款获准的 AI 器械；这说明受监管器械存量在扩大，却不能证明模型会持续更新。
      sourceRefs:
        - 1
    - point: 2026 年的一项证据普查发现，1,357 款获准器械中只有 3 款关联了以患者为中心的结局评估研究。这凸显验证质量问题，但没有证明存在采购预算。
      sourceRefs:
        - 21
    - point: UK AI Airlock 邀请创新企业应对演进中的 AI、诊断和上市后监测挑战，可能成为监管学习渠道。
      sourceRefs:
        - 9
analysisModels:
  marketMapDiagram:
    title: 临床回放与相邻解决方案
    mermaid: |
      quadrantChart
        title Specialization versus buyer urgency
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed clinical replay: [0.88, 0.78]
        Scarlet certification: [0.92, 0.91]
        Ketryx QMS: [0.63, 0.62]
        Innolitics services: [0.80, 0.73]
        Evidently and MLflow: [0.40, 0.54]
        MedPerf benchmarking: [0.78, 0.56]
  fiveForces:
    supplierPower:
      score: 4
      rationale: 厂商、医院和数据托管方掌握临床队列及参照标签的访问权。数据使用权和独立测试集质量都可能让更换供应方变得困难。
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    buyerPower:
      score: 4
      rationale: 符合条件的器械项目数量可能不多，但买方可以在内部脚本、顾问、QMS 供应商和认证机构之间选择。企业买方能要求安全保障和工作流集成，也可能推迟采购。
      sourceRefs:
        - 15
        - 16
        - 17
    threatOfEntrants:
      score: 3
      rationale: 用现有模型评估和注册工具就能搭出软件，但要做好可信的临床统计、安全访问数据，并嵌入经过验证的质量体系，执行门槛不低。
      sourceRefs:
        - 3
        - 18
        - 19
        - 20
    threatOfSubstitutes:
      score: 5
      rationale: 强替代方案包括内部统计流水线、法规咨询、公告机构服务、QMS 变更工作流、开源评估库和联邦基准测试基础设施。
      sourceRefs:
        - 15
        - 16
        - 17
        - 18
        - 19
        - 20
    competitiveRivalry:
      score: 3
      rationale: 专门的发布回放赛道目前并不拥挤，但相邻现有厂商已掌握认证、变更记录、工程工作流、模型评估和测试数据基础设施；它们可以把回放打包进去，也可以沿切口合作。
      sourceRefs:
        - 10
        - 15
        - 16
        - 17
        - 18
        - 20
  pestle:
    - factor: 法律
      impact: negative
      point: 获批 PCCP 只覆盖其中明确列出的改动和方案；性能证据通过本身不能决定某项变更是否需要重新申报或取得公告机构批准。
      sourceRefs:
        - 2
        - 4
        - 12
    - factor: 技术
      impact: negative
      point: 在同一固定测试集上反复评估模型更新，可能抬高表面性能；因此必须保证队列有代表性、访问受控、报告不确定性，并保留版本来源记录。
      sourceRefs:
        - 3
        - 5
        - 21
    - factor: 经济
      impact: positive
      point: 据报道，专业认证业务吸引了一轮 $50 million 扩张融资，市场报告也预测 AI 器械将强劲增长；但这两条都不能证明窄众工具有预算。
      sourceRefs:
        - 10
        - 15
        - 22
    - factor: 社会
      impact: negative
      point: 近期证据普查显示，多数获批器械没有关联前瞻性患者结局评估；若回放只给出一个分数，却说不清临床意义和亚组局限，反而会加深薄弱证据的问题。
      sourceRefs:
        - 21
        - 23
    - factor: 政治
      impact: positive
      point: UK AI Airlock 开放 Phase 3，FDA 也在研究产品全生命周期问题，说明监管机构正回应不断演进的器械证据挑战；但两者都不是采购背书。
      sourceRefs:
        - 3
        - 9
  adoptionFrictionMatrix:
    - friction: 患者数据权利与受控访问
      severity: 高
      affectedBuyer: 法规、隐私、法务和临床数据团队
      mitigation: 在厂商受控环境内运行，或采用联邦式执行；试点前核实同意范围、数据用途、保留期限和站点协议。
      sourceRefs:
        - 5
        - 20
        - 21
    - friction: 反复复用测试集与真实标签过时
      severity: 高
      affectedBuyer: ML 验证负责人、生物统计学家和临床负责人
      mitigation: 提前锁定阈值和队列用途；预留独立测试数据，或采用统计上受控的序贯评估；报告不确定性并更新参照标准。
      sourceRefs:
        - 3
        - 5
        - 21
    - friction: 回放通过被误当成监管许可
      severity: 高
      affectedBuyer: 法规事务与质量管理层
      mitigation: 由人明确签字确认变更分类和申报决定；依照获批 PCCP 或适用的变更程序生成证据。
      sourceRefs:
        - 2
        - 4
        - 12
    - friction: 接入已验证的 QMS 和开发工作流
      severity: 中
      affectedBuyer: 质量工程、软件和 IT/安全团队
      mitigation: 把签署后的报告和来源记录导出到现有 QMS/模型注册库；尽量减少新系统验证，并支持客户托管部署。
      sourceRefs:
        - 16
        - 18
        - 19
    - friction: 结局证据薄弱或亚组代表性不足
      severity: 高
      affectedBuyer: 临床管理层与器械安全负责人
      mitigation: 与临床专家定义有临床意义的终点和亚组最低样本要求；人群缺失应作为证据局限披露，不能当作测试通过。
      sourceRefs:
        - 5
        - 21
        - 23
market:
  tam:
    value: $144.0M
    rationale: 自下而上的年度支出代理估算：假设全球有 2,400 条 AI 器械模型线当量（将美国 FDA 清单中 1,600+ 条器械记录乘以 1.5x 国际扩张系数），每条模型线每年投入 $60,000 用于证据工作流，则 2,400 x $60,000 = $144M。1.5x 地域系数和年度支出均为经营者假设，不是观测到的市场数据；器械记录可能重复对应产品线，也可能包含静态模型。这是一个狭义、可服务的工作流 TAM，不是报道中的 AI 器械销售市场。
    isEstimate: true
    sourceRefs:
      - 1
      - 22
  sam:
    value: $36.0M
    rationale: 对全球 2,400 条模型线按 25% 符合条件的假设估算：需要有计划内/重复发生的模型变更、保留有临床代表性的队列，且数据权利可用。600 条符合条件的模型线 x 每年 $60,000 = $36M。没有来源测量这一转化比例；FDA 和研究资料支持认真评估模型更新的必要性，却没有证明假设的比例成立。
    isEstimate: true
    sourceRefs:
      - 1
      - 3
      - 5
      - 20
      - 21
  som:
    value: $1.8M
    rationale: 这是经营者可触达范围的情景测算，不是预测：在初步商业化周期内拿下估算的 600 条 SAM 模型线中的 5%（即 30 条），按同一每年 $60,000 的支出代理计算，年度收入潜力为 $1.8M。若单独经营的 SOM 规模较小，就需要先证明能扩展到更多模型线或覆盖更广的工作流价值，才能声称具备风险投资级别的成长空间。
    isEstimate: true
    sourceRefs:
      - 1
      - 10
      - 21
bottomUpSizingDrivers:
  - driver: 美国获准 AI 医疗器械存量
    value: 截至 September 2026，FDA 已授权超过 1,600 条 AI 器械记录；这不是独立公司数，也不是符合更新条件的项目数。
    source: '[1]'
  - driver: 全球模型线倍数
    value: 2,400 条候选模型线 = 美国 1,600 条记录 x 1.5 国际系数；仅为估算，且可能受到授权重叠影响。
    source: est.
  - driver: 有重复变更需求的合格占比
    value: 假设候选模型线的 25%（即 600 条）既有计划更新，也有权复用的队列；该比例尚未测量。
    source: est.
  - driver: 每条合格模型线的年度支出代理
    value: 每条模型线每年 $60,000，仅供规模测算使用，是经营者假设；抓取的来源没有公布回放产品价格或合同金额。
    source: est.
  - driver: 近期可获取份额
    value: SAM 的 5% = 30 条模型线 x $60,000 = 年化机会 $1.8M；这不是销售预测。
    source: calc.
categoryDynamics:
  growthRate: Grand View Research 估算，广义 AI 医疗器械市场在 2025-2033 年的 CAGR 为 38.5%；这是器械收入增速，不是验证软件增速，而且不同预测差异很大。
  growthRateSourceRefs:
    - 22
  tailwinds:
    - point: FDA 列出超过 1,600 款获准 AI 器械，受监管的存量随之扩大；不过，数量增加不代表会持续发生变更。
      sourceRefs:
        - 1
    - point: FDA 的 PCCP 指南明确了上市后有限变更及其验证方法，为计划内变更建立了清晰的证据工作流。
      sourceRefs:
        - 2
    - point: 一些厂商公开提到，选择专业公告机构后，发布更频繁、更新周期更短。
      sourceRefs:
        - 13
        - 14
        - 15
  headwinds:
    - point: 回放通过并不能免除法定变更评估义务；FDA 允许使用 PCCPs，但并未要求每种器械都必须采用。
      sourceRefs:
        - 2
        - 4
    - point: 反复复用固定队列可能导致评估过拟合、无法泛化，从而削弱产品核心机制的价值。
      sourceRefs:
        - 3
        - 5
    - point: 前瞻性患者结局证据薄弱、亚组分析有限，可能削弱审核方或临床医生对新生成分数的信心。
      sourceRefs:
        - 21
        - 23
    - point: EU AI Act 对高风险产品的义务目前有延长至 2028 年的过渡期，部分需求可能因此延后或被重新排序。
      sourceRefs:
        - 7
competitors:
  - name: Scarlet
    stage: 完成 B 轮融资、正扩大专业 AI/软件审查版图的认证机构
    wedge: AI/SaMD 认证、持续监测、年度审计和产品变更审查
    pricing: 据报道采用订阅模式；未公开价格
    strength: 具备专业监管资质，且有客户案例涉及频繁发布 AI 器械版本
    weaknessVsUs: 最直接的威胁，也可能把回放打包进服务；公开资料没有说明它提供由客户掌控的成对回放产品，但也不能证明 Scarlet 做不到。
    sourceRefs:
      - 10
      - 13
      - 14
      - 15
  - name: Ketryx
    stage: 商业化的 AI 医疗器械软件合规平台
    wedge: QMS 合规管控、可追溯性、变更影响分析、发布文档和开发者工具集成
    pricing: 抓取的产品文档没有公开价格
    strength: 嵌入开发工作流，可以掌管变更记录和证据追溯
    weaknessVsUs: 其公开产品介绍没有提到临床队列执行、成对模型性能分析或亚组差异。
    sourceRefs:
      - 16
  - name: Innolitics
    stage: 成熟的专业工程与法规服务提供商
    wedge: 端到端 SaMD 开发、AI/ML 验证、V&V 证据、网络安全和申报工作
    pricing: 服务似乎按客户项目报价；未见公开价格
    strength: 能让工程师、临床/AI 专家、法规策略和申报证据在同一团队协作
    weaknessVsUs: 每次变更都可能依赖大量人力，标准化程度也可能不如可重复使用的产品；但它仍是有实力的替代方案。
    sourceRefs:
      - 17
  - name: Evidently AI 和 MLflow
    stage: 开源评估和 MLOps 工具，另有商业托管选项
    wedge: 模型评估、感知数据集差异的对比、测试套件、实验追踪、注册库和版本沿袭
    pricing: 提供开源组件；引用页面没有列出托管版/企业版条款
    strength: 成本低、灵活，可作为内部成对测试和模型/数据来源记录的构件
    weaknessVsUs: 通用工具把临床方案、安全复用测试数据的控制措施、受监管 QMS 验证和证据解读留给厂商处理。
    sourceRefs:
      - 18
      - 19
  - name: MLCommons MedPerf
    stage: 开源医疗 AI 基准测试基础设施与研究平台
    wedge: 在数据所有方机构开展医疗模型的联邦评估
    pricing: 开源代码库；未公布商业回放价格
    strength: 证明多中心基准测试无需把敏感数据转移到集中式数据集
    weaknessVsUs: 公开定位是基准测试基础设施，不是面向单一厂商的发布变更审批工作流，也不提供可直接交审核方的记录。
    sourceRefs:
      - 20
regulatoryTechnicalConstraints:
  - point: 经 FDA 审查的 PCCP 必须界定改动、验证/实施方法和影响评估；外部工具不能扩大获批的变更边界。
    sourceRefs:
      - 2
      - 4
  - point: 反复复用固定测试队列可能抬高测得性能；只锁定队列还不够，也可能让重复评估越来越不可信。
    sourceRefs:
      - 3
      - 5
  - point: AI 器械测试集必须代表预期人群，且与模型开发保持有意义的独立性；亚组样本量和不确定的参照标准都可能限制结论。
    sourceRefs:
      - 5
      - 21
      - 23
  - point: 临床数据的访问、处理地点、复用权和保留期限，都需要客户逐一开展法律与安全审查；联邦式执行能减少数据搬动，却不会自动授予数据权利。
    sourceRefs:
      - 20
      - 21
  - point: EU MDR 和 AI Act 对变更、质量、文档及高风险系统提出相互重叠但彼此独立的义务，因此需要按司法辖区映射证据要求。
    sourceRefs:
      - 7
      - 8
      - 12
  - point: 由客户或供应商运行、且影响受监管发布决策的软件，可能增加供应商资质审查、验证、网络安全和 QMS 集成工作。
    sourceRefs:
      - 6
      - 16
      - 17
openQuestions:
  - FDA 清单中 1,600+ 款器械，有多少对应独立且仍在运行的厂商模型线，同时有计划更新和依法保留的队列？
  - 目前每年有多少预算用于重复的模型更新验证，由谁掌握这笔预算？
  - 厂商如何避免反复使用封存测试队列，污染训练或调参决策？
  - 针对不同预期用途，监管机构和公告机构认为哪些性能指标、不确定性区间及亚组阈值足够？
  - 客户是否接受客户托管或联邦式执行？站点费用和真实标签成本由谁承担？
  - 工具输出能否验证一次后重复使用，还是每家厂商都必须重新评定整条软件流水线？
  - 在独立产品建立分发渠道前，Scarlet、Ketryx、顾问或内部团队是否会打包提供足够的回放能力？
