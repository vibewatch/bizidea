jobsToBeDone:
  - job: When I prepare a post-validation model update, help me compare the candidate with the prior version on the same clinical cases, so I can identify regressions and bring reproducible evidence to review.
    currentAlternative: Manually assemble analyses and supporting documents for internal review and regulatory consultation.
    successMetric: Time from candidate model freeze to a reviewer-ready, reproducible comparison record.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: The locked-cohort replay makes clinical change evidence a release-time test mechanism rather than another certification document workflow.
  venturePotential:
    score: 4
    rationale: Recurring updates across AI medical-device lines create repeat usage and expansion potential, but the size and willingness to pay are not established by this funding cluster alone.
  whiteSpace:
    score: 3
    rationale: The wedge is distinct from certification-body review, but Scarlet and established certification groups create substantial competitive gravity.
  painIntensity:
    score: 4
    rationale: Source coverage reports six-to-eight-month review cycles even for minor updates, while the independent measurement of customer-level delay remains limited.
  wedgeClarity:
    score: 4
    rationale: The first workflow is clear for teams with a retained clinical cohort and a planned model update, but cohort rights and protocol alignment constrain eligibility.
  evidenceFit:
    score: 4
    rationale: Multiple cluster sources identify long review and update cycles, but none directly validates demand for cohort-replay software or reviewer acceptance of its output.
topRisks:
  - name: Clinical data rights
    description: Manufacturers may lack the rights or governance basis to reuse a retained patient cohort for repeated model-release tests.
    mitigation: Run data in the manufacturer's controlled environment and qualify only cohorts with documented permissions and retention terms.
  - name: Reviewer acceptance
    description: A replay against prior validation cases may not provide sufficient evidence for substantial model changes or every reviewer's expectations.
    mitigation: Co-design protocols with each customer's clinical and regulatory leads, preserve transparent outputs, and position the replay as supporting evidence rather than approval.
  - name: Cohort overfitting
    description: Repeated access to a fixed cohort can encourage model tuning against the test set and weaken its value as independent evidence.
    mitigation: Use access controls, separate development and sealed evaluation sets, and require customer-approved rules for cohort rotation or fresh evidence when warranted.
