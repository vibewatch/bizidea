problem: >-
  AI medical-device teams may iterate models faster than the certification and update cycles described in the source
  coverage, where even minor AI-device updates can take six to eight months to review. For a team preparing a model
  change, evidence about the new version must be made comparable to the prior version and its clinical validation
  basis; the supplied reporting identifies the timing mismatch but does not establish how each manufacturer currently
  assembles that evidence. Without a repeatable release-level test, teams risk delaying useful changes or spending
  scarce clinical and regulatory effort rebuilding evidence for each update.
targetUser:
  primary: Regulatory-affairs and ML-validation leads at AI medical-device manufacturers preparing a post-validation model update for review.
  secondary: Clinical performance, quality engineering, and software release teams at AI medical-device manufacturers.
  buyer: VP or director of regulatory affairs, quality, or clinical operations.
startupThesis:
  nonObviousInsight: The bottleneck is not only the certification review queue; each model update needs comparable, version-specific evidence that a reviewer can inspect without treating every release as an entirely new device.
  beachhead: AI medical-device manufacturers with an established clinical validation cohort and a planned software-model update that will be presented for regulatory review.
  wedge: A locked-cohort replay service that runs a candidate model and its approved baseline on the same access-controlled clinical cases, then produces version-bound subgroup performance deltas and a reproducible evidence record.
  whyNowCatalyst: >-
    Scarlet's funding and planned reviewer expansion signal growing capacity for specialist AI-device review, while
    trade coverage still reports six-to-eight-month cycles for minor updates and describes a mismatch between rapid
    model development and slower certification.
  ventureScalePath: Begin with evidence replays for one manufacturer's model-update workflow, then support multiple device lines, repeatable test protocols, and reviewer-ready evidence exports across jurisdictions without becoming a certification body.
solution: >-
  The manufacturer selects a previously reviewed baseline model, a candidate release, and a legally reusable,
  access-controlled clinical validation cohort. Before a run, its clinical and regulatory leads define the
  comparison protocol, clinically meaningful thresholds, and prespecified subgroups; the harness executes both
  versions against the same cases. It produces a version-bound record containing model identifiers, dataset manifest,
  protocol, subgroup deltas, exceptions, and reproducible outputs for the team's update review. A failed threshold
  routes to human assessment and additional evidence work; a passing replay is not represented as automatic regulatory
  approval.
goToMarketSeed:
  firstCustomer: A venture-backed AI medical-device manufacturer with a post-validation model update, an internal regulatory lead, and rights to a retained clinical holdout cohort.
  buyingTrigger: A planned model release that must be supported in a regulatory update review, especially when a prior update cycle has taken months.
  currentAlternative: Manual statistical analyses and document preparation by internal clinical and regulatory teams, supplemented by certification or regulatory consultants.
  switchingReason: The replay compares baseline and candidate on identical locked cases and produces a repeatable evidence record instead of relying on a fresh, manually assembled narrative for each version.
  pricingHypothesis: Annual fee per device line plus a fixed charge for each validated model-release replay.
