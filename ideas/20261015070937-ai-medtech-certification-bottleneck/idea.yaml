differentiator: >-
  Unlike a certification body, this product does not decide conformity or promise approval; it supplies an auditable
  comparison of a model release against the manufacturer's own locked clinical evidence. Unlike generic model
  monitoring, it is triggered by a proposed regulated release and preserves the exact baseline, cases, protocol, and
  subgroup results needed to discuss that change with reviewers.
