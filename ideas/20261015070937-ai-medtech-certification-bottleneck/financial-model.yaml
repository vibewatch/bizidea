scenarios:
  downside:
    description: "Paid line-months run 40% below base in each year while the hiring and non-payroll plan is unchanged."
    y3RevenueK: 342.0
    y3EbitdaK: -1551.767
    cashLowPointK: -868.601
    keyAssumptionChanges:
      - "40% fewer paid line-months than the base customer ramp (A23)."
      - "No hiring cuts are assumed, making downside cash conservative."
  base:
    description: "Base customer ramp reaches 5 lines by Y2 end and 10 by Y3 end at the modeled $80K annual ARPU."
    y3RevenueK: 570.0
    y3EbitdaK: -1392.167
    cashLowPointK: -573.669
    keyAssumptionChanges:
      - "Uses the base pricing, staffing, margin, and customer schedule (A2-A19)."
      - "No follow-on financing is included in the 36-month cash balance (A22)."
  upside:
    description: "Paid line-months run 30% above base with unchanged ARPU, gross margin, and planned costs."
    y3RevenueK: 741.0
    y3EbitdaK: -1272.467
    cashLowPointK: -352.470
    keyAssumptionChanges:
      - "30% more paid line-months than the base customer ramp (A23)."
      - "No additional hires or follow-on capital are assumed."
