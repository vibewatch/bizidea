slug: clinical-replay-change-gates
date: "2026-10-15"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Model start and pre-launch customers
    value: "Model starts 2026-10; 0 paying lines immediately before M1."
    unit: "date and count"
    source: "[business-plan.yaml.date and executiveSummary; first paid pilots are a plan, not existing customers]"
  - id: A2
    name: Paid pilot price
    value: "USD 20,000 per one-line retrospective pilot."
    unit: "USD per pilot"
    source: "[business-plan.yaml.gtm.pricing; low end of the stated $20,000-$30,000 operator-hypothesis range]"
  - id: A3
    name: Pilot service duration
    value: "Each pilot is delivered and recognized over 3 months."
    unit: "months"
    source: "Startup-finance modeling heuristic; the BP specifies one retrospective replay but does not specify delivery duration."
  - id: A4
    name: Y1 pilot cadence and conversion
    value: "Three paid pilots start in M1, M2, and M3; the first two convert to annual line contracts after their pilots, and the third ends after M5 without conversion."
    unit: "customer-line schedule"
    source: "[business-plan.yaml.gtm.funnelTargets, product.sixMonth, product.twelveMonth, and milestones; timing is an execution assumption aligned to 3 paid pilots and 2 conversions]"
  - id: A5
    name: Annual line subscription
    value: "USD 50,000 annual subscription per device line, the midpoint of the stated $40,000-$60,000 range."
    unit: "USD per line-year"
    source: "[business-plan.yaml.gtm.pricing; midpoint is a modeling choice, not observed willingness to pay]"
  - id: A6
    name: Annual replay fee
    value: "USD 30,000 for 1 modeled annual replay per line."
    unit: "USD per line-year"
    source: "Startup pricing heuristic; the BP specifies fixed per-release replay charges but no amount or annual frequency, and research found no public replay-product price."
  - id: A7
    name: Blended annual ARPU
    value: "USD 80,000 per active line-year = USD 50,000 subscription + USD 30,000 for 1 annual replay."
    unit: "USD per customer-year"
    source: "[A5 and A6; consistent with the BP's recurring line fee plus fixed per-release fee]"
  - id: A8
    name: Monthly customer schedule
    value: "Y1 customersEop by month are [1, 2, 3, 3, 3, 2, 2, 2, 2, 2, 2, 2]; new paid lines start in M1-M3 and are billed from their start month."
    unit: "customer lines"
    source: "[A2-A4 and business-plan.yaml.gtm.funnelTargets; assumes the 3 pilot commitments close within the first 3 months]"
  - id: A9
    name: Y2-Y3 customer ramp and revenue recognition
    value: "Quarter-end customers are [3, 4, 5, 5] in Y2 and [6, 7, 8, 10] in Y3; quarterly billable average is the midpoint of beginning and ending lines, with additions assumed at quarter midpoint."
    unit: "customer lines"
    source: "[business-plan.yaml.milestones: 5 recurring lines by month 24 and 10 or more by months 24-36; intermediate quarterly ramp is a modeler estimate]"
  - id: A10
    name: Revenue recognition convention
    value: "Monthly revenue = customersEop x USD 80,000 / 12; quarterly revenue = average paying lines x USD 80,000 / 4; no separate onboarding revenue is added."
    unit: "USD calculation"
    source: "[A7-A9; straight-line subscription and pilot service recognition for comparability]"
  - id: A11
    name: Gross margin and COGS
    value: "70% gross margin target; COGS is modeled at 30% of revenue."
    unit: "percent"
    source: "[business-plan.yaml.businessModel.targetGrossMarginPct and killCriteria; achieved margin is unvalidated]"
  - id: A12
    name: Fully loaded annual payroll budget
    value: "Founder CEO USD 120,000; founding engineer USD 150,000; clinical statistician USD 160,000 per FTE at 0.25 FTE; regulatory/QMS advisor USD 200,000 per FTE at 0.10 FTE; first customer implementation engineer USD 135,000; product engineers USD 140,000 each; implementation/customer-success engineers USD 130,000 each."
    unit: "USD per FTE-year, except fractional FTE values stated"
    source: "Internal startup-finance planning heuristic for fully loaded cash payroll, including employer costs; not an external salary survey or a BP commitment."
  - id: A13
    name: Hiring sequence
    value: "Core CEO, founding engineer, 0.25 statistician FTE, and 0.10 regulatory/QMS advisor FTE start M1; implementation engineer starts M9 after 2 paid pilots; product engineer starts M16; customer-success engineer starts M24 after the 5-line proof point; second product engineer starts M25; second implementation engineer starts M32."
    unit: "month and FTE schedule"
    source: "[business-plan.yaml.team and sequencingRationale; only the M9 implementation hire is specified, while later hires are gated startup-finance estimates]"
  - id: A14
    name: Y1 non-payroll operating budgets
    value: "Sales and marketing USD 60,000; research and development USD 240,000; general and administrative USD 150,000 for Y1, allocated monthly as shown in y1Monthly."
    unit: "USD per year"
    source: "Startup-finance heuristic for founder-led regulated-enterprise sales, customer-hosted product/security work, and legal/privacy setup; no observed spend is reported in the inputs."
  - id: A15
    name: Y2 non-payroll operating budgets
    value: "Sales and marketing USD 114,000; research and development USD 300,000; general and administrative USD 200,000 for Y2, spread evenly by quarter. The sales and marketing budget equals 3 expected new lines x USD 54,000 fully loaded CAC less USD 48,000 of CEO sales-time allocation already included in salary."
    unit: "USD per year"
    source: "Startup-finance heuristic for R&D and G&A; Y2 sales and marketing is reconciled to A20 and A9's 3 expected new lines."
  - id: A16
    name: Y3 non-payroll operating budgets
    value: "Sales and marketing USD 222,000; research and development USD 400,000; general and administrative USD 240,000 for Y3, spread evenly by quarter. The sales and marketing budget equals 5 expected new lines x USD 54,000 fully loaded CAC less USD 48,000 of CEO sales-time allocation already included in salary."
    unit: "USD per year"
    source: "Startup-finance heuristic for R&D and G&A; Y3 sales and marketing is reconciled to A20 and A9's 5 expected new lines."
  - id: A17
    name: Pre-seed amount and operating plan
    value: "USD 2,500,000, the midpoint of the USD 2,000,000-3,000,000 target range; 18-month operating plan with a 6-month buffer."
    unit: "USD and months"
    source: "[business-plan.yaml.fundingAsk.targetFundingRangeUsd and runwayMonths; no additional financing is assumed in the cash roll-forward]"
  - id: A18
    name: Use-of-funds allocation
    value: "Engineering USD 1,100,000 (44%); GTM USD 600,000 (24%); G&A USD 300,000 (12%); 6-month buffer USD 500,000 (20%)."
    unit: "USD and percent of round"
    source: "Modeler allocation of the BP's pre-seed proceeds across product, commercialization, overhead, and buffer; amounts sum to A17."
  - id: A19
    name: Six-month cash buffer
    value: "USD 500,000, rounded up from USD 491,166, equal to 6 months at the Q4Y2 net burn rate of USD 245,583 per quarter."
    unit: "USD"
    source: "[A15, A17, and the modeled Q4Y2 P&L; a reserve estimate, not incremental revenue]"
  - id: A20
    name: Fully loaded CAC
    value: "USD 54,000 per annual conversion = (USD 60,000 Y1 S&M + 40% of the USD 120,000 CEO payroll) / 2 annual conversions; Y2/Y3 sales-and-marketing budgets scale to the forecast 3/5 new lines at the same CAC, net of the USD 48,000 CEO sales-time allocation already counted in salary."
    unit: "USD per converted customer"
    source: "[business-plan.yaml.gtm.funnelTargets and product.twelveMonth; 40% CEO sales-time allocation is an internal CAC heuristic, and 2 conversions is the BP target]"
  - id: A21
    name: Monthly churn and customer life
    value: "1.5% monthly logo churn is a steady-state unit-economics heuristic; average life = 1 / 1.5% = 66.7 months. The base customer schedule is not churn-adjusted because no renewal data exist, so base revenue is optimistic and the churn sensitivity is illustrative."
    unit: "percent and months"
    source: "Generic early B2B SaaS planning heuristic; neither the BP nor research contains observed retention or renewal data."
  - id: A22
    name: Cash flow conventions
    value: "USD 2,500,000 is injected at time zero; cashEop = prior cash + EBITDA; no taxes, capex, interest, working-capital changes, or post-pre-seed financing are modeled."
    unit: "USD calculation"
    source: "[A17; simplifying startup-finance convention, with omitted financing explicitly flagged]"
  - id: A23
    name: Scenario volume cases
    value: "Downside has 40% fewer paid line-months than base in each year with no hiring cuts; upside has 30% more paid line-months at the same ARPU, margin, and cost plan."
    unit: "percent change"
    source: "Modeler scenario stress tests around the BP's unvalidated pilot conversion, rights qualification, and 10-line Y3 target."
  - id: A24
    name: Sensitivity cases
    value: "ARPU downside is -20%; CAC downside is USD 80,000 versus USD 54,000 base across 5 Y3 new lines; conversion downside removes 1 average Y3 line; sales-cycle downside delays 2 Q4 line starts by 1 quarter; churn downside rises from 1.5% to 2.5% and loses 1 line for half a year; gross-margin downside is 60% versus 70%; hiring downside moves the second implementation hire from M32 to M26; cashImpactK is cumulative ending-cash impact over the 36-month model."
    unit: "scenario inputs"
    source: "Startup-finance sensitivities based on the BP's pricing, funnel, gross-margin goal, staffing gates, and explicitly unverified sales-cycle and retention assumptions."
  - id: A25
    name: Directional operating benchmarks
    value: "Broad SaaS planning heuristics are USD 200,000-400,000 revenue per FTE and a sub-2.0x burn multiple at scale; both are non-sector-specific and not researched benchmarks."
    unit: "USD per FTE and ratio"
    source: "Illustrative benchmark range in the supplied financial-model template plus generic startup-finance heuristic; used only to flag model direction."
