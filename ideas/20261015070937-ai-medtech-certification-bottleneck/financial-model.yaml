    y3RevenueImpactK: 0.0
    cashImpactK: -65.0
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Accounts[Target accounts] --> Qualified[Rights-qualified device lines]
      Qualified --> Pilots[Paid retrospective pilots]
      Pilots --> Annual[Annual line conversions]
      Annual --> Revenue[Revenue at blended annual ARPU]
      Revenue --> GrossProfit[70% target gross profit]
      GrossProfit --> Cash[Cash after payroll and operating costs]
      Cash --> Milestone[Recurring lines and next-round proof]
modelSanity:
  - checkName: Revenue engine
    finding: "At $80K blended annual revenue per line, a churn-unadjusted ramp of 3.9 average active lines in Y2 and 7.1 in Y3 lifts annual revenue from $310K to $570K (A7-A10, A21)."
  - checkName: Must go right
    finding: "Two of the first three $20K pilots must convert, the 70% target margin must hold, and five recurring lines must be reached by month 24 to justify the pre-seed plan (A4, A11, A17)."
  - checkName: Model breaks if
    finding: "A 40% reduction in paid line-months leaves Y3 revenue at $342K and drives the modeled cash low point to -$868.6K without follow-on financing (A22-A23)."
  - checkName: Next-round proof
    finding: "By month 24, prove five recurring U.S. lines, two pilot conversions, a customer-accepted QMS export, and at least 70% repeat-run gross margin before modeled cash turns negative in Q3Y3 (A9, A11, A17)."
sanityChecks:
  ruleOf40: "Y3 revenue growth (570 / 310 - 1) = 83.9% plus EBITDA margin (-1,392.2 / 570) = -244.2%, for -160.4% combined; directionally poor while investing ahead of revenue."
  burnMultiple: "Y3 net burn USD 1,392.2K / net new ARR USD 400K = 3.48x, above the generic sub-2x SaaS planning heuristic at scale (A25)."
  revenuePerFte: "Y3 revenue USD 570K / 6.77 average FTE = USD 84K per FTE (11.9 FTE per USD 1M), below the broad USD 200K-400K SaaS planning heuristic (A25)."
  flags:
    - "The unfinanced base cash balance turns negative in Q3Y3 and ends Y3 at -USD 573.7K; only about USD 118K remains after the six months following the month-24 milestone, so a follow-on round or earlier hiring cuts are required (A17, A22)."
    - "The 3-pilot funnel, 2-of-3 conversion, standalone buyer budget, lawful cohort reuse, and renewal behavior are unvalidated, and the baseline customer ramp is not churn-adjusted; the 1.5% monthly churn input is used only for LTV and the sensitivity case (A4, A8-A9, A20-A21)."
    - "The 70% gross margin is a BP target; bespoke statistical, security, and customer validation work could keep delivery below target (A11, A14-A16)."
    - "Modeled $80K annual ARPU exceeds the research sizing proxy of $60K per line-year because it adds a hypothesized replay fee; neither the price premium nor volume is validated (A5-A7 and research.yaml.market)."
    - "Fully loaded CAC of USD 54K is based on only 2 modeled annual conversions and an assumed 40% CEO sales-time allocation, so the 5.76x LTV/CAC ratio is highly provisional (A20-A21)."
    - "Y3 revenue per FTE of USD 84K is below the broad SaaS planning heuristic, and the 7.35-FTE year-end team should remain gated on renewal and delivery-margin proof (A13, A25)."
    - "The research SAM and SOM use unverified 25% eligibility and USD 60K annual spend assumptions; they are not evidence of a forecastable buyer pool (business-plan.yaml.market and research.yaml.market)."
    - "The cash roll-forward excludes working capital, taxes, capex, and all follow-on financing; actual liquidity could be lower or the next round needed sooner (A22)."
