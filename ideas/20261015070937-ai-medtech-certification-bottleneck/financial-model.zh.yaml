slug: clinical-replay-change-gates
date: "2026-10-15"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: 模型起始时间与上线前客户数
    value: "模型从 2026-10 起算；M1 前付费设备线为 0。"
    unit: "日期与数量"
    source: "[business-plan.yaml.date 和 executiveSummary；首批付费试点属于计划，不代表已有客户]"
  - id: A2
    name: 付费试点价格
    value: "单条设备线回顾性试点收费 USD 20,000。"
    unit: "USD/试点"
    source: "[business-plan.yaml.gtm.pricing；取运营方假设区间 $20,000-$30,000 的下限]"
  - id: A3
    name: 试点服务周期
    value: "每个试点的交付与收入确认期为 3 个月。"
    unit: "个月"
    source: "创业公司财务建模惯例；BP 只说明进行一次回顾性重放，未说明交付周期。"
  - id: A4
    name: Y1 试点节奏与转化
    value: "三个付费试点分别在 M1、M2、M3 启动；前两个试点结束后转为年度设备线合同，第三个试点在 M5 结束后不转化。"
    unit: "客户设备线排期"
    source: "[business-plan.yaml.gtm.funnelTargets、product.sixMonth、product.twelveMonth 和 milestones；时间安排是执行假设，与 3 个付费试点、2 个转化目标一致]"
  - id: A5
    name: 设备线年度订阅费
    value: "每条设备线年订阅费 USD 50,000，取 $40,000-$60,000 区间中点。"
    unit: "每条设备线每年的 USD"
    source: "[business-plan.yaml.gtm.pricing；中点是建模取值，并非实测付费意愿]"
  - id: A6
    name: 年度重放费
    value: "模型按每条设备线每年重放 1 次，收费 USD 30,000。"
    unit: "每条设备线每年的 USD"
    source: "创业公司定价惯例；BP 规定按每次发布收取固定重放费用，但未给出金额或年频次，研究中没有公开的重放产品定价。"
  - id: A7
    name: 年度混合 ARPU
    value: "每条活跃设备线年收入为 USD 80,000，由 USD 50,000 订阅费和 1 次年度重放费 USD 30,000 构成。"
    unit: "每客户每年的 USD"
    source: "[A5 和 A6；与 BP 的设备线经常性费用加每次发布固定费用的模式一致]"
  - id: A8
    name: 月度客户排期
    value: "Y1 各月期末客户设备线数 customersEop 依次为 [1, 2, 3, 3, 3, 2, 2, 2, 2, 2, 2, 2]；M1-M3 均有新增付费设备线启动，并自启动当月起计费。"
    unit: "客户设备线"
    source: "[A2-A4 和 business-plan.yaml.gtm.funnelTargets；假设 3 个试点承诺在前 3 个月内签下]"
  - id: A9
    name: Y2-Y3 客户增长与收入确认
    value: "Y2 各季度末设备线数为 [3, 4, 5, 5]，Y3 为 [6, 7, 8, 10]；季度可计费设备线均值取期初与期末设备线数的中点，并假设新增设备线在季度中点加入。"
    unit: "客户设备线"
    source: "[business-plan.yaml.milestones：第 24 个月达到 5 条经常性设备线，第 24-36 个月达到 10 条或更多；各季度的中间增长路径为建模估算]"
  - id: A10
    name: 收入确认口径
    value: "月收入 = customersEop x USD 80,000 / 12；季度收入 = 平均付费设备线数 x USD 80,000 / 4；不另计客户导入收入。"
    unit: "USD 计算"
    source: "[A7-A9；订阅与试点服务均按直线法确认收入，以便比较]"
  - id: A11
    name: 毛利率与 COGS
    value: "毛利率目标为 70%；模型按收入的 30% 计入 COGS。"
    unit: "百分比"
    source: "[business-plan.yaml.businessModel.targetGrossMarginPct 和 killCriteria；实际毛利率尚未验证]"
  - id: A12
    name: 年度全成本薪酬预算
    value: "创始人兼 CEO 全成本年薪 USD 120,000；创始工程师 USD 150,000；临床统计师按 0.25 FTE 配置，全职年薪标准为 USD 160,000；法规/QMS 顾问按 0.10 FTE 配置，全职年薪标准为 USD 200,000；首位客户实施工程师 USD 135,000；产品工程师每人 USD 140,000；实施/客户成功工程师每人 USD 130,000。"
    unit: "USD/FTE 年；比例 FTE 岗位按注明的 FTE 计算"
    source: "内部创业公司财务规划惯例，用于估算含雇主成本的全成本现金薪酬；不是外部薪酬调查，也不是 BP 承诺。"
  - id: A13
    name: 招聘顺序
    value: "核心团队中的 CEO、创始工程师、0.25 FTE 统计师和 0.10 FTE 法规/QMS 顾问均在 M1 入职；完成 2 个付费试点后，M9 招聘实施工程师；M16 招聘产品工程师；达到 5 条设备线的验证节点后，M24 招聘客户成功工程师；M25 招聘第二位产品工程师；M32 招聘第二位实施工程师。"
    unit: "月份与 FTE 排期"
    source: "[business-plan.yaml.team 和 sequencingRationale；BP 只明确了 M9 的实施岗位招聘，之后的招聘节点均为附带条件的创业公司财务估算]"
  - id: A14
    name: Y1 非薪酬运营预算
    value: "Y1 销售与营销 USD 60,000、研发 USD 240,000、管理与行政 USD 150,000，按 y1Monthly 所示分摊到各月。"
    unit: "每年的 USD"
    source: "创业公司财务规划惯例，覆盖创始人主导的受监管企业销售、客户托管产品与安全工作，以及法律和隐私准备；输入材料没有报告实际支出。"
  - id: A15
    name: Y2 非薪酬运营预算
    value: "Y2 销售与营销 USD 114,000、研发 USD 300,000、管理与行政 USD 200,000，按季度均匀分摊。销售与营销预算按 3 条预期新增设备线 x 全成本 CAC USD 54,000 计算，再扣除已计入薪酬的 CEO 销售时间分摊 USD 48,000。"
    unit: "每年的 USD"
    source: "研发和管理与行政预算采用创业公司财务规划惯例；Y2 销售与营销预算与 A20 及 A9 预期新增的 3 条设备线对齐。"
  - id: A16
    name: Y3 非薪酬运营预算
    value: "Y3 销售与营销 USD 222,000、研发 USD 400,000、管理与行政 USD 240,000，按季度均匀分摊。销售与营销预算按 5 条预期新增设备线 x 全成本 CAC USD 54,000 计算，再扣除已计入薪酬的 CEO 销售时间分摊 USD 48,000。"
    unit: "每年的 USD"
    source: "研发和管理与行政预算采用创业公司财务规划惯例；Y3 销售与营销预算与 A20 及 A9 预期新增的 5 条设备线对齐。"
  - id: A17
    name: Pre-seed 融资额与运营计划
    value: "融资额为 USD 2,500,000，取 USD 2,000,000-3,000,000 目标区间的中点；运营计划覆盖 18 个月，另留 6 个月缓冲。"
    unit: "USD 与月份"
    source: "[business-plan.yaml.fundingAsk.targetFundingRangeUsd 和 runwayMonths；现金滚动预测未计入额外融资]"
  - id: A18
    name: 融资款用途分配
    value: "工程 USD 1,100,000（44%）；GTM USD 600,000（24%）；G&A USD 300,000（12%）；6 个月缓冲 USD 500,000（20%）。"
    unit: "USD 与本轮融资占比"
    source: "建模者将 BP 的 pre-seed 融资款分配给产品、商业化、管理费用和缓冲金；各项金额合计为 A17。"
  - id: A19
    name: 六个月现金缓冲
    value: "缓冲金为 USD 500,000（将 USD 491,166 向上取整），按 Q4Y2 每季度净消耗 USD 245,583 计算，可覆盖 6 个月。"
    unit: "USD"
    source: "[A15、A17 和模型中的 Q4Y2 损益表；这是储备金估算，不是新增收入]"
  - id: A20
    name: 全成本 CAC
    value: "每次年度合同转化的 CAC 为 USD 54,000 =（Y1 销售与营销（S&M）USD 60,000 + CEO USD 120,000 薪酬的 40%）/ 2 次年度合同转化；Y2/Y3 销售与营销预算按同一 CAC，分别对应预测新增的 3/5 条设备线，再扣除已计入薪酬的 CEO 销售时间分摊 USD 48,000。"
    unit: "每个转化客户的 USD"
    source: "[business-plan.yaml.gtm.funnelTargets 和 product.twelveMonth；CEO 销售时间分摊 40% 是内部 CAC 估算口径，2 次转化是 BP 目标]"
  - id: A21
    name: 月流失率与客户生命周期
    value: "月度客户流失率 1.5% 是稳态单位经济模型的估算值；平均生命周期 = 1 / 1.5% = 66.7 个月。由于没有续约数据，基准客户排期未按流失率调整，因此基准收入偏乐观，流失率敏感性分析仅供参考。"
    unit: "百分比与月份"
    source: "通用的早期 B2B SaaS 规划惯例；BP 和研究材料都没有实测留存或续约数据。"
  - id: A22
    name: 现金流口径
    value: "起始时点注入 USD 2,500,000；cashEop = 上期现金 + EBITDA；模型未计税款、资本开支、利息、营运资金变动或 pre-seed 之后的融资。"
    unit: "USD 计算"
    source: "[A17；采用简化的创业公司财务建模口径，并明确标出未计入的融资]"
  - id: A23
    name: 情景中的业务量假设
    value: "下行情景中，每年付费设备线月数都比基准少 40%，且不削减招聘；上行情景中，付费设备线月数多 30%，ARPU、毛利率和成本计划不变。"
    unit: "变化百分比"
    source: "建模者针对 BP 尚未验证的试点转化、权利资格认定和 Y3 的 10 条设备线目标做了情景压力测试。"
  - id: A24
    name: 敏感性情景
    value: "ARPU 下行 20%；CAC 下行情景中，Y3 新增 5 条设备线的 CAC 为 USD 80,000，基准为 USD 54,000；转化下行情景使 Y3 平均设备线数减少 1 条；销售周期下行情景将 Q4 的 2 条设备线推迟 1 个季度启动；流失率下行情景使月流失率从 1.5% 升至 2.5%，导致半年内流失 1 条设备线；毛利率下行情景为 60%，基准为 70%；招聘下行情景将第二位实施工程师的入职时间从 M32 提前到 M26；cashImpactK 表示 36 个月模型期末现金的累计影响。"
    unit: "情景输入"
    source: "创业公司财务敏感性分析，基于 BP 的定价、销售漏斗、毛利率目标、招聘门槛，以及明确标注为未验证的销售周期和留存假设。"
  - id: A25
    name: 方向性运营基准
    value: "广义 SaaS 规划惯例包括每 FTE 创收 USD 200,000-400,000，以及规模化后低于 2.0x 的烧钱倍数；两者都不针对特定行业，也不是经研究验证的基准。"
    unit: "每 FTE 的 USD 与比率"
    source: "所提供财务模型模板中的示例基准区间，加上通用创业公司财务规划惯例；仅用于提示模型表现方向。"
