modelDiagram:
  title: 单位经济模型流程
  mermaid: |
    flowchart LR
      Accounts[Target accounts] --> Qualified[Rights-qualified device lines]
      Qualified --> Pilots[Paid retrospective pilots]
      Pilots --> Annual[Annual line conversions]
      Annual --> Revenue[Revenue at blended annual ARPU]
      Revenue --> GrossProfit[70% target gross profit]
      GrossProfit --> Cash[Cash after payroll and operating costs]
      Cash --> Milestone[Recurring lines and next-round proof]
modelSanity:
  - checkName: 营收引擎
    finding: "按每条设备线年度混合收入 $80K 计算，未按流失率调整的增长路径在 Y2 平均有 3.9 条活跃设备线、Y3 平均有 7.1 条，年度收入由 $310K 增至 $570K（A7-A10、A21）。"
  - checkName: 必须跑通的关键条件
    finding: "要支撑 pre-seed 计划，前三个 $20K 试点中必须有两个转化、70% 毛利率目标必须守住；截至第24个月，还要达到五条经常性设备线（A4、A11、A17）。"
  - checkName: 模型失效情形
    finding: "如果付费设备线月数减少 40%，Y3 收入将降至 $342K；若没有后续融资，模型中的现金低点将降至 -$868.6K（A22-A23）。"
  - checkName: 下一轮融资前的验证目标
    finding: "截至第24个月，要验证五条美国经常性设备线、两次试点转化、客户认可的 QMS 导出文件，以及至少 70% 的重复运行毛利率；这些验证必须赶在模型显示现金于 Q3Y3 转负之前完成（A9、A11、A17）。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 (570 / 310 - 1) = 83.9%，加上 EBITDA 利润率 (-1,392.2 / 570) = -244.2%，合计 -160.4%；收入尚未跟上投入，整体表现偏弱。"
  burnMultiple: "Y3 净现金消耗 USD 1,392.2K / 净新增 ARR USD 400K = 3.48x，高于规模化 SaaS 通用规划惯例的 2x 以下参考线（A25）。"
  revenuePerFte: "Y3 收入 USD 570K / 平均 6.77 FTE = 每 FTE 创收 USD 84K（每 USD 1M 收入对应 11.9 FTE），低于广义 SaaS 规划惯例中的 USD 200K-400K（A25）。"
  flags:
    - "未计后续融资的基准现金余额在 Q3Y3 转负，Y3 年末降至 -USD 573.7K；现金只剩约 USD 118K，这是第 24 个月里程碑过后六个月时的余额，因此必须启动后续融资或更早削减招聘（A17、A22）。"
    - "3 个试点的销售漏斗、3 个转化 2 个的假设、独立买方预算、队列数据的合法复用以及续约行为都尚未验证；基准客户增长路径也未按流失率调整。月度流失率 1.5% 仅用于计算 LTV 和敏感性情景（A4、A8-A9、A20-A21）。"
    - "70% 毛利率是 BP 目标；定制统计、安全和客户验证工作可能让交付毛利率低于目标（A11、A14-A16）。"
    - "模型采用的年度 ARPU $80K 高于研究中的市场测算参考值——每条设备线每年 $60K，因为模型加计了假设的重放费用；无论价格溢价还是业务量都尚未验证（A5-A7 和 research.yaml.market）。"
    - "全成本 CAC USD 54K 只基于模型中的 2 次年度合同转化，并假设 CEO 将 40% 时间用于销售，因此 5.76x 的 LTV/CAC 比率仍是非常初步的估算（A20-A21）。"
    - "Y3 每 FTE 创收 USD 84K，低于广义 SaaS 规划惯例；年末 7.35 FTE 的团队规模仍应以续约和交付毛利率得到验证为前提（A13、A25）。"
    - "研究中的 SAM 和 SOM 建立在未经验证的 25% 资格符合比例和 USD 60K 年支出假设上；这并不能证明买方池可预测（business-plan.yaml.market 和 research.yaml.market）。"
    - "现金滚动预测未计营运资金、税款、资本开支或任何后续融资；实际流动性可能更低，下一轮融资也可能需要更早启动（A22）。"
