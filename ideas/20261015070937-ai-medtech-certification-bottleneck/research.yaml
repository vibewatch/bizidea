    - point: "Weak prospective patient-outcome evidence and limited subgroup analyses can lower reviewer or clinician confidence in another generated score."
      sourceRefs:
        - 21
        - 23
    - point: "The EU AI Act's high-risk product obligations currently have an extended transition to 2028, so some demand may be delayed or reprioritized."
      sourceRefs:
        - 7
