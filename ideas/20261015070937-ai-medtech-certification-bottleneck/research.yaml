  fiveForces:
    supplierPower:
      score: 4
      rationale: >-
        Manufacturers, hospitals, and data custodians control access to clinical cohorts and reference labels.
        Data-use rights and independent test-set quality can make switching suppliers difficult.
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    buyerPower:
      score: 4
      rationale: >-
        A relatively small number of eligible device programs may be able to choose among internal scripts,
        consultants, QMS vendors, and the certification body; enterprise buyers can demand security and workflow
        integration and may defer purchase.
      sourceRefs:
        - 15
        - 16
        - 17
    threatOfEntrants:
      score: 3
      rationale: >-
        The software is buildable with existing model-evaluation and registry tooling, but trustworthy clinical
        statistics, secure data access, and adoption within a validated quality system raise execution barriers.
      sourceRefs:
        - 3
        - 18
        - 19
        - 20
    threatOfSubstitutes:
      score: 5
      rationale: >-
        Strong substitutes include an internal statistical pipeline, regulatory consulting, notified-body services,
        QMS change workflows, open evaluation libraries, and federated benchmark infrastructure.
      sourceRefs:
        - 15
        - 16
        - 17
        - 18
        - 19
        - 20
    competitiveRivalry:
      score: 3
      rationale: >-
        The exact release replay category is not visibly crowded, but adjacent incumbents already own certification,
        change records, engineering workflows, model evaluation, and test-data infrastructure; they can bundle or
        partner into the wedge.
      sourceRefs:
        - 10
        - 15
        - 16
        - 17
        - 18
        - 20
  pestle:
    - factor: legal
      impact: negative
      point: "An authorized PCCP covers only specified modifications and protocols; successful performance evidence does not itself decide whether a change needs a new submission or notified-body approval."
      sourceRefs:
        - 2
        - 4
        - 12
    - factor: technological
      impact: negative
      point: "Repeatedly evaluating model updates on the same fixed test set can inflate apparent performance; representative cohorts, controlled access, uncertainty, and version provenance are essential."
      sourceRefs:
        - 3
        - 5
        - 21
    - factor: economic
      impact: positive
      point: "Specialist certification has attracted a reported $50 million expansion round, while market reports forecast strong growth in AI-enabled devices; neither fact establishes budget for this narrower tool."
      sourceRefs:
        - 10
        - 15
        - 22
    - factor: social
      impact: negative
      point: "Most cleared devices in a recent evidence census lacked linked prospective patient-outcome evaluation; a score-only replay could reinforce weak evidence unless its clinical relevance and subgroup limitations are clear."
      sourceRefs:
        - 21
        - 23
    - factor: political
      impact: positive
      point: "The UK AI Airlock's open Phase 3 and the FDA's lifecycle research show regulators are engaging with evolving-device evidence challenges, but neither is a procurement endorsement."
      sourceRefs:
        - 3
        - 9
  adoptionFrictionMatrix:
    - friction: Patient-data rights and controlled access
      severity: high
      affectedBuyer: "Regulatory, privacy, legal, and clinical data teams"
      mitigation: "Run within the manufacturer's controlled environment or use federated execution; verify consent, data-use scope, retention, and site agreements before pilot."
      sourceRefs:
        - 5
        - 20
        - 21
    - friction: Repeated test-set reuse and stale ground truth
      severity: high
      affectedBuyer: "ML validation leads, biostatisticians, clinical leads"
      mitigation: "Lock thresholds and cohort roles in advance; reserve independent test data or use statistically controlled sequential evaluation; report uncertainty and refresh reference standards."
      sourceRefs:
        - 3
        - 5
        - 21
    - friction: A passing replay is mistaken for regulatory authorization
      severity: high
      affectedBuyer: "Regulatory affairs and quality leadership"
      mitigation: "Make change categorization and submission decisions explicit human sign-offs; generate evidence under the approved PCCP or relevant change procedure."
      sourceRefs:
        - 2
        - 4
        - 12
    - friction: Integration into validated QMS and developer workflows
      severity: medium
      affectedBuyer: "Quality engineering, software, and IT/security"
      mitigation: "Export signed reports and provenance to existing QMS/model registries; minimize new system validation and support customer-hosted deployment."
      sourceRefs:
        - 16
        - 18
        - 19
    - friction: Weak outcome evidence or poor subgroup representation
      severity: high
      affectedBuyer: "Clinical leadership and device safety owners"
      mitigation: "Define clinically meaningful endpoints and subgroup minimums with clinical experts; treat missing populations as an evidence limitation, not a passing result."
      sourceRefs:
        - 5
        - 21
        - 23
market:
  tam:
    value: "$144.0M"
    rationale: >-
      Bottom-up annual-spend proxy: assume 2,400 global AI-device model-line equivalents (1,600+ U.S. FDA-listed
      device entries multiplied by a 1.5x international expansion factor) and $60,000 annual evidence-workflow spend
      per line, yielding 2,400 x $60,000 = $144M. The 1.5x geographic multiplier and annual spend are operator
      assumptions, not observed market data; device entries may duplicate product lines and include static models.
      This is a narrow serviceable workflow TAM, not the reported AI-device sales market.
    isEstimate: true
    sourceRefs:
      - 1
      - 22
  sam:
    value: "$36.0M"
    rationale: >-
      Apply a 25% eligibility assumption to the 2,400 global line universe for a planned/recurrent model change,
      a retained clinically representative cohort, and usable data rights: 600 eligible lines x $60,000 per year =
      $36M. No source measures this conversion rate; the FDA and research sources support the underlying need for
      careful update evaluation, not the assumed percentage.
    isEstimate: true
    sourceRefs:
      - 1
      - 3
      - 5
      - 20
      - 21
  som:
    value: "$1.8M"
    rationale: >-
      Operator-reachability case, not a forecast: capture 5% of the estimated 600-line SAM over an initial
      commercialization horizon (30 lines) at the same $60,000 annual spend proxy, or $1.8M annual revenue
      potential. A small standalone SOM would require evidence of multi-line expansion or broader workflow value
      before claiming venture-scale outcomes.
    isEstimate: true
    sourceRefs:
      - 1
      - 10
      - 21
bottomUpSizingDrivers:
  - driver: U.S. authorized AI medical-device inventory
    value: "More than 1,600 FDA-authorized AI-enabled device entries as of September 2026; not a unique-company count or an update-eligible count."
    source: "[1]"
  - driver: Global model-line multiplier
    value: "2,400 candidate lines = 1,600 U.S. entries x 1.5 international factor; estimate only and likely affected by overlapping authorizations."
    source: est.
  - driver: Eligible recurring-change share
    value: "25% of candidate lines, or 600, assumed to have both a planned update and a cohort with reusable rights; unmeasured."
    source: est.
  - driver: Annual spend proxy per eligible line
    value: "$60,000 per line-year, an operator assumption for sizing only; no replay-product price or contract value was published in fetched sources."
    source: est.
  - driver: Near-term capture
    value: "5% of SAM = 30 lines x $60,000 = $1.8M annualized opportunity; not a sales forecast."
    source: calc.
