regulatoryTechnicalConstraints:
  - point: "An FDA-reviewed PCCP must define modifications, validation/implementation methodology, and impact assessment; an outside tool cannot expand the approved change boundary."
    sourceRefs:
      - 2
      - 4
  - point: "Repeatedly reusing a fixed test cohort can inflate measured performance; cohort locking alone is insufficient and may make repeated evaluation less trustworthy."
    sourceRefs:
      - 3
      - 5
  - point: "AI-device test sets must represent intended populations and remain meaningfully independent of model development; subgroup sample sizes and uncertain reference standards may limit conclusions."
    sourceRefs:
      - 5
      - 21
      - 23
  - point: "Clinical-data access, processing location, reuse rights, and retention require customer-specific legal and security review; federated execution reduces data movement but does not itself grant rights."
    sourceRefs:
      - 20
      - 21
  - point: "EU MDR and the AI Act impose overlapping but distinct change, quality, documentation, and high-risk-system obligations; jurisdictional evidence mapping is needed."
    sourceRefs:
      - 7
      - 8
      - 12
  - point: "Customer-run or vendor-run software that affects regulated release decisions may add supplier qualification, validation, cybersecurity, and QMS integration work."
    sourceRefs:
      - 6
      - 16
      - 17
openQuestions:
  - "How many of the 1,600+ FDA-listed devices map to unique, active manufacturer model lines with a planned update and lawful retained cohort?"
  - "What annual spend is currently allocated to repeated model-update validation, and who controls it?"
  - "How does the manufacturer prevent repeated use of a sealed cohort from contaminating training or tuning decisions?"
  - "Which performance metrics, uncertainty bounds, and subgroup thresholds do regulators and notified bodies find adequate for each intended use?"
  - "Would a customer accept customer-hosted or federated execution, and who pays the site and ground-truth costs?"
  - "Can a tool output be validated once and reused, or does each manufacturer need to qualify the full software pipeline?"
  - "Will Scarlet, Ketryx, a consultant, or an internal team bundle sufficient replay functionality before an independent product secures distribution?"
