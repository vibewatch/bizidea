    weaknessVsUs: "The closest direct threat and possible bundle; public sources do not specify a customer-controlled paired replay product, but do not prove Scarlet cannot provide it."
    sourceRefs:
      - 10
      - 13
      - 14
      - 15
  - name: Ketryx
    stage: "Commercial AI-enabled medical-device software compliance platform"
    wedge: "QMS enforcement, traceability, change impact, release documentation, and developer-tool integrations"
    pricing: "No public price in fetched product documentation"
    strength: "Sits inside development workflows and can own change records and evidence traceability"
    weaknessVsUs: "Its public product description does not specify clinical cohort execution, paired model performance analysis, or subgroup deltas."
    sourceRefs:
      - 16
  - name: Innolitics
    stage: "Established specialist engineering and regulatory-services provider"
    wedge: "End-to-end SaMD development, AI/ML validation, V&V evidence, cybersecurity, and submission work"
    pricing: "Services appear scoped to client programs; no public price observed"
    strength: "Can combine engineers, clinical/AI expertise, regulatory strategy, and submission evidence in one team"
    weaknessVsUs: "Potentially labor-intensive per change and less standardized than a repeatable product; nevertheless a capable substitute."
    sourceRefs:
      - 17
  - name: "Evidently AI and MLflow"
    stage: "Open-source evaluation and MLOps tooling with commercial hosting options"
    wedge: "Model evaluation, dataset-aware comparison, test suites, experiment tracking, registry, and version lineage"
    pricing: "Open-source components available; hosted/enterprise terms not listed on the cited pages"
    strength: "Low-cost, flexible building blocks for internal paired tests and model/data provenance"
    weaknessVsUs: "Generic tooling leaves clinical protocol, test-data re-use safeguards, regulated QMS validation, and evidence interpretation to the manufacturer."
    sourceRefs:
      - 18
      - 19
  - name: MLCommons MedPerf
    stage: "Open-source medical-AI benchmark infrastructure and research platform"
    wedge: "Federated evaluation of medical models at data-owning institutions"
    pricing: "Open-source repository; no commercial replay price published"
    strength: "Demonstrates multi-site benchmarking without moving sensitive data into a central dataset"
    weaknessVsUs: "Public scope is benchmark infrastructure, not a per-manufacturer release-change approval workflow or reviewer-ready record."
    sourceRefs:
