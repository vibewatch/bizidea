championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: "A release-bound replay that compares baseline and candidate versions against the same documented cohort addresses a concrete regulator-science problem: performance evaluation for evolving AI models. No reviewed vendor page explicitly presents the complete manufacturer-controlled replay plus subgroup evidence record as its standalone product."
      sourceRefs:
        - 3
        - 10
        - 13
        - 14
    - point: "The proposed product is distinct from the notified body's conformity decision: it could give manufacturers an internal, repeatable test record before they engage the reviewer, provided it does not imply that a passing score itself authorizes a change."
      sourceRefs:
        - 2
        - 4
        - 15
  evidenceAgainst:
    - point: "The underlying method is not novel: FDA research explicitly studies sequential model modifications against repeatedly reused fixed test data, including how naive reuse inflates measured performance and how controlled access can reduce bias."
      sourceRefs:
        - 3
        - 5
        - 21
    - point: "Adjacent tools already support evaluation, versioning, traceability, and even federated medical-model benchmarking; the novelty is therefore the regulated release workflow and evidence packaging, not replay, cohort testing, or reproducibility as technical primitives."
      sourceRefs:
        - 18
        - 19
        - 20
    - point: "Scarlet already sells certification and ongoing product-change review to AI-device manufacturers, including customers who report frequent releases; this can absorb the workflow or be a partner, not an incumbent proven to fail."
      sourceRefs:
        - 10
        - 13
        - 14
        - 15
  revisedClaim: >-
    The defensible creative claim is narrower than a rare technical mechanism: a purpose-built, manufacturer-controlled
    release gate could combine prespecified clinical thresholds, statistically responsible cohort reuse, baseline versus
    candidate subgroup deltas, and version-bound evidence exports for regulated change review. Evidence supports this
    as a plausible vertical workflow niche, but does not establish that it is unique, that incumbents cannot bundle it,
    or that the replay shortens approval timelines.
reportMemo:
  executiveTakeaways:
    - "The pain is current and commercially visible: a specialist certification body has paying customers, a subscription-style ongoing review service, and customer-reported rapid update cycles, but no public price or independent buyer-budget data for a standalone replay tool."
    - "The mechanism is scientifically relevant but not technically rare. FDA research directly addresses repeated evaluation of evolving models on fixed test data; generic ML evaluation, model registries, and federated medical benchmarking are also available."
    - "Scarlet is the closest direct competitor and potential channel. QMS software, medical-device regulatory consultancies, and open-source evaluation stacks are credible substitutes."
    - "The reachable market is a modest, assumption-heavy evidence-workflow niche, not the multi-billion-dollar AI-device sales market. The estimate is capped by the number of device programs with an imminent update and legally reusable validation data."
    - "The key falsifier is whether a buyer can show a paid, recurring update-evidence problem that existing QMS, consultants, internal statisticians, or its certification body cannot resolve adequately."
  marketDefinition: >-
    Annual evidence-generation and change-control workflow for manufacturers of regulated AI medical-device software:
    replay a candidate model and approved baseline on a controlled clinical cohort, preserve the protocol and versions,
    and export results into existing quality and regulatory review. It excludes device sales, certification fees,
    clinical-trial revenue, and general AI observability.
  customerAndBuyer: >-
    The daily user is a regulatory-affairs or ML-validation lead; the economic buyer is usually a director or VP of
    regulatory affairs, quality, clinical operations, or R&D. The best-fit beachhead is an AI-device manufacturer
    with an established validation cohort, internal clinical/statistical ownership, an upcoming software-model change,
    and rights to run the cohort in a controlled environment. Quality, privacy/security, engineering, legal, and
    clinical-statistics stakeholders can all veto deployment.
  buyingTriggers:
    - point: "A planned update that must be assessed against a previously reviewed change protocol or disclosed in a marketing-submission change assessment."
      sourceRefs:
        - 2
        - 4
    - point: "A manufacturer already operating an update cadence that makes a months-long review bottleneck costly; Flok reports a goal of releasing upgrades twice monthly, while Lucida reports shipping an update within days of transferring its certificate."
      sourceRefs:
        - 13
        - 14
    - point: "A Class III EU device change that may affect safety or performance, where the change category and any required notified-body approval must be considered before validation results are used to argue that a change is minor."
      sourceRefs:
        - 8
        - 12
    - point: "A failure or subgroup regression found before release that would otherwise trigger further clinical, quality, or regulatory work."
      sourceRefs:
        - 3
        - 5
        - 21
  willingnessToPay:
    summary: >-
      There is directional budget evidence, not verified willingness to pay for this product. Scarlet describes a
      subscription covering surveillance, annual audits, and product changes; it also announced a $50 million Series B
      to expand certification capacity. Customers on Scarlet-hosted case studies describe rapid update needs. The
      sources do not disclose contract values, how much is allocated to replay versus certification, or whether
      manufacturers would buy a separate tool. Validate spend by reviewing recent update project budgets and seeking
      a paid pilot commitment from RA/quality buyers.
    sourceRefs:
      - 10
      - 13
      - 14
      - 15
  competitiveLandscape: >-
    The closest direct threat is Scarlet, which combines software/AI-device certification with ongoing update
    surveillance. Ketryx automates software-device QMS enforcement, traceability, and documentation; Innolitics sells
    integrated engineering, AI/ML validation, and regulatory submission services. Evidently and MLflow provide
    generic testing, evaluation, and model-version workflows, while MLCommons MedPerf offers open federated medical
    AI benchmarking. Internal statistical scripts plus the manufacturer's QMS and a consultant remain the status quo.
  incumbentThesis:
    - incumbentClass: Notified bodies and specialist certification services
      point: >-
        Scarlet's own announcement reports faster update cycles, and its ongoing service includes product-change
        reviews; a separate product cannot assume certification bodies are too slow or incapable. A cross-body,
        manufacturer-controlled replay could complement a notified body only if buyers need pre-review evidence
        independent of whichever body they use. No source proves that Scarlet's workflow lacks the proposed replay.
      sourceRefs:
        - 10
        - 13
        - 14
        - 15
    - incumbentClass: QMS and change-control platforms
      point: >-
        Ketryx integrates with developer tools and supports traceability, change impact analysis, QMS enforcement,
        and release documentation, which can own the workflow record. Its public product description does not
        explicitly describe running paired models on patient-level cohorts or producing clinical subgroup deltas.
      sourceRefs:
        - 16
    - incumbentClass: Regulatory engineering and consulting services
      point: >-
        Innolitics offers integrated software engineering, AI/ML validation, regulatory strategy, V&V evidence, and
        submission packages; this can meet bespoke needs. The potential gap is repeatability and marginal effort for
        every release, not lack of capable service providers.
      sourceRefs:
        - 17
    - incumbentClass: Generic MLOps and evaluation libraries
      point: >-
        Evidently and MLflow support model evaluation, dataset-linked comparisons, testing, versioning, and traceability.
        They lower build-versus-buy costs; the remaining work is clinical protocol design, safe test-data reuse,
        privacy controls, and regulatory-quality evidence context.
      sourceRefs:
        - 18
        - 19
    - incumbentClass: Open-source medical-AI benchmarking and internal builds
      point: >-
        MedPerf already provides federated evaluation for medical AI and can keep data at participating sites.
        Teams can also script baseline/candidate analysis internally. Neither public description is a productized,
        manufacturer-specific regulatory change gate, but both can be assembled into one.
      sourceRefs:
        - 3
        - 20
  regulatoryLandscape: >-
    FDA guidance recommends that a PCCP identify planned modifications, methods to develop, validate and implement
    them, and an impact assessment; the agency reviews a PCCP within a marketing submission. It is not a blanket
    requirement for every AI device, and passing a replay does not determine whether a new submission is needed.
    Existing 510(k) change guidance still matters. In the EU, MDR notified-body change assessment and the AI Act's
    high-risk product obligations are related but separate regimes; the European Commission page currently lists
    2 August 2028 as the application date for high-risk AI embedded in regulated products. UK AI Airlock provides
    an active regulatory collaboration channel, not a substitute approval route.
  technologyLandscape: >-
    Paired inference, cohort manifests, subgroup statistics, and model/version lineage are implementable with existing
    ML tooling. The hard part is statistical validity across repeated test-set use, patient-data custody and rights,
    reproducibility across model runtimes, and integrating outputs into the manufacturer's validated QMS. Federated
    execution is a credible option when cohort data cannot be centralized. A replay is a decision-support and evidence
    activity, not certification or a guarantee of clinical generalization.
  distributionChannels:
    - point: "Direct outreach to RA, quality, and ML-validation leads triggered by a planned model update or PCCP workflow; require a paid pilot to prove the budget."
      sourceRefs:
        - 2
        - 13
        - 14
        - 15
    - point: "Referrals from SaMD regulatory consultants, specialist notified bodies, clinical validation laboratories, and clinical data custodians."
      sourceRefs:
        - 9
        - 15
        - 17
        - 20
  partnershipEcosystem:
    - point: "Regulatory consultants or notified bodies can review test protocols and report formats, but commercial partnerships must preserve the body's independent conformity decision."
      sourceRefs:
        - 10
        - 12
        - 15
        - 17
    - point: "Hospitals, research institutions, and data custodians can support federated or customer-run evaluation where the manufacturer lacks broad, reusable data rights."
      sourceRefs:
        - 20
        - 21
  dataMoats:
    - point: "A customer's locked cohort is a customer-controlled asset, not a pooled startup data moat; permissions, ground-truth rights, and re-use limits must be explicit."
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    - point: "Defensibility could accrue in validated protocol templates, change-impact mappings, and secure execution integrations across device classes, but only with buyer permission and without reusing protected clinical data."
      sourceRefs:
        - 2
        - 16
        - 17
        - 20
  geographicConsiderations:
    - point: "The United States is the clearest quantified entry market: FDA lists more than 1,600 authorized AI-enabled devices as of September 2026, but that count is devices, not unique companies or eligible update programs."
      sourceRefs:
        - 1
        - 21
    - point: "EU MDR and the AI Act add separate documentation and conformity obligations; current Commission guidance states the high-risk regulated-product transition date is 2 August 2028."
      sourceRefs:
        - 7
        - 8
    - point: "The UK AI Airlock has completed two phases with 11 innovators and is open to broader Phase 3 applications; this is a partnership and learning channel, not proof of product procurement."
      sourceRefs:
        - 9
    - point: "International data rights, clinical reference standards, and representative cohorts vary by country and care setting, so a single US validation cohort cannot automatically support all markets."
      sourceRefs:
        - 5
        - 7
        - 20
        - 21
  sensitivityCases:
    - case: FDA device entries overstate distinct active model lines
      impact: >-
        If deduplication and active-update eligibility reduce the modeled population by half, the estimated global
        TAM falls from about $144M to about $72M at the same assumed annual spend; actual buyers may be fewer still.
      sourceRefs:
        - 1
        - 21
    - case: Fewer than one quarter of programs have both an imminent update and reusable cohort rights
      impact: >-
        The SAM falls proportionally; at 10% eligibility it is about 240 device-line equivalents and $14.4M annual
        spend under the same $60,000 assumption.
      sourceRefs:
        - 3
        - 5
        - 20
    - case: Reusing the same holdout becomes statistically unacceptable or yields stale ground truth
      impact: >-
        The product may need fresh cohorts, privacy-preserving external sites, or sequential test-data access controls;
        costs and contracting could erase the speed benefit.
      sourceRefs:
        - 3
        - 5
        - 20
        - 21
    - case: Existing body, consultant, or internal team bundles replay evidence
      impact: >-
        A separate product becomes a feature or service partner rather than a standalone buyer budget; the addressable
        market and capture share would be lower than the base case.
      sourceRefs:
        - 15
        - 16
        - 17
        - 18
  validationPlan:
    - priority: high
      question: "Do RA or quality buyers pay separately for recurring model-update replay, rather than treating it as part of certification, consulting, or QMS work?"
      evidenceToGather: "Interview at least 15 manufacturers with recent model changes; inspect redacted budgets, invoices, staffing time, and approval delays; seek at least three paid pilot commitments."
    - priority: high
      question: "Can target customers legally reuse a representative, adequately sized clinical holdout for repeated model comparisons?"
      evidenceToGather: "Review data-use agreements, consent/ethics scope, retention policies, subgroup coverage, ground-truth freshness, and minimum-sample requirements with customer counsel and clinical statisticians."
    - priority: high
      question: "Does a paired baseline/candidate replay reveal release-blocking regressions that today's workflow misses, without overfitting through repeated test-set exposure?"
      evidenceToGather: "Run a blinded retrospective test on several historical releases, lock thresholds before evaluation, assess calibration and subgroup uncertainty, and compare with an independent or sequentially protected test set."
    - priority: high
      question: "Will notified bodies, FDA-facing regulatory leads, or EU reviewers accept the artifact as useful supporting evidence without treating it as a conformity decision?"
      evidenceToGather: "Obtain written feedback from at least two regulatory consultants and two relevant reviewers on protocol, provenance, subgroup reporting, exceptions, and change categorization."
    - priority: medium
      question: "Can the tool integrate with each manufacturer's existing QMS and model registry without creating a new validated system burden?"
      evidenceToGather: "Prototype exports into one QMS and one MLflow-like registry; document supplier qualification, audit trail, access control, cybersecurity, and validation effort."
    - priority: medium
      question: "Which device classes and update types actually produce recurring, review-relevant replay work?"
      evidenceToGather: "Map 50 FDA AI-device entries to unique manufacturer/product lines, authorization pathway, model-update cadence, cohort rights, and expected change classification."
  validationSignals:
    - point: "Flok Health says it wants to release device upgrades twice a month and attributes that cadence to its specialist notified-body relationship; this is directional evidence of urgency, not proof of demand for a separate replay product."
      sourceRefs:
        - 13
    - point: "Lucida Medical's case study reports an update shipping within days of a certificate transfer, showing that some manufacturers prioritize update friction and reviewer fit."
      sourceRefs:
        - 14
    - point: "Scarlet announced $50 million to expand its AI certification body, and independent trade coverage describes an ongoing subscription with surveillance, audits, and product-change review."
      sourceRefs:
        - 10
        - 15
    - point: "FDA reports more than 1,600 authorized AI-enabled devices by September 2026; this demonstrates an expanding regulated inventory but does not establish recurring model changes."
      sourceRefs:
        - 1
    - point: "A 2026 evidence census found only 3 of 1,357 authorized devices linked to patient-centered outcomes evaluation, underscoring validation-quality concerns while not showing a purchase budget."
      sourceRefs:
        - 21
    - point: "The UK AI Airlock invites innovators to work on evolving AI, diagnostics, and post-market-surveillance challenges, creating a potential regulatory-learning channel."
      sourceRefs:
        - 9
