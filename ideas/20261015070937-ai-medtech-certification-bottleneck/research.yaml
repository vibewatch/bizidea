  tailwinds:
    - point: "The FDA lists over 1,600 authorized AI-enabled devices, enlarging the regulated installed base, although the count does not imply recurring changes."
      sourceRefs:
        - 1
    - point: "FDA PCCP guidance formalizes bounded post-market modifications and their validation methods, creating a clear evidence workflow around planned changes."
      sourceRefs:
        - 2
    - point: "Some manufacturers publicly report frequent releases and faster update cycles after choosing a specialist notified body."
      sourceRefs:
        - 13
        - 14
        - 15
  headwinds:
    - point: "A passing replay does not remove statutory change-assessment duties; FDA allows PCCPs but does not make them mandatory for every device."
      sourceRefs:
        - 2
        - 4
