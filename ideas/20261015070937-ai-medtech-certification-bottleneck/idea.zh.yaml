problem: >-
  AI 医疗器械团队迭代模型的速度，可能快过报道中的认证和更新周期；即便只是小幅更新，审评也可能耗时六至八个月。团队准备更换模型时，需要把新版本的证据与旧版本及其临床验证依据放在一起比较；现有报道指出了时间错位，却没有说明各家厂商目前如何整理这些证据。缺少可重复的版本级测试，团队就可能推迟有价值的更新，也可能把稀缺的临床和法规资源耗在每次更新都重新拼证据上。
targetUser:
  primary: AI 医疗器械厂商中，负责法规事务或 ML 验证、正在准备验证后的模型更新以供审评的负责人。
  secondary: AI 医疗器械厂商中的临床表现、质量工程和软件发布团队。
  buyer: 负责法规事务、质量或临床运营的副总裁或总监。
startupThesis:
  nonObviousInsight: 瓶颈不只在认证审评队列；每次模型更新都需要针对具体版本、可供审评人员查验的可比证据，不能把每次发布都当成一台全新的器械。
  beachhead: 已建立临床验证队列、并计划提交软件模型更新供法规审评的 AI 医疗器械厂商。
  wedge: 提供锁定队列重放服务：在同一批受访问控制的临床病例上运行候选模型和已获批基线，再生成绑定版本的亚组表现差异和可复现证据记录。
  whyNowCatalyst: >-
    Scarlet 融资并计划扩充审评人员，显示专业 AI 器械审评能力正在增长；但行业报道仍称小幅更新的审评周期长达六至八个月，并指出模型开发快、认证周期慢，两者并不同步。
  ventureScalePath: 先为一家厂商的模型更新工作流提供证据重放，再扩展到多条器械产品线、可重复的测试规程，以及覆盖多个司法辖区的审评就绪证据导出；始终不转型为认证机构。
solution: >-
  厂商选定一个此前已审评的基线模型、一个候选版本，以及依法可重复使用且受访问控制的临床验证队列。运行前，临床和法规负责人先定好对比规程、临床意义阈值和预先指定的亚组；测试框架再让两个版本跑过同一批病例。最终生成绑定版本的记录，列出模型标识、数据集清单、测试规程、亚组差异、异常情况和可复现输出，供团队审查更新。若未达到阈值，就转交人工评估并补充证据；即便通过重放，也不代表自动获得法规批准。
goToMarketSeed:
  firstCustomer: 一家获风险投资支持的 AI 医疗器械厂商，正准备验证后的模型更新，设有内部法规负责人，并有权保留临床留出队列。
  buyingTrigger: 厂商计划发布模型，必须为法规更新审评准备支持材料；尤其是此前一次更新周期已耗时数月时。
  currentAlternative: 由内部临床和法规团队手工完成统计分析、准备文档，再请认证或法规顾问补充支持。
  switchingReason: 重放在同一批锁定病例上比较基线和候选版本，产出可重复使用的证据记录，不必为每个版本重新手工拼一套说明材料。
  pricingHypothesis: 按器械产品线收取年费，每次经验证的模型版本重放另收固定费用。
whyNow:
  - point: 行业报道显示，审评周期为 12 至 18 个月，小幅 AI 器械更新也要六至八个月；在下一轮更新审评前，针对具体版本准备证据因此更有价值。
    signalRefs:
      - 报道中的更新审评延误
    sourceRefs:
