  - point: Scarlet 称，客户已把产品更新周期从数月缩短到数周；这是公司披露的结果，说明厂商看重更快的更新流程。
    signalRefs:
      - 公司披露的周期缩短
    sourceRefs:
      - 1
  - point: Scarlet 此轮 $50 million 融资将用于拓展美国和亚太地区业务、增聘审评人员，显示市场正投资建设专业审评能力。
    signalRefs:
      - 扩充审评能力
    sourceRefs:
      - 1
      - 2
  - point: 报道指出，技术文档评估是审评人员工作的一环；版本级证据记录因此有了明确的审评使用场景。
    signalRefs:
      - 技术文档审评
    sourceRefs:
      - 3
  - point: HIT Consultant 指出，AI 模型开发快于认证和更新周期；这与产品以模型变更为切口的路径一致。
    signalRefs:
      - 模型开发与审评周期错位
    sourceRefs:
      - 4
differentiator: >-
  这不是认证机构，不判定产品是否合规，也不承诺获批；它用厂商自己的锁定临床证据，对比模型版本并留下可审计记录。它也不是通用模型监控工具：只有厂商准备发布受监管版本时才触发测试，并保留讨论这次变更所需的确切基线、病例、规程和亚组结果。
conceptDiagram:
  title: 从临床重放到更新证据
  mermaid: |
    flowchart LR
      DeviceTeam["AI device model team"] --> Change["Candidate model update"]
      Change --> Replay["Replay baseline and candidate on locked cohort"]
      Replay --> Record["Version-bound subgroup evidence"]
      Record --> Review["Human regulatory review"]
      Review --> Outcome["Evidence-ready update decision"]
businessModelCanvas:
  customerSegments:
    - 有持续模型更新需求、并保留临床验证数据的 AI 医疗器械厂商
  valuePropositions:
    - 为每次候选模型发布提供可比、可复现的临床证据
    - 在进入审评周期前，及早发现亚组表现退化
  channels:
    - 直接触达法规事务和 ML 验证负责人
    - 由临床验证实验室和专业法规顾问引荐
  customerRelationships:
    - 付费试点期间共同设计测试规程并搭建队列
    - 按器械产品线提供年度客户支持，覆盖各次发布工作流
  revenueStreams:
    - 器械产品线年度订阅费
    - 每次模型版本重放收取固定费用
    - 收取队列和测试规程接入费
  keyResources:
    - 运行临床验证数据的安全环境
    - 可复现的模型版本与数据集清单工具
    - 临床统计测试规程专业能力
  keyActivities:
    - 配置受访问控制的队列重放
    - 生成可复现的亚组对比和证据记录
    - 维护测试规程与版本追溯链
  keyPartners:
    - 医疗器械厂商及其临床验证团队
    - 临床数据托管方和验证实验室
    - 审查拟议证据规程的法规顾问
  costStructure:
    - 安全部署和数据治理运营
    - 临床统计和法规测试规程专业能力
    - 模型运行基础设施和客户接入
jobsToBeDone:
  - job: 准备验证后的模型更新时，帮我在同一批临床病例上比较候选版本和旧版本，让我找出表现退化之处，并带着可复现证据进入审评。
    currentAlternative: 手工整理分析结果和支持文档，用于内部审查及法规咨询。
    successMetric: 候选模型冻结后，产出可复现、可供审评的对比记录所需时间。
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: 锁定队列重放把临床变更证据变成发布时的测试机制，而不是又一套认证文档流程。
  venturePotential:
    score: 4
    rationale: AI 医疗器械产品线反复更新，带来重复使用和扩展空间；但仅凭这组融资报道，无法确定市场规模和付费意愿。
  whiteSpace:
    score: 3
    rationale: 这个切口不同于认证机构审评，但 Scarlet 和现有认证机构构成了不小的竞争压力。
  painIntensity:
    score: 4
    rationale: 报道称小幅更新的审评周期也长达六至八个月，但独立测量客户实际延误的证据仍有限。
  wedgeClarity:
    score: 4
    rationale: 对于保留临床队列、且计划更新模型的团队，首个工作流很明确；不过队列权利和测试规程匹配情况会限制客户资格。
  evidenceFit:
    score: 4
    rationale: 多个报道来源都提到审评和更新周期长，但没有来源直接验证队列重放软件的需求，也没有证据证明审评人员会接受其输出。
topRisks:
  - name: 临床数据权利
    description: 厂商可能没有权利或治理依据，无法重复使用保留的患者队列进行模型版本测试。
    mitigation: 在厂商控制的环境中运行；只接纳权限和保留期限都有书面记录的队列。
  - name: 审评人员是否接受
    description: 在既有验证病例上重放，未必足以支持重大模型变更，也未必符合每位审评人员的预期。
    mitigation: 与每位客户的临床和法规负责人共同设计规程，保留透明输出，并明确重放只提供支持性证据，不代表获批。
  - name: 队列过拟合
    description: 反复接触固定队列，可能促使团队针对测试集调模型，削弱它作为独立证据的价值。
    mitigation: 实施访问控制，将开发集与密封评估集分开；需要时，按客户批准的规则轮换队列或补充新证据。
