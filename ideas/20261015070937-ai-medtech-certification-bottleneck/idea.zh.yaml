  nearestHistoricalIdeas:
    - slug: neural-load-replay-bench
      similarity: mechanism
      decisiveDifference: 那套测试台在电路板改版前，用可编程电极负载比较神经设备芯片；这个方案则在锁定的患者病例上比较历代医疗器械模型，为更新审评提供证据。
    - slug: rolling-ind-work-packets
      similarity: job
      decisiveDifference: 那套工作流为生物技术 IND 模块和后续站点任务做版本管理；这个产品检验不同发布版本的模型表现，不负责协调药品申报或临床试验启动。
    - slug: physics-change-test-gate
      similarity: mechanism
      decisiveDifference: 那个产品针对变化中的硬件几何结构运行热求解器测试；这个方案则让不同版本的医疗 AI 模型重放同一批临床输入，并报告亚组表现差异。
