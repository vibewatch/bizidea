pitch: AI 医疗器械每次更新前，先在锁定的临床队列中重放模型，让审评人员在下一次发布前比较版本证据。
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: 它把每次模型更新变成一次可复现的临床重放，直接使用器械自己的锁定队列；由此产出针对具体版本的证据，而不是再添一套文档流程。
  acceptedTradeoff: 产品依赖厂商保留依法可重复使用、且能代表临床人群的验证队列；缺少这类数据的团队进不了首批市场。
