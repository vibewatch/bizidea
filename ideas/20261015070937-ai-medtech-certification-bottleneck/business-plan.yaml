slug: clinical-replay-change-gates
date: "2026-10-15"
executiveSummary: >-
  We will sell a clinical replay change gate to AI medical-device manufacturers preparing post-validation model
  updates, not a new certification or regulatory decision service. For each release, the product runs the approved
  baseline and candidate model on the same rights-cleared cohort under a prespecified protocol and returns subgroup
  deltas with version, dataset, and run provenance. The first user is an RA or ML-validation lead and the likely
  economic buyer is a VP or director of regulatory affairs, quality, or clinical operations. Research reports
  six-to-eight-month review cycles for minor AI-device updates, but it does not establish standalone replay demand,
  buyer budget, or reviewer acceptance. The research sizing case is a $144M workflow TAM, $36M SAM, and $1.8M SOM,
  all assumption-heavy and capped by eligible device lines rather than broad AI-device sales. The defensible claim is
  a regulated release workflow and evidence record, not novel replay mathematics or ownership of customer clinical
  data; Scarlet, QMS platforms, consultants, and internal tools can bundle substitutes. This pre-seed plan funds
  paid-pilot proof of willingness to pay, lawful cohort reuse, and evidence utility before expanding deployment,
  hiring, or geography.
problem:
  - "Model teams can iterate faster than their review process; trade coverage reports six-to-eight-month cycles even for minor AI-device updates."
  - "For each proposed change, RA and validation teams need comparable baseline-versus-candidate results, subgroup analysis, and traceable evidence, while the supplied research does not establish how consistently current manual workflows deliver them."
  - "A retained cohort may not be legally reusable, representative, or statistically independent after repeated evaluation, limiting the eligible customer pool and risking misleading results."
solution:
  - "Run a customer-selected baseline and candidate model against the same documented clinical cases in a customer-controlled environment, after verifying cohort rights and intended-use scope."
  - "Lock the protocol, metrics, thresholds, subgroup definitions, model identifiers, and dataset manifest before execution; report uncertainty, missing coverage, exceptions, and version-bound deltas."
  - "Export a reproducible evidence record into the manufacturer's existing review and QMS workflow for human clinical, quality, and regulatory assessment."
  - "Treat the output as supporting evidence only; it does not decide change classification, submission requirements, conformity, or approval."
whyWeWin:
  - "For a regulated release, the product binds paired model execution, cohort manifest, prespecified subgroup analysis, and a traceable report into one repeatable workflow; generic evaluation and registry tools provide components but leave the clinical and change-control context to the manufacturer."
  - "Customer-hosted or, if demanded, federated execution can reduce unnecessary data movement and fit existing custody constraints, while making clear that deployment location does not grant data-use rights."
  - "Repeated customer deployments can build validated protocol templates and QMS/model-registry integrations; customer clinical data remains customer-controlled and is not the moat."
strategicChoices:
  beachhead: >-
    U.S.-first, FDA-authorized AI medical-device software teams with an internal RA or clinical-validation owner,
    a planned post-validation model change, and documented rights to a clinically representative retained cohort.
    Qualify the change under the manufacturer's applicable PCCP or change procedure before running evidence.
  wedgeRationale: >-
    A single device-line replay around an imminent model release creates a bounded buyer, cohort, and success
    measure, and can test paid demand before broad integrations. The FDA's more-than-1,600-device inventory is
    directional context, not a count of unique eligible buyers; the narrower market avoids treating device-market
    growth as software demand.
  sequencingRationale: >-
    First prove budget, cohort rights, and statistical validity with paid retrospective pilots; then automate a
    customer-run workflow and one evidence export; only after renewals add multi-line deployment and selective
    federation or jurisdiction mapping. Keep the founding team small and use fractional clinical-statistical and
    regulatory expertise until repeatable paid use justifies full-time implementation hiring.
  notYet:
    - "Do not act as a certification body, promise approval, or automate regulatory change classification."
    - "Do not target data-poor teams without a lawful, representative cohort; solving their data access is a separate business."
    - "Do not build a general MLOps monitor, broad QMS, pooled clinical-data asset, or full multi-jurisdiction regulatory suite."
    - "Defer EU commercial expansion and federated multi-site execution until U.S. renewals demonstrate demand and the deployment burden is measured."
market:
  tam: "$144M annual workflow estimate: 2,400 global device-line equivalents at an assumed $60,000 per line-year; the line count and spend are unverified."
  sam: "$36M estimated serviceable workflow: 600 lines after an assumed 25% update-and-cohort-rights eligibility rate, at the same unvalidated $60,000 spend proxy."
  som: "$1.8M annualized capture scenario: 30 lines, or 5% of the estimated SAM, at the same spend proxy; this is not a sales forecast."
  segments:
    - "Primary: AI medical-device manufacturers with an upcoming model update, an internal RA/validation owner, and legally reusable clinical evidence."
    - "Secondary: manufacturers with multiple AI-device lines or clinical validation labs supporting release evaluation under manufacturer-approved protocols."
  buyingProcess: >-
    RA or quality sponsors the use case; clinical statistics and ML validation approve protocol and cohort fitness,
    while privacy/legal, security, IT, and QMS owners can veto data access or deployment. Budget is likely controlled
    by RA, quality, clinical operations, or R&D, but the actual budget owner, procurement cycle, and standalone
    replay allocation remain unverified.
product:
  mvp: >-
    A customer-run container for one device line that pins baseline and candidate versions, cohort manifest, and
    prespecified protocol; executes paired evaluation and exports subgroup deltas, uncertainty, exceptions, and
    reproducible run metadata. Initial pilots include human statistical and RA review and do not claim automated
    regulatory sufficiency.
  sixMonth: >-
    Complete two paid retrospective pilots on qualified U.S. device lines, with access logging, locked protocol
    controls, and a customer-accepted evidence export; keep deployment to a single customer-controlled environment.
  twelveMonth: >-
    Productize repeat runs with role-based access, failure handling, signed run records, and one export into a
    customer's QMS plus one model registry; seek at least two annual device-line conversions from paid pilots.
  twentyFourMonth: >-
    Support multiple lines per customer and a repeatable deployment/validation package. Add federated execution or
    EU/MDR evidence mapping only if paid customers require it and measured security, statistical, and regulatory
    review costs preserve the product's economics.
  keyBets:
    - "A prespecified paired replay can reduce evidence-preparation effort without overstating clinical validity."
    - "At least some target manufacturers have enforceable rights to reuse a sufficiently representative cohort or can run it under their own controls."
    - "RA and quality buyers will pay separately for recurring release evidence rather than rely on the certification body, consultant, QMS, or internal scripts."
    - "One QMS/model-registry export can reduce adoption friction without requiring a new validated system at every customer."
gtm:
  wedge: >-
    Founder-led sale of a paid, one-device-line retrospective replay to a U.S. manufacturer immediately before a
    planned model update or change assessment; qualify cohort rights and protocol before selling a performance claim.
  channels:
    - "Direct outreach by the founder to RA, quality, and ML-validation leads with a known upcoming model change."
    - "Referrals from SaMD regulatory consultants, clinical validation laboratories, and clinical data custodians after protocol fit is established."
    - "Selective reviewer or notified-body feedback on report format, without implying endorsement or compromising independent conformity decisions."
  funnelTargets: "Operating target, not an observed benchmark: 30 named accounts to 15 buyer interviews, 8 update-and-cohort-qualified opportunities, 3 paid pilots, and at least 2 annual device-line contracts in 12 months."
  pricing: >-
    Test an operator-hypothesis $20,000-$30,000 paid pilot for one line and one historical or upcoming replay, then
    convert to a $40,000-$60,000 annual line fee plus fixed per-release replay charges and onboarding. These are
    hypotheses, not researched prices; the $60,000 research input is a sizing proxy, not verified willingness to pay.
businessModel:
  revenueStreams:
    - "Annual subscription per device line for protocol, version, and evidence workflow."
    - "Fixed fee per validated model-release replay."
    - "Paid initial cohort, protocol, and QMS/model-registry setup."
  unitOfValue: "One reproducible, customer-accepted release evidence record for a regulated AI-device line, with a defined cohort and protocol."
  targetGrossMarginPct: 70
  expansionLevers:
    - "More model-release replays on a renewing device line."
    - "Additional device lines and product teams within the same manufacturer."
    - "Standardized QMS and model-registry exports that lower repeat deployment effort."
    - "Later, customer-funded federated or jurisdiction-specific workflows if contract evidence supports them."
strategyMap:
  northStarMetric: "Quarterly count of replay evidence records accepted by customer RA or quality as fit for internal update review, per paying device line."
  inputMetrics:
    - "Median days from candidate-model freeze to complete, internally accepted evidence record."
    - "Share of qualified prospects with documented cohort reuse rights and a representative, sufficiently powered evaluation set."
    - "Paid-pilot-to-annual-contract conversion and annual renewal by device line."
    - "Share of runs reproducing from pinned model, dataset, protocol, and environment manifests without unresolved exceptions."
    - "Implementation hours and gross margin per replay after onboarding."
  moatsToBuild:
    - "Customer-approved protocol templates, subgroup reporting, and statistically controlled cohort-reuse practices by device type."
    - "Trusted provenance, access controls, and integrations into existing QMS/model registries that reduce repeat validation effort."
    - "Independent partner relationships for protocol feedback, without taking over regulatory decisions or pooling protected patient data."
  killCriteria:
    - "After 15 target-manufacturer interviews and at least 5 qualified update/budget reviews, fewer than 2 buyers commit to a paid pilot in the tested $20,000-$30,000 range."
    - "Fewer than 3 of 10 qualified prospects can document lawful access to a representative reusable cohort, or required cohort refresh costs erase the expected time benefit."
    - "In four historical-release comparisons, median evidence-preparation hours do not fall by at least 30% versus the customer's documented baseline, or reproducibility/protocol exceptions prevent trustworthy comparison."
    - "After structured feedback from at least two regulatory consultants and two relevant reviewers, fewer than 3 of 4 judge the record useful supporting evidence, or buyers routinely require the company to make the conformity/change decision."
    - "Fewer than 2 of the first 3 paid pilots convert to annual contracts, or repeat-run delivery cannot reach a 70% gross-margin target without substantial bespoke services."
  mermaid: |
    flowchart LR
      Trigger[Planned model update] --> Qualify[Rights and cohort qualification]
      Qualify --> Replay[Paired baseline-candidate replay]
      Replay --> Evidence[Version-bound subgroup evidence]
      Evidence --> Review[Human RA and clinical review]
      Review --> Expansion[More lines and recurring releases]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low-to-moderate conviction in a narrow workflow opportunity; customer urgency is visible, but separate budget, repeatability, and reviewer utility are unproven."
    whyBelieve: "Reported update delays and the FDA's evolving-model evaluation work support a real evidence problem, while a release-bound replay is a concrete, testable workflow wedge."
    whyDoubt: "No source validates a standalone replay purchase, the reachable market is an assumption-heavy $36M SAM, and Scarlet, QMS vendors, consultants, and internal teams can bundle substitutes."
    nextDiligence: "Secure three paid pilots with documented cohort rights, measure baseline-versus-candidate evidence effort on historical releases, and obtain independent feedback on the export's usefulness."
  firstCustomer:
    title: "U.S. AI medical-device manufacturer with an imminent model update and retained clinical holdout"
    profile: "An early-commercial or growth-stage manufacturer with one FDA-authorized AI-device line, an internal RA lead, an upcoming model change, and a controlled, rights-cleared validation cohort."
    trigger: "A candidate model is frozen and the team must prepare a PCCP or other applicable change assessment after a prior update review took months."
    buyer: "VP or director of regulatory affairs, quality, or clinical operations"
    initialContract: "Operator hypothesis: $20,000-$30,000 paid pilot for one device line and one replay, converting to a $40,000-$60,000 annual line agreement plus release fees only after utility and rights are validated; no public replay-product price was found."
  mustBeTrue:
    - "At least 3 of 15 interviewed target manufacturers commit to paid pilots, and at least 2 will pay within the tested $20,000-$30,000 range."
    - "At least 3 of 10 qualified prospects can document cohort-use rights, adequate subgroup representation, and a credible control against repeated-test-set contamination."
    - "On four historical updates, the workflow reduces median evidence-preparation hours by at least 30% while preserving protocol lock, reproducibility, and explicit uncertainty."
    - "At least 3 of 4 structured consultant/reviewer respondents judge the report useful supporting evidence, without treating a passing replay as approval or change classification."
    - "At least 2 of the first 3 paid pilots convert to recurring annual device-line contracts, with repeat-run gross margin capable of exceeding 70% and no incumbent bundle displacing the purchase."
  diligenceQuestions:
    - "Can the first three target buyers show actual update budgets, consultant invoices, or staff hours that fund a separate replay purchase?"
    - "What consent, contract, retention, and reference-label terms permit repeated execution on each proposed cohort, and what refresh or independent-set plan protects statistical validity?"
    - "Which historical update decisions and subgroup regressions would have changed if this paired replay had been available, and how is that measured against the existing pipeline?"
    - "What feedback have independent RA consultants or reviewers given on the report, and what parts would still require new clinical evidence or formal submission?"
    - "Can customers deploy and validate the runner in their controlled environment and export to their QMS without adding more supplier-validation burden than the workflow removes?"
    - "Will Scarlet, Ketryx, Innolitics, or an internal team provide a good-enough bundled substitute before the company reaches repeatable distribution?"
operatingAssumptions:
  - assumption: "The best initial customers have a retained, sufficiently representative cohort with rights for repeated model comparisons."
    basis: "idea.yaml"
    validationTest: "Review data-use, retention, consent, reference-standard, and subgroup terms with counsel and a clinical statistician for 10 qualified prospects; record which can run a pilot without new site contracting."
    decisionImpact: "If fewer than 3 prospects qualify, narrow to customer-hosted/federated evaluation only if buyers fund the added cost; otherwise stop this beachhead."
  - assumption: "RA or quality buyers will fund a separate replay pilot and recurring line subscription."
    basis: "research.yaml"
    validationTest: "Interview 15 manufacturers with a recent or imminent model change, inspect redacted update budgets or invoices where available, and obtain at least 3 paid pilot commitments rather than nonbinding interest."
    decisionImpact: "If buyers will not pay separately, pursue a channel/embedded product with a certification body or QMS vendor only if a partner funds integration."
  - assumption: "Paired replay is useful supporting evidence, but not sufficient by itself to authorize a device change."
    basis: "research.yaml"
    validationTest: "Run four blinded historical-release comparisons with thresholds fixed in advance and gather written protocol/report feedback from at least two consultants and two relevant reviewers."
    decisionImpact: "If the artifact does not help internal review or requires the company to make regulatory decisions, stop the standalone evidence-gate positioning."
  - assumption: "Customer-controlled execution can satisfy privacy/security constraints without excessive per-customer validation work."
    basis: "research.yaml"
    validationTest: "Prototype one customer-run deployment, document security and supplier-qualification requirements, and measure engineering plus validation hours through an accepted QMS export."
    decisionImpact: "If each deployment requires bespoke integration beyond the target margin, reduce scope to a partner-operated service or do not scale direct SaaS."
  - assumption: "A repeatable workflow can achieve more than 70% gross margin after onboarding despite statistical review and cohort setup."
    basis: "operator judgment"
    validationTest: "Time all delivery work across three pilots and five repeat runs; separate reusable product work from customer-specific analysis and calculate labor plus compute cost per accepted record."
    decisionImpact: "If repeat-run margin remains below 70%, reprice, narrow service scope, or treat the company as a specialized service rather than a venture software case."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Interview 15 RA, quality, and ML-validation leads who have a recent or imminent model update; request redacted budget, invoice, or staff-time examples."
    hypothesis: "The update owner can identify a separate, recurring evidence-preparation cost and a budget holder."
    successMetric: "At least 5 qualified update cases with named economic buyers and documented spend or effort, plus 3 paid-pilot commitments."
    owner: "Founder CEO / commercial lead"
  - horizon: "0–90 days"
    experiment: "Audit cohort rights, retention, intended-use fit, subgroup coverage, and holdout contamination risk with counsel and a statistician for 10 qualified prospects."
    hypothesis: "A meaningful subset can run a valid pilot on existing data without new patient recruitment or site agreements."
    successMetric: "At least 3 prospects pass a written cohort qualification checklist and identify the responsible data owner."
    owner: "Clinical-statistical lead with customer counsel"
  - horizon: "0–90 days"
    experiment: "Replay four historical releases in a blinded harness with the protocol and thresholds locked before unblinding; compare effort, reproducibility, and findings with the current workflow."
    hypothesis: "A paired run produces a repeatable comparison and reduces preparation work without overstating statistical certainty."
    successMetric: "At least 30% lower median evidence-preparation hours, reproducible manifests for all runs, and no unresolved protocol deviations."
    owner: "Founding engineer and clinical-statistical lead"
  - horizon: "0–90 days"
    experiment: "Review a sample evidence export with two regulatory consultants and two relevant reviewers; capture requested fields and any boundary against regulatory claims."
    hypothesis: "A transparent version-bound report is useful as supporting evidence while change classification remains with the manufacturer and reviewers."
    successMetric: "At least 3 of 4 respondents rate the report useful for internal update review and identify no misleading approval claim."
    owner: "Founder CEO / regulatory advisor"
  - horizon: "3–6 months"
    experiment: "Deliver paid customer-run retrospectives for one device line each and test a QMS evidence export in the customer's environment."
    hypothesis: "A narrow, customer-controlled deployment can pass security and quality review with limited bespoke work."
    successMetric: "Two paid pilots completed, one accepted export, and fewer than 80 engineering/validation hours per initial customer deployment."
    owner: "Founding engineer"
  - horizon: "6–12 months"
    experiment: "Convert pilot teams to annual line agreements and track repeat replay usage, human review time, and delivery cost."
    hypothesis: "The use case recurs across model releases and supports subscription plus per-replay pricing."
    successMetric: "At least 2 of the first 3 paid pilots convert to annual contracts and repeat-run gross margin trajectory exceeds 70%."
    owner: "Founder CEO / customer implementation lead"
  - horizon: "12–18 months"
    experiment: "Test referrals with two clinical validation or regulatory-consulting partners while preserving independent review."
    hypothesis: "Trusted specialists can source qualified opportunities more efficiently than founder-only outreach."
    successMetric: "Two partners each introduce one cohort-qualified opportunity and at least one opportunity enters a paid pilot; otherwise retain direct-only GTM."
    owner: "Founder CEO"
operations:
  - "Do not ingest patient-level data until customer counsel confirms rights and security review is complete; prefer customer-controlled execution and keep data in the authorized environment."
  - "Before each run, record the change scope, model and dataset versions, protocol, thresholds, subgroup minimums, holdout protections, and named human approvers."
  - "Report missing populations, uncertainty, data quality, and exceptions; a threshold pass is never represented as clinical generalization, regulatory clearance, or approval."
  - "Export signed run provenance and the customer-approved report into the existing QMS/model registry; maintain a supplier-validation and cybersecurity evidence pack for customer review."
  - "Use clinical-statistical and regulatory consultants for protocol critique; any notified-body relationship must preserve its independent conformity role."
team:
  - role: "Founder CEO / commercial lead"
    startTiming: "Month 0"
    rationale: "Run buyer discovery, secure paid pilots, map the economic buyer, and keep the product positioned as supporting evidence rather than certification."
  - role: "Founding engineer"
    startTiming: "Month 0"
    rationale: "Build the customer-run execution harness, pinned manifests, access logs, reproducibility controls, and first QMS/model-registry export."
  - role: "Clinical statistician / ML-validation lead"
    startTiming: "Month 0, fractional"
    rationale: "Set valid paired protocols, subgroup and uncertainty reporting, and controls for repeated holdout use before product claims are made."
  - role: "Regulatory and QMS quality advisor"
    startTiming: "Month 0, contracted"
    rationale: "Review applicable PCCP/change boundaries, report language, customer supplier qualification, and evidence-traceability requirements without replacing customer counsel."
  - role: "Customer implementation engineer"
    startTiming: "Month 9, conditional on two paid pilots"
    rationale: "Standardize customer deployment and exports only after repeated implementation tasks are visible; do not hire ahead of evidence of repeatable demand."
milestones:
  - horizon: "0–12 months"
    items:
      - "By day 90, interview 15 manufacturers, qualify at least 5 update cases, and obtain 3 paid-pilot commitments or pause product build."
      - "By month 6, complete two paid retrospective pilots with locked protocols, documented cohort rights, and reproducible reports."
      - "By month 12, convert at least 2 of the first 3 paid pilots to annual device-line contracts and demonstrate one customer-accepted QMS export."
      - "Keep direct sales U.S.-first and maintain explicit human change categorization and clinical review."
  - horizon: "12–24 months"
    items:
      - "Reach 5 recurring paid device lines only if pilot conversion and repeat usage support it; track renewals and gross margin by line."
      - "Reduce customer onboarding effort with a validated deployment package and repeatable QMS/model-registry integration."
      - "Decide whether federated execution or EU/MDR mapping merits investment only after at least two renewing U.S. customers request it and cost/security review is complete."
  - horizon: "24–36 months"
    items:
      - "Target 10 or more paid device lines through renewals, additional lines, and evidence-backed partner referrals; this remains contingent on the estimated market proving real."
      - "Standardize workflows for at least two device/update profiles without pooling customer clinical data or expanding into certification decisions."
      - "If fewer than 10 lines renew or the estimated $1.8M SOM remains the practical ceiling, favor embedded distribution or a narrower profitable business over unvalidated geographic expansion."
risks:
  - risk: "Repeated use of a fixed cohort inflates apparent performance, weakens independence, or relies on stale ground truth."
    likelihood: "High"
    impact: "High"
    mitigation: "Lock access and thresholds, separate development and evaluation sets, report uncertainty and subgroup limits, and require fresh or sequentially controlled evidence when the statistician determines reuse is no longer valid."
  - risk: "Manufacturers cannot document lawful rights or representative coverage for a reusable clinical cohort."
    likelihood: "High"
    impact: "High"
    mitigation: "Qualify rights before contracting, run within customer control, and reject cohorts with inadequate rights, labels, or intended-population coverage; test federation only where a buyer funds it."
  - risk: "Reviewers or customers treat the replay as an approval shortcut, or find it insufficient for material changes."
    likelihood: "Medium"
    impact: "High"
    mitigation: "State evidence limits in every report, require human change classification, align protocols to the customer's approved change procedure, and obtain independent feedback before making acceptance claims."
  - risk: "Scarlet or adjacent QMS, services, and open-source alternatives bundle enough paired evaluation to eliminate a standalone budget."
    likelihood: "High"
    impact: "High"
    mitigation: "Prove repeat-use savings and a distinct customer-controlled workflow in paid pilots; pursue partner or embedded distribution only with funded demand and preserved reviewer independence."
  - risk: "The researched market sizing overstates active update programs, distinct buyers, or annual spend."
    likelihood: "High"
    impact: "High"
    mitigation: "Map FDA inventory entries to unique active lines, updates, rights, and actual budget; do not hire or expand against TAM estimates absent paid conversion and renewal evidence."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–3M"
  runwayMonths: 18
  useOfFundsSummary: "An 18-month pre-seed target to build a secure customer-run replay and evidence export, fund clinical-statistical and regulatory expertise, complete paid pilots and cohort-rights validation, and convert repeat use before adding a deployment hire or pursuing geography; the round size is an operator target pending financial modeling."
