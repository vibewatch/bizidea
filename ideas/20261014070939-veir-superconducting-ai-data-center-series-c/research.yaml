market:
  tam:
    value: "$5.9B-$9.6B annual capacity-equivalent"
    rationale: >-
      Theoretical U.S. upper envelope, not a claim that every data-center MW needs or would lease a dedicated
      feeder. LBNL's 2030 low/high estimates of 521-843 TWh/year convert at 8,760 hours/year to about
      59.5-96.2 GW average load. Applying an explicitly unvalidated sizing proxy of $100,000 per MW-year yields
      $5.95-$9.62B/year. This proxy is for comparable market arithmetic only; it is not a price recommendation,
      observed willingness to pay, or evidence of a lease market.
    isEstimate: true
    sourceRefs:
      - 4
  sam:
    value: "$300M-$480M annual capacity-equivalent"
    rationale: >-
      Apply an operator-assumed 5% eligibility filter to the 59.5-96.2 GW U.S. average-load envelope to
      represent campuses with a behind-the-meter or co-located source, near-term AI hall, and physically
      constrained source-to-hall route. That produces about 3.0-4.8 GW, or $300-$480M/year at the same
      unvalidated $100,000/MW-year conversion proxy. The 5% factor is not sourced and is a central market
      validation risk; actual eligible load could be far lower.
    isEstimate: true
    sourceRefs:
      - 4
      - 5
      - 8
  som:
    value: "$10M annual capacity-equivalent"
    rationale: >-
      Five-year scenario assumption of 100 MW contracted across five campuses at an average 20 MW each,
      equivalent to $10M/year at the same unvalidated proxy. This requires moving from a 3-MW simulated
      demonstration to repeatable multi-megawatt customer deployments and signed anchor reservations. A
      one-campus 20-MW case is only $2M/year under the same arithmetic; neither case is supported by observed
      lease contracts.
    isEstimate: true
    sourceRefs:
      - 2
      - 4
bottomUpSizingDrivers:
  - driver: "2030 U.S. data-center annual electricity use"
    value: "521-843 TWh/year; LBNL reference case 649 TWh"
    source: "[4]"
  - driver: "Average continuous-load equivalent"
    value: "59.5-96.2 GW, calculated as 521-843 TWh divided by 8,760 hours"
    source: "calc from [4]"
  - driver: "Potentially eligible constrained-route share"
    value: "5% of projected average load, or about 3.0-4.8 GW"
    source: "est."
  - driver: "Capacity-lease revenue conversion variable"
    value: "$100,000 per MW-year; unvalidated analytical proxy, not a proposed price"
    source: "est."
  - driver: "Five-year serviceable portfolio scenario"
    value: "100 MW across five 20-MW customer routes; one 20-MW anchor campus would equal $2M/year at the proxy"
    source: "est."
categoryDynamics:
  growthRate: "LBNL estimates 9.5-15.3% of U.S. electricity use for data centers by 2030 (11.8% reference case); this is a load forecast, not a forecast of feeder-lease revenue."
  growthRateSourceRefs:
    - 4
  tailwinds:
    - point: "AI and data-center expansion are driving rising U.S. electricity demand; LBNL's updated estimate puts 2030 use at 521-843 TWh."
      sourceRefs:
        - 4
    - point: "Power availability and long-lead electrical equipment are influencing site plans, while concentrated Virginia load has increased materially."
      sourceRefs:
        - 5
        - 7
        - 18
    - point: "DOE explicitly supports onsite generation and storage as tools for large energy users, supporting the broader behind-the-meter ecosystem."
      sourceRefs:
        - 6
  headwinds:
    - point: "Grid connection remains preferred for most development and behind-the-meter systems still have to prove reliability, resilience, and redundancy."
      sourceRefs:
        - 5
    - point: "Demand growth may be served through generation, storage, transmission upgrades, efficiency, or facility relocation rather than denser feeder conductors."
      sourceRefs:
        - 6
        - 8
    - point: "A leasing company must finance and service site-specific assets before there is evidence of customer-scale performance or recurring contract economics."
      sourceRefs:
        - 1
        - 2
competitors:
  - name: "VEIR"
    stage: "Series C commercialization; 3-MW simulated demonstration reported"
    wedge: "Integrated superconducting cable, cooling, controls, terminations, and monitoring for high-density AI data-center power delivery."
    pricing: "No public system price, quote, or customer lease terms found in the fetched pages."
    strength: "Raised $110M Series C and reported total funding of $225M; independent trade coverage confirms a simulated 3-MW demonstration."
    weaknessVsUs: "The public evidence presents a technology-system supplier, not a third-party asset owner selling reserved corridor capacity; it also does not name a live commercial data-center adopter."
    sourceRefs:
      - 1
      - 2
  - name: "Nexans superconducting cable systems"
    stage: "Established cable supplier with utility-grid deployments and project references"
    wedge: "High-temperature superconducting cables, cryogenic systems, and related protection for high-capacity, space-constrained grid routes."
    pricing: "Project-specific; no public data-center feeder price or leasing rate found."
    strength: "Its Essen AmpaCity project operated for seven years and a separate Chicago REG project has been operational since 2021; both demonstrate field deployment beyond a lab."
    weaknessVsUs: "Evidence is for utility-grid projects, not a data-center capacity lease; as a cable/system supplier it could also be a supply partner rather than a direct contract-model competitor."
    sourceRefs:
      - 14
      - 15
      - 17
  - name: "PowerSecure data-center microgrids"
    stage: "Commercial service provider"
    wedge: "Modular power blocks, N+1 redundancy, demand flexibility, utility coordination, and immediate or permanent power solutions for data centers."
    pricing: "No public rate card; likely project-specific commercial terms, which were not disclosed on the fetched page."
    strength: "Addresses speed-to-power and reliability directly and offers modular/permit-support capabilities; therefore competes for the same infrastructure and resilience budget."
    weaknessVsUs: "The published offer is microgrid generation and power management, not a feeder-only lease for an already available source; generator footprint, emissions, and permits may be unsuitable for some sites."
    sourceRefs:
      - 12
      - 13
  - name: "Conventional cable, busway, and electrical EPC delivery"
    stage: "Mature incumbent architecture"
    wedge: "Customer- or utility-funded copper/aluminum feeder, busway, switchgear, cable tray, and standard EPC installation."
    pricing: "Usually quote- and project-specific; no comparable public price was found."
    strength: "Familiar electrical design and maintenance practices, established supplier ecosystem, and no cryogenic system; it is the rational default when route space and installation timing are adequate."
    weaknessVsUs: "Can require more conductors, route area, or civil works at very high transfer density; a superconducting alternative matters only if those constraints have a quantified cost."
    sourceRefs:
      - 5
      - 14
      - 15
  - name: "Utility service and owner self-build"
    stage: "Default procurement/status quo"
    wedge: "Grid service, customer-owned substation and feeder upgrades, or owner/EPC-designed distribution infrastructure."
    pricing: "Regulated tariff and site-specific upgrade costs; customer feeder equipment costs are not publicly itemized in the sources reviewed."
    strength: "Utilities and owners retain established control, operating procedures, and responsibility boundaries; Virginia's rate class makes some large-load cost obligations explicit."
    weaknessVsUs: "Service, upgrades, and procurement can be constrained by grid capacity or equipment lead times, but the lease does not solve upstream power supply and must still integrate with this incumbent system."
    sourceRefs:
      - 5
      - 8
      - 9
      - 11
      - 18
regulatoryTechnicalConstraints:
  - point: "FERC directed PJM to clarify co-located large-load transmission service and behind-the-meter-generation rules; customer service, net withdrawals, interconnection changes, curtailment, and upgrade-cost allocation require project-specific review."
    sourceRefs:
      - 11
  - point: "Virginia's SCC-approved GS-5 class covers customers demanding at least 25 MW from January 1, 2027 and requires minimum payments of 85% of contracted transmission/distribution demand and 60% of generation demand, creating a risk of overlapping fixed obligations."
    sourceRefs:
      - 9
  - point: "Onsite generation and microgrids require site-level air, land-use, and emissions diligence; vendor claims of compliant equipment do not replace independent permitting review."
    sourceRefs:
      - 8
      - 12
      - 13
  - point: "Public sources reviewed do not establish the superconducting feeder's electrical-code/listing pathway, insurer acceptance, fault-protection requirements, or field service-level agreement for a commercial data center."
    sourceRefs:
      - 2
      - 14
      - 15
  - point: "HTS performance depends on a cryogenic envelope and continuous coolant system; an asset company needs to own the cooling, monitoring, redundancy, repair, and end-of-life obligations rather than treating the cable as a passive conductor."
    sourceRefs:
      - 2
      - 14
validationSignals:
  - point: "Series C capital and the demonstration are supply-side commercialization signals only; no fetched evidence named a live data-center customer or disclosed unit economics."
    sourceRefs:
      - 1
      - 2
  - point: "Power availability is a present market concern, and Virginia's official study says meeting even half of unconstrained demand would require difficult additions of generation and transmission."
    sourceRefs:
      - 5
      - 8
  - point: "Large-load buyers face explicit minimum demand payments in Virginia, supporting the existence of power-capacity budgets but also raising the risk that a separate feeder lease duplicates fixed charges."
    sourceRefs:
      - 9
      - 10
  - point: "Superconducting cables have utility precedents in Essen and Chicago, but neither is a commercial data-center source-to-hall corridor."
    sourceRefs:
      - 15
      - 16
      - 17
openQuestions:
  - "How many U.S. AI campuses have an onsite/co-located generation source, a near-term hall, and a measured route-footprint bottleneck rather than an upstream grid constraint?"
  - "What would a comparable conventional feeder and a superconducting system cost per route and per deliverable MW, including cooling, installation, commissioning, spare capacity, and lifecycle service?"
  - "Will a data-center owner sign a feeder-only reserved-MW lease, and who holds the minimum-payment obligation if hall delivery, generation, or customer load is delayed?"
  - "Does the lease reduce customer balance-sheet/capital burden or instead introduce a second fixed capacity obligation alongside utility tariffs and power purchase agreements?"
  - "What commercial references, independent reliability data, protection studies, and insurance terms are required before an owner's engineer approves deployment?"
  - "Who owns cooling failure, cable quench, outage response, spares, and replacement liability, and can the asset company secure a supplier-backed availability guarantee?"
  - "What is the current enacted status of Virginia cost-allocation proposals reported in February 2026, and how do other target-state large-load tariffs differ?"
  - "Can the asset be refinanced and standardized across multiple sites, or does every route remain a bespoke construction project with limited residual value?"
