problem: >-
  Where an AI data-center campus has a behind-the-meter power source but limited feeder-route footprint, adding
  capacity may require a larger physical corridor or a novel superconducting package. Buying that package outright
  leaves the campus developer carrying the project capital and early deployment exposure; the available reporting
  describes demonstrations and reference-design work, not named customer deployments or commercial economics.
targetUser:
  primary: "Electrical-infrastructure development leads at U.S. AI data-center developers planning a behind-the-meter-powered hall where feeder-route footprint constrains the build."
  secondary: "Campus electrical project managers coordinating the power-source-to-hall route."
  buyer: "Capital-project CFO or infrastructure-development executive at the data-center developer."
startupThesis:
  nonObviousInsight: "The adoption bottleneck may be who finances and owns a high-density feeder during commercialization, not just whether the conductor can move power; a reserved-capacity lease changes the buyer's decision from equipment procurement to contracted campus capacity."
  beachhead: "One U.S. AI campus with behind-the-meter generation, a constrained route between its power source and a planned hall, and a developer willing to reserve capacity before construction."
  wedge: "Finance, install, and operate one superconducting feeder corridor, selling a defined megawatt block under a multi-year capacity lease."
  whyNowCatalyst: "VEIR's $110 million Series C is intended to accelerate commercialization; reporting also describes a 3-megawatt demonstration, reference-design work, and expected first commercial deployments in 2027."
  ventureScalePath: "Repeat the financed corridor lease across qualifying AI campuses, then refinance a portfolio of operating feeder assets and standardize the reserved-megawatt contract."
solution: >-
  Form an asset-owning project company for one behind-the-meter AI-campus feeder route with a documented footprint
  constraint. It finances, installs, and operates a superconducting corridor from the campus power source to the
  planned hall, contracting for the conductor and cryogenic package from the selected equipment supplier and for
  installation from an electrical EPC. The developer reserves an agreed megawatt block under a multi-year capacity
  lease, paying per reserved megawatt-month instead of purchasing the novel feeder as a one-off asset. Build only
  after an anchor customer signs the reservation and supplier and EPC service terms are agreed. Reuse the contract,
  route-planning process, and financing package on the next campus.
goToMarketSeed:
  firstCustomer: "A U.S. AI data-center developer with behind-the-meter power planned, one near-term hall expansion, and a constrained electrical route from the power source to the hall."
  buyingTrigger: "A new hall phase enters electrical design and capital budgeting, and the project team must commit to a feeder route and equipment package."
  currentAlternative: "Customer-funded copper cable trays and conventional feeder equipment procured through the campus electrical EPC."
  switchingReason: "The developer reserves a defined capacity block and transfers ownership of the superconducting corridor to a specialist asset company instead of carrying the full one-off equipment purchase."
  pricingHypothesis: "A site development fee followed by a fixed charge per reserved megawatt-month under a multi-year lease."
