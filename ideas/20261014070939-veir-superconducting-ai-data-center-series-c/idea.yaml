differentiator: >-
  This is neither a cable manufacturer nor a software layer: it owns a defined physical campus corridor and sells the
  right to reserve megawatts through it. The customer buys a capacity lease while the startup finances and operates
  the early superconducting asset, an approach distinct from supplier milestone escrow or financing equipment against
  a commodity offtake.
