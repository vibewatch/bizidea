jobsToBeDone:
  - job: "When an AI data-center campus has behind-the-meter power but its feeder route constrains a planned hall, help the infrastructure lead add reserved megawatts without owning another bespoke feeder asset, so the hall can be built without the full equipment purchase sitting on the project."
    currentAlternative: "Fund conventional feeder equipment and cable trays through the campus project budget, or redesign the route."
    successMetric: "Contracted megawatts delivered to the planned hall within the approved route footprint and commissioning schedule."
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: "The physical asset is known from the source signal, but selling reserved megawatts through an owned campus feeder is a less familiar commercialization structure than selling superconducting equipment."
  venturePotential:
    score: 4
    rationale: "A repeatable portfolio of contracted campus capacity could support substantial infrastructure revenue, but the opportunity depends on narrow site fit, large capital needs, and commercial validation."
  whiteSpace:
    score: 5
    rationale: "The complete history index has no data-center electrical-capacity lessor; the nearest infrastructure-financing idea serves industrial CO2 offtake, while adjacent test and escrow concepts monetize different jobs and mechanisms."
  painIntensity:
    score: 4
    rationale: "The source identifies higher power delivery in a smaller footprint and behind-the-meter data centers as the use case, but does not name a customer or quantify a specific campus constraint."
  wedgeClarity:
    score: 4
    rationale: "The first unit is one source-to-hall route and one reserved megawatt block, though suitable campuses and acceptable lease terms still need to be found."
  evidenceFit:
    score: 4
    rationale: "Funding, the 3-megawatt demonstration, reference-design work, smaller-footprint claim, and expected 2027 deployments support the timing and mechanism; customer economics and deployments are not disclosed."
topRisks:
  - name: "Unproven asset performance"
    description: "A project company may have to finance a long-lived feeder before customer-scale commercial operating results are available."
    mitigation: "Start with one capped pilot and require supplier and EPC performance, maintenance, and remedy terms before funding construction."
  - name: "Capital intensity"
    description: "Each corridor ties up substantial project capital and could become an underused asset if the campus build or reserved load slips."
    mitigation: "Secure a creditworthy multi-year capacity reservation and construction milestones before committing project capital."
  - name: "Supplier concentration"
    description: "Early deployments may depend on a small number of superconducting-system suppliers, creating price, availability, and service exposure."
    mitigation: "Contract for critical spares, service response, step-in rights, and clear lifecycle obligations, while qualifying alternative designs as they emerge."
