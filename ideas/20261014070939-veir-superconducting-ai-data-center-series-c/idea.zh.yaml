jobsToBeDone:
  - job: "当 AI 数据中心园区有表后电源，但馈线路径限制了规划机房的建设时，帮助基础设施负责人新增预留兆瓦容量，又不必持有另一项定制馈线资产；这样机房就能开建，而项目无需承担整笔设备采购款。"
    currentAlternative: "从园区项目预算中出资采购传统馈线设备和电缆桥架，或重新设计线路。"
    successMetric: "在获批的线路空间和调试进度内，向规划机房交付已签约的兆瓦容量。"
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: "信号源已提到这种实体资产，但通过自有园区馈线出租预留兆瓦，仍比直接销售超导设备更少见。"
  venturePotential:
    score: 4
    rationale: "可复制的园区签约容量组合有望支撑可观的基础设施收入，但机会受限于适用场地范围窄、资本需求大，而且商业模式尚待验证。"
  whiteSpace:
    score: 5
    rationale: "完整历史索引中没有出租数据中心电力容量的企业；最接近的基础设施融资创意服务于工业 CO2 承购，邻近的测试和托管创意则变现不同的任务和机制。"
  painIntensity:
    score: 4
    rationale: "信号源指出了小占地输送更多电力、以及表后供电数据中心这一用例，但未提及具体客户，也未量化某个园区的实际限制。"
  wedgeClarity:
    score: 4
    rationale: "首个单元是一条从电源到机房的线路和一个预留兆瓦区块，但仍需找到合适园区并谈妥可接受的租约条款。"
  evidenceFit:
    score: 4
    rationale: "融资、3 兆瓦演示、参考设计工作、更小占地的说法，以及预计于 2027 年首次商业部署，支撑了时机和机制判断；客户侧经济性和部署情况尚未披露。"
topRisks:
  - name: "资产表现尚未验证"
    description: "在有客户规模的商业运营结果出炉前，项目公司可能就得为长期使用的馈线出资。"
    mitigation: "先做一个规模封顶的试点；施工出资前，要求供应商和 EPC 承包商明确性能、维护和补救条款。"
  - name: "资本密集"
    description: "每条通道都会占用大量项目资本；如果园区建设或预留负载计划延后，资产可能利用不足。"
    mitigation: "投入项目资本前，先取得信用可靠的多年期容量预留承诺，并锁定施工里程碑。"
  - name: "供应商集中"
    description: "早期部署可能依赖少数超导系统供应商，带来价格、供货和服务风险。"
    mitigation: "在新方案出现时同步认证替代设计，并签明关键备件、服务响应、介入权和全生命周期责任。"
