problem: >-
  AI 数据中心园区若有表后电源，但馈线路径空间有限，扩容可能需要扩大实体馈线通道，或采用新型超导成套方案。直接买下这套方案，会让园区开发商承担项目资本支出和早期部署风险；现有报道只提到演示和参考设计工作，尚未披露具名客户部署或商业经济性。
targetUser:
  primary: "美国 AI 数据中心开发商的电气基础设施开发负责人；其规划建设的机房采用表后供电，且建设受馈线路径空间限制。"
  secondary: "负责协调电源到机房线路的园区电气项目经理。"
  buyer: "数据中心开发商负责资本项目的 CFO 或基础设施开发高管。"
startupThesis:
  nonObviousInsight: "高密度馈线能否普及，瓶颈可能不只是导体能否输电，还在于商业化阶段由谁出资并持有馈线；容量租约把买方的选择从采购设备，改为签约预留园区容量。"
  beachhead: "一家美国 AI 园区具备表后发电，电源与规划机房之间的线路空间受限，且开发商愿意在施工前预留容量。"
  wedge: "为一条超导馈线通道融资、安装并运营，再按多年期容量租约出租明确划定的兆瓦容量区块。"
  whyNowCatalyst: "VEIR 获得 $110 million C 轮融资，计划用来加快商业化；报道还提到一套 3 兆瓦演示系统、参考设计工作，以及预计于 2027 年启动首次商业部署。"
  ventureScalePath: "在符合条件的 AI 园区复制融资建设的通道租赁模式，再为运营中的馈线资产组合再融资，并统一预留兆瓦容量的合约。"
solution: >-
  为一条有书面记录证明空间受限的表后供电 AI 园区馈线路径，成立一家持有资产的项目公司。该公司为连接园区电源与规划机房的超导通道融资、安装并运营；从选定设备供应商采购导体和低温系统，并由电气 EPC 承包商负责安装。开发商签订多年期容量租约，预留约定的兆瓦容量，按每预留兆瓦·月付费，而不是一次性买下新型馈线资产。只有在锚定客户签署容量预留协议、并与供应商及 EPC 承包商敲定服务条款后，才启动建设。下一座园区可复用这份合同、线路规划流程和融资方案。
goToMarketSeed:
  firstCustomer: "一家美国 AI 数据中心开发商，计划采用表后供电，近期有机房扩建项目，且电源到机房之间的电气线路空间受限。"
  buyingTrigger: "新机房阶段进入电气设计和资本预算，项目团队必须确定馈线路径和设备方案。"
  currentAlternative: "通过园区电气 EPC 采购铜缆桥架和传统馈线设备，由客户出资。"
  switchingReason: "开发商锁定明确的容量区块，并把超导通道的所有权转给专业资产公司，而不是自行承担整笔一次性设备采购。"
  pricingHypothesis: "先收场地开发费，再按多年期租约，对每预留兆瓦·月收取固定费用。"
