differentiator: >-
  这既不是电缆制造商，也不是软件层：公司持有一条明确的园区实体通道，并出售预留兆瓦容量的使用权。客户签容量租约，初创公司则为早期超导资产融资并负责运营；这与供应商里程碑托管，或靠大宗商品承购协议为设备融资的做法不同。
