slug: leased-campus-power-corridors
date: "2026-10-14"
executiveSummary: >-
  The company will finance, install, and operate a superconducting source-to-hall feeder for a narrowly qualified
  U.S. AI data-center campus, then lease reserved megawatt-months rather than sell cable or software. Its first
  customer must have a credible behind-the-meter power source, a near-term hall phase, and an owner-engineer-verified
  route constraint; the buying moment is the electrical design and capital gate, not general concern about power.
  The initial product is a paid route-feasibility package and conditional capacity reservation, converting to a
  multi-year lease only after supplier and EPC quotes, approvals, tariff treatment, customer credit, and project
  financing are clear. Research reports VEIR's $110M Series C to accelerate commercialization, a 3-MW data-center
  demonstration in a simulated environment, and prospective first deployments in 2027, but no named commercial
  data-center customer, customer-approved route study, lease rate, or operating economics. Data-center load growth
  supports urgency but does not establish feeder-lease demand:
  the reported SAM of $300M-$480M depends on an unvalidated 5% route-fit assumption and a $100,000/MW-year
  arithmetic proxy that is not a price. Conventional feeders remain the rational default where routes fit, and
  this product cannot solve generation, interconnection, or transformer constraints. The plan is therefore a
  stage-gated seed-stage infrastructure business: do not construct a corridor without an anchor reservation,
  acceptable service and risk terms, and project-level capital.
problem:
  - "A small subset of AI-campus projects may have an available behind-the-meter source and a planned hall, but not enough source-to-hall route footprint for conventional feeders at the required transfer capacity."
  - "Buying a novel superconducting package outright would leave the developer with bespoke asset capital and early deployment risk; no researched source establishes that buyers will instead accept a feeder-only capacity lease."
  - "A denser feeder cannot create generation, utility service, interconnection rights, or transformer capacity, so broad power scarcity is not proof that this specific route problem exists."
solution:
  - "Originate only sites where an independent route review confirms the feeder itself is the binding constraint and the proposed power source and hall schedule are credible."
  - "Use a project company to contract for the superconducting and cryogenic package, EPC installation, commissioning, operations, and maintenance; sell a defined reserved-MW block on a multi-year lease."
  - "Charge a site-development fee followed by a fixed reserved-MW-month payment, with construction conditional on a creditworthy reservation, technical and regulatory acceptance, defined remedies, and financeable project terms."
whyWeWin:
  - "The offer transfers ownership and initial asset capital from a qualifying campus developer to a specialist corridor owner; it wins only if the customer values that transfer enough to pay a recurring capacity charge."
  - "Unlike a cable-only sale, the unit of contract is reserved feeder capacity with an agreed operating boundary; this can join route engineering, procurement, service, and financing in one customer decision."
  - "The advantage is not proprietary superconducting technology: supplier and utility precedents are adjacent, while conventional EPC, utility service, and microgrids can win whenever they solve the actual constraint at lower lifecycle cost or risk."
strategicChoices:
  beachhead: "One U.S. AI data-center campus with a credible behind-the-meter source, a near-term hall phase, and a documented source-to-hall route-footprint constraint."
  wedgeRationale: "This is deliberately asset-heavy and initially supplier-concentrated, so it only fits campuses where denser power delivery justifies a long-term capacity lease. A single route is narrow enough to test the buyer, conventional alternative, supplier, permitting, tariff, and financing boundaries before taking asset risk; broader power-shortage messaging would confuse a feeder bottleneck with generation or grid-access problems."
  sequencingRationale: "First sell a paid feasibility study and prove the route, source, alternative, and buyer economics; then obtain the reservation, supplier/EPC risk terms, stakeholder acceptance, and project financing; only then build. Keep parent-company capital on origination and engineering, hire asset-finance and operating capacity against signed project gates, and seek portfolio refinancing only after field data."
  notYet:
    - "Do not target sites whose binding issue is generation, utility interconnection, transmission service, or transformer availability."
    - "Do not own or sell generation, a microgrid, a utility service, or general campus power-management software."
    - "Do not manufacture superconducting cable or expand to utility-grid and non-data-center routes before a data-center corridor has commercial operating evidence."
    - "Do not fund construction from corporate seed capital or install an unreserved asset."
market:
  tam: "Research scenario only: $5.9B-$9.6B annual capacity-equivalent, calculated from the 2030 U.S. data-center average-load envelope and an unvalidated $100,000/MW-year proxy; this is not observed lease revenue or a validated TAM."
  sam: "Research scenario only: $300M-$480M annual capacity-equivalent after applying an operator-assumed 5% route-eligible share to projected U.S. load and the same unvalidated proxy; the eligible share may be materially lower."
  som: "Five-year scenario: $10M annual capacity-equivalent for 100 MW across five campuses at the same proxy; one 20-MW campus would equal $2M/year arithmetically, not as a quoted price or observed ACV."
  segments:
    - "Primary: U.S. AI data-center developers with a credible behind-the-meter source, near-term hall, and independently verified constrained feeder route."
    - "Secondary, unvalidated: other U.S. data-center campuses with the same source, schedule, and route-fit conditions after the first commercial reference."
  buyingProcess: "The electrical-infrastructure development lead and owner's engineer identify the route issue during hall design; the infrastructure-development executive or capital-project CFO controls the investment, while the EPC, reliability team, utility or RTO, AHJ, and insurer can veto design-in. The specific cycle length and payment budget for a feeder-only lease are unknown and must be established at the first site."
product:
  mvp: "V1 is a site-specific predevelopment package: verified source and route constraints, a like-for-like conventional alternative, supplier/EPC quotes, a cooling, protection, maintenance, and commissioning plan, and a conditional lease term sheet. It excludes construction until customer credit, tariff treatment, technical approvals, service remedies, insurance, and project capital are resolved."
  sixMonth: "Complete qualification and route studies for at least two candidate sites, obtain comparable system and EPC pricing for one, and secure written owner-engineer and buyer feedback on a paid feasibility and minimum-reservation structure; no asset construction is assumed."
  twelveMonth: "Close one paid feasibility engagement or conditional capacity reservation and complete the site-specific technical, tariff, insurance, customer-credit, and lender package; authorize construction only if each gate is satisfied."
  twentyFourMonth: "If a qualified anchor and project financing close, commission one corridor with independent testing and measure capacity, availability, faults, service response, and installed lifecycle cost; otherwise preserve capital and continue predevelopment rather than build speculatively."
  keyBets:
    - "At least two of ten screened design teams will have a source-to-hall constraint that conventional routing cannot solve without material footprint, schedule, or civil-work consequences."
    - "A developer will pay a feasibility fee and accept a multi-year minimum reserved-MW payment to transfer ownership and performance risk."
    - "The all-in route economics will be competitive after cryogenic loads, redundancy, installation, maintenance, insurance, spares, and tariff obligations."
    - "An equipment supplier and EPC will support clear performance guarantees, lifecycle service, repair boundaries, and step-in rights."
    - "A project lender or infrastructure investor will finance a single-site asset against a creditworthy reservation without uncapped parent-company recourse."
gtm:
  wedge: "Directly qualify a single planned hall phase with an existing or contracted behind-the-meter source; require owner-engineer evidence that route geometry, not upstream power availability, limits the planned transfer."
  channels:
    - "Founder-led business development with data-center infrastructure-development leads and capital-project CFOs during site planning and electrical design."
    - "Design-in and route qualification through the customer's owner's engineer, electrical EPC, commissioning partner, and behind-the-meter project developer."
    - "Early utility or RTO coordination and independent regulatory counsel to define the feeder boundary and prevent the lease from implying generation or transmission rights."
    - "Approach infrastructure lenders, lessors, insurers, and surety providers only after a customer reservation and supplier/EPC scope exist."
  funnelTargets: "First 12-month operating target: screen 10 campus design teams, validate at least 2 route-constrained sites with credible sources, and secure at least 1 paid feasibility study or conditional minimum-capacity reservation. No historical conversion baseline exists; count production conversion only after price, tariff, credit, and service terms are documented."
  pricing: "Charge a one-time site-development fee for route-specific engineering, then a fixed charge per reserved MW-month under a multi-year lease, with defined ramp, availability, curtailment, and remedy terms. No fee, lease rate, term length, or ACV is validated; set price only from supplier/EPC quotes, lifecycle cost, tariff review, customer willingness to pay, and lender requirements. The research's $100,000/MW-year figure is an analytical sizing proxy, not a price recommendation."
businessModel:
  revenueStreams:
    - "One-time site development and feasibility fee."
    - "Recurring fixed charge per reserved MW-month under a multi-year corridor-capacity lease."
  unitOfValue: "A creditworthy MW-month of commissioned source-to-hall transfer capacity delivered within the contracted service and availability boundary; the company does not sell energy."
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add reserved capacity or a second feeder at the same campus only after contracted demand and operating evidence support the additional asset."
    - "Replicate the route study, contract, supplier/EPC scope, and service model at another qualifying campus after the first corridor clears its availability and economic tests."
    - "Refinance a portfolio of operating assets only after lenders can underwrite measured service costs, customer credit, and residual value."
strategyMap:
  northStarMetric: "Creditworthy commissioned MW-months delivered within the contracted service level, net of outage credits; report reserved but uncommissioned MW separately."
  inputMetrics:
    - "Qualified campuses with documented power-source status and owner-engineer-confirmed route constraints."
    - "Paid feasibility studies and conversion to minimum-payment capacity reservations."
    - "Percentage of site proposals with like-for-like lifecycle, schedule, tariff, insurance, and lender review complete before construction approval."
    - "Contracted versus commissioned MW, project-capital committed, and customer ramp or cancellation exposure."
  moatsToBuild:
    - "Reusable site-level route, installation, cooling, fault, repair, and lifecycle-cost evidence; it does not yet exist at commercial data-center scale."
    - "Supplier, EPC, insurer, customer, and lender contract interfaces that allocate performance and failure obligations clearly."
    - "A repeatable underwriting and refinancing record across corridor assets; cable IP remains with suppliers unless separately licensed."
  killCriteria:
    - "After screening 10 target design teams, fewer than 2 independently verify a feasible source-to-hall route bottleneck."
    - "By month 12, no creditworthy customer has paid for feasibility or signed a conditional minimum-payment reservation with an identified budget owner and tariff treatment."
    - "No qualified site meets the operator-set customer hurdle of at least 10% lower lifecycle cost or at least 6 months earlier commissioned capacity versus the approved conventional route."
    - "A supplier/EPC cannot provide financeable lifecycle service, performance remedies, and failure-response terms, or the owner engineer, utility/AHJ, or insurer identifies an unresolved fatal approval barrier."
    - "No lender or infrastructure investor offers actionable project-level financing terms after a customer reservation, without uncapped parent recourse."
  mermaid: |
    flowchart LR
      Wedge["One source-ready campus with a verified route constraint"] --> MVP["Paid feasibility and conditional reserved-MW lease"]
      MVP --> Proof["Signed anchor, accepted design, financeable service terms"]
      Proof --> Pilot["Commission one corridor and measure real performance"]
      Pilot --> Expansion["Repeat only after service and lifecycle economics pass"]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low conviction: a differentiated financing wrapper is plausible, but route-level demand, lease economics, and commercial reliability are unproven."
    whyBelieve: "Sector power demand and utility superconducting precedents support a real infrastructure context, while the reviewed offers do not show a feeder-only capacity lease."
    whyDoubt: "The reported data-center demonstration was simulated, upstream power constraints dominate many projects, and no named buyer, accepted route, lease rate, or site economics were found."
    nextDiligence: "Review anonymized route drawings and source status for at least two campuses, then test whether one creditworthy buyer will pay for feasibility and reserve capacity against a quoted, approved design."
  firstCustomer:
    title: "U.S. AI campus developer with behind-the-meter power and a constrained source-to-hall route"
    profile: "A developer entering electrical design for a near-term hall phase with a credible source, an owner's engineer, and a route whose conventional feeder footprint or civil works materially constrain the approved plan."
    trigger: "The hall reaches electrical design and capital approval, and the owner's engineer confirms conventional feeder routing cannot meet the required capacity within the approved route or schedule."
    buyer: "Capital-project CFO or infrastructure-development executive"
    initialContract: "Paid site-feasibility study (fee and initial ACV: null because no quote or willingness-to-pay evidence exists), converting only after route approval, tariff and credit review, and financeable supplier/EPC terms to a multi-year lease with minimum reserved-MW payments."
  mustBeTrue:
    - "At least 2 of 10 screened U.S. campus design teams have an owner-engineer-verified route bottleneck, a credible source, and a near-term hall phase."
    - "At least one creditworthy developer pays for feasibility or signs a conditional minimum-payment reservation, and the economic buyer accepts the capacity lease after utility and tariff obligations are disclosed."
    - "At least one comparable site clears the operator-set hurdle of 10% lower lifecycle cost or 6 months earlier commissioning than the approved conventional design after cooling, service, redundancy, and insurance costs."
    - "The supplier and EPC provide written operating, warranty, maintenance, failure-response, and performance-remedy terms acceptable to the owner engineer, insurer, and relevant approval authorities."
    - "A lender or infrastructure investor offers actionable project-level financing against contracted customer payments without uncapped corporate recourse."
  diligenceQuestions:
    - "Can the company show anonymized route drawings, source-capacity evidence, load schedules, and owner-engineer signoff for two distinct qualified campuses?"
    - "What are the comparable conventional and superconducting lifecycle costs and commissioning schedules after cooling parasitics, redundancy, civil work, spares, insurance, maintenance, and repair time?"
    - "Who owns the minimum payment if generation, utility service, the hall phase, or customer load is delayed, and does the lease add fixed cost on top of utility or GS-5 obligations?"
    - "What independent operating data, fault protection, thermal recovery, availability guarantee, warranty, and repair-time commitments will the OEM and EPC provide?"
    - "What code/listing, utility/RTO, owner-engineer, AHJ, and insurer approvals are required, and which remain unresolved for the first site?"
    - "Will lenders finance the asset against the proposed lease, what customer credit and residual-value assumptions do they require, and what parent recourse remains?"
operatingAssumptions:
  - assumption: "The narrow route-fit segment is large enough to find multiple qualified campuses; the 5% eligible-load share used in research sizing is only an operator assumption."
    basis: research.yaml
    validationTest: "Screen 10 U.S. campus design teams and obtain source status, route drawings or dimensions, load schedule, conventional design, and written owner-engineer confirmation; require at least 2 qualified cases."
    decisionImpact: "If fewer than 2 qualify, stop campus-wide leasing expansion and do not commit to corridor assets; reassess whether a different feeder buyer or model is justified."
  - assumption: "A developer will accept third-party ownership and a fixed reserved-MW payment instead of self-building, without treating the lease as a duplicate utility capacity charge."
    basis: idea.yaml
    validationTest: "Present a term sheet to at least 5 economic buyers; obtain one paid feasibility engagement or conditional reservation and document payment source, minimum term, ramp, cancellation, tariff interaction, and credit support."
    decisionImpact: "If no buyer accepts the structure, abandon the feeder-only lease before construction and test an owner-funded design-in or supplier-financed contract only if a buyer requests it."
  - assumption: "A qualifying site has an economic advantage large enough to justify cryogenic and lifecycle complexity; the decision hurdle is an operator-set 10% lifecycle-cost reduction or 6 months earlier commissioning."
    basis: operator judgment
    validationTest: "Obtain supplier and EPC quotes for one route and compare both architectures on equal capacity and schedule, including cooling, redundancy, civil work, service, repair, insurance, and utility charges; have the customer approve the baseline and hurdle."
    decisionImpact: "If neither hurdle is met at a qualified site, do not finance that corridor even if its conductor has greater power density."
  - assumption: "Supplier, EPC, customer, utility, and insurer can allocate long-term operating and failure risk on terms a project lender accepts."
    basis: research.yaml
    validationTest: "Complete a written design and service review covering code/listing path, protection, cooling redundancy, spares, response times, warranties, step-in rights, insurance, and outage remedies before construction approval."
    decisionImpact: "If a fatal approval or unbounded liability gap remains, pause deployment; if terms are supplier-specific, cap exposure and do not claim a diversified moat."
  - assumption: "A ring-fenced corridor can attract project capital against a minimum-payment lease, and a proposed $5-8M seed can fund 18 months of predevelopment; corporate seed alone will not fund construction."
    basis: operator judgment
    validationTest: "Stress-test the 18-month staffing and diligence plan against vendor, engineering, legal, insurance, and travel quotes; after a reservation and EPC scope, seek actionable terms from at least 3 lenders or lessors, including recourse, security, residual value, and ramp-delay conditions."
    decisionImpact: "If predevelopment exceeds the seed runway, reduce scope or resize the raise; if project finance requires uncapped parent guarantees, defer construction or abandon asset ownership."
  - assumption: "A mature portfolio can target 70% gross margin on recurring capacity revenue after direct operations and service costs; no supporting unit economics were found."
    basis: operator judgment
    validationTest: "Build a site-level cost model from binding equipment/EPC quotes and observed cooling, maintenance, spares, insurance, and outage costs; recalculate the target after pilot operations and consistent treatment of asset costs."
    decisionImpact: "If recurring gross margin misses the target, revise pricing and financing before replication; stop if a customer-acceptable price cannot cover a financeable service obligation."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Screen campus development teams for route constraints, source readiness, hall timing, and conventional feeder alternatives."
    hypothesis: "A narrow set of projects has a feeder-route problem independent of generation and interconnection constraints."
    successMetric: "Ten teams reviewed and at least two cases supported by source/load evidence and written owner-engineer confirmation."
    owner: "CEO/project-development founder with an independent owner's engineer"
  - horizon: "0–90 days"
    experiment: "Present a paid feasibility and conditional reserved-MW term sheet to target economic buyers."
    hypothesis: "A buyer will fund route-specific diligence and consider third-party ownership with a minimum capacity payment."
    successMetric: "At least five qualified buyer conversations and one paid feasibility engagement or documented conditional reservation with a named budget owner."
    owner: "CEO/project-development founder"
  - horizon: "3–6 months"
    experiment: "Obtain supplier and EPC quotes and compare the superconducting corridor with the approved conventional alternative at one qualified site."
    hypothesis: "At least one route can meet a customer-approved lifecycle-cost or commissioning-time hurdle after all cryogenic and service costs."
    successMetric: "A comparable, customer-reviewed model clears either 10% lower lifecycle cost or 6 months earlier commissioning; otherwise no construction gate."
    owner: "Founding electrical engineer with supplier, EPC, and customer owner's engineer"
  - horizon: "3–6 months"
    experiment: "Run a design review with the owner engineer, electrical EPC, utility or RTO, commissioning partner, AHJ, and insurer."
    hypothesis: "A defined protection, cooling, maintenance, and approval path can satisfy data-center operational and insurance requirements."
    successMetric: "Written issue log has no unresolved fatal code, protection, service-boundary, or insurance barrier; all residual actions have owners and deadlines."
    owner: "Founding electrical engineer"
  - horizon: "6–12 months"
    experiment: "Review tariff and contract interaction for the target site, including utility minimum-demand obligations, ramp, curtailment, and source availability."
    hypothesis: "The lease payment can be distinguished from energy, transmission, and utility capacity charges without creating an unacceptable duplicate fixed obligation."
    successMetric: "Customer counsel and regulatory counsel document payment boundaries, minimum payment, cancellation rights, MW measurement, and all remaining utility obligations."
    owner: "CEO/project-development founder with regulatory counsel"
  - horizon: "6–12 months"
    experiment: "Seek project-level financing and insurance indications after securing an anchor reservation and scoped supplier/EPC terms."
    hypothesis: "Lenders can underwrite a single-site corridor against contracted capacity payments with capped parent exposure."
    successMetric: "At least one actionable indicative financing proposal identifies recourse, security, customer-credit, ramp-delay, and residual-value conditions."
    owner: "Project-finance lead or CEO until that hire is justified"
  - horizon: "12–18 months"
    experiment: "If all commercial and approval gates close, commission one customer corridor with independent performance testing; if not, do not build."
    hypothesis: "The installed system can deliver contracted capacity and service performance while meeting the approved cost and schedule case."
    successMetric: "Independent acceptance confirms contracted transfer capacity, thermal and fault tests, service response, owner-engineer approval, and a measured cost baseline."
    owner: "Asset-operations lead with EPC, supplier, and independent commissioning partner"
operations:
  - "Use a site stage-gate: verify source and hall readiness, route geometry, conventional design, customer budget, tariff boundary, credit, and stakeholder acceptance before project capital is committed."
  - "Contract the cable, cryogenic package, controls, terminations, and protection from a qualified supplier; contract installation and commissioning from an electrical EPC with clearly split warranty and service responsibility."
  - "Specify operating procedures for cooling redundancy, monitoring, fault isolation, critical spares, thermal recovery, outage communication, repair response, and customer remedies before energization."
  - "Coordinate with the customer's owner's engineer, utility/RTO, behind-the-meter developer, AHJ, insurer, and regulatory counsel; the lease must not imply generation or transmission rights."
  - "Ring-fence construction financing at the site level and require a creditworthy minimum-payment reservation, milestone controls, step-in rights, and insurance before drawing project capital."
team:
  - role: "Founding eng"
    startTiming: "Month 0"
    rationale: "Founder-level electrical power-systems engineer owns route design, protection and cooling integration, supplier/EPC interfaces, and independent acceptance criteria; this is the first technical credibility gap to close."
  - role: "CEO / project-development founder"
    startTiming: "Month 0"
    rationale: "Owns customer qualification, paid feasibility sales, lease negotiation, source/utility boundaries, and anchor financing; the company cannot be built as a technology-only effort."
  - role: "Project-finance lead"
    startTiming: "Month 6–9, conditional on a qualified paid study or reservation"
    rationale: "Structures project-level debt, asset security, customer credit, and lender diligence; defer this fixed hire if no route or anchor converts."
  - role: "Asset-operations and commissioning lead"
    startTiming: "Month 9–12, only before a contracted construction start"
    rationale: "Owns service readiness, cryogenic operations, spares, commissioning, and uptime reporting; use external specialists until a funded site requires an accountable operator."
milestones:
  - horizon: "0–12 months"
    items:
      - "Screen 10 campuses and independently verify at least 2 source-ready, route-constrained candidates."
      - "Secure at least one paid feasibility study or conditional minimum-payment capacity reservation; document buyer, credit, tariff, ramp, and cancellation terms."
      - "Complete a customer-reviewed conventional-versus-superconducting quote and lifecycle/schedule comparison for the leading site."
      - "Finish owner-engineer, EPC, supplier, utility/RTO, AHJ, insurer, and lender diligence; no construction without all required approvals, remedies, and project capital."
  - horizon: "12–24 months"
    items:
      - "If all gates close, finance, install, and independently commission one reserved corridor; otherwise hold construction and preserve corporate runway."
      - "Measure contracted versus delivered MW, availability, faults, thermal events, repair time, actual service costs, and customer ramp against the contract."
      - "Do not approve a second asset until the first has demonstrated agreed service performance and the customer-approved economic hurdle."
  - horizon: "24–36 months"
    items:
      - "After at least 12 months of acceptable operating evidence, secure a second qualifying site using the documented design, contract, and service package."
      - "Seek portfolio refinancing only if contracted payments, customer credit, service costs, and residual assumptions are supported by operating data."
      - "Continue to reject generation, interconnection, and ordinary-route opportunities that do not fit the feeder-only underwriting case."
risks:
  - risk: "The actual project bottleneck is generation, grid interconnection, transmission service, or transformer delivery rather than source-to-hall route footprint."
    likelihood: "High"
    impact: "High"
    mitigation: "Require source-capacity evidence and independent route confirmation before quoting a lease or incurring project-development cost; reject upstream-power problems the product cannot solve."
  - risk: "A simulated demonstration and utility precedents do not establish commercial data-center availability, serviceability, or insurer acceptance."
    likelihood: "High"
    impact: "High"
    mitigation: "Use independent design and acceptance testing, supplier/EPC warranties, cooling redundancy, critical spares, response commitments, and explicit outage remedies before construction."
  - risk: "The customer will not lease a feeder or will face a second fixed payment on top of utility and large-load tariff obligations."
    likelihood: "High"
    impact: "High"
    mitigation: "Obtain a paid feasibility commitment, name the budget owner, map tariffs and power contracts, and contract minimum payment, ramp, cancellation, and capacity measurement before financing."
  - risk: "A concentrated supplier base, unclear warranty boundary, or component delay can strand a financed corridor."
    likelihood: "High"
    impact: "High"
    mitigation: "Secure price and delivery terms, lifecycle service, critical spares, step-in rights, performance remedies, and replacement obligations; qualify alternatives when technically feasible."
  - risk: "A phased campus schedule or customer-credit event leaves a single-site asset underused and unrecoverable."
    likelihood: "High"
    impact: "High"
    mitigation: "Require credit support and a minimum reserved-capacity payment, stage construction draws to hall and source milestones, and isolate project capital from corporate runway."
  - risk: "Site-specific utility/RTO, electrical-code, emissions, permitting, or insurer requirements delay or block deployment."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Complete site-specific counsel and stakeholder review before construction; keep the feeder contract separate from generation permits and do not assume one jurisdiction's treatment generalizes."
fundingAsk:
  round: "seed"
  targetFundingRangeUsd: "$5–8M"
  runwayMonths: 18
  useOfFundsSummary: "Operator planning target, not a researched market fact: 18 months of seed runway funds a lean engineering and origination team, route studies, supplier/EPC design and quotes, customer and tariff diligence, code/insurance work, contract development, and project-finance readiness. It does not fund corridor construction; each asset requires a signed anchor reservation and separately gated project-level capital."
