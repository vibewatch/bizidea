slug: leased-campus-power-corridors
date: "2026-10-14"
executiveSummary: >-
  公司将为一家经过严格筛选的美国 AI 数据中心园区筹资、安装并运营一条从电源端直达机房的超导馈线，出租预留的 MW-month 容量，而不出售电缆或软件。首个客户必须有可信的表后电源、近期机房建设阶段，以及经业主工程师核实的线路空间约束；真正的采购窗口是电气设计和资本审批，而非泛泛的供电担忧。首版产品是收费的线路可行性方案和附条件的容量预留；只有供应商和 EPC 报价、审批、费率处理、客户信用及项目融资都明确后，才转为多年期租赁。研究称 VEIR 完成 $110M C 轮融资以加快商业化，在模拟环境中完成 3-MW 数据中心演示，并预计 2027 年开始首次部署；但没有具名商业数据中心客户、客户认可的线路研究、租赁费率或运营经济性。数据中心负荷增长带来紧迫性，却不能证明市场需要租赁馈线：报告中的 SAM 为 $300M-$480M，依赖未经验证的 5% 线路适配假设和 $100,000/MW-year 的算术代理值，而非实际价格。线路条件允许时，传统馈线仍是合理的默认方案；本产品也解决不了发电、并网或变压器瓶颈。因此，该计划应按阶段推进为种子轮基础设施业务：没有锚定客户预留、可接受的服务与风险条款，以及项目级资本，就不建馈线通道。
problem:
  - "少数 AI 园区项目可能有可用的表后电源和已规划的机房，却没有足够的源端至机房线路空间，无法铺设满足所需输送容量的传统馈线。"
  - "若直接买下整套新型超导设备，开发商就得为定制资产出资并承担早期部署风险；现有研究没有证明买方会转而接受仅租赁馈线容量。"
  - "更高密度的馈线无法带来发电能力、公用事业供电、并网权或变压器容量；广义电力短缺并不能证明这里确实存在特定的线路问题。"
solution:
  - "只开发经独立线路审查确认馈线本身是瓶颈、且拟议电源和机房工期可信的场址。"
  - "由项目公司签约采购超导与低温系统、EPC 安装、调试、运营和维护服务；按多年租约出租明确约定的预留 MW 容量。"
  - "先收场址开发费，再按预留 MW-month 固定收费；只有客户信用合格、技术与监管认可、补救条款明确且项目条款可融资时，才启动建设。"
whyWeWin:
  - "这套方案把资产所有权和初始资本投入，从符合条件的园区开发商转给专业馈线通道资产方；只有客户足够看重这种转移、愿意支付经常性容量费时，方案才有胜算。"
  - "不同于只卖电缆，合同以约定运行边界内的预留馈线容量为计价单位；路线工程、采购、服务和融资因此可以纳入客户的一项决策。"
  - "优势并非来自自有超导技术：供应商和公用事业案例只能提供相邻领域的先例；只要传统 EPC、公用事业供电或微电网能以更低全生命周期成本或风险解决实际瓶颈，它们就可能胜出。"
strategicChoices:
  beachhead: "美国一家 AI 数据中心园区，具备可信的表后电源、近期机房建设阶段，以及有据可查的源端至机房线路空间约束。"
  wedgeRationale: "这门生意刻意选择了资产重、初期依赖少数供应商的模式，因此只适合高密度供电足以支撑长期容量租赁的园区。先做单条线路，范围足够窄，可以在承担资产风险前验证买方、传统替代方案、供应商、许可、费率和融资边界；若泛泛宣传电力短缺，反而会把馈线瓶颈与发电或电网接入问题混为一谈。"
  sequencingRationale: "先卖收费的可行性研究，验证线路、供电来源、替代方案和买方经济性；再落实容量预留、供应商/EPC 风险条款、相关方认可和项目融资；全部到位后再建设。母公司资金用于项目开发和工程，只有签署项目阶段门后才招聘资产融资与运营人员；拿到现场数据后再寻求组合再融资。"
  notYet:
    - "暂不面向瓶颈在发电、公用事业并网、输电服务或变压器供应的场址。"
    - "不持有或出售发电资产、微电网、公用事业供电服务或通用园区电力管理软件。"
    - "不制造超导电缆；在数据中心馈线通道有商业运行证据前，不拓展到公用电网或非数据中心线路。"
    - "不以公司种子轮资金建设，也不安装尚无容量预留的资产。"
market:
  tam: "仅为研究情景：年容量等值 $5.9B-$9.6B，按美国 2030 年数据中心平均负荷区间及未经验证的 $100,000/MW-year 代理值计算；这不是已观察到的租赁收入，也不是经过验证的 TAM。"
  sam: "仅为研究情景：年容量等值 $300M-$480M，将运营方假设的 5% 线路适配份额应用于美国预计负荷，再乘以同一未经验证的代理值；实际适配份额可能低得多。"
  som: "五年情景：按同一代理值，五个园区合计 100 MW，对应年容量等值 $10M；单个 20-MW 园区按算术计算为 $2M/year，这不是报价，也不是已观察到的 ACV。"
  segments:
    - "主要客群：美国 AI 数据中心开发商，具备可信的表后电源、近期机房建设阶段，且馈线路线受限已获独立核实。"
    - "次要客群，尚未验证：首个商业案例落地后，其他符合相同电源、工期和线路条件的美国数据中心园区。"
  buyingProcess: "机房设计期间，电气基础设施开发负责人和业主工程师发现线路问题；基础设施开发高管或资本项目 CFO 决定是否投资，而 EPC、可靠性团队、公用事业或 RTO、主管机关（AHJ）及保险公司都可能否决设计。仅租赁馈线的具体销售周期和付款预算尚不清楚，必须在首个场址验证。"
product:
  mvp: "V1 是针对单个场址的前期开发方案：核实电源和线路约束、提供同口径传统方案、取得供应商/EPC 报价，并制定冷却、保护、维护和调试计划及附条件租约条款清单。客户信用、费率处理、技术审批、服务补救、保险和项目资本尚未落实前，不启动建设。"
  sixMonth: "完成至少两个候选场址的筛选和线路研究，为其中一个取得可比的系统与 EPC 报价，并获得业主工程师和买方对收费可行性研究及最低容量预留结构的书面反馈；暂不假设会建设资产。"
  twelveMonth: "签下一个收费可行性研究项目或附条件容量预留，并完成场址专属的技术、费率、保险、客户信用和贷款方材料；只有各项阶段门均通过，才批准建设。"
  twentyFourMonth: "若合格锚定客户和项目融资均落实，就调试一条馈线通道，开展独立测试并测量容量、可用率、故障、服务响应及已安装系统的全生命周期成本；否则守住资金，继续前期开发，不做投机性建设。"
  keyBets:
    - "经筛选的十支设计团队中，至少两支会遇到传统布线无法解决的源端至机房线路约束，除非接受显著的占地、工期或土建代价。"
    - "开发商愿意支付可行性研究费用，并接受多年期最低预留 MW 付款，以转移资产所有权和性能风险。"
    - "计入低温负荷、冗余、安装、维护、保险、备件和费率义务后，线路整体经济性仍有竞争力。"
    - "设备供应商和 EPC 愿意明确性能保证、全生命周期服务、维修责任边界和介入接管权。"
    - "项目贷款方或基础设施投资者愿意以信用合格客户的容量预留为基础，为单场址资产融资，且不要求母公司承担无上限追索责任。"
gtm:
  wedge: "直接筛选一个已规划机房阶段，要求已有或已签约的表后电源；必须有业主工程师证据证明限制计划输送量的是线路几何条件，而非上游供电能力。"
  channels:
    - "创始团队直接开发客户，在场址规划和电气设计阶段对接数据中心基础设施开发负责人及资本项目 CFOs。"
    - "与客户的业主工程师、电气 EPC、调试合作方及表后项目开发商合作，完成设计导入和线路核验。"
    - "尽早协调公用事业或 RTO，并聘请独立监管律师明确馈线边界，避免租约被理解为赋予发电或输电权利。"
    - "只有在客户预留和供应商/EPC 工作范围明确后，才接触基础设施贷款方、租赁方、保险公司和担保机构。"
  funnelTargets: "首个 12 个月的运营目标：筛选 10 支园区设计团队，验证至少 2 个电源可信且线路受限的场址，并拿下至少 1 项收费可行性研究或附条件最低容量预留。没有历史转化基线；只有在价格、费率、信用和服务条款明确后，才统计实际转化。"
  pricing: "先收取一次性场址开发费，覆盖线路专属工程服务；再按多年租约，对每个预留 MW-month 收取固定费用，并明确爬坡、可用率、限电和补救条款。费用、租赁费率、租期和 ACV 均未经验证；只有结合供应商/EPC 报价、全生命周期成本、费率审查、客户付费意愿和贷款方要求后，才能定价。研究中的 $100,000/MW-year 是市场测算代理值，不是定价建议。"
businessModel:
  revenueStreams:
    - "一次性场址开发和可行性研究费用。"
    - "多年期馈线通道容量租约下，按预留 MW-month 收取的经常性固定费用。"
  unitOfValue: "客户信用合格、馈线已投运，并在合同服务与可用率边界内交付的源端至机房输送容量，按 MW-month 计；公司不出售电能。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "只有签约需求和运行证据支持新增资产时，才在同一园区增加预留容量或铺设第二条馈线。"
    - "首条馈线通道通过可用率和经济性测试后，再将线路研究、合同、供应商/EPC 工作范围和服务模式复制到另一处合格园区。"
    - "只有贷款方能依据已测得的服务成本、客户信用和残值为资产定价后，才对运营资产组合再融资。"
strategyMap:
  northStarMetric: "信用合格客户已投运并在合同服务水平内获得的 MW-month，扣除停机抵扣；预留但尚未投运的 MW 单独报告。"
  inputMetrics:
    - "电源状态有记录、线路约束获业主工程师确认的合格园区数量。"
    - "收费可行性研究数量，以及转为最低付款容量预留的比例。"
    - "建设获批前已完成同口径全生命周期成本、工期、费率、保险和贷款方审查的场址方案占比。"
    - "签约与投运 MW、已落实项目资本，以及客户爬坡或取消风险。"
  moatsToBuild:
    - "可复用的场址级线路、安装、冷却、故障、维修和全生命周期成本数据；目前还没有商业规模数据中心的此类证据。"
    - "明确划分性能与故障责任的供应商、EPC、保险公司、客户和贷款方合同接口。"
    - "跨馈线通道资产可复用的承保和再融资记录；除非另行获得许可，电缆 IP 仍归供应商所有。"
  killCriteria:
    - "筛选 10 支目标设计团队后，独立确认可行源端至机房线路瓶颈的团队不足 2 支。"
    - "到第12个月时，若仍没有信用合格客户为可行性研究付费，或签署附条件最低付款预留，且合同没有明确预算负责人和费率处理方式。"
    - "没有合格场址达到运营方设定的客户门槛：全生命周期成本至少低 10%，或投运时间至少提前 6 个月；比较基准为获批的传统线路方案。"
    - "供应商/EPC 无法提供可融资的全生命周期服务、性能补救和故障响应条款；或业主工程师、公用事业/主管机关（AHJ）、保险公司指出尚未解决的致命审批障碍。"
    - "客户预留落实后，仍没有贷款方或基础设施投资者提供可执行的项目级融资条款，或融资仍要求母公司承担无上限追索责任。"
  mermaid: |
    flowchart LR
      Wedge["One source-ready campus with a verified route constraint"] --> MVP["Paid feasibility and conditional reserved-MW lease"]
      MVP --> Proof["Signed anchor, accepted design, financeable service terms"]
      Proof --> Pilot["Commission one corridor and measure real performance"]
      Pilot --> Expansion["Repeat only after service and lifecycle economics pass"]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "判断把握较低：差异化融资结构有可能成立，但线路层面的需求、租赁经济性和商业运行可靠性都尚未得到验证。"
    whyBelieve: "行业用电需求和公用事业超导先例说明基础设施需求确实存在，但已审阅的方案中没有仅租赁馈线容量的产品。"
    whyDoubt: "已披露的数据中心演示是在模拟环境中完成，许多项目的主要瓶颈在上游供电；也没有找到具名买方、获认可的线路方案、租赁费率或场址经济性数据。"
    nextDiligence: "先审阅至少两个园区的匿名线路图和电源状态，再验证是否有一位信用合格买方愿意为可行性研究付费，并基于有报价且获批的设计预留容量。"
  firstCustomer:
    title: "拥有表后电源且源端至机房线路受限的美国 AI 园区开发商"
    profile: "开发商正为近期机房阶段开展电气设计，具备可信电源和业主工程师；传统馈线所需的线路空间或土建工程，会实质限制已获批方案。"
    trigger: "机房进入电气设计和资本审批阶段，业主工程师确认传统馈线路线无法在获批线路或工期内满足所需容量。"
    buyer: "资本项目 CFO 或基础设施开发负责人"
    initialContract: "收费的场址可行性研究（费用和初始 ACV 尚未确定，因为没有报价或付费意愿证据）；只有线路获批、费率和信用审查通过，且供应商/EPC 条款可融资后，才转为多年期租约，并约定最低预留 MW 付款。"
  mustBeTrue:
    - "经筛选的 10 支美国园区设计团队中，至少 2 支存在业主工程师确认的线路瓶颈、可信电源和近期机房建设阶段。"
    - "至少一位信用合格的开发商为可行性研究付费或签署附条件最低付款预留；公用事业和费率义务披露后，经济决策者仍接受容量租赁。"
    - "至少一个可比场址在计入冷却、服务、冗余和保险成本后，相较获批传统设计达到运营方设定的门槛：全生命周期成本低 10%，或投运提前 6 个月。"
    - "供应商和 EPC 提供书面运营、保修、维护、故障响应和性能补救条款，并获得业主工程师、保险公司及相关审批机构认可。"
    - "贷款方或基础设施投资者愿意以签约客户付款为基础提供可执行的项目级融资，且不要求公司承担无上限追索责任。"
  diligenceQuestions:
    - "公司能否提供两个不同合格园区的匿名线路图、电源容量证明、负荷计划和业主工程师签字确认？"
    - "计入低温系统寄生功耗、冗余、土建、备件、保险、维护和维修时间后，传统方案与超导方案的可比全生命周期成本和调试工期分别是多少？"
    - "若发电、公用事业供电、机房阶段或客户负荷延期，谁仍须支付最低费用？除公用事业或 GS-5 义务外，这份租约是否会增加第二笔固定费用？"
    - "OEM 和 EPC 能提供哪些独立运行数据、故障保护、热恢复、可用率保证、保修和维修时限承诺？"
    - "首个场址需要哪些规范/认证、公用事业/RTO、业主工程师、主管机关（AHJ）和保险公司审批？哪些仍未解决？"
    - "贷款方是否愿意按拟议租约为资产融资？他们要求怎样的客户信用和残值假设？母公司仍须承担哪些追索责任？"
operatingAssumptions:
  - assumption: "线路适配这一细分市场足以找到多个合格园区；研究测算中采用的 5% 负荷适配份额只是运营方假设。"
    basis: research.yaml
    validationTest: "筛选 10 支美国园区设计团队，取得电源状态、线路图或尺寸、负荷计划、传统方案及业主工程师书面确认；至少确认 2 个合格案例。"
    decisionImpact: "若合格场址不足 2 个，就停止面向整个园区的租赁扩张，不承诺馈线通道资产；重新评估其他馈线买方或商业模式是否值得尝试。"
  - assumption: "开发商愿意接受第三方持有资产并按预留 MW 固定付费，而不是自行建设；这笔租金也不会被视为公用事业容量费之外的重复收费。"
    basis: idea.yaml
    validationTest: "向至少 5 位经济决策者提交条款清单；取得一项收费可行性研究或附条件预留，并记录付款来源、最低租期、爬坡、取消、费率交互和信用支持。"
    decisionImpact: "若没有买方接受这种结构，就在建设前放弃仅租赁馈线的方案；只有买方提出要求时，才测试由业主出资导入设计或由供应商融资的合同。"
  - assumption: "合格场址的经济优势足以抵消低温系统和全生命周期复杂性；运营方设定的决策门槛是全生命周期成本降低 10%，或投运提前 6 个月。"
    basis: 运营方判断
    validationTest: "取得供应商和 EPC 对一条线路的报价，按相同容量和工期比较两种架构，并计入冷却、冗余、土建、服务、维修、保险和公用事业费用；由客户批准基准方案和门槛。"
    decisionImpact: "若合格场址连一项门槛都达不到，即使导体功率密度更高，也不为该馈线通道融资。"
  - assumption: "供应商、EPC、客户、公用事业和保险公司能够合理分配长期运营及故障风险，且项目贷款方认可条款。"
    basis: research.yaml
    validationTest: "建设获批前，完成书面设计和服务审查，覆盖规范/认证路径、保护、冷却冗余、备件、响应时间、保修、介入接管权、保险和停机补救。"
    decisionImpact: "若仍有致命审批障碍或责任缺口没有上限，就暂停部署；若条款只能适用于特定供应商，就限制风险敞口，不宣称已建立多元化护城河。"
  - assumption: "隔离运营的馈线通道能以最低付款租约获得项目资本；拟议的 $5-8M 种子轮可支撑 18 个月前期开发，但公司种子轮本身不会用于建设。"
    basis: 运营方判断
    validationTest: "用供应商、工程、法律、保险和差旅报价，压力测试 18 个月人员与尽调计划；取得容量预留和 EPC 工作范围后，向至少 3 家贷款方或租赁方争取可执行条款，覆盖追索责任、担保、残值和爬坡延期条件。"
    decisionImpact: "若前期开发超出种子轮资金跑道，就缩小范围或调整融资规模；若项目融资要求母公司提供无上限担保，就推迟建设或放弃持有资产。"
  - assumption: "成熟资产组合的经常性容量收入目标毛利率为 70%，扣除直接运营和服务成本后实现；目前没有单位经济模型数据支撑这一目标。"
    basis: 运营方判断
    validationTest: "根据有约束力的设备/EPC 报价及实测冷却、维护、备件、保险和停机成本建立场址级成本模型；试点运营后，在资产成本口径一致的基础上重新测算目标。"
    decisionImpact: "若经常性毛利率达不到目标，就先调整定价和融资再复制；若客户能接受的价格不足以覆盖可融资的服务义务，就停止。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "筛选园区开发团队，核实线路约束、电源准备情况、机房工期和传统馈线替代方案。"
    hypothesis: "少数项目确实存在馈线路线问题，且与发电和并网约束无关。"
    successMetric: "审查十支团队；至少两个案例有电源/负荷证据和业主工程师书面确认。"
    owner: "CEO/项目开发创始人，与独立业主工程师协作"
  - horizon: "0–90 天"
    experiment: "向目标经济决策者提交收费可行性研究和附条件预留 MW 条款清单。"
    hypothesis: "买方愿意为线路专项尽调出资，并考虑由第三方持有资产、按最低容量付费。"
    successMetric: "至少与五位合格买方沟通，并取得一项收费可行性研究或有明确预算负责人的附条件预留书面记录。"
    owner: "CEO/项目开发创始人"
  - horizon: "3–6 个月"
    experiment: "取得供应商和 EPC 报价，在一个合格场址比较超导馈线通道与获批的传统替代方案。"
    hypothesis: "至少一条线路计入全部低温和服务成本后，仍能达到客户认可的全生命周期成本或调试工期门槛。"
    successMetric: "客户审阅的可比模型显示，全生命周期成本至少低 10%，或调试至少提前 6 个月；否则不进入建设阶段门。"
    owner: "创始电气工程师，与供应商、EPC 及客户业主工程师协作"
  - horizon: "3–6 个月"
    experiment: "与业主工程师、电气 EPC、公用事业或 RTO、调试合作方、主管机关（AHJ）及保险公司开展设计审查。"
    hypothesis: "明确的保护、冷却、维护和审批路径能够满足数据中心运营及保险要求。"
    successMetric: "书面问题清单中没有尚未解决的致命规范、保护、服务边界或保险障碍；所有剩余事项均有负责人和截止日期。"
    owner: "创始电气工程师"
  - horizon: "6–12 个月"
    experiment: "审查目标场址的费率和合同关系，包括公用事业最低需量义务、爬坡、限电和电源可用性。"
    hypothesis: "租赁付款可以与电能、输电和公用事业容量费用区分开，且不会造成无法接受的重复固定支出。"
    successMetric: "客户律师和监管律师书面明确付款边界、最低付款、取消权、MW 计量方式及所有未解除的公用事业义务。"
    owner: "CEO/项目开发创始人，与监管律师协作"
  - horizon: "6–12 个月"
    experiment: "锚定客户预留落实且供应商/EPC 工作范围明确后，寻求项目级融资和保险意向。"
    hypothesis: "贷款方可以依据签约容量付款，为单场址馈线通道融资，并限制母公司风险敞口。"
    successMetric: "至少一份可执行的融资意向书明确列出追索责任、担保、客户信用、爬坡延期和残值条件。"
    owner: "项目融资负责人；在该岗位有必要前由 CEO 负责"
  - horizon: "12–18 个月"
    experiment: "若所有商业和审批阶段门均通过，就为一条客户馈线通道开展独立性能测试和调试；否则不建设。"
    hypothesis: "已安装系统能够按获批的成本和工期方案，交付合同约定的容量与服务表现。"
    successMetric: "独立验收确认合同输送容量、热性能和故障测试、服务响应及业主工程师批准，并建立实测成本基线。"
    owner: "资产运营负责人，与 EPC、供应商和独立调试合作方协作"
operations:
  - "按场址阶段门推进：落实项目资本前，核实电源和机房准备情况、线路几何条件、传统设计、客户预算、费率边界、信用及相关方认可。"
  - "向合格供应商采购电缆、低温系统、控制器、终端和保护设备；由明确划分保修和服务责任的电气 EPC 负责安装与调试。"
  - "通电前制定操作规程，覆盖冷却冗余、监控、故障隔离、关键备件、热恢复、停机沟通、维修响应和客户补救。"
  - "与客户的业主工程师、公用事业/RTO、表后项目开发商、主管机关（AHJ）、保险公司及监管律师协调；租约不得暗示公司拥有发电或输电权利。"
  - "按场址单独隔离建设融资；提款前必须有信用合格的最低付款预留、里程碑控制、介入接管权和保险。"
team:
  - role: "创始电气工程师"
    startTiming: "第 0 个月"
    rationale: "创始级电力系统工程师负责线路设计、保护与冷却集成、供应商/EPC 对接及独立验收标准；这是最先要补齐的技术公信力短板。"
  - role: "CEO/项目开发创始人"
    startTiming: "第 0 个月"
    rationale: "负责客户筛选、收费可行性研究销售、租约谈判、电源/公用事业边界及锚定项目融资；公司不能只靠技术团队来搭建。"
  - role: "项目融资负责人"
    startTiming: "第 6–9 个月，须先有合格的收费研究或容量预留"
    rationale: "负责设计项目级债务、资产担保、客户信用和贷款方尽调；如果没有线路或锚定客户转化，就暂缓这项固定招聘。"
  - role: "资产运营与调试负责人"
    startTiming: "第 9–12 个月，仅在合同确定开工前招聘"
    rationale: "负责服务准备、低温系统运营、备件、调试和运行时间报告；在已融资场址需要明确运营责任人前，先使用外部专家。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "筛选 10 个园区，独立核实至少 2 个电源就绪且线路受限的候选场址。"
      - "至少取得一项收费可行性研究或附条件最低付款容量预留；记录买方、信用、费率、爬坡和取消条款。"
      - "为最有希望的场址完成客户审阅的传统与超导方案报价、全生命周期成本和工期比较。"
      - "完成业主工程师、EPC、供应商、公用事业/RTO、主管机关（AHJ）、保险公司和贷款方尽调；所需审批、补救条款和项目资本未全部落实前，不得建设。"
  - horizon: "12–24 个月"
    items:
      - "若所有阶段门均通过，就为一条已预留馈线通道融资、安装并开展独立调试；否则暂缓建设，守住公司资金跑道。"
      - "对照合同，测量签约与实际交付 MW、可用率、故障、热事件、维修时间、实际服务成本及客户爬坡情况。"
      - "首条馈线通道证明达到约定服务表现和客户认可的经济门槛前，不批准第二项资产。"
  - horizon: "24–36 个月"
    items:
      - "至少积累 12 个月可接受的运行证据后，才用已验证的设计、合同和服务方案拿下第二个合格场址。"
      - "只有签约付款、客户信用、服务成本和残值假设均有运行数据支撑时，才寻求组合再融资。"
      - "继续拒绝不符合仅馈线承保逻辑的发电、并网和普通线路项目。"
risks:
  - risk: "项目实际瓶颈在发电、电网并网、输电服务或变压器交付，而非源端至机房线路空间。"
    likelihood: "High"
    impact: "High"
    mitigation: "报价或投入项目开发成本前，必须核实电源容量并由独立方确认线路约束；产品解决不了上游供电问题，遇到此类项目就退出。"
  - risk: "模拟环境中的演示和公用事业先例，无法证明系统在商业数据中心的可用率、可维护性或保险认可。"
    likelihood: "High"
    impact: "High"
    mitigation: "建设前完成独立设计和验收测试，落实供应商/EPC 保修、冷却冗余、关键备件、响应承诺和明确的停机补救。"
  - risk: "客户不愿租赁馈线，或租金会叠加在公用事业和大型负荷费率义务之上，形成第二笔固定费用。"
    likelihood: "High"
    impact: "High"
    mitigation: "先取得收费可行性研究承诺、明确预算负责人并梳理费率和电力合同；融资前写清最低付款、爬坡、取消和容量计量条款。"
  - risk: "供应商集中、保修责任边界不清或部件延期，可能使已融资的馈线通道资产搁浅。"
    likelihood: "High"
    impact: "High"
    mitigation: "落实价格与交付条款、全生命周期服务、关键备件、介入接管权、性能补救和更换义务；技术可行时同步认证替代供应商。"
  - risk: "园区分期工期或客户信用事件导致单场址资产使用不足、无法回收成本。"
    likelihood: "High"
    impact: "High"
    mitigation: "要求信用支持和最低预留容量付款；让建设提款与机房及电源里程碑挂钩，并将项目资本与公司资金跑道隔离。"
  - risk: "场址专属的公用事业/RTO、电气规范、排放、许可或保险要求延误或阻止部署。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "建设前完成场址专属法律和相关方审查；馈线合同与发电许可分开，不假设一个辖区的处理方式适用于其他地区。"
fundingAsk:
  round: "seed"
  targetFundingRangeUsd: "$5–8M"
  runwayMonths: 18
  useOfFundsSummary: "运营方规划目标，并非经研究证实的市场事实：18 个月种子轮资金用于精简的工程和项目开发团队、线路研究、供应商/EPC 设计与报价、客户和费率尽调、规范与保险工作、合同开发及项目融资准备。不用于建设馈线通道；每项资产都必须先取得锚定客户签署的预留，再单独通过项目级资本审批。"
