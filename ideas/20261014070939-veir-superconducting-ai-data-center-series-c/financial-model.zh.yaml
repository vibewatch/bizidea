slug: leased-campus-power-corridors
date: "2026-10-14"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: 模型起始月份
    value: "2026-10"
    unit: YYYY-MM
    source: "[business-plan.yaml date；模型从报告月份开始]"
  - id: A2
    name: 公司期初现金
    value: "0"
    unit: USD
    source: "[初创公司融资经验假设：未披露种子轮前现金或现有资产负债表；期初现金按零计]"
  - id: A3
    name: 种子轮融资款
    value: "8000000"
    unit: USD
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd：采用种子规划区间 $5M-$8M 的上限 $8M，用于模型中的尽调计划及缓冲资金；不用于走廊建设]"
  - id: A4
    name: 种子轮到账时间
    value: "M1"
    unit: model_month
    source: "[初创公司融资经验假设：假设种子轮在模型起始时完成交割，公司现金跑道从 M1 开始]"
  - id: A5
    name: 每个场址的付费可行性研究费
    value: "150"
    unit: USD_K_per_engagement
    source: "[初创基础设施前期开发经验假设，并非报价：商业计划提到付费场址可行性研究，但未披露费用或付费意愿证据]"
  - id: A6
    name: 可行性研究的时间与数量
    value: "M12 开展 1 项研究，M34 为新场址开展 1 项研究"
    unit: count_and_model_month
    source: "[business-plan.yaml product.twelveMonth 和 milestones 24-36 个月；运营方在既定阶段门内作出的时点假设，第二项研究在首个试点运行 12 个月后开展]"
  - id: A7
    name: 首条电力走廊的预留容量
    value: "20"
    unit: MW
    source: "[research.yaml market.som：一个 20-MW 园区仅作为算术情景，并非客户承诺或已观察到的部署]"
  - id: A8
    name: 容量租赁费率
    value: "100"
    unit: USD_K_per_MW_year
    source: "[research.yaml market sizing：$100,000/MW-year 是明确尚未验证的分析代理值，并非报价或定价建议；仅作为情景输入使用]"
  - id: A9
    name: 首条电力走廊投运时间
    value: "M22"
    unit: model_month
    source: "[business-plan.yaml product.twentyFourMonth：基准情景假设在既定的 18-24 个月阶段门窗口内投运，且必须在另行落实项目资金后才推进]"
  - id: A10
    name: 目标毛利率
    value: "70"
    unit: percent
    source: "[business-plan.yaml businessModel.targetGrossMarginPct；70% 是运营方目标，未经实测]"
  - id: A11
    name: CEO 与项目开发创始人的全包薪酬
    value: "200"
    unit: USD_K_per_FTE_year
    source: "[精干、由创始人主导的美国基础设施初创公司薪酬经验假设；由于没有团队薪资数据，金额计入假设的雇主税费和福利]"
  - id: A12
    name: 电力系统工程师全包薪酬
    value: "220"
    unit: USD_K_per_FTE_year
    source: "[美国资深电力系统工程师的初创公司薪酬经验假设；金额计入假设的雇主税费和福利]"
  - id: A13
    name: 项目融资负责人全包薪酬
    value: "240"
    unit: USD_K_per_FTE_year
    source: "[美国资深项目融资负责人的初创公司薪酬经验假设；金额计入假设的雇主税费和福利]"
  - id: A14
    name: 资产运营与投运负责人全包薪酬
    value: "200"
    unit: USD_K_per_FTE_year
    source: "[美国资深基础设施运营人员的初创公司薪酬经验假设；金额计入假设的雇主税费和福利]"
  - id: A15
    name: 增聘电力系统工程师的全包薪酬
    value: "210"
    unit: USD_K_per_FTE_year
    source: "[美国第二位电力系统工程师的初创公司薪酬经验假设；金额计入假设的雇主税费和福利]"
  - id: A16
    name: 招聘时间表与人员编制门槛
    value: "CEO 和首位工程师 M1 入职；项目融资负责人 M9 入职；运营负责人 M19 入职；第二位工程师 M34 入职"
    unit: model_month
    source: "[business-plan.yaml team 和 strategicChoices.sequencingRationale：完成一项合格研究或拿到容量预留后再聘项目融资负责人；签约施工启动前聘用运营负责人；后续工程师招聘取决于运营数据；M9/M19/M34 均为运营方的时点假设]"
  - id: A17
    name: 非薪酬研发预算
    value: "Y1 1350; Y2 1200; Y3 950"
    unit: USD_K_per_year
    source: "[初创基础设施前期开发经验假设，并非供应商报价：预算用于外部线路研究、供应商/EPC 工程、保护与冷却设计、投运准备，以及商业计划里程碑要求的技术尽调]"
  - id: A18
    name: 非薪酬销售与市场预算
    value: "Y1 450; Y2 550; Y3 700"
    unit: USD_K_per_year
    source: "[初创基础设施 GTM 经验假设，并非历史支出：费用用于创始人主导的买方筛选、差旅、设计导入和客户尽调，依据 business-plan.yaml gtm.channels 和 funnelTargets]"
  - id: A19
    name: 非薪酬综合管理预算
    value: "Y1 450; Y2 550; Y3 700"
    unit: USD_K_per_year
    source: "[初创基础设施 G&A 经验假设，并非法律或保险报价：费用用于商业计划运营所需的监管与费率法律顾问、合同、保险尽调、会计和公司行政管理]"
  - id: A20
    name: 费用分摊口径
    value: "年度非薪酬预算按月或按季度均摊；全包薪酬从入职月份起计"
    unit: method
    source: "[建模口径；年度预算见 A17-A19，岗位薪酬与招聘假设见 A11-A16]"
  - id: A21
    name: 现金流与项目资本边界
    value: "期末现金 EOP = 上期现金 + EBITDA + 融资流入；不计税项、利息、折旧、营运资金变动或公司层面的走廊资本开支"
    unit: method
    source: "[business-plan.yaml strategicChoices.notYet 和 fundingAsk.useOfFundsSummary：公司种子资金不承担建设支出；假设场址层面的资金单独支持隔离核算的走廊资产，收付款在同一期间发生，且模型不计母公司层面的项目融资提款或债务偿付]"
  - id: A22
    name: 收入与客户数口径
    value: "可行性研究费在交付时确认；容量租赁收入自投运日起按月确认；customersEop 只统计已产生收入的场址客户账户"
    unit: method
    source: "[business-plan.yaml businessModel.revenueStreams 和 unitOfValue；假设现金在收入确认期收回；完成研究但尚未投运、尚未产生收入的场址，不计作活跃收入客户]"
  - id: A23
    name: CAC 计算方式
    value: "2300"
    unit: USD_K_per_commissioned_lease_customer
    source: "[根据 A18 计算：三年非薪酬销售与市场支出 $1,700K，加上 A11 中创始人三年薪酬 $600K，再除以一个基准情景下已投运的租赁客户；这是早期运营方估算，没有历史销售漏斗转化数据]"
  - id: A24
    name: 假设的平均租赁期限
    value: "60"
    unit: months
    source: "[初创基础设施融资经验假设：模型按多年期容量合同平均付费五年计算；business-plan.yaml gtm.pricing 指出实际期限尚未验证]"
  - id: A25
    name: 推算的月度客户流失率
    value: "1.67"
    unit: percent
    source: "[按 1 / A24 的 60 个月平均付费期限计算；这是建模代理值，并非实际观察到的流失率或经验证的租赁期限]"
  - id: A26
    name: 租赁费率敏感性区间
    value: "下行情景 75；基准情景 100；上行情景 125"
    unit: USD_K_per_MW_year
    source: "[运营方对 A8 进行上下 25% 的压力测试；研究代理值尚未验证，也没有客户报价]"
  - id: A27
    name: 投运延误敏感性
    value: "6"
    unit: months
    source: "[运营方针对 A9 的下行压力测试，纳入供应商、EPC、审批、费率、保险和客户排期等商业计划风险门槛]"
  - id: A28
    name: 毛利率下行情景敏感性
    value: "60"
    unit: percent
    source: "[运营方压力情景比商业计划中的 70% 目标低 10 个百分点；场址级冷却、维护、保险和维修成本尚未披露]"
  - id: A29
    name: CAC 支出敏感性
    value: "50"
    unit: percent_increase
    source: "[运营方压力测试：获客投入比 A23 高 50%，但已投运的租赁客户数不变；没有历史 CAC 基准]"
  - id: A30
    name: 提前招聘敏感性
    value: "运营负责人和第二位工程师均提前 6 个月入职"
    unit: model_month
    source: "[运营方针对 A16 的现金压力测试；两个岗位各增加六个月全包薪酬支出，但不假设收入提前]"
  - id: A31
    name: 下行情景
    value: "截至 M36，容量租赁仍未落地；Y1 仍有一笔可行性研究费；没有第二场址研究费；成本与招聘仍按基准计划执行"
    unit: scenario
    source: "[business-plan.yaml strategyMap.killCriteria 和 risks：未能拿下信用合格的容量预留，或无法打通费率、可靠性、审批和项目融资门槛，是主要下行情景]"
  - id: A32
    name: 上行情景
    value: "首条电力走廊 M16 投运；首个场址开始运营 12 个月后，第二笔 20-MW 容量租赁于 M34 启动"
    unit: scenario
    source: "[business-plan.yaml product.twentyFourMonth 和 milestones 24-36 个月；这是运营方加速推进但仍按阶段门把关的情景，项目建设仍由独立资金支持]"
  - id: A33
    name: 种子资金用途分配
    value: "工程 45%；GTM 20%；G&A 15%；六个月缓冲资金 20%"
    unit: percent_of_funding
    source: "[运营方为商业计划中的 18 个月前期开发项目制定的资金分配；不含走廊建设或资产购买]"
  - id: A34
    name: 公司六个月现金缓冲
    value: "1600"
    unit: USD_K
    source: "[运营方储备金估算：按每月约 $266.7K 计算，覆盖团队全包薪酬、工程与供应商尽调、GTM 和 G&A，共六个月；与商业计划的 18 个月种子资金跑道规划一致，但并非正式预算报价]"
  - id: A35
    name: 融资跑道定义
    value: "18"
    unit: months
    source: "[business-plan.yaml fundingAsk.runwayMonths；现金跑道指计划中的前期开发里程碑周期，并非声称现金恰好在第 18 个月耗尽]"
  - id: A36
    name: 资金用途金额
    value: "工程 3600000 USD；GTM 1600000 USD；G&A 1200000 USD；六个月缓冲资金 1600000 USD"
    unit: USD
    source: "[根据 A3 和 A33-A34 计算；金额合计为 $8M 种子资金，不含建设支出]"
