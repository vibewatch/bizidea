modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      QualifiedSites["Qualified source-ready routes"] --> PaidStudies["Paid feasibility fees"]
      PaidStudies --> Reservation["Creditworthy capacity reservation"]
      Reservation --> ProjectFinance["Ring-fenced project finance"]
      ProjectFinance --> CommissionedMW["Commissioned reserved MW"]
      CommissionedMW --> LeaseRevenue["Capacity lease revenue"]
      LeaseRevenue --> GrossProfit["Gross profit at modeled 70% margin"]
      GrossProfit --> CorporateCash["Corporate cash after payroll and diligence"]
modelSanity:
  - checkName: 收入引擎
    finding: "一条 20-MW 电力走廊按尚未验证的 $100K/MW-year 代理费率，可带来 $2.0M 年度经常性收入；付费可行性研究另带来一次性收入。"
  - checkName: 必须跑通的环节
    finding: "到 M22 时，信用合格的容量预留必须转化为另行融资的 20-MW 电力走廊；服务成本也必须支持商业计划设定的 70% 毛利率目标。"
  - checkName: 模型失效条件
    finding: "如果没有租赁转化，第二场址研究也始终未能签约，下行情景现金到 M36 将降至 -$967.5K，公司必须削减支出或新增融资。"
  - checkName: 下一轮融资凭证
    finding: "$8M 种子资金用于 18 个月前期开发，另留六个月缓冲；后续推进还需落实锚定客户条款、审批、服务补救机制和公司之外的项目融资。"
sanityChecks:
  ruleOf40: "Y3 收入从 $500K 增至 $2,150K，增长 330%；加上 EBITDA 利润率 -81.7%，结果为 248.3%。试点爬坡和一次性可行性研究收入扭曲了这一结果。"
  burnMultiple: "三年 EBITDA 现金消耗 $7,112.5K ÷ 新增的年末经常性租赁 ARR $2,000K = 3.56x；其中计入收入前的场址尽调支出，不含隔离核算的项目资金。"
  revenuePerFte: "Y3 每个 Q4Y3 FTE 贡献 $430K 收入（$2,150K ÷ 5）；这是项目基础设施早期模型，不是成熟软件公司的基准。"
  flags:
    - "research.yaml 尚未列出具名客户、获认可的线路研究、供应商/EPC 报价、租赁费率或客户规模的运营记录；所有收入都是按阶段门推进的情景，并非已签约待交付订单。"
    - "$100K/MW-year 是研究中的市场测算代理费率，不是定价；20-MW 场址也只是情景，并非已观察到的客户合同。"
    - "商业计划中的 70% 毛利率尚未验证；在场址运营成本明确前，模型对研究和租赁收入均按 30% 计提直接成本。"
    - "$2,300K CAC、60 个月客户期限和 1.67% 月度流失率，都是基于模型中一个租赁客户推算的经验值，不能视为实测单位经济模型。"
    - "基准情景未计入后续公司融资，到 M36 现金将降至 $887.5K；未转化情景下现金将降至 -$967.5K，因此停工门槛和融资时点都很关键。"
    - "公司种子资金不覆盖走廊建设、SPV 债务偿付、折旧或项目公司回报；建设前必须落实独立的项目层面资金，且融资条款可能改变可分配现金。"
    - "Y3 EBITDA 仍为 -$1,757.5K；三年 3.56x 现金消耗倍数反映的是单场址试点爬坡，而非投资组合层面的效率。"
