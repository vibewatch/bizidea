modelSanity:
  - checkName: Revenue engine
    finding: "One 20-MW corridor at the unvalidated $100K/MW-year proxy produces $2.0M annual recurring revenue, with paid feasibility work adding non-recurring fees."
  - checkName: Must go right
    finding: "A creditworthy reservation must convert to a separately financed 20-MW corridor by M22 while service costs stay within the business plan's 70% gross-margin target."
  - checkName: Model breaks if
    finding: "If no lease converts and the second-site study never closes, downside cash reaches -$967.5K by M36 and requires spending cuts or new capital."
  - checkName: Next-round proof
    finding: "The $8M seed is for 18 months of predevelopment plus a six-month buffer, and progression requires anchor terms, approvals, service remedies, and non-corporate project financing."
sanityChecks:
  ruleOf40: "Y3 revenue growth of 330% from $500K to $2,150K plus EBITDA margin of -81.7% equals 248.3%; the result is distorted by the pilot ramp and one-time feasibility revenue."
  burnMultiple: "Three-year EBITDA burn of $7,112.5K divided by $2,000K of new year-end recurring lease ARR is 3.56x; this includes pre-revenue site diligence and excludes ring-fenced project capital."
  revenuePerFte: "Y3 revenue is $430K per Q4Y3 FTE ($2,150K divided by 5); this is an early project-infrastructure model, not a mature software benchmark."
  flags:
    - "No named customer, accepted route study, supplier/EPC quote, lease rate, or customer-scale operating record is established in research.yaml; all revenue is a stage-gated scenario rather than contracted backlog."
    - "The $100K/MW-year rate is the research market-sizing proxy, not a price, and the 20-MW site is a scenario rather than an observed customer contract."
    - "The business plan's 70% gross margin is an unvalidated target; the model applies 30% direct costs to both study and lease revenue until site operating costs are known."
    - "The $2,300K CAC, 60-month life, and 1.67% monthly churn are heuristic outputs from one modeled lease customer and must not be treated as measured unit economics."
    - "Base cash falls to $887.5K by M36 with no subsequent corporate financing modeled; the no-conversion downside reaches -$967.5K, so stop-work gates and financing timing matter."
    - "Corporate seed excludes corridor construction, SPV debt service, depreciation, and project-company returns; separate project-level capital must close before construction and its terms could change distributable cash."
    - "Y3 EBITDA remains negative at -$1,757.5K and the 3.56x three-year burn multiple reflects a one-site pilot ramp rather than portfolio-level efficiency."
