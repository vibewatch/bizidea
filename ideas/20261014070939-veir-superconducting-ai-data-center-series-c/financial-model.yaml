slug: leased-campus-power-corridors
date: "2026-10-14"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Model start month
    value: "2026-10"
    unit: YYYY-MM
    source: "[business-plan.yaml date; model starts in the report month]"
  - id: A2
    name: Opening corporate cash
    value: "0"
    unit: USD
    source: "[Startup-finance heuristic: no pre-seed cash or existing balance sheet was disclosed; assume zero opening cash]"
  - id: A3
    name: Seed proceeds
    value: "8000000"
    unit: USD
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd: use the $8M upper end of the stated $5M-$8M seed planning range for the modeled diligence plan and buffer; not for corridor construction]"
  - id: A4
    name: Seed proceeds timing
    value: "M1"
    unit: model_month
    source: "[Startup-finance heuristic: assume the seed closes at model start so corporate runway begins in M1]"
  - id: A5
    name: Paid feasibility fee per site
    value: "150"
    unit: USD_K_per_engagement
    source: "[Startup infrastructure predevelopment heuristic, not a quote: the business plan identifies paid site-feasibility work but discloses no fee or willingness-to-pay evidence]"
  - id: A6
    name: Feasibility engagement timing and count
    value: "1 engagement in M12 and 1 new-site engagement in M34"
    unit: count_and_model_month
    source: "[business-plan.yaml product.twelveMonth and milestones 24-36 months; operator timing within the stated gates, with the second study after 12 months of initial pilot operation]"
  - id: A7
    name: First corridor reserved capacity
    value: "20"
    unit: MW
    source: "[research.yaml market.som: one 20-MW campus is shown as an arithmetic scenario, not a customer commitment or observed deployment]"
  - id: A8
    name: Capacity lease rate
    value: "100"
    unit: USD_K_per_MW_year
    source: "[research.yaml market sizing: $100,000/MW-year is an explicitly unvalidated analytical proxy, not a quoted price or price recommendation; used only as a scenario input]"
  - id: A9
    name: First corridor commissioning
    value: "M22"
    unit: model_month
    source: "[business-plan.yaml product.twentyFourMonth: base case assumes commissioning within the stated 18-24 month gated window and only after separate project capital]"
  - id: A10
    name: Target gross margin
    value: "70"
    unit: percent
    source: "[business-plan.yaml businessModel.targetGrossMarginPct; the 70% is an operator target, not measured performance]"
  - id: A11
    name: CEO and project-development founder loaded compensation
    value: "200"
    unit: USD_K_per_FTE_year
    source: "[Startup compensation heuristic for a lean, founder-led U.S. infrastructure startup; includes assumed payroll burden and benefits because no team salary data is supplied]"
  - id: A12
    name: Power-systems engineer loaded compensation
    value: "220"
    unit: USD_K_per_FTE_year
    source: "[Startup compensation heuristic for an experienced U.S. electrical power-systems engineer; includes assumed payroll burden and benefits]"
  - id: A13
    name: Project-finance lead loaded compensation
    value: "240"
    unit: USD_K_per_FTE_year
    source: "[Startup compensation heuristic for a senior U.S. project-finance hire; includes assumed payroll burden and benefits]"
  - id: A14
    name: Asset-operations and commissioning lead loaded compensation
    value: "200"
    unit: USD_K_per_FTE_year
    source: "[Startup compensation heuristic for an experienced U.S. infrastructure operations hire; includes assumed payroll burden and benefits]"
  - id: A15
    name: Additional power-systems engineer loaded compensation
    value: "210"
    unit: USD_K_per_FTE_year
    source: "[Startup compensation heuristic for a second U.S. power-systems engineer; includes assumed payroll burden and benefits]"
  - id: A16
    name: Hiring schedule and headcount gate
    value: "CEO and first engineer M1; finance lead M9; operations lead M19; second engineer M34"
    unit: model_month
    source: "[business-plan.yaml team and strategicChoices.sequencingRationale: finance hire follows a qualified study or reservation, operations hire precedes a contracted construction start, and later engineering hire follows operating evidence; M9/M19/M34 are operator timing assumptions]"
  - id: A17
    name: Non-payroll research and development budgets
    value: "Y1 1350; Y2 1200; Y3 950"
    unit: USD_K_per_year
    source: "[Startup infrastructure predevelopment heuristic, not vendor quotes: budget external route studies, supplier/EPC engineering, protection/cooling design, commissioning readiness, and technical diligence required by business-plan milestones]"
  - id: A18
    name: Non-payroll sales and marketing budgets
    value: "Y1 450; Y2 550; Y3 700"
    unit: USD_K_per_year
    source: "[Startup infrastructure GTM heuristic, not historical spend: founder-led buyer qualification, travel, design-in, and customer diligence from business-plan gtm.channels and funnelTargets]"
  - id: A19
    name: Non-payroll general and administrative budgets
    value: "Y1 450; Y2 550; Y3 700"
    unit: USD_K_per_year
    source: "[Startup infrastructure G&A heuristic, not legal or insurance quotes: regulatory and tariff counsel, contracting, insurance diligence, accounting, and corporate administration required by business-plan operations]"
  - id: A20
    name: Expense allocation convention
    value: "Annual non-payroll budgets spread evenly by month or quarter; loaded salaries follow hire dates"
    unit: method
    source: "[Modeling convention; annual budgets A17-A19 and role compensation/hiring assumptions A11-A16]"
  - id: A21
    name: Cash-flow and project-capital boundary
    value: "Cash EOP = prior cash + EBITDA + financing inflow; no taxes, interest, depreciation, working-capital movement, or corporate corridor capex"
    unit: method
    source: "[business-plan.yaml strategicChoices.notYet and fundingAsk.useOfFundsSummary: corporate seed does not fund construction; assume site-level capital separately funds ring-fenced corridor assets, with same-period collection/payment and no parent project-finance draw or debt service modeled]"
  - id: A22
    name: Revenue and customer-count convention
    value: "Feasibility fee recognized when delivered; lease recognized monthly from commissioning; customersEop counts revenue-bearing site accounts only"
    unit: method
    source: "[business-plan.yaml businessModel.revenueStreams and unitOfValue; cash receipts are assumed in the recognition period, and an unbilled site between study and commissioning is not counted as an active revenue customer]"
  - id: A23
    name: CAC calculation
    value: "2300"
    unit: USD_K_per_commissioned_lease_customer
    source: "[Calculated from A18: $1,700K three-year non-payroll sales and marketing plus A11: $600K three-year founder compensation, divided by one base-case commissioned lease customer; early-stage operator estimate with no historical funnel conversion]"
  - id: A24
    name: Assumed average lease life
    value: "60"
    unit: months
    source: "[Startup infrastructure finance heuristic: five-year average paid life for a modeled multi-year capacity contract; business-plan gtm.pricing says actual term is unvalidated]"
  - id: A25
    name: Implied monthly customer churn
    value: "1.67"
    unit: percent
    source: "[Calculated as 1 / A24's 60-month average paid life; a modeling proxy, not observed churn or a validated lease term]"
  - id: A26
    name: Lease-rate sensitivity range
    value: "75 downside; 100 base; 125 upside"
    unit: USD_K_per_MW_year
    source: "[Operator stress test of A8 by minus/plus 25%; the research proxy is explicitly unvalidated and no customer quote exists]"
  - id: A27
    name: Commissioning-delay sensitivity
    value: "6"
    unit: months
    source: "[Operator downside stress test against A9; reflects business-plan risks from supplier, EPC, approval, tariff, insurance, and customer schedule gates]"
  - id: A28
    name: Gross-margin downside sensitivity
    value: "60"
    unit: percent
    source: "[Operator stress case 10 percentage points below the business-plan 70% target because site-level cooling, maintenance, insurance, and repair costs are undisclosed]"
  - id: A29
    name: CAC-spend sensitivity
    value: "50"
    unit: percent_increase
    source: "[Operator stress test: acquisition effort costs 50% more than A23 while the number of commissioned lease customers is unchanged; no historical CAC baseline exists]"
  - id: A30
    name: Early-hiring sensitivity
    value: "Ops lead and second engineer each start 6 months earlier"
    unit: model_month
    source: "[Operator cash stress test against A16; earlier starts add six loaded-payroll months for each role without assuming earlier revenue]"
  - id: A31
    name: Downside scenario
    value: "No capacity lease conversion by M36; one Y1 feasibility fee remains; no second-site fee; base cost and hiring plan persists"
    unit: scenario
    source: "[business-plan.yaml strategyMap.killCriteria and risks: failure to win a creditworthy reservation or resolve tariff, reliability, approval, and project-finance gates is the principal downside]"
  - id: A32
    name: Upside scenario
    value: "First corridor starts M16; second 20-MW lease begins M34 after 12 months of initial operation"
    unit: scenario
    source: "[business-plan.yaml product.twentyFourMonth and milestones 24-36 months; accelerated but stage-gated operator scenario, with project construction still separately financed]"
  - id: A33
    name: Seed use-of-funds allocation
    value: "Engineering 45%; GTM 20%; G&A 15%; six-month buffer 20%"
    unit: percent_of_funding
    source: "[Operator planning allocation for the business-plan 18-month predevelopment program; no corridor construction or asset purchase is included]"
  - id: A34
    name: Six-month corporate buffer
    value: "1600"
    unit: USD_K
    source: "[Operator reserve estimate: six months at approximately $266.7K/month for loaded team, engineering/vendor diligence, GTM, and G&A; consistent with the business-plan 18-month seed-runway plan but not a quoted budget]"
  - id: A35
    name: Funding runway definition
    value: "18"
    unit: months
    source: "[business-plan.yaml fundingAsk.runwayMonths; runway is the planned predevelopment milestone horizon, not a claim that cash reaches zero exactly at month 18]"
  - id: A36
    name: Use-of-funds amounts
    value: "Engineering 3600000 USD; GTM 1600000 USD; G&A 1200000 USD; six-month buffer 1600000 USD"
    unit: USD
    source: "[Calculated from A3 and A33-A34; amounts sum to the $8M seed and exclude construction]"
