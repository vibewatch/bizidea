    - priority: high
      question: "业主、公用事业、RTO、电气工程师、AHJ 和保险方是否会认可拟议系统及运营责任划分？"
      evidenceToGather: "与业主工程师和公用事业完成设计评审；确认适用的认证/规范路径、保护协调研究、性能/保修条款、服务响应，以及保险方的书面反馈。"
