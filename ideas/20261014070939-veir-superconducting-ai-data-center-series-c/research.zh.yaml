competitors:
  - name: "VEIR"
    stage: "C 轮商业化阶段；据报完成 3 MW 模拟演示"
    wedge: "为高密度 AI 数据中心供电提供集成式超导电缆、冷却、控制、终端及监控系统。"
    pricing: "抓取到的页面中没有公开系统价格、报价或客户租赁条款。"
    strength: "完成 $110M C 轮融资，据报累计融资 $225M；独立行业报道确认其在模拟环境中完成 3 MW 演示。"
    weaknessVsUs: "公开证据显示其是技术系统供应商，而非向客户出售预留线路容量的第三方资产持有方；也没有具名的真实商业数据中心采用者。"
    sourceRefs:
      - 1
      - 2
  - name: "Nexans 超导电缆系统"
    stage: "成熟电缆供应商，已有公用电网部署和项目案例"
    wedge: "面向容量高、空间受限电网线路的高温超导电缆、低温系统及配套保护设备。"
    pricing: "按项目报价；没有公开的数据中心馈线价格或租赁费率。"
    strength: "其 Essen AmpaCity 项目运行了七年，芝加哥另一个 REG 项目自 2021 年起投入运行；两者都证明技术已走出实验室并投入现场。"
    weaknessVsUs: "证据指向公用电网项目，而非数据中心容量租赁；作为电缆/系统供应商，Nexans 也可能成为供应合作方，而不是直接的合同模式竞争者。"
    sourceRefs:
      - 14
      - 15
      - 17
  - name: "PowerSecure 数据中心微电网"
    stage: "商业服务供应商"
    wedge: "面向数据中心提供模块化电力单元、N+1 冗余、负荷灵活调节、公用事业协调，以及即时或永久供电方案。"
    pricing: "没有公开价目表；商业条款可能按项目制定，但抓取到的页面没有披露。"
    strength: "直接解决快速供电和可靠性问题，并提供模块化及许可支持能力；因此会争夺同一笔基础设施和韧性预算。"
    weaknessVsUs: "公开方案是微电网发电和电力管理，而非只为已有电源租赁馈线；发电机占地、排放和许可要求也可能不适合部分场址。"
    sourceRefs:
      - 12
      - 13
  - name: "传统电缆、母线槽及电气 EPC 交付"
    stage: "成熟的现有厂商架构"
    wedge: "由客户或公用事业出资建设铜/铝馈线、母线槽、开关设备、电缆桥架，并由标准 EPC 团队安装。"
    pricing: "通常按报价和项目确定；没有找到可比的公开价格。"
    strength: "电气设计与维护方式成熟，供应商生态完善，也不需要低温系统；线路空间和安装工期充足时，这是理性的默认方案。"
    weaknessVsUs: "在输电密度极高时，可能需要更多导体、线路空间或土建工程；只有这些约束的成本已量化，超导替代方案才有意义。"
    sourceRefs:
      - 5
      - 14
      - 15
  - name: "公用事业供电和业主自建"
    stage: "默认采购方式/现状"
    wedge: "电网供电、客户自有变电站和馈线升级，或由业主/EPC 设计的配电基础设施。"
    pricing: "按监管电价和场址确定升级成本；所审阅来源没有单独列出客户馈线设备成本。"
    strength: "公用事业和业主保有成熟的控制权、运营流程和责任边界；弗吉尼亚州的新费率类别明确了部分大负荷成本义务。"
    weaknessVsUs: "供电、升级和采购可能受电网容量或设备交期限制，但租赁方案无法解决上游电力供应，仍必须接入这套现有厂商系统。"
    sourceRefs:
      - 5
      - 8
      - 9
      - 11
      - 18
regulatoryTechnicalConstraints:
  - point: "FERC 要求 PJM 澄清共址大负荷输电服务和表后发电规则；客户服务、净取电量、并网变更、限电及升级成本分摊均须按项目审查。"
    sourceRefs:
      - 11
  - point: "弗吉尼亚州 SCC 批准的 GS-5 类别自 January 1, 2027 起适用于需求至少 25 MW 的客户，并要求至少支付合同输配电需求的 85% 和发电需求的 60%，存在固定义务重叠的风险。"
    sourceRefs:
      - 9
  - point: "现场发电和微电网须按场址审查空气排放、土地使用和排放要求；供应商宣称设备合规，不能替代独立的许可审查。"
    sourceRefs:
      - 8
      - 12
      - 13
  - point: "所审阅的公开资料没有确定商业数据中心超导馈线的电气规范/认证路径、保险方认可、故障保护要求或现场服务水平协议。"
    sourceRefs:
      - 2
      - 14
      - 15
  - point: "HTS 性能依赖低温外壳和持续冷却系统；资产公司必须承担冷却、监控、冗余、维修及寿命终止义务，不能把电缆当作无需维护的被动导体。"
    sourceRefs:
      - 2
      - 14
validationSignals:
  - point: "C 轮融资和演示只是供给侧商业化信号；抓取到的证据没有指出实际运行的数据中心客户，也没有披露单位经济模型。"
    sourceRefs:
      - 1
      - 2
  - point: "电力可用性是当下的市场关切；弗吉尼亚州官方研究指出，即便只满足不受限需求的一半，也需要艰难地新增发电和输电能力。"
    sourceRefs:
      - 5
      - 8
  - point: "弗吉尼亚州的大负荷买家面临明确的最低需求付款要求，说明电力容量已有预算，同时也带来单独的馈线租赁会重复收取固定费用的风险。"
    sourceRefs:
      - 9
      - 10
  - point: "Essen 和芝加哥已有超导电缆接入公用电网的先例，但都不是商业数据中心的电源至机房线路。"
    sourceRefs:
      - 15
      - 16
      - 17
openQuestions:
  - "美国有多少 AI 园区同时具备现场/共址发电、近期投运的机房，以及经测量确认的线路占地瓶颈，而非上游电网限制？"
  - "纳入冷却、安装、调试、备用容量和全生命周期服务后，可比的传统馈线和超导系统每条线路、每交付 MW 的成本各是多少？"
  - "数据中心业主是否会签只租赁馈线、按预留 MW 付费的合同？如果机房交付、发电或客户负荷延迟，谁承担最低付款义务？"
  - "租赁能否降低客户的资产负债表/资本压力，还是会在公用事业电价和购电协议之外再增加一笔固定容量义务？"
  - "业主工程师批准部署前，需要哪些商业运行案例、独立可靠性数据、保护研究和保险条款？"
  - "冷却故障、电缆失超、停电响应、备件和更换责任由谁承担？资产公司能否获得供应商支持的可用率保证？"
  - "February 2026 报道的弗吉尼亚州成本分摊提案目前已正式生效到哪一步？其他目标州的大负荷电价有何不同？"
  - "该资产能否跨多个场址再融资并标准化，还是每条线路都仍是定制施工项目、残值有限？"
