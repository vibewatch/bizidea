    - priority: high
      question: "有偿付能力的开发商是否愿意为自己并不拥有的馈线签署最低预留 MW 付款承诺，而不是购买传统设备或将该资产纳入自有项目预算？"
      evidenceToGather: "开展结构化买方访谈，要求客户付费开展可行性研究或签署无约束力的容量预订；记录预算负责人、付款来源、期限、取消权、信用支持，以及公用事业费用是否仍须支付。"
      sourceRefs:
