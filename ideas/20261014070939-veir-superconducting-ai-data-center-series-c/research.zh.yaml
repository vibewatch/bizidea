        Nexans HTS: [0.8, 0.6]
        VEIR STAR: [0.9, 0.85]
        Proposed leased corridor: [0.95, 0.9]
  fiveForces:
    supplierPower:
      score: 5
      rationale: "方案依赖少数仍处早期阶段的超导电缆、冷却、终端、控制和保护供应商；任何单一供应商停供或保修纠纷，都可能让已融资的资产搁浅。"
      sourceRefs:
        - 1
        - 14
        - 17
    buyerPower:
      score: 4
      rationale: "能够自建或等待另一种设计的超大型成熟买家不多，而电力短缺又增加了紧迫性。符合特殊场址条件的目标客户更少，谈判会集中且高度定制。"
      sourceRefs:
        - 5
        - 8
        - 9
    threatOfEntrants:
      score: 3
      rationale: "持有资产并出租的模式容易复制，但新进入者必须为单场址长期基础设施融资、让高可靠性电气设备通过认证，并取得 OEM/EPC 配合。"
      sourceRefs:
        - 1
        - 2
        - 14
    threatOfSubstitutes:
      score: 5
      rationale: "普通电缆和母线槽、线路重设计、公用事业升级、现场发电和交钥匙微电网都能解决部分需求；该选哪种替代方案，取决于瓶颈是线路几何条件还是上游电力接入。"
      sourceRefs:
        - 5
        - 8
        - 12
        - 14
    competitiveRivalry:
      score: 3
      rationale: "所审阅的证据显示，数据中心专用超导系统供应商不多，但成熟电缆供应商、公用事业/EPC 交付商和电力服务商构成了强大的相邻竞争。"
      sourceRefs:
        - 1
        - 12
        - 14
        - 17
  pestle:
    - factor: political
      impact: positive
      point: "DOE 为大型能源用户的现场发电和储能提供技术支持；这有利于表后项目设计，但并非对拟议馈线租赁的补贴。"
      sourceRefs:
        - 6
    - factor: economic
      impact: positive
      point: "美国数据中心负荷预测和弗吉尼亚州商业用电增长，显示新增电力容量有强劲的经济拉动。"
      sourceRefs:
        - 4
        - 7
        - 8
    - factor: social
      impact: negative
      point: "弗吉尼亚州的报道记录了公众争论：大型数据中心是否应承担更多电网基础设施成本。当地接受度可能影响选址和电价结果。"
      sourceRefs:
        - 8
        - 10
    - factor: technological
      impact: neutral
      point: "超导系统可以缩小线路占地并输送大功率，但所审阅的证据尚未证明场址规模的可靠性、冷却运行、保护协调及商业数据中心在线率。"
      sourceRefs:
        - 2
        - 14
        - 15
    - factor: legal
      impact: negative
      point: "共址发电/负荷规则、公用事业最低需求电价、电气审批和客户合同边界，都会带来因场址而异的合规与责任划分工作。"
      sourceRefs:
        - 9
        - 11
    - factor: environmental
      impact: negative
      point: "如果依赖天然气或其他燃烧方式，表后微电网可能增加排放；长期排放和许可要求也可能与客户的可持续发展目标冲突。"
      sourceRefs:
        - 12
        - 13
  adoptionFrictionMatrix:
    - friction: "真正的瓶颈在发电、电网并网或公用事业升级，而非园区馈线路径"
      severity: high
      affectedBuyer: "园区基础设施开发负责人和电力项目开发商"
      mitigation: "在承保任何线路资产前，要求取得签字确认的电源容量和公用事业边界研究。"
      sourceRefs:
        - 5
        - 8
        - 11
    - friction: "新型低温馈线没有具名商业数据中心运行案例，公开的长期运行证据有限"
      severity: high
      affectedBuyer: "数据中心运营、可靠性工程、保险方和业主工程师"
      mitigation: "开展由独立方见证的试点和故障/热测试，配置冗余冷却与控制，承诺明确的服务响应，并设置清晰的性能补救条款。"
      sourceRefs:
        - 2
        - 14
        - 15
    - friction: "公用事业、州级电价和 PJM 服务规则可能导致客户在租赁馈线之外仍须支付预留电网容量费用"
      severity: high
      affectedBuyer: "项目 CFO、监管法律顾问、公用事业和电力采购团队"
      mitigation: "签约前梳理电价和输电权；明确净/总 MW 的计量、限电、负荷爬坡及付款之间的关系。"
      sourceRefs:
        - 9
        - 10
        - 11
    - friction: "资产投入高、园区分期进度不确定，会带来利用率、交易对手和残值风险"
      severity: high
      affectedBuyer: "项目公司贷款方、出租方、开发商 CFO 和设备供应商"
      mitigation: "没有锚定客户预订和供应商/EPC 担保就不要开工；施工里程碑和介入权须与园区进度匹配。"
      sourceRefs:
        - 1
        - 8
        - 12
    - friction: "现场发电可能受到当地空气许可、排放、土地使用和社区限制"
      severity: medium
      affectedBuyer: "园区开发商、发电合作方和当地许可团队"
      mitigation: "独立核实场址发电许可路径、燃料和排放方案；将馈线租赁与任何发电机许可分开处理。"
      sourceRefs:
        - 8
        - 12
        - 13
market:
  tam:
    value: "$5.9B-$9.6B 年度等效容量"
    rationale: "这是美国市场理论上的上限区间，并非声称每个数据中心 MW 都需要或会租一条专用馈线。LBNL 对 2030 年用电量的低/高估算为 521-843 TWh/年，按每年 8,760 小时换算，平均负荷约为 59.5-96.2 GW。再套用每 MW 年 $100,000 的未验证测算代理值，得到每年 $5.95-$9.62B。该代理值仅用于可比市场规模计算，不是定价建议、已观察到的付费意愿，也不能证明租赁市场已经存在。"
    isEstimate: true
    sourceRefs:
      - 4
  sam:
    value: "$300M-$480M 年度等效容量"
    rationale: "在美国平均负荷 59.5-96.2 GW 的范围内，套用运营方假设的 5% 资格筛选比例，代表拥有表后或共址电源、临近建设 AI 机房且电源至机房线路受物理空间限制的园区。由此得到约 3.0-4.8 GW；按同一未验证的每 MW 年 $100,000 换算代理值计算，为每年 $300-$480M。5% 系数没有来源支持，是市场验证的核心风险；实际符合条件的负荷可能远低于此。"
    isEstimate: true
    sourceRefs:
      - 4
      - 5
      - 8
  som:
    value: "$10M 年度等效容量"
    rationale: "五年期情景假设为五个园区合计签约 100 MW，平均每个 20 MW；按同一未验证代理值计算，相当于每年 $10M。这要求产品从模拟环境中的 3 MW 演示，走到可重复的多兆瓦客户部署，并签下锚定客户预订。按同一算法，一个园区 20 MW 的情景仅为每年 $2M；两种情景都没有已观察到的租赁合同支持。"
    isEstimate: true
    sourceRefs:
      - 2
      - 4
