analysisModels:
  marketMapDiagram:
    title: "功率密度的紧迫性与专业化程度"
    mermaid: |
      quadrantChart
        title Market map: density-specific power delivery
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Conventional feeder/EPC: [0.25, 0.55]
