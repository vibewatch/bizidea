        - 12
    - priority: high
      question: "计入低温系统、冗余控制、安装、调试、保险、维护和更换后，针对具体园区的全生命周期模型能否证明总成本或工期有明确优势？"
      evidenceToGather: "取得供应商和 EPC 报价，对同一线路上的超导方案和传统方案进行对比；纳入 N+1 故障情景、冷却寄生能耗、维修时间、调试工期及保证容量。"
      sourceRefs:
