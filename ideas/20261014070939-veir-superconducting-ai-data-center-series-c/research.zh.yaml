  validationPlan:
    - priority: high
      question: "至少两个目标园区是否确有经核实的电源至机房线路限制，且传统电缆或母线槽无法在获批的占地和工期内解决？"
      evidenceToGather: "向至少 10 个园区设计团队索取匿名线路图、负荷计划、电缆桥架/竖井限制、土建报价、电源状态，以及业主工程师的书面确认。"
