slug: rolling-ind-startup-orchestration
date: '2026-09-22'
executiveSummary: Rolling IND Startup Orchestration 卖的是 FDA 新定义的一条工作流：小型生物科技申办方和合格研究机构可以在整份申报包完成前，先放出 IND 组件。真正痛的不是文档存储，而是现在就要判断哪份工作包已经可以安全前推，这样 IRB 准备和研究中心启动才能先开始，又不至于平白增加临床搁置或返工风险。MVP 是一个叠加层工作区：给 CMC、非临床、方案、研究者和研究中心就绪工作包做版本管理，记录证据和评论，并在人工复核阈值达成后触发下游任务。第一位客户是一家 seed 到 Series C 的生物科技公司，正在跑美国 1 期项目，并由外部 CRO、学术中心或法规顾问担任 QRI；买单人通常是法规负责人、COO 或开发负责人。方案保留了 idea.yaml 里的核心权衡：前 8 到 10 次试点式部署市场很窄，而且在这条工作流变成可复制软件前，导入仍会高度服务化。GTM 因而要从付费共创客户和可重复合作的 QRI 入手，按活跃项目加导入收费，衡量标准也不是泛泛的协作使用量，而是从安全可推进、第一份工作包放行到首个研究中心打开各自省下多少天。这个投资故事只有在公司能证明同一套方法可跨多个申办方项目复用、能叠加在现有 RIM 和启动系统上而不是取代它们、并且能在基准数据不断累积后从这个切口扩进更广的 pre-IND 与修订编排时，才真正站得住。
problem:
- 早期项目申办方至今还靠邮件、表格和供应商项目跟踪表去协调 CMC、非临床、方案、IRB 和研究中心启动，所以就绪度缺口总是很晚才冒出来。
- FDA 的滚动式申办方-QRI 模式造出了一个新的放行决策问题，而现有 RIM、eTMF、IRB 和研究中心启动工具都没人接这件事。
- 申办方已经在为 CRO 和法规人力买单，但下游 IRB 和研究中心工作还是常常得等整份申报包齐全后才动，而不是在局部已可信就绪时先并行。
solution:
- 搭一个叠加层工作区，把每个 IND 组件都做成带版本的工作包，写清负责人、证据要求、依赖关系和放行状态。
- 用保守且经过人工复核的就绪阈值，在整份 IND 还没完成前，就触发后续 IRB 准备和研究中心启动任务。
- 把放行决策和评论的可审计历史导回申办方现有系统，而不是逼买方把原有系统整套替掉。
whyWeWin:
- 产品卡在一个现有厂商只覆盖了一半的控制点上：决定一份局部工作包什么时候能在申办方、QRI、IRB 和研究中心团队之间安全放行。
- 重复合作的 QRI 和法规顾问可以把同一套工作包模板复用到多个申办方身上，这给公司带来的分发路径，比只靠申办方直销更能放大。
- 一旦把工作包放行时间、评论往返轮次和下游启动结果的数据攒起来，这些基准数据就能变成护城河，而今天的服务商和点工具都没有这层资产。
strategicChoices:
  beachhead: 滩头市场是这样一批 seed 到 Series C 生物科技申办方：手里只有一条主资产，外部有 QRI、CRO 或法规顾问配合，并且会先准备美国 1 期研究，再在未来 6 到 12 个月内把它往前推。
  wedgeRationale: 这层切得最清楚，因为董事会截止节点、融资节点和类试点时间线都逼着团队在整份 IND 还没成形前先证明进度。如果首个部署跑通，一个 QRI 伙伴还能把同一套工作包模型复用到多个申办方项目上，出证明的速度也会比泛化到更广的临床运营软件更快。
  sequencingRationale: 公司该先拿下一个窄而且高度服务化的申办方-QRI 工作流，把工作包分类体系和人工复核放行逻辑真正定住，再去更广地卖标准化软件。这个顺序也保住了 idea.yaml 里接受的权衡：前 8 到 10 次试点式部署只算共创客户证明，还不能当成整个市场已经可复制的证据。
  notYet:
  - 替代完整的 RIM 或 eTMF
  - 面向后期或多国试验的启动编排
  - 面向法规叙事的通用 AI 写作
market:
  tam: 按模型测算，年度 TAM 为 $42.0M：大约 210 个美国申办方-QRI 或申办方加伙伴的 pre-IND / 首次人体项目，每个在运项目的 ACV 约 $200k。
  sam: $16.0M 的建模得出的年度 SAM，来自约 80 best-fit 的 seed 到 Series C 申办方；它们都有外部 QRI、CRO 或法规顾问，并且近期就有把 IRB 或研究中心工作并行化的需求。
  som: $4.0M 的第 3 年 SOM，来自 20 个在运项目；这些项目通过 5 到 7 个重复合作的 QRI 或法规服务伙伴拿下。
  segments:
  - 准备美国 1 期项目、且依赖外部 QRI 或 CRO 的风投型生物科技申办方
  - 会同时协调多个申办方项目的重复合作 QRI、CRO 和法规顾问
  buyingProcess: 日常一线推动者往往是申办方的法规运营负责人或 QRI 项目经理，但真正拍板的通常是法规负责人、COO 或开发负责人。要获批，产品必须证明自己能把安全可推进所需天数或协同工时压下来，而且不用把现有 RIM 或启动系统整套换掉。
product:
  mvp: MVP 是一套申办方-QRI 叠加层工作区，涵盖工作包分类、证据清单、依赖图、评论日志、放行审批，以及面向方案、CMC 摘要、研究者资料包和研究中心就绪工作的下游触发器。MVP 要主打可审计和保守的人工作业复核，而不是追求自动化覆盖面。
  sixMonth: 半年内先把第一套可复用工作包库、申办方-QRI 角色、每周放行评审流程，以及一套 live 共创客户项目的审计导出交付出来。
  twelveMonth: 一年内补上基准报表、可复用 QRI 模板、一套面向 RIM 的导出，以及一个启动工具集成，好让产品能在多个申办方项目之间反复使用。
  twentyFourMonth: 两年内把工作流扩进标准 pre-IND 项目和关键修订流程，用更低触达的导入和跨项目基准，作为主要差异化。
  keyBets:
  - 重复合作的 QRI 一旦看见首次给药时间变快，会更愿意用可复用工作包模板，而不是继续每次都做全套定制协同。
  - 在需要深度双向集成之前，只读导入加审计导出就足以满足首批买家的要求。
  - 一套范围很窄的起步工作包库，就能覆盖大多数早期放行决策，没必要一上来把整套 IND 撰写流程都建模。
  - 只要局部工作包就绪度可信，下游 IRB 和研究中心任务就能先启动，而不会带来不可接受的返工。
gtm:
  wedge: 先把一个付费的申办方-QRI 共创工作区卖进一项时间紧迫的美国 1 期项目，再把同一套工作包模型复用到同一 QRI、CRO 或法规顾问服务的其他申办方项目上。
  channels:
  - 创始人主导直销，切进近期正卡在美国 1 milestone 上的风投型申办方
  - QRI、CRO 和法规顾问伙伴，它们能把同一套工作流复用到多个申办方身上
  - 来自 RIM、申办方-研究中心工具和启动工具厂商的集成转介绍
  funnelTargets: 工作流审计到付费共创客户 30-40%；付费共创客户到年度续约或第二个项目 60%+；重复合作的 QRI 在 9 个月内带来第二个申办方项目 50%+。
  pricing: 按每个活跃的 pre-IND 或首次人体项目收年费，再加一次性申办方-QRI 导入费。定价锚点是少掉多少协同人力和安全可推进时间，而不是文档量或席位数。
businessModel:
  revenueStreams:
  - 按每个活跃的申办方-QRI 启动项目收年度订阅费
  - 每个新工作区的一次性导入和集成费
  - 当复用被证明后，向重复合作的 QRI 出售基准与模板订阅
  unitOfValue: 活跃中的申办方-QRI pre-IND 或首次人体项目
  targetGrossMarginPct: 70
  expansionLevers:
  - 让每个重复合作的 QRI 伙伴跑更多项目
  - 把基准报表卖到 QRI 或申办方组合层面
  - 从试点式工作流扩进标准 pre-IND 与修订编排
strategyMap:
  northStarMetric: 从启动启动到第一份经验证的工作包放行、并成功解锁下游 IRB 或研究中心工作的天数
  inputMetrics:
  - 从启动到第一份可放行工作包的时间
  - 在无需回滚的前提下，由局部就绪触发的下游任务占比
  - 每个新申办方-QRI 工作区的导入中位时长
  - 付费试点转成第二个项目或年度续约的比例
  - 同时跑多个申办方项目的重复合作 QRI 伙伴数量
  moatsToBuild:
  - 按工作包类型和研究情境沉淀可复用的工作包就绪规则
  - 跨 QRI 的评论往返、放行时间和首个研究中心打开结果的基准数据集
  - 能证明叠加层可以与现有厂商系统共存的跨系统审计轨迹
  killCriteria:
  - 拿不到 2 个重复合作 QRI 的付费复用承诺，而且时间已过 12 个月
  - 付费部署的中位项目，无法把第一份可放行工作包出现的时间相对人工基线缩短至少 20%
  - 早期客户要求替换主记录系统，或每个项目实施时间超过 8 周
  mermaid: "flowchart LR\n  Wedge[Sponsor-QRI beachhead] --> MVP[Packet release workspace]\n  MVP --> Proof[Cycle-time and rework proof]\n  Proof --> Expansion[Repeat QRI programs and broader pre-IND workflows]\n"
investorMemo:
  verdict:
    call: 约聊 / 继续尽调
    conviction: 这是个有真实催化剂的有趣切口，但在至少一个 QRI 证明能跨申办方重复复用之前，判断力仍然偏低。
    whyBelieve: FDA 已经把一条新的滚动式申办方-QRI 工作流正式定义出来，而现有 RIM、IRB 和研究中心启动工具都只覆盖了其中一部分，因此这里出现了一个既紧急又可量化的控制点。
    whyDoubt: 初始买家池很小；如果申办方或 QRI 继续靠人工协同，产品也很容易塌回服务生意。
    nextDiligence: 先为一个付费共创客户和一条重复合作 QRI 管线做承保式验证：看同一套工作包模型能不能以可量化的周期改善，再拿下第二个申办方项目。
  firstCustomer:
    title: 美国 1 biotech（生物科技）申办方的法规负责人
    profile: 一支 6 到 20 人的开发团队，手里只有一条主资产，由外部 CRO 或法规顾问担任 QRI，并且时间线会被董事会直接盯着，目标是尽快推进到首次人体。
    trigger: 融资里程碑、试点申请，或董事会截止节点，迫使团队把 IND 就绪、IRB 准备和研究中心启动并行化。
    buyer: 法规负责人、COO 或开发负责人
    initialContract: 每个活跃项目先收 $75k-$100k 导入费，再收 $120k-$200k 年费；等工作包放行和开站证明跑出来后，再转成多项目或 QRI 层级协议。
  mustBeTrue:
  - 至少有 3 家 QRI 或法规顾问认同：面对重复申办方项目时，共享工作包模型比按小时计费的定制协同更好。
  - 付费部署能把第一份可放行工作包出现时间或首个研究中心就绪时间，相对各客户基线压短至少 20%。
  - 超过一半的付费共创客户会在 12 个月内扩到第二个项目或续成年单。
  - 买方接受叠加层架构加审计导出，而不是坚持要完整替换成主记录系统。
  - 相邻现有厂商不会在网络效应起势前，就补齐足够多的工作包放行治理和基准数据，把这道切口抹平。
  diligenceQuestions:
  - 哪些工作包家族可以在整份 IND 尚未完备前，就安全撬动 IRB 或研究中心工作？
  - QRI 业务负责人会为可复用软件掏钱，还是更愿意守住可计费的人工协同？
  - 在实际运行的账户里，Veeva、Florence、Advarra 或 Oracle 最低限度必须接哪一层集成？
  - 要让申办方董事会把产品视为里程碑级开支，周期缩短至少得有多大？
  - 官方 8 到 10 对试点之外，这条重复合作 QRI 渠道能不能在 12 到 18 个月内继续扩出去？
operatingAssumptions:
- assumption: 重复合作的 QRI 一旦发现申办方启动时间缩短，会更愿意采用可复用的工作包工作流，而不是继续按次定制、按工时收费。
  basis: research.yaml
  validationTest: 拿下 2 个付费 QRI 共创客户，并观察至少一例在第二个申办方项目上的复用。
  decisionImpact: 如果不成立，公司就会继续停留在申办方直销或高服务化形态，毛利故事也会变弱。
- assumption: 只要产品能把第一份可放行工作包出现时间或研究中心就绪时间，相对人工基线压短至少 20%，申办方就会愿意付费。
  basis: research.yaml
  validationTest: 先给两条在运项目做基线，再给工作流埋点，在续约前对比周期。
  decisionImpact: 如果不成立，定价就得向服务赋能下修，或者干脆放弃这道切口。
- assumption: 前六个客户只要叠加层带审计导出和有限回写就够。
  basis: 团队判断
  validationTest: 挑一套 Veeva 环境和一套启动工具栈做范围梳理，再确认 MVP 能否在不深度替换系统的前提下，于 6 周内上线。
  decisionImpact: 如果不成立，公司就必须更早补齐集成人手，并且提早去融一轮更大的钱。
- assumption: 只覆盖方案、CMC 摘要、研究者资料包和研究中心就绪工作包的起步库，就能吃下大多数早期时间节省。
  basis: idea.yaml
  validationTest: 映射一条申办方-QRI 工作流，确认这些工作包家族占到早期下游激活决策的 70% 以上。
  decisionImpact: 如果不成立，MVP 范围就会膨胀，实施时长也会跟着拉长。
- assumption: FDA 试点会在 12 到 18 个月内催生更多模仿申办方-QRI 工作流的项目，而不只停留在最初官方队列。
  basis: research.yaml
  validationTest: 跟踪 20 个目标账户，并用同一套工作包模型拿下至少 3 个非试点项目。
  decisionImpact: 如果不成立，公司就得更早扩进更广的标准 pre-IND 编排，才讲得动风险投资级别的规模故事。
experimentRoadmap:
- horizon: 0-90 天
  experiment: 旁听一条申办方-QRI 启动工作流，把第一版工作包分类体系定出来。
  hypothesis: 一套共享工作包模型足以覆盖那些卡住 IRB 和研究中心工作的主要就绪决策。
  successMetric: 拿下一个签约共创客户，并验证一张能覆盖 80% 以上早期放行决策的工作包地图。
  owner: 创始人/CEO
- horizon: 0-90 天
  experiment: 和重复合作的 QRI、CRO 以及法规顾问做付费意愿测试。
  hypothesis: 如果软件能提升跨申办方吞吐，QRI 业务负责人就愿意为可复用工具买单。
  successMetric: 拿到两份 LOI 或 QRI 侧的付费试点。
  owner: 创始人/CEO
- horizon: 90-180 天
  experiment: 在第一个 live 申办方项目上把 MVP 叠加层跑起来。
  hypothesis: 只靠人工复核阈值，就足以在不带来实质性下游回滚的前提下放行局部工作包。
  successMetric: 已放行工作包里的回滚比例低于 10%，而且第一份工作包放行时间至少比基线快 20%。
  owner: 法规工作流负责人
- horizon: 90-180 天
  experiment: 证明一套轻集成部署模型跑得通。
  hypothesis: 只读导入加审计导出，就能满足早期申办方的合规和实施要求。
  successMetric: 首个部署能在 6 周内上线，且不会被深写集成卡死。
  owner: 创始工程师
- horizon: 180-360 天
  experiment: 在同一家 QRI 服务的第二个申办方项目上复用同一套工作包模型。
  hypothesis: 模板复用能把导入时间压短，并改善部署毛利。
  successMetric: 第二个项目能在 3 周内上线，导入工作量至少下降 30%。
  owner: 实施负责人
- horizon: 180-360 天
  experiment: 把基准报表作为续约的一部分卖出去。
  hypothesis: 基准数据的价值足够高，能把试点转成年度合同和多项目扩张。
  successMetric: 至少 60% 的付费试点完成续约或扩到第二个项目。
  owner: 创始人/CEO
operations:
- 每次部署前都先做申办方-QRI 启动和工作包分类工作坊
- 每周跑一次放行评审节奏，带证据清单、审批日志和升级路径
- 把审计轨迹导回申办方已经在用的 RIM、eTMF 和启动系统
- 围绕放行时间、评论往返和首个研究中心打开结果，为 QRI 做基准复盘
team:
- role: 创始人/CEO
  startTiming: Month 0
  rationale: 亲自抓创始人主导销售、工作包分类发现，以及面向投资人的周期改善证明。
- role: 创始工程师
  startTiming: Month 0
  rationale: 把工作包图、权限、审计轨迹和第一套轻集成部署路径做出来。
- role: 法规工作流负责人
  startTiming: Month 2
  rationale: 把申办方-QRI 的实务经验翻成可复用的就绪规则，并守住不安全的放行逻辑。
- role: 实施负责人
  startTiming: Month 6
  rationale: 接住高服务化导入的负荷，并把早期操作手册打磨成可复制动作。
- role: 集成工程师
  startTiming: Month 9
  rationale: 等前两个付费账户把叠加层模式跑通后，再补最低限度的回写与连接器表面。
milestones:
- horizon: 0-12 个月
  items:
  - 拿下 2 个申办方共创客户和 2 个重复合作的 QRI 伙伴
  - 在一个在运项目上交付工作包图、证据清单、放行审批和审计导出
  - 证明第一份可放行工作包出现时间至少比人工基线快 20%
  - 把首个部署转成年度续约或第二项目扩张
- horizon: 12-24 个月
  items:
  - 按研究类型或工作流，把 3 到 4 套可复用工作包模板包标准化
  - 做到 5 到 7 个重复合作的 QRI / 法规服务伙伴，以及 10 个活跃项目
  - 补上基准仪表盘和两个生产级集成
  - 把导入时间从 6 到 8 周压到 3 周以内
- horizon: 24-36 个月
  items:
  - 从试点式工作流扩进标准 pre-IND 与修订编排
  - 做到 20 个在运项目，并和头部 QRI 伙伴签下多项目协议
  - 把基准数据做成竞标中的主要差异化
  - 在标准化部署上把目标毛利率守在 70% 以上
risks:
- risk: 官方试点带来的需求始终太窄，队列外的模仿式采用又来得很慢。
  likelihood: Medium
  impact: High
  mitigation: 尽快先通过重复合作 QRI 卖进去；一旦第一条工作流被验证，就立刻往更广的标准 pre-IND 编排扩。
- risk: 申办方和 QRI 继续为人工协同买单，而不是采用可复用软件。
  likelihood: High
  impact: High
  mitigation: 坚持只做付费共创客户，按可量化的周期节省定价，并尽快证明第二个项目复用。
- risk: 集成和合规要求把导入拉得太长，长到这道切口本身都不值钱。
  likelihood: Medium
  impact: High
  mitigation: 继续以叠加层优先，先交付审计导出，再去做深度回写，并把首批支持的系统组合收得很窄。
- risk: 相邻现有厂商补上足够多的工作包门控和里程碑可见性，把差异化迅速压扁。
  likelihood: Medium
  impact: Medium
  mitigation: 把基准数据集和 QRI 网络效应先做深，因为这两样比工作流界面更难被抄走。
- risk: 错误的就绪阈值会带来下游返工，甚至伤掉信誉。
  likelihood: Medium
  impact: High
  mitigation: 把人工审批一直留在环里，先从很窄的工作包库起步，并把每次放行都和证据对上日志。
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: $2-4M
  runwayMonths: 18
  useOfFundsSummary: 18 个月的跑道应该足够把核心产品、法规工作流能力和高触达实施团队搭起来，目标是在大规模外扩前先证明 3 到 5 个付费项目、2 条重复合作 QRI 渠道，以及一项可量化的周期改善。
