  searchedQueries:
  - 查找关于 FDA 2026 年 expedited IND pilot / Operation TrialBlazer 的权威与独立来源，重点看滚动 pre-IND 审评、QRI、IRB / 研究中心启动影响，以及为何美国 1 期启动速度落后于中国和澳大利亚。
  - 查找关于早期生物科技试验启动的现有痛点与预算：美国 1 期时间线、启动成本、临床搁置风险、生物科技公司外包给 CRO / 法规顾问的情况，以及申办方愿不愿为加速 pre-IND 和研究中心启动买工具或服务。
  - 查找与滚动 IND 启动编排相关的竞品和替代方案：RIM、eTMF / 临床工作流、IRB / 研究中心启动、CRO / 法规咨询门户，以及任何在做小型生物科技公司跨方 pre-IND 或启动协同的供应商。
  - 查找关于滩头市场规模和采用摩擦的资料：seed 到 Series C 生物科技公司准备美国 1 期研究时的数量、外包法规 / CRO 服务支出、研究中心启动 / IRB 瓶颈，以及采购或集成约束。
  - 查找关于美国每年启动多少项 1 期干预性药物试验或首次人体试验的权威资料，以及新兴 / 小型生物科技申办方在药物研发管线或创新里占多大比例。
  - 查找美国临床试验研究中心启动的瓶颈资料，重点看 IRB 审批、研究中心激活和合同谈判延误，最好有量化基准或公认机构评论。
  - 查找 Veeva Vault RIM、Florence SiteLink、Advarra study startup/IRB technology，以及 Medidata study startup 或申办方-研究中心 collaboration 的官方产品页，确认它们各自覆盖什么工作流。
  - 查找关于小型生物科技公司在早期开发中依赖 CRO / 法规顾问的高质量来源，以及为什么以外包、重服务的流程仍是默认选择。
  - 查找能量化新兴生物科技公司在药物研发管线或临床创新里占比的开放且可信来源，优先 IQVIA、Evaluate、Nature Reviews Drug Discovery、BIO 或大型咨询机构。
  - 查找澳大利亚或中国在首次人体试验速度上领先的官方或高质量来源，尤其是 7 个月对 17 个月或澳大利亚 70 天内启动等时间线。
  - 查找可公开访问的 Florence Healthcare 官方页面，说明 SiteLink 或申办方-研究中心 collaboration 的工作流范围、文档交换、eISF 或启动协同。
  - 查找可公开访问的 Oracle 或 Medidata 官方页面，说明临床试验中的 study startup 工作流范围、申办方-研究中心 collaboration 或研究中心激活。
