competitors:
- name: Veeva RIM
  stage: 现有厂商
  wedge: 为法规运营提供端到端申报与注册管理。
  pricing: 企业级定制定价；抓到的页面没有公开价目表
  strength: 在法规申报主记录系统上有非常强的可信度。
  weaknessVsUs: 抓到的能力范围围绕申报和注册，不是跨申办方、QRI、IRB 与研究中心利益相关方的工作包放行阈值。
  sourceRefs:
  - 12
- name: Florence SiteLink
  stage: 现有厂商-相邻
  wedge: 面向申办方和研究中心的文档工作流、eISF 协作与启动提速。
  pricing: 企业级定制定价；抓到的页面没有公开价目表
  strength: 在研究中心侧工作流和文档协作上的故事很强。
  weaknessVsUs: 它从研究中心文档控制和协作起步，而不是从滚动 FDA / QRI 互动驱动的 pre-IND 放行治理起步。
  sourceRefs:
  - 10
- name: Advarra Study Startup
  stage: 现有厂商
  wedge: 在利益相关方之间共享启动里程碑可见性，包括 ethics review。
  pricing: 企业级定制定价；抓到的页面没有公开价目表
  strength: 在启动里程碑和 IRB 相邻工作流上有直接公信力。
  weaknessVsUs: 它从激活层开始，而不是从“哪份 IND 工作包已经可以往前推”这个更上游的判断开始。
  sourceRefs:
  - 11
- name: Oracle Site Activate
  stage: 现有厂商
  wedge: 以 SOP 驱动申办方、CRO 和研究中心的激活工作流，覆盖文档与里程碑追踪。
  pricing: 企业级定制定价；抓到的页面没有公开价目表
  strength: 研究中心激活执行流程和法规任务可见性都很强。
  weaknessVsUs: 它更像研究中心激活执行引擎，不是申办方-QRI 的 pre-IND 排序层，也不处理正式 IND 完整前的放行逻辑。
  sourceRefs:
  - 13
- name: PPD Biotech Solutions
  stage: 现有厂商-服务
  wedge: 为新兴生物科技公司提供全套 CRO 支持和供应商管理层。
  pricing: 服务合同；按范围定制
  strength: 已有网络、执行广度和新兴生物科技买方信任。
  weaknessVsUs: 它可以靠人把事情协调起来，但天然不会长出可复用的软件图谱，也攒不出跨客户的基准护城河。
  sourceRefs:
  - 14
regulatoryTechnicalConstraints:
- point: FDA 仍保留全部监管权，正式 30 天审评时钟也只有在完整 IND 提交后才会启动。
  sourceRefs:
  - 1
  - 7
- point: 即便 FDA 鼓励更早开始，IRB 审查、合同和研究中心激活仍各自受机构流程约束。
  sourceRefs:
  - 2
  - 7
  - 18
- point: 申办方技术栈本来就很碎，因此任何新工具只要不能接进买方现有的文档和启动系统，就会直接制造额外拖拽。
  sourceRefs:
  - 10
  - 13
  - 14
- point: 工作包模板必须适配非临床、CMC 和临床材料各自不同的成熟节奏，而不能假设所有材料只遵循一套静态就绪模型。
  sourceRefs:
  - 3
  - 7
validationSignals:
- point: FDA 已经从 RFI 走到正式试点设计并开始收申请，说明这次工作流变化是真事，不是纸上假设。
  sourceRefs:
  - 1
  - 4
- point: 相邻厂商已经在卖启动提速、申办方-研究中心协作和里程碑可见性，这至少说明买方本来就愿意为工作流速度花钱。
  sourceRefs:
  - 10
