  - 13
- point: I 期融资虽然更挑，但体量仍不小，这支持了“首次人体时间仍有明确经济价值”的判断。
  sourceRefs:
  - 15
- point: 澳大利亚和中国继续扮演真实替代选项，因此速度问题始终挂在美国项目的心头。
  sourceRefs:
  - 5
  - 16
  - 17
openQuestions:
- 重复合作的 QRI 会不会真的想要一层能跨申办方复用的软件，还是更愿意守住可计费的人工协同？
- 即便没进官方队列，未来 12 个月内到底会有多少非试点申办方照着这套工作流去跑？
- 要和 Veeva、Florence、Advarra 或 Oracle 的部署共存，最低限度需要哪些回写和审计轨迹集成？
- 到底是哪些工作包家族最适合局部放行，哪些又仍得等到 IND 基本完整之后，下游工作才安全？
