  pestle:
  - factor: 政治
    impact: positive
    point: FDA 和 HHS 都在明确优先推动美国早期阶段提速，因此所有能把首次人体启动压短的工具，都天然吃到政策顺风。
    sourceRefs:
    - 1
    - 4
  - factor: 经济
    impact: neutral
    point: 资本市场更挑剔，让更快撞上里程碑的价值更高；但也让愿意为独立工具掏钱的买家总数受限。
    sourceRefs:
    - 3
    - 15
  - factor: 社会
    impact: positive
    point: 小型生物科技团队越来越依赖外部执行方，这让跨公司工作流协同的重要性比以前高得多。
    sourceRefs:
    - 8
    - 14
  - factor: 技术
    impact: positive
    point: 文档、激活和协作系统的存在，本身就说明底层集成土壤已经具备，缺的只是上面那层放行治理。
    sourceRefs:
    - 10
    - 11
    - 12
    - 13
  - factor: 法律
    impact: negative
    point: FDA 仍握全部监管权，正式 30 天时钟也没变；再加上 QRI 治理未定、各机构 IRB 流程不同，合规和责任边界都是真约束。
    sourceRefs:
    - 1
    - 7
    - 18
  adoptionFrictionMatrix:
  - friction: QRI 的供给和信任关系可能只集中在少数伙伴手里。
    severity: high
    affectedBuyer: 法规负责人或 QRI 业务负责人
    mitigation: 先从重复合作的 QRI 共创客户切入，先卖模板复用和基准报表，再考虑大面向申办方扩。
    sourceRefs:
    - 1
    - 18
  - friction: 接入现有 RIM、申办方-研究中心和启动技术栈，可能把试点直接拖死。
    severity: medium
    affectedBuyer: 法规运营或实施负责人
    mitigation: 把产品定位成叠加层，先做回写和审计轨迹导出，而不是替代主记录系统。
    sourceRefs:
    - 10
    - 12
    - 13
    - 14
  - friction: 先买服务、后买软件的习惯，会让 ROI 更难单独算清。
    severity: high
    affectedBuyer: COO 或开发负责人
    mitigation: 定价直接锚在省下的供应商管理工时和安全可推进时间，而不是抽象的协作收益。
    sourceRefs:
    - 8
    - 14
    - 15
  - friction: 放行阈值一旦判断错，就可能带来下游返工或安全顾虑。
    severity: high
    affectedBuyer: 申办方法规负责人
    mitigation: 保持人工复核规则引擎，先从很窄的工作包库起步，并把每次放行和证据、评论一条条记清。
    sourceRefs:
    - 3
    - 7
