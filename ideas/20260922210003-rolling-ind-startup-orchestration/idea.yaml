problem: >-
  Small biotech sponsors still build early clinical startup as a sequential
  handoff across regulatory authors, CROs, IRBs, and sites, so missing CMC,
  protocol, or operational details surface late. FDA's pilot changes the job
  into a rolling sponsor-QRI collaboration where partial IND components can
  move before the full package is assembled. Existing RIM, eTMF, and consultant
  trackers are document stores or service spreadsheets, not a dependency system
  for releaseable work packets, which keeps clinical hold risk and start-up
  delay high.
targetUser:
  primary: >-
    Regulatory operations or early clinical development leads at venture-backed
    biotechs preparing their first U.S. phase 1 study with a QRI partner
  secondary: >-
    Program leads inside CROs, academic medical centers, or regulatory advisory
    firms acting as qualified research institutions for multiple sponsors
  buyer: >-
    COO, Head of Development, or Head of Regulatory at a small biotech trying
    to compress first-in-human timelines
startupThesis:
  nonObviousInsight: >-
    The new bottleneck is not writing a better IND narrative; it is deciding
    which partial packet is truly ready to release across sponsor, QRI, IRB,
    and site teams without waiting for the whole filing.
  beachhead: >-
    Seed-to-Series C biotech sponsors with one lead asset, limited internal
    regulatory operations staff, and a near-term U.S. first-in-human program
    that will either apply to the FDA pilot or imitate its sponsor-QRI model
  wedge: >-
    A sponsor-QRI workspace that versions IND packets by module, records
    readiness evidence and review comments, and automatically opens downstream
    IRB or site-activation tasks once a packet crosses a defined threshold
  whyNowCatalyst: >-
    FDA is accepting applications for an expedited pilot that formalizes
    rolling pre-IND review and explicitly ties it to sponsor-QRI coordination,
    IRB review, and site activation.
  ventureScalePath: >-
    Start with U.S. phase 1 startup for pilot-style sponsor-QRI programs, then
    expand into standard pre-IND and CTA preparation, cross-program QRI
    benchmarking, amendment workflows, and the broader operating layer for
    outsourced regulatory execution across CROs and advisors.
solution: >-
  Rolling IND Work Packets is a cross-organization workspace built for sponsor
  and QRI teams, not just one internal function. Each CMC, preclinical,
  protocol, investigator, and site-readiness deliverable becomes a versioned
  work packet with owners, dependencies, required evidence, and release status.
  Once a packet is ready, the system can spin out the exact IRB or site-start
  tasks that depend on it instead of waiting for the full binder. The product
  produces an auditable history of what was released, what comments came back,
  and which downstream tasks were safely unblocked, while integrating with the
  sponsor's existing document systems rather than replacing them.
goToMarketSeed:
  firstCustomer: >-
    A U.S. or Europe-based venture biotech with one lead asset, a 6 to 20
    person development team, and an external CRO or regulatory advisor serving
    as its QRI for a first U.S. phase 1 program
  buyingTrigger: >-
    A financing milestone, board deadline, or FDA-pilot application that forces
    the company to compress first-in-human startup without hiring a large
    internal regulatory project-management team
  currentAlternative: >-
    Spreadsheets, email, SharePoint, CRO project trackers, consultant program
    managers, and generic RIM or eTMF tools
  switchingReason: >-
    The product gives sponsors one shared packet-by-packet dependency model
    across sponsor, QRI, IRB, and site teams, which generic systems and manual
    coordination do not provide.
  pricingHypothesis: >-
    Annual subscription priced per active pre-IND or first-in-human program,
    plus onboarding fees for each sponsor-QRI workspace
