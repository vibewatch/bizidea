  title: Rolling review to first dose
  mermaid: |
    flowchart LR
      Sponsor --> Packets
      QRI --> Packets
      Packets --> FDA
      Packets --> IRB
      Packets --> Sites
      Sites --> FirstDose[First dose]
businessModelCanvas:
  customerSegments:
    - Venture-backed biotech sponsors preparing first U.S. phase 1 studies
    - CROs, academic medical centers, and regulatory advisors acting as QRIs
    - Sponsor teams spanning regulatory, CMC, and clinical operations
  valuePropositions:
    - Turn rolling pre-IND review into a dependency-managed workflow instead of email and spreadsheets
    - Surface clinical hold risk earlier by exposing missing packet evidence before full filing
    - Start IRB and site work from verified partial readiness instead of waiting for complete binders
  channels:
    - Regulatory advisory firms and CRO partners serving as QRIs
    - FDA-pilot applicant networks and early-clinical biotech communities
    - Existing document-system and RIM integration partners
  customerRelationships:
    - High-touch implementation for the first sponsor-QRI program
    - Reusable packet templates for repeat studies
    - Benchmarking and best-practice reviews for active customers
  revenueStreams:
    - Subscription fee per active pre-IND or first-in-human program
    - Workspace onboarding and integration fees
    - QRI benchmarking subscription as the network matures
  keyResources:
    - Versioned packet dependency model
    - Template library for IND, IRB, and site-start deliverables
    - Benchmark data on defects, comments, and cycle times
  keyActivities:
    - Onboard sponsor and QRI teams into shared workspaces
    - Configure packet templates, evidence rules, and dependency thresholds
    - Capture review history and benchmark startup timelines
  keyPartners:
    - CROs, academic medical centers, and regulatory advisors serving as QRIs
    - eTMF, RIM, and document-management vendors
    - Early-clinical regulatory consultants
  costStructure:
    - Clinical-regulatory implementation staff
    - Product and integration engineering
    - Compliance, support, and customer success
jobsToBeDone:
  - job: >-
      When a small biotech is preparing a first U.S. phase 1 study with an
      external QRI, help the regulatory lead decide which IND packet can move
      now, so they can shorten time to first dose without creating avoidable
      hold risk.
    currentAlternative: CRO trackers, spreadsheets, and consultant PM updates
    successMetric: Days from pre-IND kickoff to first packet release and time to first site open
  - job: >-
      When clinical operations wants to start IRB and site activation before
      the full filing is complete, help the team release only the evidence that
      is truly ready, so downstream partners stop waiting on the entire binder.
    currentAlternative: Email attachments, shared drives, and manual readiness calls
    successMetric: Percentage of downstream tasks launched from partial packet readiness without rework
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      Treating pre-IND startup as a releaseable packet graph across sponsor,
      QRI, IRB, and site teams is materially more specific than generic
      regulatory authoring or trial operations software.
  venturePotential:
    score: 4
    rationale: >-
      The category can expand across early clinical startup and outsourced
      regulatory execution, but the first commercial wedge is constrained by a
      small pilot and consultative motion.
  whiteSpace:
    score: 5
    rationale: >-
      Incumbent RIM, eTMF, and CRO PM tools do not own cross-party rolling
      packet release before a complete IND exists, leaving a newly standardized
      workflow open.
  painIntensity:
    score: 4
    rationale: >-
      Delays to first-in-human startup directly threaten financing timelines,
      trial geography choices, and clinical hold exposure for lean biotech
      teams.
  wedgeClarity:
    score: 4
    rationale: >-
      The first workflow is clear around pilot-style sponsor-QRI programs, even
      if winning early accounts will require some implementation services.
  evidenceFit:
    score: 5
    rationale: >-
      A primary FDA announcement plus four independent sources all describe the
      same workflow shift around rolling review, QRI coordination, and site
      activation.
topRisks:
  - name: Pilot cohort concentration
    description: The first commercial demand may be concentrated in only a
      handful of sponsor-QRI pairs.
    mitigation: Sell to QRIs and non-pilot sponsors that want to copy the same
      workflow, not only official pilot participants.
  - name: Services-heavy adoption
    description: Early customers may still prefer regulatory advisors and CROs
      to manage the process manually.
    mitigation: Package the software with implementation templates and prove
      value through time-to-packet and site-start benchmarks.
  - name: Incumbent workflow extension
    description: RIM, eTMF, or CRO vendors could add lightweight startup task
      layers once the workflow is validated.
    mitigation: Own the cross-organization packet graph and benchmark dataset
      that point tools and single-vendor portals cannot replicate quickly.
