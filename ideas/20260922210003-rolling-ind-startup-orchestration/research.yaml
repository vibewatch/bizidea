      80 modeled best-fit programs per year x $200k ACV, limited to
      seed-to-Series C sponsors pursuing a U.S. first-in-human study with an
      external QRI, CRO, or regulatory advisor and a clear need to parallelize
      IRB/site work.
    isEstimate: true
    sourceRefs:
      - 1
      - 2
      - 8
      - 14
      - 15
  som:
    value: "$4.0M"
    rationale: >-
      20 live programs x $200k ACV, representing a plausible year-3 footprint
      won through 5 to 7 repeat QRIs or regulatory-service partners each
      managing multiple sponsor programs.
    isEstimate: true
    sourceRefs:
      - 1
      - 10
      - 14
      - 15
