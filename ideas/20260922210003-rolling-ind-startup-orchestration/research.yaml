  searchedQueries:
    - "Find authoritative and independent sources about FDA's 2026 expedited IND pilot / Operation TrialBlazer, including rolling pre-IND review, qualified research institutions, IRB/site activation implications, and why U.S. phase 1 startups are considered slow versus China or Australia."
    - "Find sources on current pain and budget in early-phase biotech trial startup: U.S. phase 1 timelines, startup costs, clinical hold risk, biotech outsourcing to CROs/regulatory consultants, and evidence that sponsors pay for tools or services to accelerate pre-IND and site startup."
    - "Find competitors and substitutes relevant to rolling IND startup orchestration: regulatory information management (RIM), eTMF/clinical workflow, IRB/site activation, CRO/regulatory consulting portals, and any vendors addressing cross-party pre-IND or site startup coordination for small biotechs."
    - "Find market sizing and adoption-friction sources for the beachhead of seed-to-Series C biotechs preparing a first U.S. phase 1 study, including counts of clinical-stage biotechs, spending on outsourced regulatory/CRO services, site startup/IRB bottlenecks, and procurement or integration constraints."
    - "Find authoritative or high-quality sources on how many U.S. phase 1 interventional drug trials or first-in-human trials start annually, and on the share of drug pipelines or innovation driven by emerging/small biotech sponsors."
    - "Find sources on clinical trial site startup bottlenecks in the U.S., especially IRB approval, site activation, and contract negotiation delays, with quantitative benchmarks or commentary from recognized organizations."
    - "Find official product or company pages for Veeva Vault RIM, Florence SiteLink, Advarra study startup/IRB technology, and Medidata study startup or sponsor-site collaboration that describe their workflow scope."
    - "Find primary or high-quality sources on small biotech reliance on CROs/regulatory consultants in early-phase development and why outsourced service-heavy processes remain the default."
    - "Find open, credible sources that quantify emerging biotech companies' share of the drug development pipeline or clinical innovation, especially sources from IQVIA, Evaluate, Nature Reviews Drug Discovery, BIO, or major consultancies."
    - "Find official and high-quality sources on Australia or China speed advantage in first-in-human trials, especially timelines such as 7 months vs 17 months or sub-70 day startup in Australia."
    - "Find an accessible official Florence Healthcare page describing SiteLink or sponsor-site collaboration workflow scope, document exchange, eISF, or startup collaboration."
    - "Find an accessible official Oracle or Medidata page describing study startup workflow scope, sponsor-site collaboration, or site activation for clinical trials."
