slug: rolling-ind-startup-orchestration
date: '2026-09-22'
currency: USD
modelStartMonth: '2026-10'
assumptions:
  - id: A1
    name: Model start month
    value: '2026-10'
    unit: month
    source: "Starts the first full month after the 2026-09-22 business-plan date."
  - id: A2
    name: Starting cash after pre-seed close
    value: "$2.4M"
    unit: usdM
    source: "[BP fundingAsk] The BP targets a $2-4M pre-seed; the base model uses a $2.4M ask because it funds the first 18 months to proof plus a six-month buffer."
  - id: A3
    name: Starting active programs (M1)
    value: "0"
    unit: programs
    source: "[BP executiveSummary; BP milestones] The company starts pre-revenue and must first convert design-partner deployments into paying active programs."
  - id: A4
    name: Blended annual revenue per active program
    value: "$200.0K"
    unit: usdK_per_program_year
    source: "[BP market.tam; BP investorMemo.firstCustomer.initialContract; research.market.bottomUpSizingDrivers] The BP and research both anchor the market model at about $200K ACV per active program, so the base model uses that value and does not separately stack extra onboarding revenue on top."
  - id: A5
    name: Net active-program ramp
    value: "M1-M12 EOP programs: 0,0,0,1,1,2,2,3,3,4,4,5; Q1Y2-Q4Y3 EOP programs: 6,8,9,10,12,15,18,20"
    unit: programs
    source: "[BP milestones; BP fundingAsk.useOfFundsSummary; research.market.som] The ramp reaches 5 paid programs by Y1 exit, 10 by Y2 exit, and 20 by Q4Y3, matching the BP's proof sequence and the research SOM."
  - id: A6
    name: Target gross margin
    value: "70%"
    unit: percent
    source: "[BP businessModel.targetGrossMarginPct] The model holds COGS at 30% of revenue to match the business-plan gross-margin target."
  - id: A7
    name: Monthly churn or program roll-off
    value: "5.5%"
    unit: percent
    source: "[BP businessModel.unitOfValue; BP investorMemo.mustBeTrue] The unit of value is an active program, so the model uses an approximately 18-month average life with second-program expansion offsetting some natural program completion."
  - id: A8
    name: Fully loaded CAC
    value: "$60.0K per active program"
    unit: usdK_per_program
    source: "[BP gtm; BP buyingProcess; research.reportMemo.willingnessToPay] Founder-led sales, regulated procurement, and services-heavy onboarding keep CAC high even with partner reuse."
  - id: A9
    name: Loaded salary bands
    value: "Founder $190K; engineering $170K; regulatory workflow $160K; implementation/customer success $135K; GTM $150K; G&A $100K"
    unit: usdK_per_fte_year
    source: "Startup-finance heuristic for a U.S.-based pre-seed biotech workflow software team, anchored to [BP team] and the regulated implementation burden described in research.yaml."
  - id: A10
    name: Headcount snapshot ramp
    value: "Founder 1/1/1/1/1/1; engineering 1/1/2/2/3/4; regulatory workflow 1/1/1/1/2/2; implementation/customer success 0/1/1/1/2/3; GTM 0/0/0/1/1/2; G&A 0/0/0/0/1/1 across q1y1/q2y1/q3y1/q4y1/q4y2/q4y3"
    unit: fte
    source: "[BP team; BP milestones; BP strategicChoices.sequencingRationale] The model follows the BP order: product and regulatory depth first, then implementation capacity, then partner-facing GTM and light operations."
  - id: A11
    name: Y1 non-salary operating budgets
    value: "Sales and marketing $6-16K monthly; research and development infrastructure $12-18K monthly; G&A and compliance $9-13K monthly"
    unit: usdK_per_month
    source: "[BP operations; BP experimentRoadmap] Early spend stays lean but funds QRI travel, secure workspace infrastructure, validation support, and basic legal and compliance overhead for design-partner deployments."
  - id: A12
    name: Y2-Y3 non-salary operating budgets
    value: "Non-salary opex by quarter: Q1Y2 $118K, Q2Y2 $132K, Q3Y2 $146K, Q4Y2 $158K, Q1Y3 $172K, Q2Y3 $184K, Q3Y3 $196K, Q4Y3 $212K"
    unit: usdK_per_quarter
    source: "[BP milestones; BP operations; research.adoptionFrictionMatrix] Spending rises with integrations, benchmark reporting, sponsor-QRI onboarding, and compliance support, but remains disciplined because the beachhead is still narrow."
  - id: A13
    name: Payroll smoothing rule
    value: "Quarterly salary expense ramps between snapshot headcount points instead of stepping only at year-end."
    unit: method
    source: "[financial-modeler instructions] Salary expense uses the most recent hiring plan and smooths hires across each quarter so payroll reconciles to the team plan."
  - id: A14
    name: Base sales cycle
    value: "6 months from design-partner kickoff to scaled annual program use"
    unit: months
    source: "[BP experimentRoadmap; BP investorMemo.firstCustomer; research.buyingTriggers] The model assumes the first live deployment can launch within weeks, but broader paid program expansion still takes about two quarters of proof and buyer coordination."
  - id: A15
    name: Revenue recognition convention
    value: "Recognized revenue equals average active programs in each month or quarter times blended ARPU; the active-program ramp is net of churn."
    unit: method
    source: "Startup-finance heuristic for ratable workflow-software revenue recognition so revenue cleanly reconciles to active-program counts and ARPU."
  - id: A16
    name: Downside scenario deltas
    value: "$180K ARPU, 65% gross margin, 8-month sales cycle, and 16 active programs by Q4Y3"
    unit: scenario_inputs
    source: "[BP risks; research.sensitivityCases] The downside reflects slower QRI reuse, more services-heavy onboarding, and buyers capping early spend."
  - id: A17
    name: Upside scenario deltas
    value: "$220K ARPU, 72% gross margin, 5-month sales cycle, and 24 active programs by Q4Y3"
    unit: scenario_inputs
    source: "[BP product.twentyFourMonth; BP milestones; research.distributionChannels] The upside assumes repeat QRIs compound faster, benchmark reporting monetizes cleanly, and onboarding standardizes earlier."
  - id: A18
    name: Cash conversion simplification
    value: "Ending cash rolls forward from EBITDA with no debt, tax, or capex line items."
    unit: method
    source: "Startup-finance heuristic for an asset-light software company where working-capital swings are small relative to operating burn."
