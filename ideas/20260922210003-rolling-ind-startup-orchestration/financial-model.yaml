  - variable: CAC
    downsideCase: "$75K CAC if founder-led and services-heavy acquisition persists"
    baseCase: "$60K CAC"
    upsideCase: "$50K CAC with stronger repeat-QRI sourcing"
    y3RevenueImpactK: 0.0
    cashImpactK: -300.0
  - variable: churn
    downsideCase: "7.0% monthly churn or program roll-off"
    baseCase: "5.5% monthly churn or program roll-off"
    upsideCase: "4.5% monthly churn or program roll-off"
    y3RevenueImpactK: -250.0
    cashImpactK: -175.0
  - variable: sales cycle
    downsideCase: "8 months because QRI adoption and sponsor approval move sequentially"
    baseCase: "6 months"
    upsideCase: "5 months with repeatable proof and partner templates"
    y3RevenueImpactK: -650.0
    cashImpactK: -520.0
  - variable: gross margin
    downsideCase: "65% if onboarding and validation stay bespoke"
    baseCase: "70%"
    upsideCase: "72% with more standardized implementations"
    y3RevenueImpactK: 0.0
    cashImpactK: -150.0
  - variable: hiring pace
    downsideCase: "Pull one GTM and one implementation hire forward by two quarters"
    baseCase: "Follow the staged hiring plan"
    upsideCase: "Delay one non-core hire until repeat-QRI pull is visible"
    y3RevenueImpactK: 0.0
    cashImpactK: -210.0
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      QRIs[Repeat QRIs and sponsors] --> Programs[Active programs]
      Programs --> Revenue[Program ACV revenue]
      Revenue --> GrossProfit[Gross profit at 70%]
      GrossProfit --> Cash[Cash after payroll and opex]
modelSanity:
  - checkName: Revenue engine
    finding: "Base-case revenue comes from scaling active programs from 5 at Y1 exit to 20 by Q4Y3 at roughly $200K per program through repeat-QRI reuse rather than broad sponsor-direct volume."
  - checkName: Must go right
    finding: "The company must turn the first paid QRI deployments into repeatable second-program wins quickly enough to keep the sales cycle near six months."
  - checkName: Model breaks if
    finding: "The downside case turns cash negative if QRI reuse is slower than planned and onboarding stays bespoke enough to push gross margin down toward 65%."
  - checkName: Next-round proof
    finding: "The next financing is justified once the company can show 8 active programs, at least 3 repeat partners, one renewal or second-program expansion, and a measured 20% cycle-time improvement."
sanityChecks:
  ruleOf40: "Y3 growth 96.7% + EBITDA margin -12.6% = 84.1%."
  burnMultiple: "Y2 burn multiple is about 0.7x on $1.0M of net new ARR; Y3 improves to about 0.2x on $2.0M of net new ARR."
  revenuePerFte: "$231K Y3 using annual revenue and 13 year-end FTE (benchmark $200-400K SaaS)."
  flags:
    - "The model still assumes the company can hold 70% gross margin even though the first 8-10 deployments are explicitly services-heavy in the BP."
    - "Reaching 20 live programs by Q4Y3 depends on repeat QRIs bringing second and third sponsor programs on schedule; sponsor-direct demand alone is unlikely to support the ramp."
    - "Base-case ending cash is only about $0.45M, so management should begin the seed process before Q3Y3 rather than wait for near-breakeven."
