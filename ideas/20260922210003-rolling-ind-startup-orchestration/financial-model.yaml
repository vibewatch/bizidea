scenarios:
  downside:
    description: "QRI reuse arrives slower than planned, sponsors cap early program spend, and onboarding stays services-heavy."
    y3RevenueK: 2182.5
    y3EbitdaK: -1059.76
    cashLowPointK: -480.46
    keyAssumptionChanges:
      - "Blended annual program value falls from $200K to $180K."
      - "Gross margin falls from 70% to 65%."
      - "Sales cycle stretches from 6 months to 8 months."
      - "Q4Y3 active programs reach 16 instead of 20."
  base:
    description: "The base case reaches 20 live programs by Q4Y3 at the BP and research $200K active-program ACV while holding the BP's 70% gross-margin target."
    y3RevenueK: 3000.0
    y3EbitdaK: -378.38
    cashLowPointK: 449.43
    keyAssumptionChanges:
      - "Blended annual program value stays at $200K."
      - "Gross margin stays at the BP target of 70%."
      - "Sales cycle holds near 6 months with repeat-QRI reuse."
      - "Q4Y3 active programs reach 20, matching the research SOM."
  upside:
    description: "Repeat QRIs compound faster, benchmark reporting monetizes sooner, and implementation standardizes early."
    y3RevenueK: 3850.0
    y3EbitdaK: 293.62
    cashLowPointK: 1005.11
    keyAssumptionChanges:
      - "Blended annual program value rises from $200K to $220K."
      - "Gross margin improves from 70% to 72%."
      - "Sales cycle compresses from 6 months to 5 months."
      - "Q4Y3 active programs reach 24."
