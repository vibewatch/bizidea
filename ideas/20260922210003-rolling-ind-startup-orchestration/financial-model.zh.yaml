slug: rolling-ind-startup-orchestration
date: '2026-09-22'
currency: USD
modelStartMonth: 2026-10
assumptions:
- id: A1
  name: 模型起始月份
  value: 2026-10
  unit: month
  source: '[BP date] 从 2026-09-22 business-plan 之后的首个完整月份开始。'
- id: A2
  name: pre-seed 交割后的起始现金
  value: $2.4M
  unit: usdM
  source: '[BP fundingAsk] BP 目标是 $2-4M 的 pre-seed；基准模型取 $2.4M，因为这笔钱既能覆盖前 18 个月跑到验证点，也再多留大约六个月缓冲。'
- id: A3
  name: 起始在运项目数（M1）
  value: '0'
  unit: programs
  source: '[BP executiveSummary; BP milestones] 公司从零收入起步，得先把共创客户部署转成付费在运项目。'
- id: A4
  name: 单个在运项目的混合年收入
  value: $200.0K
  unit: usdK_per_program_year
  source: '[BP market.tam; BP investorMemo.firstCustomer.initialContract; research.market.bottomUpSizingDrivers] BP 和 research 都把市场模型锚在每个在运项目约 $200K ACV，因此基准模型直接采用这个值，不再额外把导入收入叠加进来。'
- id: A5
  name: 在运项目净爬坡
  value: M1-M12 期末项目数：0,0,0,1,1,2,2,3,3,4,4,5；Q1Y2-Q4Y3 期末项目数：6,8,9,10,12,15,18,20
  unit: programs
  source: '[BP milestones; BP fundingAsk.useOfFundsSummary; research.market.som] 这条爬坡线对应 "5 paid programs by Y1 exit, 10 by Y2 exit, and 20 by Q4Y3"，与 BP 的验证顺序和 research 里的 SOM 保持一致。'
- id: A6
  name: 目标毛利率
  value: 70%
  unit: percent
  source: '[BP businessModel.targetGrossMarginPct] 模型把 COGS 固定在收入的 30%，用来对齐 business-plan 里的毛利率目标。'
- id: A7
  name: 月度流失率 / 项目自然结项率
  value: 5.5%
  unit: percent
  source: '[BP businessModel.unitOfValue; BP investorMemo.mustBeTrue] 价值单元是活跃项目，因此模型按平均约 18 个月生命周期建模，并假设第二个项目扩张能抵消一部分自然结项。'
- id: A8
  name: 完全加载 CAC
  value: $60.0K / 每个在运项目
  unit: usdK_per_program
  source: '[BP gtm; BP buyingProcess; research.reportMemo.willingnessToPay] 创始人主导销售、受监管采购和高度服务化导入，会把 CAC 顶在高位，哪怕有伙伴复用加成。'
- id: A9
  name: 含负担薪酬区间
  value: 创始人 $190K；工程 $170K；法规工作流 $160K；实施/客户成功 $135K；GTM $150K；管理与行政 $100K
  unit: usdK_per_fte_year
  source: 面向美国 pre-seed 生物科技工作流软件团队的创业公司财务经验值，结合了 [BP team] 和 research.yaml 里描述的受监管实施负担。
- id: A10
  name: 团队规模快照爬坡
  value: Founder 1/1/1/1/1/1；工程 1/1/2/2/3/4；法规工作流 1/1/1/1/2/2；实施/客户成功 0/1/1/1/2/3；GTM 0/0/0/1/1/2；G&A 0/0/0/0/1/1，分别对应 q1y1/q2y1/q3y1/q4y1/q4y2/q4y3
  unit: fte
  source: '[BP team; BP milestones; BP strategicChoices.sequencingRationale] 模型遵循 BP 的顺序：先补产品和法规深度，再补实施能力，最后再加面向伙伴的 GTM 和轻运营。'
- id: A11
  name: Y1 非薪资运营预算
  value: 销售与市场每月 $6-16K；研发基础设施每月 $12-18K；G&A 与合规每月 $9-13K
  unit: usdK_per_month
  source: '[BP operations; BP experimentRoadmap] 早期开支压得很紧，但仍要覆盖 QRI 差旅、安全工作区基础设施、验证支持，以及共创客户部署所需的基础法务和合规成本。'
- id: A12
  name: Y2-Y3 非薪资运营预算
  value: 按季度看，非薪资 opex 分别为：Q1Y2 $118K、Q2Y2 $132K、Q3Y2 $146K、Q4Y2 $158K、Q1Y3 $172K、Q2Y3 $184K、Q3Y3 $196K、Q4Y3 $212K
  unit: usdK_per_quarter
  source: '[BP milestones; BP operations; research.adoptionFrictionMatrix] 随着集成、基准报表、申办方-QRI 导入和合规支持加上来，支出会逐季抬升；但因为滩头市场本身仍然很窄，整体节奏依旧克制。'
- id: A13
  name: 薪资平滑规则
  value: 季度薪资费用会在各个团队快照点之间平滑上升，而不是只在年末做台阶跳变。
  unit: method
  source: '[financial-modeler instructions] 薪资费用按最近一次招聘计划平滑摊到每个季度，这样 payroll 才能和团队计划对得上。'
- id: A14
  name: 基准销售周期
  value: 从共创客户启动到扩展为年度项目使用，约 6 个月
  unit: months
  source: '[BP experimentRoadmap; BP investorMemo.firstCustomer; research.buyingTriggers] 首个在运部署可以在数周内启动，但更广的付费项目扩张仍需要大约两个季度的证明和买方协同。'
- id: A15
  name: 收入确认规则
  value: 确认收入 = 每个月或每个季度的平均在运项目数 × 混合 ARPU；在运项目爬坡已经扣除了流失。
  unit: method
  source: 面向工作流软件的创业公司财务经验值：按时间均摊确认收入，这样收入就能和在运项目数以及 ARPU 干净对上。
- id: A16
  name: 下行情景变量
  value: $180K ARPU、65% 毛利率、8 个月销售周期，以及 16 个在运项目，到 Q4Y3 为止
  unit: scenario_inputs
  source: '[BP risks; research.sensitivityCases] 下行反映的是 QRI 复用更慢、导入更偏服务化，以及买方把早期开支卡得更死。'
- id: A17
  name: 上行情景变量
  value: $220K ARPU、72% 毛利率、5 个月销售周期，以及 24 个在运项目，到 Q4Y3 为止
  unit: scenario_inputs
  source: '[BP product.twentyFourMonth; BP milestones; research.distributionChannels] 上行假设重复合作的 QRI 复利更快、基准报表更早变现，而且导入更早标准化。'
- id: A18
  name: 现金转换简化假设
  value: 期末现金按 EBITDA 逐期滚动，不单列债务、税项或 capex。
  unit: method
  source: 面向轻资产软件公司的创业公司财务经验值：营运资本波动相对经营烧钱规模较小。
