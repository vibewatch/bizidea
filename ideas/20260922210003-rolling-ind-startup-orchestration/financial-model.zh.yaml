scenarios:
  downside:
    description: QRI 复用来得比计划慢，申办方把早期项目预算卡得更紧，而且导入仍然高度服务化。
    y3RevenueK: 2182.5
    y3EbitdaK: -1059.76
    cashLowPointK: -480.46
    keyAssumptionChanges:
    - 单个项目的混合年价值从 $200K 降到 $180K。
    - 毛利率从 70% 降到 65%。
    - 销售周期从 6 个月拉长到 8 个月。
    - Q4Y3 的在运项目数只有 16 个，而不是 20 个。
  base:
    description: 基准情景做到 20 个在运项目，到 Q4Y3 为止；同时按 BP 和 research 的 $200K 在运项目 ACV 跑，并守住 BP 设定的 70% 毛利率目标。
    y3RevenueK: 3000.0
    y3EbitdaK: -378.38
    cashLowPointK: 449.43
    keyAssumptionChanges:
    - 单个项目的混合年价值维持在 $200K。
    - 毛利率守住 BP 目标的 70%。
    - 在重复合作 QRI 复用的帮助下，销售周期保持在约 6 个月。
    - Q4Y3 在运项目达到 20 个，与 research 里的 SOM 一致。
  upside:
    description: 重复合作的 QRI 复利更快、基准报表更早变现，而且实施更早标准化。
    y3RevenueK: 3850.0
    y3EbitdaK: 293.62
    cashLowPointK: 1005.11
    keyAssumptionChanges:
    - 单个项目的混合年价值从 $200K 提到 $220K。
    - 毛利率从 70% 提升到 72%。
    - 销售周期从 6 个月压缩到 5 个月。
    - Q4Y3 在运项目达到 24 个。
sensitivity:
- variable: ARPU
  downsideCase: $175K 的混合年项目价值
  baseCase: $200K 的混合年项目价值
  upsideCase: $220K 的混合年项目价值
  y3RevenueImpactK: -375.0
  cashImpactK: -262.5
- variable: CAC
  downsideCase: 如果创始人主导且高度服务化的获客状态持续，CAC 会到 $75K
  baseCase: $60K CAC
  upsideCase: 如果重复合作的 QRI 渠道更强，CAC 可降到 $50K
  y3RevenueImpactK: 0.0
  cashImpactK: -300.0
- variable: 流失率
  downsideCase: 7.0% 的月度流失率 / 项目自然结项率
  baseCase: 5.5% 的月度流失率 / 项目自然结项率
  upsideCase: 4.5% 的月度流失率 / 项目自然结项率
  y3RevenueImpactK: -250.0
  cashImpactK: -175.0
- variable: 销售周期
  downsideCase: 8 个月，因为 QRI 采用和申办方审批是前后串行推进的
  baseCase: 6 个月
  upsideCase: 如果证明路径可复制、伙伴模板也成形，销售周期可压到 5 个月
  y3RevenueImpactK: -650.0
  cashImpactK: -520.0
- variable: 毛利率
  downsideCase: 如果导入和验证仍然高度定制，毛利率只有 65%
  baseCase: 70%
  upsideCase: 如果实施更标准化，毛利率可到 72%
  y3RevenueImpactK: 0.0
  cashImpactK: -150.0
- variable: 招聘节奏
  downsideCase: 把一名 GTM 和一名实施招聘岗位都提前两个季度
  baseCase: 按分阶段招聘计划推进
  upsideCase: 把一名非核心岗位推迟到看见重复合作 QRI 拉力后再招
  y3RevenueImpactK: 0.0
  cashImpactK: -210.0
modelDiagram:
  title: 单位经济模型流转
  mermaid: "flowchart LR\n  QRIs[Repeat QRIs and sponsors] --> Programs[Active programs]\n  Programs --> Revenue[Program ACV revenue]\n  Revenue --> GrossProfit[Gross profit at 70%]\n  GrossProfit --> Cash[Cash after payroll and opex]\n"
modelSanity:
- checkName: 收入引擎
  finding: 基准情景里的收入，来自在运项目从 5 个（Y1 期末）一路扩到 "20 by Q4Y3"，并把每个项目维持在约 $200K；核心拉力是重复合作 QRI 的复用，而不是大规模申办方直销。
- checkName: 必须跑顺的条件
  finding: 公司必须足够快地把第一批付费 QRI 部署变成可重复的第二项目成交，才能把销售周期稳在六个月附近。
- checkName: 模型失灵情形
  finding: 如果 QRI 复用慢于预期，而且导入仍然高度定制、把毛利率压向 65%，下行情景会把现金打到负数。
- checkName: 下一轮融资证明点
  finding: 只要公司能证明 8 个在运项目、至少 3 个重复合作伙伴、一次续约或第二项目扩张，以及 20% 的周期改善，下一轮融资故事就成立。
sanityChecks:
  ruleOf40: Y3 增长 96.7% + EBITDA 利润率 -12.6% = 84.1%。
  burnMultiple: Y2 burn multiple 约为 0.7x，对应 $1.0M 的净新增 ARR；Y3 则改善到约 0.2x，对应 $2.0M 的净新增 ARR。
  revenuePerFte: $231K 是 Y3 的人均收入，按年收入和 13 名年末 FTE 计算（SaaS 基准 $200-400K）。
  flags:
  - 模型仍假设公司能守住 70% 毛利率，哪怕 BP 已明确写出前 8-10 次部署会高度服务化。
  - 做到 20 个在运项目这件事，高度依赖重复合作的 QRI 在 Q4Y3 之前按时带来第二和第三个申办方项目；光靠申办方直销很难把这条爬坡线拉出来。
  - 基准情景的期末现金只剩约 $0.45M，因此管理层应该在 Q3Y3 之前就启动 seed 之后的下一轮融资，而不是等到接近盈亏平衡。
