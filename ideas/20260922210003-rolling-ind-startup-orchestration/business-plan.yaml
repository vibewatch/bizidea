slug: rolling-ind-startup-orchestration
date: '2026-09-22'
executiveSummary: >-
  Rolling IND Startup Orchestration sells into a new FDA-defined workflow where
  small biotech sponsors and qualified research institutions can release IND
  components before the full binder is complete. The acute pain is not document
  storage; it is deciding which packet is safe to move now so IRB preparation
  and site activation can start without creating avoidable clinical-hold or
  rework risk. The MVP is an overlay workspace that versions CMC, nonclinical,
  protocol, investigator, and site-readiness packets, logs evidence and
  comments, and triggers downstream tasks once a human-reviewed threshold is
  met. The first customer is a seed-to-Series C biotech running its first U.S.
  phase 1 program with an external CRO, academic center, or regulatory advisor
  acting as QRI, bought by the Head of Regulatory, COO, or Head of Development.
  The plan preserves the core tradeoff from idea.yaml: the first 8 to 10
  pilot-style deployments are a narrow market and will require services-heavy
  onboarding before the workflow becomes repeatable software. Go-to-market
  therefore starts with paid design partners and repeat QRIs, prices per active
  program plus onboarding, and measures success in days to safe-to-proceed,
  first packet release, and first-site-open timing rather than generic
  collaboration usage. The investment case works only if the company proves
  reuse across multiple sponsor programs, overlays current RIM and startup
  systems instead of replacing them, and expands from this wedge into broader
  pre-IND and amendment orchestration once benchmark data compounds.
problem:
  - Early-phase sponsors still coordinate CMC, nonclinical, protocol, IRB, and site-start work through email, spreadsheets, and vendor project trackers, so readiness gaps surface late.
  - FDA's rolling sponsor-QRI model creates a new release-decision problem that current RIM, eTMF, IRB, and site-start tools do not own.
  - Sponsors already pay for CRO and regulatory labor, but downstream IRB and site work still wait for a complete binder instead of credible partial readiness.
solution:
  - Build an overlay workspace where each IND component is a versioned work packet with owners, evidence requirements, dependencies, and release status.
  - Use conservative, human-reviewed readiness thresholds to trigger downstream IRB preparation and site-start tasks before the full IND is complete.
  - Export an auditable history of release decisions and comments into the sponsor's existing systems instead of asking buyers to replace them.
whyWeWin:
  - The product sits at a control point that incumbents only partially cover: the decision of when a partial packet is safe to release across sponsor, QRI, IRB, and site teams.
  - Repeat QRIs and regulatory advisors can reuse packet templates across multiple sponsors, giving the company a more scalable distribution path than sponsor-only direct sales.
  - Benchmark data on packet release timing, comment loops, and downstream activation outcomes can become a moat that services firms and point tools do not have today.
strategicChoices:
  beachhead: >-
    Seed-to-Series C biotech sponsors with one lead asset and an external QRI,
    CRO, or regulatory advisor preparing a first U.S. phase 1 study in the
    next 6 to 12 months.
  wedgeRationale: >-
    This slice has the clearest buying trigger because board deadlines,
    financing milestones, and FDA-pilot-style timelines force the team to prove
    progress before a full IND binder exists. It also creates faster proof than
    broader clinical-ops software because one QRI partner can reuse the same
    packet model across multiple sponsor programs if the first deployment works.
  sequencingRationale: >-
    The company should first win a narrow, services-heavy sponsor-QRI workflow
    and codify the packet taxonomy with human-reviewed release logic before it
    tries to sell standardized software more broadly. That sequencing preserves
    the accepted tradeoff from idea.yaml by treating the first 8 to 10
    pilot-style deployments as design-partner proof, not as evidence that the
    whole market is already repeatable.
  notYet:
    - Full RIM or eTMF replacement
    - Late-phase or multinational study-startup orchestration
    - Generic AI authoring for regulatory narratives
market:
  tam: $42.0M modeled annual TAM from about 210 U.S. sponsor-QRI or sponsor-plus-partner pre-IND and first-in-human programs at about $200k ACV per active program.
  sam: $16.0M modeled annual SAM from about 80 best-fit seed-to-Series C sponsors with an external QRI, CRO, or regulatory advisor and a near-term need to parallelize IRB or site work.
  som: $4.0M modeled year-3 SOM from 20 live programs won through 5 to 7 repeat QRI or regulatory-service partners.
  segments:
    - Venture-backed biotech sponsors preparing a first U.S. phase 1 program with an external QRI or CRO
    - Repeat QRIs, CROs, and regulatory advisors that coordinate multiple sponsor programs
  buyingProcess: >-
    The daily champion is a sponsor regulatory-operations lead or QRI program
    manager, but the economic decision usually sits with the Head of
    Regulatory, COO, or Head of Development. Approval requires proof that the
    overlay cuts days to safe-to-proceed or coordination hours without forcing
    a rip-and-replace of current RIM or startup systems.
product:
  mvp: >-
    A sponsor-QRI overlay workspace with packet taxonomy, evidence checklists,
    dependency graph, comment log, release approvals, and downstream task
    triggers for protocol, CMC summary, investigator package, and
    site-readiness work. The MVP should emphasize auditability and conservative
    human review rather than automation breadth.
  sixMonth: >-
    Ship the first reusable packet library, sponsor-QRI roles, weekly release
    review workflow, and audit export for one live design-partner program.
  twelveMonth: >-
    Add benchmark reporting, reusable QRI templates, one RIM-facing export, and
    one startup-tool integration so the product can support repeat use across
    multiple sponsor programs.
  twentyFourMonth: >-
    Extend the workflow into standard pre-IND programs and key amendment
    workflows, with lower-touch onboarding and cross-program benchmarking as
    the main differentiator.
  keyBets:
    - Repeat QRIs will prefer reusable packet templates over fully bespoke coordination once time-to-first-dose improves.
    - Read-only import plus audit export will satisfy early buyers before deep bidirectional integrations are required.
    - A narrow starter library can cover most early release decisions without modeling the entire IND authoring process.
    - Downstream IRB and site tasks can start from partial packet readiness without unacceptable rework.
gtm:
  wedge: >-
    Sell a paid sponsor-QRI design-partner workspace into one urgent first-U.S.
    phase 1 program, then reuse the packet model across additional sponsor
    programs run by the same QRI, CRO, or regulatory advisor.
  channels:
    - Founder-led direct sales into venture-backed sponsors with a near-term first-U.S.-phase-1 milestone
    - QRI, CRO, and regulatory-advisor partners that can reuse the workflow across sponsors
    - Integration-led referrals from RIM, sponsor-site, and startup-tool vendors
  funnelTargets: workflow audit to paid design partner 30-40%, paid design partner to annual renewal or second program 60%+, repeat QRI to second sponsor program within 9 months 50%+.
  pricing: >-
    Annual subscription per active pre-IND or first-in-human program plus a
    one-time sponsor-QRI onboarding fee. The pricing basis is avoided
    coordination labor and days saved to safe-to-proceed, not document volume
    or seat count.
businessModel:
  revenueStreams:
    - Annual subscription per active sponsor-QRI startup program
    - One-time onboarding and integration fees for each new workspace
    - Benchmark and template subscription for repeat QRIs after reuse is proven
  unitOfValue: Active sponsor-QRI pre-IND or first-in-human program
  targetGrossMarginPct: 70
  expansionLevers:
    - More programs per repeat QRI partner
    - Benchmark reporting sold at the QRI or sponsor-portfolio level
    - Expansion from pilot-style workflows into standard pre-IND and amendment orchestration
strategyMap:
  northStarMetric: Days from startup kickoff to first validated packet release that unlocks downstream IRB or site work
  inputMetrics:
    - Time from kickoff to first releasable packet
    - Percentage of downstream tasks launched from partial readiness without rollback
    - Median onboarding time per new sponsor-QRI workspace
    - Paid pilot conversion to second program or annual renewal
    - Number of repeat QRI partners running more than one sponsor program
  moatsToBuild:
    - Reusable packet-readiness rules by packet type and study context
    - Benchmark dataset on comment loops, release timing, and first-site-open outcomes across QRIs
    - Cross-system audit trail that proves the overlay can coexist with incumbent systems
  killCriteria:
    - Fewer than 2 repeat QRIs sign paid reuse commitments within 12 months
    - Median paid deployment fails to reduce days to first releasable packet by at least 20% versus the manual baseline
    - Early customers require system-of-record replacement or more than 8 weeks of implementation per program
  mermaid: |
    flowchart LR
      Wedge[Sponsor-QRI beachhead] --> MVP[Packet release workspace]
      MVP --> Proof[Cycle-time and rework proof]
      Proof --> Expansion[Repeat QRI programs and broader pre-IND workflows]
investorMemo:
  verdict:
    call: "Meet / investigate further"
    conviction: Interesting wedge with a real catalyst, but conviction stays low until at least one QRI proves repeatable cross-sponsor reuse.
    whyBelieve: FDA has defined a new rolling sponsor-QRI workflow that current RIM, IRB, and site-start tools only partially cover, creating a measurable control point with budgeted urgency.
    whyDoubt: The initial buyer pool is small and the product can collapse into services if sponsors or QRIs keep coordinating manually.
    nextDiligence: Underwrite one paid design partner and one repeat-QRI pipeline to test whether the same packet model can close a second sponsor program with measurable cycle-time improvement.
  firstCustomer:
    title: Head of Regulatory at a first-U.S.-phase-1 biotech sponsor
    profile: A 6 to 20 person development team with one lead asset, an external CRO or regulatory advisor serving as QRI, and a board-visible timeline to reach first-in-human.
    trigger: A financing milestone, pilot application, or board deadline that forces the team to parallelize IND readiness, IRB prep, and site startup.
    buyer: Head of Regulatory, COO, or Head of Development
    initialContract: $75k-$100k onboarding plus $120k-$200k annual per active program, converting to a multi-program or QRI-level agreement after first packet-release and site-open proof.
  mustBeTrue:
    - At least 3 QRIs or regulatory advisors agree that a shared packet model is better than bespoke billable coordination for repeat sponsor work.
    - Paid deployments cut days to first releasable packet or first-site-open readiness by at least 20% versus each customer's baseline.
    - More than half of paid design partners expand to a second program or annual renewal within 12 months.
    - Buyers accept an overlay architecture with audit export instead of demanding a full system-of-record replacement.
    - Adjacent incumbents do not ship enough packet-release governance and benchmark data to erase the wedge before network effects start.
  diligenceQuestions:
    - Which packet families can safely unlock IRB or site work before full IND completeness?
    - Will QRI practice leads fund reusable software, or protect billable manual coordination?
    - What minimum Veeva, Florence, Advarra, or Oracle integration is contractually required in live accounts?
    - How much cycle-time reduction is necessary for sponsor boards to treat the product as milestone-critical spend?
    - Can repeat-QRI channels expand beyond the official 8 to 10 pilot pairs within 12 to 18 months?
operatingAssumptions:
  - assumption: Repeat QRIs will prefer a reusable packet workflow over fully bespoke billable coordination once it shortens sponsor startup time.
    basis: research.yaml
    validationTest: Secure 2 paid QRI design partners and observe at least one reuse across a second sponsor program.
    decisionImpact: If false, the company remains sponsor-direct or services-heavy and the gross-margin story weakens.
  - assumption: Sponsors will pay if the product reduces days to first releasable packet or days to site-readiness by at least 20% versus their manual baseline.
    basis: research.yaml
    validationTest: Baseline two live programs, instrument the workflow, and compare cycle time before renewal.
    decisionImpact: If false, pricing must fall toward services enablement or the wedge should be abandoned.
  - assumption: An overlay with audit export and limited write-back is enough for the first six customers.
    basis: operator judgment
    validationTest: Scope one Veeva environment and one startup-tool stack, then confirm MVP deployment in 6 weeks or less without deep system replacement.
    decisionImpact: If false, the company must hire integrations earlier and raise a larger round.
  - assumption: A starter library covering protocol, CMC summary, investigator package, and site-readiness packets captures most early time savings.
    basis: idea.yaml
    validationTest: Map one sponsor-QRI workflow and confirm these packet families account for more than 70% of early downstream activation decisions.
    decisionImpact: If false, MVP scope broadens and implementation time increases.
  - assumption: The FDA pilot will catalyze copycat sponsor-QRI workflows beyond the initial official cohort within 12 to 18 months.
    basis: research.yaml
    validationTest: Track 20 target accounts and close at least 3 non-cohort programs using the same packet model.
    decisionImpact: If false, the company must expand into broader standard pre-IND orchestration sooner to justify venture scale.
experimentRoadmap:
  - horizon: 0-90 days
    experiment: Shadow one sponsor-QRI startup workflow and codify the first packet taxonomy.
    hypothesis: A shared packet model can capture the top readiness decisions that block IRB and site work.
    successMetric: One signed design partner and a validated packet map that covers more than 80% of early release decisions.
    owner: Founder/CEO
  - horizon: 0-90 days
    experiment: Run willingness-to-pay tests with repeat QRIs, CROs, and regulatory advisors.
    hypothesis: QRI practice leads will fund reusable software if it improves throughput across sponsors.
    successMetric: Two LOIs or paid pilots from QRI-side partners.
    owner: Founder/CEO
  - horizon: 90-180 days
    experiment: Launch the MVP overlay on the first live sponsor program.
    hypothesis: Human-reviewed thresholds are sufficient to release partial packets without material downstream rollback.
    successMetric: Less than 10% of released packets require rollback and first packet release happens at least 20% faster than baseline.
    owner: Regulatory workflow lead
  - horizon: 90-180 days
    experiment: Prove an integration-light deployment model.
    hypothesis: Read-only import plus audit export satisfies early sponsor compliance and implementation needs.
    successMetric: First deployment goes live in 6 weeks or less without a blocked deep-write integration.
    owner: Founding eng
  - horizon: 180-360 days
    experiment: Reuse the same packet model on a second sponsor served by the same QRI.
    hypothesis: Template reuse reduces onboarding time and improves deployment margin.
    successMetric: Second program goes live in 3 weeks or less and onboarding effort drops by at least 30%.
    owner: Implementation lead
  - horizon: 180-360 days
    experiment: Sell benchmark reporting as part of renewal.
    hypothesis: Benchmark data is valuable enough to convert pilots into annual contracts and multi-program expansion.
    successMetric: At least 60% of paid pilots renew or expand to a second program.
    owner: Founder/CEO
operations:
  - Sponsor-QRI kickoff and packet-taxonomy workshop before each deployment
  - Weekly release-review cadence with evidence checklist, approval log, and escalation path
  - Audit-trail export into sponsor RIM, eTMF, and startup systems already in place
  - QRI benchmark review based on release timing, comment loops, and first-site-open outcomes
team:
  - role: Founder/CEO
    startTiming: Month 0
    rationale: Own founder-led sales, packet-taxonomy discovery, and investor-level proof on cycle-time improvement.
  - role: Founding eng
    startTiming: Month 0
    rationale: Build the packet graph, permissions, audit trail, and first integration-light deployment path.
  - role: Regulatory workflow lead
    startTiming: Month 2
    rationale: Translate sponsor-QRI practice into reusable readiness rules and guard against unsafe release logic.
  - role: Implementation lead
    startTiming: Month 6
    rationale: Absorb the services-heavy onboarding load and turn early playbooks into a repeatable motion.
  - role: Integrations engineer
    startTiming: Month 9
    rationale: Add the minimum write-back and connector surface once the first two paid accounts validate the overlay model.
milestones:
  - horizon: 0-12 months
    items:
      - Close 2 sponsor design partners and 2 repeat-QRI partners
      - Ship the packet graph, evidence checklist, release approvals, and audit export on one live program
      - Demonstrate at least 20% faster time to first releasable packet versus a manual baseline
      - Convert the first deployment into an annual renewal or second-program expansion
  - horizon: 12-24 months
    items:
      - Standardize 3 to 4 reusable packet-template packs by study type or workflow
      - Reach 5 to 7 repeat QRIs or regulatory-service partners and 10 active programs
      - Add benchmark dashboards and two production integrations
      - Reduce onboarding time from 6 to 8 weeks to 3 weeks or less
  - horizon: 24-36 months
    items:
      - Expand from pilot-style workflows into standard pre-IND and amendment orchestration
      - Reach 20 live programs and multi-program agreements with top QRI partners
      - Use benchmark data as the primary differentiator in competitive deals
      - Hold target gross margin above 70% on standardized deployments
risks:
  - risk: Official-pilot demand stays too narrow and copycat adoption outside the cohort arrives slowly.
    likelihood: Medium
    impact: High
    mitigation: Sell through repeat QRIs and expand into broader standard pre-IND orchestration as soon as the first workflow is proven.
  - risk: Sponsors and QRIs keep paying for manual coordination instead of adopting reusable software.
    likelihood: High
    impact: High
    mitigation: Require paid design partners, price against measurable cycle-time savings, and prove second-program reuse quickly.
  - risk: Integration and compliance demands stretch onboarding beyond the value of the wedge.
    likelihood: Medium
    impact: High
    mitigation: Stay overlay-first, ship audit export before deep write-back, and narrow the first supported system combinations.
  - risk: Adjacent incumbents add enough packet gating and milestone visibility to compress differentiation.
    likelihood: Medium
    impact: Medium
    mitigation: Build a benchmark dataset and QRI network effects that are harder to copy than workflow screens.
  - risk: Incorrect readiness thresholds create downstream rework or credibility loss.
    likelihood: Medium
    impact: High
    mitigation: Keep human approval in the loop, start with a narrow packet library, and log every release decision against evidence.
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: $2-4M
  runwayMonths: 18
  useOfFundsSummary: 18 months of runway should fund the core product, regulatory-workflow expertise, and high-touch implementation required to prove 3 to 5 paid programs, 2 repeat-QRI channels, and a measurable cycle-time improvement before broad expansion.
