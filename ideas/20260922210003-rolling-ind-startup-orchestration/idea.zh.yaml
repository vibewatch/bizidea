  - 面向 IND、IRB 和研究中心启动交付物的模板库
  - 关于缺陷、评论和周期的基准数据
  keyActivities:
  - 把申办方和 QRI 团队接入共享工作区
  - 配置工作包模板、证据规则和依赖阈值
  - 沉淀审阅历史并比较启动时间线
  keyPartners:
  - 担任 QRI 的 CRO、学术医学中心和法规顾问
  - eTMF、RIM 和文档管理厂商
  - 早期临床法规顾问
  costStructure:
  - 临床法规实施人员
  - 产品与集成工程
