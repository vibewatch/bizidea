  - FDA 试点申请人网络和早期临床生物科技社群
  - 现有文档系统与 RIM 集成伙伴
  customerRelationships:
  - 首个申办方-QRI 项目采用高触达实施
  - 给重复研究场景复用工作包模板
  - 为活跃客户提供基准评估和最佳实践复盘
  revenueStreams:
  - 按每个活跃的 pre-IND 或首次人体项目收订阅费
  - 工作区导入和集成费
