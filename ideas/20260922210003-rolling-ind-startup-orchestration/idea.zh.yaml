jobsToBeDone:
- job: 当一家小型生物科技公司正和外部 QRI 一起准备美国 1 期研究时，帮法规负责人判断哪份 IND 工作包现在就能往前推，好在不平白增加 hold 风险的前提下，把首次给药时间缩短。
  currentAlternative: CRO 跟踪表、电子表格和顾问项目更新
  successMetric: 从 pre-IND 启动到第一份工作包放行的天数，以及首个研究中心启动所需时间
- job: 当临床运营想在整份申报包完成前就启动 IRB 和研究中心时，帮团队只放行那些证据真的齐了的内容，让下游伙伴不用继续等整份 binder。
  currentAlternative: 邮件附件、共享盘和手工就绪度会议
  successMetric: 基于局部工作包就绪度拉起的下游任务比例，以及其中无需返工的占比
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: 把 pre-IND 启动做成一张跨申办方、QRI、IRB 和研究中心的可放行工作包图，比泛泛的法规写作或试验运营软件具体得多。
  venturePotential:
    score: 4
    rationale: 这个品类可以往早期临床启动和外包法规执行一路外扩，但第一刀商业切口仍受小规模试点和重咨询式推进节奏约束。
  whiteSpace:
    score: 5
    rationale: 现有厂商的 RIM、eTMF 和 CRO PM 工具都不管整份 IND 出来前的跨方滚动工作包放行，所以这条刚被标准化的新工作流还空着。
  painIntensity:
    score: 4
    rationale: 首次人体启动一旦拖慢，精简型生物科技团队的融资时间线、试验地区选择和 clinical hold 暴露都会直接受伤。
  wedgeClarity:
    score: 4
    rationale: 第一条工作流围绕试点式 sponsor-QRI 项目已经足够清楚，哪怕拿下早期账户仍得配一些实施服务。
  evidenceFit:
    score: 5
    rationale: 一份 FDA 一手公告加四个独立来源，都在说同一条工作流变化：滚动审评、QRI 协同和研究中心启动被绑在一起。
topRisks:
- name: 试点队列过于集中
  description: 第一波商业需求可能只集中在极少数申办方-QRI 组合里。
  mitigation: 不只卖给官方试点参与者，也卖给想照着同样流程复制的 QRI 和非试点申办方。
- name: 采用过程过于服务化
  description: 早期客户也许还是更愿意让法规顾问和 CRO 用人工方式把流程跑完。
  mitigation: 把软件和实施模板打包卖，并用工作包放行时间和研究中心启动基准把价值打实。
- name: 现有厂商的工作流延展
  description: 一旦这条工作流被验证，RIM、eTMF 或 CRO 厂商可能很快补上一层轻量的启动任务管理。
  mitigation: 先把跨组织工作包图谱和基准数据攥住——这两样东西，点工具和单厂商门户都没法很快抄走。
