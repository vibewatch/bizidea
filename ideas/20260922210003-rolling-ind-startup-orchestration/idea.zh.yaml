problem: 小型生物科技申办方今天做早期临床启动，还是把法规撰写、CRO、IRB 和研究中心串成一条顺序交接链，所以 CMC、方案或运营细节一旦有缺口，往往到很后面才暴露。FDA 这次试点把任务改写成一条滚动式的申办方-QRI 协同流程：整份 IND 还没拼完，部分组件就可以先动。现有 RIM、eTMF 和顾问用的跟踪表更像文档仓或服务表格，不是给可放行工作包管依赖的系统，这就让临床搁置风险和启动拖延继续居高不下。
targetUser:
  primary: 风投支持的生物科技公司里，负责监管运营或早期临床开发的人；他们正和 QRI 伙伴一起准备美国 1 期研究
  secondary: 在 CRO、学术医学中心或法规咨询机构内部，替多个申办方担任合格研究机构的项目负责人
  buyer: 想把首次人体时间线压短的小型生物科技公司的 COO、开发负责人或法规负责人
startupThesis:
  nonObviousInsight: 真正的新瓶颈不是把 IND 叙事写得更漂亮，而是整份申报还没齐时，怎么判断哪一份局部工作包已经够格，可以在申办方、QRI、IRB 和研究中心之间先放行。
  beachhead: 只有一条主资产、内部法规运营人手有限、近期要在美国推进首次人体项目的 seed 到 Series C 生物科技申办方；无论是要申请 FDA 试点，还是照着 sponsor-QRI 模式自己跑，都在这个切口里。
  wedge: 一套申办方-QRI 工作区：按模块给 IND 工作包做版本管理，记录就绪证据和审阅评论；一旦工作包跨过设定阈值，就自动拉起后续 IRB 或研究中心启动任务。
  whyNowCatalyst: FDA 正在受理一个加速试点申请，这个试点把滚动 pre-IND 审评正式制度化，并且明确把它和申办方-QRI 协同、IRB 审查、研究中心启动绑在一起。
  ventureScalePath: 先从美国 1 期启动里的试点式 sponsor-QRI 项目切进去，再往标准 pre-IND 和 CTA 准备、跨项目 QRI 基准、修订流程，以及 CRO 与顾问主导的外包法规执行操作层一路外扩。
solution: Rolling IND Work Packets 是一套给申办方和 QRI 团队共用的跨组织工作区，不只是某个内部职能的工具。每份 CMC、非临床、方案、研究者和研究中心就绪材料，都会变成一个带版本、带负责人、带依赖、带必需证据和放行状态的工作包。工作包一旦就绪，系统就能把依赖它的 IRB 或研究中心启动任务精确拉起来，不用再等整份 binder 凑齐。产品还会留下完整可审计的历史：放行了什么、收到了哪些评论、哪些下游任务因此安全解锁；同时它是叠加在申办方现有文档系统之上，而不是逼客户把旧系统整套替掉。
goToMarketSeed:
  firstCustomer: 总部在美国或欧洲、只有一条主资产、开发团队 6 到 20 人，并由外部 CRO 或法规顾问担任 QRI 的风投型生物科技公司；它们正准备美国 1 期项目。
  buyingTrigger: 融资里程碑、董事会截止节点，或者 FDA 试点申请，把公司逼到必须在不大幅扩充内部法规项目管理团队的情况下，把首次人体启动时间压下来。
  currentAlternative: 电子表格、邮件、SharePoint、CRO 项目跟踪表、顾问型项目经理，以及通用 RIM 或 eTMF 工具
  switchingReason: 这款产品给申办方一套共享的逐工作包依赖模型，把申办方、QRI、IRB 和研究中心团队拉到同一张图上——通用系统和人工协同都给不了这一层。
  pricingHypothesis: 按每个活跃的 pre-IND 或首次人体项目收年费，再对每个申办方-QRI 工作区收导入费。
whyNow:
- point: FDA 开了一个有名字的加速 IND 试点，申请截止到 2026-10-30，这让申办方和 QRI 当下就有了找共创客户的紧迫感。
  signalRefs:
  - 滚动式 pre-IND 审评已经正式落地
  sourceRefs:
  - 1
- point: 滚动审评把启动工作从一次性递交流程，改成了持续的工作包放行工作流，所以必须有新工具来接。
  signalRefs:
  - 滚动式 pre-IND 审评已经正式落地
  sourceRefs:
  - 1
  - 4
- point: 美国首次人体速度正在被直接拿去和中国、澳大利亚比较，时间压缩对早期生物科技公司第一次变成了战略问题。
  signalRefs:
  - 美国 1 期速度已成竞争力问题
  sourceRefs:
  - 2
  - 3
  - 5
- point: IRB 审查和研究中心启动被明确拉进同一轮提速闭环，所以法规团队和临床运营团队需要共享同一张依赖图。
  signalRefs:
  - IRB 与研究中心启动被拉进同一条链路
  sourceRefs:
  - 5
differentiator: 现有 RIM 和 eTMF 系统管的是文档，CRO 跟踪表管的是单一供应商内部任务。这个概念把每个局部 IND 组件都变成可放行的工作包，能在跨组织边界上安全撬动后续 IRB 和研究中心工作。真正能守住的资产，是那张工作包图谱，以及哪些 QRI、哪些工作包类型、哪些依赖模式能更快把首次人体项目推起来、同时更少触发临床搁置的基准数据。
conceptDiagram:
  title: 从滚动审评到首次给药
  mermaid: "flowchart LR\n  Sponsor --> Packets\n  QRI --> Packets\n  Packets --> FDA\n  Packets --> IRB\n  Packets --> Sites\n  Sites --> FirstDose[First dose]\n"
businessModelCanvas:
  customerSegments:
  - 准备美国 1 期研究的风投型生物科技申办方
  - 担任 QRI 的 CRO、学术医学中心和法规顾问
  - 横跨法规、CMC 和临床运营的申办方团队
  valuePropositions:
  - 把滚动 pre-IND 审评从邮件加表格，改成一条有依赖管理的工作流
  - 在正式递交前先暴露缺失的工作包证据，更早看见临床搁置风险
  - 在部分就绪已核实的前提下先启动 IRB 和研究中心工作，不再等完整资料包
  channels:
