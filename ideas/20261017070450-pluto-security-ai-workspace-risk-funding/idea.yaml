slug: shadow-data-rehearsal
date: '2026-10-17'
sector: ai-infra
pitch: Let employee-built AI apps rehearse on production-shaped synthetic records, then graduate only tested workflows to scoped live data.
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: >-
    It makes an employee-built AI app prove its real workflow against a private synthetic twin before receiving narrowly
    scoped live records, a more distinctive intervention than finding exposure after deployment.
  acceptedTradeoff: >-
    Realistic synthetic twins are difficult to build and may miss unusual production behavior, so the first deployments
    will require data-source mapping and app-specific test design.
originalityAudit:
  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
  rejectedCliches:
    - generic AI assistant that advises employees about safe tool use
    - dashboard plus alerts that only inventories agents and connectors
    - broad AI-security platform that tries to replace existing endpoint and identity controls
    - vetted-agent marketplace whose value depends on catalog breadth rather than safer data access
  rareMechanism: >-
    A synthetic, schema-faithful rehearsal tenant records which data fields an employee-built app actually needs for
    approved tasks, then turns those observed paths into a restricted production access manifest.
  nearestHistoricalIdeas:
    - slug: crm-resume-packet-compiler
      similarity: mechanism
      decisiveDifference: >-
        Both make application behavior legible before consequential work resumes, but that idea reconstructs safe
        Salesforce recovery after outages while this one tests a new app against synthetic data before first production
        access.
    - slug: physics-change-test-gate
      similarity: mechanism
      decisiveDifference: >-
        Both use a test gate before release, but the historical concept replays thermal cases against hardware geometry
        changes while this one rehearses AI-app data paths and derives scoped permissions.
    - slug: clinical-replay-change-gates
      similarity: job
      decisiveDifference: >-
        Both produce evidence before a software release, but the historical concept validates medical-device model
        updates on a locked clinical cohort while this one protects enterprise customer records during internal app
        prototyping.
