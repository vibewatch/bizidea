  customerSegments:
    - Enterprise security teams approving employee-built AI apps that need access to sensitive business data
    - Finance and operations teams prototyping internal AI workflows
  valuePropositions:
    - Test real app tasks against synthetic records before granting production access
    - Convert observed data needs into a reviewable, limited access manifest
  channels:
    - Direct CISO and security-engineering sales triggered by internal app reviews
    - Security and data-platform implementation partners
  customerRelationships:
    - High-touch onboarding for initial source and app mapping
    - Recurring policy and rehearsal support for each active application
  revenueStreams:
    - Annual subscription per active app workflow
    - One-time source-system onboarding and configuration fees
  keyResources:
    - Synthetic data generation and schema-mapping methods
    - Secure staging and task-replay software
    - Enterprise connectors and permission-manifest templates
  keyActivities:
    - Map approved app tasks to source schemas and synthetic records
    - Replay workflows and derive least-scope access proposals
    - Maintain source connectors, policy templates, and audit evidence
  keyPartners:
    - Enterprise identity, CRM, SaaS, and warehouse vendors
    - Security integrators supporting internal AI app reviews
  costStructure:
    - Connector development and secure tenant operations
    - Data-model mapping and customer onboarding labor
    - Security assurance, sales, and ongoing support
jobsToBeDone:
  - job: >-
      When a finance employee submits an internal AI app for review, help a security engineer determine which customer
      data it needs, so they can approve a useful workflow without granting broad production access.
    currentAlternative: Ad hoc sandbox datasets followed by manual permissions and spreadsheet review
    successMetric: Share of reviewed app workflows that pass rehearsal with a limited, approved data scope
  - job: >-
      When an employee prototype uses a CRM or warehouse connector, help the app owner test representative tasks on
      synthetic records, so they can find data and logic gaps before asking for live credentials.
    currentAlternative: Testing against sample exports or directly against a development copy of production data
    successMetric: Time from first security review to a reproducible approved task replay
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      The concept treats production-shaped synthetic data as a pre-access rehearsal environment that derives a
      workflow-specific permission manifest, rather than as a standalone test-data product or risk dashboard.
  venturePotential:
    score: 4
    rationale: >-
      The beachhead can expand across internal AI apps and enterprise data sources, but the cluster establishes an urgent
      security signal rather than repeatable buyer budgets for this specific product.
  whiteSpace:
    score: 4
    rationale: >-
      The complete history index contains no employee-AI security rehearsal product, though the cluster's incumbent
      gravity and broader security entrants make an uncontested market claim unwarranted.
  painIntensity:
    score: 4
    rationale: >-
      The selected cluster reports an exposed employee-built app containing customer and churn data and malicious
      components or active attacks in proof-of-concept deployments.
  wedgeClarity:
    score: 4
    rationale: >-
      One finance-built app, one CRM or warehouse source, and a pre-access rehearsal provide a concrete first workflow,
      while realistic synthetic-data setup remains technically demanding.
  evidenceFit:
    score: 4
    rationale: >-
      Independent reporting supports the risk mechanism and employee-built app example, while the cluster does not
      provide direct evidence that buyers want synthetic rehearsal or will pay for it.
topRisks:
  - name: Synthetic data misses real behavior
    description: >-
      A synthetic twin may fail to reproduce rare record relationships or edge cases and give security false
      confidence about the app's production behavior.
    mitigation: >-
      Start with customer-approved task cases and keep live access blocked unless test coverage and data behavior meet
      explicit review thresholds.
  - name: App behavior is not fully observable
    description: >-
      Unsupported connectors or unmediated tool calls could bypass the rehearsal and make the generated access scope
      incomplete.
    mitigation: >-
      Limit the first release to instrumented connectors and refuse to issue a production manifest when any relevant
      data path cannot be observed.
  - name: Onboarding overwhelms software margins
    description: >-
      Source schemas, permissions, and app conventions vary by customer, making early synthetic-tenant setup expensive
      and slow.
    mitigation: >-
      Narrow the initial supported workflow to a small set of CRM and warehouse patterns and turn repeated mappings
      into reusable configuration templates.
