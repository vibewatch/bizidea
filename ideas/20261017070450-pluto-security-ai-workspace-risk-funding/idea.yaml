      TechCrunch reports that Pluto encountered malicious components or active attacks during proof-of-concept
      deployments, suggesting that pre-production review can uncover issues before broad adoption.
    signalRefs:
      - Proof-of-concept deployments surfaced malicious components
    sourceRefs:
      - 2
  - point: >-
      Pluto announced $42 million in total funding and says it protects more than 1.5 million endpoints, a company-
      reported signal that dedicated enterprise AI security products are attracting investment and deployment.
    signalRefs:
      - Enterprise AI security has a funded entrant
    sourceRefs:
      - 1
  - point: >-
      SiliconANGLE describes agent mapping across employee endpoints, cloud infrastructure, and SaaS, alongside policy
      controls that can pause or redirect risky workflows, showing the breadth of environments security teams must
      consider.
    signalRefs:
      - Security scope spans employee, cloud, and SaaS environments
    sourceRefs:
      - 3
differentiator: >-
  Existing inventory and runtime controls help security teams discover or constrain AI tools, but this concept gives
  each employee-built app a safe rehearsal route before first production access. Its core output is not another risk
  dashboard: it is a task-tested, field-scoped access manifest derived from behavior against synthetic records. The
  service-led onboarding accepts data mapping work up front to make that release gate usable for non-developer-built
  apps.
conceptDiagram:
  title: Rehearse before live access
  mermaid: |
    flowchart LR
      Employee["Employee-built AI app"] --> Twin["Synthetic data twin"]
      Security["Security reviewer"] --> Replay["Task rehearsal"]
      Twin --> Replay
      Replay --> Manifest["Tested access manifest"]
      Manifest --> Live["Scoped live data access"]
