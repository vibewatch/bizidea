openQuestions:
  - "What fraction of 500-plus employee firms have enough employee-built, data-connected AI apps to justify a dedicated purchase?"
  - "Can observed synthetic task paths predict production permissions with low false-grant rates across custom connectors?"
  - "How much setup labor is required per CRM or warehouse schema, and how much can be reused?"
  - "What buyer-controlled boundary, data residency, and retention guarantees are required for a pilot?"
  - "Can the workflow produce measurable savings versus Microsoft-native controls, AI security suites, or a manual review?"
market:
  tam:
    value: "$263.0M"
    rationale: >-
      Bottom-up scenario, not a reported category market: the 2022 U.S. Census SUSB large-employment table contains
      21,041 employer firms with 500 or more employees, calculated by summing the nine 500-plus size bands. Assume
      25% have an employee-built AI workflow requiring access to sensitive business data, or 5,260 potential buyers,
      and use a $50,000 annual account-value assumption. 5,260 x $50,000 = $263.0M. Both the 25% fit rate and account
      value are operator assumptions.
    isEstimate: true
    sourceRefs:
      - 2
  sam:
    value: "$159.6M"
    rationale: >-
      Beachhead scenario: the same Census table has 10,641 firms with at least 1,000 employees, summed from the
      1,000-1,499 through 20,000-plus bands. Assume 30% of those firms have finance/customer-data prototypes under
      formal security review, or 3,192 buyers, then multiply by the same $50,000 account-value assumption.
      3,192 x $50,000 = $159.6M. The 30% eligibility assumption is unverified.
    isEstimate: true
    sourceRefs:
      - 2
  som:
    value: "$4.8M"
    rationale: >-
      Five-year reachability scenario, not a forecast: capture 3% of the 3,192 assumed SAM buyers, about 96 active
      accounts, at the $50,000 annual account-value assumption. 96 x $50,000 = $4.8M annualized revenue. This
      requires repeatable connector onboarding and is not supported by customer conversion data.
    isEstimate: true
    sourceRefs:
      - 1
      - 2
