  - driver: "U.S. employer firms with 500-plus employees"
    value: "21,041 firms, sum of 500-749 through 20,000-plus employment bands"
    source: "[2]"
  - driver: "TAM-relevant workflow share"
    value: "25%, operator assumption for firms with employee-built AI apps requiring sensitive data"
    source: "est."
  - driver: "TAM account-value input"
