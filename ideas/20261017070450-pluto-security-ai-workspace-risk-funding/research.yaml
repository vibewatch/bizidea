competitors:
  - name: "Pluto Security"
    stage: "Seed and Series A announced in October 2026; more than $42M total reported"
    wedge: >-
      Discovers employee AI tools and agents, provides risk context and visibility, and enables policy controls across
      enterprise environments.
    pricing: "No public price found in the fetched sources."
    strength: >-
      Reports more than 30 enterprise customers and over $2M ARR shortly after beginning sales; addresses non-developer
      tools directly.
    weaknessVsUs: >-
      Public reporting emphasizes discovery, risk analysis, visibility, and control; it does not document this exact
      synthetic task replay and generated field-manifest workflow. Treat this as an evidence gap, not a proven feature
      absence.
    sourceRefs:
      - 1
  - name: "Zenity"
    stage: "Commercial AI-agent security platform; financing stage not verified in fetched materials"
    wedge: >-
      Live agent inventory, pre-live posture and permission assessment, exposure testing, action-time enforcement, and
      runtime protection.
    pricing: "No public price found in the fetched sources."
    strength: >-
      The closest documented pre-production competitor because its own product page says it assesses permissions
      before go-live and tests exploitable attack paths.
    weaknessVsUs: >-
      The reviewed product description does not state that it uses synthetic source twins to turn successful task
      traces into row- or field-level production permissions.
    sourceRefs:
      - 18
  - name: "AIR Security"
    stage: "Emerging vendor; TechCrunch reported $50M raised across two seed rounds in September 2026"
    wedge: >-
      Agent discovery and continuous vetting of skills, tools, MCP servers, and other components, with blocking and a
      vetted add-on marketplace.
    pricing: "No public price found in the fetched source."
    strength: >-
      Targets the fast-forming agent supply chain and is well funded for an early entrant.
    weaknessVsUs: >-
      The reported focus is component and add-on safety rather than app-specific data rehearsal or least-scope
      customer-record access.
    sourceRefs:
      - 19
  - name: "Microsoft Power Platform native governance"
    stage: "Incumbent platform capability and substitute"
    wedge: >-
      Tenant and environment governance, inventory, identity/access features, and data-loss-prevention rules for
      Power Apps and Power Automate.
    pricing: "Standalone control price not disclosed in fetched product documentation."
    strength: >-
      Existing customers can use platform-native controls and environment policies without adopting a separate
      AI-security vendor.
    weaknessVsUs: >-
      The documented controls are tied to the Power Platform ecosystem and do not describe a cross-vendor synthetic
      task replay that produces a field-specific access proposal.
    sourceRefs:
      - 6
      - 7
      - 8
  - name: "Tonic.ai and Google Cloud/Gretel"
    stage: "Commercial synthetic-data products and integrations"
    wedge: >-
      Structured and semi-structured data synthesis, data de-identification, synthetic datasets, and mock-data
      workflows for software development and AI.
    pricing: "No directly comparable public price found in the fetched product pages."
    strength: >-
      They make schema-aware synthetic test data a buildable component rather than a proprietary invention the
      startup must create alone.
    weaknessVsUs: >-
      Their reviewed product pages focus on data generation and test-data workflows, not app-security approval,
      observed task coverage, or production access manifests.
    sourceRefs:
