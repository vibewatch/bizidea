championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: >-
        In the reviewed product pages, the proposed sequence of task rehearsal on a schema-shaped synthetic tenant
        followed by a field-scoped production manifest is not explicitly described as one product workflow.
      sourceRefs:
        - 1
        - 14
        - 15
        - 16
        - 18
    - point: >-
        The idea connects synthetic test records to least-privilege decisions grounded in actual task behavior, rather
        than treating synthetic data generation or AI discovery as the final output.
      sourceRefs:
        - 9
        - 14
        - 16
  evidenceAgainst:
    - point: >-
        Synthetic data generation and schema-aware test-data products already exist, while major cloud and data
        platforms offer synthetic-data workflows; novelty therefore lies in orchestration and authorization, not the
        data-generation primitive.
      sourceRefs:
        - 14
        - 15
        - 16
    - point: >-
        Zenity already markets pre-live configuration and permission assessment, exploitability testing, and runtime
        enforcement, making the claimed before-production distinction narrower than the pitch implies.
      sourceRefs:
        - 18
    - point: >-
        Microsoft Power Platform provides native environment governance, connector DLP, inventory, and access
        controls for applications built in its ecosystem; those controls can satisfy some of the same buyer need.
      sourceRefs:
        - 6
        - 7
        - 8
    - point: >-
        Pluto and AIR demonstrate funded entrants for AI-workspace visibility and agent-component security, so an
        incumbent or well-funded adjacent vendor could extend into rehearsal if buyers validate it.
      sourceRefs:
        - 1
        - 19
  revisedClaim: >-
    The creative wedge is a potentially distinctive release-gate workflow that converts observed, task-specific reads
    against privacy-preserving test records into a reviewable production permission proposal. The underlying
    ingredients are established and competitors already cover adjacent pre-live controls; differentiation depends
    on high-fidelity task coverage, non-bypassable access tracing, and a useful manifest that buyers cannot get from
    their existing platform or security stack.
reportMemo:
  executiveTakeaways:
    - >-
      The pain is current: independent reporting and an industry research note describe unauthorized AI use, while
      Pluto reports that non-developer-built tools account for a large share of risks it finds.
    - >-
      Adjacent security spend is demonstrable, but exact buyer budget for synthetic rehearsals is not: Pluto reported
      more than $2M ARR and 30-plus enterprise customers, whereas the product concept itself has no paid-pilot or
      willingness-to-pay evidence.
    - >-
      The rare mechanism is the observed task-to-field permission manifest, not synthetic data generation, pre-live
      testing, AI discovery, or least privilege in isolation.
    - >-
      U.S. bottom-up sizing yields an assumption-led $263M TAM, $159.6M SAM, and $4.8M five-year SOM scenario; these
      are not analyst forecasts and depend heavily on buyer-fit and annual-value assumptions.
    - >-
      Synthetic-data fidelity, incomplete connector observability, native Microsoft controls, and regulated-vendor
      procurement are the primary adoption blockers.
  marketDefinition: >-
    This is a pre-production enterprise data-access assurance workflow for employee-built AI applications that must
    query customer or finance records. It is narrower than the broad AI-security market: the buyer pays for a
    reproducible task test and a least-scope access proposal before the application receives production credentials.
    The relevant budget owner is usually security engineering or the CISO, with data-platform and finance application
    owners as gatekeepers. The market values below are constructed from U.S. firm counts and explicit assumptions.
  customerAndBuyer: >-
    The first user is a security engineer reviewing a finance or operations prototype; the app builder and CRM,
    warehouse, or identity administrator supply task definitions, schemas, and connector access. The economic buyer
    is the CISO or VP of security engineering, but business-unit sponsors may control the urgency because they want
    the internal workflow released. Evidence verifies adjacent enterprise interest, not that every large company has
    a formal employee-app review process.
  buyingTriggers:
    - point: >-
        A security review or incident finds that an employee-built finance application can expose customer or churn
        data before its access boundary is understood.
      sourceRefs:
        - 1
        - 21
    - point: >-
        Security teams discover unapproved AI activity or lack an AI governance policy and need a path that permits
        useful employee work without relying on blocking alone.
      sourceRefs:
        - 3
        - 22
    - point: >-
        A regulated financial buyer formalizes review of an ICT supplier or AI workflow and requests evidence of
        access scope, data handling, and change control.
      sourceRefs:
        - 11
        - 13
  willingnessToPay:
    summary: >-
      Evidence is positive for the adjacent AI-workspace-security category but inconclusive for this exact mechanism.
      TechCrunch reported Pluto's CEO saying the company had passed $2M ARR and 30 enterprise customers after sales
      began in April 2026; the funding event itself is not proof of customer value, and reported traction is not
      independently audited. CSA's synthesis of IBM breach research describes a $670,000 shadow-AI breach-cost
      premium, a potential risk-budget rationale rather than a product price. No fetched source disclosed a paid
      synthetic-rehearsal pilot or a comparable list price.
    sourceRefs:
      - 1
      - 3
  competitiveLandscape: >-
    Pluto and Zenity are the closest AI-workspace competitors: Pluto emphasizes discovery, context, visibility, and
    control, while Zenity explicitly markets pre-live posture and exposure assessment as well as enforcement.
    AIR focuses on discovering agents and vetting their skills and components. Microsoft Power Platform is a strong
    native substitute for low-code apps through DLP, environment governance, inventory, and access controls.
    Tonic.ai and Google Cloud/Gretel provide synthetic test data building blocks, while masked staging data,
    questionnaires, spreadsheets, and custom IAM policies remain the status quo. No reviewed competitor page
    documents the exact synthetic-task-to-field-manifest sequence, but public feature pages cannot establish that
    an unlisted feature does not exist.
  incumbentThesis:
    - incumbentClass: "AI workspace security platforms"
      point: >-
        Pluto and Zenity can win by extending existing discovery, policy, posture, and runtime products, especially
        because Zenity already describes pre-live permission assessment and exploit-path validation. They do not win
        by default only if the startup proves materially better task-to-data-path evidence and integrations; absence
        of a published synthetic manifest is not evidence of a technical gap.
      sourceRefs:
        - 1
        - 18
    - incumbentClass: "Application-platform and identity controls"
      point: >-
        Microsoft can satisfy a large portion of governance for Power Platform applications through native inventory,
        environment separation, DLP connector policies, and access controls. It is less obviously sufficient for
        custom apps spanning non-Microsoft SaaS and warehouses or for deriving task-specific field grants from replay.
      sourceRefs:
        - 6
        - 7
        - 8
    - incumbentClass: "Synthetic-data and test-data vendors"
      point: >-
        Tonic and Google Cloud/Gretel can supply realistic synthetic datasets and test-data workflows, reducing the
        need to build generation technology from scratch. They are data-layer substitutes rather than documented
        security approval systems that bind a rehearsal trace to production permissions.
      sourceRefs:
        - 14
        - 15
        - 16
    - incumbentClass: "Internal build and manual review"
      point: >-
        Existing CI, masked development copies, spreadsheets, permission reviews, and customer-specific scripts are
        cheap enough to win where the app count is low or a security review is informal. A product must measurably
        shorten review time and reduce overgranting to displace them.
      sourceRefs:
        - 6
        - 7
        - 14
  regulatoryLandscape: >-
    No reviewed law mandates a synthetic rehearsal or generated access manifest. GDPR-like privacy duties and
    AI-governance requirements remain use- and role-dependent; synthetic output must not be presumed anonymous simply
    because it is generated. EU financial buyers face DORA ICT third-party risk duties, and ENISA guidance helps
    covered digital and ICT providers implement NIS2 controls. The EU AI Act is a risk-based framework, not a blanket
    requirement to purchase this product. The vendor would itself face enterprise security reviews, data-processing
    terms, tenant isolation, retention controls, and scrutiny of any source-data access used to generate a twin.
  technologyLandscape: >-
    Schema-aware synthetic generation, relational structure, and mock APIs are technically available from existing
    tools. The harder product problem is faithful task replay: mapping app behavior to read paths, representing
    important joins and edge cases, observing every connector, and translating read-only traces into enforceable
    source-native permissions. OWASP identifies excessive permissions, tool abuse, and data exfiltration as agent
    risks. A scoping review finds no consensus on synthetic-data utility/privacy evaluation and says privacy risks
    are often under-evaluated, so a convincing security claim needs task-level coverage and privacy tests, not just a
    synthetic-data label.
  distributionChannels:
    - point: >-
        Direct CISO and security-engineering sales triggered by a named employee-built app review or a data-exposure
        incident; use a fixed-scope pilot to quantify review-time reduction and access-scope quality.
      sourceRefs:
        - 1
        - 3
        - 22
    - point: >-
        CRM, cloud-warehouse, and identity/security integrators are plausible onboarding channels because data mapping
        and permission translation are the labor-intensive first steps; channel economics remain unvalidated.
      sourceRefs:
        - 14
        - 15
        - 16
  partnershipEcosystem:
    - point: >-
        Cloud data platforms and synthetic-data vendors are natural integration partners; Google Cloud's BigQuery
        integration with Gretel demonstrates an existing partner route for data synthesis.
      sourceRefs:
        - 14
    - point: >-
        Source-system owners and IAM vendors must expose stable read-only APIs, entitlement metadata, and a way to
        apply or review the proposed access manifest.
      sourceRefs:
        - 6
        - 7
        - 9
  dataMoats:
    - point: >-
        A defensible asset could emerge from reusable schema mappings, task-to-field traces, and validated edge-case
        suites across CRM and warehouse connectors, but these are hypotheses rather than current proprietary assets.
      sourceRefs:
        - 14
        - 15
        - 16
    - point: >-
        Cross-customer learning is constrained by data confidentiality; only customer-approved, de-identified
        metadata and connector templates should be reused. No current evidence shows a network effect or unique data
        advantage.
      sourceRefs:
        - 20
        - 21
  geographicConsiderations:
    - point: >-
        The beachhead is the United States. Census SUSB counts are national employer-firm counts rather than counts
        of buyers with employee-built AI apps, so they are only a sizing denominator.
      sourceRefs:
        - 2
    - point: >-
        EU expansion adds a distinct privacy and supplier-assurance burden, especially for financial institutions
        subject to DORA and covered digital/ICT suppliers under NIS2.
      sourceRefs:
        - 11
        - 12
        - 13
  sensitivityCases:
    - case: "Synthetic tasks pass but rare production behavior or joins are missing"
      impact: >-
        A false assurance can grant an incomplete or overbroad manifest, undermining the core safety claim and creating
        liability.
      sourceRefs:
        - 14
        - 15
        - 20
    - case: "Synthetic data generation still requires access to live source records"
      impact: >-
        Privacy review, data residency, or re-identification concerns may make source mapping more intrusive than the
        current manual process.
      sourceRefs:
        - 14
        - 20
        - 21
    - case: "The app uses uninstrumented connectors, APIs, or hidden tool calls"
      impact: >-
        The trace misses data paths and the generated permission document is unsound; the product must fail closed
        rather than issue a complete-scope claim.
      sourceRefs:
        - 9
        - 18
        - 6
    - case: "Native platform governance is already adequate"
      impact: >-
        Microsoft-centric customers may prefer existing environment and connector policies, narrowing the paid
        opportunity to cross-platform applications and stronger proof requirements.
      sourceRefs:
        - 6
        - 7
        - 8
  validationPlan:
    - priority: high
      question: "Does a synthetic rehearsal predict production task success and the actual minimum field-level read scope?"
      evidenceToGather: >-
        Pilot 15-20 finance workflows on one CRM or warehouse connector; compare task completion, touched fields, missed
        fields, and proposed permissions against a security-engineer-reviewed baseline. Record false grants and false
        denials and reject the workflow if any path is unobservable.
    - priority: high
      question: "Who controls a real budget for pre-access rehearsal, and what existing spend or labor does it replace?"
      evidenceToGather: >-
        Interview CISOs, application-security leads, data owners, and finance app sponsors; request evidence of recent
        review time, current software/services spend, pilot approval authority, and a paid pilot commitment at a
        stated annual value.
    - priority: high
      question: "Is the workflow materially different from Pluto, Zenity, Microsoft, or a custom sandbox in a live bake-off?"
      evidenceToGather: >-
        Compare product outputs side by side for one app: agent inventory, pre-live posture findings, test evidence,
        field-level permission output, supported connectors, and change re-review behavior. Ask incumbent customers
        what they already receive.
    - priority: medium
      question: "Can source mappings and permission manifests be generated without persistent production-data access?"
      evidenceToGather: >-
        Prototype within a customer-controlled tenant, document all source-data movement and retention, red-team
        re-identification risk, and obtain privacy, legal, and data-platform approval before an external pilot.
    - priority: medium
      question: "Can onboarding become repeatable enough to avoid a services-heavy connector business?"
      evidenceToGather: >-
        Time schema discovery, task authoring, synthetic-data validation, permission translation, and updates across
        at least three distinct customer environments; identify which connector patterns are reusable.
  validationSignals:
    - point: >-
        Pluto's CEO told TechCrunch that non-developer-built or heavily customized tools represented about 60% of
        risks detected across Pluto customers; this is company-reported, not a representative industry incidence rate.
      sourceRefs:
        - 1
    - point: >-
        A finance employee's customer and churn-data app was reportedly exposed to the public internet, directly
        matching the app-approval pain but representing one reported customer example.
      sourceRefs:
        - 1
    - point: >-
        CSA's 2026 research note reports widespread unapproved AI use and a governance-policy gap, but its composite
        statistics inherit the methods and limitations of cited surveys.
      sourceRefs:
        - 3
    - point: >-
        Tonic and Google Cloud demonstrate that schema-aware synthetic-data workflows are buildable, while empirical
        review evidence warns that utility and privacy validation remain inconsistent.
      sourceRefs:
        - 14
        - 15
        - 16
        - 20
    - point: >-
        Public competitor descriptions show a crowded adjacent layer of AI discovery, pre-live assessment, and
        runtime controls; no reviewed public page proves that the proposed end-to-end workflow is already commoditized.
      sourceRefs:
        - 1
        - 18
        - 19
  openQuestions:
    - "How many U.S. enterprises review employee-built AI apps as a distinct workflow rather than handling them through existing IAM or data-governance teams?"
    - "Do buyers need synthetic records, or would a permission sandbox using masked data meet the same security and task-quality bar?"
    - "Can behavior observed on synthetic records support least-privilege authorization without missing production-only branches?"
    - "Will CRM and warehouse vendors expose enough row- and field-level entitlement APIs to apply manifests safely?"
    - "Is an annual contract for one active workflow a meaningful security budget line, or does the service-led onboarding overwhelm software economics?"
analysisModels:
  marketMapDiagram:
    title: "Specialization and urgency in AI-app security"
    mermaid: |
      quadrantChart
        title Market map
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed rehearsal: [0.86, 0.82]
        AI workspace security: [0.55, 0.88]
        Native Power Platform controls: [0.28, 0.62]
        Synthetic-data tools: [0.82, 0.42]
        Manual review: [0.18, 0.68]
  fiveForces:
    supplierPower:
      score: 3
      rationale: >-
        CRM, warehouse, cloud, and identity owners control schemas, access APIs, and deployment boundaries; synthetic
        data tooling can be sourced from more than one provider, so upstream leverage is moderate.
      sourceRefs:
        - 6
        - 14
        - 16
    buyerPower:
      score: 4
      rationale: >-
        Enterprise security buyers can compare the workflow with existing Microsoft controls, broad AI security
        vendors, consultants, or an internal build and can require extensive proof before granting source access.
      sourceRefs:
        - 1
        - 6
        - 18
        - 19
    threatOfEntrants:
      score: 4
      rationale: >-
        Synthetic-data products, APIs, and AI security controls are already available as building blocks; the main
        entry barriers are trust, integrations, reliable test coverage, and procurement rather than a novel primitive.
      sourceRefs:
        - 14
        - 15
        - 16
        - 18
    threatOfSubstitutes:
      score: 5
      rationale: >-
        Masked staging data, questionnaires, native connector policies, manual permissions, and security consulting
        can solve parts of the job without a new annual product.
      sourceRefs:
        - 6
        - 7
        - 8
        - 14
    competitiveRivalry:
      score: 4
      rationale: >-
        Pluto, Zenity, and AIR show active vendors in adjacent AI discovery and control; rivalry is high even though
        the exact synthetic-rehearsal output is not documented in their fetched pages.
      sourceRefs:
        - 1
        - 18
        - 19
  pestle:
    - factor: political
      impact: positive
      point: >-
        Government and standards activity around AI agents is creating governance language and expectations for
        identity, authorization, and accountability, but does not mandate this product.
      sourceRefs:
        - 10
        - 12
    - factor: economic
      impact: positive
      point: >-
        Pluto's reported ARR and enterprise customers indicate budget in adjacent AI security, while the specific
        rehearsal budget remains unproven.
      sourceRefs:
        - 1
        - 3
    - factor: social
      impact: positive
      point: >-
        Employees increasingly use AI at work and security teams face a gap between employee experimentation and
        approved practices.
      sourceRefs:
        - 3
        - 5
        - 22
    - factor: technological
      impact: negative
      point: >-
        Prompt injection, tool abuse, excessive permissions, and data exfiltration complicate any claim that a
        synthetic rehearsal represents every production behavior.
      sourceRefs:
        - 9
        - 20
    - factor: legal
      impact: negative
      point: >-
        EU financial-sector ICT supplier oversight and privacy obligations raise vendor qualification costs, and
        synthetic records require evaluation rather than an automatic anonymity claim.
      sourceRefs:
        - 11
        - 13
        - 20
    - factor: environmental
      impact: neutral
      point: >-
        No material environmental driver specific to an application-level rehearsal and access-manifest product was
        established in the reviewed evidence.
      sourceRefs:
        - 14
  adoptionFrictionMatrix:
    - friction: "Production schema discovery and connector authorization"
      severity: high
      affectedBuyer: "Security engineering and data-platform owners"
      mitigation: >-
        Start with one read-only connector and a customer-hosted mapping agent; refuse to issue a complete manifest
        until all reads are observable.
      sourceRefs:
        - 6
        - 14
        - 16
    - friction: "Synthetic data may miss rare relationships or expose learned records"
      severity: high
      affectedBuyer: "Privacy, legal, security, and app owners"
      mitigation: >-
        Measure task utility and privacy risk per source, add customer-authored edge cases, and retain a no-production
        access gate on low-confidence replays.
      sourceRefs:
        - 14
        - 15
        - 20
    - friction: "Existing Microsoft controls may be good enough"
      severity: medium
      affectedBuyer: "Microsoft platform administrators and CISOs"
      mitigation: >-
        Focus on cross-platform custom applications and demonstrate task-specific field evidence beyond connector
        allowlists and tenant inventory.
      sourceRefs:
        - 6
        - 7
        - 8
    - friction: "Enterprise vendor and regulated-sector procurement"
      severity: high
      affectedBuyer: "CISO, privacy counsel, procurement, and financial-sector vendor-risk teams"
      mitigation: >-
        Keep sensitive processing customer-controlled, publish retention and access boundaries, and prepare
        independent security and third-party risk evidence early.
      sourceRefs:
        - 11
        - 13
        - 21
    - friction: "High-touch data mapping can turn software into consulting"
      severity: high
      affectedBuyer: "Security engineering and implementation partners"
      mitigation: >-
        Time onboarding separately from software usage and productize only connector patterns that recur across
        independent pilots.
      sourceRefs:
        - 14
        - 15
        - 16
regulatoryTechnicalConstraints:
  - point: >-
      Synthetic outputs are not automatically anonymous; assess utility and privacy separately and test for
      re-identification or leakage before treating a staging copy as outside privacy obligations.
    sourceRefs:
      - 20
      - 14
  - point: >-
      Financial-sector buyers may subject the vendor and its connectors to ICT third-party risk review, contractual
      controls, and supplier oversight under DORA.
    sourceRefs:
      - 13
  - point: >-
      NIS2 implementation guidance is relevant to covered digital and ICT-service entities, but does not make this
      application-security product a universal compliance requirement.
    sourceRefs:
      - 11
  - point: >-
      Agents can misuse tools, escalate privileges, or expose data; only instrumented connectors with least privilege
      and fail-closed behavior can support a trustworthy manifest.
    sourceRefs:
      - 9
      - 10
validationSignals:
  - point: >-
      Pluto reports early commercial traction and TechCrunch attributes a concrete exposed finance application to a
      Fortune 500 customer example; both establish an adjacent problem and category, not demand for synthetic replay.
    sourceRefs:
      - 1
  - point: >-
      CSA documents a broad shadow-AI governance gap, with the caveat that aggregated survey statistics do not measure
      demand for this individual workflow.
    sourceRefs:
      - 3
  - point: >-
      Microsoft documentation confirms viable native substitutes for low-code environments, raising the bar for
      differentiation and cross-platform coverage.
    sourceRefs:
      - 6
      - 7
      - 8
  - point: >-
      Technical products and a scientific review support both synthetic-data feasibility and the continuing need to
      evaluate utility and privacy rigorously.
    sourceRefs:
      - 14
      - 15
      - 16
