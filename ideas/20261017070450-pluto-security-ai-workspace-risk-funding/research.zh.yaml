competitors:
  - name: "Pluto Security"
    stage: "2026 年 October 宣布种子轮和 A 轮；据报累计融资超过 $42M"
    wedge: >-
      发现员工使用的 AI 工具和智能体，提供风险背景和可见性，并支持企业环境中的策略控制。
    pricing: "抓取到的来源未公开定价。"
    strength: >-
      公司称开始销售后不久，企业客户已超过 30 家、ARR 超过 $2M；并且直接处理非开发人员搭建的工具。
    weaknessVsUs: >-
      公开报道重点在发现、风险分析、可见性和控制，没有描述完全相同的合成任务回放及字段权限清单生成工作流。应把它视为证据缺口，而非功能确实不存在的证明。
    sourceRefs:
      - 1
  - name: "Zenity"
    stage: "商业化 AI 智能体安全平台；抓取到的材料无法核实其融资阶段"
    wedge: >-
      实时智能体清单、上线前安全态势和权限评估、暴露面测试、操作时策略执行及运行时防护。
    pricing: "抓取到的来源未公开定价。"
    strength: >-
      这是有文档记录的最接近生产前流程的竞争者，因为其产品页面称，系统会在正式上线前评估权限，并测试可利用的攻击路径。
    weaknessVsUs: >-
      审阅过的产品介绍没有说明，它是否利用合成源数据孪生，将成功任务轨迹转成生产环境的行级或字段级权限。
    sourceRefs:
      - 18
  - name: "AIR Security"
    stage: "新兴供应商；TechCrunch 报道称，September 2026 两轮种子融资共筹得 $50M"
    wedge: >-
      发现智能体，持续审查其技能、工具、MCP 服务器和其他组件，并支持拦截和经过审查的插件市场。
    pricing: "抓取到的来源未公开定价。"
    strength: >-
      瞄准正在快速成形的智能体供应链，且作为早期入局者资金充足。
    weaknessVsUs: >-
      报道所述重点是组件和插件安全，而不是针对具体应用的数据演练或客户记录最小范围访问。
    sourceRefs:
      - 19
  - name: "Microsoft Power Platform 原生治理"
    stage: "现有厂商的平台能力与替代方案"
    wedge: >-
      为 Power Apps 和 Power Automate 提供租户与环境治理、清单、身份/访问功能以及数据防泄漏规则。
    pricing: "抓取到的产品文档未披露单独控制功能的价格。"
    strength: >-
      现有客户可以直接使用平台原生控制和环境策略，无需再采用独立的 AI 安全供应商。
    weaknessVsUs: >-
      文档中的控制绑定 Power Platform 生态，并未描述跨供应商的合成任务回放如何生成特定字段的访问建议。
