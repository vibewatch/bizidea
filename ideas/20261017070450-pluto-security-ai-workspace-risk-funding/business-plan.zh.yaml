slug: shadow-data-rehearsal
date: "2026-10-17"
executiveSummary: >-
  Shadow Data Rehearsal 是一套面向美国企业的访问前审批流程，供企业审核由财务团队搭建、需要从单一 CRM 或数据仓库读取客户、账户或流失记录的内部 AI 应用。产品将获批的数据结构映射到客户控制的合成演练租户，回放指定任务，并提供可审计的任务轨迹和拟议的字段级生产访问权限清单；只要有数据路径无法观测，产品就不宣称安全性已获完整验证。痛点信号可信，但只是相邻证据：TechCrunch 报道过一款暴露的财务应用，并转述 Pluto CEO 称，非开发者搭建的工具约占 Pluto 客户中发现风险的 60%；这两点都不能证明客户需要合成演练。研究采用自下而上的估算：TAM 为 $263.0M、SAM 为 $159.6M、五年 SOM 为 $4.8M。三者都是基于假设的情景，并非实测品类收入。该切口要与 Pluto、Zenity 的 AI 安全控制、Microsoft Power Platform 治理、合成数据供应商及人工审核竞争；已审阅的产品页面既未证明存在直接等价产品，也未证实市场有明确空白。只有具名安全审核带来紧迫性，创始人才会主导直销；先做固定范围的付费试点，再转为按工作流收费的年订阅。公司应先验证单个数据源连接器的保真度，再扩大集成、自动改动权限或招聘销售。值得安排一场种子前轮尽调会，但投资信心取决于付费试点转化、低错误授权率和可重复的客户导入流程；这几项目前都缺乏证据。
problem:
  - "财务和运营员工能搭建内部 AI 应用；在安全团队弄清应用任务和最低必要数据范围前，这些应用就能触达敏感 CRM 或数据仓库记录。"
  - "问卷、电子表格、脱敏测试副本和宽泛的连接器策略，都无法说明有代表性的应用任务能否在更窄的字段级授权下正常运行。"
  - "合成演练若漏掉罕见关联、仅在生产环境出现的行为，或通过未接入监测的连接器发出的调用，也可能让人误以为风险已排除。"
solution:
  - "针对一个应用和一个获批数据源，把数据结构和策略标签映射到客户控制的合成租户，并回放客户批准的任务。"
  - "记录观测到的读取、任务结果和覆盖缺口，生成一份拟议的字段级权限清单，注明有效期并交由人工审核；在此之前不授予任何生产凭证。"
  - "相关调用无法观测，或任务与隐私检查未达到客户约定门槛时，一律拒绝放行；使用现有合成数据组件，不从零开发生成器。"
whyWeWin:
  - "产品拟把可复现的任务轨迹与可审核的字段级权限建议放在同一份输出里；它不止盘点智能体、列出泛化的安全态势问题或生成合成记录。"
  - "由客户侧完成映射并明确列出覆盖缺口，让安全和数据负责人能检查决策依据；这仍是待验证的产品假设，并非已确立的专有优势。"
  - "先从一个财务工作流切入，团队就能在争取更广泛的 AI 安全平台预算前，验证任务回放能否缩短审核时间并减少过度授权。"
strategicChoices:
  beachhead: "美国企业，员工至少 1,000 人，且有一项具名的安全审核，审核对象是一款由财务团队搭建、需要从单一 CRM 或数据仓库读取客户、账户或流失数据的内部 AI 应用。"
  wedgeRationale: "一项正在推进的审批决策能锁定买方、应用负责人、数据源管理员和可观测任务集；固定为一个应用、一个数据源的试点，比广泛的智能体盘点平台更快验证任务保真度和权限建议是否有用。财务和客户记录让风险后果具体可见，但研究中的 1,000 人以上企业 SAM 仍只是未经核实的资格假设。"
  sequencingRationale: "先验证买方是否足够着急，以及单个连接器能否追踪任务涉及的字段；再对边界明确的试点收费并测量导入工时。只有流程可重复后，才增加数据源模板、伙伴交付和有限的权限应用。按这个顺序推进，可在扩大销售或招聘平台团队前控制合成数据与连接器风险。"
  notYet:
    - "暂不面向泛员工 AI 发现、所有企业智能体、消费级应用或独立合成数据平台。"
    - "暂不为不支持的连接器开发合成数据生成器、运行时策略引擎或自动写入生产权限的工具。"
    - "美国部署证明数据处理、证据和采购准备度前，不进入 EU 金融服务市场，也不宣称符合监管要求。"
    - "除非试点证明其价值显著高于原生环境、DLP、盘点和访问控制，否则不与仅使用 Microsoft Power Platform 的工作流正面竞争。"
market:
  tam: "$263.0M 美国自下而上估算情景；假设 21,041 家员工至少 500 人的企业中有 25% 符合条件，且每个客户年价值为 $50,000；两项均未经核实。"
  sam: "$159.6M 美国滩头市场情景；假设 10,641 家员工至少 1,000 人的企业中有 30% 正在正式审核财务/客户数据原型，且每个客户年价值为 $50,000。"
  som: "$4.8M 五年可触达情景；按每个客户年价值 $50,000 计算，约 96 个客户，即假设 SAM 的 3%；这不是预测。"
  segments:
    - "首要客户：美国企业，其财务团队搭建的内部 AI 工作流会查询敏感 CRM 或数据仓库记录，且须通过正式安全审核。"
    - "次要客户：负责治理跨平台员工自建应用的企业安全和数据平台团队；业务部门应用搭建者及数据源/IAM 负责人会参与工作流，但未必掌握预算。"
  buyingProcess: "安全工程师或应用安全负责人在授权审核中标记一款具名应用；财务负责人和 CRM/数据仓库管理员随后界定任务及允许访问的数据源元数据。CISO 或安全工程副总裁发起固定范围试点；隐私、数据平台、采购和供应商风险审核均可阻止数据源访问。研究未发现这一特定工作流已有付费试点的证据。"
product:
  mvp: "交付一个由客户控制的映射代理，接入首位共创客户选定的单一 CRM 或数据仓库连接器；配套提供与数据结构一致的合成租户、任务回放、读取路径追踪、覆盖警告和供人工审核的字段级权限清单。MVP 不会授予生产权限；遇到不支持或无法观测的调用时，不提供完整范围建议。"
  sixMonth: "在三项付费或明确限时的共创客户评估中运行首个连接器；将回放结果与客户审核过的数据源行为对照，测量错误授权率和审核时间，并在接触任何外部生产数据源前完成隐私/数据流审核。"
  twelveMonth: "如果首个连接器通过保真度和付费转化门槛，就把它的数据结构和任务模板、版本化证据及变更触发的复审做成产品；只有至少三次独立部署证明映射方式可复用后，才增加第二个连接器。"
  twentyFourMonth: "支持少量可重复的 CRM/数据仓库模式；只有验证数据源 APIs 和回滚机制后，才应用客户批准的权限清单。在满足企业安全和供应商保障要求前，业务仍聚焦美国市场。"
  keyBets:
    - "可以用客户批准的数据源基线衡量任务级合成数据效用，精度足以支撑有限的权限建议。"
    - "客户会接受由客户自控的映射流程，以尽量减少、记录并管控对数据源元数据或记录的任何访问。"
    - "至少有一个连接器能提供足够的读取路径和权限细节，从而在覆盖不全时拒绝放行，并让输出切实可用。"
    - "具名的访问前审核有足够紧迫性和预算，能够替代人工沙箱或补充现有 AI 安全产品。"
gtm:
  wedge: "由创始人主导销售，切入美国一项具名的财务应用安全审核——触发因素可以是数据暴露、正式审批请求或工作流受阻；销售一个为期 8 周、限于一个应用和一个数据源的演练试点，只有实测证据获认可后才推进转化。"
  channels:
    - "创始人直接联系 CISO 和安全工程团队，围绕正在审核的员工自建财务应用展开；在筛选商机时邀请应用负责人和数据平台管理员参与。"
    - "三次部署证明配置流程可重复后，再测试 CRM、云数据仓库、身份和安全集成商的转介绍；伙伴收益模式和销售管道尚未验证。"
    - "与安全和数据负责人开展技术研讨，评估一条真实审核工作流；在转化得到证明前，不做大范围付费获客。"
  funnelTargets: "运营假设，并非观测基准：将 20–30% 由明确触发事件筛选出的具名商机转成付费试点，并让至少 50% 的已完成试点转为年度生产合同；首批 10 个合格商机后复盘。"
  pricing: "测试一个应用、一个数据源、为期 8 周的固定范围试点，报价 $15,000–$25,000；试点费用可抵扣每个活跃工作流每年 $40,000–$60,000 的订阅费，另收一次性数据源映射费。这些是运营团队的定价假设，不是市场证据；研究中的 $50,000 客户年价值仅用于市场测算，因此在将其视为已验证前，必须取得买方批准的预算和付费承诺。"
businessModel:
  revenueStreams:
    - "按每个已批准的活跃应用工作流收取年订阅费，包含任务回放、证据留存和变更复审。"
    - "一次性收取客户导入和数据源映射费；在可复用模板降低交付工作量前，单独定价。"
  unitOfValue: "一个活跃应用工作流，配有可复现的任务集、已观测的数据源范围和当前可供审核的生产权限清单。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "首份权限清单获批后，在同一企业和数据源中增加审核过的工作流。"
    - "只有证明映射和权限模式可复用后，才增加第二个 CRM 或数据仓库连接器。"
    - "按工作流对变更触发的回放、证据留存和人工批准的权限清单更新收费。"
    - "只有在多个独立客户中测出培训和实施工时后，才采用集成商交付。"
strategyMap:
  northStarMetric: "范围内工作流中，完成客户批准的演练、所有必需数据路径均可观测，且取得安全团队批准的有限范围权限清单的比例。"
  inputMetrics:
    - "从具名审核受理到安全决策的中位天数，并与该客户此前的人工审核基线对比。"
    - "客户批准的任务中，成功回放且没有漏掉关键字段或未观测到连接器调用的比例。"
    - "每套受审任务中的关键错误授权和错误拒绝次数。"
    - "按连接器和客户统计数据结构映射、任务设置及权限清单审核所需的工程师日数。"
    - "按活跃工作流统计付费试点转年度合同的比例及续约情况。"
  moatsToBuild:
    - "经客户批准、针对特定连接器的边缘案例测试集，把任务结果与已观测字段及经过验证的权限建议关联起来。"
    - "可复用的连接器、数据结构和权限清单模板，在不共享客户记录或假定拥有跨客户数据权利的前提下减少配置工时。"
    - "安全和数据负责人认可的可审计变更记录与证据；目前尚未建立网络效应或专有数据护城河。"
  killCriteria:
    - "完成 20 家目标企业访谈后，若有活跃具名应用审核的企业少于五家，且愿以 $15,000 或更高价格发起付费试点的企业少于两家，就停止或更换买方/工作流。"
    - "在首个连接器的 20 项代表性任务中，经过两轮修复后仍存在任何关键的未观测路径或可重复出现的错误授权；此时不得发出权限清单，并重新评估技术切口。"
    - "首批 10 个由触发事件筛选的合格商机中，若购买试点的不到三个，或能转为年价值 $40,000 或以上合同的已完成试点不到一半，就重新审视紧迫性、产品包装或是否停止。"
    - "到第三家客户部署时，每个应用的配置仍超过 10 个工程师日，或映射模式无法复用；不得按重服务模式扩大软件销售。"
    - "若买方无法说清产品相对现有 Microsoft、AI 安全或人工审核流程的可衡量优势，就收窄到跨平台案例，或停止独立产品。"
  mermaid: |
    flowchart LR
      Wedge["Finance app in security review"] --> MVP["One-source synthetic rehearsal"]
      MVP --> Proof["Task fidelity and scoped manifest"]
      Proof --> Expansion["More workflows and repeatable connectors"]
investorMemo:
  verdict:
    call: "会面 / 进一步尽调"
    conviction: "投资把握偏低至中等：这项具体的访问前工作流值得尽调，但付费意愿和技术可靠性尚未得到验证。"
    whyBelieve: "独立报道提到一款暴露客户数据的财务应用；相邻的 AI 安全供应商也报告企业客户采用情况，说明安全问题真实存在，且有可触达的买方类别。"
    whyDoubt: "这款具体的演练产品没有付费试点证据；Zenity、Microsoft、Pluto、内部团队或脱敏沙箱都可能满足同一审批需求。"
    nextDiligence: "要求开展付费试点：安全工程师验证至少 20 项有数据源依据的任务、观测每条必需数据路径、批准有限范围权限清单，并认可转为年度合同的价格。"
  firstCustomer:
    title: "正在审核财务团队自建 AI 应用的美国企业安全团队"
    profile: "员工至少 1,000 人的企业正在正式审核一款财务原型；该原型必须从单一 CRM 或数据仓库读取客户、账户或流失记录。"
    trigger: "安全审核、数据暴露或发布受阻，揭示原型能在尚未厘清任务所需访问边界前触达客户记录。"
    buyer: "CISO 或安全工程副总裁"
    initialContract: "商业测试假设：一个应用、一个数据源、为期 8 周的付费试点报价 $15,000–$25,000；若安全团队认可证据，试点费用可抵扣每年 $40,000–$60,000 的单工作流订阅费，另加客户导入费。研究未发现可比价格或付费试点。"
  mustBeTrue:
    - "20 家受访目标企业中，至少五家有正在接受正式安全审核的员工自建财务应用；至少两家批准金额为 $15,000 或以上的付费试点。"
    - "在首个连接器的 20 项任务测试中，演练达到客户约定的任务完成标准，揭示所有必需数据路径；最多经过两轮修复后，关键错误授权为零。"
    - "已完成试点中至少一半转为年度生产合同，且每个工作流的年价值达到 $40,000 或以上；同时能明确识别 CISO/安全工程预算负责人。"
    - "到第三家客户部署时，每个应用的数据源映射和任务设置不超过 10 个工程师日，且至少一半连接器专属映射或测试资产可复用。"
    - "在有记录的对比测试中，目标买方至少基于一个可衡量原因——例如审核更快或获批访问范围更窄——选择演练证据，而非其可用的原生、AI 安全、人工或脱敏数据流程。"
  diligenceQuestions:
    - "谁掌握访问前演练的预算？他们能否展示近期应用审核、当前审核工时，以及已有资金支持的试点路径？"
    - "对照生产数据支撑的基线，首个连接器达到怎样的任务成功率、关键错误授权率、错误拒绝率和未观测调用率？"
    - "映射代理必须读取哪些数据或元数据、数据在哪里处理、保留多久，需要什么隐私审批？"
    - "Zenity 在生产上线前的权限和攻击路径测试方面已经提供什么？客户愿意付费让本产品增加什么输出？"
    - "不引入新供应商时，Microsoft Power Platform 控制或内部脱敏沙箱有多大概率解决目标工作流？"
    - "在三种不同客户的数据结构中，哪些导入步骤可复用、还需多少工程师日，能否安全审核或应用数据源原生权限清单？"
operatingAssumptions:
  - assumption: "相当一部分目标企业对员工自建的财务 AI 应用设有正式审核，正在进行的审核也可能触发近期试点。"
    basis: "research.yaml"
    validationTest: "访谈 20 家员工至少 1,000 人的美国企业，并在至少五家核实具名且正在审核的应用、审核负责人、数据源负责人、决策日期和试点审批权。"
    decisionImpact: "若符合条件的企业少于五家，就不再把研究估算的 SAM 视为可触达的滩头市场；在扩大集成前，测试由事件触发或由平台主导的更窄买方群体。"
  - assumption: "在合成租户上回放任务，能够为客户的真实任务找出足够完整且范围足够窄的数据源访问范围。"
    basis: "运营方判断"
    validationTest: "在一个连接器上回放 20 项客户批准的任务，并将轨迹与安全工程师审核过的数据源基线对比；记录任务完成情况、漏掉的字段、错误授权、错误拒绝和所有未观测调用。"
    decisionImpact: "任何未解决的关键错误授权或必需但未观测到的数据路径都会阻止权限清单发出；如果两轮修复后仍未解决，就放弃以合成演练实现授权的主张。"
  - assumption: "由客户自控的映射流程，能通过数据平台、隐私和安全审核，且不要求供应商持续访问敏感生产记录。"
    basis: "research.yaml"
    validationTest: "付费试点开始前，记录数据流、最小权限凭证、处理地点、保留/删除安排、租户隔离和隐私审核；开展经客户批准的再识别与数据泄漏评估。"
    decisionImpact: "如果客户无法在自控边界内接受数据源访问或合成输出，就进一步减少输入数据，或停止服务该数据源和细分市场。"
  - assumption: "买方愿为有明确边界的试点支付 $15,000–$25,000，并为每个活跃工作流支付每年 $40,000–$60,000。"
    basis: "运营方判断"
    validationTest: "向 10 个由触发事件筛选的合格买方提供相同的书面范围和价格；统计签约付费试点和年度转化承诺，不把口头兴趣算在内。"
    decisionImpact: "若 10 个合格商机中购买试点的少于三个，或买方拒绝年度计价单位，那么在招聘销售前重新测试是否需要服务模式、平台捆绑或更换买方。"
  - assumption: "首个连接器的映射和任务模板足够可复用，能达到可接受的软件毛利率。"
    basis: "research.yaml"
    validationTest: "追踪三个不同客户环境中的工程和实施工时；区分可复用的连接器工作与客户专属的数据结构、任务和权限工作。"
    decisionImpact: "若第三次实施仍需每个应用超过 10 个工程师日，或复用率不到一半，就收窄支持的数据结构、重新定价客户导入，或停止扩大独立订阅业务。"
  - assumption: "跨平台财务应用带来差异化需求，原生 Microsoft 控制或 AI 安全套件尚未满足这一需求。"
    basis: "research.yaml"
    validationTest: "至少与五位目标买方开展并列输出评审，使用一款候选应用；记录现有控制、缺少的任务到字段证据、买方选择的替代方案，以及决策时间或访问范围的可衡量差异。"
    decisionImpact: "如果现有控制已满足审核要求，就只聚焦确有明确缺口的跨平台应用，或选择合作/捆绑，而不是争夺重复的治理预算。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "对 20 个目标客户开展结构化访谈，索取一份近期审批流程的脱敏材料、审核时长、预算负责人和决策期限。"
    hypothesis: "具名财务应用审核会形成有明确时限、由安全工程团队负责的问题，而不只是没有预算的一般性影子 AI 担忧。"
    successMetric: "至少五家企业展示正在进行且有明确名称的审核，决策时间在 90 天内；至少两家能说明付费试点的审批路径。"
    owner: "CEO/产品创始人"
  - horizon: "0–90 天"
    experiment: "搭建一次性单连接器回放原型，用客户批准的测试任务与数据源基线对照，覆盖 20 项财务工作流。"
    hypothesis: "按数据结构构造的合成租户，能复现有用的任务行为，并为一个边界明确的连接器完整追踪读取路径。"
    successMetric: "客户审核者认可任务结果并观测到所有必需路径；最多经过两轮修复后，关键错误授权为零。"
    owner: "创始工程师"
  - horizon: "0–90 天"
    experiment: "设计由客户自控的数据流和威胁模型；与一位共创客户的隐私和数据负责人一起测试映射、留存、隔离及合成输出的隐私风险。"
    hypothesis: "边界明确且有记录的映射流程，能够通过数据源访问审核，而不假定合成记录天然匿名。"
    successMetric: "取得试点架构的书面批准，明确凭证、处理边界、留存/删除条款，且没有未解决的关键隐私问题。"
    owner: "创始安全/产品负责人"
  - horizon: "3–6 个月"
    experiment: "向 10 家由触发事件筛选的合格客户提供固定范围的单应用/单数据源试点，价格按所述试点区间报价。"
    hypothesis: "安全买方会为可衡量的发布门槛拨款，只要它能打通具名工作流，并减少人工审核或过度授权。"
    successMetric: "至少签下三个金额为 $15,000 或以上的付费试点；记录试点启动延迟、完成情况、验收结果和年度转化决策。"
    owner: "CEO/产品创始人"
  - horizon: "3–6 个月"
    experiment: "由买方主导，对比客户当前的 Microsoft 原生策略、AI 安全工具以及人工或脱敏数据流程。"
    hypothesis: "任务到字段证据能改变授权决策，而不只是增加盘点、态势评估或连接器允许列表。"
    successMetric: "五位参与买方中至少三位指出可衡量的优势，并选择把演练输出用于实际审批。"
    owner: "创始安全/产品负责人"
  - horizon: "6–12 个月"
    experiment: "在首个连接器上，跨三个独立客户环境重复数据源映射和任务编写。"
    hypothesis: "常见数据结构和权限模式可以做成模板，无需共享客户记录，并能降低每次部署的实施工时。"
    successMetric: "到第三家客户时，每个应用的设置不超过 10 个工程师日，且至少一半连接器专属映射/测试资产可复用。"
    owner: "集成工程师"
  - horizon: "12–18 个月"
    experiment: "直销部署证明配置可重复后，与一家 CRM、数据仓库、身份或安全集成商试做转介绍或实施合作。"
    hypothesis: "值得信赖的伙伴能带来合格审核机会并交付映射，同时不增加支持负担或损害单位经济模型。"
    successMetric: "一家伙伴带来两个合格商机，并完成一次实施，交付工时不超过直销实测水平。"
    owner: "CEO/产品创始人"
operations:
  - "初期部署仅面向美国，并由客户控制；记录每项凭证、数据字段、处理地点、留存期限、删除路径和客户审批。"
  - "条件合适时使用合成数据供应商或平台组件；独立测试数据效用和隐私，不假定生成记录天然匿名。"
  - "连接器允许列表坚持默认拒绝；记录任务输入、已观测读取、覆盖缺口、测试版本、拟议权限、审批人、有效期和变更审核历史。"
  - "把一次性映射工时与持续软件使用分开；按客户追踪工程师日数和模板复用率，再确定客户导入费或扩大伙伴交付。"
  - "任何基于数据源的评估开始前，取得客户安全、隐私、数据平台和采购团队签字；供应商保障准备就绪前，暂缓服务 EU 金融客户。"
team:
  - role: "创始工程师"
    startTiming: "第 0 个月"
    rationale: "负责客户自控映射代理、连接器监测、合成任务回放、默认拒绝行为和安全租户架构。"
  - role: "创始产品/安全负责人"
    startTiming: "第 0 个月"
    rationale: "负责买方调研和安全设计审核，定义客户批准的任务及错误授权门槛，并主导创始人直销试点。"
  - role: "数据/连接器工程师"
    startTiming: "第 3 个月，前提是已有共创客户"
    rationale: "只有在伙伴提供获批的数据结构和任务后，才把首个 CRM 或数据仓库映射做成产品；测出首个连接器的复用率前，暂缓第二个连接器。"
  - role: "应用测试数据工程师"
    startTiming: "第 6 个月，前提是已有保真度证据"
    rationale: "构建任务和边缘案例测试集；只有初始连接器能反复测出错误授权和覆盖情况后，才评估数据效用/隐私。"
  - role: "企业客户经理"
    startTiming: "第 9 个月，前提是已有两个获认可的付费试点"
    rationale: "扩大已验证的创始人主导审批流程和买方流程；试点定价和年度转化得到证明前，不招聘背负销售指标的人员。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "完成对 20 个目标客户的访谈，记录至少五个正在审核的应用，并明确安全买方和数据源负责人。"
      - "用一个连接器完成 20 项客户批准的回放任务，观测所有必需路径；最多经过两轮修复后，关键错误授权为零。"
      - "签下至少三个金额为 $15,000 或以上的付费试点，每个试点都有书面成功基线和客户批准的数据流边界。"
      - "已完成试点中至少一半转为年合同金额 $40,000 或以上的生产合同；否则重新审视买方、价格和价值计量单位。"
  - horizon: "12–24 个月"
    items:
      - "完成三次独立部署，每个应用配置不超过 10 个工程师日，且连接器专属映射/测试资产至少有 50% 可复用。"
      - "只有首个连接器通过复用门槛后才增加第二个数据源连接器；权限清单生成仍须人工批准，并坚持默认拒绝。"
      - "在大规模招聘销售前，记录续约意向、实际审核时间变化、错误授权/拒绝表现，以及毛利率达到 70% 的路径。"
      - "测出直销交付工时和支持负担后，测试一个集成商转介绍渠道。"
  - horizon: "24–36 个月"
    items:
      - "只有客户留存和付费扩张证明流程可重复，才在美国扩大生产使用，覆盖多个应用工作流和少量经过验证的 CRM/数据仓库模式。"
      - "只有数据源系统具备经验证的权限 APIs、回滚、变更审计和客户批准，才自动应用权限清单。"
      - "只有安全保证、隐私边界、连接器经济性和客户需求均有证据后，才进入新的受监管地区或更广泛的智能体安全品类。"
risks:
  - risk: "合成演练漏掉仅在生产环境出现的关联或边缘情况，让人误以为访问安全。"
    likelihood: "High"
    impact: "High"
    mitigation: "与客户审核过的数据源行为对照，加入客户编写的边缘案例，公布覆盖范围和置信度边界；任何关键遗漏都会阻止完整权限清单发出。"
  - risk: "未接入监测的连接器或隐藏工具调用，使观测到的数据范围不完整。"
    likelihood: "High"
    impact: "High"
    mitigation: "先只支持一个已接入监测的连接器，阻止不支持的调用；任何相关路径无法观测时，都不提供生产权限范围建议。"
  - risk: "数据源映射和隐私审核要求访问敏感生产数据，买方不会批准。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "使用客户自控的映射器，尽量减少输入，记录留存和删除安排，测试再识别风险，并在外部试点前取得隐私/数据负责人批准。"
  - risk: "Zenity、Pluto、Microsoft、内部工具或脱敏测试环境解决了足够多的问题，导致产品拿不到独立预算。"
    likelihood: "High"
    impact: "High"
    mitigation: "由买方主导对比测试，并要求证明审核时间缩短或访问范围收窄；聚焦有明确缺口的跨平台工作流，不宣称竞品不存在。"
  - risk: "企业客户导入和采购让产品在持续使用得到验证前沦为低毛利服务。"
    likelihood: "High"
    impact: "High"
    mitigation: "以三次付费部署作为招聘和扩展连接器的门槛，逐步追踪实施工时，单独收取映射费；如果每个应用配置超过 10 个工程师日，就停止扩张或重新包装产品。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "为期 18 个月的种子前轮融资目标：交付单连接器 MVP，验证任务保真度和隐私边界，完成三至五个企业付费试点，把可重复的映射流程做成产品，准备供应商安全审核证据，并验证付费试点转年度合同的路径，然后再扩大连接器或销售团队。"
