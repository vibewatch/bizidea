slug: shadow-data-rehearsal
date: "2026-10-17"
executiveSummary: >-
  Shadow Data Rehearsal is a pre-access approval workflow for U.S. enterprises reviewing finance-built internal AI
  apps that need customer, account, or churn records from one CRM or warehouse source. It maps approved schemas into a
  customer-controlled synthetic rehearsal tenant, replays named tasks, and returns an auditable task trace plus a
  proposed field-scoped production access manifest; it does not claim complete safety when a data path is
  unobservable. The pain signal is credible but adjacent: TechCrunch described an exposed finance app, and reported
  Pluto's CEO saying non-developer-built tools represented about 60% of risks found across Pluto customers; neither
  establishes demand for synthetic rehearsal. Researched bottom-up sizing is $263.0M TAM, $159.6M SAM, and $4.8M
  five-year SOM, all assumption-led scenarios rather than measured category revenue. The wedge competes with Pluto
  and Zenity's AI-security controls, Microsoft Power Platform governance, synthetic-data vendors, and manual review;
  no reviewed product page establishes either a direct equivalent or a proven gap. Founder-led direct sales will start
  only when a named security review creates urgency, using a fixed-scope paid pilot before a per-workflow annual
  subscription. The company should sequence one source connector and fidelity proof before broader integrations,
  automated permission changes, or sales hiring. A pre-seed diligence meeting is warranted, but investment conviction
  depends on paid-pilot conversion, low false-grant rates, and repeatable onboarding, none of which is yet evidenced.
problem:
  - "Finance and operations employees can build internal AI apps that reach sensitive CRM or warehouse records before security understands the tasks or minimum required data scope."
  - "Questionnaires, spreadsheets, masked test copies, and broad connector policies do not show whether representative app tasks work with a narrower field-level grant."
  - "A synthetic rehearsal can itself create false confidence if it misses unusual joins, production-only behavior, or calls through uninstrumented connectors."
solution:
  - "For one app and one approved source, map schemas and policy labels into a customer-controlled synthetic tenant and replay customer-approved tasks."
  - "Capture observed reads, task outcomes, coverage gaps, and a proposed field-scoped manifest with expiry and human approval before any live credentials are granted."
  - "Fail closed when a relevant call cannot be observed or when task and privacy checks do not meet customer-agreed thresholds; use existing synthetic-data components rather than building a generator from scratch."
whyWeWin:
  - "The product's proposed output links a reproducible task trace to a reviewable field-level permission proposal, rather than stopping at agent inventory, generic posture findings, or synthetic records."
  - "Customer-side mapping and explicit coverage gaps make the decision evidence inspectable by security and data owners; this is a product hypothesis to prove, not an established proprietary advantage."
  - "Starting with one finance workflow allows the team to prove whether replay reduces review time and overgranting before competing for the broader AI-security platform budget."
strategicChoices:
  beachhead: "U.S. enterprises with at least 1,000 employees and a named security review for a finance-built internal AI app seeking customer, account, or churn data from one CRM or warehouse source."
  wedgeRationale: "A live approval decision supplies a buyer, app owner, source administrator, and observable task set; a fixed one-app/one-source pilot can test task fidelity and permission usefulness faster than a broad agent inventory platform. Finance/customer records make the consequence concrete, while the researched 1,000-plus-employee SAM remains an unverified eligibility scenario."
  sequencingRationale: "First validate buyer urgency and a single connector's task-to-field trace, then charge for bounded pilots and measure onboarding labor; only after repeatability should the team add source templates, partner-led delivery, and limited permission application. This order contains synthetic-data and connector risk before scaling sales or hiring a broad platform team."
  notYet:
    - "Do not target general employee AI discovery, all enterprise agents, consumer apps, or a standalone synthetic-data platform."
    - "Do not build a synthetic-data generator, runtime policy engine, or automatic production permission writer for unsupported connectors."
    - "Do not enter EU financial services or claim regulatory compliance before U.S. deployments establish data handling, evidence, and procurement readiness."
    - "Do not compete head-on for Microsoft-only Power Platform workflows unless a pilot demonstrates material value beyond native environment, DLP, inventory, and access controls."
market:
  tam: "$263.0M U.S. bottom-up scenario; assumes 25% of 21,041 firms with 500-plus employees fit and $50,000 annual account value, neither verified."
  sam: "$159.6M U.S. beachhead scenario; assumes 30% of 10,641 firms with 1,000-plus employees have finance/customer-data prototypes under formal review and $50,000 annual account value."
  som: "$4.8M five-year reachability scenario; approximately 96 accounts, or 3% of assumed SAM, at $50,000 annual account value; not a forecast."
  segments:
    - "Primary: U.S. enterprises with formal security review of finance-built internal AI workflows that query sensitive CRM or warehouse records."
    - "Secondary: enterprise security and data-platform teams governing cross-platform employee-built apps; business-unit app builders and source/IAM owners are workflow participants, not necessarily budget owners."
  buyingProcess: "A security engineer or application-security lead flags a named app during an approval review; its finance owner and CRM/warehouse administrator define tasks and permitted source metadata. The CISO or VP of security engineering sponsors a fixed-scope pilot, with privacy, data-platform, procurement, and vendor-risk review able to block source access; research found no paid-pilot evidence for this exact workflow."
product:
  mvp: "Deliver one customer-controlled mapping agent for a single CRM or warehouse connector chosen with the first design partner, a synthetic schema-faithful tenant, task replay, read-path trace, coverage warnings, and a human-reviewable field-scoped manifest. No production grant is issued by the MVP, and unsupported or unobservable calls block a complete-scope recommendation."
  sixMonth: "Run the first connector in three paid or explicitly time-boxed design-partner evaluations; compare replay against customer-reviewed source behavior, measure false grants and review time, and complete a privacy/data-flow review before any external production-source access."
  twelveMonth: "If the first connector passes fidelity and paid-conversion gates, productize its schema/task templates, versioned evidence, and change-triggered re-review; add a second connector only when at least three independent deployments show reusable mapping."
  twentyFourMonth: "Support a small set of repeatable CRM/warehouse patterns and customer-approved manifest application only where source APIs and rollback are verified; remain U.S.-focused until enterprise security and supplier-assurance requirements are met."
  keyBets:
    - "Task-level synthetic utility can be measured against customer-approved source baselines closely enough to support a limited permission proposal."
    - "The customer will accept a customer-controlled mapping process that minimizes, documents, and governs any access to source metadata or records."
    - "At least one connector exposes enough read-path and entitlement detail to fail closed on missing coverage and make the output actionable."
    - "A named pre-access review has sufficient urgency and budget to displace a manual sandbox or complement an existing AI-security product."
gtm:
  wedge: "Founder-led sale into a named U.S. finance-app security review triggered by an exposure, formal approval request, or blocked workflow; sell an 8-week one-app/one-source rehearsal pilot and convert only after measured evidence is accepted."
  channels:
    - "Direct, founder-led CISO and security-engineering outreach tied to an active employee-built finance app review; recruit the app owner and data-platform administrator into qualification."
    - "After three deployments establish a repeatable setup, test referrals through CRM, cloud-warehouse, identity, and security integrators; partner economics and pipeline are unvalidated."
    - "Use technical workshops with security and data owners to assess one real review workflow; avoid broad paid demand generation until conversion is demonstrated."
  funnelTargets: "Operating hypotheses, not observed benchmarks: convert 20–30% of named, trigger-qualified opportunities into a paid pilot and at least 50% of completed pilots into annual production contracts; review after the first 10 qualified opportunities."
  pricing: "Test a $15,000–$25,000 fixed 8-week pilot for one app and one source, with the pilot fee credited toward a $40,000–$60,000 annual subscription per active workflow plus a one-time source-mapping fee. These are operator price hypotheses, not market evidence; the $50,000 account value in research is a sizing input only, so require buyer-approved budget and paid commitments before treating it as validated."
businessModel:
  revenueStreams:
    - "Annual subscription per active, approved app workflow, including replay, evidence retention, and change re-review."
    - "One-time onboarding and source-mapping fee, priced separately until repeatable templates reduce delivery effort."
  unitOfValue: "One active app workflow with a reproducible task suite, observed source-data scope, and current reviewable production manifest."
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add reviewed workflows in the same enterprise and source after the first manifest is accepted."
    - "Add a second CRM or warehouse connector only after reusable mapping and permission patterns are proven."
    - "Charge for change-triggered replays, evidence retention, and human-approved manifest updates across workflows."
    - "Use integrator delivery only after training and implementation time are measured across independent customers."
strategyMap:
  northStarMetric: "Percentage of in-scope workflows that complete a customer-approved rehearsal, have no unobserved required data paths, and receive a security-approved limited-scope manifest."
  inputMetrics:
    - "Median elapsed days from named review intake to security decision, compared with that customer's prior manual baseline."
    - "Share of customer-approved tasks replayed successfully with no critical missed field or unobserved connector call."
    - "Critical false-grant and false-denial counts per reviewed task suite."
    - "Engineer-days for schema mapping, task setup, and manifest review by connector and customer."
    - "Paid-pilot-to-annual conversion and renewal by active workflow."
  moatsToBuild:
    - "Customer-approved, connector-specific edge-case suites linking task outcomes to observed fields and validated permission proposals."
    - "Reusable connector, schema, and manifest templates that reduce setup labor without sharing customer records or assuming cross-customer data rights."
    - "Auditable change history and evidence accepted by security/data owners; no network effect or proprietary data moat is established today."
  killCriteria:
    - "After 20 interviews with in-scope enterprises, fewer than five have an active named app review and fewer than two will sponsor a paid pilot at $15,000 or more; stop or change the buyer/workflow."
    - "Across 20 representative tasks on the first connector, any critical unobserved path or repeatable false grant remains after two remediation cycles; do not issue manifests and reconsider the technical wedge."
    - "Fewer than three of the first 10 trigger-qualified opportunities buy pilots, or fewer than half of completed pilots convert at $40,000 or more annual value; revisit urgency, packaging, or stop."
    - "By the third customer deployment, setup still exceeds 10 engineer-days per app or mapping patterns do not repeat; do not scale software sales on a services-heavy model."
    - "The buyer cannot explain a measurable advantage over its existing Microsoft, AI-security, or manual review process; narrow to cross-platform cases or discontinue the standalone product."
  mermaid: |
    flowchart LR
      Wedge["Finance app in security review"] --> MVP["One-source synthetic rehearsal"]
      MVP --> Proof["Task fidelity and scoped manifest"]
      Proof --> Expansion["More workflows and repeatable connectors"]
investorMemo:
  verdict:
    call: "Meet / investigate further"
    conviction: "Low-to-moderate conviction: a specific pre-access workflow merits diligence, but willingness to pay and technical reliability are unproven."
    whyBelieve: "Independent reporting describes an exposed finance app with customer data, while adjacent AI-security vendors report enterprise traction, indicating a real security problem and reachable buyer category."
    whyDoubt: "The exact rehearsal product has no paid-pilot evidence, and Zenity, Microsoft, Pluto, internal teams, or masked sandboxes may satisfy the same approval need."
    nextDiligence: "Require a paid pilot in which a security engineer validates at least 20 source-backed tasks, observes every required data path, approves the scoped manifest, and agrees to an annual conversion price."
  firstCustomer:
    title: "U.S. enterprise security team reviewing a finance-built AI app"
    profile: "A company with at least 1,000 employees has a formal review for a finance prototype that must query customer, account, or churn records from one CRM or warehouse source."
    trigger: "A security review, exposure, or blocked release reveals that the prototype can reach customer records before its task-specific access boundary is understood."
    buyer: "CISO or VP of security engineering"
    initialContract: "Commercial test hypothesis: a $15,000–$25,000 8-week paid pilot for one app and one source, credited toward a $40,000–$60,000 annual per-workflow subscription plus onboarding if security accepts the evidence; no comparable price or paid pilot was found in research."
  mustBeTrue:
    - "At least five of 20 interviewed target enterprises have a current employee-built finance app in formal security review, and at least two approve a paid pilot of $15,000 or more."
    - "In a 20-task first-connector test, the rehearsal achieves customer-agreed task completion while exposing every required data path and producing zero critical false grants after no more than two remediation cycles."
    - "At least half of completed pilots convert to annual production contracts at $40,000 or more per workflow, with the CISO/security-engineering budget owner identifiable."
    - "By the third customer deployment, source mapping and task setup require no more than 10 engineer-days per app and reuse at least half of the connector-specific mapping or test assets."
    - "In a documented bake-off, target buyers choose the rehearsal evidence over their available native, AI-security, manual, or masked-data process for at least one measurable reason such as shorter review time or narrower approved access."
  diligenceQuestions:
    - "Which buyer owns the budget for a pre-access rehearsal, and can they show a recent app review, current review labor, and a funded pilot path?"
    - "Against production-backed baselines, what task success, critical false-grant, false-denial, and unobserved-call rates does the first connector achieve?"
    - "What source data or metadata must the mapping agent read, where is it processed, how long is it retained, and what privacy approval is required?"
    - "What does Zenity already provide in pre-live permission and exploit-path testing, and what output would a customer pay this product to add?"
    - "How often can Microsoft Power Platform controls or an internal masked sandbox solve the target workflow without a new vendor?"
    - "Across three different customer schemas, which onboarding steps repeat, how many engineer-days remain, and can source-native manifests be safely reviewed or applied?"
operatingAssumptions:
  - assumption: "A meaningful share of target enterprises has a formal review for employee-built finance AI apps, and an active review can create a near-term pilot trigger."
    basis: "research.yaml"
    validationTest: "Interview 20 U.S. enterprises with at least 1,000 employees and verify a named in-review app, review owner, source-data owner, decision date, and pilot authority in at least five accounts."
    decisionImpact: "If fewer than five qualify, stop treating the researched SAM as a reachable beachhead and test a narrower incident-led or platform-led buyer before building broader integrations."
  - assumption: "Task replay on a synthetic tenant can identify a sufficiently complete and narrow source-data scope for the customer's real tasks."
    basis: "operator judgment"
    validationTest: "For 20 customer-approved tasks on one connector, compare replay traces with a security-engineer-reviewed source baseline; record task completion, missed fields, false grants, false denials, and all unobserved calls."
    decisionImpact: "Any unresolved critical false grant or required unobserved path blocks manifest issuance; if it persists after two remediation cycles, abandon the synthetic-rehearsal authorization claim."
  - assumption: "A customer-controlled mapping process can satisfy data-platform, privacy, and security review without persistent vendor access to sensitive production records."
    basis: "research.yaml"
    validationTest: "Before a paid pilot, document data flow, least-privilege credentials, processing location, retention/deletion, tenant isolation, and privacy review; run a customer-approved re-identification and leakage assessment."
    decisionImpact: "If source access or synthetic output cannot be accepted within a customer-controlled boundary, reduce input data further or stop serving that source and segment."
  - assumption: "Buyers will pay $15,000–$25,000 for a bounded pilot and $40,000–$60,000 annually per active workflow."
    basis: "operator judgment"
    validationTest: "Present the same written scope and price to 10 trigger-qualified buyers; count signed paid pilots and annual conversion commitments rather than verbal interest."
    decisionImpact: "If fewer than three of 10 qualified opportunities buy or buyers reject the annual unit, retest whether services, platform bundling, or a different buyer is required before hiring sales."
  - assumption: "The first connector's mapping and task templates can be reused enough to reach acceptable software gross margin."
    basis: "research.yaml"
    validationTest: "Track engineering and implementation hours across three distinct customer environments; separate reusable connector work from customer-specific schema, task, and permission work."
    decisionImpact: "If the third implementation still exceeds 10 engineer-days per app or reuse is below half, narrow supported schemas, reprice onboarding, or stop scaling the standalone subscription."
  - assumption: "Cross-platform finance apps create a differentiated need that native Microsoft controls or AI-security suites do not already meet."
    basis: "research.yaml"
    validationTest: "Run a side-by-side output review with at least five target buyers using one candidate app; document existing controls, missing task-to-field evidence, buyer-selected alternative, and a measurable decision-time or scope difference."
    decisionImpact: "If existing controls satisfy the review, focus only on cross-platform apps with a demonstrated gap or partner/bundle rather than compete for a redundant governance budget."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Conduct structured discovery with 20 target accounts and request a redacted recent approval workflow, review duration, budget owner, and decision deadline."
    hypothesis: "A named finance-app review creates a time-bound problem owned by security engineering rather than a general shadow-AI concern without budget."
    successMetric: "At least five accounts show a current named review with a decision inside 90 days; at least two identify a paid-pilot approval path."
    owner: "CEO/product founder"
  - horizon: "0–90 days"
    experiment: "Build a throwaway single-connector replay with customer-approved test tasks and compare it to a source-backed baseline for 20 finance workflows."
    hypothesis: "A schema-shaped synthetic tenant can reproduce useful task behavior and produce complete read-path traces for one bounded connector."
    successMetric: "Customer reviewers accept task outcomes and observe all required paths, with zero critical false grants after at most two remediation cycles."
    owner: "Founding engineer"
  - horizon: "0–90 days"
    experiment: "Design a customer-controlled data-flow and threat model; test mapping, retention, isolation, and synthetic-output privacy with one design partner's privacy and data owners."
    hypothesis: "A bounded, documented mapping process can pass source-access review without assuming synthetic records are automatically anonymous."
    successMetric: "Written approval for a pilot architecture with named credentials, processing boundary, retention/deletion terms, and no unresolved critical privacy finding."
    owner: "Founding security/product lead"
  - horizon: "3–6 months"
    experiment: "Offer the fixed one-app/one-source pilot to 10 trigger-qualified accounts at the stated pilot-price range."
    hypothesis: "Security buyers will fund a measurable release gate when it unblocks a named workflow and reduces manual review or overgranting."
    successMetric: "At least three signed paid pilots at $15,000 or more; record pilot start delay, completion, acceptance, and annual conversion decision."
    owner: "CEO/product founder"
  - horizon: "3–6 months"
    experiment: "Run a buyer-led bake-off against the customer's current Microsoft/native policies, AI-security tooling, and manual or masked-data process."
    hypothesis: "The task-to-field evidence changes an approval decision beyond inventory, posture assessment, or connector allowlisting."
    successMetric: "At least three of five participating buyers identify a measurable advantage and select the rehearsal output as an input to an actual approval."
    owner: "Founding security/product lead"
  - horizon: "6–12 months"
    experiment: "Repeat source mapping and task authoring across three independent customer environments on the first connector."
    hypothesis: "Common schema and permission patterns can be templated without sharing customer records, lowering implementation labor per deployment."
    successMetric: "By customer three, setup is at most 10 engineer-days per app and at least half of connector-specific mapping/test assets are reusable."
    owner: "Integration engineer"
  - horizon: "12–18 months"
    experiment: "Pilot one referral or implementation motion with a CRM, warehouse, identity, or security integrator after direct deployments establish a repeatable setup."
    hypothesis: "A trusted partner can introduce qualified reviews and deliver mapping without increasing support burden or eroding unit economics."
    successMetric: "One partner sources two qualified opportunities and completes one implementation within the measured direct-delivery effort."
    owner: "CEO/product founder"
operations:
  - "Keep initial deployment U.S.-only and customer-controlled; document each credential, data field, processing location, retention period, deletion path, and customer approval."
  - "Use synthetic-data vendors or platform components where suitable; independently test utility and privacy because generated records are not presumed anonymous."
  - "Maintain a fail-closed connector allowlist; record task inputs, observed reads, missing coverage, test versions, proposed permissions, approver, expiry, and change-review history."
  - "Separate one-time mapping labor from recurring software usage; track engineer-days and template reuse per customer before setting onboarding fees or scaling partner delivery."
  - "Obtain customer security, privacy, data-platform, and procurement sign-off before any source-backed evaluation; defer EU financial buyers until supplier assurance is ready."
team:
  - role: "Founding eng"
    startTiming: "Month 0"
    rationale: "Own the customer-controlled mapping agent, connector instrumentation, synthetic task replay, fail-closed behavior, and secure tenant architecture."
  - role: "Founding product/security lead"
    startTiming: "Month 0"
    rationale: "Run buyer discovery and security design reviews, define customer-approved tasks and false-grant thresholds, and lead founder-led pilots."
  - role: "Data/connector engineer"
    startTiming: "Month 3, conditional on a design partner"
    rationale: "Productize the first CRM or warehouse mapping only after a partner supplies an approved schema and tasks; defer a second connector until first-connector reuse is measured."
  - role: "Applied test-data engineer"
    startTiming: "Month 6, conditional on fidelity evidence"
    rationale: "Build task and edge-case suites and evaluate utility/privacy only if the initial connector shows reproducible false-grant and coverage measurements."
  - role: "Enterprise account executive"
    startTiming: "Month 9, conditional on two accepted paid pilots"
    rationale: "Scale a proven founder-led approval workflow and buyer process; do not hire quota capacity before pilot pricing and annual conversion are demonstrated."
milestones:
  - horizon: "0–12 months"
    items:
      - "Complete 20 target-account interviews and document at least five active app reviews with a named security buyer and source owner."
      - "Demonstrate one connector with 20 customer-approved replay tasks, complete required-path observability, and zero critical false grants after at most two remediation cycles."
      - "Secure at least three paid pilots at $15,000 or more, each with a written success baseline and customer-approved data-flow boundary."
      - "Convert at least half of completed pilots to annual production contracts at $40,000 or more, or revisit the buyer, price, and unit of value."
  - horizon: "12–24 months"
    items:
      - "Reach three independent deployments with no more than 10 engineer-days of setup per app and at least 50% reuse of connector-specific mapping/test assets."
      - "Add a second source connector only after the first connector passes the reuse gate; retain human approval and fail-closed manifest generation."
      - "Document renewal intent, actual review-time change, false-grant/denial performance, and a path toward 70% gross margin before broad sales hiring."
      - "Test one integrator referral channel after direct delivery effort and support burden are measured."
  - horizon: "24–36 months"
    items:
      - "Expand U.S. production use across multiple app workflows and a small number of validated CRM/warehouse patterns only if retention and paid expansion support repeatability."
      - "Apply manifests automatically only on source systems with verified entitlement APIs, rollback, change auditing, and customer approval."
      - "Enter a new regulated geography or broader agent-security category only after security assurance, privacy boundaries, connector economics, and customer demand are evidenced."
risks:
  - risk: "Synthetic rehearsal misses production-only joins or edge cases and creates a false sense of safe access."
    likelihood: "High"
    impact: "High"
    mitigation: "Compare against customer-reviewed source behavior, add customer-authored edge cases, publish coverage and confidence limits, and withhold a complete manifest on any critical miss."
  - risk: "Uninstrumented connectors or hidden tool calls make the observed data scope incomplete."
    likelihood: "High"
    impact: "High"
    mitigation: "Support one instrumented connector first, block unsupported calls, and issue no production-scope recommendation when any relevant path cannot be observed."
  - risk: "Source mapping and privacy review require sensitive production-data access that buyers will not approve."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Use a customer-controlled mapper, minimize inputs, document retention and deletion, test re-identification risk, and obtain privacy/data-owner approval before external pilots."
  - risk: "Zenity, Pluto, Microsoft, internal tooling, or masked staging solves enough of the problem to prevent a distinct budget."
    likelihood: "High"
    impact: "High"
    mitigation: "Run buyer-led bake-offs and require demonstrated review-time or access-scope improvement; narrow to cross-platform workflows with an explicit gap rather than claiming competitor absence."
  - risk: "Enterprise onboarding and procurement make the product a low-margin service before recurring use is proven."
    likelihood: "High"
    impact: "High"
    mitigation: "Gate hiring and connector expansion on three paid deployments, track labor by implementation step, price mapping separately, and stop or repackage if setup exceeds 10 engineer-days per app."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "An 18-month pre-seed target to ship the single-connector MVP, validate task fidelity and privacy boundaries, complete three to five paid enterprise pilots, productize repeatable mapping, prepare vendor-security evidence, and establish pilot-to-annual conversion before broader connector or sales expansion."
