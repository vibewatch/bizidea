slug: shadow-data-rehearsal
date: "2026-10-17"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: 模型周期
    value: "起始于 2026-10，共 36 个月"
    unit: month
    source: "[business-plan.yaml date；财务模型规划惯例]"
  - id: A2
    name: 起始生产客户数
    value: "0"
    unit: active workflows
    source: "[business-plan.yaml investorMemo 和 research.yaml willingnessToPay：目前没有针对该特定工作流的付费试点或生产客户证据]"
  - id: A3
    name: 年度订阅 ARPU
    value: "50.0"
    unit: K USD/每个工作流/每年
    source: "[business-plan.yaml gtm.pricing：采用年度工作流订阅价格假设 $40K-$60K 的中点；不含一次性映射费，也不含可抵扣年度订阅费的试点回款]"
  - id: A4
    name: 客户新增节奏
    value: "M10 和 M12 各新增 1 个生产工作流，此后从 Q1Y2 到 Q4Y3 每季度开始时新增 1 个"
    unit: customers by period
    source: "[business-plan.yaml gtm.funnelTargets 和 milestones：至少 3 个付费试点、试点完成后转化率达到 50% 都是目标而非已观察结果；每季度拿下生产客户是运营节奏假设]"
  - id: A5
    name: 月度客户流失率
    value: "1.5"
    unit: percent
    source: "[B2B SaaS 初创公司财务规划经验值，并非观测基准；由于没有留存分群数据，按上期客户数计算；流失率敏感性区间为 0.75%-3.0%]"
  - id: A6
    name: 收入、客户数与现金确认方式
    value: "月收入等于 customersEop 乘以年度 ARPU 再除以 12；季度收入为各月客户月收入之和。新增客户从指定月份月初开始计入；customersEop 按上期客户数扣除流失、加上新增客户后滚动计算。现金回款和运营支出均在当期结算"
    unit: formula
    source: "[business-plan.yaml businessModel.revenueStreams；未提供付款条款和营运资金数据，因此假设现金在同一期间结算，以简化规划模型]"
  - id: A7
    name: 毛利率爬坡
    value: "Y1 为 60%，Y2 为 65%，Y3 为 70%"
    unit: percent by year
    source: "[business-plan.yaml businessModel.targetGrossMarginPct：目标为 70%；连接器复用和实施工作量尚未得到验证，因此前期毛利率折让是基于初创公司交付成本的经验假设]"
  - id: A8
    name: 年度全口径现金薪酬
    value: "创始工程师 180；创始产品/安全负责人 180；数据/连接器工程师 170；应用测试数据工程师 165；企业客户销售 150；客户实施工程师 165；连接器/平台工程师 170"
    unit: K USD/FTE/年
    source: "[初创公司财务薪酬规划经验假设：按美国早期团队的全口径现金成本估算并取整，并非薪资调查数据；模型未计入股权费用]"
  - id: A9
    name: 招聘安排与人数门槛
    value: "初始配置 2 位创始人；M4 招聘数据/连接器工程师；M7 招聘应用测试数据工程师；获得两个已获认可的付费试点后，于 M10 招聘企业客户销售；Y2 不招聘；完成 3 次部署后，于 M31 招聘客户实施工程师；有可重复交付的证据后，于 M34 招聘连接器/平台工程师"
    unit: FTE 时间安排
    source: "[business-plan.yaml team、sequencingRationale 和 12-24/24-36 个月里程碑；Y1 之后的岗位均为有条件的规划招聘]"
  - id: A10
    name: 非薪酬销售与市场费用
    value: "Y1 每月费用：M1-M3 为 2，M4-M6 为 3，M7-M9 为 4，M10-M12 为 5；Y2 每季度 20；Y3 每季度 25"
    unit: K USD
    source: "[business-plan.yaml gtm：创始人主导直销，在转化得到验证前不大规模付费获客；初创公司财务运营成本规划经验假设]"
  - id: A11
    name: 非薪酬研发费用
    value: "Y1 每月费用：M1-M3 为 10，M4-M6 为 12，M7-M9 为 14，M10-M12 为 16；Y2 每季度 30；Y3 每季度 35"
    unit: K USD
    source: "[business-plan.yaml product、operations 和 experimentRoadmap：用于开发一个连接器和测试数据组件，并开展任务验证与安全测试；初创公司财务运营成本规划经验假设]"
  - id: A12
    name: 非薪酬管理及行政费用
    value: "Y1 每月费用：M1-M3 为 8，M4-M9 为 6，M10-M12 为 8；Y2 每季度 20；Y3 每季度 25"
    unit: K USD
    source: "[business-plan.yaml operations 和 risks：用于隐私、法律、保险、采购及供应商安全准备；初创公司财务运营成本规划经验假设]"
  - id: A13
    name: 现金融资与预测期限
    value: "M1 获得 2,500.0 的 pre-seed 初始融资款；36 个月现金预测中不计后续融资"
    unit: K USD
    source: "[business-plan.yaml fundingAsk：pre-seed 目标融资区间为 $2M-$4M，目标现金跑道为 18 个月；所选金额是该区间内的一种情景]"
  - id: A14
    name: 融资需求与六个月缓冲
    value: "$2.50M 融资额用于覆盖截至第 18 个月里程碑的累计净烧钱约 $1,388K、随后六个月缓冲所需的 $482K，以及应对企业采购或付款延迟的剩余应急资金"
    unit: USD
    source: "[根据 A6-A13 现金预测和 business-plan.yaml fundingAsk 推算；六个月缓冲按模型中的 Q3Y2-Q4Y2 净烧钱取整为 $0.5M]"
  - id: A15
    name: CAC 计算
    value: "60.0"
    unit: K USD/每次新增生产客户成交
    source: "[根据 A4、A8 和 A10 推算：Y2-Y3 企业客户销售薪酬与非薪酬销售及市场费用共 $480K，除以 8 次新增生产客户成交；不含创始人投入的销售时间]"
  - id: A16
    name: LTV 计算
    value: "年度 ARPU 乘以 70% 目标毛利率后除以 12，再除以 1.5% 月度流失率"
    unit: formula
    source: "[根据 A3、A5 和 A7 推算；这是简单的稳态 SaaS 规划经验算法，并非实际观测到的留存率或已实现的客户生命周期价值]"
  - id: A17
    name: 情景与敏感性区间
    value: "下行情景的客户新增量比基准低 50%；上行情景高 50%；ARPU +/-20%；流失率 0.75%-3.0%；毛利率上下浮动 10 个百分点；CAC 为 45-90；招聘时间前后调整两个季度"
    unit: scenario ranges
    source: "[运营方围绕 A3-A12 设定的压力测试；目前没有经过验证的转化率、流失率、CAC 或实施成本分布数据]"
  - id: A18
    name: 未纳入的收入与现金项目
    value: "模型未计入单独的付费试点收入、映射/客户导入费用、税费、利息、资本支出、债务或后续股权融资款"
    unit: scope
    source: "[business-plan.yaml gtm.pricing 和 businessModel.revenueStreams：试点费用可抵扣年度订阅费，客户导入另行收费，但收费时间和实际回款金额尚未验证]"
