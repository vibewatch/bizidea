modelSanity:
  - checkName: 收入引擎
    finding: "按年度工作流 ARPU $50K 计算，基准情景期末工作流数增至 8.0 个；Y3 客户月订阅收入为 $357.14K。"
  - checkName: 必须跑通的环节
    finding: "模型假设 Y1 前两次生产成交后每季度再新增一次生产客户转化、月度流失率为 1.5%，毛利率沿路径升至 70%；这些假设均未验证。"
  - checkName: 模型失速点
    finding: "客户新增节奏降低 50%，Y3 收入会减少 $178.57K，模型现金最低点将降至 -$627.23K。"
  - checkName: 下一轮融资所需验证
    finding: "第 18 个月的 pre-seed 里程碑包括：验证一个连接器、完成三个付费试点、严重误授权为零、试点转年度订阅转化率至少达到 50%，并留有六个月现金缓冲。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 72.4% + EBITDA 利润率 -296.8% = -224.4%，远低于 40%；公司仍处于高投入阶段。"
  burnMultiple: "Y3 净烧钱 $1,060K 除以约 $137.8K 的净新增 ARR，得到 7.7x；这是规模化前效率不佳的信号。"
  revenuePerFte: "Y3 收入 $357K 除以期末 7 名 FTE，约为每名 FTE $51K；团队规模跑在已验证的业务规模前面。"
  flags:
    - "若无后续融资，现金到 Q3Y3 转负，到 Q4Y3 降至 -$429.92K；必须在现金转负前完成新一轮融资或重设成本。"
    - "Y3 EBITDA 为 -$1,060K，Rule of 40 约为 -224.4%；这是一份验证阶段计划，而非可自我供血的增长方案。"
    - "Y3 期末每名 FTE 的收入仅约 $51K；应守住既定招聘门槛，先证明付费扩张可以重复，再增加交付能力。"
    - "LTV:CAC 为 3.24x，CAC 回收期为 20.57 个月；两项指标都依赖经验假设的流失率和 CAC，而非实际客户留存队列或已验证的转化率。"
    - "BP 提出收取付费试点费和映射费，但模型未计入单独的试点及客户导入收入；实际现金回款和服务利润率可能有显著差异。"
