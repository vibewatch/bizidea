modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Review["Named security review"] --> Pilot["Paid one-app pilot"]
      Pilot --> Replay["One-source task replay"]
      Replay --> Workflow["Annual workflow subscription"]
      Workflow --> GrossProfit["Recurring gross profit"]
      GrossProfit --> Cash["Runway and next milestone"]
modelSanity:
  - checkName: Revenue engine
    finding: "At $50K annual workflow ARPU, the base case grows to 8.0 ending workflows and $357.14K of Y3 revenue from customer-month subscription revenue."
  - checkName: Must go right
    finding: "The model depends on one gross production conversion per quarter after the first two Y1 wins, 1.5% monthly churn, and a path to 70% gross margin, none of which is validated."
  - checkName: Model breaks if
    finding: "A 50% lower customer-addition pace cuts Y3 revenue by $178.57K and pushes the modeled cash low point to -$627.23K."
  - checkName: Next-round proof
    finding: "The month-18 pre-seed milestone is one validated connector, three paid pilots, zero critical false grants, at least 50% pilot-to-annual conversion, and six months of cash buffer."
sanityChecks:
  ruleOf40: "Y3 revenue growth 72.4% + EBITDA margin -296.8% = -224.4%, well below 40% because the company remains in a heavy investment phase."
  burnMultiple: "Y3 net burn of $1,060K divided by approximately $137.8K net new ARR equals 7.7x, a poor pre-scale efficiency signal."
  revenuePerFte: "Y3 revenue of $357K divided by 7 ending FTE equals approximately $51K per FTE, reflecting a team ahead of validated scale."
  flags:
    - "Cash turns negative in Q3Y3 and reaches -$429.92K by Q4Y3 without a follow-on financing; a new round or cost reset is required before that point."
    - "Y3 EBITDA is -$1,060K and Rule of 40 is approximately -224.4%, so this is a validation-stage plan rather than a self-funding growth case."
    - "Y3 revenue per ending FTE is only about $51K; maintain the stated hire gates and require repeatable paid expansion before adding capacity."
    - "LTV:CAC of 3.24x and 20.57-month CAC payback rely on heuristic churn and CAC inputs, not observed customer cohorts or validated conversion."
    - "Standalone pilot and onboarding revenue is excluded even though the BP proposes paid pilots and mapping fees; actual cash and service margins may differ materially."
