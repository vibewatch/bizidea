slug: shadow-data-rehearsal
date: "2026-10-17"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Model period
    value: "2026-10 start; 36 monthly periods"
    unit: month
    source: "[business-plan.yaml date; financial-model planning convention]"
  - id: A2
    name: Starting production customers
    value: "0"
    unit: active workflows
    source: "[business-plan.yaml investorMemo and research.yaml willingnessToPay: no paid-pilot or production-customer evidence for this exact workflow]"
  - id: A3
    name: Annual subscription ARPU
    value: "50.0"
    unit: K USD per workflow per year
    source: "[business-plan.yaml gtm.pricing: midpoint of the $40K-$60K annual workflow subscription hypothesis; excludes one-time mapping fees and pilot receipts credited toward annual subscriptions]"
  - id: A4
    name: Gross customer-addition pace
    value: "1 gross production workflow in M10 and M12, then 1 at the start of each quarter from Q1Y2 through Q4Y3"
    unit: customers by period
    source: "[business-plan.yaml gtm.funnelTargets and milestones: at least 3 paid pilots and 50% completed-pilot conversion are goals, not observations; quarterly production wins are an operator pacing assumption]"
  - id: A5
    name: Monthly customer churn
    value: "1.5"
    unit: percent
    source: "[B2B SaaS startup-finance planning heuristic, not an observed benchmark; applied to the prior-period customer base because no retention cohorts exist; churn sensitivity spans 0.75%-3.0%]"
  - id: A6
    name: Revenue, customer, and cash recognition
    value: "Monthly revenue equals customersEop times annual ARPU divided by 12; quarterly revenue is the sum of monthly customer-month revenue; gross additions start at the beginning of their indicated month; customersEop rolls forward as prior customers less churn plus new customers; cash receipts and operating payments settle in-period"
    unit: formula
    source: "[business-plan.yaml businessModel.revenueStreams; payment terms and working-capital data are not supplied, so same-period cash settlement is a simplifying planning assumption]"
  - id: A7
    name: Gross-margin ramp
    value: "60% in Y1, 65% in Y2, and 70% in Y3"
    unit: percent by year
    source: "[business-plan.yaml businessModel.targetGrossMarginPct: 70% target; earlier-year discounts are a startup-finance delivery-cost heuristic because connector reuse and implementation effort are unproven]"
  - id: A8
    name: Fully loaded annual cash compensation
    value: "Founding engineer 180; founding product/security lead 180; data/connector engineer 170; applied test-data engineer 165; enterprise account executive 150; customer implementation engineer 165; connector/platform engineer 170"
    unit: K USD per FTE per year
    source: "[Startup Finance Compensation Planning Heuristic: rounded fully loaded early-stage U.S. cash-cost allowances, not salary-survey facts; no equity expense modeled]"
  - id: A9
    name: Hiring schedule and headcount gates
    value: "2 founders at start; data/connector engineer M4; applied test-data engineer M7; account executive M10 after two accepted paid pilots; no Y2 hires; customer implementation engineer M31 after 3 deployments; connector/platform engineer M34 after repeatability evidence"
    unit: FTE timing
    source: "[business-plan.yaml team, sequencingRationale, and 12-24/24-36 month milestones; post-Y1 roles are conditional planning hires]"
  - id: A10
    name: Non-salary sales and marketing expense
    value: "Y1 monthly 2 for M1-M3, 3 for M4-M6, 4 for M7-M9, and 5 for M10-M12; Y2 20 per quarter; Y3 25 per quarter"
    unit: K USD
    source: "[business-plan.yaml gtm: founder-led direct sales and no broad paid demand generation before conversion proof; Startup Finance Operating-Cost Planning Heuristic]"
  - id: A11
    name: Non-salary research and development expense
    value: "Y1 monthly 10 for M1-M3, 12 for M4-M6, 14 for M7-M9, and 16 for M10-M12; Y2 30 per quarter; Y3 35 per quarter"
    unit: K USD
    source: "[business-plan.yaml product, operations, and experimentRoadmap: one connector, test-data components, task validation, and security testing; Startup Finance Operating-Cost Planning Heuristic]"
  - id: A12
    name: Non-salary general and administrative expense
    value: "Y1 monthly 8 for M1-M3, 6 for M4-M9, and 8 for M10-M12; Y2 20 per quarter; Y3 25 per quarter"
    unit: K USD
    source: "[business-plan.yaml operations and risks: privacy, legal, insurance, procurement, and vendor-security preparation; Startup Finance Operating-Cost Planning Heuristic]"
  - id: A13
    name: Cash financing and financing horizon
    value: "2,500.0 initial pre-seed proceeds at M1; no follow-on financing is included in the 36-month cash forecast"
    unit: K USD
    source: "[business-plan.yaml fundingAsk: pre-seed target range $2M-$4M and 18-month runway; selected amount is a scenario within the stated range]"
  - id: A14
    name: Funding need and six-month buffer
    value: "$2.50M ask covers approximately $1,388K cumulative net burn through the month-18 milestone, $482K for the following six-month buffer, and residual contingency for enterprise procurement or payment delay"
    unit: USD
    source: "[Derived from A6-A13 cash forecast and business-plan.yaml fundingAsk; six-month buffer is the modeled Q3Y2-Q4Y2 net burn rounded to $0.5M]"
  - id: A15
    name: CAC calculation
    value: "60.0"
    unit: K USD per gross production win
    source: "[Derived from A4, A8, and A10: Y2-Y3 account-executive payroll plus non-salary sales and marketing spend of $480K divided by 8 gross wins; excludes founder selling time]"
  - id: A16
    name: LTV calculation
    value: "Annual ARPU times 70% target gross margin divided by 12, then divided by 1.5% monthly churn"
    unit: formula
    source: "[Derived from A3, A5, and A7; simple steady-state SaaS planning heuristic, not observed retention or realized lifetime value]"
  - id: A17
    name: Scenario and sensitivity ranges
    value: "Downside customer additions 50% below base; upside 50% above base; ARPU +/-20%; churn 0.75%-3.0%; gross margin +/-10 percentage points; CAC 45-90; hiring timing varied by two quarters"
    unit: scenario ranges
    source: "[Operator-defined stress tests around A3-A12; no validated conversion, churn, CAC, or implementation-cost distributions are available]"
  - id: A18
    name: Excluded revenue and cash items
    value: "No standalone paid-pilot revenue, mapping/onboarding fees, taxes, interest, capital expenditure, debt, or follow-on equity proceeds are modeled"
    unit: scope
    source: "[business-plan.yaml gtm.pricing and businessModel.revenueStreams: pilot fees are credited toward annual subscription and onboarding is separately priced, but timing and collected amounts are unvalidated]"
