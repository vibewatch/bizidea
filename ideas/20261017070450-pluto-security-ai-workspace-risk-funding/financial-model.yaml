    cashLowPointK: -627.23
    keyAssumptionChanges:
      - "Scale gross new workflow additions to 50% of base in every modeled period."
      - "Hold the base hiring and non-salary operating plan, so lower sales do not automatically reduce burn."
  base:
    description: "The operating forecast uses the base customer-addition, churn, margin, hiring, and cost assumptions above."
    y3RevenueK: 357.14
    y3EbitdaK: -1060.0
    cashLowPointK: -429.92
    keyAssumptionChanges:
      - "Use the main forecast without further changes."
