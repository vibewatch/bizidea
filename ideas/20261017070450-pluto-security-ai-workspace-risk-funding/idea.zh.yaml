qualityPolicyVersion: 2
slug: shadow-data-rehearsal
date: '2026-10-17'
sector: ai-infra
pitch: 让员工自建的 AI 应用先在贴近生产环境的合成记录上演练，只让通过测试的工作流接入范围受限的真实数据。
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: >-
    员工自建的 AI 应用先在私有合成数据副本上跑通真实工作流，证明可行后才获得范围严格受限的真实记录访问权限。相比上线后再查数据暴露，这种前置干预更有辨识度。
  acceptedTradeoff: >-
    逼真的合成数据副本难以构建，也可能漏掉少见的生产环境行为。首批部署需要映射数据源，并为每款应用单独设计测试。
originalityAudit:
  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
  rejectedCliches:
    - 通用 AI 助手，指导员工安全使用工具
    - 只盘点智能体和连接器、再配上告警的仪表盘
    - 试图取代现有终端与身份控制的泛化 AI 安全平台
    - 靠目录广度而非更安全的数据访问创造价值的经审核智能体市场
  rareMechanism: >-
    建立一个忠实匹配数据 schema 的合成演练租户，记录员工自建应用完成获批任务时实际需要哪些字段，再把观察到的访问路径转成受限的生产环境权限清单。
  nearestHistoricalIdeas:
    - slug: crm-resume-packet-compiler
      similarity: mechanism
      decisiveDifference: >-
        两者都在重要工作恢复前让应用行为清晰可见；但历史方案是在故障后安全恢复 Salesforce，本方案则在新应用首次接入生产环境前用合成数据测试其行为。
    - slug: physics-change-test-gate
      similarity: mechanism
      decisiveDifference: >-
        两者都在发布前设置测试关卡，但历史方案会针对硬件几何结构的改动重放热工况；这个方案演练 AI 应用的数据访问路径，并据此生成范围受限的权限。
    - slug: clinical-replay-change-gates
      similarity: job
      decisiveDifference: >-
        两者都在软件发布前提供证据；历史方案用锁定的临床队列验证医疗器械模型更新，本方案则在内部应用原型开发阶段保护企业客户记录。
