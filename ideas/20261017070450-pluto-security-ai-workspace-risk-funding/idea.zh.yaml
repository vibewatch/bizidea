problem: >-
  员工搭建或深度定制的 AI 工具可能先接触企业数据，安全团队却还不清楚每款应用究竟需要什么。TechCrunch 报道，一名财务员工的内部应用存在暴露问题，里面存有客户信息和客户流失数据。Pluto 各客户检测到的风险中，约 60% 出现在非开发者搭建的工具里。团队需要先验证工作流是否有用，同时避免让未经证实的应用广泛读取真实记录。
targetUser:
  primary: >-
    企业安全工程负责人，负责审核财务和运营员工自建或定制的内部 AI 应用；这些应用需要访问 CRM、SaaS 或数据仓库中的数据。
  secondary: >-
    正在试做内部 AI 应用的财务和运营员工，以及负责配置其连接器的应用或数据平台负责人。
  buyer: CISO 或安全工程副总裁
startupThesis:
  nonObviousInsight: >-
    最关键的安全决策也许发生在员工自建应用拿到生产环境凭证之前：让应用用合成记录演练实际任务，可以找出跑通工作流所需的最小数据访问路径，不必只靠资产盘点或上线后的策略管控。
  beachhead: >-
    美国企业中负责审核员工自建内部应用的安全团队，先从查询 CRM 或数据仓库内客户、账户或流失信息的财务原型切入。
  wedge: >-
    为一个员工自建应用和一个数据源提供托管式合成数据演练，在批准前产出经过测试的任务轨迹和按字段限定的生产环境访问清单。
  whyNowCatalyst: >-
    这组信号既记录了非开发者自建工具在已报告风险中的占比，也披露了一款存在暴露问题、存有客户信息和客户流失数据的员工应用。
  ventureScalePath: >-
    从财务团队自建的应用和单一数据源起步，逐步扩展到员工创建的 AI 应用，以及横跨 SaaS、云和数据仓库系统的智能体工作流；再向企业安全团队销售可复用的演练策略和访问清单。
solution: >-
  将候选应用接入预演租户，按获批数据源复刻 schema、关系和策略标签，同时把客户数据值替换成合成记录。安全团队和应用负责人先定下少量任务，再在预演租户中重放，查看工作流实际用到哪些字段和连接器。随后生成可审计的访问清单，仅允许生产应用访问经过测试的数据范围，并设置有效期和变更复核流程。首个 CRM 或数据仓库连接先由团队手把手配置；如果无法可靠观察应用行为或其所需数据源，应用就继续留在演练阶段。
goToMarketSeed:
  firstCustomer: >-
    正在审核员工自建财务应用、且需要让它使用含客户信息的 CRM 或数据仓库的企业安全工程团队。
  buyingTrigger: >-
    安全审查或安全事件暴露出：内部 AI 原型能接触客户数据，但所需权限尚未划定清楚。
  currentAlternative: >-
    手工安全问卷、临时制作的脱敏测试数据集、电子表格权限审查，以及智能体盘点或运行时策略工具。
  switchingReason: >-
    演练让应用负责人看清哪些任务能在合成记录上跑通，也让安全团队在开放真实数据前先审一份权限范围更窄的方案。
  pricingHypothesis: >-
    按正在审核的活跃应用工作流收取年度订阅费；数据源映射另收一次性接入费。
whyNow:
  - point: >-
      Pluto 的 CEO 告诉 TechCrunch，在 Pluto 各客户检测到的风险中，约 60% 出现在非开发者搭建或深度定制的工具里。由此，非开发者搭建者成为明确的首发服务对象。
