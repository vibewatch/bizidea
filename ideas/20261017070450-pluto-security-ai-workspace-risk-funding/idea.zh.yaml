    signalRefs:
      - 概念验证部署发现了恶意组件
    sourceRefs:
      - 2
  - point: >-
      Pluto 宣布累计融资 $42 million，并称其平台保护的终端超过 1.5 million 个。这些公司自报数据说明，专门面向企业的 AI 安全产品正吸引投资并进入部署。
    signalRefs:
      - 企业 AI 安全赛道已有获得融资的新玩家
    sourceRefs:
      - 1
  - point: >-
      SiliconANGLE 介绍了覆盖员工终端、云基础设施和 SaaS 的智能体梳理能力，以及可暂停或重定向高风险工作流的策略控制，展现了安全团队需要考虑的环境范围。
    signalRefs:
      - 安全覆盖员工、云和 SaaS 环境
    sourceRefs:
      - 3
differentiator: >-
  现有盘点和运行时控制能帮助安全团队发现或限制 AI 工具；这个方案则让每款员工自建应用在首次接入生产环境前先安全演练。核心交付不是又一张风险仪表盘，而是一份依据应用在合成记录上的实际行为推导、经过任务测试且限定到字段级别的访问清单。前期接入需要先投入数据映射，才能让这道发布关卡适用于非开发者搭建的应用。
conceptDiagram:
  title: 接入真实数据前先演练
  mermaid: |
    flowchart LR
      Employee["Employee-built AI app"] --> Twin["Synthetic data twin"]
      Security["Security reviewer"] --> Replay["Task rehearsal"]
      Twin --> Replay
      Replay --> Manifest["Tested access manifest"]
      Manifest --> Live["Scoped live data access"]
businessModelCanvas:
  customerSegments:
    - 批准员工自建 AI 应用访问敏感业务数据的企业安全团队
    - 试做内部 AI 工作流的财务和运营团队
  valuePropositions:
    - 授予生产环境访问权限前，先用合成记录测试真实应用任务
    - 把观察到的数据需求整理成可审查、范围受限的访问清单
  channels:
    - 由内部应用审核触发，直接向 CISO 和安全工程团队销售
    - 安全与数据平台实施合作伙伴
  customerRelationships:
    - 首次梳理数据源和应用时提供高触达接入服务
    - 为每个活跃应用持续提供策略和演练支持
  revenueStreams:
    - 按活跃应用工作流收取年度订阅费
    - 一次性收取数据源接入和配置费用
  keyResources:
    - 合成数据生成和 schema 映射方法
    - 安全预演环境与任务重放软件
    - 企业连接器和权限清单模板
  keyActivities:
    - 将获批应用任务映射到数据源 schema 和合成记录
    - 重放工作流，生成遵循最小权限原则的访问方案
    - 维护数据源连接器、策略模板和审计证据
  keyPartners:
    - 企业身份、CRM、SaaS 和数据仓库供应商
    - 支持内部 AI 应用审核的安全集成商
  costStructure:
    - 连接器开发和安全租户运维
    - 数据模型梳理和客户接入人力
    - 安全保障、销售和持续支持
jobsToBeDone:
  - job: >-
      财务员工提交内部 AI 应用审核时，帮助安全工程师确认应用需要哪些客户数据，让他们既能批准有用的工作流，又不必开放广泛的生产环境访问权限。
    currentAlternative: 临时搭建沙盒数据集，再手工配置权限并用电子表格审核
    successMetric: 已审核的应用工作流中，通过演练并获得有限数据访问权限的比例
  - job: >-
      员工原型使用 CRM 或数据仓库连接器时，帮助应用负责人用合成记录测试代表性任务，让他们在申请真实凭证前发现数据或逻辑缺口。
    currentAlternative: 用样例导出数据测试，或直接对照生产环境数据副本测试
    successMetric: 从首次安全审查到可复现的获批任务重放所需时间
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      这个方案把贴近生产环境的合成数据用作接入前演练环境，并据此生成贴合具体工作流的权限清单；它不是独立的测试数据产品，也不是风险仪表盘。
  venturePotential:
    score: 4
    rationale: >-
      滩头市场可扩展到更多内部 AI 应用和企业数据源，但这组信号只证明安全问题紧迫，尚未证明买家会持续为这款具体产品编列预算。
  whiteSpace:
    score: 4
    rationale: >-
      完整历史索引中没有面向员工 AI 安全的演练产品；但考虑到现有厂商实力和更广泛的安全领域新玩家，不能据此宣称市场毫无竞争。
  painIntensity:
    score: 4
    rationale: >-
      入选信号记录了一款存在暴露问题、存有客户信息和客户流失数据的员工自建应用，也提及概念验证部署中的恶意组件或正在发生的攻击。
  wedgeClarity:
    score: 4
    rationale: >-
      首个场景足够具体：从一款财务团队自建应用、一个 CRM 或数据仓库数据源以及接入前演练切入；但逼真的合成数据环境仍然难搭建。
  evidenceFit:
    score: 4
    rationale: >-
      独立报道支持这一风险机制和员工自建应用案例，但这组信号没有直接证明买家需要合成数据演练或愿意为此付费。
topRisks:
  - name: 合成数据遗漏真实行为
    description: >-
      合成数据副本可能复现不了罕见的记录间关联或边界情况，让安全团队对应用在生产环境中的行为过度放心。
    mitigation: >-
      从客户认可的任务案例起步；除非测试覆盖率和数据行为达到明确的审核门槛，否则继续阻止真实数据访问。
  - name: 无法完整观察应用行为
    description: >-
      不受支持的连接器或绕过中间层的工具调用可能跳过演练，导致生成的访问范围清单不完整。
    mitigation: >-
      首版仅支持具备观测能力的连接器；只要无法观察到任何相关数据路径，就拒绝生成生产环境访问清单。
  - name: 接入工作挤压软件毛利
    description: >-
      不同客户的数据源 schema、权限和应用惯例各不相同，早期搭建合成租户可能既费钱又耗时。
    mitigation: >-
      首批只支持少数 CRM 和数据仓库模式，再把重复的数据映射整理成可复用配置模板。
