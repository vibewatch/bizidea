differentiator: >-
  Observability vendors tell teams that Salesforce had an incident, backup
  vendors let them restore data, and iPaaS tools retry jobs. This concept
  owns the gap between service restoration and business-safe resumption by
  proving which mutations landed, which duplicated, and which queues still
  need human action. Its defensibility comes from per-workflow journals,
  recovery drills, and a growing corpus of outage-to-resume mappings that
  adjacent tools do not store today.
conceptDiagram:
  title: CRM resume packet flow
  mermaid: |
    flowchart LR
      AdjacentSystems[Adjacent systems and integrations] --> Journal[Write-intent journal]
      SalesforceOutage[Salesforce outage or degraded recovery] --> Reconcile[Reconcile landed state and stalled jobs]
      Journal --> Reconcile
      Reconcile --> Packet[Compile ordered resume packets]
      Packet --> Outcome[Safe replay, clean callbacks, verified restart]
