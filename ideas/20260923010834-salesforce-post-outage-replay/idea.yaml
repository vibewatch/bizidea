jobsToBeDone:
  - job: >-
      When Salesforce comes back from a vendor incident, help the Salesforce
      platform owner prove which records and jobs need replay, so they can
      resume revenue workflows without duplicates or gaps
    currentAlternative: Manual log review, CSV exports, blanket retries, and SI war rooms
    successMetric: Time from vendor recovery to verified resume and rate of duplicate or missing records
  - job: >-
      When customer-facing teams build callback or case backlogs during a CRM
      disruption, help RevOps managers identify exactly which accounts need
      follow-up, so they can protect renewals and SLA trust
    currentAlternative: Spreadsheets pulled from helpdesk, CRM, and inbox queues
    successMetric: Backlog clearance time and percent of affected accounts contacted correctly
  - job: >-
      When leadership asks whether resilience spend is justified, help the CIO
      run repeatable recovery drills, so they can quantify readiness before the
      next vendor outage
    currentAlternative: Tabletop exercises and anecdotal postmortems
    successMetric: Drill completion time and number of critical workflows still lacking proof of safe restart
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      The core unit is a compiled resume packet built from write-intent
      receipts and landed-state proofs, which is rarer than another monitor,
      backup console, or admin assistant.
  venturePotential:
    score: 4
    rationale: >-
      Revenue-critical CRM workflows are sticky and expandable across adjacent
      systems, but the initial category requires trust-building and starts
      narrower than broad observability or backup.
  whiteSpace:
    score: 4
    rationale: >-
      Backup, observability, and integration vendors sit nearby, yet none
      explicitly owns post-recovery proof and selective resume packets today.
  painIntensity:
    score: 4
    rationale: >-
      The aftermath of a CRM outage hits revenue, support, and customer trust,
      although the incidents themselves are episodic rather than daily.
  wedgeClarity:
    score: 5
    rationale: >-
      Starting with a few protected objects, adjacent systems, and callback
      queues makes the first deployment concrete, measurable, and easy to test
      in drills.
  evidenceFit:
    score: 5
    rationale: >-
      The sources explicitly describe paused automations, replayed
      integrations, duplicate or missing records, scheduled-job lag, and
      callback backlogs, which directly match the product wedge.
topRisks:
  - name: Episodic budget pain
    description: Outages are severe but infrequent, so some buyers may defer spend after the immediate fire drill fades.
    mitigation: Sell quarterly recovery drills, resilience scorecards, and audit evidence so the product earns budget between incidents.
  - name: Incomplete mutation coverage
    description: If critical write paths are not journaled, the product can miss the exact replay set buyers expect.
    mitigation: Start with the top three to five workflows, integrate the dominant source systems first, and expose coverage gaps clearly.
  - name: Adjacent incumbent bundling
    description: Backup, iPaaS, or observability vendors could add lighter-weight recovery checks once the category is visible.
    mitigation: Build a deeper cross-system proof ledger, workflow-specific resume packets, and drill data network effects that generic tooling will not have.
