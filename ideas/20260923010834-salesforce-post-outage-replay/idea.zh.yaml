problem: >-
  Salesforce 从供应商宕机里恢复后，营收团队仍然不知道哪些写入已经落地、哪些定时作业卡住了、哪些面向客户的队列还得手工清理。管理员得暂停自动化、重放失败的集成、检查重复或缺失记录，所以最难的活，其实是状态页转绿之后才开始。备份工具能恢复快照，可观测性工具能发现宕机，但两者都给不了 RevOps 一份记录级证明，告诉他们在线 CRM 里到底哪些内容能安全续跑。
targetUser:
  primary: >-
    员工规模在 300-3,000 人的 B2B 软件、服务和金融科技公司里的 Salesforce 平台负责人和 RevOps 主管；这些公司把报价、工单管理或续约工作流跑在 Salesforce 上，并接了至少五个关键集成
  secondary: >-
    负责营收关键职能、管理多 org 的 Salesforce 资产的实施伙伴和内部业务系统团队
  buyer: >-
    营收运营副总裁、业务系统总监或 CIO
startupThesis:
  nonObviousInsight: >-
    最贵的失败，不是宕机本身，而是盲目重启：团队在不知道哪些业务变更真的落地之前，就去重试集成、放开自动化、联系客户。
  beachhead: >-
    第一块滩头市场是中端 B2B 公司：把 Salesforce 当作商机、工单或续约的主系统，最近经历过一两次供应商事故，并且至少有一条回呼负担很重的客户工作流，比如支持工单受理或报价审批
  wedge: >-
    切口是一套托管导入 + 软件层：把最关键的几个相邻系统里的预期变更记成日志，核对少数关键 Salesforce 对象的实际落地状态，再在事故后编出按顺序执行的恢复包
  whyNowCatalyst: >-
    Dreamforce 周的 Salesforce 宕机，把恢复后的工作量彻底摊开了：即便访问已经恢复，客户仍得暂停自动化、重放失败集成，并核对重复或缺失记录。
  ventureScalePath: >-
    先从前三到五条关键工作流的 Salesforce 恢复证明切进去，再扩到 ServiceNow、HubSpot 和 NetSuite 的恢复校验、周期性恢复演练、韧性基准，以及面向业务连续性项目的保险或审计证据。
solution: >-
  产品连上 Salesforce，以及少数几个发起关键写入的相邻系统——例如客服、报价、营销和 iPaaS 层——存的不是完整数据副本，而是轻量级写入意图回执。遇到宕机或降级期，它会冻结最后一个已知健康检查点，把待处理意图和记录的实际版本逐一对照，标出选定对象上缺失、部分落地或重复的变更。它还会检查定时作业、工作流队列，以及被堵住的工单或回呼积压，然后编出按顺序执行的恢复包，里面带安全重放步骤、去重规则和需要人工跟进的账户清单。团队也可以把同一套流程拿来做季度恢复演练，把偶发事故变成持续预算和扩张数据。早期部署会配服务，帮客户映射对象依赖、定义业务安全阈值，并接好第一批恢复剧本。
goToMarketSeed:
  firstCustomer: >-
    一家 500 人规模的 B2B SaaS 公司：客服、续约和报价审批都走 Salesforce，而且管理员在最近一次宕机后不得不手工重放集成
  buyingTrigger: >-
    最近一次 CRM 事故、韧性复盘，或备份、集成工具续约，都会在管理层追问“客户记录和队列能不能安全恢复”时，直接触发采购
  currentAlternative: >-
    手工 CSV 审计、集成重试队列、SI 应急作战室，以及通用型备份或可观测性工具
  switchingReason: >-
    记录级落地证明和按顺序执行的恢复包，比快照恢复或一刀切重试更快压住重复回呼和盲目重启。
  pricingHypothesis: >-
    按受保护工作流或关键对象数量收年度订阅费；首批恢复剧本映射再收一笔导入费
whyNow:
  - point: >-
      Salesforce 自己的状态更新和独立报道都说明，这次事故挡住了访问、支持工单创建以及其他面向客户的工作流，不是一次局限在登录层的事件。
    signalRefs:
      - 宕机影响打到了核心营收工作流
    sourceRefs:
      - 1
      - 2
  - point: >-
      恢复并没有在用户重新登录那一刻结束，因为有些客户的定时作业还没回来，只能继续做定向重启和手工清理。
    signalRefs:
      - 访问恢复后，恢复工作仍没结束
    sourceRefs:
      - 3
  - point: >-
      管理员指引现在明确要求，先确认 org 健康，再恢复自动化和数据加载；这就造出一条独立的校验与恢复工作流。
    signalRefs:
      - 管理员得先证明 org 健康，再恢复运行
    sourceRefs:
      - 4
  - point: >-
      团队现在得在重试后重放失败的集成，并检查重复或缺失记录，于是选择性重放和去重，成了一个非常具体的产品切口，而不只是泛泛的可靠性故事。
    signalRefs:
      - 重放和去重落在客户团队自己身上
    sourceRefs:
      - 2
      - 4
differentiator: >-
  可观测性厂商只会告诉团队 Salesforce 出过事故，备份厂商只让他们恢复数据，iPaaS 工具只负责重试作业。这个概念占住的是服务恢复和业务安全续跑之间那道空档：它证明哪些变更已经落地、哪些发生了重复、哪些队列还需要人处理。它的防守力来自按工作流切分的日志、恢复演练，以及一套不断积累的“从宕机到续跑”的映射语料——这些都是相邻工具今天并不保存的。
conceptDiagram:
  title: CRM 恢复包流程
  mermaid: |
    flowchart LR
      AdjacentSystems[Adjacent systems and integrations] --> Journal[Write-intent journal]
      SalesforceOutage[Salesforce outage or degraded recovery] --> Reconcile[Reconcile landed state and stalled jobs]
      Journal --> Reconcile
      Reconcile --> Packet[Compile ordered resume packets]
      Packet --> Outcome[Safe replay, clean callbacks, verified restart]
businessModelCanvas:
  customerSegments:
    - 以 Salesforce 为核心的中端 RevOps 和业务系统团队
    - 跑着营收关键工单或报价工作流的企业应用负责人
    - 提供韧性服务的 Salesforce 实施伙伴
  valuePropositions:
    - 证明 CRM 里的哪些记录和自动化在宕机后可以安全恢复运行
    - 减少重复重放、漏记记录和客户跟进失误
    - 把复盘和恢复演练沉淀成可复用剧本
  channels:
    - 直销给 RevOps 和企业应用负责人
    - 与 Salesforce 咨询公司和韧性顾问联合销售
    - 在公开 SaaS 宕机之后，以事后工作坊切入
  customerRelationships:
    - 服务辅助导入
    - 带季度演练的年度韧性订阅
    - 通过新增工作流和系统做扩展
  revenueStreams:
    - 按受保护工作流收年度软件订阅费
    - 一次性实施费和剧本映射费
    - 高级恢复演练与审计证据套餐
  keyResources:
    - 写入意图日志和核对引擎
    - Salesforce 和相邻系统连接器
    - 恢复剧本模板和事故语料库
  keyActivities:
    - 映射工作流依赖
    - 核对并编译恢复包
    - 跑恢复演练并扩展覆盖范围
  keyPartners:
    - Salesforce SI 和托管服务伙伴
    - iPaaS 和客服系统集成伙伴
    - 业务连续性和网络保险顾问
  costStructure:
    - 连接器和核对逻辑的工程投入
    - 导入阶段的服务和客户成功
    - 云存储和审计日志留存
jobsToBeDone:
  - job: >-
      当 Salesforce 从供应商事故里恢复时，帮 Salesforce 平台负责人证明哪些记录和作业需要重放，这样他们就能在不重不漏的前提下恢复营收工作流
    currentAlternative: 手工看日志、导出 CSV、一刀切重试，以及 SI 应急作战室
    successMetric: 从供应商恢复到确认可安全恢复运行的时间，以及重复或缺失记录的发生率
  - job: >-
      当 CRM 中断期间，面向客户的团队堆起回呼或工单积压时，帮 RevOps 经理准确找出哪些账户需要跟进，这样他们就能守住续约和 SLA 信任
    currentAlternative: 从帮助台、CRM 和收件箱队列里拉出的电子表格
    successMetric: 积压清理时间，以及受影响账户被正确联系到的比例
  - job: >-
      当管理层追问韧性投入值不值得时，帮 CIO 跑可重复的恢复演练，这样他们就能在下一次供应商宕机前把准备程度量化出来
    currentAlternative: 桌面推演和零散复盘
    successMetric: 演练完成时间，以及仍然缺少安全重启证明的关键工作流数量
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      核心单元是一份由写入意图回执和落地状态证明编译出来的恢复包，这比再做一个监控器、备份控制台或管理员助手少见得多。
  venturePotential:
    score: 4
    rationale: >-
      营收关键的 CRM 工作流黏性强，也能一路扩到相邻系统；但这个品类一开始得先把信任赢下来，起步也会比大而全的可观测性或备份更窄。
  whiteSpace:
    score: 4
    rationale: >-
      备份、可观测性和集成厂商都贴得很近，但今天还没有谁明确占住恢复后证明和选择性恢复包。
  painIntensity:
    score: 4
    rationale: >-
      一次 CRM 宕机的后遗症会直接打到营收、客服和客户信任，只是事故本身毕竟不是天天发生。
  wedgeClarity:
    score: 5
    rationale: >-
      从少量受保护对象、相邻系统和回呼队列切进去，让首批部署足够具体、可量化，也很适合用演练来验证。
  evidenceFit:
    score: 5
    rationale: >-
      来源明确提到了暂停自动化、重放集成、重复或缺失记录、定时作业滞后和回呼积压，这些都和产品切口一一对应。
topRisks:
  - name: 预算痛点偏偶发
    description: 宕机虽然严重，但并不常见，所以有些买家会在眼前的救火结束后，把预算往后推。
    mitigation: 卖季度恢复演练、韧性评分卡和审计证据，让产品在事故间隙也能拿到预算。
  - name: 变更覆盖不完整
    description: 如果关键写入路径没有被记进日志，产品就可能抓不到买家期待的那一组精确重放范围。
    mitigation: 先从前三到五条工作流做起，优先接入最主要的源系统，并把覆盖缺口清楚亮出来。
  - name: 相邻现有厂商顺手打包
    description: 一旦这个品类被看见，备份、iPaaS 或可观测性厂商都可能补上一层更轻的恢复检查。
    mitigation: 把跨系统证明账本、按工作流定制的恢复包，以及演练数据的网络效应做深；这些都不是通用工具能顺手补出来的。
