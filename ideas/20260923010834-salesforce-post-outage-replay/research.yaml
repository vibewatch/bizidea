championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: The outage created a distinct post-green workflow of replaying integrations, checking duplicates, rerunning jobs, and clearing callback queues, which is more specific than generic uptime monitoring.
      sourceRefs:
        - 1
        - 2
        - 3
    - point: Public incumbent positioning clusters around backup, restore, external data access, and continuity planning; none lead with ordered resume packets compiled from intended writes versus landed state across systems.
      sourceRefs:
        - 10
        - 12
        - 13
        - 15
        - 22
  evidenceAgainst:
    - point: Adjacent backup vendors already market granular restore, external access during outages, and business-continuity scenarios, so a workflow-aware replay layer could be bundled by incumbents.
      sourceRefs:
        - 7
        - 10
        - 13
        - 15
        - 22
    - point: The mechanism depends on pre-incident instrumentation, a 72-hour CDC replay window, event-delivery quotas, and at-least-once queue semantics, which makes the first deployments integration-heavy and services-led.
      sourceRefs:
        - 5
        - 6
        - 17
  revisedClaim: >-
    The differentiated idea is not backup or observability by itself; it is a
    services-assisted operational layer that compiles selective restart packets
    for revenue workflows after Salesforce incidents. That remains genuinely
    uncommon in public market positioning, but the novelty is narrower than the
    original claim because adjacent continuity vendors already own much of the
    underlying data plane and could move closer to the wedge.
reportMemo:
  executiveTakeaways:
    - The pain is current and concrete because the September 2026 outage left teams replaying integrations, checking duplicates, rerunning jobs, and clearing customer callback backlogs after access returned.
    - Budget exists, but it is adjacent-budget pain rather than a clean category budget today; buyers already pay for backup, restore, retention, and continuity, then staff manual recovery when incidents happen.
    - The proposed mechanism is uncommon in public positioning, but not magic. Incumbents promise backup, restore, or off-platform access; the startup would need to own the selective business-safe restart layer on top.
    - Adoption friction is real because CDC retention is only three days, event-delivery limits and duplicate-prone retries are real, and customers must map cross-system dependencies before the next outage.
    - The beachhead can support a real software business, but near-term reachable market looks like a high-double-digit to low-triple-digit million-dollar U.S. wedge before expansion to other systems.
  marketDefinition: >-
    Post-outage revenue-workflow recovery software for mid-market Salesforce
    operators that need to prove which records, jobs, and customer queues are
    safe to restart after a vendor-originated incident.
  customerAndBuyer: >-
    Daily users are Salesforce platform owners, RevOps systems admins, and
    business-systems teams that already own data quality, platform health, and
    integrated GTM tools; economic buyers are VP RevOps, Director of Business
    Systems, CIO, or COO leaders who already fund backup, resilience, and
    postmortem work.
  buyingTriggers:
    - point: A recent Salesforce outage or degraded recovery exposes stalled jobs, retry storms, duplicate-risk syncs, and callback backlogs that must be reconciled before users can safely resume work.
      sourceRefs:
        - 1
        - 2
        - 3
    - point: Backup or continuity renewals force buyers to revisit retention, restore tests, and what their current tools still do not prove at record level.
      sourceRefs:
        - 7
        - 18
        - 22
    - point: Rapidly scaling RevOps teams formalize ownership of integrated sales tools and platform health, creating an internal buyer for resilience workflow tooling.
      sourceRefs:
        - 21
  willingnessToPay:
    summary: >-
      Willingness to pay is credible but indirect. Backup proposals are often
      purchased reactively after incidents and restore pricing becomes more
      expensive when left unplanned, while public vendor signals show per-user
      and quote-led backup contracts already exist. In practice, the startup
      would likely sell against existing backup, continuity, or SI budgets
      rather than a net-new software line item.
    sourceRefs:
      - 11
      - 14
      - 18
      - 19
      - 22
  competitiveLandscape: >-
    The market breaks into four substitute layers: native Salesforce backup,
    third-party Salesforce backup and continuity vendors, integration middleware
    with DLQs and retries, and manual or SI-led audits using exports,
    spreadsheets, and war rooms. The proposed startup sits between those layers
    by deciding what to replay and in what order, instead of only restoring data
    or retrying individual pipes.
  incumbentThesis:
    - incumbentClass: Native Salesforce backup
      point: Native backup wins on procurement convenience and integration stability, but its public framing is safeguarding CRM data rather than proving cross-system business-safe resume order after a vendor outage.
      sourceRefs:
        - 18
        - 22
    - incumbentClass: Third-party Salesforce backup and continuity vendors
      point: These vendors offer granular restore, external access, and continuity architecture, but they still start from snapshots or replicated state instead of ordered restart packets tied to customer-facing queues and workflow intents.
      sourceRefs:
        - 10
        - 12
        - 13
        - 15
    - incumbentClass: Middleware and manual recovery stack
      point: DLQs, retries, CSV audits, and SI war rooms can recover specific messages or records, but they do not natively reconcile landed CRM state against intended business mutations across multiple systems.
      sourceRefs:
        - 3
        - 17
        - 21
  regulatoryLandscape: >-
    The main blockers are not product-specific regulation but governance and
    accountability. Salesforce and backup vendors frame recovery under a shared
    responsibility model, continuity programs must honor retention and
    sovereignty requirements, and restore procedures must include files,
    metadata, keys, and cross-org credentials rather than only object rows.
  technologyLandscape: >-
    Technically the building blocks exist: CDC provides replayable change events,
    middleware provides dead-letter queues and retries, and backup vendors prove
    granular restore and off-platform continuity. The hard part is binding those
    components into a low-false-positive resume recommendation that buyers trust
    during live incidents.
  distributionChannels:
    - point: Direct sales into RevOps systems and business-systems teams is plausible because these roles already own integrated sales tooling, change backlog, and platform health.
      sourceRefs:
        - 21
    - point: Post-incident workshops and managed-services partners are a natural first channel because consultancies already market outage communications and data-verification help after Salesforce incidents.
      sourceRefs:
        - 3
  partnershipEcosystem:
    - point: iPaaS and middleware partners such as MuleSoft are natural allies because they already own DLQs, retries, and integration telemetry that a replay-verification layer would need.
      sourceRefs:
        - 17
    - point: Backup, business-continuity, and Salesforce consulting partners can accelerate early deployments by contributing restore runbooks, workflow maps, and quarterly drill programs.
      sourceRefs:
        - 7
        - 15
  dataMoats:
    - point: If the startup captures intended writes, landed outcomes, and resulting cleanup steps for the top workflows, it can build a proprietary map of safe replay sequences that backup vendors do not expose today.
      sourceRefs:
        - 5
        - 7
        - 15
    - point: Quarterly drills can turn rare outages into recurring labeled data on replay order, false positives, and resume times by workflow.
      sourceRefs:
        - 7
        - 15
  geographicConsiderations:
    - point: The first beachhead is easiest to size and sell in the United States because Census firm-count data is available and the buyer roles are legible, but the incident evidence and product value are global.
      sourceRefs:
        - 2
        - 8
        - 9
    - point: Regulated and multinational buyers may prefer independent storage, regional control, and DORA or GDPR-friendly architectures rather than keeping all recovery state inside Salesforce.
      sourceRefs:
        - 10
        - 15
  sensitivityCases:
    - case: Salesforce extends Backup & Recover into workflow-aware replay and dedupe
      impact: Native bundling would compress the standalone wedge unless the startup already owns superior cross-system proofs and operator workflow telemetry.
      sourceRefs:
        - 15
        - 22
    - case: Customers cannot instrument the top write paths before the next outage
      impact: The product degrades into a slower forensic audit rather than a fast resume-packet compiler, hurting ROI and trust.
      sourceRefs:
        - 5
        - 6
        - 17
    - case: Buyers treat outages as too episodic to fund drills between incidents
      impact: The category stalls as consulting and backup line items absorb the spend, leaving the startup with long sales cycles and reactive demand.
      sourceRefs:
        - 18
        - 19
  validationPlan:
    - priority: high
      question: Will five design partners allow pre-incident journaling on their top three to five Salesforce-adjacent workflows?
      evidenceToGather: Export actual integration maps, retry logic, and queue ownership for support, quote, and renewal flows.
    - priority: high
      question: Can the product produce resume recommendations with acceptably low false positives after simulated outages?
      evidenceToGather: Run backtests on one incident or drill per design partner and compare packet recommendations with human cleanup logs.
    - priority: high
      question: Does budget land as software before the next public outage?
      evidenceToGather: Sell two paid pilots during backup or continuity renewals and measure whether funds come from RevOps, IT resilience, or SI services.
    - priority: medium
      question: Which adjacent systems generate the most valuable intended-write receipts?
      evidenceToGather: Analyze support, quoting, billing, and iPaaS event streams for frequency, replay risk, and downstream customer harm.
    - priority: medium
      question: What governance boundaries must remain human-approved?
      evidenceToGather: Capture required approvals for dedupe, customer outreach, and replay actions in regulated and non-regulated buyers.
analysisModels:
  marketMapDiagram:
    title: Salesforce recovery market map
    mermaid: |
      quadrantChart
        title Salesforce recovery market map
        x-axis Low cross-system proof --> High cross-system proof
        y-axis Low restart urgency --> High restart urgency
        Native backup: [0.45, 0.58]
        Third-party backup: [0.58, 0.70]
        Middleware retry: [0.67, 0.62]
        Managed services: [0.40, 0.82]
        Proposed startup: [0.86, 0.91]
  fiveForces:
    supplierPower:
      score: 3
      rationale: The startup depends on Salesforce APIs, CDC, and integration telemetry, but the component vendors are numerous enough that no single supplier fully dictates the category.
      sourceRefs:
        - 5
        - 6
        - 17
    buyerPower:
      score: 4
      rationale: Buyers can fall back to consultants, exports, backup tools, or internal teams, so every deal must show faster resume time and fewer duplicate or missed records.
      sourceRefs:
        - 3
        - 18
        - 19
    threatOfEntrants:
      score: 3
      rationale: The workflow is specialized, but adjacent backup and continuity vendors already market close substitutes and could move toward replay verification if demand hardens.
      sourceRefs:
        - 10
        - 13
        - 15
        - 22
    threatOfSubstitutes:
      score: 5
      rationale: CSV audits, SI war rooms, DLQ replays, and generic restore tools already solve the job imperfectly without requiring a new category purchase.
      sourceRefs:
        - 3
        - 17
        - 19
        - 21
    competitiveRivalry:
      score: 4
      rationale: Multiple backup vendors, native Salesforce, and middleware tools already compete for adjacent resilience budgets and can each claim partial coverage of the workflow.
      sourceRefs:
        - 10
        - 12
        - 13
        - 15
        - 22
  pestle:
    - factor: political
      impact: neutral
      point: Large public outages elevate resilience scrutiny, but there is no dedicated regulatory catalyst that guarantees budget for a resume-packet product.
      sourceRefs:
        - 2
        - 15
    - factor: economic
      impact: positive
      point: Buyers already pay for backup, restore, and continuity, so the economic conversation can anchor on avoided manual cleanup and reduced customer-impact time.
      sourceRefs:
        - 18
        - 19
    - factor: social
      impact: positive
      point: Customer-facing teams feel the pain immediately through callback backlogs and unavailable systems, making post-incident cleanup visible beyond IT.
      sourceRefs:
        - 1
        - 3
    - factor: technological
      impact: positive
      point: CDC replay, event metrics, and DLQ patterns make selective recovery increasingly implementable without inventing new primitives.
      sourceRefs:
        - 5
        - 6
        - 17
    - factor: legal
      impact: negative
      point: Recovery plans must handle retention, data sovereignty, file coverage, keys, and external-auth dependencies, which adds review and onboarding friction.
      sourceRefs:
        - 7
        - 10
        - 15
  adoptionFrictionMatrix:
    - friction: Need to instrument critical write paths before the next outage
      severity: high
      affectedBuyer: Director of Business Systems
      mitigation: Start with three to five workflows and publish explicit coverage gaps so buyers know what is and is not protected.
      sourceRefs:
        - 5
        - 15
    - friction: CDC retention and event-delivery limits constrain after-the-fact replay
      severity: high
      affectedBuyer: Salesforce platform owner
      mitigation: Persist an external intent journal and keep scope bounded to high-value objects and queues.
      sourceRefs:
        - 5
        - 6
    - friction: Files, metadata, SSO, and external-auth dependencies are not preserved by record-level restore alone
      severity: high
      affectedBuyer: CIO
      mitigation: Package restore runbooks with dependency maps, quarterly drills, and credential reauthorization steps.
      sourceRefs:
        - 7
        - 15
    - friction: Buyers may see the pain as episodic and delay procurement after the incident fades
      severity: medium
      affectedBuyer: VP Revenue Operations
      mitigation: Sell quarterly drills, audit evidence, and resilience benchmarks between outages.
      sourceRefs:
        - 18
        - 19
    - friction: At-least-once retries can create duplicates during recovery
      severity: medium
      affectedBuyer: Integration owner
      mitigation: Add explicit dedupe rules and landed-state checks before bulk replay.
      sourceRefs:
        - 3
        - 17
market:
  tam:
    value: "$131.3M"
    rationale: >-
      Bottom-up beachhead TAM assumes 7,292 U.S. firms in Information,
      Finance and Insurance, and Professional, Scientific, and Technical
      Services with 300-2,499 employees from the 2022 SUSB employment-size
      table, multiplied by an estimated 30% Salesforce-as-primary-revenue-CRM
      penetration in this target cohort and a $60k annual contract value for
      three to five protected workflows.
    isEstimate: true
    sourceRefs:
      - 4
      - 9
      - 18
  sam:
    value: "$78.8M"
    rationale: >-
      SAM applies an additional 60% filter for firms likely to have five or
      more material integrations plus callback-heavy support, quote, or renewal
      workflows, yielding about 1,313 organizations at the same $60k ACV.
    isEstimate: true
    sourceRefs:
      - 4
      - 9
      - 21
  som:
    value: "$3.6M"
    rationale: >-
      A plausible first-phase SOM is 60 customers at $60k ARR, which is about
      4.6% of the narrowed SAM account count and fits a services-assisted,
      integration-heavy go-to-market over the first several years.
    isEstimate: true
    sourceRefs:
      - 9
      - 18
      - 21
