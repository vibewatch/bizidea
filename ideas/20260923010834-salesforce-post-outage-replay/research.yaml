competitors:
  - name: Salesforce Backup & Recover
    stage: Incumbent platform add-on
    wedge: Native Salesforce backup and recover for CRM data protection
    pricing: Per-record-month and quote-led add-on buying motion
    strength: Native procurement path and integration stability
    weaknessVsUs: Does not publicly position around cross-system landed-state proofs or ordered restart packets for customer queues
    sourceRefs:
      - 18
      - 22
  - name: Odaseva
    stage: Established enterprise backup vendor
    wedge: Enterprise-grade Salesforce backup and restore with compliance positioning
    pricing: Starting-price public SMB offer on AppExchange; broader enterprise pricing is quote-led
    strength: Deep enterprise backup, metadata, and compliance framing
    weaknessVsUs: Starts from backup and restore posture rather than deciding what business work is safe to replay next
    sourceRefs:
      - 10
      - 11
  - name: Gearset Backup
    stage: Established Salesforce DevOps and backup vendor
    wedge: Backup, monitoring, and restore for Salesforce data and metadata
    pricing: Quote-led enterprise motion
    strength: Strong change visibility and data-monitoring workflow inside the Salesforce admin stack
    weaknessVsUs: Focuses on detecting and restoring data changes rather than reconciling intended writes across adjacent systems
    sourceRefs:
      - 12
  - name: Flosum Backup & Archive
    stage: Established Salesforce DevSecOps vendor
    wedge: Backup, restore, archive, and export for Salesforce data and metadata
    pricing: Public AppExchange starting price plus enterprise quote-led upsell
    strength: Whole-org and object-level backup plus restore and archiving controls
    weaknessVsUs: Backup-centric posture does not inherently produce selective resume packets for support, quote, or renewal workflows
    sourceRefs:
      - 13
      - 14
  - name: GRAX
    stage: Growth-stage continuity vendor
    wedge: Independent-access Salesforce continuity and restore in customer-controlled cloud
    pricing: Quote-led enterprise motion
    strength: Strong messaging around off-platform access during outages and less than one-hour RPO for critical data
    weaknessVsUs: Centers on replicated access and restore, not intent-versus-landed-state reconciliation for safe business restart
    sourceRefs:
      - 15
regulatoryTechnicalConstraints:
  - point: Salesforce change events are retained for only three days, so an outage investigation that starts late can miss replayable history unless the startup stores its own intent journal.
    sourceRefs:
      - 5
  - point: Event delivery is quota-bound and shared across subscribers, so high-volume orgs can hit CometD or delivery ceilings during incidents or drills.
    sourceRefs:
      - 6
  - point: Backup and recovery must account for files, metadata, external auth, SSO, and key management, not only object rows.
    sourceRefs:
      - 7
  - point: Shared responsibility means the customer, not Salesforce, still owns data protection and restore testing outcomes.
    sourceRefs:
      - 10
      - 15
      - 22
  - point: Queue systems commonly provide at-least-once delivery, so duplicate-safe replay logic is mandatory.
    sourceRefs:
      - 17
validationSignals:
  - point: Independent reporting and admin guidance describe callback backlogs, API alarms, and post-incident record verification after the September 2026 outage.
    sourceRefs:
      - 1
      - 3

  - point: Scheduled jobs still failed for some customers after service appeared to return, showing that the customer cleanup phase meaningfully outlasts platform restoration.
    sourceRefs:
      - 2
  - point: Backup proposals are often bought reactively after incidents, showing that resilience budget does move when pain becomes visible.
    sourceRefs:
      - 18
  - point: A customer review says manual restore can take days or a week without dedicated tooling, which is the kind of labor the startup aims to compress.
    sourceRefs:
      - 19
  - point: Public RevOps systems jobs explicitly assign responsibility for platform health, integrated tools, and proactive risk flagging to Salesforce-centered operations teams.
    sourceRefs:
      - 21
openQuestions:
  - How many design partners will permit pre-incident write-intent journaling on customer-facing workflows before the next outage occurs?
  - Which adjacent systems generate the highest-value receipts for replay ordering: support desk, billing, quoting, or iPaaS logs?
  - What false-positive rate is acceptable before buyers stop trusting automated resume recommendations?
  - Can the startup win budget during calm periods, or does demand remain primarily reactive to public incidents?
  - How quickly could native Salesforce or leading backup vendors add a lighter replay-verification layer once the wedge proves valuable?
