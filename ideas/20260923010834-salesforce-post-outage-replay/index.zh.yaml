rating:
  overall: 3.6
  dimensions:
    market:
      score: 3
      rationale: $131.3M TAM 和 $78.8M SAM 说明这里确实有个滩头市场；但周边已有五家备份厂商、又没有可引用的增长率数据，市场吸引力仍只算中档。
    differentiation:
      score: 4
      rationale: 落地状态证明和有序续跑包，确实在跨系统恢复里切出一个有效切口；不过周边备份厂商也可能补上更轻量的校验。
    execution:
      score: 3
      rationale: LTV/CAC 达 9.1x，回本周期 7.3 个月，团队计划也按阶段推进；但模型里有四个红旗，而且导入偏服务化，执行风险不低。
    timeliness:
      score: 5
      rationale: 过去 7 天里，Salesforce 一次有记录的故障带出了四条相互印证的信号：重放、去重和队列清理，现在都需要一套新工作流。
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: 它把 CRM 恢复从盲目重试，改成可编译的续跑包；写入意图日志和落地状态证明一起兜底，直接锁定必须重启的记录、作业和队列。
  acceptedTradeoff: 首批部署会很窄，集成也偏重；只有先把一小组关键对象和相邻系统纳入监测，买家才会真正信这套产品。
