  - driver: 初始年合同额
    value: "$60k ARR，覆盖 3-5 条受保护工作流"
    source: '[11]、[14]、[18] 和估算'
categoryDynamics:
  growthRate: null
  growthRateSourceRefs:
    - 4
  tailwinds:
    - point: 一场点名道姓的公开故障，把恢复后的验证工作量直接摆到买家面前，不再只是管理员圈子里的隐性经验。
      sourceRefs:
        - 1
        - 2
        - 3
    - point: 买家本来就懂 RPO、RTO、恢复演练和备份保留期，所以公司可以借现成的韧性心智推进。
      sourceRefs:
        - 7
        - 18
        - 22
    - point: CDC 重放和 DLQ 模式意味着核心的数据捕获与重放原语本来就已存在。
      sourceRefs:
        - 5
        - 6
        - 17
  headwinds:
    - point: 现有厂商已经在卖细粒度恢复、平台外访问和连续性，独立品类的留白因此被压窄。
      sourceRefs:
        - 10
        - 13
        - 15
        - 22
    - point: 事故过去后，预算记忆会迅速变淡，而公开定价又不透明，这会拖慢新类别的成案速度。
      sourceRefs:
        - 18
        - 19
competitors:
  - name: Salesforce Backup & Recover
    stage: 现有厂商平台附加组件
    wedge: 面向 CRM 数据保护的 Salesforce 原生备份与恢复
    pricing: 按记录/月计费，并通过报价推动附加购买
    strength: 原生采购路径与集成稳定性
    weaknessVsUs: 公开定位并不围绕跨系统落地状态证明，也不围绕面向客户队列的有序恢复包
    sourceRefs:
      - 18
      - 22
  - name: Odaseva
    stage: 成熟的企业备份厂商
    wedge: 带合规定位的企业级 Salesforce 备份与恢复
    pricing: AppExchange 上有公开起步价的中小企业版本；更广泛的企业定价走报价
    strength: 企业级备份、元数据和合规叙事很深
    weaknessVsUs: 起点是备份与恢复，而不是决定下一步哪些业务动作可以安全重放
    sourceRefs:
      - 10
      - 11
  - name: Gearset Backup
    stage: 成熟的 Salesforce DevOps 与备份厂商
    wedge: Salesforce 数据和元数据的备份、监控与恢复
    pricing: 企业销售以报价为主
    strength: 在 Salesforce 管理员栈里，对变更可见性和数据监控工作流很强
    weaknessVsUs: 重点是发现并恢复数据变化，而不是把相邻系统里的预期写入逐条对账
    sourceRefs:
      - 12
  - name: Flosum Backup & Archive
    stage: 成熟的 Salesforce DevSecOps 厂商
    wedge: Salesforce 数据和元数据的备份、恢复、归档与导出
    pricing: AppExchange 有公开起步价，企业版再走报价加售
    strength: 整个组织级和对象级备份，再加恢复与归档控制
    weaknessVsUs: 以备份为中心的姿态，天然产不出支持、报价或续约工作流所需的选择性恢复包
    sourceRefs:
      - 13
      - 14
  - name: GRAX
    stage: 成长期连续性厂商
    wedge: 在客户自控云里提供独立访问的 Salesforce 连续性与恢复
    pricing: 企业销售以报价为主
    strength: 围绕故障期间的平台外访问和关键数据一小时以内的 RPO，有很强的叙事
    weaknessVsUs: 核心还是复制后的访问与恢复，不是用预期意图对照落地状态，从而安全恢复业务
    sourceRefs:
      - 15
regulatoryTechnicalConstraints:
  - point: Salesforce 变更事件只保留三天，所以如果故障排查启动得晚，而创业公司又没有自存一份意图日志，就可能错过可重放的历史。
    sourceRefs:
      - 5
  - point: 事件投递受配额约束，而且订阅方之间共享，所以高吞吐组织在事故或演练期间可能撞上 CometD 或投递上限。
    sourceRefs:
      - 6
  - point: 备份与恢复必须把文件、元数据、外部认证、SSO 和密钥管理都算进去，不能只看对象行数据。
    sourceRefs:
      - 7
  - point: 共同责任意味着，数据保护和恢复测试结果最终仍由客户负责，而不是 Salesforce。
    sourceRefs:
      - 10
      - 15
      - 22
  - point: 队列系统普遍只保证至少一次投递，所以能防重复的重放逻辑是刚需。
    sourceRefs:
      - 17
validationSignals:
  - point: 独立报道和管理员指引都提到了 2026 年九月故障后的回拨积压、API 告警和记录校验。
    sourceRefs:
      - 1
      - 3

  - point: 即便服务表面恢复，一些客户的定时任务依然失败，说明客户清理阶段明显长于平台恢复时间。
    sourceRefs:
      - 2
  - point: 备份方案往往是在事故后被动买入，说明只要痛点足够显眼，韧性预算确实会动。
    sourceRefs:
      - 18
  - point: 一条客户评论提到，没有专门工具时，手工恢复可能要花几天甚至一周；这正是创业公司要压缩的人力开销。
    sourceRefs:
      - 19
  - point: 公开的 RevOps 系统招聘明确把平台健康、集成工具和主动风险预警，交给以 Salesforce 为中心的运营团队负责。
    sourceRefs:
      - 21
openQuestions:
  - 下一次故障发生前，到底有多少共创客户愿意在面向客户的工作流上允许事故前写入意图日志？
  - 哪些相邻系统最能产出高价值回执，用来决定重放顺序：支持台、计费、报价，还是 iPaaS 日志？
  - 误报率高到什么程度，买家就会停止信任自动恢复建议？
  - 在风平浪静的时候，创业公司能不能拿下预算，还是说需求主要仍由公开事故被动触发？
  - 一旦这个切口被证明有价值，Salesforce 原生产品或头部备份厂商要多久就能补上一层更轻的重放验证？
