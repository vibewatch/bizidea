scenarios:
  downside:
    description: 平稳期的预算转化更慢，扩张也更弱，业务会更久停留在试点占主导的阶段。
    y3RevenueK: 1179.75
    y3EbitdaK: -768.18
    cashLowPointK: 580.44
    keyAssumptionChanges:
    - A7 的客户爬坡到 9 个才在 Q4Y2 达到。
    - A8 的客户爬坡到 22 个才在 Q4Y3 达到。
    - A5 的 Y3 综合 ARPA 从 $90K 降到 $78K。
    - A11 的稳定毛利率最高只到 70%。
  base:
    description: 与主计划一致：5 个 Y1 付费账户、12 个在 Q4Y2 前落地的客户、30 个在 Q4Y3 前落地的客户，以及 70% 的 Y3 毛利率。
    y3RevenueK: 1867.5
    y3EbitdaK: -230.73
    cashLowPointK: 1225.26
    keyAssumptionChanges:
    - A3 的 Y1 综合单客收入维持在 $48K。
    - A4 的 Y2 综合单客收入抬到 $66K。
    - A5 的 Y3 综合单客收入抬到 $90K。
    - A7 和 A8 的客户爬坡与模型设定完全一致。
  upside:
    description: 伙伴转介绍把正式生产落地时间再往前拉，且更多账户会在第二年扩到第二个工作流。
    y3RevenueK: 2508.0
    y3EbitdaK: 261.92
    cashLowPointK: 1606.28
    keyAssumptionChanges:
    - A7 的客户爬坡到 15 个时会在 Q4Y2 达到。
    - A8 的客户爬坡到 38 个时会在 Q4Y3 达到。
    - A5 的 Y3 综合 ARPA 从 $90K 抬到 $96K。
    - A11 在伙伴杠杆更强时，毛利率可到 74%。
sensitivity:
- variable: ARPU
  downsideCase: Y3 综合 ARPA 卡在 $72K，因为第二工作流和演练追加销售挂得更慢。
  baseCase: Y3 综合 ARPA 到 $90K，来自 $60K 的核心订阅，再叠加扩张和演练收入。
  upsideCase: 更多客户加上第二个工作流和基准测试套餐后，Y3 综合 ARPA 到 $96K。
  y3RevenueImpactK: -373.5
  cashImpactK: -272.66
- variable: CAC
  downsideCase: CAC 升到 $55K，在同样的 GTM 预算下只能拿到更少的净新增客户。
  baseCase: 靠创始人主导销售和伙伴转介绍，CAC 基本稳在 $40K 左右。
  upsideCase: 渠道伙伴带来更多合格的复盘线索后，CAC 降到 $30K。
  y3RevenueImpactK: -180.0
  cashImpactK: -220.0
- variable: 流失率
  downsideCase: 月度流失率升到 2.5%，因为宕机记忆淡去后，买方会把演练当成可砍的支出。
  baseCase: 粘性较强的连续性软件，月度流失率维持在 1.5%。
  upsideCase: 一旦产品写进正式的连续性操作手册，月度流失率会降到 1.0%。
  y3RevenueImpactK: -150.0
  cashImpactK: -110.0
- variable: 销售周期
  downsideCase: 正式生产成交周期从约 6 个月拉长到约 9 个月，试点转化和扩张都会往后拖。
  baseCase: 从复盘线索到年度订阅，正式生产成交周期大约是 6 个月。
  upsideCase: 如果试点正好对齐备份续约窗口，正式生产成交周期可缩到约 4-5 个月。
  y3RevenueImpactK: -320.0
  cashImpactK: -360.0
- variable: 毛利率
  downsideCase: 如果实施服务长期太定制化，毛利率最高只能到 68%。
  baseCase: 连接器标准包和可复制的上线交付跑通后，毛利率能到 73%。
  upsideCase: 伙伴承担更多上线交付后，毛利率可到 75%。
  y3RevenueImpactK: 0.0
  cashImpactK: -93.38
- variable: 招聘节奏
  downsideCase: 如果还没拿到收入验证，就把第四名工程师和第二名 GTM 人员都提前一个季度招进来。
  baseCase: 只有试点和扩张里程碑达标后，才会触发后续招聘。
  upsideCase: 如果伙伴吃下更多上线交付工作，其中一个岗位可以往后推。
  y3RevenueImpactK: 0.0
  cashImpactK: -120.0
modelDiagram:
  title: 单位经济模型流转图
  mermaid: |
    flowchart LR
      Leads[Postmortem and renewal leads] --> Pilots[Paid pilots]
      Pilots --> Customers[Production customers]
      Customers --> Expansion[More workflows and drill packages]
      Expansion --> Revenue[Recurring revenue]
      Revenue --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Ending cash]
modelSanity:
- checkName: 收入引擎
  finding: 基础情景的收入，一头是 5 个 Y1 付费账户，另一头是 30 个到 Q4Y3 的付费账户；同时综合 ARPA 也靠工作流扩张和演练套餐，从试点占比更高时的 $48K 抬到 $90K。
- checkName: 必须跑通的环节
  finding: 公司必须在常规备份和连续性续约窗口里拿下试点，这样销售周期才能守在六个月左右，而不是等下一次公开宕机事件再触发购买。
- checkName: 模型会失效的情形
  finding: 最大的下行风险，是销售周期拉长、扩张又偏弱；那样 Y3 收入会掉到接近 $1.18M，现金低点也会压到大约 $580K。
- checkName: 下一轮融资所需证明
  finding: 只要团队拿下 6 个共创客户、3 个付费试点、2 个年度订阅，并把少于 45 天的部署打法跑成可复制流程，且这一切都发生在 18 个月现金跑道内，下一轮融资就站得住。
sanityChecks:
  ruleOf40: Y3 增长率 248.3% + EBITDA 利润率 -12.4% = 235.9%。
  burnMultiple: 1.9x（Y2 的 -$860K EBITDA 对应 +$446K 收入）改善到 0.2x（Y3 的 -$231K EBITDA 对应 +$1.331M 收入）。
  revenuePerFte: ~$208K 的 Y3 人均收入，按 9 名 Q4 FTE 计算（处在 $200K-$400K SaaS 基准的低端）。
  flags:
  - 基础情景假设买方会在常规规划周期里给韧性软件批预算；销售周期只要多拖一个季度，就是最大的下行敏感项。
  - 综合 ARPA 会从首年试点占比较高时的 $48K 抬到 $90K，并在 Y3 兑现；因此第二工作流附加率偏弱，或演练变现跑不动，都会明显压缩收入。
  - 70% 目标要到 Y3 才能站上；如果上线交付长期偏服务化，盈利时间点还会继续后拖。
  - 到 Y3 为止，人均收入只摸到 SaaS 基准的低端，因为业务仍在承担集成占比较高的上线交付工作。
