scenarios:
  downside:
    description: Slower calm-period budget conversion and weaker expansion keep the business pilot-heavy for longer.
    y3RevenueK: 1179.75
    y3EbitdaK: -768.18
    cashLowPointK: 580.44
    keyAssumptionChanges:
      - A7 customer ramp slips to 9 by Q4Y2.
      - A8 customer ramp slips to 22 by Q4Y3.
      - A5 blended Y3 ARPA falls from $90K to $78K.
      - A11 steady-state gross margin tops out at 70%.
  base:
    description: Matches the main plan with 5 Y1 paying accounts, 12 customers by Q4Y2, 30 by Q4Y3, and gross margin clearing 70% in Y3.
    y3RevenueK: 1867.5
    y3EbitdaK: -230.73
    cashLowPointK: 1225.26
    keyAssumptionChanges:
      - A3 Y1 blended revenue/customer stays at $48K.
      - A4 Y2 blended revenue/customer rises to $66K.
      - A5 Y3 blended revenue/customer rises to $90K.
      - A7 and A8 customer ramps land exactly as modeled.
  upside:
    description: Partner referrals shorten time to production and more accounts expand to a second workflow by the second year.
    y3RevenueK: 2508.0
    y3EbitdaK: 261.92
    cashLowPointK: 1606.28
    keyAssumptionChanges:
      - A7 customer ramp reaches 15 by Q4Y2.
      - A8 customer ramp reaches 38 by Q4Y3.
      - A5 blended Y3 ARPA rises from $90K to $96K.
      - A11 gross margin reaches 74% with better partner leverage.
sensitivity:
  - variable: ARPU
    downsideCase: Y3 blended ARPA stalls at $72K because second-workflow and drill upsell attach slowly.
    baseCase: Y3 blended ARPA reaches $90K from the $60K core subscription plus expansion and drills.
    upsideCase: Y3 blended ARPA reaches $96K as more customers add a second workflow and benchmark package.
    y3RevenueImpactK: -373.5
    cashImpactK: -272.66
  - variable: CAC
    downsideCase: CAC rises to $55K, forcing fewer net new logos within the same GTM budget.
    baseCase: CAC stays near $40K with founder-led selling and partner referrals.
    upsideCase: CAC falls to $30K as channel partners source more qualified postmortem leads.
    y3RevenueImpactK: -180.0
    cashImpactK: -220.0
  - variable: churn
    downsideCase: Monthly churn rises to 2.5% because buyers treat drills as discretionary after the outage fades.
    baseCase: Monthly churn stays at 1.5% for sticky continuity software.
    upsideCase: Monthly churn falls to 1.0% once the product becomes part of formal continuity runbooks.
    y3RevenueImpactK: -150.0
    cashImpactK: -110.0
  - variable: sales cycle
    downsideCase: Production close lengthens from about 6 months to about 9 months, delaying pilot conversion and expansion.
    baseCase: Production close is about 6 months from postmortem lead to annual subscription.
    upsideCase: Production close shortens to about 4-5 months when pilots align to backup renewals.
    y3RevenueImpactK: -320.0
    cashImpactK: -360.0
  - variable: gross margin
    downsideCase: Gross margin tops out at 68% because implementation services remain too custom.
    baseCase: Gross margin reaches 73% after connector packaging and repeatable onboarding.
    upsideCase: Gross margin reaches 75% with stronger partner onboarding leverage.
    y3RevenueImpactK: 0.0
    cashImpactK: -93.38
  - variable: hiring pace
    downsideCase: The fourth engineer and second GTM hire are pulled forward by one quarter before revenue proof lands.
    baseCase: Hires are triggered only after pilot and expansion milestones are met.
    upsideCase: One hire is delayed because partners absorb more onboarding work.
    y3RevenueImpactK: 0.0
    cashImpactK: -120.0
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Leads[Postmortem and renewal leads] --> Pilots[Paid pilots]
      Pilots --> Customers[Production customers]
      Customers --> Expansion[More workflows and drill packages]
      Expansion --> Revenue[Recurring revenue]
      Revenue --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Ending cash]
modelSanity:
  - checkName: Revenue engine
    finding: Base-case revenue is driven by a ramp from 5 paying accounts in Y1 to 30 by Q4Y3 while blended ARPA climbs from pilot-heavy $48K to $90K through workflow expansion and drill packages.
  - checkName: Must go right
    finding: The company must close pilots during ordinary backup and continuity renewals so the sales cycle stays near six months instead of waiting for the next public outage.
  - checkName: Model breaks if
    finding: The biggest downside is a longer sales cycle and weaker expansion, which drops Y3 revenue toward $1.18M and pushes the cash low point toward roughly $580K.
  - checkName: Next-round proof
    finding: The next financing is justified if the team reaches 6 design partners, 3 paid pilots, 2 annual subscriptions, and a repeatable sub-45-day deployment motion within the 18-month runway.
sanityChecks:
  ruleOf40: Y3 growth 248.3% + EBITDA margin -12.4% = 235.9%.
  burnMultiple: Improves from 1.9x in Y2 (-$860K EBITDA on +$446K revenue) to 0.2x in Y3 (-$231K EBITDA on +$1.331M revenue).
  revenuePerFte: ~$208K Y3 on 9 Q4 FTE (low end of the $200K-$400K SaaS benchmark).
  flags:
    - Base case assumes buyers will fund resilience software during ordinary planning cycles; a one-quarter sales-cycle slip is the largest downside sensitivity.
    - Blended ARPA rises from $48K in the pilot-heavy first year to $90K by Y3, so weak second-workflow attach or drill monetization would materially compress revenue.
    - Gross margin only clears the 70% target in Y3, which means lingering services-heavy onboarding would delay profitability.
    - Revenue per FTE is only at the low end of SaaS benchmarks by Y3 because the business is still carrying integration-heavy onboarding work.
