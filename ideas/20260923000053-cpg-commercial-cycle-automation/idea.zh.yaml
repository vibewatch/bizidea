problem: >-
  CPG 品牌在财务工具里处理扣款，在促销投入软件里规划促销，在预测表格里管补货，所以没有任何一套系统真正记得利润为什么漏掉。零售商短付、指控促销不合规，或因服务失败罚款时，证据散落在门户、PDF、邮件和分销商文件里，结果往往是财务把这笔单结掉了，但销售和规划团队并没有改掉背后的错误假设。下一轮促销或采购单里，同样的错误又会再来一遍。现有工具只能把事后工作记下来，不能把已经解决的事件变成面向未来的护栏。
targetUser:
  primary: >-
    美国食品、饮料和家居用品品牌里的收入增长管理、扣款管理或商业财务负责人；这类品牌零售收入在 $50 million 到 $500 million 之间，通常对接 3 到 10 个大型零售商或分销商账户。
  secondary: >-
    同一品牌内部的销售运营和需求规划团队，他们需要把索赔成因翻译成下一轮账户护栏。
  buyer: >-
    中型 CPG 品牌的 CFO、首席商务官或收入增长管理副总裁。
startupThesis:
  nonObviousInsight: >-
    护城河不在于更快起草申诉，而在于把每一次已解决的扣款都变成可复用的商业规则，在钱再次漏掉前就改写下一轮促销、应计和补货决策。
  beachhead: >-
    美国食品、饮料和家居用品品牌；它们的财务、促销投入和规划系统彼此分离，经常遇到零售商扣款，并且每周都有销售与运营规划节奏。
  wedge: >-
    这是一条从扣款走向预防的工作流：系统吃进汇款通知、门户索赔、促销日历、出货记录和预测基线，吐出给财务的认赔或申诉资料包，以及下一轮周期里要执行的精确护栏。
  whyNowCatalyst: >-
    当天的新闻已经说明，品牌方仍在门户、PDF 和邮件里工作；与此同时，新资金正流向能把财务、销售和运营决策连起来的零点击工作流。
  ventureScalePath: >-
    先从品牌侧的扣款转预防切入，再扩到促销应计、分销商协同、餐饮服务渠道规划、客户记分卡，最后成为多渠道毛转净管理的商业记忆层。
solution: >-
  扣款成因账本把零售商门户、汇款文件、经纪商备注、促销日历、出货记录和预测基线接起来，不要求品牌拆掉现有 ERP、TPM 或规划栈。它把与一笔短付、追补扣款或合规索赔相关的所有材料归到同一条商业事件记录里，识别最可能的根因，并替财务起草认赔或申诉资料包。真正拉开差异的是下一步：每一笔结案事件都会回写到下一轮周期里——促销模板新增证明要求，应计逻辑随之更新，客户经理在答应条款前先看到审批护栏，规划团队也会收到和同类成因绑定的补货预警。只有低置信度事件或经济影响重大的规则变更，才需要人工复核。时间越久，产品越像品牌在零售商和分销商渠道里的商业记忆，而不是另一个点状模块。
goToMarketSeed:
  firstCustomer: >-
    年零售收入在 $75 million 到 $250 million 之间的零食、饮料、冷冻食品或家居用品品牌；它通过 2 到 6 家大卖场零售商外加一家全国性分销商出货，财务运营团队精简，并且每周都有账户复盘电话。
  buyingTrigger: >-
    某个季度扣款抬头、毛转净出现明显偏差，或 ERP/TPM 重构暴露出大量商业知识其实还躺在表格和邮件里。
  currentAlternative: >-
    AR 扣款工具、TPM 套件、零售商门户、分销商表格，以及每周一次的异常例会。
  switchingReason: >-
    它把索赔结案和下一轮预防真正闭环，品牌不用再在两套系统里反复解决同一笔扣款。
  pricingHypothesis: >-
    采用按活跃零售商/分销商账户对或按托管零售销售额计费的年度 SaaS 订阅，再加上每条渠道映射的实施费。
