      运营痛点已经被明确描述为扣款、促销投入、预测和规划之间的割裂，因此一款跨职能产品现在比过去更急迫。
    signalRefs:
      - 利润漏损本质上是跨职能工作流问题
    sourceRefs:
      - 1
      - 2
      - 4
  - point: >-
      核心输入仍通过门户、PDF 和邮件流转，所以谁先把这些材料变成结构化事件，谁就能替掉大量人工对账工作。
    signalRefs:
      - 关键输入仍困在门户和 PDF 里
    sourceRefs:
      - 3
  - point: >-
      投资人正在押注零点击工作流和“只在人类必须决策时才抛出界面”的产品，这说明市场已经准备好为能对商业事件直接出手的软件买单，而不是只看报表。
    signalRefs:
      - 买方正在为能直接行动的工作流买单
    sourceRefs:
      - 1
      - 4
  - point: >-
      向餐饮服务扩张说明，一旦零售切口被验证，同一类商业周期问题可以自然蔓延到相邻渠道。
    signalRefs:
      - 餐饮服务把同一团运营死结拉得更大
    sourceRefs:
      - 1
      - 2
differentiator: >-
  扣款软件帮催收团队追回现金，促销投入系统负责规划促销，预测工具负责推演销量假设，但没有哪一类工具能把三者之间的因果记忆保留下来。这个概念真正占住的是每次事件结案后产出的预防规则，并把规则回写进未来的促销审批、应计假设和补货护栏里。最难复制的资产，是一套跨账户的根因模式库和预防打法库，按零售商、分销商和促销类型持续累积。
conceptDiagram:
  title: 从扣款到预防
  mermaid: |
    flowchart LR
      Deduction[Retailer deduction] --> Incident[Commercial incident record]
      Incident --> Evidence[Accept or dispute packet]
      Incident --> Rules[Prevention rules]
      Rules --> Promo[Next promotion approval]
      Rules --> Plan[Accrual and replenishment guardrails]
      Promo --> Margin[Protected gross-to-net margin]
      Plan --> Margin
businessModelCanvas:
  customerSegments:
    - 中型食品和饮料 CPG 品牌
    - 通过大型零售商和分销商销售的家居及个护品牌
    - 横跨财务、收入增长管理、销售运营和规划的品牌内部团队
  valuePropositions:
    - 把扣款变成可复用的预防规则，而不是一次性的申诉劳动
    - 用同一条商业事件记录把财务、销售和规划决策接起来
    - 不替换现有 ERP 或 TPM 栈，也能减少反复出现的毛转净漏损
  channels:
    - ERP、EDI 和促销系统实施伙伴
    - CPG 行业里的 CFO、扣款管理和收入增长管理社群
    - 服务中型品牌的外包财务和商业运营咨询机构
  customerRelationships:
    - 针对首批零售商和分销商映射的高触达实施
    - 与可量化利润回收挂钩的季度漏损复盘
    - 会随时间越积越深的规则库和基准对比
  revenueStreams:
    - 按活跃零售商或分销商账户对收费的年度订阅
    - 实施和集成费用
    - 面向成熟客户的基准对比和工作流自动化增购
  keyResources:
    - 连接索赔、促销、出货和预测的商业事件本体
    - 零售商和分销商映射模板
    - 预防规则库和基准数据集
  keyActivities:
    - 从门户、PDF、邮件和文件中摄取并归一商业材料
    - 识别事件根因并生成证据资料包
    - 把前瞻规则回写进促销、应计和规划工作流
  keyPartners:
    - ERP、TPM、EDI 和规划系统集成商
    - 经纪商机构和分销商数据提供方
    - 财务与收入增长管理顾问
  costStructure:
    - 集成和产品工程
    - 负责实施与异常复核的应用运营分析师
    - 客户成功和基准项目管理
jobsToBeDone:
  - job: >-
      当大型零售商或分销商发出扣款时，帮扣款负责人处理争议并同步更新未来账户规则，让品牌既能追回现金，也能避免同样的漏损反复出现。
    currentAlternative: AR 扣款工具、零售商门户，以及临时拉群找邮件证据
    successMetric: 重复扣款率、结案天数和毛转净回收额
  - job: >-
      当收入增长和规划团队锁定下一轮促销与补货周期时，帮他们提前看见哪些条款、应计和服务假设最可能重演过去的扣款，从而在下一笔订单发出前先把利润守住。
    currentAlternative: TPM 日历、表格化应计和每周 S&OP 会议
    successMetric: 每轮周期避免的利润漏损，以及由预测失误引发的扣款下降幅度
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      把每次已解决的扣款都变成跨财务、促销和规划的前瞻预防规则，这比再做一个扣款机器人或预测插件都更有辨识度。
  venturePotential:
    score: 4
    rationale: >-
      这个切口可以顺着整条商业周期和相邻渠道往外扩，但要卖进跨职能品牌团队，仍需要偏企业级的实施能力。
  whiteSpace:
    score: 5
    rationale: >-
      现有厂商把扣款管理、促销管理和规划拆开了，还没有任何系统会把已结案事件的成因回写进未来的商业决策里。
  painIntensity:
    score: 4
    rationale: >-
      反复出现的扣款和预测偏差会直接侵蚀毛转净利润，也会在季度末把品牌财务和大客户团队拖进救火模式。
  wedgeClarity:
    score: 5
    rationale: >-
      首条工作流精准围绕大客户扣款和重复根因展开，从索赔结案走到预防闭环的路径非常清楚。
  evidenceFit:
    score: 5
    rationale: >-
      一份公司原始材料加上三份外部来源，描述的是同一件事：工作流割裂、输入还在手工流转，以及市场正转向能直接行动的自动化。
topRisks:
  - name: 数据归一化拖慢进度
    description: 零售商门户、汇款格式和分销商文件差异很大，早期部署可能因此变慢。
    mitigation: 先只做 3 到 5 个高交易量账户映射，尽快沉淀可复用模板，再把分析师复核留给最脏的长尾。
  - name: 跨职能采用断层
    description: 财务可能先采纳争议处理工作流，但销售和规划团队未必愿意相信面向未来的规则。
    mitigation: 直接把输出塞进促销审批和 S&OP 复盘里，并通过 CFO 或收入增长管理买方成交，让对方有能力强推闭环。
  - name: 套件厂商顺手压进来
    description: 一旦这个品类被证明有价值，ERP、TPM 或规划厂商可能补上更轻的扣款集成功能。
    mitigation: >-
      要抢先做出市场里最难抄的资产：覆盖零售商、分销商和促销类型的、带基准对比的事件与预防规则库。
