scenarios:
  downside:
    description: Pilot conversion slips, more buyers stay on smaller initial scopes, and service-heavy onboarding keeps margins below plan.
    y3RevenueK: 1147.5
    y3EbitdaK: -541.2
    cashLowPointK: 469.2
    keyAssumptionChanges:
    - End-Y2 customers fall from 7 to 6 and end-Y3 customers fall from 14 to 12 because pilot-to-production conversion lands closer to 45-50% than the planned 60%+ target.
    - Blended realized ARPU drops from $115K to $105K in Y2 and from $150K to $135K in Y3 as fewer logos add mapped accounts or benchmark-style upsells.
    - Gross margin slips from 70% to 67% if retailer and distributor mappings remain more bespoke than the template-reuse plan assumes.
  base:
    description: Founder-led selling plus partner-assisted onboarding converts pilots steadily without pushing fixed cost far ahead of proof.
    y3RevenueK: 1518.8
    y3EbitdaK: -247.0
    cashLowPointK: 813.4
    keyAssumptionChanges:
    - Customers grow from 2 paying logos at the end of Y1 to 7 at the end of Y2 and 14 at the end of Y3, which stays inside the business plan's Y2 and Y3 logo milestones.
    - Blended realized revenue per active logo rises from $72K in Y1 to $115K in Y2 and $150K in Y3 as pilots convert and more accounts, mappings, and benchmark-style upsells attach to each logo.
    - Headcount reaches only 8 FTE by Q4Y3 because the second engineer waits until late Y2 and the second GTM hire waits until late Y3.
  upside:
    description: Partner referrals and cleaner data access speed both production conversion and account expansion while the team stays lean.
    y3RevenueK: 1920.0
    y3EbitdaK: 72.4
    cashLowPointK: 1071.0
    keyAssumptionChanges:
    - End-Y2 customers rise from 7 to 8 and end-Y3 customers rise from 14 to 16 because the integrator and consultant channel becomes productive earlier.
    - Blended realized ARPU improves to $120K in Y2 and $160K in Y3 as more customers expand mapped accounts and add benchmark or adjacent-workflow fees sooner.
    - Gross margin improves from 70% to 72% because template reuse reduces partner and manual-delivery cost faster than planned.
sensitivity:
- variable: sales cycle
  downsideCase: Pilot-to-production stretches toward 150 days and conversion falls toward 45-50%
  baseCase: Paid pilot to production inside roughly 120 days with 60%+ conversion
  upsideCase: Repeatable 90-day deployments with 70% conversion and more partner-assisted starts
  y3RevenueImpactK: 371.3
  cashImpactK: 345.0
- variable: ARPU
  downsideCase: $135K blended Y3 realized annual revenue per active logo
  baseCase: $150K blended Y3 realized annual revenue per active logo
  upsideCase: $160K blended Y3 realized annual revenue per active logo
  y3RevenueImpactK: 151.9
  cashImpactK: 106.3
- variable: CAC
  downsideCase: $95K CAC if founder-led outbound dominates and partner referrals stay thin
  baseCase: $80K CAC
  upsideCase: $65K CAC with stronger integrator and consultant referral flow
  y3RevenueImpactK: 90.0
  cashImpactK: 180.0
- variable: churn
  downsideCase: 2.0% monthly churn if prevention rules do not become embedded in customer workflows
  baseCase: 1.25% monthly churn
  upsideCase: 1.0% monthly churn once rule adoption and account expansion improve stickiness
  y3RevenueImpactK: 108.8
  cashImpactK: 76.2
- variable: gross margin
  downsideCase: 67% gross margin if onboarding remains services-heavy
  baseCase: 70% gross margin
  upsideCase: 72% gross margin with better template reuse
  y3RevenueImpactK: 0.0
  cashImpactK: 59.8
- variable: hiring pace
  downsideCase: Pull the second GTM hire into Q2Y3 and add another engineer before template reuse is proven
  baseCase: Second engineer in late Q4Y2 and second GTM hire in late Q3Y3
  upsideCase: Delay the second GTM hire to Q4Y3 if partner channels stay productive
  y3RevenueImpactK: 0.0
  cashImpactK: 110.0
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Leads[Qualified deduction-pain leads] --> Pilots[Paid pilots]
      Pilots --> Production[Production logos]
      Production --> Revenue[Subscription plus mapping revenue]
      Production --> Expansion[More mapped accounts and benchmark upsells]
      Expansion --> Revenue
      Revenue --> GrossProfit[70 percent gross profit]
      GrossProfit --> Cash[Runway and next-round proof]
modelSanity:
- checkName: Revenue engine
  finding: Base-case revenue comes from moving from two paying logos in Y1 to fourteen by Q4Y3 while blended realized revenue per logo rises from $72K to $150K as pilots convert and account scope expands.
- checkName: Must go right
  finding: Template-assisted onboarding has to keep incremental retailer or distributor account deployments manageable so the company can reach seven production logos by end Y2 without hiring far ahead of revenue.
- checkName: Model breaks if
  finding: If pilot conversion falls toward 45-50% and gross margin slips to 67% because mappings stay bespoke, downside Y3 revenue falls to about $1.15M and the cash low point drops to roughly $0.47M.
- checkName: Next-round proof
  finding: The seed story is three to five production logos with sub-30-day incremental onboarding and live rule adoption, creating a path to fourteen logos and near-breakeven quarters by Y3.
sanityChecks:
  ruleOf40: Y3 growth 220.2% + EBITDA margin -16.3% = 203.9%
  burnMultiple: Y2 burn multiple is about 1.1x using $680.9K EBITDA burn over about $600.0K net new ARR; it improves toward roughly 0.3x in Y3.
  revenuePerFte: $189.9K Y3 with 8 FTE at Q4Y3 (benchmark $200-400K SaaS)
  flags:
  - Base-case Y3 revenue per FTE is still slightly below the usual $200-400K SaaS benchmark because the company is carrying onboarding and analyst-support load well into Year 3.
  - The model holds gross margin at the business plan's 70% target even though early deployments are integration-heavy, so slower template reuse would hurt both CAC payback and runway quickly.
  - Customer growth from seven logos at the end of Y2 to fourteen at the end of Y3 assumes integrator and consultant channels start producing repeatable referrals before a large direct-sales team exists.
  - Cash is rolled forward from EBITDA with minimal working-capital adjustment, so annual prepayments, delayed onboarding collections, or heavier partner pass-through costs could move real cash by a few hundred thousand dollars.
