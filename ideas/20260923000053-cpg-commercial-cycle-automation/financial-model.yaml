slug: deduction-cause-ledger
date: '2026-09-23'
currency: USD
modelStartMonth: 2026-10
assumptions:
- id: A1
  name: Model start and financing timing
  value: 2026-10
  unit: YYYY-MM
  source: '[BP date; BP fundingAsk] Model starts the month after the business plan date and assumes the pre-seed closes before M1 so cash can roll forward cleanly.'
- id: A2
  name: Opening cash
  value: '2400'
  unit: USDK
  source: '[BP fundingAsk.targetFundingRangeUsd; BP fundingAsk.runwayMonths; Startup-finance heuristic: milestone-plus-buffer sizing] Uses a $2.4M pre-seed inside the stated $2-4M range, sized to reach the month-18 milestone and still leave roughly six months of cash buffer.'
- id: A3
  name: Revenue recognition cadence
  value: New paying logos contribute half-period revenue in the landing month or quarter
  unit: policy
  source: '[Startup-finance heuristic: early B2B SaaS] Early pilots and implementations rarely start on day one, so new wins are recognized at half-period contribution in the period they land.'
- id: A4
  name: Y1 blended realized ARPU
  value: '72'
  unit: USDK annual per paying logo
  source: '[BP investorMemo.firstCustomer.initialContract; BP milestones] Year 1 is pilot-heavy, so realized revenue per active logo stays below the $80k-$120k production subscription band even after one pilot begins converting.'
- id: A5
  name: Y2 blended realized ARPU
  value: '115'
  unit: USDK annual per paying logo
  source: '[BP investorMemo.firstCustomer.initialContract; BP milestones] Year 2 assumes more customers are on production contracts and start paying added mapping fees as they expand beyond the first 3-5 accounts.'
- id: A6
  name: Y3 blended realized ARPU
  value: '150'
  unit: USDK annual per paying logo
  source: '[BP businessModel.revenueStreams; BP milestones; BP product.twentyFourMonth] Year 3 blends production subscription revenue with onboarding, added account mappings, and early benchmark or adjacent-workflow upsells.'
- id: A7
  name: Steady-state recurring ACV for unit economics
  value: '120'
  unit: USDK annual per production logo
  source: '[BP investorMemo.firstCustomer.initialContract; BP market.som] Uses the midpoint of the stated $80k-$120k annual subscription band plus modest account expansion, while staying near the plan''s roughly $100k ARR SOM framing.'
- id: A8
  name: Customer ramp
  value: 2 EOY1 / 7 EOY2 / 14 EOY3 paying logos
  unit: customers
  source: '[BP milestones; BP gtm.funnelTargets; Research reportMemo.distributionChannels] Matches two paid pilots in Y1, the plan''s 5-7 production-logo target by Y2 year-end, and the plan''s 12-15 production-logo target by Y3 year-end.'
- id: A9
  name: Target gross margin
  value: '70'
  unit: percent
  source: '[BP businessModel.targetGrossMarginPct] Used directly as the model''s base-case gross margin target.'
- id: A10
  name: COGS policy
  value: 30 percent of revenue
  unit: policy
  source: '[BP operations; BP product.twentyFourMonth; BP businessModel.targetGrossMarginPct] COGS represents cloud, document parsing, partner support, and direct onboarding load that must taper with template reuse to preserve the 70% gross-margin target.'
- id: A11
  name: Monthly churn
  value: '1.25'
  unit: percent
  source: '[Startup-finance heuristic: early vertical SaaS] Annual contracts and embedded workflows support low logo churn, but the product is still early enough that the model should not underwrite enterprise-grade retention yet.'
- id: A12
  name: Fully loaded CAC
  value: '80'
  unit: USDK per new production logo
  source: '[BP gtm.funnelTargets; Research reportMemo.distributionChannels; Research reportMemo.partnershipEcosystem] Founder-led selling plus EDI, compliance, and consultant referrals support a high-five-figure CAC assumption without assuming low-touch SMB acquisition.'
- id: A13
  name: Loaded salary bands
  value: Founder 120 / Engineering 165 / Deductions Ops 120 / Solutions 130 / Customer Success 110 / Sales 150
  unit: USDK annual per FTE
  source: '[Startup-finance heuristic: lean U.S. vertical SaaS team] Uses cash-conscious but believable loaded pay bands for a pre-seed team covering product, domain operations, implementation, and founder-led GTM.'
- id: A14
  name: Headcount snapshots
  value: 3 FTE Q1Y1 / 4 Q2Y1 / 5 Q3Y1 / 6 Q4Y1 / 7 Q4Y2 / 8 Q4Y3
  unit: FTE
  source: '[BP team; BP strategicChoices.sequencingRationale] Starts with the six explicit roles in the business plan and adds only one engineer in late Y2 plus a second GTM hire in late Y3 so hiring stays behind proof points.'
- id: A15
  name: In-quarter hire timing
  value: Second engineer starts late Q4Y2 and second GTM hire starts late Q3Y3
  unit: timing
  source: '[BP strategicChoices.sequencingRationale; Startup-finance heuristic: hire to milestones] Actual salary expense ramps more smoothly than the year-end snapshots because the company should wait for production proof before adding fixed cost.'
- id: A16
  name: Non-payroll operating spend
  value: Y1 monthly 10-18 / Y2 quarterly 42-60 / Y3 quarterly 66-84
  unit: USDK
  source: '[BP operations; BP risks; Startup-finance heuristic: pre-seed operating envelope] Covers cloud, travel, partner enablement, legal, and audit-log or data-ingestion tooling while keeping the company deliberately lean.'
- id: A17
  name: Cash conversion assumption
  value: EBITDA approximates operating cash flow
  unit: policy
  source: '[Startup-finance heuristic: asset-light SaaS] Assumes minimal capex, debt, and working-capital distortion so the cash bridge stays understandable at this stage.'
- id: A18
  name: Financing objective
  value: Reach 3-5 production logos by month 18, prove template reuse, and retain six months of buffer before the next round
  unit: milestone
  source: '[BP fundingAsk.useOfFundsSummary; BP milestones] The pre-seed is sized to prove production conversion, incremental onboarding speed, and cross-functional rule adoption before a seed round.'
