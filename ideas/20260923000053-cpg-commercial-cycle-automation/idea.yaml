topRisks:
  - name: Data normalization drag
    description: Retailer portals, remittance formats, and distributor files
      vary widely, which can slow early deployments.
    mitigation: Start with 3 to 5 high-volume account mappings, ship reusable
      templates, and use analyst review only for the messy tail.
  - name: Cross-functional adoption gap
    description: Finance may adopt the dispute workflow before sales and
      planners trust the forward-looking rules.
    mitigation: Tie outputs directly to promotion approvals and S&OP reviews,
      and sell through a CFO or revenue-growth buyer who can enforce the loop.
  - name: Suite-vendor encroachment
    description: ERP, TPM, or planning vendors could add lighter deduction
      integrations once the category proves valuable.
    mitigation: >-
      Build the hardest-to-copy asset in the market: a benchmarked incident
      and prevention-rule library spanning retailers, distributors, and
      promotion types.
