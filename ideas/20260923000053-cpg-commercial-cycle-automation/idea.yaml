    ERP/TPM reimplementation that exposes how much commercial knowledge still
    lives in spreadsheets and email
  currentAlternative: >-
    AR deduction tools, trade promotion management suites, retailer portals,
    distributor spreadsheets, and weekly exception meetings
  switchingReason: >-
    It closes the loop from claim resolution to next-cycle prevention, so
    brands stop solving the same deduction twice in different systems.
  pricingHypothesis: >-
    Annual SaaS subscription priced by active retailer or distributor account
    pairs or by gross retail sales under management, plus onboarding fees for
    each channel mapping
