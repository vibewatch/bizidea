jobsToBeDone:
  - job: >-
      When a major retailer or distributor issues a deduction, help the
      deductions lead resolve the claim and update future account rules, so
      the brand can recover cash and stop the same leak from repeating.
    currentAlternative: AR deduction tools, retailer portals, and ad hoc email evidence hunts
    successMetric: Repeat-deduction rate, days to resolution, and gross-to-net recovery
  - job: >-
      When revenue growth and planning teams lock the next promotion and
      replenishment cycle, help them see which terms, accruals, and service
      assumptions are likely to recreate past deductions, so they can protect
      margin before the next order ships.
    currentAlternative: TPM calendars, spreadsheet accruals, and weekly S&OP calls
    successMetric: Margin leakage avoided per cycle and reduction in forecast-driven deductions
