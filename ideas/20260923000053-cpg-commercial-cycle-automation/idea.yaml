differentiator: >-
  Deduction software helps collectors recover cash, trade-spend systems plan
  promotions, and forecasting tools push volume assumptions, but none of them
  preserve causal memory across all three. This concept owns the prevention
  rule emitted after every incident and can write that rule back into future
  promotion approvals, accrual assumptions, and replenishment guardrails. The
  defensible asset is a cross-account library of root-cause patterns and
  prevention plays by retailer, distributor, and promotion type.
conceptDiagram:
  title: From deduction to prevention
  mermaid: |
    flowchart LR
      Deduction[Retailer deduction] --> Incident[Commercial incident record]
      Incident --> Evidence[Accept or dispute packet]
      Incident --> Rules[Prevention rules]
      Rules --> Promo[Next promotion approval]
      Rules --> Plan[Accrual and replenishment guardrails]
      Promo --> Margin[Protected gross-to-net margin]
      Plan --> Margin
