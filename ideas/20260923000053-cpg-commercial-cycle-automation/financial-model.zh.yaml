modelDiagram:
  title: 单位经济模型流转
  mermaid: |
    flowchart LR
      Leads[Qualified deduction-pain leads] --> Pilots[Paid pilots]
      Pilots --> Production[Production logos]
      Production --> Revenue[Subscription plus mapping revenue]
      Production --> Expansion[More mapped accounts and benchmark upsells]
      Expansion --> Revenue
      Revenue --> GrossProfit[70 percent gross profit]
      GrossProfit --> Cash[Runway and next-round proof]
modelSanity:
- checkName: 收入引擎
  finding: 基准情景下的收入增长来自两个驱动：Y1 只有两家付费客户，到 Q4Y3 增长到十四家；同时单客户混合实现收入也会随着试点转正式和账户扩张，从 $72K 提升到 $150K。
- checkName: 必须做对的事
  finding: 模板辅助实施必须把新增零售商或分销商账户的部署负担压在可控范围内，公司才能在不明显超前招人的前提下，于 Y2 年末做到七家正式客户。
- checkName: 模型会在哪些情况下失效
  finding: 如果试点转正式率掉到 45-50%，且因映射长期定制导致毛利率滑到 67%，则 downside 情景下 Y3 收入会跌到约 $1.15M，现金低点也会降到约 $0.47M。
- checkName: 下一轮证明点
  finding: seed 的核心故事是先做到三到五家正式客户、把增量实施压到 30 天以内，并让规则在真实流程里被采用；只有这样，Y3 冲到十四家客户和接近盈亏平衡的季度才站得住。
sanityChecks:
  ruleOf40: Y3 增长 220.2% + EBITDA 利润率 -16.3% = 203.9%
  burnMultiple: Y2 的 burn multiple 约为 1.1x，计算方式是用 $680.9K EBITDA burn 对应约 $600.0K 的净新增 ARR；这一指标会改善到约 0.3x，并在 Y3 出现。
  revenuePerFte: $189.9K：Y3 时每个 FTE 对应收入，按 8 FTE 和 Q4Y3 计算（benchmark 为 $200-400K SaaS）
  flags:
  - 基准情景下，Y3 的单 FTE 收入仍略低于常见的 $200-400K SaaS 基准，因为公司到 Year 3 仍在承担不轻的实施和分析师支持负担。
  - 模型把毛利率固定在 business plan 设定的 70%，但早期部署本身集成很重，因此只要模板复用变慢，CAC 回收期和现金跑道都会很快承压。
  - 从 Y2 年末的七家客户长到 Y3 年末的十四家，隐含前提是：在大规模直销团队尚未建立前，集成商和顾问渠道就已经能稳定带来可复制转介绍。
  - 现金是按 EBITDA 近似向前滚动，几乎没有营运资本调整；因此无论是年度预付、实施回款推迟，还是更重的伙伴 pass-through 成本，都可能让真实现金上下偏移几十万美元。
