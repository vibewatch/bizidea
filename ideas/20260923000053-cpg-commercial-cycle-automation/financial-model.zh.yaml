fundingAsk:
  round: pre-seed
  amountM: 2.4
  runwayMonths: 24
  milestone: 达到 3-5 家正式客户，证明模板辅助实施和在线规则采纳，同时在下一轮融资启动时仍保留约六个月现金缓冲。
