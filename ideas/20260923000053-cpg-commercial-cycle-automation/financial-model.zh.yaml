    percentage: 10
  - bucket: 缓冲（6 个月）
    amountUsd: 600000
    percentage: 25
scenarios:
  downside:
    description: 试点转正式变慢，更多买方停留在更小的初始范围上，且重服务实施让毛利率持续低于计划。
    y3RevenueK: 1147.5
    y3EbitdaK: -541.2
    cashLowPointK: 469.2
    keyAssumptionChanges:
    - Y2 年末客户从 7 家降到 6 家，Y3 年末从 14 家降到 12 家，因为试点转正式的转化更接近 45-50%，而不是计划中的 60%+。
    - 混合实现 ARPU 从 $115K 降到 $105K（Y2），再从 $150K 降到 $135K（Y3），因为更少客户会扩展已映射账户或购买基准式增购。
    - 如果零售商和分销商映射仍比模板复用计划预想的更定制，毛利率会从 70% 下滑到 67%。
  base:
    description: 创始人主导销售加伙伴辅助实施，让试点稳定转正式，同时固定成本不明显跑在验证之前。
    y3RevenueK: 1518.8
    y3EbitdaK: -247.0
    cashLowPointK: 813.4
    keyAssumptionChanges:
    - 客户数从 2 家（Y1 年末）增长到 7 家（Y2 年末）和 14 家（Y3 年末），也仍落在 business plan 的 Y2 与 Y3 客户里程碑区间内。
    - 单个活跃客户的混合实现收入会从 $72K（Y1）提升到 $115K（Y2），再提升到 $150K（Y3），因为试点转正式，且更多账户、映射和基准式增购开始附着到每个客户上。
    - 团队只扩到 8 FTE（Q4Y3），因为第二名工程师等到 Y2 靠后才入职，第二名 GTM 招聘则推到 Y3 靠后。
  upside:
    description: 伙伴转介绍和更干净的数据接入同时加快正式转化和账户扩张，而团队仍保持精简。
    y3RevenueK: 1920.0
    y3EbitdaK: 72.4
    cashLowPointK: 1071.0
    keyAssumptionChanges:
    - Y2 年末客户从 7 家升到 8 家，Y3 年末从 14 家升到 16 家，因为集成商和顾问渠道更早开始稳定出单。
    - 混合实现 ARPU 会提升到 $120K（Y2）和 $160K（Y3），因为更多客户更早扩展已映射账户，并提前加上基准报告或相邻工作流费用。
    - 由于模板复用比预期更快压低伙伴和人工交付成本，毛利率会从 70% 提升到 72%。
sensitivity:
- variable: 销售周期
  downsideCase: 试点转正式被拉长到接近 150 天，转化率下探到 45-50%
  baseCase: 付费试点约 120 天内转正式，转化率 60%+
  upsideCase: 可重复的 90 天部署，转化率 70%，且更多项目由伙伴协助启动
  y3RevenueImpactK: 371.3
  cashImpactK: 345.0
- variable: ARPU
  downsideCase: $135K：Y3 单个活跃客户的混合实现年收入
  baseCase: $150K：Y3 单个活跃客户的混合实现年收入
  upsideCase: $160K：Y3 单个活跃客户的混合实现年收入
  y3RevenueImpactK: 151.9
  cashImpactK: 106.3
- variable: CAC
  downsideCase: 如果创始人外呼占主导且伙伴转介绍偏弱，CAC 会来到 $95K
  baseCase: $80K CAC
  upsideCase: 若集成商和顾问转介绍更强，CAC 可降到 $65K
  y3RevenueImpactK: 90.0
  cashImpactK: 180.0
- variable: 流失率
  downsideCase: 如果预防规则没有真正嵌进客户工作流，月度流失率会上升到 2.0%
  baseCase: 1.25% 月度流失率
  upsideCase: 一旦规则采纳和账户扩张提升黏性，月度流失率可降到 1.0%
  y3RevenueImpactK: 108.8
  cashImpactK: 76.2
- variable: 毛利率
  downsideCase: 如果实施始终重服务，毛利率会降到 67%
  baseCase: 70% 毛利率
  upsideCase: 如果模板复用更顺，毛利率可升到 72%
  y3RevenueImpactK: 0.0
  cashImpactK: 59.8
- variable: 招聘节奏
  downsideCase: 在 Q2Y3 就提前招第二名 GTM，并在模板复用尚未被证明前再补一名工程师
  baseCase: 第二名工程师在 Q4Y2 靠后加入，第二名 GTM 在 Q3Y3 靠后加入
  upsideCase: 如果伙伴渠道持续高产，可以把第二名 GTM 延后到 Q4Y3
