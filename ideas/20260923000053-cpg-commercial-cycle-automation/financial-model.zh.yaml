slug: deduction-cause-ledger
date: '2026-09-23'
currency: USD
modelStartMonth: 2026-10
assumptions:
- id: A1
  name: 模型起点与融资时点
  value: 2026-10
  unit: YYYY-MM
  source: '[BP date; BP fundingAsk] 模型从 business plan 日期后的次月开始，并假设 pre-seed 在 M1 前完成，这样现金可以顺畅滚动。'
- id: A2
  name: 期初现金
  value: '2400'
  unit: USDK
  source: '[BP fundingAsk.targetFundingRangeUsd; BP fundingAsk.runwayMonths; Startup-finance heuristic: milestone-plus-buffer sizing] 这里采用 $2.4M 的 pre-seed，位于既定 $2-4M 区间内，规模足以跑到第 18 个月里程碑，同时还保留约六个月现金缓冲。'
- id: A3
  name: 收入确认节奏
  value: 新签付费客户在落地当月或当季按半期收入确认
  unit: policy
  source: '[Startup-finance heuristic: early B2B SaaS] 早期试点和实施很少会在第一天就完整启动，因此新签客户在落地当期按半期贡献收入确认。'
- id: A4
  name: Y1 混合实现 ARPU
  value: '72'
  unit: USDK / 年 / 每个付费客户
  source: '[BP investorMemo.firstCustomer.initialContract; BP milestones] Y1 仍以试点为主，因此即便有一个试点开始转化，活跃客户的已实现收入仍低于 $80k-$120k 的正式订阅区间。'
- id: A5
  name: Y2 混合实现 ARPU
  value: '115'
  unit: USDK / 年 / 每个付费客户
  source: '[BP investorMemo.firstCustomer.initialContract; BP milestones] Y2 假设更多客户已转入正式合同，并在扩到首批 3-5 个账户之外时开始支付额外映射费用。'
- id: A6
  name: Y3 混合实现 ARPU
  value: '150'
  unit: USDK / 年 / 每个付费客户
  source: '[BP businessModel.revenueStreams; BP milestones; BP product.twentyFourMonth] Y3 会把正式订阅收入、实施费、额外账户映射费，以及早期基准报告或相邻工作流增购收入一起摊进来。'
- id: A7
  name: 单位经济模型使用的稳态 ACV
  value: '120'
  unit: USDK / 年 / 每个正式客户
  source: '[BP investorMemo.firstCustomer.initialContract; BP market.som] 这里采用 $80k-$120k 年订阅带宽的中位数，再叠加温和的账户扩张，同时仍贴近计划中约 $100k ARR 的 SOM 设定。'
- id: A8
  name: 客户爬坡
  value: 2 家 Y1 末 / 7 家 Y2 末 / 14 家 Y3 末的付费客户
  unit: customers
  source: '[BP milestones; BP gtm.funnelTargets; Research reportMemo.distributionChannels] 这与 Y1 的两个付费试点、计划中的 5-7 家正式客户（Y2 年末），以及 12-15 家正式客户（Y3 年末）的里程碑相匹配。'
- id: A9
  name: 目标毛利率
  value: '70'
  unit: percent
  source: '[BP businessModel.targetGrossMarginPct] 直接采用 business plan 给出的基准毛利率目标。'
- id: A10
  name: COGS 政策
  value: 30 percent of revenue
  unit: policy
  source: '[BP operations; BP product.twentyFourMonth; BP businessModel.targetGrossMarginPct] COGS 代表云成本、文档解析、伙伴支持和直接实施负担；只有模板复用持续改善，才能守住 70% 的毛利率目标。'
- id: A11
  name: 月度流失率
  value: '1.25'
  unit: percent
  source: '[Startup-finance heuristic: early vertical SaaS] 年度合同加嵌入式工作流有助于把客户流失压低，但产品仍然很早期，模型不应过早按企业级留存来承保。'
- id: A12
  name: 全摊 CAC
  value: '80'
  unit: USDK / 每个新增正式客户
  source: '[BP gtm.funnelTargets; Research reportMemo.distributionChannels; Research reportMemo.partnershipEcosystem] 创始人主导销售，再加上 EDI、合规和顾问转介，足以支撑一个高五位数的 CAC 假设，但并没有假设低触达 SMB 获客。'
- id: A13
  name: 含全成本薪酬带宽
  value: 创始人 120 / 工程 165 / 扣款运营 120 / 解决方案 130 / 客户成功 110 / 销售 150
  unit: USDK / 年 / 每个 FTE
  source: '[Startup-finance heuristic: lean U.S. vertical SaaS team] 这里采用现金克制但仍可信的全成本薪酬带宽，覆盖 pre-seed 团队在产品、行业运营、实施和创始人主导 GTM 上的关键岗位。'
- id: A14
  name: 人员配置快照
  value: 3 FTE Q1Y1 / 4 Q2Y1 / 5 Q3Y1 / 6 Q4Y1 / 7 Q4Y2 / 8 Q4Y3
  unit: FTE
  source: '[BP team; BP strategicChoices.sequencingRationale] 先按 business plan 明确列出的六个角色起步，再在 Y2 末补一名工程师、Y3 末补第二名 GTM，让招聘始终落后于验证节点。'
- id: A15
  name: 季内招聘时点
  value: 第二名工程师在 Q4Y2 靠后入职，第二名 GTM 在 Q3Y3 靠后入职
  unit: timing
  source: '[BP strategicChoices.sequencingRationale; Startup-finance heuristic: hire to milestones] 实际薪酬支出会比年末快照更平滑，因为公司应等到正式部署证据更明确后，再增加固定成本。'
- id: A16
  name: 非人力运营支出
  value: Y1 monthly 10-18 / Y2 quarterly 42-60 / Y3 quarterly 66-84
  unit: USDK
  source: '[BP operations; BP risks; Startup-finance heuristic: pre-seed operating envelope] 这部分覆盖云资源、差旅、伙伴赋能、法务，以及审计日志或数据摄取工具，同时让公司整体保持克制。'
- id: A17
  name: 现金转化假设
  value: EBITDA 近似等于经营现金流
  unit: policy
  source: '[Startup-finance heuristic: asset-light SaaS] 假设资本开支、负债和营运资本扭曲都很小，因此这一阶段的现金桥能够保持足够清楚。'
- id: A18
  name: 融资目标
  value: 做到 3-5 家正式客户，在第 18 个月前证明模板复用，并在下一轮前保留六个月现金缓冲
  unit: milestone
  source: '[BP fundingAsk.useOfFundsSummary; BP milestones] 这轮 pre-seed 的规模就是为了证明正式转化、实施效率改善，以及跨职能规则采纳，然后再去做 seed。'
