slug: deduction-cause-ledger
date: '2026-09-23'
executiveSummary: >-
  Deduction Cause Ledger should launch as a deduction-first prevention workflow
  for U.S. food, beverage, and household-goods brands with $50 million-$500
  million in retail revenue, 3-10 major retailer or distributor accounts, and
  separate finance, trade, and planning systems. The first customer is a
  $75 million-$250 million brand that feels margin leakage in a quarter with
  rising deductions or a gross-to-net miss and cannot justify a full-suite
  rip-and-replace. The MVP should unify remittances, portal claims, shipment
  records, and promotion calendars into a single incident record, draft the
  accept-or-dispute packet for finance, and push human-reviewed guardrails into
  the next promotion approval and weekly S&OP cycle. Go-to-market should stay
  founder-led and channel-assisted through EDI/compliance integrators and
  deductions consultants, because the sale only closes when onboarding burden
  and ROI are concrete. Pricing should combine onboarding by mapped
  retailer/distributor account with annual subscription by active account pair,
  matching how buyers already feel complexity and leakage. The company should
  deliberately avoid full TPM replacement, broad logistics execution, and
  multi-region expansion until it proves repeat-deduction reduction on the
  first 3-5 high-volume accounts. The strongest first proof point is one paid
  pilot that converts to production after lowering repeat-deduction rate,
  shortening resolution time, and getting finance, sales, and planning to use
  at least one shared prevention rule. Public competitor pricing remains sparse
  and the biggest disconfirming risk is that preventable leakage at target
  logos is too small or too operations-driven to support a standalone
  prevention layer, so the first year must validate data access, budget
  ownership, and prevention efficacy before scale hiring.
problem:
  - "Mid-market CPG brands resolve deductions after the fact in AR or finance tools while promotions, accruals, and replenishment decisions sit elsewhere, so the same root cause reappears in the next cycle."
  - "Evidence for one claim is fragmented across retailer portals, EDI remittances, PDFs, email, and distributor files, which turns each account review into manual reconciliation and makes gross-to-net leakage visible only after quarter-end."
solution:
  - "Create one incident object per short-pay, billback, or compliance chargeback that links remittance, shipment, promotion, and forecast evidence and produces an accept-or-dispute packet."
  - "After closure, convert the cause into a human-reviewed rule for promotion approvals, accrual assumptions, and weekly S&OP guardrails on the same retailer or distributor account."
whyWeWin:
  - "The wedge lands on a budgeted P&L problem with named users and clear triggers: rising deductions, gross-to-net misses, or ERP/TPM resets."
  - "A coexistence deployment for 3-5 high-volume accounts is faster to prove than a full CPG suite replacement and can compound into retailer-specific prevention templates."
  - "The hard-to-copy asset is a benchmarked library of normalized reason codes, root causes, and successful prevention plays by retailer, distributor, and promotion type."
strategicChoices:
  beachhead: "U.S. food, beverage, and household-goods brands with $75 million-$250 million in retail revenue, 2-6 big-box retailer accounts plus one national distributor, separate finance/trade/planning systems, and weekly S&OP reviews."
  wedgeRationale: >-
    This account slice has visible quarterly leakage, existing deductions or
    trade budgets, and enough repeat-cause density to prove value on the first
    3-5 high-volume accounts. Broader CPG workflow software would lengthen
    implementation, blur ROI attribution, and force the startup into direct
    suite competition before it has evidence.
  sequencingRationale: >-
    Product should start with read-heavy ingestion, incident normalization,
    packet drafting, and human-reviewed prevention rules before deeper
    automation, because trust and mapping quality are the real bottlenecks.
    GTM should begin with founder-led sales and partner-assisted onboarding,
    then add reusable templates, then only later add scaled sales and adjacent
    modules once the first pilots prove both prevention efficacy and acceptable
    implementation burden.
  notYet:
    - "Full TPM or revenue-management suite replacement"
    - "Broad logistics or OTIF execution tooling"
    - "Multi-region retailer coverage outside the U.S."
    - "Food-service or distributor-channel expansion before the U.S. retail wedge is repeatable"
market:
  tam: "$160.0M estimated TAM from roughly 2,000 U.S. food, beverage, and household-goods brands in the $50M-$500M retail-revenue band at about $80k annual software spend."
  sam: "$52.5M estimated SAM from about 700 logos with recurring deduction pain, separate finance and trade workflows, and enough account complexity to support roughly $75k annual spend."
  som: "$7.5M 3-5 year SOM assuming roughly 75 logos at about $100k ARR after initial proof and account-template reuse."
  segments:
    - "U.S. mid-market food, beverage, and household-goods brands with recurring retailer deductions"
    - "Distributor-heavy or food-service-adjacent CPG brands expanding from the same U.S. gross-to-net workflows after retail proof"
  buyingProcess: >-
    A deductions, sales-operations, or revenue-growth-management lead usually
    champions the product after a bad quarter, major retailer onboarding, or
    ERP/TPM reset. The CFO, Chief Commercial Officer, or VP Revenue Growth
    Management signs because the product changes both cash recovery and future
    promotion controls, while planning and IT approve pilot scope and data
    access.
product:
  mvp: >-
    For 3-5 highest-volume retailer or distributor accounts, ingest
    remittance, portal, shipment, and promotion data into a shared incident
    record, draft accept-or-dispute packets, and route low-confidence cases to
    an analyst queue. Push approved prevention rules into the next promotion
    approval and weekly S&OP review rather than automating changes silently.
  sixMonth: "Ship one production-ready pilot covering the top 3 deduction reason-code families across 3-5 mapped accounts, with analyst review, rule versioning, and repeat-deduction reporting."
  twelveMonth: "Add ERP and TPM connectors, reusable retailer and distributor templates, and cross-functional rule approval workflows so 2-3 production customers can expand beyond their initial account set."
  twentyFourMonth: "Expand from deduction prevention into trade accrual guardrails, distributor collaboration, and selected food-service or adjacent-channel workflows only after the U.S. retail wedge shows repeatable onboarding and a credible path to 70% gross margin."
  keyBets:
    - "Preventable or invalid deductions are large enough at target logos to support $80k-$120k annual software spend."
    - "Finance, sales, and planning teams will accept human-reviewed rules sourced from closed incidents without buying a full suite replacement."
    - "Reusable templates across the first 3-5 accounts capture enough value before broad connectivity is required."
    - "Mid-market buyers prefer a coexistence layer over extending spreadsheets or waiting for enterprise incumbents to bundle the workflow."
gtm:
  wedge: "Sell a paid deduction-prevention pilot for 3-5 highest-volume retailer or distributor accounts where repeat chargebacks or gross-to-net misses already appear in monthly leak-review meetings."
  channels:
    - "Founder-led outbound to CFOs, VP Revenue Growth Management leaders, deductions managers, and sales-operations teams at spreadsheet-bound brands"
    - "Referral and implementation partnerships with EDI and retailer-compliance integrators that already map account-specific document flows"
    - "Co-selling with deductions, AR, and revenue-growth-management consultants embedded in leak-review or ERP/TPM transition work"
  funnelTargets: "Lead→qualified design partner 20-30%, qualified design partner→paid pilot 40-50%, pilot→production 60%+ within 120 days."
  pricing: >-
    Annual SaaS priced by active retailer or distributor account pair plus
    onboarding fees for each mapped account, with premium fees as customers add
    adjacent workflows. This matches the buyer's ROI logic of avoided
    write-offs, fewer repeat deductions, and less analyst time on
    account-specific exceptions.
businessModel:
  revenueStreams:
    - "Annual platform subscription for active retailer or distributor account pairs"
    - "Onboarding and integration fees for new account mappings"
    - "Expansion fees for adjacent workflows such as accrual guardrails, distributor collaboration, and benchmark reporting"
  unitOfValue: "Active retailer or distributor account pair under deduction-prevention management"
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add more retailer and distributor accounts within the same logo"
    - "Expand from dispute support into promotion approval and accrual guardrails"
    - "Sell benchmark insights and prevention templates by account type and promotion type"
    - "Extend the same incident memory model into food-service and adjacent gross-to-net workflows after retail proof"
strategyMap:
  northStarMetric: "Repeat deductions prevented per active retailer or distributor account pair"
  inputMetrics:
    - "Pilot-to-production conversion rate"
    - "Repeat-deduction rate by reason-code family"
    - "Median days from deduction receipt to closure"
    - "Percentage of prevention rules adopted in promotion approvals or S&OP reviews"
    - "Days to onboard each new retailer or distributor account after template reuse"
  moatsToBuild:
    - "Normalized library of reason codes, root causes, and successful prevention plays by retailer, distributor, and promotion type"
    - "Incident graph linking remittance, shipment, promotion, accrual, and planning evidence on one object"
    - "Template library that reduces mapping time on the next retailer or distributor account"
  killCriteria:
    - "Fewer than 3 of the first 10 qualified logos show preventable or invalid leakage large enough to support at least $80k annual software spend."
    - "The first 3 paid pilots each require more than 45 days to onboard 3-5 high-volume accounts even after template reuse."
    - "Sales and planning teams reject more than 70% of proposed prevention rules in the first 2 production pilots."
  mermaid: |
    flowchart LR
      Wedge[Deduction prevention wedge] --> MVP[Incident record plus packet workflow]
      MVP --> Proof[Lower repeat deductions and faster close]
      Proof --> Expansion[Gross to net memory layer]
investorMemo:
  verdict:
    call: "Meet / investigate further"
    conviction: "Clear P&L pain and a disciplined wedge merit a partner meeting, but conviction depends on proving that deployments can become template-driven software rather than permanent analyst services."
    whyBelieve: "Research shows existing spend, named buyers, and a mid-market gap between finance-first deduction tools and heavyweight CPG suites."
    whyDoubt: "The beachhead market is meaningful but not massive on its own, and incumbent platforms could absorb the workflow if onboarding remains too bespoke."
    nextDiligence: "Verify on 3-5 design partners that repeat-deduction reduction on the first 3-5 accounts is large enough to convert paid pilots into $80k-$120k annual subscriptions."
  firstCustomer:
    title: "VP Revenue Growth Management or deductions lead at a mid-market U.S. CPG brand"
    profile: "A $75M-$250M snack, beverage, frozen-food, or household-goods brand selling through 2-6 big-box retailers plus one national distributor, with separate finance, trade, and planning systems and weekly account review calls."
    trigger: "A quarter with rising deductions or a gross-to-net miss, or an ERP/TPM reimplementation that exposes how much deduction knowledge still lives in spreadsheets, portals, and email."
    buyer: "CFO, Chief Commercial Officer, or VP Revenue Growth Management"
    initialContract: "90-day paid pilot with roughly $30k-$50k onboarding for 3-5 mapped accounts, converting to about $80k-$120k annual subscription plus added mapping fees as more accounts come online."
  mustBeTrue:
    - "Target logos must show enough preventable or invalid deductions to justify $80k+ annual spend before broader suite replacement."
    - "A CFO, CCO, or VP Revenue Growth Management must own budget for gross-to-net leakage across finance and commercial teams."
    - "Three to five high-volume account mappings must capture enough repeat-cause density to prove ROI before full network coverage."
    - "Finance, sales, and planning users must accept human-reviewed prevention rules inside existing promotion approval or S&OP checkpoints."
    - "Incumbent suites and AR tools must continue to leave the incident-to-prevention loop unowned for mid-market brands."
  diligenceQuestions:
    - "What share of deductions at target logos is invalid or preventable versus valid but operationally unavoidable?"
    - "Who actually controls budget when leakage spans finance, trade spend, sales operations, and planning?"
    - "How many retailer or distributor accounts must be mapped before the first customer sees payback?"
    - "Which deduction reason-code families are common enough across logos to create a reusable template moat?"
    - "How quickly are Confido, Vividly, HighRadius, or XTEL closing the same prevention workflow gap?"
operatingAssumptions:
  - assumption: "Target logos have recurring preventable or invalid leakage on the first 3-5 accounts that is large enough to support $80k-$120k annual software spend."
    basis: research.yaml
    validationTest: "Gather 12 months of deductions from 5 design partners and confirm that recurring preventable or invalid leakage on the initial account set exceeds 3x proposed annual software price."
    decisionImpact: "If false, move upmarket, add recovery services, or abandon the standalone prevention wedge."
  - assumption: "Buyers will fund a software-plus-onboarding purchase from existing deductions, trade, or finance budgets without an ERP replacement project."
    basis: research.yaml
    validationTest: "In 10 buyer interviews and 3 commercial proposals, confirm a named budget owner and willingness to fund a paid pilot without broader systems replacement."
    decisionImpact: "If false, shift to channel-led selling through consultants or TPM and ERP partners."
  - assumption: "Finance, sales, and planning teams will adopt at least one shared prevention rule inside existing approval checkpoints."
    basis: idea.yaml
    validationTest: "During the first 2 pilots, measure whether all 3 functions use at least one shared rule monthly and keep override rate below 50%."
    decisionImpact: "If false, narrow the product to finance workflow and delay planning or promotion modules."
  - assumption: "Template reuse can reduce onboarding after the first mapped account to a repeatable services load."
    basis: research.yaml
    validationTest: "After the first mapped account, onboard the next 2 accounts in under 10 analyst hours each using reusable templates and partner data maps."
    decisionImpact: "If false, restrict ICP to fewer retailers or distributors or raise price to support service-heavy delivery."
  - assumption: "Incident benchmark data will compound into a differentiating asset before incumbents ship a comparable mid-market prevention loop."
    basis: operator judgment
    validationTest: "By month 18, at least 70% of new rule suggestions should come from prior closed-incident patterns and customers should cite benchmark insights in quarterly reviews."
    decisionImpact: "If false, deprioritize standalone category building and explore embedded distribution or sale to incumbents."
experimentRoadmap:
  - horizon: "0-90 days"
    experiment: "Interview and workflow-map 12 target CPG brands with active retailer or distributor deductions."
    hypothesis: "The first painful workflow is repeat-deduction prevention on major accounts, not generic claim recovery or broad TPM replacement."
    successMetric: "At least 8 of 12 buyers rank repeat deductions or gross-to-net leakage among their top three commercial-ops problems."
    owner: "Founder / CEO"
  - horizon: "0-90 days"
    experiment: "Run a concierge root-cause analysis on 6 months of deduction data from 2 design partners."
    hypothesis: "A small set of reason-code families drives enough repeat incidents to support reusable prevention rules."
    successMetric: "At least 60% of deduction dollars on the initial account set fall into the top 3 reason-code families and produce at least one reusable prevention play."
    owner: "Deductions operations lead"
  - horizon: "90-180 days"
    experiment: "Deploy one paid pilot across 3-5 high-volume accounts with incident normalization, packet drafting, and weekly rule review."
    hypothesis: "A narrow account-level pilot can cut repeat deductions and analyst time enough to justify production conversion."
    successMetric: "Pilot shows at least 25% lower repeat-deduction rate or 30% lower analyst time within 90 days."
    owner: "Founder / CEO"
  - horizon: "90-180 days"
    experiment: "Test pricing and budget ownership with account-pair subscription plus onboarding versus outcome-only packaging."
    hypothesis: "Buyers prefer account-pair pricing because it maps to retailer complexity and is easier to approve than recovery-contingent pricing."
    successMetric: "At least 4 of 6 qualified prospects prefer subscription plus onboarding over an outcome-only commercial model."
    owner: "Founder / CEO"
  - horizon: "180-365 days"
    experiment: "Launch a reusable template program with one EDI integrator and one deductions consultant."
    hypothesis: "Partner-supplied account mappings and exception knowledge can cut implementation time without giving away the customer relationship."
    successMetric: "Two signed partners and 30% lower onboarding time on the second customer account set."
    owner: "Solutions engineer"
  - horizon: "180-365 days"
    experiment: "Insert prevention rules into one customer's promotion approval and weekly S&OP workflow."
    hypothesis: "Cross-functional rule adoption is necessary for expansion beyond finance and will improve pilot-to-production conversion."
    successMetric: "At least 50% of proposed rules are accepted into one live approval workflow and the customer expands to additional accounts within 6 months."
    owner: "Customer success lead"
operations:
  - "Maintain immutable incident history, rule versioning, and approval logs for every economically material guardrail."
  - "Run a human-in-the-loop analyst queue for low-confidence classifications, messy remittance inputs, and new retailer or distributor mappings."
  - "Standardize EDI, portal, email, and PDF ingestion into reusable retailer and distributor templates before adding adjacent modules."
  - "Use quarterly leak reviews with customers and channel partners to turn resolved incidents into benchmarked prevention playbooks."
team:
  - role: "Founder / CEO"
    startTiming: "Month 0"
    rationale: "Founder-led selling is required because the buyer set is concentrated, the trigger events are operational, and pricing still needs validation."
  - role: "Founding eng"
    startTiming: "Month 0"
    rationale: "The core product depends on ingestion, incident normalization, workflow orchestration, and audit-log architecture from day one."
  - role: "Deductions operations lead"
    startTiming: "Month 1"
    rationale: "Early deployments need operator judgment on reason-code taxonomy, dispute evidence, and which closed incidents should become forward rules."
  - role: "Solutions engineer"
    startTiming: "Month 4"
    rationale: "Retailer and distributor mappings are the biggest deployment bottleneck, so reusable connectors and templates need dedicated ownership."
  - role: "Customer success lead"
    startTiming: "Month 8"
    rationale: "Pilot conversion depends on cross-functional adoption and disciplined leak reviews, not just technical go-live."
  - role: "Account executive"
    startTiming: "Month 12"
    rationale: "Add a dedicated seller only after the company proves a repeatable pilot-to-production motion and has referenceable customers."
milestones:
  - horizon: "0-12 months"
    items:
      - "Close 3 design partners and 2 paid pilots in the U.S. deduction-prevention beachhead."
      - "Ship incident record, packet drafting, analyst review, and rule approval for the top 3 deduction reason-code families across 3-5 accounts."
      - "Convert at least 1 pilot into a 12-month production contract."
      - "Build 2 partner-assisted retailer or distributor templates and show at least 25% repeat-deduction reduction on one account set."
  - horizon: "12-24 months"
    items:
      - "Reach 5-7 production logos and reuse templates across at least 3 retailers or distributors."
      - "Add promotion approval and accrual guardrail modules inside existing customer workflows."
      - "Keep pilot-to-production conversion above 50% and onboarding time below 30 days for incremental accounts."
      - "Establish a partner program with EDI/compliance integrators and deductions consultants."
  - horizon: "24-36 months"
    items:
      - "Reach 12-15 production logos and a credible path toward the researched 3-5 year SOM."
      - "Launch benchmark reporting and prevention template upsells as paid expansion modules."
      - "Expand into distributor collaboration or selected food-service workflows only after U.S. retail unit economics and rule adoption targets hold."
      - "Evaluate broader gross-to-net operating-layer expansion once target gross margin and template reuse are proven."
risks:
  - risk: "Preventable leakage at target logos may be too low, or too much of the deduction base may be operationally valid, to support a standalone prevention product."
    likelihood: Medium
    impact: High
    mitigation: "Qualify only buyers with measurable repeat-cause density and tie early pilots to account-level leakage baselines before broad rollout."
  - risk: "Retailer and distributor mappings may keep deployments too services-heavy to reach software margins."
    likelihood: High
    impact: High
    mitigation: "Start with 3-5 accounts, build reusable templates with integrator partners, and track analyst hours as a gating metric before scaling GTM."
  - risk: "Finance may adopt the dispute workflow while sales and planning ignore the prevention rules."
    likelihood: Medium
    impact: High
    mitigation: "Sell through a CFO, CCO, or VP Revenue Growth Management sponsor and insert outputs into existing promotion approval and S&OP checkpoints."
  - risk: "A large share of losses may come from OTIF, routing, or warehouse execution failures that the initial product cannot fix."
    likelihood: Medium
    impact: Medium
    mitigation: "Prioritize customers where the first leak clusters are commercial-memory problems and treat logistics integrations as a later expansion path."
  - risk: "Confido, Vividly, HighRadius, or XTEL could bundle enough adjacent functionality to compress the standalone wedge."
    likelihood: Medium
    impact: High
    mitigation: "Differentiate on faster mid-market deployment, retailer-specific prevention templates, and cross-functional incident memory that coexists with current systems."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$2-4M"
  runwayMonths: 18
  useOfFundsSummary: "Fund 18 months of product build, six design-partner deployments, retailer and distributor template creation, human-in-the-loop operations, and founder-led GTM to reach three to five production logos and validate expansion into adjacent gross-to-net workflows."
