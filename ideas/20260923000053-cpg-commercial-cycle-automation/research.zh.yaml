competitors:
- name: Confido
  stage: Series B 成长平台
  wedge: 一层共享的商业与财务数据层，覆盖现金核销、扣款、TPM、预测和供应规划。
  pricing: 企业级定制定价；没有公开价目表。
  strength: 相邻愿景最接近，而且已经扩到 250+ 品牌和 $30B+ 的规划体量。
  weaknessVsUs: 更宽的套件范围，给了中型品牌一个更快落地、扣款优先部署的窗口。
  sourceRefs:
  - 1
- name: Vividly
  stage: Series B 成长平台
  wedge: 从 TPM 向现金核销、AI 决策支持和更广的财务运营扩张。
  pricing: 定制订阅；未披露公开定价。
  strength: 已在 TPM 领域建立真实牵引，覆盖数十亿美元促销投入和数千名用户，因此扩张更有说服力。
  weaknessVsUs: 重心仍锚在 TPM 和财务工具上，而不是独立的“事件到预防”记忆产品。
  sourceRefs:
  - 3
  - 4
- name: Promomash
  stage: 中型市场托管式厂商
  wedge: 面向仍靠表格或割裂系统运转的品牌，提供促销与扣款管理，通常会配套服务支持。
  pricing: 定制年度订阅加实施；plans 页面会筛选适配客户，但不公开具体价格。
  strength: 直接服务资源不足的中型买方，也证明他们愿意为有引导的方案付费。
  weaknessVsUs: 更偏服务驱动，在可复用预防规则和跨职能因果记忆上的差异化没有那么强。
  sourceRefs:
  - 5
- name: HighRadius
  stage: 企业级现有厂商
  wedge: 在财务和 AR 工作流里提供 AI 扣款管理与促销匹配。
  pricing: 企业级定制合同；没有公开价目表。
  strength: 财务自动化品牌强，索赔校验能力也很清晰。
  weaknessVsUs: 财务优先的重心，可能让销售、促销和规划侧的预防闭环在 CPG 语境里仍然偏弱。
  sourceRefs:
  - 6
- name: XTEL
  stage: 全球企业级收入管理套件
  wedge: 面向大型 CPG 与零售商的 AI 定价、品类、促销和零售执行套件。
  pricing: 企业级 SaaS；没有公开定价。
  strength: 套件范围广、全球客户背书强，而且在促销投入上有深厚足迹，覆盖 100+ CPG 客户。
  weaknessVsUs: 宽度和企业级姿态意味着，$75M-$250M 的品牌在做首个扣款预防部署时，往往会嫌它太重。
  sourceRefs:
  - 23
regulatoryTechnicalConstraints:
- point: 促销工作流必须避免差别定价和欺骗性促销做法，因此自动化规则必须带有政策边界和审批日志。
  sourceRefs:
  - 18
- point: 食品和家居用品品牌仍运行在正式指引与文档要求之下，这抬高了可追溯性和证据留存门槛。
  sourceRefs:
  - 19
- point: 零售商特有的 EDI 文档、标签、routing 规则和测试步骤在不同账户间差异很大，直接拖慢实施。
  sourceRefs:
  - 12
  - 13
  - 21
- point: OTIF 及类似合规项目会带来直接财务罚则，因此一部分根因其实落在仓储和承运环节，而不仅是财务环节。
  sourceRefs:
  - 20
- point: 汇款数据仍会通过邮件、门户、EDI、lockbox 和 ACH 流入，因此产品从第一天起就得具备多渠道抓取和异常管理能力。
  sourceRefs:
  - 15
validationSignals:
- point: Confido 已经证明，品牌愿意采用共享的商业财务运营层：250+ 品牌、$30B+ 的规划体量已经跑在同一系统上。
  sourceRefs:
  - 1
- point: Vividly 证明，只要先建立信任，TPM 买方愿意继续扩展到相邻的财务运营产品。
  sourceRefs:
  - 3
- point: Promomash 明确把仍被表格绑住、带宽不足的品牌当成目标客户，这直接证明滩头市场买方存在。
  sourceRefs:
  - 5
- point: OverDeduct 给出了可观的未回收核销和“可预防/无效扣款占比”区间，为 ROI 叙事提供了坚实数字底座。
  sourceRefs:
  - 9
- point: 零售 EDI 和汇款抓取文档说明，数据摄取挑战在今天的工具栈下技术上可解，只是实现起来依旧很脏。
  sourceRefs:
  - 12
  - 15
  - 21
openQuestions:
- 目标区间内 $75M-$250M 品牌的扣款里，真正无效的占比有多高？又有多少虽然有效、但其实能靠运营改掉？
- 销售和规划负责人会允许来自扣款历史的规则，去改写未来促销审批吗？还是说他们仍会坚持必须先买整套 TPM 或 RGM 套件？
- 在首个客户看到可信回报前，到底要先做多少个零售商或分销商映射？
- 哪些产品品类的重复成因密度最高，因此最能跑出预防 ROI？
- 这家公司能否作为一条全新的工作流直接拿到预算，还是必须去替代现有扣款或促销预算里的服务支出？
