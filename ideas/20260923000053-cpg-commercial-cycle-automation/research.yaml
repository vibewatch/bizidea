competitors:
- name: Confido
  stage: Series B growth platform
  wedge: Shared commercial and financial data layer spanning cash application, deductions, TPM, forecasting, and supply planning.
  pricing: Custom enterprise subscription; no public list price.
  strength: Closest adjacent vision and already scaled to 250+ brands and $30B+ of planning volume.
  weaknessVsUs: Broader suite scope creates an opening for a faster, deduction-first deployment for mid-market brands.
  sourceRefs:
  - 1
- name: Vividly
  stage: Series B growth platform
  wedge: Trade promotion management expanding into cash application, AI decision support, and broader financial operations.
  pricing: Custom subscription; public pricing not disclosed.
  strength: Real TPM traction with billions of trade spend and thousands of users gives it expansion credibility.
  weaknessVsUs: Still anchored in TPM and financial tooling rather than a discrete incident-to-prevention memory product.
  sourceRefs:
  - 3
  - 4
- name: Promomash
  stage: Mid-market managed-service vendor
  wedge: Trade and deduction management for brands still on spreadsheets or disconnected systems, often with service support.
  pricing: Custom annual subscription with onboarding; plans page qualifies fit but does not publish exact prices.
  strength: Directly addresses under-resourced mid-market buyers and proves they will buy a guided solution.
  weaknessVsUs: More service-led and less clearly differentiated around reusable prevention rules and cross-functional causal memory.
  sourceRefs:
  - 5
- name: HighRadius
  stage: Enterprise incumbent
  wedge: AI deduction management and trade-promotion matching inside finance and AR workflows.
  pricing: Custom enterprise contract; no public list price.
  strength: Strong finance automation brand and clear claim-validation functionality.
  weaknessVsUs: Finance-first center of gravity may leave sales, trade, and planning prevention loops underdeveloped for CPG-specific workflows.
  sourceRefs:
  - 6
- name: XTEL
  stage: Global enterprise revenue-management suite
  wedge: AI-enabled pricing, assortment, trade promotion, and retail execution for large CPGs and retailers.
  pricing: Enterprise SaaS; public pricing not disclosed.
  strength: Broad suite breadth, global references, and deep trade-spend footprint with 100+ CPGs.
  weaknessVsUs: Breadth and enterprise posture can make it heavier than what a $75M-$250M brand wants for a first deduction-prevention deployment.
  sourceRefs:
  - 23
