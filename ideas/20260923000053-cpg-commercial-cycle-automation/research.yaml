  sourceRefs:
  - 5
- point: OverDeduct documents nontrivial unrecovered write-offs and a meaningful preventable or invalid-share range, supporting a concrete ROI narrative.
  sourceRefs:
  - 9
- point: Retail EDI and remittance-capture documentation show the ingestion challenge is technically solvable with today’s tooling, even if it remains messy.
  sourceRefs:
  - 12
