  pestle:
  - factor: political
    impact: negative
    point: Trade-promotion decisions sit inside antitrust and fairness frameworks such as Robinson-Patman, making indiscriminate automated deal rules risky.
    sourceRefs:
    - 18
  - factor: economic
    impact: positive
    point: Trade spend, deductions, chargebacks, returns, and shortages are large enough that even modest prevention wins can have meaningful margin impact.
    sourceRefs:
    - 8
    - 9
    - 10
  - factor: social
    impact: positive
    point: Cross-functional finger-pointing between sales, finance, and operations creates demand for a shared incident memory rather than another siloed dashboard.
    sourceRefs:
    - 2
    - 8
    - 11
  - factor: technological
    impact: positive
    point: EDI, remittance capture, and ERP connectors make multi-channel ingestion increasingly feasible, even though account-level mappings remain painful.
    sourceRefs:
    - 12
    - 13
    - 15
    - 21
  - factor: legal
    impact: negative
    point: Food and household-goods workflows still require auditable guidance, documentation, and clear human accountability for compliance-sensitive decisions.
    sourceRefs:
    - 18
    - 19
  - factor: environmental
    impact: neutral
    point: Reducing OTIF failures, returns, and avoidable rework can cut waste in the supply chain, but sustainability is a secondary purchase driver compared with margin protection.
    sourceRefs:
    - 20
  adoptionFrictionMatrix:
  - friction: Retailer-specific EDI, ASN, label, and remittance mappings
    severity: high
    affectedBuyer: IT, operations, and deductions leaders
    mitigation: Start with three to five highest-volume accounts, reuse partner-specific templates, and instrument exception queues before attempting broad coverage.
    sourceRefs:
    - 12
    - 13
    - 21
  - friction: Cross-functional trust in rule outputs that affect future promotions and replenishment
    severity: high
    affectedBuyer: CFO, VP RGM, sales operations, and planners
    mitigation: Keep humans in the loop for material rule changes and insert recommendations into existing approval and S&OP checkpoints before full automation.
    sourceRefs:
    - 2
    - 7
    - 11
  - friction: Incomplete or messy evidence from portals, PDFs, email, and EDI feeds
    severity: medium
    affectedBuyer: AR and deduction analysts
    mitigation: Use multi-channel ingestion with confidence scoring and an analyst-review lane for low-confidence incidents.
    sourceRefs:
    - 15
    - 21
  - friction: Buyer bias toward extending an existing suite instead of adding another tool
    severity: medium
    affectedBuyer: CFO and procurement
    mitigation: Position around deduction-prevention ROI, no rip-and-replace deployment, and the ability to coexist with current TPM and ERP systems.
    sourceRefs:
    - 1
    - 5
    - 6
    - 23
  - friction: Auditability for trade, category, and regulated-product decisions
    severity: medium
    affectedBuyer: Finance, legal, and quality leaders
    mitigation: Keep source citations, rule history, approval logs, and policy-bound exception workflows attached to every incident and guardrail.
    sourceRefs:
    - 18
    - 19
