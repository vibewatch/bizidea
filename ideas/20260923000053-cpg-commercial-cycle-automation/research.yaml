- point: Retailer-specific EDI documents, labels, routing rules, and testing steps vary materially by account, slowing onboarding.
  sourceRefs:
  - 12
  - 13
  - 21
- point: OTIF and related compliance programs impose direct financial penalties, so some root causes sit in warehouse and carrier operations rather than finance alone.
  sourceRefs:
  - 20
- point: Remittance data still arrives through email, portal, EDI, lockbox, and ACH channels, which forces multi-channel capture and exception management from day one.
  sourceRefs:
  - 15
