scenarios:
  downside:
    description: 伙伴转介绍要晚约一年才真正起效，导入也始终更偏定制，结果是客户增长变慢、毛利率继续被服务成分拖住。
    y3RevenueK: 1560
    y3EbitdaK: -760
    cashLowPointK: -170
    keyAssumptionChanges:
    - Q4Y3 客户数停在 28 家，而不是 38 家。
    - 由于扩容和最终规则更新附加更晚，活跃投标中心的综合年化收入到退出时约为 $80K，而不是约 $91K。
    - 因为仓库映射和律师工作流仍更依赖人工，退出毛利率只能到约 65%，而不是 70%。
  base:
    description: 公司把最早的三笔第 12 和第 15 部付费试点成功转年费、按计划拿到第二年客户里程碑，并主要靠更紧的导入模板和一条小有起色的伙伴转介绍动作扩张。
    y3RevenueK: 2234
    y3EbitdaK: -319.1
    cashLowPointK: 283.5
    keyAssumptionChanges:
    - 客户数按商业计划里程碑爬坡：3 家（到 M12）、13 家（到 Q4Y2）、38 家（到 Q4Y3）。
    - 基础订阅价维持在约 $70K，而 40% 的扩展附加率加上首年迁移费，会把活跃客户综合收入抬到高 $80Ks（到 Y3）。
    - 毛利率会从早期试点阶段的 50 多，只有在导入逐步模板化后，才在后期接近 70%。
  upside:
    description: 两条伙伴渠道比计划更早跑起来，且更多客户在不明显增加团队人数的情况下买下相邻规则族或多业务单元扩展。
    y3RevenueK: 2720
    y3EbitdaK: 120
    cashLowPointK: 430
    keyAssumptionChanges:
    - Q4Y3 客户数达到 45 家，而不是 38 家。
    - 由于第二类规则族和多业务单元扩展附加更快，活跃投标中心的综合年化收入到退出时约为 $96K。
    - 因为第五次部署后实施明显更可复制，退出毛利率可到约 72%。
sensitivity:
- variable: ARPU
  downsideCase: 活跃投标中心退出时的综合年收入只能到约 $80K。
  baseCase: 活跃投标中心退出时的综合年收入约为 $91K。
  upsideCase: 活跃投标中心退出时的综合年收入可到约 $96K。
  y3RevenueImpactK: -300
  cashImpactK: -250
- variable: CAC
  downsideCase: 如果伙伴来源机会不及预期，CAC 会升到约 $30K。
  baseCase: 在创始人主导销售并跑通一条转介绍渠道的前提下，CAC 约为 $24K。
  upsideCase: 一旦转介绍能稳定带来合格试点，CAC 有机会往 $20K 靠。
  y3RevenueImpactK: -80
  cashImpactK: -120
- variable: 流失率
  downsideCase: 如果试点没能扩大成更广的工作流使用，月度流失率会漂到 3.0%。
  baseCase: 月度流失率维持在 2.0%。
  upsideCase: 更多规则族和业务单元跑起来后，月度流失率可改善到 1.5%。
  y3RevenueImpactK: -160
  cashImpactK: -140
- variable: 销售周期
  downsideCase: 从合格发现到付费试点的路径会拖长到 6–8 个月。
  baseCase: 从合格发现到付费试点的路径维持在 4–6 个月。
  upsideCase: 伙伴引荐能把这条路径压到 3–4 个月，并踩中真实规则变化触发点。
  y3RevenueImpactK: -430
  cashImpactK: -380
- variable: 毛利率
  downsideCase: 退出毛利率只能到 65%。
  baseCase: 退出毛利率到 70%。
  upsideCase: 退出毛利率可到 72%。
  y3RevenueImpactK: 0
  cashImpactK: -210
- variable: 招聘节奏
  downsideCase: 在导入可复制性尚未被证明前，就把第三位实施和第三位工程师提前招进来。
  baseCase: 招聘仍按里程碑触发，基本贴着商业计划节奏走。
  upsideCase: 后台和实施招聘继续后移，直到伙伴来源的需求真正成形。
  y3RevenueImpactK: -60
  cashImpactK: -170
modelDiagram:
  title: 单位经济模型流转
  mermaid: "flowchart LR\n  Leads[Qualified buyers] --> Pilots[Paid migration pilots]\n  Pilots --> Subs[Annual subscriptions]\n  Subs --> Expansion[Rule-family or business-unit expansion]\n  Expansion --> Revenue[Blended revenue]\n  Revenue --> GrossProfit[Gross profit]\n  GrossProfit --> Cash[Cash runway]\n"
modelSanity:
- checkName: 收入引擎
  finding: 基准情景的收入来自把最早的三笔付费试点转成年费订阅，再把付费投标中心数拉到 38 家（到 Q4Y3），同时让 40% 的客户在 12 个月内买下相邻扩展。
- checkName: 必须跑通的事
  finding: 要扛住第三年客户数，导入工时必须在第五次部署时压低约 30%，这样三名实施/政策运营 FTE 才不会把毛利率压穿目标。
- checkName: 模型会失灵，如果
  finding: 如果销售周期一路拖向 8 个月、伙伴转介绍又迟迟起不来，下行情景下公司会在达到第三年里程碑前先把现金烧成负数。
- checkName: 下一轮证明包
  finding: 只有当公司做到 10–13 个付费客户、至少两次试点转年订阅，并跑通一条不靠翻倍堆服务团队也能扩张的伙伴转介绍动作时，下一轮融资才真正站得住。
sanityChecks:
  ruleOf40: 第 3 年增长 264% + EBITDA 利润率 -14% = 250%（主要被偏小的 Y2 基数抬高）。
  burnMultiple: 约 1.2x（Y2），到 0.1x（Y3）附近；因为客户数从 13 家拉到 38 家后，净新增 ARR 开始明显快过 burn。
  revenuePerFte: $223.4K 的 Y3 人均收入，按 10 名 Q4Y3 FTE 计算；对一家服务辅助型 GovCon 工作流公司来说算得上可信，但前提是导入持续标准化。
  flags:
  - 从 13 家客户（Q4Y2）跳到 38 家（Q4Y3），靠的是伙伴转介绍和可复用导入模板都得按时到位。
  - 模型把试点、导入和规则更新费都揉进了综合客户收入里，因此按 GAAP 看，早期服务占比会更高，毛利率也会更波动。
  - 毛利率只有在前几次部署后实施工作明显下降时，才摸得到 70% 目标；如果客户仓库比预期更乱，这门生意会一直太偏服务。
  - 既然研究给出的近端 SOM 只有 $6.0M，公司最终必须靠多业务单元和相邻规则族扩展，才能在滩头市场之外继续撑起风投级增长。
