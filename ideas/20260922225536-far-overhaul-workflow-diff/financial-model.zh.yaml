slug: far-branch-release-graph
date: '2026-09-22'
currency: USD
modelStartMonth: 2026-10
assumptions:
- id: A1
  name: 模型起始月份
  value: 2026-10
  unit: YYYY-MM
  source: '[BP date 2026-09-22]；模型从下一个完整月份开始。'
- id: A2
  name: pre-seed 到账后的期初现金
  value: '2500'
  unit: usdK
  source: '[BP fundingAsk targetFundingRangeUsd $2–4M, runwayMonths 18]；模型按 $2.5M 到账测算，并叠加阶段所需的 6 个月缓冲。'
- id: A3
  name: 期初付费投标中心（M1）
  value: '0'
  unit: count
  source: '[BP experimentRoadmap 0–90 days]；最初几个月先做发现、仓库审计和共创客户工作，首个付费试点随后才落地。'
- id: A4
  name: 客户爬坡
  value: 3 个（到 M12）、13 个（到 Q4Y2）、38 个（到 Q4Y3）
  unit: customers
  source: '[BP milestones 0–12 months, 12–24 months, 24–36 months]；基准情景保持在商业计划里写明的 30–40 家付费客户、第 3 年目标区间内。'
- id: A5
  name: 每个投标中心的基础年度订阅价
  value: '70'
  unit: usdK per year
  source: '[BP gtm.pricing], [BP market.sam], [BP investorMemo.firstCustomer.initialContract]；验证跑通后，按研究得出的 $60K–$75K 经常性价格带中位数取值。'
- id: A6
  name: 首年平均迁移与更新费
  value: '35'
  unit: usdK / 新客户
  source: '[BP investorMemo.firstCustomer.initialContract $25K–$50K pilot plus onboarding]；模型用固定范围第 12 和第 15 部迁移工作的中位数。'
- id: A7
  name: 12 个月内扩展附加率
  value: '40'
  unit: percent of customers
  source: '[BP gtm.funnelTargets first proposal center to second rule family or business-unit expansion 40%+ within 12 months]；对应首个投标中心向相邻规则族或业务单元扩展的附加率目标。'
- id: A8
  name: 扩展成交后的收入抬升
  value: '15'
  unit: usdK ARR / 扩展客户
  source: '[BP businessModel.expansionLevers]；对第二类规则族、分包下传条款模块或第二个业务单元加购的经验化假设。'
- id: A9
  name: 目标稳态毛利率
  value: '70'
  unit: percent
  source: '[BP businessModel.targetGrossMarginPct].'
- id: A10
  name: COGS 爬坡
  value: 首个付费试点月份为 45%，到 30% 时点是 Q4Y3
  unit: percent of revenue
  source: '[BP sequencingRationale], [BP operations], [BP operatingAssumptions implementation can standardize quickly enough to support 70% gross margin]；这是服务辅助型合规软件的创业财务经验曲线。'
- id: A11
  name: 月度客户流失率
  value: '2.0'
  unit: percent
  source: 针对早期企业级 GovCon 工作流产品的创业财务经验法则：试点转年订阅存在风险，但一旦进入年度预算后粘性较强。
- id: A12
  name: 综合 CAC
  value: '24'
  unit: usdK per customer
  source: '[BP gtm.channels], [BP gtm.funnelTargets], [BP milestones partner referral motion], [Research reportMemo.distributionChannels]；创始人主导 + 伙伴辅助的企业销售经验假设。'
- id: A13
  name: 管理层全负担薪酬
  value: '180'
  unit: usdK annual
  source: '[BP team Founding CEO / domain seller] + pre-seed 创始人薪酬经验值。'
- id: A14
  name: 工程团队全负担薪酬
  value: '170'
  unit: usdK annual
  source: '[BP team Founding eng; Product and integrations engineer] + GovCon 工作流工程岗位的薪酬经验值。'
- id: A15
  name: 实施与政策运营全负担薪酬
  value: '145'
  unit: usdK annual
  source: '[BP team Implementation and policy operations lead] + 服务辅助型合规科技实施岗位的薪酬经验值。'
- id: A16
  name: 客户成功与部署全负担薪酬
  value: '125'
  unit: usdK annual
  source: '[BP team Customer success and deployment lead] + 早期 GovCon 售后部署岗位的薪酬经验值。'
- id: A17
  name: 销售与合作全负担薪酬
  value: '165'
  unit: usdK annual
  source: '[BP team Enterprise AE / partnerships lead] + 企业合作岗位的薪酬经验值。'
- id: A18
  name: G&A 与财务运营全负担薪酬
  value: '105'
  unit: usdK annual
  source: 精简后台覆盖下的创业财务经验法则，适用于更大种子轮之前的后台团队。
- id: A19
  name: 招聘顺序
  value: M2 实施/政策运营，M4 第二位工程师，M10 客户成功，M13 销售/合作，M16 第二位实施，M22 第三位工程师，M28 G&A/运营，M31 第三位实施
  unit: month index
  source: '[BP team], [BP sequencingRationale]；后续招聘都按里程碑触发，是“先产品化导入、再放大销售”路线的延伸。'
- id: A20
  name: 非薪酬研发支出爬坡
  value: 6K–8K / 月（Y1），24K–27K / 季（Y2），30K–36K / 季（Y3）
  unit: usdK
  source: '[BP product], [BP operations]；云、安全与文档摄入工具的经验假设。'
- id: A21
  name: 非薪酬销售与市场支出爬坡
  value: 4K–7K / 月（Y1），24K–30K / 季（Y2），33K–48K / 季（Y3）
  unit: usdK
  source: '[BP gtm.channels], [Research reportMemo.distributionChannels]；覆盖差旅、活动、投标社群和伙伴内容支出的经验假设。'
- id: A22
  name: 非薪酬 G&A 支出爬坡
  value: 7K–9K / 月（Y1），24K–33K / 季（Y2），36K–45K / 季（Y3）
  unit: usdK
  source: '[BP operations], [BP risks], [Research adoptionFrictionMatrix]；安全、法务、保险和审计准备支出的经验假设。'
- id: A23
  name: 基础销售周期
  value: 从合格发现到付费试点及年度转化决策，周期为 4–6 个月
  unit: months
  source: '[BP market.buyingProcess], [BP experimentRoadmap paid pilot], [Research reportMemo.buyingTriggers]；对应从合格发现到付费试点的基础销售周期假设。'
- id: A24
  name: 到 Q4Y3 伙伴来源的合格管道占比
  value: '25'
  unit: percent of qualified pipeline
  source: '[BP milestones partner referral motion], [BP experimentRoadmap partner referral motion], [Research reportMemo.distributionChannels]；对应伙伴来源合格管道占比假设。'
- id: A25
  name: 收入建模简化约定
  value: 试点、导入和规则更新费被归一进每客户的综合收入里，而不是单列一条服务收入线
  unit: policy
  source: '[BP gtm.pricing], [BP investorMemo.firstCustomer.initialContract]；这样建模能让收入直接跟付费客户数挂钩，同时把早期服务成分纳入综合收入。'
