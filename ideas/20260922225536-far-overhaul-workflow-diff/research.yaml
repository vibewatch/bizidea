  searchedQueries:
  - Find current primary sources and independent reporting on the 2026 Revolutionary FAR Overhaul batches affecting FAR Parts 12, 15, 9, 27, 44, 47, 51, and 52, including comment deadlines, contractor workflow impact, and acquisition.gov resources.
  - Find evidence that federal contractors budget for proposal operations, contracts policy, compliance updates, outside counsel, or clause library management during regulatory changes. Prefer surveys, salary benchmarks, analyst reports, or primary company/government sources.
  - Find direct competitors and substitutes for managing federal contractor proposal workflows, clause libraries, contract lifecycle management (CLM), and FAR/compliance updates. Include proposal software, CLM vendors, outside counsel, consultants, and GovCon-specific tools with pricing or product pages if available.
  - 'Estimate the reachable beachhead market: mid-market U.S. federal IT, professional-services, and systems-integration contractors with centralized proposal centers and active bids. Find counts of federal contractors, spending concentration, or industry size from government or analyst sources.'
  - 'Find adoption blockers for a FAR rule-diff workflow product: procurement/legal constraints, handling attorney advice, document integrations, SharePoint/Word/CLM repositories, security or confidentiality expectations, and behavior barriers in federal contractors.'
  - Find recent funding, product, or news about startups and incumbents in government proposal AI, GovCon workflow, or federal contracting compliance software, especially GovDash, Procurement Sciences, Loopio, Unanet, GovWin, Icertis, Ironclad, and related tools.
  - Find procurement or contracts job posts, professional associations, or community evidence showing proposal centers, contracts managers, and subcontracts teams maintain templates, clause libraries, training, and review workflows for federal contractors.
  - Find customer evidence, case studies, reviews, or community discussions about proposal software, CLM, or clause management in government contracting, especially issues with stale content, template governance, or manual updates.
  - Find exact accessible Deltek 2026 Clarity GovCon pricing and estimating or win-rate research page and a Deltek government contract management product page with public description.
  - Find exact accessible TechnoMile government contract lifecycle management or GovCon CLM comparison page with public description of FAR/DFARS, modifications, and workflow.
  - Find public pricing, quote-based sales, or services costs for government proposal software, CLM software, or GovCon legal/compliance consulting that show budget willingness to pay.
  - Find primary government or GAO pages with fiscal year 2025 federal contracting totals, competition rates, or counts of contractors for use in market sizing.
  - Find direct evidence that mid-market federal contractors use SharePoint, Word, or content libraries for proposals and contract workflows, preferably from Microsoft ecosystem or GovCon product pages.
  sourceQualityMix:
    primaryCompany: 4
    regulatoryGovernment: 5
    tierOneNews: 0
    tradePress: 4
    analystMarketData: 1
    customerCommunity: 1
    technicalDocs: 2
    other: 3
  regionsCovered:
  - United States
  saturationReached: true
  saturationRationale: After 31 successful fetches, all eight diligence questions had at least two useful sources and the final 10 fetches mostly repeated existing points or yielded thin or captcha-gated pages rather than new material facts.
  coverageGap: Public price transparency for GovCon workflow software is limited, so willingness-to-pay relies more on bid and compliance budget evidence plus quote-led enterprise buying motions than on posted vendor price cards.
