  sourceRefs:
  - 1
  - 2
- point: The Council cited that 45% of FY2025 contract dollars were awarded without competition or with only one offer, increasing pressure to adapt to new buying posture.
  sourceRefs:
  - 5
- point: Deltek found that 56% of contractors still rely on Excel somewhere in the pricing process.
  sourceRefs:
  - 10
- point: GovCon proposal teams still commonly run from inboxes and shared drives rather than fully connected systems.
  sourceRefs:
  - 19
- point: The APMP software ecosystem is already crowded with response-management and content-library tools, making the absence of rule-release positioning notable.
  sourceRefs:
  - 13
openQuestions:
- How many target contractors already maintain a single clause library plus a clean live-opportunity tracker that can be mapped without consulting-heavy cleanup?
- Will buyers fund a product before final FAR text lands, or only after a counsel-validated final branch exists?
- Is Parts 12 and 15 exposure alone enough to justify deployment, or does the product need bundled support for Parts 9, 27, 44, 47, and 52 at launch?
- 'Which integrations are truly mandatory in the first release: SharePoint, Word, Deltek, GovWin, Salesforce, or contract repositories?'
- Can privileged counsel feedback be separated cleanly from productized release logic without creating adoption or liability concerns?
