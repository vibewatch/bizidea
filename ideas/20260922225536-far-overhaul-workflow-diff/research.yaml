adoptionFrictionMatrix:
- friction: Legal-interpretation boundary
  severity: high
  affectedBuyer: VP Contracts and contracts-policy lead
  mitigation: Position the product as governed release management with mandatory human approval rather than autonomous legal advice.
  sourceRefs:
  - 7
  - 8
  - 9
- friction: CUI and security posture
  severity: high
  affectedBuyer: COO, CIO, and security lead
  mitigation: Support restricted deployments, explicit data-boundary controls, and documented handling for proposal and contract data.
  sourceRefs:
  - 7
  - 11
- friction: Repository and workflow integration
  severity: high
  affectedBuyer: Proposal operations lead
  mitigation: Start with structured imports for Word, SharePoint, clause libraries, and opportunity trackers before deeper system connectors.
  sourceRefs:
  - 13
  - 19
- friction: Services-heavy artifact mapping
  severity: high
  affectedBuyer: COO and implementation sponsor
  mitigation: Package the first engagement as a fixed-scope Parts 12 and 15 migration with reusable templates and measurable release metrics.
  sourceRefs:
  - 9
  - 10
  - 19
- friction: Budget-owner ambiguity
  severity: medium
  affectedBuyer: Chief Growth Officer or COO
  mitigation: Sell against avoided rework, faster release of approved guidance, and lower risk of non-compliant submissions during active pursuits.
  sourceRefs:
  - 10
  - 15
