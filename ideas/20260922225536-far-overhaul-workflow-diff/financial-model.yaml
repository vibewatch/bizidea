slug: far-branch-release-graph
date: '2026-09-22'
currency: USD
modelStartMonth: 2026-10
assumptions:
  - id: A1
    name: Model start month
    value: 2026-10
    unit: YYYY-MM
    source: '[BP date 2026-09-22]; model starts in the next full month.'
  - id: A2
    name: Opening cash after pre-seed close
    value: '2500'
    unit: usdK
    source: >-
      [BP fundingAsk targetFundingRangeUsd $2–4M, runwayMonths 18]; model uses a $2.5M close plus
      the stage-required 6-month buffer framing.
  - id: A3
    name: Starting paying proposal centers (M1)
    value: '0'
    unit: count
    source: >-
      [BP experimentRoadmap 0–90 days]; initial months are discovery, repository audit, and
      design-partner work before the first paid pilot lands.
  - id: A4
    name: Customer ramp
    value: 3 by M12, 13 by Q4Y2, 38 by Q4Y3
    unit: customers
    source: >-
      [BP milestones 0–12 months, 12–24 months, 24–36 months]; base case stays within the stated
      30–40 paying-customer year-3 milestone.
  - id: A5
    name: Base annual subscription per proposal center
    value: '70'
    unit: usdK per year
    source: >-
      [BP gtm.pricing], [BP market.sam], [BP investorMemo.firstCustomer.initialContract]; midpoint
      of the researched $60K–$75K recurring band once converted from pilot.
  - id: A6
    name: Average first-year migration and update fee
    value: '35'
    unit: usdK per new customer
    source: >-
      [BP investorMemo.firstCustomer.initialContract $25K–$50K pilot plus onboarding]; model uses a
      midpoint for fixed-scope Parts 12 and 15 migration work.
  - id: A7
    name: Expansion attach rate inside 12 months
    value: '40'
    unit: percent of customers
    source: >-
      [BP gtm.funnelTargets first proposal center to second rule family or business-unit expansion
      40%+ within 12 months].
  - id: A8
    name: Expansion uplift when expansion lands
    value: '15'
    unit: usdK ARR per expanded customer
    source: >-
      [BP businessModel.expansionLevers]; heuristic for a second rule family, subcontract flowdown
      module, or business-unit add-on.
  - id: A9
    name: Target steady-state gross margin
    value: '70'
    unit: percent
    source: '[BP businessModel.targetGrossMarginPct].'
  - id: A10
    name: COGS ramp
    value: 45% in first paid pilot month stepping down to 30% by Q4Y3
    unit: percent of revenue
    source: >-
      [BP sequencingRationale], [BP operations], [BP operatingAssumptions implementation can
      standardize quickly enough to support 70% gross margin]; startup-finance heuristic for
      services-assisted compliance software.
  - id: A11
    name: Monthly logo churn
    value: '2.0'
    unit: percent
    source: >-
      Startup-finance heuristic for an early enterprise GovCon workflow product with
      pilot-to-subscription conversion risk but sticky annual budgets after adoption.
  - id: A12
    name: Blended CAC
    value: '24'
    unit: usdK per customer
    source: >-
      [BP gtm.channels], [BP gtm.funnelTargets], [BP milestones partner referral motion], [Research
      reportMemo.distributionChannels]; founder-led plus partner-assisted enterprise-sales
      heuristic.
  - id: A13
    name: Leadership loaded compensation
    value: '180'
    unit: usdK annual
    source: '[BP team Founding CEO / domain seller] plus pre-seed founder-comp heuristic.'
  - id: A14
    name: Engineering loaded compensation
    value: '170'
    unit: usdK annual
    source: >-
      [BP team Founding eng; Product and integrations engineer] plus GovCon workflow-engineering
      compensation heuristic.
  - id: A15
    name: Implementation and policy-ops loaded compensation
    value: '145'
    unit: usdK annual
    source: >-
      [BP team Implementation and policy operations lead] plus services-assisted regtech
      implementation heuristic.
  - id: A16
    name: Customer success and deployment loaded compensation
    value: '125'
    unit: usdK annual
    source: >-
      [BP team Customer success and deployment lead] plus early post-sale GovCon deployment
      heuristic.
  - id: A17
    name: Sales and partnerships loaded compensation
    value: '165'
    unit: usdK annual
    source: >-
      [BP team Enterprise AE / partnerships lead] plus enterprise-partnerships compensation
      heuristic.
  - id: A18
    name: G&A and finance-ops loaded compensation
    value: '105'
    unit: usdK annual
    source: Startup-finance heuristic for lean back-office coverage before a larger seed round.
  - id: A19
    name: Hiring sequence
    value: >-
      M2 implementation/policy ops, M4 second engineer, M10 customer success, M13
      sales/partnerships, M16 second implementation, M22 third engineer, M28 G&A/ops, M31 third
      implementation
    unit: month index
    source: >-
      [BP team], [BP sequencingRationale]; later hires are milestone-gated extensions of the stated
      product-before-sales plan.
  - id: A20
    name: Non-payroll R&D spend ramp
    value: 6K–8K monthly in Y1, 24K–27K quarterly in Y2, 30K–36K quarterly in Y3
    unit: usdK
    source: '[BP product], [BP operations]; cloud, security, and document-ingestion tooling heuristic.'
  - id: A21
    name: Non-payroll sales and marketing spend ramp
    value: 4K–7K monthly in Y1, 24K–30K quarterly in Y2, 33K–48K quarterly in Y3
    unit: usdK
    source: >-
      [BP gtm.channels], [Research reportMemo.distributionChannels]; travel, events,
      proposal-community, and partner-content heuristic.
  - id: A22
    name: Non-payroll G&A spend ramp
    value: 7K–9K monthly in Y1, 24K–33K quarterly in Y2, 36K–45K quarterly in Y3
    unit: usdK
    source: >-
      [BP operations], [BP risks], [Research adoptionFrictionMatrix]; security, legal, insurance,
      and audit-prep heuristic.
  - id: A23
    name: Base sales cycle
    value: 4–6 months from qualified discovery to paid pilot and annual conversion decision
    unit: months
    source: >-
      [BP market.buyingProcess], [BP experimentRoadmap paid pilot], [Research
      reportMemo.buyingTriggers].
  - id: A24
    name: Partner-sourced qualified pipeline share by Q4Y3
    value: '25'
    unit: percent of qualified pipeline
    source: >-
      [BP milestones partner referral motion], [BP experimentRoadmap partner referral motion],
      [Research reportMemo.distributionChannels].
  - id: A25
    name: Revenue modeling simplification
    value: >-
      Pilot, onboarding, and rule-update fees are normalized into blended per-customer revenue
      rather than shown as a separate services line
    unit: policy
    source: >-
      [BP gtm.pricing], [BP investorMemo.firstCustomer.initialContract]; keeps revenue tied directly
      to paying-customer count while acknowledging the early services mix.
