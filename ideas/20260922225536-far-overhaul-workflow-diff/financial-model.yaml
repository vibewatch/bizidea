      percentage: 27
scenarios:
  downside:
    description: >-
      Partner referrals start roughly a year late and onboarding stays more bespoke, so customer
      growth slows and gross margin remains services-heavy.
    y3RevenueK: 1560
    y3EbitdaK: -760
    cashLowPointK: -170
    keyAssumptionChanges:
      - Q4Y3 customers end at 28 instead of 38.
      - >-
        Blended annualized revenue per active proposal center exits near $80K instead of about $91K
        because expansions and final-rule updates attach later.
      - >-
        Gross margin exits near 65% instead of 70% because repository mapping and counsel workflow
        stay more manual.
  base:
    description: >-
      The company converts the first three paid Parts 12 and 15 pilots, reaches the year-two
      customer milestone, and scales mostly through tighter onboarding templates plus a modest
      partner-referral motion.
    y3RevenueK: 2234
    y3EbitdaK: -319.1
    cashLowPointK: 283.5
    keyAssumptionChanges:
      - >-
        Customer count grows to 3 by M12, 13 by Q4Y2, and 38 by Q4Y3, matching the business-plan
        milestones.
      - >-
        Base subscription pricing sits near $70K, while first-year migration fees and a 40%
        expansion attach rate lift blended active-customer revenue into the high-$80Ks by Y3.
      - >-
        Gross margin improves from the mid-50s in early pilots to about 70% only after onboarding
        becomes more template-led.
  upside:
    description: >-
      Two partner channels become productive earlier than planned and more customers buy adjacent
      rule-family or business-unit expansions without a large headcount increase.
    y3RevenueK: 2720
    y3EbitdaK: 120
    cashLowPointK: 430
    keyAssumptionChanges:
      - Q4Y3 customers end at 45 instead of 38.
      - >-
        Blended annualized revenue per active proposal center exits near $96K because second
        rule-family and multi-business-unit expansions attach faster.
      - >-
        Gross margin exits near 72% because implementation becomes more repeatable by deployment
        five onward.
sensitivity:
  - variable: ARPU
    downsideCase: Exit blended annual revenue per active proposal center reaches only about $80K.
    baseCase: Exit blended annual revenue per active proposal center is about $91K.
    upsideCase: Exit blended annual revenue per active proposal center reaches about $96K.
    y3RevenueImpactK: -300
    cashImpactK: -250
  - variable: CAC
    downsideCase: CAC rises to about $30K because partner-sourced opportunities underperform.
    baseCase: CAC is about $24K with founder-led selling plus one working referral channel.
    upsideCase: CAC falls toward $20K once referrals reliably source qualified pilots.
    y3RevenueImpactK: -80
    cashImpactK: -120
  - variable: churn
    downsideCase: Monthly churn drifts to 3.0% as pilots fail to convert into wider workflow use.
    baseCase: Monthly churn stays at 2.0%.
    upsideCase: Monthly churn improves to 1.5% once additional rule families and business units are live.
    y3RevenueImpactK: -160
    cashImpactK: -140
  - variable: sales cycle
    downsideCase: The path from qualified discovery to paid pilot stretches toward 6–8 months.
    baseCase: The path from qualified discovery to paid pilot stays around 4–6 months.
    upsideCase: Partner introductions compress the path toward 3–4 months on live rule-change triggers.
    y3RevenueImpactK: -430
    cashImpactK: -380
  - variable: gross margin
    downsideCase: Exit gross margin reaches only 65%.
    baseCase: Exit gross margin reaches 70%.
    upsideCase: Exit gross margin reaches 72%.
    y3RevenueImpactK: 0
    cashImpactK: -210
  - variable: hiring pace
    downsideCase: >-
      The third implementation hire and third engineer are pulled forward before onboarding
      repeatability is proven.
    baseCase: Hiring remains milestone-gated and closely follows the business-plan sequencing.
    upsideCase: Back-office and implementation hiring stays deferred until partner-sourced demand is real.
    y3RevenueImpactK: -60
    cashImpactK: -170
modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Leads[Qualified buyers] --> Pilots[Paid migration pilots]
      Pilots --> Subs[Annual subscriptions]
      Subs --> Expansion[Rule-family or business-unit expansion]
      Expansion --> Revenue[Blended revenue]
      Revenue --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Cash runway]
modelSanity:
  - checkName: Revenue engine
    finding: >-
      Base-case revenue comes from converting three early paid pilots into annual subscriptions and
      then growing to 38 paying proposal centers by Q4Y3 while 40% of customers buy an adjacent
      expansion within 12 months.
  - checkName: Must go right
    finding: >-
      Onboarding hours have to fall roughly 30% by the fifth deployment so three
      implementation-policy FTE can support the year-three customer count without pushing gross
      margin below target.
  - checkName: Model breaks if
    finding: >-
      If the sales cycle stretches toward 8 months and partner referrals do not materialize, cash
      turns negative in the downside case before the year-three milestone is achieved.
  - checkName: Next-round proof
    finding: >-
      The next financing is justified once the company shows 10–13 paying customers, at least two
      pilot-to-subscription conversions, and a partner referral motion that can scale without
      doubling services headcount.
sanityChecks:
  ruleOf40: Y3 growth 264% + EBITDA margin -14% = 250% (inflated by the small Y2 base).
  burnMultiple: >-
    Approx. 1.2x in Y2, improving toward 0.1x in Y3 as net new ARR from 13 to 38 customers starts to
    outrun burn.
  revenuePerFte: >-
    $223.4K Y3 based on 10 Q4Y3 FTE (credible for a services-assisted GovCon workflow business, but
    only if onboarding keeps standardizing).
  flags:
    - >-
      The jump from 13 customers at Q4Y2 to 38 at Q4Y3 depends on partner referrals and reusable
      onboarding templates arriving on time.
    - >-
      The model treats pilot, onboarding, and rule-update fees as blended customer revenue, so GAAP
      reporting would likely show a larger services mix and lumpier early-period gross margin.
    - >-
      Gross margin reaches the 70% target only if implementation effort falls meaningfully after the
      first few deployments; if repositories are messier than expected, the business stays too
      services-heavy.
    - >-
      With a researched $6.0M near-term SOM, the company eventually needs multi-business-unit and
      adjacent-rule-family expansion to sustain venture-scale growth beyond the beachhead.
