differentiator: >-
  Proposal-writing AI, CLM tools, and legal memos explain content inside one
  pursuit or one document set. This concept creates a versioned external-to-
  internal impact graph that starts from the rule rewrite itself and then
  pushes signed changes across templates, flowdowns, negotiation ladders, and
  training assets before teams touch a live bid. The moat is the release
  telemetry: which rule deltas changed which artifacts, how quickly each
  contractor migrated, and where review-cycle compression or rework reduction
  actually occurred.
