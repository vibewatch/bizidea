problem: >-
  Federal contractors run capture, proposal, subcontract, and negotiation work
  from playbooks scattered across clause libraries, templates, review
  matrices, and training decks. The second FAR overhaul batch rewrites
  multiple parts at once and extends beyond commercial buying into
  responsibility, data rights, transportation, and negotiation practices, so
  teams can end up pursuing live opportunities on stale internal guidance.
  Existing bid software, shared drives, and outside-counsel memos explain the
  rules but do not tell a contractor which active bids, flowdowns, or approval
  steps are still on the wrong version.
targetUser:
  primary: >-
    Proposal excellence or contracts-policy leads at 250-3,000 employee
    federal IT, professional-services, and systems-integration contractors
    running 25-200 live opportunities plus recurring subcontract flowdowns
  secondary: >-
    Capture and subcontracts managers inside larger primes that must publish
    approved playbook changes across multiple business units
  buyer: >-
    VP Contracts, Chief Growth Officer, or COO at a mid-market federal
    contractor
startupThesis:
  nonObviousInsight: >-
    The defensible wedge is not better legal summarization; it is a
    machine-readable branch that maps each procurement-rule change to the exact
    internal artifacts and in-flight pursuits that must be re-released.
  beachhead: >-
    Mid-market federal technology and professional-services contractors with a
    centralized proposal center, a maintained clause library, and active
    civilian or defense-adjacent SaaS, IT modernization, or professional-
    services bids affected by Parts 12 and 15
  wedge: >-
    A managed onboarding plus software branch for Parts 12 and 15 that ingests
    proposal templates, clause libraries, negotiation checklists, training
    decks, and live opportunities, then publishes signed release packets for
    every affected artifact
  whyNowCatalyst: >-
    The FAR Council has released the second rewrite batch, opened a short
    public-comment window, and paired the overhaul with an acquisition.gov
    portal plus non-regulatory buying guides, forcing contractors to migrate
    provisional playbooks before the final text lands.
  ventureScalePath: >-
    Start with Parts 12 and 15 migrations for tech-services contractors, then
    expand into Parts 9, 27, 44, 47, and 52, agency supplements, subcontract
    flowdown management, benchmark data on review-cycle compression, and the
    underlying rules API sold into proposal, CLM, and govcon ERP vendors.
solution: >-
  FAR Branch Release Graph is a versioned policy-release system for federal
  contractors. It ingests the Federal Register rule text and official buying
  guides alongside one contractor's proposal templates, clause library,
  negotiation ladders, subcontract packets, and reviewer training materials.
  Every regulatory delta is converted into a named impact graph that shows
  which artifacts, approvals, and live opportunities are touched. Contracts
  and proposal leaders approve release packets, push them into their existing
  repositories, and keep an audit trail of which bids were still using the old
  branch at any moment. The same graph can produce evidence for public
  comments and highlight where final-rule changes diverge from the provisional
  branch.
goToMarketSeed:
  firstCustomer: >-
    A 300-1,500 employee federal IT or systems-integration contractor with a
    centralized proposal center, an in-house contracts policy owner, and
    several active SaaS or professional-services bids touching Part 12 or Part
    15 language
  buyingTrigger: >-
    Publication of a proposed or final FAR batch during live pursuits,
    especially when a major recompete, subcontract refresh, or internal policy
    review lands before the comment deadline or release freeze
  currentAlternative: >-
    Outside-counsel memos, shared-drive clause trackers, spreadsheet redlines,
    one-off training sessions, and manual bid-by-bid reviews
  switchingReason: >-
    The graph traces each rule delta into named artifacts and live
    opportunities, so leaders can publish only the changes that matter instead
    of rereading the entire FAR rewrite inside every capture and legal review
  pricingHypothesis: >-
    Annual subscription for one proposal center and its integrated
    repositories, plus an onboarding fee for each major rule-batch migration
