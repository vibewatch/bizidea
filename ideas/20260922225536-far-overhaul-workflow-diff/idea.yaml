jobsToBeDone:
  - job: >-
      When a multi-part FAR rewrite lands during live pursuits, help the
      contracts-policy lead identify and release only the affected internal
      artifacts, so proposal teams stop bidding from stale guidance.
    currentAlternative: Legal memos, manual redlines, and bid-by-bid review calls
    successMetric: Time from rule publication to signed internal release for all impacted artifacts
  - job: >-
      When capture and subcontracts teams need to update negotiation scripts
      and supplier flowdowns together, help them publish one approved branch,
      so live bids and partner packets stay on the same rule version.
    currentAlternative: Shared drives, email attachments, and one-off training
    successMetric: Percentage of impacted opportunities and flowdowns migrated before final review
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      Treating procurement-policy change as a publishable branch with
      artifact-level release packets is materially more specific than bid
      drafting, legal research, or generic compliance workflow software.
  venturePotential:
    score: 4
    rationale: >-
      The first wedge is a narrow but budgeted govcon workflow that can expand
      into agency supplements, subcontract controls, and embedded rules APIs,
      though the market starts with a consultative motion.
  whiteSpace:
    score: 5
    rationale: >-
      Proposal tools, CLM systems, and consultants do not own versioned
      migration of live contractor playbooks when the underlying federal rule
      book changes, leaving a newly standardized gap.
  painIntensity:
    score: 4
    rationale: >-
      Bidding and subcontracting teams can lose time, margin, or competitive
      posture when they work from outdated rule interpretations during active
      procurements.
  wedgeClarity:
    score: 4
    rationale: >-
      A Parts 12 and 15 release branch for tech-services contractors is a
      crisp first workflow, even if mapping repositories and approval logic
      will require guided implementation.
  evidenceFit:
    score: 5
    rationale: >-
      Two primary proposed rules plus independent reporting all point to the
      same urgent migration workload across negotiations, commercial buying,
      and interactive buying guidance.
topRisks:
  - name: Proposed-rule drift
    description: >-
      Final FAR text may still move after the comment period, which could
      force customers to rework provisional branches.
    mitigation: >-
      Maintain proposed and final branches side by side and sell the product
      first as provisional migration plus comment evidence, not as permanent
      codification.
  - name: Services-heavy onboarding
    description: >-
      Early deployments may depend on policy specialists to map one
      contractor's templates, flowdowns, and approval paths.
    mitigation: >-
      Start with repeatable Parts 12 and 15 templates for tech-services
      contractors and productize repository connectors aggressively.
  - name: Incumbent workflow extension
    description: >-
      Proposal suites, CLM vendors, or outside counsel could add lightweight
      rule-update trackers once demand is obvious.
    mitigation: >-
      Own the rule-to-artifact graph and migration benchmark dataset that
      generic trackers and one-off advisory projects cannot match quickly.
