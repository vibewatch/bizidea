problem: 联邦承包商的捕获、投标、分包和谈判工作，靠的是散在条款库、模板、评审矩阵和培训材料里的各类打法。第二批 FAR 大改写一次改掉多个部分，影响不止商业采购，还波及责任认定、数据权利、运输和谈判惯例，所以团队很容易一边等人工红线和律师备忘录，一边拿过期的内部指引去推进在跑机会。现有的投标软件、共享盘和外部律师备忘录能解释规则，却说不清到底哪些在跑标案、下传条款或审批步骤还停在错误版本上。
targetUser:
  primary: 250–3,000 人规模的联邦 IT、专业服务和系统集成承包商里，负责投标运营或合同政策的负责人；团队同时跑着 25–200 个在跑商机，并反复处理分包下传条款。
  secondary: 大型主承包商内部的捕获和分包负责人，要把获批打法变更发到多个业务单元。
  buyer: 中型联邦承包商的合同副总裁、首席增长官或 COO。
startupThesis:
  nonObviousInsight: 真正能守住的切口，不是把法律内容总结得更好，而是做一条机器可读的分支，把每次采购规则变化精确映射到必须重新发布的内部制品和在跑项目。
  beachhead: 有集中式投标中心、维护良好的条款库，且手里有受第 12 和第 15 部影响的民用或国防相邻 SaaS、IT 现代化、专业服务标案的中型联邦科技与专业服务承包商。
  wedge: 先做一套覆盖第 12 和第 15 部的托管导入 + 软件分支：吃进标书模板、条款库、谈判清单、培训材料和在跑商机，再给每个受影响的制品发出签字发布包。
  whyNowCatalyst: FAR Council 已发布第二批重写规则，开放了很短的公开意见窗口，还配上了 acquisition.gov 门户和非监管型采购指引，逼着承包商在最终文本落地前就先迁移临时打法。
  ventureScalePath: 先从科技服务承包商的第 12 和第 15 部迁移起步，再扩到第 9、27、44、47 和 52 部、机构补充规定、分包下传条款管理、评审周期压缩的基准数据，以及卖给投标、CLM 和 GovCon ERP 厂商的底层 rules API。
solution: FAR 分支发布图是一套给联邦承包商用的版本化政策发布系统。它把 Federal Register 里的规则文本和官方采购指引，与单个承包商自己的标书模板、条款库、谈判阶梯、分包材料包和评审培训材料一起吃进来。每一处监管差异都会被转成一张具名影响图，明确指出碰到了哪些制品、审批和在跑商机。合同和投标负责人先审批发布包，再把它推回现有仓库，同时保留一条审计留痕，清楚记录任何时点上哪些标案还挂在旧分支上。同一张图还能反过来产出公开意见所需证据，并标出最终规则与临时分支到底在哪些地方分叉。
goToMarketSeed:
  firstCustomer: 300–1,500 人规模的联邦 IT 或系统集成承包商：有集中式投标中心、内部合同政策负责人，且手里有多项触及第 12 或第 15 部表述的 SaaS 或专业服务标案。
  buyingTrigger: 拟议版或最终版 FAR 批次在项目还在推进时落地，尤其是遇到重大重新竞标、分包刷新，或内部政策复核赶在意见截止日或发布冻结前发生时。
  currentAlternative: 外部律师备忘录、共享盘条款跟踪表、电子表格红线、一场一场的培训，以及按单个标案人工复核。
  switchingReason: 这张图把每一处规则差异一路落到具名制品和在跑商机上，管理层因此只需发布真正要改的那一小部分，而不用在每轮捕获和法务评审里把整份 FAR 重写从头读一遍。
  pricingHypothesis: 按一个投标中心及其接入仓库收取年度订阅费；每次重大规则批次迁移再收一笔导入费。
whyNow:
- point: 两批拟议 FAR 大改写已在 2026-09-18 发布，意见截止日是 2026-10-19，所以承包商现在就得先有一条临时迁移路径。
