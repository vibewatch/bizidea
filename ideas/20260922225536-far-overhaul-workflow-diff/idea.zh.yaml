jobsToBeDone:
- job: 当多部分 FAR 重写在项目还在推进时落地，帮合同政策负责人只找出并发布受影响的内部制品，让投标团队别再拿过期指引去应标。
  currentAlternative: 法律备忘录、人工红线和逐案评审电话会
  successMetric: 从规则发布到所有受影响制品拿到签字版内部发布的耗时
- job: 当捕获与分包团队得同时改谈判脚本和供应商下传条款时，帮他们发出一条统一获批的分支，让在跑标案和合作方材料始终停在同一规则版本。
  currentAlternative: 共享盘、邮件附件和一次性培训
  successMetric: 在最终评审前完成迁移的受影响商机和下传条款占比
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: 把采购政策变化当成一条可发布分支，再拆成落到单个制品的发布包，这比写标、法律研究或通用合规工作流软件都具体得多。
  venturePotential:
    score: 4
    rationale: 第一刀切进去的是一个窄但有预算的 GovCon 工作流切口，后面还能扩到机构补充规定、分包控制和嵌入式 rules API，只是起步仍得靠较强的咨询式动作。
  whiteSpace:
    score: 5
    rationale: 投标工具、CLM 系统和顾问都没有真正占住这样一个场景：底层联邦规则一改，承包商的在跑打法该如何版本化迁移。这个新近被标准化出来的空档仍没人守。
  painIntensity:
    score: 4
    rationale: 投标和分包团队如果在活跃采购期里继续按过期规则理解做事，时间、利润率和竞争姿态都会直接受损。
  wedgeClarity:
    score: 4
    rationale: 面向科技服务承包商的第 12 和第 15 部发布分支，是一个很干净的首个工作流；只是要把仓库和审批逻辑映射清楚，仍离不开引导式实施。
  evidenceFit:
    score: 5
    rationale: 两份一手拟议规则再加独立报道，全都指向同一件紧急工作：谈判、商业采购和交互式采购指引必须一起迁移。
topRisks:
- name: 拟议规则继续漂移
  description: 最终版 FAR 文本在意见期后仍可能继续变化，客户因此可能不得不返工临时分支。
  mitigation: 把拟议版与最终版分支并排维护，先把产品卖成“临时迁移 + 意见证据”工作流，而不是提前宣称自己已经完成永久固化。
- name: 服务化导入偏重
  description: 早期部署可能离不开政策专家，去把单个承包商的模板、下传条款和审批路径一一映射清楚。
  mitigation: 先从科技服务承包商的第 12 和第 15 部模板做起，并激进产品化仓库连接器。
- name: 现有厂商顺手扩展工作流
  description: 投标套件、CLM 厂商或外部律师，一旦看到需求成形，很可能补上一层轻量级规则更新跟踪。
  mitigation: 守住规则到制品图谱和迁移基准数据，这两块不是通用跟踪器或一次性顾问项目能很快追上的。
