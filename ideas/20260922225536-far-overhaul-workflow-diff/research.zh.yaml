categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
  - point: 联邦政府正在主动简化采购，并持续发布配套指引、矩阵和从业者资源，这让规则变化从一次性备忘录，变成会反复发生的工作流事件。
    sourceRefs:
    - 1
    - 3
    - 6
  - point: 承包商正更愿意采用 AI 和工作流工具，而合规成本又在上升，这让围绕投标和合同工作的受控自动化更容易被论证。
    sourceRefs:
    - 10
    - 11
    - 12
  headwinds:
  - point: 安全、CUI 和 CMMC 相邻约束都会抬高 SaaS 采纳门槛，并可能逼出更慢的部署节奏或更受限的运行环境。
    sourceRefs:
    - 7
    - 11
  - point: 很多团队至今仍靠 Excel、共享盘和人工交接来跑工作，所以导入摩擦高，短期可扩展性也被压住。
    sourceRefs:
    - 10
    - 19
competitors:
- name: TechnoMile Contracts Suite
  stage: 成熟的 GovCon CLM 厂商
  wedge: 面向 GovCon 的 CLM，覆盖商机到结项，并处理 CLIN、SLIN、mod 和条款跟踪。
  pricing: 报价式企业销售
  strength: 对联邦合同结构的深度管理模型和审计能力。
  weaknessVsUs: 重心在合同记录和生命周期控制，而不是把规则批次发布到在跑标案和培训里。
  sourceRefs:
  - 9
- name: Deltek Costpoint 与 Clarity 生态
  stage: 现有厂商 ERP 与 GovCon 软件生态
  wedge: 定价治理、合规、ERP 集成，以及面向政府承包商的市场情报。
  pricing: 套件式报价销售与企业部署
  strength: 装机基础深、定价和合规可信度强。
  weaknessVsUs: 公开定位里，并没有把自己定义成横跨投标、下传条款和政策资产的制品级 FAR 重写迁移层。
  sourceRefs:
  - 10
- name: GovDash
  stage: AI 原生 GovCon 工作流创业公司
  wedge: 以捕获、投标和合同 AI 代理为核心，再加合规矩阵自动化。
  pricing: 报价式直销
  strength: 投标自动化速度快，生命周期叙事也完整。
  weaknessVsUs: 重心仍是招标驱动的投标和合同监控，而不是外部规则差异驱动的发布治理。
  sourceRefs:
  - 11
- name: Procurement Sciences
  stage: AI 原生 GovCon 平台
  wedge: 带 GovCon 视角的“从投标到合同”AI 与 CLM 自动化。
  pricing: 报价式企业销售
  strength: 把投标、合同条款、合规和执行工作流串得更紧。
  weaknessVsUs: 仍偏通用生命周期自动化；公开定位里没有把内部打法的 FAR 重写迁移放在中心。
  sourceRefs:
  - 12
- name: 外部律师 + 内部 SharePoint / Excel 拼装栈
  stage: 现状替代品
  wedge: 人工解读，加上模板、电子表格和仓库流程。
  pricing: 内部人力 + 按小时或按项目计费的法务支出
  strength: 法律判断可信，而且不用新采买平台。
  weaknessVsUs: 速度慢、难以在在跑商机里追踪，也没法复用成一张发布图。
  sourceRefs:
  - 6
  - 8
  - 19
regulatoryTechnicalConstraints:
- point: 产品必须处理拟议规则继续漂移，因为在规则真正定稿前，客户都需要拟议版和最终版并行存在。
  sourceRefs:
  - 1
  - 2
  - 3
- point: 各机构对 CUI 的认定并不一致，这会直接改写投标工作流里的架构、人员配置和定价假设。
  sourceRefs:
  - 7
- point: NDAA 与 DFARS 在成本数据门槛、下传条款限制和技术数据监督上的变化，会让客户期待中的映射逻辑更复杂。
  sourceRefs:
  - 8
- point: 投标评审仍要求到因素级别的证据和缺陷记录，所以发布包必须带清楚、可审计的追溯。
  sourceRefs:
  - 20
- point: 合同数据和制品仓库依旧碎片化，所以早期部署里的集成和归一化工作不会轻。
  sourceRefs:
  - 9
  - 19
validationSignals:
- point: 两份九月 18 日规则包都已经落地，意见截止日是十月 19, 2026。
  sourceRefs:
  - 1
  - 2
- point: Council 明确提到：45% 的 2025 财年合同金额是在没有竞争或只有一家报价的情况下授出的，这会进一步逼市场调整采购姿态。
  sourceRefs:
  - 5
- point: Deltek 发现，56% 的承包商在定价流程里至少某个环节仍靠 Excel。
  sourceRefs:
  - 10
- point: GovCon 投标团队今天仍常常靠收件箱和共享盘运转，而不是完全连通的系统。
  sourceRefs:
  - 19
- point: APMP 软件生态已经挤满了响应管理和内容库工具，因此“规则发布”这块空位反而更显眼。
  sourceRefs:
  - 13
openQuestions:
- 到底有多少目标承包商已经维护着“单一条款库 + 干净的在跑商机跟踪”，从而无需重咨询清洗就能映射？
- 买家会不会在最终版 FAR 文本落地前就为这类产品买单，还是必须等律师验证过的最终分支出来？
- 只靠第 12 和第 15 部暴露面，是否足以支撑部署，还是首发就必须把第 9、27、44、47 和 52 部打包进来？
- 首版真正绕不过去的集成到底是哪些：SharePoint、Word、Deltek、GovWin、Salesforce，还是合同仓库？
- 律师特权反馈能不能和产品化的发布逻辑干净切开，而不引出采纳或责任问题？
