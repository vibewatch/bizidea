problem: >-
  Outpatient practices face staffing and capacity constraints while scheduling, outreach, and insurance verification
  remain labor-intensive workflows. When an appointment cancels, an affiliated clinic may have a compatible patient
  waiting elsewhere in the group, but staff have limited time to find and confirm that match before the slot expires.
  The source evidence supports the operational context, not the scale of this specific cancellation problem.
targetUser:
  primary: >-
    Central scheduling and patient-access leaders at PE-backed outpatient specialty groups with multiple nearby
    same-specialty sites and shared scheduling authorization.
  secondary: "Practice managers who release cancelled appointments and manage patient waitlists."
  buyer: "The COO, VP of operations, or portfolio operations lead at a multi-site physician group."
startupThesis:
  nonObviousInsight: >-
    The scarce unit is not another automated phone call but a time-bounded match between an empty bookable slot and an
    opt-in patient willing and permitted to use a different affiliated location. A group with shared operating rules
    can create that local demand density without first building an open consumer marketplace.
  beachhead: >-
    U.S. PE-backed outpatient specialty groups in one metro with at least two affiliated same-specialty clinics,
    centralized access staff, and existing patient waitlists; begin with late-cancelled appointments.
  wedge: >-
    A private cross-location vacancy exchange for one specialty within one affiliated group that applies
    practice-defined appointment constraints and patient location and time preferences to release a limited offer to
    the best-fit waitlisted patients.
  whyNowCatalyst: >-
    Confido's October announcement of a $12.5 million extension and reported multi-site footprint, alongside coverage
    of staffing and capacity constraints, makes practice-operations automation and PE-led distribution timely; the
    sources do not yet prove demand for cross-site cancellation fills.
  ventureScalePath: >-
    Prove completed-visit recovery in one specialty and metro, expand to additional specialties and management-services
    groups, then add aggregated capacity-utilization reporting based on observed fill outcomes.
solution: >-
  The service imports newly released appointment slots and opt-in waitlist records for participating clinics in one
  affiliated group. It applies group-defined specialty, appointment-type, payer, provider, location, and travel rules
  to rank only feasible matches, then sends a time-limited offer to the patient. Accepted offers update the relevant
  schedule, while expired or uncertain matches return to staff rather than changing clinical eligibility or care
  decisions. A pilot compares completed visits recovered and time-to-fill against the group's current local-waitlist
  workflow.
goToMarketSeed:
  firstCustomer: >-
    A PE-backed outpatient specialty group with centralized scheduling, at least two nearby affiliated clinics, and
    patient waitlists that can be used under existing group consent and access rules.
  buyingTrigger: >-
    A portfolio operations push to improve appointment access or clinic productivity after adding sites or facing
    persistent scheduling-staff constraints.
  currentAlternative: >-
    Site-specific EHR waitlists, manual outbound calls, spreadsheets, and appointment-reminder or scheduling modules.
  switchingReason: >-
    It matches patients to vacancies across affiliated locations without replacing the EHR schedule or asking staff to
    search multiple local waitlists manually.
  pricingHypothesis: >-
    Charge a recurring fee per participating clinic plus a variable fee for each cross-site booking that results in a
    completed visit, excluding routine in-site scheduling.
