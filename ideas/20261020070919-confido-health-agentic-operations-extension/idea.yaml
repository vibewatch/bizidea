jobsToBeDone:
  - job: >-
      When a patient cancels a near-term appointment, help central schedulers find an eligible waitlisted patient at
      another affiliated clinic, so they can recover appointment access before the slot expires.
    currentAlternative: "Call through the local waitlist, use a spreadsheet, or leave the appointment unfilled."
    successMetric: "Incremental completed visits per cancelled slot and median time from slot release to acceptance."
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      A private, cross-location exchange for expiring clinic capacity is a more unusual mechanism than another
      appointment reminder or site-level scheduling bot.
  venturePotential:
    score: 4
    rationale: >-
      Multi-site groups and PE-led distribution create a plausible land-and-expand route, but the evidence does not
      quantify cancellation leakage or willingness to pay for recovered visits.
  whiteSpace:
    score: 3
    rationale: >-
      Healthcare administration automation is crowded and Confido already addresses scheduling; the narrower
      cross-site capacity exchange remains distinct but may be bundled by incumbents.
  painIntensity:
    score: 4
    rationale: >-
      Source coverage describes staffing and capacity constraints at outpatient practices, though it does not quantify
      cancellation-related losses.
  wedgeClarity:
    score: 4
    rationale: >-
      One specialty, one metro, and one affiliated group make the pilot measurable, but it depends on accessible
      schedules and sufficient patient flexibility.
  evidenceFit:
    score: 3
    rationale: >-
      The sources establish multi-site operations, scheduling automation, and capacity pressure, but none directly
      documents unmet cross-site waitlist demand or the economics of vacancy recovery.
topRisks:
  - name: "Low match density"
    description: >-
      Specialty, payer, provider, travel, and appointment constraints may leave too few patients willing to take a
      newly opened slot at another location.
    mitigation: >-
      Start with one specialty and nearby clinics, estimate match density from de-identified historical scheduling
      data, and run a limited pilot before expanding.
  - name: "Consent and data access"
    description: >-
      Cross-site waitlist use may require privacy, patient-consent, and group-access approvals that slow deployment.
    mitigation: >-
      Begin within one legal physician group, use minimum-necessary scheduling data, and have the group approve consent
      and access rules before any patient offer is sent.
  - name: "Incumbent bundling"
    description: >-
      Existing practice-operations vendors may add cross-site waitlist matching or block the integrations needed to
      reach schedules.
    mitigation: >-
      Prove incremental completed visits with a narrow pilot and partner where practical, positioning the product as a
      measurable capacity exchange rather than a replacement scheduling system.
