differentiator: >-
  Instead of automating each clinic's own appointment queue, the product treats late-cancelled slots as perishable
  inventory available to eligible, opt-in patients across affiliated locations. The group keeps control of clinical
  and scheduling rules, and the initial commercial metric is a completed cross-site visit rather than messages sent or
  appointments merely offered.
