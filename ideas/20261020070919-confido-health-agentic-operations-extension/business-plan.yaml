slug: portfolio-slot-exchange
date: "2026-10-20"
executiveSummary: >-
  This pre-seed plan tests a rules-based, private exchange that matches late-cancelled outpatient appointments to
  opted-in patients waiting at nearby clinics in the same provider group. The target is a PE-backed specialty group
  with centralized scheduling, at least two same-specialty sites, and a documented gap between local waitlists.
  Research supports staffing and operating-cost pressure, but does not measure cross-site cancellation leakage or
  willingness to pay for this product. Cancellation backfill is already a crowded category: Phreesia, Epic, Luma,
  NexHealth, Relatient, and athenahealth market automated waitlist workflows, and Phreesia's vendor-published
  Summit case reports filling 75% of EMG cancellations. The product therefore must prove incremental completed
  visits beyond each group's existing local workflow, not merely send more offers. Start with one group, one metro,
  one specialty, and one scheduling stack; defer cross-EHR expansion until permission, access, and match density
  are proven. Charge for participating sites and only for cross-site bookings that result in attributable completed
  visits; the proposed pilot price is a test, not validated willingness to pay. Investment posture is Watch until
  historical replay, privacy/technical access, and a paid controlled pilot validate the wedge.
problem:
  - >-
    Central access teams at multi-site outpatient groups handle scheduling and outreach under staffing and operating
    cost pressure; the evidence establishes the context, not a measured labor burden for this exact workflow.
  - >-
    When a near-term appointment is cancelled, its local waitlist may not contain an eligible patient before the
    slot expires, while a compatible opted-in patient may be waiting at another group site; current cross-site
    leakage and foregone visit value are unquantified.
  - >-
    Native EHR waitlists, patient-access suites, schedulers, and manual calls already address cancellation recovery,
    so a separate purchase is justified only where current configurations leave a demonstrable cross-site gap.
solution:
  - >-
    In one affiliated group, ingest authorized slot releases and opt-in waitlists, apply group-defined appointment,
    payer, provider, location, travel, time, and consent rules, then rank feasible cross-site offers.
  - >-
    Use time-limited patient offers and safe schedule write-back with expiry, conflict checks, audit logs, and staff
    fallback; never make a clinical eligibility decision or count an offer as a recovered visit.
  - >-
    Compare completed visits, time-to-fill, patient acceptance, staff minutes, and re-cancellations against a
    predeclared local-waitlist holdout before charging an outcome fee or expanding.
whyWeWin:
  - >-
    The proposed distinction is group-governed matching across site-level queues, not the already commoditized
    act of contacting a waitlist; public evidence does not prove that direct vendors lack this capability.
  - >-
    Completed, incremental cross-site visits are the success and billing unit, preventing the product from
    optimizing for messages, accepted offers, or appointments that local workflows would have filled.
  - >-
    Patient opt-in, visible location choice, explicit operating rules, and human review for uncertain cases make
    the exchange auditable without replacing the EHR or assigning clinical suitability.
strategicChoices:
  beachhead: >-
    One U.S. metro and one outpatient specialty inside a PE-backed group with two to four nearby sites, centralized
    access staff, usable opt-in waitlists, and a verified local-queue gap; select the specialty from historical
    match density rather than assuming a market-wide cancellation rate.
  wedgeRationale: >-
    A single group provides a bounded permission and consent environment, comparable scheduling rules, and enough
    local density to replay matches and run a controlled pilot. It narrows onboarding versus an open marketplace
    while testing the specific cross-site gap that native local waitlists may not address.
  sequencingRationale: >-
    First verify counterfactual match density, incumbent configuration, data authority, and write access; then build
    one connector and a shadow matcher, launch staff-supervised offers, and sell production only after incremental
    completed visits are measured. Add implementation and customer-success capacity only after a paid pilot; add
    EHRs, specialties, and portfolio distribution after repeatable permissions and unit economics are demonstrated.
  notYet:
    - "Consumer-facing or open multi-provider appointment marketplace."
    - "Broad multi-specialty operations suite, general scheduling automation, or routine in-site waitlist replacement."
    - "Cross-EHR integrations, autonomous booking for uncertain cases, or any clinical eligibility decision before the first controlled pilot."
market:
  tam: >-
    $758.4M annual scenario, not observed category revenue: 31,600 assumed eligible U.S. groups × four sites ×
    $6,000 annual site-value proxy. The eligibility filter, site count, and sizing proxy are unverified assumptions.
  sam: >-
    $48.0M annual scenario: 2,000 assumed PE-backed or similarly centralized specialty groups × four sites × the
    same $6,000 site-value proxy. No public source counts this eligible cohort.
  som: >-
    $2.4M five-year reachability scenario, not a forecast: 100 groups × four sites × the $6,000 proxy, or 5% of the
    assumed SAM. Validate named-account availability and attainable contract value before treating it as a plan.
  segments:
    - "Primary: PE-backed outpatient specialty groups in one metro with nearby same-specialty sites, centralized access, and a documented cross-site waitlist gap."
    - "Secondary: MSOs and PE portfolio operations teams that can sponsor deployment across groups after a first group demonstrates outcomes."
  buyingProcess: >-
    A COO, VP of operations, or portfolio operations lead sponsors a paid pilot after a portfolio standardization,
    staffing, or access initiative surfaces lost appointment capacity; patient-access and specialty leaders define
    workflow rules. IT/EHR administrators, privacy/security, compliance counsel, and patient communications owners
    must approve access and outreach before identifiable data or live offers are used.
product:
  mvp: >-
    Build a secure, auditable workflow for one scheduling stack and two to four sites in one group: authorized
    cancellation and waitlist ingestion, rules-based eligibility ranking, opt-in and travel constraints,
    staff-supervised time-limited offers, expiry/conflict handling, and schedule write-back. Begin in shadow mode;
    enable live offers only after group privacy, consent, security, and EHR owners approve the workflow.
  sixMonth: >-
    Complete one production-capable connector and shadow replay for a paid design partner; proceed to a limited
    live test only if historical data shows sufficient eligible matches and the group confirms authority to share
    required data and send offers.
  twelveMonth: >-
    Run a controlled 2–4-site pilot with a local-workflow holdout, reconcile offers to completed visits, and convert
    only if the pilot increases completed fills and the buyer signs a production contract. Do not add another EHR
    solely to broaden the feature list.
  twentyFourMonth: >-
    If the first cohort meets outcome and onboarding thresholds, support multiple groups in the same metro, add a
    second scheduling connector only against paid demand, and provide group-level reporting on incremental fills,
    time-to-fill, travel acceptance, and completion.
  keyBets:
    - "Enough cancellations remain unfilled after local workflows for cross-site candidates to create incremental completed visits."
    - "A group can authorize and operationalize shared patient preferences, consent, and schedule access across participating sites."
    - "Patients will accept a nearby alternate site when the offer is opt-in and clearly states location and time."
    - "A buyer will pay separately for incremental outcomes despite strong native and patient-access suite substitutes."
    - "Connector and implementation work can become repeatable enough to support a gross-margin goal above 70%."
gtm:
  wedge: >-
    Sell a 90-day, paid design pilot to one centralized-access specialty group after a portfolio operations or COO
    initiative exposes persistent manual backfill and the buyer confirms its native waitlists do not bridge the sites.
    Start with a shadow replay and incumbent configuration review, then activate only a pre-agreed subset of slots.
  channels:
    - "Direct outreach and referrals to physician-group COOs, VPs of operations, and patient-access leaders."
    - "Portfolio operations and PE platform introductions as a prospecting route; the researched Confido channel is category context, not proven access for this company."
    - "EHR/PM implementation firms for technical access or referrals only after an integration is proven; no partnership is assumed."
  funnelTargets: >-
    Initial operating target, not observed conversion: 20 qualified group introductions → 8 workflow/data-readiness
    reviews → 2 paid pilots; at least 50% of successful paid pilots convert to production. Reset targets after the
    first 20 qualified conversations.
  pricing: >-
    Test a $10,000–$20,000 fixed 90-day pilot for up to four sites, then a recurring per-site fee plus a fee only
    for pre-agreed incremental cross-site bookings that result in completed visits. No buyer price or outcome fee
    is evidenced; exclude routine in-site scheduling, offers that do not complete, and visits the local workflow
    would have filled.
businessModel:
  revenueStreams:
    - "Annual subscription per participating clinic for rules, workflow, audit, and outcome reporting."
    - "Variable fee for an attributable cross-site booking only after the visit is completed and the agreed counterfactual is reconciled."
    - "Fixed paid pilot and implementation fee during initial deployment; standardize or reduce services before scaling."
  unitOfValue: >-
    One incremental completed visit recovered from another affiliated site after excluding local-waitlist fills,
    moved appointments, later cancellations, and non-completions.
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add eligible sites within a group after the first sites show incremental completed visits and safe operations."
    - "Add a second scheduling connector or specialty only against signed customer demand and repeatable implementation."
    - "Offer aggregated capacity-utilization reporting after the company has permissioned, reliable outcome data."
strategyMap:
  northStarMetric: "Incremental cross-site completed visits per eligible cancelled slot versus the group's existing workflow."
  inputMetrics:
    - "Share of released slots with at least one consented, payer- and appointment-compatible patient at another site."
    - "Offer acceptance rate by travel time, appointment type, and time of day."
    - "Median time from authoritative cancellation event to accepted offer."
    - "Completed-visit rate and re-cancellation rate for accepted cross-site offers."
    - "Staff minutes per recovered visit and production onboarding time per group."
  moatsToBuild:
    - "Permissioned, de-identified histories linking eligible offers, patient choices, completed visits, travel, and time-to-fill."
    - "Reusable group-specific consent, payer, appointment taxonomy, conflict handling, and connector implementation playbooks."
    - "A controlled incrementality methodology that distinguishes cross-site recovery from local fills and appointment shifts."
  killCriteria:
    - "Across five qualified group replays, fewer than 5% of otherwise unfilled near-term slots have a consented, feasible cross-site patient before expiry."
    - "A controlled pilot produces less than a 5 percentage-point increase in completed-visit fill rate versus the local-workflow holdout, or increases re-cancellations materially."
    - "Fewer than two paid pilot commitments from 20 qualified buyers at the proposed $10,000–$20,000 pilot test price."
    - "No group can document lawful access, patient communication permissions, and safe schedule write-back for at least two sites within six months."
    - "After three deployments, onboarding remains longer than 12 weeks or the service burden prevents a credible path to 70% gross margin."
  mermaid: |
    flowchart LR
      Buyer["Multi-site specialty group with local-queue gap"] --> Wedge["One metro, one specialty, two to four sites"]
      Wedge --> MVP["Permissioned rules-based vacancy exchange"]
      MVP --> Proof["Incremental completed visits versus local holdout"]
      Proof --> Expansion["Add groups, sites, and connectors after repeatability"]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low conviction; the operating pain and buyer context are credible, but cross-site incrementality, differentiation, and willingness to pay remain unproven."
    whyBelieve: "Multi-site groups face documented operating-cost pressure, and existing automation leaves a testable gap where local queues and permissions remain siloed."
    whyDoubt: "Scaled vendors already backfill cancellations, while no independent evidence quantifies residual cross-site demand, buyer budget, or a defensible feature gap."
    nextDiligence: "Review a de-identified historical replay and a paid, controlled pilot that measures incremental completed visits against the group's configured local waitlist."
  firstCustomer:
    title: "PE-backed metro orthopedic group with siloed local waitlists"
    profile: "A centralized-access physician group with two to four nearby orthopedic sites, opt-in waitlists, and a documented limit in its current EHR or patient-access configuration."
    trigger: "A portfolio or operating leader is standardizing access after staffing pressure or a site acquisition and can quantify near-term cancellations left unfilled by local workflows."
    buyer: "COO, VP of operations, or portfolio operations lead"
    initialContract: >-
      Proposed validation price, not observed willingness to pay: $10,000–$20,000 for a 90-day, two-to-four-site
      paid pilot, converting to per-site annual subscription plus a completion fee only for agreed incremental
      cross-site visits.
  mustBeTrue:
    - "Historical replay at 8–10 qualified groups finds a feasible, consented cross-site patient for at least 10% of near-term slots still unfilled after local workflow."
    - "A controlled pilot improves completed-visit fill rate by at least 10 percentage points versus a predeclared local-workflow holdout without materially increasing re-cancellations."
    - "At least two of 20 qualified buyers sign a paid 90-day pilot at the proposed $10,000–$20,000 test price, and at least one converts to production after meeting its outcome threshold."
    - "A pilot group and its EHR/security owners approve the legal access, patient communication, and write-back path for two or more sites without a manual process that misses the slot window."
    - "At least three of the first five qualified target groups have no configured incumbent workflow that closes the cross-site gap, and buyers confirm they would pay separately rather than wait for an incumbent feature."
  diligenceQuestions:
    - "In each target group's last 12 months, what fraction of late cancellations remained unfilled after native waitlists, and how many had a feasible cross-site patient?"
    - "Can the group establish patient opt-in, covered-entity and business-associate roles, permitted use, and SMS opt-out controls for cross-site offers?"
    - "Which EHR or patient-access tools are already deployed, and can the buyer demonstrate that their configured workflows cannot meet this use case?"
    - "Can the schedule connector reliably detect cancellations and write back or reserve appointments without race conditions, duplicates, or invalid bookings?"
    - "What controlled design attributes incremental completed visits to the exchange rather than local fills, moved visits, or appointments that later cancel?"
    - "Will the economic buyer sign a paid pilot at the proposed test price, and what production price is supported by recovered visit economics?"
operatingAssumptions:
  - assumption: "A sufficiently dense cross-site pool remains after local waitlists and operational eligibility rules are applied."
    basis: "research.yaml"
    validationTest: "Replay 12 months of de-identified cancellation, waitlist, payer, appointment-type, location, and completion records from 8–10 target groups; quantify eligible matches before slot expiry and compare with local outcomes."
    decisionImpact: "If fewer than 5% of residual near-term cancellations have a feasible opted-in patient across five groups, stop the exchange or narrow to a denser specialty."
  - assumption: "A single affiliated group can authorize the necessary patient data use, communication, and schedule write-back across sites."
    basis: "research.yaml"
    validationTest: "Have one group's counsel, privacy/security lead, patient-access owner, and EHR administrator document entity roles, permitted purpose, notices/consent, SMS opt-out, BAA needs, API scopes, and write-back approval before live data use."
    decisionImpact: "If permissions or write access are unavailable, do not launch live offers; limit any further work to de-identified replay or terminate the target workflow."
  - assumption: "A buyer will fund a separate cross-site product despite bundled EHR and patient-access automation."
    basis: "research.yaml"
    validationTest: "Interview 15–20 qualified operations buyers and EHR owners, document incumbent configuration and price, and obtain at least two paid pilot commitments at the proposed test price."
    decisionImpact: "If buyers prefer a vendor roadmap or cannot identify budget after quantified replay, pursue a partnership or stop standalone GTM."
  - assumption: "Patients will accept nearby alternate locations often enough to produce incremental completed visits without creating access inequity."
    basis: "operator judgment"
    validationTest: "In a staff-supervised pilot, measure opt-in, offer acceptance, travel-time bands, completion, re-cancellation, and patient complaints; retain patient-selected location constraints and a local option."
    decisionImpact: "If acceptance is low or travel/access complaints cluster among affected patients, narrow geography or remove cross-site offers for those cohorts."
  - assumption: "Onboarding can become repeatable enough for a software-led model with gross margin above 70%."
    basis: "operator judgment"
    validationTest: "Track implementation hours, elapsed time, connector defects, support minutes, and variable infrastructure cost for the first three groups; require a credible path below 12 weeks per deployment."
    decisionImpact: "If every group requires bespoke integration or ongoing manual scheduling, price as a service, partner for implementation, or stop expansion."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Run de-identified historical shadow replays with 8–10 qualified groups, preserving local-waitlist outcomes as the counterfactual."
    hypothesis: "Some groups have residual near-term slots with feasible, opted-in patients at another site after local tools have acted."
    successMetric: "At least 10% of residual near-term slots have one feasible cross-site match in three or more groups; report completion potential separately from observed booking."
    owner: "CEO/founder and data engineer"
  - horizon: "0–90 days"
    experiment: "Interview 15–20 COOs, patient-access leaders, EHR owners, and portfolio operators; map current vendor configuration and test the paid-pilot offer."
    hypothesis: "A subset of centralized groups has a verified cross-site gap, identifiable budget owner, and urgency after a standardization or staffing trigger."
    successMetric: "Document five qualified workflow gaps and obtain two paid-pilot commitments at the proposed $10,000–$20,000 test price."
    owner: "CEO/commercial founder"
  - horizon: "0–90 days"
    experiment: "Complete one group's privacy, consent, security, and integration-readiness review before using identifiable data."
    hypothesis: "One group can authorize minimum-necessary cross-site use and a safe schedule read/write route within a bounded legal entity."
    successMetric: "Written approval path, required agreements and notices identified, and a tested sandbox/interface scope for two sites."
    owner: "CEO/founder with privacy counsel and group IT"
  - horizon: "3–6 months"
    experiment: "Build a shadow matcher and one connector for the selected scheduling stack; keep all offers disabled pending reconciliation."
    hypothesis: "Authoritative cancellation events and eligibility rules can be processed quickly enough to make safe, auditable offers."
    successMetric: "Reconcile at least 99% of sampled cancellation events to source records, with zero duplicate or rule-ineligible offers in the shadow test."
    owner: "Founding engineer/integration lead"
  - horizon: "6–9 months"
    experiment: "Run a staff-supervised 2–4-site pilot with a predeclared site-matched holdout or stepped-wedge comparison."
    hypothesis: "Cross-site offers increase completed fills beyond the configured local waitlist without increasing re-cancellations or patient harm."
    successMetric: "At least a 10 percentage-point lift in completed-visit fill rate versus holdout, with all offers traceable to opt-in and approved rules."
    owner: "Product/operations lead and group patient-access lead"
  - horizon: "9–12 months"
    experiment: "Reconcile booking, attendance, completion, and local counterfactuals with group operations and finance; test production pricing."
    hypothesis: "The buyer accepts the completion-based attribution and will convert after the pilot meets its pre-agreed lift threshold."
    successMetric: "At least one production conversion from the first two paid pilots and signed definitions of billable completed visits."
    owner: "CEO/commercial founder"
  - horizon: "12–18 months"
    experiment: "Replicate the validated workflow in a second group; evaluate a second connector only if that customer funds or commits to the need."
    hypothesis: "Consent mapping, integration, and outcome measurement can be reused without customer-specific service work dominating delivery."
    successMetric: "Second-group onboarding completes within 12 weeks, supports the same outcome definitions, and preserves a path to 70% gross margin."
    owner: "Integration lead and customer-success lead"
operations:
  - "Require a documented group authority, minimum-necessary data map, business-associate review where applicable, and patient opt-in/opt-out handling before live outreach."
  - "Use one authoritative schedule source, idempotent event processing, slot expiry and conflict checks, audit logs, and staff escalation for uncertain matches."
  - "Reconcile offer, booking, arrival, completion, and later cancellation records with the buyer before calculating outcomes or variable fees."
  - "Review patient location preferences, travel time, accessibility, payer, provider, and appointment-type constraints; offer another location only when permitted and chosen."
  - "Use privacy counsel and an EHR/PM integration partner selectively; no channel, connector permission, or vendor partnership is assumed until documented."
team:
  - role: "CEO / commercial founder"
    startTiming: "Month 0"
    rationale: "Own buyer discovery, paid design-partner sales, group workflow mapping, and the initial portfolio-operations channel tests."
  - role: "Founding engineer / integration lead"
    startTiming: "Month 0"
    rationale: "Build secure cancellation ingestion, rules-based matching, event reconciliation, safe write-back, and the first scheduling connector."
  - role: "Healthcare implementation and customer-success lead"
    startTiming: "Month 6–9, after a paid pilot and approved data path"
    rationale: "Run consent/configuration, scheduler training, controlled-pilot operations, and completed-visit reconciliation; hire only after customer demand is evidenced."
  - role: "Privacy/security counsel"
    startTiming: "External support from Month 0"
    rationale: "Review entity roles, permitted use, business-associate terms, patient communications, opt-outs, and security requirements before identifiable-data workflows."
milestones:
  - horizon: "0–12 months"
    items:
      - "Complete 15–20 buyer interviews and document the incumbent configuration and buying trigger for each qualified account."
      - "Secure two paid-pilot commitments and one group's written privacy, consent, security, and EHR access plan."
      - "Finish de-identified historical replay; proceed to live pilot only if match density passes the predeclared threshold."
      - "Run a controlled 2–4-site pilot and report incremental completed fills, time-to-fill, re-cancellations, travel acceptance, and staff minutes."
      - "Convert at least one successful paid pilot to a production contract; otherwise revisit product or pricing before adding headcount."
  - horizon: "12–24 months"
    items:
      - "Deploy to three paying groups only if the first pilot confirms incremental outcomes and repeatable permissions."
      - "Keep median deployment within 12 weeks and test a 70% gross-margin path across the first three customers."
      - "Add a second connector only against signed customer demand and demonstrated schedule read/write access."
      - "Reach at least 50% paid-pilot-to-production conversion across completed pilots or pause expansion hiring."
  - horizon: "24–36 months"
    items:
      - "Target ten production groups across no more than two specialties and two scheduling connectors, contingent on retention and delivery economics."
      - "Build permissioned, de-identified outcome reporting only where customer agreements allow aggregation."
      - "Expand through MSO or portfolio sponsorship only after two group deployments are repeatable without bespoke workflow services."
risks:
  - risk: "Low cross-site match density or patient willingness leaves too few appointments to recover beyond local waitlists."
    likelihood: "High"
    impact: "High"
    mitigation: "Use shadow replay before building a live workflow; narrow to high-density specialties and metros, and stop if the predeclared match threshold fails."
  - risk: "EHR-native or patient-access incumbents already cover the gap or bundle cross-site matching."
    likelihood: "High"
    impact: "High"
    mitigation: "Benchmark each target's configured Epic, Phreesia, Luma, NexHealth, Relatient, or athenahealth workflow; sell only on controlled incremental outcomes."
  - risk: "Group authority, privacy, consent, or SMS requirements block cross-site data use or outreach."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Start within one bounded group, obtain counsel and privacy/security approval before identifiable-data use, preserve opt-outs, and route uncertain cases to staff."
  - risk: "Schedule interfaces do not deliver timely cancellation events or safe write-back, creating conflicts and missed offer windows."
    likelihood: "High"
    impact: "High"
    mitigation: "Select one supported stack, test production scopes and event latency, use idempotent updates and expiry controls, and maintain an auditable staff fallback."
  - risk: "Travel preferences and access barriers reduce acceptance or shift burden onto patients with fewer transportation options."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Require opt-in to alternate sites, expose location and travel details, honor patient-selected limits, monitor acceptance and complaints by travel cohort, and retain local scheduling."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–3M"
  runwayMonths: 18
  useOfFundsSummary: >-
    Target 18 months to build one secure scheduling connector and shadow-to-live exchange, complete privacy and
    security work, run a controlled pilot with two to four sites, establish incremental completed-visit economics,
    convert the first production customer, and test a repeatable onboarding path. Keep hiring conditional on paid
    pilots and do not fund multi-EHR or multi-specialty expansion before those gates pass.
