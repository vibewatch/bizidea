fundingAsk:
  round: pre-seed
  amountM: 2.75
  runwayMonths: 18
  milestone: "Run a controlled 2-4-site pilot, demonstrate at least a 10-percentage-point lift in completed-visit fill versus the local-workflow holdout, convert the first production customer, and retain the modeled six-month cash buffer."
  useOfFunds:
    - bucket: Engineering
