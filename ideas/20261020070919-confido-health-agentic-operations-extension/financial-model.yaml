    - bucket: "G&A"
      amountUsd: 300000
      percentage: 10.9
    - bucket: "Buffer (6 mo)"
      amountUsd: 600000
      percentage: 21.8
scenarios:
  downside:
    description: >-
      Low match density and weak willingness to pay reduce the model to five gross group wins, lower annual revenue
      per group, and no follow-on financing while the planned cost base remains in place.
    y3RevenueK: 114.47
    y3EbitdaK: -1392.7
    cashLowPointK: -1406.45
    keyAssumptionChanges:
      - "A18: annual revenue per group falls to $45K and monthly churn rises to 2.5%."
      - "A18: only five gross group wins arrive by M36 and the conditional M19 seed does not close."
      - "A18: planned hiring and operating spend are not cut, so negative cash denotes an unfunded gap rather than a viable continuation plan."
  base:
    description: >-
      The base case reaches about ten active paying groups by M36, grows through the BP pilot and deployment gates,
      and assumes a conditional seed round after proof.
    y3RevenueK: 504.201
    y3EbitdaK: -1061.429
    cashLowPointK: 535.733
    keyAssumptionChanges:
      - "A3-A6: $60K annualized revenue per group, 1.5% monthly churn, and twelve gross wins, including two Y2 wins and eight Y3 wins."
      - "A14-A16: the $2.75M pre-seed closes at M1 and the conditional $1.50M seed closes at M19."
  upside:
    description: >-
      Stronger match density and buyer conversion support fourteen gross wins, higher annual revenue per group, and
      lower churn while retaining the same planned team and M19 seed.
    y3RevenueK: 706.827
    y3EbitdaK: -889.197
    cashLowPointK: 756.175
    keyAssumptionChanges:
      - "A19: annual revenue per group reaches $75K and monthly churn is 1.0%."
      - "A19: fourteen gross group wins arrive, including two in Y2 and ten in Y3."
      - "A19: the conditional $1.50M seed closes at M19."
sensitivity:
  - variable: ARPU
    downsideCase: "$45K annual revenue per group for Y3"
    baseCase: "$60K annual revenue per group"
    upsideCase: "$75K annual revenue per group"
    y3RevenueImpactK: -126.05
    cashImpactK: -107.143
  - variable: CAC
    downsideCase: "$95.4K CAC with five Y3 gross wins after three early wins slip beyond M36"
    baseCase: "$71.5K CAC with eight Y3 gross wins"
    upsideCase: "$57.2K CAC with eleven Y3 gross wins after three extra early wins"
    y3RevenueImpactK: -153.101
    cashImpactK: -130.136
  - variable: churn
    downsideCase: "2.5% monthly logo churn throughout the model"
    baseCase: "1.5% monthly logo churn"
    upsideCase: "0.75% monthly logo churn throughout the model"
    y3RevenueImpactK: -39.428
    cashImpactK: -43.674
  - variable: sales cycle
    downsideCase: "The conditional $1.50M M19 seed does not close through M36"
    baseCase: "The conditional $1.50M seed closes at M19"
    upsideCase: "The same $1.50M seed closes at M18"
    y3RevenueImpactK: 0.0
    cashImpactK: -1500.0
  - variable: gross margin
    downsideCase: "Variable nonpayroll COGS rises to 20% of revenue in all years"
    baseCase: "Variable nonpayroll COGS is 15% of revenue"
    upsideCase: "Variable nonpayroll COGS falls to 10% of revenue"
    y3RevenueImpactK: 0.0
