slug: portfolio-slot-exchange
date: "2026-10-20"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Starting paid groups
    value: "0 active paying groups in M1"
    unit: groups
    source: "[business-plan.yaml.executiveSummary and gtm] The plan is pre-revenue and names no signed customer; model starts with zero."
  - id: A2
    name: Paid pilot price
    value: "$15,000 for a 90-day pilot"
    unit: USD per pilot
    source: "[business-plan.yaml.gtm.pricing] Midpoint of the proposed $10,000-$20,000 pilot range; not validated willingness to pay."
  - id: A3
    name: Annualized revenue per paying group
    value: "$60,000 per group-year, equal to the $15,000 pilot price annualized; modeled production mix is $24,000 fixed site fees plus $36,000 completed-visit fees."
    unit: USD per group-year
    source: "[business-plan.yaml.businessModel and gtm; research.yaml.market.bottomUpSizingDrivers] Four sites at the $6,000/site-year sizing proxy support a $24,000 fixed-fee reference; the $36,000 outcome-fee component is an explicit, unvalidated model assumption."
  - id: A4
    name: Revenue recognition and billing
    value: "Monthly revenueK equals active paying groups at month-end multiplied by $60,000 / 12; new paid groups are billed for their first active month, and pilot accounts remain billable at the same run rate after 90 days if they convert or extend, with no separate pilot attrition haircut."
    unit: method
    source: "[business-plan.yaml.businessModel.revenueStreams] Startup-finance timing heuristic; pilot and production contracts use the same $5,000 monthly-equivalent run rate for comparability."
  - id: A5
    name: Gross customer additions
    value: "M7: 1; M10: 1; M17: 1; M23: 1; M25-M31: 1 per month; M33: 1; 12 gross wins by M36."
    unit: paying groups
    source: "[business-plan.yaml.gtm.funnelTargets and milestones] Two Y1 pilots, two additional group wins by M24, and eight Y3 additions are a modeled path to the BP target of ten production groups by months 24-36; timing and conversion are unvalidated."
  - id: A6
    name: Monthly logo churn
    value: "1.5"
    unit: percent per month
    source: "Startup-finance heuristic for unvalidated early B2B healthcare SaaS retention; no product-specific retention evidence exists, and expected customer counts are therefore fractional."
  - id: A7
    name: Fully loaded annual cash payroll by role
    value: "CEO $120,000; founding engineer $160,000; implementation/customer success $120,000; product/integration engineer $160,000; GTM/account executive $130,000 per FTE-year."
    unit: USD per FTE-year
    source: "[business-plan.yaml.team] Role set follows the BP; compensation is a named startup-finance heuristic, includes employer taxes and benefits, and excludes equity."
  - id: A8
    name: Hiring timing
    value: "CEO and founding engineer M1; implementation/customer success M7; product/integration engineer M16; GTM/account executive M22; second implementation/customer-success hire and second product/integration engineer M31."
    unit: schedule
    source: "[business-plan.yaml.team and strategicChoices.sequencingRationale] Later hires are conditional on a paid pilot and production demand; the M31 step-up follows the BP three-customer deployment gate."
  - id: A9
    name: Variable nonpayroll COGS
    value: "15"
    unit: percent of revenue
    source: "Startup-finance SaaS heuristic for cloud, messaging, and variable external delivery costs; no company cost history exists."
  - id: A10
    name: Direct delivery payroll allocation
    value: "25% of implementation/customer-success payroll is allocated to COGS; the remaining salaries stay in operating expense."
    unit: allocation
    source: "Startup-finance accounting heuristic to test the BP 70% gross-margin goal; this could understate direct service labor if onboarding stays bespoke."
  - id: A11
    name: Sales and marketing nonpayroll budget
    value: "Y1 $96K; Y2 $180K; Y3 $240K."
    unit: USD by year
    source: "[business-plan.yaml.gtm.channels] Startup-finance budget heuristic for founder-led direct sales followed by one GTM hire; no CAC or channel-cost data is observed."
  - id: A12
    name: Research and development nonpayroll budget
    value: "Y1 $660K; Y2 $450K; Y3 $240K."
    unit: USD by year
    source: "[business-plan.yaml.product and operations] Startup-finance budget heuristic for one healthcare connector, security work, shadow replay, and later reuse; no vendor quotes or actual spend are available."
  - id: A13
    name: General and administrative nonpayroll budget
    value: "Y1 $300K; Y2 $240K; Y3 $180K."
    unit: USD by year
    source: "[business-plan.yaml.operations and team] Startup-finance budget heuristic for external privacy/security counsel, insurance, finance, and administration; no quotes are available."
  - id: A14
    name: Current pre-seed financing and use-of-funds allocation
    value: "$2.75M at M1; 18-month operating plan plus $600K six-month reserve; allocation $1.40M Engineering, $450K GTM, $300K G&A, and $600K buffer."
    unit: USD and months
    source: "[business-plan.yaml.fundingAsk] The $2.75M ask is within the BP $2-$3M range and uses its 18-month runway target; category splits are a planning heuristic."
  - id: A15
    name: Conditional follow-on financing
    value: "$1.50M seed round at M19, only after controlled-pilot and first-production-conversion proof."
    unit: USD
    source: "[business-plan.yaml.milestones and fundingAsk] Timing follows the BP proof gates; amount and close are explicit financing assumptions, not committed capital or part of the current ask."
  - id: A16
    name: Cash bridge simplifications
    value: "CashEOP = prior cash + EBITDA + financing inflow; no debt, capex, taxes, working-capital changes, or collection lag."
    unit: method
    source: "Startup-finance modeling heuristic for an early software company; same-month collections are optimistic and should be replaced with contract/payment terms when known."
  - id: A17
    name: Fully loaded CAC calculation
    value: "$71.5K = ($516K nonpayroll S&M + $180K allocated CEO payroll + $162.5K GTM payroll) / 12 gross customer wins; allocate 50% of CEO time and 100% of GTM payroll to acquisition."
    unit: USD per gross group win
    source: "[A5, A7, A8, A11] Founder-time allocation is a startup-finance heuristic; the small modeled cohort makes CAC highly uncertain."
  - id: A18
    name: Downside scenario
    value: "$45K annual revenue per group; 2.5% monthly churn; five gross wins at M9, M21, M29, M32, and M35; no M19 seed; retain the base expense and hiring plan."
    unit: scenario
    source: "[business-plan.yaml.operatingAssumptions and research.yaml.sensitivityCases] Stress case for low match density, weak willingness to pay, and failure to clear the next financing gate."
  - id: A19
    name: Upside scenario
    value: "$75K annual revenue per group; 1.0% monthly churn; 14 gross wins with two in Y2 (M17 and M23) and ten in Y3; the $1.50M M19 seed closes."
    unit: scenario
    source: "[business-plan.yaml.milestones] Upside stress case above the ten-group Y3 target; the price and win rate remain unvalidated."
  - id: A20
    name: Sensitivity test ranges
    value: "ARPU $45K/$60K/$75K; Y3 gross additions 5/8/11; monthly churn 2.5%/1.5%/0.75%; variable COGS 20%/15%/10%; seed fails/closes M19/closes M18; two hires start M28/M31/M34."
    unit: downside/base/upside
    source: "Explicit model stress ranges anchored to A3, A5, A6, A8-A10, and A15; they are scenario tests, not observed performance, and cashImpactK is the change in end-Y3 cash versus base."
  - id: A21
    name: Target gross margin
    value: "70"
    unit: percent
    source: "[business-plan.yaml.businessModel.targetGrossMarginPct] Company goal, not an achieved or independently validated margin."
  - id: A22
    name: Revenue per FTE comparison
    value: "$200K-$400K annual revenue per FTE"
    unit: USD per FTE-year
    source: "Startup SaaS heuristic shown in the supplied financial-model template example; directional only and not healthcare-specific."
  - id: A23
    name: Model period and artifact date
    value: "Model starts 2026-10 and is dated 2026-10-20."
    unit: date
    source: "[business-plan.yaml.date and research.yaml.date] The model period uses the shared upstream report date."
modelTraceability:
  period: "A23; modelStartMonth and date follow the shared BP and research date."
  revenue: "A1-A5; revenueK = customersEop x A3 / 12, with account additions and churn from A5-A6."
  costs: "A7-A13; cogsK = A9 x revenueK + directDeliveryPayrollK from A10; opexK = salariesK - directDeliveryPayrollK + salesMarketingK + researchDevelopmentK + generalAdministrativeK."
  cash: "A14-A16; cashEopK rolls forward from EBITDA and financingInflowK, including the contingent M19 seed."
  unitEconomics: "A3, A6, A9-A11, and A17; LTV uses modeled gross margin and churn, while CAC uses fully loaded acquisition spend."
