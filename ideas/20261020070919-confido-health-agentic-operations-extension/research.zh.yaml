championThesisTest:
  declaredDimension: creativeNovelty
  verdict: 证据喜忧参半
  evidenceFor:
    - point: >-
        集团统一治理的交换机制，会把预约类型、付款方、医生、地点、路程和时间限制同时用于关联诊所间的匹配；其适用范围比通用预约自动化更窄。已审阅的产品页面证实，厂商能自动用候补患者填补取消预约，但没有清楚说明这种完整的关联诊所间、可能跨
        EHR 的交换机制可以作为独立产品提供。
      sourceRefs:
        - 15
        - 16
        - 18
        - 21
        - 22
    - point: PE 和多站点平台为行政工具提供了可观察的分销场景；方案衡量的是实际补回的就诊，而非电话或邀约数量。这种面向私营集团的运营模式足够有商业差异，值得验证，但尚未证明独特。
      sourceRefs:
        - 1
        - 2
        - 8
  evidenceAgainst:
    - point: >-
        Phreesia、Epic Fast Pass、Luma、NexHealth 和 athenahealth 都已销售“自动把候补患者匹配到取消时段”这一核心机制。Phreesia 的 Summit
        案例报告称，EMG 取消预约中有 75% 得到填补；这说明已有直接替代品，也有客户案例支撑。
      sourceRefs:
        - 9
        - 11
        - 12
        - 15
        - 16
        - 19
    - point: 现有排班套件已支持规则设置、患者消息、医生或地点信息，以及将预约写回排班表。现有厂商可能通过配置或打包实现跨地点协同；因此，公开页面没有描述拟议的确切交换功能，并不能证明该功能不存在。
      sourceRefs:
        - 9
        - 10
        - 15
        - 17
        - 18
        - 19
    - point: 没有公开来源证明，扣除本来就会接受本地候补邀约的患者后，独立关联诊所之间还能新增填补多少预约。因此，这项指标和拟议的费用归因仍未经验证。
      sourceRefs:
        - 3
        - 11
        - 12
  revisedClaim: >-
    现有证据支持把它看作拥挤的取消预约补位品类中一种可能有用、由集团治理的扩展，而非新的候补名单机制。要让创新主张站得住脚，必须证明：基于规则的交换机制能安全地依托共享权限、适配异构排班，在 EHR
    与患者服务套件已有的原生流程之外，为关联站点带来新增且完成的就诊。公开证据尚未说明这一跨站点用例是否独特、难以打包，或是否值得单独采购。
reportMemo:
  executiveTakeaways:
    - 取消预约和就诊可及性确有现实问题，运营成本压力也有数据支持；但公开证据无法拆分出有多少临时取消的时段，恰恰是因为关联诊所无法共享候补名单而空着。
    - >-
      预约时段自动补位并不稀缺。Phreesia、Epic、Luma、NexHealth、Relatient 和 athenahealth
      都已销售自动候补名单或取消预约流程；拟议方案的差异，在于跨关联诊所按约束匹配，并把新增就诊归因到产品。
    - >-
      现有厂商不一定在每个目标集团都占优：同一医疗集团可能混用 EHRs、保留各站点自己的候补名单，或没有集中配置资格与同意规则。但若集团已部署并配置单一 EHR
      或患者服务供应商，原生自动化就是强默认选项，也会带来打包竞争。
    - 可以自下而上测算市场机会，但账户筛选条件和年度支出代理值都是假设，不是经测量的市场事实。US 医生集团总数只是宽泛的上限，不等于符合条件的客户数。
    - 最有价值的验证，是先在影子模式下回放历史数据，再做对照试点；要区分真正新增的跨站点完成就诊，与本来就会被本地候补名单或提醒流程填上的预约。
  marketDefinition: >-
    这项市场衡量的是年度软件与工作流价值：把新释放的门诊专科预约，匹配给同一关联医疗集团内其他站点已候补且主动选择参与的患者。核心单位是在限定时间窗口内补回的一次合格且已完成的就诊；测算时要扣除本地候补名单已能填补的预约，并考虑付款方和预约规则、患者是否接受路程，以及员工确认环节。通用排班软件、提醒活动、医生诊所收入和消费者预约平台订单均不在范围内。
  customerAndBuyer: >-
    日常使用者是集中管理患者服务或排班的负责人，以及释放预约时段的排班人员。经济买方则是 PE 支持的门诊专科集团 COO、运营 VP
    或投资组合运营负责人；目标集团至少有两个相近的同专科站点，集中管理排班，共享候补名单或权限，而且有足够的兼容需求。IT/安全、隐私法律顾问、EHR 管理员、专科运营和患者服务团队都能否决或拖延部署。AMA
    的调查显示，报告其所在机构由 PE 持有的医生占 6.5%；这个比例并不是合格集团账户数量。
  buyingTriggers:
    - point: 运营成本上升、人手紧张，让诊所更关注员工打电话联系患者、追回闲置接诊能力耗费的时间；MGMA 报告称，2025 年有 90% 的受访集团年内运营成本上升。
      sourceRefs:
        - 5
    - point: 收购医疗集团或启动集中运营项目，往往会带来统一各站点患者服务的窗口；但整合本身并不能证明集团有预约补位预算。
      sourceRefs:
        - 1
        - 2
        - 8
    - point: 高价值诊断或专科预约的等待时间可能很长，取消后空置也有明确成本；Summit Orthopedics 既描述了过去人工补位的缺口，也提供了厂商报告的挽回结果。
      sourceRefs:
        - 12
    - point: 预约取消和爽约促使诊所调整运营：MGMA 的 2025 年调查显示，27% 的受访者称爽约率较 2024 年上升；另一些诊所则把爽约率持平或下降归因于沟通改善和改约更方便。
      sourceRefs:
        - 3
        - 4
  willingnessToPay:
    summary: >-
      证据说明买方承受预算压力，也愿意投资患者服务工具；但没有证据给出这款跨站点产品的价格或合同金额。厂商发布的客户案例称，Summit Orthopedics 增收
      $200,000；这既非独立核实的数据，也不是软件支出。MGMA 将取消预约和改约速度视为改善就诊可及性与利润率的抓手；NexHealth
      提到大型客户采用询价方案，但没有公开价格。检索到的来源没有披露买方预算、合同金额或按完成就诊收费的标准。
    sourceRefs:
      - 5
      - 12
      - 17
  competitiveLandscape: >-
    直接竞品已经能自动跑通“取消预约转给候补患者”这条核心流程：Phreesia Appointment Accelerator、Epic Fast Pass、Luma Smart
    Waitlist、NexHealth Waitlist、Relatient Dash，以及 athenahealth 的患者互动产品。Phreesia 发布的案例是最接近的直接功能证据；Epic 可深度嵌入
    Cadence 和 MyChart；Luma 与 NexHealth 提供连接 EHR 的外联和预约写回。Zocdoc 则提供面向消费者的实时预约替代方案。人工电话、电子表格、本地 EHR
    候补名单、集中排班人员和定制集成也都是替代品。没有来源证实这些直接产品都能跨不同 EHR 实例，在关联诊所之间按拟议的付款方和路程规则匹配患者。
  incumbentThesis:
    - incumbentClass: EHR 原生排班与候补名单
      point: >-
        Epic 可通过 Fast Pass 向候补患者推送空闲预约；其 WakeMed 案例称，Fast Pass、自助排班和流程调整共同带来了更多就诊和更高的门诊收入。如果集团以一个配置完善的 EHR
        为准，原生工具通常会自然胜出。机会可能出现在混用 EHR 的集团，或各站点候补名单权限彼此不通的集团；必须逐一核实这些缺口，不能想当然。
      sourceRefs:
        - 9
        - 10
        - 21
        - 22
    - incumbentClass: 患者服务套件
      point: >-
        Phreesia、Luma、NexHealth、Relatient 和 athenahealth
        把排班、患者外联和取消预约自动化整合在一起，也可以打包进现有合同。公开材料没有证明它们提供独立的关联诊所间交换功能，也没有展示按完成就诊归因的计费方式；但套件厂商可以扩展规则或集成，且可能已经支持多地点流程。
      sourceRefs:
        - 11
        - 12
        - 15
        - 16
        - 18
        - 19
    - incumbentClass: 集中排班与各站点人工流程
      point: >-
        电话外联和电子表格保留了员工判断，也省去新增供应商的安全审查和集成工作；取消量少、人员调度灵活时，这些办法足以应付。客户案例和 MGMA
        调查显示，人员不足或联系不上患者，会让人工补位变慢、结果不稳定；但没有找到针对这类买方的独立工时研究。
      sourceRefs:
        - 3
        - 12
        - 14
    - incumbentClass: 消费者预约平台
      point: Zocdoc 向患者展示实时可预约时段，无需私有集团交换也能承接需求。它能替代信息发现和自助预约，但没有证据显示它能按集团内部的付款方及预约资格规则，优化现有候补名单中主动选择参与的患者。
      sourceRefs:
        - 20
  regulatoryLandscape: >-
    预约和候补名单记录可能包含受保护健康信息。如果供应商代表受 HIPAA
    约束的实体处理数据，就要审查双方关系、允许用途、安全措施和业务伙伴协议；跨站点使用还取决于哪些机构属于受约束实体或关联实体，以及谁获准代表集团行事。向患者发送 SMS
    邀约时，要落实沟通管理、同意与退订处理，并由法律顾问审查适用的 FCC/TCPA 医疗例外和州法律。候补邀约不能替代临床资格判断；不确定的个案应交由员工处理。法律要求是否适用，取决于具体实施方式和法律审查。
  technologyLandscape: >-
    HL7 FHIR 定义了预约、排班和时段的数据模型，但其 Appointment
    流程明确指出：时段显示可用，不代表一定允许预约；权限、评估结果、资源可用性和本地业务规则仍可能拒绝请求。可落地的产品需要可靠的取消事件、患者与预约类型匹配、付款方和医生规则、同意记录来源、邀约过期机制、防并发冲突的预约保留、EHR
    写回、审计日志，以及人工兜底。FHIR 资源能帮助规范数据结构，却不能免去客户专属的集成和配置工作。
  distributionChannels:
    - point: 投资组合运营负责人和 PE 平台高管可以牵头，在关联集团中启动集中赞助的试点；Confido 据称以投资方优先的方式拓展市场，这只是品类背景，并不证明本产品也能走同一渠道。
      sourceRefs:
        - 1
        - 2
        - 8
    - point: 直接面向集中管理患者服务的负责人、COO 或专科运营负责人销售，是启动单一都会区、单一专科试点最清晰的路径；同时争取各站点排班和 IT 负责人共同支持。
      sourceRefs:
        - 3
        - 12
    - point: EHR 实施公司和患者服务供应商可能提供集成或转介，但目前没有证据证明渠道关系或商业条款已经落实。
      sourceRefs:
        - 17
        - 18
  partnershipEcosystem:
    - point: 要实现读写权限、保障事件可靠性并测试集团专属排班约束，离不开 EHR/PM 厂商和互操作集成商。
      sourceRefs:
        - 17
        - 21
        - 22
    - point: PE 支持的诊所平台和管理服务机构可以推动多站点工作流标准化；行业整合带来分销机会，也会增加集成环境的异构性。
      sourceRefs:
        - 2
        - 8
    - point: 患者服务平台既可能是竞品，也可能成为集成伙伴；只有证明它们现有的本地候补名单模块尚未带来这部分新增价值，合作才有意义。
      sourceRefs:
        - 11
        - 15
        - 18
  dataMoats:
    - point: 潜在的数据优势，是按专科和时段积累经去标识化、获准使用的历史记录，涵盖邀约资格、接受情况、就诊完成、取消原因、路程和补位耗时。目前没有证据显示市场上已有这类专有的跨站点结果数据。
      sourceRefs:
        - 12
        - 21
        - 22
    - point: 集团专属的同意规则映射、预约分类、付款方限制和可靠的 EHR 连接器，可能沉淀为实施经验；但这些经验因客户而异，套件厂商也可能复制。
      sourceRefs:
        - 17
        - 21
        - 22
  geographicConsiderations:
    - point: 先从关联诊所彼此足够近、患者愿意前往其他地点的高密度都会区切入。路程、交通条件和患者选择会缩小可服务人群，也可能带来公平性问题。
      sourceRefs:
        - 3
        - 20
    - point: US 市场落地前，必须逐州审查隐私、通信、执业范围和付款方规则；跨州平台集团既可能提高合同价值，也会增加部署复杂度。
      sourceRefs:
        - 2
        - 25
  sensitivityCases:
    - case: 匹配密度低：愿意前往其他站点的患者很少，付款方和就诊类型限制又排除了大多数候选人。
      impact: 跨站点邀约在本地候补名单之外，可能只带来很少新增的已完成就诊量，难以支撑单独采购工具；应停止项目，或收窄到需求密集、弹性更大的专科。
      sourceRefs:
        - 3
        - 12
        - 20
    - case: 现有厂商能力：买方已经配置好 EHR 原生候补名单，或患者服务平台的候补名单。
      impact: 除非对照测试证明它能带来更多已完成就诊，或显著加快其他站点合格患者的预约补位，否则独立产品可能只是重复建设。
      sourceRefs:
        - 9
        - 11
        - 15
        - 19
    - case: 集成与权限：系统无法跨站点读取或写入预约事件、共享患者记录。
      impact: 部署只能退回人工导出和员工确认，既抬高客户导入成本，也压缩取消预约的补位窗口。
      sourceRefs:
        - 17
        - 21
        - 22
        - 23
    - case: 需求与支出代理值：合格账户数量或单站点年价值远低于假设。
      impact: 测算出的 US 市场规模可能大幅缩水；下列 TAM/SAM/SOM 是情景估算，不是经测量的品类收入。
      sourceRefs:
        - 7
        - 8
        - 24
  validationPlan:
    - priority: 高
      question: 目标集团是否有足够多真正空置的临时取消时段，以及能跨站点匹配的候补患者？
      evidenceToGather: >-
        向 8-10 个目标集团索取过去 12
        个月经去标识化的时段释放、本地候补名单、邀约、接受、就诊完成、付款方、医生和地点记录；先不联系患者，回放匹配流程，计算合格配对、响应窗口，以及本地流程下的反事实结果。
    - priority: 高
      question: 跨站点交换带来的是新增且已完成的就诊，还是把本来会在本地补位的患者挪到了其他站点？
      evidenceToGather: 开展前瞻性、站点配对试点，预先设定留出组或阶梯式切入点设计；衡量每个释放时段带来的新增完成就诊、补位耗时、取消后改约、改约后爽约、患者对路程的接受度、员工耗时，以及相对本地候补名单和现有厂商流程的归因结果。
    - priority: 高
      question: 集团能否在法律和技术上只共享发送邀约、写回预约所必需的数据？
      evidenceToGather: 在使用可识别数据前，与法律顾问及各集团的隐私/安全和排班负责人共同梳理 HIPAA 受约束实体、关联实体身份、业务伙伴角色、允许用途、患者告知/同意、SMS 退订、州级规则、EHR APIs 和审计要求。
    - priority: 高
      question: 如果买方的 EHR 或患者服务供应商已提供自动候补名单，买方还愿不愿为独立交换产品拨款？
      evidenceToGather: 对 15-20 位运营买方和 EHR 管理员进行结构化访谈；获取现有厂商的配置与定价，记录未解决的跨站点流程，并争取与已完成就诊挽回量挂钩的付费试点承诺，而非停留在口头兴趣。
    - priority: 中
      question: 哪些患者和预约规则能在不同地点之间实现安全、可接受的匹配？
      evidenceToGather: 审查患者同意记录和现有地点偏好；按路程时间区间、专科、付款方、医生、预约类型和邀约有效期测试患者接受度，并由员工复核资格不确定或需要便利安排的情况。
    - priority: 中
      question: 已完成就诊的归因是否足够可靠，能否支撑订阅或结果挂钩的商业模式？
      evidenceToGather: 将时段释放、邀约、预约、到诊、计费和就诊完成时间戳与源系统审计日志逐一核对；明确剔除只是改期、原本会在本地补位，或之后又被取消的预约。
analysisModels:
  marketMapDiagram:
    title: 取消预约挽回与跨站点专科匹配
    mermaid: |
      quadrantChart
        title Cancellation recovery versus cross-site specialization
        x-axis Low cross-site specialization --> High cross-site specialization
        y-axis Low access urgency --> High access urgency
        Proposed exchange: [0.85, 0.88]
        Phreesia Accelerator: [0.58, 0.91]
        Epic Fast Pass: [0.5, 0.82]
        Luma Smart Waitlist: [0.55, 0.83]
        NexHealth Waitlist: [0.42, 0.73]
        Manual calls: [0.15, 0.5]
  fiveForces:
    supplierPower:
      score: 4
      rationale: EHR 和诊所管理系统厂商掌握权威排班、患者信息、写入权限，以及客户专属 API 的开通；互操作标准并不保证生产环境里的实际权限。
      sourceRefs:
        - 17
        - 21
        - 22
    buyerPower:
      score: 4
      rationale: 大型集团可以要求证明新增就诊量、通过安全审查并争取集成条件，也可以拿现有套件或内部人力做比较。直接竞品没有公开定价。
      sourceRefs:
        - 11
        - 16
        - 17
    threatOfEntrants:
      score: 4
      rationale: EHR、患者互动和自动化厂商都能开发匹配规则；真正难的是跨站点集成、权限治理、可靠归因和患者信任。
      sourceRefs:
        - 9
        - 15
        - 18
        - 21
    threatOfSubstitutes:
      score: 5
      rationale: EHR 原生 Fast Pass、患者服务套件中的候补名单、在线预约平台、集中排班、各站点人工电话、超额预约和电子表格，都能解决这项工作的一部分。
      sourceRefs:
        - 9
        - 11
        - 15
        - 16
        - 19
        - 20
    competitiveRivalry:
      score: 5
      rationale: 多家规模化患者服务厂商都在推广取消预约或候补名单自动化；EHRs 厂商则能把排班功能打包进记录系统。
      sourceRefs:
        - 9
        - 11
        - 15
        - 16
        - 18
        - 19
  pestle:
    - factor: 政治
      impact: neutral
      point: US 信息封锁规则在适用情形下保障电子健康信息的访问，但不保证每个第三方产品都能读取或写入所有排班流程。
      sourceRefs:
        - 23
        - 24
    - factor: 经济
      impact: positive
      point: 诊所运营成本和人力压力上升，让挽回接诊能力、节省员工时间变得更重要；但产品能分得多少节省、具体预算从何而来，尚未获证实。
      sourceRefs:
        - 5
        - 12
    - factor: 社会
      impact: negative
      point: 患者可能无法或不愿前往其他地点；诊所管理者的报告提到了交通和诊所选址障碍，患者主动选择参与时必须把这些因素纳入。
      sourceRefs:
        - 3
        - 20
    - factor: 技术
      impact: positive
      point: FHIR 定义了预约和时段的数据表示，厂商连接器也展示了实时读写方式；但实际操作仍受本地授权和排班业务规则约束。
      sourceRefs:
        - 17
        - 21
        - 22
    - factor: 法律
      impact: negative
      point: HIPAA 下的角色与用途、业务伙伴条款、患者沟通许可，以及 TCPA/FCC 退订义务，都可能限制跨站点外联或要求法律审查。
      sourceRefs:
        - 23
        - 25
    - factor: 环境
      impact: neutral
      point: 向患者提供另一家诊所的预约会增加出行；没有检索到的来源量化了由此产生的环境影响，因此应测量路程和可达性，不能先入为主地认定影响无害。
      sourceRefs:
        - 3
  adoptionFrictionMatrix:
    - friction: 跨站点访问、患者同意与 PHI 授权
      severity: 高
      affectedBuyer: 隐私负责人、合规顾问、集团 COO 和患者服务负责人
      mitigation: 先在单一受控集团内启动，记录实体关系和允许用途，尽量减少数据字段，签好必要协议并完成告知，同时保留可审计的患者主动参与和退订记录。
      sourceRefs:
        - 23
        - 24
        - 25
    - friction: EHR 排班读写权限与取消事件访问
      severity: 高
      affectedBuyer: CIO、EHR 管理员、接口团队和排班人员
      mitigation: 先选一种 EHR 或连接器，在沙盒中测试读写权限范围和事件延迟，采用幂等更新、预约暂留与过期控制，并把不确定的预约交给员工处理。
      sourceRefs:
        - 17
        - 21
        - 22
    - friction: 跨站点兼容患者密度低
      severity: 高
      affectedBuyer: 集中排班与专科运营
      mitigation: 实地试点前，按专科、地点、付款方、医生和预约类型回放历史数据；集团无法确认高置信度匹配的时段，不纳入试点。
      sourceRefs:
        - 12
        - 15
        - 16
    - friction: 患者出行与响应行为
      severity: 中
      affectedBuyer: 患者、患者服务负责人和患者体验团队
      mitigation: 只向主动选择接受其他站点的患者发送邀约；展示路程和时间，由患者设定可接受的时间窗口，并提供限时选择，不要自动把预约转到别处。
      sourceRefs:
        - 3
        - 20
    - friction: 现有厂商打包或本地候补名单
      severity: 高
      affectedBuyer: COO、采购负责人和患者服务供应商负责人
      mitigation: 先评估当前 EHR 和套件配置；只有对照测试证明现有工作流之外还有新增完成就诊，或补位更快，才值得销售。
      sourceRefs:
        - 9
        - 11
        - 15
        - 19
    - friction: 已完成就诊归因与收入回收
      severity: 中
      affectedBuyer: 财务、收入周期和运营负责人
      mitigation: 预先定义反事实和归因窗口，核对邀约、预约、到诊和已完成就诊记录；不能把患者接受邀约直接算作挽回的就诊。
      sourceRefs:
        - 5
        - 12
market:
  tam:
    value: $758.4M
    rationale: >-
      这是自下而上的 US 情景测算，不是已观察到的品类收入：Definitive Healthcare 列出超过 395,000 家活跃医生集团。假设其中 8%（31,600
      家）适用多站点专科患者服务流程，每家集团有四个参与站点，并仅用 $6,000 作为单站点年价值测算代理值；31,600 x 4 x $6,000 = 每年 $758.4M。8%
      的筛选比例、站点数和代理值都未经核实，只是运营方假设，不代表定价决策。
    isEstimate: true
    sourceRefs:
      - 7
      - 8
  sam:
    value: $48.0M
    rationale: >-
      这是近期 US 滩头市场情景：假设有 2,000 家 PE 支持或集中运营的专科集团买方，符合多站点、共享权限和本地需求密度要求；每家有四个站点，按同一 $6,000 单站点年价值代理值测算，2,000 x
      4 x $6,000 = 每年 $48.0M。没有公开来源统计这批合格买方；AMA 的 PE 数据是医生占比，不是集团数量。
    isEstimate: true
    sourceRefs:
      - 6
      - 7
      - 8
  som:
    value: $2.4M
    rationale: >-
      这是五年可触达规模情景，不是预测：100 家集团客户、每家四个参与站点，乘以 $6,000 的单站点年价值代理值，得到 $2.4M
      年价值。客户数量还要通过具名买方访谈、正式集成和试点转化验证；这相当于假设中的 2,000 个 SAM 账户的 5%。
    isEstimate: true
    sourceRefs:
      - 2
      - 7
      - 8
bottomUpSizingDrivers:
  - driver: US 活跃医生集团：宽口径上限
    value: 截至 2025 年一月，超过 395,000 家集团；每家集团可能经营多个地点。
    source: "[7]"
  - driver: TAM 合格客户筛选比例
    value: 全部集团的 8%，即 31,600 家；这是运营方假设，仍待逐账户核实。
    source: est.
  - driver: 每家合格集团的参与站点数
    value: 每家集团四个站点；这是运营方用于测算的假设。
    source: est.
  - driver: 年度价值代理值
    value: 每个参与站点每年 $6,000；仅用于规模测算，不是定价建议。
    source: est.
  - driver: TAM 测算
    value: 31,600 家集团 x 4 个站点 x 每站点每年 $6,000 = 年度情景值 $758.4M。
    source: calc.
  - driver: SAM 目标客户群
    value: 2,000 家 PE 支持或集中运营、共享患者服务规则的专科集团；未经核实的假设。
    source: est.
  - driver: SOM 可触达规模
    value: 100 家集团客户 x 4 个站点 x 每站点每年 $6,000 = 年度情景值 $2.4M。
    source: calc.
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: MGMA 受访者称诊所运营成本持续上升，并把人力支出列为原因之一；此时推进生产力和就诊可及性项目正当其时。
      sourceRefs:
        - 5
    - point: 医生集团整合和多站点平台扩张，带来更多集中运营的潜在买方，也让系统集成更复杂。
      sourceRefs:
        - 2
        - 8
    - point: Epic 和独立患者服务平台都在销售候补名单自动化，说明取消预约挽回已是市场认可的产品品类。
      sourceRefs:
        - 9
        - 11
        - 15
  headwinds:
    - point: 这一品类竞争拥挤，直接竞品已经能把候补患者匹配到取消的预约。
      sourceRefs:
        - 11
        - 15
        - 16
        - 18
        - 19
    - point: 爽约趋势并不一致：73% 的 MGMA 受访者称，2025 年爽约率持平或下降，因此并非所有诊所都迫切需要解决这个问题。
      sourceRefs:
        - 3
    - point: 跨站点新增补位的经济价值、目标买方的付费意愿，以及相较原生候补名单的差异化结果，都仍未获证实。
      sourceRefs:
        - 9
        - 12
        - 16
competitors:
  - name: Phreesia Appointment Accelerator
    stage: 已规模化、拥有成熟专科客户的患者服务供应商
    wedge: AI 智能候补名单会向临床上适合的患者发送短信，为取消或被挪出的预约重新安排时间。
    pricing: 检索到的产品和案例页面没有公开价格；采用销售主导模式。
    strength: 这是直接功能替代品。Phreesia 称补位耗时不到五分钟；其 Summit Orthopedics 案例报告，一年内填补了 75% 的 EMG 取消预约，共 688 个预约，另增收 $200,000。
    weaknessVsUs: 公开材料没有证明该厂商提供此处设想的关联集团间、跨 EHR 交换和按完成就诊归因；但它仍可能支持相关多地点流程，或把扩展功能打包销售。
    sourceRefs:
      - 11
      - 12
      - 13
  - name: Epic Cadence 与 MyChart Fast Pass
    stage: 现有厂商 EHR 与患者门户平台
    wedge: 在 Epic 排班与门户生态内原生推送候补邀约，并支持患者自助排班。
    pricing: 在 Epic 部署中打包销售或按合同定价；未找到独立产品价格。
    strength: 它能直接读取权威排班和患者流程。Epic 的 WakeMed 材料把 Fast Pass、自助排班和排班改造，与每年多出 75,000 次就诊、门诊收入提高 21% 联系起来。
    weaknessVsUs: 集团统一使用一个 Epic 实例时，它最有优势；如果关联机构混用 EHR，或权限和候补名单彼此隔离，独立产品可能有价值，但目前还没有证实这种缺口。
    sourceRefs:
      - 9
      - 10
  - name: Luma Health Smart Waitlist（智能候补名单）
    stage: 已规模化的患者服务平台
    wedge: 连接 EHR 推送取消预约邀约并改约；公开列出的集成对象包括 Oracle Health 和 eClinicalWorks。
    pricing: 检索到的产品页面没有公开价格；采用销售主导模式。
    strength: 产品明确宣传：取消预约后会展示匹配时段，并在无需员工介入的情况下完成补位；其案例材料还描述了社区健康中心承受的电话工作量。
    weaknessVsUs: 公开页面没有证明它能按集团统一的付款方和路程规则进行关联诊所间交换；Luma 也可能扩展套件和 EHR 连接器，覆盖这项流程。
    sourceRefs:
      - 14
      - 15
  - name: NexHealth Waitlist
    stage: 患者互动与 EHR 集成供应商
    wedge: 邀约会考虑预约类型和首选医生，支持一键预约并实时更新日历。
    pricing: 方案可定制，大客户按询价定价；没有公开标价。
    strength: 公开材料介绍了排班同步和候补名单自动化，也收录客户对填补空档、挽回收入的评价。
    weaknessVsUs: 检索到的页面侧重单个诊所的候补名单流程，没有记录拟议的关联诊所间交换；页面未提及，不代表 NexHealth 无法支持。
    sourceRefs:
      - 16
      - 17
  - name: 内部集中排班与各站点 EHR 候补名单
    stage: 现状流程与服务型替代方案
    wedge: 排班人员通过电话、短信、电子表格、门户名单或现有 EHR 工具联系患者并改约。
    pricing: 沿用现有员工和 EHR 成本；无需新增软件报价。
    strength: 由员工掌握临床、付款方和患者偏好的细节，也不必新增集成、供应商或安全审查。
    weaknessVsUs: 人手不足时，人工外联可能很慢、结果也不稳定；但取消量少，或原生候补名单已能填满空档时，人工流程仍可能够用。
    sourceRefs:
      - 3
      - 4
      - 12
      - 14
regulatoryTechnicalConstraints:
  - point: 产品跨站点使用患者和排班数据前，必须明确 HIPAA 下的角色、允许用途、安全措施、受约束实体之间的关联关系和业务伙伴义务；不能因为共同所有权就假定数据可以不受限制地访问。
    sourceRefs:
      - 23
      - 25
  - point: 自动预约短信必须接受审查，确认符合适用的 FCC/TCPA 医疗通信条件、患者授权、发送频率限制和有效退订要求；各州规定可能不同。
    sourceRefs:
      - 25
  - point: HL7 FHIR Appointment 和 Slot 资源规范了部分流程，但时段空闲不代表一定能成功预约；权限、评估、资源规则和本地业务逻辑都可能拒绝请求。
    sourceRefs:
      - 21
      - 22
  - point: ONC 信息封锁政策针对妨碍 EHI 访问、交换或使用的行为；它不保证所有生产系统都开放排班写入权限，也不能取代客户授权。
    sourceRefs:
      - 23
      - 24
  - point: 归因挽回就诊前，必须核实付款方资格、就诊类型、医生专属规则、患者偏好、地点接诊能力和是否实际到诊完成；资格不确定或涉及临床判断时，须由员工复核。
    sourceRefs:
      - 12
      - 21
      - 22
validationSignals:
  - point: >-
      厂商发布的 Summit Orthopedics 结果称，使用 Appointment Accelerator 一年内填补了 688 个预约，EMG 取消预约中有 75%
      得到补位；这说明自动补位有实际需求，但不能证明跨站点交换的经济价值，也不是独立的产品效果验证。
    sourceRefs:
      - 12
  - point: >-
      Epic 的 WakeMed 案例称，Fast Pass、MyChart 自助排班、数据分析和流程调整组合上线后，每年就诊量增加 75,000 次，门诊收入提高 21%；案例没有单独拆出 Fast Pass
      的贡献。
    sourceRefs:
      - 10
  - point: MGMA 的 2025 年爽约调查发现，27% 的受访者报告爽约率同比上升，并指出就诊可及性、交通和沟通等因素；调查没有量化临时取消后仍空置的预约时段。
    sourceRefs:
      - 3
  - point: Confido 称其采用 PE 优先的分销模式，并报告了广泛的多站点覆盖；但这些公司层面的说法，不能证明这款具体候补名单产品有效，也不能证明买方会为它拨预算。
    sourceRefs:
      - 1
      - 2
openQuestions:
  - 每个目标集团的本地 EHR 和供应商候补名单流程结束后，临时取消的时段还有多少比例空着？
  - 历史记录能否证明患者已同意，也能否证明集团有权向患者提供其他关联站点的预约？
  - 考虑路程时间、付款方、医生、预约类型和时段后，有多少患者愿意改去附近另一家诊所？
  - 哪些 EHRs 和排班接口能在生产环境中可靠推送事件，并允许第三方安全写回？
  - 这种交换增加了已完成的就诊，还是主要把患者从一个站点或现有候补名单挪到另一个站点？
  - 如果买方可能已经部署 Phreesia、Epic、Luma、NexHealth、Relatient 或 athenahealth，还愿不愿为独立产品付费？
  - 产品该如何避免让受交通、残障、保险网络或数字服务可及性限制的患者处于不利地位？
  - 有多少家 PE 支持的专科集团真正具备集中患者服务、附近同专科诊所和共享权限？
