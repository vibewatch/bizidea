  saturationRationale: >-
    成功抓取 33 个页面后，八个决策问题，以及痛点、现有厂商、集成和患者同意等高风险问题，均已找到多条有用证据。最后六次抓取至多新增一条与就诊可及性相关、足以影响决策的取消预约挽回线索；其余结果主要验证了已梳理的替代方案、所有权背景和沟通控制。
  coverageGap: >-
    没有独立来源量化关联诊所之间因取消预约造成的流失，也没有来源量化这款具体产品的付费意愿。8% 的合格账户筛选比例、每个账户四个站点、$6,000 年站点价值代理值、2,000 个滩头市场账户估算和 100 个
    SOM 账户，都是运营方假设。针对跨站点取消预约交换的公开采购信息、招聘信息和患者评价证据有限；检索到的一张 NexHealth 上市页面因与其当前候补名单页面近乎重复而被剔除。
