slug: portfolio-slot-exchange
date: "2026-10-20"
executiveSummary: >-
  这份种子轮前计划要验证一种基于规则、仅供集团内部使用的撮合平台：把临近就诊时间取消的门诊号源，匹配给同一医疗集团附近诊所中已主动加入候补名单的患者。目标客户是有 PE 支持、实行集中预约管理的专科集团，至少有两个同专科站点，并有记录证明各站点的本地候补名单之间存在缺口。研究显示，医疗机构面临人员和运营成本压力，但没有量化跨站点取消号源流失，也未验证客户的付费意愿。取消预约补位市场已经拥挤：Phreesia、Epic、Luma、NexHealth、Relatient 和 athenahealth 都在推广自动候补工作流；Phreesia 发布的 Summit 案例称，EMG 取消预约中有 75% 得到补位。因此，产品必须证明它能在集团现有本地工作流之外，额外带来已完成就诊，而不只是多发邀约。先从一个集团、一个都会区、一个专科和一套排班系统切入；在权限、数据访问和匹配密度得到验证前，暂不扩展到其他 EHR。按参与站点收费，只对可归因于产品且最终完成就诊的跨站点预约收费；拟议试点价格只是待测试价格，不代表付费意愿已获验证。投资判断维持观望，直到历史数据回放、隐私与技术访问核验、付费对照试点验证这一切入点。
problem:
  - >-
    多站点门诊集团的中央预约团队负责排班和患者联络，面临人手和运营成本压力；现有证据只说明这一背景，并未量化这项具体工作流的人力负担。
  - >-
    临近预约的号源一旦取消，本地候补名单可能来不及在号源失效前找到合适患者；同一集团的另一站点却可能有已主动加入候补名单、且符合条件的患者。目前，跨站点流失和未实现的就诊价值都没有量化。
  - >-
    EHR 原生候补名单、患者接入套件、排班系统和人工电话都在处理取消预约后的补位。只有证明现有配置确实留下跨站点缺口，另行采购才有理由。
solution:
  - >-
    在一个关联集团内，接入经授权开放的号源和患者主动加入的候补名单；按集团设定的预约类型、支付方、医疗服务提供者、地点、出行、时间和同意规则筛选，再为可行的跨站点邀约排序。
  - >-
    向患者发送限时邀约，并安全回写排班系统；处理过期和冲突，保留审计日志，并在不确定时交由员工处理。系统不得判断临床适宜性，也不能把邀约算作成功补位。
  - >-
    先用预先设定的本地候补名单对照组，比较已完成就诊数、补位耗时、患者接受率、员工投入分钟数和再次取消率；结果未出前不收结果费，也不扩张。
whyWeWin:
  - >-
    拟议差异化在于由集团统一管理跨站点候补队列并进行匹配，而不是仅仅联系候补患者——后者已是商品化能力；公开证据不能证明直接竞争厂商不具备跨站点匹配能力。
  - >-
    将增量跨站点已完成就诊作为成效和计费单位，避免产品只优化消息发送量、已接受邀约数，或本来就会由本地工作流补上的预约。
  - >-
    患者主动同意、可见的地点选择、明确的运营规则，以及对不确定个案进行人工复核，让撮合过程可审计；产品不替代 EHR，也不判定临床适宜性。
strategicChoices:
  beachhead: >-
    美国一个都会区、PE 支持的集团内一个门诊专科；集团需有两个到四个彼此相近的站点、集中预约团队、可用的主动加入式候补名单，以及经核实的本地队列缺口。根据历史匹配密度选择专科，不预设全市场取消率。
  wedgeRationale: >-
    单一集团把权限和同意边界控制在明确范围内，排班规则可比，也有足够的本地密度回放匹配并开展对照试点。相比开放式市场，这能缩小客户导入范围，同时检验原生本地候补名单可能无法覆盖的具体跨站点缺口。
  sequencingRationale: >-
    先核实反事实匹配密度、现有厂商配置、数据授权和回写权限；再开发一个连接器和影子匹配器，启动员工监督下的邀约。只有测出增量已完成就诊后，才销售正式版。拿下付费试点后再增加实施和客户成功人手；证明权限可复制、单位经济模型跑通后，再扩展到更多 EHRs 和专科，并借助集团投资组合渠道分发。
  notYet:
    - "面向消费者或开放式的多服务提供者预约市场。"
    - "覆盖多专科的综合运营套件、通用排班自动化，或常规替换院内候补名单。"
    - "在首个对照试点前接入多个 EHR、为不确定个案自主预约，或判断临床适宜性。"
market:
  tam: >-
    年度情景测算 $758.4M，并非已观察到的品类收入：假设美国有 31,600 个符合条件的集团 × 每集团四个站点 × 每个站点每年 $6,000 的价值代理。资格筛选、站点数量和测算口径均未经核实。
  sam: >-
    年度情景测算 $48.0M：假设有 2,000 个由 PE 支持或采用类似集中管理的专科集团 × 每集团四个站点 × 同一每站点每年 $6,000 的价值代理。没有公开来源统计这一符合条件的客户群。
  som: >-
    五年可触达情景测算 $2.4M，并非预测：100 个集团 × 每集团四个站点 × 每站点每年 $6,000 的价值代理，相当于假设 SAM 的 5%。在将其作为计划前，先核实目标客户名单是否存在、合同金额是否可实现。
  segments:
    - "主要客户：同一都会区内由 PE 支持的门诊专科集团，拥有相近的同专科站点、集中预约管理，且有记录证明存在跨站点候补缺口。"
    - "次要客户：MSOs 和 PE 投资组合运营团队；首个集团验证成效后，可由 MSO 或投资组合运营团队牵头，在多个集团部署。"
  buyingProcess: >-
    集团标准化、人员配置或患者接入计划暴露出预约容量流失后，由 COO、运营副总裁或投资组合运营负责人发起付费试点。患者接入和专科负责人制定工作流规则。使用可识别数据或发送真实邀约前，IT/EHR 管理员、隐私与安全团队、合规法律顾问及患者沟通负责人必须批准数据访问和联络方式。
product:
  mvp: >-
    为一个集团的两个到四个站点、一个排班系统搭建安全且可审计的工作流：接入经授权的取消事件和候补名单，按规则为候选患者排序，纳入主动同意与出行限制，由员工监督发送限时邀约，处理过期与冲突，并回写排班系统。先在影子模式运行；只有集团隐私、患者同意、安全及 EHR 负责人批准工作流后，才启用真实邀约。
  sixMonth: >-
    为付费共创客户完成一个可支持正式上线的连接器和影子回放；只有历史数据表明合格匹配足够多，且集团确认有权共享所需数据并发送邀约，才开展有限实测。
  twelveMonth: >-
    开展覆盖 2–4 个站点的对照试点，设置本地工作流对照组，并将邀约与已完成就诊核对；只有试点增加了已完成就诊的补位量，且买方签署正式合同，才转为正式部署。不要只为扩展功能清单而增加另一个 EHR。
  twentyFourMonth: >-
    首批客户达到成效和客户导入门槛后，支持同一都会区内多个集团；只有客户有付费需求时才接入第二个排班连接器，并提供集团层面的增量补位、补位耗时、出行接受率和就诊完成情况报告。
  keyBets:
    - "本地工作流处理后仍有足够多的取消号源未填补，跨站点候选患者能带来额外的已完成就诊。"
    - "集团能够授权并实际落实跨站点共享患者偏好、同意记录和排班访问。"
    - "如果邀约明确告知地点和时间，且由患者主动选择加入，患者会接受附近的备选站点。"
    - "即使 EHR 原生功能和患者接入套件是强力替代品，买方仍愿意为增量成效单独付费。"
    - "连接器和实施工作能够变得足够标准化，支撑毛利率高于 70% 的目标。"
gtm:
  wedge: >-
    投资组合运营团队或 COO 发起的计划暴露出持续的人工补位问题，且买方确认原生候补名单无法跨站点补位后，再向一家实行集中预约管理的专科集团销售为期 90 天的付费共创试点。先回放历史数据、检查现有厂商配置，再只对事先约定的一部分号源启用邀约。
  channels:
    - "直接联系医生集团的 COO、运营副总裁（VPs）和患者接入负责人，并通过转介绍触达他们。"
    - "把投资组合运营团队和 PE 平台引荐作为寻找客户的渠道；研究中提及的 Confido 渠道仅作行业背景，尚未证明本公司能通过该渠道触达客户。"
    - "只有验证集成后，才通过 EHR/PM 实施公司获取技术接入或转介绍；不预设任何合作关系。"
  funnelTargets: >-
    初期运营目标，并非实际转化数据：20 个合格集团引荐 → 8 次工作流和数据就绪度评估 → 2 个付费试点；成功的付费试点中至少 50% 转为正式部署。完成首批 20 次合格客户沟通后重新设定目标。
  pricing: >-
    测试价为 90 天固定试点费 $10,000–$20,000，最多覆盖四个站点；之后收取按站点计费的经常性费用，并且只对事先约定、最终促成已完成就诊的增量跨站点预约收费。目前没有证据验证买方可接受的价格或结果费；不对常规院内排班、未完成就诊的邀约，或本地工作流原本就能补上的就诊收费。
businessModel:
  revenueStreams:
    - "每个参与诊所按年订阅，使用规则配置、工作流、审计和成效报告。"
    - "只有可归因的跨站点预约最终促成就诊，且双方约定的反事实对照完成核算后，才收取浮动费用。"
    - "初期部署收取固定的付费试点和实施费用；规模化前先标准化或减少服务投入。"
  unitOfValue: >-
    排除本地候补名单补位、改期、后续取消和未完成就诊后，从另一关联站点增量追回的一次已完成就诊。
  targetGrossMarginPct: 70
  expansionLevers:
    - "首批站点证明能带来增量已完成就诊且运营安全后，再增加集团内符合条件的站点。"
    - "只有客户签署明确需求、实施可重复后，才增加第二个排班连接器或专科。"
    - "取得经授权且可靠的成效数据后，再提供汇总的容量利用率报告。"
strategyMap:
  northStarMetric: "相较集团现有工作流，每个符合条件的取消号源带来的增量跨站点已完成就诊数。"
  inputMetrics:
    - "开放号源中，另一站点至少有一名已同意加入、且支付方和预约类型均匹配的患者所占比例。"
    - "按出行时间、预约类型和时段划分的邀约接受率。"
    - "从权威取消事件发生到患者接受邀约的中位耗时。"
    - "已接受的跨站点邀约对应的就诊完成率和再次取消率。"
    - "每次成功补位消耗的员工分钟数，以及每个集团正式部署的导入时间。"
  moatsToBuild:
    - "经授权且去标识化的历史数据，关联合格邀约、患者选择、已完成就诊、出行情况和补位耗时。"
    - "可复用的集团专属同意、支付方、预约类型分类、冲突处理和连接器实施手册。"
    - "一套对照方法，能区分跨站点补位、本地补位和改期。"
  killCriteria:
    - "在五个合格集团的历史回放中，原本未填补的临近号源里，不到 5% 能在过期前找到已同意且符合条件的跨站点患者。"
    - "对照试点相较本地工作流对照组，已完成就诊填补率提升不到 5 个百分点，或再次取消率实质性上升。"
    - "20 个合格买方中，按拟议的 $10,000–$20,000 试点测试价承诺付费试点的少于两个。"
    - "在六个月内，没有集团能为至少两个站点证明其具有合法的数据访问权限、患者沟通许可和安全的排班系统回写能力。"
    - "完成三次部署后，客户导入仍超过 12 周，或服务负担使毛利率达到 70% 的可信路径无法成立。"
  mermaid: |
    flowchart LR
      Buyer["Multi-site specialty group with local-queue gap"] --> Wedge["One metro, one specialty, two to four sites"]
      Wedge --> MVP["Permissioned rules-based vacancy exchange"]
      MVP --> Proof["Incremental completed visits versus local holdout"]
      Proof --> Expansion["Add groups, sites, and connectors after repeatability"]
investorMemo:
  verdict:
    call: "观望"
    conviction: "信心偏低；运营痛点和买方背景可信，但跨站点增量效果、差异化和付费意愿均尚未得到验证。"
    whyBelieve: "多站点集团面临有据可查的运营成本压力；本地队列和权限仍彼此割裂时，现有自动化留下了可检验的缺口。"
    whyDoubt: "规模化厂商已经能填补取消号源，但没有独立证据量化剩余的跨站点需求、买方预算或可防守的功能差异。"
    nextDiligence: "审查去标识化的历史数据回放和付费对照试点，验证相较集团已配置的本地候补名单，能否增加已完成就诊。"
  firstCustomer:
    title: "由 PE 支持、各站点候补名单彼此隔离的都会区骨科集团"
    profile: "一家实行集中预约管理的医生集团，在彼此相近的两个到四个骨科站点设有诊所，使用患者主动加入的候补名单，且当前 EHR 或患者接入配置存在已记录的能力限制。"
    trigger: "人员压力或收购新站点后，投资组合运营负责人或集团运营负责人开始统一患者接入管理，并能量化本地工作流未能填补的临近取消号源。"
    buyer: "COO、运营副总裁或投资组合运营负责人"
    initialContract: >-
      拟议验证价格，并非已观察到的付费意愿：90 天、覆盖两个到四个站点的付费试点收取 $10,000–$20,000；转正式部署后，按站点收取年度订阅费，并且只对双方约定的增量跨站点预约在就诊完成后收费。
  mustBeTrue:
    - "对 8–10 个合格集团进行历史回放后发现，本地工作流仍未填补的临近号源中，至少 10% 能匹配到另一站点上已同意且符合条件的患者。"
    - "对照试点相较预先设定的本地工作流对照组，已完成就诊填补率至少提高 10 个百分点，且再次取消率没有实质性上升。"
    - "20 个合格买方中至少两个按拟议的 $10,000–$20,000 测试价签署 90 天付费试点；达到成效门槛后，至少一个转为正式部署。"
    - "试点集团及其 EHR/安全负责人批准两个或更多站点的数据合法访问、患者沟通和排班系统回写路径，且无需依赖会错过号源时间窗的人工流程。"
    - "首批五个合格目标集团中，至少三个没有已配置的现有工作流来弥补跨站点缺口；买方也确认愿意单独付费，而不是等待现有厂商推出功能。"
  diligenceQuestions:
    - "每个目标集团过去 12 个月的临近取消预约中，有多少比例在原生候补名单处理后仍未填补？其中有多少能找到合适的跨站点患者？"
    - "集团能否明确患者主动同意、受涵盖实体和业务伙伴各自的角色、允许用途，以及跨站点邀约的 SMS 退订控制？"
    - "集团已经部署哪些 EHR 或患者接入工具？买方能否证明现有配置无法满足这一用例？"
    - "排班系统连接器能否可靠地检测取消事件并回写或预留预约，且不会发生并发冲突、重复或无效预约？"
    - "如何设计受控试验，才能把增量已完成就诊归因于撮合平台，而不是本地补位、改期或后来取消的预约？"
    - "经济决策者是否愿意按拟议测试价签署付费试点？追回就诊所带来的经济价值支持怎样的正式产品价格？"
operatingAssumptions:
  - assumption: "应用本地候补名单和运营资格规则后，跨站点候选患者池仍有足够密度。"
    basis: "research.yaml"
    validationTest: "从 8–10 个目标集团获取 12 个月的去标识化取消、候补名单、支付方、预约类型、地点和就诊完成记录，进行历史回放；统计号源过期前的合格匹配，并与本地结果比较。"
    decisionImpact: "如果五个集团中仍未填补的临近取消号源里，不到 5% 能匹配到可行且已主动加入候补名单的患者，就停止撮合平台，或缩窄到患者密度更高的专科。"
  - assumption: "单一关联集团能够授权跨站点共享所需的患者数据、联络和排班系统回写。"
    basis: "research.yaml"
    validationTest: "在使用真实数据前，请一家集团的法律顾问、隐私与安全负责人、患者接入负责人和 EHR 管理员书面说明各实体角色、允许用途、告知与同意、SMS 退订、BAA 需求、API 权限范围及回写审批。"
    decisionImpact: "如果没有数据授权或回写权限，就不启用真实邀约；后续工作仅限去标识化回放，否则终止目标工作流。"
  - assumption: "尽管 EHR 和患者接入自动化已捆绑提供，买方仍会为独立的跨站点产品付费。"
    basis: "research.yaml"
    validationTest: "访谈 15–20 位符合条件的运营买方和 EHR 负责人，记录现有厂商配置和价格，并按拟议测试价取得至少两个付费试点承诺。"
    decisionImpact: "如果买方更愿等待现有厂商的产品规划，或量化回放后仍找不到预算，就寻求合作伙伴，或停止独立 GTM。"
  - assumption: "患者会经常接受附近的备选地点，带来增量已完成就诊，且不会造成就医机会不公平。"
    basis: "运营判断"
    validationTest: "在员工监督的试点中，测量主动同意、邀约接受、出行时间区间、就诊完成、再次取消和患者投诉；保留患者自行选择地点的限制和本地选项。"
    decisionImpact: "如果接受率低，或受影响患者集中反映出行和就医障碍，就缩小服务范围，或停止向这些群体发送跨站点邀约。"
  - assumption: "客户导入能变得足够标准化，支撑毛利率高于 70% 的软件主导模式。"
    basis: "运营判断"
    validationTest: "跟踪首批三个集团的实施工时、耗时、连接器缺陷、支持分钟数和可变基础设施成本；要求每次部署有望在 12 周内完成。"
    decisionImpact: "如果每个集团都要定制集成或长期依赖人工排班，就按服务定价、找实施伙伴，或停止扩张。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "对 8–10 个合格集团开展去标识化历史影子回放，并将本地候补名单结果保留为反事实对照。"
    hypothesis: "部分集团在本地工具处理后，仍有临近号源未填补，且另一站点存在符合条件、已主动加入的患者。"
    successMetric: "至少三个集团中，仍未填补的临近号源至少有 10% 能匹配到一名可行的跨站点患者；潜在就诊完成量与实际预约数分开报告。"
    owner: "CEO/创始人和数据工程师"
  - horizon: "0–90 天"
    experiment: "访谈 15–20 位 COO、患者接入负责人、EHR 负责人和投资组合运营人员；梳理现有厂商配置并测试付费试点方案。"
    hypothesis: "部分集中管理的集团存在经核实的跨站点缺口和明确的预算负责人；集团启动标准化工作或出现人员配置压力后，买方会感到紧迫。"
    successMetric: "记录五个符合条件的工作流缺口，并按拟议的 $10,000–$20,000 测试价取得两个付费试点承诺。"
    owner: "CEO/商务创始人"
  - horizon: "0–90 天"
    experiment: "在使用可识别数据前，完成一家集团的隐私、同意、安全和集成就绪度审查。"
    hypothesis: "在一个边界明确的法人实体内，有一家集团能授权最少必要的跨站点数据使用，并提供安全的排班读写路径。"
    successMetric: "形成书面审批路径，确认所需协议和告知文件，并测试覆盖两个站点的沙盒或接口权限范围。"
    owner: "CEO/创始人、隐私法律顾问和集团 IT"
  - horizon: "3–6 个月"
    experiment: "为选定的排班系统开发影子匹配器和一个连接器；完成核对前，所有邀约保持关闭。"
    hypothesis: "权威取消事件和资格规则能及时处理，从而发出安全、可审计的邀约。"
    successMetric: "抽样取消事件中至少 99% 能与源记录核对一致；影子测试中不得出现重复邀约或违反规则的邀约。"
    owner: "创始工程师/集成负责人"
  - horizon: "6–9 个月"
    experiment: "开展覆盖 2–4 个站点、由员工监督的试点，采用预先设定的站点匹配对照或阶梯楔形比较设计，检验这一切入点。"
    hypothesis: "跨站点邀约能在现有候补名单之外增加已完成就诊，且不会增加再次取消或损害患者利益。"
    successMetric: "相较对照组，已完成就诊填补率至少提高 10 个百分点；每条邀约均可追溯至主动同意和已批准规则。"
    owner: "产品/运营负责人和集团患者接入负责人"
  - horizon: "9–12 个月"
    experiment: "与集团运营和财务团队核对预约、到诊、就诊完成情况及本地反事实对照，并测试正式产品价格。"
    hypothesis: "如果试点达到预先约定的提升门槛，买方会接受基于就诊完成情况的归因方式并转为正式客户。"
    successMetric: "首批两个付费试点中至少一个转为正式客户，并签署对可计费已完成就诊的定义。"
    owner: "CEO/商务创始人"
  - horizon: "12–18 个月"
    experiment: "在第二个集团复制已验证的工作流；只有客户出资或明确承诺需求时，才评估第二个连接器。"
    hypothesis: "同意规则映射、集成和成效测量能够复用，客户专属服务不会占据交付的大部分工作。"
    successMetric: "第二个集团在 12 周内完成导入，沿用相同成效定义，并保持毛利率达到 70% 的可行路径。"
    owner: "集成负责人和客户成功负责人"
operations:
  - "真实联络患者前，必须书面确认集团授权和最少必要数据清单；适用时完成业务伙伴关系审查，并落实患者主动同意与退订。"
  - "使用唯一权威排班数据源、幂等事件处理、号源过期与冲突检查、审计日志；遇到不确定匹配时升级给员工。"
  - "计算成效或浮动费用前，与买方核对邀约、预约、到诊、就诊完成及后续取消记录。"
  - "核查患者地点偏好、出行时间、无障碍需求、支付方、医疗服务提供者和预约类型限制；只有获得许可且患者选择时，才推荐其他地点。"
  - "有选择地聘请隐私法律顾问和 EHR/PM 集成伙伴；在形成书面记录前，不预设获客渠道、连接器权限或厂商合作。"
team:
  - role: "CEO/商务创始人"
    startTiming: "第 0 个月"
    rationale: "负责买方调研、付费共创客户销售、集团工作流梳理，以及最初的集团运营渠道测试。"
  - role: "创始工程师/集成负责人"
    startTiming: "第 0 个月"
    rationale: "开发安全的取消事件接入、规则匹配、事件核对、安全回写和首个排班连接器。"
  - role: "医疗实施与客户成功负责人"
    startTiming: "第 6–9 个月，在取得付费试点和获批数据路径后"
    rationale: "负责同意和配置、排班人员培训、对照试点运营及已完成就诊核对；只有证实有客户需求后才招聘。"
  - role: "隐私与安全法律顾问"
    startTiming: "第 0 个月起提供外部支持"
    rationale: "在使用可识别数据的工作流上线前，审查实体角色、允许用途、业务伙伴条款、患者沟通、退订和安全要求。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "完成 15–20 次买方访谈，并记录每个合格客户的现有厂商配置和采购触发因素。"
      - "取得两个付费试点承诺，并拿到一家集团书面的隐私、同意、安全和 EHR 访问计划。"
      - "完成去标识化历史回放；只有匹配密度达到预先设定的门槛，才开展真实试点。"
      - "开展覆盖 2–4 个站点的对照试点，报告增量已完成就诊补位、补位耗时、再次取消、出行接受率和员工耗时。"
      - "至少将一个成功的付费试点转为正式合同；否则先重新评估产品或定价，不增加人手。"
  - horizon: "12–24 个月"
    items:
      - "只有首个试点证实增量成效且权限可复制，才部署到三个付费集团。"
      - "将部署中位耗时控制在 12 周内，并在首批三个客户中验证毛利率达到 70% 的路径。"
      - "只有客户签署明确需求且排班系统读写权限得到验证，才增加第二个连接器。"
      - "已完成的付费试点中，至少 50% 转为正式部署；否则暂停扩张招聘。"
  - horizon: "24–36 个月"
    items:
      - "在留存和交付经济性达标的前提下，目标覆盖十个正式客户集团，最多涉及两个专科和两个排班连接器。"
      - "只有客户协议允许汇总时，才建立经授权、去标识化的成效报告。"
      - "只有两个集团的部署都能在不依赖定制工作流服务的情况下重复交付，才通过 MSO 或投资组合运营团队推动扩张。"
risks:
  - risk: "跨站点匹配密度低或患者意愿不足，导致本地候补名单之外可补回的预约太少。"
    likelihood: "High"
    impact: "High"
    mitigation: "开发真实工作流前先做影子回放；聚焦患者密度高的专科和都会区，若未达预设匹配门槛就停止。"
  - risk: "EHR 原生功能或患者接入领域的现有厂商已经覆盖这一缺口，或捆绑了跨站点匹配。"
    likelihood: "High"
    impact: "High"
    mitigation: "逐一评估目标客户配置的 Epic、Phreesia、Luma、NexHealth、Relatient 或 athenahealth 工作流；只有对照试点证明带来增量成效才销售。"
  - risk: "集团授权、隐私、同意或 SMS 要求阻碍跨站点数据使用或患者联络。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "先在一家边界明确的集团内启动；使用可识别数据前取得法律顾问及隐私与安全审批，保留退订机制，并将不确定个案交由员工处理。"
  - risk: "排班接口无法及时提供取消事件或安全回写，造成冲突并错过邀约时限。"
    likelihood: "High"
    impact: "High"
    mitigation: "只选一种受支持的系统，测试生产权限范围和事件延迟，使用幂等更新及过期控制，并保留可审计的员工兜底流程。"
  - risk: "出行偏好和就医障碍降低接受率，或把负担转嫁给交通选择较少的患者。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "要求患者主动选择接受其他站点，明确展示地点和出行信息，尊重患者自行设定的限制，按出行群体监测接受率和投诉，并保留本地排班选项。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–3M"
  runwayMonths: 18
  useOfFundsSummary: >-
    目标资金支持 18 个月运营：开发一个安全的排班连接器及从影子模式到真实运行的撮合平台，完成隐私和安全工作，开展覆盖两个到四个站点的对照试点，验证增量已完成就诊的经济价值，转化首个正式客户，并验证可重复的客户导入路径。招聘须以付费试点为前提；这些门槛通过前，不投入多 EHR 或多专科扩张。
