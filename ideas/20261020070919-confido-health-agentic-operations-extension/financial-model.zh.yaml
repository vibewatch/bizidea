modelDiagram:
  title: 单位经济模型流程
  mermaid: |
    flowchart LR
      EligibleSlots["Residual eligible slots"] --> Matches["Cross-site matches"]
      Matches --> Offers["Opted-in, staff-supervised offers"]
      Offers --> CompletedVisits["Incremental completed visits"]
      Sites["Participating sites"] --> Revenue["Subscription plus completion fees"]
      CompletedVisits --> Revenue
      Revenue --> GrossProfit["Revenue less COGS"]
      GrossProfit --> Cash["Cash after operating burn"]
      Cash --> NextRound["Proof for next financing"]
modelSanity:
  - checkName: 收入引擎
    finding: 按每客户组年化收入 $60K 计算，基准情景中的活跃付费客户组数从零增长；到 M36 时达到 10.1 个，Y3 收入为 $504.2K。
  - checkName: 必须跑通的环节
    finding: 两笔 Y1 付费试点必须继续计费或转化；Y2 必须新增两个客户组；Y3 必须赢得八个毛新增客户组；可重复的交付模式还需守住模型中的 Y3 毛利率 76.1%。
  - checkName: 模型失效条件
    finding: 转化放缓后，若有条件的 M19 $1.50M 种子轮融资未能交割，尽管已有 $2.75M 种子前轮融资，下行情景现金最低点仍会降至 -$1.41M。
  - checkName: 下一轮融资验证条件
    finding: 下一轮融资取决于 2-4 个站点的受控试点能否证明已完成就诊填充率的增量至少达到 10 个百分点、促成首个客户转入生产阶段，并留足六个月现金缓冲。
sanityChecks:
  ruleOf40: Y3 收入增长 233% + EBITDA 利润率 -211% = 23%，仅作方向性参考；增长率起点较低。
  burnMultiple: $1.06M Y3 EBITDA 现金消耗 / $395K 净新增 ARR = 2.7x；未计融资流入。
  revenuePerFte: Y3 每 6.0 名平均 FTE 确认收入为 $84K；所提供模板中的 SaaS 经验值为 $200K-$400K。
  flags:
    - 基准现金路径依赖一笔尚未承诺、金额为 $1.50M、计划于 M19 完成的种子轮融资；若未能交割，基准情景期末现金约为 -$964K，下行情景现金最低点为 -$1.41M。
    - 跨站匹配密度、试点转生产转化率、生产期付费意愿、模型中的 $36K 年度完成就诊费部分均未经验证；BP 和 research 明确指出这些证据缺口。
    - Y3 毛利率 76.1% 依赖两项假设：非薪酬变动 COGS 占收入 15%，且实施/客户成功薪酬仅 25% 计入 COGS；定制化集成可能导致毛利率低于 BP 的 70% 目标。
    - Y3 EBITDA 仍为 -$1.06M；按平均 FTE 计算，每 FTE 收入约为 $84K，低于模板中仅作方向性参考的 SaaS 基准 $200K-$400K。
    - 客户数出现小数是月度流失假设下的期望值，并非实际存在小数客户合同，也不代表已签约承诺。
