slug: portfolio-slot-exchange
date: '2026-10-20'
currency: USD
modelStartMonth: 2026-10
assumptions:
  - id: A1
    name: 起始付费客户组
    value: M1 有 0 个活跃付费客户组
    unit: groups
    source: '[business-plan.yaml.executiveSummary and gtm] 计划尚未产生收入，也未列出已签约客户；模型从零起步。'
  - id: A2
    name: 付费试点定价
    value: 90 天试点收费 $15,000
    unit: USD per pilot
    source: '[business-plan.yaml.gtm.pricing] 取拟议 $10,000-$20,000 试点价格区间的中点；付费意愿尚未验证。'
  - id: A3
    name: 每个付费客户组的年化收入
    value: 每个客户组年收入为 $60,000，相当于将 $15,000 试点价格年化；模型假设生产期收入由 $24,000 固定站点费和 $36,000 已完成就诊费构成。
    unit: USD/客户组年
    source: >-
      [business-plan.yaml.businessModel and gtm; research.yaml.market.bottomUpSizingDrivers] 市场规模测算采用每站点每年 $6,000
      的代理值，四个站点支持 $24,000 固定费参考；$36,000 结果费部分则是明确但未经验证的模型假设。
  - id: A4
    name: 收入确认与计费
    value: 每月 revenueK = 月末活跃付费客户组数 × $60,000 / 12；新付费客户组从首个活跃月起计费；试点客户在 90 天后若转为正式客户或续期，仍按相同运行费率计费，不另对试点流失作折减。
    unit: method
    source: '[business-plan.yaml.businessModel.revenueStreams] 采用初创公司财务建模中的时点估算惯例；试点和生产合同均按 $5,000 monthly-equivalent（每月等值）的费率处理，便于比较。'
  - id: A5
    name: 新增客户组
    value: M7：1；M10：1；M17：1；M23：1；M25-M31：每月 1 个；M33：1；截至 M36 共赢得 12 个毛新增客户组。
    unit: paying groups
    source: >-
      [business-plan.yaml.gtm.funnelTargets and milestones] 两个 Y1 试点、截至 M24 再新增两个客户组，以及 Y3 新增八个客户组，是通往 BP 目标的一条模型路径：第
      24-36 个月达到十个生产期客户组；时间安排和转化率均未经验证。
  - id: A6
    name: 月度客户流失率
    value: '1.5'
    unit: percent per month
    source: 早期 B2B 医疗健康 SaaS 的留存率尚未验证；模型采用初创公司财务估算，且没有该产品特定的留存证据，因此预期客户数为小数。
  - id: A7
    name: 按岗位划分的全负担年度现金薪酬
    value: CEO $120,000；创始工程师 $160,000；实施/客户成功 $120,000；产品/集成工程师 $160,000；GTM/客户经理每 FTE 年 $130,000。
    unit: USD/FTE 年
    source: '[business-plan.yaml.team] 岗位设置沿用 BP；薪酬采用明确列出的初创公司财务估算，包含雇主税费和福利，不含股权。'
  - id: A8
    name: 招聘时间
    value: CEO 和创始工程师于 M1 入职；实施/客户成功于 M7 入职；产品/集成工程师于 M16 入职；GTM/客户经理于 M22 入职；第二位实施/客户成功人员和第二位产品/集成工程师于 M31 入职。
    unit: schedule
    source: '[business-plan.yaml.team and strategicChoices.sequencingRationale] 后续招聘以拿下付费试点和出现生产需求为前提；M31 增员对应 BP 的三客户部署门槛。'
  - id: A9
    name: 非薪酬变动销售成本
    value: '15'
    unit: percent of revenue
    source: 采用初创公司 SaaS 财务估算，覆盖云服务、消息服务和随交付量变化的外部成本；公司尚无历史成本数据。
  - id: A10
    name: 直接交付薪酬分摊
    value: 将实施/客户成功薪酬的 25% 计入 COGS；其余薪酬继续计入运营费用。
    unit: allocation
    source: 采用初创公司财务会计估算，用于检验 BP 的 70% 毛利率目标；若客户导入继续依赖定制服务，这一分摊可能低估直接服务人工成本。
  - id: A11
    name: 销售与市场非薪酬预算
    value: Y1 $96K；Y2 $180K；Y3 $240K。
    unit: USD by year
    source: '[business-plan.yaml.gtm.channels] 采用初创公司财务预算估算，假设先由创始人主导直销，再招聘一名 GTM；目前没有 CAC 或渠道成本数据。'
  - id: A12
    name: 研发非薪酬预算
    value: Y1 $660K；Y2 $450K；Y3 $240K。
    unit: USD by year
    source: '[business-plan.yaml.product and operations] 采用初创公司财务预算估算，覆盖一个医疗健康连接器、安全工作、影子回放及后续复用；目前没有供应商报价或实际支出数据。'
  - id: A13
    name: 行政与管理非薪酬预算
    value: Y1 $300K；Y2 $240K；Y3 $180K。
    unit: USD by year
    source: '[business-plan.yaml.operations and team] 采用初创公司财务预算估算，覆盖外部隐私/安全法律顾问、保险、财务和行政支出；目前没有报价。'
  - id: A14
    name: 本轮种子前融资与资金分配
    value: $2.75M 于 M1 到账；覆盖 18 个月运营计划，并另留 $600K 作为六个月储备；资金分配为 $1.40M 工程、$450K GTM、$300K G&A 和 $600K 缓冲资金。
    unit: USD and months
    source: '[business-plan.yaml.fundingAsk] $2.75M 融资需求落在 BP 提出的 $2-$3M 区间内，并沿用其 18 个月现金跑道目标；各类用途拆分属于规划估算。'
  - id: A15
    name: 有条件的后续融资
    value: 只有受控试点结果和首个客户转入生产阶段都得到验证，才于 M19 完成 $1.50M 种子轮融资。
    unit: USD
    source: '[business-plan.yaml.milestones and fundingAsk] 时间安排按 BP 的验证门槛推进；融资金额和交割均为明确的融资假设，既非已承诺资金，也不属于当前融资需求。'
  - id: A16
    name: 现金桥接简化假设
    value: CashEOP = 上期现金 + EBITDA + 融资流入；不计债务、资本开支、税费、营运资本变动或回款延迟。
    unit: method
    source: 采用早期软件公司的初创公司财务建模惯例；当月回款假设偏乐观，明确合同和付款条款后应替换。
  - id: A17
    name: 全负担 CAC 计算
    value: $71.5K =（$516K 非薪酬销售与市场支出 + $180K 分摊的 CEO 薪酬 + $162.5K GTM 薪酬）/ 12 个毛新增客户组；按 CEO 时间的 50% 和 GTM 薪酬的 100% 计入获客成本。
    unit: USD/毛新增客户组
    source: '[A5, A7, A8, A11] 创始人时间分摊采用初创公司财务估算；模型客户群规模很小，CAC 因而高度不确定。'
  - id: A18
    name: 下行情景
    value: 每客户组年收入 $45K；月流失率 2.5%；五个毛新增客户组分别于 M9、M21、M29、M32 和 M35 获得；M19 不进行种子轮融资；费用和招聘计划维持基准情景。
    unit: scenario
    source: '[business-plan.yaml.operatingAssumptions and research.yaml.sensitivityCases] 用于压力测试匹配密度偏低、付费意愿偏弱，以及未能跨过下一轮融资门槛的情形。'
  - id: A19
    name: 上行情景
    value: 每客户组年收入 $75K；月流失率 1.0%；共赢得 14 个毛新增客户组，其中 Y2 两个（M17 和 M23）、Y3 十个；$1.50M 的 M19 种子轮融资完成。
    unit: scenario
    source: '[business-plan.yaml.milestones] 这是高于 Y3 十个客户组目标的上行压力情景；定价和签约速度仍未经验证。'
  - id: A20
    name: 敏感性测试区间
    value: >-
      ARPU $45K/$60K/$75K；Y3 新增客户组 5/8/11；月流失率 2.5%/1.5%/0.75%；变动 COGS 占收入 20%/15%/10%；种子轮融资失败/于 M19 完成交割/于 M18
      完成交割；两名新员工于 M28/M31/M34 入职。
    unit: downside/base/upside
    source: 明确的模型压力测试区间，以 A3、A5、A6、A8-A10 和 A15 为锚；这些是情景测试，并非已观测到的表现；cashImpactK 表示 Y3 期末现金相对基准情景的变动。
  - id: A21
    name: 目标毛利率
    value: '70'
    unit: percent
    source: '[business-plan.yaml.businessModel.targetGrossMarginPct] 这是公司目标，并非已实现或经独立验证的毛利率。'
  - id: A22
    name: 每 FTE 收入对比
    value: $200K-$400K 年收入/FTE
    unit: USD/FTE 年
    source: 采用所提供财务模型模板示例中的 SaaS 初创公司经验值，仅作方向性参考，并非医疗健康行业特定数据。
  - id: A23
    name: 模型周期与文件日期
    value: 模型从 2026-10 开始，日期为 2026-10-20。
    unit: date
    source: '[business-plan.yaml.date and research.yaml.date] 模型周期采用上游报告共用日期。'
modelTraceability:
  period: A23；modelStartMonth 和 date 沿用 BP 与 research 共用日期。
  revenue: A1-A5；revenueK = customersEop x A3 / 12，客户新增和流失按 A5-A6 设定。
  costs: >-
    A7-A13；cogsK = A9 × revenueK + A10 中的 directDeliveryPayrollK；opexK = salariesK - directDeliveryPayrollK +
    salesMarketingK + researchDevelopmentK + generalAdministrativeK。
  cash: A14-A16；cashEopK 根据 EBITDA 和 financingInflowK 滚动计算，其中纳入有条件的 M19 种子轮融资。
  unitEconomics: A3、A6、A9-A11 和 A17；LTV 按模型毛利率与流失率计算，CAC 则按全负担获客支出计算。
