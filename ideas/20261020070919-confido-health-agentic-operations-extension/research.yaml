championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: >-
        A group-controlled exchange that applies appointment, payer, provider, location, travel, and time constraints
        across affiliated clinics is a narrower workflow than generic appointment automation. Reviewed product pages
        establish automated cancellation backfill, but do not clearly document this full cross-affiliate, potentially
        cross-EHR exchange as a standalone product.
      sourceRefs:
        - 15
        - 16
        - 18
        - 21
        - 22
    - point: >-
        PE and multi-site platforms are an observable distribution context for administrative tooling, while the
        proposal measures completed recovered visits rather than calls or offers. This makes the private-group
        operating wrapper commercially distinctive enough to test, though not proven unique.
      sourceRefs:
        - 1
        - 2
        - 8
  evidenceAgainst:
    - point: >-
        The core mechanism of automatically matching waiting patients to canceled slots is already sold by Phreesia,
        Epic Fast Pass, Luma, NexHealth, and athenahealth. Phreesia's Summit case reports 75% of EMG cancellations
        filled, showing a direct substitute with customer evidence.
      sourceRefs:
        - 9
        - 11
        - 12
        - 15
        - 16
        - 19
    - point: >-
        Existing scheduling suites already support rules, patient messaging, provider or location context, and
        schedule write-back. Cross-location coordination may be configured or bundled by these incumbents, so public
        pages that do not describe the exact proposed exchange cannot establish that the feature is absent.
      sourceRefs:
        - 9
        - 10
        - 15
        - 17
        - 18
        - 19
    - point: >-
        No public source reviewed demonstrates incremental fills across separate affiliated clinics after subtracting
        patients who would have accepted a local waitlist offer anyway; the metric and the proposed fee attribution
        remain unvalidated.
      sourceRefs:
        - 3
        - 11
        - 12
  revisedClaim: >-
    The evidence supports a potentially useful, group-governed extension to a crowded cancellation-backfill category,
    not a novel waitlist mechanism. A defensible creative claim would require proof that a rules-based exchange can
    safely use shared permissions and heterogeneous schedules to produce incremental completed visits across
    affiliated sites beyond the native EHR and patient-access suite workflows already available. Public evidence does
    not yet show that this cross-site use case is unique, difficult to bundle, or valuable enough to buy separately.
reportMemo:
  executiveTakeaways:
    - >-
      Cancellation and access problems are current, and operating-cost pressure is documented, but public evidence
      does not isolate how many late-cancelled slots remain unfilled specifically because affiliated clinics cannot
      share waitlists.
    - >-
      The underlying slot-backfill mechanism is not rare. Phreesia, Epic, Luma, NexHealth, Relatient, and athenahealth
      already market automated waitlist or cancellation workflows; the proposed distinction is cross-affiliate
      constraint matching and incremental-visit attribution.
    - >-
      Incumbents do not necessarily win in every target group: a portfolio may run mixed EHRs, retain site-level
      waitlists, or lack centrally configured eligibility and consent rules. But where a single EHR or patient-access
      vendor is deployed and configured, native automation is a strong default and bundling threat.
    - >-
      A bottom-up opportunity can be modeled, but its account filters and annual spend proxy are assumptions rather
      than measured market facts. The US physician-group count is only a broad ceiling, not the number of eligible
      customers.
    - >-
      The highest-value validation is a shadow-mode replay and a controlled pilot that distinguishes truly incremental
      cross-site completed visits from appointments that existing local waitlists or reminder workflows would have
      filled.
  marketDefinition: >-
    Annual software and workflow value for matching newly released outpatient specialty appointments to opt-in
    patients already waiting elsewhere in the same affiliated provider group. The relevant unit is an eligible,
    completed visit recovered in a time-limited window, after accounting for local waitlist fills, payer and
    appointment rules, travel acceptance, and staff-confirmation steps. This excludes general scheduling software,
    reminder campaigns, physician-practice revenue, and consumer marketplace bookings.
  customerAndBuyer: >-
    The operational user is a centralized patient-access or scheduling leader and the schedulers who release
    appointments. The economic buyer is the COO, VP of operations, or portfolio-operations leader at a PE-backed
    outpatient specialty group with at least two nearby same-specialty sites, centrally governed scheduling, shared
    waitlists or permissions, and enough compatible demand. IT/security, privacy counsel, the EHR administrator,
    specialty operations, and patient-access teams can veto or delay deployment. AMA evidence that 6.5% of physicians
    reported PE ownership is not a count of eligible group accounts.
  buyingTriggers:
    - point: >-
        Rising operating costs and staffing pressure make staff time spent calling patients and recovering unused
        capacity more visible; MGMA reported 90% of responding groups had higher year-to-date operating costs in 2025.
      sourceRefs:
        - 5
    - point: >-
        A portfolio acquisition or centralized-operations program creates a moment to standardize patient access
        across sites, although the existence of consolidation does not itself prove an appointment-fill budget.
      sourceRefs:
        - 1
        - 2
        - 8
    - point: >-
        High-value diagnostic or specialty slots may have long lead times and explicit unfilled-cancellation costs;
        Summit Orthopedics describes both the prior manual gap and a vendor-reported recovery outcome.
      sourceRefs:
        - 12
    - point: >-
        Existing cancellations and no-show rates prompt operational changes: MGMA's 2025 survey found 27% of
        respondents reported that no-shows increased versus 2024, while other practices attributed stable or lower
        rates to communication and easier rescheduling.
      sourceRefs:
        - 3
        - 4
  willingnessToPay:
    summary: >-
      Evidence supports budget pressure and willingness to invest in patient-access tooling in general, not a price
      or contract for this exact cross-site product. Vendor-published customer cases report $200,000 in additional
      revenue at Summit Orthopedics, but that figure is not independent verification or software spend. MGMA frames
      cancellations and rebooking speed as access and margin levers, and NexHealth describes quote-based large
      customer plans without publishing a price. No fetched source disclosed a buyer's budget, contract value, or
      completed-visit fee.
    sourceRefs:
      - 5
      - 12
      - 17
  competitiveLandscape: >-
    Direct products already automate the key cancellation-to-waitlist workflow: Phreesia Appointment Accelerator,
    Epic Fast Pass, Luma Smart Waitlist, NexHealth Waitlist, Relatient Dash, and athenahealth patient engagement.
    Phreesia's published case is the closest direct functional evidence; Epic can be deeply embedded in Cadence and
    MyChart; Luma and NexHealth sell EHR-connected outreach and write-back. Zocdoc offers a consumer-facing
    real-time-booking substitute. Manual calls, spreadsheets, local EHR waitlists, central schedulers, and custom
    integrations remain substitutes. No source verified that each direct product supports cross-affiliate matching
    across different EHR instances with the exact proposed payer and travel rules.
  incumbentThesis:
    - incumbentClass: "EHR-native scheduling and waitlists"
      point: >-
        Epic can offer open appointments to waitlisted patients through Fast Pass, and its WakeMed case describes
        combined Fast Pass, self-scheduling, and workflow changes associated with more visits and higher outpatient
        revenue. Native tools can win by default where one EHR is authoritative and configured. The opening is a
        mixed-EHR group or a group whose local waitlists do not share permissions; those gaps must be confirmed at
        account level rather than assumed.
      sourceRefs:
        - 9
        - 10
        - 21
        - 22
    - incumbentClass: "Patient-access suites"
      point: >-
        Phreesia, Luma, NexHealth, Relatient, and athenahealth combine scheduling, outreach, and cancellation
        automation and can be bundled into existing contracts. Their public material does not establish a separate
        cross-affiliate exchange with the proposed completion-based attribution, but suite vendors can extend their
        rules or integrations and may already support multi-location workflows.
      sourceRefs:
        - 11
        - 12
        - 15
        - 16
        - 18
        - 19
    - incumbentClass: "Central schedulers and local manual processes"
      point: >-
        Phone outreach and spreadsheets preserve staff judgment and avoid new vendor security and integration work;
        they can be adequate when cancellation volume is low or a group has flexible staff. The customer cases and
        MGMA survey suggest that staff capacity and reachability can make manual backfill slow or inconsistent, but
        no independent time-and-motion study specific to the proposed buyer was found.
      sourceRefs:
        - 3
        - 12
        - 14
    - incumbentClass: "Consumer appointment marketplaces"
      point: >-
        Zocdoc exposes real-time bookable openings to patients and can capture demand without a private group
        exchange. It is a substitute for discovery and self-booking, but it is not shown to optimize an existing
        group's opted-in waitlist under internal payer and appointment eligibility rules.
      sourceRefs:
        - 20
  regulatoryLandscape: >-
    Appointment and waitlist records can include protected health information. If a vendor handles data on behalf
    of a covered entity, the relationship, permitted purpose, safeguards, and business-associate terms need review;
    cross-site use also depends on which organizations are covered entities or affiliated and who is authorized to
    act for the group. Patient SMS offers require communications controls, consent/opt-out handling, and review of
    the applicable FCC/TCPA healthcare exception and state laws. A waitlist offer must not make a clinical
    eligibility judgment: uncertain cases should be escalated to staff. Legal applicability depends on implementation
    and counsel review.
  technologyLandscape: >-
    HL7 FHIR models appointments, schedules, and slots, but the standard's Appointment workflow notes that an
    available slot does not guarantee that booking is allowed; permissions, assessments, resource availability, and
    local business rules can still reject a request. A practical product needs authoritative cancellation events,
    patient and appointment-type matching, payer and provider rules, consent provenance, offer expiry, race-safe
    reservation, EHR write-back, audit logs, and a human fallback. FHIR resources help structure data but do not
    eliminate customer-specific integration or configuration work.
  distributionChannels:
    - point: >-
        Portfolio-operations leaders and PE platform executives can introduce a centrally sponsored pilot across
        affiliated groups; Confido's reported investor-first distribution is category context, not evidence that
        this product has the same channel.
      sourceRefs:
        - 1
        - 2
        - 8
    - point: >-
        Direct selling to centralized patient-access, COO, or specialty operations leaders is the clearest route
        to a one-metro, one-specialty pilot; use local scheduling and IT owners as co-sponsors.
      sourceRefs:
        - 3
        - 12
    - point: >-
        EHR implementation firms and patient-access vendors could provide integrations or referrals, but channel
        access and commercial terms have not been evidenced.
      sourceRefs:
        - 17
        - 18
  partnershipEcosystem:
    - point: >-
        EHR/PM vendors and interoperability integrators are necessary for read/write access, event reliability,
        and testing of group-specific scheduling constraints.
      sourceRefs:
        - 17
        - 21
        - 22
    - point: >-
        PE-backed practice platforms and management-services organizations can sponsor multi-site workflow
        standardization; consolidation creates distribution possibilities but also introduces integration
        heterogeneity.
      sourceRefs:
        - 2
        - 8
    - point: >-
        Patient-access platforms may be competitors or integration partners; partnership is conditional on proving
        incremental value that their current local waitlist modules do not already deliver.
      sourceRefs:
        - 11
        - 15
        - 18
  dataMoats:
    - point: >-
        A potential data advantage is a de-identified, permissioned history of offer eligibility, acceptance,
        completion, cancellation reason, travel distance, and time-to-fill by specialty and slot type. No such
        proprietary cross-site outcome data is evidenced today.
      sourceRefs:
        - 12
        - 21
        - 22
    - point: >-
        Group-specific consent mappings, appointment taxonomies, payer constraints, and reliable EHR connectors
        could create implementation know-how, but they are customer-specific and may be reproducible by suite
        vendors.
      sourceRefs:
        - 17
        - 21
        - 22
  geographicConsiderations:
    - point: >-
        Begin with dense metros where affiliated clinics are close enough for patients to accept another location;
        travel, transport access, and patient choice constrain the addressable pool and may create equity concerns.
      sourceRefs:
        - 3
        - 20
    - point: >-
        US adoption requires state-by-state review of privacy, communications, scope, and payer rules, while
        multi-state platform groups can increase both contract value and deployment complexity.
      sourceRefs:
        - 2
        - 25
  sensitivityCases:
    - case: "Low match density: few patients accept another site or payer and visit-type constraints exclude most candidates."
      impact: >-
        Cross-site offers may generate little incremental completed volume beyond existing local waitlists, making
        a separate tool difficult to justify; stop or narrow to a specialty with dense, flexible demand.
      sourceRefs:
        - 3
        - 12
        - 20
    - case: "Incumbent capability: the buyer already has a configured native EHR or patient-access waitlist."
      impact: >-
        A standalone product may be redundant unless a controlled test proves additional completed visits or
        measurably faster fills from eligible patients at other sites.
      sourceRefs:
        - 9
        - 11
        - 15
        - 19
    - case: "Integration and permissions: appointment events or shared patient records cannot be read or written across sites."
      impact: >-
        Deployment reverts to manual exports and staff confirmation, raising onboarding cost and reducing the
        time window available to fill cancellations.
      sourceRefs:
        - 17
        - 21
        - 22
        - 23
    - case: "Demand and spend proxy: eligible accounts or annual per-site value are substantially lower than assumed."
      impact: >-
        The modeled US market can contract sharply; the TAM/SAM/SOM below are scenario estimates, not measured
        category revenue.
      sourceRefs:
        - 7
        - 8
        - 24
  validationPlan:
    - priority: high
      question: "Do target groups have enough genuinely unfilled late-cancelled slots and cross-site-compatible waiting patients?"
      evidenceToGather: >-
        Request 12 months of de-identified slot release, local waitlist, offer, acceptance, visit completion,
        payer, provider, and location records from 8-10 target groups; replay matching without contacting patients
        and calculate eligible pairs, response windows, and local-workflow counterfactuals.
    - priority: high
      question: "Does cross-site exchange create incremental completed visits, rather than shifting patients who would have filled locally?"
      evidenceToGather: >-
        Run a prospective, site-matched pilot with a predeclared holdout or stepped-wedge design; measure incremental
        completed visits per released slot, time-to-fill, cancellation rebooking, no-shows after rebooking, patient
        travel acceptance, staff minutes, and attribution against local waitlist and incumbent workflows.
    - priority: high
      question: "Can the group lawfully and technically share only the data required to make offers and write back bookings?"
      evidenceToGather: >-
        Map covered entities, affiliated-entity status, business-associate roles, permitted purposes, patient
        notices/consent, SMS opt-outs, state rules, EHR APIs, and audit requirements with counsel and each group's
        privacy/security and scheduling owners before using identifiable data.
    - priority: high
      question: "Will a buyer fund a separate exchange when its EHR or patient-access vendor offers automated waitlists?"
      evidenceToGather: >-
        Conduct structured interviews with 15-20 operations buyers and EHR administrators; obtain incumbent
        configuration/pricing, document unmet cross-site workflows, and ask for a paid pilot commitment tied to
        completed-visit recovery rather than expressions of interest.
    - priority: medium
      question: "Which patient and appointment rules create safe, acceptable matches across locations?"
      evidenceToGather: >-
        Review patient consent records and existing location preferences; test patient acceptance by travel-time
        bands, specialty, payer, provider, appointment type, and offer expiry, with staff review for uncertain
        eligibility and accommodations.
    - priority: medium
      question: "Is completed-visit attribution reliable enough to support a recurring or outcome-linked commercial model?"
      evidenceToGather: >-
        Reconcile slot release, offer, booking, arrival, billing, and completion timestamps against source-system
        audit logs; explicitly exclude appointments that are merely moved, would have filled locally, or are later
        canceled.
analysisModels:
  marketMapDiagram:
    title: "Cancellation recovery versus cross-site specialization"
    mermaid: |
      quadrantChart
        title Cancellation recovery versus cross-site specialization
        x-axis Low cross-site specialization --> High cross-site specialization
        y-axis Low access urgency --> High access urgency
        Proposed exchange: [0.85, 0.88]
        Phreesia Accelerator: [0.58, 0.91]
        Epic Fast Pass: [0.5, 0.82]
        Luma Smart Waitlist: [0.55, 0.83]
        NexHealth Waitlist: [0.42, 0.73]
        Manual calls: [0.15, 0.5]
  fiveForces:
    supplierPower:
      score: 4
      rationale: >-
        EHR and practice-management vendors control authoritative schedules, patient context, write access, and
        customer-specific API enablement; interoperability standards do not guarantee production permissions.
      sourceRefs:
        - 17
        - 21
        - 22
    buyerPower:
      score: 4
      rationale: >-
        Large groups can demand proof of incremental visits, security review, and integration concessions, and can
        compare against existing suites or internal labor. No public price data was found for the direct products.
      sourceRefs:
        - 11
        - 16
        - 17
    threatOfEntrants:
      score: 4
      rationale: >-
        The matching rules are buildable by EHR, engagement, and automation vendors; the harder entry work is
        cross-site integration, permission governance, reliable attribution, and patient trust.
      sourceRefs:
        - 9
        - 15
        - 18
        - 21
    threatOfSubstitutes:
      score: 5
      rationale: >-
        EHR-native Fast Pass, patient-access suite waitlists, online booking marketplaces, centralized schedulers,
        local calling, overbooking, and spreadsheets all address parts of the job.
      sourceRefs:
        - 9
        - 11
        - 15
        - 16
        - 19
        - 20
    competitiveRivalry:
      score: 5
      rationale: >-
        Multiple scaled patient-access vendors advertise automated cancellation or waitlist workflows, while EHRs
        can bundle scheduling into the system of record.
      sourceRefs:
        - 9
        - 11
        - 15
        - 16
        - 18
        - 19
  pestle:
    - factor: "political"
      impact: "neutral"
      point: >-
        US information-blocking rules support access to electronic health information in covered circumstances,
        but do not guarantee that every third-party product can read or write every scheduling workflow.
      sourceRefs:
        - 23
        - 24
    - factor: "economic"
      impact: "positive"
      point: >-
        Higher practice operating costs and labor pressure make recovered capacity and staff time relevant, though
        the product's share of savings and specific budget remain unproven.
      sourceRefs:
        - 5
        - 12
    - factor: "social"
      impact: "negative"
      point: >-
        Patients may not be able or willing to travel to another location; transportation and clinic-location
        barriers appear in practice-manager reports and must be reflected in opt-in preferences.
      sourceRefs:
        - 3
        - 20
    - factor: "technological"
      impact: "positive"
      point: >-
        FHIR provides appointment and slot representations, while vendor connectors demonstrate real-time
        read/write patterns; local authorization and scheduling business rules still govern execution.
      sourceRefs:
        - 17
        - 21
        - 22
    - factor: "legal"
      impact: "negative"
      point: >-
        HIPAA role and purpose, business-associate terms, patient communication permissions, and TCPA/FCC opt-out
        obligations can limit cross-site outreach or require legal review.
      sourceRefs:
        - 23
        - 25
    - factor: "environmental"
      impact: "neutral"
      point: >-
        Offering another clinic location can add patient travel; no retrieved source quantifies resulting
        environmental effects, so travel distance and accessibility should be measured rather than presumed benign.
      sourceRefs:
        - 3
  adoptionFrictionMatrix:
    - friction: "Cross-site access, consent, and PHI authorization"
      severity: "high"
      affectedBuyer: "Privacy officer, compliance counsel, group COO, and patient-access leadership"
      mitigation: >-
        Start inside a single controlled group, document entity relationships and permitted purposes, minimize
        fields, use required agreements and notices, and keep auditable patient opt-in and opt-out records.
      sourceRefs:
        - 23
        - 24
        - 25
    - friction: "EHR schedule read/write and cancellation-event access"
      severity: "high"
      affectedBuyer: "CIO, EHR administrator, interface team, and schedulers"
      mitigation: >-
        Select one initial EHR or connector, test read/write scopes and event latency in a sandbox, use idempotent
        updates and hold/expiry controls, and route uncertain bookings to staff.
      sourceRefs:
        - 17
        - 21
        - 22
    - friction: "Low compatible-patient density across sites"
      severity: "high"
      affectedBuyer: "Central scheduling and specialty operations"
      mitigation: >-
        Replay historical data by specialty, location, payer, provider, and appointment type before a live pilot;
        exclude slots where the group cannot establish a high-confidence operational match.
      sourceRefs:
        - 12
        - 15
        - 16
    - friction: "Patient travel and response behavior"
      severity: "medium"
      affectedBuyer: "Patients, access leaders, and patient-experience teams"
      mitigation: >-
        Offer only to patients who opted into other sites, show travel distance and time, set patient-selected
        time windows, and provide a time-limited choice rather than automatic relocation.
      sourceRefs:
        - 3
        - 20
    - friction: "Incumbent bundle or existing local waitlist"
      severity: "high"
      affectedBuyer: "COO, procurement, and patient-access vendor owner"
      mitigation: >-
        Benchmark the current EHR and suite configuration first; sell only if a controlled test shows incremental
        completed visits or faster fills beyond the current workflow.
      sourceRefs:
        - 9
        - 11
        - 15
        - 19
    - friction: "Completed-visit attribution and revenue collection"
      severity: "medium"
      affectedBuyer: "Finance, revenue-cycle, and operations leadership"
      mitigation: >-
        Define the counterfactual and attribution window in advance and reconcile offer, booking, arrival, and
        completed-visit records; do not count accepted offers as recovered visits.
      sourceRefs:
        - 5
        - 12
market:
  tam:
    value: "$758.4M"
    rationale: >-
      Bottom-up US scenario, not observed category revenue: Definitive Healthcare lists over 395,000 active
      physician group practices. Assume 8% (31,600 groups) fit a multi-site specialty access workflow, four
      participating sites per group, and a $6,000 annual site-value proxy for sizing only; 31,600 x 4 x $6,000 =
      $758.4M per year. The 8%, site count, and proxy are unverified operator assumptions, not a pricing decision.
    isEstimate: true
    sourceRefs:
      - 7
      - 8
  sam:
    value: "$48.0M"
    rationale: >-
      Near-term US beachhead scenario: assume 2,000 PE-backed or similarly centralized specialty-group buyers meet
      the multi-site, shared-permission, and local-density requirements, at four sites each and the same $6,000
      annual site-value proxy; 2,000 x 4 x $6,000 = $48.0M per year. No public source counts this eligible buyer
      cohort; the AMA's PE statistic is a share of physicians, not a count of groups.
    isEstimate: true
    sourceRefs:
      - 6
      - 7
      - 8
  som:
    value: "$2.4M"
    rationale: >-
      Five-year reachability scenario, not a forecast: 100 group customers with four participating sites each
      multiplied by the $6,000 annual site-value proxy equals $2.4M annual value. The count requires validation
      through named buyer interviews, live integrations, and pilot conversion; it represents 5% of the assumed
      2,000-account SAM.
    isEstimate: true
    sourceRefs:
      - 2
      - 7
      - 8
bottomUpSizingDrivers:
  - driver: "Active US physician group practices, broad ceiling"
    value: "More than 395,000 groups, as of January 2025; groups may operate multiple locations."
    source: "[7]"
  - driver: "TAM eligibility filter"
    value: "8% of all groups, or 31,600 groups; operator assumption pending account-level validation."
    source: "est."
  - driver: "Participating sites per eligible group"
    value: "Four sites per group; operator assumption for sizing."
    source: "est."
  - driver: "Annual value proxy"
    value: "$6,000 per participating site per year; a sizing input only, not a pricing recommendation."
    source: "est."
  - driver: "TAM calculation"
    value: "31,600 groups x 4 sites x $6,000 per site-year = $758.4M annual scenario."
    source: "calc."
  - driver: "SAM cohort"
    value: "2,000 PE-backed or centrally operated specialty groups with shared access rules; unverified assumption."
    source: "est."
  - driver: "SOM reachability"
    value: "100 group customers x 4 sites x $6,000 per site-year = $2.4M annual scenario."
    source: "calc."
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: "MGMA respondents report rising practice operating costs and identify staffing expense as a contributor, making productivity and access initiatives timely."
      sourceRefs:
        - 5
    - point: "Physician-group consolidation and multi-site platform activity create more potential buyers with centralized operations, while also increasing integration complexity."
      sourceRefs:
        - 2
        - 8
    - point: "Both Epic and independent patient-access platforms market waitlist automation, indicating that cancellation recovery is already an accepted product category."
      sourceRefs:
        - 9
        - 11
        - 15
  headwinds:
    - point: "The category is crowded and direct vendors already match waitlisted patients to canceled appointments."
      sourceRefs:
        - 11
        - 15
        - 16
        - 18
        - 19
    - point: "No-show trends are heterogeneous: 73% of MGMA respondents said rates were stable or decreased in 2025, so urgency is not universal."
      sourceRefs:
        - 3
    - point: "Incremental cross-site fill economics, relevant buyer willingness to pay, and a differentiated outcome versus native waitlists remain unproven."
      sourceRefs:
        - 9
        - 12
        - 16
competitors:
  - name: "Phreesia Appointment Accelerator"
    stage: "Scaled patient-access vendor with established specialty customers"
    wedge: "AI smart waitlist that texts clinically relevant patients and rebooks canceled or bumped appointments."
    pricing: "Not publicly disclosed on the fetched product and case pages; sales-led."
    strength: >-
      Direct functional substitute. Phreesia reports under-five-minute refills; its Summit Orthopedics case reports
      75% of EMG cancellations filled, 688 appointments, and $200,000 additional revenue over one year.
    weaknessVsUs: >-
      Public materials do not establish the exact cross-affiliate, cross-EHR group exchange and completion-based
      attribution proposed here; the vendor may still support relevant multi-location workflows or bundle an extension.
    sourceRefs:
      - 11
      - 12
      - 13
  - name: "Epic Cadence and MyChart Fast Pass"
    stage: "Incumbent EHR and patient-portal platform"
    wedge: "Native waitlist offers and patient self-scheduling within the Epic scheduling and portal ecosystem."
    pricing: "Bundled or contract-specific within an Epic deployment; no standalone price found."
    strength: >-
      Has access to the schedule of record and patient workflow. Epic's WakeMed material associates Fast Pass,
      self-scheduling, and scheduling redesign with 75,000 more annual visits and 21% higher outpatient revenue.
    weaknessVsUs: >-
      Strongest where a group runs one Epic instance; the separate product may matter in mixed-EHR affiliates or
      where permissions and waitlists are siloed, but that gap has not been demonstrated.
    sourceRefs:
      - 9
      - 10
  - name: "Luma Health Smart Waitlist"
    stage: "Scaled patient-access platform"
    wedge: "EHR-connected cancellation offers and rebooking; public integrations include Oracle Health and eClinicalWorks."
    pricing: "Not publicly disclosed on the fetched product pages; sales-led."
    strength: >-
      The product explicitly advertises showing matching slots after cancellations and filling them without staff
      intervention; its case materials describe phone burden in a community health center.
    weaknessVsUs: >-
      Public pages do not establish the proposed cross-affiliate exchange under group-wide payer and travel rules;
      Luma could extend its suite and EHR connector strategy to cover this workflow.
    sourceRefs:
      - 14
      - 15
  - name: "NexHealth Waitlist"
    stage: "Patient-engagement and EHR integration vendor"
    wedge: "Appointment-type and provider-aware offers with one-click booking and real-time calendar updates."
    pricing: "Custom plans and quote-based for larger customers; no public direct price found."
    strength: >-
      Documents scheduling synchronization and waitlist automation, with customer testimonials about filling
      openings and revenue recovery.
    weaknessVsUs: >-
      Fetched pages emphasize practice-level waitlist workflows and do not document the proposed cross-affiliate
      exchange; this absence is not proof that NexHealth cannot support it.
    sourceRefs:
      - 16
      - 17
  - name: "Internal central scheduling and local EHR waitlists"
    stage: "Status quo and services substitute"
    wedge: "Schedulers use phone, text, spreadsheets, portal lists, or existing EHR tools to contact patients and rebook."
    pricing: "Existing staff and EHR costs; no incremental software quote required."
    strength: >-
      Keeps clinical, payer, and patient nuance with staff and avoids new integration, vendor, and security review.
    weaknessVsUs: >-
      Manual outreach can be slow and inconsistent when staff lack bandwidth; it may still be adequate for low
      cancellation volume or when native waitlists already fill openings.
    sourceRefs:
      - 3
      - 4
      - 12
      - 14
regulatoryTechnicalConstraints:
  - point: >-
      HIPAA role, permitted purpose, safeguards, covered-entity affiliation, and business-associate obligations must
      be established before the product uses patient and schedule data across sites; do not assume common ownership
      alone grants unrestricted data access.
    sourceRefs:
      - 23
      - 25
  - point: >-
      Automated appointment texts must be reviewed for applicable FCC/TCPA healthcare conditions, patient
      permissions, frequency limits, and functional opt-out handling; state requirements can differ.
    sourceRefs:
      - 25
  - point: >-
      HL7 FHIR Appointment and Slot resources standardize parts of the workflow, but a free slot does not guarantee
      a valid booking because permissions, assessments, resource rules, and local business logic can reject it.
    sourceRefs:
      - 21
      - 22
  - point: >-
      ONC information-blocking policy addresses interference with EHI access, exchange, or use; it is not a
      guarantee of universal production scheduling write access or a substitute for customer authorization.
    sourceRefs:
      - 23
      - 24
  - point: >-
      Payer eligibility, visit type, provider-specific rules, patient preference, location capacity, and arrival
      completion must be checked before attributing a recovered visit; uncertain or clinical decisions need staff review.
    sourceRefs:
      - 12
      - 21
      - 22
validationSignals:
  - point: >-
      Vendor-published Summit Orthopedics results report 688 appointments filled and 75% of EMG cancellations filled
      with Appointment Accelerator over one year; this validates the relevance of automated backfill, not cross-site
      exchange economics or independent product impact.
    sourceRefs:
      - 12
  - point: >-
      Epic's WakeMed story reports 75,000 more annual visits and 21% higher outpatient revenue after a bundle of
      Fast Pass, MyChart self-scheduling, analytics, and process changes; the individual contribution of Fast Pass
      is not isolated.
    sourceRefs:
      - 10
  - point: >-
      MGMA's 2025 no-show poll found 27% of respondents reported an increase year over year and highlights access,
      transport, and communication factors; the poll does not quantify unfilled last-minute cancellation slots.
    sourceRefs:
      - 3
  - point: >-
      Confido says it has a PE-first distribution model and reports a broad multi-site footprint, but those
      company-level claims do not validate this specific waitlist product or a buyer budget for it.
    sourceRefs:
      - 1
      - 2
openQuestions:
  - "What fraction of late-cancelled slots remain unfilled after each target group's local EHR and vendor waitlist workflow?"
  - "Can historical records establish patient consent and group-level authority to offer another affiliated location?"
  - "How many patients accept a different nearby clinic after adjusting for travel time, payer, provider, appointment type, and time of day?"
  - "Which EHRs and scheduling interfaces permit reliable event feeds and safe third-party write-back in production?"
  - "Does the exchange increase completed visits, or mostly shift patients between sites and existing waitlists?"
  - "Will buyers pay for a separate product when Phreesia, Epic, Luma, NexHealth, Relatient, or athenahealth may already be installed?"
  - "How should the product avoid disadvantaging patients with transportation, disability, insurance-network, or digital-access constraints?"
  - "What is the actual number of PE-backed specialty groups with centralized access, nearby same-specialty clinics, and shared permissions?"
