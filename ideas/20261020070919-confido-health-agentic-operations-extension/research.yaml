  saturationRationale: >-
    After 33 successful page fetches, the eight decision questions and the highest-risk pain, incumbent, integration,
    and consent questions have multiple useful evidence threads; the final six fetches added at most one new
    decision-relevant insight on access-related cancellation salvage while mostly confirming mapped substitutes,
    ownership context, and communication controls.
  coverageGap: >-
