problem: >-
  门诊机构人手和接诊能力都吃紧，排期、患者触达和保险核验仍耗费大量人力。预约取消后，集团内另一家关联诊所可能已有合适患者在候补；但工作人员必须赶在号源失效前找到并确认人选，可用时间有限。现有来源能证明运营环境承压，却无法说明这类取消问题的规模。
targetUser:
  primary: >-
    目标用户是 PE 支持的门诊专科集团中央排期和患者服务负责人。其所在集团需在附近设有多家同专科诊点，并共享排期授权。
  secondary: "负责释放取消号源、管理患者候补名单的诊所经理。"
  buyer: "多地点医疗集团的 COO、运营副总裁或投资组合运营负责人。"
startupThesis:
  nonObviousInsight: >-
    稀缺的不是多打一通自动化电话，而是在有限时间内，把空出的可预约号源匹配给愿意且获准到另一家关联诊所就诊的候补患者。共享运营规则的集团无需先建开放式消费市场，也能在本地形成供需密度。
  beachhead: >-
    滩头市场选在美国一个都会区内由 PE 支持的门诊专科集团：至少有两家同专科关联诊所、中央患者服务团队和现成候补名单；先从临近预约时取消的号源入手。
  wedge: >-
    切口是同一关联集团内、面向单一专科的私有跨地点空缺撮合服务。它按诊所设定的预约限制，以及患者对地点和时间的偏好筛选，只向最匹配的候补患者发出限时邀约。
  whyNowCatalyst: >-
    Confido 十月宣布追加 $12.5 million 融资，媒体报道其多地点覆盖面，也提到人员和接诊能力受限。诊所运营自动化与 PE 主导的分发因此正逢其时；但现有来源尚未证明市场对跨诊所填补取消号源有需求。
  ventureScalePath: >-
    先在一个专科、一个都会区验证跨诊所撮合能否挽回已完成就诊，再拓展到更多专科和医疗服务管理集团；之后根据实际填补结果，增加汇总的接诊能力利用率报告。
solution: >-
  服务会导入同一关联集团内参与诊所新释放的预约号源，以及患者主动同意加入的候补名单。系统依据集团设定的专科、预约类型、保险支付方、医疗服务提供者、地点和出行规则筛选，只对可行人选排序，再向患者发送限时邀约。患者接受后，系统更新该预约的排期；邀约过期或匹配结果不确定时，则交由工作人员处理，不改变临床资格判断或医疗决策。试点将与集团现有的本地候补流程对照，比较挽回的已完成就诊数和填补耗时。
goToMarketSeed:
  firstCustomer: >-
    一家由 PE 支持的门诊专科集团，设有中央排期团队和至少两家相邻关联诊所；患者候补名单可按集团现行的同意和访问规则使用。
  buyingTrigger: >-
    新增诊点后，或排期人员长期紧缺时，投资组合运营团队推动改善预约可及性或诊所产能。
  currentAlternative: >-
    各诊点独立使用 EHR 候补名单、人工外呼、电子表格，以及预约提醒或排期模块。
  switchingReason: >-
    它能在关联地点之间撮合患者和空缺号源，不必替换 EHR 排期系统，也不用让工作人员手动搜索多个本地候补名单。
  pricingHypothesis: >-
    每家参与诊所收取周期性费用；每笔跨诊所预约完成就诊后才收取浮动费用，常规诊所内排期不在收费范围内。
whyNow:
  - point: >-
      Confido 宣布追加 $12.5 million 的 A 轮融资，表明资本仍在投入多地点诊所运营领域。
    signalRefs:
      - "新增扩张资金"
    sourceRefs:
      - 1
  - point: >-
      Confido 称，其产品可连接 50 多个系统，并自动化预约排期和患者触达，说明这些工作流已有人尝试自动化。
    signalRefs:
      - "覆盖广泛的行政工作流"
    sourceRefs:
      - 1
  - point: >-
      独立媒体报道，Confido 覆盖 1,500 多个诊疗点、约 3,200 名医疗服务提供者；报道还提到其私募股权分发渠道，可能支持面向单个集团的聚焦试点。
    signalRefs:
      - "多地点分发渠道"
    sourceRefs:
      - 2
  - point: >-
      媒体报道门诊机构人手和接诊能力受限，让验证跨诊所填补空档能否挽回原本闲置的预约时段变得紧迫。
    signalRefs:
      - "人员与接诊能力承压"
    sourceRefs:
      - 2
differentiator: >-
  产品不自动处理每家诊所自己的预约队列，而是把临近预约时段取消的号源视为易逝库存，供关联诊所中符合条件且主动同意的患者选择。集团仍掌握临床和排期规则；初期以完成的跨诊所就诊数为商业指标，而非消息发送量或仅发出的预约邀约数。
conceptDiagram:
  title: "跨诊所空缺撮合"
  mermaid: |
    flowchart LR
      Clinic["Affiliated clinic releases a slot"] --> Exchange["Group-rules vacancy exchange"]
      Waitlist["Opt-in patient waitlist"] --> Exchange
      Exchange --> Offer["Time-limited location offer"]
      Offer --> Visit["Completed visit in a previously open slot"]
      Visit --> Outcome["Measured recovered appointment value"]
