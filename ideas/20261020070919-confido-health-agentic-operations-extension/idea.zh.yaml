jobsToBeDone:
  - job: >-
      患者取消近期预约后，帮中央排期人员在另一家关联诊所找到符合条件的候补患者，让他们能在号源失效前挽回预约机会。
    currentAlternative: "按本地候补名单逐个打电话、查电子表格，或让号源空置。"
    successMetric: "每个取消号源新增的已完成就诊数，以及从号源释放到患者接受邀约的中位耗时。"
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      用私有网络在诊所间撮合即将失效的号源，比再做一个预约提醒工具或单诊所排期机器人更少见。
  venturePotential:
    score: 4
    rationale: >-
      多地点集团和 PE 主导的分发渠道带来可信的切入后扩张路径；但现有证据没有量化取消号源流失，也没有证明客户对挽回就诊的付费意愿。
  whiteSpace:
    score: 3
    rationale: >-
      医疗行政自动化竞争激烈，Confido 已经覆盖预约排期；更窄的跨诊所号源撮合仍有差异，但现有厂商可能把它捆绑进产品。
  painIntensity:
    score: 4
    rationale: >-
      媒体报道门诊机构面临人员和接诊能力限制，但没有量化取消预约造成的损失。
  wedgeClarity:
    score: 4
    rationale: >-
      聚焦一个专科、一个都会区和一个关联集团，试点结果容易衡量；但能否推进取决于排期数据能否访问，以及患者是否有足够灵活度。
  evidenceFit:
    score: 3
    rationale: >-
      来源证明了多地点运营、排期自动化和接诊能力承压，却没有直接证明存在未满足的跨诊所候补需求，也没有说明填补空缺的经济价值。
topRisks:
  - name: "匹配密度低"
    description: >-
      专科、保险支付方、医疗服务提供者、出行距离和预约限制叠加后，愿意接受其他地点新开放号源的患者可能太少。
    mitigation: >-
      从单一专科和邻近诊所起步，用去标识化历史排期数据估算匹配密度，再做小规模试点后决定是否扩张。
  - name: "同意与数据访问"
    description: >-
      跨诊所使用候补名单可能需要通过隐私审批、取得患者同意并获得集团访问授权，拖慢部署。
    mitigation: >-
      先在同一法人医疗集团内试点，仅使用最低必要排期数据；先由集团批准患者同意及数据访问规则，再向患者发出邀约。
  - name: "现有厂商捆绑"
    description: >-
      现有诊所运营供应商可能增加跨诊所候补撮合功能，也可能阻断接入排期系统所需的集成。
    mitigation: >-
      通过聚焦试点证明新增已完成就诊，并在可行时与现有服务商合作；将产品定位为可衡量的接诊能力撮合，而不是替代排期系统。
