qualityPolicyVersion: 2
slug: portfolio-slot-exchange
date: "2026-10-20"
sector: health-tech
pitch: "在号源失效前，把主动加入候补名单的患者匹配到关联诊所临近取消的门诊预约中。"
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: >-
    它把集团内临近预约时才出现的空档视为易逝库存，在关联诊所间撮合填补，而不是给每家诊所的排期队列再添一个自动化机器人。
  acceptedTradeoff: >-
    首个市场有意收窄，客户导入环节工作量也大：参与诊所必须共享排期规则和候补名单权限，附近还要有足够的患者需求，跨地点撮合才跑得通。
originalityAudit:
  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
  rejectedCliches:
    - 面向诊所行政工作的通用 AI 助手
    - 叠加在预约数据上的仪表盘和提醒
    - 通用 EHR 集成层
    - 覆盖面很广的诊所运营自动化套件
  rareMechanism: >-
    私有的规则撮合网络把关联诊所取消后的号源视为有时限的库存；只有完成跨诊所填补才收费，不替每家诊所自动处理本地候补队列。
  nearestHistoricalIdeas:
    - slug: visit-close-work-packets
      similarity: job
      decisiveDifference: >-
        那个创意在就诊结束时整理经临床人员确认的转诊、医嘱和后续工作；本创意则把候补名单上的患者匹配到关联诊所即将失效的预约号源。
