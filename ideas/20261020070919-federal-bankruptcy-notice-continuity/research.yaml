championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: >-
        The October 2026 interruption exposed the exact completeness failure the
        thesis targets: the Maryland court warned that CM/ECF creditor and party
        lists may omit addresses registered through BNC EBN/NCRS, and that a docket
        entry does not by itself establish completed BNC service.
      sourceRefs:
        - 3
        - 4
    - point: >-
        Public competitor documentation describes claims administration, matrix
        compilation, print/electronic noticing, tracking, and service certificates,
        but does not describe the specific combination of an independently held,
        case-level recipient capsule, provenance-based reconciliation, rehearsed
        alternate dispatch, and explicit activation authority.
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
    - point: >-
        The proposed unit of continuity is more specific than generic backup or
        outage alerting: it is the case-level proof that authorized recipient
        sources were reconciled before an approved alternate handoff.
      sourceRefs:
        - 2
        - 3
        - 20
  evidenceAgainst:
    - point: >-
        The important components are not new individually: official and commercial
        providers already manage recipient data, produce notices through print and
        electronic channels, track mail, and provide certificates of service.
      sourceRefs:
        - 5
        - 6
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
    - point: >-
        More than 20 entities appear on the Administrative Office's approved notice
        provider list, so switching or using a second provider is an existing
        substitute; approval on that list does not, however, prove a provider is
        authorized for every case or recipient.
      sourceRefs:
        - 6
        - 7
        - 20
    - point: >-
        No public evidence verifies that claims agents lack internal disaster
        recovery, recipient snapshots, or private failover arrangements. Absence of
        a public feature description cannot establish a unique capability or a
        defensible moat.
      sourceRefs:
        - 11
        - 12
        - 13
        - 20
  revisedClaim: >-
    The potentially exceptional element is a vendor-independent continuity control
    that preserves recipient provenance, reconciles the case-authorized recipient
    set, and permits an alternate dispatch only after explicit authority is recorded.
    The outage makes this a concrete and uncommon-seeming workflow, but adjacent
    noticing capabilities already exist and neither uniqueness nor a separate
    continuity budget is yet verified.
evidenceQuestions:
  - question: "Is the pain current and budgeted?"
    status: answered-with-gap
    finding: >-
      Pain is current and high consequence: the Judiciary said BNC production and
      distribution stopped, and a court FAQ dated October 19 said the restoration
      date remained unknown. Ordinary noticing is paid for, but no separate
      continuity budget or purchase commitment was found.
    sourceRefs:
      - 1
      - 3
      - 15
      - 20
  - question: "Is the proposed mechanism genuinely uncommon?"
    status: mixed
    finding: >-
      The full combination is not described in the reviewed public vendor pages, but
      matrix management, recipient checking, print/electronic delivery, tracking,
      and certificates already exist. Public documentation cannot establish that no
      incumbent has an undisclosed continuity program.
    sourceRefs:
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
  - question: "Which direct competitors and substitutes already exist?"
    status: answered
    finding: >-
      Direct providers include Stretto, Epiq, Verita, BMC Group, and Key Dynamics.
      The federal BNC, other approved notice providers, other claims agents, local
      CM/ECF queries, and manual service are important substitutes.
    sourceRefs:
      - 5
      - 6
      - 11
      - 12
      - 13
      - 14
      - 15
  - question: "Why do incumbents not win by default?"
    status: answered-with-gap
    finding: >-
      They often may win by default because of court familiarity, integrated
      staffing, approval, and existing print/electronic operations. The outage and
      incomplete-list workaround show why a cross-provider continuity layer could
      help, but there is no evidence that incumbents lack private backups or cannot
      add the feature themselves.
    sourceRefs:
      - 1
      - 3
      - 6
      - 11
      - 12
  - question: "What market size is reachable from the stated beachhead?"
    status: answered-with-estimates
    finding: >-
      A case-volume proxy implies a theoretical $39.7M annual TAM at an assumed
      $5,000 per commercial Chapter 11 case-equivalent; a 15% complex/accessible
      case assumption gives a $6.0M SAM and a 3% share scenario gives a $0.2M SOM.
      The assumptions are not observed prices or adoption data, so venture-scale
      reach from this beachhead is not established.
    sourceRefs:
      - 9
      - 10
      - 20
      - 22
  - question: "What regulation, procurement, integration, or behavior could block adoption?"
    status: answered
    finding: >-
      Case-specific notice rules, authority to use an alternate method, access to
      BNC-registered addresses, local court retention rules, competitive agent
      selection, sensitive recipient data, and reluctance to maintain a second
      source of truth are material blockers.
    sourceRefs:
      - 3
      - 7
      - 8
      - 18
      - 19
      - 20
      - 24
  - question: "What would falsify the concept?"
    status: answered
    finding: >-
      The concept is falsified if target operators cannot lawfully export or
      reconcile the full authorized recipient set before an incident, courts will
      not pre-approve an alternate route, incumbent failover already satisfies
      buyers, or providers will not fund a continuity control separately from
      existing noticing work.
    sourceRefs:
      - 3
      - 6
      - 7
      - 20
  - question: "Does the evidence support the declared creative-novelty selection lens?"
    status: answered-mixed
    finding: >-
      The incident creates a distinctive problem-mechanism fit and the exact
      authority-gated recipient capsule was not found in public competitor
      descriptions. Novelty is supported as a workflow combination, not as a
      proven category-first invention; the best answer is mixed.
    sourceRefs:
      - 3
      - 6
      - 11
      - 12
      - 13
      - 15
reportMemo:
  executiveTakeaways:
    - >-
      A live nationwide service interruption is strong evidence of acute operational
      pain: BNC notice production stopped while court activity continued, and
      Maryland's October 19 FAQ said service restoration timing was unknown.
    - >-
      The most compelling evidence is recipient completeness, not generic uptime:
      official workaround instructions warn that court lists may omit BNC EBN/NCRS
      addresses and other required parties.
    - >-
      Adjacent commercial services already provide noticing, claims administration,
      matrix handling, printing, address checks, tracking, and certificates; the
      product must prove independent recipient provenance and a court-authorized
      fallback rather than repackage those features.
    - >-
      The buyer and payment case are unproven. Published notice-mailing charges and
      court-approved claims-agent engagements show adjacent spending, but not a
      budget for a separate continuity retainer.
    - >-
      The narrow U.S. commercial Chapter 11 beachhead appears small under
      conservative case-equivalent assumptions; adjacent court-approved notice
      programs are a scale hypothesis, not part of the validated initial market.
  marketDefinition: >-
    The market is continuity for U.S. federal bankruptcy notice operations, not
    general disaster recovery or legal software. The BNC produces and transmits
    notices for all federal bankruptcy courts; 7,940 commercial Chapter 11 filings
    were reported for calendar year 2025 by Epiq AACER, while U.S. Courts recorded
    8,405 business Chapter 11 filings for fiscal year 2025. The measures use
    different periods and definitions. The beachhead is multi-case claims and
    noticing operators whose work depends on case-authorized recipient lists and
    service evidence.
  customerAndBuyer: >-
    The day-to-day user is a notice-operations lead at a claims or noticing agent;
    the likely economic sponsor is its COO or operations head. The authority to
    serve notice belongs to the court, clerk, debtor/trustee, or other party
    identified by the applicable rule and case order, so an agent's willingness
    alone may not authorize fallback dispatch. In Rhode Island, local guidelines
    require an agent for cases with 1,000 or more creditors and call for at least
    three engagement proposals; that local example shows formal procurement and
    court oversight, not a nationwide threshold.
  buyingTriggers:
    - point: >-
        An active BNC interruption, continuity audit, or post-incident risk review
        makes service continuity and recipient provenance salient to claims-agent
        operations.
      sourceRefs:
        - 1
        - 3
    - point: >-
        A new high-creditor Chapter 11 case or a claims-agent retention proposal is
        a practical point to define data ownership, service evidence, and any
        approved alternate method before deadlines arrive.
      sourceRefs:
        - 18
        - 19
        - 20
    - point: >-
        A notice-mailing job needing a fast turnaround already triggers external
        spending, but that is evidence of fulfillment demand rather than an
        established trigger for continuity coverage.
      sourceRefs:
        - 15
  willingnessToPay:
    summary: >-
      Existing adjacent spend is observable: Key Dynamics publicly lists $0.15 per
      page plus postage for standard mailings and $0.25 per page for rush service,
      while Rhode Island requires the claims-agent engagement agreement to state
      its fee structure. This demonstrates that notice fulfillment and claims
      administration are budgeted; it does not establish willingness to pay a
      separate annual continuity fee. No public continuity-specific price or
      purchase commitment was found.
    sourceRefs:
      - 15
      - 20
  competitiveLandscape: >-
    The federal BNC is the incumbent court-facing path for many court-issued
    notices, and the Administrative Office lists more than 20 approved notice
    providers. Stretto, Epiq, Verita, BMC Group, and CPT Group market integrated
    claims administration and legal noticing; Key Dynamics sells matrix-based
    print/mail fulfillment with published per-page rates. These providers already
    cover many components of the proposed product. The open gap is not another
    printer or case website; it is an independently maintained, provably complete
    recipient capsule with authority-gated dispatch. No reviewed public page
    documents that full combination, but private BCP capabilities remain unknown.
  incumbentThesis:
    - incumbentClass: "Federal BNC and court-operated CM/ECF"
      point: >-
        The BNC has the existing relationship, recipient registry, and national
        notice channel, so it is the default for notices in ordinary operation.
        The 2026 incident halted production and distribution, while local
        workarounds exposed limits in CM/ECF list completeness. The outage proves
        concentration risk but does not prove the BNC lacks private recovery plans.
      sourceRefs:
        - 1
        - 3
        - 5
    - incumbentClass: "Full-service claims and noticing agents"
      point: >-
        Providers such as Stretto, Epiq, Verita, BMC Group, and CPT Group can bundle
        case administration, matrix work, noticing, print production, reporting,
        or creditor support; this integration and court familiarity can win by
        default. Their public service descriptions do not establish an
        independently operated continuity capsule, but a vendor could add one or
        bundle equivalent capabilities.
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 16
    - incumbentClass: "Other approved notice providers and print/mail firms"
      point: >-
        The approved-provider list and low-friction mail services offer a plausible
        substitute dispatch channel. They do not automatically resolve whether
        recipient sources are complete or whether a specific case authority has
        approved that channel for the notice at issue.
      sourceRefs:
        - 6
        - 7
        - 15
    - incumbentClass: "Manual and internal case-operations workarounds"
      point: >-
        Local court instructions allow users to query creditor and party records
        and compare lists manually, making this a near-term substitute. Courts
        warn that these lists may omit registered BNC recipients and other parties,
        and that a docket entry alone may not prove service was completed.
      sourceRefs:
        - 2
        - 3
        - 4
  regulatoryLandscape: >-
    Federal Rule of Bankruptcy Procedure 2002 sets notice obligations, including
    21-day and 28-day notice periods for specified events. Rule 9036 governs
    electronic notice, including registered addresses and effectiveness when a
    sender learns an electronic transmission did not reach the recipient. The
    Administrative Office's approved-provider list is not blanket case authority
    to dispatch every notice through any listed vendor. Local rules and case
    orders control retention, scope, service methods, and evidence. Recipient
    lists can contain personally identifying or financial information; use
    minimization, access controls, retention limits, and security review. This is
    diligence framing, not legal advice.
  technologyLandscape: >-
    A file-based encrypted snapshot, source versioning, deterministic comparisons,
    exception routing, and an append-only authorization and dispatch log are
    technically feasible patterns. The critical uncertainty is lawful access to
    the authoritative recipient sources, especially BNC EBN/NCRS registrations,
    and proving that a fallback's channel and address remain valid for the case.
    A second repository can increase attack surface and produce a stale or
    conflicting source of truth; a security program should map to an established
    framework such as NIST CSF 2.0. No public BNC export/API or complete feed was
    verified.
  distributionChannels:
    - point: >-
        Sell first to multi-case claims and noticing agents as a managed continuity
        control, with a one-case tabletop pilot; involve the debtor/trustee's
        bankruptcy counsel and the court authority before any live dispatch.
      sourceRefs:
        - 6
        - 18
        - 20
    - point: >-
        Use referrals from restructuring counsel, claims-agent protocol advisers,
        and approved notice providers; direct provider-to-provider introductions
        are more credible than selling an unapproved legal-service channel to
        individual creditors.
      sourceRefs:
        - 6
        - 19
        - 21
  partnershipEcosystem:
    - point: >-
        A pilot needs a claims agent willing to preserve source provenance, case
        counsel and the authorized decision-maker to approve activation conditions,
        and an independent approved notice/print partner prepared to demonstrate
        delivery evidence.
      sourceRefs:
        - 6
        - 15
        - 20
    - point: >-
        The BNC/CM/ECF ecosystem remains the source of official case activity and
        registered recipient instructions; access and data-sharing terms must be
        agreed rather than inferred from public dockets.
      sourceRefs:
        - 3
        - 5
        - 7
  dataMoats:
    - point: >-
        Raw names and addresses are not a durable moat and may be public or
        case-bound. A defensible operational asset could be a permissioned history
        of source versions, resolved exceptions, authorization records, and
        dispatch outcomes across exercises. It cannot be repurposed across cases
        without legal authority. Epiq's public claim to a 37-million-case data set
        illustrates the scale incumbent data operators can bring, not a data right
        this startup can assume.
      sourceRefs:
        - 3
        - 23
        - 25
  geographicConsiderations:
    - point: >-
        Initial sales and handling should be U.S.-only because federal bankruptcy
        rules, approved provider status, and local court protocols govern notice.
        District practices differ: South Carolina and Maryland posted distinct
        outage instructions, and Rhode Island publishes its own claims-agent
        retention and fee procedures.
      sourceRefs:
        - 2
        - 3
        - 6
        - 20
    - point: >-
        Cross-border creditors can occur in U.S. cases, but the researched service
        channel and legal authorities are U.S. federal; international expansion
        would require separate service, privacy, and procurement diligence.
      sourceRefs:
        - 8
        - 23
  sensitivityCases:
    - case: "BNC recovery and incumbent remediation are rapid"
      impact: >-
        The immediate buying window narrows; the product must sell readiness and
        auditability rather than outage response, and incumbents may bundle
        equivalent controls.
      sourceRefs:
        - 1
        - 3
        - 11
        - 12
    - case: "Courts do not authorize an independent alternate route"
      impact: >-
        A stored snapshot may help reconciliation but loses the dispatch wedge;
        the service could collapse into a non-urgent export or audit tool.
      sourceRefs:
        - 6
        - 7
        - 18
        - 20
    - case: "Only a small fraction of commercial Chapter 11 cases fit the high-volume buyer profile"
      impact: >-
        The serviceable market falls below the base case; the 15% SAM assumption
        should be reduced and adjacent legal-notice programs independently tested
        before claiming venture-scale potential.
      sourceRefs:
        - 10
        - 20
        - 22
    - case: "Recipient data cannot be safely exported or independently hosted"
      impact: >-
        The product cannot create a useful completeness guarantee and may create
        a new security or privacy liability; do not proceed without a
        customer-controlled data and key model.
      sourceRefs:
        - 3
        - 23
        - 24
  validationPlan:
    - priority: high
      question: "Can a target agent lawfully and technically export every authorized recipient source, including BNC-registered addresses, before an outage?"
      evidenceToGather: >-
        Interview operations and IT at three claims agents; inspect sample source
        exports, access permissions, provenance fields, and an end-to-end
        reconciliation against the case order and recipient registry.
    - priority: high
      question: "Will case authorities approve a pre-rehearsed alternate dispatch and what exact activation proof is required?"
      evidenceToGather: >-
        Review three recent retention orders and local service protocols with
        bankruptcy counsel, court-clerk stakeholders, and an agent; obtain written
        approval criteria for a tabletop exercise and a live-case pilot.
    - priority: high
      question: "Is a separate continuity budget available, or do operators expect the incumbent to include recovery in existing fees?"
      evidenceToGather: >-
        Review claims-agent engagement letters and fee applications from recent
        cases; ask at least five COOs to compare an independent continuity service
        with their existing BCP, insurance, and vendor contract obligations.
    - priority: high
      question: "Does any incumbent already maintain an independent recipient snapshot and tested alternate dispatch?"
      evidenceToGather: >-
        Request continuity evidence and failover exercise results from Stretto,
        Epiq, Verita, BMC Group, and one smaller approved provider; compare
        recovery-point, recipient-completeness, authorization, and service-proof
        controls.
    - priority: medium
      question: "Can data minimization, encryption, retention, and access controls satisfy case counsel and court security review?"
      evidenceToGather: >-
        Map a sample notice data flow, identify personal and financial data, and
        run a security and privacy review against NIST CSF 2.0 and the applicable
        case and vendor agreements.
  validationSignals:
    - point: >-
        The Administrative Office reported that the incident halted BNC notice
        production and distribution nationwide; the Maryland court's October 19
        FAQ said restoration timing was unknown.
      sourceRefs:
        - 1
        - 3
    - point: >-
        A local court's manual workaround explicitly cautioned that creditor lists
        did not include all interested parties; Maryland further warned that BNC
        EBN/NCRS addresses might not appear and docketing does not prove service.
      sourceRefs:
        - 2
        - 3
    - point: >-
        Key Dynamics publishes page-based charges for ordinary legal notice
        fulfillment, indicating existing spend around mailing but not dedicated
        resilience spend.
      sourceRefs:
        - 15
    - point: >-
        Rhode Island court guidelines require competitive claims-agent proposals
        and disclosure of the fee structure in the retention agreement, showing
        how an adjacent service is formally bought and approved.
      sourceRefs:
        - 20
  openQuestions:
    - "What share of commercial Chapter 11 cases uses an outside agent with sufficiently large or changing recipient sets?"
    - "Which party has authority and budget to contract for a separate continuity capsule in each case?"
    - "Can the BNC EBN/NCRS data be exported lawfully and in a versioned form before an incident?"
    - "What current BNC restoration and post-incident continuity changes are in place after October 20, 2026?"
    - "Would an incumbent absorb this feature or provide it at no incremental price?"
    - "Can the mechanism expand beyond bankruptcy without diluting court-specific authority and proof requirements?"
analysisModels:
  marketMapDiagram:
    title: "Urgency versus continuity specialization"
    mermaid: |
      quadrantChart
        title Bankruptcy notice continuity market
        x-axis Low continuity specialization --> High continuity specialization
        y-axis Low outage urgency --> High outage urgency
        quadrant-1 High urgency and specialized
        quadrant-2 High urgency and general
        quadrant-3 Low urgency and general
        quadrant-4 Specialized but less urgent
        Proposed startup: [0.88, 0.92]
        Federal BNC: [0.25, 0.88]
        Claims agents: [0.55, 0.68]
        Manual CM ECF workaround: [0.18, 0.56]
        Mail fulfillment vendors: [0.46, 0.42]
  fiveForces:
    supplierPower:
      score: 4
      rationale: >-
        Dispatch capacity and access to authoritative recipient data are controlled
        by a small set of court-facing systems, approved providers, postal vendors,
        and case authorities; switching the technical supplier does not itself
        transfer legal authority.
      sourceRefs:
        - 3
        - 6
        - 7
        - 20
    buyerPower:
      score: 4
      rationale: >-
        A narrow set of repeat claims agents may sponsor the product, but the
        debtor/trustee and court can control agent appointment and scope. Rhode
        Island's three-proposal process is an example of formal buyer leverage.
      sourceRefs:
        - 18
        - 19
        - 20
    threatOfEntrants:
      score: 3
      rationale: >-
        Building encrypted snapshots and list comparisons is feasible, but
        trusted legal operations, recipient-data access, approval, security,
        evidence integrity, and an independent dispatch network are nontrivial.
      sourceRefs:
        - 3
        - 20
        - 24
    threatOfSubstitutes:
      score: 4
      rationale: >-
        Substitutes include BNC recovery, other approved notice providers,
        incumbent agents' own workflows, internal backups, and manual
        CM/ECF/docket comparison. The manual method is immediate but can be
        incomplete.
      sourceRefs:
        - 2
        - 3
        - 5
        - 6
        - 11
    competitiveRivalry:
      score: 4
      rationale: >-
        Several established providers already combine claims administration,
        notice production, customer support, and data platforms; a continuity
        feature can be bundled, and public pricing is sparse outside individual
        mailing services.
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
  pestle:
    - factor: political
      impact: positive
      point: >-
        A federal court service interruption raises institutional attention to
        vendor concentration and continuity, although any public-sector response
        may require formal procurement and court approval.
      sourceRefs:
        - 1
        - 3
        - 20
    - factor: economic
      impact: neutral
      point: >-
        Commercial Chapter 11 filings rose 1% in Epiq's 2025 calendar-year
        measure, while large-company Chapter 7/11 filings fell 15% in the latest
        12-month comparison but remained 22% above their long-run average; demand
        is cyclical and case counts do not directly measure continuity spend.
      sourceRefs:
        - 10
        - 22
    - factor: social
      impact: negative
      point: >-
        Notice failures can delay hearings or leave creditors unaware of case
        activity, which makes recipient completeness and service evidence
        consequential for trust and participation.
      sourceRefs:
        - 3
        - 4
        - 8
    - factor: technological
      impact: neutral
      point: >-
        Encrypted snapshots and repeatable reconciliation are feasible, but
        duplicating recipient data creates a new attack surface and cannot fix
        missing or unauthorized source records.
      sourceRefs:
        - 3
        - 24
    - factor: legal
      impact: negative
      point: >-
        Service methods, timing, recipient addresses, and agent authority are
        governed by federal rules and case-specific or local orders; alternate
        dispatch requires more than technical readiness.
      sourceRefs:
        - 7
        - 8
        - 18
        - 20
    - factor: environmental
      impact: neutral
      point: >-
        Federal high-volume electronic noticing is intended to reduce mailing
        costs, while a fallback that depends on physical mail reintroduces paper
        and postage; the continuity case should prioritize valid recipient
        preferences rather than a default print reroute.
      sourceRefs:
        - 5
        - 7
  adoptionFrictionMatrix:
    - friction: "Case authority and notice-method approval"
      severity: high
      affectedBuyer: "Claims agent, debtor/trustee, bankruptcy counsel, and court"
      mitigation: >-
        Agree on the authorized source, eligible notices, activation role, and
        method in the case engagement/order before any live dispatch.
      sourceRefs:
        - 7
        - 8
        - 20
    - friction: "Claims-agent procurement and appointment"
      severity: high
      affectedBuyer: "Debtor or trustee selecting a claims and noticing agent"
      mitigation: >-
        Test the service through a court-approved agent engagement and support
        competitive proposals; do not assume an annual SaaS contract substitutes
        for case-specific retention approval.
      sourceRefs:
        - 18
        - 19
        - 20
    - friction: "Access to complete registered recipient data"
      severity: high
      affectedBuyer: "Notice operations and case counsel"
      mitigation: >-
        Obtain a permitted, timestamped export from each source before the case
        goes live and record coverage gaps; never claim completeness from CM/ECF
        alone.
      sourceRefs:
        - 2
        - 3
        - 7
    - friction: "Sensitive or stale mailing data"
      severity: high
      affectedBuyer: "Court security reviewers, claims agents, and case parties"
      mitigation: >-
        Minimize retained fields, use strong access controls and encryption, set
        case-specific retention and deletion, and complete independent security
        review.
      sourceRefs:
        - 3
        - 23
        - 24
    - friction: "Integration with incumbent notice and claims tools"
      severity: medium
      affectedBuyer: "Claims-agent IT and notice-operations teams"
      mitigation: >-
        Begin with supported exports and reproducible reports; introduce APIs only
        where the incumbent and case authority permit them.
      sourceRefs:
        - 11
        - 12
        - 13
    - friction: "Low-frequency outage makes readiness easy to defer"
      severity: medium
      affectedBuyer: "COO or head of operations at a claims-agent provider"
      mitigation: >-
        Tie a measurable exercise to an existing case onboarding or continuity
        review and test renewal interest before building a broad platform.
      sourceRefs:
        - 1
        - 3
        - 20
market:
  tam:
    value: "$39.7M"
    rationale: >-
      Theoretical case-volume ceiling, not current market revenue: 7,940 commercial
      Chapter 11 filings in calendar 2025 multiplied by an assumed $5,000
      continuity-coverage equivalent per new case produces $39.7M of one-year
      cohort value. The assumed $5,000 is a sizing yardstick, not an observed
      continuity price or a recommendation; full penetration and one billable
      year per new filing are also assumptions. The U.S. Courts fiscal-year
      business Chapter 11 count differs (8,405), so the measure is period- and
      definition-sensitive.
    isEstimate: true
    sourceRefs:
      - 9
      - 10
  sam:
    value: "$6.0M"
    rationale: >-
      Apply an explicitly unverified 15% serviceable share to 7,940 annual
      commercial Chapter 11 filings, assuming only 1,191 case-equivalents have
      sufficient creditor/list complexity, an outside-agent workflow, and an
      accessible buyer. At the same $5,000 sizing proxy, 1,191 multiplied by
      $5,000 is approximately $6.0M. Rhode Island's 1,000-creditor appointment
      guideline and the 100 large-company filing proxy support a complex-case
      wedge, but do not validate the 15% national share.
    isEstimate: true
    sourceRefs:
      - 10
      - 20
      - 22
  som:
    value: "$0.2M"
    rationale: >-
      Illustrative reachable scenario: 3% of the estimated SAM is about 36 annual
      case-equivalents; at the assumed $5,000 per case-equivalent, this is
      approximately $180,000, rounded to $0.2M. This is not a revenue forecast;
      provider count, conversion, authorized case coverage, duration, and
      continuity-specific willingness to pay remain unvalidated.
    isEstimate: true
    sourceRefs:
      - 6
      - 10
      - 20
bottomUpSizingDrivers:
  - driver: "Annual U.S. commercial Chapter 11 case cohort"
    value: "7,940 filings in calendar year 2025"
    source: "[10]"
  - driver: "Annual case-equivalent fee used only for sizing"
    value: "$5,000 per case-equivalent; operator assumption, not a public quote"
    source: "est."
  - driver: "High-complexity serviceable case share"
    value: "15% assumed; no national data on cases meeting the buyer profile"
    source: "est."
  - driver: "Large-company bankruptcy signal"
    value: "100 companies with more than $100M in assets filed Chapter 7 or 11 in 2H 2025–1H 2026; 28 were mega cases over $1B"
    source: "[22]"
  - driver: "Approved notice-provider universe"
    value: "23 names on the Administrative Office public list; list includes varied provider sizes and capabilities"
    source: "[6]"
  - driver: "Local claims-agent threshold and procurement example"
    value: "Rhode Island guidelines require an agent in cases with 1,000 or more creditors and call for at least three proposals"
    source: "[20]"
categoryDynamics:
  growthRate: >-
    No reliable continuity-category CAGR was found. Epiq AACER reported commercial
    Chapter 11 filings up 1% year over year to 7,940 in calendar 2025; U.S. Courts
    reported total Chapter 11 filings down 0.8% in FY2025, while Cornerstone
    Research found large-company filings in its latest 12-month period down 15%
    year over year but still 22% above the 2005–2025 average.
  growthRateSourceRefs:
    - 9
    - 10
    - 22
  tailwinds:
    - point: >-
        The BNC disruption has made a single centralized notice path's continuity
        risk concrete to courts and case operators.
      sourceRefs:
        - 1
        - 3
    - point: >-
        Epiq AACER reported commercial Chapter 11 filings up 1% in 2025, and
        Cornerstone Research found large-company filings remained above their
        historical average.
      sourceRefs:
        - 10
        - 22
    - point: >-
        A local claims-agent guideline establishes a formal case context for
        third-party noticing and fee approval, demonstrating a procurement path
        where the agent is already retained.
      sourceRefs:
        - 20
  headwinds:
    - point: >-
        Bankruptcy filings are cyclical, and the latest large-company count
        declined from the prior 12-month period; a single disruption may not
        sustain urgency after BNC service returns.
      sourceRefs:
        - 9
        - 22
    - point: >-
        The buyer universe is concentrated and incumbents already sell the
        underlying case, claims, and noticing services; a continuity feature may
        be bundled without a new purchase.
      sourceRefs:
        - 6
        - 11
        - 12
        - 13
        - 14
competitors:
  - name: "Stretto"
    stage: "Established claims and noticing agent"
    wedge: >-
      Full-service claims administration, proprietary case-management, dedicated
      bankruptcy print production, call-center support, document tracking, and
      service certificates.
    pricing: "No public continuity price found; case-specific proposals."
    strength: >-
      Deep bankruptcy operations and integrated production/service evidence can
      reduce coordination burden for a case sponsor.
    weaknessVsUs: >-
      The public page does not describe an independently held recipient capsule
      or a separate authority-gated cross-provider fallback; private BCP remains
      unknown.
    sourceRefs:
      - 11
  - name: "Epiq"
    stage: "Established global restructuring and bankruptcy services provider"
    wedge: >-
      High-volume bankruptcy notifications, in-house printing and fulfillment,
      mailing protocols, barcoding, undeliverable-mail tracking, and extensive
      bankruptcy data and analytics.
    pricing: "No public continuity price found; tailored matter-level service."
    strength: >-
      Scale, integrated print capacity, and a large data and service footprint
      create strong incumbent trust and bundling potential.
    weaknessVsUs: >-
      Public documentation emphasizes the provider's own production and tracking
      path, not an independently operated capsule and activation protocol; no
      evidence confirms that such private capabilities are absent.
    sourceRefs:
      - 12
      - 25
  - name: "Verita"
    stage: "Established specialist claims and noticing agent"
    wedge: >-
      Claims administration, creditor-matrix compilation, noticing, case websites,
      ePOC, eBallot, and opt-in electronic noticing.
    pricing: "No public continuity price found; case engagement terms not posted."
    strength: >-
      Integrated eServices, claims workflows, and existing case relationships
      align closely with the proposed operator's work.
    weaknessVsUs: >-
      The public service description does not disclose a vendor-independent
      recipient snapshot or pre-authorized alternate dispatch control.
    sourceRefs:
      - 13
  - name: "BMC Group"
    stage: "Established claims, noticing, and case-administration provider"
    wedge: >-
      Notice planning, content, quality assurance, print and electronic production,
      case websites, call centers, and claims administration.
    pricing: "No public continuity price found; contact provider for a proposal."
    strength: >-
      Quality controls, a dedicated notice team, production facilities, and
      creditor support cover core delivery steps.
    weaknessVsUs: >-
      Public material is focused on campaign execution and case services, not
      preserving a cross-vendor recipient capsule or recording a separate
      authority-gated failover.
    sourceRefs:
      - 14
  - name: "Key Dynamics"
    stage: "Specialist third-party bankruptcy notice mailing provider"
    wedge: >-
      Debtor-counsel mailing service that compiles a mailing matrix, prints and
      mails same-day jobs, checks duplicated or undeliverable addresses, and
      supplies a certificate of service.
    pricing: "$0.15 per page plus postage for standard mail; $0.25 per page for rush service, as published on the fetched page."
    strength: >-
      Low-friction per-job pricing, flexible terms, address verification, and
      delivery certificates make this a direct operational substitute.
    weaknessVsUs: >-
      Public documentation describes mailing fulfillment rather than a
      pre-disruption, independently stored BNC recipient snapshot and
      authority-gated alternate route.
    sourceRefs:
      - 15
regulatoryTechnicalConstraints:
  - point: >-
      Rule 2002 imposes specific notice recipients and timing for covered
      proceedings; a backup cannot silently alter the notice content or deadline.
    sourceRefs:
      - 8
  - point: >-
      Rule 9036 permits electronic delivery under defined conditions, addresses
      registered with the Judiciary's bankruptcy-noticing program, and makes
      electronic notice ineffective when the sender learns it did not reach the
      recipient.
    sourceRefs:
      - 7
  - point: >-
      The Maryland court stated that BNC queues may be serviced after restoration,
      while warning that docket entries alone do not establish completed service;
      reconciliation must avoid duplicate or conflicting notices when the primary
      system resumes.
    sourceRefs:
      - 3
  - point: >-
      Rhode Island's guidelines require case-specific retention, a disinterested
      agent, disclosure of fees, and competitive proposals; these are local
      guidelines, not a nationwide rule.
    sourceRefs:
      - 20
  - point: >-
      Recipient and notice data may include personally identifying or financial
      information. Storage should be minimized and protected under case contracts
      and applicable privacy requirements; NIST CSF 2.0 is a risk-management
      framework, not a bankruptcy-specific legal mandate.
    sourceRefs:
      - 23
      - 24
validationSignals:
  - point: >-
      The Administrative Office confirmed that BNC service was unavailable and
      that production and distribution of notices for federal bankruptcy courts
      had stopped.
    sourceRefs:
      - 1
  - point: >-
      Maryland's October 19 FAQ reports no known restoration date and warns that
      creditor queries can omit BNC-registered addresses and other required
      parties.
    sourceRefs:
      - 3
  - point: >-
      A commercial notice provider publishes per-page standard and rush charges,
      supporting willingness to pay for ordinary fulfillment but not yet for a
      continuity product.
    sourceRefs:
      - 15
  - point: >-
      A local court uses formal claims-agent retention, competitive proposals, and
      fee disclosure, showing that an authorized service can be purchased but
      also that approval adds friction.
    sourceRefs:
      - 20
openQuestions:
  - "Does BNC now offer a documented and independently tested continuity route after the October 2026 incident?"
  - "Can a customer obtain a lawful export of EBN/NCRS recipient records with enough provenance to verify completeness?"
  - "What percent of commercial Chapter 11 cases have a large, changing recipient set and an outside claims agent?"
  - "Who pays for continuity and is the spend incremental to a claims-agent engagement or court IT procurement?"
  - "Would an incumbent bundle an equivalent capability, and would a customer still pay for vendor independence?"
  - "What case-order language, insurance, evidence standard, and retention period would counsel require?"
