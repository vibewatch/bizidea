modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Sources[Authorized recipient sources] --> Portfolio[Paid portfolio pilot or retainer]
      Portfolio --> Customers[Average active portfolio equivalents]
      Customers --> Revenue[Annual ARPU times active customers]
      Revenue --> COGS[Partner and secure-storage costs]
      Revenue --> GrossProfit[Gross profit]
      COGS --> GrossProfit
      GrossProfit --> EBITDA[EBITDA after payroll and operating expenses]
      Financing[Conditional financing] --> Cash[Cash balance]
      EBITDA --> Cash
modelSanity:
  - checkName: Revenue engine
    finding: "Base revenue reaches $56.7K in Y3 from five year-end paid portfolio-equivalents at $15K annual ARPU, with no activation or pass-through fees modeled."
  - checkName: Must go right
    finding: "Two paid portfolio-equivalents by M18, three by M24, an approved tabletop, and at least one paid renewal must support the conditional M25 seed."
  - checkName: Model breaks if
    finding: "If authority or renewal gates fail, the M25 seed is unavailable and the downside cash low point is negative $365.9K, while hiring one quarter early consumes another $92.5K."
  - checkName: Next-round proof
    finding: "Before assuming the M25 seed, prove lawful complete source exports, a case-approved tabletop, three paying portfolios, and one paid renewal by M24."
sanityChecks:
  ruleOf40: "Y3 revenue growth 177.3% + EBITDA margin -1,443.4% = -1,266.1%; the growth rate is from a very small base."
  burnMultiple: "21.0x = $817.8K Y3 EBITDA burn divided by $39.0K net new exit ARR; this is highly adverse and noisy at the modeled scale."
  revenuePerFte: "$11.3K Y3 revenue per Q4Y3 FTE (5), versus a generic $200K-$400K scaled-SaaS planning heuristic."
  flags:
    - "Research found no continuity-specific price, budget, paid contract, or buyer interview; ARPU and churn remain unvalidated assumptions."
    - "Y3 base revenue of $56.7K is below the research illustrative $0.2M SOM and depends on five portfolio-equivalents in a narrow market."
    - "LTV:CAC is only 1.83x and CAC payback is 36.36 months, weaker than the generic 3x and under-18-month startup-finance heuristics."
    - "Y3 rule-of-40 is deeply negative and burn multiple is 21.0x; the high percentage growth does not make the current economics venture-scale."
    - "Cash falls to $74.1K at M24 before a conditional, uncommitted $1.5M seed; the no-seed downside reaches negative $365.9K."
    - "The cash schedule assumes same-period receipts, excludes an upfront fixed pilot fee, and omits taxes, working capital, debt, capex, and financing fees, so actual revenue timing and runway may differ."
    - "Y3 revenue per year-end FTE is only $11.3K; this signals low utilization and is based on a very small forecast."
modelBasis:
  revenueFormula: "Average customers multiplied by annual ARPU and divided by 12 monthly or 4 quarterly; see A2-A5."
  customerRollForward: "customersEop equals customersBop plus newCustomers less churnedCustomers; fractional values are probability-weighted portfolio-equivalents; see A5-A6."
  payrollAndOpex: "salaryK sums loaded role payroll from A9-A14; functional expenses include that payroll allocation plus nonpayroll budgets from A15-A18 and sum to opexK."
  cashFormula: "cashEopK equals cashBopK plus ebitdaK plus financingInflowK; see A8 and A21-A24."
