slug: bankruptcy-notice-escrow
date: "2026-10-20"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: Model start month
    value: "2026-11"
    unit: YYYY-MM
    source: "[business-plan.yaml date 2026-10-20; model convention: start in the next full calendar month]"
  - id: A2
    name: Paying customer definition
    value: "One customer-equivalent is one active paid case portfolio under a continuity pilot or annual retainer; fractional customer-equivalents represent probability-weighted churn and ramp, not fractional legal entities."
    unit: portfolio equivalents
    source: "[business-plan.yaml businessModel.unitOfValue and gtm.pricing; model convention for low-volume expected customer counts]"
  - id: A3
    name: Annual revenue per active portfolio
    value: "Y1 annualized active-portfolio ARPU 7.5; Y2 12; Y3 15; no separate setup, activation, or pass-through postage revenue is modeled."
    unit: USDK per portfolio-year
    source: "[business-plan.yaml gtm.pricing and investorMemo.firstCustomer.initialContract; Y1 is within the $5K-$10K pilot range and later years within the $5K-$20K retainer range; rates are annualized planning assumptions, not validated pricing]"
  - id: A4
    name: Revenue recognition and collection timing
    value: "Monthly revenue equals average of beginning and ending customer-equivalents multiplied by annual ARPU divided by 12; quarterly revenue equals average monthly customer-equivalents multiplied by annual ARPU divided by 4; a pilot is modeled as monthly coverage revenue, not as an upfront fixed fee, and customer receipts and expenses are assumed in the recognition period."
    unit: calculation and timing convention
    source: "[business-plan.yaml businessModel and gtm.pricing; startup-finance planning convention; no contract billing or collection history exists]"
  - id: A5
    name: Paying customer ramp
    value: "0 at model start; 1 new paid pilot in M10, assumed to convert to an annual portfolio retainer by M18; quarter-end active portfolio-equivalents 1.2, 2.0, 2.4, and 3.0 in Y2; 3.5, 4.0, 4.5, and 5.0 in Y3."
    unit: active portfolio-equivalents
    source: "[business-plan.yaml gtm.funnelTargets, milestones, and killCriteria; research.yaml market.sam, market.som, and bottomUpSizingDrivers; forecast targets only, not pipeline or signed customers]"
  - id: A6
    name: Monthly customer churn
    value: "1.5"
    unit: percent per month
    source: "Startup-finance heuristic for an unvalidated, recurring B2B continuity service; research.yaml reportMemo.customerAndBuyer confirms no retention evidence, so churn is not observed."
  - id: A7
    name: Gross margin and direct cost rate
    value: "70% base gross margin; variable partner, secure-storage, and case-level delivery COGS equal 30% of revenue."
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct and operations; 30% COGS is the derived complement, not a measured vendor cost]"
  - id: A8
    name: Opening cash and current pre-seed financing
    value: "0 opening cash; 1250 financing in M1"
    unit: USDK
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd of $1M-$2M; model selects $1.25M from the stated range based on A21; financing is not committed]"
  - id: A9
    name: Hiring sequence and six-column FTE plan
    value: "CEO and founding engineer start M1; implementation and dispatch-partnerships lead starts M10 after the first paid pilot; second engineer starts M22 after repeatability; customer implementation lead starts M31 after four portfolio-equivalents; snapshots are 2, 2, 2, 3, 4, and 5 FTE at q1y1, q2y1, q3y1, q4y1, q4y2, and q4y3."
    unit: FTE and hiring schedule
    source: "[business-plan.yaml team, strategicChoices.sequencingRationale, product.sixMonth, and milestones; later hires are gated planning assumptions, not commitments]"
  - id: A10
    name: Founder and CEO loaded cash compensation
    value: "120"
    unit: USDK per FTE-year
    source: "Startup-finance planning heuristic for a lean pre-seed founder salary including employer burden; no compensation survey was used."
  - id: A11
    name: Founding engineer loaded cash compensation
    value: "150"
    unit: USDK per FTE-year
    source: "[business-plan.yaml team founding engineer role; internal startup-finance planning estimate including employer burden, not a market survey]"
  - id: A12
    name: Implementation and dispatch-partnerships lead loaded cash compensation
    value: "115"
    unit: USDK per FTE-year
    source: "[business-plan.yaml team implementation and dispatch-partnerships lead; internal startup-finance planning estimate including employer burden, not a market survey]"
  - id: A13
    name: Second engineer loaded cash compensation
    value: "150"
    unit: USDK per FTE-year
    source: "[business-plan.yaml product and security milestones; internal startup-finance planning estimate for a gated engineering hire including employer burden]"
  - id: A14
    name: Customer implementation lead loaded cash compensation
    value: "105"
    unit: USDK per FTE-year
    source: "[business-plan.yaml twelve-month and twenty-four-month onboarding goals; internal startup-finance planning estimate for a gated customer-operations hire including employer burden]"
  - id: A15
    name: Payroll allocation and salary presentation
    value: "CEO salary allocation: 25% S&M, 10% R&D, 65% G&A; founding and second engineers: 100% R&D; implementation-partnerships lead: 50% S&M, 50% G&A; customer implementation lead: 30% S&M, 70% G&A; salaryK is total loaded payroll, already included in functional OPEX."
    unit: allocation convention
    source: "[business-plan.yaml team and founder-led GTM; internal expense-allocation convention; salaryK is a memorandum line and is not added twice to OPEX]"
  - id: A16
    name: Nonpayroll sales and marketing budget
    value: "Y1 2 per month; Y2 5 per quarter; Y3 7.5 per quarter"
    unit: USDK per period
    source: "[business-plan.yaml gtm.channels, gtm.funnelTargets, and strategicChoices.sequencingRationale; lean founder-led outreach and travel planning heuristic, not a measured CAC budget]"
  - id: A17
    name: Nonpayroll research and development budget
    value: "Y1 10 per month; Y2 30 per quarter; Y3 35 per quarter"
    unit: USDK per period
    source: "[business-plan.yaml product.mvp, product.sixMonth, operations, and security milestones; internal planning estimate for secure file workflow, test tooling, and specialist support]"
  - id: A18
    name: Nonpayroll general and administrative budget
    value: "Y1 8 per month; Y2 22.5 per quarter; Y3 25 per quarter"
    unit: USDK per period
    source: "[business-plan.yaml operations and operatingAssumptions; internal planning estimate for outside bankruptcy counsel, security review, insurance, accounting, and administration]"
  - id: A19
    name: Fully loaded customer acquisition cost
    value: "Total three-year nonpayroll S&M of 74K plus 116.4375K attributed selling payroll, divided by 5.9859 gross new portfolio-equivalents, yields CAC of 31.8141K; selling payroll attribution is CEO 10%, partnerships lead 25%, and customer implementation lead 30% of loaded compensation."
    unit: USDK per new portfolio-equivalent
    source: "[business-plan.yaml founder-led GTM and team; derived from A5, A10-A16; sales-time shares are startup-finance heuristics and payroll is already in OPEX]"
  - id: A20
    name: Unit-economics formulas
    value: "Average life equals 1 divided by monthly churn; LTV equals Y3 annual ARPU divided by 12, multiplied by gross margin and divided by monthly churn; CAC payback equals CAC divided by monthly gross profit per portfolio; base outputs are 66.67 months life, 58.33K LTV, 1.83x LTV:CAC, and 36.36 months payback."
    unit: formula and derived metrics
    source: "Startup-finance unit-economics convention applied to A3, A6, A7, and A19; no product retention or acquisition history exists."
  - id: A21
    name: Pre-seed ask through the proof milestone and six-month buffer
    value: "Modeled net operating burn through M18 is 840.319K; M19-M24 net burn is 335.548K; the 18-month milestone plus six-month buffer requires about 1,175.867K, so the 1.25M ask leaves approximately 74.133K at M24 before a conditional follow-on."
    unit: USDK
    source: "[business-plan.yaml fundingAsk.runwayMonths and useOfFundsSummary; derived from A3-A9 and A15-A18; six-month buffer is explicitly reserved for post-milestone execution risk]"
  - id: A22
    name: Current pre-seed use-of-funds allocation
    value: "Engineering 43%; GTM 15%; G&A 15%; six-month buffer 27%, totaling 1.25M."
    unit: percent and USDM
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary priorities; internal budget allocation heuristic reconciled to A8 and A21]"
  - id: A23
    name: Conditional seed financing after proof
    value: "1500 financing at the start of M25, conditional on the M24 source-authority, paid-portfolio, and renewal milestones; not part of the current funding ask and not committed."
    unit: USDK and timing
    source: "[business-plan.yaml milestones for months 12-24 and 24-36; startup-finance follow-on planning heuristic; the downside case assumes no follow-on]"
  - id: A24
    name: Cash roll-forward convention
    value: "Cash EOP equals cash BOP plus EBITDA plus financing inflows; no debt, taxes, capex, working-capital timing, or financing fees are modeled."
    unit: calculation convention
    source: "Startup-finance planning convention; no balance-sheet or financing-fee data is provided in business-plan.yaml or research.yaml."
  - id: A25
    name: Downside case
    value: "First paid pilot slips to M18; 2 portfolio-equivalents by M24 and 3 by M36; annual ARPU stays 10K, gross margin is 60%, the implementation lead starts M19, later hires are deferred, nonpayroll S&M and R&D are cut after M18, and no seed is raised; derived Y3 revenue 22.09K, EBITDA -551.746K, and cash low point -365.857K."
    unit: scenario
    source: "[business-plan.yaml killCriteria, operatingAssumptions, and milestones; conservative stop/go response to no paid pilot and no renewal]"
  - id: A26
    name: Upside case
    value: "Pilot begins M9; portfolio-equivalents reach 8 by M36; annual ARPU reaches 20K and gross margin 75% in Y3; hiring stays on the base schedule and the conditional M25 seed closes; derived Y3 revenue 128.097K, EBITDA -761.427K, and cash low point 91.013K."
    unit: scenario
    source: "[business-plan.yaml gtm.pricing, businessModel.targetGrossMarginPct, market.som, and milestones; optimistic but bounded sensitivity, not validated demand]"
  - id: A27
    name: Sensitivity case conventions
    value: "One variable changes at a time; downside impacts are measured against the base forecast; sales cycle moves the customer schedule by one quarter; churn holds gross additions fixed; CAC holds acquisitions fixed; hiring shifts all gated hires by one quarter; cash impact is the modeled ending-cash difference through M36."
    unit: sensitivity method
    source: "Model calculation convention using A5-A24; sensitivity values are planning tests, not observed outcomes."
  - id: A28
    name: Sanity metric definitions and directional heuristics
    value: "Rule of 40 is Y3 revenue growth plus Y3 EBITDA margin; burn multiple is Y3 EBITDA cash burn divided by net new exit ARR; revenue per FTE uses Q4Y3 FTE; generic early SaaS planning heuristics are 3x LTV:CAC, under 18-month CAC payback, and 200K-400K annual revenue per FTE."
    unit: formulas and directional benchmarks
    source: "Named generic startup-finance heuristics only; no web research or company-specific benchmark is claimed."
