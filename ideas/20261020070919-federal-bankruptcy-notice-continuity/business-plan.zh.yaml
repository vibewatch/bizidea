slug: bankruptcy-notice-escrow
date: "2026-10-20"
executiveSummary: >-
 2026 年十月 Bankruptcy Noticing Center (BNC) 中断，是运营痛点的直接证据：联邦司法系统称，破产申请仍在继续，但通知制作和分发已经停止。Maryland（马里兰州）法院十月 19 日的 FAQ 表示，恢复时间尚不确定，并提醒 CM/ECF 查询可能漏掉通过 BNC EBN/NCRS 注册的地址。案卷条目或单一电子名单都不能证明送达已完成。滩头市场是服务多个案件的美国破产债权主张管理或通知服务商，愿意在一个获授权的 Chapter 11 案件中测试连续性方案；其 COO 或运营负责人担任业务预算发起人，案件决定权仍由适当主体掌握。产品保留经批准的通知和收件人来源版本，将差异交由人工处理，并演练独立发送交接；未经具体案件授权，不会发送通知。这个切口比通用备份更聚焦：它能证明收件人来源可追溯，也能证明交接获授权；但现有厂商已在发送通知，也可能打包提供同等控制。研究按未经验证的案件份额和定价假设，估算可服务市场为 $6.0M；未发现专门针对连续性服务的预算、相关访谈或采购承诺。取得完整收件人来源的合法访问权、备用方案批准和付费需求得到验证前，这仍是 Watch 级机会。前 18 个月应投入验证这些条件、打造安全的单案件产品，而非铺开集成或拓展相邻市场。
problem:
  - "联邦司法系统报告称，2026 年十月事件期间，BNC 的通知制作和分发停止，但案件申请仍在继续。"
  - "法院指引提及人工比对名单，并提醒法院生成的名单可能漏掉在 BNC 注册的 EBN/NCRS 地址及其他必需当事方。"
  - "再建一份敏感收件人数据仓库，可能造成数据过时或增加暴露风险；技术上可用的备份渠道，也不代表具体案件已授权使用。"
solution:
  - "只导入客户授权的通知文件和收件人导出数据；在加密、按案件隔离的容器中保留来源、时间戳和版本溯源信息。"
  - "以确定性规则比对获授权的数据源，把差异交给人工处理；不推断缺失地址，也不悄悄改动通知数据。"
  - "演练向独立签约的通知合作方导出数据并交接，记录授权、发送尝试和可取得的送达证据。"
  - "在案件决定方与律师记录获准的通知范围、启用角色和渠道之前，始终关闭实时发送功能。"
whyWeWin:
  - "产品直指此次中断暴露的问题——获授权数据源之间的收件人是否完整，而非泛化的在线率告警或备份归档。"
  - "独立于供应商的存储，加上演练过的备用交接，可以降低对中断主路径的依赖，同时保留人工审核和案件决定权。"
  - "来源版本和异常处理记录可能成为有价值的运营资产，但这套组合还不是已验证的护城河：竞争对手的公开页面无法证明现有厂商私下具备 BCP 能力，现有厂商也能打包提供类似控制。"
strategicChoices:
  beachhead: "服务多个案件的美国破产债权主张管理或通知服务商；先选一个复杂的 Chapter 11 案件组合，并挑出一个能提前谈妥授权收件人来源和备用流程的案件。"
  wedgeRationale: "BNC 中断和 Maryland（马里兰州）关于法院名单可能漏掉已注册地址的警示，让收件人核对成为紧迫且可衡量的工作；先做单案来源覆盖测试和桌面演练，无需替换债权主张管理系统，也不必要求法院采用新的全国性平台。"
  sequencingRationale: "先与代理商、律师和案件决定方确认合法来源访问权及书面启用标准；再开发基于文件的核对流程，并与独立发送合作方进行桌面演练。等安全控制可重复、付费续约得到验证后，再投入 APIs、更广泛的销售或增员。"
  notYet:
    - "不替代 BNC、常规债权主张管理或现有通知制作流程。"
    - "不自动更正地址、不作法律解释，也不在未记录案件专项授权时实时发送通知。"
    - "不把联邦法院采购作为初始渠道；先做由私人代理商赞助的试点，不预设法院会在全国范围批准。"
    - "在破产业务证明付费续约、且各相邻项目的授权得到独立验证前，不进入个人破产、国际案件或其他法律通知项目。"
market:
  tam: "$39.7M 理论年度案件群体价值：7,940 起 2025 自然年商业 Chapter 11 申请 × 假设每个等效案件 $5,000；这只是市场规模代理值，并非实际连续性支出或收入预测。"
  sam: "$6.0M 估算值：按未经验证的 15% 可服务份额（约 1,191 个等效案件）乘以同一假设代理值 $5,000；拥有可触达买家的复杂案件在全国所占份额尚不清楚。"
  som: "$0.2M 示意情景：估算 SAM 的 3%，即按假设代理值 $5,000 计约 36 个等效案件；采用率、案件覆盖范围、合同期限和付费意愿均未验证。"
  segments:
    - "管理案件量大或流程复杂的 Chapter 11 收件人工作的多案件破产债权主张与通知服务商。"
    - "聘请代理商处理案件、且需要为获授权案件留存通知连续性记录的债务人、受托人或案件管理团队。"
  buyingProcess: "代理商的 COO 或运营负责人可在承接新的多案件业务、开展连续性审查或续约时发起试点，但律师及案件命令指定的当事方必须批准备用方法和启用规则。各地留存要求不同；Rhode Island（罗得岛州）的三份提案及费用披露流程只是一个例子，并非全国采购规则。"
product:
  mvp: "托管式单案工作流：接收客户授权的文件导出，封存带版本的通知和收件人来源快照，生成确定性核对报告，并把异常交给操作人员处理。产品还包含向独立发送合作方导出文件的桌面演练和可审计的授权日志；没有书面案件授权，就不能实时发送。"
  sixMonth: "支持一家试点服务商的一个案件：明确文件格式，追踪数据来源，以加密方式存储（可选客户自管密钥），由人工处理异常，并量化记录桌面交接；数据访问条款得到验证前，暂缓开发 APIs。"
  twelveMonth: "为少量代理商案件组合建立可重复的客户导入流程，配备按案件隔离的访问、留存与删除控制、安全审查、核对指标，以及一家已验证的独立发送合作方；不自动发出通知。"
  twentyFourMonth: "只有付费续约和授权路径得到验证后，才将多案件控制产品化，并通过付费可行性试点测试一种额外的法院批准通知流程；否则继续只做破产业务，或停止项目，不要打造泛化的法律连续性平台。"
  keyBets:
    - "愿意合作的代理商能够依法导出案件所需的完整授权来源集，包括 CM/ECF 中不可见的注册收件人。"
    - "即使 BNC 主服务已恢复，人工审核的核对结果和有日期记录的演练仍有足够价值，能让客户付费。"
    - "独立发送合作方可以提供适用于具体案件的送达证据，同时不造成新的权威记录冲突。"
    - "客户自管密钥、最少留存字段和按案件删除，能够通过律师及安全审查，且实施成本不会高得难以接受。"
gtm:
  wedge: "由创始人主导销售，为多案件债权主张或通知服务商提供付费单案连续性试点；利用现有业务委托、事后复盘或连续性审计，在开发集成前确认业务发起人、数据来源权限和备用方案审批。"
  channels:
    - "创始人直接联系债权主张与通知服务商的 COO 和通知运营负责人；Administrative Office（美国法院行政办公室）的核准服务商名单可用于寻找潜在客户，但名单本身不证明具体案件已获授权。"
    - "通过重组律师、债权主张代理商的流程顾问和连续性顾问引荐相关案件决策人。"
    - "与能够提供送达证据的核准纸质或电子通知合作方共同设计方案并建立推荐合作。"
  funnelTargets: "前 6 个月的运营假设：8 场合格代理商会谈 -> 3 次数据来源与授权范围评估 -> 1 个付费单案试点；在完成两个试点后才开始测算，目标是至少 50% 的已完成付费试点转为年度服务合同。"
  pricing: "测试 $5k–$10k 的付费单案试点，再按覆盖案件年数和通知量分档收取年度案件组合服务费，另加预先约定的启用费。$5k–$20k 的年度案件组合价格区间是运营假设，大致相当于一个至四个每案 $5,000 的市场规模估算基准，并非经研究验证的市场定价；启用费只涵盖获授权的协调工作，本身不构成法律授权。"
businessModel:
  revenueStreams:
    - "按案件组合收取年度连续性服务费，根据活跃覆盖案件年数和通知量分档。"
    - "一次性案件导入费和定期桌面演练费。"
    - "经授权后收取预先约定的启用与发送协调费；外部邮资或履约费用转嫁给客户，不计作软件收入。"
  unitOfValue: "一个覆盖案件年：其授权收件人来源已完成核对、异常已有处置结论，并通过案件批准的备用交接演练。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "在续约中的代理商案件组合内增加活跃案件年数和通知量档位。"
    - "标准化客户导入和定期桌面演练，降低每案实施工时。"
    - "仅在客户和案件决定方批准渠道时，增加其他核准发送合作方。"
    - "只有破产业务续约证明预算和交付模式可复制后，才测试相邻的法院批准通知项目。"
strategyMap:
  northStarMetric: "活跃覆盖案件组合中，按计划完成端到端演练、已核对全部授权来源记录，且每项异常均已解决或明确处置的占比。"
  inputMetrics:
    - "试点案件中，获准从案件协议列明的每个数据源导出数据的占比。"
    - "具备来源和版本溯源信息的收件人记录占比；未解决异常的数量和存续时间。"
    - "核对数据源变更的中位耗时，以及从获授权启动桌面演练到首次交接给合作方的用时。"
    - "付费试点转化率、年度服务合同续约率，以及每位续约客户覆盖的案件年数。"
  moatsToBuild:
    - "经授权的运营记录，涵盖来源版本、已解决异常、审批和演练结果；不得在不同客户间复用受案件约束的收件人数据。"
    - "可信的实施手册，覆盖案件专项授权、核对、证据留存和删除。"
    - "独立发送合作方的就绪度和经过测试的交接；仅能联系合作方不构成法律授权。"
  killCriteria:
    - "到第 90 天，若 3 家目标代理商中能指出所有单案所需收件人来源合法导出路径的少于 2 家，就停止主张收件人名单完整。"
    - "截至第6个月，若没有案件决定方或律师愿意为试点书面确认可接受的桌面演练和实时启用流程，就暂停发送切口。"
    - "到第 6 个月，若与 5 位合格买家讨论价格后，仍无人接受至少 $5,000 的付费试点，就不要招聘 GTM 人员或扩大产品范围。"
    - "截至第12个月，若前 2 个已完成试点均未转为付费年度服务合同，或三位目标买家中有两位表示现有厂商已包含同等控制且不另收费，就重新评估独立经营的经济性。"
    - "若独立安全审查发现尚未解决的严重暴露风险，或客户拒绝拟议的客户自管密钥和删除方案，就停止处理生产收件人数据。"
  mermaid: |
    flowchart LR
      Wedge[One authorized Chapter 11 case] --> MVP[Versioned recipient capsule and reconciliation]
      MVP --> Proof[Source coverage and approved tabletop handoff]
      Proof --> Renewal[Paid portfolio retainer and repeat exercises]
      Renewal --> Expansion[Additional portfolios; adjacent program only after proof]
investorMemo:
  verdict:
    call: Watch
    conviction: "低至中等：工作流缺口有记录佐证，但买方预算、法律授权和独立来源访问权仍未得到验证。"
    whyBelieve: "联邦通知服务中断，以及法院对收件人名单缺漏的警示，为范围明确的连续性控制提供了具体依据。"
    whyDoubt: "估算的 $6.0M SAM 依赖未经验证的假设；一体化现有厂商可能已有或能打包提供故障切换，无需客户另行采购。"
    nextDiligence: "在为更广泛的产品开发提供资金前，要求一家代理商提供获准使用的数据源集，并取得针对付费桌面演练的书面案件授权标准。"
  firstCustomer:
    title: "美国多案件 Chapter 11 债权主张与通知服务商"
    profile: "一家管理数起联邦案件的服务商，由 COO 担任发起人，通知运营团队愿意使用客户授权的数据源导出，测试一个复杂案件。"
    trigger: "承接新的多案件业务、连续性审计、续约或事后复盘时，需要证明收件人名单完整，并演练备用方案。"
    buyer: "破产债权主张或通知服务商的 COO 或运营负责人"
    initialContract: "待验证的假设：$5k–$10k 的付费单案试点，可抵扣 $5k–$20k 的年度案件组合服务费；价格按覆盖案件年数和业务量分档，只有获授权的桌面演练成功后才续约。"
  mustBeTrue:
    - "受访目标代理商中至少 2 家（共 3 家）能够依法导出一个案件所需的全部收件人来源，包括已注册的通知收件人。"
    - "案件决定方和律师会在任何实时发送前，书面确认获准的备用渠道、启用角色和证据标准。"
    - "与 5 位合格 COO 的价格讨论中，至少有 1 场促成金额不低于 $5,000 的付费试点，且不将试点打包进常规通知费用。"
    - "至少 1 家独立合作方能够完成桌面交接并提供可追溯的送达证据，同时在主路径恢复时防止重复或冲突通知。"
    - "可触达的覆盖案件年数和续约率，足以支撑超出示意性 $0.2M SOM 情景的经常性业务，或另一个经过独立验证的相邻市场。"
  diligenceQuestions:
    - "哪份授权来源包含 BNC EBN/NCRS 收件人数据？停机前，代理商实际上能取得哪些导出权限和来源溯源信息？"
    - "每个目标案件中，谁有权预先批准并启用备用方案？命令中的哪些措辞或通知方式是必需的？"
    - "BNC 和主要债权主张代理商私下已维护哪些恢复控制和经过测试的收件人快照？"
    - "COO 愿意单独支付年度连续性服务费吗？还是必须将服务纳入现有代理商费用或经法院批准的委托？"
    - "每年有多少案件年符合复杂度和外部代理商标准？有哪些独立证据支持的相邻市场可以扩大这个上限？"
operatingAssumptions:
  - assumption: "目标代理商能够提供法律允许、带版本信息的导出文件，涵盖某个覆盖案件所需的全部收件人来源。"
    basis: research.yaml
    validationTest: "在 90 天内检查 3 家代理商提供的脱敏导出文件和权限；与案件协议要求逐项比对，并确认其中是否包含已注册收件人的记录。"
    decisionImpact: "若无法访问来源或来源不完整，就停止宣称能够确保收件人完整，也不要只依赖 CM/ECF 构建发送产品。"
  - assumption: "案件决定方会批准经过演练的备用渠道，并明确谁可以启用。"
    basis: research.yaml
    validationTest: "审阅 3 份近期保留令，并从破产律师和一位案件决策人处取得书面的桌面演练及启用标准。"
    decisionImpact: "若不存在授权路径，就把产品仅限于非紧急核对，并重新评估是否有买家愿意为此付费。"
  - assumption: "服务商愿意为独立的连续性控制付费，而非依赖现有厂商恢复服务或将其计入常规通知费用。"
    basis: operator judgment
    validationTest: "与 5 位 COO 进行结构化价格讨论，报价为 $5k–$10k 的付费试点，并争取由预算负责人签署一个试点。"
    decisionImpact: "若无人接受付费试点，就停止独立 GTM 投入；只有在经济性和供应商独立性仍可信时，才考虑由现有厂商打包销售。"
  - assumption: "商业 Chapter 11 案件中，复杂且可触达的份额为 15%，每个等效案件 $5,000 的市场规模代理值也具有方向性参考价值。"
    basis: research.yaml
    validationTest: "通过 3 家代理商审阅 20 起近期案件，了解案件规模、收件人来源复杂度、是否使用外部代理商及实际委托费用构成；用合同实证替代估算基准。"
    decisionImpact: "若符合条件的案件更少，或合同金额无法支撑该代理值，就下调可服务市场估算，不要为广泛的独立平台融资。"
  - assumption: "敏感案件数据可通过客户自管密钥选项、最短留存期限和可接受的独立安全审查来处理。"
    basis: operator judgment
    validationTest: "与代理商安全团队和案件律师梳理试点数据流；参照 NIST CSF 2.0 完成威胁审查，并取得对访问、删除和事件处理流程的书面认可。"
    decisionImpact: "若安全方案被否决，或整改成本与试点规模不相称，就不要托管生产收件人数据。"
experimentRoadmap:
  - horizon: 0–90 天
    experiment: "访谈 5 位 COO 或运营负责人和 3 个通知运营团队；请每位受访者梳理现行 BCP、收件人来源、停机应对办法，以及谁负责连续性预算。"
    hypothesis: "至少 3 家目标代理商存在有记录的名单完整性或恢复缺口，且现有 BCP 无法解决。"
    successMetric: "5 位买家受访者中有 3 位能说明一个具体未解决工作流，并指出预算负责人；少于 2 位即为停止信号。"
    owner: 创始人/CEO
  - horizon: 0–90 天
    experiment: "与破产律师和一家代理商审阅三份案件协议或保留令；起草针对具体案件的桌面演练和实时启用清单。"
    hypothesis: "代理商和案件决定方能够明确获准的备用方案，且不把产品视为通知送达方。"
    successMetric: "取得一份书面桌面演练方案，明确授权方、适用通知、渠道、防止重复通知的措施和证据要求。"
    owner: "破产法律运营负责人及外部律师"
  - horizon: 0–90 天
    experiment: "向三家代理商索取经许可的脱敏收件人导出文件，并比对来源覆盖、标识符、时间戳和异常。"
    hypothesis: "基于文件的工作流无需 BNC API 或未记录的抓取操作，也能核对获授权的数据源。"
    successMetric: "两家代理商能够证明导出权，并展示一个案件的可重复核对流程；否则停止主张名单完整。"
    owner: 创始工程师
  - horizon: 3–6 个月
    experiment: "基于一个脱敏案件数据集，搭建最简加密容器和人工审核的异常报告；请安全审查人员检查数据流。"
    hypothesis: "范围精简、基于文件的 MVP 能保留来源溯源信息，并揭示缺失或冲突的收件人，同时不改动法律数据。"
    successMetric: "约定来源范围内的所有记录均有来源溯源信息；桌面演练签核时没有未解决的严重异常；没有尚未处理的严重安全问题。"
    owner: "创始工程师和兼职安全评估人员"
  - horizon: 3–6 个月
    experiment: "与一家独立核准通知合作方和代理商运营团队进行限时导出演练；演练主路径恢复和防止重复通知。"
    hypothesis: "合作方能够接收案件数据容器，并在书面案件流程规定的时间内返回证据，达到实际运营所需的速度。"
    successMetric: "完成一次有记录的完整交接演练，并达到案件协议规定的时限和证据目标；实时使用前，记录所有无法采取行动的缺口。"
    owner: "合作伙伴负责人和代理商运营发起人"
  - horizon: 6–12 个月
    experiment: "向符合条件的服务商提供付费单案试点；前提是数据来源权限、安全认可和书面桌面演练授权均已落实。"
    hypothesis: "新闻热度消退后，至少一家服务商仍愿意单独为连续性准备工作付费。"
    successMetric: "签下金额至少 $5,000 的一个试点；若向 5 家合格服务商报价后仍无成交，就停止招聘并重新评估独立经营模式。"
    owner: 创始人/CEO
  - horizon: 12–18 个月
    experiment: "续约时向试点买家展示核对和演练的量化结果；根据实际覆盖案件年数和支持工作量测试年度案件组合定价。"
    hypothesis: "成功的单案试点能够转为持续的案件组合覆盖，而非一次性事件响应。"
    successMetric: "前 2 个已完成试点中至少有 1 个签署年度服务合同，并约定续约和演练日程。"
    owner: "创始人/CEO 和实施负责人"
operations:
  - "采用最小权限和按案件隔离的访问控制；对传输中和静态存储的数据加密；提供客户自管密钥管理；记录每次导出、查看、审批和交接。"
  - "只保留获授权案件协议所需字段，设定案件专属删除日期，并提供可验证的删除记录；不得跨案件挪用收件人数据。"
  - "保留来源名称、时间戳、版本、哈希值和异常处置结果；不匹配项必须人工审核，禁止悄悄更正地址。"
  - "与一家独立通知合作方签约，明确测试义务、容量、发送证据和恢复协调；核实其核准身份，但仍须另行取得案件授权。"
  - "按计划进行桌面演练，并在启用前完成恢复和防止重复通知检查；区分发送尝试的证据与每位收件人均已收到通知的证明。"
  - "将 NIST CSF 2.0 作为数据流风险管理参考；处理生产数据前，取得外部安全专家和破产律师审查。"
team:
  - role: 创始人/CEO
    startTiming: "第 0 个月"
    rationale: "在买家范围狭窄的市场，必须由创始人主导销售；扩充团队前，CEO 必须拿下代理商支持、律师接洽渠道、试点预算和合作方协议。"
  - role: 创始工程师
    startTiming: "第 0 个月"
    rationale: "负责安全导入、确定性核对、带版本的案件数据容器、访问控制和审计证据；客户导出权限明确前，不开发 APIs。"
  - role: "破产法律运营负责人（兼职）"
    startTiming: "第 0 个月"
    rationale: "梳理案件命令、授权来源、送达方式和代理商工作流；经常性需求得到证明前，采用兼职运营人员和外部律师。"
  - role: "安全与隐私评估人员（兼职）"
    startTiming: "第 1–3 个月"
    rationale: "在托管生产收件人数据前，审查第二份数据仓库的威胁模型、密钥处理、留存和事件流程。"
  - role: "实施与发送合作伙伴负责人"
    startTiming: "第 6–9 个月，仅在付费试点之后"
    rationale: "首位买家验证工作流后，再标准化客户导入和合作方演练；不要针对未经验证的市场招聘大规模销售团队。"
milestones:
  - horizon: 0–12 个月
    items:
      - "到第 90 天，完成 5 场买家访谈、检查 3 个授权来源工作流，并落实一条书面桌面演练审批路径。"
      - "截至第6个月，在一个脱敏案件中展示来源溯源核对，并完成安全审查且没有未解决的严重问题。"
      - "截至第9个月，与一家独立合作方完成一次限时交接演练，并测试主路径恢复时防止重复通知的措施。"
      - "截至第12个月，签下一份金额至少 $5,000 的付费试点合同，落实案件专项授权，并明确是否转为年度服务合同的决策标准。"
  - horizon: 12–24 个月
    items:
      - "只有至少一个试点转为年度服务合同、且每案实施工时持续下降，才拓展到 3 个付费案件组合。"
      - "完成两次预定的案件组合演练，记录来源覆盖情况和异常解决耗时，并取得至少一次付费续约。"
      - "用续约情况和实际案件定价替代 $5,000 的市场规模代理值；增加集成前重新估算可触达市场。"
      - "若两个试点均未转化，或逐案授权持续无法落实，就暂停增长招聘，并决定停止项目还是通过现有厂商销售。"
  - horizon: 24–36 个月
    items:
      - "只有破产业务续约和合作方运营达到目标毛利率，才在另一个获批的法院通知项目中开展付费可行性试点；否则继续聚焦或停止。"
      - "根据已签经常性收入、获授权的可服务案件年数、续约情况和人工支持工时设定扩张门槛；不得把相邻市场说成已验证的 TAM。"
      - "任何新司法辖区的隐私、采购和送达方式要求得到独立审查前，业务仅限美国境内。"
risks:
  - risk: "完整的授权收件人名单，尤其是 BNC EBN/NCRS 注册数据，可能无法在中断前导出或独立留存。"
    likelihood: High
    impact: High
    mitigation: "写集成代码前，与三家代理商验证权限和样本导出；记录来源缺口，绝不只凭 CM/ECF 宣称名单完整。"
  - risk: "案件决定方可能不愿预先批准独立备用方案或其启用条件。"
    likelihood: High
    impact: High
    mitigation: "把案件专项书面批准设为试点门槛；先做桌面演练，在适当决定方批准前保持实时发送关闭。"
  - risk: "运营人员承认风险存在，却不愿购买单独的连续性服务合同。"
    likelihood: High
    impact: High
    mitigation: "招聘 GTM 团队前，先与明确的预算负责人测试付费试点；比较独立定价与纳入代理商费用两种方式，若都无法支撑经常性业务就停止。"
  - risk: "成熟的债权主张代理商或通知服务商已打包同等控制，或提供私有故障切换，使独立供应商变得多余。"
    likelihood: Medium
    impact: High
    mitigation: "向现有厂商索取演练证据；只有在跨服务商来源溯源和授权记录得到独立验证时才据此定位；若保持独立仍有价值，再探索许可或打包模式。"
  - risk: "新增的敏感收件人数据仓库带来无法接受的安全、隐私、留存或来源冲突风险。"
    likelihood: Medium
    impact: High
    mitigation: "尽量减少存储字段，采用按案件隔离的访问和客户自管密钥，核对来源版本，完成独立安全审查，并严格执行案件专属删除。"
  - risk: "停机事件发生频率低，客户容易推迟准备工作，导致细分市场小到难以支撑风险投资级别的业务。"
    likelihood: High
    impact: High
    mitigation: "将演练纳入案件导入和续约流程，衡量付费转化和续约，验证实际案件年数；没有独立付费证据前，不为相邻市场扩张提供资金。"
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$1–2M"
  runwayMonths: 18
  useOfFundsSummary: "运营目标，并非已完成的财务模型：18 个月资金将用于打造安全的文件式 MVP、聘请兼职破产律师和安全审查人员、接入一家独立发送合作方，并由精简创始团队开展 1–2 个获授权的付费试点及续约测试。在买家需求、数据访问和授权门槛得到验证前，不用于联邦法院全国采购、大规模 API 集成或相邻市场扩张。"
