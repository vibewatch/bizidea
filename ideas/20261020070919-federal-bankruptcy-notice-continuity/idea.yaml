jobsToBeDone:
  - job: >-
      When a notice provider is interrupted while a bankruptcy case continues to move, help notice-operations leads verify the intended recipient set and resume authorized distribution, so they can avoid omissions and document the handoff.
    currentAlternative: >-
      Rely on the existing notice path or compare address lists manually during an interruption.
    successMetric: >-
      Share of authorized recipients reconciled before dispatch, time from authorized activation to first dispatch, and proportion of dispatches with complete evidence.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      It makes an independently held, recipient-complete legal notice capsule—not a generic system backup—the unit of continuity, with a human-reviewed reconciliation and authority-gated dispatch.
  venturePotential:
    score: 4
    rationale: >-
      A portfolio retainer could scale across multi-case noticing providers and adjacent legal notice workflows, but court relationships and a narrow initial buyer set constrain near-term expansion.
  whiteSpace:
    score: 4
    rationale: >-
      The historical index contains a provider-outage restore reserve, but no idea combines case-recipient completeness, legal notice evidence, and authority-gated alternate dispatch.
  painIntensity:
    score: 5
    rationale: >-
      The cited incident halted nationwide federal bankruptcy notice production and distribution while filings continued, and the workaround raised a recipient-omission concern.
  wedgeClarity:
    score: 4
    rationale: >-
      A one-portfolio pilot can measure reconciliation and dispatch readiness, though authorized recipient feeds and alternate channels must be agreed before launch.
  evidenceFit:
    score: 5
    rationale: >-
      The government source confirms the BNC disruption, and two independent reports describe stopped notices, manual list comparison, and possible recipient gaps.
topRisks:
  - name: Alternate-channel authority
    description: >-
      A technically available route may not be an approved means of serving notice for a particular case.
    mitigation: >-
      Configure each pilot with the relevant case authority and counsel, and block dispatch unless the recorded activation approval is present.
  - name: Recipient-data accuracy
    description: >-
      Stale, inconsistent, or sensitive recipient records could make the capsule incomplete or create privacy exposure.
    mitigation: >-
      Preserve provenance for each authorized source, encrypt case data with customer-controlled key options, and require human resolution of mismatches.
  - name: Slow procurement and adoption
    description: >-
      Court procurement and incumbent dependencies may delay approval of an independent continuity service.
    mitigation: >-
      Start with a private multi-case noticing provider able to sponsor a bounded pilot, while validating the approval path for every covered case.
