differentiator: >-
  This is a legal-service continuity product, not a replica of the underlying notice system: its unit of recovery is the case-level pairing of approved notice content, the full authorized recipient set, and an explicit dispatch record. Recipient discrepancies are routed to a human operator, and alternate transmission is gated on case authority. That narrow mechanism distinguishes it from generic backup storage and alerting.
conceptDiagram:
  title: Case-level notice continuity
  mermaid: |
    flowchart LR
      CaseSources[Authorized case sources] --> Capsule[Signed recipient and notice capsule]
      Capsule --> Reconcile[Compare lists and resolve exceptions]
      Reconcile --> Ready[Rehearsed alternate dispatch]
      Authority[Case authority] --> Activate[Explicit fallback authorization]
      Ready --> Activate
      Activate --> Dispatch[Independent notice dispatch]
      Dispatch --> Evidence[Dispatch and delivery evidence]
