championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: 2026 年十月的中断暴露了这一论点要解决的具体完整性缺口：马里兰州法院提醒，CM/ECF 中的债权人和当事人名单可能漏掉通过 BNC EBN/NCRS 登记的地址，而且仅有案卷记录并不能证明 BNC 已完成送达。
      sourceRefs:
        - 3
        - 4
    - point: 公开竞品资料介绍了债权主张管理、名单整理、纸质/电子通知、追踪和送达证明，却没有提到以下组合：独立保存的案件级收件人资料包、基于来源凭证的核对、演练过的备用发送，以及明确的启动授权。
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
    - point: 连续性保障的具体目标，不是笼统的备份或中断告警：而是在获批转交备用渠道前，证明已核对所有获准使用的收件人来源，并覆盖该案件授权的收件人集合。
      sourceRefs:
        - 2
        - 3
        - 20
  evidenceAgainst:
    - point: 各个关键环节本身并不新：法院和商业服务商已经管理收件人数据，通过纸质和电子渠道发送通知、追踪邮件，并出具送达证明。
      sourceRefs:
        - 5
        - 6
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
    - point: 行政办公室的获批通知服务商名单上有 20 多家机构，因此更换服务商或增加第二家服务商本来就是可选方案；但列入名单不代表服务商获准处理每个案件或每位收件人。
      sourceRefs:
        - 6
        - 7
        - 20
    - point: 没有公开证据证实债权主张代理缺少内部灾难恢复、收件人快照或私有故障切换安排。公开资料没有介绍某项功能，并不能证明该能力独一无二或构成可守住的护城河。
      sourceRefs:
        - 11
        - 12
        - 13
        - 20
  revisedClaim: 可能真正特别之处，在于一种不依赖单一服务商的连续性控制：保留收件人来源凭证，核对案件授权的收件人集合，并且只有记录明确授权后才允许改由备用渠道发送。此次中断让这一工作流变得具体，也显得少见；但相邻的通知能力早已存在，方案是否独特、是否有独立连续性预算仍未得到验证。
evidenceQuestions:
  - question: 痛点是否真实存在，且已有预算？
    status: answered-with-gap
    finding: 痛点当前存在，后果也很严重：司法系统表示 BNC 的通知制作和分发已经停止；截至十月 19 日，法院 FAQ 仍称恢复日期未知。常规通知服务有付费，但没有找到独立连续性预算或购买承诺。
    sourceRefs:
      - 1
      - 3
      - 15
      - 20
  - question: 拟议机制是否确实少见？
    status: mixed
    finding: 查阅的服务商公开页面没有介绍完整组合，但名单管理、收件人核验、纸质/电子送达、追踪和送达证明都已存在。公开资料无法证明没有现有厂商私下运营连续性项目。
    sourceRefs:
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
  - question: 现有直接竞品和替代方案有哪些？
    status: answered
    finding: 直接服务商包括 Stretto、Epiq、Verita、BMC Group 和 Key Dynamics。联邦 BNC、其他获批通知服务商、其他债权主张代理、本地 CM/ECF 查询以及人工送达，都是重要替代方案。
    sourceRefs:
      - 5
      - 6
      - 11
      - 12
      - 13
      - 14
      - 15
  - question: 为什么现有厂商不会默认胜出？
    status: answered-with-gap
    finding: 法院熟悉度、一体化团队、资质审批以及现有纸质/电子运营能力，往往让现有厂商默认胜出。此次中断和不完整名单的应急方案说明，跨服务商连续性层可能有用；但没有证据表明现有厂商缺少私有备份，或无法自行增加这项功能。
    sourceRefs:
      - 1
      - 3
      - 6
      - 11
      - 12
  - question: 从既定滩头市场可触达多大市场？
    status: answered-with-estimates
    finding: 按案件量估算，若每个商业第 11 章案件等价单位按假设的 $5,000 计，理论年度 TAM 为 $39.7M；假设复杂且买方可触达的案件占 15%，SAM 为 $6.0M；若取得 3% 份额，SOM 为 $0.2M。这些假设不是实际价格或采用数据，因此尚不能证明仅凭这一滩头市场就能达到风险投资级规模。
    sourceRefs:
      - 9
      - 10
      - 20
      - 22
  - question: 哪些监管、采购、集成或行为因素会阻碍采用？
    status: answered
    finding: 案件特定的通知规则、采用备用方式的授权、获取 BNC 登记地址、本地法院留存规定、代理机构竞争性遴选、敏感收件人数据，以及不愿维护第二份事实来源，都是实质性阻碍。
    sourceRefs:
      - 3
      - 7
      - 8
      - 18
      - 19
      - 20
      - 24
  - question: 哪些情况会推翻这一概念？
    status: answered
    finding: 如果目标运营方无法在事故发生前合法导出或核对完整的授权收件人集合、法院不愿预先批准备用渠道、现有厂商的故障切换已满足买家需求，或服务商不愿在现有通知工作之外单独为连续性控制付费，这一概念就站不住脚。
    sourceRefs:
      - 3
      - 6
      - 7
      - 20
  - question: 证据是否支持所声明的创意新颖性筛选维度？
    status: answered-mixed
    finding: 此次事件让问题与机制形成鲜明匹配，公开竞品介绍也未提到这种受授权门槛控制的收件人资料包。但证据支持的是一种工作流组合，而不是已证实的品类首创；最恰当的判断是喜忧参半。
    sourceRefs:
      - 3
      - 6
      - 11
      - 12
      - 13
      - 15
reportMemo:
  executiveTakeaways:
    - 全国性服务中断有力证明了运营痛点的急迫性：BNC 停止制作通知，但法院事务仍在推进；马里兰州法院十月 19 日 FAQ 称，服务何时恢复仍未知。
    - 最有说服力的证据指向收件人完整性，而不是泛泛的系统在线率：官方应急指引警告，法院名单可能漏掉 BNC EBN/NCRS 地址和其他必需通知对象。
    - 相邻商业服务已经覆盖通知、债权主张管理、名单处理、打印、地址核验、追踪和送达证明。产品必须证明自己能独立核实收件人来源，并提供经法院授权的备用渠道，而不是把现有功能重新包装。
    - 谁来买单仍未得到证明。公开的通知邮寄收费和法院批准的债权主张代理聘用表明相邻服务已有支出，却不能证明另有连续性服务年费预算。
    - 按保守的案件等价假设测算，美国商业第 11 章这一窄滩头市场似乎不大；法院批准的相邻通知项目只是规模扩张假设，不属于已验证的初始市场。
  marketDefinition: 目标市场是美国联邦破产通知运营的连续性保障，不是一般灾难恢复或法律软件。联邦 BNC 为所有联邦破产法院制作并发送通知。Epiq AACER 报告称，2025 日历年有 7,940 起商业第 11 章申请；美国法院统计的 2025 财年企业第 11 章申请为 8,405 起。两组数据的统计期间和定义不同。滩头市场客户是经手多个案件、业务依赖案件授权收件人名单和送达证据的债权主张与通知运营方。
  customerAndBuyer: 日常使用者是债权主张或通知代理机构的通知运营负责人；可能负责出预算的高管是其 COO 或运营主管。通知授权属于法院、书记员、债务人/受托人，或适用规则及案件命令指定的其他当事方，因此代理机构愿意使用产品，并不一定足以授权其改走备用渠道。罗得岛州要求债权人数达到 1,000 名或以上的案件聘用代理，并至少征求三份聘用方案；这个地方性案例说明了正式采购和法院监督的存在，不代表全国统一门槛。
  buyingTriggers:
    - point: BNC 一旦发生服务中断，或出现连续性审计、事故后风险复核，债权主张代理运营就会更关注通知连续性和收件人来源凭证。
      sourceRefs:
        - 1
        - 3
    - point: 新的高债权人数第 11 章案件或债权主张代理聘用提案，都是在期限临近前明确数据归属、送达证据和获批备用方式的实际时机。
      sourceRefs:
        - 18
        - 19
        - 20
    - point: 需要快速周转的通知邮寄任务本身已经带来外部支出；但这只能证明客户需要履约服务，不能证明连续性保障已成为明确采购触发点。
      sourceRefs:
        - 15
  willingnessToPay:
    summary: 可以观察到相邻领域已有支出：Key Dynamics 公开报价为标准邮寄每页 $0.15 外加邮资、加急服务每页 $0.25；罗得岛州要求债权主张代理聘用协议写明收费结构。这说明通知履约和债权主张管理已有预算，却不能证明客户为独立连续性服务另付年度费用的付费意愿。未见公开的连续性专项报价或购买承诺。连续性专项付费意愿仍未得到验证。
    sourceRefs:
      - 15
      - 20
  competitiveLandscape: 联邦 BNC 是许多法院发出通知时采用的现有渠道，行政办公室列有 20 多家获批通知服务商。Stretto、Epiq、Verita、BMC Group 和 CPT Group 都在销售一体化债权主张管理和法律通知服务；Key Dynamics 则销售基于名单的打印/邮寄履约，且公开按页收费。这些现有厂商已经覆盖拟议产品的许多组成部分。尚未填补的缺口不是再添一家打印商或案件网站，而是独立维护、可证明完整的收件人资料包，以及须经授权才能启动的备用发送。查阅的公开页面都没有介绍这一完整组合，但服务商私下的业务连续性计划（BCP）能力仍未知。
  incumbentThesis:
    - incumbentClass: 联邦 BNC 与法院运营的 CM/ECF
      point: BNC 已有法院合作关系、收件人登记信息和全国通知渠道，因此常规运营中通常是默认通知渠道。2026 年事件令通知制作和分发停摆，地方应急方案也暴露出 CM/ECF 名单完整性的局限。此次中断证明了集中风险，却不能证明 BNC 缺乏未公开的恢复计划。
      sourceRefs:
        - 1
        - 3
        - 5
    - incumbentClass: 全服务型债权主张与通知代理机构
      point: Stretto、Epiq、Verita、BMC Group 和 CPT Group 等现有厂商可打包案件管理、债权主张管理、名单处理、通知、印制、报告或债权人支持；这种一体化服务和法院熟悉度，常让它们默认胜出。它们的公开服务介绍没有证明其独立运营连续性资料包，但服务商可以自行增加或打包同等能力。
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 16
    - incumbentClass: 其他获批通知服务商与打印/邮寄公司
      point: 获批服务商名单和便捷的邮寄服务提供了可行的备用发送渠道。但它们不会自动解决收件人来源是否完整，也不能确认案件授权方是否批准用该渠道发送当前通知。
      sourceRefs:
        - 6
        - 7
        - 15
    - incumbentClass: 人工及内部案件运营应急方案
      point: 地方法院指引允许用户查询债权人和当事人记录并手动比对名单，因此这是近期可用的替代方案。法院也提醒，这些名单可能漏掉已在 BNC 登记的收件人和其他当事方，而且仅有案卷记录未必能证明已完成送达。
      sourceRefs:
        - 2
        - 3
        - 4
  regulatoryLandscape: 《联邦破产程序规则》第 2002 条规定了通知义务，包括对特定事项提前 21 天或 28 天通知。第 9036 条规范电子通知，包括已登记地址，以及发送方获知电子传输未送达收件人时的处理。行政办公室的获批服务商名单并非普遍授权，不代表名单中的任意服务商都能发送每一份通知。留用服务商、服务范围、送达方式和证据均由地方法规及案件命令决定。收件人名单可能包含个人身份或财务信息；应尽量少收集数据、控制访问、限制留存期限并进行安全审查。以上是尽调提示，不构成法律意见。
  technologyLandscape: 采用文件加密快照、来源版本管理、确定性比对、异常分流，以及只追加不覆盖的授权和发送日志，技术上都可行。关键的不确定性在于能否合法访问权威收件人来源，尤其是 BNC EBN/NCRS 登记信息，以及能否证明备用渠道和地址对该案件仍然有效。增加第二个数据仓库会扩大攻击面，也可能产生过时或相互冲突的事实来源；安全计划应参照 NIST CSF 2.0 等成熟框架。目前尚无公开证据证实 BNC 提供导出/API 或完整数据流。
  distributionChannels:
    - point: 先向经手多起案件的债权主张与通知代理机构销售托管式连续性控制，并以单案桌面演练作为试点；任何实际发送前，都要让债务人/受托人的破产律师和有权决定的法院相关方参与。
      sourceRefs:
        - 6
        - 18
        - 20
    - point: 通过重组律师、债权主张代理流程顾问和获批通知服务商引荐。服务商之间直接牵线，比向个别债权人推销未经批准的法律服务渠道更可信。
      sourceRefs:
        - 6
        - 19
        - 21
  partnershipEcosystem:
    - point: 试点需要债权主张代理同意保留来源凭证；案件律师和授权决策人批准启动条件；还需要一家独立的获批通知/打印合作方，愿意展示送达证据。
      sourceRefs:
        - 6
        - 15
        - 20
    - point: BNC/CM/ECF 体系仍是官方案件动态和已登记收件人指引的来源。数据访问和共享条件必须另行协商，不能从公开案卷中自行推定。
      sourceRefs:
        - 3
        - 5
        - 7
  dataMoats:
    - point: 原始姓名和地址不是持久的护城河，而且可能公开或仅限特定案件使用。更可守的运营资产，可能是经授权保留的历史记录：跨演练记录来源版本、已解决异常、授权信息和发送结果。没有法律授权，不能把这些数据挪用于其他案件。Epiq 声称拥有 37 百万宗案件的数据集，说明现有厂商的数据运营商能带来多大的规模；这并不意味着这家初创公司可以假定自己拥有相应数据权利。
      sourceRefs:
        - 3
        - 23
        - 25
  geographicConsiderations:
    - point: 初期销售和数据处理应仅限美国，因为联邦破产规则、获批服务商资格和地方法院流程决定了通知方式。各地区做法不同：南卡罗来纳州和马里兰州发布了不同的中断应急指引，罗得岛州也有自己的债权主张代理聘用和收费流程。
      sourceRefs:
        - 2
        - 3
        - 6
        - 20
    - point: 美国案件可能涉及跨境债权人，但本次研究的服务渠道和法律依据均属美国联邦体系。拓展国际市场前，必须另行尽调送达、隐私和采购要求。
      sourceRefs:
        - 8
        - 23
  sensitivityCases:
    - case: BNC 很快恢复，现有厂商也迅速补救
      impact: 眼前的采购窗口会变窄；产品必须主打准备度和可审计性，而不只是应对中断，现有厂商也可能打包同等控制能力。
      sourceRefs:
        - 1
        - 3
        - 11
        - 12
    - case: 法院不批准独立的备用渠道
      impact: 留存快照或许仍有助于核对名单，却失去备用发送这一切口；服务可能退化成不紧急的导出或审计工具。
      sourceRefs:
        - 6
        - 7
        - 18
        - 20
    - case: 符合高案件量买家画像的商业第 11 章案件只占很小一部分
      impact: 可服务市场会低于基准情景；应下调 15% 的 SAM 假设，并先独立验证相邻法律通知项目，再宣称具备风险投资级增长潜力。
      sourceRefs:
        - 10
        - 20
        - 22
    - case: 无法安全导出或独立托管收件人数据
      impact: 产品无法提供有意义的名单完整性保证，还可能引入新的安全或隐私责任；若不能采用由客户控制数据和密钥的方案，就不应继续推进。
      sourceRefs:
        - 3
        - 23
        - 24
  validationPlan:
    - priority: high
      question: 目标代理机构能否在中断前，合法地从技术上导出每个获授权的收件人来源，包括 BNC 登记地址？
      evidenceToGather: 访谈三家债权主张代理机构的运营和 IT 团队；检查样例来源导出、访问权限、来源凭证字段，并依据案件命令和收件人登记信息进行端到端核对。
    - priority: high
      question: 案件授权方是否会批准预先演练的备用发送？启动时需要哪些确切证明？
      evidenceToGather: 与破产律师、法院书记员相关人员及代理机构一起审阅三份近期聘用命令和地方送达流程；获取桌面演练和实际案件试点的书面审批标准。
    - priority: high
      question: 是否有独立连续性预算，还是运营方预期由现有厂商在现有收费中提供恢复能力？
      evidenceToGather: 查阅近期案件的债权主张代理聘用函和费用申请；至少询问五位 COO，比对独立连续性服务与其现有 BCP、保险及供应商合同义务。
    - priority: high
      question: 是否有现有厂商已经独立保存收件人快照，并测试过备用发送？
      evidenceToGather: 向 Stretto、Epiq、Verita、BMC Group 和一家较小的获批服务商索取连续性证明及故障切换演练结果；比较恢复点、收件人完整性、授权和送达证明控制。
    - priority: medium
      question: 数据最小化、加密、留存和访问控制能否通过案件律师与法院的安全审查？
      evidenceToGather: 梳理一个通知数据流样例，识别个人及财务数据，并依据 NIST CSF 2.0、相关案件协议和供应商协议开展安全与隐私审查。
  validationSignals:
    - point: 行政办公室报告称，此次事件导致 BNC 全国范围内停止制作和分发通知；马里兰州法院十月 19 日 FAQ 称，恢复时间未知。
      sourceRefs:
        - 1
        - 3
    - point: 一家地方法院的人工应急方案明确提醒，债权人名单未涵盖所有利害关系方；马里兰州进一步警告，名单可能漏掉 BNC EBN/NCRS 地址，而且案卷登记并不能证明已完成送达。
      sourceRefs:
        - 2
        - 3
    - point: Key Dynamics 公开按页收取常规法律通知履约费用，说明邮寄服务已有支出，但不能证明有专项韧性预算。
      sourceRefs:
        - 15
    - point: 罗得岛州法院指引要求竞争性选择债权主张代理，并在聘用协议中披露费用结构，说明相邻服务如何通过正式流程采购和审批。
      sourceRefs:
        - 20
  openQuestions:
    - 商业第 11 章案件中，有多大比例会聘用外部代理，且收件人名单规模足够大或变化频繁？
    - 每个案件中，谁有权签约购买独立连续性资料包，又由谁出预算？
    - 事故发生前，BNC EBN/NCRS 数据能否依法导出并保留版本记录？
    - 截至 2026 年十月 20 日，BNC 的恢复进度和事故后连续性改进措施是什么？
    - 现有厂商会否直接吸收这项功能，或不加价提供？
    - 如果扩展到破产领域之外，能否避免削弱案件特定授权和证据要求？
analysisModels:
  marketMapDiagram:
    title: 紧迫性与连续性专业化程度
    mermaid: |
      quadrantChart
        title Bankruptcy notice continuity market
        x-axis Low continuity specialization --> High continuity specialization
        y-axis Low outage urgency --> High outage urgency
        quadrant-1 High urgency and specialized
        quadrant-2 High urgency and general
        quadrant-3 Low urgency and general
        quadrant-4 Specialized but less urgent
        Proposed startup: [0.88, 0.92]
        Federal BNC: [0.25, 0.88]
        Claims agents: [0.55, 0.68]
        Manual CM ECF workaround: [0.18, 0.56]
        Mail fulfillment vendors: [0.46, 0.42]
  fiveForces:
    supplierPower:
      score: 4
      rationale: 发送能力和权威收件人数据的访问权掌握在少数面向法院的系统、获批服务商、邮政供应商和案件授权方手中；换掉技术供应商本身并不会转移法律授权。
      sourceRefs:
        - 3
        - 6
        - 7
        - 20
    buyerPower:
      score: 4
      rationale: 可能赞助产品的重复采购方——经手多个案件的债权主张代理机构——数量不多，但债务人/受托人和法院能决定代理机构的任命及服务范围。罗得岛州要求提交三份提案的流程，就是买方具备正式议价能力的一个例子。
      sourceRefs:
        - 18
        - 19
        - 20
    threatOfEntrants:
      score: 3
      rationale: 搭建加密快照和名单比对工具并不难，但要建立可信的法律运营能力、获取收件人数据、通过审批和安全审查、保证证据完整，并搭建独立发送网络，都不简单。
      sourceRefs:
        - 3
        - 20
        - 24
    threatOfSubstitutes:
      score: 4
      rationale: 替代方案包括 BNC 恢复、其他获批通知服务商、现有厂商及代理机构自己的工作流、内部备份，以及人工比对 CM/ECF/案卷。人工方案可以马上使用，但名单可能不完整。
      sourceRefs:
        - 2
        - 3
        - 5
        - 6
        - 11
    competitiveRivalry:
      score: 4
      rationale: 多家成熟服务商已经把债权主张管理、通知制作、客户支持和数据平台组合在一起；连续性功能可以直接打包销售。除单项邮寄服务外，公开报价也很少。
      sourceRefs:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
  pestle:
    - factor: political
      impact: positive
      point: 联邦法院服务中断让机构更加关注供应商集中和连续性风险，但公共部门的应对可能需要正式采购和法院批准。
      sourceRefs:
        - 1
        - 3
        - 20
    - factor: economic
      impact: neutral
      point: 按 Epiq 的 2025 日历年口径，商业第 11 章申请增长 1%；最新 12 个月的大型企业第 7/11 章申请则下降 15%，但仍比长期均值高 22%。需求具有周期性，案件数量也不能直接代表连续性服务支出。
      sourceRefs:
        - 10
        - 22
    - factor: social
      impact: negative
      point: 通知失败可能推迟听证，或让债权人无法及时获知案件进展，因此收件人名单完整性和送达证据会直接影响信任和参与。
      sourceRefs:
        - 3
        - 4
        - 8
    - factor: technological
      impact: neutral
      point: 加密快照和可重复的名单核对在技术上可行，但复制收件人数据会扩大攻击面，也无法补齐缺失或未经授权的来源记录。
      sourceRefs:
        - 3
        - 24
    - factor: legal
      impact: negative
      point: 送达方式、时限、收件地址和代理权限受联邦规则及案件或地方命令约束；光有技术上的备用能力还不够，发送前仍需取得授权。
      sourceRefs:
        - 7
        - 8
        - 18
        - 20
    - factor: environmental
      impact: neutral
      point: 联邦法院采用大批量电子通知，本意是降低邮寄成本；若备用方案依赖实体邮件，就会重新产生纸张和邮资成本。连续性方案应优先遵循有效的收件人偏好，而不是默认改走纸质邮寄。
      sourceRefs:
        - 5
        - 7
  adoptionFrictionMatrix:
    - friction: 案件授权与通知方式审批
      severity: high
      affectedBuyer: 债权主张代理机构、债务人/受托人、破产律师和法院
      mitigation: 任何实际发送前，先在案件聘用协议或命令中明确授权来源、适用通知、启动角色和发送方式。
      sourceRefs:
        - 7
        - 8
        - 20
    - friction: 债权主张代理采购与任命
      severity: high
      affectedBuyer: 负责遴选债权主张与通知代理机构的债务人或受托人
      mitigation: 通过法院批准的代理机构聘用流程测试服务，并配合竞争性遴选；不要假设年度 SaaS 合同可以取代案件特定的聘用审批。
      sourceRefs:
        - 18
        - 19
        - 20
    - friction: 获取完整的登记收件人数据
      severity: high
      affectedBuyer: 通知运营团队和案件律师
      mitigation: 案件启动前，从每个来源取得获准、带时间戳的导出文件并记录覆盖缺口；绝不能仅凭 CM/ECF 声称名单完整。
      sourceRefs:
        - 2
        - 3
        - 7
    - friction: 敏感或过时的邮寄数据
      severity: high
      affectedBuyer: 法院安全审查人员、债权主张代理机构和案件当事方
      mitigation: 尽量少留字段，采用严格访问控制和加密，按案件设定留存及删除期限，并完成独立安全审查。
      sourceRefs:
        - 3
        - 23
        - 24
    - friction: 与现有厂商的通知及债权主张工具集成
      severity: medium
      affectedBuyer: 债权主张代理 IT 团队和通知运营团队
      mitigation: 先支持导出文件和可复现报告；只有在现有厂商和案件授权方允许时，才使用 APIs（应用程序接口）。
      sourceRefs:
        - 11
        - 12
        - 13
    - friction: 中断低频发生，准备工作容易被搁置
      severity: medium
      affectedBuyer: 债权主张代理机构的 COO 或运营负责人
      mitigation:       把可量化的演练与现有案件导入或连续性复核挂钩；开发大型平台前，先验证客户是否愿意续约。
      sourceRefs:
        - 1
        - 3
        - 20
market:
  tam:
    value: $39.7M
    rationale: 这是按案件量推算的理论上限，不代表当前市场收入：2025 日历年有 7,940 起商业第 11 章申请，按每起新案件假设 $5,000 的连续性保障等价费用计算，这批案件对应的单年价值为 $39.7M。$5,000 只是测算标尺，不是实际连续性报价或建议价格；测算还假设所有案件都采用服务，且每起新申请均计费一年。美国法院统计的财年企业第 11 章案件数为 8,405 起，口径不同，说明结果会受统计期间和定义影响。
    isEstimate: true
    sourceRefs:
      - 9
      - 10
  sam:
    value: $6.0M
    rationale: 将明确尚未核实的 15% 可服务份额应用于每年 7,940 起商业第 11 章申请，假设其中只有 1,191 个案件等价单位同时具备足够复杂的债权人/名单情况、外部代理工作流，且买方可以触达。按同一个 $5,000 测算代理值，1,191 × $5,000 约为 $6.0M。罗得岛州要求债权人数达到 1,000 名时聘用代理的指引，以及 100 起大型企业申请的代理数据，支持复杂案件这一切口，但不能验证全国 15% 的占比。
    isEstimate: true
    sourceRefs:
      - 10
      - 20
      - 22
  som:
    value: $0.2M
    rationale: 仅作示例的可触达情景：估算 SAM 的 3% 约为每年 36 个案件等价单位；按每个案件等价单位假设收费 $5,000，约为 $180,000，四舍五入后为 $0.2M。这不是收入预测；服务商数量、转化率、获授权覆盖的案件、服务期限和连续性专项付费意愿都尚未验证。
    isEstimate: true
    sourceRefs:
      - 6
      - 10
      - 20
bottomUpSizingDrivers:
  - driver: 美国商业第 11 章年度案件群体
    value: 2025 日历年共 7,940 起申请
    source: '[10]'
  - driver: 仅用于测算的年度案件等价费用
    value: 每个案件等价单位 $5,000；运营方假设，并非公开报价
    source: est.
  - driver: 高复杂度、可服务案件占比
    value: 假设为 15%；没有全国数据说明符合买家画像的案件比例
    source: est.
  - driver: 大型企业破产信号
    value: 2H 2025–1H 2026 有 100 家资产超过 $100M 的公司申请第 7 章或第 11 章破产；其中 28 起为资产超过 $1B 的超大型案件
    source: '[22]'
  - driver: 获批通知服务商范围
    value: 行政办公室公开名单上有 23 家机构；服务商规模和能力各不相同
    source: '[6]'
  - driver: 地方债权主张代理门槛与采购案例
    value: 罗得岛州指引要求债权人数达到 1,000 名或以上的案件聘用代理，并至少征求三份提案
    source: '[20]'
categoryDynamics:
  growthRate: 没有可靠的连续性品类 CAGR 数据。Epiq AACER 报告称，2025 日历年商业第 11 章申请同比增长 1%，达到 7,940 起；美国法院报告称，2025 财年第 11 章申请总数下降 0.8%；Cornerstone Research 则发现，其最新 12 个月统计期内的大型企业申请同比下降 15%，但仍比 2005–2025 年均值高 22%。
  growthRateSourceRefs:
    - 9
    - 10
    - 22
  tailwinds:
    - point: BNC 服务中断让法院和案件运营方切实看到了单一集中通知渠道的连续性风险。
      sourceRefs:
        - 1
        - 3
    - point: Epiq AACER 报告称，2025 年商业第 11 章申请增长 1%；Cornerstone Research 发现大型企业破产申请仍高于历史均值。
      sourceRefs:
        - 10
        - 22
    - point: 地方债权主张代理指引明确了第三方通知和费用审批的正式案件流程，证明在代理机构已获聘用的情况下存在采购路径。
      sourceRefs:
        - 20
  headwinds:
    - point: 破产申请具有周期性，最新大型企业案件数较前 12 个月下降；BNC 服务恢复后，单次中断带来的紧迫感未必能持续。
      sourceRefs:
        - 9
        - 22
    - point: 买家范围集中，现有厂商已经销售底层案件、债权主张和通知服务；连续性功能可能被打包进现有合同，无需另行采购。
      sourceRefs:
        - 6
        - 11
        - 12
        - 13
        - 14
competitors:
  - name: Stretto
    stage: 成熟的债权主张与通知代理机构
    wedge: 提供全套债权主张管理、专有案件管理系统、专用破产文件印制、呼叫中心支持、文件追踪和送达证明。
    pricing: 未见公开的连续性服务价格；按具体案件提供债权主张服务报价。
    strength: 深厚的破产运营经验，以及一体化制作和送达证据，能减轻案件赞助方的协调负担。
    weaknessVsUs: 公开页面没有介绍独立保存的收件人资料包或须经授权的跨服务商备用渠道；其私有 BCP 情况仍未知。
    sourceRefs:
      - 11
  - name: Epiq
    stage: 成熟的全球重组与破产服务商
    wedge: 提供大批量破产通知、自有打印和履约能力、邮寄流程、条形码、无法投递邮件追踪，以及丰富的破产数据和分析服务。
    pricing: 未见公开的连续性服务价格；按具体项目定制服务。
    strength: 规模、一体化打印能力，以及广泛的数据与服务覆盖，带来强大的现有厂商信任和打包销售潜力。
    weaknessVsUs: 公开资料强调服务商自身的制作和追踪渠道，没有介绍独立运营的资料包和启动流程；但没有证据能确认其私有能力不存在。
    sourceRefs:
      - 12
      - 25
  - name: Verita
    stage: 成熟的专业债权主张与通知代理机构
    wedge: 提供债权主张管理、债权人名单整理、通知、案件网站、ePOC、eBallot 和自愿加入的电子通知。
    pricing: 未见公开的连续性服务价格；没有公布债权主张案件的聘用条款。
    strength: 一体化电子服务、债权主张工作流和现有案件关系，与拟议产品运营方的工作高度重合。
    weaknessVsUs: 公开服务介绍没有披露独立于服务商的收件人快照，也没有预先授权的备用发送控制。
    sourceRefs:
      - 13
  - name: BMC Group
    stage: 成熟的债权主张、通知及案件管理服务商
    wedge: 提供通知规划、内容制作、质量保证、纸质和电子通知制作、案件网站、呼叫中心及债权主张管理。
    pricing: 未见公开的连续性服务价格；需联系服务商索取报价。
    strength: 质量控制、专门通知团队、制作设施和债权人支持，覆盖了核心送达环节。
    weaknessVsUs: 公开资料侧重通知执行和案件服务，没有介绍跨服务商收件人资料包的保存，也没有记录须经单独授权的故障切换。
    sourceRefs:
      - 14
  - name: Key Dynamics
    stage: 专业的第三方破产通知邮寄服务商
    wedge: 为债务人律师提供邮寄服务，整理邮寄名单、当天打印并寄送通知、核查重复或无法投递的地址，并出具送达证明。
    pricing: 该页面公开报价：标准邮件每页 $0.15 外加邮资；加急服务每页 $0.25。
    strength: 按件收费门槛低、条款灵活、可核验地址并出具送达证明，是直接的运营替代方案。
    weaknessVsUs: 公开资料介绍的是邮寄履约，而不是中断发生前独立保存 BNC 收件人快照并经授权启用备用渠道。
    sourceRefs:
      - 15
regulatoryTechnicalConstraints:
  - point: 第 2002 条规定了特定程序中的通知对象和时限；备用方案不能擅自更改通知内容或截止时间。
    sourceRefs:
      - 8
  - point: 第 9036 条在特定条件下允许电子送达，适用于已登记到司法系统破产通知计划的地址；发送方得知电子通知未送达收件人时，该通知即不生效。
    sourceRefs:
      - 7
  - point: 马里兰州法院表示，BNC 队列可能会在服务恢复后继续处理，同时提醒仅有案卷记录不能证明已完成送达；主系统恢复后，名单核对必须避免重复或相互冲突的通知。
    sourceRefs:
      - 3
  - point: 罗得岛州指引要求按案件聘用代理、聘用无利害关系的代理、披露费用并进行竞争性提案；这些是地方指引，不是全国性规则。
    sourceRefs:
      - 20
  - point: 收件人和通知数据可能包含个人身份或财务信息。应遵照案件合同及适用隐私要求，尽量减少存储的数据；NIST CSF 2.0 是风险管理框架，并非破产领域的专门法律义务。
    sourceRefs:
      - 23
      - 24
validationSignals:
  - point: 行政办公室确认 BNC 服务不可用，联邦破产法院的通知制作和分发已经停止。
    sourceRefs:
      - 1
  - point: 马里兰州十月 19 日 FAQ 称，尚无已知恢复日期，并警告债权人查询可能漏掉 BNC 登记地址和其他必需通知对象。
    sourceRefs:
      - 3
  - point: 一家商业通知服务商公开了标准和加急服务的按页收费，说明常规履约服务有付费意愿，但连续性产品的付费意愿尚未得到验证。
    sourceRefs:
      - 15
  - point: 一家地方法院采用正式的债权主张代理聘用、竞争性提案和费用披露流程，说明获授权的服务可以采购，但审批也会增加摩擦。
    sourceRefs:
      - 20
openQuestions:
  - BNC 在 2026 年十月事件后，是否已提供有文档记录且经过独立测试的连续性渠道？
  - 客户能否合法导出 EBN/NCRS 收件人记录，并保留足够的来源凭证来验证完整性？
  - 商业第 11 章案件中，有多大比例的收件人名单规模大、变化频繁，且聘用了外部债权主张代理？
  - 谁为连续性服务买单？这笔支出是债权主张代理聘用费用之外的增量预算，还是法院 IT 采购预算？
  - 现有厂商会否打包同等能力？客户是否仍愿意为服务商独立性付费？
  - 案件命令应包含哪些条款？律师会要求何种保险、证据标准和留存期限？
