slug: bankruptcy-notice-escrow
date: "2026-10-20"
executiveSummary: >-
  The October 2026 Bankruptcy Noticing Center interruption is direct evidence of
  operational pain: the Judiciary reported that notice production and distribution
  stopped while bankruptcy filings continued. Maryland's October 19 court FAQ
  said restoration timing was unknown and warned that CM/ECF queries can omit
  addresses registered through BNC EBN/NCRS, so a docket entry or a single
  electronic list cannot establish that service is complete. The beachhead is a
  multi-case U.S. bankruptcy claims or noticing provider willing to test continuity
  on one authorized Chapter 11 case, with the provider's COO or operations head as
  economic sponsor and case authority retained by the proper party. The product
  preserves approved notice and recipient-source versions, routes discrepancies
  to a human, and rehearses an independent dispatch; it does not send notice
  without case-specific authorization. The wedge is narrower than generic backup
  because it proves recipient provenance and an authorized handoff, but incumbent
  agents already deliver notices and may bundle equivalent controls. Research
  estimates a $6.0M serviceable market using unverified case-share and price
  assumptions, and found no continuity-specific budget, interview, or purchase
  commitment. This is a Watch opportunity until lawful access to complete recipient
  sources, approval for a fallback, and paid demand are demonstrated. The first
  18 months should buy those proofs and a secure one-case product, not broad
  integrations or adjacent-market expansion.
problem:
  - The Judiciary reported that BNC notice production and distribution stopped during the October 2026 incident, although case filings continued.
  - Court guidance described manual list comparison and warned that court-generated lists may omit BNC-registered EBN/NCRS addresses and other required parties.
  - A second repository of sensitive recipient data can become stale or increase exposure, while a technically available backup channel is not necessarily authorized for a specific case.
solution:
  - Ingest only customer-authorized notice and recipient exports; retain source, timestamp, and version provenance in an encrypted, case-scoped capsule.
  - Compare authorized sources deterministically and present discrepancies for human resolution; do not infer missing addresses or silently edit notice data.
  - Rehearse an export and handoff to an independently contracted notice partner, recording authorization, dispatch attempts, and available delivery evidence.
  - Keep live dispatch disabled until the case authority and counsel document the permitted notice scope, activation role, and channel.
whyWeWin:
  - The product is organized around the failure exposed by the outage—recipient completeness across authorized sources—not generic uptime alerts or a backup archive.
  - Vendor-independent storage and a rehearsed alternate handoff can reduce dependence on the interrupted primary path while preserving human review and case authority.
  - A source-version and exception history can become a useful operational asset, but the combination is not a proven moat: public competitor pages do not establish private BCP capability, and incumbents can bundle similar controls.
strategicChoices:
  beachhead: Multi-case U.S. bankruptcy noticing and claims-administration providers, starting with one complex Chapter 11 portfolio and one case whose authorized recipient sources and fallback procedure can be agreed in advance.
  wedgeRationale: The BNC disruption and Maryland's warning about missing registered addresses make recipient reconciliation a measurable, urgent job; one case allows a source-coverage test and tabletop without replacing claims systems or asking a court to adopt a new national platform.
  sequencingRationale: First prove lawful source access and written activation criteria with an agent, counsel, and case authority; then build file-based reconciliation and run a tabletop with an independent dispatch partner. Add repeatable security controls and paid renewals before investing in APIs, broader sales, or more hires.
  notYet:
    - Replacing the BNC, routine claims administration, or existing notice production.
    - Automated address correction, legal interpretation, or live dispatch without recorded case-specific authority.
    - Federal-court procurement as the initial channel; begin with a privately sponsored agent pilot, not an assumption of nationwide court approval.
    - Consumer bankruptcy, international cases, and other legal-notice programs until the bankruptcy workflow shows paid renewal and each adjacent program's authority is independently validated.
market:
  tam: "$39.7M theoretical annual cohort value: 7,940 calendar-year 2025 commercial Chapter 11 filings multiplied by an assumed $5,000 per case-equivalent; this is a sizing proxy, not observed continuity spend or a revenue forecast."
  sam: "$6.0M estimate: an unverified 15% serviceable share (about 1,191 case-equivalents) at the same assumed $5,000 proxy; the national share of complex cases with accessible buyers is unknown."
  som: "$0.2M illustrative scenario: 3% of the estimated SAM, or about 36 case-equivalents at the assumed $5,000 proxy; adoption, case coverage, contract duration, and willingness to pay are unvalidated."
  segments:
    - Multi-case bankruptcy claims and noticing providers managing high-volume or complex Chapter 11 recipient workflows.
    - Debtor, trustee, or case-administration teams that sponsor an agent and need documented notice continuity for an authorized case.
  buyingProcess: The agent's COO or operations head can sponsor a pilot during a new multi-case assignment, continuity review, or renewal, but counsel and the party identified by the case order must approve the fallback method and activation rules. Local retention requirements differ; Rhode Island's three-proposal and fee-disclosure process is an example, not a national procurement rule.
product:
  mvp: A managed, one-case workflow that accepts customer-authorized file exports, seals versioned notice and recipient-source snapshots, produces a deterministic reconciliation report, and routes exceptions to an operator. It includes a tabletop export to an independent dispatch partner and an auditable authorization log; live dispatch remains blocked absent written case authority.
  sixMonth: Support one pilot provider and one case through documented file formats, source provenance, encrypted storage with a customer-controlled key option, human exception resolution, and a measured tabletop handoff; defer APIs until data access terms are proven.
  twelveMonth: Support repeatable onboarding across a small set of agent portfolios, with case-scoped access, retention/deletion controls, security review, reconciliation metrics, and one validated independent dispatch partner; no automatic notice issuance.
  twentyFourMonth: If paid renewal and authority are proven, productize multi-case controls and test one additional court-approved notice workflow through a paid feasibility pilot; otherwise remain bankruptcy-only or stop rather than build a generic legal continuity platform.
  keyBets:
    - A willing agent can lawfully export the complete authorized source set, including registered recipients not visible in CM/ECF.
    - Human-reviewed reconciliation and a dated exercise are valuable enough to buy even when the primary BNC service has recovered.
    - An independent dispatch partner can provide case-appropriate delivery evidence without creating a conflicting source of truth.
    - Customer-controlled keys, minimal retained fields, and case-specific deletion can pass counsel and security review without prohibitive implementation cost.
gtm:
  wedge: Founder-led, paid one-case continuity pilot with a multi-case claims or noticing provider; use an existing assignment, post-incident review, or continuity audit to establish the sponsor, source permissions, and fallback approval before building integrations.
  channels:
    - Direct founder outreach to COOs and notice-operations leads at claims and noticing providers; the Administrative Office's approved-provider roster is a prospecting list, not proof of case authority.
    - Referrals from restructuring counsel, claims-agent protocol advisers, and continuity consultants who can introduce the relevant case decision-makers.
    - Co-design and referral agreements with an approved print or electronic notice partner able to demonstrate delivery evidence.
  funnelTargets: "Operating hypothesis for the first 6 months: 8 qualified agent meetings -> 3 scoped source-and-authority reviews -> 1 paid one-case pilot; target at least 50% conversion of completed paid pilots to an annual retainer, measured only after two pilots."
  pricing: "Test a $5k–$10k paid one-case pilot, then an annual portfolio retainer tiered by covered case-years and notice volume, plus a pre-agreed activation fee. The $5k–$20k annual portfolio range is an operator hypothesis roughly equivalent to one to four $5,000 sizing proxies, not researched market pricing; the activation fee covers authorized coordination, not legal authority."
businessModel:
  revenueStreams:
    - Annual continuity retainer per case portfolio, tiered by active covered case-years and notice volume.
    - One-time case onboarding and scheduled tabletop-exercise fee.
    - Pre-agreed activation and dispatch-coordination fee when authorized, with external postage or fulfillment passed through rather than treated as software revenue.
  unitOfValue: One covered case-year with authorized recipient sources reconciled, exceptions dispositioned, and a tested, case-approved fallback handoff.
  targetGrossMarginPct: 70
  expansionLevers:
    - Add active case-years and additional notice-volume tiers within renewing agent portfolios.
    - Standardize onboarding and recurring tabletop exercises to reduce per-case implementation labor.
    - Add an additional approved dispatch partner only where customer and case authority approve the channel.
    - Test adjacent court-approved notice programs only after bankruptcy renewals validate a repeatable budget and delivery model.
strategyMap:
  northStarMetric: "Share of active covered case portfolios that pass a scheduled end-to-end exercise with all authorized source records accounted for and every exception resolved or explicitly dispositioned."
  inputMetrics:
    - Share of pilot cases with permitted exports from every source named in the case protocol.
    - Share of recipient records with source and version provenance; count and age of unresolved exceptions.
    - Median time to reconcile a source change and time from authorized tabletop activation to first partner handoff.
    - Paid-pilot conversion, annual-retainer renewal, and covered case-years per renewing customer.
  moatsToBuild:
    - Permissioned operational history of source versions, resolved exceptions, approvals, and exercise outcomes; do not reuse case-bound recipient data across customers.
    - Trusted implementation playbooks for case-specific authority, reconciliation, evidence retention, and deletion.
    - Independent dispatch-partner readiness and tested handoffs; partner access alone is not legal authorization.
  killCriteria:
    - By day 90, fewer than 2 of 3 target agents can identify a lawful export path for all recipient sources required by one case; stop building a completeness claim.
    - By month 6, no case authority or counsel will document an acceptable tabletop and live-activation protocol for a pilot; pause the dispatch wedge.
    - By month 6, no buyer accepts a paid pilot of at least $5,000 after 5 qualified price discussions; do not hire GTM or expand product scope.
    - By month 12, zero of the first 2 completed pilots converts to a paid annual retainer, or two of three target buyers say an incumbent includes equivalent controls at no incremental price; reassess standalone economics.
    - Stop handling production recipient data if an independent security review finds a critical unresolved exposure or customers reject the proposed customer-controlled key and deletion model.
  mermaid: |
    flowchart LR
      Wedge[One authorized Chapter 11 case] --> MVP[Versioned recipient capsule and reconciliation]
      MVP --> Proof[Source coverage and approved tabletop handoff]
      Proof --> Renewal[Paid portfolio retainer and repeat exercises]
      Renewal --> Expansion[Additional portfolios; adjacent program only after proof]
investorMemo:
  verdict:
    call: Watch
    conviction: "Low-to-moderate: the workflow gap is documented, but buyer budget, legal authority, and independent-source access remain unproven."
    whyBelieve: "A federal notice interruption and court warnings about recipient-list gaps provide concrete evidence for a narrowly defined continuity control."
    whyDoubt: "The estimated $6.0M SAM relies on unverified assumptions, and integrated incumbents may already have or can bundle failover without a separate purchase."
    nextDiligence: "Require one agent to provide a permitted source set and obtain written case-authority criteria for a paid tabletop pilot before funding a broader build."
  firstCustomer:
    title: Multi-case U.S. Chapter 11 claims and noticing provider
    profile: A provider managing several federal cases, with a COO sponsor and a notice-operations team willing to test a single complex case using customer-authorized source exports.
    trigger: A new multi-case assignment, continuity audit, renewal, or post-incident review that requires evidence of recipient completeness and a rehearsed fallback.
    buyer: COO or head of operations at a bankruptcy claims or noticing provider
    initialContract: "Assumption to validate: $5k–$10k paid one-case pilot, credited toward a $5k–$20k annual portfolio retainer tiered by covered case-years and volume; renew only after an authorized tabletop succeeds."
  mustBeTrue:
    - At least 2 of 3 interviewed target agents can lawfully export all recipient sources required for one case, including registered notice recipients.
    - A case authority and counsel will document a permitted alternate channel, activation role, and evidence standard before any live dispatch.
    - At least 1 of 5 qualified COO price discussions produces a paid pilot of $5,000 or more without bundling it into ordinary noticing fees.
    - At least 1 independent partner can complete a tabletop handoff with traceable delivery evidence while preventing duplicate or conflicting notices on primary-path recovery.
    - The reachable number of covered case-years and renewal rate can support a recurring business beyond the illustrative $0.2M SOM scenario or a separately validated adjacent market.
  diligenceQuestions:
    - Which authorized source contains the BNC EBN/NCRS recipient data, and what export rights and provenance can an agent actually obtain before an outage?
    - Who has authority to pre-approve and activate the fallback in each target case, and what order language or notice method is required?
    - What recovery controls and tested recipient snapshots do BNC and the major claims agents already maintain privately?
    - Will a COO pay a separate annual continuity retainer, or must the service be included in an existing agent fee or court-approved engagement?
    - How many annual case-years meet the complexity and outside-agent criteria, and what independently evidenced adjacent market could expand that ceiling?
operatingAssumptions:
  - assumption: "A target agent can provide a legally permitted, versioned export of every recipient source required for a covered case."
    basis: research.yaml
    validationTest: "Within 90 days, inspect redacted exports and permissions from 3 agents; compare them with case protocol requirements and test whether registered-recipient records are included."
    decisionImpact: "If sources are inaccessible or incomplete, stop claiming recipient completeness and do not build a dispatch product around CM/ECF alone."
  - assumption: "A case authority will approve a rehearsed alternate channel and define who may activate it."
    basis: research.yaml
    validationTest: "Review 3 recent retention orders and obtain written tabletop and activation criteria from bankruptcy counsel and one case decision-maker."
    decisionImpact: "If no authority pathway exists, limit the product to non-urgent reconciliation only and reassess whether that has a paid buyer."
  - assumption: "Providers will fund a distinct continuity control rather than rely on incumbent recovery or absorb it into ordinary noticing fees."
    basis: operator judgment
    validationTest: "Conduct 5 structured COO price discussions using a $5k–$10k paid pilot offer and seek one signed pilot with a budget owner."
    decisionImpact: "If no paid pilot is accepted, stop standalone GTM investment or pursue an incumbent-bundled model only if economics and vendor independence remain credible."
  - assumption: "A 15% complex, accessible share of commercial Chapter 11 cases and the $5,000 case-equivalent sizing proxy are directionally useful."
    basis: research.yaml
    validationTest: "Review 20 recent cases across 3 agents for case size, recipient-source complexity, outside-agent use, and actual engagement-fee treatment; replace the proxy with observed contract evidence."
    decisionImpact: "If fewer cases qualify or contracts cannot support the proxy, reduce the serviceable-market case and do not raise for a broad standalone platform."
  - assumption: "Sensitive case data can be handled with a customer-controlled key option, minimum retention, and an acceptable independent security review."
    basis: operator judgment
    validationTest: "Map a pilot data flow with agent security and case counsel; complete a threat review against NIST CSF 2.0 and obtain written acceptance of access, deletion, and incident procedures."
    decisionImpact: "If the security model is rejected or remediation is disproportionate to a pilot, do not host production recipient data."
experimentRoadmap:
  - horizon: 0–90 days
    experiment: "Interview 5 COOs or operations heads and 3 notice-operations teams; ask each to map current BCP, recipient sources, outage workaround, and who owns continuity spend."
    hypothesis: "At least 3 target agents experience a documented completeness or recovery gap that their existing BCP does not resolve."
    successMetric: "3 of 5 buyer interviews provide a specific unresolved workflow and name a budget owner; fewer than 2 is a stop signal."
    owner: Founder/CEO
  - horizon: 0–90 days
    experiment: "Review three case protocols or retention orders with bankruptcy counsel and one agent; draft a case-specific tabletop and live-activation checklist."
    hypothesis: "The agent and case authority can define a permitted fallback without treating the product as the notice-serving party."
    successMetric: "One written protocol accepted for a tabletop, including authority, eligible notices, channel, duplicate prevention, and evidence requirements."
    owner: Bankruptcy legal-operations lead with outside counsel
  - horizon: 0–90 days
    experiment: "Request redacted, permitted recipient exports from three agents and compare source coverage, identifiers, timestamps, and exceptions."
    hypothesis: "A file-based workflow can reconcile authorized sources without a BNC API or undocumented scraping."
    successMetric: "Two agents can demonstrate export rights and a reproducible reconciliation for one case; otherwise stop the completeness claim."
    owner: Founding engineer
  - horizon: 3–6 months
    experiment: "Build a minimal encrypted capsule and human-reviewed exception report on one redacted case dataset; have a security reviewer inspect the data flow."
    hypothesis: "A narrow file-based MVP can preserve provenance and expose missing or conflicting recipients without changing legal data."
    successMetric: "All records in the agreed source scope have provenance; zero unresolved critical exceptions at tabletop sign-off; no critical security finding left open."
    owner: Founding engineer and fractional security assessor
  - horizon: 3–6 months
    experiment: "Run a timed tabletop export with one independent approved notice partner and agent operations; rehearse primary-path recovery and duplicate prevention."
    hypothesis: "A partner can accept the case capsule and return evidence quickly enough to be operationally useful under written case procedures."
    successMetric: "One complete, documented handoff exercise meets the case protocol's time and evidence targets; record any non-actionable gaps before live use."
    owner: Partnerships lead and agent operations sponsor
  - horizon: 6–12 months
    experiment: "Offer a paid one-case pilot to qualified providers, gated on source permissions, security acceptance, and written tabletop authority."
    hypothesis: "At least one provider will pay separately for readiness after the incident has receded from the news cycle."
    successMetric: "One signed pilot worth at least $5,000; if none after 5 qualified offers, stop hiring and reassess the standalone model."
    owner: Founder/CEO
  - horizon: 12–18 months
    experiment: "Present measured reconciliation and exercise results to pilot buyers at renewal; test annual portfolio pricing against actual covered case-years and support effort."
    hypothesis: "A successful case pilot converts to recurring portfolio coverage rather than a one-off incident response."
    successMetric: "At least 1 of the first 2 completed pilots signs an annual retainer and agrees a renewal/exercise calendar."
    owner: Founder/CEO and implementation lead
operations:
  - "Use least-privilege, case-scoped access; encrypt data in transit and at rest; offer customer-controlled key management; log every export, view, approval, and handoff."
  - "Retain only fields needed for the authorized case protocol, set a case-specific deletion date, and provide a verifiable deletion record; do not repurpose recipient data across cases."
  - "Preserve source names, timestamps, versions, hashes, and exception dispositions; require human review for mismatches and prohibit silent address correction."
  - "Contract one independent notice partner with defined test obligations, capacity, dispatch evidence, and recovery coordination; verify approved status but obtain separate case authorization."
  - "Run scheduled tabletop exercises and a recovery/duplicate-prevention checklist before any activation; distinguish dispatch attempt evidence from proof that every recipient received notice."
  - "Use NIST CSF 2.0 as a risk-management reference for the data flow; obtain outside security and bankruptcy-counsel review before production data handling."
team:
  - role: Founder/CEO
    startTiming: Month 0
    rationale: Founder-led sales is necessary in a narrow buyer market; the CEO must secure agent sponsorship, counsel access, pilot budget, and partner agreements before scaling headcount.
  - role: Founding engineer
    startTiming: Month 0
    rationale: Owns secure ingestion, deterministic reconciliation, versioned case capsules, access controls, and audit evidence; avoid APIs until customer export rights are established.
  - role: Bankruptcy legal-operations lead, fractional
    startTiming: Month 0
    rationale: Maps case orders, authorized sources, service methods, and agent workflows; use a fractional operator and outside counsel until recurring demand is evidenced.
  - role: Security and privacy assessor, fractional
    startTiming: Month 1–3
    rationale: Reviews the second repository's threat model, key handling, retention, and incident process before any production recipient data is hosted.
  - role: Implementation and dispatch partnerships lead
    startTiming: Month 6–9, only after a paid pilot
    rationale: Standardizes onboarding and partner exercises after the first buyer validates the workflow; do not hire a broad sales team against an unverified market.
milestones:
  - horizon: 0–12 months
    items:
      - "By day 90, complete 5 buyer discussions, inspect 3 authorized source workflows, and secure one written tabletop approval path."
      - "By month 6, demonstrate source-provenance reconciliation on one redacted case and complete security review with no unresolved critical issue."
      - "By month 9, complete one timed handoff tabletop with an independent partner and test duplicate prevention on primary-path recovery."
      - "By month 12, sign at least one paid pilot of $5,000 or more with case-specific authority and a defined annual-retainer conversion decision."
  - horizon: 12–24 months
    items:
      - "Reach 3 paying case portfolios only if at least one pilot converts to an annual retainer and implementation hours per case are falling."
      - "Complete two scheduled portfolio exercises, document source coverage and exception-resolution time, and obtain at least one paid renewal."
      - "Use renewal and observed case-level pricing to replace the $5,000 sizing proxy and re-estimate the accessible market before adding integrations."
      - "If two pilots fail to convert or authority remains case-by-case unavailable, pause growth hiring and decide whether to stop or sell through an incumbent."
  - horizon: 24–36 months
    items:
      - "If bankruptcy renewals and partner operations meet target margins, run one paid feasibility pilot in a separately approved court-notice program; otherwise remain focused or stop."
      - "Set an expansion decision gate using signed recurring revenue, authorized addressable case-years, renewal, and human support hours; do not present adjacency as validated TAM."
      - "Maintain U.S.-only handling until privacy, procurement, and service-method requirements are independently reviewed for any new jurisdiction."
risks:
  - risk: "The complete authorized recipient set, especially BNC EBN/NCRS registrations, cannot be exported or independently retained before an outage."
    likelihood: High
    impact: High
    mitigation: "Validate permissions and sample exports with three agents before coding integrations; record source gaps and never claim completeness from CM/ECF alone."
  - risk: "Case authority will not pre-approve an independent fallback or its activation conditions."
    likelihood: High
    impact: High
    mitigation: "Make written case-specific approval a pilot gate; begin with a tabletop and keep live dispatch disabled until the proper authority approves."
  - risk: "Operators acknowledge the risk but will not buy a separate continuity retainer."
    likelihood: High
    impact: High
    mitigation: "Test a paid pilot with named budget owners before hiring GTM; compare standalone pricing with agent-fee inclusion and stop if neither supports recurring economics."
  - risk: "Established claims agents or notice providers bundle equivalent controls or provide private failover that makes a separate vendor unnecessary."
    likelihood: Medium
    impact: High
    mitigation: "Request exercise evidence from incumbents; position only on independently verified cross-provider provenance and authority records, and explore a licensed/bundled model if independence remains valuable."
  - risk: "A second repository of sensitive recipient data creates unacceptable security, privacy, retention, or conflicting-source risk."
    likelihood: Medium
    impact: High
    mitigation: "Minimize stored fields, use case-scoped access and customer-controlled keys, reconcile source versions, complete independent security review, and enforce case-specific deletion."
  - risk: "The low-frequency nature of outages makes readiness easy to defer and leaves the narrow market below venture scale."
    likelihood: High
    impact: High
    mitigation: "Attach exercises to case onboarding and renewals, measure paid conversion and renewal, validate actual case-years, and do not fund adjacent-market expansion without separate paid proof."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$1–2M"
  runwayMonths: 18
  useOfFundsSummary: "Operator target, not a completed financial model: 18 months funds a secure file-based MVP, fractional bankruptcy counsel and security review, one independent dispatch-partner integration, and 1–2 authorized paid pilots plus renewal tests with a lean founding team. It does not fund national court procurement, broad API integrations, or adjacent-market expansion before buyer, data-access, and authority gates pass."
