slug: bankruptcy-notice-escrow
date: "2026-10-20"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: "模型起始月份"
    value: "2026-11"
    unit: YYYY-MM
    source: "[business-plan.yaml date 2026-10-20；模型口径：从下一个完整自然月起]"
  - id: A2
    name: "付费客户口径"
    value: "一个客户组合等价数代表一个正在接受持续性服务试点或年度服务合同的活跃付费案件组合。小数反映流失与增长爬坡按概率加权后的预期值，不代表法律实体可以拆分。"
    unit: portfolio equivalents
    source: "[business-plan.yaml businessModel.unitOfValue 与 gtm.pricing；低销量下预期客户数的模型口径]"
  - id: A3
    name: "活跃客户组合年收入"
    value: "Y1 活跃客户组合年化 ARPU 为 7.5，Y2 为 12，Y3 为 15；模型未单独计入设置费、启用费或邮资转付收入。"
    unit: "USDK/客户组合年"
    source: "[business-plan.yaml gtm.pricing 与 investorMemo.firstCustomer.initialContract；Y1 落在 $5K-$10K 试点区间，后续年度落在 $5K-$20K 年度服务区间；费率是年化规划假设，定价尚未验证]"
  - id: A4
    name: "收入确认与回款时点"
    value: "月收入按期初、期末客户组合等价数的均值乘年 ARPU，再除以 12；季度收入按月均客户组合等价数乘年 ARPU，再除以 4。试点按月度服务覆盖收入建模，不按预收固定费用处理；假定回款与支出均发生在收入确认期内。"
    unit: "计算与时点口径"
    source: "[business-plan.yaml businessModel 与 gtm.pricing；初创企业财务规划口径；目前没有合同开票或回款历史]"
  - id: A5
    name: "付费客户增长路径"
    value: "模型起始时为 0；M10 新增 1 个付费试点，假设该试点到 M18 转为年度客户组合服务合同；Y2 各季度末活跃客户组合等价数依次为 1.2、2.0、2.4、3.0，Y3 依次为 3.5、4.0、4.5、5.0。"
    unit: active portfolio-equivalents
    source: "[business-plan.yaml gtm.funnelTargets、milestones 与 killCriteria；research.yaml market.sam、market.som 与 bottomUpSizingDrivers；仅为预测目标，不代表销售线索或已签约客户]"
  - id: A6
    name: "月度客户流失率"
    value: "1.5"
    unit: percent per month
    source: "针对尚未验证的持续性 B2B 服务采用初创企业财务规划经验值；research.yaml reportMemo.customerAndBuyer 确认没有留存证据，因此客户流失率不是观测值。"
  - id: A7
    name: "毛利率与直接成本率"
    value: "基准毛利率为 70%；合作伙伴、安全存储和案件级交付的可变 COGS 占收入 30%。"
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct 与 operations；30% COGS 是按毛利率倒算的成本比例，并非供应商成本实测值]"
  - id: A8
    name: "期初现金与当前 pre-seed 融资"
    value: "期初现金为 0；M1 融资流入 1250"
    unit: USDK
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd 给出的 $1M-$2M 区间；模型依据 A21 选择其中 $1.25M；这笔融资尚未落实]"
  - id: A9
    name: "招聘顺序与六期 FTE 计划"
    value: "CEO 和创始工程师 M1 入职；首个付费试点落地后，实施与调度合作负责人于 M10 入职；业务具备可重复性后，第二位工程师于 M22 入职；客户组合等价数达到四个后，客户实施负责人于 M31 入职。q1y1、q2y1、q3y1、q4y1、q4y2、q4y3 的 FTE 快照依次为 2、2、2、3、4、5。"
    unit: "FTE 与招聘安排"
    source: "[business-plan.yaml team、strategicChoices.sequencingRationale、product.sixMonth 与 milestones；后续招聘是受条件约束的规划假设，并非承诺]"
  - id: A10
    name: "创始人及 CEO 含雇主负担的现金薪酬"
    value: "120"
    unit: "USDK/FTE 年"
    source: "精简型 pre-seed 创始人薪酬的初创企业财务规划经验值，含雇主负担；未参考薪酬调查。"
  - id: A11
    name: "创始工程师含雇主负担的现金薪酬"
    value: "150"
    unit: "USDK/FTE 年"
    source: "[business-plan.yaml team 中的创始工程师岗位；内部初创企业财务规划估算，含雇主负担，并非市场调查]"
  - id: A12
    name: "实施与调度合作负责人含雇主负担的现金薪酬"
    value: "115"
    unit: "USDK/FTE 年"
    source: "[business-plan.yaml team 中的实施与调度合作负责人岗位；内部初创企业财务规划估算，含雇主负担，并非市场调查]"
  - id: A13
    name: "第二位工程师含雇主负担的现金薪酬"
    value: "150"
    unit: "USDK/FTE 年"
    source: "[business-plan.yaml 产品与安全里程碑；针对受条件约束的工程岗位所作初创企业财务规划估算，含雇主负担]"
  - id: A14
    name: "客户实施负责人含雇主负担的现金薪酬"
    value: "105"
    unit: "USDK/FTE 年"
    source: "[business-plan.yaml 十二个月和二十四个月客户导入目标；针对受条件约束的客户运营岗位所作初创企业财务规划估算，含雇主负担]"
  - id: A15
    name: "工资分摊与列示口径"
    value: "CEO 薪酬按 25% 计入 S&M、10% 计入 R&D、65% 计入 G&A；创始工程师和第二位工程师的薪酬 100% 计入 R&D；实施与调度合作负责人薪酬按 50% 计入 S&M、50% 计入 G&A；客户实施负责人薪酬按 30% 计入 S&M、70% 计入 G&A。salaryK 是含雇主负担的工资总额，已计入各职能 OPEX，不会重复加计。"
    unit: allocation convention
    source: "[business-plan.yaml team 与创始人主导的 GTM；内部费用分摊口径；salaryK 是备忘列示项，不会重复计入 OPEX]"
  - id: A16
    name: "非工资销售与营销预算"
    value: "Y1 每月 2；Y2 每季度 5；Y3 每季度 7.5"
    unit: USDK per period
    source: "[business-plan.yaml gtm.channels、gtm.funnelTargets 与 strategicChoices.sequencingRationale；精简型创始人主导拓客及差旅规划经验值，并非实测 CAC 预算]"
  - id: A17
    name: "非工资研发预算"
    value: "Y1 每月 10；Y2 每季度 30；Y3 每季度 35"
    unit: USDK per period
    source: "[business-plan.yaml product.mvp、product.sixMonth、operations 与安全里程碑；对安全文件工作流、测试工具及专业支持的内部规划估算]"
  - id: A18
    name: "非工资管理费用预算"
    value: "Y1 每月 8；Y2 每季度 22.5；Y3 每季度 25"
    unit: USDK per period
    source: "[business-plan.yaml operations 与 operatingAssumptions；对外部破产法律顾问、安全审查、保险、会计和行政管理的内部规划估算]"
  - id: A19
    name: "全口径客户获取成本"
    value: "三年非工资 S&M 共 74K，另计入销售归属工资 116.4375K；两者合计除以新增客户组合等价数 5.9859，CAC 为 31.8141K。销售工资分摊比例分别为 CEO、合作负责人和客户实施负责人含雇主负担薪酬的 10%、25% 和 30%。"
    unit: "USDK/新增客户组合等价数"
    source: "[business-plan.yaml 创始人主导的 GTM 与 team；根据 A5、A10-A16 推算；销售工时占比采用初创企业财务经验值，工资已计入 OPEX]"
  - id: A20
    name: "单位经济模型公式"
    value: "平均客户存续期＝1 ÷ 月度客户流失率；LTV＝Y3 年 ARPU ÷ 12 × 毛利率 ÷ 月度客户流失率；CAC 回收期＝CAC ÷ 单个客户组合的月毛利。基准结果：平均存续期 66.67 个月、LTV 58.33K、LTV:CAC 1.83x、CAC 回收期 36.36 个月。"
    unit: "公式与派生指标"
    source: "按初创企业财务规划中的单位经济模型口径，套用 A3、A6、A7 和 A19；目前没有产品留存或获客历史。"
  - id: A21
    name: "覆盖验证里程碑及六个月缓冲的 pre-seed 融资申请"
    value: "截至 M18 的净经营现金消耗为 840.319K，M19-M24 净消耗为 335.548K；覆盖 18 个月里程碑并留出六个月缓冲，共需约 1,175.867K。按 1.25M 融资申请测算，M24、后续有条件融资到账前约剩 74.133K。"
    unit: USDK
    source: "[business-plan.yaml fundingAsk.runwayMonths 与 useOfFundsSummary；根据 A3-A9 和 A15-A18 推算；六个月缓冲明确用于应对里程碑后的执行风险]"
  - id: A22
    name: "本轮 pre-seed 资金用途分配"
    value: "工程 43%；GTM 15%；G&A 15%；六个月缓冲 27%，合计 1.25M。"
    unit: percent and USDM
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary 中的资金用途优先级；内部预算分配经验值，并与 A8、A21 对齐]"
  - id: A23
    name: "验证通过后的有条件种子轮融资"
    value: "M25 月初融资 1500，前提是 M24 达成来源授权、付费客户组合和续约里程碑。这笔融资不属于当前融资申请，也尚未落实。"
    unit: USDK and timing
    source: "[business-plan.yaml 第 12-24 个月和第 24-36 个月的 milestones；初创企业后续融资规划经验值；下行情景假设没有后续融资]"
  - id: A24
    name: "现金滚动计算口径"
    value: "期末现金 EOP＝期初现金 BOP＋EBITDA＋融资流入。模型未计入债务、税费、capex、营运资金时点或融资费用。"
    unit: calculation convention
    source: "初创企业财务规划口径；business-plan.yaml 和 research.yaml 均未提供资产负债表或融资费用数据。"
  - id: A25
    name: "下行情景"
    value: "首个付费试点推迟至 M18；到 M24 时有 2 个客户组合等价数，到 M36 时有 3 个；年 ARPU 保持在 10K，毛利率为 60%；实施负责人 M19 入职，后续招聘延后；M18 后削减非工资 S&M 和 R&D，不融资种子轮。测算得出 Y3 收入 22.09K、EBITDA -551.746K、现金最低点 -365.857K。"
    unit: scenario
    source: "[business-plan.yaml killCriteria、operatingAssumptions 与 milestones；针对没有付费试点、没有续约的保守止损决策]"
  - id: A26
    name: "上行情景"
    value: "试点于 M9 启动；到 M36 时，客户组合等价数达到 8 个；Y3 年 ARPU 达到 20K、毛利率达到 75%；招聘按基准计划推进，有条件的 M25 种子轮融资也完成。测算得出 Y3 收入 128.097K、EBITDA -761.427K、现金最低点 91.013K。"
    unit: scenario
    source: "[business-plan.yaml gtm.pricing、businessModel.targetGrossMarginPct、market.som 与 milestones；乐观但有边界的敏感性情景，并非经过验证的需求]"
  - id: A27
    name: "敏感性分析口径"
    value: "每次只改变一个变量；下行情景的影响以基准预测为参照；销售周期变化会使客户增长时间表整体移动一个季度；客户流失率敏感性保持新增客户数不变，CAC 敏感性保持获客数不变；招聘敏感性将所有受条件约束的岗位整体移动一个季度；现金影响按模型截至 M36 的期末现金差额计算。"
    unit: sensitivity method
    source: "按 A5-A24 进行模型计算的口径；敏感性数值是规划测试结果，并非实际观测结果。"
  - id: A28
    name: "合理性指标定义与方向性经验值"
    value: "40 法则＝Y3 收入增速＋Y3 EBITDA 利润率；现金消耗倍数＝Y3 EBITDA 现金消耗 ÷ 期末 ARR 净增额；每 FTE 收入按 Q4Y3 FTE 计算；通用早期 SaaS 规划经验值为 LTV:CAC 3x、CAC 回收期低于 18 个月、每 FTE 年收入 200K-400K。"
    unit: "公式与方向性基准"
    source: "仅引用通用的初创企业财务经验值；未声称进行过网络研究，也未引用公司特定基准。"
