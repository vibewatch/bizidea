modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      Sources[Authorized recipient sources] --> Portfolio[Paid portfolio pilot or retainer]
      Portfolio --> Customers[Average active portfolio equivalents]
      Customers --> Revenue[Annual ARPU times active customers]
      Revenue --> COGS[Partner and secure-storage costs]
      Revenue --> GrossProfit[Gross profit]
      COGS --> GrossProfit
      GrossProfit --> EBITDA[EBITDA after payroll and operating expenses]
      Financing[Conditional financing] --> Cash[Cash balance]
      EBITDA --> Cash
modelSanity:
  - checkName: "收入引擎"
    finding: "Y3 基准收入为 $56.7K，按年末五个付费客户组合等价数和 $15K 年 ARPU 计算；模型未计启用费或转付邮资。"
  - checkName: "必须跑通的关口"
    finding: "M18 时要有两个付费客户组合等价数，M24 时要有三个；桌面演练获批，且至少拿下一次付费续约。这些条件必须支撑 M25 有条件种子轮融资。"
  - checkName: "模型失效条件"
    finding: "来源授权或续约关口若未通过，M25 种子轮融资就无法获得；下行情景现金最低点为负 $365.9K，招聘若提前一个季度，还会额外消耗 $92.5K。"
  - checkName: "下一轮融资前的验证"
    finding: "在把 M25 种子轮融资纳入预测前，先证明数据源导出合法且完整、案件桌面演练获批、拥有三个付费客户组合，并确保截至 M24 已完成一次付费续约。"
sanityChecks:
  ruleOf40: "Y3 收入增速 177.3% + EBITDA 利润率 -1,443.4% = -1,266.1%；收入增速的基数很小。"
  burnMultiple: "现金消耗倍数为 21.0x：Y3 EBITDA 现金消耗 $817.8K ÷ 期末 ARR 净增额 $39.0K；结果非常不利，且在当前模型规模下噪声较大。"
  revenuePerFte: "按 Q4Y3 的 5 个 FTE 计算，Y3 每 FTE 收入仅 $11.3K；通用规模化 SaaS 规划经验值为 $200K-$400K。"
  flags:
    - "研究未找到针对持续性服务的定价、预算、付费合同或买家访谈；ARPU 和客户流失率仍是未经验证的假设。"
    - "Y3 基准收入 $56.7K 低于研究中的示例性 $0.2M SOM，并依赖狭窄市场里的五个客户组合等价数。"
    - "LTV:CAC 仅为 1.83x，CAC 回收期为 36.36 个月，不及通用的 LTV:CAC 3x、CAC 回收期低于 18 个月这两条初创企业财务经验线。"
    - "Y3 的 40 法则结果大幅为负，现金消耗倍数达 21.0x；尽管收入增速百分比很高，当前经济性仍不足以支撑风险投资级扩张。"
    - "在有条件且尚未落实的 $1.5M 种子轮融资前，M24 现金降至 $74.1K；不融资的下行情景现金最低为负 $365.9K。"
    - "现金表假设回款与收入确认发生在同一期间，不计预付固定试点费，也未计税费、营运资金、债务、capex 或融资费用；实际收入确认时点和现金跑道可能不同。"
    - "Y3 按年末 FTE 计算的人均收入仅为 $11.3K，显示人员利用率偏低；但这一判断基于规模很小的预测。"
modelBasis:
  revenueFormula: "月度收入按月均客户组合数乘以年 ARPU 再除以 12 计算，季度收入按月均客户组合数乘以年 ARPU 再除以 4 计算；详见 A2-A5。"
  customerRollForward: "customersEop＝customersBop＋newCustomers－churnedCustomers；小数表示按概率加权的客户组合等价数；详见 A5-A6。"
  payrollAndOpex: "salaryK 汇总 A9-A14 各岗位含雇主负担的工资；各职能费用加上工资分摊和 A15-A18 的非工资预算后，合计为 opexK。"
  cashFormula: "cashEopK＝cashBopK＋ebitdaK＋financingInflowK；详见 A8 和 A21-A24。"
