scenarios:
  downside:
    description: "付费试点延后、客户组合转化放缓、ARPU 和毛利率走低、招聘受条件约束、削减成本且没有后续融资；到 Y3 时，公司现金转为负数。"
    y3RevenueK: 22.09
    y3EbitdaK: -551.746
    cashLowPointK: -365.857
    keyAssumptionChanges:
      - "首个付费试点从 M10 延至 M18；到 M24 时客户组合等价数达到 2 个，到 M36 时达到 3 个。"
      - "年 ARPU 为 10K，Y3 毛利率为 60%。"
      - "实施负责人要等延后的试点启动后才入职；后续招聘推迟，M18 后削减非工资 S&M 和 R&D。"
      - "M25 种子轮融资未能完成。"
  base:
    description: "基准方案到 Q4Y3 时有五个活跃客户组合等价数，年 ARPU 为 15K；EBITDA 仍为负，还依赖 M25 有条件种子轮融资。"
    y3RevenueK: 56.6603
    y3EbitdaK: -817.8374
    cashLowPointK: 74.1325
    keyAssumptionChanges:
      - "M10 落地首个付费试点；到 M24 时有三个活跃客户组合等价数，到 M36 时有五个。"
      - "年 ARPU 从 Y1 的 7.5K 升至 Y2 的 12K、Y3 的 15K，毛利率为 70%。"
      - "只有来源授权、续约和客户组合规模都得到验证，M25 才会完成有条件的 1.5M 种子轮融资。"
  upside:
    description: "付费需求更早出现；到 Q4Y3 时，活跃客户组合等价数达到八个。定价更高、直接成本效率更好，收入因此提升，但 EBITDA 尚未转正。"
    y3RevenueK: 128.097
    y3EbitdaK: -761.427
    cashLowPointK: 91.013
    keyAssumptionChanges:
      - "付费试点于 M9 启动；到 M36 时，客户组合等价数达到八个。"
      - "Y3 年 ARPU 达到 20K，毛利率达到 75%。"
      - "维持基准招聘计划，并完成有条件的 M25、1.5M 种子轮融资。"
