sanityChecks:
  ruleOf40: "Directional only: Y3 revenue growth 61.8% + EBITDA margin -409.9% = -348.1%; not a suitable KPI for a campaign-based service."
  burnMultiple: "10.7x Y3 net burn ($409.9K) divided by net-new annual revenue ($38.2K); service revenue is not ARR, so this is directional and poor."
  revenuePerFte: "Y3 revenue is $25.0K per 4.0 year-end FTE; low for scale but not directly comparable to mature SaaS because this is a validation-stage service."
  flags:
    - "No standalone buyer, purchase order, or aerial-evidence acceptance standard has been verified; the three modeled customer wins are hypotheses, not sourced demand."
    - "The base cash low point is only $168.88K before an uncommitted $1.25M seed in Q4Y2; without that round, modeled Y3 ending cash is negative."
    - "The 60% gross-margin target has no binding partner quote behind it; business-plan.yaml requires at least 40% pilot margin before scaling."
    - "CAC payback is 36.8 months and LTV/CAC is 2.7x, both fragile because churn is a heuristic and service renewals are not observed."
    - "Y3 EBITDA remains negative at $409.93K and revenue is only $100.0K; keep hiring and spend gated, and do not describe this as venture-scale proof."
    - "Campaign revenue is smoothed and cash is assumed to settle in-period with no working-capital, tax, or capex needs; actual flight timing and payment terms can worsen the runway."
