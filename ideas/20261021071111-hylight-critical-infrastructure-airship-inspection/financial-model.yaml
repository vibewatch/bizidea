slug: methane-repair-closeout-proof
date: "2026-10-21"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Forecast start
    value: "2026-10"
    unit: YYYY-MM
    source: "business-plan.yaml date; model begins in the report month."
  - id: A2
    name: EUR to USD planning conversion
    value: "€1 = $1.10"
    unit: exchange rate
    source: >-
      Explicit planning heuristic only, used to translate EUR campaign pricing into USD; no live FX quote or
      web research was used, so refresh before financing or contracting.
  - id: A3
    name: Base campaign fee
    value: "€17,500 or $19.25K"
    unit: USD per fixed-fee campaign
    source: >-
      business-plan.yaml.gtm.pricing gives an unvalidated €10,000–€25,000 test range; business-plan.yaml.market
      and research.yaml.market.tam use €17,500 as scenario math, not a published tariff or observed willingness
      to pay; USD conversion uses A2.
  - id: A4
    name: Campaigns per active account-year
    value: "2"
    unit: campaigns per TSO account-year
    source: >-
      research.yaml.market.sam and som scenario math assume two campaigns per account-year; this is an
      unvalidated frequency hypothesis, not a customer commitment.
  - id: A5
    name: Annual revenue per active account
    value: "$38.5K"
    unit: USD per TSO account-year
    source: "Calculated from A3 × A4; revenue is campaign-based, not subscription ARR."
  - id: A6
    name: Base paid-account acquisition timing
    value: "One account in M10, one in M16, and one in M25"
    unit: new TSO accounts
    source: >-
      Hypothesis anchored to business-plan.yaml milestones targeting one paid campaign by month 12 and two
      paying TSOs by month 24; the third account is a low-confidence extension of research.yaml's assumed
      eight-account SAM and is not verified demand.
  - id: A7
    name: Monthly account attrition
    value: "1.0%"
    unit: percent per month
    source: >-
      Startup-finance planning heuristic, not observed retention; a constant monthly hazard is used to calculate
      expected active-account equivalents until actual campaign renewal cohorts exist.
  - id: A8
    name: Base gross margin
    value: "60%"
    unit: percent of revenue
    source: >-
      business-plan.yaml.businessModel.targetGrossMarginPct; equivalent to 40% partner-flight and direct
      delivery cost of revenue, not yet supported by binding partner quotes.
  - id: A9
    name: CEO / commercial founder annual loaded cost
    value: "$75,000"
    unit: USD per FTE-year
    source: >-
      Startup-finance salary heuristic for a lean pre-seed founding team; modeled as loaded annual cash cost
      including employer burden, not a market quote.
  - id: A10
    name: Field methane measurement lead annual loaded cost
    value: "$90,000"
    unit: USD per FTE-year
    source: >-
      Startup-finance salary heuristic for a specialist early-stage hire; modeled as loaded annual cash cost
      including employer burden, not a market quote.
  - id: A11
    name: Founding product engineer annual loaded cost
    value: "$90,000"
    unit: USD per FTE-year
    source: >-
      Startup-finance salary heuristic for a lean early-stage product hire; modeled as loaded annual cash cost
      including employer burden, not a market quote.
  - id: A12
    name: Partner operations lead annual loaded cost
    value: "$75,000"
    unit: USD per FTE-year
    source: >-
      Startup-finance salary heuristic for an early operations hire; modeled as loaded annual cash cost
      including employer burden, not a market quote.
  - id: A13
    name: Partner operations hire timing
    value: "M3, only after a signed pilot path"
    unit: start month and gate
    source: "business-plan.yaml.team; the base case assumes this unverified gate is met by month 3."
  - id: A14
    name: Non-payroll sales and marketing budget
    value: "$45K in Y1, $45K in Y2, and $55K in Y3"
    unit: USD thousands per year
    source: >-
      Startup-finance budget heuristic for founder-led TSO outreach, partner qualification, and procurement
      travel; excludes salaries and is not based on observed CAC.
  - id: A15
    name: Non-payroll research and development budget
    value: "$65K in Y1, $45K in Y2, and $40K in Y3"
    unit: USD thousands per year
    source: >-
      Startup-finance budget heuristic for protocol testing, independent measurement support, and minimal
      evidence-packet tooling; no aircraft or methane sensor purchase is assumed.
  - id: A16
    name: Non-payroll general and administrative budget
    value: "$40K in Y1, $40K in Y2, and $45K in Y3"
    unit: USD thousands per year
    source: >-
      Startup-finance budget heuristic for legal, insurance, procurement, accounting, and administration in
      one country; not based on vendor quotes.
  - id: A17
    name: Pre-seed funding ask
    value: "$950K"
    unit: USD
    source: >-
      business-plan.yaml.fundingAsk.targetFundingRangeUsd is $0.75–1.0M; the model selects the upper end to
      fund 18 months of validation plus an approximately six-month operating reserve.
  - id: A18
    name: Conditional follow-on seed financing
    value: "$1.25M in Q4Y2, month 22"
    unit: USD thousands and timing
    source: >-
      Startup-finance planning assumption only; no follow-on commitment is in the business plan. The cash
      forecast requires a new round after the paid-pilot, evidence-acceptance, repeat-account, and margin gates;
      it is excluded from fundingAsk.amountM.
  - id: A19
    name: Cash conversion and capital expenditure
    value: "Same-period collections and supplier payments; $0 capex, debt, tax, interest, and working-capital change"
    unit: cash flow convention
    source: >-
      Simplifying startup-finance heuristic consistent with business-plan.yaml's partner-delivered, no-aircraft
      strategy; actual procurement, payment, and tax timing can worsen cash.
  - id: A20
    name: Revenue recognition and account-equivalent method
    value: "Average active accounts × A5 / 12 each month"
    unit: calculation convention
    source: >-
      Model simplification for fixed-fee campaigns: revenue is smoothed across the assumed annual call-off
      cadence, with same-period collection per A19; actual campaign revenue will be lumpy and depends on
      accepted scope and delivery.
  - id: A21
    name: Fully loaded CAC
    value: "$70.8K per acquired account"
    unit: USD per TSO account
    source: >-
      Calculated as three-year non-payroll S&M from A14 ($145K) plus 30% of CEO salary from A9 ($67.5K),
      divided by the three new accounts in A6; CEO allocation is a planning heuristic and is not added again
      to P&L expense.
  - id: A22
    name: Pre-seed use-of-funds allocation
    value: "Engineering $360K; GTM $195K; G&A $170K; six-month buffer $225K"
    unit: USD
    source: >-
      Management budget allocation heuristic based on A9–A16; totals $950K and assigns a reserve close to
      six months of modeled net operating burn after the month-18 proof period.
  - id: A23
    name: Downside scenario inputs
    value: "One paid account in M16; €15K fee; one campaign per year; 40% gross margin; no seed; ops hire M16"
    unit: scenario parameters
    source: >-
      Stress case using the lower half of business-plan.yaml's unvalidated campaign-price range and its 40%
      minimum pilot-margin kill threshold; no buyer demand is asserted, and full planned non-payroll spend
      continues to expose downside cash risk.
  - id: A24
    name: Upside scenario inputs
    value: "Four accounts in M8, M14, M20, and M26; €20K fee; 2.5 campaigns per year; 0.5% monthly attrition; 65% gross margin"
    unit: scenario parameters
    source: >-
      Sensitivity-only hypothesis within the business-plan.yaml pricing range and research.yaml central
      campaign-frequency scenario; account wins, margin, and purchase frequency are unverified, not market data.
  - id: A25
    name: Campaign-price sensitivity
    value: "€15K downside, €17.5K base, and €25K upside"
    unit: EUR per campaign
    source: "business-plan.yaml.gtm.pricing; endpoints are unvalidated test prices, with A2 used for conversion."
  - id: A26
    name: Attrition sensitivity
    value: "2.0% downside, 1.0% base, and 0.5% upside"
    unit: percent per month
    source: "Startup-finance scenario range around A7; no service-account retention evidence was found."
  - id: A27
    name: CAC sensitivity
    value: "$90K downside, $70.8K base, and $50K upside"
    unit: USD per TSO account
    source: >-
      Planning stress range around A21; downside treats excess CAC as additional cash GTM spend above
      the base budget, with no revenue change at fixed logo count.
  - id: A28
    name: Sales-cycle sensitivity
    value: "Delay each base win by six months; seed does not close within the 36-month horizon"
    unit: scenario timing
    source: >-
      Stress test of business-plan.yaml's concentrated TSO procurement risk; seed failure is a financing
      consequence, not a sourced market statistic.
  - id: A29
    name: Gross-margin sensitivity
    value: "40% downside, 60% base, and 65% upside"
    unit: percent of revenue
    source: >-
      The 40% floor and 60% target come from business-plan.yaml strategy and kill criteria; 65% is a
      planning heuristic for denser repeat batches, not a partner quote.
  - id: A30
    name: Hiring-timing sensitivity
    value: "M1 downside, M3 base, and M4 upside for partner operations"
    unit: start month
    source: >-
      business-plan.yaml.team gates the role at month 3; earlier hiring is a cash-risk stress and a one-month
      deferral is a leaner scenario if the partner handles logistics.
