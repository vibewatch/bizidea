fundingAsk:
  round: pre-seed
  amountM: 0.95
  runwayMonths: 18
  milestone: >-
    Reach month 18 with an operator-approved evidence protocol, one paid campaign and at least 10 eligible
    attempts where available, documented partner quotes supporting at least 40% pilot gross margin, and a
    repeat or second-TSO procurement path; only then pursue the conditional seed round.
  useOfFunds:
    - bucket: Engineering
      amountUsd: 360000
      percentage: 37.9
    - bucket: GTM
      amountUsd: 195000
      percentage: 20.5
    - bucket: "G&A"
      amountUsd: 170000
      percentage: 17.9
    - bucket: "Buffer (6 mo)"
      amountUsd: 225000
      percentage: 23.7
scenarios:
  downside:
    description: >-
      Severe validation failure case, not a forecast: one lower-priced account closes late, only one campaign
      repeats per year at the minimum pilot margin, the operations hire waits for a paid path, and no seed
      financing closes while the founding team continues planned spending.
    y3RevenueK: 14.33
    y3EbitdaK: -464.19
    cashLowPointK: -355.89
    keyAssumptionChanges:
      - "Only one paid TSO account, acquired in M16, versus three base-case wins."
      - "Campaign price is €15,000 with one campaign per account-year and 40% gross margin."
      - "The $1.25M Q4Y2 seed is not raised; full planned non-payroll spend continues as a stress test."
  base:
    description: >-
      Hypothesis case: three account additions occur in M10, M16, and M25 at two campaigns per account-year,
      with 60% gross margin and a conditional, uncommitted seed round in Q4Y2.
    y3RevenueK: 100.0
    y3EbitdaK: -409.93
    cashLowPointK: 168.88
    keyAssumptionChanges:
      - "Uses the €17,500 central planning fee, two annual campaigns, and 1% monthly account attrition."
      - "Includes $1.25M of follow-on seed financing in Q4Y2, separate from the $0.95M pre-seed ask."
  upside:
    description: >-
      Sensitivity-only case, not sourced demand: four earlier TSO wins and denser repeat campaigns improve
      revenue and gross margin, while the same follow-on financing is assumed to close.
    y3RevenueK: 199.35
    y3EbitdaK: -340.34
    cashLowPointK: 202.96
    keyAssumptionChanges:
      - "Four new accounts arrive in M8, M14, M20, and M26, with 0.5% monthly attrition."
      - "Campaign price is €20,000, frequency is 2.5 campaigns per account-year, and gross margin is 65%."
sensitivity:
  - variable: "sales cycle"
    downsideCase: "Delay each base account win by six months; the follow-on seed does not close by Y3."
    baseCase: "Account wins in M10, M16, and M25; conditional $1.25M seed closes in Q4Y2."
    upsideCase: "No delay to base wins and the conditional seed closes on schedule."
    y3RevenueImpactK: -13.74
    cashImpactK: -1279.56
  - variable: "ARPU"
    downsideCase: "€15K per campaign × 2 per account-year; annual ARPU is $33.0K."
    baseCase: "€17.5K per campaign × 2 per account-year; annual ARPU is $38.5K."
    upsideCase: "€25K per campaign × 2 per account-year; annual ARPU is $55.0K."
    y3RevenueImpactK: -14.3
    cashImpactK: -14.52
  - variable: "CAC"
    downsideCase: "$90K per logo, requiring $57.51K incremental GTM cash for three logos."
    baseCase: "$70.8K per logo, including allocated CEO sales time."
    upsideCase: "$50K per logo, with the same three-logo count."
    y3RevenueImpactK: 0.0
    cashImpactK: -57.51
  - variable: "churn"
    downsideCase: "2.0% monthly account attrition."
    baseCase: "1.0% monthly account attrition."
    upsideCase: "0.5% monthly account attrition."
    y3RevenueImpactK: -11.88
    cashImpactK: -9.36
  - variable: "gross margin"
    downsideCase: "40% gross margin."
    baseCase: "60% gross margin."
