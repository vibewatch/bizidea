  saturationRationale: >-
    到 36 页上限时，最后几轮能补充实质信息的查阅，大多再次印证了已观察到的维修后验证、检测限值和卫星替代方案模式。另有一项独立纵向维修研究，进一步凸显了相邻做法带来的竞争风险。没有来源给出维修后单独航飞的价格，也没有买方采购订单；八个研究问题现都有证据支撑的回答。
  coverageGap: >-
