slug: methane-repair-closeout-proof
date: "2026-10-21"
executiveSummary: >-
  为欧洲天然气输送运营商提供由合作伙伴执行、按固定费用计价的甲烷维修闭环核验服务，而不是制造飞艇或搭建通用巡检平台。首个客户假设是：管道完整性或排放团队已发现带地理标签的航测甲烷异常，并安排了维修批次；研究尚未找到任何经核实的独立买方、预算科目或针对拟议闭环航测的采购订单。先把原始异常发现与维修记录关联起来，再按预先约定的可比条件安排复飞，最终交付可追溯的闭环结论或无法判定的证据包。EU（欧盟）甲烷规则要求开展泄漏调查、及时维修并监测维修效果，但没有规定必须进行航空复测；US 航测制图合同只能说明更广义类别存在预算，不能证明欧盟 TSO 对本服务有需求。研究基于假设的客户数、活动频率和定价，自下而上估算年度 TSO TAM 为 €1.9M、SAM 为 €0.24M、SOM 为 €0.06M；这些不是公开市场估算，也不是预测。SLB 已宣传维修效果验证服务；航测供应商、地面 OGI、运营商巡线、固定传感器和卫星都可以捆绑或替代这套工作流。首选路径是依托现有 LDAR 或航测供应商销售付费附加服务，因为必须取得运营商准入并安排第二次飞行，独立采购是否成立尚未验证。只按阶段推进 pre-seed 验证：先拿到书面证据认可、付费试点和可行的合作伙伴经济模型，再开发集成或扩招以求规模化。
problem:
  - >-
    带地理位置的甲烷异常发现和标记为已完成的维修，单凭两者并不能证明：在适合对比的条件下，原始信号是否已经消失。
  - >-
    运营商必须监测维修效果，但已审阅的 EU 指南没有规定进行航空复测；具体的闭环核验流程及其独立预算仍是假设。
  - >-
    第二次飞行可能延迟，也可能无法得出结论，因为风况、传感器阈值、准入或飞行可用性会发生变化；若没有获认可的规程和备选方案，就不能把未检出安全地当作证明。
solution:
  - >-
    针对明确的一批维修，接收运营商认可的带地理标签的异常发现和维修记录，再与合格服务商协调复飞；只有当约定的传感器、航线和运行范围足以支持比较时，才比较结果。
  - >-
    交付可供审核人员直接审阅的证据包，把位置、时间、传感器配置、现场条件、维修证据和复测结果关联到工单编号；条件不合适或结果含糊的尝试标为无法判定，并转交另一趟飞行或地面复核。
  - >-
    按作业批次和核验尝试收费，无论甲烷信号是否消失，收费方式都不变，避免团队为了得出有利的闭环结论而受到激励。
whyWeWin:
  - >-
    可出售的计价单位，是与某项具体发现挂钩的一次维修闭环核验尝试，不是飞行小时、又一条告警或大而全的巡检看板。
  - >-
    由合作伙伴交付，无需自购航空器，也可纳入现有 LDAR 或航测合同，降低资本投入和供应商资质审核负担。
  - >-
    明确标注无法判定，并采用运营商认可的证据格式，有助于让结果可审计；但这两点目前都构不成技术护城河，现有厂商也能复刻或捆绑这套流程。
strategicChoices:
  beachhead: >-
    选择一个欧洲国家的一家天然气输送运营商；该运营商已有航空甲烷异常发现、近期维修批次，以及愿意共同确定闭环标准的管道完整性或排放审核人员。
  wedgeRationale: >-
    一批维修就能构成边界清晰的付费测试，用来验证预算、复飞准入、证据认可和合作伙伴成本。把闭环核验作为原航测或 LDAR 合同的附加服务销售，避免在工作流验证前就要求运营商采购一种新的航空器类别。
  sequencingRationale: >-
    先确认真实买方、维修工单流程和书面验收标准；再签约锁定合作伙伴运力并开展受控试点；只有出现付费复购需求后，才把证据包生成自动化、招聘交付人员或扩大采购覆盖范围。这样能维持轻资产模式，代价是销售更慢，也更依赖合作伙伴。
  notYet:
    - "不要购买或自造航空器、甲烷传感器，也不要组建机队。"
    - "不要销售通用 LDAR、连续监测或大而全的资产巡检平台。"
    - "不要承诺完成监管闭环；未经资产专属审核人员认可，也不要把未检出当作证明。"
    - "滩头市场不纳入 US 配电公用事业、储气、铁路或电力市场；只有在 TSO 复购需求得到验证后，才测试相邻天然气细分市场。"
market:
  tam: >-
    中心情景为 €1.9M/年，计算方式是 43 家 ENTSOG 成员 TSO × 假设每家每年 2.5 个作业批次 × 假设每批 €17,500。敏感性区间约为 €0.43M–€4.3M。这是按运营商数量自下而上估算的纯服务情景，不是有来源支持的实际支出；43 家只是潜在客户总数的上限，并非已确认的合格买方。
  sam: >-
    情景估算为 €0.24M/年：假设有 8 家 TSOs 具备航空异常发现、能接入合格合作伙伴且批次密度足够，每年各有 2 个作业批次，单价 €15,000。八家合格客户的数量和定价都未经验证。
  som: >-
    低渗透率情景为 €0.06M/年，假设有 2 家付费 TSOs、每家每年 2 个批次、单价 €15,000；这不是销售预测，且假设买方愿意付费并接受交付、能接入合作伙伴，现有厂商合同也没有对同一服务重复收费。
  segments:
    - "主要市场：有带地理标签的航空甲烷异常发现、已完成维修且可安排复测窗口的欧洲天然气输送运营商。"
    - "验证后再拓展：采用相同维修关联测量流程的天然气配气或储气运营商；当前市场规模测算不包含这些客户。"
  buyingProcess: >-
    预算可能由管道完整性、排放合规或资产运营部门负责人掌握；实际使用者是完整性或 LDAR 负责人。预计要经过技术和合规审核，以及各国特定的采购流程；优先依托现有航测/LDAR 框架，以付费附加服务或分包方式成交。买方角色、预算路径和证据认可都尚未验证。
product:
  mvp: >-
    为一家运营商的一批维修提供服务型工作流：接收异常发现和维修 ID，敲定传感器、航线及条件标准，安排合作伙伴飞行，再生成可追溯的闭环或无法判定证据包。先使用运营商认可的 CSV/KML，由人工审核；不做定制 CMMS 集成，也不自购传感设备。
  sixMonth: >-
    完成一个国家的试点方案设计，明确合格飞行合作伙伴、运营商书面验收标准、地面复核备选方案、取消规则和固定作业范围；在相关审核人员确认该资产的具体用途前，不宣称符合监管要求。
  twelveMonth: >-
    至少开展一个付费作业批次；若运营商能提供样本，则评估至少 10 次符合条件的维修核验。标准化证据包前，先统计获认可的处置结果、无法判定率、周转时间、受控检查中的误闭环情况，以及合作伙伴全成本。
  twentyFourMonth: >-
    如果客户复购，且服务通过毛利和证据门槛，就通过合格合作伙伴为两家付费 TSO 提供重复作业批次，只自动化双方共用的字段和审核步骤。否则就停止，或将服务转为现有厂商的分包功能。
  keyBets:
    - "运营商会为维修闭环单独列支，或购买附加服务，而不是只依赖现有巡线或合同内的 LDAR 复测。"
    - "审核人员会认可满足条件标准的航空证据，用于明确的闭环判断；对于含糊案例则采用地面复核。"
    - "单个维修批次能容纳足够多的合格维修点，摊薄合作伙伴调度和数据审核成本。"
    - "证据格式和执行记录可以积累为可复用的经验，但飞行服务商和现有厂商也能复制基本工作流。"
gtm:
  wedge: >-
    针对一批实际完成维修的甲烷异常发现，销售固定费用的条件匹配复飞作业；预先约定每次额外核验的价格，且费用不随结果变化。
  channels:
    - "由创始人主导客户摸排，直接接触欧洲 TSO 管道完整性和排放合规预算负责人；根据真实维修工单和合同范围筛选机会。"
    - "以分包方式承接现有厂商的航空甲烷或 LDAR 项目，或把闭环核验加入对方服务包，借助其运营商准入、飞行许可和采购路径。"
    - "确认运营商的资质要求和采购规则后，再参与特定国家的框架采购或招标。"
  funnelTargets: >-
    以下是初期运营目标，不是实际转化率：从 10 个明确的 TSO/合作伙伴引荐中，争取与 5 位预算负责人交谈、审核 2 份去标识化的真实维修工单，并找到 1 条包含报价的付费试点路径；首批 2 个付费试点应在 12 个月内至少带来 1 个复购作业批次。
  pricing: >-
    测试 €10,000–€25,000 的固定作业费用，明确包含的核验次数，并预先约定额外核验收费。该区间是研究市场规模时采用的假设，并非公开价目表或经验证的付费意愿。按可审计的维修闭环核验收费，而不是按飞行小时计价；不得以甲烷结果有利作为付款条件。
businessModel:
  revenueStreams:
    - "按范围明确的维修批次收取固定费用，包含规程设置和约定次数内的证据包。"
    - "天气或证据标准要求额外核验或再次派飞时，按预先约定的价格收费。"
    - "试点获认可后，根据运营商或现有厂商协议承接重复的按需作业批次。"
  unitOfValue: "在约定核验窗口内交付的一项可追溯结论：针对已维修的甲烷异常，由运营商审核并判定闭环或无法判定。"
  targetGrossMarginPct: 60
  expansionLevers:
    - "提高签约 TSO 管线区段内的维修批次密度和重复作业频率。"
    - "两家运营商采用相同证据字段后，减少人工审核和数据核对。"
    - "只有 TSO 复购后，才向天然气配气或储气运营商测试同一闭环核验服务。"
strategyMap:
  northStarMetric: "付费且符合条件的维修核验中，在约定窗口内获得运营商认可的闭环结论或有记录的后续处置方案的比例；无法判定的案例另行统计。"
  inputMetrics:
    - "派单前已具备可用的原始传感器数据、位置、时间和维修记录的工单占比。"
    - "已安排的核验中，在预先约定的可比条件范围和维修复测窗口内完成飞行的比例。"
    - "无需定制数据核对即可获认可的证据包占比。"
    - "每个已完成作业批次的合作伙伴直接成本和毛利。"
  moatsToBuild:
    - "经运营商认可、按资产类别和现场条件验证的可比性与证据规程。"
    - "权利已厘清的纵向数据集，串联原始发现、维修、飞行条件、复测结果和审核处置。"
    - "稳定的合作伙伴运力，以及与运营商或现有厂商 LDAR 记录的工作流集成。"
  killCriteria:
    - "到第6个月时，完成至少 10 次预算负责人访谈和 5 份合同/工单审核后，仍没有买方指出付费独立试点或合同附加服务的路径。"
    - "到第6个月时，即使提供地面确认作为备选方案，也没有任何运营商完整性或合规审核人员愿意书面明确证据包的验收标准。"
    - "受控试点中，任何已知仍在排放的测试释放被报告为已确认闭环；或修正规程后，预先约定的运行范围内仍有超过 30% 的合格尝试无法判定。"
    - "在买方认可的作业价格不高于 €25,000 时，合作伙伴和审核成本导致毛利低于 40%，或无法赶上约定的维修复测窗口。"
    - "最初两个付费试点都未在完成后的 12 个月内带来复购订单或有资金支持的后续采购路径。"
  mermaid: |
    flowchart LR
      Finding[Approved methane finding] --> Repair[Repair record]
      Repair --> Reflight[Matched-condition repeat flight]
      Reflight --> Packet[Closure or inconclusive packet]
      Packet --> Repeat[Repeat campaign or stop]
investorMemo:
  verdict:
    call: "观察"
    conviction: "信心偏低；这套工作流在运营上说得通，但独立买方预算、获认可的航空证据标准和重复采购都未获证实。"
    whyBelieve: "EU（欧盟）规则要求监测维修效果，范围更广的航空甲烷项目也表明运营商有能力为检测工作流付费，为客户摸排提供了可信切口。"
    whyDoubt: "研究没有找到任何维修后付费航空服务；SLB 已在销售维修验证，而仅面向 TSO 的中心市场情景在竞争前也只有 €1.9M/年。"
    nextDiligence: "先争取一家 TSO 做出带有明确价格的付费试点承诺，再取得其完整性/合规审核人员的书面验收标准；随后按同一维修窗口核验合作伙伴报价。"
  firstCustomer:
    title: "欧洲天然气输送运营商的管道完整性或甲烷排放团队"
    profile: "TSO 团队已接收带地理标签的航空甲烷异常发现，近期有一批已维修的异常点，并能提供维修编号（IDs）和获认可的复测区段。"
    trigger: "航空发现的问题完成维修后，完整性负责人需要可审计地判断信号是否消失，再决定关闭还是重新开启维修工单。"
    buyer: "管道完整性、排放合规或资产运营负责人（假设；预算归属尚未验证）"
    initialContract: >-
      单次固定费用试点作业的规划区间为 €10,000–€25,000，并非实际成交的闭环核验价格；如果审核人员认可证据包且合作伙伴经济模型达标，再通过运营商或现有厂商框架转为重复批次采购。
  mustBeTrue:
    - "至少一家欧洲 TSO 愿意为增量作业或框架附加服务支付 €10,000–€25,000，而不是要求所有核验都捆绑在现有合同中且不增加收入。"
    - "完整性/合规审核人员会批准资产专属的书面标准，认可用证据包关闭工单；读数含糊时仍保留地面复核。"
    - "在至少 10 次符合条件的试点核验中，每次都能追溯到原始发现和维修记录；至少 80% 能在约定窗口内获得认可的闭环结论或有记录的后续行动；且没有已知仍在排放的盲测对照被误判为已闭环。"
    - "合作伙伴报价和买方认可的价格在试点规模下支持至少 40% 毛利，并能随着航线和批次重复而可信地达到 60% 目标。"
    - "最初两个付费试点中至少有一个带来复购；其他天然气网络买家也采用同一套工作流，而不是要求定制产品。"
  diligenceQuestions:
    - "今天由哪位 TSO 预算负责人支付第二次测量费用？这是单独预算科目、现有 LDAR 合同范围，还是没有资金支持的任务？"
    - "具体哪条资产专属规则和哪些书面审核标准，能让航空复测结果用于闭环？什么情况下仍必须进行地面 OGI？"
    - "在风况、飞行高度和时间各异的情况下，对已维修异常的排放水平进行测量时，漏报率、检测限和无法判定率分别是多少？"
    - "能否找到一家明确的合作伙伴，在维修复测窗口内完成任务，并对调度、天气取消、传感器、数据审核和再次派飞提供有约束力的报价？"
    - "现有厂商是否已包含复测？哪些证据包、合同范围或集成缺口会让它无法直接捆绑这项功能？"
    - "尽调能否找到假设的八家 TSO 之外、可触达的客户群，同时不把未经验证的配气、储气或 US 市场支出算进去？"
operatingAssumptions:
  - assumption: "一家合格的欧洲 TSO 手头有一批维修任务，其中航空发现的异常点足够多，值得开展第二次作业。"
    basis: "idea.yaml"
    validationTest: "审核至少 5 份去标识化的运营商维修工单，并与完整性负责人确认原始飞行数据、维修完成情况、复测准入和批次密度。"
    decisionImpact: "如果异常点太少或无法取得数据，只能依托现有厂商的既有航测周期销售，或者停止面向 TSO 的方案。"
  - assumption: "买方会单独为闭环核验付费，或接受把它作为现有 LDAR/航测合同的付费附加服务。"
    basis: "research.yaml"
    validationTest: "访谈至少 10 位预算负责人，审核 5 份当前合同范围，并取得已签署的付费试点或包含报价的采购申请。"
    decisionImpact: "如果没有增量预算路径，就不要开发独立产品；只测试一次分包经济模型，若服务商不愿付费则停止。"
  - assumption: "€10,000–€25,000 的作业价格区间可以被接受，也能留出可行的合作伙伴交付毛利。"
    basis: "research.yaml"
    validationTest: "向两家合格服务商索取有约束力的报价，并向至少 3 家合格买方提交固定范围报价；记录成本、取消和采购异议。"
    decisionImpact: "如果买方接受的价格无法支持试点规模下至少 40% 的毛利，就缩小地域或批次范围，或拒绝承接该作业。"
  - assumption: "符合条件的复飞可以为闭环判断提供有用依据，但不能把未检出当作证明。"
    basis: "research.yaml"
    validationTest: "开展已知释放量盲测和已维修异常复测；记录传感器、航线、飞行高度、天气、背景浓度、时间、阈值、认可的闭环结论、地面复核和无法判定结果。"
    decisionImpact: "如果测试出现错误闭环或过多无法判定的核验，就暂停宣称闭环，改为以地面确认为核心，或停止。"
  - assumption: "在选定国家，第三方航空器和甲烷传感器合作伙伴能在运营商要求的复测窗口内完成调度。"
    basis: "运营商判断"
    validationTest: "取得书面运力和取消承诺，确认选定平台在当地所需的运营许可，并在试点中评估排期表现。"
    decisionImpact: "如果准入不稳定，就只向有预留运力的管线区段销售，或放弃对时效要求高的复测服务。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "访谈管道完整性和排放预算负责人，并审核去标识化维修工单及现有厂商合同范围。"
    hypothesis: "至少有一家明确的运营商存在维修闭环缺口，也有预算或采购路径购买付费复测。"
    successMetric: "访谈 10 位预算负责人，审核 5 份合同/工单，找到 2 位实际工作流的内部支持者，并记录 1 条包含报价的试点采购路径。"
    owner: "CEO / 商业创始人"
  - horizon: "0–90 天"
    experiment: "与运营商审核人员、LDAR 现有厂商和独立甲烷测量顾问共同设计一个国家适用的证据及可比性规程。"
    hypothesis: "运营商能预先设定有用的闭环阈值、运行范围和地面复核备选方案。"
    successMetric: "取得适用于一个资产类别的书面审核标准，包含无法判定读数的处理规则；不得提出缺乏依据的监管合规主张。"
    owner: "现场测量负责人"
  - horizon: "3–6 个月"
    experiment: "索取有约束力的合作伙伴报价，并提供一个固定费用作业，明确包含的核验次数和取消条款。"
    hypothesis: "现有厂商或合格航测服务商能比直接采购新航空器更快、成本更低地解决准入问题。"
    successMetric: "取得两家服务商报价，并拿到 €10,000–€25,000 规划区间内的一份已签署付费试点合同或包含报价的采购申请。"
    owner: "CEO / 商业创始人"
  - horizon: "3–9 个月"
    experiment: "按约定的传感器、航线和条件记录开展受控试点，用已知排放量的释放测试进行盲测，并复测真实维修异常。"
    hypothesis: "复测结果可以安全、透明地分类，而不会把未检出等同于零排放。"
    successMetric: "若客户能提供样本，至少完成 10 次符合条件的核验；证据包 100% 可追溯；至少 80% 在窗口内获得认可的闭环结论或有记录的后续行动；没有任何已知仍在排放的盲测对照被报告为闭环。"
    owner: "现场测量负责人"
  - horizon: "6–12 个月"
    experiment: "通过运营商认可的 CSV/KML 字段交付证据包，并与现有工单流程比较审核和数据核对工作量。"
    hypothesis: "标准证据包无需定制 CMMS 集成也能发挥作用。"
    successMetric: "至少 80% 的试点证据包无需定制集成就获接受，并记录审核人员修正次数和数据核对耗时。"
    owner: "创始产品工程师"
  - horizon: "12–18 个月"
    experiment: "向试点客户提供复测作业，并在筛选相邻天然气细分市场前，用另外两家 TSOs 测试同一套闭环工作流。"
    hypothesis: "付费试点成功后会转为重复采购，而且这套工作流不只适用于一家运营商。"
    successMetric: "最初两个付费试点带来一个复购订单；找到两家合格的后续客户；合作伙伴成本证据支持至少 40% 的毛利。"
    owner: "CEO / 商业创始人"
operations:
  - "合作伙伴协议应明确传感器配置、校准记录、航线/飞行高度日志、天气取消、再次派飞、原始数据访问权，以及客户对证据包的所有权。"
  - "每次作业前，都要请运营商确认资产编号（IDs）、维修记录关联方式、阈值、可接受的测量窗口和地面确认路径。"
  - "按案例维护证据台账，记录原始/复测时间戳、现场条件、传感器设置、审核处置，以及无法判定的原因。"
  - "先用 CSV/KML 和安全文件交换；自动化或承接定制集成前，先梳理运营商的 GIS/CMMS 字段。"
  - "审核各国及各平台的运营、安全、保险、采购和数据留存要求；不假定 EASA 无人机 BVLOS 指南适用于载人航空器或飞艇。"
team:
  - role: "CEO / 商业创始人"
    startTiming: "第 0 个月"
    rationale: "由创始人主导客户摸排，谈妥带明确报价的试点，并在增加销售人手前摸清 TSO 集中采购流程。"
  - role: "现场甲烷测量负责人"
    startTiming: "第 0 个月"
    rationale: "负责检测限、可比性规程、盲测、地面复核备选方案和证据审核；在作出任何闭环主张前，这一岗位不可或缺。"
  - role: "创始产品工程师"
    startTiming: "第 0 个月"
    rationale: "搭建最精简的案例台账和可导出的证据包；付费试点证明人工重复劳动确实存在前，暂缓集成。"
  - role: "合作伙伴运营负责人"
    startTiming: "第 3 个月，仅在试点路径签署后"
    rationale: "协调飞行窗口、服务商运力、许可、取消处理和批次调度，不购买航空器。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "截至第3个月，完成 10 次预算负责人访谈和 5 份工单/合同审核；找到实际维修批次、买方发起人和采购路径。"
      - "截至第6个月，取得书面资产专属证据标准、两家合作伙伴报价，以及付费试点合同或包含报价的采购申请。"
      - "截至第12个月，至少完成一个付费作业批次；条件允许时争取 10 次合格核验，证据包 100% 可追溯，并分别报告获认可、无法判定和地面复核的结果。"
      - "运营商审核人员确认所选资产类别的适用方法之前，不得宣称已完成监管闭环。"
  - horizon: "12–24 个月"
    items:
      - "获得两家付费 TSO 客户，并拿到至少一个复测作业批次或有资金支持的按需采购。"
      - "证明试点规模下毛利至少为 40%，并记录通过增加批次密度或重复航线达到 60% 目标的路径。"
      - "只标准化两家客户都认可的证据字段；定制集成工作须收费且范围有限。"
  - horizon: "24–36 个月"
    items:
      - "如果 TSO 续约、安全、证据和毛利门槛都达标，再测试一个付费天然气配气或储气试点，并根据合格买方证据更新市场规模。"
      - "如果相邻细分市场需要不同的传感方式、许可或买方工作流，就暂缓进入，不要把产品做成大而全的巡检平台。"
      - "如果 TSO 没有复购需求，也看不到毛利提升路径，就停止扩张，考虑将功能嵌入服务商产品，而不是为独立扩张融资。"
risks:
  - risk: "维修验证已包含在 LDAR 合同或常规巡线中，因此没有独立买方预算。"
    likelihood: "High"
    impact: "High"
    mitigation: "开发产品前先审阅真实合同范围和维修工单；必须拿到付费预算科目或由服务商出资的分包试点。"
  - risk: "风况、飞行高度、传感器阈值、排放间歇性或测量时间会破坏复测可比性，让人误以为问题已解决。"
    likelihood: "High"
    impact: "High"
    mitigation: "预先约定条件限制，开展已知释放量盲测，设置地面复核路径并明确标注无法判定；绝不能根据未检出推断零排放。"
  - risk: "SLB 或原航测服务商捆绑这套工作流，挤走独立供应商。"
    likelihood: "High"
    impact: "High"
    mitigation: "将服务定位为可量化的附加服务或分包功能，以运营商认可的证据记录形成差异；如果现有厂商能以零增量成本提供同等证据包，就放弃独立销售。"
  - risk: "合作伙伴运力、天气、准入或采购资质审核导致无法在相关维修窗口内复飞。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "先选定一个国家和管线区段，预留灵活的合作伙伴运力，预先约定取消规则；在实测之前不要承诺响应时间。"
  - risk: "43 家 TSO 的客户上限和假设的 €1.9M TAM 不足以支撑风险投资级别的增长；欧洲天然气网络投资也可能收缩。"
    likelihood: "High"
    impact: "High"
    mitigation: "所有市场规模都只当作情景测算，必须证明客户复购，且 TSO 工作流通过验证后才能拓展天然气相邻市场；不能用未经验证的市场来论证首轮融资。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$0.75–1.0M"
  runwayMonths: 18
  useOfFundsSummary: >-
    这笔为期 18 个月的轻资产验证融资，将用于三人创始团队、独立测量支持、合作伙伴飞行和传感器费用、一个国家的法律/采购审核，以及最低限度的证据包工具。资金应换来运营商书面规程、一至两个付费作业批次、条件允许时至少 10 次合格维修核验、合作伙伴成本与毛利证据，以及复购决策。不用于购买航空器或广泛拓展市场；如果截至第 6个月仍未拿到付费试点和书面验收路径，就停止或削减支出。
