slug: methane-repair-closeout-proof
date: "2026-10-21"
executiveSummary: >-
  Build a partner-operated, fixed-fee methane repair-closeout service for European gas-transmission operators, not an
  airship manufacturer or general inspection platform. The first customer hypothesis is a pipeline-integrity or
  emissions team with a geotagged aerial methane finding and a scheduled repair batch; research found no verified
  standalone buyer, budget line, or purchase order for the proposed closeout flight. The service links the original
  finding and repair record to a pre-agreed, matched-condition repeat flight, then returns a traceable closure or
  inconclusive evidence packet. EU methane rules require leak surveys, prompt repairs, and monitoring repair success,
  but do not mandate aerial reflight; US aerial-mapping contracts support broader category budgets, not EU TSO demand
  for this service. Research's bottom-up scenarios estimate €1.9M annual TSO TAM, €0.24M SAM, and €0.06M SOM using
  assumed account counts, campaign frequency, and prices; these are not published market estimates or forecasts.
  SLB already advertises repair verification, while mapping vendors, ground OGI, operator patrols, fixed sensors,
  and satellites can bundle or substitute for the workflow. The initial route is a paid add-on through an existing
  LDAR or aerial-survey provider, because operator access and a second flight are necessary and separate procurement
  is unproven. Proceed only as a staged pre-seed validation: secure written evidence acceptance, a paid pilot, and
  viable partner economics before building integrations or hiring for scale.
problem:
  - >-
    A geolocated methane finding and a repair marked complete do not by themselves establish whether the original
    signal cleared under conditions suitable for comparison.
  - >-
    Operators must monitor repair success, but the reviewed EU guidance does not prescribe an aerial repeat flight;
    the specific closeout workflow and its separate budget remain hypotheses.
  - >-
    A second pass can be delayed or inconclusive because wind, sensor threshold, access, or flight availability
    changes, so a non-detection cannot safely be presented as proof without an accepted protocol and fallback.
solution:
  - >-
    For a defined repair batch, accept the operator-approved geotagged finding and repair record, coordinate a
    repeat flight with a qualified provider, and compare only when the agreed sensor, route, and operating envelope
    support it.
  - >-
    Deliver a reviewer-ready packet tying location, timing, sensor configuration, conditions, repair evidence, and
    repeat measurement to the work-order identifier; classify unsuitable or ambiguous attempts as inconclusive and
    route them to another flight or ground check.
  - >-
    Charge for the campaign and verification attempts regardless of whether the methane signal clears, avoiding
    incentives to produce a favorable closure.
whyWeWin:
  - >-
    The saleable unit is a repair closeout attempt linked to a specific finding, not aircraft hours, another alert,
    or a broad inspection dashboard.
  - >-
    Partner delivery avoids aircraft ownership and can fit inside an existing LDAR or survey contract, reducing
    capital and supplier-qualification burden.
  - >-
    An explicit inconclusive state and operator-approved evidence schema can make the result auditable; neither is
    a technical moat today, and incumbents can reproduce or bundle the workflow.
strategicChoices:
  beachhead: >-
    One European gas-transmission operator in one country with an existing aerial methane finding, a near-term
    repair batch, and an integrity or emissions reviewer willing to define closeout criteria.
  wedgeRationale: >-
    A single repair batch creates a bounded paid test of budget, repeat-flight access, evidence acceptance, and
    partner cost. Selling the closeout as an add-on to the original survey or LDAR contract avoids asking the
    operator to procure a new aircraft category before the workflow is proven.
  sequencingRationale: >-
    First verify a live buyer, repair-ticket workflow, and written acceptance criteria; then contract partner
    capacity and run a controlled pilot; only after paid repeat demand should the team automate packet generation,
    hire for delivery, or expand procurement coverage. This preserves an asset-light model while accepting slower,
    partner-dependent sales.
  notYet:
    - "Do not buy or build an aircraft, methane sensor, or fleet."
    - "Do not sell a general LDAR, continuous monitoring, or broad asset-inspection platform."
    - "Do not promise regulatory closure or treat a non-detection as proof without asset-specific reviewer approval."
    - "Do not count US distribution utilities, storage, rail, or power markets in the beachhead; test adjacent gas segments only after TSO repeat demand."
market:
  tam: >-
    €1.9M/year central scenario for 43 ENTSOG TSO members × 2.5 assumed campaigns/account-year × €17,500 assumed
    campaign fee; sensitivity is approximately €0.43M–€4.3M. This is an operator-built service-only scenario, not
    sourced spend, and the 43 accounts are an upper-bound universe rather than qualified buyers.
  sam: >-
    €0.24M/year scenario for 8 assumed TSOs with aerial findings, qualified partner access, and suitable batch
    density × 2 assumed campaigns/year × €15,000. The eight-account qualification count and price are unverified.
  som: >-
    €0.06M/year low-penetration scenario for 2 paying TSOs × 2 campaigns/year × €15,000; this is not a sales
    forecast and assumes paid acceptance, partner access, and no duplicate charge inside an incumbent contract.
  segments:
    - "Primary: European gas-transmission operators with geotagged aerial methane findings, completed repairs, and an accessible follow-up window."
    - "Secondary after proof: gas-distribution or storage operators with the same repair-linked measurement workflow; excluded from current sizing."
  buyingProcess: >-
    The likely budget owner is a head of pipeline integrity, emissions compliance, or asset operations; the user is
    an integrity or LDAR lead. Expect technical and compliance review plus country-specific procurement, preferably
    as a paid add-on or subcontract under an existing aerial/LDAR framework; the buyer role, budget route, and
    evidence acceptance are not yet validated.
product:
  mvp: >-
    A service-led workflow for one operator and one repair batch: intake the finding and repair ID, agree the
    sensor/route/condition criteria, schedule the partner flight, and produce a traceable closure-or-inconclusive
    packet. Start with operator-approved CSV/KML and manual review rather than custom CMMS integration or owned
    sensing hardware.
  sixMonth: >-
    Complete a one-country pilot design with a qualified flight partner, written operator acceptance criteria,
    ground-check fallback, cancellation rules, and a fixed campaign scope; do not claim regulatory compliance
    until the relevant reviewer has confirmed the asset-specific use.
  twelveMonth: >-
    Run at least one paid campaign and evaluate at least 10 eligible repair attempts if the operator can supply
    them; measure accepted dispositions, inconclusive rate, turnaround, false closures in controlled checks, and
    fully loaded partner cost before standardizing the evidence packet.
  twentyFourMonth: >-
    If a customer repeats and the service clears its margin and evidence gates, support two paying TSO accounts
    with repeat campaigns through qualified partners and automate only the fields and review steps common to both.
    Otherwise stop or reposition as an incumbent-provider subcontracted feature.
  keyBets:
    - "An operator will fund a repair-closeout line item or add-on rather than rely on existing patrols or an included LDAR re-survey."
    - "A reviewer will accept condition-qualified aerial evidence for a defined closeout decision, with ground checks for ambiguous cases."
    - "A batch can contain enough eligible repairs to spread partner mobilization and data-review costs."
    - "The evidence schema and execution record can become reusable know-how, although flight providers and incumbents can copy the basic workflow."
gtm:
  wedge: >-
    Sell one fixed-fee, matched-condition repeat-flight campaign against an actual repaired methane-finding batch,
    with pre-priced per-attempt overages and payment independent of the result.
  channels:
    - "Founder-led account discovery with European TSO integrity and emissions-compliance budget owners; qualify against actual repair tickets and contract scope."
    - "Subcontract or add the closeout campaign to an incumbent aerial methane or LDAR provider to use its operator access, flight permissions, and procurement route."
    - "Use a country-specific framework or tender only after confirming the operator's qualification and procurement rules."
  funnelTargets: >-
    Initial operating targets, not observed conversion rates: 10 named TSO/partner referrals to 5 budget-owner
    conversations, 2 reviews of live de-identified repair tickets, and 1 price-bearing paid-pilot path; target at
    least 1 repeat campaign from the first 2 paid pilots within 12 months.
  pricing: >-
    Test a €10,000–€25,000 fixed campaign price, with a defined number of attempts and a pre-agreed fee for extra
    attempts; the range is an assumption used in research sizing, not a published tariff or validated willingness
    to pay. Price by auditable repair closeout rather than flight hour, and do not condition payment on a favorable
    methane result.
businessModel:
  revenueStreams:
    - "Fixed fee for a scoped repair-batch campaign, including protocol setup and evidence packets for the included attempts."
    - "Pre-priced additional verification attempts or repeat dispatches when weather or evidence criteria require them."
    - "Recurring call-off campaigns under an operator or incumbent-provider agreement after pilot acceptance."
  unitOfValue: "One traceable, operator-reviewed closure or inconclusive disposition for a repaired methane finding, delivered within the agreed verification window."
  targetGrossMarginPct: 60
  expansionLevers:
    - "Increase repair-batch density and repeat campaign frequency within each contracted TSO corridor."
    - "Reduce manual review and reconciliation after two operators use the same evidence fields."
    - "Only after TSO repeat purchase, test the same closeout job with gas-distribution or storage operators."
strategyMap:
  northStarMetric: "Share of paid eligible repair attempts receiving an operator-accepted closure or documented next-step disposition within the agreed window, with inconclusive cases reported separately."
  inputMetrics:
    - "Share of tickets with usable original sensor, location, timing, and repair records before dispatch."
    - "Share of scheduled attempts flown inside the pre-agreed comparability envelope and repair follow-up window."
    - "Operator acceptance rate for evidence packets without custom data reconciliation."
    - "Partner direct cost and gross margin per completed campaign."
  moatsToBuild:
    - "An operator-accepted comparability and evidence protocol, validated by asset class and field conditions."
    - "A rights-cleared longitudinal dataset linking original findings, repairs, flight conditions, repeat results, and reviewer dispositions."
    - "Reliable partner capacity and workflow integration into operator or incumbent LDAR records."
  killCriteria:
    - "By month 6, after at least 10 budget-owner interviews and 5 contract/work-order reviews, no buyer identifies a paid standalone or contract-add-on pilot path."
    - "By month 6, no operator integrity or compliance reviewer will define written acceptance criteria for the packet, even with ground confirmation as fallback."
    - "In a controlled pilot, any known-active test release is reported as a confirmed closure, or more than 30% of eligible attempts are inconclusive inside the pre-agreed operating envelope after protocol correction."
    - "At a buyer-accepted campaign price no higher than €25,000, partner and review costs imply less than 40% gross margin or cannot meet the agreed repair follow-up window."
    - "Neither of the first two paid pilots produces a repeat order or funded follow-on path within 12 months of completion."
  mermaid: |
    flowchart LR
      Finding[Approved methane finding] --> Repair[Repair record]
      Repair --> Reflight[Matched-condition repeat flight]
      Reflight --> Packet[Closure or inconclusive packet]
      Packet --> Repeat[Repeat campaign or stop]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low conviction; the workflow is operationally plausible, but a separate buyer budget, accepted aerial evidence standard, and repeat procurement are unproven."
    whyBelieve: "EU rules require monitoring repair success, and broader aerial methane programs show that operators can fund detection workflows, creating a credible discovery wedge."
    whyDoubt: "The research found no paid post-repair aerial product, while SLB already sells repair verification and the central TSO-only market scenario is just €1.9M/year before competition."
    nextDiligence: "Obtain a price-bearing paid pilot commitment from one TSO and written acceptance criteria from its integrity/compliance reviewer, then validate partner quotes against the same repair window."
  firstCustomer:
    title: "European gas-transmission pipeline-integrity or methane-emissions team"
    profile: "A TSO team already receives geotagged aerial methane findings, has a near-term repaired-finding batch, and can provide repair IDs and an approved follow-up corridor."
    trigger: "Aerial finding is repaired, but the integrity owner needs an auditable decision on whether the signal cleared before closing or reopening the maintenance ticket."
    buyer: "Head of Pipeline Integrity, Emissions Compliance, or Asset Operations (hypothesis; budget ownership is unverified)"
    initialContract: >-
      €10,000–€25,000 for a single fixed-fee pilot campaign, a planning range rather than observed closeout pricing;
      convert to repeat batch call-offs through the operator or incumbent framework if reviewers accept the packet
      and partner economics meet the gate.
  mustBeTrue:
    - "At least one European TSO will pay €10,000–€25,000 for an incremental or framework add-on campaign, rather than requiring all verification to be bundled at no added revenue."
    - "An integrity/compliance reviewer will approve written asset-specific criteria for using the packet to close a work order, while reserving ground checks for ambiguous readings."
    - "Across at least 10 eligible pilot attempts, every attempt can be traced to its original finding and repair record, at least 80% receive an accepted closure or documented next action within the agreed window, and no known-active blind control is misclassified as closed."
    - "Partner quotes and buyer-accepted pricing support at least 40% gross margin at pilot scale and a credible path to the 60% target as routes and batches repeat."
    - "At least one of the first two paid pilots generates a repeat purchase, and additional gas-network buyers share the same workflow rather than requiring a bespoke product."
  diligenceQuestions:
    - "Which TSO budget owner pays for the second measurement today, and is it a separate line item, an existing LDAR scope, or an unfunded task?"
    - "What exact asset-specific rule and written reviewer criteria make an aerial repeat result acceptable for closeout, and when is ground OGI still mandatory?"
    - "What are the false-negative, detection-limit, and inconclusive rates at repaired-finding emission levels under variable wind, altitude, and timing?"
    - "Can a named partner meet the repair follow-up window with binding quotes for mobilization, weather cancellation, sensors, data review, and repeat dispatch?"
    - "Does the incumbent already include re-surveys, and what evidence packet, contract scope, or integration gap would prevent it from simply bundling this feature?"
    - "Can diligence identify a reachable set beyond the assumed eight TSO accounts without counting unvalidated distribution, storage, or US spend?"
operatingAssumptions:
  - assumption: "A qualified European TSO has a live repair batch with enough aerially detected findings to justify a second campaign."
    basis: "idea.yaml"
    validationTest: "Review at least 5 de-identified operator repair tickets and confirm original flight data, repair completion, repeat access, and batch density with the integrity lead."
    decisionImpact: "If findings are sparse or inaccessible, sell only through an incumbent's existing survey cycle or stop the TSO-specific offer."
  - assumption: "A buyer will fund the closeout attempt separately or accept it as a paid add-on to an existing LDAR/aerial contract."
    basis: "research.yaml"
    validationTest: "Interview at least 10 budget owners, inspect 5 current contract scopes, and obtain a signed paid pilot or a price-bearing procurement request."
    decisionImpact: "If no incremental budget route exists, do not build a standalone product; test subcontract economics once, then stop if the provider will not pay."
  - assumption: "The €10,000–€25,000 campaign range is acceptable and leaves a viable partner-delivery margin."
    basis: "research.yaml"
    validationTest: "Get binding quotes from two qualified providers and submit a fixed-scope quote to at least 3 qualified buyers; record cost, cancellation, and procurement objections."
    decisionImpact: "If accepted pricing cannot support at least 40% gross margin at pilot scale, narrow geography/batch scope or decline the campaign."
  - assumption: "Condition-qualified repeat flights can support a useful closeout decision without treating non-detection as proof."
    basis: "research.yaml"
    validationTest: "Run blind known-release checks plus repaired findings; log sensor, route, altitude, weather, background, timing, threshold, accepted closure, ground-recheck, and inconclusive outcomes."
    decisionImpact: "If the test produces false closures or excessive inconclusive attempts, suspend closure claims and redesign around ground confirmation or stop."
  - assumption: "A third-party aircraft and methane-sensor partner can mobilize within the operator's required follow-up window in one selected country."
    basis: "operator judgment"
    validationTest: "Secure a written capacity and cancellation commitment, confirm local operating approvals for the selected platform, and measure schedule performance in the pilot."
    decisionImpact: "If access is unreliable, limit sales to corridors with reserved capacity or abandon time-sensitive repeat verification."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Interview pipeline-integrity and emissions budget owners and inspect de-identified repair tickets plus incumbent contract scopes."
    hypothesis: "A specific operator has a repair-closure gap and a budget or procurement route for a paid repeat measurement."
    successMetric: "10 budget-owner interviews, 5 contract/ticket reviews, 2 live workflow sponsors, and 1 documented price-bearing pilot route."
    owner: "CEO / commercial founder"
  - horizon: "0–90 days"
    experiment: "Co-design a one-country evidence and comparability protocol with an operator reviewer, LDAR incumbent, and independent methane-measurement adviser."
    hypothesis: "The operator can predefine a useful closure threshold, operating envelope, and ground-check fallback."
    successMetric: "Written reviewer criteria for one asset class, including a rule for inconclusive readings and no unsupported regulatory-compliance claim."
    owner: "Field measurement lead"
  - horizon: "3–6 months"
    experiment: "Request binding partner quotes and offer one fixed-fee campaign with a defined included attempt count and cancellation terms."
    hypothesis: "An incumbent or qualified survey partner can provide access faster and cheaper than a new direct aircraft procurement."
    successMetric: "Two provider quotes and one signed paid pilot or price-bearing procurement request in the €10,000–€25,000 planning band."
    owner: "CEO / commercial founder"
  - horizon: "3–9 months"
    experiment: "Conduct a controlled pilot with blind known releases and real repaired findings using the agreed sensor, route, and condition logs."
    hypothesis: "Repeat observations can be classified safely and transparently without equating a non-detection with zero emissions."
    successMetric: "At least 10 eligible attempts if the customer can supply them; 100% traceable packets, at least 80% accepted closure or documented next action within the window, and zero known-active blind controls reported closed."
    owner: "Field measurement lead"
  - horizon: "6–12 months"
    experiment: "Deliver packets through operator-approved CSV/KML fields and compare review and reconciliation effort against the current ticket process."
    hypothesis: "A standard packet is useful without bespoke CMMS integration."
    successMetric: "At least 80% of pilot packets accepted without custom integration, with reviewer corrections and reconciliation time recorded."
    owner: "Founding product engineer"
  - horizon: "12–18 months"
    experiment: "Offer a repeat campaign to the pilot customer and test the same closeout workflow with two additional TSOs before screening adjacent gas segments."
    hypothesis: "A successful paid pilot converts to recurring call-offs and the workflow is not unique to one operator."
    successMetric: "One repeat order from the first two paid pilots, two qualified follow-on accounts, and partner-cost evidence supporting at least 40% gross margin."
    owner: "CEO / commercial founder"
operations:
  - "Use a partner agreement that specifies sensor configuration, calibration records, route/altitude logs, weather cancellation, repeat dispatch, raw-data access, and customer ownership of the evidence packet."
  - "Require operator approval of asset IDs, repair record linkage, threshold, acceptable measurement window, and ground-confirmation path before each campaign."
  - "Maintain a case-level evidence ledger with original/repeat timestamps, conditions, sensor settings, reviewer disposition, and reasons for inconclusive results."
  - "Start with CSV/KML and secure file exchange; map the operator's GIS/CMMS fields before automating or accepting custom integration work."
  - "Obtain country- and platform-specific operating, safety, insurance, procurement, and data-retention review; EASA drone BVLOS guidance is not assumed to govern crewed aircraft or airships."
team:
  - role: "CEO / commercial founder"
    startTiming: "Month 0"
    rationale: "Run founder-led discovery, negotiate a price-bearing pilot, and navigate concentrated TSO procurement before adding sales headcount."
  - role: "Field methane measurement lead"
    startTiming: "Month 0"
    rationale: "Own detection limits, comparability protocol, blind checks, ground fallback, and evidence review; this role is essential before any closure claim."
  - role: "Founding product engineer"
    startTiming: "Month 0"
    rationale: "Build the minimal case ledger and exportable evidence packet; defer integrations until a paid pilot demonstrates repeated manual work."
  - role: "Partner operations lead"
    startTiming: "Month 3, only after a signed pilot path"
    rationale: "Coordinate flight windows, provider capacity, permits, cancellation handling, and batch logistics without buying aircraft."
milestones:
  - horizon: "0–12 months"
    items:
      - "By month 3, complete 10 budget-owner interviews and 5 ticket/contract reviews; identify a live repair batch, a buyer sponsor, and a procurement route."
      - "By month 6, secure written asset-specific evidence criteria, two partner quotes, and a paid pilot or price-bearing procurement request."
      - "By month 12, complete at least one paid campaign; target 10 eligible attempts where available, 100% traceable packets, and report accepted, inconclusive, and ground-recheck outcomes separately."
      - "Do not claim regulatory closeout until the operator's reviewer confirms the method for the selected asset class."
  - horizon: "12–24 months"
    items:
      - "Reach two paying TSO accounts and obtain at least one repeat campaign or funded call-off."
      - "Demonstrate at least 40% gross margin at pilot scale and a documented path to the 60% target through batch density or repeat routes."
      - "Standardize only the evidence fields accepted by both customers; keep custom integration work paid and limited."
  - horizon: "24–36 months"
    items:
      - "If TSO renewal, safety, evidence, and margin gates hold, test one paid gas-distribution or storage pilot and update market sizing from qualified buyer evidence."
      - "If the adjacent segment requires different sensing, approvals, or buyer workflows, defer it rather than turning the product into a broad inspection platform."
      - "If no repeat TSO demand or margin path exists, stop scaling and consider a provider-embedded feature instead of raising for standalone expansion."
risks:
  - risk: "No separate buyer budget exists because repair verification is already included in LDAR contracts or routine patrols."
    likelihood: "High"
    impact: "High"
    mitigation: "Inspect actual scopes and repair tickets before product build; require a paid line item or a provider-funded subcontract pilot."
  - risk: "Wind, altitude, sensor thresholds, intermittency, or timing make the repeat reading non-comparable and create false reassurance."
    likelihood: "High"
    impact: "High"
    mitigation: "Use pre-agreed condition limits, blind known-release tests, a ground-recheck path, and an explicit inconclusive state; never infer zero emissions from non-detection."
  - risk: "SLB or the original aerial survey provider bundles the workflow and displaces a separate vendor."
    likelihood: "High"
    impact: "High"
    mitigation: "Position as a measurable add-on or subcontract, differentiate through operator-approved evidence records, and abandon standalone selling if incumbents provide equivalent packets at no incremental cost."
  - risk: "Partner capacity, weather, access, or procurement qualification prevents a repeat flight within the relevant repair window."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Select one country and corridor, reserve flexible partner capacity, pre-agree cancellation rules, and avoid promising a response time until measured."
  - risk: "The 43-member TSO account ceiling and assumed €1.9M TAM do not support venture-scale growth, while European gas-network investment may contract."
    likelihood: "High"
    impact: "High"
    mitigation: "Treat all sizing as scenario math, require repeat-purchase proof, and test adjacent gas segments only after the TSO workflow is validated; do not use unverified markets to justify the initial raise."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$0.75–1.0M"
  runwayMonths: 18
  useOfFundsSummary: >-
    An 18-month, asset-light validation round for a three-person founding team, independent measurement support,
    partner flight and sensor costs, one-country legal/procurement review, and the minimum evidence-packet tooling.
    It should buy a written operator protocol, one or two paid campaigns, at least 10 eligible repair attempts where
    available, partner-cost and margin evidence, and a repeat-purchase decision. No aircraft purchase or broad
    market expansion is funded; stop or reduce spend if a paid pilot and written acceptance path are not secured by
    month 6.
