  saturationRationale: >-
    At the 36-page cap, the final content-bearing reads mostly reinforced already observed repair-verification,
    detection-limit, and satellite-substitute patterns; one independent longitudinal repair study sharpened the
    adjacent-practice risk, while no source supplied separate post-repair-flight pricing or a buyer purchase order,
