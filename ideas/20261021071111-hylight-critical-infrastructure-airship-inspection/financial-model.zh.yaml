slug: methane-repair-closeout-proof
date: "2026-10-21"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: "预测起始月"
    value: "2026-10"
    unit: YYYY-MM
    source: "business-plan.yaml 的 date 字段；模型从报告月份开始。"
  - id: A2
    name: "EUR 兑 USD 规划换算率"
    value: "€1 = $1.10"
    unit: "汇率"
    source: "仅用于将 EUR 监测项目定价换算为 USD 的明确规划假设；未使用实时 FX 报价或网络研究，融资或签约前应更新。"
  - id: A3
    name: "基准监测项目费用"
    value: "€17,500 或 $19.25K"
    unit: "USD/每个固定收费监测项目"
    source: "business-plan.yaml.gtm.pricing 给出的 €10,000–€25,000 是未经验证的测试区间；business-plan.yaml.market 和 research.yaml.market.tam 将 €17,500 用于情景测算，并非已公布价目或已观察到的付费意愿；USD 换算采用 A2。"
  - id: A4
    name: "每个活跃 TSO 客户年对应的监测项目数"
    value: "2"
    unit: "每个 TSO 客户年对应的监测项目数"
    source: "research.yaml.market.sam 和 som 的情景测算假设每个账户年开展两次监测项目；这是未经验证的频次假设，不是客户承诺。"
  - id: A5
    name: "每个活跃客户的年收入"
    value: "$38.5K"
    unit: "USD/每个 TSO 客户年"
    source: "按 A3 × A4 计算；收入来自监测项目，不是订阅 ARR。"
  - id: A6
    name: "基准付费客户获取时间"
    value: "M10 新增一个客户，M16 再增一个，M25 再增一个"
    unit: "新增 TSO 客户数"
    source: "基于 business-plan.yaml 的里程碑假设：最迟到 12个月时拿下一个付费监测项目，最迟到 24个月时拥有两家付费 TSOs；第三家客户是对 research.yaml 假设的八家 SAM 的低置信度延伸，需求尚未验证。"
  - id: A7
    name: "月度客户流失率"
    value: "1.0%"
    unit: "每月百分比"
    source: "初创企业财务规划中的经验假设，并非留存实测值；用固定月度流失风险率估算实际监测项目续约客户批次出现前的预期活跃客户等效数。"
  - id: A8
    name: "基准毛利率"
    value: "60%"
    unit: "收入占比"
    source: "取自 business-plan.yaml.businessModel.targetGrossMarginPct；相当于合作方航测与直接交付成本占收入的 40%，目前尚无有约束力的合作方报价支撑。"
  - id: A9
    name: "CEO / 商业创始人年化全口径成本"
    value: "$75,000"
    unit: "USD/每 FTE 年"
    source: "精益种子前创始团队的初创企业薪酬经验假设；按含雇主负担的年化现金成本建模，并非市场报价。"
  - id: A10
    name: "现场甲烷测量负责人年化全口径成本"
    value: "$90,000"
    unit: "USD/每 FTE 年"
    source: "专业岗位早期招聘的初创企业薪酬经验假设；按含雇主负担的年化现金成本建模，并非市场报价。"
  - id: A11
    name: "创始产品工程师年化全口径成本"
    value: "$90,000"
    unit: "USD/每 FTE 年"
    source: "精简早期产品团队招聘的初创企业薪酬经验假设；按含雇主负担的年化现金成本建模，并非市场报价。"
  - id: A12
    name: "合作方运营负责人年化全口径成本"
    value: "$75,000"
    unit: "USD/每 FTE 年"
    source: "早期运营岗位招聘的初创企业薪酬经验假设；按含雇主负担的年化现金成本建模，并非市场报价。"
  - id: A13
    name: "合作方运营岗位招聘时间"
    value: "M3，且仅在签下试点路径后"
    unit: "启动月份与门槛"
    source: "business-plan.yaml.team 设定的招聘门槛；基准情景假设这项未经验证的门槛最迟到 3个月时达成。"
  - id: A14
    name: "非薪酬销售与市场预算"
    value: "Y1 $45K、Y2 $45K、Y3 $55K"
    unit: "每年 USD 千元"
    source: "为创始人主导的 TSO 拓展、合作方筛选和采购差旅设置的初创企业预算经验值；不含薪酬，也未按实测 CAC 制定。"
  - id: A15
    name: "非薪酬研发预算"
    value: "Y1 $65K、Y2 $45K、Y3 $40K"
    unit: "每年 USD 千元"
    source: "为协议测试、独立测量支持和精简证据包工具预留的初创企业预算经验值；未假设购买飞机或甲烷传感器。"
  - id: A16
    name: "非薪酬管理与行政预算"
    value: "Y1 $40K、Y2 $40K、Y3 $45K"
    unit: "每年 USD 千元"
    source: "为单一国家内的法律、保险、采购、会计和行政支出设置的初创企业预算经验值；未参考供应商报价。"
  - id: A17
    name: "种子前轮融资目标"
    value: "$950K"
    unit: USD
    source: "business-plan.yaml.fundingAsk.targetFundingRangeUsd 为 $0.75–1.0M；模型取上限，用于覆盖 18 个月验证期和约六个月的运营储备。"
  - id: A18
    name: "附条件的后续种子轮融资"
    value: "$1.25M，Q4Y2（第 22 个月）"
    unit: "USD 千元与时点"
    source: "仅为初创企业融资规划假设；business-plan.yaml 中没有后续融资承诺。现金预测要求在付费试点、证据验收、客户复购和毛利率门槛通过后再融一轮；这笔融资不计入 fundingAsk.amountM。"
  - id: A19
    name: "现金收付与资本开支"
    value: "收入当期收款，供应商款项当期支付；资本开支、债务、税费、利息和营运资金变动均按 $0 计。"
    unit: "现金流口径"
    source: "与 business-plan.yaml 的合作方交付、无需持有飞机的策略一致的简化现金流假设；实际采购、付款和纳税时点都可能让现金状况更差。"
  - id: A20
    name: "收入确认与账户等效数计算法"
    value: "每月收入按平均活跃账户数 × A5 / 12 计算"
    unit: "计算口径"
    source: "固定收费监测项目的简化模型：按假设的年度项目调用节奏，把收入平滑摊到各月，并按 A19 当期收款；实际监测项目收入会有波峰波谷，取决于获批的工作范围和交付情况。"
  - id: A21
    name: "全口径 CAC"
    value: "$70.8K/每个新增客户"
    unit: "USD/每个 TSO 客户"
    source: "按 A14 的三年非薪酬 S&M 支出（$145K）加上 A9 中 CEO 薪酬的 30%（$67.5K），再除以 A6 的三家新增客户计算；CEO 成本分摊只是规划假设，不会再次计入 P&L 费用。"
  - id: A22
    name: "种子前轮资金用途分配"
    value: "工程研发 $360K；GTM $195K；G&A $170K；六个月缓冲资金 $225K"
    unit: USD
    source: "基于 A9–A16 的管理层预算分配经验值；合计 $950K，并留出接近六个月的储备，覆盖第 18 个月验证里程碑之后的模型净运营消耗。"
  - id: A23
    name: "下行情景参数"
    value: "M16 新增一个付费客户；单个监测项目收费 €15K；每年一个项目；毛利率 40%；不融种子轮；M16 招聘运营人员"
    unit: "情景参数"
    source: "压力情景采用 business-plan.yaml 未验证监测项目定价区间的下半段，并以 40% 的最低试点毛利率作为止损门槛；不代表已有买方需求，且全额维持计划中的非薪酬支出，以暴露现金下行风险。"
  - id: A24
    name: "上行情景参数"
    value: "M8、M14、M20、M26 各新增一个客户；单个监测项目收费 €20K；每个客户每年 2.5 个项目；月流失率 0.5%；毛利率 65%"
    unit: "情景参数"
    source: "仅作敏感性分析的假设，落在 business-plan.yaml 定价区间和 research.yaml 中央监测项目频次情景内；新增客户、毛利率和购买频次都未经验证，不是市场数据。"
  - id: A25
    name: "监测项目价格敏感性"
    value: "下行情景 €15K、基准 €17.5K、上行情景 €25K"
    unit: "EUR/每个监测项目"
    source: "见 business-plan.yaml.gtm.pricing；两端价格均为未经验证的测试价，换算采用 A2。"
  - id: A26
    name: "客户流失敏感性"
    value: "下行情景 2.0%、基准 1.0%、上行情景 0.5%"
    unit: "每月百分比"
    source: "围绕 A7 设置的初创企业财务情景区间；尚无服务客户留存证据。"
  - id: A27
    name: "CAC 敏感性"
    value: "下行情景 $90K、基准 $70.8K、上行情景 $50K"
    unit: "USD/每个 TSO 客户"
    source: "围绕 A21 设定的规划压力区间；下行情景把超出 CAC 的部分作为基准预算之外的额外 GTM 现金支出，客户数固定时收入不变。"
  - id: A28
    name: "销售周期敏感性"
    value: "基准客户签约时间均延后六个月；种子轮融资在 36 个月预测期内未能完成"
    unit: "情景时间"
    source: "针对 business-plan.yaml 所述 TSO 采购高度集中的风险做压力测试；种子轮融资失败是融资后果，不是有来源的市场统计。"
  - id: A29
    name: "毛利率敏感性"
    value: "下行情景 40%、基准 60%、上行情景 65%"
    unit: "收入占比"
    source: "40% 下限和 60% 目标来自 business-plan.yaml 的策略和止损标准；65% 是假设重复批次密度提高后的规划值，并非合作方报价。"
  - id: A30
    name: "招聘时间敏感性"
    value: "合作方运营岗位招聘时间：下行情景 M1、基准 M3、上行情景 M4"
    unit: "启动月份"
    source: "business-plan.yaml.team 将该岗位的招聘门槛设在第 3 个月；提前招聘用于测试现金风险，若合作方承担物流，延后一个月则是更精简的情景。"
