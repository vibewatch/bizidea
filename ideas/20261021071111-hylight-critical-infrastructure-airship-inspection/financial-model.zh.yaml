modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      QualifiedTSO[Qualified TSO account] --> RepairBatch[Eligible repair batch]
      RepairBatch --> PartnerFlight[Partner repeat flight]
      PartnerFlight --> EvidencePacket[Accepted or inconclusive evidence packet]
      EvidencePacket --> CampaignFee[Fixed campaign fee]
      CampaignFee --> GrossProfit[Gross profit after partner delivery cost]
      GrossProfit --> Cash[Cash after operating burn]
modelSanity:
  - checkName: "收入引擎"
    finding: "基准收入按预期客户月数 × $38.5K 年化 ARPU 计算；只有 M10、M16、M25 三家未经验证的 TSO 新客户都签约，且每家每年调用两次监测项目时，Y3 收入才会达到 $100.0K。"
  - checkName: "必须跑通的环节"
    finding: "模型要成立，必须拿到审核人员的书面认可、完成一个付费试点、让合作方交付经济性接近 60% 毛利率目标、验证复购需求，并在 Q4Y2 完成附条件的 $1.25M 种子轮融资。"
  - checkName: "模型失效情形"
    finding: "如果销售周期延后六个月，导致后续融资无法完成，下行情景的 Y3 收入将只剩 $14.3K，现金最低点将降至 -$355.9K。"
  - checkName: "下一轮融资验证门槛"
    finding: "最迟到 24个月时，需拿下付费监测项目、通过证据协议验收、试点毛利率至少达到 40%，并打通复购或第二家客户的采购路径；满足这些条件后，Q4Y2 种子轮才有依据。"
sanityChecks:
  ruleOf40: "仅供方向性参考：Y3 收入增长率 61.8% + EBITDA 利润率 -409.9% = -348.1%；按监测项目收费的服务不适合用它作 KPI。"
  burnMultiple: "Y3 净消耗 $409.9K 除以年新增净收入 $38.2K，烧钱倍数为 10.7x；服务收入不是 ARR，因此该指标只能作方向性参考，且表现很差。"
  revenuePerFte: "Y3 收入摊到年末 4.0 名 FTE 后，每名 FTE 对应 $25.0K；规模化公司看，这个水平偏低，但验证阶段的服务业务不能直接和成熟 SaaS 比。"
  flags:
    - "目前尚未验证独立买方、采购订单或空中证据验收标准是否存在；模型中的三家客户签约只是假设，并非有来源支撑的需求。"
    - "在 Q4Y2 那笔尚未承诺的 $1.25M 种子轮到账前，基准情景的现金最低点只有 $168.88K；若该轮未能完成，模型预测的 Y3 期末现金将为负。"
    - "60% 毛利率目标尚无有约束力的合作方报价支撑；business-plan.yaml 要求试点毛利率至少达到 40% 后才能扩大规模。"
    - "CAC 回收期为 36.8 个月，LTV/CAC 为 2.7x；客户流失率只是经验假设，且尚无服务续约数据，因此这两个指标都不稳。"
    - "Y3 EBITDA 仍为 -$409.93K，收入仅 $100.0K；招聘和支出都应设门槛，不应把这视为已证明具备风险投资级规模的业务。"
    - "模型把监测项目收入平滑摊开，并假设当期收付款、不计营运资金、税费或资本开支需求；实际飞行安排和付款条款都可能进一步压缩现金跑道。"
