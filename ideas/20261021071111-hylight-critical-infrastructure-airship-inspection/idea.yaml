differentiator: >-
  The wedge starts after a repair: a pre-agreed repeat flight, not another initial defect alert, becomes the proof
  object for closing a specific methane finding. Charging for a verification attempt rather than a favorable result
  avoids rewarding the service for suppressing a persistent signal; operator demand and comparable-flight protocols
  still require validation.
