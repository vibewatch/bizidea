jobsToBeDone:
  - job: >-
      When an airborne methane finding has been repaired, help pipeline-integrity leads determine whether its signal
      has cleared, so they can close or reopen the maintenance ticket with traceable evidence.
    currentAlternative: >-
      Likely a second survey or handheld technician check plus manual matching of the result to the repair record; this
      alternative needs customer validation.
    successMetric: >-
      Share of verification attempts producing an operator-accepted closure decision within the agreed post-repair
      window, with inconclusive cases tracked separately.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      It reframes the service from airborne detection to a repeat-flight repair-closeout unit with an explicit
      inconclusive state; this uncommon mechanism is distinct from the generic inspection workflow, though customer
      appetite remains unproven.
  venturePotential:
    score: 4
    rationale: >-
      Gas-network methane work and recurring infrastructure inspection could support repeat campaigns, but expansion
      depends on validating a new buyer budget and securing partner flight capacity.
  whiteSpace:
    score: 4
    rationale: >-
      The supplied history has no methane-repair verification concept, while adjacent test-gated and measured climate
      services exist; no competitor scan was performed, so market whitespace is not treated as absolute.
  painIntensity:
    score: 4
    rationale: >-
      The triage reports costly, unsafe, polluting, and workforce-constrained helicopter inspection claims and
      geographically located findings, but it does not establish the cost of post-repair verification specifically.
  wedgeClarity:
    score: 4
    rationale: >-
      One finding, one repair batch, and one repeat flight define a bounded paid pilot; operator acceptance criteria
      and access to a second flight must be proven.
  evidenceFit:
    score: 3
    rationale: >-
      The source set reports methane sensing, mapped findings, infrastructure customers, and field operations, but
      offers no operator-validated evidence for repeat-flight repair closure or willingness to pay.
topRisks:
  - name: "Repeat-flight conditions"
    description: >-
      Weather, sensor configuration, or flight conditions may make a post-repair reading incomparable with the
      original finding.
    mitigation: >-
      Co-design an operator-approved comparability protocol and classify failed-condition attempts as inconclusive
      instead of closed.
  - name: "Unproven buyer workflow"
    description: >-
      The supplied sources do not show that gas operators purchase a separate methane repair-verification service.
    mitigation: >-
      Secure a paid pilot tied to one real repair batch before building integrations or claiming regulatory value.
  - name: "Partner capacity dependence"
    description: >-
      The service depends on timely access to aircraft and sensors, and an aerial provider may prioritize its own
      inspection-data offer.
    mitigation: >-
      Begin with a narrow partner agreement that preserves customer access to raw evidence and qualify an alternative
      flight provider before promising recurring coverage.
