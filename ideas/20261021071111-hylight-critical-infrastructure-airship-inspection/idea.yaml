problem: >-
  Aerial methane detection can produce a geographically located finding, but the supplied sources do not show how an
  operator links that finding to a completed repair and independently documents whether the signal has cleared.
  Without a repeat-check workflow, the operator may have to coordinate another survey or reconcile field notes and
  maintenance records manually; that operational gap and its budget are hypotheses to test with gas-network teams.
targetUser:
  primary: >-
    Pipeline-integrity or methane-emissions operations leads at European gas-transmission operators who receive
    geolocated aerial findings and need to document repair closure; this workflow is a target hypothesis, not a
    source-verified customer practice.
  secondary: >-
    Field repair supervisors who need to link completed work to the originally detected location.
  buyer: >-
    Head of pipeline integrity or emissions compliance at a gas-transmission operator; willingness to buy a separate
    verification service is unvalidated.
startupThesis:
  nonObviousInsight: >-
    The valuable unit may not be another methane map, but a traceable closure record after a repair: a repeat flight
    can test whether the signal persists at the original location. The supplied sources support aerial methane sensing
    as a reported capability, not customer demand for this closeout loop.
  beachhead: >-
    A pilot with one European gas-transmission operator that has an aerially detected methane finding and a scheduled
    repair batch, focused on post-repair verification rather than broad asset inspection.
  wedge: >-
    A partner-operated verification campaign that links a geotagged methane finding to a repair record and a
    pre-agreed post-repair reflight, returning a closure or inconclusive evidence packet for each attempt.
  whyNowCatalyst: >-
    HyLight's €13 million raise and stated plan to grow its fleet, together with reporting of methane sensing and
    geolocated defect findings, make supplier and operator discovery timely; the source set does not show that
    customers currently buy post-repair reinspection.
  ventureScalePath: >-
    If a paid gas-network pilot proves repeat-flight demand, standardize the evidence and service protocol across more
    pipeline segments and operators, then test adjacent rail and power-network repair-verification workflows without
    broadening the initial product.
solution: >-
  For one operator and one repair batch, the service accepts an approved, geolocated methane finding and links it to
  the operator's repair record. After the crew marks work complete, it schedules a repeat airborne survey using an
  operator-approved sensor and a pre-agreed comparability window; unsuitable conditions produce an inconclusive
  result rather than a false closure. It returns the original and repeat evidence, location, timing, sensor
  configuration, and a reviewer-ready closure or recheck-needed packet to the operator's maintenance workflow. The
  initial service is partner-operated rather than aircraft-owning and charges per verification attempt, not only when
  the signal disappears.
goToMarketSeed:
  firstCustomer: >-
    A European gas-transmission integrity team with an aerially detected methane finding and a near-term repair batch;
    customer discovery must confirm that this is a real workflow before treating it as a qualified prospect.
  buyingTrigger: >-
    An aerial survey produces a repair-prioritized methane finding and the operator needs a traceable closeout record;
    this trigger is a hypothesis, not a documented purchase event.
  currentAlternative: >-
    Likely alternatives to validate are a repeat visit by the original survey provider or technician handheld checks
    recorded through maintenance notes, email, or spreadsheets.
  switchingReason: >-
    One linked evidence packet would connect the original location, repair completion, and repeat sensor pass, letting
    the operator mark a ticket closed or request another check without manually reconciling separate files.
  pricingHypothesis: >-
    Fixed campaign fee plus a fee per verification attempt, regardless of whether the methane signal clears; test
    willingness to pay per auditable repair closeout rather than per aircraft hour.
