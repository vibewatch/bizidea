jobsToBeDone:
  - job: >-
      甲烷异常点经修复后，帮助管道完整性负责人判断信号是否已消失，凭可追溯证据关闭或重新打开维护工单。
    currentAlternative: >-
      可能是再做一次巡检，或由技术人员手持设备复查，再手动把结果与修复记录匹配；这种替代做法还需客户验证。
    successMetric: >-
      在约定的修复后时间窗口内，核验尝试中形成运营方认可关单判断的比例；无法判定的情况单独统计。
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      它把服务从空中检测转向修复后的复飞关单，并明确保留无法判定状态；这种少见机制有别于通用巡检工作流，但客户对它的接受度尚未得到验证。
  venturePotential:
    score: 4
    rationale: >-
      燃气管网甲烷治理和持续性基础设施巡检可能带来重复任务，但扩张取决于能否验证新的买方预算，并确保获得合作伙伴的飞行运力。
  whiteSpace:
    score: 4
    rationale: >-
      现有历史记录中没有甲烷修复核验方案，但已有以测试结果触发付款的概念，也有基于环境实测的气候服务；尚未扫描竞争对手，不能把市场空白视为绝对。
  painIntensity:
    score: 4
    rationale: >-
      新闻筛选材料转述了直升机巡检成本高、不安全、污染大且受劳动力限制等说法，也提到带地理坐标的巡检线索；但没有说明修复后核验本身要花多少钱。
  wedgeClarity:
    score: 4
    rationale: >-
      一个异常点、一批修复作业和一次复飞，划定了范围明确的付费试点；运营方的验收标准和第二次飞行的安排都还需验证。
  evidenceFit:
    score: 3
    rationale: >-
      现有来源提到甲烷感知、带坐标的缺陷线索、基础设施客户和实地运营，但没有运营方验证的修复后复飞关单证据，也没有付费意愿证据。
topRisks:
  - name: "复飞条件不匹配"
    description: >-
      天气、传感器配置或飞行条件可能导致修复后读数无法与最初发现时的读数比较。
    mitigation: >-
      与运营方共同制定并认可可比性方案；条件不满足时记录为无法判定，不要直接关单。
  - name: "买方工作流未经验证"
    description: >-
      现有来源没有显示燃气运营商会单独购买甲烷修复核验服务。
    mitigation: >-
      在开发系统对接或宣称监管价值前，先拿下一个绑定真实修复批次的付费试点。
  - name: "依赖合作伙伴运力"
    description: >-
      服务需要及时获得飞行器和传感器；空中巡检服务商也可能优先推广自己的巡检数据产品。
    mitigation: >-
      先签范围明确的合作协议，确保客户能拿到原始证据；承诺持续覆盖前，先确认另一家飞行服务商也能接单。
