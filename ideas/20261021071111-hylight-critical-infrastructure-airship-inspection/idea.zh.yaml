    signalRefs:
      - "据报道具备甲烷感知能力"
    sourceRefs:
      - 2
  - point: >-
      带地理坐标的缺陷线索据报道已用于维护规划，空中检测结果或可与修复记录衔接；修复后核验工作流仍未得到验证。
    signalRefs:
      - "带地理坐标的维护线索"
    sourceRefs:
      - 2
  - point: >-
      Leonard 报道了覆盖 50 公里铁路的巡检合作和超过 750 小时的飞行记录，说明其已有据报的实地运营；但这不能证明甲烷专项修复关单，也不能证明客户验证过节省金额。
    signalRefs:
      - "据报道已有实际部署"
    sourceRefs:
      - 1
differentiator: >-
  切口从修复后开始：事先约定的复飞才是关闭某个甲烷异常的凭据，不是再发一条初始缺陷告警。按核验次数收费、不与有利结果挂钩，可以避免服务方因掩盖仍然存在的信号而获利；运营方是否有需求、如何制定可比飞行方案，仍待验证。
