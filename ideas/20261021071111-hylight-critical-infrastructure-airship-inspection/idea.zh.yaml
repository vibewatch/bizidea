problem: >-
  空中甲烷检测可以定位异常点，但现有来源没有说明运营方如何把异常点与已完成的修复关联，也没有说明运营方如何独立记录甲烷信号是否消失。缺少复查流程时，运营方可能要协调再次巡检，或手动核对现场记录和维护档案。这一运营缺口及其预算都只是待与燃气管网团队验证的假设。
targetUser:
  primary: >-
    欧洲输气运营商中，负责管道完整性或甲烷排放运营的负责人。他们接收带地理坐标的空中巡检发现，需要记录修复是否完成闭环；这套工作流只是目标假设，并非来源证实的客户做法。
  secondary: >-
    需要把已完成的现场作业与最初发现位置关联起来的维修主管。
  buyer: >-
    输气运营商的管道完整性或排放合规负责人；他们是否愿意单独购买核验服务尚未验证。
startupThesis:
  nonObviousInsight: >-
    真正有价值的可能不是再做一张甲烷地图，而是修复后留下一条可追溯的关单记录：复飞可以检查原位置的甲烷信号是否仍然存在。现有来源仅显示，空中甲烷感知是据报道具备的能力；并未证明客户需要这套关单流程。
  beachhead: >-
    先与一家欧洲输气运营商开展试点：对方已有空中检测出的甲烷异常点，也安排了一批待修复作业；试点只做修复后核验，不扩展成全面资产巡检。
  wedge: >-
    由合作伙伴执行核验任务，把带地理坐标的甲烷异常点、修复记录和事先约定的修复后复飞串起来；每次尝试都返回关单证据包或无法判定的证据包。
  whyNowCatalyst: >-
    HyLight 融资 €13 million 并计划扩大机队；报道也提到甲烷感知和带地理坐标的缺陷线索。现在适合接触供应商和运营方，但现有来源没有证明客户正在购买修复后复查服务。
  ventureScalePath: >-
    如果燃气管网付费试点验证了复飞需求，就把证据标准和服务流程复制到更多管段和运营商，再测试铁路和电力网络等相邻领域的修复核验流程；初期产品范围不变。
solution: >-
 这项服务先覆盖一家运营方的一批修复作业：接收经运营方认可、带地理坐标的甲烷异常点，并与运营方的修复记录关联。维修团队标记作业完成后，服务安排一次空中复查，使用运营方认可的传感器，并在事先约定的可比时间窗口内执行；条件不适合判断时，结果记为无法判定，不误报修复完成。服务把原始和复查证据、位置、时间、传感器配置整理成证据包，供运营方在维护工作流中审核并决定关单或要求复查。初期由合作伙伴运营，不自有飞行器；每次核验尝试都收费，不只在甲烷信号消失时收费。
goToMarketSeed:
  firstCustomer: >-
    一家欧洲输气运营商的管道完整性团队；该团队已有空中检测出的甲烷异常点，也安排了近期的一批修复作业。先通过客户访谈确认这套工作流真实存在，再将其视为合格销售线索。
  buyingTrigger: >-
    空中巡检发现一处需要优先修复的甲烷异常点，运营方需要可追溯的关单记录；这只是待验证的触发条件，并非有记录的采购事件。
  currentAlternative: >-
    可能的替代方案包括请原巡检服务商再次上门，或由技术人员手持设备复查，再通过维护记录、邮件或电子表格手动登记；这些做法仍需客户验证。
  switchingReason: >-
    一份关联证据包会把原始位置、修复完成记录和传感器复查结果串起来。运营方无需再手动核对不同文件，就能关闭工单或要求再次检查。
  pricingHypothesis: >-
    按整批任务收取固定费用，再按核验次数收费，不因甲烷信号是否消失而改变；需要验证客户对可审计修复关单的付费意愿，而非只按飞行小时收费。
whyNow:
  - point: >-
      HyLight 宣布融资 €13 million，推动飞艇产业化。现在正适合验证其据报道的运力能否支持后续核验服务。
    signalRefs:
