    currentAlternative: "Rely on internal network design work, vendor demonstrations, and separate integration and qualification tests."
    successMetric: "Repeatable net accelerator-hours recovered on the agreed workload without breaching the pre-agreed job-completion and network-reliability guardrails."
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "The idea changes optical-switch adoption from a hardware or nominal-bandwidth sale into a commissioning service paid partly for verified accelerator time recovered after reconfiguration overhead; no historical idea monetizes this workload-level network outcome."
  venturePotential:
    score: 4
    rationale: "Repeated cluster commissioning and outcome contracts could become a meaningful specialist business and expand to other data-center network changes, but the initial market is narrow and service-intensive."
  whiteSpace:
    score: 4
    rationale: "The history index has no optical-network performance service or recovered-accelerator-time contract, although incumbent optical suppliers and other photonics firms create real competitive gravity."
  painIntensity:
    score: 4
    rationale: "The source evidence says accelerator communication delays can limit system-level AI performance, but names no customer deployment or quantified workload-level loss."
  wedgeClarity:
    score: 4
    rationale: "The first engagement is a bounded paired test on one multi-rack cluster with an agreed packet baseline, but access, repeatability, and buyer acceptance of the success metric remain to be proven."
  evidenceFit:
    score: 4
    rationale: "The funding, reported demonstration and product roadmap, communication-delay rationale, and reconfiguration and qualification caveats support the timing and test mechanism; they do not establish customer demand or willingness to pay."
topRisks:
  - name: "Unstable performance attribution"
    description: "Workload variance or changing software and cluster conditions could make measured accelerator-time gains hard to reproduce or attribute to the optical network."
    mitigation: "Pre-agree fixed run conditions and baselines, repeat paired trials, preserve raw measurements, and pay success fees only above a conservative confidence threshold."
  - name: "Reconfiguration erases gains"
    description: "For bursty traffic or short communication phases, optical circuit setup overhead may exceed any benefit from the path."
    mitigation: "Measure reconfiguration time first, qualify only phases with adequate hold time, and keep unsuitable traffic on the packet network."
  - name: "Slow qualification and procurement"
    description: "Production network changes require site-specific design, integration, and approval, while the source set names no commercial customer deployments."
    mitigation: "Start with a capped, customer-controlled test cluster and supplier demonstration hardware, define a fixed acceptance protocol, and avoid a production commitment until the evidence passes."
