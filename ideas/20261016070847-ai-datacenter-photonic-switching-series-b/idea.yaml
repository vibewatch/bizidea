problem: >-
  AI cluster operators may not know whether optical circuit switching will improve their own training jobs: the
  reported bottleneck is inter-accelerator communication, but the value depends on traffic patterns and optical
  reconfiguration time. They risk committing to a new network design before proving that any job-time gain survives
  reconfiguration overhead and integration work. The supplied evidence reports no named customer deployments,
  commercial results, or workload-level qualification metrics.
targetUser:
  primary: "Network-performance and cluster-infrastructure leads at U.S. AI cloud providers evaluating optical circuit switching for multi-rack accelerator-training workloads."
  secondary: "AI training-platform teams that can provide representative workloads and approve a controlled network trial."
  buyer: "VP of infrastructure or network engineering at an AI cloud provider."
startupThesis:
  nonObviousInsight: "The commercial proof is not port count or signal latency alone; it is whether a customer's stable communication phases recover more accelerator time than optical reconfiguration consumes, while packet switching remains available for traffic that does not fit."
  beachhead: "One U.S. AI compute operator with a multi-rack accelerator pod, an active optical-switch evaluation, and repeatable training jobs that can be run against an approved packet-network baseline."
  wedge: "A paid, vendor-neutral commissioning campaign that runs paired packet and optical trials on the same customer workloads, counts reconfiguration overhead, and charges a success fee only for repeatable accelerator-hours recovered."
  whyNowCatalyst: "Salience Labs' $125 million Series B is intended to accelerate deployment, manufacturing scale, and U.S. expansion; trade coverage also reports a 64-port demonstration and planned higher-port-count products while noting that qualification remains necessary."
  ventureScalePath: "Repeat the commissioning and outcome contract across AI clusters, build reusable workload-fit and qualification protocols, then apply the same measured-performance model to other data-center network upgrades where configuration changes can be tied to compute time recovered."
solution: >-
  For one multi-rack cluster, the team and buyer first agree on a representative training job, baseline topology,
  fixed workload and software conditions, measurement window, and minimum worthwhile improvement. The team runs
  repeated paired trials on the packet-network baseline and an optical-circuit configuration, recording job
  completion time and subtracting measured reconfiguration overhead. It recommends optical circuits only for
  repeatable communication phases whose useful hold time exceeds the measured setup cost, leaving unsuitable
  traffic on the packet network. A fixed commissioning fee covers test design, with a success fee per accelerator-hour
  recovered only after agreed thresholds pass across repeated runs. The venture uses customer-approved test
  environments and existing switch suppliers rather than manufacturing network hardware.
goToMarketSeed:
  firstCustomer: "A U.S. AI cloud provider with a multi-rack accelerator cluster, repeatable training jobs, and an optical-circuit-switch evaluation before a production network design is committed."
  buyingTrigger: "A network team is comparing an optical-switch demonstration or higher-port-count product with its packet-network design and needs workload-specific qualification before a production purchase."
  currentAlternative: "Internal network engineering plus vendor demonstrations, packet-network benchmarking, and site-specific integration and qualification work."
  switchingReason: "The operator gets a pre-agreed, repeated comparison that includes reconfiguration overhead and pays a success fee only if the optical configuration returns measurable accelerator time."
  pricingHypothesis: "A fixed fee for a cluster-specific commissioning campaign plus a success fee per verified accelerator-hour recovered above the agreed threshold."
