differentiator: >-
  Switch manufacturers sell the hardware and network integrators sell design work; this venture sells a measured,
  customer-specific answer to whether optical circuits recover useful accelerator time after reconfiguration
  overhead. It evaluates real workloads and leaves non-fitting traffic on packet switching, instead of treating
  nominal port count, signal latency, or a generic network dashboard as proof of value.
