  notes: >-
    这些是按项目计费的规划代理值，不是 SaaS 指标：年度 ARPU 假设每个客户每年购买一个 $300K 项目；LTV = 年度 ARPU x 60% 毛利率 x 24 个月 / 12；CAC = 模型中的三年销售与营销费用 $681K / 预测的首次签约客户数（三家）；月流失率取假设的 24 个月客户关系期限的倒数。以上均非实测，复购频次尚未得到验证。
fundingAsk:
  round: pre-seed
  amountM: 2.0
  runwayMonths: 24
  milestone: "截至第18个月，完成一个付费项目，取得可重复验证且买方认可的工作负载结果，并签下一个复购项目或第二位买方带来的项目；同时保留六个月零收入运营缓冲金。"
  minimumModeledNeedM: 1.1795
  gatedReserveAboveMinimumM: 0.8205
  runwayBasis: "这里的 24 个月指规划中的 18 个月创始人主导验证阶段加六个月缓冲；基准现金计划截至第 36 个月仍为正，因此这是融资窗口，而非预计现金耗尽时间。"
  useOfFunds:
    - bucket: 工程与交付
      amountUsd: 1000000
      percentage: 50.0
    - bucket: GTM（市场拓展）
      amountUsd: 250000
      percentage: 12.5
    - bucket: "G&A（综合管理）"
      amountUsd: 200000
      percentage: 10.0
    - bucket: "缓冲金（6 个月）"
      amountUsd: 550000
      percentage: 27.5
