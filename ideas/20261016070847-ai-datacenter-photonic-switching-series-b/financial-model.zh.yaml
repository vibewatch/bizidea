modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      ICP[Qualified operator] --> Campaign[Paid commissioning campaign]
      Campaign --> FixedFee[Fixed pilot fee]
      Campaign --> Evidence[Buyer-approved paired workload evidence]
      Evidence --> OutcomeFee[Capped measured-outcome fee if verified]
      FixedFee --> GrossProfit[Gross profit after delivery cost]
      OutcomeFee --> GrossProfit
      GrossProfit --> Cash[Cash after operating expenses]
modelSanity:
  - checkName: 收入引擎
    finding: "基准情景在 Y1 签下一个为期四个月、固定费用 $300K 的项目，Y2 签下两个，Y3 签下三个；只有买方认可的收益得到验证后，结果挂钩费用才会增加收入，基准情景目前不计这项收入。"
  - checkName: 必须跑通的条件
    finding: "模型要求获得三个首次签约客户，并按 $300K 规划费用签下复购项目；Y3 收入达到 $900K，接近近期 SOM 年规模估算 $0.5M-$1.5M 的上沿。"
  - checkName: 模型失效条件
    finding: "如果付费试点延期且复购未能落地，下行情景 Y3 的两个项目只能带来 $600K 收入，现金最低点为 $309.5K，且没有结果挂钩费用提供缓冲。"
  - checkName: 下一轮融资所需验证
    finding: "截至第18个月，证明重新配置后仍能持续取得买方认可的工作负载净收益；签下复购项目或第二位买方的付费项目；并将实测交付毛利率做到接近 60% 计划目标。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 50.0% + EBITDA 利润率 -44.6% = 5.4%，远低于 40%；增长起点只是很小的项目收入基数。"
  burnMultiple: "1.34x 代理指标 = Y3 EBITDA 现金消耗 $401K / Y3 增量收入 $300K；收入来自间歇性服务，因此这不是 SaaS 净消耗倍数。"
  revenuePerFte: "Y3 年末每个 FTE 对应收入 $225K = $900K / 4 个 FTE；项目收入不是经常性 ARR。"
  flags:
    - "目前没有经过验证的客户、已签工作范围、公开定价、买方认可的成功费条款或独立测得的节省额；所有项目数量和费用都是预测假设。"
    - "基准情景 Y3 项目量达到三个，累计模型客户数也达到三个，接近 2-3 个客户的 SOM 估算上限；底层服务市场规模仍只是未经验证的情景。"
    - "60% 毛利率目标依赖将收入的 20% 分配给交付薪酬、另 20% 分配给其他直接成本；实际用工强度、接入成本和利用率都可能大幅压低毛利率。"
    - "按项目测算的 LTV/CAC 仅为 1.59x，模型回收期为 15.13 个月，并假设客户关系持续 24 个月且期间有复购；留存和获客经济性都尚未实测。"
    - "$2M 融资额高于约 $1.18M 的基准里程碑加缓冲金最低需求；超出部分是应对接入、采购、安全和回款风险、需过关后才能动用的应急储备，不是经过验证的支出需求。"
    - "模型假设收入在确认当月收回，且未计税费、利息、资本开支和营运资金账期；因此现金余额对企业客户延迟付款较敏感。"
