      - "延迟项目拿到资金后，集群性能工程师才入职；解决方案与可靠性工程师的招聘推迟到模型期之后。"
      - "项目费用仍为 $300K 规划值，结果挂钩费用仍为零。"
  base:
    description: "Y1、Y2、Y3 分别签下一个、两个、三个固定收费付费项目；模型假设有三个首次签约客户和复购项目，不计结果挂钩费用。"
    y3RevenueK: 900.0
    y3EbitdaK: -401.0
    cashLowPointK: 659.5
    keyAssumptionChanges:
      - "项目分别从 M9、M13、M19、M25、M29、M33 启动，每个收费 $300K，收入按四个月摊销确认。"
      - "三个首次签约客户和三个复购项目只是目标，并非已签工作，也不是转化预测。"
      - "模型将 60% 目标毛利率拆为 20% 交付薪酬和 20% 其他直接成本。"
