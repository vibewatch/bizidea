slug: "verified-accelerator-hours"
date: "2026-10-16"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: 预测起始时间
    value: "2026-11"
    unit: YYYY-MM
    source: "管理层规划口径：预测从商业计划日期后的首月开始；模型不含历史期间。"
  - id: A2
    name: 期初客户与业务进展
    value: "0"
    unit: customers
    source: "[business-plan.yaml executiveSummary and investorMemo; research.yaml coverageGap] 目前没有宣称已有付费客户、合同、客户级节省结果或客户牵引力。"
  - id: A3
    name: 固定调试项目费用
    value: "300"
    unit: USD K per campaign
    source: "[business-plan.yaml gtm.pricing and research.yaml market.bottomUpSizingDrivers] 规划值取自假设性的固定费用等价项目区间 $250K-$500K；不是公开定价、正式报价或经过验证的付费意愿。"
  - id: A4
    name: 项目交付周期
    value: "4"
    unit: months
    source: "[business-plan.yaml investorMemo.firstCustomer.initialContract] 采用规划区间 8-16 周的上限；合同期限尚未验证。"
  - id: A5
    name: 固定费用收入确认
    value: "75"
    unit: USD K / 每个活跃项目月
    source: "按 A3/A4 逐月平均确认收入；直线法确认收入只是规划口径，并非客户实际账单安排。"
  - id: A6
    name: 基准付费项目排期
    value: "6 个项目：Y1 M9；Y2 M13、M19；Y3 M25、M29、M33"
    unit: campaigns by start month
    source: "[business-plan.yaml milestones, gtm.funnelTargets, market.som; research.yaml market.som] 预测目标依据第 9 个月的试点关口，以及近期 SOM 估算中的 2-3 个客户；不代表销售管线或已签项目，也不构成转化率主张。"
  - id: A7
    name: 模型假设中的首次签约客户
    value: "共 3 个：M9、M13、M29"
    unit: new logos
    source: "[business-plan.yaml milestones and sequencingRationale; research.yaml market.som] 规划目标是在 Y3 时覆盖三个不同客户账户，达到近期 SOM 估算上限；不代表任何客户账户已落实。"
  - id: A8
    name: 复购项目签约
    value: "3 个复购项目"
    unit: campaigns
    source: "[business-plan.yaml businessModel.expansionLevers and milestones] 假设验证成功后会有复购或第二个集群项目；复购需求尚未验证，也不能算作客户牵引力。"
  - id: A9
    name: 基准结果挂钩费
    value: "0"
    unit: USD K per campaign
    source: "[business-plan.yaml operatingAssumptions and gtm.pricing; research.yaml coverageGap] 在买方接受结果挂钩计费公式、且收益得到独立验证之前，基准收入不计入这项费用。"
  - id: A10
    name: 示例性上行情景结果挂钩费上限
    value: "30"
    unit: USD K per verified campaign
    source: "仅用于管理层敏感性分析：按 A3 的 10% 计费，设有上限，并以买方认可的净收益为前提；没有公开费率，也不假设已签费用、转化率或节省金额。"
  - id: A11
    name: 目标毛利率
    value: "60"
    unit: percent
    source: "[business-plan.yaml businessModel.targetGrossMarginPct] 这是计划目标，不是实测交付毛利率。"
  - id: A12
    name: 交付薪酬分摊
    value: "20"
    unit: percent of revenue
    source: "内部初创公司财务规划经验值，按商业计划中的 60% 目标毛利率校准；这是模型中的交付薪酬分摊，不是工时记录证据。"
  - id: A13
    name: 其他项目直接成本
    value: "20"
    unit: percent of revenue
    source: "内部初创公司财务规划经验值，用于估算测试接入、差旅和项目专属承包商成本；未找到供应商报价或客户专属成本。"
  - id: A14
    name: 创始工程师年度全成本薪酬
    value: "150"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] 内部初创公司财务规划估算，包含雇主承担的额外成本；未采用外部薪酬调查。"
  - id: A15
    name: CEO 与企业级 GTM 创始人年度全成本薪酬
    value: "135"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] 创始人主导模式下的内部现金薪酬规划估算，包含雇主承担的额外成本；未采用外部薪酬调查。"
  - id: A16
    name: AI 集群性能工程师年度全成本薪酬
    value: "165"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] 内部初创公司财务规划估算，包含雇主承担的额外成本；未采用外部薪酬调查。"
  - id: A17
    name: 解决方案与可靠性工程师年度全成本薪酬
    value: "155"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] 内部初创公司财务规划估算，包含雇主承担的额外成本；未采用外部薪酬调查。"
  - id: A18
    name: 招聘触发条件与时间
    value: "创始团队 M1 在岗；首个付费项目落地后，集群工程师 M9 到岗；出现复购需求后，解决方案/可靠性工程师 M19 到岗"
    unit: hiring schedule
    source: "[business-plan.yaml team, sequencingRationale, operatingAssumptions, and milestones] 招聘按阶段设门槛，安排较保守；3 年基准情景不计划单独招聘销售。"
  - id: A19
    name: 非薪酬销售与营销开支
    value: "M1-M6 每月 4；M7-M12 每月 6；Y2 每月 8；Y3 每月 10"
    unit: USD K per month
    source: "内部初创公司财务规划估算，用于创始人主导的客户挖掘、差旅和方案撰写；不主张任何 CAC 或转化基准。"
  - id: A20
    name: 非薪酬研发与测试框架开支
    value: "M1-M8 每月 15；M9-M12 每月 18；Y2 每月 15；Y3 每月 18"
    unit: USD K per month
    source: "[business-plan.yaml product, operations, and fundingAsk] 内部规划估算，用于工具、安全测试接入和可复用的测量流程；不是硬件报价。"
  - id: A21
    name: 非薪酬综合管理开支
    value: "Y1 每月 10；Y2 每月 12；Y3 每月 15"
    unit: USD K per month
    source: "[business-plan.yaml operations and fundingAsk] 内部初创公司财务规划估算，用于法律、安全、保险、采购和会计开支；不假设需要客户专属的合规认证。"
  - id: A22
    name: 期初现金与首轮融资
    value: "期初现金 0；M1 融资 2000"
    unit: USD K
    source: "[business-plan.yaml fundingAsk] 采用暂定 $2M-$3M 融资目标区间的下限；融资只是模型中的筹资假设，并非承诺。"
  - id: A23
    name: 收付款时间
    value: "与收入和费用在同一个月确认"
    unit: timing convention
    source: "初创公司现金规划经验值；模型未计应收/应付账期、税费、利息、资本开支或其他融资，因此营运资金状况可能偏乐观。"
  - id: A24
    name: 六个月零收入运营缓冲金
    value: "512.5"
    unit: USD K
    source: "按基准情景 M19-M24 的薪酬及非薪酬运营开支计算，假设收入为零、可变 COGS 为零；所得缓冲金向上取整至资金用途中的 $550K。"
  - id: A25
    name: 基准客户关系期限
    value: "24"
    unit: months
    source: "[business-plan.yaml businessModel.expansionLevers and research.yaml market.sam] 为间歇型买方设定的规划代理值，假设先有初始项目、再评估复购；尚无留存数据。"
  - id: A26
    name: 单位经济模型中的项目频次
    value: "1"
    unit: 项目 / 客户账户年
    source: "[research.yaml market.sam and market.som; business-plan.yaml businessModel] 用于年化客户账户收入的规划单位；项目具有间歇性，并非订阅 ARR。"
  - id: A27
    name: CAC 计算样本
    value: "3 个新客户，3 年内预订 6 个项目"
    unit: 模型客户数与项目数
    source: "依据 A6-A8 及基准情景 S&M 开支计划计算；这是未经验证的预测代理值，不是历史获客数据。"
  - id: A28
    name: 下行情景项目与招聘路径
    value: "Y1 无项目；Y2 在 M19 启动一个项目，Y3 在 M25 和 M31 各启动一个项目；M19 招聘集群工程师；不招聘解决方案/可靠性工程师"
    unit: downside scenario
    source: "[business-plan.yaml killCriteria, sequencingRationale, and team] 付费项目延迟和冻结招聘属于下行情景，并非对已签项目的预测。"
  - id: A29
    name: 资金用途分配
    value: "工程 1000；GTM 250；G&A 200；六个月缓冲金 550"
    unit: USD K
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary] 内部预算分配合计为模型中的 $2M 融资额；各项包括需过关后才能动用的储备，不是供应商报价。"
modelBasis:
  sourcedFacts:
    - "商业计划给出假设性的 $250K-$500K 固定费用等价项目区间、60% 目标毛利率，以及为期 18 个月的创始人主导阶段暂定 $2M-$3M 融资需求。"
    - "商业计划中的销售漏斗数量只是规划假设；计划未报告付费合同或经过验证的客户结果。"
    - "研究估算近期服务 SOM 年规模为 $0.5M-$1.5M，基于 2-3 个客户且每个客户一个项目，并明确排除不确定的结果挂钩费用。"
    - "研究没有公开服务定价，也没有独立付费调试合同、客户工作负载节省数据或获认可的加速器运行时长成功费公式。"
  forecastDefinitions:
    - "customersEop 表示期末活跃付费项目客户等价数，不是累计独立客户数；newCustomers 统计首次签约客户，newCampaigns 还包括复购项目。"
    - "Y1 月收入按活跃付费项目客户等价数乘以 $75K 月度项目 ARPU 计算；季度收入按平均活跃项目客户等价数乘以 $225K 季度 ARPU 计算。"
    - "基准固定费用收入在四个月内平均确认；基准情景不计结果挂钩费用，只有在有条件的上行情景中才会出现。"
    - "全成本薪酬按各岗位 FTE 和 A14-A18 计算；salaryK = salaryInCogsK + salaryInOpexK，且 salaryInOpexK 计入各职能运营费用。"
    - "COGS 包含 A12 交付薪酬和 A13 其他直接成本；毛利 = 收入 - COGS，OPEX = 销售与营销 + R&D + G&A，EBITDA = 毛利 - OPEX。"
    - "现金余额按期初现金加融资和当月客户回款，再扣除 COGS 与 OPEX 逐期滚动；这一简化口径未计税费、利息、资本开支或营运资金时点。"
  fundingCalculation: >-
    基准情景截至 M18 的净现金消耗为 $667K。此后按 M19-M24 招聘完成后的零收入成本水平再运营六个月，需要 $512.5K；据此估算，达到模型里程碑并保留缓冲金至少需要约 $1.18M。$2.0M 融资额采用计划目标区间下限，超出部分作为需过关后动用的储备，应对接入、安全、采购及回款延迟；这笔储备不代表已承诺支出。
