slug: "verified-accelerator-hours"
date: "2026-10-16"
executiveSummary: >-
  公司拟提供厂商中立的调试验证，判断计入光路重配置和运营开销后，光路交换（OCS）能否提升真实多机架 AI 训练任务的表现。首个买家是一家美国 AI 云服务商：在确定生产集群拓扑前，它要判断是否针对一项可重复训练任务验证 OCS；网络工程团队是实际使用者，基础设施或网络工程副总裁则可能是经济决策者。付费验证项目将反复开展受控的分组交换与光路交换测试，把不适合的流量留在分组交换网络，并将双方事先约定的一部分费用与经核实净回收的加速器小时数挂钩。研究显示，现在正是评估窗口：Salience Labs 宣布完成 $125 million B 轮融资，并介绍了 64 端口演示产品和未来端口数更高的产品；其他研究也提到 OCS 试验与部署，但都不能证明市场需要这项服务，也没有验证客户层面的节省。OCS 是否适用取决于具体工作负载；Google 级别的内部工程团队、供应商捆绑的评估服务和现有分组交换网络，都是现实替代方案。研究估算的全球年度服务 TAM 为 $5M-$40M、美国 SAM 为 $2.5M-$10M、近期 SOM 为 $0.5M-$1.5M；这些只是基于假设买家数、项目频率和假设费用的情景估算，并非已观察到的支出。拟议的差异化在于客户掌握的证据协议和结果付费合同，而非独有的调度技术或已验证的护城河。种子前阶段计划应为一支精干、工程主导的团队提供资金，用于验证付费试点并沉淀可复用的调试验证方法；目前没有声称已取得客户进展、已有买方接受的成功费公式，或已证实节省。
problem:
  - "评估 OCS 的运营方缺少独立证据，无法确认自家训练任务在计入重配置、部署准备和运营开销后，端到端耗时是否缩短。"
  - "供应商演示和端口数规格无法证明产品适配具体工作负载、结果可重复，也无法证明它能与分组交换网络安全共存。"
  - "工作负载波动、软件变更和遥测缺口会引发性能归因争议，削弱结果挂钩合同的可执行性。"
  - "大型运营方可能自行搭建验证能力，OCS 供应商和集成商也可能把评估服务打包提供；市场是否愿意为独立服务单独拨款尚未验证。"
solution:
  - "测试前与买方敲定有代表性且可重复的任务、分组网络基线、固定的软件与集群条件、运行顺序、护栏，以及加速器小时数的计算公式。"
  - "在买方控制的环境中，反复开展成对的分组交换与光路交换试验；记录任务完成情况、故障、重配置耗时及其他双方约定的开销。"
  - "只有当光路的有效保持时间超过实测建链耗时，才建议该阶段使用光路；不适配的流量继续走分组交换。"
  - "交付可复现的证据包，收取固定调试验证费；只有收益超过预先约定的门槛时，才收取设有上限的成功费。"
whyWeWin:
  - "基线、验收标准以及生产决策所依据的证据都由买方掌握，而不是由交换机供应商掌握。"
  - "协议衡量的是扣除重配置开销后的工作负载级结果，不会把光路时延、带宽或端口数直接当作价值证明。"
  - "公司不制造硬件、不接管全部流量，也不宣称 OCS 对所有场景都有益；首个项目的范围因此小于网络改造项目。"
  - "在审阅过的供应商公开材料中，这种合同设计似乎不常见，但内部工程团队和 OEM 现场团队可以复现其中一部分；护城河还得靠可信的效果归因和可重复结果一点点建起来。"
strategicChoices:
  beachhead: "选择一家美国 AI 云服务商或大型 AI 算力运营方：拥有多机架加速器 Pod、正在评估 OCS，且在确定生产拓扑前有可重复的训练任务。"
  wedgeRationale: "生产前的验证决策有明确买家、测试窗口和分组交换基线。从单个 Pod 和少量可重复任务切入，能把集成范围控制住，并在投入资本或承诺生产变更管理前检验工作负载适配性；一开始就做广泛的网络优化，会冲淡这项验证。"
  sequencingRationale: "先验证买方预算、工作负载访问权限和测量方法能否获认可；再落实评估硬件并开展付费成对试验；只有拿到一项可重复的结果后，才扩充现场交付能力、自动化证据流程，并拓展第二家运营方或供应商。这样可以避免在付费意愿和效果归因尚未得到证明前，就开发平台或扩大服务规模。"
  notYet:
    - "不制造 OCS 硬件，也不与 Salience Labs、Polatis 或 Calient 比拼交换机规格。"
    - "不开发通用 SDN 控制器、GPU 网络仪表盘或广泛的网络运维平台。"
    - "不把已经拥有成熟内部 OCS 技术栈的超大规模云厂商作为默认首批客户。"
    - "在了解具体买家的安全和可重复性要求前，不进入联邦/国防工作负载、国际市场或相邻的网络验证类别。"
market:
  tam: "全球年度服务收入情景估算为 $5M-$40M，并非已观察到的需求：研究假设有 20-40 家符合条件的运营方，每年开展 1-2 次项目，每个项目收费 $250k-$500k。"
  sam: "美国年度服务收入情景估算为 $2.5M-$10M，并非基于已核实的客户名单：研究假设有 10-20 家符合条件的运营方，每年各开展一次项目，单价为 $250k-$500k。"
  som: "近期年度情景估算为 $0.5M-$1.5M，并非预测：研究假设有 2-3 家美国客户，每家各开展一个 $250k-$500k 项目；不计结果费，也不计拓展到重复集群的收入。"
  segments:
    - "主要客群：美国 AI 云服务商，拥有多机架加速器训练集群、可重复任务，且正在生产部署前评估 OCS。"
    - "次要客群：大型 AI 算力运营方，其网络和训练平台团队有权批准受控试验，也能提供分组交换基线。"
  buyingProcess: "网络性能或集群基础设施负责人会界定评估范围，并提供工作负载和遥测访问权限；可能的预算发起人是基础设施、网络工程或 AI 云业务副总裁。安全、可靠性、工作负载负责人和采购团队都可能否决试验。研究没有记录销售周期或服务预算，因此必须验证“企业采购流程需要数月”这一假设。"
product:
  mvp: "一项范围固定的调试验证项目，包含客户批准的运行协议、有限的轨迹和遥测采集、分组交换与光路交换成对测量、重配置成本核算，以及可复现的验收报告。v1 无需开发生产控制平面产品或网络硬件。"
  sixMonth: "目标：在一个集群、至少两项可重复任务上完成首个付费评估，或完成买方明确出资的评估；控制条件须经买方认可，测试结果须书面留档。未达到验收门槛，就不要宣称取得节省。"
  twelveMonth: "目标：在第二家独立运营方或第二个供应商平台上复用该方法，记录工作负载适配失败和通过的场景，并将证据包和合同指标标准化。"
  twentyFourMonth: "如果两家独立买方验证了该方法，且出现复购，就自动化测试准备、测试运行关联分析和报告生成；否则，维持小规模固定收费的验证服务，或停止业务，而不是过早拓宽范围。"
  keyBets:
    - "部分多机架训练任务拥有稳定且足够长的通信阶段，可以摊平真实 OCS 重配置和控制开销。"
    - "即便供应商提供评估硬件或工程支持，买方仍愿意为中立验证付费。"
    - "如果公式、基线、排除项、置信门槛和争议处理流程都提前约定，买方会接受以加速器小时数衡量结果。"
    - "测试可以在客户控制的环境中进行，无需导出模型权重、训练数据或生产凭证。"
gtm:
  wedge: "在 OCS 演示或产品评估必须转化为集群拓扑决策时，向网络负责人销售一项由买方主导、付费的生产前调试验证项目。"
  channels:
    - "创始人主导直销，面向美国 AI 云服务商的网络和集群基础设施负责人，在生产拓扑获批前接洽。"
    - "通过 OCS 供应商的评估项目获得明确披露的转介，但不接受供应商资助的成功费，也不签排他协议。"
    - "与客户认可的网络集成商和 AI 训练平台团队合作，获取测试权限、挑选工作负载并获得部署支持。"
    - "参与 Open Compute Project，了解接口和遥测；在出现符合条件的买家前，不把标准组织参与视为获客渠道。"
  funnelTargets: "规划假设，并非历史转化数据：从 20 家具名 ICP 账户中，争取 8 场需求访谈、4 项已确认预算负责人和工作负载的合格评估、2 份范围明确的方案，以及 1 个付费试点；前 2 个付费项目中至少争取 1 个复购或第二集群项目。"
  pricing: "由买方支付固定项目费，规划区间为 $250k-$500k；该区间取自研究中的市场测算情景，并非公开报价或已验证的付费意愿。只有净回收的加速器小时数超过买方批准的门槛时，才收取设有上限的成功费；每小时价值须由买方和财务团队在测试前商定。客户经济性和效果归因得到验证前，不设每小时费率。"
businessModel:
  revenueStreams:
    - "为工作负载筛查、试验设计、调试验证和证据包收取固定费用。"
    - "对超过预先约定条件和门槛、可重复验证的净回收加速器小时数，收取设有上限的成功费。"
    - "买方更换集群、供应商、固件或生产拓扑时，收取重复验证费用。"
  unitOfValue: "在指定客户工作负载中，扣除重配置和双方约定的运营开销后，经核实净回收的加速器小时数；初期按付费项目计费。"
  targetGrossMarginPct: 60
  expansionLevers:
    - "首位客户认可测量协议后，在更多集群或站点重复验证。"
    - "复用测试工具、控制条件和报告模板，提高项目吞吐量，但不复用客户敏感数据。"
    - "只有在仍能保证测试权限和中立性的前提下，才提供跨供应商验收项目。"
strategyMap:
  northStarMetric: "每个付费项目净回收、且经买方认可的加速器小时数；扣除实测重配置开销，并符合可靠性护栏。"
  inputMetrics:
    - "已确认的合格账户数：有正在进行的 OCS 决策、明确的预算发起人、可重复工作负载和约定的测试窗口。"
    - "试点中预先登记基线、软件条件稳定、遥测可用且完成重复运行的比例。"
    - "已完成项目中，达到买方预先约定的净收益和可靠性门槛的比例。"
    - "试点转复购或第二集群项目的比例，以及从首次会面到付费立项所需的时间。"
    - "扣除工程人力、测试权限和差旅成本后的项目毛利率。"
  moatsToBuild:
    - "一套可信、可独立复现的成对运行协议，明确规定重配置、故障和效果归因方式。"
    - "一套经客户同意、去标识化的工作负载阶段适配性和实测开销资料库；在客户允许复用前，这项护城河仍是假设。"
    - "跨供应商的公信力和实操集成经验，而非依赖某一家交换机 API 的专有技术。"
  killCriteria:
    - "如果 10 位合格买家访谈中，不足 3 位表示未来 12 个月内有正在进行的 OCS 评估、明确的预算负责人和合适工作负载，就暂停滩头市场拓展，不得提前招聘。"
    - "接触 20 家合格账户后，如果截至第9个月仍没有买家签署付费调试验证项目，就冻结扩张招聘，并重新评估这项服务是否有独立预算。"
    - "如果两家独立买家的三次受控试验都未达到双方约定的最低收益，且买方认为暂定的端到端任务耗时缩短 5% 在经济上不划算，就停止围绕回收加速器时间来定位产品。"
    - "如果超过三分之一的已完成试点无法就结果计算达成一致或复现计算结果，就取消成功费，并在继续前测试固定收费的验收服务。"
    - "如果到第12个月仍无法获得客户批准的分组交换基线，以及至少两个独立 OCS 平台的访问权限，就停止宣称厂商中立，并重新评估这项服务。"
  mermaid: |
    flowchart LR
      Trigger[Pre-production OCS decision] --> Campaign[Paid paired workload commissioning]
      Campaign --> Proof[Net accelerator-hours after overhead]
      Proof --> Repeat[Repeat cluster or supplier qualification]
      Repeat --> Protocol[Reusable protocol and consented benchmark evidence]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "判断信心偏低至中等：测量痛点和结果付费设计都说得通，但买方是否愿意付费、服务是否独特、节省能否重复实现，仍未得到验证。"
    whyBelieve: "OCS 供应商的评估平台、已报道的部署和试验，以及工作负载调度研究，都指向一个现实的验证问题；买方主导的成对测试可以直接回答。"
    whyDoubt: "大型运营方可以内部开发，OEMs 可以捆绑评估服务，分组交换仍是默认选择；研究未发现独立调试验证的付费案例，也未发现买方接受的成功费指标。"
    nextDiligence: "访谈 10 家具名的美国运营方，确认预算负责人和正在进行的评估，并争取一份付费试点方案，预先约定两项任务的测试协议和结果公式。"
  firstCustomer:
    title: "正在评估 OCS 是否适用于多机架训练 Pod 的美国 AI 云网络基础设施负责人"
    profile: "一家 AI 云服务商，拥有可重复的多机架训练工作负载和分组网络基线；生产拓扑获批前，正在考虑 OCS 产品或评估平台。"
    trigger: "运营方必须决定是否从交换机演示或实验室评估进入生产网络设计，并需要了解计入重配置成本后，自家任务的实际表现。"
    buyer: "基础设施或网络工程副总裁"
    initialContract: "假设：开展一项为期 8-16 周、由买方控制的调试验证项目，固定费用折算为 $250k-$500k，取自研究中的市场测算情景；只有买方验收并确认结果后，才收取设有上限的成功费。报告获认可后，转为付费复验项目。"
  mustBeTrue:
    - "前 10 位合格的美国买家访谈中，至少 3 位确认正在评估 OCS、有明确的预算负责人和符合条件的可重复工作负载。"
    - "至少有一位买家愿意为独立项目付费，而不是依赖免费的 OEM 评估或内部工程团队。"
    - "至少两项客户任务的重复成对试验，在扣除重配置开销后仍显示净收益，并超过买方书面规定的经济性和可靠性门槛。"
    - "至少有一位买家接受事先约定的加速器小时数公式——包括基线、排除项、可重复性门槛和争议处理流程——并将其用于部分费用计算。"
    - "第二家独立运营方或供应商能够复现该协议，而不依赖首位客户的机密数据。"
  diligenceQuestions:
    - "哪些具名的美国运营方正在评估 OCS、设有生产决策日期，并有预算负责人为独立验证付费？"
    - "哪些工作负载和集群条件能预示光路保持时间足够长，可抵消重配置和调度器开销？"
    - "买家会支付固定调试验证费、接受设有上限的成功费，还是坚持由供应商出资或内部测试？"
    - "公司能否获得可比的分组与光路配置、高保真遥测和安全回滚权限，同时不触碰受保护的工作负载？"
    - "对买家而言，什么结果才有实质经济价值？财务和网络团队能否分别复现回收的加速器小时数？"
    - "OEM 现场团队或集成商能否免费提供同等的中立验收服务？若能，公司还有哪些独特价值？"
operatingAssumptions:
  - assumption: "首位买家拥有可重复的训练任务，通信阶段稳定，并允许开展匹配的分组交换和光路交换试验。"
    basis: "idea.yaml"
    validationTest: "与两家目标运营方审阅匿名任务轨迹，并在投入工程时间前，取得书面确认：客户可控制沙盒、基线、运行窗口和允许采集的遥测。"
    decisionImpact: "如果工作负载不规律或访问权限被拒，就缩小范围，转为部署前轨迹筛查，或放弃 OCS 结果服务的商业论点。"
  - assumption: "即使客户有内部网络团队且供应商提供评估支持，买方仍会向独立服务商付费。"
    basis: "research.yaml"
    validationTest: "访谈 10 位合格买家，确认预算科目和采购路径，并取得签署的付费项目范围；不能把一般兴趣或没有预算保障的 LOI（意向书）当作验证。"
    decisionImpact: "如果买方不愿付费，就不要扩充交付团队；应测试固定收费的验收服务能否获得预算，或停止业务。"
  - assumption: "研究用作测算依据的单项目 $250k-$500k 区间可作为固定费用规划参考，但尚非已验证价格。"
    basis: "research.yaml"
    validationTest: "向至少五位预算负责人提供明确范围、报价及替代方案；记录异议、采购上限和获批的试点金额。"
    decisionImpact: "如果可接受价格远低于交付成本，就缩小项目范围和团队规模，或放弃该市场；不能靠未经证实的成功费上行空间来弥补差额。"
  - assumption: "客户财务和网络负责人能就可重复的净回收加速器小时数指标及结果付费条款达成一致。"
    basis: "运营方判断"
    validationTest: "试验前取得买方批准，确认任务耗时基线、运行控制、排除项、最低收益、置信规则、估值依据、费用上限和争议处理流程。"
    decisionImpact: "如果效果归因有争议，就默认采用固定收费的调试验证；只有后续买方接受该协议时，才保留成功费。"
  - assumption: "公司可以以厂商中立的身份持续获得评估硬件访问权限，避免依赖单一供应商。"
    basis: "research.yaml"
    validationTest: "向两家 OCS 供应商和一家客户认可的集成商取得书面访问及技术支持条款，并披露合作关系、不接受供应商资助的结果费。"
    decisionImpact: "如果访问权限只来自一家供应商，或取决于测试结果有利，就披露限制、不再宣称中立，并重新评估客户是否仍看重这项服务。"
experimentRoadmap:
  - horizon: "0-90 天"
    experiment: "访谈 10 位具名美国 AI 云服务商的网络和集群负责人，梳理正在进行的 OCS 决策、经济决策者、替代方案、采购关卡和测试窗口。"
    hypothesis: "有一小群可识别的买家正面临生产前决策，并愿意为独立验证付费。"
    successMetric: "至少 3 位受访者符合正在评估 OCS、有预算负责人和合适工作负载这三项标准；取得一份买方认可的后续项目范围。"
    owner: "CEO / 商业创始人"
  - horizon: "0-90 天"
    experiment: "与一位潜在买家共同设计测量合同和安全边界，明确成对运行控制、加速器小时数定义、数据处理方式及故障/回滚规则。"
    hypothesis: "网络、训练、安全和财务团队可以预先约定一项可审计的结果，且无需导出受保护的数据。"
    successMetric: "取得一份适用于沙盒评估的书面协议，其中包括买方批准的收益门槛和指定审批人。"
    owner: "CTO / 网络性能创始人"
  - horizon: "3-6 个月"
    experiment: "筛查经客户授权的工作负载或轨迹数据，寻找稳定通信阶段；随后使用可用评估硬件开展有限的成对试验。"
    hypothesis: "至少有一项代表性工作负载可匹配到保持时间长于实测重配置成本的光路。"
    successMetric: "针对两项任务完成重复运行，并同步采集任务和网络遥测；报告净结果和置信度，即使没有任务通过也照实报告。"
    owner: "AI 集群性能工程师"
  - horizon: "3-9 个月"
    experiment: "推出范围固定的付费试点；只有超过预先约定门槛且未触及上限时才收取成功费。不得用免费演示代替付费意愿证据。"
    hypothesis: "买方愿意出资进行中立验证，以降低生产拓扑风险。"
    successMetric: "至少签下一份付费项目，明确预算负责人、客户控制的访问权限、验收条件和付款条款。"
    owner: "CEO / 商业创始人"
  - horizon: "6-12 个月"
    experiment: "在第二家 OCS 供应商平台或第二家独立运营方处复做获批测试；技术条件允许时，保持分组网络基线和测量指标不变。"
    hypothesis: "这套方法对单一 OEM 的评估流程之外也有用，并且不依赖供应商专有数据。"
    successMetric: "完成一次独立复现，记录差异、完成原始数据审阅，并取得买方对报告的认可。"
    owner: "CTO / 网络性能创始人"
  - horizon: "12-18 个月"
    experiment: "通过明确披露的集成商或供应商转介，测试复购项目或第二集群验证；同时确保买方付款和厂商中立。"
    hypothesis: "技术上成功的评估可以转化为重复付费项目，并借助合作伙伴获客而不损害独立性。"
    successMetric: "至少拿下一项复购或第二集群付费项目，并测算交付毛利；否则保持创始人主导的小团队。"
    owner: "CEO / 商业创始人"
operations:
  - "试验须在客户控制的环境中进行；尽量少采集数据，记录访问情况，约定留存和删除方式，并确保公司不接触模型权重、训练数据或生产凭证。"
  - "书面预先登记工作负载、软件和拓扑版本、基线、运行顺序、测量窗口、故障、护栏及结果计算方法；只有买方授权后才能留存原始证据。"
  - "任何生产集群变更前，都必须有回滚方案、变更管理审批，并尽可能安排金丝雀测试或非生产窗口，且取得可靠性团队签字。"
  - "从供应商或获批集成商处获取评估设备和接口；在宣传厂商中立前，至少争取两个 OCS 平台和一个客户认可的分组网络基线。"
  - "披露转介和商业关系；任何结果挂钩测试都由买方而非交换机供应商付款。"
  - "准备供应商来源、固件访问和供应链文档供买方审阅；NIST 指引可作为背景参考，但不代表 OCS 认证，也不是普遍的商业要求。"
team:
  - role: "创始工程师"
    startTiming: "第 0 个月"
    rationale: "创始团队中的光网络工程师必须设计测试工具链、验证接口和遥测，并带领首批试验；不需要先开发完整控制器。"
  - role: "CEO / 企业级 GTM 创始人"
    startTiming: "第 0 个月"
    rationale: "负责具名账户需求探索、买方采购、付费项目范围谈判和利益冲突披露；不能把需求验证外包出去。"
  - role: "AI 集群性能工程师"
    startTiming: "第 3-6 个月，须以试点获得资金为前提"
    rationale: "分析训练阶段、加速器利用率和网络事件之间的关系；只有取得客户工作负载访问权限且付费项目落实后才招聘。"
  - role: "解决方案与可靠性工程师"
    startTiming: "第 9-12 个月，须以出现复购需求为前提"
    rationale: "首个可重复项目完成后，标准化客户部署、回滚、安全文档和报告交付；达到这一关口前，先使用集成商或承包商。"
milestones:
  - horizon: "0-12 个月"
    items:
      - "截至第3个月，完成 10 位合格买家访谈，并确认至少 3 项正在进行、且有预算负责人和合适工作负载的评估；否则暂停招聘。"
      - "截至第6个月，取得客户批准的访问权限和书面成对运行协议，并从 OCS 供应商或获批集成商处落实测试设备访问。"
      - "截至第9个月，至少签下一个付费试点；若未做到，应重设预算和市场假设，而不能把潜在销售机会当成已确定收入。"
      - "截至第12个月，至少针对两项任务完成重复测试，并交付买方认可的报告，披露净结果、开销、故障和局限。"
  - horizon: "12-24 个月"
    items:
      - "在第二家独立买家或第二家 OCS 供应商处复现协议，并维持相同的效果归因标准。"
      - "取得一项复购或第二集群付费项目，并证明复用方法能减少交付工作量，同时不降低测试质量。"
      - "只有在测出项目毛利和复购需求后，才决定是否自动化项目工具。"
  - horizon: "24-36 个月"
    items:
      - "如果至少两家独立客户复购，且服务达到毛利目标，就与合格渠道伙伴建立可重复的多站点调试验证服务。"
      - "如果 OCS 需求仍有限，或买方团队能自行执行该协议，就停止扩张；只有取得独立客户证据后，才测试相邻的网络验证用例。"
risks:
  - risk: "目标工作负载并非网络瓶颈，或通信阶段太短、太不规律，无法摊平光路重配置成本。"
    likelihood: "High"
    impact: "High"
    mitigation: "部署前筛查轨迹，实测建链耗时，只验证适合的阶段，并如实报告负面结果，不为收取成功费而强行报喜。"
  - risk: "工作负载波动、软件变更或遥测缺口让收益难以归因，也难以复现。"
    likelihood: "High"
    impact: "High"
    mitigation: "预先登记控制条件，重复开展成对运行，记录任务和网络版本，留存获准的原始证据，并要求买方事先批准门槛。"
  - risk: "企业采购、安全审查和生产变更管理可能让付费试验拖到初期资金跑道耗尽之后。"
    likelihood: "High"
    impact: "High"
    mitigation: "在开展技术工作前就让安全和采购团队参与；采用范围明确、由客户控制的沙盒；压低固定成本，并以付费访问权限作为招聘前提。"
  - risk: "供应商或集成商可能免费捆绑评估服务，客户也可能在内部完成验证。"
    likelihood: "High"
    impact: "High"
    mitigation: "只在中立性对买方有价值的场景销售独立验收和买方掌握的证据；扩充团队前，先验证预算和付费项目范围。"
  - risk: "少数 OCS 供应商掌握可信试验所需的硬件、固件和接口。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "争取与两家供应商合作，尽可能使用开放接口，并记录单一供应商造成的限制，不宣称广泛兼容。"
  - risk: "敏感工作负载或供应链访问要求可能阻止外部团队参与。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "在买方环境内作业，尽量减少导出的遥测，明确删除和访问控制；申请轨迹前完成客户针对供应商的审查。"
  - risk: "估算的服务市场可能太小，或项目过于零散，无法支撑风险投资级增长。"
    likelihood: "High"
    impact: "High"
    mitigation: "把市场规模视为情景估算，核实具名账户数量和复购频率；在复购证明服务可重复之前，不进入相邻市场。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2-3M"
  runwayMonths: 18
  useOfFundsSummary: "规划融资需求，并非已核算成本的招聘计划：资金支持 18 个月运营，组建精干、由创始人主导的工程和商务团队，落实评估硬件和测试权限，完成客户控制的付费试验，开发最精简的测量与报告工具，并承担安全、法律和采购工作。资金不用于制造交换机、开发广泛的控制平面，也不会在付费需求和可重复的工作负载级验证出现前推动扩张。"
