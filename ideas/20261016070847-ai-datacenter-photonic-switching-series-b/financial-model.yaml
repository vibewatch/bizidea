unitEconomics:
  arpuAnnualK: 300.0
  grossMarginPct: 60.0
  cacK: 227.0
  monthlyChurnPct: 4.17
  avgCustomerLifeMonths: 24.0
  ltvK: 360.0
  ltvCacRatio: 1.59
  cacPaybackMonths: 15.13
  notes: >-
    Campaign-based planning proxies, not SaaS metrics: annual ARPU is one $300K campaign per buyer-year;
    LTV is annual ARPU x 60% gross margin x 24 months / 12; CAC is $681K of modeled three-year
    sales-and-marketing expense divided by three forecast first-time accounts; monthly churn is the
    reciprocal of the assumed 24-month relationship life. None is observed, and repeat frequency is unproven.
fundingAsk:
  round: pre-seed
  amountM: 2.0
  runwayMonths: 24
  milestone: "By month 18, complete a paid campaign with repeatable buyer-accepted workload results and secure one repeat or second-buyer campaign, while preserving six months of no-revenue operating buffer."
  minimumModeledNeedM: 1.1795
  gatedReserveAboveMinimumM: 0.8205
  runwayBasis: "The 24 months denote the planned 18-month founder-led validation phase plus a six-month buffer; the base cash schedule remains positive through month 36, so this is a financing window rather than predicted cash exhaustion."
  useOfFunds:
    - bucket: Engineering and delivery
      amountUsd: 1000000
      percentage: 50.0
    - bucket: GTM
      amountUsd: 250000
      percentage: 12.5
    - bucket: "G&A"
      amountUsd: 200000
      percentage: 10.0
    - bucket: "Buffer (6 mo)"
      amountUsd: 550000
      percentage: 27.5
