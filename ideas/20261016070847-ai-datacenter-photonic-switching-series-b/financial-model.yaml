slug: "verified-accelerator-hours"
date: "2026-10-16"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: Forecast start
    value: "2026-11"
    unit: YYYY-MM
    source: "Management planning convention: first forecast month is the month after the business-plan date; no historical period is represented."
  - id: A2
    name: Opening customers and traction
    value: "0"
    unit: customers
    source: "[business-plan.yaml executiveSummary and investorMemo; research.yaml coverageGap] No paid customer, contract, customer-level savings result, or traction is claimed."
  - id: A3
    name: Fixed commissioning campaign fee
    value: "300"
    unit: USD K per campaign
    source: "[business-plan.yaml gtm.pricing and research.yaml market.bottomUpSizingDrivers] Planning point inside the $250K-$500K hypothetical campaign range; not a public price, quote, or validated willingness-to-pay."
  - id: A4
    name: Campaign delivery term
    value: "4"
    unit: months
    source: "[business-plan.yaml investorMemo.firstCustomer.initialContract] Uses the upper end of the stated 8-16 week planning interval; contract duration is unvalidated."
  - id: A5
    name: Fixed-fee revenue recognition
    value: "75"
    unit: USD K per active campaign month
    source: "Calculated as A3 divided evenly over A4 months; straight-line recognition is a planning convention, not a customer billing schedule."
  - id: A6
    name: Base paid campaign schedule
    value: "6 campaigns: Y1 M9; Y2 M13 and M19; Y3 M25, M29, and M33"
    unit: campaigns by start month
    source: "[business-plan.yaml milestones, gtm.funnelTargets, market.som; research.yaml market.som] Forecast targets derived from the month-9 pilot gate and estimated 2-3-customer near-term SOM; not pipeline, signed work, or a conversion-rate claim."
  - id: A7
    name: Modeled first-time customer accounts
    value: "3 total: M9, M13, and M29"
    unit: new logos
    source: "[business-plan.yaml milestones and sequencingRationale; research.yaml market.som] Planning path to three distinct accounts by Y3, the high end of the estimated near-term SOM; no accounts are represented as secured."
  - id: A8
    name: Repeat campaign bookings
    value: "3 repeat campaigns"
    unit: campaigns
    source: "[business-plan.yaml businessModel.expansionLevers and milestones] Assumes repeat or second-cluster work after proof; repeat demand is unvalidated and is not customer traction."
  - id: A9
    name: Base measured-outcome fee
    value: "0"
    unit: USD K per campaign
    source: "[business-plan.yaml operatingAssumptions and gtm.pricing; research.yaml coverageGap] Excluded from base revenue until a buyer accepts an outcome formula and a gain is independently verified."
  - id: A10
    name: Illustrative upside outcome-fee cap
    value: "30"
    unit: USD K per verified campaign
    source: "Management sensitivity only: 10% of A3, capped and conditional on buyer-accepted net benefit; no public rate, signed fee, conversion rate, or savings amount is assumed."
  - id: A11
    name: Target gross margin
    value: "60"
    unit: percent
    source: "[business-plan.yaml businessModel.targetGrossMarginPct] Plan target; not a measured delivery margin."
  - id: A12
    name: Delivery payroll allocation
    value: "20"
    unit: percent of revenue
    source: "Internal startup-finance planning heuristic, calibrated with the business plan's 60% target margin; modeled delivery payroll allocation, not timesheet evidence."
  - id: A13
    name: Other direct campaign costs
    value: "20"
    unit: percent of revenue
    source: "Internal startup-finance planning heuristic for test access, travel, and campaign-specific contractors; no vendor quotes or customer-specific costs were found."
  - id: A14
    name: Founding engineer loaded annual payroll
    value: "150"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] Internal startup-finance planning estimate including employer burden; no external compensation survey was used."
  - id: A15
    name: CEO and enterprise-GTM founder loaded annual payroll
    value: "135"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] Internal founder-led cash-compensation planning estimate including employer burden; no external compensation survey was used."
  - id: A16
    name: AI cluster performance engineer loaded annual payroll
    value: "165"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] Internal startup-finance planning estimate including employer burden; no external compensation survey was used."
  - id: A17
    name: Solutions and reliability engineer loaded annual payroll
    value: "155"
    unit: USD K per FTE-year
    source: "[business-plan.yaml team] Internal startup-finance planning estimate including employer burden; no external compensation survey was used."
  - id: A18
    name: Hiring gates and timing
    value: "Founders M1; cluster engineer M9 after first paid scope; solutions/reliability engineer M19 after repeat demand"
    unit: hiring schedule
    source: "[business-plan.yaml team, sequencingRationale, operatingAssumptions, and milestones] Conservative gated schedule; no dedicated sales hire is planned in the 3-year base case."
  - id: A19
    name: Non-payroll sales and marketing spend
    value: "M1-M6 4/month; M7-M12 6/month; Y2 8/month; Y3 10/month"
    unit: USD K per month
    source: "Internal startup-finance planning estimate for founder-led account discovery, travel, and proposal work; no CAC or conversion benchmark is asserted."
  - id: A20
    name: Non-payroll R&D and test-harness spend
    value: "M1-M8 15/month; M9-M12 18/month; Y2 15/month; Y3 18/month"
    unit: USD K per month
    source: "[business-plan.yaml product, operations, and fundingAsk] Internal planning estimate for tooling, secure test access, and reusable measurement workflow; not a hardware quote."
  - id: A21
    name: Non-payroll general and administrative spend
    value: "Y1 10/month; Y2 12/month; Y3 15/month"
    unit: USD K per month
    source: "[business-plan.yaml operations and fundingAsk] Internal startup-finance planning estimate for legal, security, insurance, procurement, and accounting; no customer-specific compliance certification is assumed."
  - id: A22
    name: Opening cash and initial financing
    value: "0 opening cash; 2000 financing in M1"
    unit: USD K
    source: "[business-plan.yaml fundingAsk] Uses the low end of the provisional $2M-$3M target range; financing is a modeled raise, not a commitment."
  - id: A23
    name: Cash collection and payment timing
    value: "Same month as revenue and expense recognition"
    unit: timing convention
    source: "Startup-finance cash-planning heuristic; no receivable/payable lag, taxes, interest, capex, or other financing is modeled, so the working-capital profile may be optimistic."
  - id: A24
    name: Six-month no-revenue operating buffer
    value: "512.5"
    unit: USD K
    source: "Calculated from M19-M24 base payroll and non-payroll operating costs with zero revenue and no variable COGS; the resulting buffer is rounded up to the $550K funding-use allocation."
  - id: A25
    name: Base modeled customer lifetime
    value: "24"
    unit: months
    source: "[business-plan.yaml businessModel.expansionLevers and research.yaml market.sam] Planning proxy for an episodic buyer with an initial campaign and repeat qualification; retention is not observed."
  - id: A26
    name: Unit-economics campaign cadence
    value: "1"
    unit: campaign per account-year
    source: "[research.yaml market.sam and market.som; business-plan.yaml businessModel] Planning unit for annualized account revenue; campaigns are episodic and not subscription ARR."
  - id: A27
    name: CAC calculation population
    value: "3 new logos and 6 campaign bookings over 3 years"
    unit: modeled customers and campaigns
    source: "Calculated from A6-A8 and the base-case S&M expense schedule; this is an unvalidated forecast proxy, not historical customer-acquisition data."
  - id: A28
    name: Downside campaign and hiring path
    value: "No Y1 campaign; one starts M19 in Y2; two start M25 and M31 in Y3; hire cluster engineer M19; no solutions/reliability hire"
    unit: downside scenario
    source: "[business-plan.yaml killCriteria, sequencingRationale, and team] Delayed paid work and hiring freeze are a downside scenario, not a forecast of signed work."
  - id: A29
    name: Funding-use allocation
    value: "Engineering 1000; GTM 250; G&A 200; six-month buffer 550"
    unit: USD K
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary] Internal budget allocation totaling the modeled $2M ask; categories include gated reserves and are not vendor quotes."
modelBasis:
  sourcedFacts:
    - "The business plan states a hypothetical $250K-$500K fixed-equivalent campaign range, a 60% target gross margin, and a provisional $2M-$3M ask for an 18-month founder-led phase."
    - "The business plan's sales-funnel counts are planning hypotheses; it reports no paid contracts or validated customer outcomes."
    - "Research estimates a $0.5M-$1.5M annual near-term service SOM from 2-3 customers and one campaign per customer, explicitly excluding uncertain outcome fees."
    - "Research found no public service price, paid independent commissioning contract, customer workload savings, or accepted accelerator-hour success-fee formula."
  forecastDefinitions:
    - "customersEop is active paying campaign-customer equivalents, not cumulative unique logos; newCustomers counts first-time logos and newCampaigns also includes repeat work."
    - "Y1 monthly revenue equals active campaign-customer equivalents times the $75K monthly campaign ARPU; quarterly revenue equals average active campaign-customer equivalents times $225K quarterly ARPU."
    - "Base fixed-fee revenue is recognized evenly over four months; the measured-outcome fee is zero in the base case and appears only in the conditional upside scenario."
    - "Loaded payroll is computed from role FTE and A14-A18; salaryK equals salaryInCogsK plus salaryInOpexK, and salaryInOpexK is included in functional operating expenses."
    - "COGS includes A12 delivery payroll and A13 other direct costs; gross profit equals revenue less COGS, OPEX equals sales and marketing plus R&D plus G&A, and EBITDA equals gross profit less OPEX."
    - "Cash rolls from opening cash plus financing and same-month customer receipts less COGS and OPEX; this simplifying convention excludes taxes, interest, capex, and working-capital timing."
  fundingCalculation: >-
    Base net cash burn through M18 is $667K. A further six months at the post-hire M19-M24
    no-revenue cost base is $512.5K, implying approximately $1.18M of modeled minimum
    milestone-plus-buffer capital. The $2.0M ask uses the plan's low-end target and retains
    the difference as a gated reserve for access, security, procurement, and collection delays;
    the reserve is not represented as committed spend.
