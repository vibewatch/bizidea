  downside:
    description: "Paid work slips beyond the plan's month-9 gate, the team freezes the second engineer until a later paid campaign, and no outcome fees or solutions hire are assumed."
    y3RevenueK: 600.0
    y3EbitdaK: -486.0
    cashLowPointK: 309.5
    keyAssumptionChanges:
      - "No paid campaign in Y1; one campaign begins M19 in Y2 and two begin in Y3."
      - "Cluster performance engineer starts only when the delayed campaign is funded; solutions and reliability hiring is deferred beyond the model."
      - "Campaign fee remains the $300K planning value and measured-outcome fees remain zero."
  base:
    description: "One paid fixed-fee campaign in Y1, two in Y2, and three in Y3, with three modeled first-time accounts and repeat campaigns; outcome fees are excluded."
    y3RevenueK: 900.0
    y3EbitdaK: -401.0
    cashLowPointK: 659.5
    keyAssumptionChanges:
      - "Campaigns start in M9, M13, M19, M25, M29, and M33 at $300K each, recognized over four months."
      - "Three modeled first-time accounts and three repeat campaigns are targets, not secured work or a conversion forecast."
      - "The 60% target gross margin is implemented as 20% delivery payroll and 20% other direct costs."
      - "No measured-outcome fee is recognized before a buyer-approved result is verified."
  upside:
    description: "Base campaign volume and staffing hold, while all three Y3 campaigns meet their buyer-approved outcome thresholds and earn the illustrative capped fee."
    y3RevenueK: 990.0
    y3EbitdaK: -347.0
    cashLowPointK: 713.5
    keyAssumptionChanges:
      - "Each of the three Y3 campaigns earns the conditional $30K measured-outcome fee cap; this is not a success-rate estimate or savings claim."
      - "Base fixed campaign fees, hiring schedule, and other operating expenses remain unchanged."
