modelDiagram:
  title: "unit economics flow"
  mermaid: |
    flowchart LR
      ICP[Qualified operator] --> Campaign[Paid commissioning campaign]
      Campaign --> FixedFee[Fixed pilot fee]
      Campaign --> Evidence[Buyer-approved paired workload evidence]
      Evidence --> OutcomeFee[Capped measured-outcome fee if verified]
      FixedFee --> GrossProfit[Gross profit after delivery cost]
      OutcomeFee --> GrossProfit
      GrossProfit --> Cash[Cash after operating expenses]
modelSanity:
  - checkName: Revenue engine
    finding: "The base books one four-month $300K fixed-fee campaign in Y1, two in Y2, and three in Y3; measured-outcome fees add no base revenue until a buyer-approved gain is verified."
  - checkName: Must go right
    finding: "The model requires three modeled first-time accounts and repeat campaign bookings at the $300K planning fee, reaching $900K Y3 revenue near the top of the estimated $0.5M-$1.5M annual near-term SOM."
  - checkName: Model breaks if
    finding: "If the paid pilot slips and repeats fail, the downside's two Y3 campaigns yield $600K revenue and a $309.5K cash low point, with no outcome-fee cushion."
  - checkName: Next-round proof
    finding: "By month 18, demonstrate repeatable buyer-accepted net workload gains after reconfiguration, a repeat or second-buyer paid campaign, and measured delivery margin near the 60% plan target."
sanityChecks:
  ruleOf40: "Y3 revenue growth 50.0% plus EBITDA margin -44.6% equals 5.4%, well below 40%; growth starts from a small project base."
  burnMultiple: "1.34x proxy = $401K Y3 EBITDA burn / $300K incremental Y3 revenue; not a SaaS net-burn multiple because revenue is episodic services."
  revenuePerFte: "$225K Y3 revenue per year-end FTE = $900K / 4 FTE; campaign revenue is not recurring ARR."
  flags:
    - "There are no validated customers, signed scopes, public prices, buyer-accepted success-fee terms, or independently measured savings; all campaign counts and fees are forecast assumptions."
    - "Base Y3 campaign volume reaches three campaigns and three cumulative modeled accounts, near the high end of the estimated 2-3-account SOM; the underlying service market is an unverified scenario."
    - "The 60% gross margin target depends on allocating 20% of revenue to delivery payroll and 20% to other direct costs; actual labor intensity, access costs, and utilization could materially reduce margin."
    - "Campaign-based LTV/CAC is only 1.59x with a 15.13-month modeled payback and assumes repeat work over a 24-month relationship; neither retention nor acquisition economics has been observed."
    - "The $2M raise exceeds the approximately $1.18M base milestone-plus-buffer minimum; the excess is gated contingency for access, procurement, security, and cash-collection risk, not a validated spending requirement."
    - "Cash collection is assumed in the revenue month and the model excludes taxes, interest, capex, and working-capital lags; the cash balance is therefore sensitive to delayed enterprise payments."
