  - point: "Recent scheduling papers explicitly model reconfiguration cost and workload timing, supporting the proposed measurement problem while leaving real-customer performance uplift unverified."
    sourceRefs:
      - 5
      - 6
openQuestions:
  - "Which U.S. AI-cloud operators have an active OCS evaluation, a repeatable training workload, and a budget owner for independent commissioning?"
  - "Will buyers accept a success-fee metric based on accelerator-hours, or do they require a fixed-fee acceptance test and broader reliability criteria?"
  - "How large and repeatable are net job-time gains on real customer workloads after reconfiguration, failed runs, integration, and operational overhead?"
  - "Can the service access matched packet and optical configurations, workload scheduling metadata, and sufficiently accurate telemetry without exposing protected data?"
  - "Will OCS vendors provide neutral access to evaluation hardware and interfaces, or will they bundle enough engineering to make a separate provider unnecessary?"
  - "What practical minimum circuit hold time, cluster scale, port count, and scheduling integration make a workload eligible?"
