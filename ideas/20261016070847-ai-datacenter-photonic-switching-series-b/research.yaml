regulatoryTechnicalConstraints:
  - point: >-
      NIST SP 800-161 recommends organization-wide cybersecurity supply-chain risk management across acquisition,
      deployment, maintenance, and end of life. Buyers may require vendor provenance, firmware, access, and
      supplier-risk documentation; the guidance is not an OCS-specific certification.
    sourceRefs:
      - 14
      - 19
  - point: >-
      NIST's July 2026 AI-data-center workshop describes standards and security work in progress. The fetched
      page is a workshop notice, not a binding technical standard or a rule that an optical switch must meet.
    sourceRefs:
      - 15
  - point: >-
      FedRAMP's marketplace is for authorized cloud services and recognized assessors. Federal-cloud or defense
      workloads may add procurement and access controls, but FedRAMP should not be represented as a universal
      approval needed for commercial OCS trials.
    sourceRefs:
      - 16
  - point: >-
      OCP's OCS subproject is working on open interfaces, SDN integration, telemetry, and interoperability.
      Buyers still need to verify vendor API maturity, telemetry fidelity, rollback behavior, and compatibility
      with their own network-change process.
    sourceRefs:
      - 4
  - point: >-
      The reviewed public vendor material did not disclose a standard price or a common procurement specification
      for a buyer-side success-fee service. Site-specific acceptance thresholds, performance attribution, and
      liability allocation remain contract and procurement questions.
    sourceRefs:
      - 1
      - 3
      - 11
      - 13
