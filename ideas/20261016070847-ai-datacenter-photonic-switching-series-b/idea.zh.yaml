problem: "AI 集群运营方未必知道光电路交换能否提升自家训练任务的表现：报道所说的瓶颈在于加速器间通信，但实际收益取决于流量模式和光路重配置时间。在证明计入重配置开销和集成工作后，任务耗时仍能改善之前，他们可能就要承诺采用新的网络设计。现有证据没有报告具名客户部署、商业结果或按工作负载统计的验证指标。"
targetUser:
  primary: "美国 AI 云服务商中负责网络性能和集群基础设施的主管，他们正在评估面向多机架加速器训练负载的光电路交换。"
  secondary: "能够提供代表性工作负载并批准受控网络测试的 AI 训练平台团队。"
  buyer: "AI 云服务商的基础设施或网络工程副总裁。"
startupThesis:
  nonObviousInsight: "商业验证的关键不只是端口数或信号延迟，而是客户稳定通信阶段回收的加速器时间，能否超过光路重配置所耗的时间；不适配的流量仍可走分组交换网络。"
  beachhead: "一家美国 AI 算力运营商：拥有多机架加速器集群，正在评估光交换，并有可重复运行的训练任务，可在经批准的分组网络基线上反复运行。"
  wedge: "开展收费且与供应商无关的调试验证，在同一批客户工作负载上配对测试分组网络和光网络，计入重配置开销；只有可重复回收加速器小时，才收取效果费。"
  whyNowCatalyst: "Salience Labs 获得的 $125 million B 轮融资将用于加快部署、扩大制造规模并拓展美国市场；行业报道还提到 64-port 演示和计划推出的更高端口数产品，同时指出产品仍需适配验证。"
  ventureScalePath: "将调试验证和结果付费合同复制到更多 AI 集群，沉淀可复用的工作负载适配与验证流程；再把同一套实测性能收费模式用于其他能将配置变更与算力时间回收挂钩的数据中心网络升级。"
solution: "针对一个多机架集群，团队先与买方约定有代表性的训练任务、基线拓扑、固定的工作负载和软件条件、测量窗口，以及最低值得采用的性能提升门槛。随后，团队在分组网络基线和光电路配置下反复开展配对测试，记录任务完成时间，并扣除实测重配置开销。团队只建议在可重复通信阶段使用光电路，且这些阶段的有效保持时间必须超过实测的电路配置耗时；不适合的流量仍走分组网络。固定调试费覆盖测试设计；只有多次测试均达到约定门槛，才按回收的加速器小时收取效果费。公司使用客户批准的测试环境和现有交换机供应商，不自行制造网络硬件。"
goToMarketSeed:
  firstCustomer: "一家美国 AI 云服务商，拥有多机架加速器集群和可重复运行的训练任务，并且正评估光电路交换，尚未敲定生产网络设计。"
  buyingTrigger: "网络团队正在把光交换演示或更高端口数产品与现有分组网络设计作比较，需要在正式采购前完成针对具体工作负载的验证。"
  currentAlternative: "依靠内部网络工程团队、供应商演示、分组网络基准测试，以及针对具体站点开展的集成和适配验证。"
  switchingReason: "运营方能先约定测试条件，再反复对比并计入重配置开销；只有光网络配置能带来可测量的加速器时间回收，才需支付效果费。"
  pricingHypothesis: "按集群收取固定调试验证费，另对超过约定门槛、经核实回收的每个加速器小时收取效果费。"
