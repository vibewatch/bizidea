differentiator: "交换机制造商卖硬件，网络集成商卖设计服务；本项目则给出经过实测、针对具体客户的答案：扣除重配置开销后，光电路能否回收有用的加速器时间。它直接测试真实工作负载，不适配的流量继续走分组交换；不会把名义端口数、信号延迟或通用网络仪表盘当成价值证明。"
