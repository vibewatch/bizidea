jobsToBeDone:
  - job: "当我决定是否为多机架训练集群验证光电路交换时，帮我在计入重配置开销后，用有代表性的任务将它与分组网络基线作比较；这样我只会在它确实能回收可测量的加速器时间时采用。"
    currentAlternative: "依靠内部网络设计工作、供应商演示，以及分开进行的集成和适配测试。"
    successMetric: "在不突破事先约定的任务完成时间和网络可靠性约束的前提下，可重复回收的净加速器小时数。"
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "这个想法把光交换从硬件或名义带宽销售，变成一项调试服务；扣除重配置开销后，服务商按经验证回收的加速器时间收取部分费用。历史想法中，没有一个按这种工作负载层面的网络结果收费。"
  venturePotential:
    score: 4
    rationale: "反复开展集群调试验证并签订结果付费合同，有望发展成有规模的专业服务业务，也可拓展到其他数据中心网络变更；但初期市场狭窄，服务交付投入较重。"
  whiteSpace:
    score: 4
    rationale: "历史索引中没有光网络性能服务，也没有按回收加速器时间收费的合同；不过，光通信领域的现有厂商和其他光子公司都构成真实的竞争压力。"
  painIntensity:
    score: 4
    rationale: "来源证据指出，加速器通信延迟可能限制系统级 AI 性能，但未提及具名客户部署，也未量化工作负载层面的损失。"
  wedgeClarity:
    score: 4
    rationale: "首单范围明确：在一个多机架集群上进行配对测试，并约定分组网络基线；但测试访问权、结果可复现性以及买方对效果指标的接受度，仍有待验证。"
  evidenceFit:
    score: 4
    rationale: "融资、报道中的演示和产品路线图、通信延迟的技术依据，以及重配置和适配验证方面的限制，共同支撑了时机判断和测试机制；但这些证据不能证明客户需求或付费意愿。"
topRisks:
  - name: "性能归因不稳定"
    description: "工作负载波动，或软件与集群条件发生变化，可能让加速器时间收益难以复现，也难以归因于光网络。"
    mitigation: "事先约定固定运行条件和基线，重复开展配对测试，保留原始测量数据，并且只有超过保守置信门槛才支付效果费。"
  - name: "重配置抵消收益"
    description: "对于突发流量或较短的通信阶段，光电路设置开销可能超过路径带来的收益。"
    mitigation: "先测量重配置时间，只验证保持时间足够长的阶段，不适配的流量继续走分组网络。"
  - name: "验证和采购周期长"
    description: "生产网络变更需要针对站点开展设计、集成和审批，而现有来源未提及任何商业客户部署。"
    mitigation: "先用范围受限、由客户控制的测试集群和供应商演示硬件，明确固定验收流程；在证据过关前，不承诺投入生产。"
