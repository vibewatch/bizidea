slug: "verified-accelerator-hours"
date: "2026-10-16"
executiveSummary: >-
  The company would provide vendor-neutral commissioning to determine whether optical circuit switching (OCS)
  improves real multi-rack AI training jobs after circuit reconfiguration and operating overhead. The first buyer
  is a U.S. AI-cloud operator deciding whether to qualify OCS for a repeatable training workload before committing
  a production cluster topology; network engineering is the user and a VP of infrastructure or network engineering
  is the likely economic buyer. A paid campaign would compare repeated, controlled packet and optical runs, leave
  unsuitable traffic on packet switching, and tie an agreed portion of fees to verified net accelerator-hours
  recovered. Research supports a timely evaluation window: Salience Labs announced a $125 million Series B and
  described a 64-port demonstration and future higher-port products, while other research reports OCS trials and
  deployments; none verifies demand for this service or customer-level savings. OCS is workload-dependent, and
  Google-scale internal engineering, supplier-bundled evaluations, and the existing packet fabric are credible
  substitutes. The researched $5M-$40M annual global service TAM, $2.5M-$10M U.S. SAM, and $0.5M-$1.5M near-term
  SOM are scenario estimates based on assumed buyer counts, campaign frequency, and hypothetical fees, not observed
  spending. The proposed differentiation is a customer-owned evidence protocol and outcome contract, not unique
  scheduling technology or a proven moat. A pre-seed plan should fund a small engineering-led team, paid-pilot
  validation, and reusable commissioning methods; no customer traction, accepted success-fee formula, or proven
  savings are claimed.
problem:
  - "Operators evaluating OCS lack independent evidence that their own training jobs gain end-to-end time after reconfiguration, setup, and operational overhead."
  - "Vendor demonstrations and port-count specifications do not establish workload fit, repeatability, or safe packet-network coexistence."
  - "Workload variance, software changes, and telemetry gaps can make performance attribution disputed and undermine an outcome-linked contract."
  - "Large operators may build qualification internally, while OCS suppliers and integrators can bundle evaluation work; an independent service budget is unverified."
solution:
  - "Agree with the buyer on representative repeatable jobs, a packet-network baseline, fixed software and cluster conditions, run order, guardrails, and an accelerator-hour formula before testing."
  - "Run repeated paired packet and optical trials in a buyer-controlled environment; record job completion, failures, reconfiguration time, and other agreed overhead."
  - "Recommend circuits only for phases whose useful hold time exceeds measured setup cost, and retain packet switching for traffic that does not fit."
  - "Deliver a reproducible evidence package and charge a fixed commissioning fee plus a capped success fee only for gains above the pre-agreed threshold."
whyWeWin:
  - "The buyer, not the switch supplier, owns the baseline, acceptance criteria, and evidence used to make the production decision."
  - "The protocol measures workload-level outcome after reconfiguration overhead instead of treating optical latency, bandwidth, or port count as proof of value."
  - "The company will not make hardware, control all traffic, or claim universal OCS benefit; this keeps the first engagement narrower than a network redesign."
  - "The contract wrapper appears uncommon in reviewed public supplier materials, but internal engineering and OEM field teams can reproduce parts of it; defensibility must be earned through trusted attribution and repeatable results."
strategicChoices:
  beachhead: "One U.S. AI-cloud or large AI-compute operator with a multi-rack accelerator pod, an active OCS evaluation, and repeatable training jobs before its production topology is committed."
  wedgeRationale: "A pre-production qualification decision has a defined buyer, test window, and alternative packet baseline. Starting with a single pod and a small set of repeatable jobs limits integration scope and can test workload fit before capital or production change-control commitments; broad network optimization would dilute the proof."
  sequencingRationale: "First validate buyer budget, workload access, and measurement acceptance; then secure evaluation hardware and run a paid paired trial; only after one repeatable result should the team hire field capacity, automate the evidence workflow, and pursue a second operator or supplier. This sequence avoids building a platform or scaling services before willingness to pay and attribution are demonstrated."
  notYet:
    - "Do not manufacture OCS hardware or compete with Salience Labs, Polatis, or Calient on switch specifications."
    - "Do not build a general-purpose SDN controller, GPU-fabric dashboard, or broad network-operations platform."
    - "Do not target hyperscalers that already operate mature in-house OCS stacks as the default first account."
    - "Do not enter federal/defense workloads, international markets, or adjacent network-qualification categories until buyer-specific security and repeatability requirements are known."
market:
  tam: "$5M-$40M annual global service revenue scenario, not observed demand: research assumes 20-40 eligible operators, 1-2 campaigns per year, and $250k-$500k per campaign."
  sam: "$2.5M-$10M annual U.S. service revenue scenario, not a measured account list: research assumes 10-20 qualifying operators and one campaign per year at $250k-$500k."
  som: "$0.5M-$1.5M annual near-term scenario, not a forecast: research assumes 2-3 U.S. customers and one $250k-$500k campaign each; outcome fees and repeat-cluster expansion are excluded."
  segments:
    - "Primary: U.S. AI-cloud providers with multi-rack accelerator-training clusters, repeatable jobs, and an active pre-production OCS evaluation."
    - "Secondary: large AI compute operators whose network and training-platform teams can authorize controlled trials and provide a packet baseline."
  buyingProcess: "The network-performance or cluster-infrastructure lead scopes the evaluation and supplies workload and telemetry access; the likely budget sponsor is a VP of infrastructure, network engineering, or AI-cloud operations. Security, reliability, workload owners, and procurement can veto a trial; the sales cycle and service budget are not documented in the research, so an assumption of a multi-month enterprise process must be tested."
product:
  mvp: "A fixed-scope commissioning campaign with a customer-approved run protocol, limited trace and telemetry capture, paired packet-versus-optical measurement, reconfiguration accounting, and a reproducible acceptance report. No production control-plane product or network hardware is required for v1."
  sixMonth: "Target: complete an initial paid or explicitly buyer-funded evaluation on one cluster and at least two repeatable jobs, with buyer-agreed controls and a written result; do not claim savings unless the acceptance threshold is met."
  twelveMonth: "Target: repeat the method on a second independent operator or a second supplier platform, document where workload fit fails as well as where it passes, and standardize the evidence package and contract metric."
  twentyFourMonth: "If two independent buyers validate the method and a repeat purchase, automate test setup, run correlation, and report generation; otherwise remain a small fixed-fee qualification practice or stop rather than broaden prematurely."
  keyBets:
    - "A subset of multi-rack training jobs has stable communication phases long enough to amortize real OCS reconfiguration and control overhead."
    - "Buyers will pay for neutral qualification even when suppliers offer evaluation hardware or engineering support."
    - "A buyer will accept an accelerator-hour outcome metric when formula, baseline, exclusions, confidence threshold, and dispute process are agreed in advance."
    - "The test can be run in a customer-controlled environment without exporting model weights, training data, or production credentials."
gtm:
  wedge: "Sell a paid, buyer-owned pre-production commissioning campaign to the network leader at the moment an OCS demonstration or product evaluation must be translated into a cluster topology decision."
  channels:
    - "Founder-led direct account sales to U.S. AI-cloud network and cluster-infrastructure leaders ahead of production topology approval."
    - "Disclosed referrals through OCS vendors' evaluation programs, without vendor-funded success fees or exclusivity."
    - "Customer-approved network integrators and AI training-platform teams for test access, workload selection, and deployment support."
    - "Open Compute Project participation for interface and telemetry learning; do not treat standards participation as a lead channel until qualified buyers appear."
  funnelTargets: "Planning hypothesis, not historical conversion: from 20 named ICP accounts, secure 8 discovery meetings, 4 qualified evaluations with an identified budget owner and workload, 2 scoped proposals, and 1 paid pilot; seek at least 1 repeat or second-cluster engagement from the first 2 paid campaigns."
  pricing: "Buyer-paid fixed campaign fee with a planning range of $250k-$500k, taken from the research sizing scenario rather than a public quote or validated willingness-to-pay. Add a capped success fee only for net accelerator-hours above a buyer-approved threshold, valued at a rate the buyer and finance team agree before testing; no per-hour rate is set until customer economics and attribution are validated."
businessModel:
  revenueStreams:
    - "Fixed fee for workload screening, trial design, commissioning, and evidence package."
    - "Capped success fee on repeatable net accelerator-hours recovered above pre-agreed conditions and thresholds."
    - "Repeat qualification fees when a buyer changes cluster, supplier, firmware, or production topology."
  unitOfValue: "Verified net accelerator-hours recovered on a named customer workload after reconfiguration and agreed operating overhead; the paid campaign is the initial billing unit."
  targetGrossMarginPct: 60
  expansionLevers:
    - "Repeat qualification across pods or sites after the first customer accepts the measurement protocol."
    - "Increase campaign throughput by reusing test harnesses, controls, and report templates without reusing customer-sensitive data."
    - "Offer cross-supplier acceptance campaigns only when access and neutrality can be maintained."
strategyMap:
  northStarMetric: "Buyer-accepted net accelerator-hours recovered per paid campaign, after measured reconfiguration overhead and within reliability guardrails."
  inputMetrics:
    - "Qualified accounts with an active OCS decision, named budget sponsor, repeatable workload, and an agreed test window."
    - "Share of pilots with pre-registered baselines, stable software conditions, usable telemetry, and completed repeated runs."
    - "Share of completed campaigns meeting the buyer's pre-agreed net-benefit and reliability thresholds."
    - "Pilot-to-repeat or second-cluster conversion and time from first meeting to paid scope."
    - "Campaign delivery gross margin after engineering labor, test access, and travel."
  moatsToBuild:
    - "A trusted, independently reproducible paired-run protocol with explicit reconfiguration, failure, and attribution rules."
    - "A consented, de-identified library of workload-phase fit and measured overhead across independent clusters; this moat is hypothetical until customers permit reuse."
    - "Cross-vendor credibility and practical integration knowledge, not proprietary dependence on one switch API."
  killCriteria:
    - "If fewer than 3 of 10 qualified buyer interviews identify an active OCS evaluation with a budget owner and workload in the next 12 months, pause the beachhead and do not hire ahead of demand."
    - "If no buyer signs a paid commissioning scope by month 9 after 20 qualified account approaches, freeze expansion hiring and reassess whether the service has a distinct budget."
    - "If three controlled trials across two independent buyers fail to meet their agreed minimum benefit, and a provisional 5% end-to-end job-time gain is rejected as uneconomic by buyers, stop positioning the offer around recovered accelerator time."
    - "If more than one-third of completed pilots cannot agree on or reproduce the outcome calculation, remove the success fee and test fixed-fee acceptance work before continuing."
    - "If the company cannot obtain customer-approved access to a packet baseline and at least two independent OCS platforms by month 12, stop claiming vendor neutrality and reassess the service."
  mermaid: |
    flowchart LR
      Trigger[Pre-production OCS decision] --> Campaign[Paid paired workload commissioning]
      Campaign --> Proof[Net accelerator-hours after overhead]
      Proof --> Repeat[Repeat cluster or supplier qualification]
      Repeat --> Protocol[Reusable protocol and consented benchmark evidence]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low-to-moderate conviction: the measurement problem and contract wrapper are plausible, but paid buyer demand, uniqueness, and repeatable savings remain unverified."
    whyBelieve: "OCS supplier evaluation platforms, reported deployments and trials, and workload-scheduling research create a real qualification question that a buyer-side paired test could answer."
    whyDoubt: "The largest operators can build internally, OEMs can bundle evaluation, packet networking remains the default, and research found no paid independent commissioning reference or accepted success-fee metric."
    nextDiligence: "Interview 10 named U.S. operators, identify budget owners and active evaluations, and obtain a paid pilot scope with a pre-agreed two-job protocol and outcome formula."
  firstCustomer:
    title: "U.S. AI-cloud network infrastructure lead evaluating OCS for a multi-rack training pod"
    profile: "An AI-cloud operator with a repeatable multi-rack training workload, a packet-network baseline, and an OCS product or evaluation platform under consideration before production topology approval."
    trigger: "The operator must decide whether to advance from a switch demonstration or lab evaluation to a production network design and needs evidence on its own jobs after reconfiguration cost."
    buyer: "VP of infrastructure or network engineering"
    initialContract: "Assumption: an 8-16 week buyer-controlled commissioning campaign with a $250k-$500k fixed-equivalent fee from the research sizing scenario, plus a capped success fee only after buyer-accepted verification; convert to paid repeat qualification after an accepted report."
  mustBeTrue:
    - "At least 3 of the first 10 qualified U.S. buyer interviews identify an active OCS evaluation, a named budget owner, and an eligible repeatable workload."
    - "At least one buyer pays for an independent campaign rather than relying on free OEM evaluation or internal engineering."
    - "On at least two customer jobs, repeated paired trials show net improvement after reconfiguration overhead that clears the buyer's written economic and reliability thresholds."
    - "A buyer accepts a pre-agreed accelerator-hour formula, including baseline, exclusions, repeatability threshold, and dispute process, for at least part of the fee."
    - "A second independent operator or supplier can reproduce the protocol without relying on confidential data from the first customer."
  diligenceQuestions:
    - "Which named U.S. operators have a live OCS evaluation, a production decision date, and a budget owner for independent qualification?"
    - "What workload and cluster conditions predict circuit hold times long enough to offset reconfiguration and scheduler overhead?"
    - "Will buyers pay a fixed commissioning fee, accept a capped success fee, or insist on vendor-funded or internal testing?"
    - "Can the company obtain comparable packet and optical configurations, high-fidelity telemetry, and safe rollback access without touching protected workloads?"
    - "What result is economically material to the buyer, and can finance and network teams independently reproduce accelerator-hours recovered?"
    - "Can OEM field teams or integrators provide equivalent neutral acceptance work at no incremental cost, and what remains distinct?"
operatingAssumptions:
  - assumption: "The initial buyer has repeatable training jobs with stable communication phases and permission to run matched packet and optical trials."
    basis: "idea.yaml"
    validationTest: "Review anonymized job traces with two target operators and obtain written confirmation of a customer-controlled sandbox, baseline, run window, and allowed telemetry before committing engineering time."
    decisionImpact: "If workloads are irregular or access is denied, narrow to pre-deployment trace screening or stop the OCS outcome-service thesis."
  - assumption: "A buyer will pay an independent provider despite internal network teams and supplier evaluation support."
    basis: "research.yaml"
    validationTest: "Conduct 10 qualified buyer interviews, identify budget line and procurement route, and secure a signed paid scope rather than treating interest or an LOI without budget as proof."
    decisionImpact: "If buyers will not pay, do not scale delivery headcount; test whether fixed-fee acceptance work is fundable or discontinue."
  - assumption: "The research's $250k-$500k per-campaign sizing input is a plausible fixed-fee planning range, not a validated price."
    basis: "research.yaml"
    validationTest: "Present a scoped price and alternatives to at least five budget owners; record objections, procurement ceilings, and approved pilot amount."
    decisionImpact: "If acceptable pricing is materially lower than delivery cost, reduce scope and staffing or reject the market rather than use unsupported success-fee upside to close the gap."
  - assumption: "Customer finance and network owners can agree on a repeatable net accelerator-hour metric and outcome-fee terms."
    basis: "operator judgment"
    validationTest: "Before a trial, have the buyer approve the job-time baseline, run controls, exclusions, minimum gain, confidence rule, valuation basis, cap, and dispute procedure."
    decisionImpact: "If attribution is disputed, default to fixed-fee commissioning and only retain the success fee if a later buyer accepts the protocol."
  - assumption: "The company can retain vendor-neutral access to evaluation hardware and avoid dependence on one supplier."
    basis: "research.yaml"
    validationTest: "Obtain written access and technical support terms from two OCS suppliers and one customer-approved integrator, with disclosure and no supplier-funded outcome fee."
    decisionImpact: "If access is single-vendor or contingent on favorable results, disclose limits, avoid neutrality claims, and reassess whether customers still value the work."
experimentRoadmap:
  - horizon: "0-90 days"
    experiment: "Interview 10 network and cluster leaders at named U.S. AI-cloud operators and map active OCS decisions, economic buyers, alternatives, procurement gates, and test windows."
    hypothesis: "A small but identifiable group has a live pre-production decision and considers independent qualification worth paying for."
    successMetric: "At least 3 interviews meet the active-evaluation, budget-owner, and eligible-workload criteria; obtain one buyer-approved next-step scope."
    owner: "CEO / commercial founder"
  - horizon: "0-90 days"
    experiment: "Co-design the measurement contract and security boundary with one prospective buyer, including paired run controls, accelerator-hour definition, data handling, and failure/rollback rules."
    hypothesis: "Network, training, security, and finance stakeholders can pre-agree on an auditable outcome without exporting protected data."
    successMetric: "One written protocol accepted for a sandbox evaluation, including a buyer-approved benefit threshold and named approver."
    owner: "CTO / network-performance founder"
  - horizon: "3-6 months"
    experiment: "Screen a customer-authorized workload or trace set for stable communication phases, then run a limited paired trial on available evaluation hardware."
    hypothesis: "At least one representative workload can be mapped to circuit hold times that exceed measured reconfiguration costs."
    successMetric: "Complete repeated runs for two jobs with synchronized job and network telemetry; report net outcome and confidence even if no job passes."
    owner: "AI cluster performance engineer"
  - horizon: "3-9 months"
    experiment: "Offer a fixed-scope paid pilot with a success fee only above a pre-agreed threshold and cap; do not substitute unpaid demonstrations for willingness-to-pay evidence."
    hypothesis: "A buyer will fund neutral qualification to reduce production topology risk."
    successMetric: "One signed paid scope with named budget owner, customer-controlled access, acceptance conditions, and payment terms."
    owner: "CEO / commercial founder"
  - horizon: "6-12 months"
    experiment: "Repeat the approved test on a second OCS supplier platform or independent operator with the packet baseline and metric held constant where technically possible."
    hypothesis: "The method is useful beyond one OEM's evaluation workflow and does not rely on vendor-specific data."
    successMetric: "One independent replication with documented differences, completed raw-data review, and buyer acceptance of the report."
    owner: "CTO / network-performance founder"
  - horizon: "12-18 months"
    experiment: "Test a repeat campaign or second-cluster qualification through a disclosed integrator or supplier referral while preserving buyer payment and vendor neutrality."
    hypothesis: "A technically successful evaluation can convert to repeat paid work and a partner-assisted channel without erasing independence."
    successMetric: "At least one repeat or second-cluster paid engagement and measured delivery margin; otherwise keep the team founder-led."
    owner: "CEO / commercial founder"
operations:
  - "Run trials in customer-controlled environments; minimize data collection, log access, agree retention and deletion, and keep model weights, training data, and production credentials out of company custody."
  - "Use a written pre-registration for workload, software and topology versions, baseline, run order, measurement windows, failures, guardrails, and outcome calculation; retain raw evidence only under buyer authorization."
  - "Require rollback plans, change-control approval, canary or non-production windows where possible, and reliability sign-off before any live-cluster change."
  - "Source evaluation devices and interfaces from suppliers or approved integrators; seek at least two OCS platforms and a customer-approved packet baseline before marketing the service as vendor-neutral."
  - "Disclose referrals and commercial relationships; accept payment from the buyer, not the switch vendor, for any outcome-linked test."
  - "Prepare supplier provenance, firmware access, and supply-chain documentation for buyer review; NIST guidance is relevant context, not an OCS certification or universal commercial requirement."
team:
  - role: "Founding eng"
    startTiming: "Month 0"
    rationale: "A founding optical/network engineer must design the test harness, validate interfaces and telemetry, and lead the first trials without building a full controller."
  - role: "CEO / enterprise GTM founder"
    startTiming: "Month 0"
    rationale: "Own named-account discovery, buyer procurement, paid scope negotiation, and conflict disclosures; do not outsource demand validation."
  - role: "AI cluster performance engineer"
    startTiming: "Month 3-6, contingent on a funded pilot"
    rationale: "Correlate training phases, accelerator utilization, and network events; hire only when customer workload access and paid work are secured."
  - role: "Solutions and reliability engineer"
    startTiming: "Month 9-12, contingent on repeat demand"
    rationale: "Standardize customer deployment, rollback, security documentation, and report delivery after the first repeatable campaign; use an integrator or contractor before that gate."
milestones:
  - horizon: "0-12 months"
    items:
      - "By month 3, complete 10 qualified buyer interviews and identify at least 3 active evaluations with a budget owner and eligible workload, or pause hiring."
      - "By month 6, secure customer-approved access, a written paired-run protocol, and test equipment access from an OCS supplier or approved integrator."
      - "By month 9, sign at least one paid pilot; failure to do so triggers a budget and market reset rather than an assumed pipeline."
      - "By month 12, complete repeated tests on at least two jobs and publish a buyer-accepted report with net outcomes, overhead, failures, and limitations."
  - horizon: "12-24 months"
    items:
      - "Replicate the protocol with a second independent buyer or OCS supplier, preserving the same attribution standard."
      - "Secure one repeat or second-cluster paid engagement and show that reusable methods reduce delivery effort without reducing test quality."
      - "Decide whether to automate campaign tooling only after campaign gross margin and repeat demand are measured."
  - horizon: "24-36 months"
    items:
      - "If at least two independent customers repeat and the service meets its margin target, establish a repeatable multi-site commissioning offer with qualified channel partners."
      - "If OCS demand remains limited or buyer teams self-serve the protocol, wind down expansion or test an adjacent network-qualification use case only with separate customer evidence."
risks:
  - risk: "Target workloads are not network-bound or their communication phases are too short or irregular to amortize circuit reconfiguration."
    likelihood: "High"
    impact: "High"
    mitigation: "Screen traces before deployment, measure actual setup cost, qualify only suitable phases, and report negative results rather than force a success fee."
  - risk: "Workload variance, software changes, or telemetry gaps make gains difficult to attribute and repeat."
    likelihood: "High"
    impact: "High"
    mitigation: "Pre-register controls, repeat paired runs, record job and network versions, preserve authorized raw evidence, and require buyer-approved thresholds."
  - risk: "Enterprise procurement, security, and production change-control delay a paid trial beyond the initial runway."
    likelihood: "High"
    impact: "High"
    mitigation: "Engage security and procurement before technical work, use a bounded customer-controlled sandbox, keep fixed costs low, and gate hiring on paid access."
  - risk: "Suppliers or integrators bundle evaluation at no additional cost, or customers build qualification internally."
    likelihood: "High"
    impact: "High"
    mitigation: "Sell independent acceptance and buyer-owned evidence only where neutrality matters; test budget and paid scope before expanding the team."
  - risk: "A small number of OCS suppliers control hardware, firmware, and interfaces needed for a credible trial."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Seek two supplier relationships, use open interfaces where available, and document any single-vendor limitation instead of claiming broad compatibility."
  - risk: "Sensitive workload or supply-chain access requirements block an external team."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Operate in the buyer's environment, minimize exported telemetry, define deletion and access controls, and complete customer-specific supplier review before requesting traces."
  - risk: "The estimated service market is too small or campaigns are too episodic to support venture-scale growth."
    likelihood: "High"
    impact: "High"
    mitigation: "Treat market sizing as a scenario, verify named account count and repeat frequency, and defer adjacent markets until repeat purchases establish a repeatable service."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2-3M"
  runwayMonths: 18
  useOfFundsSummary: "Planning ask, not a priced hiring plan: 18 months to support a small founder-led engineering and commercial team, secure evaluation hardware and test access, complete customer-controlled paid trials, build minimal measurement and report tooling, and cover security, legal, and procurement work. It does not fund switch manufacturing, a broad control plane, or expansion before paid demand and repeatable workload-level proof."
