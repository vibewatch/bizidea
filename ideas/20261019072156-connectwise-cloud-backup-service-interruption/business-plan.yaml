slug: provider-outage-restore-reserve
date: "2026-10-19"
executiveSummary: >-
  ConnectWise's October 2026 Cloud Backup suspension showed that preserved archives can still be unusable when a
  provider disables the identities that expose backup schedules, archives, and restores; the provider reported no
  confirmed restoration time and no indication that archives were compromised. The proposed business sells a
  separately administered Microsoft 365 restore reserve to MSPs that cannot demonstrate an independently tested
  recovery path for critical customer tenants. Its beachhead is MSPs affected by the suspension whose customer
  recovery commitments are exposed, with customer questions, post-incident reviews, renewals, or recovery-evidence
  requests acting as the buying trigger. The product combines a tenant-isolated copy, customer-authorized emergency
  access, scheduled restore drills, and a documented recovery window rather than claiming a novel backup primitive.
  The differentiated promise remains unproven: Veeam, Afi, Datto, Keepit, Microsoft, and MSP-operated copies cover
  overlapping backup and restore jobs, and no source establishes incremental willingness to pay for this reserve.
  The illustrative U.S. market scenarios are $243M TAM, $4.9M SAM, and $0.24M SOM, but depend on unverified MSP,
  tenant, seat, and eligibility assumptions and are not a revenue forecast. The first 18 months should resolve
  customer permissions and recovery fidelity, secure paid pilots, and measure service labor and storage economics
  before any workload expansion. A pre-seed plan is therefore a proof-and-stop/go investment, not a scale-up plan;
  direct paid-pilot demand and the number of affected MSPs without a usable second copy remain unknown.
problem:
  - >-
    A backup provider can suspend application access and leave scheduled jobs, archives, and restores unavailable
    even when there is no confirmed compromise of the stored archive.
  - >-
    MSPs retain customer recovery and tenant-check responsibilities, but may lack a separately reachable, rehearsed
    path that satisfies their recovery commitment.
solution:
  - >-
    Keep an independently administered, tenant-isolated encrypted copy of a customer-approved, narrowly scoped
    Microsoft 365 data set, with access and key custody separated from the incumbent backup provider.
  - >-
    Require customer-approved emergency authorization, run scheduled isolated restore drills, and report measured
    recovery results; do not promise a recovery window until the relevant objects and permissions pass repeatable
    tests.
  - >-
    Charge per protected tenant and tested recovery tier, with setup and scheduled-drill fees; qualify only tenants
    lacking another independently usable copy.
whyWeWin:
  - >-
    The incident validates the access-continuity failure mode: ConnectWise reported unavailable schedules, archive
    access, and restores without a confirmed restoration time, while its archives were not reported compromised.
  - >-
    A customer-triggered authorization path and repeatable restore evidence could make independence and recovery
    capacity contractible, if product evaluations show current alternatives do not already meet that need.
  - >-
    MSPs can distribute a tenant-level continuity commitment across their customer portfolios, but no source
    confirms channel access, reserve-specific demand, or a durable technical moat.
strategicChoices:
  beachhead: >-
    U.S. MSPs that used ConnectWise Cloud Backup for Microsoft 365, have one or more critical tenants without an
    independently tested restore route, and face customer recovery questions or an upcoming security or renewal
    review.
  wedgeRationale: >-
    Qualifying a few critical tenants creates a fast, falsifiable test of customer authorization, copy independence,
    restore fidelity, and paid demand. This is narrower than selling another general backup product, and avoids
    treating the incident as evidence that all affected MSPs lack a second copy. The deliberate cost is duplicated
    storage and deep tenant-level trust, which make early onboarding costly and hands-on; accept that burden only
    for pilots that can produce recovery proof.
  sequencingRationale: >-
    First resolve the actual Microsoft permissions, controller lifecycle, and restore path; then run paid pilots and
    measure recovery performance, customer approvals, and labor/storage cost. Standardize onboarding and drills
    before adding sales capacity or workloads, because the research identifies API throttling, broad-permission
    concerns, and hands-on service as adoption and margin risks.
  notYet:
    - "General-purpose Microsoft 365 backup or a broad enterprise launch."
    - "Other SaaS workloads, until Microsoft 365 recovery, demand, and unit economics are demonstrated."
    - "Compromise detection, tenant remediation, or a claim that ConnectWise archives were breached."
    - "A channel-led scale motion or regulatory-compliance guarantee before partner and legal requirements are verified."
market:
  tam: >-
    $243M/year illustrative U.S. category-equivalent spend floor, not a published market total: 2,698 directory
    providers × assumed 50 Microsoft 365 tenants per MSP × 50 seats per tenant × a $3/user/month conventional
    backup price proxy. The directory is not a census and this is not reserve revenue.
  sam: >-
    $4.9M/year illustrative U.S. scenario: assumes 10% of the 2,698 indexed MSPs (about 270) have relevant
    ConnectWise exposure and no tested independent route, with 10 qualifying tenants per MSP, 50 seats each, and
    the same $3/user/month category proxy. The eligibility and tenant assumptions are unverified.
  som: >-
    $0.24M/year illustrative early obtainable slice: about 14 MSPs (5% of the assumed 270 serviceable MSPs), each
    with 10 qualifying 50-seat tenants at the $3/user/month category proxy. This is a penetration scenario, not a
    forecast or commitment.
  segments:
    - "Primary: MSPs with affected ConnectWise Cloud Backup Microsoft 365 tenants and no independently tested second copy."
    - "Secondary: MSPs whose customer security or procurement reviews ask for restore evidence and whose current recovery route fails an independence test."
  buyingProcess: >-
    An MSP backup or service-delivery lead identifies uncovered tenants and presents the reserve to the MSP owner,
    COO, or service executive; customer tenant administrators and security leads approve data access and emergency
    authorization. Customer questions, incident reviews, renewal discussions, and evidence requests are plausible
    triggers, but the research does not establish a universal procurement or insurer mandate.
product:
  mvp: >-
    Build a tenant-scoped workflow for a customer-approved critical Microsoft 365 data set, independent encrypted
    storage, separated emergency authorization, isolated restore testing, and an auditable result report. Before
    production onboarding, prove the exact required permissions and API path; the idea's read-only onboarding premise
    is not yet reconciled with copying and restoring content.
  sixMonth: >-
    Complete a lab-tested permission and recovery design, then support two or more paid MSP pilots with a tightly
    defined object scope, customer-approved access, and measured restore windows; exclude any scope that fails
    repeatable fidelity or throughput tests.
  twelveMonth: >-
    Convert successful pilots to annual per-tenant contracts, standardize onboarding, DPA and deletion workflows,
    customer authorization, and drill evidence, and document actual storage, egress, support, and failed-drill costs.
  twentyFourMonth: >-
    If pilots renew and reliability and margin gates pass, extend coverage across additional validated Microsoft 365
    workloads and MSP portfolios; do not enter another SaaS category until the reserve is repeatable and current
    alternatives have been shown insufficient in customer evaluations.
  keyBets:
    - "Some affected MSPs lack another copy they have actually restored, rather than merely another backup subscription."
    - "Customers will approve a distinct least-privilege access and emergency-authorization design."
    - "Measured recovery evidence and reserved response capacity earn incremental spend over a conventional second provider."
    - "Repeatable drills can reduce labor enough to support a 70% target gross margin after pilot learning."
gtm:
  wedge: >-
    Directly qualify MSPs with ConnectWise Cloud Backup exposure and no independently tested route; sell a paid,
    limited-tenant restore reserve when customer recovery questions or a post-incident review make the gap actionable.
  channels:
    - "Founder-led outreach to MSP owners and service-delivery leads with affected Microsoft 365 tenants."
    - "Referrals from MSP security advisers and incident-response firms, after testing whether they will refer."
    - "Customer security reviews, renewal discussions, and procurement questionnaires that request checkable restore evidence; no universal mandate is assumed."
  funnelTargets: >-
    Planning target, not observed conversion: 30 named MSP prospects → 12 discovery interviews → 3 paid pilots;
    convert at least 50% of completed pilots to annual contracts by month 12. Reforecast after the first 20 qualified
    prospects.
  pricing: >-
    Annual per-tenant fee tiered by protected-seat/data scope and a demonstrated recovery window, plus initial setup
    and paid scheduled drills; scope incident-time support contractually. Use the researched $3/user/month conventional
    backup benchmark only as a comparison anchor. Test a $1.50–$3.00/protected-seat/month equivalent, not as proven
    reserve willingness to pay.
businessModel:
  revenueStreams:
    - "Annual subscription per protected tenant and tested recovery tier."
    - "One-time tenant setup and recovery-runbook fee."
    - "Paid scheduled restore drills and scoped emergency recovery support."
  unitOfValue: >-
    One tenant's agreed Microsoft 365 data set with a customer-approved, tested recovery route and a measured
    recovery window; charge by tenant tier with seat and storage bands to reflect delivery cost.
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add qualifying tenants within a contracted MSP portfolio after the first tenant passes its restore drill."
    - "Offer higher recovery tiers only after measured restore throughput supports the stated window."
    - "Add validated Microsoft 365 workloads after current scope renews and reaches repeatable delivery economics."
strategyMap:
  northStarMetric: "Active protected tenants whose latest scheduled isolated restore met the contracted recovery window in the quarter."
  inputMetrics:
    - "Qualified MSPs with no independently usable restore route."
    - "Median days from MSP qualification to customer-approved tenant onboarding."
    - "Share of scheduled tenant drills that meet the agreed recovery window."
    - "Paid-pilot-to-annual conversion and renewal by MSP cohort."
  moatsToBuild:
    - "Operational trust from customer-controlled authorization, tenant isolation, and auditable key and access procedures."
    - "Reusable, tested restore runbooks and measured recovery evidence across tenant configurations; this is an execution advantage, not an exclusive data moat."
    - "MSP customer relationships built through successful drills and clear responsibility boundaries."
  killCriteria:
    - "After 12 affected-MSP interviews, fewer than 4 lack a second copy they have actually restored or cannot identify a customer-facing recovery trigger."
    - "By month 6, fewer than 2 MSPs sign a paid pilot at or above a $1.50/protected-seat/month equivalent."
    - "By month 6, no customer-approved API path can provide an independent copy and restore without an unacceptable standing privilege or a blocking incumbent-controller transition."
    - "After 20 tenant restore drills, fewer than 95% of agreed critical test objects recover within each pilot's measured, contracted window."
    - "After 20 tenant onboardings, measured storage and delivery labor imply below 50% gross margin at the highest price buyers accept."
  mermaid: |
    flowchart LR
      Trigger[Provider lockout or recovery review] --> Qualify[MSP has no tested independent copy]
      Qualify --> Reserve[Customer-authorized M365 restore reserve]
      Reserve --> Drill[Scheduled isolated restore proof]
      Drill --> Contract[Annual per-tenant recovery tier]
      Contract --> Expand[Expand within proven MSP portfolio]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low-to-moderate: the outage validates access-path pain, but incremental willingness to pay and durable differentiation remain unproven."
    whyBelieve: >-
      ConnectWise reported that scheduled backups, archive access, and restores remained unavailable without a
      confirmed restoration time, while MSPs remained responsible for downstream customer checks.
    whyDoubt: >-
      Several established vendors and Microsoft already offer overlapping Microsoft 365 backup and recovery, and
      research found no paid-pilot evidence for an outage-only reserve premium.
    nextDiligence: >-
      Obtain two price-bearing paid pilots from MSPs that lack a second copy they have actually restored, then
      verify customer-approved isolated recovery within a contracted window.
  firstCustomer:
    title: "MSP service-delivery owner with affected ConnectWise Cloud Backup Microsoft 365 tenants"
    profile: >-
      A U.S. MSP managing several Microsoft 365 customer tenants through ConnectWise Cloud Backup, with critical
      tenants lacking an independently tested restore route and an existing customer recovery obligation.
    trigger: >-
      The interruption prompts customer questions or a post-incident review, or the MSP must provide restore
      evidence during renewal or a security/procurement review; those latter events are hypotheses, not proven mandates.
    buyer: "MSP owner, COO, or service-delivery executive; the customer tenant administrator is a separate access approver."
    initialContract: >-
      Pricing hypothesis: a paid 90-day pilot at $2,500–$5,000 for up to 10 critical tenants, converting to
      approximately $9,000–$18,000 annual for 10 tenants at 50 seats each and $1.50–$3.00 per seat/month equivalent.
      The range is anchored to conventional backup pricing, not evidence of reserve-specific willingness to pay; renew
      only after a customer-approved restore drill meets the agreed scope and window.
  mustBeTrue:
    - "At least 4 of the first 12 affected MSPs lack a second copy they have actually restored and can identify a customer-facing trigger."
    - "At least 2 of the first 20 qualified MSP prospects will sign a paid pilot at $1.50 or more per protected seat/month equivalent."
    - "Customer security approvers accept an independently administered copy and emergency authorization with a documented, acceptable permission set."
    - "The chosen Microsoft 365 path restores the agreed critical objects with at least 95% success inside measured pilot windows after repeated drills."
    - "At the price MSPs accept, measured storage, egress, setup, and recurring drill labor can support at least 50% gross margin at launch and a path to 70%."
  diligenceQuestions:
    - "Among affected ConnectWise MSPs interviewed, how many had a second provider-independent copy they could actually restore, and what customer loss or SLA exposure followed?"
    - "Will MSPs pay incrementally for this reserve, or do they prefer to switch to or add a conventional vendor such as Veeam, Afi, Datto, or Keepit?"
    - "Which Microsoft 365 API and permission path supports an independent copy and restore without displacing an existing backup controller or using unacceptable standing privileges?"
    - "Who owns emergency authorization, key custody, restore destination, and customer approval when the MSP and end customer disagree during an incident?"
    - "What are measured per-tenant storage, egress, onboarding, drill, and emergency-support costs at the pilot price?"
    - "Which MSP customer DPAs and regulated-sector requirements change data residency, subprocessors, deletion, or notification obligations?"
operatingAssumptions:
  - assumption: "At least 4 of 12 affected MSPs have no second copy they have actually restored and can name a near-term customer recovery trigger."
    basis: operator judgment
    validationTest: "Interview 12–15 affected MSPs and inspect redacted contracts, coverage inventories, restore logs, and customer communications."
    decisionImpact: "If false, drop the outage-specific beachhead and retest demand among MSPs with documented recovery-evidence requirements before building further."
  - assumption: "At least two MSPs will pay incrementally for a measured reserve rather than substitute a second conventional backup vendor."
    basis: research.yaml
    validationTest: "Offer a 90-day price-bearing pilot at $1.50–$3.00 per protected seat/month equivalent and require signed orders plus upfront payment."
    decisionImpact: "If buyers only switch vendors or refuse a paid pilot, stop the standalone reserve offer or reposition as an incumbent integration/service."
  - assumption: "A technically supportable Microsoft 365 copy-and-restore path can remain independent of the incumbent and meet customer-approved access controls."
    basis: research.yaml
    validationTest: "In a sandbox tenant, map every required permission, consent and controller transition; test copy, key isolation, object fidelity, throttling, and restore destinations with security review."
    decisionImpact: "If the path requires unacceptable standing privileges, controller takeover, or an unworkable transition, do not onboard production tenants."
  - assumption: "MSP customers will accept the service's tenant access, subprocessors, data location, retention, and emergency authorization after documented review."
    basis: research.yaml
    validationTest: "Run security and DPA review with at least three pilot customers; record objections, approval time, and any mandatory residency or key-custody controls."
    decisionImpact: "If approval blocks the pilot cohort, narrow the data scope or region and revise architecture before hiring for distribution."
  - assumption: "Repeatable onboarding and scheduled drills can support a 70% target gross margin after pilot learning."
    basis: operator judgment
    validationTest: "Track storage, transfer, setup hours, drill hours, failed restores, and support load per tenant through 20 onboardings and two drill cycles."
    decisionImpact: "If accepted pricing supports less than 50% margin after the first 20 onboardings, stop broadening sales and automate or narrow scope before scale."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Interview 12–15 affected MSPs and inspect redacted coverage, contract, and restore evidence for selected tenants."
    hypothesis: "A material share have no independently usable copy and face a customer-facing recovery trigger."
    successMetric: "At least 4 of 12 interviewees meet both conditions and identify a budget owner."
    owner: "Founder/CEO"
  - horizon: "0–90 days"
    experiment: "Prototype the Microsoft 365 copy and restore path in a sandbox; map consent, permissions, controller lifecycle, key custody, and Graph throttling."
    hypothesis: "A customer-approved path can operate independently without a permission or controller transition that defeats the reserve."
    successMetric: "Security-reviewed test plan restores the agreed object set twice, documents required scopes, and has no unresolved critical permission issue."
    owner: "Founding engineer"
  - horizon: "0–90 days"
    experiment: "Run scripted product evaluations of Veeam, Afi, Datto, Keepit, and Microsoft 365 Backup against the same customer authorization, disablement, export, and restore-evidence requirements."
    hypothesis: "A qualified subset of MSPs has a real gap not already met by a second conventional product."
    successMetric: "Record verified capability and permissions for all five alternatives; identify at least 3 interviewees whose current path fails a documented test."
    owner: "Founder/CEO with security adviser"
  - horizon: "3–6 months"
    experiment: "Offer a paid 90-day pilot to qualified MSPs for up to 10 critical tenants with explicit data scope, drill schedule, and emergency authorization."
    hypothesis: "At least two MSPs will pay an incremental fee for the reserve rather than wait or add another standard backup."
    successMetric: "Two signed and paid pilots at or above $1.50 per protected seat/month equivalent, with customer tenant approvals."
    owner: "Founder/CEO"
  - horizon: "3–9 months"
    experiment: "Run two scheduled isolated restore drills per pilot tenant and report results against the pre-agreed data scope and recovery window."
    hypothesis: "The service can repeatably recover the contracted critical objects under measured tenant-scale API limits."
    successMetric: "At least 95% of agreed test objects restore within each pilot window across 20 completed tenant-drill cycles; record exceptions."
    owner: "Founding engineer and recovery operations lead"
  - horizon: "6–12 months"
    experiment: "Test founder-led MSP outreach against referrals from security advisers and incident-response firms, while tracking evidence requests in renewals and procurement reviews."
    hypothesis: "Trust-based MSP channels produce qualified prospects when the absence of a tested second route is documented."
    successMetric: "At least 3 qualified referrals and 1 paid pilot from a non-founder referral source; do not scale the channel if it misses."
    owner: "Founder/CEO"
  - horizon: "9–18 months"
    experiment: "Automate onboarding, drill evidence, and deletion/return workflows while measuring fully loaded per-tenant delivery cost."
    hypothesis: "Repeatable service operations can reach the target margin without weakening tenant isolation or restore quality."
    successMetric: "After 20 tenant onboardings, demonstrate a measured path above 50% gross margin and document the automation required to reach 70%."
    owner: "Founding engineer and recovery operations lead"
operations:
  - "Require a customer-approved tenant access checklist and least-privilege review; do not describe grants as read-only until copying and restoring are technically proven with those permissions."
  - "Separate tenant data, encryption keys, application identities, and customer emergency authorization; maintain revocation and access audit trails."
  - "Use scheduled isolated restore drills with a fixed test dataset, agreed destination, measured elapsed time, object-level success report, and documented exception process."
  - "Track Microsoft Graph throttling, storage and transfer costs, retention, support hours, and restore failures by tenant before offering a recovery tier."
  - "Have privacy counsel review tenant DPAs, subprocessors, residency, incident notification, and data return/deletion; no partner or regulatory approval is assumed."
team:
  - role: "Founding engineer"
    startTiming: "Month 0"
    rationale: "Own Microsoft 365 API feasibility, secure tenant isolation, key and identity design, restore fidelity, and pilot instrumentation."
  - role: "Founder/CEO"
    startTiming: "Month 0"
    rationale: "Qualify affected MSPs, sell price-bearing pilots, secure customer approvals, and test the trigger and channel rather than hiring sales before proof."
  - role: "Fractional security and privacy counsel"
    startTiming: "Month 0"
    rationale: "Review permissions, threat model, DPAs, subprocessors, data handling, and customer security objections before production onboarding."
  - role: "Recovery operations lead"
    startTiming: "Month 6–9, only after two paid pilots"
    rationale: "Own onboarding, scheduled drills, incident runbooks, and measured delivery costs; defer the hire if pilot repeatability or demand is weak."
milestones:
  - horizon: "0–12 months"
    items:
      - "By day 90, complete 12–15 affected-MSP interviews, competitive restore-path evaluations, and a security-reviewed Microsoft 365 permission and API design."
      - "By month 6, secure at least two paid pilots with customer-approved tenant access and an agreed critical-data scope."
      - "By month 12, complete two restore drills per pilot tenant, target at least 95% of agreed test objects inside measured windows, and convert at least half of completed pilots to annual contracts."
      - "Establish actual per-tenant storage, egress, onboarding, drill, and support costs before committing to gross-margin or expansion claims."
  - horizon: "12–24 months"
    items:
      - "Reach 10 paying MSPs and 100 protected tenants only if pilots renew and the qualified U.S. cohort validates the assumed serviceable market."
      - "Automate tenant onboarding, authorization records, drill evidence, and deletion/return workflows; show a measured path above 50% gross margin."
      - "Add Microsoft 365 workloads only after their permissions, object fidelity, throughput, and repeat restore behavior pass the same release gate."
  - horizon: "24–36 months"
    items:
      - "Scale within MSP portfolios and referral channels that show repeatable paid conversion and renewal; do not infer channel efficiency from early referrals."
      - "Evaluate adjacent SaaS workloads only after at least 100 tenants have sustained successful drills and the existing M365 offer supports the 70% gross-margin target."
      - "Reassess the market using observed MSP eligibility, tenants, seats, accepted pricing, and incumbent capability instead of the initial scenario assumptions."
risks:
  - risk: "Established providers or an MSP's existing second copy already meet the independence and restore-evidence need, making the reserve redundant."
    likelihood: High
    impact: High
    mitigation: "Qualify only after hands-on evaluation of the customer's current route and the major alternatives; require paid pilots rather than expressions of interest."
  - risk: "Customers reject another privileged identity or separate copy because of tenant-wide permissions, key custody, or data-processing obligations."
    likelihood: High
    impact: High
    mitigation: "Map least-privilege scopes, separate authorization and keys, make revocation auditable, complete customer security and DPA reviews, and stop if permissions remain unacceptable."
  - risk: "Microsoft API limits, controller lifecycle, or object-level fidelity prevents an independent restore inside the promised window."
    likelihood: Medium
    impact: High
    mitigation: "Test controller transitions and Graph throttling in sandbox tenants, scope the MVP to validated objects, and contract only for windows repeatedly demonstrated."
  - risk: "Duplicated storage, transfer, onboarding, and scheduled drills produce weak gross margins or a service-heavy bottleneck."
    likelihood: High
    impact: High
    mitigation: "Measure fully loaded cost per tenant, charge setup and drills, automate repeated evidence and runbooks, and pause expansion below the 50% launch-margin gate."
  - risk: "The ConnectWise interruption is a concentrated buying trigger that fades when incumbent access returns or MSPs resume service."
    likelihood: Medium
    impact: High
    mitigation: "Test renewal, customer security-review, and recovery-evidence triggers separately; do not scale unless paid pilots convert beyond the incident window."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$1.5–2.5M"
  runwayMonths: 18
  useOfFundsSummary: >-
    Provisional operator target pending the financial model: 18 months to validate the Microsoft 365 permission and
    restore path, build a narrowly scoped secure product, run paid MSP pilots, cover fractional security/privacy
    review and pilot storage/operations, and measure conversion and unit economics. It funds a proof-and-stop/go
    decision; it does not fund broad SaaS expansion or a scaled sales team.
