modelDiagram:
  title: MSP 恢复保障储备服务的单位经济模型
  mermaid: |
    flowchart LR
      Leads[Qualified MSP leads] --> Pilots[Paid tenant pilots]
      Pilots --> MSPs[Paying MSP accounts]
      MSPs --> Tenants[Protected tenants and restore drills]
      Tenants --> Revenue[Subscription setup and drill revenue]
      Revenue --> GrossProfit[Gross profit after delivery labor and cloud]
      GrossProfit --> Cash[Cash after operating costs and financing]
modelSanity:
  - checkName: 收入引擎
    finding: "基准情景下，Y1 有 3 家 MSP、单家 ARPU 为 $10K；Y2 增至 10 家、ARPU 为 $15K；Y3 达到 14 家、ARPU 为 $18K，带来 $216K 的 Y3 收入。"
  - checkName: 关键前提
    finding: "试点转化和客户导入自动化必须把 Y3 毛利率推至 66.8%；验证通过后，还要完成有条件启动的 Q3Y2 $2.0M 种子轮融资。"
  - checkName: 模型失效条件
    finding: "销售延迟两个季度，会使 Y3 收入减少约 $72K、融资前模型现金减少 $64.8K；若未达到种子轮门槛，下行情景现金最低点将接近负 $96K。"
  - checkName: 下一轮融资验证门槛
    finding: "$1.5M 种子前轮融资可支撑 18 个月，用于验证权限、签下付费试点、证明恢复保真度至少达到 95%、推动已完成试点中的一半转化，并测出毛利率超过 50% 的路径。"
sanityChecks:
  ruleOf40: "Y3 收入增速 135.1% + EBITDA 利润率 -353.5% = -218.4%；以当前收入基数看，这一指标不能作为规模化阶段 SaaS 效率的信号。"
  burnMultiple: "Y2 为 5.7x（$684K EBITDA 现金消耗 / $120K 净新增 ARR），Y3 为 7.5x（$764K / $102K）；两个年度的成本基础都远超收入，公司尚未进入规模化阶段。"
  revenuePerFte: "Q4Y3 的 5 名 FTE 在 Y3 人均贡献 $43K 收入，低于规模化 SaaS 团队 $200K-$400K 的方向性基准。"
  flags:
    - "Y3 收入仅为 $216K，对照示例性的 $240K SOM 类别支出情景仍偏低；14 家 MSP 的上限和客户对恢复储备服务的专项付费意愿都尚未验证。"
    - "Y3 毛利率为 66.8%，低于 BP 70% 的目标；客户导入流程尚未跑顺前，Y1-Y2 还要承担恢复运营人力成本。"
    - "40 法则为 -218.4%，烧钱倍数从 5.7x 升至 7.5x，Y3 每名 FTE 收入仅 $43K；这是一份先验证、再决定继续还是止损的计划，并非已证明可规模化的模型。"
    - "Y3 期末现金 $1.48M 包含有条件的 Q3Y2 $2.0M 种子轮融资；若未能融资，下行情景将出现 $95.56K 现金缺口，必须停止项目或进一步削减成本。"
    - "Y1/Y2 将 50% 的恢复运营薪酬分摊至交付成本、云成本率逐步下降，都只是规划假设；实际存储、数据外传、演练人力和 API 限流成本必须在试点中测清。"
