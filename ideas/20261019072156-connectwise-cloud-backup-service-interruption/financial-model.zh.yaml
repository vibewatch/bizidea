scenarios:
  downside:
    description: "销售延迟两个季度，到 Q4Y3 公司有 11 家 MSPs；团队暂停 M18 之后的招聘和可自由支配支出，且模型未计入后续融资。"
    y3RevenueK: 108.00
    y3EbitdaK: -463.20
    cashLowPointK: -95.56
    keyAssumptionChanges:
      - "A30：Y3 ARPU 降至 $12K，客户数增长最终停在 11 家 MSPs。"
      - "A30：不进行原计划有条件启动的 Q3Y2 种子轮融资；M18 后冻结招聘，团队维持 3 名 FTE。"
  base:
    description: "基准情景到 Q4Y2 达到 10 家 MSPs、约 100 个受保护租户，之后到 Q4Y3 达到 14 家 MSPs；有条件的种子轮融资到账前，现金最低点是 M18 时的种子前轮余额。"
    y3RevenueK: 216.00
    y3EbitdaK: -763.62
    cashLowPointK: 622.77
    keyAssumptionChanges:
      - "A5-A29 中的客户增长、定价、毛利率相关成本分摊和有条件融资安排均不变。"
  upside:
    description: "合作伙伴转介绍加快，到 Q4Y2 达到 14 家 MSPs；设置服务和恢复演练增购将单家 MSP 年收入推至 $21K，Y3 毛利率达到 70%。"
    y3RevenueK: 294.00
    y3EbitdaK: -702.20
    cashLowPointK: 636.00
    keyAssumptionChanges:
      - "A31：到 Q4Y2 达到 14 家 MSPs，并在整个 Y3 保持这一客户数。"
      - "A31：席位定价取区间上限，并叠加设置服务和定期恢复演练费用，使 ARPU 升至 $21K。"
      - "A31：自动化降低交付和云成本，使毛利率达到 70%。"
