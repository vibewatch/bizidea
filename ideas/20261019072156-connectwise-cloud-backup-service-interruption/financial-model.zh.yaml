slug: provider-outage-restore-reserve
date: "2026-10-19"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: 模型起始月份
    value: "2026-11"
    unit: YYYY-MM
    source: "[BP 日期 2026-10-19；模型从下一个完整日历月开始]"
  - id: A2
    name: 起始付费 MSP 账户数
    value: "0"
    unit: MSP accounts
    source: "[BP 里程碑与 GTM 销售漏斗目标；模型启动时尚未产生收入]"
  - id: A3
    name: 客户与价值计量单位定义
    value: "一个客户指一家付费 MSP；成熟期的典型客户账户覆盖 10 个受保护租户，每个租户有 50 个席位"
    unit: account definition
    source: "[BP businessModel.unitOfValue；BP market.SOM；模型口径]"
  - id: A4
    name: 定价与可触达市场上限背景
    value: "为期 90 天、最多覆盖 10 个租户的试点收费 $2.5K-$5K；覆盖 10 个租户的年度账户收费 $9K-$18K，按每个受保护席位每月 $1.50-$3.00 计价；14 家 MSPs 是早期可触达客户群的示例规模"
    unit: USD/account/year（市场背景）
    source: "[BP investorMemo.firstCustomer.initialContract；BP gtm.pricing；research.yaml market.bottomUpSizingDrivers 与 market.SOM；付费意愿尚未验证]"
  - id: A5
    name: Y1 新增 MSP 客户
    value: "0,0,0,1,0,1,0,0,0,1,0,0"
    unit: 每月净新增 MSP 客户数
    source: "[BP gtm.funnelTargets 与 product.sixMonth；到 M6 时有两个付费试点，到 M12 时有三个；已完成的试点中，至少一半在 M12 前转化]"
  - id: A6
    name: Y2 MSP 客户增长
    value: "4,6,8,10"
    unit: 季度末 MSP 客户数
    source: "[BP 12-24 个月里程碑；只有试点续约，才能在 M24 达到 10 家付费 MSP 和 100 个受保护租户]"
  - id: A7
    name: Y3 MSP 客户增长
    value: "11,12,13,14"
    unit: 季度末 MSP 客户数
    source: "[BP market.SOM 与 24-36 个月里程碑；14 家 MSPs 是情景上限，并非经验证的需求]"
  - id: A8
    name: MSP 客户账户混合年收入
    value: "Y1 10；Y2 15；Y3 18"
    unit: USDK/account/year
    source: "[BP 初始合同区间与席位单价测试；收入由年度订阅、设置服务和定期恢复演练组合构成；$18K 对应 10 个租户 x 每个租户 50 个席位 x 每席每月 $3 x 12]"
  - id: A9
    name: 新签 MSPs 的首期收入确认比例
    value: "50"
    unit: pct of a full period
    source: "[初创企业财务经验假设：新客户在签约所在月份或季度的中点上线]"
  - id: A10
    name: 商业计划目标毛利率
    value: "70"
    unit: pct
    source: "[BP businessModel.targetGrossMarginPct；仅为目标，并非实际观测到的毛利率]"
  - id: A11
    name: 云、存储与传输 COGS 率
    value: "Y1 15；Y2 12；Y3 10"
    unit: pct of revenue
    source: "[BP strategicChoices.wedgeRationale 与 risks 提到存储和传输成本可能重复；在实测租户成本前暂按初创企业财务经验估算]"
  - id: A12
    name: 计入交付 COGS 的恢复运营薪酬
    value: "Y1 50；Y2 50；Y3 40"
    unit: 恢复运营全口径薪酬的百分比
    source: "[BP operatingAssumptions 与 milestones 要求实测服务人力和自动化水平；模型中的分摊比例是初创企业财务经验假设，并非实测结果]"
  - id: A13
    name: 招聘顺序与六期 FTE 快照
    value: "M0 招聘创始人/CEO 和创始工程师；两个付费试点之后，于 M9 招聘恢复运营人员；服务流程具备可重复性后，于 Q3Y2 招聘第二名工程师；客户组合得到验证后，于 Q3Y3 招聘渠道合作/GTM 负责人；FTE 总数依次为 2,2,3,3,4,5"
    unit: hires and FTE at q1y1,q2y1,q3y1,q4y1,q4y2,q4y3
    source: "[BP 团队；BP strategicChoices.sequencingRationale；BP 里程碑；验证通过后的招聘安排属于精益扩张经验假设]"
  - id: A14
    name: 创始人和 CEO 全口径现金薪酬
    value: "120"
    unit: USDK/FTE/year
    source: "[种子前轮创始人薪资及薪酬附加成本的初创企业财务经验假设]"
  - id: A15
    name: 产品与工程全口径现金薪酬
    value: "165"
    unit: USDK/FTE/year
    source: "[资深 SaaS 与 Microsoft 365 集成工程师薪资及薪酬附加成本的初创企业财务经验假设]"
  - id: A16
    name: 恢复运营全口径现金薪酬
    value: "125"
    unit: USDK/FTE/year
    source: "[早期恢复运营负责人薪资及薪酬附加成本的初创企业财务经验假设]"
  - id: A17
    name: 渠道合作与 GTM 全口径现金薪酬
    value: "130"
    unit: USDK/FTE/year
    source: "[首位渠道与合作伙伴负责人薪资及薪酬附加成本的初创企业财务经验假设；待验证通过后再招聘]"
  - id: A18
    name: Y1 月度非薪酬研发预算
    value: "10,10,10,10,12,12,12,12,12,12,12,12"
    unit: USDK/month
    source: "[用于 BP 中的 MVP、API/安全验证和恢复保真度工作；云端测试租户、工程工具及专业承包商支出按初创企业财务经验估算]"
  - id: A19
    name: Y1 月度非薪酬销售与营销预算
    value: "2,2,2,2,3,3,3,3,3,3,3,4"
    unit: USDK/month
    source: "[BP 中创始人主导外联，转介绍渠道尚未得到验证；差旅和试点销售支出按初创企业财务经验估算]"
  - id: A20
    name: Y1 月度非薪酬 G&A 预算
    value: "7,7,7,7,8,8,8,8,8,8,8,8"
    unit: USDK/month
    source: "[用于 BP 运营和客户 DPA/安全审查；兼职法律顾问、保险、会计、行政支出按初创企业财务经验估算]"
  - id: A21
    name: Y2 季度非薪酬预算
    value: "R&D 30,32,34,36；S&M 12,15,18,20；G&A 18,18,19,20"
    unit: USDK/quarter
    source: "[BP 设定的标准化客户导入、付费试点和合作伙伴验证里程碑；预算按精益运营经验估算]"
  - id: A22
    name: Y3 季度非薪酬预算
    value: "R&D 32,34,36,38；S&M 20,22,24,28；G&A 20,20,22,22"
    unit: USDK/quarter
    source: "[BP 仅在 M365 验证通过后才扩展客户组合；预算按精益运营经验估算]"
  - id: A23
    name: 单位经济模型中的月度客户流失率
    value: "1.5"
    unit: pct/month
    source: "[面向中端市场、客户黏性较高的业务连续性软件的初创企业财务经验假设；目前没有该产品的留存数据]"
  - id: A24
    name: CAC 销售工时分摊
    value: "CEO 30；渠道合作/GTM 招聘人员 50"
    unit: pct of loaded payroll
    source: "[BP 由创始人主导 GTM，渠道招聘延后；销售工时分摊比例按初创企业财务经验估算]"
  - id: A25
    name: 全口径混合 CAC
    value: "23.75"
    unit: USDK/new MSP account
    source: "[用 3 年非薪酬 S&M 支出及 A24 中 CEO、GTM 人员的销售工时分摊计算，再除以 A5-A7 中净增的 14 家 MSP 客户]"
  - id: A26
    name: 模型启动时的种子前轮融资
    value: "1.5"
    unit: USDM
    source: "[BP fundingAsk.targetFundingRangeUsd 为 $1.5M-$2.5M；模型采用区间低端，并在预计 18 个月现金消耗和现金缓冲之外留出应急资金]"
  - id: A27
    name: 六个月现金缓冲
    value: "302"
    unit: USDK
    source: "[根据 Q1Y2 和 Q2Y2 的模型净现金消耗推算；18 个月验证期结束后，约可覆盖六个月]"
  - id: A28
    name: 有条件的后续种子轮融资
    value: "在 Q3Y2 开始时投入 2.0，前提是通过里程碑门槛"
    unit: USDM and timing
    source: "[BP 12-24 个月里程碑与 18 个月种子前轮资金跑道；验证通过后以有条件的种子轮融资支持验证和增长，属于初创企业财务经验假设]"
  - id: A29
    name: EBITDA 转现金比例
    value: "100"
    unit: pct
    source: "[初创企业财务经验假设：模型未计入债务、大额资本开支或营运资本时点差异；现金余额按 EBITDA 加已列示融资流入滚动计算]"
  - id: A30
    name: 下行情景
    value: "销售延迟两个季度；到 Q4Y2 达到 7 家 MSPs，Y3 各季度依次为 8,9,10,11 家，Y3 ARPU 为 $12K；M18 后维持 3 名 FTE、年度非薪酬支出 $145K；不进行后续融资；测算得 Y3 收入 $108K、EBITDA -$463.2K，Q4Y3 现金最低点为 -$95.56K"
    unit: scenario
    source: "[BP operatingAssumptions、milestones、killCriteria 与客户转化的不确定性；基于暂停/继续决策的成本控制经验假设]"
  - id: A31
    name: 上行情景
    value: "到 Q4Y2 达到 14 家 MSPs，并在整个 Y3 保持这一客户数，单家 MSP 年收入为 $21K；直接恢复人力成本占运营团队薪酬的 47%，云成本占收入的 10%，毛利率达到 70%；测算得 Y3 收入 $294K、EBITDA -$702.2K，M18 现金最低点约为 $636K"
    unit: scenario
    source: "[BP market.SOM、席位单价区间、设置服务和恢复演练费用及 70% 毛利率目标；乐观的渠道与自动化情景]"
  - id: A32
    name: SaaS 每 FTE 年收入对比
    value: "200-400"
    unit: USDK/FTE/year
    source: "[规模化 SaaS 团队的初创企业财务经验基准；仅作方向性对比，并非公司特定目标]"
  - id: A33
    name: 指标计算口径
    value: "LTV 按 Y3 单家 MSP 年收入 x Y3 毛利率 / 月流失率计算；烧钱倍数按 EBITDA 现金消耗 / 净新增 ARR 计算；40 法则为 Y3 收入增速加 Y3 EBITDA 利润率"
    unit: calculation method
    source: "[初创企业财务经验指标定义；月流失率计入 LTV，不另行从净客户增长预测中扣减]"
  - id: A34
    name: 薪酬列示与直接人力成本重分类
    value: "salaryK 是员工全口径薪酬总额；deliveryPayrollCogsK 是已计入 salaryK 的恢复运营直接人力成本部分，从 opexK 中扣除，以免重复计算"
    unit: accounting convention
    source: "[模型口径；直接交付成本分摊见 A12，薪酬总额与员工人数及 A14-A17 相互核对]"
  - id: A35
    name: 种子前轮资金用途分配
    value: "工程 50；GTM 15；G&A 15；六个月现金缓冲 20"
    unit: pct of current round
    source: "[BP useOfFundsSummary 优先级与初创企业财务经验假设；金额与 A26 中 $1.5M 种子前轮融资相符]"
  - id: A36
    name: 敏感性情景
    value: "ARPU $12K/$18K/$21K；CAC $35K/$23.75K/$18K；月流失率 2.5%/1.5%/1.0%；销售周期 9-12/6-9/4-5 个月；毛利率 50%/66.8%/70%；招聘提前/基准/延后"
    unit: downside/base/upside
    source: "[BP 定价假设、销售漏斗与止损标准；尚未验证的初创企业财务敏感性参数，按模型中的客户增长节奏校准]"
  - id: A37
    name: 种子前轮覆盖里程碑期及现金缓冲所需资金
    value: "18 个月模型期内净现金支出 877.23；六个月现金缓冲 302；合计 1179.23；申请 $1.5M 融资后约留有 320.77 应急资金"
    unit: USDK
    source: "[根据 Y1 及 Y2 前两个季度的 EBITDA/现金表推算；BP fundingAsk.runwayMonths 为 18]"
  - id: A38
    name: 敏感性影响测算
    value: "ARPU：收入影响 -$72K、现金影响 -$64.8K；CAC：客户数固定为 14 家时，销售现金支出增加 +$157.5K；流失率：收入影响 -$18K、现金影响 -$16.2K；销售周期：收入影响 -$72K、现金影响 -$64.8K；毛利率：现金影响 -$36.4K；提前招聘：现金影响 -$74K"
    unit: Y3 收入和模型现金影响，USDK
    source: "[根据 A5-A25 与 A36 推算；除非下行情景明确说明不融资，否则现金影响不计入额外融资变化]"
