      similarity: job
      decisiveDifference: >-
        那个概念会在 Salesforce 恢复后对账 CRM 写入记录并整理安全续办资料；这个概念则让租户拥有一条独立授权的恢复通道，即使备份服务商本身无法使用，通道仍然可用。
