problem: >-
  服务商关闭应用身份后，MSPs 可能无法执行定时备份，也可能无法访问该服务中的归档和恢复功能，即使没有证据确认归档遭入侵。服务商停服可能让恢复工作停滞，直到服务重新开放访问；MSPs 仍须检查客户租户。尚未满足的需求，是一条可独立访问、经过演练的恢复通道，而不是声称 ConnectWise 的归档已遭入侵。
targetUser:
  primary: >-
    负责保护通过 SaaS 备份服务商获得保障的 Microsoft 365 租户的 MSP 备份和业务连续性负责人；这些租户尚未演练过独立掌控的恢复副本
  secondary: "需要书面恢复方案的 MSP 客户组织中的安全或 IT 负责人"
  buyer: "MSP 所有者、COO 或服务交付高管"
startupThesis:
  nonObviousInsight: >-
    备份即使没有遭入侵，实际操作中也可能无法使用：服务商一旦关闭用于访问定时任务、归档和恢复功能的应用身份，访问链路就会中断。业务连续性靠的是独立掌控的访问权限和经过验证的恢复通道，不是多存一份副本。
  beachhead: >-
    通过 ConnectWise Cloud Backup 管理 Microsoft 365 租户的 MSPs，优先服务那些不能只依赖已停用服务商来履行恢复承诺、又没有独立验证过的备份副本的客户。
  wedge: >-
    面向一小组经过筛选的 Microsoft 365 关键数据，提供托管式租户恢复储备：独立加密副本、客户掌控的紧急授权、经过验证的恢复操作手册，以及量化的恢复时限。
  whyNowCatalyst: >-
    ConnectWise 报告称，应用身份遭未经授权访问后，Cloud Backup 仍处于停用状态；定时备份、归档访问和恢复功能均不可用，恢复时间也未确认。
  ventureScalePath: >-
    先在 Microsoft 365 租户中验证这项储备，再把同样的租户隔离副本、客户触发的授权和经验证的恢复承诺扩展到其他 SaaS 工作负载及 MSP 客户组合。
solution: >-
  服务以客户批准的只读授权接入指定租户；这项授权独立于现有厂商备份服务所用的应用身份。服务把每个租户独立加密的副本存入单独管理的存储库，恢复授权由客户掌控，备份服务商不持有长期权限。服务定期将约定的样本数据恢复到隔离目标环境，并记录约定对象能否在选定时限内恢复。若主服务商停服，客户可授权从独立副本紧急恢复到指定目标；服务按经过验证的操作手册执行，并由预留的恢复支持团队协助。收费按受保护租户和实测恢复等级计算，另收接入费和演练费。
goToMarketSeed:
  firstCustomer: >-
    一家曾用 ConnectWise Cloud Backup 为 Microsoft 365 客户提供服务的 MSP。它已找出没有独立验证过恢复副本的租户，也必须向这些客户证明恢复流程确实可行。
  buyingTrigger: >-
    Cloud Backup 持续停服，恢复时间又未确认，客户因此追问恢复承诺或要求开展事后复盘。
  currentAlternative: >-
    等待已停服的服务商重新开放归档；手动检查租户和服务主体活动；或购买另一项备份服务，却不演练独立恢复流程。
  switchingReason: >-
    这项储备把独立副本、客户触发的授权和量化恢复演练结合起来，让 MSP 能证明恢复通道不依赖已停用服务商的应用身份。
  pricingHypothesis: >-
    按受保护租户收费，年费根据约定恢复时限分级；另收租户初始接入费和付费恢复演练费。
whyNow:
  - point: >-
      ConnectWise 表示，修复工作持续期间 Cloud Backup 仍处于停用状态；恢复时间未确认，定时备份、归档访问和恢复功能仍不可用。
    signalRefs:
      - 初步遏制后，服务商仍未恢复服务
    sourceRefs:
      - 1
  - point: >-
      服务商称，应用身份遭未经授权访问导致服务中断，但没有迹象表明备份归档遭到入侵；访问连续性问题不能等同于已确认的数据窃取。
    signalRefs:
      - 备份访问已关闭，但尚无迹象表明归档遭入侵
    sourceRefs:
      - 2
  - point: >-
      Huntress 报告称，攻击者利用遭泄露的供应商侧凭证，未经授权登录 162 个客户租户；Huntress 还建议租户管理员审计服务主体活动。
    signalRefs:
      - 供应商侧凭证被用于登录大量客户租户
    sourceRefs:
      - 3
  - point: >-
      媒体报道显示，归档访问和恢复功能仍不可用时，MSPs 仍须检查下游租户。
    signalRefs:
      - 下游租户检查仍由 MSPs 负责
    sourceRefs:
      - 4
differentiator: >-
  这不是第二个备份控制台：每个租户的副本、紧急授权和经过验证的恢复流程，从设计上就独立于导致原服务中断的服务商应用身份。买家付费购买的是有证据支撑的恢复时限和预留响应能力，而非单纯存储空间；产品不声称能检测或处置租户入侵。
conceptDiagram:
  title: "租户恢复储备"
  mermaid: |
    flowchart LR
      MSP[MSP selects critical tenant] --> Copy[Independent encrypted tenant copy]
      Copy --> Drill[Scheduled isolated restore proof]
      Customer[Customer-held emergency authorization] --> Recover[Authorized recovery from reserve]
      Drill --> Recover
      Recover --> Outcome[Measured tenant recovery outside primary backup service]
