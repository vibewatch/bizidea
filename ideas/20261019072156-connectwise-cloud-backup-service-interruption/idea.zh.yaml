jobsToBeDone:
  - job: >-
      SaaS 备份服务商暂停访问时，帮助 MSP 业务连续性负责人从独立且经过验证的副本中恢复客户的重要 Microsoft 365 数据，让 MSP 无需等待主服务商重新启用其应用身份，也能履行恢复承诺。
    currentAlternative: "等待服务商恢复，再使用其归档并手动检查租户"
    successMetric: "从独立副本恢复约定数据所需时间；达到所选恢复时限的定期演练占比"
  - job: >-
      客户询问归档是否真的能恢复时，帮助 MSP 在隔离环境中演示约定数据的恢复过程，让 MSP 在下一次服务商中断前拿出准备就绪的证据。
    currentAlternative: "依赖服务商状态更新，或临时开展恢复测试"
    successMetric: "定期恢复演练成功率；从获得授权到验证数据的耗时"
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      把独立租户副本、客户触发的授权和量化恢复储备组合起来，付费对象就从备份存储变成了恢复能力。
  venturePotential:
    score: 4
    rationale: >-
      MSPs 可以把业务连续性承诺覆盖到多个客户租户，但每次部署都要承担存储、安全和信任成本，早期利润空间可能受限。
  whiteSpace:
    score: 3
    rationale: >-
      这次停服暴露出一个具体的服务商停摆连续性缺口，但分流证据并未说明其他备份服务商对此覆盖得有多全面。
  painIntensity:
    score: 5
    rationale: >-
      定时备份、归档访问和恢复功能都不可用，恢复时间也未确认；停服期间，客户的恢复责任仍落在 MSPs 身上。
  wedgeClarity:
    score: 5
    rationale: >-
      试点可以先挑选少数关键租户，定义由客户掌控的恢复通道，并量化隔离环境中的恢复演练结果，再扩大服务范围。
  evidenceFit:
    score: 4
    rationale: >-
      来源直接证实了服务停摆、恢复功能不可用、供应商凭证暴露和 MSPs 的后续责任；但客户的付费意愿尚未得到验证，也未量化有多少受影响的 MSPs 没有独立恢复副本。
topRisks:
  - name: "现有备份替代方案"
    description: >-
      MSPs 可能已有其他服务商或原生恢复通道，因此会认为额外的恢复储备是重复投入。
    mitigation: >-
      在销售保障服务前，先筛选试点客户，验证他们是否真的拥有独立于服务商的副本，以及由客户授权的恢复通道。
  - name: "租户访问和信任"
    description: >-
      客户可能不愿使用会复制敏感 Microsoft 365 数据或新增特权身份的服务。
    mitigation: >-
      尽量减少长期权限，隔离租户数据和密钥，并让客户掌控恢复授权，且全程留痕以供审计。
  - name: "恢复成本和保真度"
    description: >-
      存储成本、API 限制、租户架构变化或对象覆盖不完整，都可能让服务无法满足承诺的恢复时限。
    mitigation: >-
      从范围狭窄、记录清楚的数据集开始；只有反复通过隔离恢复演练验证的等级，才对外承诺。
