problem: >-
  When provider-side application identities are disabled, MSPs can lose scheduled backups and access to the archives
  and restores in that service even when there is no confirmed archive compromise. A provider suspension can therefore
  strand recovery until service access returns, while MSPs remain responsible for customer-tenant checks. The unmet
  need is a separately reachable and rehearsed restore path, not an assertion that ConnectWise's archives were breached.
targetUser:
  primary: >-
    MSP backup and continuity leads responsible for Microsoft 365 tenants protected through a SaaS backup provider,
    where no separately controlled restore copy has been rehearsed
  secondary: "Security or IT leads at MSP customer organizations that require a documented recovery path"
  buyer: "MSP owner, COO, or service-delivery executive"
startupThesis:
  nonObviousInsight: >-
    A backup can remain uncompromised yet be operationally unusable when its provider shuts off the application
    identities that expose scheduled jobs, archives, and restores; continuity requires separately controlled access
    and a proved restore path, not just another stored copy.
  beachhead: >-
    MSPs managing Microsoft 365 tenants through ConnectWise Cloud Backup, beginning with customers whose recovery
    commitments cannot rely solely on the suspended provider and who lack an independently tested copy.
  wedge: >-
    A managed tenant recovery reserve that keeps an independently encrypted copy, customer-controlled emergency
    authorization, a tested restore runbook, and a measured recovery window for a narrowly selected set of critical
    Microsoft 365 data.
  whyNowCatalyst: >-
    ConnectWise reported that Cloud Backup remained suspended with scheduled backups, archive access, and restores
    unavailable and no confirmed restoration time after unauthorized access to application identities.
  ventureScalePath: >-
    Prove the reserve with Microsoft 365 tenants first, then extend the same tenant-isolated copy, customer-triggered
    authorization, and tested recovery commitment to other SaaS workloads and MSP customer portfolios.
solution: >-
  The service onboards a selected tenant through a customer-approved, read-only grant that is separate from the
  incumbent backup provider's application identity. It keeps a tenant-isolated encrypted copy in a separately
  administered repository, with recovery authorization controlled by the customer rather than a standing privilege
  held by the backup vendor. On a scheduled cadence, it restores agreed sample data into an isolated destination and
  records whether the agreed objects can be recovered within the selected window. If the primary provider is
  suspended, the customer can authorize an emergency restore from that independent copy into a chosen destination,
  using the tested runbook and reserved recovery support. Pricing is per protected tenant and tested recovery tier,
  with setup and drill fees.
goToMarketSeed:
  firstCustomer: >-
    An MSP that used ConnectWise Cloud Backup for Microsoft 365 customers, has identified tenants without an
    independently tested recovery copy, and must show those customers a credible restore procedure.
  buyingTrigger: >-
    The ongoing Cloud Backup suspension and lack of a confirmed restoration time prompts customer questions about
    recovery commitments or a post-incident review.
  currentAlternative: >-
    Rely on the suspended provider's archive becoming available again, manually inspect tenant and service-principal
    activity, or purchase another backup service without a rehearsed independent restore procedure.
  switchingReason: >-
    The reserve couples an independent copy with customer-triggered authorization and a measured recovery drill, so
    the MSP can demonstrate a path that does not depend on the disabled provider application identity.
  pricingHypothesis: >-
    Annual fee per protected tenant tiered by the agreed recovery window, plus initial tenant setup and paid recovery
    drills.
whyNow:
  - point: >-
      ConnectWise said Cloud Backup remained suspended while remediation continued, with no confirmed restoration
      time and scheduled backups, archive access, and restores still unavailable.
    signalRefs:
      - Provider shutdown outlasted immediate containment
    sourceRefs:
      - 1
  - point: >-
      The provider attributed the interruption to unauthorized access to application identities but reported no
      indication that backup archives were compromised, making access continuity distinct from confirmed data theft.
    signalRefs:
      - Backup access was disabled without confirmed archive compromise
    sourceRefs:
      - 2
  - point: >-
      Huntress reported unauthorized sign-ins to 162 customer tenants through a compromised vendor-side credential and
      advised tenant administrators to audit service-principal activity.
    signalRefs:
      - Vendor credential reached many customer tenants
    sourceRefs:
      - 3
  - point: >-
      Reporting placed MSPs in the downstream response role, responsible for tenant-level checks while archive access
      and restores remained unavailable.
    signalRefs:
      - MSPs retained downstream tenant checks
    sourceRefs:
      - 4
differentiator: >-
  This is not a second backup console: each tenant's copy, emergency authorization, and tested restore procedure are
  designed to remain independent of the provider application identity whose suspension interrupted the original
  service. The buyer pays for an evidenced recovery window and reserved response capacity, not just stored bytes; the
  product does not claim to detect or remediate tenant compromise.
conceptDiagram:
  title: "Tenant restore reserve"
  mermaid: |
    flowchart LR
      MSP[MSP selects critical tenant] --> Copy[Independent encrypted tenant copy]
      Copy --> Drill[Scheduled isolated restore proof]
      Customer[Customer-held emergency authorization] --> Recover[Authorized recovery from reserve]
      Drill --> Recover
      Recover --> Outcome[Measured tenant recovery outside primary backup service]
businessModelCanvas:
  customerSegments:
    - MSPs responsible for Microsoft 365 recovery across managed customer tenants
    - MSP customers that need a separately documented recovery commitment
  valuePropositions:
    - "Keep a tenant-level restore path available if the primary SaaS backup provider is suspended"
    - "Prove recovery of agreed data on a scheduled drill instead of assuming a stored archive is usable"
    - "Separate emergency restore authorization from the incumbent provider application identity"
  channels:
    - Direct outreach to MSP owners and service-delivery leaders after backup-service interruptions
    - Referrals from MSP continuity and security advisers
    - Pilot onboarding with MSPs whose customer tenants used ConnectWise Cloud Backup
  customerRelationships:
    - Services-assisted tenant onboarding and recovery-runbook design
    - Annual continuity commitment with scheduled restore drills
    - Incident-time recovery support under a defined scope
  revenueStreams:
    - Annual per-tenant fee tiered by tested recovery window
    - One-time tenant setup and migration fee
    - Paid recovery drills and emergency response support
  keyResources:
    - Tenant-isolated encrypted copy and recovery workflow
    - Secure customer authorization and key-management design
    - Tested restore procedures and recovery support capacity
  keyActivities:
    - Onboard tenant access and independently copy agreed data
    - Run isolated recovery drills and document measured outcomes
    - Operate customer-authorized emergency restores
  keyPartners:
    - MSPs and Microsoft 365 implementation specialists
    - Independent cloud-storage and key-management providers
    - Incident-response firms advising MSPs on tenant checks
  costStructure:
    - Encrypted storage, transfer, and retention
    - Security engineering and tenant-isolation operations
    - Onboarding, scheduled drills, and emergency recovery staff
jobsToBeDone:
  - job: >-
      When a SaaS backup provider suspends access, help an MSP continuity lead restore a customer's critical Microsoft
      365 data from an independent, tested copy, so the MSP can meet its recovery commitment without waiting for the
      primary provider to re-enable its application identity.
    currentAlternative: "Wait for provider restoration, then use the provider archive and run manual tenant checks"
    successMetric: "Time to restore agreed data from the independent copy and percentage of scheduled drills meeting the selected recovery window"
  - job: >-
      When a customer asks whether its archive can actually be restored, help the MSP demonstrate recovery of agreed
      data in an isolated destination, so the MSP can evidence readiness before another provider interruption.
    currentAlternative: "Rely on provider status updates or conduct an ad hoc restore test"
    successMetric: "Successful scheduled restore-drill rate and elapsed time from authorization to verified data"
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      Pairing an independent tenant copy with customer-triggered authorization and a measured recovery reserve makes
      recovery capacity, not backup storage, the paid unit.
  venturePotential:
    score: 4
    rationale: >-
      MSPs can attach recurring continuity commitments across customer tenants, but each deployment carries storage,
      security, and trust costs that can constrain early margins.
  whiteSpace:
    score: 3
    rationale: >-
      The outage exposes a specific provider-suspension continuity gap, but the triage evidence does not establish how
      comprehensively alternative backup vendors already cover it.
  painIntensity:
    score: 5
    rationale: >-
      Scheduled backups, archive access, and restores were unavailable with no confirmed restoration time, placing
      customer recovery obligations on MSPs during the suspension.
  wedgeClarity:
    score: 5
    rationale: >-
      A pilot can select a few critical tenants, define a customer-controlled restore path, and measure an isolated
      recovery drill before broadening the service.
  evidenceFit:
    score: 4
    rationale: >-
      The sources directly verify the suspension, unavailable restores, vendor credential exposure, and MSP follow-up
      responsibility, but they do not prove willingness to pay or quantify the number of affected MSPs without a
      separate recovery copy.
topRisks:
  - name: "Existing backup alternatives"
    description: >-
      MSPs may already have another provider or native recovery path that makes a separate reserve appear redundant.
    mitigation: >-
      Qualify pilots by testing whether another provider-independent copy and customer-authorized restore path really
      exist before selling coverage.
  - name: "Tenant access and trust"
    description: >-
      Customers may reject a new service that copies sensitive Microsoft 365 data or introduces another privileged
      identity.
    mitigation: >-
      Minimize standing permissions, isolate tenant data and keys, and make recovery authorization customer-controlled
      and auditable.
  - name: "Restore-cost and fidelity"
    description: >-
      Storage, API limits, changing tenant schemas, or incomplete object coverage may prevent the promised recovery
      window from being met.
    mitigation: >-
      Start with a narrow, documented data scope and only sell recovery tiers demonstrated by repeated isolated
      restore drills.
