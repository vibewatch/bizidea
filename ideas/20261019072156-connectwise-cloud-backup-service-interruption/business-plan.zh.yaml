slug: provider-outage-restore-reserve
date: "2026-10-19"
executiveSummary: >-
 2026 年十月，ConnectWise 暂停 Cloud Backup 服务。事件暴露出一个风险：即使备份存档仍然留存，只要服务商停用负责呈现备份计划、存档和恢复任务的身份，存档仍可能无法使用。服务商没有确认恢复时间，也没有迹象显示存档遭到入侵。拟议业务向无法证明关键客户租户有独立测试过的恢复路径的 MSPs 销售独立管理的 Microsoft 365 恢复储备服务。滩头市场是受此次暂停影响、客户恢复承诺也因此面临风险的 MSPs；客户问询、事后复盘、续约或恢复证据请求都可能触发采购。产品将租户隔离副本、客户授权的紧急访问、定期恢复演练和有据可查的恢复时限组合起来，不宣称采用全新的备份底层技术。差异化承诺仍未验证：Veeam、Afi、Datto、Keepit、Microsoft 以及 MSP 自行运维的副本，已覆盖部分相同的备份和恢复任务；没有来源证实客户对这项储备服务有额外付费意愿。美国市场的示意情景为 TAM $243M、SAM $4.9M、SOM $0.24M，但这些数字依赖尚未验证的 MSP、租户、席位和资格假设，不是收入预测。前 18 个月应先厘清客户授权和恢复保真度、拿下付费试点，再测量服务人力和存储成本，之后才考虑扩展工作负载。种子前方案应作为验证后再决定继续或止步的投资，而非规模化计划。直接付费试点需求，以及受影响 MSPs 中没有可用第二副本的数量，仍然未知。
problem:
  - >-
    备份服务商可能暂停应用访问，导致备份计划、存档和恢复任务都无法使用；即使尚无证据确认存档遭到入侵，仍可能发生这种情况。
  - >-
    MSPs 仍需负责客户恢复和租户检查，却可能没有一条可独立访问、经过演练且符合恢复承诺的路径。
solution:
  - >-
    为客户批准的、范围明确的 Microsoft 365 数据集保留一份由独立主体管理、按租户隔离并加密的副本；访问权限和密钥保管均与现有厂商分开。
  - >-
    紧急授权须经客户批准，定期开展隔离恢复演练并报告实测结果；涉及的对象和权限通过可重复测试前，不承诺恢复时限。
  - >-
    按受保护租户和经测试的恢复等级收费，另收接入费和定期演练费；只纳入没有其他独立可用副本的租户。
whyWeWin:
  - >-
    这次事件验证了访问连续性失效的风险：ConnectWise 报告备份计划、存档访问和恢复均不可用，且没有确认恢复时间；同时没有报告存档遭到入侵。
  - >-
    如果产品评估证实现有替代方案无法满足需求，客户触发的授权路径和可重复的恢复证据，就有望把独立性和恢复能力写进合同。
  - >-
    MSPs 可以把租户级连续性承诺推广到旗下客户组合，但目前没有来源证实渠道可达性、对储备服务的专门需求或持久的技术护城河。
strategicChoices:
  beachhead: >-
    美国 MSPs：曾使用 ConnectWise Cloud Backup 备份 Microsoft 365，至少有一个关键租户没有经过独立测试的恢复路径，并且正面临客户恢复问询或即将开展安全审查、续约审查。
  wedgeRationale: >-
    先筛选少数关键租户，就能快速、可证伪地检验客户授权、副本独立性、恢复保真度和付费需求。相比再卖一款通用备份产品，这个切口更窄，也避免把此次事件当成所有受影响 MSPs 都没有第二副本的证据。代价是重复存储和建立租户级深度信任，会抬高早期客户导入成本、增加人工投入；只为能产出恢复证明的试点承担这笔成本。
  sequencingRationale: >-
    先厘清 Microsoft 的实际权限、控制器生命周期和恢复路径，再开展付费试点，测量恢复表现、客户审批情况以及人力和存储成本。研究指出 API 限流、广泛权限引发的顾虑和繁重的人工服务都可能拖累采用与毛利；先把接入和演练标准化，再增加销售人手或覆盖更多工作负载。
  notYet:
    - "通用 Microsoft 365 备份产品或全面进军企业市场。"
    - "在 Microsoft 365 恢复、需求和单位经济模型得到验证前，拓展到其他 SaaS 工作负载。"
    - "入侵检测、租户修复，或声称 ConnectWise 存档遭到入侵。"
    - "在合作伙伴要求和法律要求得到核实前，采用渠道主导的规模化打法或保证满足监管合规要求。"
market:
  tam: >-
    每年 $243M：美国同类产品支出的示意性下限，并非公开发布的市场总额。计算方式为 2,698 家目录收录服务商 × 假设每家 MSP 有 50 个 Microsoft 365 租户 × 每租户 50 个席位 × 传统备份价格代理值 $3/user/month。这份目录并非全面普查，估算也不是储备服务收入。
  sam: >-
    每年 $4.9M：美国市场示意情景。假设 2,698 家被收录的 MSPs 中有 10%（约 270 家）受到 ConnectWise 事件影响且没有经过测试的独立恢复路径；每家 MSP 有 10 个符合条件的租户，每个租户 50 个席位，按同一类产品价格代理值 $3/user/month 计算。资格和租户数量假设尚未验证。
  som: >-
    每年 $0.24M：早期可获取市场的示意切片。约 14 家 MSPs（假设可服务市场中的 270 家 MSPs 的 5%），每家有 10 个符合条件、各含 50 个席位的租户，按同类产品价格代理值 $3/user/month 计算。这是渗透率情景，不是预测或承诺。
  segments:
    - "主要：受 ConnectWise Cloud Backup 事件影响、其 Microsoft 365 租户没有经过独立测试的第二副本的 MSPs。"
    - "次要：客户安全审查或采购审查要求提供恢复证据、且现有恢复路径未通过独立性测试的 MSPs。"
  buyingProcess: >-
    MSP 的备份或服务交付负责人找出覆盖不足的租户，再向 MSP 所有者、COO 或服务高管介绍这项储备服务；客户租户管理员和安全负责人则审批数据访问与紧急授权。客户问询、事件复盘、续约讨论和证据请求都可能触发采购，但研究并未证实存在普遍适用的采购要求或保险方强制规定。
product:
  mvp: >-
    为客户批准的关键 Microsoft 365 数据集搭建租户级工作流，涵盖独立加密存储、分离的紧急授权、隔离恢复测试和可审计的结果报告。正式接入前，必须证明所需的确切权限和 API 路径；方案提出的“只读接入”设想，尚未与内容复制和恢复所需操作对上。
  sixMonth: >-
    完成经实验室测试的权限与恢复方案，再支持两个或更多 MSP 付费试点；严格限定对象范围、客户批准的访问权限和实测恢复时限。任何无法通过可重复保真度或吞吐量测试的范围都不纳入服务。
  twelveMonth: >-
    将成功试点转为按年、按租户签约；把接入、DPA 与删除流程、客户授权和演练证据标准化，并记录实际存储、流量、支持和演练失败成本。
  twentyFourMonth: >-
    只有试点续约且可靠性、毛利门槛均达标，才扩大到其他已验证的 Microsoft 365 工作负载和 MSP 客户组合；在储备服务能够重复交付、且客户评估已证明现有替代方案不够用之前，不进入其他 SaaS 品类。
  keyBets:
    - "部分受影响 MSPs 缺少实际恢复过的第二份副本；仅多一份备份订阅并不够。"
    - "客户会批准另一套遵循最小权限原则的访问方案和紧急授权设计。"
    - "与传统的第二家服务商相比，实测恢复证据和预留响应能力能让客户额外付费。"
    - "试点磨合后，可重复开展的演练能减少人力，足以支撑 70% 的目标毛利率。"
gtm:
  wedge: >-
    直接筛选曾使用 ConnectWise Cloud Backup、且没有经过独立测试的恢复路径的 MSPs；当客户问询或事后复盘让这个缺口必须着手解决时，销售仅覆盖有限租户的付费恢复储备服务。
  channels:
    - "创始人主导外联，接触有受影响 Microsoft 365 租户的 MSP 所有者和服务交付负责人。"
    - "测试 MSP 安全顾问和事件响应公司的转介绍意愿，再发展这类推荐渠道。"
    - "利用要求提供可核查恢复证据的客户安全审查、续约讨论和采购问卷；不假设存在普遍强制要求。"
  funnelTargets: >-
    规划目标，并非已观察到的转化率：列出 30 家 MSP 潜在客户 → 完成 12 场需求访谈 → 拿下 3 个付费试点；截至第12个月，至少将 50% 已完成的试点转为年度合同。完成首批 20 家合格潜客的接触后重新预测。
  pricing: >-
    按年收取租户费，按受保护席位和数据范围、以及已验证的恢复时限分档；另收初始接入费和定期演练费，并在合同中明确事件期间的支持范围。调研得出的传统备份基准 $3/user/month 仅作比较参照。测试每个受保护席位每月等值 $1.50–$3.00 的定价，不把它当成已验证的储备服务付费意愿。
businessModel:
  revenueStreams:
    - "按年订阅，费用取决于受保护租户和经过测试的恢复等级。"
    - "一次性收取租户接入费和恢复操作手册编制费。"
    - "收取定期恢复演练费和范围明确的紧急恢复支持费。"
  unitOfValue: >-
    一个租户约定的 Microsoft 365 数据集，以及经客户批准、经过测试的恢复路径和实测恢复时限；按租户等级收费，再按席位和存储量分档以反映交付成本。
  targetGrossMarginPct: 70
  expansionLevers:
    - "首个租户通过恢复演练后，再把符合条件的租户加入 MSP 合同组合。"
    - "只有实测恢复吞吐量足以支撑承诺时限后，才提供更高恢复等级。"
    - "现有服务范围续约且交付经济性稳定可重复后，再增加经验证的 Microsoft 365 工作负载。"
strategyMap:
  northStarMetric: "本季度最近一次定期隔离恢复演练达到合同约定时限的活跃受保护租户数。"
  inputMetrics:
    - "没有独立可用恢复路径的合格 MSPs 数量。"
    - "从 MSP 资格确认到客户批准租户接入的中位天数。"
    - "按约定恢复时限完成的定期租户演练占比。"
    - "按 MSP 客户群统计的付费试点转年度合同比例和续约率。"
  moatsToBuild:
    - "靠客户掌控授权、租户隔离以及可审计的密钥和访问流程，建立运营信任。"
    - "积累经过复用和测试的恢复操作手册，以及不同租户配置下的实测恢复证据；这是执行优势，不是独占数据护城河。"
    - "通过成功演练和清晰的责任边界，建立 MSP 客户关系。"
  killCriteria:
    - "访谈 12 家受影响 MSP 后，缺少实际恢复过的第二份副本或说不出面向客户恢复触发因素的 MSP 少于 4 家。"
    - "到第 6 个月，按每个受保护席位每月等值至少 $1.50 的价格签署付费试点的 MSP 少于 2 家。"
    - "截至第6个月，仍找不到经客户批准的 API 路径，能在不引入无法接受的常驻权限、也不受阻于现有厂商控制器切换的情况下，提供独立副本和恢复能力。"
    - "完成 20 次租户恢复演练后，若在各试点实测并写入合同的时限内恢复的约定关键测试对象比例低于 95%。"
    - "完成 20 个租户接入后，实测存储成本和交付人力显示，即使按买家接受的最高价格收费，毛利率仍低于 50%。"
  mermaid: |
    flowchart LR
      Trigger[Provider lockout or recovery review] --> Qualify[MSP has no tested independent copy]
      Qualify --> Reserve[Customer-authorized M365 restore reserve]
      Reserve --> Drill[Scheduled isolated restore proof]
      Drill --> Contract[Annual per-tenant recovery tier]
      Contract --> Expand[Expand within proven MSP portfolio]
investorMemo:
  verdict:
    call: "观望"
    conviction: "信心偏低至中等：此次中断证实访问路径存在痛点，但额外付费意愿和持久差异化仍未得到验证。"
    whyBelieve: >-
      ConnectWise 报告定期备份、存档访问和恢复均不可用，且没有确认恢复时间；MSPs 仍须负责下游客户检查。
    whyDoubt: >-
      多家成熟服务商和 Microsoft 已提供部分重叠的 Microsoft 365 备份与恢复服务，研究也未发现客户愿意为仅应对此类中断的储备服务付费的证据。
    nextDiligence: >-
      从没有实际恢复过第二副本的 MSPs 手中，拿下两个写明价格的付费试点；再核实能否在合同约定时限内，经客户批准完成隔离恢复。
  firstCustomer:
    title: "拥有受 ConnectWise Cloud Backup 事件影响的 Microsoft 365 租户的 MSP 服务交付负责人"
    profile: >-
      一家美国 MSP，通过 ConnectWise Cloud Backup 管理多个 Microsoft 365 客户租户；其中关键租户没有经过独立测试的恢复路径，且 MSP 已对客户承担恢复义务。
    trigger: >-
      服务中断引发客户问询或事后复盘；也可能是 MSP 在续约、安全审查或采购审查期间必须提供恢复证据。后几种情形只是待验证的假设，未获证实为强制要求。
    buyer: "MSP 所有者、COO 或服务交付高管负责采购；客户租户管理员另行审批访问权限。"
    initialContract: >-
      定价假设：90 天付费试点，最多覆盖 10 个关键租户，收费 $2,500–$5,000；转为年度合同后，10 个租户、每个 50 个席位的年费约为 $9,000–$18,000，折合每席位每月等值 $1.50–$3.00。定价区间参照传统备份服务价格，并非储备服务付费意愿的证据；只有在客户批准的恢复演练达到约定范围和时限后才续约。
  mustBeTrue:
    - "前 12 家受影响 MSPs 中至少 4 家没有实际恢复过第二副本，并且能指出面向客户的触发因素。"
    - "前 20 家合格 MSP 潜客中，至少 2 家会签署付费试点，且每个受保护席位每月等值价格不低于 $1.50。"
    - "客户安全审批人接受由独立主体管理的副本和紧急授权，并认可有记录且可接受的权限范围。"
    - "所选 Microsoft 365 路径在反复演练后，能在试点实测时限内恢复约定的关键对象，成功率至少达到 95%。"
    - "按 MSPs 接受的价格收费后，实测存储、出站流量、接入和定期演练人力成本，足以支撑上线时至少 50% 的毛利率，并提供走向 70% 的可行路径。"
  diligenceQuestions:
    - "在受影响 ConnectWise MSPs 访谈对象中，有多少家拥有一份与服务商无关且实际能恢复的第二副本？之后出现了什么客户损失或 SLA 风险？"
    - "MSPs 会为这项储备服务额外付费，还是更愿意改用或加购 Veeam、Afi、Datto、Keepit 等传统服务商的产品？"
    - "哪种 Microsoft 365 API 和权限路径能支持独立副本与恢复，且不需要替换现有备份控制器或授予无法接受的常驻权限？"
    - "MSP 与终端客户在事件期间意见不一致时，由谁批准紧急授权、保管密钥、选择恢复目标并取得客户同意？"
    - "按试点价格计算，每租户的实测存储、流量、接入、演练和紧急支持成本是多少？"
    - "哪些 MSP 客户 DPAs 和受监管行业要求会改变数据驻留、分包处理方、删除或通知义务？"
operatingAssumptions:
  - assumption: "12 家受影响 MSPs 中至少 4 家没有实际恢复过第二副本，并能指出近期面向客户的恢复触发因素。"
    basis: 运营判断
    validationTest: "访谈 12–15 家受影响 MSPs，并检查经删减的合同、覆盖清单、恢复日志和客户沟通记录。"
    decisionImpact: "如果假设不成立，放弃以此次中断为切口的滩头市场；在继续开发前，重新验证有明确恢复证据要求的 MSPs 是否有需求。"
  - assumption: "至少两家 MSPs 愿意为可实测的储备服务额外付费，而不是改用另一家传统备份服务商。"
    basis: research.yaml
    validationTest: "提供 90 天、按价收费的试点，价格为每个受保护席位每月等值 $1.50–$3.00；要求签署订单并预付。"
    decisionImpact: "如果买家只愿意更换服务商，或拒绝付费试点，就停止独立储备服务方案，或将其改为与现有厂商集成的产品或服务。"
  - assumption: "有技术可行的 Microsoft 365 复制与恢复路径，既能独立于现有厂商，又符合客户批准的访问控制。"
    basis: research.yaml
    validationTest: "在沙盒租户中梳理每项必需权限、授权和控制器切换；通过安全审查，测试复制、密钥隔离、对象保真度、限流和恢复目标。"
    decisionImpact: "如果该路径需要无法接受的常驻权限、接管控制器或难以落地的切换，就不接入生产租户。"
  - assumption: "经书面审查后，MSP 客户会接受服务所需的租户访问权限、分包处理方、数据位置、保留政策和紧急授权。"
    basis: research.yaml
    validationTest: "至少与三家试点客户完成安全和 DPA 审查；记录异议、审批时长，以及任何强制的数据驻留或密钥保管控制要求。"
    decisionImpact: "如果审批阻碍试点客户群，就缩小数据范围或调整区域，并在招聘负责拓展的人员前修改架构。"
  - assumption: "试点磨合后，可重复执行的客户接入和定期演练能支撑 70% 的目标毛利率。"
    basis: 运营判断
    validationTest: "通过 20 个租户接入和两轮演练，逐租户记录存储、传输、接入工时、演练工时、恢复失败和支持负荷。"
    decisionImpact: "如果前 20 个租户接入后，买家接受的价格只能支撑低于 50% 的毛利率，就暂停扩大销售；先自动化或收窄范围，再考虑规模化。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "访谈 12–15 家受影响 MSPs，并检查所选租户经删减的覆盖、合同和恢复证据。"
    hypothesis: "其中相当一部分没有独立可用的副本，且面临面向客户的恢复触发因素。"
    successMetric: "12 位受访者中至少 4 位同时符合这两个条件，并能指出预算负责人。"
    owner: "创始人/CEO"
  - horizon: "0–90 天"
    experiment: "在沙盒中开发 Microsoft 365 复制与恢复路径原型；梳理同意、权限、控制器生命周期、密钥保管和 Graph 限流。"
    hypothesis: "客户批准的路径可以独立运行，不会受权限问题或控制器切换影响而失去储备服务的意义。"
    successMetric: "经安全审查的测试计划能对约定对象集完成两次恢复，记录所需权限范围，且没有未解决的关键权限问题。"
    owner: "创始工程师"
  - horizon: "0–90 天"
    experiment: "按相同的客户授权、停用、导出和恢复证据要求，对 Veeam、Afi、Datto、Keepit 和 Microsoft 365 Backup 开展脚本化产品评估。"
    hypothesis: "一部分合格 MSPs 存在真实缺口，现有第二款传统产品无法弥补。"
    successMetric: "记录并核实五种替代方案的功能和权限；至少找到 3 位受访者，其现有路径未通过一项有据可查的测试。"
    owner: "创始人/CEO 与安全顾问"
  - horizon: "3–6 个月"
    experiment: "向符合条件的 MSPs 提供 90 天付费试点，最多覆盖 10 个关键租户，并明确数据范围、演练安排和紧急授权。"
    hypothesis: "至少两家 MSPs 愿意为储备服务额外付费，而不是等待或加购另一项常规备份服务。"
    successMetric: "至少签下并收取两个付费试点，价格达到或高于每个受保护席位每月等值 $1.50，并获客户租户审批。"
    owner: "创始人/CEO"
  - horizon: "3–9 个月"
    experiment: "为每个试点租户安排两次定期隔离恢复演练，并按预先约定的数据范围和恢复时限报告结果。"
    hypothesis: "在实测租户规模 API 限制下，服务能够反复恢复合同约定的关键对象。"
    successMetric: "在已完成的 20 轮租户演练中，每个试点时限内至少恢复 95% 的约定测试对象；记录所有例外。"
    owner: "创始工程师与恢复运营负责人"
  - horizon: "6–12 个月"
    experiment: "对比创始人主导的 MSP 外联与安全顾问、事件响应公司的转介绍效果；同时跟踪续约和采购审查中的证据请求。"
    hypothesis: "当没有经过测试的第二条恢复路径这一点有据可查时，基于信任的 MSP 渠道能带来合格潜客。"
    successMetric: "至少获得 3 个合格转介绍，并由非创始人推荐来源带来 1 个付费试点；未达标就不扩大该渠道。"
    owner: "创始人/CEO"
  - horizon: "9–18 个月"
    experiment: "自动化接入、演练证据和删除/返还流程，同时测量每租户全口径交付成本。"
    hypothesis: "可重复的服务运营能达到目标毛利率，同时不牺牲租户隔离或恢复质量。"
    successMetric: "完成 20 个租户接入后，用实测数据证明毛利率可超过 50%，并记录达到 70% 所需的自动化工作。"
    owner: "创始工程师与恢复运营负责人"
operations:
  - "要求客户批准租户访问清单并审查最小权限；用这些权限在技术上跑通复制和恢复前，不得把授权称为只读。"
  - "分开管理各租户数据、加密密钥、应用身份和客户紧急授权；保留撤销记录与访问审计轨迹。"
  - "定期开展隔离恢复演练，使用固定测试数据集和约定目标位置；测量耗时、出具对象级成功报告，并记录例外处理流程。"
  - "按租户跟踪 Microsoft Graph 限流、存储和传输成本、保留政策、支持工时及恢复失败，再提供恢复等级。"
  - "请隐私法律顾问审查租户 DPAs、分包处理方、数据驻留、事件通知、数据返还和删除；不假设合作伙伴或监管机构已批准。"
team:
  - role: "创始工程师"
    startTiming: "第 0 个月"
    rationale: "负责 Microsoft 365 API 可行性、安全的租户隔离、密钥与身份设计、恢复保真度和试点数据采集。"
  - role: "创始人/CEO"
    startTiming: "第 0 个月"
    rationale: "筛选受影响 MSPs、销售写明价格的试点、争取客户审批，并验证触发因素和渠道；证据不足前不招销售团队。"
  - role: "兼职安全与隐私顾问"
    startTiming: "第 0 个月"
    rationale: "在生产接入前审查权限、威胁模型、DPAs、分包处理方、数据处理方式和客户安全疑虑。"
  - role: "恢复运营负责人"
    startTiming: "第 6–9 个月，且仅在拿下两个付费试点后"
    rationale: "负责接入、定期演练、事件操作手册和交付成本测量；若试点无法重复交付或需求疲弱，就推迟招聘。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "截至第 90 天，完成 12–15 家受影响 MSPs 访谈、竞品恢复路径评估，以及经安全审查的 Microsoft 365 权限与 API 设计。"
      - "截至第6个月，拿下至少两个付费试点，并取得客户批准的租户访问权限和约定的关键数据范围。"
      - "截至第12个月，每个试点租户完成两次恢复演练；目标是在实测时限内恢复至少 95% 的约定测试对象，并将至少一半已完成试点转为年度合同。"
      - "在宣称毛利率或扩张可行之前，先摸清每租户的实际存储、流量、接入、演练和支持成本。"
  - horizon: "12–24 个月"
    items:
      - "只有试点续约、且符合条件的美国 MSPs 客群验证了可服务市场假设后，才达到 10 家付费 MSPs 和 100 个受保护租户。"
      - "自动化租户接入、授权记录、演练证据和删除/返还流程；证明毛利率有望超过 50%。"
      - "只有新增 Microsoft 365 工作负载通过相同发布门槛——权限、对象保真度、吞吐量和重复恢复表现均达标——才扩大覆盖。"
  - horizon: "24–36 个月"
    items:
      - "只在已证明付费转化和续约可重复的 MSP 客户组合及推荐渠道内扩张；不能仅凭早期转介绍就推断渠道效率。"
      - "至少 100 个租户持续通过恢复演练，且现有 M365 产品能支撑 70% 的目标毛利率后，才评估相邻 SaaS 工作负载。"
      - "根据实测的 MSP 资格、租户数、席位数、可接受价格和现有厂商能力重新评估市场，不再沿用初始情景假设。"
risks:
  - risk: "成熟服务商或 MSP 已有的第二副本，可能已经满足独立性和恢复证据需求，使储备服务变得多余。"
    likelihood: High
    impact: High
    mitigation: "先实测客户现有路径和主要替代方案，再决定是否纳入；要求付费试点，不把意向表达当作需求证据。"
  - risk: "客户可能因全租户权限、密钥保管或数据处理义务，拒绝另一套高权限身份或独立副本。"
    likelihood: High
    impact: High
    mitigation: "梳理最小权限范围，分开管理授权和密钥，让权限撤销可审计，完成客户安全与 DPA 审查；若权限仍无法接受，就停止推进。"
  - risk: "Microsoft API 限制、控制器生命周期或对象级保真度，可能导致无法在承诺时限内独立恢复。"
    likelihood: Medium
    impact: High
    mitigation: "在沙盒租户中测试控制器切换和 Graph 限流；MVP 仅覆盖已验证对象，合同只承诺反复测试已证明可达到的时限。"
  - risk: "重复存储、传输、接入和定期演练可能压低毛利，或造成人工服务瓶颈。"
    likelihood: High
    impact: High
    mitigation: "测量每租户全口径成本，收取接入和演练费用，自动化重复证据与操作手册；低于 50% 上线毛利门槛时暂停扩张。"
  - risk: "ConnectWise 中断带来的采购触发因素可能很集中；一旦现有厂商恢复访问或 MSPs 恢复服务，需求就会减弱。"
    likelihood: Medium
    impact: High
    mitigation: "分别验证续约、客户安全审查和恢复证据需求等触发因素；只有付费试点在事件热度过去后仍能转化，才扩大规模。"
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$1.5–2.5M"
  runwayMonths: 18
  useOfFundsSummary: >-
    这是财务模型完成前的运营方暂定目标：用 18 个月验证 Microsoft 365 权限与恢复路径，开发范围有限且安全的产品，开展 MSP 付费试点，支付兼职安全与隐私审查及试点存储和运营成本，并测量转化率与单位经济模型。资金用于验证后决定继续或止步，不用于广泛拓展 SaaS 品类或组建规模化销售团队。
