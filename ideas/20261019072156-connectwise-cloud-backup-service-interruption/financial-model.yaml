scenarios:
  downside:
    description: "A two-quarter sales delay leaves the company at 11 MSPs by Q4Y3; the team pauses post-M18 hires and discretionary spend, and no follow-on financing is assumed."
    y3RevenueK: 108.00
    y3EbitdaK: -463.20
    cashLowPointK: -95.56
    keyAssumptionChanges:
      - "A30: Y3 ARPU falls to $12K and customer ramp ends at 11 MSPs."
      - "A30: No conditional Q3Y2 seed is raised; hiring freezes at 3 FTE after M18."
  base:
    description: "The base case reaches 10 MSPs and about 100 protected tenants by Q4Y2, then 14 MSPs by Q4Y3; cash low point is the M18 pre-seed balance before the conditional seed."
    y3RevenueK: 216.00
    y3EbitdaK: -763.62
    cashLowPointK: 622.77
    keyAssumptionChanges:
      - "No changes from the customer ramp, pricing, gross-margin cost allocations, and conditional financing in A5-A29."
  upside:
    description: "Faster partner referrals reach 14 MSPs by Q4Y2, and setup and drill attach support $21K annual revenue per MSP with a 70% Y3 gross margin."
    y3RevenueK: 294.00
    y3EbitdaK: -702.20
    cashLowPointK: 636.00
    keyAssumptionChanges:
      - "A31: Reach 14 MSPs by Q4Y2 and hold that cohort through Y3."
      - "A31: ARPU rises to $21K through the upper end of seat pricing plus setup and scheduled-drill fees."
      - "A31: Automation reduces delivery and cloud cost enough to reach 70% gross margin."
sensitivity:
  - variable: ARPU
    downsideCase: "Y3 annual revenue per MSP falls to $12K."
    baseCase: "Y3 annual revenue per MSP is $18K."
    upsideCase: "Y3 annual revenue per MSP reaches $21K with setup and drill attach."
    y3RevenueImpactK: -72.00
    cashImpactK: -64.80
  - variable: CAC
    downsideCase: "Fully loaded CAC rises to $35K per MSP; preserving the 14-logo target would require about $158K more selling cash."
    baseCase: "Fully loaded CAC is $23.75K per MSP."
    upsideCase: "Partner referrals reduce CAC to $18K per MSP."
    y3RevenueImpactK: 0.00
    cashImpactK: -157.50
  - variable: churn
    downsideCase: "Monthly MSP logo churn increases to 2.5%."
    baseCase: "Monthly MSP logo churn is 1.5%."
    upsideCase: "Monthly MSP logo churn falls to 1.0% after restore evidence is embedded in runbooks."
    y3RevenueImpactK: -18.00
    cashImpactK: -16.20
  - variable: sales cycle
    downsideCase: "Qualified-lead-to-annual-close stretches to 9-12 months, moving several Y3 logos beyond the forecast and risking the follow-on gate."
    baseCase: "Qualified-lead-to-annual-close takes 6-9 months."
    upsideCase: "Customer recovery reviews shorten the cycle to 4-5 months."
    y3RevenueImpactK: -72.00
    cashImpactK: -64.80
  - variable: gross margin
    downsideCase: "Delivery labor and cloud/transfer costs keep gross margin near 50%."
    baseCase: "Gross margin reaches 66.8% in Y3, below the BP 70% target."
    upsideCase: "Automation and partner delivery achieve the 70% target."
    y3RevenueImpactK: 0.00
    cashImpactK: -36.40
  - variable: hiring pace
    downsideCase: "The second engineer and GTM hire are each pulled forward by one quarter before the milestone gates."
    baseCase: "The second engineer and GTM hire follow the staged proof plan in A13."
    upsideCase: "One planned hire is delayed a quarter because onboarding automation absorbs more work."
    y3RevenueImpactK: 0.00
    cashImpactK: -74.00
modelDiagram:
  title: MSP restore-reserve unit economics
  mermaid: |
    flowchart LR
      Leads[Qualified MSP leads] --> Pilots[Paid tenant pilots]
      Pilots --> MSPs[Paying MSP accounts]
      MSPs --> Tenants[Protected tenants and restore drills]
      Tenants --> Revenue[Subscription setup and drill revenue]
      Revenue --> GrossProfit[Gross profit after delivery labor and cloud]
      GrossProfit --> Cash[Cash after operating costs and financing]
modelSanity:
  - checkName: Revenue engine
    finding: "The base case grows from 3 MSP accounts at $10K Y1 ARPU to 10 at $15K in Y2 and 14 at $18K in Y3, producing $216K of Y3 revenue."
  - checkName: Must go right
    finding: "Pilot conversion and onboarding automation must lift Y3 gross margin to 66.8% while the conditional $2.0M Q3Y2 seed closes after proof."
  - checkName: Model breaks if
    finding: "A two-quarter sales delay cuts about $72K from Y3 revenue and $64.8K of modeled cash before financing, while missing the seed gate leaves the downside cash low point near negative $96K."
  - checkName: Next-round proof
    finding: "The $1.5M pre-seed funds 18 months to validate permissions, sign paid pilots, demonstrate at least 95% restore fidelity, convert half of completed pilots, and measure a path above 50% gross margin."
sanityChecks:
  ruleOf40: "Y3 revenue growth 135.1% + EBITDA margin -353.5% = -218.4%; not meaningful as a scale-stage SaaS efficiency signal at this revenue base."
  burnMultiple: "5.7x in Y2 ($684K EBITDA burn / $120K net new ARR) and 7.5x in Y3 ($764K / $102K); both indicate the pre-scale cost base is far ahead of revenue."
  revenuePerFte: "$43K Y3 revenue per 5 Q4Y3 FTE, below the directional $200K-$400K scaled-SaaS heuristic."
  flags:
    - "Y3 revenue is only $216K against an illustrative $240K SOM category-spend scenario; the 14-MSP cap and reserve-specific willingness to pay are both unverified."
    - "Y3 gross margin is 66.8%, below the BP 70% target, and Y1-Y2 are burdened by recovery-operations labor before onboarding is repeatable."
    - "Rule of 40 is -218.4%, burn multiple rises from 5.7x to 7.5x, and Y3 revenue per FTE is only $43K; this is a proof-and-stop/go plan, not a demonstrated scale model."
    - "Y3 ending cash of $1.48M includes the conditional $2.0M Q3Y2 seed; without that raise the downside case has a $95.56K cash deficit and requires a stop or further cost cuts."
    - "The 50% Y1/Y2 delivery-payroll allocation and falling cloud-cost ratios are planning heuristics; actual storage, egress, drill labor, and API-throttling costs must be measured in pilots."
