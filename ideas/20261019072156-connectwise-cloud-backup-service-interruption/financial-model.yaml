slug: provider-outage-restore-reserve
date: "2026-10-19"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: Model start month
    value: "2026-11"
    unit: YYYY-MM
    source: "[BP date 2026-10-19; model begins in the next full calendar month]"
  - id: A2
    name: Starting paying MSP accounts
    value: "0"
    unit: MSP accounts
    source: "[BP milestones and GTM funnel targets; pre-revenue model start]"
  - id: A3
    name: Customer and unit-of-value definition
    value: "One customer is one paying MSP logo; a representative mature account has 10 protected tenants and 50 seats per tenant"
    unit: account definition
    source: "[BP businessModel.unitOfValue; BP market.SOM; model convention]"
  - id: A4
    name: Pricing and market ceiling context
    value: "Pilot $2.5K-$5K for up to 10 tenants over 90 days; annual 10-tenant account $9K-$18K at $1.50-$3.00 per protected seat per month; 14 MSPs is the illustrative early obtainable cohort"
    unit: USD/account/year and market context
    source: "[BP investorMemo.firstCustomer.initialContract; BP gtm.pricing; research.yaml market.bottomUpSizingDrivers and market.SOM; willingness to pay is unproven]"
  - id: A5
    name: Y1 MSP customer additions
    value: "0,0,0,1,0,1,0,0,0,1,0,0"
    unit: net new MSP accounts by month
    source: "[BP gtm.funnelTargets and product.sixMonth; two paid pilots by M6, three by M12, with at least half of completed pilots converting by M12]"
  - id: A6
    name: Y2 MSP customer ramp
    value: "4,6,8,10"
    unit: quarter-end MSP accounts
    source: "[BP milestones 12-24 months; 10 paying MSPs and 100 protected tenants by M24 only if pilots renew]"
  - id: A7
    name: Y3 MSP customer ramp
    value: "11,12,13,14"
    unit: quarter-end MSP accounts
    source: "[BP market.SOM and milestones 24-36 months; 14 MSPs is a scenario cap rather than verified demand]"
  - id: A8
    name: Blended annual revenue per MSP account
    value: "Y1 10; Y2 15; Y3 18"
    unit: USDK/account/year
    source: "[BP initial contract range and per-seat price test; annual subscription plus setup and scheduled-drill mix; $18K matches 10 tenants x 50 seats x $3/month x 12]"
  - id: A9
    name: First-period revenue recognition for new MSPs
    value: "50"
    unit: pct of a full period
    source: "[Startup-finance heuristic: assume a new logo goes live halfway through its acquisition month or quarter]"
  - id: A10
    name: Business-plan target gross margin
    value: "70"
    unit: pct
    source: "[BP businessModel.targetGrossMarginPct; target only, not an observed margin]"
  - id: A11
    name: Cloud, storage, and transfer COGS rate
    value: "Y1 15; Y2 12; Y3 10"
    unit: pct of revenue
    source: "[BP strategicChoices.wedgeRationale and risks flag duplicated storage and transfer; provisional startup-finance heuristic pending measured tenant costs]"
  - id: A12
    name: Recovery operations payroll classified as delivery COGS
    value: "Y1 50; Y2 50; Y3 40"
    unit: pct of Recovery Operations loaded payroll
    source: "[BP operatingAssumptions and milestones require measured service labor and automation; modeled allocation is a startup-finance heuristic, not measured]"
  - id: A13
    name: Hiring sequence and six-column FTE snapshots
    value: "Founder/CEO and founding engineer at M0; Recovery Operations at M9 after two paid pilots; second engineer in Q3Y2 after repeatability; Partnerships/GTM in Q3Y3 after portfolio proof; total FTE 2,2,3,3,4,5"
    unit: hires and FTE at q1y1,q2y1,q3y1,q4y1,q4y2,q4y3
    source: "[BP team; BP strategicChoices.sequencingRationale; BP milestones; post-proof hires are lean-scaling heuristics]"
  - id: A14
    name: Founder and CEO loaded cash compensation
    value: "120"
    unit: USDK/FTE/year
    source: "[Startup-finance heuristic for a pre-seed founder salary with payroll burden]"
  - id: A15
    name: Product and engineering loaded cash compensation
    value: "165"
    unit: USDK/FTE/year
    source: "[Startup-finance heuristic for a senior SaaS and Microsoft 365 integration engineer with payroll burden]"
  - id: A16
    name: Recovery operations loaded cash compensation
    value: "125"
    unit: USDK/FTE/year
    source: "[Startup-finance heuristic for an early recovery-operations lead with payroll burden]"
  - id: A17
    name: Partnerships and GTM loaded cash compensation
    value: "130"
    unit: USDK/FTE/year
    source: "[Startup-finance heuristic for a first channel and partnerships hire, deferred until proof]"
  - id: A18
    name: Y1 nonpayroll R&D budget by month
    value: "10,10,10,10,12,12,12,12,12,12,12,12"
    unit: USDK/month
    source: "[BP MVP, API/security validation, and restore-fidelity work; startup-finance heuristic for cloud test tenants, engineering tools, and specialist contractors]"
  - id: A19
    name: Y1 nonpayroll sales and marketing budget by month
    value: "2,2,2,2,3,3,3,3,3,3,3,4"
    unit: USDK/month
    source: "[BP founder-led outreach and unproven referral channels; startup-finance heuristic for travel and pilot selling]"
  - id: A20
    name: Y1 nonpayroll G&A budget by month
    value: "7,7,7,7,8,8,8,8,8,8,8,8"
    unit: USDK/month
    source: "[BP operations and customer DPA/security reviews; startup-finance heuristic for fractional counsel, insurance, accounting, and administration]"
  - id: A21
    name: Y2 quarterly nonpayroll budgets
    value: "R&D 30,32,34,36; S&M 12,15,18,20; G&A 18,18,19,20"
    unit: USDK/quarter
    source: "[BP packaged onboarding, paid pilots, and partner validation milestones; lean operating-budget heuristic]"
  - id: A22
    name: Y3 quarterly nonpayroll budgets
    value: "R&D 32,34,36,38; S&M 20,22,24,28; G&A 20,20,22,22"
    unit: USDK/quarter
    source: "[BP portfolio expansion only after M365 proof; lean operating-budget heuristic]"
  - id: A23
    name: Monthly customer churn for unit economics
    value: "1.5"
    unit: pct/month
    source: "[Startup-finance heuristic for sticky mid-market continuity software; no product-specific retention data exists]"
  - id: A24
    name: Selling-time allocation for CAC
    value: "CEO 30; Partnerships/GTM hire 50"
    unit: pct of loaded payroll
    source: "[BP founder-led GTM and deferred channel hire; startup-finance heuristic for sales-time attribution]"
  - id: A25
    name: Fully loaded blended CAC
    value: "23.75"
    unit: USDK/new MSP account
    source: "[Derived from 3-year nonpayroll S&M spend, CEO and GTM selling-time allocations in A24, divided by 14 net new MSP accounts in A5-A7]"
  - id: A26
    name: Pre-seed funding at model start
    value: "1.5"
    unit: USDM
    source: "[BP fundingAsk.targetFundingRangeUsd $1.5M-$2.5M; model selects the low end and includes a contingency above modeled 18-month burn plus buffer]"
  - id: A27
    name: Six-month cash buffer
    value: "302"
    unit: USDK
    source: "[Derived from modeled net cash burn in Q1Y2 and Q2Y2; approximately six months after the 18-month proof period]"
  - id: A28
    name: Conditional follow-on seed financing
    value: "2.0 at start of Q3Y2, conditional on milestone gates"
    unit: USDM and timing
    source: "[BP 12-24 month milestones and 18-month pre-seed runway; startup-finance heuristic for a conditional seed round to fund validation and growth after proof]"
  - id: A29
    name: EBITDA-to-cash conversion
    value: "100"
    unit: pct
    source: "[Startup-finance heuristic: no debt, material capex, or working-capital timing modeled; cash rolls by EBITDA plus disclosed financing inflows]"
  - id: A30
    name: Downside scenario
    value: "Two-quarter sales delay; 7 MSPs by Q4Y2 and 8,9,10,11 across Y3 at $12K Y3 ARPU; after M18 hold 3 FTE and $145K annual nonpayroll spend; no follow-on round; derived Y3 revenue $108K, EBITDA -$463.2K, and Q4Y3 cash low point -$95.56K"
    unit: scenario
    source: "[BP operatingAssumptions, milestones, killCriteria, and customer-conversion uncertainty; stop/go cost-control heuristic]"
  - id: A31
    name: Upside scenario
    value: "14 MSPs reached by Q4Y2 and maintained through Y3 at $21K annual revenue per MSP; direct recovery labor equals 47% of operations payroll and cloud costs equal 10% of revenue for 70% gross margin; derived Y3 revenue $294K, EBITDA -$702.2K, and M18 cash low point about $636K"
    unit: scenario
    source: "[BP market.SOM, per-seat price range, setup and drill fees, and 70% margin target; optimistic channel and automation case]"
  - id: A32
    name: SaaS revenue-per-FTE comparison
    value: "200-400"
    unit: USDK/FTE/year
    source: "[Startup-finance heuristic benchmark for a scaled SaaS team; directional comparison only and not a company-specific target]"
  - id: A33
    name: Metric calculation conventions
    value: "LTV uses Y3 annual revenue per MSP x Y3 gross margin / monthly churn; burn multiple uses EBITDA cash burn / net new ARR; Rule of 40 is Y3 revenue growth plus Y3 EBITDA margin"
    unit: calculation method
    source: "[Startup-finance heuristic definitions; monthly churn is applied to LTV rather than separately deducted from the net customer ramp]"
  - id: A34
    name: Payroll presentation and direct-labor reclassification
    value: "salaryK is total loaded employee payroll; deliveryPayrollCogsK is the direct recovery-operations subset already included in salaryK and is subtracted from opexK to prevent double counting"
    unit: accounting convention
    source: "[Model convention; direct delivery allocation is specified in A12 and total payroll reconciles to headcount and A14-A17]"
  - id: A35
    name: Pre-seed use-of-funds allocation
    value: "Engineering 50; GTM 15; G&A 15; six-month buffer 20"
    unit: pct of current round
    source: "[BP useOfFundsSummary priorities and startup-finance heuristic; amounts reconcile to the $1.5M pre-seed in A26]"
  - id: A36
    name: Sensitivity cases
    value: "ARPU $12K/$18K/$21K; CAC $35K/$23.75K/$18K; monthly churn 2.5%/1.5%/1.0%; sales cycle 9-12/6-9/4-5 months; gross margin 50%/66.8%/70%; hiring pulled forward/base/delayed"
    unit: downside/base/upside
    source: "[BP pricing hypothesis, funnel and kill criteria; unvalidated startup-finance sensitivities calibrated to the modeled customer ramp]"
  - id: A37
    name: Pre-seed cash need through the milestone and buffer
    value: "18-month modeled net cash use 877.23; six-month buffer 302; total 1179.23; $1.5M ask leaves about 320.77 contingency"
    unit: USDK
    source: "[Derived from Y1 and first two Y2 quarterly EBITDA/cash schedules; BP fundingAsk.runwayMonths is 18]"
  - id: A38
    name: Sensitivity impact calculation
    value: "ARPU -$72K revenue/-$64.8K cash; CAC +$157.5K selling cash at fixed 14 logos; churn -$18K revenue/-$16.2K cash; sales-cycle -$72K revenue/-$64.8K cash; gross-margin -$36.4K cash; pull-forward hires -$74K cash"
    unit: Y3 revenue and modeled cash impact, USDK
    source: "[Derived from A5-A25 and A36; cash impacts exclude any additional financing change unless the downside scenario explicitly says the round is not raised]"
