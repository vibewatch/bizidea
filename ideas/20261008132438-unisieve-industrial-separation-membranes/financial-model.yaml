slug: offtake-backed-carbon-capture
date: "2026-10-08"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: Model period
    value: "2026-10 through 2029-09"
    unit: calendar month
    source: "[business-plan.yaml date; model horizon is the requested three-year planning convention]"
  - id: A1
    name: Base pre-seed financing
    value: 4.5
    unit: USD millions
    source: "[business-plan.yaml fundingAsk: provisional $3–5M target and 18-month runway; modeler selects $4.5M, uncommitted, to fund the milestone plus a six-month reserve and two gated project contributions]"
  - id: A2
    name: Revenue-bearing project ramp
    value: "0 billable project equivalents M1–M9; 1 paid pre-FEED project M10–M12; 0 operating-service equivalents Q1Y2; 1 from Q2Y2 through Q3Y3; 2 in Q4Y3"
    unit: revenue-bearing project-customer equivalents
    source: "[business-plan.yaml gtm.funnelTargets, product.twelveMonth, milestones, and experimentRoadmap: one paid pre-FEED target by month 12, first test in months 12–24, two cumulative projects only if gates pass by months 24–36; timing and conversions are unvalidated model assumptions. The reported Qemetica test is not a paying customer and is excluded]"
  - id: A3
    name: Capacity, uptime, and accepted output per project
    value: "15,000 nameplate tCO2/year × 85% uptime × 80% buyer acceptance = 10,200 calculated accepted t/year; forecast rounded down to 10,000 accepted t/year"
    unit: tonnes CO2 per project-year
    source: "[research.yaml reportMemo.technologyLandscape: supplier design range of 5,000–30,000 t/year, not verified output; business-plan.yaml strategyMap.killCriteria and experimentRoadmap: 85% uptime and 80% acceptance are future test thresholds, not demonstrated performance; 15,000 t and the rounding convention are model assumptions]"
  - id: A4
    name: Service price and pre-FEED fee
    value: "USD 60 per accepted tonne; USD 600K annual service ARPU at 10,000 accepted tonnes; first paid pre-FEED scope USD 150K recognized as USD 50K monthly in M10–M12"
    unit: USD per accepted tonne and USD thousands per project
    source: "[business-plan.yaml gtm.pricing and businessModel.revenueStreams: proposed development/commissioning fee plus per-accepted-tonne service charge; research.yaml.researchCoverage.coverageGap: no public service price or project economics found. Price and fee are unvalidated operator planning assumptions, not market facts]"
  - id: A5
    name: Direct project cost and gross margin
    value: "COGS 45% of recognized revenue; gross margin 55%; no target was supplied by the business plan"
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct is null and research.yaml reports no quoted project economics; 45% direct site operations, maintenance, measurement, and conditioning cost is a conservative startup-finance planning heuristic, not a validated margin]"
  - id: A6
    name: Hiring sequence and loaded compensation
    value: "CEO and founding process engineer M0; project finance/contracts M7; commissioning/operations M10; site process engineer M16; field operations hire M31. Six-column FTE snapshots are 2, 2, 3, 4, 5, 6. Blended fully loaded compensation is USD 120K/FTE/year"
    unit: FTE and USD thousands per FTE-year
    source: "[business-plan.yaml team and strategicChoices.sequencingRationale: founders at start, finance lead M6–9 contingent on a qualified pair, operations M9–12 contingent on a funded pilot, with lean hiring until proof; additional site/field hires are gated model assumptions. USD 120K blended loaded compensation is a named startup-finance planning heuristic, not a sourced salary quote]"
  - id: A7
    name: Non-payroll sales and marketing expense
    value: "Y1 monthly USD K by quarter: 5.0, 7.5, 10.0, 12.5; Y2 quarterly USD K: 45, 45, 45, 45; Y3 quarterly USD K: 50, 50, 55, 55"
    unit: USD thousands per month in Y1; USD thousands per quarter in Y2–Y3
    source: "[business-plan.yaml gtm.channels and experimentRoadmap: founder-led bilateral industrial sales with supplier/EPC introductions; spend cadence is a startup-finance operating heuristic for travel, account development, and partner work, excluding payroll]"
  - id: A8
    name: Non-payroll engineering and validation expense
    value: "Y1 monthly USD K by quarter: 20, 30, 40, 50; Y2 quarterly USD K: 60, 60, 70, 70; Y3 quarterly USD K: 75, 80, 80, 85"
    unit: USD thousands per month in Y1; USD thousands per quarter in Y2–Y3
    source: "[business-plan.yaml product, experimentRoadmap, operations, and milestones: site gas work, supplier/EPC design, independent measurement, and pilot engineering; cash expense cadence is a modeler planning estimate, not a vendor quote]"
  - id: A9
    name: Non-payroll general and administrative expense
    value: "Y1 monthly USD K by quarter: 15, 17.5, 20, 22.5; Y2 quarterly USD K: 45, 50, 50, 50; Y3 quarterly USD K: 55, 60, 60, 65"
    unit: USD thousands per month in Y1; USD thousands per quarter in Y2–Y3
    source: "[business-plan.yaml team and operations: independent MRV/regulatory counsel contracted rather than hired, permits, insurance, legal, and corporate costs; cadence is a named startup-finance planning heuristic, excluding payroll]"
  - id: A10
    name: Customer acquisition and lifetime assumptions
    value: "Fully loaded CAC USD 250K per qualified host–offtaker pair; assumed 36-month service life; monthly churn 2.8% as the reciprocal approximation of a 36-month expected life"
    unit: USD thousands per new project; months; percent per month
    source: "[business-plan.yaml investorMemo.firstCustomer and gtm.funnelTargets: no disclosed contract ACV, CAC, or term; research.yaml.reportMemo.customerAndBuyer: two decision-makers and industrial procurement friction. CAC and a three-year service term are unvalidated industrial go-to-market heuristics; churn is derived as 1/36]"
  - id: A11
    name: Project asset cost and capital stack
    value: "USD 3,000K installed CAPEX per 15,000 t/year project; each project financed with USD 1,500K host/grant capital, USD 1,200K project debt, and USD 300K sponsor equity. Two gated projects total USD 6,000K CAPEX, USD 3,000K host/grant capital, USD 2,400K debt, and USD 600K sponsor equity"
    unit: USD thousands per project and two-project fleet
    source: "[business-plan.yaml operatingAssumptions (the $3–5M corporate round keeps fleet assets separately financed), milestones, and fundingAsk.useOfFundsSummary; research.yaml reports no public CAPEX quote or project-finance terms. USD 3,000K cost and 50%/40%/10% stack are explicit unvalidated project-finance heuristics; host/grant support and debt are not committed or awarded]"
  - id: A12
    name: Project debt service
    value: "USD 1,200K debt per asset amortized over 10 years at an assumed 8% annual rate; approximate annual debt service USD 179K, or USD 44.75K per quarter"
    unit: USD thousands
    source: "[research.yaml.openQuestions asks for project-finance terms and confirms none are public; 8%, 10 years, and the level-payment calculation are modeler financing heuristics, not lender indications]"
  - id: A13
    name: Cash-flow and accounting boundary
    value: "USD 4,500K corporate financing inflow at M1; no further corporate equity round modeled; project capital inflows and asset CAPEX are shown separately from P&L revenue/EBITDA; full project debt service is deducted in cash; no taxes or working-capital movement is modeled"
    unit: USD thousands and modeling convention
    source: "[business-plan.yaml fundingAsk, strategicChoices.sequencingRationale, and operatingAssumptions: corporate runway is separated from project-SPV asset finance and no credit revenue is assumed; absence of tax and working-capital movement is a simplifying forecast assumption]"
  - id: A14
    name: Base use-of-funds and six-month buffer
    value: "USD 2,000K Engineering; USD 800K GTM; USD 800K G&A; USD 900K buffer; total USD 4,500K. Buffer is a six-month contingency reserve, including cost and commissioning variance"
    unit: USD thousands
    source: "[business-plan.yaml fundingAsk: $3–5M provisional pre-seed for an 18-month lean plan; the model adds a six-month reserve as requested. Category allocation and USD 900K reserve are modeler planning judgments, not approved budgets]"
  - id: A15
    name: Scenario-specific financing amounts
    value: "Downside USD 5.0M and 30 months if the first project slips six months and needs a technical extension; base USD 4.5M and 24 months; upside USD 4.2M and 24 months if the repeat-site host/strategic partner covers the USD 300K sponsor slice"
    unit: USD millions and months
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd permits a provisional $3–5M range and operatingAssumptions require resizing after quotes; scenario amounts, six-month downside delay, and upside host co-funding are unvalidated planning cases]"
  - id: A16
    name: Sensitivity shocks
    value: "Accepted output -25%/+20%; service price -20%/+20%; first commissioning delayed six months; gross margin -10/+10 percentage points; installed CAPEX +25%; fully loaded payroll +20%/-10%; second project fails to close"
    unit: scenario change from base
    source: "[business-plan.yaml topRisks, strategyMap.killCriteria, and research.yaml.reportMemo.sensitivityCases identify acceptance, cost, capital, and sales-conversion risks; shock sizes are explicit modeler stress-test assumptions]"
