unitEconomics:
  arpuAnnualK: 600.0
  grossMarginPct: 55.0
  cacK: 250.0
  monthlyChurnPct: 2.8
  avgCustomerLifeMonths: 36.0
  ltvK: 990.0
  ltvCacRatio: 3.96
  cacPaybackMonths: 9.09
  formulas:
    - "ARPU = 10,000 accepted tonnes/year × USD 60/tonne = USD 600K/year."
    - "LTV = USD 600K / 12 × 55% gross margin × 36 months = USD 990K."
    - "LTV/CAC = USD 990K / USD 250K = 3.96x; CAC payback = USD 250K / (USD 600K / 12 × 55%) = 9.09 months."
  assumptionRefs: [A3, A4, A5, A10]
