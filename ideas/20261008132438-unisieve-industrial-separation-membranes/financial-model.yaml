modelSanity:
  - checkName: Revenue engine
    finding: "One qualified project is modeled at 10,000 accepted tonnes per year and USD 60 per tonne for USD 600K annual ARPU, while the second project contributes only in Q4Y3."
  - checkName: Must go right
    finding: "A buyer must sign minimum-volume and quality terms, the test must reach 80% acceptance and 85% uptime, and each USD 3.0M asset must close its uncommitted 50% host/grant, 40% project-debt, and 10% sponsor stack."
  - checkName: Model breaks if
    finding: "A 20% payroll overrun reduces modeled three-year cash by USD 312K, while a 25% accepted-output shortfall cuts Y3 revenue by USD 187.5K and cumulative cash by USD 165K."
  - checkName: Next-round proof
    finding: "The next financing requires an independently witnessed 90-day test with at least 80% buyer acceptance and 85% uptime plus positive first-site contribution after approximately USD 179K annual project debt service, before a repeat-site commitment."
sanityChecks:
  ruleOf40: "Y3 revenue growth 66.7% (USD 750K vs USD 450K) + Y3 EBITDA margin -135.7% (-USD 1,017.5K / USD 750K) = -69.0%; the proxy is deeply negative during two-project deployment."
  burnMultiple: "Y3 consolidated project cash burn approximately USD 1,541K / USD 600K net new ARR = 2.57x; includes USD 300K net repeat-asset equity and USD 223.75K project debt service, so this infrastructure multiple is directional rather than SaaS-comparable."
  revenuePerFte: "Y3 revenue USD 750K / 6 year-end FTE = USD 125K per FTE (below the USD 200–400K mature-SaaS heuristic; early-stage asset-backed project delivery is not directly comparable)."
  flags:
    - "No accepted-tonne service price, installed CAPEX, project debt terms, energy requirement, or direct operating cost is publicly validated; modeled unit economics are planning assumptions, not observed evidence."
    - "The reported Qemetica test is an analogue only; no paying contract, signed offtake, or customer access is assumed."
    - "Host/grant capital and project debt are uncommitted; if either asset stack fails, the company must delay equipment orders rather than fund fleet CAPEX from the corporate round."
    - "The base case has only USD 569.5K cash at Y3 end before taxes, working capital, and contingencies; secure a follow-on or project capital before the repeat-site close."
    - "The Y3 rule-of-40 proxy is -69.0% and revenue per year-end FTE is USD 125K; scale is too early to support a mature SaaS efficiency comparison."
