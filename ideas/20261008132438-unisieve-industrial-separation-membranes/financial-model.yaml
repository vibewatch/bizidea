headcountBasis:
  assumptionRefs: [A6]
  description: "Annualized payroll is fully loaded headcount multiplied by the USD 120K blended annual cost per FTE; salaryK below is the actual period payroll and is included in opexK."
revenueModel:
  assumptionRefs: [A2, A3, A4]
  customerDefinition: "customersEop is the number of revenue-bearing paid project-customer equivalents in the period, not pipeline prospects or unique legal entities; the same pair can be a paid pre-FEED account, pause during commissioning, and later be a recurring accepted-output account."
  formula: "Monthly Y1 revenue = customersEop × USD 50K monthly billing; quarterly Y2/Y3 revenue = customersEop × USD 150K per quarter. Mature ARPU is USD 600K/year = 10,000 accepted tonnes/year × USD 60/tonne. The initial USD 150K paid pre-FEED scope is recognized as three USD 50K installments in M10–M12."
  exclusion: "The reported Qemetica live test is not treated as this company's customer, signed offtake, paid work, or revenue."
pnlMethodology:
  assumptionRefs: [A3, A4, A5, A6, A7, A8, A9, A13]
  description: "COGS is 45% of revenue; grossProfitK = revenueK - cogsK; salaryK is fully loaded payroll; opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK; ebitdaK = grossProfitK - opexK. Project asset CAPEX, external project capital and debt service do not enter EBITDA."
