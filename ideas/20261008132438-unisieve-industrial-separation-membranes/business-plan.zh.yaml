slug: offtake-backed-carbon-capture
date: 2026-10-08
executiveSummary: >-
  为欧洲工业客户提供融资并负责运营的碳捕集服务，前提是其 CO₂ 可直接用于厂内碳酸盐工艺；只按买方验收且经独立计量的 CO₂ 收费，不按装机产能计费。先锁定一组共同完成资格验证的工厂—承购方组合，优先在波兰拓客，因为有报告称 Qemetica 在当地开展了实测；但不能把 Qemetica 当成现成客户，也不能把测试说成商业合同。经济买方是厂区总经理或 CFO；设备融资前，碳酸盐工艺负责人必须先明确并认可原料规格。研究支持开展有明确本地用途的试点，也显示工业捕集有活跃资金支持；但目前没有已验收吨位的服务合同、买方规格、复购订单，也没有独立核实的运营经济性。最接近的先例已将 UniSieve 膜与 Qemetica 计划中的厂内碳酸盐用途配对，因此差异化得靠可融资的合同、运营和计量，而不能靠宣称捕集技术或源头—买方组合新颖。研究估算的欧洲吞吐量 TAM、SAM 和 SOM 单位是吨/年，只用于初筛，不是经验证的可服务量或美元收入市场。Pre-seed 轮融资支撑 18 个月的买方资格验证、场地工程、独立测试和设有阶段门槛的首次示范；不包含全车队设备融资，也不假设碳信用收入。只有买方承诺质量和数量规格、真实气流通过独立验收测试，且基于报价的项目模型不依赖未经核实的 ETS 待遇或 CO₂ 溢价也能成立，投资信心才会提升；在此之前，信心仍然偏低。
problem:
  - >-
    工业客户考虑捕集时，必须出资并集成设备；而碳酸盐买方在替换传统 CO₂ 供应前，需要可靠的成分、连续性和拒收规则。
  - >-
    供应商给出的设计产能或捕集率估算，无法证明某条具体排气流能达到多少验收吨位、开机率、能耗、更换成本或每吨可用 CO₂ 的成本。
  - >-
    没有明确的本地用户和合同约定的验收点，客户就得承担改造和承购风险；买方也完全有理由继续使用既有原料来源。
solution:
  - >-
    共同核验工厂排气、场地布局、公用设施需求和碳酸盐工艺需求；没有明确买方、买方认可的规格和可信的数量承诺，就不接项目。
  - >-
    客户与承购方作出附条件承诺后，向合格供应商采购适用的模块化捕集撬装设备，安排场地集成，并在买方交接点委托独立计量。
  - >-
    收取开发费、调试费，以及按买方验收吨位计算的服务费；试点证明开机率前，不设可用率保底，初期模型也不依赖碳信用收入。
whyWeWin:
  - >-
    这项服务把项目开发、融资、运营和买方验收放进一份合同；价值在于让客户不必承担性能风险，而不是发明新膜材料或本地碳酸盐用途。
  - >-
    持续积累的源气、开机率、质量、拒收和成本数据，有望让项目承保和服务保障更可靠；但这道护城河要等付费部署后才能建起来，现在还不存在。
  - >-
    如果膜供应商、EPC、工厂团队或传统 CO₂ 供应商能以更低交付成本、更简单的责任安排或同样的验收挂钩服务取胜，客户就会默认选他们。首单必须证明客户看重这份一体化合同。
strategicChoices:
  beachhead: >-
    从一家有点源排气、且厂内有碳酸盐用户的欧洲工业客户切入。优先在波兰寻找客户，因为有报道称当地开展了 Qemetica 膜测试，并计划用于碳酸盐生产；但要找其他客户或确认账户另有机会，不能假定能接触 Qemetica。
  wedgeRationale: >-
    先找出一组明确的排放源—买方，就能在投入项目资金前看清规格、需求和交接点验收。这比铺开 CO₂ 交易市场或推广捕集技术更快验证成败；但这样的组合可能很少，每处安装又都要资本，因此公司必须拒绝源头与买方不匹配的客户，并接受较慢的增长。
  sequencingRationale: >-
    先验证买方规格、最低需求和场地气体适配性；再为示范项目报价、签约，落实补助或项目层面资本，并在独立计量下调试。只有验收产出和不依赖碳信用的经济性得到验证后，才增加项目融资能力并复制部署，从而限制早期招聘和资产负债表风险。
  notYet:
    - >-
      没有明确的本地碳酸盐用户和附条件承购安排，就不为排放方捕集，即使排气看起来适合技术处理也不例外。
    - >-
      不建膜制造业务、宽泛的 CO₂ 交易市场或仅靠软件提供的监测产品；采购合格设备，交付项目结果。
    - >-
      首批项目不以碳信用、假设的 ETS 减免、绿色溢价或地质封存来定价；只有在单独核实后，才把它们作为备用方案或未来路径评估。
    - >-
      首份验收吨位合同和项目经济性尚未跑通并可复现前，不扩展到无关工业气体或其他碳酸盐市场。
market:
  tam: >-
    欧洲水泥行业理论吞吐量上限为 10.0 MtCO₂/year。研究按运营方估算的 200 个厂址乘以每处一台供应商设计的 50,000 t/year 模块计算。厂址数量未经审计，模块产能是供应商估算；这不是收入 TAM，也不是经济可行的捕集预测。
  sam: >-
    候选组合吞吐量为 0.25–0.75 MtCO₂/year，按运营方筛出的 5–15 组潜在欧洲排放源—碳酸盐用户组合、每组最高 50,000 t/year 计算。现有研究只找到一处有报道的试点，并未验证可行组合的数量；仍需核实需求、气体适配性和买方条款。
  som: >-
    前五年示范项目的初始产能为 0.005–0.09 MtCO₂/year，按假设的 1–3 个项目、每台供应商设计的 5,000–30,000 t/year 计算。实际验收吨位可能更低；没有服务价格和项目成本，无法可靠估算美元市场规模。
  segments:
    - >-
      主要客户：欧洲水泥或化工厂运营商，有点源排气和厂内碳酸盐工艺，并希望获得资金支持开展捕集示范。
    - >-
      次要客户：能够为捕集 CO₂ 原料明确规格、完成资格确认并签约采购的碳酸盐生产商或工艺负责人。
  buyingProcess: >-
    工厂经理或 CFO 负责发起项目并付款；工艺工程、采购和合规团队审核集成、可靠性和核算。碳酸盐买方另行批准规格、数量、交接和拒收条款。工程投入或设备融资前，先落实附条件的买方需求和客户场地准入；竞争性补助可能支持首批项目，但不代表有持续需求。
product:
  mvp: >-
    为一组工厂—碳酸盐用户提供项目开发和运营服务：筛查源气和场地、确定买方规格并争取附条件承购、协调供应商及 EPC 设计、在交接点独立计量，并签订付费示范合同。不制造膜材料，也不提供没有数据支撑的捕集保证。
  sixMonth: >-
    完成首轮候选组合筛查，为优先客户收集场地气体和需求数据，取得供应商/EPC 报价，并在选定试点前与买方商定验收方案。
  twelveMonth: >-
    签下一份由双方共同发起的付费 pre-FEED 或附条件试点协议，明确买方规格和最低数量曲线；同时制定独立测试计划、审查许可要求，并拿出基于报价的项目模型。上述门槛全部通过前，不订购设备。
  twentyFourMonth: >-
    首个示范达到验收、开机率和成本门槛后，将合同、计量方案和运营手册标准化，再融资复制一个场地——若首个场地未达标，就停止部署或更换捕集路线，不扩大尚未得到验证的膜设备车队。
  keyBets:
    - >-
      客户投入设备资本前，碳酸盐买方会先按明确的质量和连续性标准签约采购捕集 CO₂。
    - >-
      针对具体场地的膜性能和预处理需求，能满足买方要求，又不至于耗尽替代传统原料所带来的价值。
    - >-
      客户足够看重转移验收产出风险，愿意支付开发费和按验收吨位计费的服务费。
    - >-
      项目层面的融资或补助结构，能为安装出资，而不让运营公司在企业资产负债表上持有不经济的设备车队。
gtm:
  wedge: >-
    直接撮合一家工厂与一家厂内碳酸盐买方，共同制定附条件示范方案；只有气体适配性、验收条款和最低需求都有书面记录后，才投入设备资本。
  channels:
    - >-
      由创始人主导拓展客户，直接对接工厂脱碳、资本项目、工厂管理和碳酸盐工艺/采购负责人。
    - >-
      通过膜供应商、工业 EPC/调试公司和本地工业共生集群引荐客户并开展技术评估；同时保留其他供应商选项。
    - >-
      与明确的客户和承购方建立联系后，再申请符合条件的 EU 欧盟或国家级示范补助；补助能否获批尚不确定，属于项目资金，不是销售渠道，也不能证明客户有付费意愿。
  funnelTargets: >-
    这是工作目标，不是已观察到的转化率：筛查研究发现的 5–15 组候选排放源—买方组合，通过双方访谈和场地数据至少确认 3 组，并在 12 个月内推动 1 组进入双方共同发起的付费 pre-FEED 或附条件承购流程。
  pricing: >-
    收取场地开发/调试费，再按经独立计量、并由买方按其规格验收的吨位收取持续服务费。价格要参考买方当前的替代供应方案和有报价支撑的项目交付成本；目前没有公开费率或 ACV。只有取得开机率数据后才测试可用率保底条款，基础模型不计入未经核实的碳信用或 ETS 价值。
businessModel:
  revenueStreams:
    - >-
      客户按约定的项目范围支付场地筛查、开发和调试费用。
    - >-
      按经独立计量并由签约碳酸盐买方验收的吨位，持续收取运营服务费。
    - >-
      只有在试点验证开机率且服务责任完成定价后，才加入可用率收费部分。
  unitOfValue: >-
    计费单位是买方约定的交接点上，达到质量规格并获验收的每吨 CO₂；铭牌捕集产能不能计费。
  targetGrossMarginPct: null
  expansionLevers:
    - >-
      将经验证的合同、计量方案和供应商/EPC 配套方案复制到其他合格的排放源—买方组合。
    - >-
      首个场地的运营数据足以支持项目承保后，引入项目层面资本伙伴和第二家合格捕集设备供应商。
    - >-
      其他碳酸盐用户或非本地去向，只有在需求、监管处理和交付经济性分别得到验证后才考虑。
strategyMap:
  northStarMetric: >-
    运营合同下按买方规格验收的年 CO₂ 吨位（经独立计量），且场地层面贡献为正。
  inputMetrics:
    - 有经核实气体数据和明确买方决策人的排放源—买方组合数量。
    -     交接点上经买方验收的捕集吨位占比。
    - 试点可用率、拒收率和每吨验收 CO₂ 的成本。
    - 合格组合转化为付费 pre-FEED 和附条件承购的比例。
    - 设备资本中，仅在买方和融资门槛通过后才投入的比例。
  moatsToBuild:
    - >-
      积累跨场地数据，串起源气变化、膜状态、能耗、停机时间、交付气体成分和买方验收结果。
    - >-
      验证工厂—承购方合同，明确质量、连续性、交接、拒收规则和责任。
    - >-
      建立不依赖单一供应商的技术评估和项目承保方法，并在不同工厂重复应用。
  killCriteria:
    - >-
      到第12个月，筛查 5–15 组候选组合后，仍没有至少一组取得买方认可的规格和附条件数量承诺。
    - >-
      经过 90 天示范，捕集的 CO₂ 验收率低于 80% 或开机率低于 85%；此时不得承诺可用率，也不得复制部署。
    - >-
      按供应商报价计算，若服务费低于买方当前替代供应方案就无法实现正的场地贡献，且项目还得依赖碳信用或 ETS 价值才能成立。
    - >-
      自下而上的市场梳理确认的欧洲可行排放源—买方组合少于 5 组；除非另一个相邻细分市场单独得到验证，否则放弃设备车队扩张计划。
  mermaid: |
    flowchart LR
      Pair[Matched host and carbonate buyer] --> Gate[Buyer spec and conditional demand]
      Gate --> Pilot[Metered membrane demonstration]
      Pilot --> Proof[Accepted tonnes and no-credit economics]
      Proof --> Repeat[Project-financed repeat site]
investorMemo:
  verdict:
    call: Watch
    conviction: >-
      信心偏低至中等：应用场景具体，但客户承诺、项目经济性和合同差异化都尚未得到验证。
    whyBelieve: >-
      有报道称 Qemetica 的现场测试将膜捕集与计划中的厂内碳酸盐生产联系起来；公开的工业资金也证明，项目层面存在捕集预算。
    whyDoubt: >-
      没有公开资料能证明已有验收吨位合同、买方规格、重复商业需求或独立项目经济性；最接近的技术与应用组合也已存在。
    nextDiligence: >-
      先取得买方认可的规格和附条件数量协议，再测试真实气流，并在投入示范资金前基于报价编制不依赖碳信用的项目模型。
  firstCustomer:
    title: >-
      厂内生产碳酸盐的欧洲水泥或化工客户
    profile: >-
      欧洲工业运营商，其点源排气与碳酸盐生产线相邻，且全年都有原料需求；优先在波兰拓客，但不预设有报道的 Qemetica 测试就是销售线索。
    trigger: >-
      客户正在审批捕集示范，碳酸盐工艺负责人也在规划原料供应，并能明确验收规格和数量曲线。
    buyer: >-
      服务费由工厂总经理或 CFO 支付；碳酸盐工艺/采购负责人是必需的承购方和规格签署人。
    initialContract: >-
      现有证据无法确定以美元计价的试点/ACV 区间或标准期限。争取先签付费开发或调试范围，再转成按场地验收吨位计费的示范合同；只有独立验证开机率和买方验收后，才提供多年期服务。
  mustBeTrue:
    - >-
      至少一组客户和碳酸盐买方在 12 个月内签订附条件协议，写明可计量的 CO₂ 规格、最低数量曲线、验收点和拒收规则。
    - >-
      对真实排气开展独立的 90 天测试，捕集吨位至少有 80% 获买方验收，开机率至少达到 85%；或者在任何服务保证出台前，双方先议定新的性能门槛。
    - >-
      供应商报价中的 CAPEX、能耗、维护、更换和融资成本，须支持场地层面贡献为正，且收费水平为客户和买方所能接受；不得假设碳信用或 ETS 减免。
    - >-
      自下而上的欧洲场地审查确认至少有 5 组排气技术适配、碳酸盐需求可识别且决策人可触达的组合；目前 5–15 组的范围仅是运营方初筛。
    - >-
      首批验收产出数据到手后，至少有一种项目融资或补助支持的结构能为重复安装出资，无需运营公司承担全车队的资本开支。
  diligenceQuestions:
    - >-
      首位碳酸盐买方愿按什么规格、年度及季节性数量、拒收权和价格签约？与其当前传统 CO₂ 供应相比如何？
    - >-
      目标工厂气流的成分、回收率、纯度、开机率、能耗、预处理需求、结垢情况和滤芯寿命，经独立计量分别是多少？
    - >-
      供应商报价的安装 CAPEX、运营成本、模块更换和融资需求是多少？性能和供气中断责任由谁承担？
    - >-
      碳酸盐产品及其后续去向能否获得具体的排放核算处理？如果没有 ETS 减免、碳信用或永久封存主张，项目还能否成立？
    - >-
      经工厂层面核实后，有多少欧洲排放源—碳酸盐买方组合符合场地、需求、气体适配、许可和距离要求？
    - >-
      首次和第二次安装能获得什么补助、客户出资和项目融资条款？仍有多少股权资本面临风险？
operatingAssumptions:
  - assumption: >-
      设备融资前，客户附近的碳酸盐买方会按针对该场地的质量和连续性规格签约承诺最低采购量。
    basis: research.yaml
    validationTest: >-
      在批准试点采购订单前，取得买方工艺/采购负责人的书面认可，确认规格草案、季节性数量曲线、拒收流程和附条件承购安排。
    decisionImpact: >-
      若没有买方愿意承诺，就不为撬装设备融资；停止碳酸盐切口，或单独验证其他去向。
  - assumption: >-
      估算的 5–15 组欧洲排放源—买方组合中，至少有 5 组通过工厂层面的气体适配、需求、距离和决策人触达筛查。
    basis: research.yaml
    validationTest: >-
      前六个月为候选场地建档，并逐一核实工艺负责人、源气数据、碳酸盐产能、运输距离和项目时间。
    decisionImpact: >-
      若合格组合少于 5 组，就下调可支撑风险投资规模的预期，不招聘团队，也不为多场地设备车队融资。
  - assumption: >-
      合格的膜供应商能处理真实排气，在可接受的开机率和预处理成本下达到买方规格。
    basis: research.yaml
    validationTest: >-
      独立采集源气样本并开展受监测试点，在正常和异常工况下报告纯度、回收率、能耗、开机率、拒收、结垢和模块更换。
    decisionImpact: >-
      若膜路线失败，只在验收和成本测试仍可行时比较其他捕集架构；否则停止项目。
  - assumption: >-
      客户愿意支付开发费和按验收吨位计费的服务费，以转移集成和性能风险，而不是选择传统供应合同或厂方自有 EPC 项目。
    basis: idea.yaml
    validationTest: >-
      向客户 CFO/工厂负责人和碳酸盐买方提交有价格的开发范围及结果挂钩条款草案，并要求书面确认预算归属和继续推进的条件。
    decisionImpact: >-
      若客户不愿付费或分担风险，就不能仅凭技术兴趣为设备承保。
  - assumption: >-
      不计碳信用、且有报价支撑的项目模型，能以双方可接受的服务费覆盖运营和融资成本。
    basis: research.yaml
    validationTest: >-
      对比独立的供应商/EPC CAPEX 和 OPEX 报价、买方当前原料成本、能源及公用设施成本、补助条件和合同收费上限；任何排放核算收益主张都须经律师审查。
    decisionImpact: >-
      若项目只有依赖未经核实的碳信用或买方溢价才能成立，就不投资，也不设定设备车队的毛利率目标。
  - assumption: >-
      $3–5M 的 pre-seed 目标足以支撑 18 个月的精干团队、场地尽调、试点工程、独立计量和首笔项目出资，同时项目资产另行融资。
    basis: operator judgment
    validationTest: >-
      取得供应商报价、明确试点范围、核实补助资格并获得项目融资意向后，重新测算融资额；公司现金跑道与模块全额 CAPEX 分开计算。
    decisionImpact: >-
      若首个场地的股权资金需求超过公司本轮融资，就推迟部署，等客户、补助或项目 SPV 为资产出资；不能悄悄提高融资额或扩大资产负债表风险。
experimentRoadmap:
  - horizon: 0–90 天
    experiment: >-
      梳理候选排放源—碳酸盐用户组合，访谈最有希望的三组候选组合的工厂端和承购方，先从波兰开始。
    hypothesis: >-
      至少三组组合有明确决策人、合理的本地碳酸盐需求曲线，并愿意共享场地数据。
    successMetric: >-
      记录三组组合通过初步商业筛查的证据，包括负责人、工艺、需求、时间和下一步；否则重新评估研究估算的 SAM 范围。
    owner: CEO / 项目开发负责人
  - horizon: 0–90 天
    experiment: >-
      向工厂资本项目负责人及碳酸盐工艺/采购负责人测试验收吨位条款草案和付费场地开发范围。
    hypothesis: >-
      客户和买方愿在客户订购捕集设备前，共同商定规格并承诺附条件需求。
    successMetric: >-
      有一组组合提交买方审阅过的规格，并由客户书面表示愿为明确范围的 pre-FEED 出资或共同出资；口头兴趣不算通过。
    owner: CEO / 商务负责人
  - horizon: 3–6 个月
    experiment: >-
      取得真实气流样本，向膜供应商和一家 EPC 征集可比的技术/商务方案，并进行独立工程审查。
    hypothesis: >-
      至少一种模块化方案能处理采样气流，满足买方的规格草案，且无需高昂的预处理成本或过多能耗。
    successMetric: >-
      拿到场地气体报告、分项的安装和运营报价，以及明确列出未知项的工程建议；供应商铭牌数据不能替代场地数据。
    owner: 创始工艺工程师
  - horizon: 3–9 个月
    experiment: >-
      与独立计量方和监管律师共同制定买方的采样、交接、拒收、连续性和责任方案。
    hypothesis: >-
      买方能接受可审计的测试方案，客户也能运营这项服务，而不依赖未经核实的 ETS 或永久封存处理。
    successMetric: >-
      取得买方认可的计量和拒收方案，以及一份书面、针对具体司法辖区的核算备忘录，明确项目不得作出的主张。
    owner: 工艺工程师与外聘 MRV 律师
  - horizon: 6–12 个月
    experiment: >-
      推动最优组合签署附条件试点合同，并落实分阶段补助/项目融资方案。
    hypothesis: >-
      明确的需求和验收门槛，能吸引客户资本、合格补助或项目层面融资，不必为推测性的捕集产能出资。
    successMetric: >-
      设备订购前，拿到一份由工厂和承购方签署的附条件框架协议、付费 pre-FEED 范围、供应商报价的试点预算，以及书面项目资金来源。
    owner: CEO 与项目融资律师
  - horizon: 12–18 个月
    experiment: >-
      仅在合同、许可和资金门槛通过后调试首个示范项目，再开展由独立方见证的 90 天运营测试。
    hypothesis: >-
      真实排气能稳定产出买方认可的 CO₂，开机率足够高，成本也为客户和买方所能接受。
    successMetric: >-
      目标是捕集吨位至少有 80% 获验收，开机率至少达到 85%；记录能耗、成本、拒收、维护和更换数据。测试失败就不得扩大设备车队。
    owner: 运营负责人及独立计量服务商
operations:
  - >-
    按阶段门槛执行项目清单：设备订购前必须落实明确的承购方和验收条款、源气采样与检测、场地集成方案、许可/核算审查、有报价支撑的经济模型和融资交割。
  - >-
    技术条件允许时，不把捕集硬件绑定给单一供应商；将膜性能与可信的替代捕集路线对比，不能把供应商的设计指标或主张当作场地实绩。
  - >-
    委托独立采样，并在交接点计量质量和物料量；妥善留存验收与拒收吨位、开机率、能耗、停机和模块状态的审计记录。
  - >-
    由工业 EPC/调试合作方负责配套设施和工厂集成；调试前明确谁负责工艺中断、维护和不合格气体。
  - >-
    聘请熟悉 EU/国家级法规的专业律师审查 CO₂ 利用、ETS/MRV、产品去向和许可要求；未经书面核实，不得主张任何减免、碳信用或永久封存价值。
  - >-
    有选择地申请补助，只有在需求附条件落实后才安排项目层面资本；不能假设每个本地利用项目都有补助或封存基础设施可用。
team:
  - role: 创始人 / CEO，工业项目开发
    startTiming: 第 0 个月
    rationale: >-
      负责工厂端和承购方的双边销售、付费开发范围、合作伙伴拓展，以及补助/项目资本的推进顺序；计划要求设备投入前两方都要有决策人参与。
  - role: 创始工艺工程师
    startTiming: 第 0 个月
    rationale: >-
      负责源气资格评估、膜/EPC 方案比较、场地集成、运营计量和供应商质询；场地实测表现是最关键的技术证伪点。
  - role: 独立 MRV 与监管律师
    startTiming: 第 0 个月，外聘
    rationale: >-
      明确买方验收、交接点采样、CO₂ 利用核算和许可要求；在此阶段不必提前组建完整合规团队，也不能宣称有 ETS 收益。
  - role: 项目融资与合同负责人
    startTiming: 第 6–9 个月，须有合格组合
    rationale: >-
      买方和场地落实后，再设计项目层面资本、责任、质保和附条件承购安排；管线未通过首批门槛前，暂不设常设岗位。
  - role: 调试与运营负责人
    startTiming: 第 9–12 个月，须有已融资试点
    rationale: >-
      项目融资落实后，负责场地安全、EPC 协调、调试、开机率和服务交付；安装前先用专业承包商，不要过早组建设备车队团队。
milestones:
  - horizon: 0–12 个月
    items:
      - >-
        筛查估算的 5–15 组欧洲组合，记录至少三个合格客户，并分别访谈买方和工厂端。
      - >-
        拿到一份买方审阅过的规格、附条件数量曲线和付费 pre-FEED 或同等客户承诺；否则不订购设备。
      - >-
        完成独立源气分析、供应商/EPC 报价、验收/MRV 方案、许可/核算审查和不依赖碳信用的项目模型。
      - >-
        为首个安装项目落实分阶段补助、客户资本或项目融资方案；递交申请不等于获批。
  - horizon: 12–24 个月
    items:
      - >-
        只有合同、技术、监管和融资门槛都通过后，才在工厂与承购方匹配的场地调试一个示范项目。
      - >-
        完成由独立方见证的 90 天测试，目标是捕集吨位至少 80% 获验收、开机率达到 85%；记录每吨验收 CO₂ 的成本及所有拒收、能耗、停机和维护数据。
      - >-
        只有买方验收、场地贡献和责任上限均得到验证后，才转为多年期服务；否则停止或重新设计，不承诺性能。
  - horizon: 24–36 个月
    items:
      - >-
        只有首个场地达到约定的验收和不依赖碳信用的经济性门槛后，才能为一次重复安装安排项目级融资。
      - >-
        建立可比的运营数据集和标准化排放源—买方合同包；只有首个复购项目按客户支持的条款签约，累计运营组合目标才定为两组。
      - >-
        根据已验证的场地组合重新估算可服务市场；确认的可行组合少于五组时，暂缓进入新地区、开发新产品或持有硬件。
risks:
  - risk: >-
      真实排气的波动、杂质、膜降解或预处理需求，可能导致产出无法稳定通过买方验收。
    likelihood: High
    impact: High
    mitigation: >-
      投入资本前先采集场地气体数据并比较供应商；示范项目须独立调试，协商明确、可计量的拒收规则；验收或开机率未达标就停止部署。
  - risk: >-
      同时具备适配气体、厂内碳酸盐需求和签约意愿买方的场地太少，销售管线可能狭窄且推进缓慢。
    likelihood: High
    impact: High
    mitigation: >-
      审核估算的 5–15 组组合，每个场地都要先确认明确需求和数量证据；按第 12 个月的组合数量淘汰标准决策，不为不匹配的排放方捕集。
  - risk: >-
      设备、安装、能耗或融资成本可能超过相较于传统 CO₂ 供应方案客户可负担的服务费。
    likelihood: High
    impact: High
    mitigation: >-
      取得供应商/EPC 分项报价，将支出设在承购和项目资本门槛之后，排除未经核实的碳价值，也不以公司资产负债表为设备车队融资。
  - risk: >-
      碳酸盐产品中的 CO₂ 利用可能无法获得假设的排放核算处理，也无法证明永久封存或净收益。
    likelihood: Medium
    impact: High
    mitigation: >-
      获取针对具体司法辖区的 MRV、ETS 和产品去向意见；只有在有记录支撑时才按原料替代和客户价值测算项目，不得在没有证据时宣称效果等同封存。
  - risk: >-
      UniSieve/Qemetica、捕集设备供应商、EPCs 或工厂团队可能捆绑融资和验收产出责任，抹去拟议服务切口。
    likelihood: Medium
    impact: High
    mitigation: >-
      在客户访谈中测试客户对一体化合同的付费意愿，保留多种技术路线；只有靠付费运营才能积累差异化的项目承保和验收数据。若现有厂商能以更低风险提供相同条款，就停止推进。
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: >-
    暂定规划目标为 $3–5M；因没有公开项目成本或服务价格，须根据供应商报价、试点范围、补助条件和项目融资条款重新测算。
  runwayMonths: 18
  useOfFundsSummary: >-
    这笔为期 18 个月的 pre-seed 融资将支撑精干的项目开发和工艺团队、双边客户资格验证、场地及气体研究、独立计量设计、合同/监管工作、试点工程，以及首笔项目公司出资。资金要换来一个附条件、可融资的示范决策，而不是一支全套 5–30 kt/year 模块设备车队；首笔出资以外的资产 CAPEX，必须在需求和技术门槛通过后由客户、补助或项目层面资本承担。
