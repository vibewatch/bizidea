differentiator: >-
  Membrane vendors sell separation technology, while this company sells a contracted outcome at the point where
  captured gas becomes a usable industrial input. It commits capital only after matching a host to an offtaker and
  links its fee to independent product acceptance, not a capture-rate estimate; it does not depend on carbon-credit
  revenue in its initial project economics.
