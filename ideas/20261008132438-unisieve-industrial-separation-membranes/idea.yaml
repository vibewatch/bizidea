problem: >-
  An industrial site evaluating membrane capture has to solve more than gas separation: it must fund a retrofit,
  prove stable output against a buyer's process specification, and secure a usable destination for the captured
  molecule. A design-capacity claim alone does not show that a plant can deliver accepted CO₂ at a repeatable cost.
  Without an offtake-backed performance contract, the emitter bears the integration risk while the carbonate buyer
  has little reason to depend on a new, unproven feedstock.
targetUser:
  primary: "Decarbonization or capital-project leads at European industrial sites with a point-source exhaust stream and an on-site carbonate process able to consume captured CO₂."
  secondary: "Process and procurement leaders at carbonate manufacturers seeking a reliable captured-CO₂ feedstock."
  buyer: "The industrial host's plant general manager or CFO, with the carbonate producer as the contracted offtaker."
startupThesis:
  nonObviousInsight: >-
    For some industrial sites, the first bankability problem is not selling a carbon-abatement claim but identifying
    a nearby user that will accept captured CO₂ as a process input. A signed, quality-specific feedstock contract
    can anchor a membrane service around delivered product rather than an unverified nameplate capture rate.
  beachhead: >-
    European industrial sites that can use captured CO₂ onsite in carbonate production, beginning with a
    demonstration-scale source–buyer pair and expanding to cement sites only where an identified carbonate user
    and site-specific gas fit are verified.
  wedge: >-
    A financed, operated membrane-capture service for one industrial host, with host-side service payments tied to
    metered CO₂ that passes the offtaker's agreed quality and continuity tests.
  whyNowCatalyst: >-
    UniSieve's $9M Series A and its reported pre-commercial manufacturing readiness coincide with trade-press
    reporting of Qemetica's live test and planned onsite carbonate use; the combination suggests a near-term
    demonstration window, not yet proven commercial demand.
  ventureScalePath: >-
    Build repeatable project underwriting, gas-quality verification, and offtake contracting for more industrial
    source–buyer pairs; add qualified membrane suppliers and expand to other point-source streams and industrial
    molecules with local buyers, financing mature deployments through project-level capital.
solution: >-
  The company first screens an industrial host's exhaust, site constraints, and carbonate buyer's required
  composition and delivery profile; it declines projects without a credible onsite use and signed demand.
  It finances, installs, and operates a modular membrane skid sourced from a qualified membrane manufacturer,
  measuring accepted CO₂ at the buyer's transfer point rather than relying on nameplate capacity. The host pays
  a development or availability fee plus a per-tonne service charge only for CO₂ that meets the agreed specification,
  while the buyer separately contracts for the captured feedstock. Initial projects use independent commissioning
  and measurement to test performance and economics before the company finances a wider fleet.
goToMarketSeed:
  firstCustomer: "A European cement or chemical-site operator with a point-source stream, an on-site carbonate user, and a funded need to test modular CO₂ capture at demonstration scale."
  buyingTrigger: "A site is approving a capture demonstration while its on-site carbonate operation is planning feedstock supply and can define a CO₂ acceptance specification."
  currentAlternative: "A one-off capture/EPC project, heat-dependent chemical separation, or continued sourcing of conventional CO₂ feedstock without linking the purchase to a local capture retrofit."
  switchingReason: "The operator pays for accepted output rather than design capacity, while the buyer's signed specification and demand give the capture project a concrete use for its product."
  pricingHypothesis: "A commissioning/development fee plus a recurring service charge per independently metered tonne accepted to specification; test a small availability floor only after pilot uptime is demonstrated."
