ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "The wedge changes the unit sold from membrane capacity to locally accepted CO₂ feedstock, using offtake to condition project capital and payment."
  venturePotential:
    score: 4
    rationale: "Repeatable project development and financed deployments could build a large industrial service business, but each installation requires capital and a viable local buyer."
  whiteSpace:
    score: 3
    rationale: "The source evidence identifies competing membrane and capture approaches, so this is a distinct commercial wrapper rather than evidence of an empty capture market."
  painIntensity:
    score: 4
    rationale: "Industrial separation is heat-dependent in the reported alternative, and a capture project faces consequential retrofit, performance, and product-outlet risks."
  wedgeClarity:
    score: 4
    rationale: "A single source–buyer demonstration with a defined CO₂ acceptance specification is a testable first deployment; suitable site pairs may be rare."
  evidenceFit:
    score: 3
    rationale: "The briefs support pre-commercial membrane development, one reported live test, and a potential carbonate use, but not verified operating economics, independent performance, or signed repeat demand."
topRisks:
  - name: Membrane performance
    description: "Real exhaust variation, uptime, or product quality may prevent the skid from consistently meeting a carbonate buyer's acceptance specification."
    mitigation: "Commission at demonstration scale, use independent gas measurement, and make service payments conditional on accepted output rather than design estimates."
  - name: Scarce local offtake
    description: "Few sites may combine a suitable exhaust stream with enough onsite carbonate demand, limiting repeatable project volume."
    mitigation: "Require a buyer specification and minimum demand commitment before equipment financing, and reject unmatched sites instead of building speculative capacity."
  - name: Capital and project risk
    description: "Financing, installation delays, or operating costs may exceed the margin available from accepted CO₂ service fees."
    mitigation: "Stage capital against commissioning gates, secure host service commitments, and underwrite early projects without assuming unverified carbon-credit income."
