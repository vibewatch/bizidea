ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: "它的切口是把销售单位从膜的产能改成当地买方验收的 CO₂ 原料，并让项目资本投入和付款都以承购为前提。"
  venturePotential:
    score: 4
    rationale: "可复制的项目开发和融资部署有机会长成大型工业服务业务，但每套装置都要投入资本，也必须找到合适的本地买方。"
  whiteSpace:
    score: 3
    rationale: "来源证据已指出其他膜技术和碳捕集方案；它的差异在商业合作架构，并不代表捕集市场缺少其他方案。"
  painIntensity:
    score: 4
    rationale: "报道中的替代方案依赖热能；捕集项目还面临重大的改造、性能和产品去向风险。"
  wedgeClarity:
    score: 4
    rationale: "从一组排放源—买方配对和明确的 CO₂ 验收标准切入，首个部署可以直接检验；但合适的现场组合可能很少。"
  evidenceFit:
    score: 3
    rationale: "简报支持膜技术已进入商业化前阶段、有一项媒体报道的现场测试，也指出潜在碳酸盐用途；但没有经验证的运行经济性、独立性能数据或有签约支撑的重复需求。"
topRisks:
  - name: 膜性能不达预期
    description: "实际尾气波动、正常运行时间或产品质量可能导致撬装装置无法持续达到碳酸盐买方的验收标准。"
    mitigation: "以示范规模调试，采用独立气体计量，并把服务费与验收合格的产出挂钩，而不是设计估算。"
  - name: 本地承购需求稀缺
    description: "符合条件的现场可能很少：既有合适的尾气，又有足够的厂内碳酸盐需求，难以形成可重复的项目规模。"
    mitigation: "设备融资前先拿到买方标准和最低需求承诺；找不到匹配买方的现场就不接，不建投机性产能。"
  - name: 资本与项目执行风险
    description: "融资成本、安装延误或运营成本可能超过验收合格 CO₂ 服务费能提供的利润空间。"
    mitigation: "按调试关口分阶段投入资本，落实工业企业的服务承诺；承保早期项目时，不预设未经验证的碳信用收入。"
