differentiator: >-
  膜供应商卖分离技术；这家公司卖合同约定的结果——让捕集气体在交付点成为可用的工业原料。先为工业企业匹配承购方，公司才投入资本；服务费取决于产品是否经独立计量并获买方验收，而非估算捕集率。首批项目的经济模型不依赖碳信用收入。
