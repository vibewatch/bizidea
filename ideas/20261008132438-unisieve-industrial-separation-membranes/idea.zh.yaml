problem: >-
  工业现场评估膜法捕集时，难题不止是分离气体：还得为改造项目筹资，证明产出稳定符合买方的工艺标准，并为捕集到的分子找到可用去处。光有设计产能的说法，不能证明工厂能以可重复的成本交付买方验收合格的 CO₂。没有承购协议托底的绩效合同，集成风险就落在排放企业身上；碳酸盐买方也没有充分理由依赖一种新且未经验证的原料。
targetUser:
  primary: "欧洲工业现场的脱碳或资本项目负责人；这些现场有点源尾气，且厂内碳酸盐工艺能消纳捕集到的 CO₂。"
  secondary: "碳酸盐生产商的工艺和采购负责人；他们需要可靠的捕集 CO₂ 原料。"
  buyer: "工业现场工厂的总经理或 CFO；碳酸盐生产商作为签约承购方。"
startupThesis:
  nonObviousInsight: >-
    在一些工业现场，项目能否融资，首先不看减排主张能否出售，而看能否找到附近愿意把捕集 CO₂ 当作工艺原料的用户。签下明确质量标准的原料合同，膜法服务就能以实际交付的产品为基础，而非以未经验证的铭牌捕集率为依据。
  beachhead: >-
    先服务能在厂内把捕集 CO₂ 用于碳酸盐生产的欧洲工业现场，从一组示范规模的排放源—买方配对起步；只有碳酸盐用户明确、且现场气体条件匹配得到验证，才扩展到水泥厂。
  wedge: >-
    为一家工业企业融资并运营膜法捕集服务；厂方支付的服务费与计量后通过承购方质量和连续性测试的 CO₂ 量挂钩。
  whyNowCatalyst: >-
    UniSieve 完成 $9M Series A 融资，并称其制造能力已达到商业化前准备水平；同期行业媒体报道称 Qemetica 已开展现场测试，并计划在厂内生产碳酸盐。这些信号打开了近期的示范窗口，但商业需求尚未得到验证。
  ventureScalePath: >-
    为更多工业排放源—买方配对建立可复制的项目承保、气体质量验证和承购合同流程；接入更多合格膜供应商，再拓展到其他点源气流和有本地买家的工业分子，并用项目级资本为成熟部署融资。
solution: >-
  公司先评估工业企业的尾气、现场限制，以及碳酸盐买方要求的成分和交付节奏；没有可信的厂内用途和已签需求，就不接项目。公司再从合格膜制造商采购模块化膜撬装设备，并负责融资、安装和运营。公司在买方交接点计量通过验收的 CO₂，不拿铭牌产能当作实际交付量。工业企业支付开发费或可用性费；只有交付的 CO₂ 符合约定规格，才按吨收取服务费。买方则单独签约采购捕集到的原料。首批项目采用独立调试和计量，先验证性能与经济性，再为更大规模的装置群融资。
goToMarketSeed:
  firstCustomer: "欧洲水泥厂或化工厂运营商；厂内有点源气流和碳酸盐用户，也有资金支持的需求，要以示范规模测试模块化 CO₂ 捕集。"
  buyingTrigger: "工厂批准捕集示范项目时，厂内碳酸盐业务也在规划原料供应，并能明确 CO₂ 验收标准。"
  currentAlternative: "一次性捕集/EPC 项目、依赖热能的化学分离，或继续采购常规 CO₂ 原料而不把采购与本地捕集改造挂钩。"
  switchingReason: "运营商按验收合格的产出付费，而非按设计产能付费；买方签署的验收规格和明确需求也让捕集项目有了具体的产品去向。"
  pricingHypothesis: "收取调试/开发费，再按独立计量且符合规格的每吨 CO₂ 收取持续服务费；只有试点证明设备正常运行后，才测试小额可用性费保底。"
