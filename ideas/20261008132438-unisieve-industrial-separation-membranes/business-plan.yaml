slug: offtake-backed-carbon-capture
date: 2026-10-08
executiveSummary: >-
  Build a financed-and-operated capture service for European industrial hosts
  whose CO₂ can be used directly in an onsite carbonate process; bill only for
  independently metered CO₂ accepted by the buyer, not installed capacity.
  Start with one jointly qualified host–offtaker pair, prioritizing Poland
  because Qemetica has a reported live test there, but do not treat Qemetica as
  an available customer or the test as a commercial contract. The economic
  buyer is the host's plant general manager or CFO, while the carbonate process
  owner must define and accept the feedstock specification before equipment is
  financed. Research supports a tangible local-use pilot and active industrial
  capture funding, but reports no accepted-tonne service contract, buyer
  specification, repeat order, or independently verified operating economics.
  The closest analogue already pairs UniSieve membranes with Qemetica's
  intended onsite carbonate use; differentiation must therefore come from
  bankable contracting, operations, and measurement rather than claiming a
  novel capture technology or source–buyer pairing. The researched European
  throughput TAM, SAM, and SOM are screening estimates in tonnes per year, not
  verified addressable volume or a dollar revenue market. A pre-seed round
  funds 18 months of buyer qualification, site engineering, independent
  testing, and a gated first demonstration; it does not assume full-fleet
  equipment financing or carbon-credit revenue. Investment conviction stays
  low until one buyer commits to a quality and volume specification, a real
  stream passes independent acceptance tests, and a quote-based project case
  works without unverified ETS treatment or a CO₂ premium.
problem:
  - >-
    An industrial host considering capture must fund and integrate equipment,
    while the carbonate buyer needs reliable composition, continuity, and
    rejection rules before replacing conventional CO₂ supply.
  - >-
    A supplier's design capacity or capture-rate estimate does not establish
    accepted tonnes, uptime, energy use, replacement cost, or cost per usable
    tonne on a specific exhaust stream.
  - >-
    Without a named local user and a contracted acceptance point, the host
    retains retrofit and offtake risk and the buyer can rationally keep its
    established feedstock source.
solution:
  - >-
    Qualify the host exhaust, site layout, utility needs, and carbonate
    process demand together; decline projects without a defined buyer,
    buyer-approved specification, and credible volume commitment.
  - >-
    After conditional host and offtaker commitments, procure a suitable
    modular capture skid from a qualified supplier, arrange site integration,
    and contract independent measurement at the buyer's transfer point.
  - >-
    Charge development and commissioning fees plus a service fee per accepted
    tonne; defer any availability floor until pilot uptime is demonstrated
    and do not rely on carbon-credit revenue in the initial case.
whyWeWin:
  - >-
    The proposed product joins project development, financing, operation, and
    buyer acceptance in one contract; the value is shifting performance risk
    away from the host, not inventing membranes or local carbonate use.
  - >-
    Repeated source-gas, uptime, quality, rejection, and cost data could make
    underwriting and service guarantees more reliable, but this is a moat to
    build only after paid deployments, not an existing advantage.
  - >-
    A membrane vendor, EPC, plant team, or conventional CO₂ supplier can win
    by default if it offers lower delivered cost, simpler liability, or the
    same acceptance-linked service; the first sale must prove customers value
    the integrated contract.
strategicChoices:
  beachhead: >-
    One European industrial host with a point-source exhaust stream and an
    onsite carbonate user, with Poland first for account discovery because a
    Qemetica membrane test and intended carbonate use are reported there;
    target a different or separately available account rather than assuming
    access to Qemetica.
  wedgeRationale: >-
    A single named source–buyer pair makes specification, demand, and
    transfer-point acceptance observable before committing project capital.
    It is a faster falsification path than a broad CO₂ marketplace or
    technology rollout, but the pair may be scarce and every installation
    needs capital, so the company must reject unmatched emitters and accept
    slower growth.
  sequencingRationale: >-
    First prove buyer specification, minimum demand, and site gas fit; then
    price and contract a demonstration, secure grant or project-level capital,
    and commission with independent measurement. Add project-finance capacity
    and repeat deployments only after accepted output and no-credit economics
    are evidenced, limiting early hiring and balance-sheet exposure.
  notYet:
    - >-
      Do not capture for an emitter without a named local carbonate user and
      conditional offtake, even if the exhaust appears technically suitable.
    - >-
      Do not build membrane manufacturing, a broad CO₂ marketplace, or a
      software-only monitoring product; buy qualified equipment and deliver
      the project outcome.
    - >-
      Do not price the first projects on carbon credits, assumed ETS relief,
      a green premium, or geological storage; assess each only as a separately
      verified fallback or future pathway.
    - >-
      Do not expand to unrelated industrial gases or carbonate markets until
      the first accepted-tonne contract and project economics repeat.
market:
  tam: >-
    10.0 MtCO₂/year theoretical European cement throughput ceiling, calculated
    in research from an operator-estimated 200 sites times one supplier-designed
    50,000 t/year module per site. The site count is not audited and the module
    capacity is a supplier estimate; this is not a revenue TAM or an economic
    capture forecast.
  sam: >-
    0.25–0.75 MtCO₂/year candidate-pair throughput, based on an operator screen
    of 5–15 potential European source–carbonate pairs times up to 50,000
    t/year. The retained research identifies one reported pilot, not a verified
    count of viable pairs; validate demand, gas fit, and buyer terms.
  som: >-
    0.005–0.09 MtCO₂/year initial demonstration capacity over the first five
    years, based on an assumed 1–3 projects at supplier-designed 5,000–30,000
    t/year per unit. Accepted tonnes may be lower; no dollar market estimate
    is supportable without service prices and project costs.
  segments:
    - >-
      Primary: European cement or chemical-site operators with point-source
      exhaust and an onsite carbonate process seeking a funded capture
      demonstration.
    - >-
      Secondary: carbonate producers or process owners able to specify,
      qualify, and contract for captured CO₂ feedstock.
  buyingProcess: >-
    The host plant manager or CFO sponsors and pays for the project, with
    process engineering, procurement, and compliance reviewing integration,
    reliability, and accounting; the carbonate buyer separately approves
    specification, volume, transfer, and rejection terms. Secure conditional
    buyer demand and host site access before engineering spend or equipment
    financing; competitive grants may support first projects but are not
    recurring demand evidence.
product:
  mvp: >-
    A project-development and operating service for one host–carbonate pair:
    source-gas/site screening, buyer specification and conditional offtake,
    supplier and EPC design, independent transfer-point measurement, and a
    paid demonstration contract. Do not manufacture membranes or offer an
    unbacked capture guarantee.
  sixMonth: >-
    Complete the first candidate-pair screen, collect site-specific gas and
    demand data for the strongest prospects, obtain supplier/EPC quotes, and
    agree a buyer-reviewed acceptance protocol before selecting a pilot.
  twelveMonth: >-
    Have one jointly sponsored, paid pre-FEED or conditional pilot agreement
    with a buyer specification and minimum-volume profile, plus an independent
    test plan, permits review, and quote-based project case; do not order
    equipment unless these gates pass.
  twentyFourMonth: >-
    If the first demonstration meets acceptance, uptime, and cost gates,
    standardize the contract, measurement, and operating playbook and finance
    a repeat site at project level. If the first site fails, stop deployment
    or change the capture route rather than scale an unproven membrane fleet.
  keyBets:
    - >-
      A carbonate buyer will contract for captured CO₂ on a defined quality
      and continuity basis before the host commits equipment capital.
    - >-
      Site-specific membrane performance and conditioning needs can meet
      buyer requirements without consuming the value available from
      conventional feedstock displacement.
    - >-
      Hosts value accepted-output risk transfer enough to pay development
      fees and a per-accepted-tonne service charge.
    - >-
      A project-level financing or grant structure can fund installations
      without making the operating company carry an uneconomic fleet on its
      corporate balance sheet.
gtm:
  wedge: >-
    Directly develop one host and one onsite carbonate buyer into a jointly
    specified, conditional demonstration; commit equipment capital only after
    gas fit, acceptance terms, and minimum demand are documented.
  channels:
    - >-
      Founder-led account development with plant decarbonization, capital
      project, plant management, and carbonate process/procurement leaders.
    - >-
      Introductions and technical qualification through membrane suppliers,
      industrial EPC/commissioning firms, and local industrial-symbiosis
      clusters; maintain supplier alternatives.
    - >-
      Apply to eligible EU or national demonstration-grant programs after a
      named host and offtaker are engaged; treat awards as uncertain project
      capital, not a sales channel or proof of willingness to pay.
  funnelTargets: >-
    Working target, not observed conversion: screen the researched 5–15
    candidate source–buyer pairs, qualify at least 3 through both-party
    interviews and site data, and convert 1 to a jointly sponsored paid
    pre-FEED or conditional-offtake process within 12 months.
  pricing: >-
    Charge a site-development/commissioning fee plus a recurring fee per
    independently metered tonne accepted to the buyer's specification.
    Derive price from the buyer's current supply alternative and quote-backed
    delivered project cost; no public tariff or ACV exists. Test an availability
    floor only after uptime data, and exclude unverified carbon-credit or ETS
    value from the base case.
businessModel:
  revenueStreams:
    - >-
      Site screening, development, and commissioning fees paid by the host
      under a scoped project agreement.
    - >-
      Recurring operating-service fees on tonnes independently measured and
      accepted by the contracted carbonate buyer.
    - >-
      An availability component only after pilot uptime and service liability
      are demonstrated and priced.
  unitOfValue: >-
    One tonne of CO₂ accepted at the agreed buyer transfer point and quality
    specification; nameplate capture capacity is not billable value.
  targetGrossMarginPct: null
  expansionLevers:
    - >-
      Replicate a verified contract, measurement protocol, and supplier/EPC
      package across additional qualified source–buyer pairs.
    - >-
      Add project-level capital partners and a qualified second capture
      supplier after the first site's operating data supports underwriting.
    - >-
      Consider other carbonate users or nonlocal outlets only after their
      demand, regulatory treatment, and delivered economics are separately
      proven.
strategyMap:
  northStarMetric: >-
    Annual tonnes accepted to buyer specification under operating contracts
    with positive site-level contribution, independently measured.
  inputMetrics:
    - Number of source–buyer pairs with verified gas data and a named buyer decision-maker.
    - Share of captured tonnes accepted at transfer point.
    - Pilot availability, rejection rate, and cost per accepted tonne.
    - Qualified pair to paid pre-FEED and conditional-offtake conversion.
    - Portion of equipment capital committed only after buyer and financing gates.
  moatsToBuild:
    - >-
      Multi-site data connecting source-gas variation, membrane condition,
      energy, downtime, delivered composition, and buyer acceptance.
    - >-
      Tested host–offtaker contracts defining quality, continuity, transfer,
      reject rules, and liability.
    - >-
      Supplier-independent technical qualification and project underwriting
      that can be repeated across plants.
  killCriteria:
    - >-
      By month 12, fewer than one host–offtaker pair has a buyer-approved
      specification and conditional volume commitment after screening the
      5–15 candidate-pair range.
    - >-
      After a 90-day demonstration, less than 80% of captured CO₂ is accepted
      or uptime is below 85%; do not guarantee availability or replicate.
    - >-
      Vendor-quoted project economics cannot support a positive site-level
      contribution at a service fee below the buyer's current supply
      alternative without assuming carbon-credit or ETS value.
    - >-
      A bottom-up map validates fewer than 5 technically and commercially
      plausible European source–buyer pairs; stop fleet ambitions unless an
      adjacent segment is separately validated.
  mermaid: |
    flowchart LR
      Pair[Matched host and carbonate buyer] --> Gate[Buyer spec and conditional demand]
      Gate --> Pilot[Metered membrane demonstration]
      Pilot --> Proof[Accepted tonnes and no-credit economics]
      Proof --> Repeat[Project-financed repeat site]
investorMemo:
  verdict:
    call: Watch
    conviction: >-
      Low-to-moderate conviction; the use case is concrete, but customer
      commitment, project economics, and contract differentiation are
      unproven.
    whyBelieve: >-
      A reported Qemetica live test links membrane capture to intended onsite
      carbonate production, and public industrial funding demonstrates
      project-level capture budgets exist.
    whyDoubt: >-
      No public source establishes an accepted-tonne contract, buyer
      specification, repeat commercial demand, or independent project
      economics, and the closest technical/application pairing already exists.
    nextDiligence: >-
      Obtain a buyer-approved specification and conditional volume agreement,
      then test the actual stream and quote a no-credit project case before
      committing demonstration capital.
  firstCustomer:
    title: >-
      European cement or chemical host with onsite carbonate production
    profile: >-
      A European industrial operator with a compatible point-source exhaust
      stream beside a carbonate line with year-round feedstock demand;
      prioritize Poland for discovery without presuming the reported Qemetica
      test is a sales lead.
    trigger: >-
      The host is approving a capture demonstration while its carbonate
      process owner is planning feedstock supply and can define an acceptance
      specification and volume profile.
    buyer: >-
      Host plant general manager or CFO as service payer, with the carbonate
      process/procurement owner as required offtaker and specification signer.
    initialContract: >-
      Dollar pilot/ACV range and standard term are unknown from the evidence.
      Pursue a paid development or commissioning scope, convert to a
      site-specific per-accepted-tonne demonstration, and offer a multi-year
      service only after independent uptime and buyer acceptance are proven.
  mustBeTrue:
    - >-
      At least one host and carbonate buyer sign a conditional agreement with
      a measurable CO₂ specification, minimum-volume profile, acceptance
      point, and rejection rules within 12 months.
    - >-
      An independent 90-day test on real exhaust achieves at least 80% buyer
      acceptance of captured tonnes and at least 85% uptime, or a revised
      performance threshold is agreed before any service guarantee.
    - >-
      Vendor-quoted CAPEX, energy, maintenance, replacements, and financing
      support positive site-level contribution at a fee the host and buyer
      can support without assumed carbon credits or ETS relief.
    - >-
      A bottom-up European site review confirms at least 5 pairs with
      technically compatible exhaust, identifiable carbonate demand, and
      accessible decision-makers; the current 5–15 pair range is only an
      operator screen.
    - >-
      After the first accepted-output dataset, at least one project-finance
      or grant-backed structure can fund a repeat installation without
      requiring the operating company to carry the full fleet capex.
  diligenceQuestions:
    - >-
      What specification, annual and seasonal volume, rejection rights, and
      price would the first carbonate buyer contract for, compared with its
      current conventional CO₂ supply?
    - >-
      What independently measured gas composition, recovery, purity, uptime,
      energy draw, pretreatment, fouling, and cartridge life apply to the
      target host stream?
    - >-
      What are the supplier-quoted installed CAPEX, operating cost, module
      replacement, and financing requirements, and who bears performance and
      interruption liability?
    - >-
      Does the proposed carbonate product and downstream fate receive any
      specific emissions-accounting treatment, or does the project work
      without ETS relief, credits, or permanence claims?
    - >-
      How many European source–carbonate pairs meet site, demand, gas-fit,
      permitting, and distance criteria after plant-level verification?
    - >-
      What grant, host-capital, and project-finance terms are available for
      the first and second installations, and what equity remains at risk?
operatingAssumptions:
  - assumption: >-
      A carbonate buyer near the host will contract a minimum volume against a
      site-specific quality and continuity specification before equipment
      financing.
    basis: research.yaml
    validationTest: >-
      Obtain buyer process/procurement sign-off on a draft specification,
      seasonal volume profile, rejection protocol, and conditional offtake
      before approving a pilot purchase order.
    decisionImpact: >-
      If no buyer will commit, do not finance the skid; stop the carbonate
      wedge or validate a different outlet separately.
  - assumption: >-
      At least 5 of the estimated 5–15 European source–buyer pairs survive
      plant-level screening for gas fit, demand, distance, and decision-maker
      access.
    basis: research.yaml
    validationTest: >-
      Build a named site map and verify process owners, source-gas data,
      carbonate throughput, transport distance, and project timing for each
      candidate during the first six months.
    decisionImpact: >-
      If fewer than 5 pairs qualify, reduce the venture-scale case and do not
      hire or finance a multi-site fleet.
  - assumption: >-
      A qualified membrane supplier can meet the buyer's specification on
      actual exhaust at acceptable uptime and conditioning cost.
    basis: research.yaml
    validationTest: >-
      Run independent source-gas sampling and a monitored demonstration that
      reports purity, recovery, energy, uptime, rejection, fouling, and module
      replacement under normal and upset conditions.
    decisionImpact: >-
      If the membrane route fails, compare another capture architecture only
      if the same contracted acceptance and cost tests remain viable; otherwise
      stop the project.
  - assumption: >-
      The host will pay development and per-accepted-tonne service fees to
      transfer integration and performance risk instead of preferring a
      conventional supply contract or plant-owned EPC project.
    basis: idea.yaml
    validationTest: >-
      Present a priced development scope and draft outcome-based term sheet to
      the host CFO/plant lead and carbonate buyer; require written budget
      ownership and conditions for proceeding.
    decisionImpact: >-
      If the host will not pay or share risk, the business must not underwrite
      equipment based only on technical interest.
  - assumption: >-
      A no-credit, quote-backed project case can cover operating and financing
      costs at a service fee acceptable to both parties.
    basis: research.yaml
    validationTest: >-
      Compare independent vendor/EPC CAPEX and OPEX quotes, buyer's current
      feedstock cost, utilities, grant conditions, and contractual fee ceiling;
      obtain counsel review of any claimed emissions-accounting benefit.
    decisionImpact: >-
      If the case only works with an unverified credit or buyer premium, do
      not make the project investment or set a fleet gross-margin target.
  - assumption: >-
      A $3–5M pre-seed target can fund an 18-month lean team, site diligence,
      pilot engineering, independent measurement, and an initial project
      contribution while project assets remain separately financed.
    basis: operator judgment
    validationTest: >-
      Re-size the raise after supplier quotes, pilot scope, grant eligibility,
      and project-finance indications are obtained; separate corporate runway
      from full module CAPEX.
    decisionImpact: >-
      If first-site equity needs exceed the corporate round, delay deployment
      until a host, grant, or project SPV funds the asset rather than silently
      expanding the raise or balance-sheet exposure.
experimentRoadmap:
  - horizon: 0–90 days
    experiment: >-
      Map the candidate source–carbonate pairs and interview the host and
      offtaker sides of the three strongest prospects, beginning with Poland.
    hypothesis: >-
      At least three pairs have named decision-makers, a plausible local
      carbonate demand profile, and willingness to share site data.
    successMetric: >-
      Three documented pairs pass initial commercial screening with owner,
      process, demand, timing, and next-step evidence; otherwise revisit the
      researched SAM range.
    owner: CEO / project-development lead
  - horizon: 0–90 days
    experiment: >-
      Test a draft accepted-tonne term sheet and paid site-development scope
      with host capital/project leads and carbonate process/procurement owners.
    hypothesis: >-
      Host and buyer will negotiate a shared specification and conditional
      demand commitment before the host orders capture equipment.
    successMetric: >-
      One pair supplies a buyer-reviewed specification and written host intent
      to fund or co-fund a scoped pre-FEED; verbal interest alone does not pass.
    owner: CEO / commercial lead
  - horizon: 3–6 months
    experiment: >-
      Obtain real-stream samples and a comparable technical/commercial design
      from membrane suppliers and an EPC, with independent engineering review.
    hypothesis: >-
      At least one modular route can treat the sampled stream within the
      buyer's draft quality needs without prohibitive pretreatment or energy.
    successMetric: >-
      Site-specific gas report, itemized installed and operating quotes, and
      an engineering recommendation with explicit unknowns; no vendor
      nameplate figure substitutes for site data.
    owner: Founding process engineer
  - horizon: 3–9 months
    experiment: >-
      Define the buyer sampling, transfer, rejection, continuity, and
      liability protocol with independent measurement and regulatory counsel.
    hypothesis: >-
      The buyer can accept an auditable test protocol and the host can operate
      the service without relying on unverified ETS or permanence treatment.
    successMetric: >-
      Buyer-approved measurement and reject protocol plus a written
      jurisdiction-specific accounting memo that identifies any claims the
      project must not make.
    owner: Process engineer with contracted MRV counsel
  - horizon: 6–12 months
    experiment: >-
      Convert the best pair into a conditional pilot contract and a staged
      grant/project-finance package.
    hypothesis: >-
      Named demand and defined acceptance gates can attract host capital,
      eligible grant support, or project-level financing without funding
      speculative capture capacity.
    successMetric: >-
      One signed conditional host–offtaker framework, paid pre-FEED scope,
      vendor-quoted pilot budget, and documented source of project capital
      before equipment order.
    owner: CEO with project-finance counsel
  - horizon: 12–18 months
    experiment: >-
      Commission the first demonstration only if contract, permit, and funding
      gates pass, then run an independently witnessed 90-day operating test.
    hypothesis: >-
      The actual exhaust stream can produce stable buyer-accepted CO₂ at
      sufficient uptime and a cost the host and buyer can support.
    successMetric: >-
      Target at least 80% of captured tonnes accepted and at least 85% uptime,
      with measured energy, cost, rejection, maintenance, and replacement data;
      failure blocks fleet expansion.
    owner: Operations lead with independent measurement provider
operations:
  - >-
    Use a stage-gate project checklist: named offtaker and acceptance terms,
    source-gas campaign, site integration, permits/accounting review, quote
    based economics, and financing close before equipment order.
  - >-
    Keep capture hardware supplier-independent where technically qualified;
    compare membrane performance with a credible alternate capture route
    rather than assuming the supplier's design claims are site results.
  - >-
    Contract independent sampling and transfer-point mass/quality measurement;
    preserve auditable records for accepted and rejected tonnes, uptime,
    energy, outages, and module condition.
  - >-
    Use industrial EPC/commissioning partners for balance-of-plant and plant
    integration; define responsibility for process interruption, maintenance,
    and off-spec gas before commissioning.
  - >-
    Obtain specialist EU/national counsel on CO₂ utilization, ETS/MRV,
    product fate, and permits; make no allowance, credit, or permanence claim
    without written verification.
  - >-
    Apply for grants selectively and arrange project-level capital only after
    conditional demand; grants and storage infrastructure are not assumed to
    be available for every local-use project.
team:
  - role: Founder / CEO, industrial project development
    startTiming: Month 0
    rationale: >-
      Own the two-sided host/offtaker sale, paid development scope, partner
      access, and grant/project-capital sequencing; the plan requires a
      decision-maker on both sides before equipment commitment.
  - role: Founding process engineer
    startTiming: Month 0
    rationale: >-
      Lead source-gas qualification, membrane/EPC comparison, integration,
      operating measurement, and supplier challenge; site performance is the
      core technical disconfirmation risk.
  - role: Independent MRV and regulatory counsel
    startTiming: Month 0, contracted
    rationale: >-
      Define buyer acceptance, transfer-point sampling, CO₂ utilization
      accounting, and permitting without prematurely hiring a full compliance
      team or asserting ETS benefits.
  - role: Project-finance and contract lead
    startTiming: Month 6–9, contingent on a qualified pair
    rationale: >-
      Structure project-level capital, liability, warranties, and conditional
      offtake only after a buyer and site are real; defer a permanent hire if
      the pipeline does not clear the first gates.
  - role: Commissioning and operations lead
    startTiming: Month 9–12, contingent on funded pilot
    rationale: >-
      Own site safety, EPC coordination, commissioning, uptime, and service
      delivery when a project is financed; use specialist contractors before
      installation rather than building a fleet team early.
milestones:
  - horizon: 0–12 months
    items:
      - >-
        Screen the estimated 5–15 European pairs, document at least three
        qualified accounts, and complete bilateral buyer/host discovery.
      - >-
        Secure one buyer-reviewed specification, conditional volume profile,
        and paid pre-FEED or equivalent host commitment; otherwise do not
        order equipment.
      - >-
        Complete independent source-gas characterization, supplier/EPC quotes,
        acceptance/MRV protocol, permits/accounting review, and a no-credit
        project case.
      - >-
        Obtain a staged grant, host-capital, or project-finance path for the
        first installation; do not treat an application as an award.
  - horizon: 12–24 months
    items:
      - >-
        If contract, technical, regulatory, and financing gates pass,
        commission one demonstration on a matched host–offtaker site.
      - >-
        Complete an independently witnessed 90-day test targeting at least
        80% accepted output and 85% uptime; record cost per accepted tonne and
        all rejection, energy, outage, and maintenance data.
      - >-
        Convert to a multi-year service only if buyer acceptance, site-level
        contribution, and responsibility limits are demonstrated; otherwise
        stop or redesign rather than guarantee performance.
  - horizon: 24–36 months
    items:
      - >-
        Finance one repeat installation at project level only after the first
        site's acceptance and no-credit economics meet agreed gates.
      - >-
        Build a comparable operating dataset and standard source–buyer
        contract package; target two operating pairs cumulatively only if the
        first repeat closes on customer-backed terms.
      - >-
        Re-estimate the serviceable market from validated site pairs; defer
        new geographies, products, or hardware ownership if fewer than five
        viable pairs are confirmed.
risks:
  - risk: >-
      Real exhaust variability, impurities, membrane degradation, or
      conditioning needs prevent stable buyer-accepted output.
    likelihood: High
    impact: High
    mitigation: >-
      Require site gas sampling and supplier comparison before capital,
      independently commission a demonstration, negotiate measurable reject
      rules, and stop deployment if acceptance or uptime gates fail.
  - risk: >-
      Few sites combine compatible gas, onsite carbonate demand, and a buyer
      willing to contract, leaving a narrow and slow sales pipeline.
    likelihood: High
    impact: High
    mitigation: >-
      Audit the estimated 5–15 pairs, require named demand and volume evidence
      before pursuing each site, and use the month-12 pair-count kill criterion
      instead of capturing unmatched emitters.
  - risk: >-
      Equipment, installation, energy, or financing costs exceed the service
      fee affordable against conventional CO₂ supply.
    likelihood: High
    impact: High
    mitigation: >-
      Obtain itemized supplier/EPC quotes, stage spend behind offtake and
      project capital, exclude unverified carbon value, and do not commit
      corporate balance sheet to a fleet.
  - risk: >-
      CO₂ use in carbonate products does not receive the assumed emissions
      accounting treatment or cannot substantiate permanence or net benefit.
    likelihood: Medium
    impact: High
    mitigation: >-
      Obtain jurisdiction-specific MRV, ETS, and product-fate advice; base the
      project on feedstock displacement and host value only where documented,
      and make no storage-equivalent claim without proof.
  - risk: >-
      UniSieve/Qemetica, capture vendors, EPCs, or plant teams bundle financing
      and accepted-output obligations, erasing the proposed service wedge.
    likelihood: Medium
    impact: High
    mitigation: >-
      Test willingness to pay for the integrated contract in customer
      discovery, keep multiple technical routes available, and build
      differentiated underwriting and acceptance data only through paid
      operation; stop if incumbents offer the same terms at lower risk.
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: >-
    $3–5M provisional planning target; resize against supplier quotes, pilot
    scope, grant conditions, and project-finance terms because no public
    project cost or service price is available.
  runwayMonths: 18
  useOfFundsSummary: >-
    An 18-month pre-seed funds a lean project-development and process team,
    bilateral customer qualification, site and gas studies, independent
    measurement design, contract/regulatory work, and pilot engineering plus
    an initial project-company contribution. It buys a conditional, financeable
    demonstration decision, not a full 5–30 kt/year module fleet; asset CAPEX
    beyond the initial contribution must come from host, grant, or project-level
    capital after demand and technical gates pass.
