modelSanity:
  - checkName: 收入引擎
    finding: "模型假设一个合格项目每年验收 10,000 吨、每吨收费 USD 60，对应年度 ARPU 为 USD 600K；第二个项目只在 Q4Y3 贡献收入。"
  - checkName: 必须顺利推进
    finding: "买方必须签署最低采购量和质量条款；测试须达到 80% 验收率和 85% 运行率；每项 USD 3.0M 资产还须落实未承诺的资本结构：50% 主机方/补助资金、40% 项目债务、10% 发起方出资。"
  - checkName: 模型失效的情形
    finding: "薪酬超支 20% 会使模型中的三年现金减少 USD 312K；验收产量短缺 25% 则会使 Y3 收入减少 USD 187.5K、累计现金减少 USD 165K。"
  - checkName: 下一轮融资所需验证
    finding: "下一轮融资前，须完成经独立见证的 90 天测试，买方验收率至少达到 80%、运行率达到 85%；还须证明首个场地偿付每年约 USD 179K 的项目债务后仍有正贡献，才能承诺复用场地。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 66.7%（USD 750K 对比 USD 450K）+ Y3 EBITDA 利润率 -135.7%（-USD 1,017.5K / USD 750K）= -69.0%；两个项目部署期间，这一代理指标显著为负。"
  burnMultiple: "Y3 合并项目现金消耗约 USD 1,541K / 新增 ARR 净额 USD 600K = 2.57x；其中包括复用资产净股权出资 USD 300K 和项目债务偿付 USD 223.75K，因此这个基础设施倍数只能作方向性参考，不能直接与 SaaS 比较。"
  revenuePerFte: "Y3 收入 USD 750K / 年末 6 名 FTE = 每 FTE USD 125K（低于成熟 SaaS 的 USD 200–400K 经验水平；早期资产支持型项目交付模式不能直接比较）。"
  flags:
    - "没有公开证据验证按验收吨收费的服务价格、安装 CAPEX、项目债务条款、能源需求或直接运营成本；模型中的单位经济模型数值均为规划假设，并非实际观察结果。"
    - "已披露的 Qemetica 测试仅作类比；模型不假设存在付费合同、已签承购协议或客户接触渠道。"
    - "主机方/补助资金和项目债务均未承诺；若任何一项资产融资失败，公司必须推迟设备订单，而不是用公司融资款承担项目组合 CAPEX。"
    - "基准情景到 Y3 年末仅剩 USD 569.5K 现金，且尚未扣除税费、营运资本和突发费用；复用场地项目完成融资前，须落实后续融资或项目资本。"
    - "Y3 的 rule-of-40 代理指标为 -69.0%，年末每 FTE 收入为 USD 125K；公司仍处早期，尚不能与成熟 SaaS 的效率水平比较。"
