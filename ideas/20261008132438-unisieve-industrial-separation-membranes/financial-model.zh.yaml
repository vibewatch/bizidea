slug: offtake-backed-carbon-capture
date: "2026-10-08"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: 模型周期
    value: "2026-10 through 2029-09"
    unit: calendar month
    source: "[business-plan.yaml date；模型周期按要求采用三年规划惯例]"
  - id: A1
    name: 基准 pre-seed 融资
    value: 4.5
    unit: USD millions
    source: "[business-plan.yaml fundingAsk：暂定融资目标为 $3–5M，现金跑道 18 个月；模型按未承诺的 $4.5M 估算，用于达成里程碑、预留六个月缓冲，并为两个通过门槛的项目出资]"
  - id: A2
    name: 项目收入爬坡
    value: "M1–M9：0 个可计费项目当量；M10–M12：1 个付费 pre-FEED 项目；Q1Y2：0 个运营服务当量；Q2Y2 至 Q3Y3：1 个；Q4Y3：2 个"
    unit: 贡献收入的项目客户当量
    source: "[business-plan.yaml gtm.funnelTargets、product.twelveMonth、milestones 和 experimentRoadmap：目标是截至第12个月拿下一个付费 pre-FEED 项目，第 12–24 个月进行首次测试，只有在第 24–36 个月通过门槛后才累计达到两个项目；时间安排和转化率均为尚未验证的模型假设。已披露的 Qemetica 测试不属于付费客户，未计入]"
  - id: A3
    name: 单个项目的产能、运行时间和验收产量
    value: "15,000 tCO2/year 铭牌产能 × 85% 运行率 × 80% 买方验收率 = 计算得出每年验收 10,200 吨；预测值向下取整为每年验收 10,000 吨"
    unit: tonnes CO2 per project-year
    source: "[research.yaml reportMemo.technologyLandscape：供应商设计范围为 5,000–30,000 t/year，并非经验证的产量；business-plan.yaml strategyMap.killCriteria 和 experimentRoadmap：85% 运行率、80% 验收率是未来测试门槛，不是已证明的表现；15,000 t 和取整方式均为模型假设]"
  - id: A4
    name: 服务单价和 pre-FEED 费用
    value: "每验收吨 USD 60；每年验收 10,000 吨时，年度服务 ARPU 为 USD 600K；首个付费 pre-FEED 项目范围为 USD 150K，在 M10–M12 按月确认 USD 50K"
    unit: 每验收吨 USD，以及每项目千 USD
    source: "[business-plan.yaml gtm.pricing 和 businessModel.revenueStreams：拟收取开发/调试费，以及按验收吨数计费的服务费；research.yaml.researchCoverage.coverageGap：没有公开资料提供服务价格或项目经济性数据。价格和费用是尚未验证的运营规划假设，不是市场事实]"
  - id: A5
    name: 项目直接成本和毛利率
    value: "COGS 占已确认收入的 45%；毛利率 55%；商业计划未提供目标值"
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct 为 null，research.yaml 也未报告报价项目经济性；将 45% 设为现场运营、维护、测量和调质直接成本，是偏保守的初创公司财务规划经验值，并非经验证的毛利率]"
  - id: A6
    name: 招聘顺序和全口径薪酬
    value: "M0 入职 CEO 和创始工艺工程师；M7 招聘项目融资/合同负责人；M10 招聘调试/运营负责人；M16 招聘现场工艺工程师；M31 招聘现场运营人员。六个时点的 FTE 分别为 2、2、3、4、5、6。平均全口径薪酬为每 FTE 每年 USD 120K"
    unit: FTE 和每 FTE 年千 USD
    source: "[business-plan.yaml team 和 strategicChoices.sequencingRationale：创始团队从一开始到岗；只有出现合格的主机方—承购方组合，才在 M6–9 招聘财务负责人；只有试点获得资金后，才在 M9–12 招聘运营人员；验证前保持精简。增聘现场和外勤人员属于需过门槛的模型假设。平均全口径薪酬 USD 120K 是明确标注的初创公司财务规划经验值，并非有来源的薪资报价]"
  - id: A7
    name: 非薪酬销售与营销费用
    value: "Y1 按季度列示的月度 USD K：5.0、7.5、10.0、12.5；Y2 按季度 USD K：45、45、45、45；Y3 按季度 USD K：50、50、55、55"
    unit: Y1 每月千 USD；Y2–Y3 每季度千 USD
    source: "[business-plan.yaml gtm.channels 和 experimentRoadmap：由创始人主导双边工业销售，并借助供应商/EPC 引荐拓客；费用按初创公司财务规划经验估算，用于差旅、客户开发和伙伴合作，不含薪酬]"
  - id: A8
    name: 非薪酬工程与验证费用
    value: "Y1 按季度列示的月度 USD K：20、30、40、50；Y2 按季度 USD K：60、60、70、70；Y3 按季度 USD K：75、80、80、85"
    unit: Y1 每月千 USD；Y2–Y3 每季度千 USD
    source: "[business-plan.yaml product、experimentRoadmap、operations 和 milestones：包括现场气体相关工作、供应商/EPC 设计、独立测量和试点工程；现金支出节奏是模型编制者的规划估算，并非供应商报价]"
  - id: A9
    name: 非薪酬一般及行政费用
    value: "Y1 按季度列示的月度 USD K：15、17.5、20、22.5；Y2 按季度 USD K：45、50、50、50；Y3 按季度 USD K：55、60、60、65"
    unit: Y1 每月千 USD；Y2–Y3 每季度千 USD
    source: "[business-plan.yaml team 和 operations：独立 MRV/监管顾问采用外包，不纳入内部编制；另计许可、保险、法律和公司运营成本。费用节奏是明确标注的初创公司财务规划经验值，不含薪酬]"
  - id: A10
    name: 获客成本与客户生命周期假设
    value: "每组符合条件的主机方—承购方组合，全口径 CAC 为 USD 250K；假设服务期为 36 个月；月流失率按预期生命周期 36 个月的倒数估算，为 2.8%"
    unit: 每个新项目千 USD；月；月百分比
    source: "[business-plan.yaml investorMemo.firstCustomer 和 gtm.funnelTargets：未披露合同 ACV、CAC 或期限；research.yaml.reportMemo.customerAndBuyer：涉及两位决策者，且工业采购流程阻力较大。CAC 和三年服务期是尚未验证的工业 GTM 经验假设；流失率按 1/36 推算]"
  - id: A11
    name: 项目资产成本与资本结构
    value: "每个 15,000 t/year 项目的安装 CAPEX 为 USD 3,000K；每个项目由主机方/补助资金出资 USD 1,500K、项目债务 USD 1,200K、发起方股权 USD 300K。两个通过门槛的项目合计 CAPEX 为 USD 6,000K，其中主机方/补助资金 USD 3,000K、债务 USD 2,400K、发起方股权 USD 600K"
    unit: 每个项目及两个项目组合的千 USD
    source: "[business-plan.yaml operatingAssumptions（公司轮融资 $3–5M，项目资产另行融资）、milestones 和 fundingAsk.useOfFundsSummary；research.yaml 没有公开 CAPEX 报价或项目融资条款。USD 3,000K 成本和 50%/40%/10% 结构是明确列出的、尚未验证的项目融资经验假设；主机方/补助资金和债务均未承诺或获批]"
  - id: A12
    name: 项目债务偿付
    value: "每项资产承担 USD 1,200K 债务，按假设的年利率 8% 在 10 年内摊还；年度债务偿付约 USD 179K，即每季度 USD 44.75K"
    unit: USD thousands
    source: "[research.yaml.openQuestions 要求确认项目融资条款，并指出目前没有公开信息；8%、10 年和等额还款计算均为模型编制者的融资经验假设，并非贷款方报价]"
  - id: A13
    name: 现金流与会计边界
    value: "M1 收到 USD 4,500K 公司融资；模型不计后续公司股权轮；项目资本流入和资产 CAPEX 与 P&L 收入/EBITDA 分开列示；全额项目债务偿付从现金中扣除；不计税费或营运资本变动"
    unit: 千 USD 和建模惯例
    source: "[business-plan.yaml fundingAsk、strategicChoices.sequencingRationale 和 operatingAssumptions：公司现金跑道与项目 SPV 资产融资分开，不假设碳信用收入；不计税费和营运资本变动是简化预测假设]"
  - id: A14
    name: 基准资金用途与六个月缓冲
    value: "工程 USD 2,000K；GTM USD 800K；G&A USD 800K；缓冲 USD 900K；合计 USD 4,500K。六个月应急储备涵盖成本和调试偏差"
    unit: USD thousands
    source: "[business-plan.yaml fundingAsk：暂定 pre-seed 融资范围为 $3–5M，用于精简运营 18 个月；模型按要求额外增加六个月储备。各项分配和 USD 900K 储备是模型编制者的规划判断，并非已批准预算]"
  - id: A15
    name: 不同情景下的融资额
    value: "下行情景：USD 5.0M，现金跑道 30 个月，适用于首个项目延迟六个月并需要延长技术验证；基准情景：USD 4.5M，24 个月；上行情景：USD 4.2M，24 个月，前提是复用场地的主机方/战略伙伴承担 USD 300K 发起方出资"
    unit: 百万 USD 和月
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd 允许暂定 $3–5M 融资范围，operatingAssumptions 要求在获得报价后调整规模；情景融资额、下行情景延误六个月及上行情景主机方共同出资均为尚未验证的规划情景]"
  - id: A16
    name: 敏感性冲击
    value: "验收产量 -25%/+20%；服务价格 -20%/+20%；首次调试延迟六个月；毛利率 -10/+10 个百分点；安装 CAPEX +25%；全口径薪酬 +20%/-10%；第二个项目未能成交"
    unit: 相对基准情景的变化
    source: "[business-plan.yaml topRisks、strategyMap.killCriteria 和 research.yaml.reportMemo.sensitivityCases 指出了验收、成本、资本和销售转化风险；冲击幅度是明确设定的模型压力测试假设]"
