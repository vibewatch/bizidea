  formulas:
    - "ARPU = 每年验收 10,000 吨 × 每吨 USD 60 = 每年 USD 600K。"
    - "LTV = USD 600K / 12 × 55% 毛利率 × 36 个月 = USD 990K。"
    - "LTV/CAC = USD 990K / USD 250K = 3.96x；CAC 回本期 = USD 250K / (USD 600K / 12 × 55%) = 9.09 个月。"
