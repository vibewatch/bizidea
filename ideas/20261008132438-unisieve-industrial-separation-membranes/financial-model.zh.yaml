headcountBasis:
  assumptionRefs: [A6]
  description: "年度化薪酬按全口径 FTE 人数乘以每 FTE 平均年成本 USD 120K 计算；下方 salaryK 是实际期间薪酬，计入 opexK。"
revenueModel:
  assumptionRefs: [A2, A3, A4]
  customerDefinition: "customersEop 表示该期间贡献收入的付费项目客户当量，不包括销售管线中的潜在客户，也不等同于独立法人实体；同一组主机方—承购方可以先作为付费 pre-FEED 客户，在调试期间暂停合作，之后再成为按验收产量计费的常规客户。"
  formula: "Y1 月收入 = customersEop × 每月 USD 50K 账单；Y2/Y3 季度收入 = customersEop × 每季度 USD 150K。成熟期 ARPU 为每年 USD 600K = 每年验收 10,000 吨 × 每吨 USD 60。首个 USD 150K 付费 pre-FEED 项目在 M10–M12 分三次、每次 USD 50K 确认收入。"
  exclusion: "已披露的 Qemetica 现场测试不计作本公司的客户、已签承购协议、付费工作或收入。"
pnlMethodology:
  assumptionRefs: [A3, A4, A5, A6, A7, A8, A9, A13]
  description: "COGS 占收入的 45%；grossProfitK = revenueK - cogsK；salaryK 是全口径薪酬；opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK；ebitdaK = grossProfitK - opexK。项目资产 CAPEX、外部项目资本和债务偿付不计入 EBITDA。"
