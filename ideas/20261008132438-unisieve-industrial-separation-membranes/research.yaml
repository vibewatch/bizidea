championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: "The reported Qemetica–UniSieve live test is a concrete source-to-local-carbonate-use pairing, not a generic CO2 marketplace; captured gas is intended for soda ash and baking soda production."
      sourceRefs: [1]
    - point: "The proposed acceptance-point metering and host-side service payment focus on a real gap between capture capacity and a useful, quality-accepted product; company-described modular demonstrations provide a plausible way to test that wedge."
      sourceRefs: [1, 2]
    - point: "EU industrial carbon management policy and public grants show active investment in capture projects and shared carbon infrastructure, supporting a near-term project-development window."
      sourceRefs: [4, 7, 8]
  evidenceAgainst:
    - point: "The core pairing of membrane capture with onsite carbonate use is already represented by the UniSieve–Qemetica test; public evidence does not establish that the startup's local source–buyer matching is a new category."
      sourceRefs: [1, 2]
    - point: "Modular capture systems and outsourced capture/project services are adjacent offerings, while large CCS projects already use long-term public support and project-level financing; the idea's distinguishing acceptance-linked contract has no public commercial proof."
      sourceRefs: [10, 14, 15]
    - point: "A source-differentiated market for CO2 feedstock is not yet mature, weakening the assumption that a buyer will pay a premium for captured CO2 without a verified process or compliance benefit."
      sourceRefs: [12, 13]
  revisedClaim: >-
    The opportunity is a potentially differentiated project-underwriting and operating service for the small subset of
    industrial sites where captured CO2 can move directly into a nearby carbonate process. Its defensible novelty would
    be a repeatable contract and operating record tied to independently verified buyer acceptance, not membrane capture,
    local CO2 use, or third-party financing alone. That mechanism remains unproven, so the creative-novelty score of 5
    is not yet supported.
reportMemo:
  executiveTakeaways:
    - "The industrial decarbonisation pain is real and increasingly funded, but available evidence points mainly to large, grant-supported CCS projects—not proven willingness to pay for this exact accepted-tonne service."
    - "The mechanism has a live analogue: UniSieve and Qemetica are testing membrane capture with intended onsite carbonate use. No public report establishes repeat orders, buyer acceptance terms, or project economics."
    - "Novelty is narrow and conditional: tying project capital and operating fees to CO2 accepted by a named offtaker may be distinctive, but generic modular capture and third-party capture services already exist."
    - "Size the opportunity in tonnes per year until service prices, capture costs, and the number of qualifying source–buyer pairs are validated; a dollar TAM would imply unsupported pricing."
    - "Adoption depends on gas fit, quality/continuity guarantees, regulatory treatment of CO2 utilization, capital access, and a buyer willing to contract rather than simply continue established feedstock supply."
  marketDefinition: >-
    The market is a financed and operated industrial CO2 capture service whose billable unit is CO2 delivered at a
    carbonate user's transfer point and accepted against a site-specific quality and continuity specification. The
    physical TAM below is a theoretical European cement capture-capacity ceiling, not a revenue forecast; SAM narrows
    to estimated local source–carbonate pairs and SOM to initial demonstration deployments. Public evidence does not
    reveal a defensible per-tonne service price, so dollar values are intentionally not asserted.
  customerAndBuyer: >-
    The industrial host's plant manager, decarbonisation lead, or CFO is the likely project sponsor and service payer;
    procurement and process engineering assess integration and uptime. A carbonate producer or onsite process owner
    is the separate offtaker with authority over CO2 acceptance. The project therefore has at least two decision
    makers, a shared measurement boundary, and a need to contract for specification, continuity, rejection, downtime,
    and liability before equipment financing can be underwritten.
  buyingTriggers:
    - point: "EU ETS benchmarks are set against best-performing installations and signal pressure to improve greenhouse-gas and fuel efficiency, creating a decarbonisation trigger without proving any particular capture project's payback."
      sourceRefs: [5]
    - point: "The EU Innovation Fund and industrial carbon management portfolio provide a visible grant route for capital-intensive projects; such grants demonstrate budget availability but also suggest early projects rely on public support."
      sourceRefs: [4, 7, 8]
    - point: "A plant approving a capture demonstration while a nearby carbonate operation needs a reliable input is the strongest hypothesised trigger; Qemetica is a reported test case, not evidence of a repeat commercial purchase."
      sourceRefs: [1, 2]
  willingnessToPay:
    summary: >-
      Industrial carbon capture is budgeted at project scale: the EU maintains a multi-billion-euro Innovation Fund,
      and Yara's operating Sluiskil CCS project is expected to capture up to 800,000 tonnes annually with cross-border
      transport and storage. LeadIT's cement-sector review reports that Brevik relied on government funding covering
      more than 80% of capital costs. These signals support public and strategic willingness to fund emissions
      reduction, not a proven willingness by a carbonate buyer to pay a premium or by a host to sign an
      acceptance-linked service contract. Trade coverage says UniSieve has paying customers but does not establish
      that those are carbon-capture customers or disclose their terms.
    sourceRefs: [1, 8, 9, 10, 15]
  competitiveLandscape: >-
    The offer sits between capture technology vendors, project/EPC providers, industrial operators building their own
    systems, and conventional CO2 supply. UniSieve–Qemetica demonstrates that capture can be paired with onsite
    carbonate production, while Carbon Clean sells modular solvent-based capture systems. Larger project pathways
    such as Yara Sluiskil and Brevik CCS capture and route CO2 to geological storage. These are not all direct
    substitutes for local carbonate feedstock, but they compete for site capital, engineering attention, decarbonisation
    budgets, and the option to avoid or outsource capture. No public competitor contract reviewed here shows the exact
    combination of project financing, membrane operation, and host payment solely for buyer-accepted CO2.
  incumbentThesis:
    - incumbentClass: "Capture technology vendors and modular system suppliers"
      point: "They provide equipment and engineering for capture, but a host may still have to finance the retrofit, arrange product conditioning, and negotiate a separate use or storage route. The gap is an unbundled project-and-offtake problem, not proof that vendors cannot offer financing."
      sourceRefs: [2, 14]
    - incumbentClass: "Large CCS developers, EPCs, and storage networks"
      point: "They have operating references and can win when permanent storage, public support, and shared transport are available. They do not automatically solve a local carbonate buyer's acceptance specification, and their scale and infrastructure needs can be disproportionate for a small onsite-use pair."
      sourceRefs: [9, 10, 15]
    - incumbentClass: "Plant-owned capture and internal engineering"
      point: "The host controls site operations and can integrate capture with its own process, but must absorb engineering, capital, reliability, and buyer-quality risks. A service provider only wins if it lowers total risk enough to offset financing costs and the host's control preference."
      sourceRefs: [2, 6, 15]
    - incumbentClass: "Conventional CO2 feedstock and the status quo"
      point: "Established supply avoids retrofit disruption and already meets the buyer's process needs; absent a quantified price, reliability, or compliance advantage, a buyer can rationally keep buying conventional feedstock and decline the project."
      sourceRefs: [1, 12, 13]
  regulatoryLandscape: >-
    EU geological storage is governed by the CCS Directive and requires permitted storage sites, safety review,
    monitoring, and financial security; ETS relief described by the Commission applies to CO2 successfully captured
    and stored under the applicable framework. This should not be assumed to apply automatically to every carbonate
    use. CO2 utilization, the downstream fate of carbonate products, emissions accounting, and any claim of permanent
    chemical binding require specialist legal and MRV review. Cross-border storage introduces transport and
    jurisdictional dependencies, while industrial sites remain subject to environmental and process permitting.
  technologyLandscape: >-
    UniSieve describes a MOF-based molecular-sieving membrane, containerized cement units, and design capacities of
    5,000–30,000 tonnes per year for smaller demonstrations and up to 50,000 tonnes per year per 12-metre unit.
    These are supplier design claims, not independent long-duration operating results. The company says pretreatment
    can use existing plant filtration, water passes through the membrane for later removal, and cartridges may last
    at least five years based on current testing. Site-specific gas composition, moisture, dust, pressure, purity,
    recovery, electricity demand, uptime, replacement cost, and buyer acceptance remain to be independently tested.
  distributionChannels:
    - point: "Direct project development with plant decarbonisation and capital-project leads, beginning with a jointly qualified host and carbonate user rather than a broad marketplace."
      sourceRefs: [1, 2]
    - point: "Membrane manufacturers, industrial EPC/commissioning firms, and local industrial-symbiosis clusters can provide technical qualification and introductions; the European cement project map is a discovery aid, not proof of sales access."
      sourceRefs: [2, 11]
    - point: "Innovation Fund calls and national decarbonisation programmes may support first-of-a-kind demonstrations, although grant application effort and award uncertainty should be treated as channel friction."
      sourceRefs: [7, 8]
  partnershipEcosystem:
    - point: "Membrane suppliers such as UniSieve can provide separation hardware and process data; qualification must remain multi-supplier if the service operator is to retain bargaining power."
      sourceRefs: [1, 2]
    - point: "A carbonate offtaker, independent sampling/measurement provider, and site EPC are needed to agree product transfer, test methods, reject rules, commissioning, and operating responsibility."
      sourceRefs: [1, 16]
    - point: "Project-finance providers and public grant programmes are likely to be important before a fleet has operating history; current cement CCS scale examples show substantial reliance on state support."
      sourceRefs: [7, 8, 10, 15]
    - point: "EU and national carbon-management programmes are building transport/storage networks, but these are only relevant for projects that cannot use CO2 locally or need a backup outlet."
      sourceRefs: [4, 6, 9]
  dataMoats:
    - point: "A useful future dataset would link source-gas variability, membrane condition, mass/energy balance, downtime, measured CO2 composition, and the buyer's acceptance/rejection result at transfer. Such a dataset could improve underwriting and service guarantees, but no proprietary moat exists before repeated paid operation."
      sourceRefs: [2, 16]
    - point: "Pair-level data on carbonate process demand, seasonal offtake, conventional supply alternatives, and accepted CO2 value could support site selection; public sources do not disclose these buyer terms."
      sourceRefs: [1, 12, 13]
  geographicConsiderations:
    - point: "Poland is the strongest visible beachhead signal because Qemetica Soda Polska has a reported live membrane test and intended onsite carbonate use; no public contract economics or generalizable market count is available."
      sourceRefs: [1]
    - point: "EU/EEA projects must account for national permitting, ETS monitoring, and the distinction between utilization and geological storage; cross-border transport may add complexity where local use is absent."
      sourceRefs: [6, 9, 17]
    - point: "Norway and the Netherlands illustrate a large-scale cross-border storage pathway, while Switzerland is the membrane-supplier base; those locations evidence ecosystem activity, not a ready-made local carbonate market."
      sourceRefs: [2, 9, 15]
  sensitivityCases:
    - case: "The buyer accepts only a small fraction of captured output or cannot guarantee minimum offtake."
      impact: "The accepted-tonne revenue base shrinks while fixed capital, financing, and operating costs remain; underwriting fails unless a viable backup buyer or storage route exists."
      sourceRefs: [1, 2]
    - case: "Membrane performance degrades faster than the supplier's current cartridge-life expectation or site gas requires costly pretreatment."
      impact: "Availability and cost per accepted tonne deteriorate, undermining the service guarantee and potentially making solvent or other capture systems preferable."
      sourceRefs: [2, 3]
    - case: "Captured CO2 use does not create an eligible emissions-accounting benefit or is not competitive with conventional CO2 supply."
      impact: "The project loses a compliance or feedstock value argument; the buyer may continue conventional sourcing and the host may defer capital."
      sourceRefs: [5, 6, 12, 13]
    - case: "Grant awards or transport/storage infrastructure are delayed."
      impact: "Projects dependent on public capital or a nonlocal fallback outlet slip, strand development spend, or cannot reach financing close."
      sourceRefs: [4, 7, 8, 9, 10]
  validationPlan:
    - priority: high
      question: "Will a specific carbonate buyer sign a multi-year specification and minimum-volume agreement for captured CO2, with explicit acceptance, rejection, continuity, and price terms?"
      evidenceToGather: "Obtain a buyer-approved CO2 specification, written volume profile, current conventional supply terms, and a conditional offtake agreement; verify demand with buyer process and procurement owners."
    - priority: high
      question: "Can an independently measured pilot deliver enough buyer-accepted tonnes at stable quality and uptime on a real industrial gas stream?"
      evidenceToGather: "Run a site test across seasonal and upset conditions; collect independently witnessed composition, recovery, purity, energy, downtime, fouling, cartridge replacement, and accepted/rejected tonne data."
    - priority: high
      question: "Does the project close financially without assuming an unverified carbon credit, ETS exemption, or green premium?"
      evidenceToGather: "Build a project-level CAPEX/OPEX and financing case from vendor quotes, host utility costs, buyer alternatives, grants, and counsel-reviewed emissions accounting; compare the service's maximum affordable fee with total delivered cost."
    - priority: high
      question: "How many European source–carbonate pairs actually meet gas-fit, site, demand, and permitting criteria?"
      evidenceToGather: "Map soda ash, bicarbonate, precipitated calcium carbonate, and other carbonate users against nearby industrial exhaust sources; confirm live annual demand, CO2 source/process fit, transport distances, and decision-owner interviews."
    - priority: medium
      question: "Can the operating contract allocate membrane failure, off-spec product, emissions reporting, and plant-interruption liability without requiring an uneconomic availability guarantee?"
      evidenceToGather: "Review draft host, offtaker, supplier, EPC, and measurement contracts with an industrial insurer and counsel; test liability limits and remedies against pilot failure scenarios."
    - priority: medium
      question: "Can the company finance repeat projects without grant dependence after the first demonstration?"
      evidenceToGather: "Seek indicative project-finance terms against a contracted offtake and verified operating dataset; identify required equity, lender covenants, warranty support, and minimum project scale."
analysisModels:
  marketMapDiagram:
    title: "Specialization versus buying urgency"
    mermaid: |
      quadrantChart
        title European industrial carbon capture options
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Conventional CO2 supply: [0.15, 0.35]
        Plant-owned EPC retrofit: [0.45, 0.65]
        Modular capture vendors: [0.62, 0.68]
        UniSieve-Qemetica pilot: [0.78, 0.7]
        Proposed accepted-CO2 service: [0.92, 0.82]
  fiveForces:
    supplierPower:
      score: 4
      rationale: "Early deployments depend on a small pool of membrane specialists, EPCs, measurement providers, lenders, and site-specific process expertise; a single qualified membrane source could constrain availability and warranty leverage."
      sourceRefs: [2, 14, 16]
    buyerPower:
      score: 4
      rationale: "The host and carbonate offtaker are concentrated, technically sophisticated counterparties with conventional supply and internal-build alternatives; the service requires both sides to agree quality and volume."
      sourceRefs: [1, 12, 13]
    threatOfEntrants:
      score: 3
      rationale: "Project structuring and contracting are reproducible, but industrial reliability, capital access, safety, process integration, and a track record of accepted output create material entry hurdles."
      sourceRefs: [3, 6, 10, 15]
    threatOfSubstitutes:
      score: 5
      rationale: "Buyers can continue conventional CO2 sourcing; hosts can build their own capture, purchase another capture technology, pursue geological storage, or defer the retrofit. Several routes already have operational or public-project references."
      sourceRefs: [1, 9, 14, 15]
    competitiveRivalry:
      score: 3
      rationale: "Many capture technologies and developers compete for industrial capital, but public evidence of a specialist financed service paid only on carbonate-buyer acceptance is limited. Adjacent service and project models still create strong rivalry for sites and grants."
      sourceRefs: [1, 10, 14, 15]
  pestle:
    - factor: political
      impact: positive
      point: "EU industrial carbon-management targets and Innovation Fund support encourage capture investment, but project economics can remain dependent on public support."
      sourceRefs: [4, 7, 8, 17]
    - factor: economic
      impact: negative
      point: "Capture is capital-intensive and public project examples have required substantial subsidy; no public fee or unit-economics evidence validates an accepted-tonne service."
      sourceRefs: [10, 12, 15]
    - factor: social
      impact: neutral
      point: "Industrial buyers must trust product quality, safety, traceability, and continuity; the available evidence does not include direct buyer interviews or acceptance feedback."
      sourceRefs: [1, 16]
    - factor: technological
      impact: neutral
      point: "Molecular-sieving membranes offer a compact modular route, but stated cement capacity and cartridge life are supplier claims and require independent operating validation."
      sourceRefs: [2, 3]
    - factor: legal
      impact: negative
      point: "Geological storage has a formal EU safety and permitting framework; accounting for captured CO2 used in carbonate products must be confirmed separately rather than assumed to earn an ETS benefit."
      sourceRefs: [5, 6, 17]
    - factor: environmental
      impact: positive
      point: "Capturing process CO2 and routing it to a useful input may reduce emissions or displace conventional supply, but net benefit depends on energy use, source, product fate, and avoided-emissions accounting."
      sourceRefs: [9, 12, 13]
  adoptionFrictionMatrix:
    - friction: "Host and carbonate buyer must agree on a shared specification, volume profile, transfer point, and remedies."
      severity: high
      affectedBuyer: "Industrial host and carbonate process owner"
      mitigation: "Secure buyer-approved acceptance tests and conditional offtake before capital commitment; use independent sampling and a clear rejected-tonne protocol."
      sourceRefs: [1, 16]
    - friction: "Site-specific gas composition, dust, moisture, pressure, and process uptime can reduce membrane output or require balance-of-plant changes."
      severity: high
      affectedBuyer: "Host plant manager and process engineering"
      mitigation: "Run a feed-gas campaign and engineering study, then validate performance through an independently monitored pilot."
      sourceRefs: [2, 3]
    - friction: "The project company must fund equipment before it has a repeatable operating record or bankable offtake."
      severity: high
      affectedBuyer: "Host CFO and project-finance provider"
      mitigation: "Stage capital behind buyer commitment, supplier warranties, measurable commissioning gates, and project-level financing; do not rely on grants as recurring economics."
      sourceRefs: [7, 8, 10, 15]
    - friction: "CO2 utilization may not deliver the same legal treatment as geological storage, especially if permanence and downstream product fate are unclear."
      severity: high
      affectedBuyer: "Host compliance lead and carbonate buyer"
      mitigation: "Obtain jurisdiction-specific ETS/MRV advice and quantify value without assuming a credit or allowance exemption until confirmed."
      sourceRefs: [5, 6, 17]
    - friction: "Grant and public procurement processes can be lengthy and competitive."
      severity: medium
      affectedBuyer: "Project developer and host capital-project team"
      mitigation: "Screen eligibility early, keep a no-grant case, and align the project with a named buyer and measurable emissions reduction."
      sourceRefs: [7, 8]
    - friction: "Plant operators may prefer established CO2 supply or an internally controlled retrofit over a new third-party operator."
      severity: medium
      affectedBuyer: "Plant general manager and procurement"
      mitigation: "Compare delivered cost and interruption risk against current supply and offer a pilot with bounded integration and performance obligations."
      sourceRefs: [1, 12, 15]
market:
  tam:
    value: "10.0 MtCO2/year theoretical throughput ceiling"
    rationale: "Illustrative capacity calculation: operator-estimated 200 European cement sites × one 50,000 tCO2/year module per site = 10.0 Mt/year. The site count is an explicit screening assumption, not an audited retained-source count; 50,000 t/year is UniSieve's own design estimate. This ceiling ignores local-buyer fit, economic capture rate, competition, and project feasibility and is not a dollar revenue TAM."
    isEstimate: true
    sourceRefs: [2, 11]
  sam:
    value: "0.25–0.75 MtCO2/year candidate-pair throughput"
    rationale: "Operator screen: 5–15 European sites with plausible local carbonate demand and compatible source gas × up to 50,000 t/year per module = 0.25–0.75 Mt/year. Public evidence identifies a Qemetica pilot but does not enumerate qualifying sites; validate the denominator and actual demand before treating this range as addressable."
    isEstimate: true
    sourceRefs: [1, 2, 11]
  som:
    value: "0.005–0.09 MtCO2/year initial demonstration capacity"
    rationale: "Illustrative first five-year reach: 1–3 contracted source–buyer projects × 5,000–30,000 t/year demonstration-unit capacity = 5,000–90,000 t/year. The unit range is a supplier design claim; project count is an operator assumption, and accepted tonnes may be lower than installed capture capacity."
    isEstimate: true
    sourceRefs: [1, 2]
bottomUpSizingDrivers:
  - driver: "European cement-site ceiling"
    value: "Approximately 200 sites; operator estimate to be checked against a plant-level database, not a verified count from retained public text."
    source: "est."
  - driver: "Single-module technical ceiling"
    value: "Up to 50,000 tCO2/year per 12-metre unit; supplier design estimate, not independent operating data."
    source: "[2]"
  - driver: "Demonstration-unit design range"
    value: "5,000–30,000 tCO2/year per unit according to UniSieve; configuration and capture rate remain unverified in continuous operation."
    source: "[2]"
  - driver: "Candidate source–carbonate pairs"
    value: "5–15 estimated potential pairs for screening; the public evidence supports one reported Qemetica live-test pairing but not the broader count."
    source: "est."
  - driver: "Initial project count and throughput"
    value: "1–3 projects × 5,000–30,000 tCO2/year = 5,000–90,000 tCO2/year installed demonstration capacity."
    source: "calc."
  - driver: "Revenue per accepted tonne"
    value: "Not publicly disclosed in the reviewed sources; no dollar market estimate is made until buyer price, cost, and acceptance terms are validated."
    source: "est."
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: "EU policy, funding programmes, and national carbon-management plans are advancing industrial capture, transport, and storage projects."
      sourceRefs: [4, 7, 8, 17]
    - point: "A reported live membrane test that routes captured CO2 to carbonate production demonstrates a concrete local-use pathway, although not repeat demand."
      sourceRefs: [1, 2]
    - point: "Modular systems can be designed for staged deployment where site space or near-term capital limits a full-scale retrofit."
      sourceRefs: [2, 14]
  headwinds:
    - point: "Cement CCS remains early in scaling: LeadIT reports less than 2% of global cement emissions are projected to be captured by 2035 and notes dependence on public finance and shared infrastructure."
      sourceRefs: [10]
    - point: "Source-differentiated CO2 utilization is not yet a mature physical commodity market, and demand depends on policy, cost, and end-product acceptance."
      sourceRefs: [12, 13]
    - point: "The proposed service may be limited to a small number of co-located pairs with compatible source gas and a buyer able to absorb the available volume."
      sourceRefs: [1, 2, 11]
competitors:
  - name: "UniSieve and Qemetica Soda Polska"
    stage: "Reported live test / pre-commercial membrane application"
    wedge: "MOF-based membrane separation with captured CO2 intended for onsite carbonate production."
    pricing: "Not publicly disclosed; no public accepted-tonne contract terms."
    strength: "The closest visible technical and application analogue: source, membrane unit, industrial operator, and local carbonate use are paired in a real-site test."
    weaknessVsUs: "Public evidence describes a membrane test and intended use, not a third-party project company that finances and operates equipment with host fees conditioned on buyer acceptance."
    sourceRefs: [1, 2]
  - name: "Carbon Clean"
    stage: "Commercial modular capture technology provider"
    wedge: "Semi-modular solvent-based capture systems marketed for industrial deployment and scalability."
    pricing: "Not publicly listed; project-specific."
    strength: "Established capture technology and delivery support address integration and modularity for industrial customers."
    weaknessVsUs: "The public product page reviewed does not document the specific carbonate offtake pairing or accepted-product payment model; this is a gap in public evidence, not proof the company cannot offer it."
    sourceRefs: [14]
  - name: "Svante"
    stage: "Industrial capture technology company; reported in trade coverage as an active point-source competitor"
    wedge: "Solid-sorbent capture and modular filtration rather than the proposed membrane service."
    pricing: "Not publicly disclosed in the reviewed source."
    strength: "Alternative capture architecture expands vendor choice and can compete for the same industrial decarbonisation budget."
    weaknessVsUs: "The reviewed evidence does not show a carbonate-buyer acceptance contract or a local project-finance service."
    sourceRefs: [1]
  - name: "Heidelberg Materials / Brevik CCS and large CCS projects"
    stage: "Operating industrial capture-and-storage project; other projects at development and grant stages"
    wedge: "Plant-scale capture connected to transport and permanent geological storage."
    pricing: "Project-specific and materially supported by public capital; no comparable service tariff disclosed."
    strength: "Operating project experience, industrial integration, and an established permanent-storage pathway."
    weaknessVsUs: "Large transport/storage configurations may not be the lowest-friction route for a small local-use pair; they compete strongly when permanent storage is required."
    sourceRefs: [9, 10, 15]
  - name: "Plant-owned EPC retrofit and conventional CO2 supply"
    stage: "Incumbent status quo / substitute"
    wedge: "The host buys established feedstock or contracts a bespoke EPC capture retrofit and separately arranges utilization or storage."
    pricing: "Site-specific; reviewed public sources do not disclose a comparable cost or supply contract."
    strength: "Avoids reliance on an unproven service operator and preserves established purchasing, process-control, and maintenance routines."
    weaknessVsUs: "Leaves the host to coordinate financing, capture performance, quality testing, and offtake risk across separate vendors."
    sourceRefs: [1, 6, 12, 15]
regulatoryTechnicalConstraints:
  - point: "The EU CCS Directive requires a permit and safety framework for geological storage, including monitoring and financial security; any storage route adds national permitting and transport dependencies."
    sourceRefs: [6]
  - point: "The Commission's ETS description links allowance relief to CO2 successfully captured and stored. Do not assume that every CO2-to-carbonate use qualifies for equivalent treatment; confirm product permanence, monitoring, and emissions accounting with counsel."
    sourceRefs: [5, 6, 17]
  - point: "Industry CO2-chain guidance explains that impurities can affect capture, transport, corrosion, blockages, and economics, so quality and conditioning limits must be set across the full chain rather than inferred from a nominal purity figure."
    sourceRefs: [16]
  - point: "UniSieve's cement design depends on upstream filtration and later water removal; dust, moisture, pressure, feed variation, and membrane life need plant-specific validation."
    sourceRefs: [2, 3]
  - point: "Cross-border storage and infrastructure are active but not universally available; a project relying on them must confirm route, access, permits, and schedule before committing capture capital."
    sourceRefs: [6, 9, 17]
validationSignals:
  - point: "Qemetica Soda Polska is reported to have started live testing a UniSieve membrane unit with onsite carbonate production as the intended use; this validates technical-customer interest, not commercial offtake."
    sourceRefs: [1]
  - point: "UniSieve describes pre-commercial maturity and gives demonstration and container capacities, but its operating and cartridge-life statements are company claims."
    sourceRefs: [2]
  - point: "EU funding and the operating Yara Sluiskil project establish that significant industrial capture budgets and public-private project structures exist, especially for storage-linked projects."
    sourceRefs: [7, 8, 9]
  - point: "LeadIT's review of cement projects links deployment to public finance and transport/storage infrastructure, and reports a large gap between projects planned and the sector's total emissions."
    sourceRefs: [10]
openQuestions:
  - "What exact CO2 concentration, moisture, impurity, pressure, continuity, and annual volume will the carbonate buyer accept at the transfer point?"
  - "What share of captured output is accepted after conditioning, and how does the host's payment change for off-spec output or outages?"
  - "What is the present cost and contract duration of conventional CO2 supply to the target process, and does captured feedstock displace it?"
  - "How many European industrial sites have both compatible exhaust and an onsite carbonate process with sufficient year-round demand?"
  - "What membrane skid and balance-of-plant CAPEX, energy draw, replacement interval, and staffing requirement are independently verified?"
  - "Does use in each proposed carbonate product qualify for any ETS accounting benefit, and what product-fate or permanence evidence is required?"
  - "Can a project company obtain non-grant debt after one demonstration, and what minimum contract term, equity, warranty, and availability floor would lenders require?"
  - "Would a host actually transfer process control and site access to a third-party operator, or prefer an EPC build-own-operate arrangement?"
