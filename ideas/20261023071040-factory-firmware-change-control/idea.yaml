    signalRefs:
      - "Legacy tools leave integration and ROI risk"
    sourceRefs:
      - 3
differentiator: >-
  PreScalar's announced approach connects factory test stations, firmware management, and device-level production
  data; this concept sells recovery for a batch already outside its original production flow. Its unit of work is
  an OEM-authorized serial that passes a post-change test at the inventory's current location, and its initial
  commercial unit is a per-passing-serial job rather than a factory-line installation.
conceptDiagram:
  title: "Recover stock at its current node"
  mermaid: |
    flowchart LR
      ChangeOrder[OEM change order] --> Inventory[Scan affected serials]
      Inventory --> Station[Authorized local station]
      Station --> Test[Flash and run OEM test]
      Test -->|pass| Proof[Serial-level proof]
      Proof --> Ship[Release passing units]
      Test -->|fail| Hold[Quarantine for OEM disposition]
