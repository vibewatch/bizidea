jobsToBeDone:
  - job: >-
      When an OEM-approved firmware change reaches hardware already at a contract manufacturer, help manufacturing
      quality leads update and revalidate each affected serial, so they can ship conforming units without sending the
      whole lot back.
    currentAlternative: "Manually reprogram affected units at an available station or return them to the manufacturer."
    successMetric: "Share of affected serials that pass before the planned ship date, with return shipments avoided per batch."
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      It turns existing supply-chain locations into a distributed, OEM-authorized recovery network paid per serial
      that passes, rather than stopping at change visibility or factory data capture.
  venturePotential:
    score: 4
    rationale: >-
      Repeat firmware-change jobs and expansion across contract manufacturers can compound, but local service density,
      integration effort, and uneven update volume may limit early margins.
  whiteSpace:
    score: 3
    rationale: >-
      The sources identify incumbent test-equipment and manufacturing-software adjacency; the distinct
      post-production inventory-recovery wedge may still be absorbed by those vendors.
  painIntensity:
    score: 4
    rationale: >-
      The source set directly documents manual reprogramming or returns, delay, cost, and traceability gaps when
      firmware changes arrive late.
  wedgeClarity:
    score: 4
    rationale: >-
      One OEM, one inventory location, and one accepted firmware-change batch form a measurable pilot, though buyer
      access and station permissions are not yet evidenced.
  evidenceFit:
    score: 4
    rationale: >-
      The failure mode and adjacent product activity are directly supported by three sources, but customers are
      unnamed and post-pilot economics remain unproven.
topRisks:
  - name: "Firmware authorization and security"
    description: >-
      OEMs may refuse to let an outside partner access devices or run update images at a contract-manufacturer site.
    mitigation: >-
      Keep signing keys with the OEM, require explicit job authorization, use scoped signed images, and audit every
      station action before expanding beyond a single site.
  - name: "Partner coverage and utilization"
    description: >-
      Local station qualification and sparse firmware-change volume can make a distributed service network expensive
      before enough jobs recur.
    mitigation: >-
      Start with one contract manufacturer that holds concentrated inventory and use an existing approved station
  - name: "Acceptance and device liability"
    description: >-
      A failed update or inadequate post-flash test could damage units or allow a nonconforming device to ship.
    mitigation: >-
      Use OEM-defined acceptance tests and rollback instructions, quarantine failures, and cap initial pilots to one
      product line with explicit OEM release authority.
