slug: inventory-firmware-recovery
date: "2026-10-23"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: Model period and calendar
    value: "M1 is October 2026; the 36-month period runs through September 2029. Y1 is October 2026–September 2027, Y2 is October 2027–September 2028, and Y3 is October 2028–September 2029."
    unit: calendar months
    source: "[business-plan.yaml date and requested three-year model convention]"
  - id: A1
    name: Initial pre-seed financing
    value: "USD 3.2M received in M1; within the plan's USD 2–4M pre-seed range. The round is sized for an 18-month proof plan, a six-month reserve, and unquoted security, insurance, partner-qualification, and collection risk."
    unit: USD millions
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd and fundingAsk.runwayMonths; USD 3.2M is a modeler-selected scenario, not committed capital]"
  - id: A2
    name: Paid customer-program ramp
    value: "One paid OEM-CM program begins in M6, a second in M16, and a third in M25; no pipeline prospects are counted as customers. The plan targets one paid pilot, a same-site repeat, and up to three qualified CM nodes by month 36."
    unit: paid customer-program start month
    source: "[business-plan.yaml product.sixMonth, product.twelveMonth, product.twentyFourMonth, milestones, and team sequencing; timing and conversion are unvalidated model assumptions]"
  - id: A3
    name: Campaign pricing
    value: "USD 20 per serial accepted after the OEM-defined test, plus a USD 20K one-time site/product/test-profile setup fee for each new customer program. The per-serial fee is the research sizing assumption; setup fee is an explicit quote hypothesis."
    unit: USD per passing serial and USD thousands per new program
    source: "[business-plan.yaml gtm.pricing and businessModel.revenueStreams; research.yaml market.tam, market.sam, market.som, and bottomUpSizingDrivers disclose USD 20 as hypothetical, not observed pricing]"
  - id: A4
    name: Passing volume and service ARPU
    value: "Base service activity is 1.5 eligible jobs per active site per year and 5,000 passing serials per job, yielding USD 150K annual service ARPU (1.5 × 5,000 × USD 20); setup fees are additional. The 5,000-unit batch is an illustrative research sizing input, not a validated typical batch."
    unit: jobs per site-year; passing serials per job; USD thousands per customer-year
    source: "[business-plan.yaml operatingAssumptions; research.yaml bottomUpSizingDrivers and market.som; recurrence, passing rate, batch size, and price remain unverified]"
  - id: A5
    name: Revenue recognition and customer reconciliation
    value: "Recognize expected service billings evenly at USD 12.5K per active customer-month (USD 150K annual ARPU ÷ 12), plus the USD 20K setup fee in each new-program month. Active paid customer-months are 7 in Y1, 21 in Y2, and 36 in Y3; revenue is respectively USD 107.5K, USD 282.5K, and USD 470K. Monthly smoothing represents expected campaign activity, not a recurring subscription."
    unit: customer-months and USD thousands
    source: "[Derived from A2–A4; business-plan.yaml charges setup plus passing-serial fees and does not validate monthly recurring revenue. Monthly recognition is a forecast convention for lumpy campaign work]"
  - id: A6
    name: Funnel and fully loaded CAC
    value: "Funnel targets imply 30% qualified-pair-to-review × 25% review-to-paid-pilot = 7.5% qualified-pair-to-paid conversion, or about 13.3 qualified pairs per win. Fully loaded CAC is USD 180K per new paid program: USD 540K acquisition-cost allocation across three wins, comprising USD 502K modeled non-payroll sales/marketing plus USD 38K attributed founder payroll; these costs are already in P&L and are not added again."
    unit: percent; qualified pairs per win; USD thousands per customer
    source: "[business-plan.yaml gtm.funnelTargets; CAC and payroll allocation are explicit high-touch industrial B2B planning heuristics because no observed CAC or sales-cycle data is available]"
  - id: A7
    name: Customer life and churn for LTV
    value: "Use 2.8% monthly churn and 35.7 expected customer-life months (1 ÷ 2.8%) solely for unit economics; this is a planning proxy for an unproven repeat-campaign relationship. Base customer counts are retained through the modeled milestone horizon and do not apply stochastic churn."
    unit: percent monthly and months
    source: "[business-plan.yaml gtm.funnelTargets and investorMemo.mustBeTrue establish repeat-rate uncertainty; 2.8% monthly churn / 35.7-month life is a named modeler startup-finance heuristic, not observed retention]"
  - id: A8
    name: Gross margin and direct costs
    value: "COGS is 45% of revenue in Y1 (55% gross margin during the first high-touch pilot), 35% in Y2 (65% margin as the first repeat is reused), and 30% in Y3 (70% margin on standardized repeat work)."
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct is 70% and milestones target above 70% only on standardized repeat jobs; earlier-year margin ramp is a modeler heuristic for partner labor, travel, and campaign support]"
  - id: A9
    name: Team, start dates, and loaded compensation
    value: "CEO/commercial lead USD 150K, founding engineer USD 210K, field operations/quality lead USD 162K, integration engineer USD 204K, and partner-operations coordinator USD 150K fully loaded annual cost. Start dates are M1 for founders, M3 for field operations, M7 for integration after the paid pilot, M22 for a second field operator after repeat evidence, and M31 for a third-node field operator plus partner coordinator. Fractional counsel is external G&A, not FTE."
    unit: USD thousands per loaded FTE-year and model month
    source: "[business-plan.yaml team, sequencingRationale, experimentRoadmap, and milestones; compensation is a named startup-finance planning heuristic, not a salary survey or quote]"
  - id: A10
    name: Non-payroll operating expenses
    value: "Y1 monthly S&M/R&D/G&A are USD K: M1–M3 6/18/20, M4–M6 8/25/25, M7–M12 10/30/30. Y2 quarterly S&M is 35/40/45/50, R&D 65/70/75/80, and G&A 65/70/75/80. Y3 quarterly S&M is 50/55/60/65, R&D 70/75/80/85, and G&A 75/80/85/90."
    unit: USD thousands per month in Y1 and per quarter in Y2–Y3
    source: "[business-plan.yaml gtm, product, operations, team, and experimentRoadmap; expense cadence is a modeler operating heuristic for founder-led selling, secure workflow, pilot integration, counsel, and insurance, not vendor quotes]"
  - id: A11
    name: Cash-flow boundary
    value: "Opening cash is zero; receive A1 financing in M1; no follow-on round is modeled. Cash EOP = prior cash + funding inflow + EBITDA; assume same-period collections and payments, no taxes, interest, working-capital change, owned-station capex, or depreciation."
    unit: USD thousands and modeling convention
    source: "[business-plan.yaml explicitly defers owned stations and requests an 18-month proof round; same-period cash conversion and excluded balance-sheet items are simplifying modeler assumptions]"
  - id: A12
    name: Funding use and six-month reserve
    value: "Allocate USD 1.40M Engineering, USD 0.65M GTM, USD 0.45M G&A, and USD 0.70M Buffer (6 mo), totaling USD 3.20M. The USD 0.70M reserve approximates six months at roughly USD 117K monthly net cash use near the proof period; the round includes additional contingency for unquoted approvals and delivery."
    unit: USD millions
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary and 18-month runway; allocations are modeler planning judgments, not approved budgets]"
  - id: A13
    name: Scenario and sensitivity shocks
    value: "Downside: only two programs by M36, 60% Y3 gross margin, and all planned Y3 hires remain committed. Upside: two existing programs each achieve two jobs in Y3 and standardized-job gross margin reaches 72%. Downside sensitivities versus base test 1.0 rather than 1.5 jobs/site-year, USD 16 rather than USD 20 per passing serial, two rather than three programs, a six-month sales delay, 60% rather than 70% gross margin, and two gated hires six months early."
    unit: scenario assumptions
    source: "[business-plan.yaml risks, killCriteria, milestones, and operatingAssumptions identify authorization, repeat volume, margin, and hiring gates; shock sizes are modeler stress-test assumptions]"
