modelSanity:
  - checkName: Revenue engine
    finding: "Three customer-years at USD 150K service ARPU plus one USD 20K setup fee drive the base to USD 470K Y3 revenue."
  - checkName: Must go right
    finding: "Written OEM/CM authorization, a same-site paid repeat, and a 70% standardized-job gross margin must arrive before additional field and partner hiring."
  - checkName: Model breaks if
    finding: "If the third program or repeat activity fails, the downside cash low point is -USD 1,130.75K, while even the base case ends at -USD 981.75K without follow-on funding."
  - checkName: Next-round proof
    finding: "The next financing requires month-18 evidence of an authorized paid pilot, same-site repeat, positive contribution, and reusable approval at another CM, while the USD 3.2M pre-seed carries a six-month reserve."
sanityChecks:
  ruleOf40: "Y3 revenue growth 66.4% + Y3 EBITDA margin -337.2% = -270.8%; directionally negative and not a meaningful SaaS benchmark at this early service scale."
  burnMultiple: "Y3 EBITDA/cash burn USD 1,585K ÷ incremental revenue USD 187.5K = 8.45x; weak efficiency, with no follow-on included."
  revenuePerFte: "USD 78.3K Y3 revenue per average 6.0 FTE (USD 470K ÷ 6); low because the model is still a service-led proof stage."
  flags:
    - "No named customer, validated per-serial price, typical batch size, eligible-event frequency, renewal history, or post-pilot ROI was established in the inputs; nearly all revenue drivers remain hypotheses."
    - "The model assumes monthly smoothed campaign billings and same-period collection even though the actual service is lumpy and revenue is earned only on passing serials."
    - "Base cash turns negative in Q2Y3 and ends at -USD 981.75K because no follow-on is modeled; a financing or cost reset is required before cash depletion."
    - "Y3 EBITDA is -USD 1,585K, the Rule-of-40 direction is -270.8%, burn multiple is 8.45x, and revenue is only USD 78.3K per average FTE."
    - "The 1.74x LTV/CAC ratio and 20.6-month payback depend on unvalidated three-year customer life and a USD 180K CAC; they are not yet scale-ready unit economics."
    - "The 70% gross margin is a Y3 standardized-repeat target, not demonstrated economics; security approval, partner utilization, and incumbent competition remain gating risks."
