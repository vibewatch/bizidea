pnlMethodology:
  assumptionRefs:
    - A3
    - A4
    - A8
    - A9
    - A10
    - A11
  description: "cogsK = revenueK × the annual COGS rate; grossProfitK = revenueK − cogsK; salaryK is fully loaded payroll; opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK; ebitdaK = grossProfitK − opexK."
cashFlowMethodology:
  assumptionRefs:
    - A1
    - A11
  description: "Y1 M1 includes the only modeled financing inflow of USD 3,200K. Thereafter cashEopK rolls forward from prior cash plus EBITDA and any funding inflow; no follow-on financing is assumed, so negative balances indicate an unfunded cash need, not available liquidity."
