headcountBasis:
  assumptionRefs:
    - A9
  description: "Annualized payroll is loaded FTE cost multiplied by quarter-end headcount; the actual period payroll is salaryK and is included in opexK. Y1 FTE snapshots are 3/3/4/4, then 5 at Q4Y2 and 7 at Q4Y3."
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
    - A5
  customerDefinition: "customersEop is the count of paid OEM-CM customer programs retained at period end, not prospects, serials, or individual campaign jobs; newCustomers counts program starts."
  formula: "Monthly Y1 revenue = active customer programs × USD 12.5K expected service billings + USD 20K setup in each new-program month. Quarterly Y2/Y3 revenue is the sum of the same monthly formula. Annual service revenue reconciles to customer-months ÷ 12 × USD 150K ARPU, plus setup fees: Y1 7/12 × 150 + 20 = 107.5K; Y2 21/12 × 150 + 20 = 282.5K; Y3 36/12 × 150 + 20 = 470K."
  limitation: "Campaign work is lumpy and billed only for accepted serials; monthly smoothing and same-period cash collection are forecasts, not contracted recurring revenue or demonstrated billing behavior."
