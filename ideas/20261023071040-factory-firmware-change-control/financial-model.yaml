    y3RevenueImpactK: -150.0
    cashImpactK: -105.0
  - variable: per-serial price
    downsideCase: "USD 16 per passing serial"
    baseCase: "USD 20 per passing serial"
    upsideCase: "USD 24 per passing serial"
    y3RevenueImpactK: -90.0
    cashImpactK: -63.0
  - variable: paid customer conversion
    downsideCase: "2 paid programs by M36"
    baseCase: "3 paid programs by M36"
    upsideCase: "4 paid programs by M36"
    y3RevenueImpactK: -170.0
    cashImpactK: -119.0
  - variable: sales cycle
    downsideCase: "Third customer starts M31 instead of M25"
    baseCase: "Third customer starts M25"
    upsideCase: "Third customer starts M22"
    y3RevenueImpactK: -75.0
    cashImpactK: -52.5
  - variable: gross margin
    downsideCase: "60%"
    baseCase: "70%"
    upsideCase: "75%"
    y3RevenueImpactK: 0.0
    cashImpactK: -47.0
