fundingAsk:
  round: pre-seed
  amountM: 3.2
  runwayMonths: 24
  milestone: "By month 18, secure OEM and CM written authorization, complete a paid single-site pilot and same-site repeat, and document positive contribution and cost/release-time advantage; retain six months of reserve while deciding whether to expand to a second node."
  useOfFunds:
    - bucket: Engineering
      amountUsd: 1400000
      percentage: 43.75
    - bucket: GTM
      amountUsd: 650000
      percentage: 20.31
    - bucket: "G&A"
      amountUsd: 450000
      percentage: 14.06
    - bucket: "Buffer (6 mo)"
      amountUsd: 700000
      percentage: 21.88
scenarios:
  downside:
    description: "The third program does not close, repeat activity is limited to the two existing programs, early pilot-like margins persist, and planned Y3 hires remain committed."
    y3RevenueK: 300.0
    y3EbitdaK: -1734.0
    cashLowPointK: -1130.75
    keyAssumptionChanges:
      - "Only two paid customer programs remain active, each generating 1.5 expected jobs and USD 150K service ARPU; the new-program setup and service revenue are absent."
      - "Y3 gross margin is 60% rather than the 70% base assumption."
      - "The third-node field and partner hires remain on payroll despite the missed sale; no follow-on financing is modeled."
  base:
    description: "Three paid customer programs start in M6, M16, and M25; expected service activity is smoothed monthly and the third-node hires start only after the program is signed."
    y3RevenueK: 470.0
    y3EbitdaK: -1585.0
    cashLowPointK: -981.75
    keyAssumptionChanges:
      - "Base-case Y3 revenue, EBITDA, and cash low point reconcile to totals.y3."
      - "Three customer-years at USD 150K service ARPU plus one USD 20K setup fee produce USD 470K revenue."
  upside:
    description: "The two existing programs each generate two campaigns in Y3 and repeat-job execution reaches a 72% gross margin, with no additional team beyond the base plan."
    y3RevenueK: 570.0
    y3EbitdaK: -1503.6
    cashLowPointK: -900.35
    keyAssumptionChanges:
      - "Two existing programs deliver two 5,000-serial jobs each at USD 20 per passing serial, versus 1.5 expected jobs in the base case."
      - "The new third program contributes one full year of expected service activity plus its setup fee."
      - "Y3 gross margin improves to 72%; no future financing is assumed."
