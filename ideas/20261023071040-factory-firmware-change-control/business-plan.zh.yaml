slug: "inventory-firmware-recovery"
date: "2026-10-23"
executiveSummary: >-
  Inventory Firmware Recovery（库存固件恢复）是一项获 OEM 授权的服务，适用于生产测试后出现固件变更、而序列化电子产品仍存放在合同制造商（CM）或获批库存节点的场景。首个买家是面临发货暂停的 OEM 制造或运营负责人；OEM 固件、安全、质量团队和 CM 都必须批准固件镜像、序列号范围、工位访问、测试及放行。单笔订单使用已有的获批工位扫描受影响序列号，在签名密钥仍由 OEM 持有的前提下刷入 OEM 签名镜像，运行 OEM 定义的验收测试，并生成通过或隔离记录。拟议收费方式是固定的站点及测试配置费，外加每个通过测试的序列号收费；目前尚无经验证的单价或具名付费客户。PreScalar 描述了人工重新编程或退货，GM 为大批量活动配置专职岗位，TRIGO 也报告了相关活动；这些材料说明需求压力存在，同时也显示现有厂商已有成熟能力。PreScalar 宣布获得的 $7 million 种子轮融资，以及媒体报道的总额超过 $100,000 的试点合同，只是相邻预算信号，不能证明续约、ROI 或可供背调的买家。$553 million TAM、$55.3 million SAM 和 $4.0 million SOM 都是情景估算，依据的是宽泛的经营场所代理值，以及假设的事件率、批量和每个序列号 $20 的收费，并非实测服务收入。只为验证一笔通过安全审批的付费订单提供资金；该订单还必须降低总成本或加快放行。相较 TRIGO、Green Wave、SEGGER、PreScalar 及 CM 或 OEM 内部流程是否有差异化，以及事件量能否重复，仍是投资门槛。
problem:
  - "固件修订可能在生产线末端测试结束后才到，也可能在序列化在制品（WIP）和成品存放于 CM 期间才到；这会导致手工返工或退货运输，发货日期也因此面临风险。"
  - "OEM 需要序列号级证据，证明使用了获授权的镜像、由谁操作、测试结果如何，以及产品如何处置；研究提到追溯缺口，但没有量化其发生频率或成本。"
  - "本地重刷不能被宣称为市场空白：TRIGO 和 Movimento 执行活动，Green Wave 推广电子产品库存重刷，SEGGER 提供安全的异地编程，OEMs 或 CMs 也能使用现有工位。"
  - "尚未独立核实具名电子产品买家、每序列号价格、固件变更发生率、典型批量或复购率。"
solution:
  - "接收 OEM 下达的恢复订单，明确签名镜像、受影响序列号清单、工位使用规则、验收测试及由 OEM 掌握的放行权；服务方不持有签名密钥。"
  - "在一个获批库存节点，使用获授权的工位，由获授权的操作员扫描、重刷并测试；记录新旧版本和每个序列号的结果，失败品隔离后交由 OEM 处置。"
  - "跨获批站点协调订单和凭证，收取配置费，并仅对通过测试的序列号收费；验证买家是否认为这种协调服务优于现有厂商或内部流程。"
whyWeWin:
  - "首笔订单对应有时限的发货暂停，可与可量化的替代方案成本直接比较；不必替换全厂 MES，也无需提供固件监控仪表盘。"
  - "使用现有获授权工位、由 OEM 控制的密钥和 OEM 定义的测试，既不必一开始就自建设备车队，也让最终放行权留在买家手中。"
  - "潜在优势在于审批、订单协调，以及跨站点可采信的序列号级凭证，而非刷写本身。TRIGO、Green Wave、SEGGER 和 PreScalar 已覆盖相邻的执行或追溯需求，因此这一优势尚未得到验证。"
strategicChoices:
  beachhead: "目标客户是美国电子产品 OEMs：获批固件变更在生产测试后到达时，其序列化 WIP 或成品库存存放在单一合同制造站点。"
  wedgeRationale: >-
    聚焦一个受影响的产品系列、一个 CM 节点和一批获认可的恢复订单，既能单独核算成本与排期价值，也能控制集成和安全范围。选择美国电子行业，与创意所设定的目标买家一致；同时避开已有公开规模的汽车活动市场（TRIGO 已在该领域布局）。Green Wave 仍是直接的电子产品替代方案，因此这个滩头市场只是可测试的切入口，市场空白尚未得到验证。
  sequencingRationale: >-
    先取得 OEM 和 CM 授权，并将订单成本与实际返工、运费和延误成本比较；再围绕站点现有工位搭建精简的订单控制和凭证流程。只有拿到付费试点后才扩充现场和集成能力；新增合作节点前先争取复购；在追求软件式毛利前，先把流程标准化。
  notYet:
    - "不替换通用 MES、工厂测试工位或设备管理系统。"
    - "在核实具体产品的审批及法律范围前，不进入汽车活动网络，不做 OTA 产品、医疗或国防产品，也不开展跨境部署。"
    - "在复购量、合作方准入和数据权利得到证明前，不自购工位车队、不建市场平台，也不开发汇集客户数据的产品。"
market:
  tam: "示意性年度美国市场上限为 $553.0M，并非实测品类收入：3,686 个 NAICS 3344 类经营场所 × 假设每年 1.5 笔合格订单 × 每笔 5,000 个序列号 × 假设每个通过测试的序列号收费 $20。经营场所数量只是宽泛的站点代理值，并非合格买家数；订单量和收费输入均未经核实。"
  sam: "示意性年度情景估算为 $55.3M：将 10% 的 3,686 个经营场所代理值视为合格站点，仍假设每站点每年 1.5 笔订单、每批 5,000 个序列号和每个通过测试的序列号收费 $20。站点资格、复购频次、批量和价格均未经验证。"
  som: "第五年示意性年度服务收入总额情景估算为 $4.0M：20 个可触达的美国站点 × 每站点每年 2 笔订单 × 每笔 5,000 个验收通过的序列号 × 每个通过测试的序列号收费 $20。站点数量、订单复购频次、批量和收费都是运营方假设；估算未计入配置、合作方人工、差旅、安全审查和支持成本。"
  segments:
    - "主要客群：美国电子产品 OEMs，其序列化成品或 WIP 存放于 CM，且遇到非 OTA 后期固件变更。"
    - "次要客群：获 OEM 授权、能提供获批工位及操作员的 CMs、维修站和重刷服务商。"
  buyingProcess: >-
    OEM 的制造质量或产品工程负责人识别受影响序列号，并批准镜像和测试；CM 控制本地准入和执行。OEM 运营或制造高管承担排期、运费和返工成本，但安全、产品工程、质量、采购团队及 CM 都可以否决订单。
product:
  mvp: >-
    提供单站点托管恢复订单：明确订单授权范围、核对序列号清单、接入现有获批编程器或测试工位、执行 OEM 定义的测试、生成防篡改订单记录，并设置隔离流程。密钥始终由 OEM 持有，放行权也归 OEM；先服务一个产品系列，异常情况人工处理，不做通用工位平台。
  sixMonth: "只有取得 OEM 和 CM 的书面批准后，才完成一个付费单站点试点；记录每个获授权序列号的刷写前后版本、工位、操作员、测试结果和处置结果，再将成本及放行时间与实际替代方案核对。"
  twelveMonth: "目标是在同一站点拿到复购订单，并支持一个额外的兼容产品配置；在新增站点前，记录配置工时、合作方人工、通过率、排期影响和单笔订单贡献。"
  twentyFourMonth: "如果复购持续发生、审批仍有效，就用可复用流程及合作方手册，为最多三个 CM 节点完成资质认证；否则继续做聚焦的活动服务，或停止拓展网络，不为闲置产能投入。"
  keyBets:
    - "至少一家 OEM 和一家 CM 愿意授权第三方操作员执行订单，同时由 OEM 控制镜像签名、序列号范围、审计、测试和放行。"
    - "现有工位和 OEM 测试配置无需新购硬件，就能支持首个产品系列。"
    - "将全部人工、配置、搬运、运费、延误和故障成本纳入比较后，买家仍愿为可验证的本地恢复付费，而不只是为了省运费。"
gtm:
  wedge: "获批固件变更让 CM 持有的序列化库存暂停发运、且发货期限将至时，直接向 OEM 制造或运营负责人销售一笔付费恢复订单；承诺工位准入或排期前，先让 CM 质量和生产负责人参与。"
  channels:
    - "由创始人直接触达 OEM 制造质量、运营和产品工程负责人，围绕具体的后期变更成本及序列号范围开展评估。"
    - "通过 CM、获授权的维修商或重刷服务商引荐，优先选择已有 OEM 授权且工位兼容的合作方。"
    - "仅在 OEM 和 CM 仍掌握授权权及放行控制权时，接受编程和测试设备供应商的集成引荐。"
  funnelTargets: "运营目标，非实测转化率：合格 OEM-CM 组合进入联合安全/质量审查的比例为 30%；审查转为付费单站点试点的比例为 25%；验收通过的试点在 12 个月内转为付费复购的比例至少为 50%。前 10 组符合条件的组合后重新校准。"
  pricing: "假设：收取固定的站点/测试配置费，外加每个通过 OEM 定义测试的序列号费用。报价应与实际返工、退货运费、搬运、延误、合作方人工及责任成本比较；目前没有公开的每序列号价目，也没有经过验证的付费意愿。"
businessModel:
  revenueStreams:
    - "一次性站点及产品/测试配置费。"
    - "仅对通过 OEM 定义的刷写后测试的设备收取每序列号费用。"
    - "出现复购需求后，如果买家更偏好 SLA，可选购预留活动产能或按站点收取持续协调费。"
  unitOfValue: "一个获 OEM 授权的序列号，在当前库存节点完成更新，通过 OEM 刷写后测试，并获得可审计的处置记录。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "同一 OEM 和产品系列的恢复订单复购。"
    - "量化工位和测试配置的复用程度后，拓展至其他兼容产品及 CM 站点。"
    - "只有在利用率和责任条款支持可持续毛利后，才通过合作方交付活动并预留产能。"
strategyMap:
  northStarMetric: "每季度在计划发货日期前，通过获授权的本地恢复订单完成并由 OEM 放行的序列号数；同时要求每笔订单贡献为正，且未发生任何未授权放行。"
  inputMetrics:
    - "每个目标 OEM-CM 站点记录的合格后期变更事件及受影响序列号数。"
    - "候选订单中，书面获得 OEM 对镜像、序列号范围和测试的批准，并获得 CM 站点准入批准的比例。"
    - "付费试点转化率、通过测试的序列号占比、配置工时、合作方人工及单笔订单总贡献。"
    - "在 12 个月内带来另一笔付费订单的验收通过试点数。"
  moatsToBuild:
    - "一套可复用的 OEM 安全与质量审批材料，覆盖镜像范围、操作员准入、工位身份、审计记录、隔离和 OEM 放行。"
    - "在 OEM 授权执行的站点获得合格合作方准入，并能重复配置测试方案。"
    - "经客户授权的序列号级执行记录；目前尚未建立专有数据护城河，SEGGER 和 PreScalar 已提供相邻的编程或追溯记录。"
  killCriteria:
    - "截至第6个月，如果没有 OEM-CM 组合书面批准由获授权的本地操作员执行限定范围的签名镜像、OEM 定义的测试，并且仅由 OEM 放行，就停止第三方执行模式，或转向由 OEM/CM 员工操作的软件流程。"
    - "如果三组目标 OEM-CM 组合无法证明每站点每年合格实体恢复订单数的中位数至少为 1.5 笔，或无法证明订单量足以实现正的单笔贡献，就不建设网络。"
    - "如果前两笔付费试点都未能证明相较客户实际替代方案，总恢复成本更低或放行更快，且测试和放行控制权相当，就停止宣称有 ROI，并重新定价或停止。"
    - "如果前四笔验收通过的付费订单中，不足两笔在 12 个月内复购，或标准化订单扣除合作方人工和差旅后仍为负贡献，就不扩大站点覆盖。"
  mermaid: |
    flowchart LR
      Trigger[Approved late firmware change] --> Order[OEM-authorized single-site job]
      Order --> Station[Existing approved CM station]
      Station --> Test[OEM-defined post-flash test]
      Test -->|pass| Proof[Accepted serial record and measured ROI]
      Test -->|fail| Hold[Quarantine; OEM disposition]
      Proof --> Repeat[Paid repeat at same site]
      Repeat --> Network[Add a qualified CM node]
investorMemo:
  verdict:
    call: "观望"
    conviction: "偏低至中等：运营痛点和活动业务都有证据，但买家准入、复购量及有差异化的付费流程尚未得到验证。"
    whyBelieve: "PreScalar 描述了后期变更引发的返工，GM 为大批量活动配置执行人员，TRIGO 也报告了大型重刷活动；这些都说明存在明确的订单类型和可识别的运营负责人。"
    whyDoubt: "TRIGO 和 Green Wave 已提供本地重刷，SEGGER、PreScalar、内部团队及 OTA 也覆盖相邻流程；目前没有核实具名客户、单价、复购率或试点后的 ROI。"
    nextDiligence: "审查三组 OEM-CM 组合过去 12 个月的匿名变更及成本记录，并拿下一笔已获预先授权的付费试点，约定与现有厂商流程进行比较。"
  firstCustomer:
    title: "库存由 CM 持有序列化产品的美国电子产品 OEM"
    profile: "电子产品 OEM 在生产线末端测试后，仍有成品或在制品（WIP）存放于合同制造商；随后发生的固件变更无法靠 OTA 安全、切实地处理。"
    trigger: "计划发货日期前，OEM 批准的镜像影响 CM 持有的库存，迫使买家在本地返工和退货运输之间做出选择。"
    buyer: "OEM 制造或运营副总裁"
    initialContract: null
  mustBeTrue:
    - "三组目标 OEM-CM 的变更订单和库存记录显示，每站点每年合格实体恢复订单数的中位数至少为 1.5 笔，且批量足以实现正的单笔订单贡献。"
    - "至少一家 OEM 和一家 CM 书面授权操作员、签名镜像、序列号范围、工位准入、测试记录和隔离流程，并规定仅由 OEM 放行，且不转移签名密钥。"
    - "买家签署单站点付费试点，支付配置费及通过测试的序列号费用；实际发票或报价证明总成本更低或放行更快。"
    - "首个产品配置能在已获批准的工位上运行，并可复用于第二笔兼容订单；无需新购工位，也不必投入会吃掉订单贡献的定制集成。"
    - "前四笔验收通过的付费订单中，至少两笔在 12 个月内复购，且扣除合作方人工、差旅、支持和配置成本后仍有正贡献。"
  diligenceQuestions:
    - "目标 OEM-CM 客群每年有多少次后期固件变更影响序列化在制品（WIP）或成品库存？实际受影响设备数量的分布如何？"
    - "哪位高管承担可避免的成本并掌握预算？谁能否决镜像、操作员、质量记录或站点准入？"
    - "OEM 安全和质量团队是否会批准外部操作员？密钥保管、测试、回滚、隔离和放行具体需要哪些控制？"
    - "上一笔类似订单的人工、配置、运费、延误、现有厂商费用和故障设备处置成本分别是多少？买家愿意花多少钱改变现状？"
    - "TRIGO、Green Wave、CM、SEGGER 或 PreScalar 能否以更低的导入成本，打包提供相同的订单协调和凭证？"
    - "候选产品中有多少处于离线状态或没有受支持的 OTA 路径？同一工位和测试配置能否跨产品、跨站点复用？"
operatingAssumptions:
  - assumption: "合格站点平均每年至少发生 1.5 笔合格实体恢复订单，受影响序列号也足以覆盖配置和合作方执行成本；研究市场规模情景采用了这一假设，并非观测到的需求。"
    basis: "research.yaml"
    validationTest: "从三组 OEM-CM 组合收集过去 12 个月经脱敏的固件变更订单、库存暂停记录、受影响序列号清单和发货记录；统计合格离线订单、设备数及成本。"
    decisionImpact: "如果复购频次或订单量更低，就将业务定位为选择性承接的活动服务，不招聘网络团队，也不为分布式网络投入资金。"
  - assumption: "只要密钥仍由 OEM 持有，且工单、序列号、工位、测试、审计、隔离和最终放行都纳入明确管控，OEM 和 CM 就会批准第三方操作员。"
    basis: "research.yaml"
    validationTest: "在进行最低限度流程之外的开发前，取得 OEM 固件安全、产品质量、法务和 CM IT 对一个产品及站点的书面附条件批准。"
    decisionImpact: "如果审批未通过，就转向由 OEM 或 CM 员工执行的软件引导流程；如果买家不愿为这种模式付费，则停止。"
  - assumption: "买家愿意支付配置费加每个通过测试的序列号费用，且报价能胜过现有厂商或内部方案的整体成本表现。"
    basis: "idea.yaml"
    validationTest: "将匿名发票或报价与付费试点方案比较；记录配置、合作方人工、运费、延误、故障、收费依据和签署的验收标准。"
    decisionImpact: "如果无法以正的单笔订单贡献促成付费，就只在买家确认预算时改按固定活动报价；否则停止。"
  - assumption: "已有获批工位和测试配置可以复用于第二笔兼容订单，无需大量新增硬件或集成。"
    basis: "运营方判断"
    validationTest: "首笔订单验收后，在同一站点运行第二个产品配置，并比较工程工时、夹具变更及可变成本。"
    decisionImpact: "如果每笔订单都需要定制设备或集成，就将业务限定为高触达服务，不按软件或网络毛利来投资。"
  - assumption: "$2–4M 的种子前轮融资可支持为期 18 个月的小团队验证周期，且无需自有工位车队。"
    basis: "运营方判断"
    validationTest: "融资前，根据拟定资金跑道核算人员、安全审查、保险/法务、合作方认证、试点差旅及应急预算。"
    decisionImpact: "如果验证计划超出该区间，就收窄至一组 OEM-CM，或将首笔融资额调低，并以书面准入和付费试点为拨款条件。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "审查三组美国电子产品 OEM-CM 组合的后期变更记录。"
    hypothesis: "至少两组组合能从记录中找出合格的实体重刷事件，并量化受影响序列号、当前成本和发货日期影响。"
    successMetric: "三组中有两组提供经脱敏的 12 个月证据，且每组至少找出一笔可将本地订单与实际替代方案进行比较的事件。"
    owner: "CEO / 创始人"
  - horizon: "0–90 天"
    experiment: "针对一个产品系列，开展 OEM 安全、质量和 CM 准入评审。"
    hypothesis: "合作方操作的订单可获批准，同时满足签名密钥由 OEM 持有、镜像范围明确、序列号清单获批、由 OEM 测试和审计、失败品隔离并由 OEM 放行等条件。"
    successMetric: "OEM 和 CM 各自提供一条书面的附条件审批路径；密钥不得交由外部保管。"
    owner: "创始工程师与 OEM 固件安全负责人"
  - horizon: "0–90 天"
    experiment: "根据近期内部处理、运费和现有厂商服务成本，为单站点付费试点报价。"
    hypothesis: "如果总成本或放行时间有所改善，经济决策者会接受配置费加每个通过测试的序列号收费。"
    successMetric: "签下一笔付费试点，明确通过/失败验收标准，并在扣除合作方人工和差旅后预计仍有正贡献。"
    owner: "CEO / 创始人"
  - horizon: "3–6 个月"
    experiment: "围绕一个产品系列，在现有工位上搭建并运行最低限度的订单控制流程。"
    hypothesis: "无需替换工位或 MES，就能记录序列号范围、镜像授权、测试结果和隔离情况。"
    successMetric: "每个尝试处理的序列号都有可核对的刷写前后版本及测试/处置记录；未授权放行数为零。"
    owner: "创始工程师与现场质量负责人"
  - horizon: "6–12 个月"
    experiment: "在同一 CM 重复已验收的订单，或尝试第二个兼容产品配置。"
    hypothesis: "第二次活动能够复用大部分审批和工位配置，带来付费复购，而非一次性服务项目。"
    successMetric: "12 个月内至少拿到一笔付费复购订单，配置工时下降，且扣除全部可变成本后仍有正贡献。"
    owner: "现场运营负责人"
  - horizon: "12–18 个月"
    experiment: "与一家 CM 或获授权的重刷服务商测试渠道交付。"
    hypothesis: "如果订单记录和 OEM 审批已标准化、数据权利也已明确，现有厂商的本地操作方会引荐订单或负责交付。"
    successMetric: "签下一份非排他合作协议，并获得一个合格的第二节点；不持有 OEM 密钥，也不掌握放行权。"
    owner: "CEO / 合作伙伴负责人"
operations:
  - "必须有 OEM 变更订单，其中写明签名镜像来源、限定范围的序列号清单、获批工位和操作员、验收测试、回滚或恢复指引，以及指定的 OEM 放行负责人。"
  - "工位访问遵循最小权限原则；记录操作员、设备身份、新旧版本、时间戳、测试结果和异常状态；不得保存签名密钥。"
  - "将失败或状态不明的设备实体隔离，并在 OEM 记录处置决定前禁止发货；刷写成功不等于产品获准放行。"
  - "一次只认证一个 CM 站点和合作方；订单执行前，先约定操作员培训、夹具状态、保险、责任、数据留存、事件升级和质量记录导出。"
  - "针对具体产品，请法律顾问审查网络安全、安全性、市场准入和出口管制；研究未发现美国有一刀切的重刷外包要求，也未核实具体产品的详细义务。"
team:
  - role: "CEO / 创始人，OEM 商务负责人"
    startTiming: "第 0 个月"
    rationale: "负责首个客户、成本基线、买家预算及 OEM-CM-合作方三方审批；在渠道具备可复制性前，需要创始人主导销售。"
  - role: "创始工程师，安全流程与工位集成"
    startTiming: "第 0 个月"
    rationale: "搭建最小化授权、序列号核对、审计、测试结果及异常处理流程，同时确保签名密钥和放行控制权留在 OEM 手中。"
  - role: "现场运营与质量负责人"
    startTiming: "第 3 个月，且仅在试点路径获附条件批准后"
    rationale: "将 OEM 作业指导书转化为经过培训的合作方执行流程、工位认证、隔离操作和可量化的订单成本记录。"
  - role: "集成工程师"
    startTiming: "第 6 个月，且仅在拿到付费试点后"
    rationale: "接通获批编程器、测试脚本和 CM 质量记录；如果首个试点可由人工支持，则暂缓招聘。"
  - role: "安全与产品责任法律顾问"
    startTiming: "第 0 个月，兼职"
    rationale: "在刷写任何固件前，审查访问权限、密钥保管、数据处理、产品范围、保险和放行条款。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "为一个产品系列取得一条 OEM-CM 书面审批路径；签名密钥由 OEM 持有，放行权也归 OEM。"
      - "完成一笔付费试点，留下序列号级审计和测试记录；在内部形成成本及发货日期与客户实际替代方案的比较结果。"
      - "在同一站点拿到付费复购订单；如果缺少复购、付费意愿或订单贡献，则记录停止推进的决定。"
  - horizon: "12–24 个月"
    items:
      - "让首个成功站点持续产生复购活动订单；只有审批和工位流程可复用后，才认证第二个 CM 节点。"
      - "在两个客户项目中，扣除合作方人工、差旅、配置、支持和故障处理后仍实现正贡献。"
      - "标准化一套质量记录导出方式和操作员手册；若扩大产品覆盖需要每笔订单新增工位或定制集成，则暂缓扩张。"
  - horizon: "24–36 个月"
    items:
      - "目标是最多覆盖三个合格 CM 节点，并服务至少两个有复购的客户项目；前提是订单持续付费且 OEM 书面批准。"
      - "标准化复购订单的毛利率目标为 70% 以上；如果只有排除现场人工、认证或责任成本才能达到，就不要宣称实现了该目标。"
      - "只有站点级事件记录证明利用率足够时，才增加合作方交付产能；否则继续做聚焦的创始人主导活动服务，或收缩退出。"
risks:
  - risk: "OEM 安全或质量团队拒绝第三方执行、新增记录或 CM 工位准入。"
    likelihood: "High"
    impact: "High"
    mitigation: "签名密钥和放行权留在 OEM 手中，使用限定范围的签名镜像和书面工单；开发超出一条流程的产品前，必须先取得附条件审批路径。这是研究指出的核心采用门槛。"
  - risk: "TRIGO、Green Wave、现有 CM 或工厂设备供应商打包提供所需服务，导致没有可收费的协调缺口。"
    likelihood: "High"
    impact: "High"
    mitigation: "以服务商和内部团队的实际报价作基准；只在序列号级验收、跨站点协调或买家认可的结算方式能带来可量化优势时销售，并与合作方协作，不重建本地现场服务网络。"
  - risk: "合格固件变更过少，或批量太小，无法覆盖工位配置、合作方人工、差旅和安全审查成本。"
    likelihood: "High"
    impact: "High"
    mitigation: "招聘网络团队前，先检查 12 个月的变更和库存记录；增加站点前，先证明单笔订单贡献为正并拿到复购。"
  - risk: "产品系列和夹具差异太大，导致每个试点都要定制集成。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "从一个受支持的产品和现有工位起步，梳理接口及测试脚本，单独收取配置费；如果第二个配置无法复用流程，就停止扩张。"
  - risk: "刷写失败或验收测试不足导致设备损坏，或不合格设备获准放行。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "采用 OEM 定义的验收和回滚流程，核对序列号，实体隔离设备，留存审计轨迹，并明确保险和责任条款；只有 OEM 能决定最终放行。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "这份为期 18 个月的种子前轮计划将资金用于精简的创始工程与现场运营团队、安全与产品责任审查、一到两个付费站点试点、接入现有工位及合作方认证。不用于自建全国性工位车队；只有拿到 OEM 书面准入、实现正的单笔订单贡献并验证复购后，才扩张。"
