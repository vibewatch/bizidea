modelDiagram:
  title: 单位经济模型流程
  mermaid: |
    flowchart LR
      Leads[Qualified OEM-CM pairs] --> Approval[Written OEM and CM approval]
      Approval --> Customers[Paid customer programs]
      Customers --> Jobs[1.5 jobs per site-year]
      Jobs --> Serials[5,000 passing serials per job]
      Serials --> Revenue[Setup fee plus USD 20 per passing serial]
      Revenue --> GrossProfit[70% repeat gross margin]
      GrossProfit --> Cash[Cash runway and next-round need]
modelSanity:
  - checkName: 收入引擎
    finding: "三个客户年按 USD 150K 服务 ARPU 计费，加上一笔 USD 20K 设置费，构成基准情景 Y3 的 USD 470K 收入。"
  - checkName: 必须兑现的条件
    finding: "在增加现场运营和合作伙伴岗位之前，必须拿到 OEM/CM 书面授权、实现同站点付费复购，并让标准化作业毛利率达到 70%。"
  - checkName: 模型失效条件
    finding: "如果第三个项目或复购活动未能跑通，下行情景现金最低点将达 -USD 1,130.75K；即使基准情景不获后续融资，期末现金也为 -USD 981.75K。"
  - checkName: 下一轮融资所需证据
    finding: "下一轮融资要求第 18 个月时拿出证据：付费试点已获授权、同站点复购已实现、贡献为正，且另一家 CM 也能复用审批流程；本轮 USD 3.2M pre-seed 还包含六个月储备。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 66.4% + Y3 EBITDA 利润率 -337.2% = -270.8%；方向上为负，在当前早期服务规模下也不是有意义的 SaaS 基准。"
  burnMultiple: "Y3 EBITDA/现金消耗 USD 1,585K ÷ 增量收入 USD 187.5K = 8.45x；效率偏弱，且未计后续融资。"
  revenuePerFte: "按平均 6.0 个 FTE 计算，Y3 每 FTE 收入为 USD 78.3K（USD 470K ÷ 6）；水平偏低，因为模型仍处于服务驱动的验证阶段。"
  flags:
    - "输入资料未能确认具名客户、经验证的单序列号价格、典型批量、符合条件事件的频次、续约历史或试点后 ROI；几乎所有收入驱动因素仍是假设。"
    - "模型假设批次作业开票额按月平滑，并在当期收款；但实际服务交付并不均匀，且只有通过测试的序列号才能产生收入。"
    - "基准情景现金在 Q2Y3 转负，期末为 -USD 981.75K，原因是模型未计后续融资；现金耗尽前必须融资或重置成本。"
    - "Y3 EBITDA 为 -USD 1,585K，Rule-of-40 指标为 -270.8%，burn multiple 为 8.45x，平均每个 FTE 的收入仅 USD 78.3K。"
    - "1.74x LTV/CAC 比率和 20.6 个月回本期依赖未经验证的三年客户寿命及 USD 180K CAC；目前的单位经济模型尚未达到可规模化水平。"
    - "70% 毛利率是 Y3 标准化复购作业的目标，尚无实际经营数据证明；安全审批、合作伙伴利用率和现有厂商竞争仍是可能卡住推进的关键风险。"
