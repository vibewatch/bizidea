pnlMethodology:
  assumptionRefs:
    - A3
    - A4
    - A8
    - A9
    - A10
    - A11
  description: "利润表各项指标按以下关系计算：cogsK = revenueK × 年度 COGS 率；grossProfitK = revenueK − cogsK；salaryK 为全口径薪酬；opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK；ebitdaK = grossProfitK − opexK。"
cashFlowMethodology:
  assumptionRefs:
    - A1
    - A11
  description: "Y1 M1 计入模型中唯一一笔 USD 3,200K 融资流入。此后 cashEopK 按上期现金 + EBITDA + 融资流入滚动计算。模型未假设后续融资，因此负余额表示尚未获得资金覆盖的现金缺口，并非可动用流动性。"
