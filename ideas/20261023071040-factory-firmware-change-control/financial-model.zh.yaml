headcountBasis:
  assumptionRefs:
    - A9
  description: "年化薪酬按全口径 FTE 成本乘以季度末人数计算；当期实际薪酬为 salaryK，已计入 opexK。Y1 各季度末 FTE 人数依次为 3/3/4/4；Q4Y2 为 5，Q4Y3 为 7。"
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
    - A5
  customerDefinition: "customersEop 统计期末留存的付费 OEM-CM 客户项目数，不包括潜在客户、序列号或单次批次作业；newCustomers 统计新启动的项目数。"
  formula: "Y1 月收入 = 活跃客户项目数 × USD 12.5K 预期服务开票额 + 每个新项目启动月的 USD 20K 设置费。Y2/Y3 季度收入为同一月度公式逐月相加。年度服务收入按客户月数 ÷ 12 × USD 150K ARPU 核对，再加设置费：Y1 7/12 × 150 + 20 = 107.5K；Y2 21/12 × 150 + 20 = 282.5K；Y3 36/12 × 150 + 20 = 470K。"
  limitation: "批次作业的交付节奏不均，且只对验收通过的序列号收费；按月平滑和当期收款都只是预测，并非已签约的经常性收入，也未证明实际开票行为。"
annualRevenueReconciliation:
  y1:
    activeCustomerMonths: 7
    serviceArpuK: 150.0
    setupFeesK: 20.0
    revenueK: 107.5
  y2:
