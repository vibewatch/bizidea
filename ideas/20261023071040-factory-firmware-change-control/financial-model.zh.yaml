slug: inventory-firmware-recovery
date: "2026-10-23"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: 模型周期与日历
    value: "M1 对应 October 2026；36 个月周期持续至 September 2029。Y1 为 October 2026–September 2027，Y2 为 October 2027–September 2028，Y3 为 October 2028–September 2029。"
    unit: 日历月份
    source: "[business-plan.yaml 日期及所需的三年模型周期约定]"
  - id: A1
    name: 首轮 pre-seed 融资
    value: "USD 3.2M 于 M1 到账，落在计划设定的 USD 2–4M pre-seed 区间内。该轮融资规模按 18 个月验证计划、六个月储备，以及尚未取得报价的安全、保险、合作伙伴资质审核和回款风险来设定。"
    unit: USD 百万元
    source: "[business-plan.yaml fundingAsk.targetFundingRangeUsd 和 fundingAsk.runwayMonths；USD 3.2M 是建模者选定的情景，并非已承诺资金]"
  - id: A2
    name: 付费客户项目爬坡
    value: "M6 启动一个付费 OEM-CM 项目，M16 启动第二个，M25 启动第三个；销售管线中的潜在客户不计作客户。计划到第 36个月时完成一个付费试点、实现同站点复购，并建立最多三个通过资质审核的 CM 节点。"
    unit: 付费客户项目启动月份
    source: "[business-plan.yaml product.sixMonth、product.twelveMonth、product.twentyFourMonth、milestones 和 team sequencing；时间安排与转化率均为未经验证的模型假设]"
  - id: A3
    name: 批次作业定价
    value: "每个序列号通过 OEM 规定的测试并获接收后收费 USD 20；每个新客户项目另收一次性 USD 20K 的站点/产品/测试配置文件设置费。每序列号收费是研究测算假设；设置费则是明确提出、尚待验证的报价假设。"
    unit: USD/个通过测试的序列号；USD 千元/个新项目
    source: "[business-plan.yaml gtm.pricing 和 businessModel.revenueStreams；research.yaml market.tam、market.sam、market.som 和 bottomUpSizingDrivers 将 USD 20 列为假设价格，并非观察到的实际报价]"
  - id: A4
    name: 验收量与服务 ARPU
    value: "基础服务活动量按每个活跃站点每年 1.5 个符合条件的批次作业、每个作业 5,000 个通过测试的序列号计算，因此年度服务 ARPU 为 USD 150K（1.5 × 5,000 × USD 20）；设置费另计。5,000 个序列号的批次只是研究测算用的示例输入，并非已验证的典型批量。"
    unit: 每站点每年的作业数；每项作业通过测试的序列号数；USD 千元/客户年
    source: "[business-plan.yaml operatingAssumptions；research.yaml bottomUpSizingDrivers 和 market.som；复购频次、通过率、批量大小和价格均未得到验证]"
  - id: A5
    name: 收入确认与客户数核对
    value: "按每个活跃客户月 USD 12.5K 的预期服务开票额均匀确认收入（年度 ARPU USD 150K ÷ 12），每个新项目启动月另计 USD 20K 设置费。Y1、Y2、Y3 的活跃付费客户月分别为 7、21、36，对应收入分别为 USD 107.5K、USD 282.5K 和 USD 470K。按月平滑仅用于呈现预期批次作业量，并不代表经常性订阅。"
    unit: 客户月数及 USD 千元
    source: "[根据 A2–A4 推导；business-plan.yaml 规定收取设置费和通过测试序列号费用，但未验证月度经常性收入。按月确认收入只是针对不均匀批次作业的预测口径]"
  - id: A6
    name: 销售漏斗与全口径 CAC
    value: "销售漏斗目标意味着：合格组合进入评审的比例为 30%，评审转付费试点的比例为 25%；两者相乘，合格组合转付费的比例为 7.5%，每签下一个项目约需 13.3 个合格组合。每个新增付费项目的全口径 CAC 为 USD 180K：将 USD 540K 获客成本分摊至三笔签约，其中包括模型测算的非薪资销售与营销支出 USD 502K，以及归因给创始人的薪资 USD 38K；这些费用已计入 P&L，不会重复追加。"
    unit: 百分比；每次签约所需的合格组合数；每客户 USD 千元
    source: "[business-plan.yaml gtm.funnelTargets；由于没有实际 CAC 或销售周期数据，CAC 和薪资分摊采用明确的高触达工业 B2B 规划经验值]"
  - id: A7
    name: LTV 测算中的客户寿命与流失率
    value: "仅在单位经济模型中使用月流失率 2.8% 和预期客户寿命 35.7 个月（1 ÷ 2.8%）；这是为尚未得到验证的批次复购关系设定的规划代理值。基准情景在模型里程碑周期内保留客户数，不套用随机流失。"
    unit: 月流失率百分比；客户寿命月数
    source: "[business-plan.yaml gtm.funnelTargets 和 investorMemo.mustBeTrue 指出复购率尚不确定；月流失率 2.8% / 客户寿命 35.7 个月是建模者采用的创业财务经验值，并非实际留存数据]"
  - id: A8
    name: 毛利率与直接成本
    value: "COGS 占收入的比例为：Y1 45%（首次高触达试点期间毛利率为 55%）；Y2 35%（复用首个复购项目的作业后，毛利率为 65%）；Y3 30%（标准化复购作业的毛利率为 70%）。"
    unit: 收入占比
    source: "[business-plan.yaml businessModel.targetGrossMarginPct 为 70%，milestones 仅要求标准化复购作业的毛利率高于 70%；前期毛利率爬坡是建模者针对合作伙伴人力、差旅和批次作业支持所采用的经验假设]"
  - id: A9
    name: 团队、到岗时间与全口径薪酬
    value: "年全口径成本分别为：CEO/商务负责人 USD 150K、创始工程师 USD 210K、现场运营/质量负责人 USD 162K、集成工程师 USD 204K、合作伙伴运营协调员 USD 150K。创始团队从 M1 到岗，现场运营从 M3 到岗；付费试点后，集成工程师从 M7 到岗；出现复购证据后，第二名现场运营人员从 M22 到岗；到 M31，第三节点现场运营人员和合作伙伴协调员到岗。兼职法律顾问由外部提供，列入 G&A，不计入 FTE。"
    unit: USD 千元/全口径 FTE 年；模型月份
    source: "[business-plan.yaml team、sequencingRationale、experimentRoadmap 和 milestones；薪酬是采用的创业财务规划经验值，并非薪酬调查结果或正式报价]"
  - id: A10
    name: 非薪资运营费用
    value: "Y1 每月 S&M/R&D/G&A（USD K）为：M1–M3 6/18/20，M4–M6 8/25/25，M7–M12 10/30/30。Y2 每季度 S&M 为 35/40/45/50，R&D 为 65/70/75/80，G&A 为 65/70/75/80。Y3 每季度 S&M 为 50/55/60/65，R&D 为 70/75/80/85，G&A 为 75/80/85/90。"
    unit: Y1 每月、Y2–Y3 每季度的 USD 千元
    source: "[business-plan.yaml gtm、product、operations、team 和 experimentRoadmap；费用节奏是针对创始人主导销售、安全工作流、试点集成、法律顾问及保险的运营经验假设，并非供应商报价]"
  - id: A11
    name: 现金流边界
    value: "期初现金为零；M1 收到 A1 融资；模型不计后续融资。Cash EOP = 上期现金 + 融资流入 + EBITDA；假设当期收款、当期付款，不计税款、利息、营运资金变动、自有站点 capex 或折旧。"
    unit: USD 千元及建模约定
    source: "[business-plan.yaml 明确暂缓自有站点，并提出 18 个月验证轮融资；当期现金转换及未纳入的资产负债表项目均为建模者的简化假设]"
  - id: A12
    name: 资金用途与六个月储备
    value: "资金分配为工程研发 USD 1.40M、GTM USD 0.65M、G&A USD 0.45M、储备金（6 个月）USD 0.70M，合计 USD 3.20M。USD 0.70M 储备金大致相当于验证期附近约六个月、月均约 USD 117K 的净现金消耗；本轮还额外预留资金，应对尚未报价的审批与交付成本。"
    unit: USD 百万元
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary 和 18 个月资金跑道；各项分配是建模者的规划判断，并非已批准预算]"
  - id: A13
    name: 情景与敏感性冲击
    value: "下行情景：截至 M36 只有两个项目，Y3 毛利率为 60%，且 Y3 计划招聘的岗位仍全部保留。上行情景：现有两个项目在 Y3 各完成两项作业，标准化作业毛利率达到 72%。相对基准情景，下行情景分别测试：每站点年作业量为 1.0 而非 1.5；每个通过测试的序列号收费 USD 16 而非 USD 20；项目数为两个而非三个；销售周期延后六个月；毛利率为 60% 而非 70%；两个受招聘门槛约束的岗位提前六个月到岗。"
    unit: 情景假设
    source: "[business-plan.yaml risks、killCriteria、milestones 和 operatingAssumptions 指出授权、复购量、毛利率及招聘门槛；冲击幅度是建模者设定的压力测试假设]"
