jobsToBeDone:
  - job: >-
      OEM 批准的固件变更到达合同制造商手中的硬件后，帮助制造质量负责人更新并重新验证每个受影响的序列号，让他们无需把整批设备运回，也能发出合格产品。
    currentAlternative: "在可用工位手动重刷受影响设备，或把它们运回制造商。"
    successMetric: "在计划发货日期前通过测试的受影响序列号占比，以及每批次避免的退运量。"
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      它把现有供应链节点变成分布式、经 OEM 授权的恢复网络，并按通过测试的序列号收费，而不是止步于变更可视化或工厂数据采集。
  venturePotential:
    score: 4
    rationale: >-
      固件变更任务的复购和向更多合同制造商扩张有望带来叠加增长，但本地服务网络密度、集成工作量和更新量波动可能压低早期利润率。
  whiteSpace:
    score: 3
    rationale: >-
      来源显示，现有厂商的业务已延伸至测试设备和制造软件等邻近领域；生产后库存恢复这一差异化切口仍可能被这些厂商吸收。
  painIntensity:
    score: 4
    rationale: >-
      来源直接记录了固件晚到时的人工重刷或退货、延误、成本和追溯缺口。
  wedgeClarity:
    score: 4
    rationale: >-
      一家 OEM、一个库存地点和一批获批的固件变更，就能组成可衡量的试点；但目前还没有证据证明团队能接触到买家或取得工位权限。
  evidenceFit:
    score: 4
    rationale: >-
      三个来源直接支持这一故障场景及相邻产品动向，但客户身份未披露，试点后的经济性也仍未得到验证。
topRisks:
  - name: "固件授权与安全"
    description: >-
      OEMs 可能不允许外部合作伙伴访问设备，或在合同制造商站点运行固件更新镜像。
    mitigation: >-
      签名密钥留在 OEM 手中；每项任务都要明确授权，使用范围受限的签名镜像，并审计工位的每一步操作，再考虑扩展到单一站点以外。
  - name: "合作伙伴覆盖与利用率"
    description: >-
      本地工位认证成本不低，固件变更任务量又可能稀少，导致服务网络在复购量起来之前就成本高企。
    mitigation: >-
      从库存集中的一家合同制造商起步，并使用现有的获批工位
  - name: "验收与设备责任"
    description: >-
      更新失败或刷写后测试不充分，可能损坏设备，也可能让不合格设备流入发货环节。
    mitigation: >-
      采用 OEM 定义的验收测试和回滚说明，隔离失败设备；初期试点只覆盖一条产品线，并由 OEM 明确授权放行。
