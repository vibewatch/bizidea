  saturationRationale: >-
    成功获取的三十六个去重网页回答了全部八个问题，并为风险最高的四个领域提供了多项有用来源。最后六个网页只增加了一条影响决策的结论：广义 BCI 市场预测主要涵盖非侵入式产品和软件，不能代表付费芯片测试需求；其余网页大多印证了合作集成、成熟的台架实践和监管边界。
  coverageGap: >-
