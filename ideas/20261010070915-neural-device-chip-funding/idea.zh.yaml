problem: >-
  神经设备团队必须选型或集成专用的传感与刺激芯片；据报道，他们要在通用组件和漫长的定制芯片开发之间权衡。若缺少可复现的方法，将候选前端芯片放到设备预期的电极负载下比较，团队可能直到电路板或设备集成后期才发现电气不匹配。现有来源没有说明这种情况发生的频率。
targetUser:
  primary: 早期神经设备公司的 ASIC 或系统工程负责人；他们正在评估神经信号采集或刺激前端，并要在电路板架构冻结前做决定。
  secondary: 协调芯片供应商或芯片合作方集成工作的神经技术创始人和设备项目负责人。
  buyer: 有原型测试和设计验证预算的工程副总裁（VP）或 CTO。
startupThesis:
  nonObviousInsight: >-
    芯片自研还是外购，不只是芯片设计问题：设备团队还需要在确定系统架构前，按自身的电极负载和刺激条件，对候选芯片做中立、可比较的测试。一套可复用的实体测试方案或能缩小这段证据缺口，但不应被说成能取代定制芯片设计或临床验证。
  beachhead: >-
    临床前神经接口开发商：在元件选型和下一版设备电路板改版之间评估传感或刺激电子器件。
  wedge: >-
    收费测试项目：模拟客户指定的电极负载和信号占空比，再按一套校准流程比较候选前端芯片。
  whyNowCatalyst: >-
    据报道，MintNeuro 已交付可运行的芯片、取得合作方集成里程碑，并获得用于产品发布和合作交付的新融资；神经接口芯片因此进入扩张阶段。Imperial 也指出，通用组件与定制芯片之间的权衡长期存在。
  ventureScalePath: >-
    将重复测试项目沉淀为标准化负载模拟器套件和授权规程，再把仪器产品线拓展至相邻的神经信号采集与刺激设备类型。跨客户基准测试仅对选择加入的客户开展，并对数据匿名化；核心业务仍是收费验证，不会声称测试结果代表临床表现。
solution: >-
  公司搭建经过校准的电气测试台，为候选神经前端芯片模拟客户定义的电极阻抗和刺激占空比场景。工程师提交芯片或评估板及其工作条件范围，实验室用同一组场景测试不同候选产品，并记录输入噪声、通道表现、脉冲保真度和测试条件下的功耗等指标。每项付费测试都会交付可复现的技术报告，供架构和电路板设计决策参考；报告会明确说明测试台无法证明组织响应或临床表现。重复测试的客户可转用授权测试台硬件和版本化测试规程。
goToMarketSeed:
  firstCustomer: 一家 UK（英国）或欧洲的神经设备初创公司，已有传感或刺激原型，近期需要决定电路板设计，并正在评估通用组件或与外部芯片合作方协作。
  buyingTrigger: 元件选型评审或电路板设计冻结前，团队需要可比证据，才能决定是否推进下一轮原型开发。
  currentAlternative: 在公司的元件评估板上自行测量，或与芯片供应商一起开展工程调试；现有资料未能证明现有厂商中有专门提供独立测试的服务商。
  switchingReason: 中立的测试规程能让团队在相同的设备专属电气负载下比较不同前端的表现，不必依赖彼此无法对照的厂商演示。
  pricingHypothesis: 每项候选芯片测试按固定费用收费；团队跨版本重复测试时，再收取年度校准费和测试规程授权费。
whyNow:
  - point: MintNeuro 报告称，公司已交付可运行芯片，并与两家神经设备开发商达成集成里程碑；合作方层面的芯片集成已在推进。
    signalRefs:
      - 芯片已交付，合作方集成取得进展
    sourceRefs:
      - 1
  - point: Imperial 指出，设备开发商必须在不适用于人体的通用组件和耗时数年的定制芯片开发之间作出重要取舍。
    signalRefs:
      - 通用组件与定制芯片之争
    sourceRefs:
      - 3
  - point: 据报道，本轮融资将支持产品发布、向合作伙伴交付芯片和扩充工程团队，也为独立测试服务带来近期的规模化发展背景。
    signalRefs:
      - 获融资推动商业化扩张，临床常规应用尚未得到验证
    sourceRefs:
      - 2
differentiator: >-
  神经芯片供应商设计并销售芯片；这个项目则向设备团队提供独立、可复现的方法，让他们按自己给定的电气负载比较候选电子器件。它可守住的核心资产，是经过校准的负载模拟方法和不断积累的测试方案，而非自有芯片设计或宣称芯片已达到临床就绪状态。市场是否成立、负载能否标准化都还没有定论，因此业务会先提供工程师亲自操作的测试服务。
conceptDiagram:
  title: 神经芯片负载回放
  mermaid: |
    flowchart LR
      Team["Neural-device engineering team"] --> Recipe["Electrode-load and duty-cycle recipe"]
      Recipe --> Bench["Calibrated load-replay bench"]
      Candidates["Candidate front ends or ASICs"] --> Bench
      Bench --> Measures["Comparable noise, pulse-fidelity, and power measurements"]
      Measures --> Decision["Choose the next board architecture"]
businessModelCanvas:
  customerSegments:
    - 测试神经信号采集或刺激电子器件的早期神经接口公司。
    - 与芯片设计合作方共同推进项目的神经设备工程团队。
  valuePropositions:
    - 在确定电路板改版前，按同一套设备专属电气负载比较候选前端芯片。
    - 无需仅为回答架构问题而委托定制芯片，也能拿到可复现的台架测试证据。
  channels:
    - 直接向神经技术创始人和工程负责人开展技术销售。
    - 通过神经设备孵化器、大学实验室和半导体设计合作方获得转介绍。
  customerRelationships:
    - 由工程师主导界定测试范围，按固定范围开展验证。
    - 为复购客户提供定期校准、规程支持和测试台授权。
  revenueStreams:
    - 按芯片或评估板测试项目收费。
    - 向客户运营的负载模拟测试台收取年度授权和校准费。
  keyResources:
    - 经过校准、可编程的电极负载模拟器和测试夹具。
    - 版本化测试规程和测量专业能力。
    - 安全保管客户专有的设备和芯片设计资料。
  keyActivities:
    - 与每位客户共同制定可复现的负载和占空比测试场景。
    - 开展对比电气测量，维护经过校准的夹具。
    - 将重复测试场景转化为可配置的测试台硬件和授权方法。
  keyPartners:
    - 提供使用条件和原型板的神经设备开发商。
    - 在早期校准和方法评审中提供支持的独立电子实验室或大学工程设施。
    - 愿意提供评估设备的元件和芯片供应商。
  costStructure:
    - 专用测试仪器、夹具和校准。
    - 电气工程人力和定制测试搭建。
    - 原型设备安全运输、保险和客户获取。
jobsToBeDone:
  - job: 神经设备团队挑选下一款传感或刺激前端时，帮系统工程师在预期电极负载下比较候选产品，凭可复现的台架证据敲定电路板架构。
    currentAlternative: 在公司内部用评估板测量，或依赖供应商各自的芯片调试结果。
    successMetric: 从商定测试范围到确定架构所需的时间，以及在不同候选产品上可复现完成的负载场景数量。
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      核心产品是中立的实体工作负载回放测试，依据设备的电极负载运行；它不是芯片设计工具、供应商目录或通用测试仪表盘。
  venturePotential:
    score: 4
    rationale: >-
      可复用的测试台有机会从收费测试项目扩展为授权仪器和规程，但神经设备客户的初始规模和年均测试频次都尚未验证。
  whiteSpace:
    score: 3
    rationale: >-
      历史索引中没有神经芯片认证方案，但竞品密度和专业实验室现有服务都尚未调研，最初切入的细分市场也较窄。
  painIntensity:
    score: 4
    rationale: >-
      初筛来源指出，团队必须在通用组件与漫长的定制芯片开发之间取舍；但后期才发现电气不匹配的具体代价仍未量化。
  wedgeClarity:
    score: 4
    rationale: >-
      可以围绕一个明确的电路板设计前决策，出售范围清晰的单次测试；不过，每位客户的电气负载方案都可能需要定制搭建。
  evidenceFit:
    score: 4
    rationale: >-
      已交付可运行芯片、合作方集成进展以及通用组件与定制方案之间的现实选择，支撑了时机和工作流假设；但没有任何来源直接验证独立测试台的需求。
topRisks:
  - name: 早期市场狭窄
    description: 来源指出了具体的芯片开发瓶颈，但没有说明神经设备买家数量或其测试预算。
    mitigation: 先与共创客户开展付费项目；在扩大仪器范围前，要求客户复购或承诺授权测试台。
  - name: 台架测试与真实设备存在偏差
    description: 电气模拟器无法完整复现组织响应、植入几何形状或临床表现。
    mitigation: 明确标注结果仅为台架测量；与设备工程师共同界定测试方案，只按客户认可的工作条件进行比较。
  - name: 定制测试拖累规模化
    description: 设备专属的电极负载和信号模式可能让每个项目都过于定制，难以实现经济规模化。
    mitigation: 记录每个项目的搭建工时，将重复使用的夹具模块标准化；测试方案纳入规程前，暂不承接目前无法支持的类型。
