pitch: 在电路板定型前，用可编程电极负载测试神经设备芯片，避免团队选错架构。
selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: 中立的工作负载回放测试台把每台设备的电极负载和刺激占空比转化为可比、可复现的芯片测试，在昂贵的系统集成前先行测试。
  acceptedTradeoff: 不同设备的电极几何形状和信号模式差异很大；在可复用夹具和测试规程成熟之前，早期测试仍可能是实验室里的定制项目。
