  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
    - hardware-enabled-service
  rejectedCliches:
    - 面向芯片设计的通用 AI 助手
    - 面向神经设备工程的仪表盘加告警
    - 芯片与设备供应商之间的通用集成层
    - 覆盖所有神经技术工作流的宽泛平台
  rareMechanism: 中立、经过校准的测试台按每台设备的电极负载和刺激占空比方案，对候选前端芯片进行回放测试。结果可横向比较且不公开，不是又一份芯片供应商自证合格的说法。
  nearestHistoricalIdeas:
    - slug: rolling-ind-work-packets
      similarity: mechanism
      decisiveDifference: 两者都为生命科学产品开发积累可复用的就绪证据，但这个概念会用电气负载实测芯片表现；历史方案则把监管模块版本化，并协调 IND、IRB 和研究中心启动工作。
    - slug: offtake-backed-carbon-capture
      similarity: mechanism
      decisiveDifference: 两者都把实测硬件表现放到买方决策的核心，但这个概念是向工程团队出售独立的神经芯片测试项目，而非按 CO2 承购规格融资并运营碳捕集设备。
