modelSanity:
  - checkName: Revenue engine
    finding: "Base revenue is 3, 4, and 5 accepted $25K campaigns in Y1-Y3, with no license revenue."
  - checkName: Must go right
    finding: "At least two pilots must close by M6 and repeat delivery must stay within the 30% direct-cost ceiling to support five paid accounts by M24."
  - checkName: Model breaks if
    finding: "If the downside ramp of 1, 2, and 2 campaigns at $20K prevents the conditional $1M seed, modeled Y3 cash is negative $136K."
  - checkName: Next-round proof
    finding: "The M25 seed should proceed only after five paying accounts, two pilot repeats, blinded repeatability evidence, and direct delivery cost at or below 30% are documented."
sanityChecks:
  ruleOf40: "Y3 revenue growth 25% + EBITDA margin -354% = -329%; direction is materially below a healthy recurring-growth profile."
  burnMultiple: "19.4x proxy: $484K Y2 EBITDA burn divided by $25K incremental campaign revenue; one-off service revenue makes SaaS burn multiples a poor fit."
  revenuePerFte: "Y3 revenue is $41.7K per FTE ($125K divided by 3 FTE), consistent with a subscale validation-stage service rather than a proven platform."
  flags:
    - "No paid demand, campaign quote, or willingness-to-pay is established; all modeled orders and the $25K fee are hypotheses."
    - "The $0.5M UK/EU SAM scenario, eligible account count, one-campaign-per-year cadence, and repeat rate are unverified."
    - "70% gross margin requires direct delivery cost to fall to $7.5K per campaign; engineer hours and fixture reuse have not been demonstrated."
    - "Indicative LTV/CAC is only 1.3x and CAC payback is 23.2 months; the lumpy project model may make both lifetime and payback overstated."
    - "EBITDA remains negative in all three years, and Y3 revenue growth plus margin produces a negative rule-of-40 direction."
    - "Base cash reaches a $164.3K trough before an uncommitted $1.0M M25 seed; without that financing, base Y3 ending cash is negative $278.2K."
    - "No instrument-license or calibration revenue is included; the business remains a narrow, labor-intensive service unless repeat demand is proven."
