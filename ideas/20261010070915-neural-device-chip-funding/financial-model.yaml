slug: neural-load-replay-bench
date: "2026-10-10"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: Model horizon
    value: "36 months from 2026-10 through 2029-09"
    unit: calendar months
    source: "[business-plan.yaml date; three-year forecast convention requested for this model]"
  - id: A2
    name: Initial pre-seed financing
    value: 1.2
    unit: USD millions
    source: >-
      [business-plan.yaml fundingAsk.targetFundingRangeUsd and runwayMonths: modeler selects
      $1.2M within the provisional $1M-$2M band for a lean, gated 18-month validation plan;
      this is a planning choice, not an investor commitment or supplier-quoted budget]
  - id: A3
    name: Fee per completed campaign
    value: 25.0
    unit: USD thousands per campaign
    source: >-
      [business-plan.yaml gtm.pricing tests $15K-$30K and research.yaml reportMemo.willingnessToPay
      uses $25K for unverified sizing; no paid purchase, public tariff, quote, or tender establishes
      this fee, so it remains an operator hypothesis]
  - id: A4
    name: Base paid-campaign and customer ramp
    value: >-
      Y1: "3 campaigns from 3 first-time accounts; Y2: 4 campaigns, including 2 repeats and"
      2 new accounts, reaching 5 cumulative paid accounts; Y3: 5 campaigns, including 3 repeats
      and 2 new accounts, reaching 7 cumulative paid accounts. Y1 campaigns are recognized in
      M5, M6, and M11; Y2 has 1 campaign in each quarter; Y3 has 2 in Q1 and 1 in each later
      quarter. No license revenue is assumed.
    unit: campaign deliveries and cumulative unique paying accounts
    source: >-
      [business-plan.yaml gtm.funnelTargets, product.sixMonth, milestones, and 24-month five-account
      gate: explicit modeler forecast, not observed demand; the plan requires at least two paid
      pilots by M6 and three campaigns by M12]
  - id: A5
    name: Repeat purchase and churn proxy
    value: >-
      Two of the first three accounts (67%) repeat or formally budget a second campaign within
      12 months; equivalent monthly churn is 3.32%, and reciprocal expected customer life is
      30.1 months. This is a cohort heuristic for a lumpy project service, not measured retention.
    unit: annual repeat rate, monthly churn percent, and months
    source: >-
      [business-plan.yaml investorMemo.mustBeTrue and gtm.funnelTargets set the 2-of-3 repeat
      target; monthly churn and lifetime are mathematical conversions of that unvalidated target]
  - id: A6
    name: Direct campaign cost and gross margin
    value: >-
      Base campaign fee $25K; target gross margin 70%; direct cost 30% or $7.5K per campaign,
      comprising 80 delivery-engineering hours at a loaded $50/hour ($4K) plus $3.5K of direct
      calibration, consumables, shipping, and external-lab cost. Direct labor is allocated from
      payroll into COGS, not counted again in operating expense.
    unit: USD thousands and percent per campaign
    source: >-
      [business-plan.yaml businessModel.targetGrossMarginPct is 70 and strategyMap.killCriteria
      requires direct repeat-delivery costs at or below 30% of realized fees by campaign three;
      hours and direct-cost split are modeler estimates pending pilot time logs]
  - id: A7
    name: Team, hiring gate, and loaded compensation
    value: >-
      Technical founder and commercial founder/CEO start M0; one test and quality engineer starts
      M7 only after two paid pilots by M6. No further hires are planned through Y3. Fully loaded
      compensation is budgeted at $100K per FTE-year for each role; Y1 payroll is $250.2K after
      monthly rounding, and annualized payroll snapshots are $200K, $200K, $300K, $300K, $300K,
      and $300K.
    unit: FTE and USD thousands
    source: >-
      [business-plan.yaml team and strategicChoices.sequencingRationale provide role timing and
      the two-paid-pilot gate; $100K/FTE-year is a named modeler planning heuristic for lean
      pre-seed loaded compensation, not a salary survey or quote]
  - id: A8
    name: Non-payroll sales and marketing spend
    value: >-
      Y1 monthly M1-M3 $2K, M4-M6 $3K, M7-M9 $4K, M10-M12 $5K; Y2 $15K per quarter; Y3 $15K
      per quarter. Payroll is excluded.
    unit: USD thousands
    source: >-
      [business-plan.yaml gtm.channels and experimentRoadmap support founder-led technical outreach,
      incubator referrals, and scoped proposals; amounts are a modeler travel, account-development,
      and partner-work budget heuristic, not historical spend]
  - id: A9
    name: Non-payroll R&D and validation spend
    value: >-
      Y1 monthly M1-M3 $18K, M4-M6 $14K, M7-M12 $10K; Y2 $30K per quarter; Y3 $25K per quarter.
      Payroll, direct campaign COGS, and the separately shown initial bench capex are excluded.
    unit: USD thousands
    source: >-
      [business-plan.yaml product, operations, experimentRoadmap, and milestones require method
      development, calibration, repeatability work, and controlled reports; this is a modeler
      rented-lab, external calibration, fixture, and validation budget estimate, not a quote]
  - id: A10
    name: Non-payroll general and administrative spend
    value: >-
      Y1 monthly M1-M6 $8K and M7-M12 $10K; Y2 $22.5K per quarter; Y3 $22.5K per quarter.
      Payroll is excluded.
    unit: USD thousands
    source: >-
      [business-plan.yaml operations and risk mitigations require insurance, legal review,
      confidentiality, sample custody, and supplier controls; amounts are modeler planning
      heuristics, not vendor quotes]
  - id: A11
    name: Minimum bench equipment capex
    value: "USD 60K in M7, after the two paid-pilot gate; no additional capex is assumed"
    unit: USD thousands
    source: >-
      [business-plan.yaml sequencingRationale and fundingAsk.useOfFundsSummary require only a
      minimum calibrated bench after demand evidence; $60K is an unquoted planning placeholder,
      with partner-lab rental as the fallback]
  - id: A12
    name: Conditional follow-on financing
    value: >-
      Base case includes a separate, uncommitted $1.0M seed financing inflow in Q1Y3 (M25),
      conditional on the 24-month proof gates; this is additional to, and not part of, the
      current $1.2M pre-seed ask. Downside assumes it does not close.
    unit: USD thousands and month
    source: >-
      [business-plan.yaml milestones for 12-24 months and 24-36 months require five accounts,
      repeat demand, delivery-cost proof, and a financing reassessment; timing and amount are
      modeler financing assumptions and are not committed]
  - id: A13
    name: Cash and accounting convention
    value: >-
      Initial $1.2M financing arrives in M1; the conditional $1.0M follow-on arrives in Q1Y3;
      campaign revenue is collected in its delivery period; cashEopK equals prior cash plus
      EBITDA less capex plus financing inflows. No taxes, debt, depreciation, working-capital
      delay, or additional financing is modeled.
    unit: USD thousands and modeling convention
    source: "[modeler cash-flow convention; business-plan.yaml describes a lean, equity-funded pre-seed plan]"
  - id: A14
    name: Initial use-of-funds allocation and buffer
    value: >-
      Engineering $480K (40%), GTM $180K (15%), G&A $240K (20%), and six-month buffer $300K (25%),
      totaling the $1.2M ask. The buffer is a ring-fenced planning reserve; actual draw timing
      depends on paid-pilot and equipment gates.
    unit: USD thousands and percent
    source: >-
      [business-plan.yaml fundingAsk.useOfFundsSummary specifies an 18-month lean validation plan
      and a provisional $1M-$2M band; allocations are modeler judgments, not approved budgets]
  - id: A15
    name: Fully loaded customer acquisition cost
    value: >-
      Three-year modeled CAC is ($162K non-payroll S&M plus $75K, equal to 25% of three years
      of CEO loaded compensation) divided by 7 newly paying accounts, or $33.9K per new account.
      CEO payroll is already in salaryK and is not added twice to cash expense.
    unit: USD thousands per new account
    source: >-
      [business-plan.yaml gtm.channels and founder-led selling plan; S&M cadence is assumption A8,
      compensation is assumption A7, and 7-logo count is assumption A4; no observed CAC exists]
  - id: A16
    name: Downside operating case
    value: >-
      Campaign volumes fall to 1, 2, and 2 in Y1-Y3, realized fee is $20K, the test/quality hire
      and $60K equipment purchase are not made, and no follow-on round closes; founders continue
      with partner-lab support at reduced two-FTE payroll.
    unit: scenario case
    source: >-
      [business-plan.yaml pricing hypothesis is $15K-$30K and strategyMap.killCriteria gates hiring
      and equipment on paid demand; values are a stress case, not a prediction]
  - id: A17
    name: Upside operating case
    value: >-
      Y1 follows base; Y2 reaches 5 campaigns; Y3 reaches 8 campaigns at $30K per campaign and
      75% gross margin as common fixture work lowers direct cost; the conditional $1.0M round
      closes as in base.
    unit: scenario case
    source: >-
      [business-plan.yaml pricing range, 24-month five-account milestone, and conditional fixture
      reuse thesis; upper fee, volume, and margin remain unvalidated hypotheses]
  - id: A18
    name: Sensitivity shocks
    value: >-
      Downside shocks versus base: fee $20K; one fewer repeat campaign in Y3; two Y3 campaigns
      delayed beyond the horizon; gross margin 55%; one extra FTE from M13; or no $1.0M follow-on.
      Cash impacts below are changes to Y3 ending cash versus base, holding other assumptions
      constant unless the case explicitly removes the follow-on.
    unit: scenario changes and USD thousands
    source: >-
      [business-plan.yaml topRisks, strategyMap.killCriteria, milestone gates, and research.yaml
      reportMemo.sensitivityCases identify pricing, repeat demand, custom setup, hiring, and
      financing as uncertainties; shock sizes are explicit modeler stress tests]
