headcountBasis:
  assumptionRefs:
    - A7
  description: >-
    Annualized payroll is FTE multiplied by the $100K loaded annual budget. Actual salaryK is
    period payroll; directLaborK is a subset of salaryK moved into COGS and removed from opexK
    so compensation is counted exactly once.
revenueModel:
  assumptionRefs:
    - A3
    - A4
  customerDefinition: >-
    customersEop is the number of billable campaign-customer equivalents delivered in that
    reporting period, not cumulative unique logos or subscribed MRR; one delivered campaign
    counts as one. newCustomers counts first-time buying accounts, and uniqueCustomersEop tracks
    cumulative paying accounts separately.
  formula: >-
    In every period revenueK = customersEop x campaign fee (A3); each campaign is $25K in base.
    Revenue is recognized and collected when the agreed campaign report is delivered. Y1 has
    three first-time buyers, Y2 has two new buyers and two repeat campaigns, and Y3 has two new
    buyers and three repeat campaigns.
  exclusion: >-
    No license, annual calibration, clinical testing, chip fabrication, or cross-customer data
    revenue is included because the business plan gates licensing on repeat demand and the research
    found no validated willingness to pay for any of these offers.
pnlMethodology:
  assumptionRefs:
    - A3
    - A6
    - A7
    - A8
    - A9
    - A10
  description: >-
    cogsK equals directLaborK plus other direct campaign costs; grossProfitK equals revenueK
    minus cogsK; opexK equals salaryK minus directLaborK plus salesMarketingK,
    researchDevelopmentK, and generalAdministrativeK; ebitdaK equals grossProfitK minus opexK.
    Payroll is included once, and capital equipment is below EBITDA.
cashFlowMethodology:
  assumptionRefs:
    - A2
    - A11
    - A12
    - A13
  description: >-
    Period cashEopK equals prior cash plus ebitdaK less capexK plus fundingInflowK. Q4Y2 cash is
    the base-case trough at $164.3K before the conditional Q1Y3 seed inflow; without that uncommitted
    round, base-case Y3 ending cash would be negative $278.2K.
