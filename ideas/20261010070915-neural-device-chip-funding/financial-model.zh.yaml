    upsideCase: "测试与质量工程师延后入职三个月，约节省 $25K"
    y3RevenueImpactK: 0.0
    cashImpactK: -200.0
  - variable: 后续融资
    downsideCase: "M25 未能完成 $1.0M seed 融资"
