slug: neural-load-replay-bench
date: "2026-10-10"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A1
    name: 模型周期
    value: "36 个月，覆盖 2026-10 至 2029-09"
    unit: 日历月
    source: "[business-plan.yaml date；本模型按要求采用三年预测口径]"
  - id: A2
    name: 首轮 pre-seed 融资
    value: 1.2
    unit: USD 百万元
    source: >-
      [business-plan.yaml fundingAsk.targetFundingRangeUsd 和 runwayMonths：建模者从暂定的 $1M-$2M 区间中选取
      $1.2M，用于精简、分阶段推进的 18 个月验证计划；这是规划假设，不代表投资人承诺或供应商报价预算]
  - id: A3
    name: 每场已完成测试活动的收费
    value: 25.0
    unit: USD 千元/场
    source: >-
      [business-plan.yaml gtm.pricing 测试 $15K-$30K；research.yaml reportMemo.willingnessToPay 用 $25K 做未经验证的测算。尚无付费采购、公开价目、报价或招标结果能证明这一收费成立，因此它仍是运营方假设]
  - id: A4
    name: 基准付费活动与客户增长节奏
    value: >-
      Y1 完成 3 场测试活动，来自 3 家首次购买客户；Y2 完成 4 场，其中 2 场复购、2 家新客户，累计付费客户达到 5 家；Y3 完成 5 场，其中 3 场复购、2 家新客户，累计付费客户达到 7 家。Y1 的活动分别记在 M5、M6 和 M11；Y2 每季度完成 1 场；Y3 在 Q1 完成 2 场，之后每季度各完成 1 场。不计授权收入。
    unit: 活动交付数及累计独立付费客户数
    source: >-
      [business-plan.yaml gtm.funnelTargets、product.sixMonth、milestones 和 24 个月内达到五家客户的门槛：这是建模者明确给出的预测，并非已观察到的需求；计划要求 M6 前至少拿下两个付费试点，M12 前完成三个活动]
  - id: A5
    name: 复购与流失率代理指标
    value: >-
      前三家客户中有两家（67%）在 12 个月内复购，或正式为第二场活动编列预算；折算月流失率为 3.32%，预期客户生命周期为 30.1 个月。项目型服务收入起伏较大，这只是用于估算的客户群组经验值，并非实测留存率。
    unit: 年复购率、月流失率和月数
    source: >-
      [business-plan.yaml investorMemo.mustBeTrue 和 gtm.funnelTargets 将复购目标设为 3 家中有 2 家；月流失率和客户生命周期均由这一未经验证的目标换算而来]
  - id: A6
    name: 活动直接成本与毛利率
    value: >-
      基准收费为每场 $25K，目标毛利率为 70%；每场直接成本为收费的 30%，即 $7.5K。其中包括 80 小时交付工程工时，按每小时全负担成本 $50 计为 $4K；另有 $3.5K 的直接校准、耗材、运输和外部实验室费用。直接人工从工资中分摊至 COGS，不再计入运营费用。
    unit: 每个活动的 USD 千元金额和百分比
    source: >-
      [business-plan.yaml businessModel.targetGrossMarginPct 设为 70；strategyMap.killCriteria 要求到第三个活动时，复购交付的直接成本不高于实际收费的 30%；工时和直接成本拆分是建模者估算，仍待试点工时记录验证]
  - id: A7
    name: 团队、招聘门槛与全负担薪酬
    value: >-
      技术创始人和商业创始人/CEO 于 M0 入职；只有在 M6 前拿下两个付费试点后，才于 M7 招聘一名测试与质量工程师。Y3 结束前不再计划增员。每个岗位的全负担薪酬按每 FTE 每年 $100K 预算；按月四舍五入后，Y1 工资支出为 $250.2K，各时点折算的年化工资依次为 $200K、$200K、$300K、$300K、$300K 和 $300K。
    unit: FTE 和 USD 千元
    source: >-
      [business-plan.yaml team 和 strategicChoices.sequencingRationale 规定了岗位到岗时间及两个付费试点的招聘门槛；每 FTE 每年 $100K 是建模者为精简 pre-seed 阶段全负担薪酬设定的规划经验值，并非薪酬调查结果或报价]
  - id: A8
    name: 非工资类销售与营销支出
    value: >-
      Y1 按月支出：M1-M3 为 $2K，M4-M6 为 $3K，M7-M9 为 $4K，M10-M12 为 $5K；Y2 每季度 $15K；Y3 每季度 $15K。不含工资。
    unit: USD 千元
    source: >-
      [business-plan.yaml gtm.channels 和 experimentRoadmap 支持创始人主导的技术拓展、孵化器转介及范围明确的项目提案；金额是建模者对差旅、客户开发和合作方协作支出的预算估算，并非历史支出]
  - id: A9
    name: 非工资类研发与验证支出
    value: >-
      Y1 按月支出：M1-M3 为 $18K，M4-M6 为 $14K，M7-M12 为 $10K；Y2 每季度 $30K；Y3 每季度 $25K。不含工资、活动直接 COGS，以及单独列示的初始测试台资本开支。
    unit: USD 千元
    source: >-
      [business-plan.yaml product、operations、experimentRoadmap 和 milestones 要求开发测试方法、校准、重复性验证并出具受控报告；这是建模者对实验室租赁、外部校准、夹具和验证支出的预算估算，并非报价]
  - id: A10
    name: 非工资类管理与行政支出
    value: >-
      Y1 按月支出：M1-M6 为 $8K，M7-M12 为 $10K；Y2 每季度 $22.5K；Y3 每季度 $22.5K。不含工资。
    unit: USD 千元
    source: >-
      [business-plan.yaml operations 和风险缓释措施要求购买保险、进行法律审查、确保保密、妥善保管样品并管控供应商；金额是建模者的规划经验值，并非供应商报价]
  - id: A11
    name: 最低配置测试台设备资本开支
    value: "M7 在两个付费试点门槛达成后投入 USD 60K；不假设额外资本开支"
    unit: USD 千元
    source: >-
      [business-plan.yaml sequencingRationale 和 fundingAsk.useOfFundsSummary 要求只有在需求得到验证后才配置最低限度的校准测试台；$60K 是尚无报价的规划占位数，备选方案是租用合作实验室]
  - id: A12
    name: 有条件的后续融资
    value: >-
      基准情景计入 Q1Y3（M25）单独一笔、尚未承诺的 $1.0M seed 融资流入，前提是通过 24 个月验证门槛；这笔后续融资另计，不属于当前 $1.2M pre-seed 融资需求。下行情景假设融资未能完成。
    unit: USD 千元和月份
    source: >-
      [business-plan.yaml 中 12-24 个月和 24-36 个月的 milestones 要求达到五家客户、验证复购需求和交付成本，并重新评估融资；融资时间和金额均为建模假设，尚无承诺]
  - id: A13
    name: 现金流与会计口径
    value: >-
      首笔 $1.2M 融资于 M1 到账；有条件的 $1.0M 后续融资于 Q1Y3 到账；活动收入在交付期收取。各期 cashEopK = 上期 cashEopK + EBITDA - 资本开支 + 融资流入。不计税费、债务、折旧、营运资金延迟或额外融资。
    unit: USD 千元和建模口径
    source: "[建模者采用的现金流口径；business-plan.yaml 描述的是精简、股权融资的 pre-seed 计划]"
  - id: A14
    name: 首笔资金用途分配与储备金
    value: >-
      工程 $480K（40%）、GTM $180K（15%）、G&A $240K（20%）、六个月储备金 $300K（25%），合计为 $1.2M 融资需求。储备金单独圈存作规划预留；实际动用时间取决于付费试点和设备采购门槛。
    unit: USD 千元和百分比
    source: >-
      [business-plan.yaml fundingAsk.useOfFundsSummary 规定了 18 个月的精简验证计划，暂定融资区间为 $1M-$2M；资金分配由建模者判断，并非已批准预算]
  - id: A15
    name: 全负担客户获取成本
    value: >-
      三年模型中的 CAC =（非工资类 S&M 支出 $162K + $75K，即 CEO 三年全负担薪酬的 25%）÷ 7 家新付费客户，得出每家新付费客户的 CAC 为 $33.9K。CEO 工资已计入 salaryK，不会在现金费用中重复计算。
    unit: 每家新客户的 USD 千元成本
    source: >-
      [business-plan.yaml gtm.channels 和创始人主导的销售计划；S&M 节奏见假设 A8，薪酬见假设 A7，7 家客户见假设 A4；目前没有实测 CAC]
  - id: A16
    name: 下行运营情景
    value: >-
      Y1-Y3 活动数降至 1、2、2 场，实际收费为 $20K；不招聘测试/质量工程师，也不购买 $60K 设备，且后续融资未能完成。创始人借助合作实验室继续经营，工资压至两个 FTE 的水平。
    unit: 情景
    source: >-
      [business-plan.yaml 的定价假设为 $15K-$30K，strategyMap.killCriteria 要求依据付费需求决定是否招聘和购置设备；这些数值用于压力测试，并非预测]
  - id: A17
    name: 上行运营情景
    value: >-
      Y1 与基准情景相同；Y2 完成 5 个活动；Y3 完成 8 个活动，每个收费 $30K。通用夹具的复用降低了直接成本，毛利率达到 75%；有条件的 $1.0M 融资与基准情景一样完成。
    unit: 情景
    source: >-
      [business-plan.yaml 定价区间、24 个月达到五家客户的里程碑及有条件的夹具复用论点；较高收费、活动量和毛利率仍是未经验证的假设]
  - id: A18
    name: 敏感性压力测试
    value: >-
      相对基准情景的下行冲击包括：收费降至 $20K；Y3 少一个复购活动；Y3 有两个活动延迟到预测期之后；毛利率降至 55%；M13 起多聘一个 FTE；或未能获得 $1.0M 后续融资。除非情景明确取消后续融资，以下现金影响均为其他假设不变时，Y3 期末现金相对基准情景的变化。
    unit: 情景变动和 USD 千元
    source: >-
      [business-plan.yaml topRisks、strategyMap.killCriteria、milestone gates 和 research.yaml reportMemo.sensitivityCases 将定价、复购需求、定制搭建、招聘及融资列为不确定因素；冲击幅度是建模者明确设定的压力测试]
