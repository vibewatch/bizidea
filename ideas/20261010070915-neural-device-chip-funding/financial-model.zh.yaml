    upsideCase: "于 Q4Y2 完成 $1.0M seed 融资"
    y3RevenueImpactK: 0.0
    cashImpactK: -1000.0
modelDiagram:
  title: 单位经济模型与现金流
  mermaid: |
    flowchart LR
      Accounts["Qualified UK/EU device accounts"] --> Campaigns["Paid load-replay campaigns"]
      Campaigns --> Reports["Accepted engineering reports"]
      Reports --> Revenue["Campaign count x $25K fee"]
      Revenue --> GrossProfit["70% target gross margin"]
      GrossProfit --> Cash["Cash after payroll, opex, capex, and funding"]
modelSanity:
  - checkName: 收入引擎
    finding: "基准情景下，Y1-Y3 分别完成 3、4、5 场已验收的测试活动，每场收费 $25K；不计授权收入。"
  - checkName: 必须跑通的条件
    finding: "截至 M6，至少要签下两个试点；复购交付的直接成本也必须守在 30% 上限内，才能支撑截至 M24 累计达到五家付费客户。"
  - checkName: 模型失效条件
    finding: "如果下行情景中每年仅完成 1、2、2 场活动、每场收费 $20K，导致有条件的 $1M seed 无法完成，模型显示 Y3 现金将为负 $136K。"
  - checkName: 下一轮融资验证条件
    finding: "累计达到五家付费客户、记录两次试点复购和盲测重复性证据，并确认直接交付成本不高于收费的 30% 后，才应推进 M25 seed 融资。"
sanityChecks:
  ruleOf40: "Y3 营收增长率 25% + EBITDA 利润率 -354% = -329%；指标走势远低于健康的经常性收入增长水平。"
  burnMultiple: "19.4x 近似指标：Y2 EBITDA 现金消耗 $484K 除以新增活动收入 $25K；一次性服务收入不适合套用 SaaS 的 burn multiple。"
  revenuePerFte: "Y3 每个 FTE 创收 $41.7K（$125K 除以 3 个 FTE），这更像尚在验证、规模尚小的服务业务，而非已验证的平台。"
  flags:
    - "目前没有已确认的付费需求、活动报价或付费意愿；模型中的订单和 $25K 收费都只是待验证假设。"
    - "$0.5M UK/EU SAM 情景、合格客户数量、每年一次的活动频率和复购率均未经验证。"
    - "毛利率达到 70% 要求每场活动的直接交付成本降至 $7.5K；工程师工时和夹具复用尚未得到验证。"
    - "LTV/CAC 参考值仅为 1.3x，CAC 回收期为 23.2 个月；项目收入起伏较大，客户生命周期和回收期都可能被高估。"
    - "EBITDA 连续三年为负，Y3 营收增长与利润率也令 rule-of-40 指标走向为负。"
    - "基准情景现金在尚未承诺的 $1.0M M25 seed 到账前降至 $164.3K；若融资未到位，基准情景 Y3 期末现金将为负 $278.2K。"
    - "模型未计入仪器授权或校准收入；除非复购需求得到验证，否则业务仍是一项范围狭窄、依赖大量人工的服务。"
