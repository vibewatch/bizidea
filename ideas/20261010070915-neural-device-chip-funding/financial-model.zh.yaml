headcountBasis:
  assumptionRefs:
    - A7
  description: >-
    年化工资按 FTE 数乘以每年 $100K 的全负担薪酬预算计算。salaryK 记录各期实际工资；directLaborK 是从 salaryK 中划入 COGS、并从 opexK 扣除的部分，确保薪酬只计一次。
revenueModel:
  assumptionRefs:
    - A3
    - A4
  customerDefinition: >-
    customersEop 表示报告期内交付的可计费客户当量（每交付一场活动计一个），既不是累计独立客户数，也不是订阅 MRR。newCustomers 统计首次购买的账户数；uniqueCustomersEop 则单独跟踪累计付费账户数。
  formula: >-
    每期按 revenueK = customersEop x 活动收费（A3）计算；基准情景下每场收费 $25K。约定的活动报告交付时确认并收取收入。Y1 有三家首次购买客户；Y2 新增两家客户，并有两场复购活动；Y3 新增两家客户，并有三场复购活动。
  exclusion: >-
    模型不计入授权、年度校准、临床测试、芯片制造或跨客户数据收入，因为业务计划要求先验证复购需求再考虑授权，研究也未发现客户对这些服务有经过验证的付费意愿。
pnlMethodology:
  assumptionRefs:
    - A3
    - A6
    - A7
    - A8
    - A9
    - A10
  description: >-
    cogsK = directLaborK + 其他活动直接成本；grossProfitK = revenueK - cogsK；opexK = salaryK - directLaborK + salesMarketingK + researchDevelopmentK + generalAdministrativeK；ebitdaK = grossProfitK - opexK。工资只计一次：分摊到直接人工的部分已从 opexK 扣除。资本设备支出列在 EBITDA 以下。
cashFlowMethodology:
  assumptionRefs:
    - A2
    - A11
    - A12
    - A13
  description: >-
    各期 cashEopK = 期初现金 + ebitdaK - capexK + fundingInflowK。基准情景的现金低点出现在 Q4Y2，为 $164.3K，早于 Q1Y3 有条件的 seed 融资流入；若这轮尚未承诺的融资没有到位，基准情景 Y3 期末现金将为负 $278.2K。
