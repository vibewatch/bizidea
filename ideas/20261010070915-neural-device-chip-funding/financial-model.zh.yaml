unitEconomics:
  arpuAnnualK: 25.0
  grossMarginPct: 70.0
  cacK: 33.9
  monthlyChurnPct: 3.3
  avgCustomerLifeMonths: 30.1
  ltvK: 43.9
  ltvCacRatio: 1.3
  cacPaybackMonths: 23.2
unitEconomicsMethodology:
  assumptionRefs:
    - A3
    - A5
    - A6
    - A15
  description: >-
    年度 ARPU 假设每个付费账户每年购买一场 $25K 活动。LTV = 年度 ARPU × 毛利率 × 30.1 个月 ÷ 12；CAC 为 $33.9K；回收期 = CAC ÷ 月毛利。这些比率仅供参考：服务按单次项目购买，复购行为尚未验证，CAC 也只是根据计划支出估算。
fundingAsk:
  round: pre-seed
  amountM: 1.2
  runwayMonths: 18
  milestone: >-
    为 18 个月验证计划提供资金，并留足六个月现金储备；截至 M6，至少拿下两个单价不低于 $15K 的付费试点；在三个前端和两个支持的配置上完成盲测重复性测试，交付三场受控活动，记录决策影响和复购交付成本（不高于收费的 30%）；同时为第 24 个月融资门槛做好准备。
  useOfFunds:
    - bucket: 工程
      amountUsd: 480000
      percentage: 40
    - bucket: GTM
      amountUsd: 180000
      percentage: 15
    - bucket: "管理与行政（G&A）"
      amountUsd: 240000
      percentage: 20
    - bucket: "储备金（6 个月）"
      amountUsd: 300000
      percentage: 25
scenarios:
  downside:
    description: >-
      需求和收费偏低，未能通过两个付费试点门槛；公司不招聘专职测试人员、不购置测试台，也没有后续融资。若创始人选择继续经营，而不是停业或重组，模型显示到 Y3 将出现 $136K 现金缺口。
    y3RevenueK: 40.0
    y3EbitdaK: -414.0
    cashLowPointK: -136.0
    keyAssumptionChanges:
      - "Y1-Y3 活动数降至 1、2、2 场，每场收费 $20K。"
      - "测试与质量工程师岗位空缺，避免投入 $60K 测试台资本开支。"
      - "有条件的 $1.0M Q1Y3 seed 未能完成，现金没有补充。"
  base:
    description: >-
      基准情景假设未经验证的付费活动增长计划能够实现，并在通过 24 个月验证门槛后于 M25 完成一笔单独的 $1.0M seed 融资；这笔后续融资尚未承诺。
    y3RevenueK: 125.0
    y3EbitdaK: -442.5
    cashLowPointK: 164.3
    keyAssumptionChanges:
      - "Y1-Y3 分别完成三、四、五场付费活动，每场收费 $25K。"
      - "M12 前，前三家客户中有两家复购或为第二场活动编列预算。"
      - "累计达到五家客户并证明复购成本后，于 Q1Y3 完成有条件的 $1.0M seed 融资。"
  upside:
    description: >-
      转化率提高、收费达到拟议区间上限，且复用压低直接成本，都会改善贡献利润；但已验证市场规模仍不足以支持快速增加固定成本，因此模型中的 EBITDA 仍为负。
    y3RevenueK: 240.0
    y3EbitdaK: -338.0
    cashLowPointK: 185.8
    keyAssumptionChanges:
      - "Y2 完成五场活动，Y3 完成八场，每场收费 $30K。"
      - "夹具模块可重复使用，Y3 毛利率达到 75%。"
      - "有条件的 $1.0M seed 与基准情景在同一时间完成。"
sensitivity:
