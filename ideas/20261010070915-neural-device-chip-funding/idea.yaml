problem: >-
  Neural-device teams must choose or integrate specialized sensing and stimulation silicon while facing a reported
  tradeoff between generic components and lengthy custom-chip development. Without a repeatable way to compare
  candidate front ends against the device's intended electrode loads, teams may discover electrical mismatches late
  in board or device integration; the available sources do not quantify how often this happens.
targetUser:
  primary: ASIC or systems-engineering leads at early-stage neural-device companies evaluating a neural sensing or stimulation front end before a board architecture is frozen.
  secondary: Neurotechnology founders and device-program leads coordinating chip-vendor or silicon-partner integration.
  buyer: VP of Engineering or CTO with budget for prototype testing and design verification.
startupThesis:
  nonObviousInsight: >-
    The make-or-buy chip decision is not only about silicon design: device teams also need a neutral, comparable
    test of candidate chips under their own electrode-load and stimulation conditions before committing to a system
    architecture. A reusable physical test recipe could shorten that evidence gap without claiming to replace custom
    chip design or clinical validation.
  beachhead: >-
    Preclinical neural-interface developers evaluating sensing or stimulation electronics at the point between
    component selection and the next device-board revision.
  wedge: >-
    A paid bench-test campaign that emulates a customer's specified electrode loads and signal duty cycles, then
    compares candidate front ends using one calibrated procedure.
  whyNowCatalyst: >-
    MintNeuro's reported working silicon, partner integration milestones and new funding for product launches and
    partner delivery put neural-interface silicon into a scale-up phase; Imperial also describes the enduring
    generic-component-versus-custom-chip tradeoff.
  ventureScalePath: >-
    Turn repeated test campaigns into standardized load-emulator kits and licensed protocols, then extend the
    instrument family to adjacent neural sensing and stimulation device types. Any cross-customer benchmark would be
    opt-in and anonymized, with the core business remaining paid verification rather than a clinical-performance
    claim.
solution: >-
  The company builds a calibrated electrical bench that emulates customer-defined electrode impedance and
  stimulation duty-cycle cases for candidate neural front ends. Engineers submit a chip or evaluation board and
  their operating envelope; the lab replays the same cases across candidates and records measures such as input
  noise, channel behavior, pulse fidelity and power under those test conditions. Each paid campaign returns a
  reproducible technical report for architecture and board-design decisions, with explicit limits on what the
  bench does not prove about tissue response or clinical performance. Recurring programs can move onto licensed
  bench hardware and a versioned test protocol.
goToMarketSeed:
  firstCustomer: A UK or European neural-device startup with a sensing or stimulation prototype, a near-term board-design decision and either generic component evaluations or an external silicon partner.
  buyingTrigger: A component-selection review or board-design freeze where the team needs comparable evidence before committing to the next prototype.
  currentAlternative: In-house measurements on component evaluation boards or engineering bring-up with a chip vendor; the supplied sources do not establish a dedicated independent test incumbent.
  switchingReason: A neutral test recipe exposes how alternative front ends behave under the same device-specific electrical loads rather than relying on incomparable vendor demonstrations.
  pricingHypothesis: Fixed fee per candidate-chip test campaign, with annual calibration and protocol licensing as teams repeat tests across revisions.
