  creativeNovelty:
    score: 5
    rationale: >-
      The core product is a neutral physical workload-replay test, keyed to the device's electrode loads, rather
      than a chip design tool, supplier catalog or general test dashboard.
  venturePotential:
    score: 4
    rationale: >-
      A repeatable bench can expand from fee-based test campaigns into licensed instruments and protocols, but the
      initial neural-device customer base and annual test frequency are unverified.
  whiteSpace:
    score: 3
    rationale: >-
      The historical index contains no neural-chip qualification concept, but competitor density and existing
      specialist laboratory offerings were not researched and the initial niche is narrow.
  painIntensity:
    score: 4
    rationale: >-
      The triage sources identify a choice between generic components and lengthy custom silicon development; the
      specific cost of late-stage electrical mismatch remains unquantified.
  wedgeClarity:
    score: 4
    rationale: >-
      One bounded purchase can be sold at a concrete pre-board-design decision, although each customer's electrical
      load recipe may require custom setup.
  evidenceFit:
    score: 4
    rationale: >-
      Working silicon, partner integration and the documented generic-versus-custom choice support a timing and
      workflow hypothesis, but none of the sources directly validates demand for an independent qualification bench.
topRisks:
  - name: Narrow early market
    description: The sources establish a specific chip-development bottleneck but do not establish the number of neural-device buyers or their test budgets.
    mitigation: Start with paid design-partner campaigns and require repeat purchase or a bench-license commitment before expanding the instrument range.
  - name: Test-to-device mismatch
    description: An electrical emulator cannot fully represent tissue response, implanted geometry or clinical performance.
    mitigation: Label outputs as bench measurements only, scope recipes with device engineers and compare only against customer-approved operating conditions.
  - name: Bespoke test burden
    description: Device-specific electrode loads and signal modes may make each engagement too custom to scale economically.
    mitigation: Track setup hours per campaign, standardize recurring fixture modules and decline unsupported test profiles until they fit the protocol.
