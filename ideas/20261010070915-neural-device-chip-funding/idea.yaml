      Candidates["Candidate front ends or ASICs"] --> Bench
      Bench --> Measures["Comparable noise, pulse-fidelity, and power measurements"]
      Measures --> Decision["Choose the next board architecture"]
businessModelCanvas:
  customerSegments:
    - Early-stage neural-interface companies testing sensing or stimulation electronics.
    - Neural-device engineering teams working with silicon design partners.
  valuePropositions:
    - Compare candidate front ends against the same device-specific electrical loads before committing to a board revision.
    - Obtain repeatable bench evidence without commissioning a custom chip solely to answer an architecture question.
  channels:
    - Direct technical selling to neurotechnology founders and engineering leads.
    - Referrals from neural-device incubators, university labs and semiconductor design partners.
  customerRelationships:
    - Engineer-led test scoping and fixed-scope validation campaigns.
    - Recurring calibration, protocol support and bench licensing for repeat customers.
  revenueStreams:
    - Fee per chip or evaluation-board test campaign.
    - Annual license and calibration for customer-operated load-emulation benches.
  keyResources:
    - Calibrated programmable electrode-load emulators and test fixtures.
    - Versioned test protocols and measurement expertise.
    - Secure handling of customer-specific device and chip designs.
  keyActivities:
    - Define reproducible load and duty-cycle test cases with each customer.
    - Run comparative electrical measurements and maintain calibrated fixtures.
    - Convert repeat test cases into configurable bench hardware and licensed methods.
  keyPartners:
    - Neural-device developers supplying use conditions and prototype boards.
    - Independent electronics laboratories or university engineering facilities for early calibration and method review.
    - Component and silicon vendors willing to provide evaluation devices.
  costStructure:
    - Specialized bench instruments, fixtures and calibration.
    - Electrical engineering labor and custom test setup.
    - Secure prototype logistics, insurance and customer acquisition.
jobsToBeDone:
  - job: When a neural-device team is choosing its next sensing or stimulation front end, help the systems engineer compare candidates under the intended electrode loads, so they can commit to a board architecture with repeatable bench evidence.
    currentAlternative: In-house evaluation-board measurements and vendor-specific silicon bring-up.
    successMetric: Time from test-scope agreement to an architecture decision, plus the number of load cases completed reproducibly across candidates.
