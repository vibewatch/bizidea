slug: neural-load-replay-bench
date: 2026-10-10
executiveSummary: >-
  Neural-device teams face a documented choice between generic electronics and
  lengthy custom-chip development, while partner-level neural-silicon
  integration is underway. The proposed company sells a neutral, fixed-scope
  bench campaign comparing candidate front ends under one customer's declared
  electrode-load and stimulation conditions before a board decision. The
  likely first buyer is a UK or European preclinical neural-device CTO or VP of
  Engineering with an active prototype and a near-term architecture review.
  Research supports the engineering context and the feasibility of electrical
  load testing, but it does not establish late-mismatch frequency, paid demand,
  or willingness to pay for an independent campaign. The $2.5M global TAM,
  $0.5M UK/EU SAM, and $0.125M SOM are bottom-up scenarios using unverified
  buyer counts, one campaign per buyer per year, and a $25K assumed fee; they
  are not market measurements. Start as a manual service, test a $15K–$30K
  campaign hypothesis, and buy specialized equipment only against paid pilot
  demand. Vendor platforms, in-house labs, ASIC providers, and medical-device
  test labs are credible substitutes, so neutrality and repeatability must
  change a real architecture decision to matter. Reports must remain bounded
  bench evidence, not clinical performance, tissue-response, safety, or
  certification claims. This is a watch-stage opportunity until paid pilots,
  repeatable results, and repeat purchasing establish a viable service.
problem:
  - Neural-device teams must choose or integrate sensing and stimulation electronics despite a reported tradeoff between generic components and lengthy custom-chip development.
  - In-house or vendor-specific measurements may not give a comparable view of competing front ends under the same customer-defined electrical conditions before a board revision.
  - The available research does not quantify mismatch-driven rework, external test budgets, or how often this decision recurs.
solution:
  - Run a calibrated, fixed-scope campaign that replays customer-approved electrode-load and stimulation-duty-cycle cases across candidate front ends.
  - Report agreed electrical measures such as input noise, channel behavior, pulse fidelity, and power, with calibration and repeatability limits stated.
  - Keep customer recipes and raw results private; label reports as engineering measurements that do not establish tissue response, clinical performance, safety, or regulatory conformity.
whyWeWin:
  - A neutral same-protocol comparison could be more useful at a multi-vendor architecture decision than separate vendor demonstrations, if buyers value independence enough to pay.
  - The service starts with a specific board-selection workflow rather than competing with neural-chip suppliers on silicon, or with broad laboratories on formal device testing.
  - A versioned protocol, calibrated fixtures, and permissioned reusable recipes could improve repeatability; no proprietary dataset or defensible moat is established today.
strategicChoices:
  beachhead: UK/EU preclinical neural-interface developers choosing sensing or stimulation front ends before a board revision, with a funded prototype and multiple candidates or a partner-silicon integration decision.
  wedgeRationale: A board-architecture review has a named decision, candidate hardware, and a buyer who can compare the campaign fee with in-house engineering time or a wrong selection; broader neural-device testing would add unproven use cases and quality burden before demand is known.
  sequencingRationale: Interview buyers and secure paid scopes before substantial equipment spend; prove measurement repeatability and customer decision relevance on manual campaigns; standardize only recurring load modules; hire dedicated test and quality capacity after paid demand; license hardware only after repeat campaigns justify it.
  notYet:
    - Clinical, in-vivo, tissue-response, chronic-stability, safety, or regulatory-certification testing.
    - Custom ASIC design, silicon manufacturing, and full system integration that compete directly with chip vendors and design houses.
    - A broad BCI market launch, public cross-customer benchmark, or US expansion before the UK/EU buyer count and repeat rate are verified.
    - Customer-operated licensed benches before the service proves a repeatable protocol and calibration model.
market:
  tam: "Scenario only: $2.5M annual global service spend, calculated from 100 assumed eligible programs × one campaign per year × an unverified $25K fee; no qualified-buyer census exists."
  sam: "Scenario only: $0.5M annual UK/EU service spend from 20 assumed eligible programs × one campaign per year × an unverified $25K fee; the account count is unverified."
  som: "Scenario only: $0.125M annual spend from five paid accounts at one assumed $25K campaign each; this is a penetration hypothesis, not a forecast."
  segments:
    - UK/EU preclinical neural-interface startups with active sensing or stimulation hardware and an upcoming component or board decision.
    - Neural-device integration programs at neurotechnology developers that need an independent comparison alongside a chip or ASIC partner.
  buyingProcess: The CTO or VP of Engineering is the likely budget owner and defines the architecture question and acceptance conditions with systems or ASIC engineers. Procurement, quality, and regulatory staff may review supplier controls, sample custody, calibration records, and report limits before unreleased hardware is shared; the timing and approval burden are unvalidated.
product:
  mvp: A hands-on engineering service using a calibrated load fixture to replay one customer-approved electrical envelope across candidate chips or evaluation boards and return a versioned comparison report. The first release supports bounded RC/load and waveform profiles only, with customer-agreed metrics and explicit limits; it is not a certification or clinical test.
  sixMonth: Complete paid, manual pilot campaigns and a blinded repeatability study across three candidate front ends and two customer-approved load profiles; log calibration uncertainty, setup hours, and whether results affect the customer's board choice.
  twelveMonth: Maintain a controlled, versioned protocol and a small set of configurable fixture modules for profiles that recur; deliver a customer security and calibration packet while continuing to quote out-of-envelope work separately or decline it.
  twentyFourMonth: Offer a licensed bench module with annual calibration only if at least five accounts have paid, repeat demand is documented, and common fixture modules reduce delivery effort; otherwise remain a narrowly scoped service or stop.
  keyBets:
    - At least some engineering buyers need an independent comparison rather than in-house tests or supplier application support.
    - A customer-approved electrical replay can change a component or board decision even though it cannot represent tissue response or clinical performance.
    - A material share of test setup can be reused without making customer-specific acceptance criteria less useful.
    - Customers will share unreleased boards and load recipes under segregated data handling and a clear supplier-quality scope.
gtm:
  wedge: Directly sell a fixed-scope campaign to a UK/EU preclinical device team during component selection or board freeze; use the customer's own load recipe and candidate parts, and charge for an architecture decision report rather than generic impedance measurements.
  channels:
    - Founder-led technical outreach to CTOs and systems/ASIC leads at manually verified neural-device programs with an active hardware decision.
    - Introductions through neural-interface incubators, translational research programs, and public grant networks; grant funding is a lead source, not evidence of service procurement.
    - Selective referrals from independent calibration or medical-device test laboratories; manage chip-vendor referrals carefully to preserve the appearance and reality of neutrality.
  funnelTargets: "Operating targets, not observed conversion: 15 qualified buyer interviews and three written pilot proposals by month 6; secure at least two paid pilots at or above $15K, then achieve a repeat campaign or documented follow-on commitment from at least two of the first three buyers by month 12."
  pricing: "Test a fixed $15K–$30K fee per bounded candidate-chip campaign, with scope and acceptance criteria agreed in advance. This is an operator hypothesis: no public campaign tariff, purchase order, or tender was found; price must be compared with buyer-verified engineering cost or decision risk. Offer annual calibration or protocol licensing only after repeat usage is observed."
businessModel:
  revenueStreams:
    - Fixed fee per customer-specific chip or evaluation-board comparison campaign.
    - Annual calibration and protocol license for customer-operated benches, conditional on evidence of repeatable profiles and buyer demand.
  unitOfValue: One reproducible, customer-approved comparison of multiple candidate front ends under the same declared electrical load and duty-cycle cases, delivered before a named architecture decision.
  targetGrossMarginPct: 70
  expansionLevers:
    - Reuse fixture modules and test recipes across repeat campaigns while keeping each customer's confidential recipe segregated.
    - Add customer-operated bench licensing and annual calibration only after service customers repeat the same supported profiles.
    - Extend to adjacent neural sensing or stimulation profiles only after the initial invasive/preclinical workflow meets delivery and repeat-purchase gates.
strategyMap:
  northStarMetric: Paid architecture decisions supported by a repeatable campaign and followed by a second paid campaign or bench license.
  inputMetrics:
    - Qualified programs with a board or front-end decision inside 12 months and a named budget owner.
    - Paid pilot proposals, signed purchase orders or deposits, and time from first technical meeting to purchase.
    - Campaign setup and report hours, supported-profile reuse, calibration uncertainty, and customer-agreed repeatability.
    - Share of completed pilots that change a selection, support a documented decision, or lead to repeat paid work.
  moatsToBuild:
    - Calibrated, documented fixtures and versioned procedures with measured uncertainty across supported profiles.
    - Trust from neutral candidate handling, customer-owned results, segregated recipes, chain-of-custody, and clear limits on claims.
    - Opt-in anonymized benchmark data only if customers consent and enough unrelated campaigns make it useful; this asset does not exist yet.
  killCriteria:
    - Fewer than two paid pilot orders at $15K or more after 15 qualified interviews and three scoped proposals by month 6.
    - After three campaigns, fewer than two customers show that the report informed an architecture decision or paid follow-on.
    - Blind repeats across three front ends and two supported load profiles fail customer-agreed repeatability criteria or do not affect a real selection.
    - By the third campaign, repeat delivery still costs more than 30% of realized campaign fees in direct engineering, calibration, consumables, and shipping.
    - A manual UK/EU account census finds fewer than 20 active programs with a relevant front-end decision, invalidating the researched SAM scenario.
  mermaid: |
    flowchart LR
      Decision["Pre-board architecture decision"] --> Campaign["Paid neutral load-replay campaign"]
      Campaign --> Proof["Customer-agreed repeatable comparison"]
      Proof --> Modules["Reusable calibrated fixture modules"]
      Modules --> License["Conditional bench license and calibration"]
investorMemo:
  verdict:
    call: Watch
    conviction: "Low conviction: the engineering workflow is credible, but service demand, willingness to pay, repeat frequency, and scalable delivery remain unproven."
    whyBelieve: "Neural-chip partner integration is underway and a neutral comparison could answer a discrete board-selection question that vendor-specific demonstrations do not."
    whyDoubt: "The modeled global service spend is only $2.5M under unverified assumptions, while in-house labs, vendors, ASIC firms, and test laboratories can cover overlapping work."
    nextDiligence: "Require at least two paid pilots at $15K or more and a blinded repeatability result that changes a documented component decision before treating the wedge as validated."
  firstCustomer:
    title: UK/EU preclinical neural-interface developer at front-end selection
    profile: "A small device team with an active sensing or stimulation prototype, competing front-end options or a silicon partner, and a board decision approaching."
    trigger: "A component-selection review or board-design freeze where the team needs comparable electrical evidence before committing to its next prototype."
    buyer: CTO or VP of Engineering
    initialContract: "Hypothesis only: a fixed $15K–$30K campaign covering agreed load profiles, candidate parts, repeat measurements, and a decision report; convert to repeat campaigns, then consider annual calibration or protocol licensing only if demand recurs."
  mustBeTrue:
    - At least three of the first 15 qualified buyer interviews document a recent or imminent front-end decision where comparable load-specific evidence is missing and an economic buyer owns a budget.
    - At least two independent buyers sign paid pilot orders at $15K or more by month 6 rather than offering only informal interest or grant support.
    - A blinded comparison across three front ends and two customer-approved load profiles meets acceptance criteria agreed before testing and informs at least one real component decision.
    - At least two of the first three paid pilot customers place or formally budget a second campaign within 12 months.
    - A verified census finds at least 20 active UK/EU programs matching the beachhead, and repeat-campaign delivery can reach direct costs at or below 30% of realized fees.
  diligenceQuestions:
    - What recent board or ASIC decision was delayed or changed by a mismatch under the intended electrode loads, and what cost or engineering time did it create?
    - Who controls budget for independent front-end testing, and what did that buyer last pay for internal, vendor, or contract-lab work?
    - How many UK/EU programs have active neural hardware, a near-term architecture decision, and no adequate internal comparison setup?
    - Can electrical load replay change the decision that an in-house, in-vitro, or in-vivo test would otherwise determine?
    - What setup hours, measurement uncertainty, and repeatability do customer-approved pilots require across different chip families?
    - What sample-security, supplier-quality, calibration, and report limitations must be in place before device teams share unreleased hardware?
operatingAssumptions:
  - assumption: "At least two beachhead buyers will pay $15K or more for an independent campaign rather than use their own lab, a chip vendor, or a bundled design/test provider."
    basis: research.yaml
    validationTest: "Present three fixed-scope proposals to qualified buyers and obtain signed purchase orders or deposits; record the budget owner, procurement time, and rejected alternatives."
    decisionImpact: "If no buyers pay, do not build a standalone lab; test a partner-delivered service or stop the concept."
  - assumption: "Customer-approved RC/load and duty-cycle replay can inform a board decision even though it cannot establish tissue response or clinical behavior."
    basis: idea.yaml
    validationTest: "Run blinded repeated measurements on three candidate front ends and two customer-approved profiles, then compare the report with the buyer's documented selection rationale."
    decisionImpact: "If results do not change or support a real choice, reposition only if buyers pay for descriptive characterization; otherwise stop."
  - assumption: "Common fixture modules can reduce custom setup enough to support a 70% gross-margin goal on repeat campaigns."
    basis: operator judgment
    validationTest: "Track engineer hours, calibration, consumables, shipping, and instrument time for each pilot; require direct repeat-delivery costs to fall to 30% or less of realized fees by campaign three."
    decisionImpact: "If the cost gate fails, keep work as explicitly priced consulting or partner with an established lab; do not invest in a licensing product."
  - assumption: "A manually verified UK/EU account list can support five early paying accounts and future repeat work."
    basis: research.yaml
    validationTest: "Build an account census and interview at least 15 systems or ASIC leads about active programs, decision dates, in-house capability, and annual external-test occasions."
    decisionImpact: "If fewer than 20 active eligible programs or no recurring decision windows are confirmed, reduce hiring and treat this as a small specialist service, not a venture-scale platform."
  - assumption: "Prospective buyers will permit third-party handling of unreleased chips and accept a bounded engineering report under proportionate supplier controls."
    basis: research.yaml
    validationTest: "Have quality, legal, and engineering owners at three prospects review a sample protocol, chain-of-custody, calibration record, data policy, and claims disclaimer before pilot contracting."
    decisionImpact: "If sample sharing or supplier qualification blocks external work, explore an on-site or customer-operated fixture only after confirming willingness to pay; do not claim compliance testing."
  - assumption: "A $1M–$2M pre-seed planning band can fund 18 months of lean validation without committing to silicon design, clinical testing, or a full-scale laboratory."
    basis: operator judgment
    validationTest: "Before closing, reconcile the band against equipment and calibration quotes, facility needs, founder compensation, hiring gates, and the financial model's runway case."
    decisionImpact: "If the verified cost exceeds the band, stage equipment purchases and hiring against deposits or revise the round before expanding scope."
experimentRoadmap:
  - horizon: 0–90 days
    experiment: "Interview 15 systems/ASIC leads and request the last front-end test plan, decision record, mismatch, internal spend, and purchasing route."
    hypothesis: "A subset has a near-term architecture decision and a costly evidence gap that is not adequately covered by existing internal or vendor tests."
    successMetric: "At least five interviews verify an active decision inside 12 months and at least three request a scoped proposal with a named budget owner."
    owner: "Commercial founder / CEO"
  - horizon: 0–90 days
    experiment: "Draft a supported-profile protocol, sample report, confidentiality terms, and calibration/measurement-uncertainty plan; review them with prospective buyers and an independent lab."
    hypothesis: "Buyers will accept a bounded engineering report and manageable supplier controls without confusing it with clinical or regulatory evidence."
    successMetric: "Three prospect quality or engineering owners accept the scope in principle and identify no blocking sample-security or report requirement."
    owner: "Technical founder"
  - horizon: 3–6 months
    experiment: "Offer three fixed-scope paid pilots using customer-provided candidates and load recipes before buying beyond minimum bench equipment."
    hypothesis: "A defined board decision and neutral same-protocol comparison can command a paid fee."
    successMetric: "At least two signed purchase orders or deposits at $15K or more; record proposal-to-order time and the budget source."
    owner: "Commercial founder / CEO"
  - horizon: 3–6 months
    experiment: "Run blinded repeatability tests across three candidate front ends and two customer-approved RC/load profiles."
    hypothesis: "The fixture can produce comparable, decision-relevant measurements within acceptance limits agreed before testing."
    successMetric: "All supported cases meet customer-agreed repeatability criteria; report uncertainty, setup hours, and whether the buyer's selection rationale changes."
    owner: "Technical founder"
  - horizon: 6–12 months
    experiment: "Deliver the first campaigns under a controlled sample-custody, calibration, data-retention, and protocol-version process."
    hypothesis: "A lean specialist service can satisfy customer supplier controls without presenting itself as a certified or clinical test lab."
    successMetric: "Complete three campaigns with no custody or confidentiality breach and obtain written quality-owner acceptance of the report limits."
    owner: "Test and quality engineer"
  - horizon: 9–18 months
    experiment: "Offer a repeat campaign or calibration plan to each pilot customer and compare recurring fixture requirements."
    hypothesis: "Customers face repeat test occasions and at least some profiles recur enough to support reusable modules."
    successMetric: "At least two of the first three paid customers place or formally budget a second campaign; by campaign three, direct delivery cost is at or below 30% of realized fees."
    owner: "Commercial founder / CEO"
  - horizon: 12–18 months
    experiment: "Prototype one configurable fixture module from profiles repeated in paid work; do not launch a general-purpose instrument."
    hypothesis: "A specific recurring customer profile can be standardized without removing the customer-specific decision value."
    successMetric: "Two customers use the same module with documented setup-hour reduction and customer-approved calibration criteria."
    owner: "Technical founder"
operations:
  - Use fixed-scope intake to document device context, candidate parts, customer-approved loads, waveforms, metrics, acceptance limits, and excluded claims before sample receipt.
  - Maintain calibration traceability, protocol version control, measurement uncertainty, secure access, segregated customer data, sample chain-of-custody, and return or disposal records.
  - Use an independent calibration or university engineering facility for method review where useful; do not imply formal certification or substitute exploratory bench work for required device verification.
  - Require written customer permission before retaining or aggregating any recipe or result; default to customer ownership and no cross-customer pooling.
  - Screen cross-border sample logistics, insurance, customs, and applicable export controls before accepting prototype hardware.
team:
  - role: Technical founder, analog and systems engineering
    startTiming: Month 0
    rationale: Own the bounded test envelope, fixture design, measurement integrity, customer scoping, and repeatability evidence; this capability is required before any external campaign.
  - role: Commercial founder / CEO
    startTiming: Month 0
    rationale: Verify the small buyer universe, reach CTO/VP Engineering budget owners, secure paid pilot scopes, and prevent equipment or geographic expansion ahead of evidence.
  - role: Test and quality engineer
    startTiming: Month 6–9, gated on two paid pilots
    rationale: Establish controlled protocols, calibration and custody records, and campaign delivery metrics only after customer demand justifies dedicated capacity.
milestones:
  - horizon: 0–12 months
    items:
      - "Complete 15 qualified buyer interviews and verify active decision dates, budget owners, and current alternatives."
      - "Secure at least two paid pilot orders at $15K or more by month 6 before material equipment expansion."
      - "Complete blinded testing across three front ends and two supported load profiles against pre-agreed acceptance criteria."
      - "Deliver three campaigns with controlled calibration, confidentiality, and sample-custody records; document decision impact and direct delivery cost."
  - horizon: 12–24 months
    items:
      - "Reach five cumulative paying accounts, the researched SOM scenario, only if the UK/EU account census and actual buyer timing support it."
      - "Obtain repeat paid work or a budgeted second campaign from at least two of the first three pilots."
      - "Reduce direct repeat-campaign delivery costs to 30% or less of realized fees and standardize only profiles observed in paid work."
      - "Release a customer-reviewed supplier and test-method packet that clearly separates engineering evidence from certification and clinical claims."
  - horizon: 24–36 months
    items:
      - "License and calibrate a bench module only if at least five accounts and repeat profile demand are demonstrated."
      - "Test one adjacent neural sensing or stimulation profile only after the initial beachhead meets repeat-purchase and delivery-cost gates."
      - "Reassess venture-scale financing against verified account count, annual campaign frequency, realized pricing, and licensed revenue; do not use broad BCI market forecasts as a proxy."
risks:
  - risk: "No independent-test willingness to pay; buyers use in-house measurements, vendor support, or bundled design work."
    likelihood: High
    impact: High
    mitigation: "Secure paid purchase orders before specialized equipment spend; interview on past decisions and actual budgets, not stated interest; stop or partner if pilot orders fail."
  - risk: "The eligible buyer pool and annual campaign frequency are too small for a venture-scale company."
    likelihood: High
    impact: High
    mitigation: "Manually verify active UK/EU hardware programs and decision windows; treat the $2.5M TAM and $0.5M SAM as scenarios, and require repeat demand before widening scope."
  - risk: "Customer-specific geometries, loads, and waveforms make setup too bespoke to achieve repeatable economics."
    likelihood: High
    impact: High
    mitigation: "Bound the supported envelope, log labor by task, price or decline out-of-scope requests, and gate fixture modules on observed reuse and direct cost."
  - risk: "Electrical emulation fails to predict the tissue or electrode behavior that actually drives a design decision."
    likelihood: Medium
    impact: High
    mitigation: "Agree the electrical limits with the buyer, compare report findings with the actual selection rationale, and never claim tissue, chronic, safety, or clinical equivalence."
  - risk: "ASIC firms, chip vendors, internal labs, or medical-device test labs bundle an adequate substitute."
    likelihood: High
    impact: High
    mitigation: "Win only where the buyer needs an independent cross-candidate protocol; measure preference versus alternatives and pursue referral partnerships without compromising neutrality."
  - risk: "Prototype security, supplier controls, or regulatory interpretation blocks sample access or use of reports."
    likelihood: Medium
    impact: High
    mitigation: "Use segregated data, documented custody, calibration and version records, customer-approved report limits, and quality/legal review; scope out formal certification."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$1M–$2M provisional planning band"
  runwayMonths: 18
  useOfFundsSummary: "An 18-month pre-seed plan to build only the minimum calibrated load-replay bench, deliver paid pilots, validate repeatability and buyer willingness to pay, establish secure sample and quality processes, and fund a lean founder-led team with a test/quality hire gated on two paid pilots; it excludes chip fabrication, clinical testing, and broad lab or market expansion. The dollar band is operator judgment and must be reconciled to supplier quotes and the financial model."
