slug: physics-change-test-gate
date: 2026-10-13
executiveSummary: >-
  Build a solver-adjacent thermal regression gate that turns approved PCB and enclosure thermal cases into
  revision-linked pass-or-hold evidence before a prototype decision. The beachhead is power-electronics teams
  making recurring thermal design changes, already using a trusted solver, and bottlenecked by specialist-run
  setup. Ansys and Siemens document repeated setup and revision-analysis work, but the reviewed evidence does not
  show demand or willingness to pay for a separate release gate. The initial product will reuse the customer's
  solver and licensed compute, run in shadow mode, and fail closed to a broader run or human review whenever a
  geometry change cannot be mapped confidently. The defensible hypothesis is an auditable test-pack and approval
  workflow, not a faster solver; incumbents already automate substantial portions and could bundle the missing
  workflow. Market sizing is an operator scenario of $300M TAM, $45M initial-stack SAM, and $1.8M obtainable
  ARR, not measured market revenue, while buyer count, price, false-negative tolerance, and paid demand remain
  unvalidated. A pre-seed plan should fund one stack, historical-revision validation, and paid design partners
  before hiring to broaden coverage. The investment stance is Watch until a customer permits shadow validation,
  signs a paid pilot, and confirms a repeatable budget and onboarding path.
problem:
  - "Thermal PCB and enclosure analyses require specialist setup of geometry, materials, boundary conditions, meshing, and solver runs; vendors document automation needs, but not the economic cost per revision."
  - "Because simulation is not repeated routinely at every design change, a thermal-margin regression may not be identified until a later review or prototype; the incidence and cost of such escapes are unquantified."
  - "Existing solver output and manual revision comparisons do not necessarily provide an approved, versioned record of which cases were checked and why a design passed or was held."
solution:
  - "Store a versioned thermal test pack for one hardware program: approved geometry cases, materials, cooling and load boundary conditions, solver provenance, and engineer-approved temperature limits."
  - "Compare each submitted CAD revision with the pack, select affected cases, and run them through the customer's licensed solver; when mapping confidence is low, require a broader run or specialist review rather than silently skipping a case."
  - "Return margin deltas and an auditable pass-or-hold record for design review; the record supports engineering review and does not replace physical testing or product-safety certification."
whyWeWin:
  - "The product makes the decision artifact and reusable approved test pack the unit of value, rather than selling another solver or an alerts dashboard."
  - "A conservative, inspectable change-to-test map with fail-closed escalation could make repeated checks more usable without asking customers to replace trusted solvers; the selection logic and buyer preference are unproven."
  - "Customer-specific validated cases, revision mappings, and design-review history could create switching costs over time, but proprietary data may not be pooled and no durable moat is established."
strategicChoices:
  beachhead: "Power-electronics teams repeatedly revising one thermally constrained PCB or enclosure design, with an existing thermal solver and a named simulation engineer who is a bottleneck for design reviews."
  wedgeRationale: "A single thermal change gate has a clear trigger, owner, and evidence artifact. Shadow replay against historical revisions can test selection safety and decision-time benefit faster than building a general simulation platform, while using the customer's solver avoids competing on solver accuracy or replacing installed licenses."
  sequencingRationale: "First qualify one common CAD-to-solver workflow and run customer-approved cases in shadow mode; then prove change selection against full-solver baselines and customer limits; only after technical and buyer sign-off turn on review gating, convert paid pilots, and standardize onboarding. Keep founder-led selling and a small engineering team until repeatable onboarding and subscription conversion justify sales hiring; use consultants or labs for case validation rather than expanding the physics roadmap."
  notYet:
    - "Do not support multiple CAD and solver stacks before one end-to-end connector, licensed execution path, and validated test pack are repeatable."
    - "Defer vibration, electromagnetics, vehicles, aircraft, satellites, and broad multiphysics until paying customers demonstrate pull and validated cases exist."
    - "Do not replace the solver, claim regulatory certification, remove required prototype tests, or automatically block releases before the customer approves the validation envelope."
    - "Defer defense and controlled-technology programs and cross-border cloud execution until export-control, data access, and security requirements are qualified."
market:
  tam: "$300M/year illustrative scenario: 10,000 global programs at $30,000 per program-year; both counts and price are operator assumptions, not measured market revenue."
  sam: "$45M/year illustrative scenario: 1,500 North American and European programs assumed compatible with one CAD/solver workflow at $30,000 per program-year; the compatibility filter is unvalidated."
  som: "$1.8M annual recurring revenue in a five-year reachability scenario: 60 contracts at $30,000 per year; not a forecast and dependent on proven demand, repeat use, and integration."
  segments:
    - "Primary: power-electronics hardware teams with recurring, thermally constrained PCB or enclosure revisions and an existing solver workflow."
    - "Secondary: simulation leads maintaining reusable thermal cases across related product programs; expand only after the primary use case is repeatable."
  buyingProcess: >-
    A thermal-design engineer or simulation lead identifies an approaching design review or prototype release;
    the VP of Engineering or director of hardware design is the likely economic buyer, with simulation,
    security/IT, and product-assurance stakeholders reviewing solver access and evidence boundaries. The source
    research found no buyer-side contract, procurement path, or direct price evidence, so paid-pilot approval and
    buying-cycle duration must be established in discovery.
product:
  mvp: >-
    Deliver a customer-controlled runner for one selected CAD/solver combination, a versioned thermal test pack,
    revision comparison, affected-case execution through the customer's licensed solver, and provenance-rich
    margin/pass-or-hold output. Start in shadow mode with human approval and full-run escalation for uncertain
    mappings; select the supported stack only after target-customer qualification.
  sixMonth: "Complete at least one end-to-end connector and one customer test pack; replay at least 100 historical revisions against trusted full-solver baselines and seek one paid design-partner pilot. These are operating targets, not current traction."
  twelveMonth: "With customer sign-off on the validation envelope, support a review-ready shadow or limited blocking workflow for the first stack; demonstrate repeat use, paid-pilot conversion, and measured setup and maintenance effort before adding a second connector."
  twentyFourMonth: "Standardize packs and onboarding across additional programs on the validated stack; add a second CAD/solver connection only if qualified accounts require it, and consider a new physics domain only after a paying customer provides approved cases and acceptance limits."
  keyBets:
    - "At least one target team will allow a change-aware shadow test to be compared with complete, trusted solver runs."
    - "The selector can avoid missed customer-designated critical regressions while reducing unnecessary full runs or time to an auditable decision."
    - "An engineering director will fund a program-level workflow separately from existing solver licenses and internal engineering time."
    - "A customer-controlled execution model can satisfy solver-license, IP, security, and export-screening constraints without making onboarding uneconomic."
gtm:
  wedge: "Founder-led, engineer-to-engineer paid pilot around a scheduled thermal design review or prototype release: map one approved case pack, replay historical changes in shadow mode, and show the design authority traceable margin deltas before asking to gate a live revision."
  channels:
    - "Direct technical sales to thermal simulation leads and hardware engineering directors at teams with recurring PCB/enclosure revisions and licensed solvers."
    - "Introductions and implementation referrals from thermal CAE consultants, specialist distributors, and solver integrators; no channel relationship is assumed to exist."
    - "Consider vendor integrations only after one stack is proven; solver/CAD vendors are both potential partners and competitors."
  funnelTargets: "Planning target for the first 90 days, not a measured conversion rate: interview 10 qualified teams, secure 3 scoped shadow-pilot candidates, and obtain at least 1 paid design-partner commitment or a documented procurement path."
  pricing: "Test an annual subscription per hardware program and solver connection, with usage tiers for automated runs and a paid initial test-pack setup. Use $15,000–$30,000 per program-year as a pricing hypothesis informed by the research sizing scenario and sensitivity case, not verified willingness to pay; quote a fixed-scope paid pilot and convert only after pack validation and repeat usage."
businessModel:
  revenueStreams:
    - "Annual software subscription per hardware program and supported solver connection."
    - "Usage tier for higher volumes of automated regression runs."
    - "Paid initial test-pack setup and validation; reduce its share of delivery only when measured onboarding is repeatable."
  unitOfValue: "One hardware program's approved thermal test pack and revision checks through one solver connection; usage is eligible CAD revisions checked and solver runs executed."
  targetGrossMarginPct: 70
  expansionLevers:
    - "Add further product programs and revision volume within a validated customer account."
    - "Add a CAD/solver connection only when customer demand and account qualification justify the integration cost."
    - "Add vibration or electromagnetics only after a paying customer supplies validated cases, limits, and a repeatable acceptance workflow."
    - "Use consultant or solver-integrator referrals to lower founder-led acquisition effort after paid conversions are repeatable."
strategyMap:
  northStarMetric: "Share of eligible thermal CAD revisions receiving a customer-approved, auditable pass-or-hold result before design review, with median time from revision submission to result tracked alongside it."
  inputMetrics:
    - "Historical revisions replayed against full-solver baselines and count of missed customer-designated critical regressions."
    - "Share of changed revisions safely selected, escalated to full runs, or sent to specialist review."
    - "Median revision-to-result time and percentage of eligible revisions checked before review."
    - "Engineering hours to configure and maintain each test pack."
    - "Paid pilot starts, conversion to annual program subscriptions, and repeat monthly usage."
  moatsToBuild:
    - "Customer-approved, versioned thermal cases, boundary conditions, limits, and traceable review decisions."
    - "A measured history of change-to-test mappings and escalation behavior benchmarked against full solver runs and, where available, correlated measurements."
    - "A trusted evidence workflow embedded in customer design reviews and portable across validated solver connections."
  killCriteria:
    - "Do not enable selective blocking if a 100-revision shadow replay misses any customer-designated critical thermal regression; if the miss persists after one remediation, stop the selective-gate thesis and test full-run provenance only."
    - "Rework or stop the selective-rerun wedge if more than 50% of eligible revisions require full-run escalation and median time to decision does not improve by at least 30% in a pilot."
    - "Reprice or narrow the service model if any of the first three test packs needs more than 80 engineering hours to configure or more than 8 hours per month to maintain after initial validation."
    - "Reassess venture viability if ten qualified interviews and three scoped pilot offers produce no paid commitment or credible procurement path at an annualized value of at least $15,000 per program."
  mermaid: |
    flowchart LR
      Wedge["Thermal PCB/enclosure revisions"] --> MVP["Single-stack approved test pack"]
      MVP --> Proof["Shadow replay and paid-pilot evidence"]
      Proof --> Expansion["More programs on validated stack"]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "Low-to-moderate: the revision-gate mechanism is specific, but willingness to pay, selector trust, and obtainable market are not validated."
    whyBelieve: "Ansys and Siemens describe specialist setup and repeated PCB analysis, while the proposed product packages approved cases and revision-specific solver provenance into a distinct review decision."
    whyDoubt: "No customer interview, signed pilot, buyer-side price, or false-negative tolerance exists in the evidence, and incumbents already automate analysis while the $45M SAM and $1.8M SOM are assumptions."
    nextDiligence: "Compare at least 100 historical revisions with full-solver baselines for one qualified customer, obtain explicit sign-off on the miss/escalation threshold, and secure a paid pilot with a stated annual conversion path."
  firstCustomer:
    title: "Power-electronics thermal-design team with recurring PCB/enclosure revisions"
    profile: "A hardware manufacturer with a named simulation engineer, an existing thermal solver, and repeated changes to one thermally constrained program; company size and program count are not established by the research."
    trigger: "A design review or prototype release is approaching and the team needs evidence that its latest geometry, component, load, or cooling change stayed within approved temperature limits."
    buyer: "VP of Engineering or director of hardware design"
    initialContract: "Planning hypothesis: a fixed-scope paid shadow pilot, with fee set through buyer discovery, converting to a $15,000–$30,000 annual subscription per program and solver connection after validation; the range is unverified willingness to pay."
  mustBeTrue:
    - "Of 10 qualified target-team interviews, at least 3 confirm a recurring revision-check gap and at least 1 buyer signs a paid pilot or documents a procurement path at an annualized program value of at least $15,000."
    - "On at least 100 customer-approved historical revisions, the selector misses zero customer-designated critical thermal regressions against full trusted solver baselines; uncertain mappings fail closed."
    - "A pilot avoids full runs on at least half of eligible revisions or improves median auditable decision time by at least 30%, without weakening the customer-approved validation or prototype-testing process."
    - "The first three test packs can each be configured in at most 80 engineering hours and maintained in at most 8 hours per month after validation."
    - "Account-by-account qualification supports at least 1,500 compatible North American and European programs, and at least two paid pilots convert to annual subscriptions at $15,000 or more per program-year."
  diligenceQuestions:
    - "Which CAD/ECAD/MCAD and solver combination is shared by the first ten qualified buyers, and can the customer license and API terms support a repeatable runner?"
    - "What critical thermal regressions appear in historical revision data, and what false-negative and full-run escalation rates will the design authority accept before a result may block review?"
    - "Who controls incremental budget for the gate, what current specialist and prototype costs does it displace, and will that buyer pay separately from solver licenses?"
    - "Can three customer test packs be deployed and maintained below the stated engineering-hour thresholds, or is each implementation effectively consulting?"
    - "Can a customer-hosted execution model pass IP, security, and export-control review while retaining usable solver provenance and customer data controls?"
    - "Do incumbent vendor tools already provide equivalent approved test packs and release gates in deployed customer workflows, even if their public materials do not describe them?"
operatingAssumptions:
  - assumption: "A simulation lead will permit shadow-mode selective test selection if uncertain changes trigger full runs and the product exposes its reasoning; no selective blocking will be enabled before customer approval."
    basis: "research.yaml"
    validationTest: "For one design partner, replay at least 100 historical revisions against trusted full-solver baselines, including geometry, material, load, and cooling changes; have the customer designate critical regressions and sign the acceptable miss and escalation policy."
    decisionImpact: "If selective mapping is not trusted or misses remain, sell full-run provenance and gate administration only or stop; the time-saving and novelty thesis materially weakens."
  - assumption: "At least one CAD/solver combination is common enough in the beachhead to support repeatable onboarding and customer-controlled solver execution."
    basis: "research.yaml"
    validationTest: "Interview 10 qualified teams, record their stack and license/API constraints, and build a customer-qualified account list before selecting the first connector."
    decisionImpact: "If no stack clusters, choose one design partner's stack and narrow the market and funding plan rather than promise broad interoperability."
  - assumption: "Target buyers will test $15,000–$30,000 annual program pricing and a paid pilot, even though no direct willingness-to-pay evidence exists."
    basis: "research.yaml"
    validationTest: "Present a scoped paid-pilot offer and annual conversion price to at least 3 qualified buyers; require one signed paid commitment or a documented procurement path and stated budget owner."
    decisionImpact: "If buyers will not pay separately from solver seats or services, narrow to a services-led product, change the buyer/value metric, or stop before scaling."
  - assumption: "Initial customer packs can become repeatable software deployments rather than open-ended thermal consulting."
    basis: "operator judgment"
    validationTest: "Measure configuration hours, expert review, and monthly maintenance across the first 3 packs; compare against the 80-hour setup and 8-hour monthly-maintenance thresholds."
    decisionImpact: "If thresholds are exceeded, narrow to a more uniform design archetype, charge for services, and delay margin and sales-hiring targets."
  - assumption: "An 18-month pre-seed plan with a $2–4M target band is sufficient to build one secure integration, validate test packs, and obtain early paid conversions; no costed operating model is present in the source files."
    basis: "operator judgment"
    validationTest: "Before fundraising, bottom-up the hiring, solver/license, customer-hosted infrastructure, security-review, and pilot-support costs against an 18-month milestone plan."
    decisionImpact: "If the validated plan requires more capital or more time, reduce scope or reset the round and milestones; do not represent the target band as a researched funding requirement."
experimentRoadmap:
  - horizon: "0–90 days"
    experiment: "Interview 10 qualified power-electronics thermal and simulation teams; document revision frequency, current review workflow, named buyer, stack, and procurement route."
    hypothesis: "The specific revision-check gap recurs often enough to have an incremental budget owner."
    successMetric: "At least 3 teams confirm the gap and at least 1 buyer provides a paid-pilot commitment or documented procurement path."
    owner: "CEO/founder"
  - horizon: "0–90 days"
    experiment: "Build a stack-qualified account and integration map from interviews, including licensed solver requirements, CAD revision access, and customer-hosted execution constraints."
    hypothesis: "One supported CAD-to-solver path serves multiple qualified beachhead accounts without unsupported license assumptions."
    successMetric: "One connector selected with at least 3 qualified prospects on the stack and a documented licensed execution path."
    owner: "Founding eng"
  - horizon: "0–90 days"
    experiment: "Run a shadow selector replay on at least 100 historical CAD revisions, comparing chosen cases and outputs with complete trusted solver baselines."
    hypothesis: "Change-aware selection can avoid missed critical regressions while reducing unnecessary reruns or decision time."
    successMetric: "Zero missed customer-designated critical regressions; quantify escalation share and obtain customer sign-off on the validation envelope before any blocking gate."
    owner: "Founding thermal simulation engineer"
  - horizon: "3–6 months"
    experiment: "Deploy a customer-controlled runner that records CAD revision, inputs, solver version, boundary conditions, result, and reviewer decision."
    hypothesis: "A traceable runner can use existing customer solver licenses and pass the target customer's security and IP review."
    successMetric: "Reproduce an approved baseline end-to-end, retain auditable provenance, and receive written technical/security acceptance from one design partner."
    owner: "Founding eng"
  - horizon: "3–6 months"
    experiment: "Offer a fixed-scope paid shadow pilot with an annual per-program conversion proposal to qualified buyers."
    hypothesis: "A hardware engineering buyer will fund the workflow separately from solver licenses when it is tied to an imminent design review."
    successMetric: "At least 1 signed paid pilot or documented procurement path, with an identified budget owner and annual conversion price."
    owner: "CEO/founder"
  - horizon: "6–12 months"
    experiment: "Track eligible revisions, full-run escalations, time-to-result, design-review use, and customer prototype-test boundaries through pilot operation."
    hypothesis: "The evidence artifact reaches review before the trigger and improves decision latency without being treated as certification."
    successMetric: "At least half of eligible revisions avoid full runs or median result time improves 30%; design authority accepts the evidence boundary."
    owner: "Solutions engineer"
  - horizon: "6–12 months"
    experiment: "Standardize the first three test-pack deployments and log setup and maintenance effort by reusable versus customer-specific work."
    hypothesis: "Onboarding and upkeep can be brought below the service-heavy thresholds needed for recurring software economics."
    successMetric: "Each pack requires at most 80 configuration hours and at most 8 maintenance hours per month after validation, or scope/pricing is reset."
    owner: "Founding thermal simulation engineer"
  - horizon: "12–18 months"
    experiment: "Test a referral motion with one thermal CAE consultant, distributor, or solver integrator after at least one customer-approved result and paid pilot."
    hypothesis: "A trusted implementation partner can introduce qualified teams without diluting technical validation or increasing dependence on a vendor."
    successMetric: "At least 2 qualified introductions and 1 scoped pilot opportunity; otherwise keep direct selling as the primary channel."
    owner: "CEO/founder"
operations:
  - "Run solver jobs through a customer-controlled or on-prem runner using the customer's licensed software; verify vendor license, API, and version terms before each deployment."
  - "Version geometry, material and boundary-condition inputs, approved limits, solver versions, selection rationale, and reviewer overrides in an auditable case history."
  - "Require qualified thermal-engineering review and comparison to trusted baselines; fail closed to a full run or human review when the mapping is uncertain."
  - "Use a thermal consultant or qualified lab for initial case validation and measurement correlation where the customer requires it; do not present the software as a certification body."
  - "Screen customer data access and export-control constraints before execution; limit access and retention to customer-approved controls and defer restricted programs until qualified."
team:
  - role: "Founding eng"
    startTiming: "Month 0"
    rationale: "Build CAD revision ingestion, change comparison, licensed solver orchestration, customer-controlled execution, provenance, and auditability for one qualified stack."
  - role: "Founding thermal simulation engineer"
    startTiming: "Month 0"
    rationale: "Define pack schema and safe escalation, reproduce customer baselines, validate selection against full runs, and work with design authorities on limits and evidence boundaries."
  - role: "Solutions engineer"
    startTiming: "Month 3–6, after a design partner and stack are selected"
    rationale: "Configure and support the first packs while measuring onboarding and maintenance effort; this role should expose, not conceal, services burden."
  - role: "Commercial lead"
    startTiming: "Month 9–12, only after a paid pilot and repeatable buyer path"
    rationale: "Convert validated pilots and develop consultant/integrator referrals; retain founder-led sales if buying process or pricing remains unproven."
milestones:
  - horizon: "0–12 months"
    items:
      - "By day 90, complete 10 qualified buyer/user interviews, choose one stack only if supported by account evidence, and secure a paid-pilot commitment or documented procurement path."
      - "By month 6, run at least 100 historical revisions through a shadow selector against full trusted baselines and obtain customer approval of the validation envelope."
      - "By month 6, demonstrate one customer-controlled end-to-end runner with solver provenance, fail-closed escalation, and security/license review."
      - "By month 12, show a repeat-use pilot, a named budget owner, a conversion proposal, and measured decision-time, escalation, and pack-maintenance results."
  - horizon: "12–24 months"
    items:
      - "Convert at least 2 paid pilots to annual program subscriptions at or above the tested $15,000 annualized lower bound, or revisit the buyer and pricing thesis."
      - "Deploy the first three packs and meet the stated configuration and monthly-maintenance thresholds before scaling implementation or sales hiring."
      - "Add a second CAD/solver connection only after qualified demand from multiple target accounts and a reviewed license/security path."
      - "Secure partner-originated pilot opportunities only after direct pilots establish evidence and referenceable workflow value."
  - horizon: "24–36 months"
    items:
      - "Expand within validated customer programs and the first supported stack while tracking repeat-use and annual conversion economics."
      - "Add a second physics domain only with a paying customer's approved cases, acceptance limits, and a validation plan; otherwise continue thermal-only."
      - "Reassess addressable market from a qualified account list before scaling headcount or entering broader electronics, automotive, aerospace, or controlled-technology markets."
risks:
  - risk: "A geometry-to-test selector omits a physics-relevant change and a regression passes unnoticed, destroying engineering trust."
    likelihood: "High"
    impact: "High"
    mitigation: "Operate in shadow mode first, compare at least 100 revisions with full trusted runs, expose selection rationale, fail closed on uncertainty, and require customer approval before blocking a review."
  - risk: "Customer-specific geometry, materials, boundary conditions, or review policy make each pack a bespoke consulting engagement."
    likelihood: "High"
    impact: "High"
    mitigation: "Support one stack and design archetype, charge for initial setup, measure hours across three packs, and narrow or reprice if setup exceeds 80 hours or maintenance exceeds 8 hours per month."
  - risk: "Ansys, Siemens, Cadence, or a well-funded physics platform bundles versioned test packs and release gating into an installed workflow."
    likelihood: "High"
    impact: "High"
    mitigation: "Prove the customer-approved evidence and safe cross-revision mapping, preserve portability where technically and contractually feasible, and avoid claiming public materials prove the feature is absent from deployments."
  - risk: "No separate budget exists because buyers prefer existing solver seats, internal scripts, consultants, full reruns, or physical tests."
    likelihood: "High"
    impact: "High"
    mitigation: "Require paid-pilot evidence and a named budget owner before expanding; quantify current engineering and prototype workflow in customer discovery and stop if the $15,000 annualized floor is rejected."
  - risk: "IP, export-control, security, or solver-license restrictions block cloud processing or make deployment and procurement uneconomic."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Begin with customer-controlled execution, qualify license/API rights and data controls before onboarding, and defer restricted or cross-border programs until reviewed."
  - risk: "A simulation pass is mistaken for certification or as a reason to remove required physical testing."
    likelihood: "Medium"
    impact: "High"
    mitigation: "Define an explicit applicability and validation envelope, preserve assumptions and uncertainty, keep physical correlation and certification independent, and require product-assurance review."
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "Planning target, not a source-derived cost estimate: 18 months to build and validate one customer-controlled CAD/solver path, replay historical revisions, support a small number of paid design partners, prove pack onboarding and annual conversion, and cover foundational thermal, software, security, and pilot-support work. Reconcile the band against a bottom-up hiring and deployment budget before fundraising."
