championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: "产品的独特单元不只是更快地运行求解器：它把已批准的热工况和限制绑定到特定 CAD 版本，选出受影响的测试，并输出可供审查的溯源记录和门禁结论。已抓取的现有厂商页面介绍了自动化、批量分析、参数化研究以及对更新设计重新运行仿真，但没有一页明确描述这套完整的物理测试编译器工作流。"
      sourceRefs:
        - 4
        - 7
        - 8
        - 9
        - 10
        - 20
    - point: "现有厂商文档证实，反复进行 PCB 热分析离不开重复设置和验证。若工程师认可测试选择逻辑，把可信工况封装成版本化测试，就可能形成一层真正不同的工作流。"
      sourceRefs:
        - 4
        - 7
        - 13
  evidenceAgainst:
    - point: "这些技术要素本身并不新鲜：Ansys 支持用 Python 自动完成手动 PCB 设置和求解器执行；Siemens 推广针对多个 PCB 版本的自动化和批量报告；SimScale 已展示修改 CAD 后重新运行热分析。因此，差异在于发布门禁和测试包抽象，而不在自动化或持续仿真本身。"
      sourceRefs:
        - 4
        - 7
        - 9
        - 10
        - 21
    - point: "强大的现有厂商套件已经把电子设计输入与热求解器整合起来，Cadence 也将求解器嵌入 Allegro 工作流。产品页面没有描述发布门禁，并不能证明商业部署中没有这项功能，也不能证明现有产品无法添加它。"
      sourceRefs:
        - 8
        - 20
        - 21
    - point: "灵感来源公司 Vinci 称，其物理平台已用于生产工程项目；独立报道则称其目标是把试点从两个扩展到二十个，且其速度和精度说法尚未经过独立验证。工作流缺口和市场拉力都比求解器机会本身更缺乏证据。"
      sourceRefs:
        - 1
        - 3
        - 19
  revisedClaim: "最站得住脚的创新主张，是一款聚焦细分工作流的产品：把客户批准的热工况编译成与 CAD 版本绑定、带有求解器溯源信息的检查；几何变化无法安全映射时，默认不予放行。公开证据表明，这种基于成熟仿真和脚本能力的发布门禁包装可能并不常见；但尚不能证明它独特、买方有需求、选择性重跑值得信任，或它相较 Siemens、Ansys、Cadence 和新兴物理平台拥有持久护城河。"
reportMemo:
  executiveTakeaways:
    - "热分析是正在开展、且有人负责的工作：Ansys 介绍了耗时的 PCB 手动设置，Siemens 关注反复改版，TE Connectivity 招聘高级仿真工程师。这能证明工作流有摩擦，却不能证明团队专门为回归门禁留有预算。[4,7,11]"
    - "这套少见机制有一定可信度，但它能支撑的创新主张远窄于 5 分评分暗示的范围：审阅的厂商页面没有明确介绍带版本的已批准工况、感知变更的测试选择和放行凭证；现有产品却已能自动设置、批量运行、参数扫描和迭代。[4,7,8,9,20,21]"
    - "现有厂商优势显著。Ansys、Siemens 和 Cadence 拥有成熟热求解器及相邻自动化能力；资金充足的 Vinci 瞄准持续物理仿真，SimScale 则降低了云端热迭代的使用门槛。[1,3,8,19,20,23]"
    - "自下而上的滩头市场情景测算得出约 $300M TAM、$45M 初始技术栈 SAM，以及稳态 ARR $1.8M；但账户数和每项目每年 $30,000 的价值都是经营者假设，并非实测市场规模或付费意愿数据。"
    - "最大采用障碍是信任：未被选中的热工况可能藏着回归问题，而仿真可信度取决于经过验证的模型、量化的不确定性以及与实测结果的相关性。门禁必须补充原型测试和产品认证，不能取而代之。[4,13,16]"
    - "如果客户不允许变更检测器挑选一部分求解器工况、每次修订仍需专家重建，或实测导入与验证成本超过持续软件价值，就应否定这个概念。[4,5,7,13]"
  marketDefinition: "目标品类是在现有热 CFD 或 FEA 求解器周围增加工作流和证据层。它保存已批准的 PCB/机箱工况、材料、负载、散热条件及工程师设定的限制，把 CAD 版本映射到受影响的工况，再用客户持证的求解器运行这些工况，最后记录可追溯的通过/暂缓结果，供设计评审使用。该品类不包括求解器许可证、通用 CAD、硬件测试、认证或宽泛的多物理场平台。初期市场包括热约束明显、持续迭代且 CAD/求解器技术栈稳定的电子设备和电力电子项目。"
  customerAndBuyer: "日常用户是支持电力电子团队、经常处理 PCB 或机箱改版的热设计或仿真工程师。仿真负责人维护可信工况并负责验证；硬件设计总监或工程副总裁很可能是经济买方，安全、IT、求解器管理员和产品保证团队则把守采购关口。TE Connectivity 招聘的高级仿真岗位明确负责方法、精度、评审、实验相关性和 PCB 可靠性，证实企业内部确有这一职能，但不能证明外部买方会采购独立的回归层。[11]"
  buyingTriggers:
    - point: "设计评审或原型放行临近，团队需要证据证明几何或元件变化没有侵蚀已批准的热裕量。"
      sourceRefs:
        - 4
        - 7
        - 11
    - point: "新电力电子平台或机箱需要反复评估布局变体、研究气流并检查元件热特性；已有求解器许可证和明确的仿真负责人时，首次集成门槛更低。"
      sourceRefs:
        - 4
        - 7
        - 8
    - point: "企业正统一热工程流程，或试图减少原型迭代；这类软件确有采购先例，但 HSE 的 CFD/FE 采购只是相邻的公共预算信号，并不能证明滩头市场买方有采购意愿。"
      sourceRefs:
        - 8
        - 17
  willingnessToPay:
    summary: "客户对版本化回归门禁的直接付费意愿尚未得到验证。现有付费求解器项目和仿真工程岗位说明品类内有预算；HSE 公告聚合网站还报告了一笔 £840,000 的 CFD/FE 软件、维护和支持采购。但这是一项覆盖广泛软件范围的多年期公共采购，既不是创业公司定价基准，也不是电力电子采购。Siemens 要求买家联系销售询价；已抓取的厂商页面也没有公布可比的逐项目回归定价。市场测算采用的年度项目价值应明确视为待验证假设。"
    sourceRefs:
      - 8
      - 11
      - 17
  competitiveLandscape: "最接近的竞争者包括 Ansys Icepak/SIwave 配合 PyAEDT 自动化、Siemens Simcenter Flotherm/XT、Cadence Celsius、Vinci 加速物理平台，以及 SimScale 云端热工作流。更直接的替代方案包括在现有求解器内写脚本、请仿真专家或咨询公司重跑并对比工况、每次改版都完整仿真，或依赖原型实测。公开资料显示，求解器自动化与厂商中立的逐版本审批凭证之间可能存在缺口；但没有全面审查所有功能或客户部署，无法证明现有厂商尚未填补这个缺口。"
  incumbentThesis:
    - incumbentClass: "Ansys 或其他现有厂商求解器加内部脚本"
      point: "Ansys 展示了手动导入 PCB、指定材料、设置边界条件和划分网格如何耗费工程师时间，也展示了使用 SIWave、Icepak 和 PyAEDT 的 Python 自动化。现有厂商可凭可信的物理模型、已有许可证和本地工作流知识胜出；但若脚本仍由少数专家维护、脆弱易坏，又与设计评审的放行流程脱节，求解器就未必能自然胜出。"
      sourceRefs:
        - 4
        - 5
        - 21
    - incumbentClass: "Siemens Simcenter Flotherm 和 Flotherm XT"
      point: "Flotherm 集成 ECAD/MCAD，支持元件库、校准、参数化分析和优化；Siemens 还单独推广脚本及标准化批量报告，用于反复分析 PCB 改版。这些能力可能已解决大部分痛点。剩余切口是可审计的已批准测试定义，以及把变更安全映射到测试的能力；已审阅的公开页面没有明确展示这些功能。"
      sourceRefs:
        - 7
        - 8
    - incumbentClass: "Cadence Celsius 与 EDA 集成求解器"
      point: "Celsius 为 PCB 和机箱设计提供电热协同仿真，并集成到 Allegro，减少 Cadence 用户在工具间传递数据的工作。Cadence 的分发优势和设计上下文都很强；只有当新层更易审计，或能跨求解器技术栈保留已批准检查时，这个机会才可信。"
      sourceRefs:
        - 20
    - incumbentClass: "云端求解器或加速物理平台"
      point: "SimScale 支持在浏览器中反复测试热设计变体，Vinci 则面向电子设备和更大型系统推广高分辨率、加速物理仿真。求解更快会降低减少排队的价值，但单凭更快计算或更方便的重跑，不能证明持续测试包和放行政策的价值。"
      sourceRefs:
        - 1
        - 2
        - 9
        - 10
        - 19
        - 23
    - incumbentClass: "顾问、手动工程及原型测试"
      point: "专家顾问和内部仿真工程师能配置、验证并解读特殊工况；UL 则介绍了相关 ICT 设备的正式测试和认证。人工评审比未经验证的自动化层更能处理信任和边界情况，代价是专家反复投入时间，且仍需实物测试。产品必须补强这套保障流程，而不能取代它。"
      sourceRefs:
        - 11
        - 13
        - 15
        - 16
  regulatoryLandscape: "热回归测试属于工程工作流，不能替代产品安全认证。UL 将 IEC 62368-1 描述为适用于 IT 和 AV 设备的危害导向安全标准，并提供测试与认证；NIST 的 CFD 指引指出，仿真可信度取决于物理建模、分析人员能力、验证与确认以及不确定性量化。若数据涉及受管制技术或跨境用户，BIS 出口合规指引中的风险评估、技术管控和视同出口管理也必须纳入考量。初版产品应保留求解器版本、假设、边界条件、验证证据、访问控制和审计历史；不能宣称仿真通过就等于监管批准。[13,14,16]"
  technologyLandscape: "求解器执行层在技术上可行：PyAEDT 通过 Python 提供 Icepak 及相关 AEDT 工具，但需要本地安装且持有许可证的 AEDT，也支持连接远程服务器；Siemens 和 Ansys 都介绍了脚本或批量自动化。CAD 自动化 APIs 也能处理文件和参数。真正难的不是启动仿真，而是在不同版本间稳健追踪特征，把几何和负载变化映射到所有受影响工况，并证明省略某次运行不会掩盖故障。映射可信度低时，安全默认项必须是完整重跑或升级给人工处理；之后还要将结果与测量值对照，并遵循专家批准的验证范围。[4,5,7,13,21,22]"
  distributionChannels:
    - point: "直接向热仿真负责人和硬件工程总监销售，客户团队需经常修改 PCB/机箱且已持有求解器许可证。"
      sourceRefs:
        - 4
        - 7
        - 11
    - point: "通过 CAE 顾问、专业经销商和求解器集成商转介并合作实施；FlowCAD 的 Cadence 渠道可见现有经销生态。"
      sourceRefs:
        - 15
        - 20
    - point: "后续可与 CAD/求解器厂商开发嵌入式集成或合作验证工作流，但这些厂商也可能成为竞争者，必须先确认 API 访问和许可证条款。"
      sourceRefs:
        - 5
        - 8
        - 21
        - 22
  partnershipEcosystem:
    - point: "Ansys/PyAnsys 和 Siemens 工程合作伙伴可协助验证首个求解器工作流，并确保集成符合许可证和厂商支持范围；这也会带来依赖合作伙伴的风险。"
      sourceRefs:
        - 5
        - 7
        - 8
        - 21
    - point: "热工程顾问或实验室可帮助建立首批经过验证的测试包，并将结果与原型实测对照；产品仍应是可追溯的工作流工具，而不是认证机构。"
      sourceRefs:
        - 13
        - 15
        - 16
    - point: "电子设计和 CAD 平台合作伙伴可能开放版本元数据和设计上下文，但在宣称互操作之前，产品应先支持一个范围明确的技术栈。"
      sourceRefs:
        - 20
        - 21
        - 22
  dataMoats:
    - point: "客户专属的已批准边界条件、材料假设、验证过的热工况、阈值及版本到测试映射库，可能形成转换成本并缩短导入时间。这只是经营者假设，并非已经证明的跨客户数据护城河；专有设计和客户保密要求也可能阻止数据汇集。"
      sourceRefs:
        - 4
        - 13
        - 19
    - point: "最有防御力的证据资产应是经过验证的映射和升级处理记录，明确哪些几何变化影响了哪些热输出，并用完整求解器基准和原型数据测量漏报率。公开资料并未证明这类数据集目前已经存在。"
      sourceRefs:
        - 5
        - 13
        - 21
  geographicConsiderations:
    - point: "先做美国（US）市场可利用 Census 企业数据和 BIS 出口管制指引，但现有 CBP 数据描述的是行业企业机构，不是运行热检查的团队，不能直接换算成客户账户数。"
      sourceRefs:
        - 12
        - 14
    - point: "欧洲和英国（UK）可能成为后续市场，因为当地电子和工业工程团队使用同类供应商的求解器；但采购要求、数据存放预期和本地安全制度都需单独确认。HSE 公告只是英国（UK）软件预算的相邻信号。"
      sourceRefs:
        - 16
        - 17
    - point: "跨境国防或受管制技术项目的摩擦高于普通商业电力电子项目；提供云端执行前应先筛查数据分类和访问权限。"
      sourceRefs:
        - 14
  sensitivityCases:
    - case: "全球只有 5,000 个项目符合定义，且每个项目的年度价值为 $15,000。"
      impact: "情景 TAM 降至 $75M；初始技术栈占比按 15% 计算，SAM 为 $11.25M；按该价值赢得 60 个项目可带来 $0.9M 年收入。"
      sourceRefs:
        - 8
        - 17
    - case: "产品支持 20,000 个项目，每个项目的年度价值为 $50,000。"
      impact: "示意 TAM 升至 $1.0B，但团队数量和定价都尚未验证；市场扩大也会加剧求解器和监管复杂度。"
      sourceRefs:
        - 12
        - 18
    - case: "客户要求每次改版都完整重跑求解器，或在没有经测量的零漏报保证时拒绝选择性重跑。"
      impact: "感知变更后挑选测试的优势基本消失；产品只能销售溯源和门禁管理，创新性与 ROI 主张也会变弱。"
      sourceRefs:
        - 4
        - 13
        - 16
    - case: "现有厂商把可复用测试包和发布审批打包进求解器工作流。"
      impact: "独立产品将失去分发优势，并面临更高转换成本；剩余机会必须依赖跨求解器可移植性，或显著优于对变更映射的验证。"
      sourceRefs:
        - 7
        - 8
        - 20
  validationPlan:
    - priority: high
      question: "仿真负责人是否会允许选择性重跑？几何到测试的选择器能否避免漏报？"
      evidenceToGather: "针对至少 100 个历史 CAD 版本做影子试点：将选择性运行结果与可信的完整求解器基准对比，纳入铜层、元件、气流、材料和边界条件变化，记录漏掉的裕量回归，以及被不必要地升级为完整重跑的情况。任何门禁阻断发布之前，都要让客户签字认可风险阈值。"
      sourceRefs:
        - 4
        - 5
        - 13
        - 21
    - priority: high
      question: "目标买方是否有新增预算和反复触发需求，而不只是继续使用现有求解器席位和工程师？"
      evidenceToGather: "访谈电力电子、工业控制和数据中心硬件领域至少十个目标团队；检查当前求解器采购和评审流程，统计每个项目的修订次数，量化专家时间和原型成本，并取得付费共创客户承诺或明确的采购路径。"
      sourceRefs:
        - 4
        - 7
        - 11
        - 17
    - priority: high
      question: "能否以可重复的导入成本，安全集成一套 CAD 到求解器的技术栈？"
      evidenceToGather: "针对一种 ECAD/MCAD 格式和一个求解器，搭建本地部署或由客户控制的运行器；测量导入版本、复现可信基准、执行仿真、生成溯源记录及通过安全审查所需时间，并记录求解器许可证条款和数据访问条件。"
      sourceRefs:
        - 5
        - 14
        - 21
        - 22
    - priority: medium
      question: "工程管理层会在设计评审中使用自动生成的通过/暂缓记录，而不把它当作认证吗？"
      evidenceToGather: "请仿真、硬件、质量和产品安全负责人审阅一份已签署结果样例，并界定哪些限制能阻断评审、哪些事项必须由专家签字，以及何时仍必须提供实物测试证据。"
      sourceRefs:
        - 11
        - 13
        - 16
    - priority: medium
      question: "测试包能否跨设计版本复用，而不让服务工作量失控？"
      evidenceToGather: "测量三个客户测试包在多个版本中的设置和维护成本；区分可复用的模式与连接器、客户专属的热工程经验，再将持续使用情况与一次性验证负担对比。"
      sourceRefs:
        - 4
        - 7
        - 15
analysisModels:
    marketMapDiagram:
      title: "热仿真工作流专业化程度"
      mermaid: |
        quadrantChart
          title Thermal simulation workflow specialization
          x-axis Low specialization --> High specialization
          y-axis Low urgency --> High urgency
          quadrant-1 Specialized and urgent
          quadrant-2 Broad and urgent
          quadrant-3 Broad and routine
          quadrant-4 Specialized and episodic
          Proposed startup: [0.86, 0.91]
          Ansys Icepak: [0.82, 0.82]
          Siemens Flotherm: [0.84, 0.83]
          Cadence Celsius: [0.80, 0.78]
          Vinci: [0.70, 0.86]
          SimScale: [0.62, 0.70]
          Manual scripts and consultants: [0.42, 0.56]
    fiveForces:
      supplierPower:
        score: 4
        rationale: >-
          创业公司依赖上游求解器许可证、CAD/ECAD 数据格式、受支持的脚本接口，以及客户控制的计算资源。
          PyAEDT 需要 AEDT 许可证；远程执行仍依赖客户持证安装的版本，因此求解器厂商能左右集成方式和成本。
        sourceRefs:
          - 5
          - 21
          - 22
      buyerPower:
        score: 4
        rationale: "工程买方可以继续使用现有求解器席位、内部脚本、顾问或完整重跑评审；公开采购证据针对的是宽泛 CFD/FE 软件，而非回归门禁，也没有公开来源证明买方对这一新层有付费意愿。"
        sourceRefs:
          - 4
          - 11
          - 17
      threatOfEntrants:
        score: 3
        rationale: "基础编排可用现有 APIs 和脚本搭建，但要跨版本可靠追踪几何特征、挑选物理测试、验证、留存审计记录并安全升级处理，都需要领域能力和针对客户的资格验证。"
        sourceRefs:
          - 5
          - 13
          - 21
          - 22
      threatOfSubstitutes:
        score: 5
        rationale: "求解器原生自动化、完整重跑、内部专家、顾问开展的仿真和原型测量已经覆盖大部分任务；新产品必须证明能更快提供证据，同时不降低工程信心。"
        sourceRefs:
          - 4
          - 7
          - 9
          - 11
          - 15
          - 16
      competitiveRivalry:
        score: 5
        rationale: "成熟的热仿真和 EDA 厂商拥有求解器技术、现有客户和工程渠道；资金充足的物理 AI 新玩家也在提高易用性和速度。独立门禁既要与完整套件竞争，也要面对功能被捆绑的可能。"
        sourceRefs:
          - 1
          - 3
          - 8
          - 19
          - 20
          - 23
    pestle:
      - factor: political
        impact: negative
        point: "出口合规计划和技术管控会限制工程数据的处理地点及访问人员，受管制项目尤其如此。"
        sourceRefs:
          - 14
      - factor: economic
        impact: positive
        point: "英国（UK）公开采购 CFD/FE 软件和支持的公告，说明机构会为仿真编列预算；但这不是针对该工作流或目标买方群体的直接信号。"
        sourceRefs:
          - 17
      - factor: social
        impact: negative
        point: "仿真仍是一门专家工作：工程师需要信任假设、审查输入质量，并将输出与测量结果对照，之后才会接受自动门禁。"
        sourceRefs:
          - 4
          - 11
          - 13
      - factor: technological
        impact: positive
        point: "Python APIs、批处理和云端仿真让反复执行求解器并留存证据成为可能；如何感知几何变化来选测试，以及如何安全回退，仍是未解的技术风险。"
        sourceRefs:
          - 5
          - 7
          - 21
          - 22
      - factor: legal
        impact: negative
        point: "IEC 62368-1 产品安全义务和认证测试独立于内部仿真通过/暂缓凭证。"
        sourceRefs:
          - 13
          - 16
      - factor: environmental
        impact: positive
        point: "早期热设计分析有助于团队在制造实物变体前优化散热和能耗表现，但来源没有量化环境影响。"
        sourceRefs:
          - 8
          - 9
    adoptionFrictionMatrix:
      - friction: "变更检测漏掉了会影响物理结果的几何、负载或散热条件变化。"
        severity: high
        affectedBuyer: "仿真负责人和设计审批人"
        mitigation: "映射可信度低时默认阻止选择性放行，改为完整求解器运行；将所选测试与完整基准比较，并保留评审人员覆盖权。"
        sourceRefs:
          - 4
          - 5
          - 13
          - 21
      - friction: "客户专属的边界条件、材料和功率分布图，让每个初始测试包都需要大量服务投入。"
        severity: high
        affectedBuyer: "热设计工程师和工程副总裁"
        mitigation: "先从一种可重复的 PCB/机箱类型和一套受支持技术栈切入；把首个测试包的范围、验证过程和文档做好，再扩大覆盖面。"
        sourceRefs:
          - 4
          - 7
          - 11
      - friction: "CAD/求解器访问权限、许可证条款和数据格式限制集成。"
        severity: high
        affectedBuyer: "仿真负责人、求解器管理员和 IT"
        mitigation: "使用客户持证且由客户控制的执行环境，保留求解器版本，并在增加适配器前先支持单一技术栈。"
        sourceRefs:
          - 5
          - 21
          - 22
      - friction: "IP 保密和出口管制筛查会阻止云端上传或跨境支持。"
        severity: high
        affectedBuyer: "安全、法务和工程管理层"
        mitigation: "提供本地部署或客户管理的运行器、最小权限访问、审计日志、数据留存控制和 EAR 筛查。"
        sourceRefs:
          - 14
          - 19
      - friction: "工程通过/失败结果可能被误认为产品安全认证，也可能无法替代原型测量。"
        severity: high
        affectedBuyer: "产品保证团队和设计审批人"
        mitigation: "明确证据边界；纳入模型验证、不确定性、假设和必要的实物测试引用。"
        sourceRefs:
          - 13
          - 16
      - friction: "设计门禁可能增加评审步骤，或触发过多完整重跑，反而削弱加快改版的承诺。"
        severity: medium
        affectedBuyer: "硬件设计团队和仿真负责人"
        mitigation: "在影子试点中测量符合条件的改版频率、决策时间、升级率和审批延迟，再决定是否阻断发布。"
        sourceRefs:
          - 4
          - 7
          - 11
market:
  tam:
    value: "$300M"
    rationale: "这是自下而上的经营者情景，并非已公布的市场收入：假设全球有 10,000 个电子产品项目会反复修改热设计，可能使用求解器配套门禁；每个项目的示意年度工作流价值为 $30,000，据此计算为 $300M/年。项目数量和年度价值都尚未验证；Census County Business Patterns 统计的是付费雇主企业机构，而非热仿真项目，已审阅的分析师页面也没有提供透明且可用的估算。"
    isEstimate: true
    sourceRefs:
      - 12
      - 18
  sam:
    value: "$45M"
    rationale: "对 TAM 情景明确施加 15% 的初始技术栈及地理筛选：假设北美和欧洲有 1,500 个项目适用一套受支持的 ECAD/MCAD 与求解器工作流，按同一每项目年度价值 $30,000 计算，为 $45M/年。15% 的比例和技术栈兼容占比都是经营者假设，需逐个账户核实。"
    isEstimate: true
    sourceRefs:
      - 8
      - 12
  som:
    value: "$1.8M"
    rationale: "示意性的五年可实现经常性收入：签下 60 个项目合同，即假设 SAM 的 4%，按每年 $30,000 计算为 $1.8M/年。这是可达性情景，不是预测；它依赖选择性重跑能否获得信任、客户是否反复使用，以及集成能否跑通，而现有证据尚未证实这些条件。"
    isEstimate: true
    sourceRefs:
      - 4
      - 7
      - 17
bottomUpSizingDrivers:
  - driver: "全球反复开展热分析的电子产品项目"
    value: "全球 10,000 个项目；经营者假设，并非公开统计"
    source: "估算（经营者假设；Census CBP 仅是企业机构层面的替代指标）"
  - driver: "每个项目的年度工作流价值"
    value: "每个项目每年 $30,000；明确的测算假设，不是观察到的价格或付费意愿（WTP）"
    source: "估算（经营者假设）"
  - driver: "初始可服务细分市场"
    value: "北美和欧洲有 1,500 个项目兼容选定的一套 CAD/求解器技术栈；占假设 TAM 的 15%"
    source: "计算（经营者按兼容性/地理区域筛选）"
  - driver: "五年可触达的已部署项目"
    value: "60 个项目，占假设 SAM 的 4%"
    source: "计算（示意性可达情景）"
  - driver: "市场数量口径限制"
    value: "2023 年美国 CBP 覆盖近 1,000 个行业的雇主企业机构数据，而非项目级热仿真买方"
    source: "[12]"
categoryDynamics:
  growthRate: null
  growthRateSourceRefs:
    - 18
  tailwinds:
    - point: "热分析设置和验证仍然耗费大量人力，Ansys 和 Siemens 因而发布工作流自动化指引。"
      sourceRefs:
        - 4
        - 7
    - point: "电子产品复杂度上升、热反馈提前，都支持反复使用仿真，但不能证明客户需要专门的门禁产品。"
      sourceRefs:
        - 8
        - 9
        - 10
    - point: "仿真提速可能让更多设计迭代在经济上变得可行；Vinci 关于生产使用和速度的说法来自公司，未经独立基准验证。"
      sourceRefs:
        - 1
        - 3
        - 19
  headwinds:
    - point: "现有套件已提供求解器原生自动化、参数分析、批处理和迭代；现有厂商可能把这个切口纳入产品路线图。"
      sourceRefs:
        - 4
        - 7
        - 8
        - 20
    - point: "可信的热设计决策需要明确的物理模型、胜任的分析人员、验证与确认以及量化的不确定性；输入错误时，运行再快也无济于事。"
      sourceRefs:
        - 4
        - 13
    - point: "出口管制流程和企业安全要求可能使客户更倾向于在自有环境部署，并拉长采购周期。"
      sourceRefs:
        - 14
        - 17
competitors:
  - name: "Ansys Icepak 和 SIWave 配合 PyAEDT"
    stage: "成熟的商业多物理场套件"
    wedge: "将 PCB 和电子设备热分析与 ECAD/MCAD 输入、SIWave 焦耳热及可编程设置/执行整合起来。"
    pricing: "PyAEDT 采用 MIT 许可证，但文档要求安装有许可证的 AEDT；没有公开的 Icepak 商业报价得到核实。"
    strength: "可信的求解器产品线、企业现有许可证、广泛的物理场能力和 Python 自动化。"
    weaknessVsUs: "官方网络研讨会介绍了可用脚本自动化的专家手动设置；已审阅材料未介绍开箱即用的版本化测试包或感知变更的放行审批。"
    sourceRefs:
      - 4
      - 5
      - 21
  - name: "Siemens Simcenter Flotherm 和 Flotherm XT"
    stage: "电子散热领域成熟的现有厂商"
    wedge: "面向电子设备的专用 CFD，覆盖 IC 封装、PCB 到机箱，并支持 ECAD/MCAD 处理、SmartParts、参数分析、校准及工作流自动化。"
    pricing: "按报价定价；Siemens 要求买家联系销售询价。"
    strength: "专注电子散热、工程库、求解器可信度，以及针对反复 PCB 分析的自动化。"
    weaknessVsUs: "公开资料介绍了脚本、反复改版分析和批量报告，但没有明确展示可复用且获批准的变更到测试放行门禁；现有厂商扩展功能的风险很高。"
    sourceRefs:
      - 7
      - 8
  - name: "Cadence Celsius 热求解器"
    stage: "成熟的 EDA 集成热仿真产品"
    wedge: "针对 PCBs 和实体机箱的电热协同仿真，并集成 Allegro。"
    pricing: "已抓取的经销商产品概览没有公开定价；需向销售确认。"
    strength: "原生设计流程上下文、集成电热建模和成熟的 EDA 分销渠道。"
    weaknessVsUs: "已抓取的概览强调求解器集成和加快设计迭代，没有明确介绍厂商中立的版本化测试政策或物理感知放行凭证。"
    sourceRefs:
      - 20
  - name: "Vinci"
    stage: "B 轮物理 AI 初创公司；宣布于 2026 年十月融资 $250M，估值 $1.5B"
    wedge: "针对芯片、封装、PCBs、电子设备机箱及更大型硬件，加速热仿真和热机械仿真。"
    pricing: "已抓取来源未公开披露。"
    strength: "融资实力强，宣称产品已用于生产，并计划拓展物理场覆盖范围、让仿真更早进入工程流程。"
    weaknessVsUs: "它争夺持续物理仿真预算，但已审阅的产品材料未介绍获批的逐项目回归测试包、选择性变更映射或 CAD 版本放行门禁；报道中的试点和精度证据仍有限。"
    sourceRefs:
      - 1
      - 2
      - 3
      - 19
  - name: "SimScale"
    stage: "商业云端 CAE 平台"
    wedge: "基于浏览器的多物理场与电子散热分析，用于 PCB/机箱设计迭代，并提供云端执行和协作。"
    pricing: "已抓取的解决方案页面未列出可比的逐项目商业价格。"
    strength: "易用的云端执行、公开的热分析教程，以及低摩擦对比设计变体的能力。"
    weaknessVsUs: "公开工作流展示了几何更新和反复仿真，但没有展示客户批准的测试包、保守的变更到测试选择，或能阻止放行的证据记录。"
    sourceRefs:
      - 9
      - 10
      - 23
regulatoryTechnicalConstraints:
  - point: "对相关 IT/AV 设备，IEC 62368-1 采用危害导向方法；UL 提供测试与认证。产品仿真门禁可为工程证据提供支持，但不能宣称它就是认证，或取代规定的实物测试。"
    sourceRefs:
      - 13
      - 16
  - point: "仿真可信度依赖验证与确认、不确定性量化、恰当的物理建模和胜任的分析人员；若没有经过验证的适用范围，仅凭阈值输出通过/失败并不安全。"
    sourceRefs:
      - 4
      - 13
  - point: "PyAEDT 自动化需要安装有许可证的 AEDT；也可通过 AEDT 服务器连接远程执行。因此，厂商许可证、版本和 API 变更会限制支持能力和商业部署。"
    sourceRefs:
      - 5
      - 21
  - point: "美国出口合规指引涵盖风险评估、技术管控、筛查和视同出口管理；受管制工程数据可能让云端处理及支持人员访问成为采购障碍。"
    sourceRefs:
      - 14
  - point: "英国（UK）HSE 的 CFD/FE 公告是公共采购案例，但含 VAT 的 £840,000 涵盖广泛的软件、维护和支持范围，没有披露购买热回归门禁。"
    sourceRefs:
      - 17
validationSignals:
  - point: "Ansys 介绍了 PCB 模型准备中的手动重复工作，包括 ECAD 导入、材料、边界条件和网格划分，并推广 Python 自动化以减少人力；这证实设置环节存在摩擦。"
    sourceRefs:
      - 4
  - point: "Siemens 将反复改版、标准化批量分析和生成报告列为具体的自动化用例。"
    sourceRefs:
      - 7
  - point: "TE Connectivity 当前的 PCB 仿真工程师招聘要求涉及方法、仿真评审、精度、验证及实验对照，说明企业内部持续需要相关工程能力并承担工作量。"
    sourceRefs:
      - 11
  - point: "英国（UK）公开采购 CFD 和有限元软件、维护及支持，是机构为仿真划拨采购预算的相邻证据，不代表对本产品的直接需求。"
    sourceRefs:
      - 17
  - point: "Vinci 已发布的产品页面宣称已投入生产并覆盖广泛应用；独立报道则称其计划将试点从两个扩展到二十个，并指出速度/精度说法尚未验证。牵引力证据喜忧参半。"
    sourceRefs:
      - 1
      - 2
      - 3
openQuestions:
  - "如今有多少电力电子团队会在每次有实质影响的改版后都运行热仿真？又有多少团队会拖到评审或原型阶段才仿真？"
  - "目标滩头市场由哪种 CAD 和求解器组合主导？有哪些受支持的 APIs、许可证和数据导出权？"
  - "仿真负责人需要怎样的漏报率和验证证据，才会允许选择性重跑而非完整重跑？"
  - "买方会单独为发布门禁工作流付费，还是把它视为求解器许可证、实施咨询和工程师时间的一部分？"
  - "为每个客户映射边界条件、材料、几何特征身份和已批准限制，需要投入多少人工服务？"
  - "在保留原型对照和正式认证的前提下，质量团队会在设计评审中接受带求解器溯源记录的通过/暂缓结果吗？"
  - "客户托管式执行能否满足 IP、安全、出口管制和跨境支持要求，同时不让导入成本失去经济性？"
  - "Siemens、Ansys、Cadence 或 Vinci 会不会在现有平台中加入同类测试包和版本门禁功能？"
