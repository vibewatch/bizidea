championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: >-
        The product's distinctive unit is not a faster solver run alone: it binds approved thermal cases and
        limits to a specific CAD revision, chooses impacted tests, and emits reviewable provenance and a gate
        decision. The fetched incumbent pages describe automation, batch analysis, parametric studies, and
        rerunning updated designs, but none explicitly documents this complete physics-test-compiler workflow.
      sourceRefs:
        - 4
        - 7
        - 8
        - 9
        - 10
        - 20
    - point: >-
        Incumbent documentation confirms that recurring PCB thermal analysis involves repeated setup and
        validation work, so packaging trusted cases as versioned tests could be a genuinely different workflow
        layer if engineers accept its selection logic.
      sourceRefs:
        - 4
        - 7
        - 13
  evidenceAgainst:
    - point: >-
        The ingredients are not novel: Ansys supports Python automation of manual PCB setup and solver
        execution, Siemens promotes automation for multiple PCB revisions and batch reporting, and SimScale
        already demonstrates changing CAD and rerunning thermal analyses. The differentiation is therefore
        the release-gate and test-pack abstraction, not automation or continuous simulation itself.
      sourceRefs:
        - 4
        - 7
        - 9
        - 10
        - 21
    - point: >-
        Strong incumbent suites already integrate electronics design inputs with thermal solvers, and Cadence
        positions its solver inside its Allegro workflow. A product page not describing a release gate does not
        prove the feature is absent from commercial deployments or could not be added.
      sourceRefs:
        - 8
        - 20
        - 21
    - point: >-
        The inspiration company Vinci says its physics platform is already used on production engineering
        programs, while independent reporting says its stated target is to expand pilots from two to twenty and
        that its speed and accuracy claims have not been independently verified. The workflow gap and market
        pull remain less proven than the solver opportunity.
      sourceRefs:
        - 1
        - 3
        - 19
  revisedClaim: >-
    The defensible creative claim is a narrow workflow product that compiles customer-approved thermal cases
    into revision-linked, solver-provenance checks and fails closed when a geometry change cannot be mapped
    safely. Public evidence supports a potentially uncommon release-gate packaging of established simulation
    and scripting capabilities; it does not establish uniqueness, buyer demand, trusted selective reruns, or a
    durable moat over Siemens, Ansys, Cadence, or newer physics platforms.
reportMemo:
  executiveTakeaways:
    - "Thermal-analysis work is current and staffed: Ansys describes manually intensive PCB setup, Siemens addresses repeated revisions, and TE Connectivity recruits senior simulation engineers. This validates workflow friction, not a budget specifically for regression gating. [4,7,11]"
    - "The rare mechanism is credible but narrower than the score-5 claim: versioned approved cases plus change-aware test selection and a release artifact are not visible in the reviewed vendor pages, while existing products already automate setup, batch runs, parametric sweeps, and iteration. [4,7,8,9,20,21]"
    - "Incumbent gravity is very high. Ansys, Siemens, and Cadence have established thermal solvers and adjacent automation; Vinci is well-funded and targets continuous physics, while SimScale makes cloud thermal iteration accessible. [1,3,8,19,20,23]"
    - "A bottom-up beachhead scenario yields about $300M TAM, $45M initial-stack SAM, and $1.8M obtainable ARR at steady state, but all account counts and the $30,000 program-year value are operator assumptions, not measured market or willingness-to-pay data."
    - "The largest adoption blocker is trust: an unselected thermal case can hide a regression, and simulation credibility depends on verified models, quantified uncertainty, and physical correlation. A gate must complement rather than replace prototype testing or product certification. [4,13,16]"
    - "Falsify the concept if customers will not allow a change detector to select a subset of solver cases, if every revision still requires specialist rebuilding, or if measured onboarding and validation costs exceed recurring software value. [4,5,7,13]"
  marketDefinition: >-
    The addressable category is a workflow and evidence layer around existing thermal CFD or FEA solvers. It
    stores approved PCB/enclosure cases, materials, loads, cooling conditions, and engineer-set limits; maps a
    CAD revision to impacted cases; runs those cases through the customer's licensed solver; and records a
    traceable pass/hold result for design review. It excludes solver licenses, general-purpose CAD, hardware
    testing, certification, and broad multiphysics platforms. The initial market is recurring, thermally
    constrained electronics and power-electronics programs with a stable CAD/solver stack.
  customerAndBuyer: >-
    The daily user is a thermal-design or simulation engineer supporting a power-electronics team with repeated
    PCB or enclosure revisions. A simulation lead owns trusted cases and validation; a hardware-design director
    or VP Engineering is the likely economic buyer, with security, IT, solver administrators, and product
    assurance as gatekeepers. TE Connectivity's senior simulation role explicitly covers methods, accuracy,
    review, experimental correlation, and PCB reliability, confirming a real organizational function but not
    proving an external buyer for a separate regression layer. [11]
  buyingTriggers:
    - point: "A design review or prototype release is approaching and the team needs evidence that a geometry or component change did not erode an approved thermal margin."
      sourceRefs:
        - 4
        - 7
        - 11
    - point: "A new power-electronics platform or enclosure requires repeated layout variants, airflow studies, and component thermal checks; an existing solver license and named simulation owner lower the first integration hurdle."
      sourceRefs:
        - 4
        - 7
        - 8
    - point: "A company is standardizing thermal engineering or attempting to reduce prototype iterations; software procurement is credible in this category, but HSE's CFD/FE procurement is an adjacent public-budget signal rather than proof of the beachhead buyer's intent."
      sourceRefs:
        - 8
        - 17
  willingnessToPay:
    summary: >-
      Direct willingness to pay for a versioned regression gate is unproven. Existing paid solver programs and
      simulation-engineering roles imply category budget, and an HSE notice aggregator reports an £840,000
      CFD/FE software, maintenance, and support procurement; that is a multi-year public procurement for broad
      software, not a startup price benchmark or power-electronics purchase. Siemens directs buyers to sales
      for pricing, and no fetched vendor page publishes comparable per-program regression pricing. Treat the
      annual program value used in sizing as an explicit test assumption.
    sourceRefs:
      - 8
      - 11
      - 17
  competitiveLandscape: >-
    The closest competitors are Ansys Icepak/SIwave with PyAEDT automation, Siemens Simcenter Flotherm/XT,
    Cadence Celsius, Vinci's accelerated physics platform, and SimScale's cloud thermal workflows. The most
    immediate substitutes are scripting inside the incumbent solver, asking a simulation specialist or
    consulting firm to rerun and compare cases, running a complete simulation on every revision, or relying on
    prototype measurements. Public material shows a possible gap between solver automation and a vendor-neutral
    revision-level approval artifact, but no exhaustive feature or customer deployment audit establishes that
    the gap is unserved.
  incumbentThesis:
    - incumbentClass: "Ansys or other incumbent solver plus internal scripts"
      point: >-
        Ansys documents how manual PCB import, material assignment, boundary conditions, and meshing consume
        engineer time, and shows Python automation using SIWave, Icepak, and PyAEDT. This incumbent can win
        through trusted physics, existing licenses, and local workflow knowledge; it may not win by default
        where scripts remain specialist-owned, fragile, and disconnected from design-review approvals.
      sourceRefs:
        - 4
        - 5
        - 21
    - incumbentClass: "Siemens Simcenter Flotherm and Flotherm XT"
      point: >-
        Flotherm integrates with ECAD/MCAD, supports libraries, calibration, parametric analysis, and optimization;
        Siemens separately promotes scripting and standardized batch reporting for repeated PCB revisions. This
        may solve much of the pain already. The remaining wedge is an auditable, approved test definition and
        safe change-to-test mapping, which the public pages reviewed do not explicitly show.
      sourceRefs:
        - 7
        - 8
    - incumbentClass: "Cadence Celsius and EDA-integrated solvers"
      point: >-
        Celsius combines electrical-thermal co-simulation for PCB and enclosure designs and is integrated with
        Allegro, reducing data handoffs for Cadence users. That distribution and design context are strong
        default advantages; the opportunity is only credible if the new layer is materially easier to audit or
        can preserve approved checks across solver stacks.
      sourceRefs:
        - 20
    - incumbentClass: "Cloud solver or accelerated physics platforms"
      point: >-
        SimScale supports repeated thermal design variants in a browser and Vinci markets high-resolution,
        accelerated physics for electronics and larger systems. Faster solves lower the value of queue reduction,
        but neither faster compute nor easy reruns alone establishes persistent test packs and release policy.
      sourceRefs:
        - 1
        - 2
        - 9
        - 10
        - 19
        - 23
    - incumbentClass: "Consultants, manual engineering, and prototype testing"
      point: >-
        Specialist consultants and internal simulation engineers can configure, validate, and interpret unusual
        cases, while UL describes formal testing and certification for relevant ICT equipment. Human review
        addresses trust and edge cases better than an unvalidated automation layer; the tradeoff is repeated
        expert effort and continued physical tests. The product must augment rather than displace this assurance.
      sourceRefs:
        - 11
        - 13
        - 15
        - 16
  regulatoryLandscape: >-
    Thermal regression is an engineering workflow, not a substitute for product-safety certification. UL
    describes IEC 62368-1 as a hazard-based safety standard for IT and AV equipment and offers testing and
    certification; NIST's CFD guidance says simulation credibility depends on physical modeling, analyst
    competence, verification/validation, and uncertainty quantification. For data involving controlled
    technology or cross-border users, BIS export-compliance guidance makes risk assessment, technology
    controls, and deemed-export management relevant. The initial product should retain solver version,
    assumptions, boundary conditions, validation evidence, access control, and audit history, and must not
    claim a green simulation result is regulatory approval. [13,14,16]
  technologyLandscape: >-
    The solver-execution layer is technically plausible: PyAEDT exposes Icepak and related AEDT tools through
    Python, but requires a licensed local AEDT installation and supports remote server connections; Siemens
    and Ansys describe scripting or batch automation. CAD automation APIs can also process files and parameters.
    The hard part is not launching runs: it is maintaining robust feature identity across revisions, mapping
    changed geometry and loads to all affected cases, and proving that an omitted run cannot conceal a failure.
    The safe default must be a full rerun or human escalation when mapping confidence is low, followed by
    correlation against measurements and an expert-approved validation envelope. [4,5,7,13,21,22]
  distributionChannels:
    - point: "Direct technical selling to thermal simulation leads and hardware engineering directors at teams with repeated PCB/enclosure changes and already licensed solvers."
      sourceRefs:
        - 4
        - 7
        - 11
    - point: "Referrals and implementation partnerships with CAE consultants, specialist distributors, and solver integrators; FlowCAD's Cadence channel illustrates the existing reseller ecosystem."
      sourceRefs:
        - 15
        - 20
    - point: "A later channel could be embedded integrations or partner validation workflows with CAD/solver vendors, but the same vendors are potential competitors and API access and license terms must be established."
      sourceRefs:
        - 5
        - 8
        - 21
        - 22
  partnershipEcosystem:
    - point: "Ansys/PyAnsys and Siemens engineering partners can help validate the first solver workflow and preserve supported license boundaries; this also creates a risk of partner dependence."
      sourceRefs:
        - 5
        - 7
        - 8
        - 21
    - point: "Thermal consultants or labs can help create the initial validated case packs and correlate results to measured prototypes, while the product remains a traceable workflow rather than a certification body."
      sourceRefs:
        - 13
        - 15
        - 16
    - point: "Electronics design and CAD platform partners could expose revision metadata and design context, but the product should support one narrowly selected stack before claiming interoperability."
      sourceRefs:
        - 20
        - 21
        - 22
  dataMoats:
    - point: >-
        A customer-specific library of approved boundary conditions, material assumptions, validated thermal
        cases, thresholds, and revision-to-test mappings could create switching costs and improve onboarding.
        This is an operator hypothesis, not a demonstrated cross-customer data moat; proprietary designs and
        customer confidentiality may prevent pooling.
      sourceRefs:
        - 4
        - 13
        - 19
    - point: >-
        The strongest defensible evidence asset would be a verified mapping and escalation history showing
        which geometry changes affected which thermal outputs, with false-negative rates measured against
        full-solver baselines and prototype data. Public sources do not establish that dataset today.
      sourceRefs:
        - 5
        - 13
        - 21
  geographicConsiderations:
    - point: "A US-first product can draw on Census establishment data and BIS export-control guidance, but the available CBP release describes industry establishments rather than teams that run thermal checks; it cannot be used as a direct account count."
      sourceRefs:
        - 12
        - 14
    - point: "Europe and the UK are plausible later markets because electronics and industrial engineering use the same supplier solvers, but procurement requirements, data-location expectations, and local safety regimes require separate qualification; the public HSE notice is only an adjacent UK software-budget signal."
      sourceRefs:
        - 16
        - 17
    - point: "Cross-border defense or controlled-technology programs are a higher-friction segment than ordinary commercial power electronics; screen data classification and access before offering cloud execution."
      sourceRefs:
        - 14
  sensitivityCases:
    - case: "Only 5,000 global programs fit the definition, and annual program value is $15,000."
      impact: "The scenario TAM falls to $75M; a 15% initial-stack share gives $11.25M SAM, and 60 wins at that value would yield $0.9M annual revenue."
      sourceRefs:
        - 8
        - 17
    - case: "The product supports 20,000 programs and $50,000 annual value per program."
      impact: "The illustrative TAM rises to $1.0B, but neither the team count nor pricing has been validated; broader markets would also increase solver and regulatory complexity."
      sourceRefs:
        - 12
        - 18
    - case: "Customers require full solver reruns for every revision or reject selective reruns without a measured no-miss guarantee."
      impact: "The change-aware selection benefit largely disappears; the product must sell provenance and gate administration alone, with a weaker novelty and ROI thesis."
      sourceRefs:
        - 4
        - 13
        - 16
    - case: "An incumbent bundles reusable test packs and release approval into its solver workflow."
      impact: "The independent product loses distribution and faces higher switching costs; the remaining opportunity would need cross-solver portability or exceptional change-mapping validation."
      sourceRefs:
        - 7
        - 8
        - 20
  validationPlan:
    - priority: high
      question: "Will a simulation lead permit selective reruns, and can the geometry-to-test selector avoid false negatives?"
      evidenceToGather: "Run a shadow pilot on at least 100 historical CAD revisions: compare selected runs with a full trusted solver baseline, include changes to copper, components, airflow, materials, and boundary conditions, and record missed margin regressions and unnecessary full-run escalations. Require customer sign-off on a risk threshold before any blocking gate."
      sourceRefs:
        - 4
        - 5
        - 13
        - 21
    - priority: high
      question: "Does the target buyer have an incremental budget and a recurring trigger, rather than simply using existing solver seats and engineers?"
      evidenceToGather: "Interview at least ten target teams across power electronics, industrial controls, and data-center hardware; inspect current solver purchase and review workflows, count revisions per program, quantify specialist time and prototype cost, and obtain a paid design-partner commitment or explicit procurement path."
      sourceRefs:
        - 4
        - 7
        - 11
        - 17
    - priority: high
      question: "Can one CAD-to-solver stack be integrated securely at a repeatable onboarding cost?"
      evidenceToGather: "Build an on-prem or customer-controlled runner for one ECAD/MCAD format and solver; measure time to ingest a revision, reproduce a trusted baseline, execute, produce provenance, and pass security review. Document solver license terms and data access."
      sourceRefs:
        - 5
        - 14
        - 21
        - 22
    - priority: medium
      question: "Will engineering management use an automated pass/hold record in design review without treating it as certification?"
      evidenceToGather: "Have simulation, hardware, quality, and product-safety owners review a sample signed result and define which limits can block a review, what requires specialist sign-off, and when physical test evidence remains mandatory."
      sourceRefs:
        - 11
        - 13
        - 16
    - priority: medium
      question: "Can test packs persist across design revisions without unbounded services work?"
      evidenceToGather: "Measure setup and maintenance effort for three customer test packs over multiple revisions; separate reusable schema and connectors from customer-specific thermal expertise, then compare recurring usage with the one-time validation burden."
      sourceRefs:
        - 4
        - 7
        - 15
analysisModels:
    marketMapDiagram:
      title: "Thermal simulation workflow specialization"
      mermaid: |
        quadrantChart
          title Thermal simulation workflow specialization
          x-axis Low specialization --> High specialization
          y-axis Low urgency --> High urgency
          quadrant-1 Specialized and urgent
          quadrant-2 Broad and urgent
          quadrant-3 Broad and routine
          quadrant-4 Specialized and episodic
          Proposed startup: [0.86, 0.91]
          Ansys Icepak: [0.82, 0.82]
          Siemens Flotherm: [0.84, 0.83]
          Cadence Celsius: [0.80, 0.78]
          Vinci: [0.70, 0.86]
          SimScale: [0.62, 0.70]
          Manual scripts and consultants: [0.42, 0.56]
    fiveForces:
      supplierPower:
        score: 4
        rationale: >-
          The startup depends on upstream solver licenses, CAD/ECAD data formats, supported scripting interfaces,
          and customer-controlled compute. PyAEDT requires an AEDT license, while remote execution still depends
          on the customer's licensed installation, giving solver vendors leverage over integration and cost.
        sourceRefs:
          - 5
          - 21
          - 22
      buyerPower:
        score: 4
        rationale: >-
          Engineering buyers can continue with existing solver seats, internal scripts, a consultant, or
          full-run review; public procurement evidence is for broad CFD/FE software rather than a regression
          gate, and no public source proves willingness to pay for the new layer.
        sourceRefs:
          - 4
          - 11
          - 17
      threatOfEntrants:
        score: 3
        rationale: >-
          Basic orchestration can be built with existing APIs and scripting, but reliable geometry identity,
          physical test selection, validation, auditability, and safety escalation require domain competence
          and customer-specific qualification.
        sourceRefs:
          - 5
          - 13
          - 21
          - 22
      threatOfSubstitutes:
        score: 5
        rationale: >-
          Solver-native automation, complete reruns, in-house experts, consultant-run studies, and prototype
          measurement already cover much of the task; a new product must prove faster evidence without
          lowering engineering confidence.
        sourceRefs:
          - 4
          - 7
          - 9
          - 11
          - 15
          - 16
      competitiveRivalry:
        score: 5
        rationale: >-
          Mature thermal and EDA vendors have solver technology, installed customers, and engineering
          distribution; a well-funded physics-AI entrant is also improving access and speed. A standalone
          gate competes with both suites and the possibility of bundling.
        sourceRefs:
          - 1
          - 3
          - 8
          - 19
          - 20
          - 23
    pestle:
      - factor: political
        impact: negative
        point: "Export compliance programs and technology controls can constrain where engineering data is processed and who can access it, particularly in controlled programs."
        sourceRefs:
          - 14
      - factor: economic
        impact: positive
        point: "A public UK procurement notice for CFD/FE software and support is evidence that institutions budget for simulation, but it is not a direct signal for this workflow or buyer segment."
        sourceRefs:
          - 17
      - factor: social
        impact: negative
        point: "Simulation remains an expert discipline: engineers need to trust assumptions, review input quality, and correlate outputs with measurements before accepting an automated gate."
        sourceRefs:
          - 4
          - 11
          - 13
      - factor: technological
        impact: positive
        point: "Python APIs, batch processing, and cloud simulation make repeated solver execution and evidence capture feasible; geometry-aware test selection and safe fallbacks remain the unsolved technical risk."
        sourceRefs:
          - 5
          - 7
          - 21
          - 22
      - factor: legal
        impact: negative
        point: "IEC 62368-1 product-safety obligations and certification testing remain independent from an internal simulation pass/hold artifact."
        sourceRefs:
          - 13
          - 16
      - factor: environmental
        impact: positive
        point: "Early thermal design analysis can help teams optimize cooling and energy performance before building physical variants, but the sources do not quantify environmental impact."
        sourceRefs:
          - 8
          - 9
    adoptionFrictionMatrix:
      - friction: "Change detection omits a physics-relevant geometry, load, or cooling-condition change."
        severity: high
        affectedBuyer: "Simulation lead and design authority"
        mitigation: "Fail closed to a full solver run when mapping confidence is low; compare selected tests with full baselines and preserve reviewer override."
        sourceRefs:
          - 4
          - 5
          - 13
          - 21
      - friction: "Customer-specific boundary conditions, materials, and power maps make each initial pack services-heavy."
        severity: high
        affectedBuyer: "Thermal-design engineer and VP Engineering"
        mitigation: "Start with one repeatable PCB/enclosure archetype and one supported stack; scope, validate, and document the first pack before broadening."
        sourceRefs:
          - 4
          - 7
          - 11
      - friction: "CAD/solver access, license terms, and data formats constrain integrations."
        severity: high
        affectedBuyer: "Simulation lead, solver administrator, and IT"
        mitigation: "Use licensed customer-controlled execution, preserve solver versions, and support a single stack before adding adapters."
        sourceRefs:
          - 5
          - 21
          - 22
      - friction: "IP confidentiality and export-control screening block cloud upload or cross-border support."
        severity: high
        affectedBuyer: "Security, legal, and engineering leadership"
        mitigation: "Offer an on-prem or customer-managed runner, least-privilege access, audit logs, data retention controls, and EAR screening."
        sourceRefs:
          - 14
          - 19
      - friction: "Engineering pass/fail output may be mistaken for product-safety certification or may not replace prototype measurement."
        severity: high
        affectedBuyer: "Product assurance and design authority"
        mitigation: "State the evidence boundary clearly; include model validation, uncertainty, assumptions, and required physical test references."
        sourceRefs:
          - 13
          - 16
      - friction: "A design gate can add review steps or trigger too many full reruns, undermining the promise of faster revisions."
        severity: medium
        affectedBuyer: "Hardware design team and simulation lead"
        mitigation: "Measure eligible revision frequency, time-to-decision, escalation rates, and approval latency in a shadow pilot before blocking releases."
        sourceRefs:
          - 4
          - 7
          - 11
market:
  tam:
    value: "$300M"
    rationale: >-
      Bottom-up operator scenario, not reported market revenue: assume 10,000 global electronics product
      programs with recurring thermal changes that could use a solver-adjacent gate, multiplied by an
      illustrative $30,000 annual workflow value per program, equals $300M/year. The program count and annual
      value are unvalidated; Census County Business Patterns counts paid establishments, not thermal-active
      engineering programs, and the analyst page reviewed does not provide a transparent usable estimate.
    isEstimate: true
    sourceRefs:
      - 12
      - 18
  sam:
    value: "$45M"
    rationale: >-
      Apply an explicit 15% initial-stack and geography filter to the TAM scenario: 1,500 programs in North
      America and Europe assumed to fit one supported ECAD/MCAD and solver workflow, multiplied by the same
      $30,000 annual program value, equals $45M/year. The 15% and stack compatibility share are operator
      assumptions requiring account-by-account qualification.
    isEstimate: true
    sourceRefs:
      - 8
      - 12
  som:
    value: "$1.8M"
    rationale: >-
      Illustrative five-year obtainable recurring revenue: 60 program contracts, or 4% of assumed SAM,
      multiplied by $30,000 annual value equals $1.8M/year. This is a reachability scenario, not a forecast;
      it depends on proof of selective-rerun trust, repeat usage, and integrations that the evidence does not
      yet establish.
    isEstimate: true
    sourceRefs:
      - 4
      - 7
      - 17
bottomUpSizingDrivers:
  - driver: "Global recurring thermal-electronics product programs"
    value: "10,000 programs worldwide; operator assumption, not a public count"
    source: "est. (operator assumption; Census CBP is only an establishment-level proxy)"
  - driver: "Annual workflow value per program"
    value: "$30,000 per program-year; explicit sizing assumption, not an observed price or WTP"
