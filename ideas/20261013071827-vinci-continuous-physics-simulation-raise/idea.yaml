problem: >-
  Hardware teams rely on simulation experts to set up analyses, and the setup burden can leave simulation
  intermittent rather than part of each design change. When an engineer edits a layout or enclosure, the team may
  not rerun the relevant thermal analysis until a later design review, leaving a margin regression to surface after
  more expensive prototype work. The cited reporting describes the workflow friction but does not quantify late
  prototype failures or demand for an automated regression gate.
targetUser:
  primary: Thermal-design engineers at power-electronics hardware teams who own recurring PCB or enclosure revisions and depend on specialist-run solver jobs before design review.
  secondary: Simulation leads responsible for reusable analysis cases across a hardware product line.
  buyer: VP of Engineering or director of hardware design with budget for simulation software and prototype reduction.
startupThesis:
  nonObviousInsight: >-
    Making an individual solver run faster does not by itself make physics part of the design loop: teams also need
    a repeatable definition of what must be retested when geometry changes and an approval artifact tied to that
    exact revision. Packaging those tests as physical regression checks can turn solver capacity into a routine
    engineering gate without replacing the underlying solver.
  beachhead: >-
    Power-electronics teams revising one thermally constrained PCB or enclosure design repeatedly, where engineers
    already have a trusted thermal solver but simulation specialists cannot manually configure every revision.
  wedge: >-
    A versioned thermal test pack that binds selected geometry cases, cooling and load boundary conditions, and
    engineer-approved temperature limits to each CAD revision, then returns a pass/fail delta before design review.
  whyNowCatalyst: >-
    Vinci's announced financing targets expansion of physics and hardware domains, and the company says production
    engineering programs can be analyzed in minutes; if solver turnaround improves as claimed, a revision-level
    regression workflow becomes more practical, though the published speed and accuracy claims remain unverified.
  ventureScalePath: >-
    Start with thermal regression checks for one CAD and solver combination, then add reusable test packs across
    related product revisions and adjacent physics such as vibration or electromagnetics after customer cases are
    validated. Expand from an engineer-level change gate to a portfolio of signed physical test requirements used
    across design teams and contract manufacturers.
solution: >-
  The product attaches a versioned thermal test pack to a hardware program, recording the geometry cases,
  cooling and load boundary conditions, and temperature limits approved by its design lead. For each CAD revision,
  a physics-aware diff selects the test cases affected by changed geometry or inputs; if the change cannot be
  mapped confidently, it requests a broader solver run rather than silently skipping a case. The product runs
  those cases through the customer's chosen solver and returns the measured margin delta, solver provenance, and
  a pass/fail record inside the design-review workflow. The initial release focuses on thermal checks for one CAD
  and solver stack, with other physics added only when validated test packs exist.
goToMarketSeed:
  firstCustomer: A power-electronics engineering team with recurring PCB or enclosure revisions, an existing thermal-simulation workflow, and a named simulation engineer who is a bottleneck for routine design reviews.
  buyingTrigger: A thermal design review or prototype cycle where engineers need evidence that the latest geometry change has not crossed a customer-approved temperature limit.
  currentAlternative: Specialist-configured runs in commercial computational fluid dynamics or finite-element simulation software, supplemented by manual comparisons between design revisions.
  switchingReason: The test pack preserves approved physical cases across revisions and gives each changed CAD model a traceable pass/fail result, rather than relying on ad hoc solver requests and manually assembled comparisons.
  pricingHypothesis: Annual subscription per hardware program and solver connection, with a usage tier for automated regression runs.
