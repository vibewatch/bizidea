differentiator: >-
  The product's core is not another solver or a dashboard over simulation output: it compiles engineer-approved
  physical cases into revision-specific tests and makes the result a design-review decision artifact. Change-aware
  test selection and explicit escalation when a changed feature cannot be mapped safely help teams increase
  simulation frequency without representing an uncertain shortcut as a valid pass.
conceptDiagram:
  title: CAD change to thermal release check
  mermaid: |
    flowchart LR
      Engineer["Hardware design engineer"] --> Revision["New CAD revision"]
      Revision --> Diff["Physics-aware geometry diff"]
      Cases["Approved thermal test pack"] --> Diff
      Diff --> Solver["Run affected cases in chosen solver"]
      Solver --> Evidence["Margin delta and solver provenance"]
      Evidence --> Gate["Pass or hold design review"]
businessModelCanvas:
  customerSegments:
    - Power-electronics hardware teams with recurring thermally constrained PCB or enclosure revisions.
    - Simulation leads maintaining reusable thermal analysis cases across product programs.
  valuePropositions:
    - Check each meaningful CAD revision against approved thermal cases before prototype commitment.
    - Produce traceable margin deltas and solver provenance without requiring a specialist to rebuild every routine test.
  channels:
    - Direct technical sales to hardware engineering and simulation leaders.
    - Referrals from CAD and solver implementation partners serving power-electronics teams.
  customerRelationships:
    - Engineer-led setup of the first test pack and design limits.
    - Ongoing software subscription with support for maintaining cases as product designs evolve.
  revenueStreams:
    - Annual subscription per hardware program and solver connection.
    - Usage tier for high-volume automated regression runs.
    - Paid setup and validation of initial customer test packs.
  keyResources:
    - Physics-aware CAD revision analysis and test-selection software.
    - Versioned thermal test cases and provenance records.
    - Engineering expertise in thermal analysis and solver workflows.
  keyActivities:
    - Map geometry and input changes to relevant approved test cases.
    - Execute solver runs and generate revision-specific evidence.
    - Validate test packs and escalation behavior with customer engineering teams.
  keyPartners:
    - CAD and solver vendors or implementation partners for supported workflows.
    - Power-electronics design teams providing approved test cases and acceptance limits.
    - Engineering services firms able to introduce the product during simulation-workflow modernization.
  costStructure:
    - Engineering development for CAD geometry parsing and solver-specific execution.
    - Technical onboarding and validation of customer test packs.
    - Secure compute, solver access, and enterprise sales.
jobsToBeDone:
  - job: When a thermal engineer submits a revised PCB or enclosure, help them check the changed design against approved physical limits, so they can approve the next prototype without waiting for an ad hoc specialist-run analysis.
    currentAlternative: Ask a simulation specialist to configure a commercial solver run and manually compare its results with the previous revision.
    successMetric: Median time from CAD revision submission to an auditable thermal pass or hold, plus the share of eligible revisions checked before design review.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      It turns high-fidelity solver work into versioned physical regression tests and a design-review gate, a
      different product mechanism from selling faster simulation runs or general CAD assistance. The historical
      index has a nearby neural-chip test bench, but that idea performs independent physical electrical tests on
      candidate components rather than continuous thermal checks against changing design revisions.
  venturePotential:
    score: 4
    rationale: >-
      A per-program subscription can recur as designs change and expand from thermal cases to other physics, but
      solver-stack coverage and repeat run frequency must be proven in customer deployments.
  whiteSpace:
    score: 4
    rationale: >-
      The history index has no physics-regression product, and revision-level test compilation differs from the
      incumbent solver capabilities named in triage; however, Cadence and Synopsys have strong positions and could
      extend their own AI simulation tools into this workflow.
  painIntensity:
    score: 3
    rationale: >-
      Triage reports that specialist-intensive setup and long runtimes cause intermittent simulation, but it does
      not quantify prototype delays, economic losses, or how often a changed design escapes analysis.
  wedgeClarity:
    score: 4
    rationale: >-
      Thermal checks on recurring CAD revisions create a bounded buyer, trigger, and deliverable, while supporting
      the first CAD and solver stack still narrows the initial serviceable market.
  evidenceFit:
    score: 3
    rationale: >-
      The cluster supports the workflow friction and reports faster production-scale solver claims, but it does
      not validate demand for regression gates or independently verify the claimed performance.
topRisks:
  - name: Solver trust
    description: Engineers may distrust selective test reruns if a geometry change could affect a case the change detector did not select.
    mitigation: Make selection and provenance inspectable, escalate uncertain changes to broader runs, and validate pass/hold results against specialist-reviewed cases.
  - name: Integration burden
    description: CAD and solver formats, customer boundaries, and approval practices may make each initial test pack expensive to configure.
    mitigation: Start with one CAD and solver combination and charge for setup until measured onboarding steps can be standardized.
  - name: Incumbent response
    description: Cadence or Synopsys could bundle revision-level checks into their existing simulation offerings and use existing design-tool distribution.
    mitigation: Prove a cross-revision evidence workflow that works across customer-selected solver stacks and preserves reusable test packs beyond a single vendor's tool.
