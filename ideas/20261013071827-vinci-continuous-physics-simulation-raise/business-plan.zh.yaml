slug: physics-change-test-gate
date: 2026-10-13
executiveSummary: >-
 打造一套贴近求解器的热回归关卡，把已批准的 PCB 和机箱热工况转成与版本关联的“通过/暂缓”证据，供样机决策前查验。首个滩头市场是反复修改热设计的电力电子团队：他们已有信任的求解器，却受制于专家配置。Ansys 和 Siemens 的资料都提到重复配置和版本分析工作，但现有证据既未证明客户需要单独的发布关卡，也未证明其付费意愿。首版产品复用客户的求解器和获许可的计算资源，先以影子模式运行；几何变更无法可靠匹配时，就扩大求解范围或请人复核，绝不悄悄跳过。更站得住脚的优势假设是可审计的测试包和审批流程，而不是更快的求解器；现有厂商已能自动化其中相当一部分，也可能把缺失流程打包进现有产品。市场测算只是运营方设定的情景：TAM 为 $300M、初始技术栈对应的 SAM 为 $45M、可获取 ARR 为 $1.8M，并非实测市场收入；买家数量、价格、可容忍的漏报程度和付费需求都尚未验证。种子前轮应先投入一个技术栈、历史版本验证和付费共创客户，再扩招以覆盖更多场景。在客户允许影子验证、签下付费试点，并确认预算和客户导入路径可重复之前，投资判断为 Watch。
problem:
  - "热设计人员分析 PCB 和机箱时，必须由专家配置几何、材料、边界条件、网格和求解流程；供应商虽提到自动化需求，却没有说明每次版本变更的经济成本。"
  - "仿真不会随着每次设计变更例行重跑，热裕度回归问题可能要到后续评审或样机阶段才被发现；这类遗漏的发生率和代价都没有量化。"
  - "现有求解器输出和人工版本对比，未必能留下获批且带版本记录的证据，说明检查过哪些工况，以及设计为何通过或暂缓。"
solution:
  - "为一个硬件项目保存带版本的热测试包：已批准的几何工况、材料、散热与负载边界条件、求解器来源信息，以及工程师认可的温度限值。"
  - "将每次提交的 CAD 版本与测试包对比，挑出受影响的工况，并调用客户已授权的求解器运行；若匹配置信度低，就要求扩大求解范围或请专家复核，不能悄悄跳过工况。"
  - "输出裕度变化和可审计的“通过/暂缓”记录，供设计评审使用；记录只辅助工程评审，不替代实物测试或产品安全认证。"
whyWeWin:
  - "产品以决策依据和可复用的已批准测试包为价值单元，不是再卖一款求解器或告警仪表盘。"
  - "把变更保守地映射到可检查的测试工况；一旦不确定就升级处理。这样或许能让重复检查更好用，又不用客户放弃信任的求解器。但选择逻辑和买家偏好仍未经证实。"
  - "客户专属的已验证工况、版本映射和设计评审记录，长期可能带来切换成本；但专有数据未必能汇集，持久护城河也尚未建立。"
strategicChoices:
  beachhead: "反复修改同一款热约束 PCB 或机箱设计的电力电子团队；他们已有热求解器，也有一位明确的仿真工程师成为设计评审的瓶颈。"
  wedgeRationale: "单一热变更关卡有明确的触发时机、负责人和证据产物。用历史版本做影子回放，比搭建通用仿真平台更快验证工况选择是否安全、决策是否提速；复用客户求解器，也就不用和求解器精度竞争或要求客户替换现有许可证。"
  sequencingRationale: "先打通一条常见的 CAD—求解器工作流，在影子模式下运行客户批准的工况；再用完整求解器基线和客户限值验证变更选择。只有技术和买家都签字认可后，才启用评审关卡、转化付费试点并标准化客户导入流程。在导入流程可重复、订阅转化有依据之前，坚持创始人主导销售和小型工程团队；工况验证交给顾问或实验室，不要急着扩展物理领域。"
  notYet:
    - "在一条端到端连接、已授权的执行路径和经验证的测试包可重复运行之前，不要支持多种 CAD 和求解器技术栈。"
    - "付费客户明确提出需求且已有已验证工况前，暂不做振动、电磁学、汽车、飞机、卫星或广义多物理场。"
    - "不要替换求解器、宣称获得监管认证、取消必需的样机测试，也不要在客户批准验证范围前自动拦截发布。"
    - "完成出口管制、数据访问和安全要求评估前，暂不承接国防及受控技术项目，也不做跨境云端执行。"
market:
  tam: "$300M/年，仅为示意情景：全球 10,000 个项目，每项目每年 $30,000；项目数和价格都是运营方假设，并非实测市场收入。"
  sam: "$45M/年，仅为示意情景：假设北美和欧洲有 1,500 个项目适配一条 CAD/求解器工作流，每项目每年 $30,000；适配筛选条件尚未验证。"
  som: "按五年可达规模情景测算，年度经常性收入为 $1.8M：60 份合同，每年每份 $30,000；这不是预测，前提是需求、重复使用和集成能力都得到验证。"
  segments:
    - "主要客群：持续修改热约束 PCB 或机箱、已有求解器工作流的电力电子硬件团队。"
    - "次要客群：负责在多个关联产品项目间维护可复用热工况的仿真负责人；主要用例能重复跑通后再拓展。"
  buyingProcess: >-
    热设计工程师或仿真负责人发现设计评审或样机放行临近；工程副总裁或硬件设计总监可能是经济买家，仿真、安全/IT 和产品保证团队则会审查求解器访问权限与证据边界。研究中没有找到买家侧合同、采购路径或直接价格证据，因此必须在客户访谈中确认付费试点审批流程和采购周期。
product:
  mvp: >-
    为一组选定的 CAD/求解器组合交付由客户控制的运行器，包含带版本的热测试包、版本对比、调用客户已获许可的求解器运行受影响工况，以及带完整溯源信息的裕度和“通过/暂缓”结果。先以影子模式运行，由人工审批；匹配不确定时升级为完整运行。评估目标客户后，再选定首个支持的技术栈。
  sixMonth: "完成至少一条端到端连接和一个客户测试包；用信任的完整求解器基线回放至少 100 个历史版本，并争取拿下一个付费共创客户试点。这些是经营目标，不代表当前已有进展。"
  twelveMonth: "客户签字认可验证范围后，为首个技术栈提供可用于评审的影子工作流或有限拦截工作流；在增加第二条连接前，先证明客户重复使用、付费试点转化，并量出配置和维护投入。"
  twentyFourMonth: "在已验证的技术栈上，为更多项目标准化测试包和客户导入；只有经过评估的客户确有需要时才增加第二条 CAD/求解器连接；只有付费客户提供已批准工况和验收限值后，才考虑拓展新的物理领域。"
  keyBets:
    - "至少有一个目标团队愿意让变更感知型影子测试，与完整且可信的求解器运行结果对比。"
    - "选择器既能避免漏掉客户指定的关键回归，又能减少不必要的完整运行，或缩短产出可审计决策的时间。"
    - "工程负责人愿意为项目级工作流单独付费，而不是只用现有求解器许可证和内部工程工时。"
    - "由客户控制的执行模式能满足求解器许可证、知识产权（IP）、安全和出口筛查要求，同时不把客户导入成本推得过高。"
gtm:
  wedge: "创始人主导、工程师对工程师的付费试点，瞄准已排期的热设计评审或样机放行：先整理一套获批工况包，用历史变更做影子回放，再向设计负责人展示可追溯的裕度变化，之后才申请拦截实际提交的版本。"
  channels:
    - "面向有重复 PCB/机箱版本变更和已授权求解器的团队开展技术直销，目标联系人是热仿真负责人和硬件工程总监。"
    - "从热 CAE 顾问、专业分销商和求解器集成商获取引荐及实施转介；目前并不假设已有渠道关系。"
    - "验证一个技术栈后再考虑供应商集成；求解器和 CAD 厂商既可能成为伙伴，也可能是竞争对手。"
  funnelTargets: "前 90 天的规划目标，不是实测转化率：访谈 10 支合格团队，找到 3 个范围明确的影子试点候选客户，并争取至少 1 份付费共创客户承诺或有记录的采购路径。"
  pricing: "测试按硬件项目和求解器连接收费的年度订阅，并按自动运行量设阶梯，同时收取首次测试包配置费。每项目每年 $15,000–$30,000 是参考研究测算情景和敏感性案例提出的定价假设，并非已验证的付费意愿；先报固定范围的付费试点，测试包验证且客户重复使用后再转订阅。"
businessModel:
  revenueStreams:
    - "按硬件项目和支持的求解器连接收取年度软件订阅费。"
    - "自动回归运行量较大时，按用量档位收费。"
    - "首次测试包配置与验证收费；只有实测表明客户导入可重复后，才降低交付收入占比。"
  unitOfValue: "一个硬件项目的一套已批准热测试包，以及通过一条求解器连接完成的版本检查；计费口径是纳入检查的合格 CAD 版本数和实际执行的求解器运行次数。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "在已验证的客户账户内增加产品项目和版本检查量。"
    - "只有客户需求和账户评估证明集成成本合理时，才增加 CAD/求解器连接。"
    - "只有付费客户提供已验证工况、限值和可重复的验收流程后，才增加振动或电磁学领域。"
    - "付费转化可重复后，借助顾问或求解器集成商引荐，降低创始人主导获客的投入。"
strategyMap:
  northStarMetric: "在设计评审前，获得客户批准且可审计的“通过/暂缓”结果的合格热 CAD 版本占比；同时跟踪从提交版本到产出结果的中位耗时。"
  inputMetrics:
    - "用完整求解器基线回放的历史版本数，以及漏掉的客户指定关键回归数。"
    - "变更版本中，安全选出工况、升级为完整运行或转交专家复核的占比。"
    - "从提交版本到产出结果的中位耗时，以及评审前完成检查的合格版本占比。"
    - "配置和维护每套测试包所需的工程工时。"
    - "付费试点启动数、转为年度项目订阅的数量，以及月度重复使用情况。"
  moatsToBuild:
    - "客户批准并带版本记录的热工况、边界条件、限值和可追溯评审决策。"
    - "变更到测试工况映射及升级处理的实测记录，并与完整求解器运行结果和（如有）相关测量数据对照。"
    - "嵌入客户设计评审、并可跨已验证求解器连接使用的可信证据工作流。"
  killCriteria:
    - "如果 100 个版本的影子回放漏掉任何客户指定的关键热回归，就不要启用选择性拦截；整改一次后仍漏报，就放弃选择性关卡假设，只测试完整运行的来源追溯能力。"
    - "如果超过 50% 的合格版本需要升级为完整运行，且试点中的决策中位耗时没有至少缩短 30%，就重做或放弃选择性重跑切口。"
    - "如果前三套测试包中任一套在初次验证后配置超过 80 个工程工时，或每月维护超过 8 小时，就重新定价或收窄服务模式。"
    - "访谈十个合格团队、提出三份范围明确的试点方案后，若仍未获得年化项目金额至少 $15,000 的付费承诺或可信采购路径，就重新评估项目是否值得做。"
  mermaid: |
    flowchart LR
      Wedge["Thermal PCB/enclosure revisions"] --> MVP["Single-stack approved test pack"]
      MVP --> Proof["Shadow replay and paid-pilot evidence"]
      Proof --> Expansion["More programs on validated stack"]
investorMemo:
  verdict:
    call: "Watch"
    conviction: "偏低至中等：版本关卡机制足够具体，但付费意愿、客户对选择器的信任和可获取市场都未验证。"
    whyBelieve: "Ansys 和 Siemens 都提到专家配置和重复 PCB 分析工作；产品则把已批准工况和按版本记录的求解器来源信息，打包成独立的评审决策依据。"
    whyDoubt: "证据里没有客户访谈、签约试点、买家侧报价或可容忍的漏报程度；现有厂商已在自动化分析，而 $45M SAM 和 $1.8M SOM 也都只是假设。"
    nextDiligence: "找一位合格客户，用完整求解器基线对比至少 100 个历史版本；明确取得其对漏报/升级处理阈值的签字认可，并拿下有明确年度转化路径的付费试点。"
  firstCustomer:
    title: "反复修改 PCB/机箱版本的电力电子热设计团队"
    profile: "一家有明确仿真工程师、已有热求解器，并反复修改某个热约束项目的硬件制造商；研究尚未确定公司规模或项目数量。"
    trigger: "设计评审或样机放行临近，团队需要确认最新的几何、元件、负载或散热变更仍符合已批准的温度限值。"
    buyer: "工程副总裁或硬件设计总监"
    initialContract: "规划假设：先做范围固定的付费影子试点，费用通过买家访谈确定；验证后转为每项目、每条求解器连接每年 $15,000–$30,000 的订阅。该价格区间对应的付费意愿尚未验证。"
  mustBeTrue:
    - "访谈 10 个合格目标团队后，至少 3 个确认版本检查缺口反复出现；且至少 1 位买家签下年化项目金额至少 $15,000 的付费试点，或提供同等金额的采购路径文件。"
    - "针对至少 100 个客户批准的历史版本，与完整且可信的求解器基线对比，选择器漏掉的客户指定关键热回归为零；不确定的映射必须停止自动放行。"
    - "试点要么让至少一半的合格版本免于完整运行，要么把可审计决策的中位耗时缩短至少 30%；同时不能放宽客户批准的验证范围或样机测试流程。"
    - "前三套测试包每套配置耗时不超过 80 个工程工时，验证后每月维护不超过 8 小时。"
    - "逐户核验后，至少有 1,500 个适配的北美和欧洲项目；至少两个付费试点以每项目每年 $15,000 或更高的价格转为年度订阅。"
  diligenceQuestions:
    - "前十位合格买家使用哪些 CAD/ECAD/MCAD 与求解器组合？客户的许可证和 API 条款是否允许我们重复部署运行器？"
    - "历史版本数据中出现过哪些关键热回归？设计负责人在允许结果拦截评审前，能接受怎样的漏报率和升级为完整运行的比例？"
    - "谁掌握这道关卡的增量预算？它能替代哪些现有专家工时和样机成本？买家愿意在求解器许可证之外单独付费吗？"
    - "三套客户测试包能否在声明的工程工时阈值内完成部署和维护？还是每次实施本质上都是咨询项目？"
    - "客户托管的执行模式能否通过知识产权（IP）、安全和出口管制审查，同时保留可用的求解器来源信息和客户数据控制权？"
    - "即使现有厂商的公开资料没有提及，其工具是否已在客户实际工作流中提供等效的已批准测试包和发布关卡？"
operatingAssumptions:
  - assumption: "只要不确定的变更会触发完整运行，且产品能解释判断依据，仿真负责人就会允许影子模式下选择测试工况；未经客户批准，不启用选择性拦截。"
    basis: "research.yaml"
    validationTest: "为一位共创客户回放至少 100 个历史版本，与可信的完整求解器基线对比，覆盖几何、材料、负载和散热变更；请客户标出关键回归，并签字认可可接受的漏报和升级处理规则。"
    decisionImpact: "如果客户不信任选择性映射，或漏报仍然存在，就只提供完整运行的溯源和关卡管理，或直接停止；节省时间和机制新颖性的论点都会大幅削弱。"
  - assumption: "滩头市场至少有一种足够普遍的 CAD/求解器组合，能支持可重复的客户导入和由客户控制的求解器执行。"
    basis: "research.yaml"
    validationTest: "访谈 10 个合格团队，记录其技术栈、许可证和 API 限制；选定首条连接前，先建立经客户筛选的目标账户名单。"
    decisionImpact: "如果没有一种技术栈聚集出足够客户，就选一位共创客户使用的技术栈，并收窄市场和融资计划，而不是承诺广泛兼容。"
  - assumption: "尽管没有直接的付费意愿证据，目标买家仍愿意测试每项目每年 $15,000–$30,000 的价格和付费试点。"
    basis: "research.yaml"
    validationTest: "向至少 3 位合格买家提出范围明确的付费试点方案和年度转化价格；至少拿到一份付费承诺或有记录的采购路径，并确认预算负责人。"
    decisionImpact: "如果买家不愿在求解器席位或服务费之外另行付费，就收窄为服务驱动型产品、重设买家或价值指标，或在扩大规模前停止。"
  - assumption: "首批客户测试包最终能变成可重复部署的软件，而不是没有明确边界的热分析咨询项目。"
    basis: "运营方判断"
    validationTest: "在前 3 套测试包中记录配置工时、专家复核和月度维护投入，并与配置 80 小时、月维护 8 小时的阈值对照。"
    decisionImpact: "如果超过阈值，就聚焦更一致的设计类型、按服务收费，并推迟毛利和销售扩招目标。"
  - assumption: "18 个月、目标融资区间为 $2–4M 的种子前轮计划，足以完成一项安全集成、验证测试包并促成早期付费转化；源文件没有按成本拆分的经营模型。"
    basis: "运营方判断"
    validationTest: "融资前，自下而上测算招聘、求解器/许可证、客户托管基础设施、安全审查和试点支持成本，并与 18 个月里程碑计划核对。"
    decisionImpact: "如果验证后的计划需要更多资金或时间，就缩小范围或重设轮次与里程碑；不能把目标融资区间说成研究得出的资金需求。"
experimentRoadmap:
  - horizon: "0–90 天"
    experiment: "访谈 10 个合格的电力电子热设计和仿真团队；记录版本变更频率、当前评审流程、明确的买家、技术栈和采购路径。"
    hypothesis: "特定的版本检查缺口反复出现，频率足以对应一个独立预算负责人。"
    successMetric: "至少 3 个团队确认这一缺口，且至少 1 位买家提供付费试点承诺或有记录的采购路径。"
    owner: "CEO/创始人"
  - horizon: "0–90 天"
    experiment: "根据访谈绘制技术栈与集成地图，明确哪些账户适用，包括求解器许可证要求、CAD 版本访问权限和客户托管执行限制。"
    hypothesis: "一条受支持的 CAD 到求解器路径，能服务多个合格的滩头市场账户，且不依赖未经确认的许可证假设。"
    successMetric: "选定一条连接路径，至少有 3 个合格潜在客户使用该技术栈，并记录获授权的执行路径。"
    owner: "创始工程师"
  - horizon: "0–90 天"
    experiment: "对至少 100 个历史 CAD 版本进行选择器影子回放，并将选中的工况和结果与完整、可信的求解器基线对比。"
    hypothesis: "变更感知型选择既能避免漏掉关键回归，又能减少不必要的重跑或决策耗时。"
    successMetric: "不漏掉任何客户指定的关键热回归；量出升级处理比例，并在启用任何拦截关卡前取得客户对验证范围的签字认可。"
    owner: "创始热仿真工程师"
  - horizon: "3–6 个月"
    experiment: "部署由客户控制的运行器，记录 CAD 版本、输入、求解器版本、边界条件、结果和审核结论。"
    hypothesis: "可追溯的运行器能调用客户现有求解器许可证，并通过目标客户的安全和知识产权（IP）审查。"
    successMetric: "端到端复现一组已批准基线，保留可审计的溯源记录，并取得一位共创客户的书面技术/安全认可。"
    owner: "创始工程师"
  - horizon: "3–6 个月"
    experiment: "向合格买家提供范围固定的付费影子试点，并提出按年度、按项目转化的订阅方案。"
    hypothesis: "当工作流与即将到来的设计评审挂钩时，硬件工程买家愿意在求解器许可证之外单独出资。"
    successMetric: "至少拿到 1 份已签付费试点或有记录的采购路径，并确认预算负责人和年度转化价格。"
    owner: "CEO/创始人"
  - horizon: "6–12 个月"
    experiment: "在试点期间跟踪合格版本、升级为完整运行的比例、出结果耗时、设计评审使用情况和客户的样机测试边界。"
    hypothesis: "证据产物能在触发时点前进入评审并缩短决策耗时，同时不会被当成认证。"
    successMetric: "至少一半的合格版本免于完整运行，或结果中位耗时缩短 30%；设计负责人认可证据边界。"
    owner: "解决方案工程师"
  - horizon: "6–12 个月"
    experiment: "标准化前三套测试包部署，分别记录可复用工作和客户专属工作的配置、维护投入。"
    hypothesis: "客户导入和维护投入能降到服务负担较重的阈值以下，支撑经常性软件收入。"
    successMetric: "每套测试包配置不超过 80 小时，验证后每月维护不超过 8 小时；否则重设范围或价格。"
    owner: "创始热仿真工程师"
  - horizon: "12–18 个月"
    experiment: "至少拿到一个客户批准的结果和付费试点后，与一家热 CAE 顾问、分销商或求解器集成商测试转介合作。"
    hypothesis: "可信的实施伙伴能介绍合格团队，又不削弱技术验证或加深对供应商的依赖。"
    successMetric: "至少获得 2 个合格引荐和 1 个范围明确的试点机会；否则继续以直销为主。"
    owner: "CEO/创始人"
operations:
  - "通过客户控制或本地部署的运行器提交求解任务，调用客户已授权的软件；每次部署前核实供应商许可证、API 和版本条款。"
  - "在可审计的工况历史中记录几何、材料和边界条件输入、已批准限值、求解器版本、选择理由及审核人手动覆盖的决定，并为这些记录保留版本。"
  - "安排合格的热工程师复核，并与可信基线对比；映射不确定时，停止自动放行，改为完整运行或人工复核。"
  - "客户需要时，委托热顾问或合格实验室验证初始工况并关联实测数据；不要把软件说成认证机构。"
  - "执行前筛查客户数据访问和出口管制限制；仅按客户批准的权限与留存规则处理数据，完成评估前暂缓受限项目。"
team:
  - role: "创始工程师"
    startTiming: "第 0 个月"
    rationale: "为一条经客户筛选的技术栈搭建 CAD 版本接入、变更对比、已获许可的求解器编排、客户控制的执行、运行溯源和审计能力。"
  - role: "创始热仿真工程师"
    startTiming: "第 0 个月"
    rationale: "定义测试包格式和安全升级规则，复现客户基线，用完整运行验证工况选择，并与设计负责人确定限值和证据边界。"
  - role: "解决方案工程师"
    startTiming: "第 3–6 个月，选定共创客户和技术栈后"
    rationale: "配置并支持首批测试包，同时量出客户导入和维护投入；这个岗位应揭示服务负担，而不是掩盖它。"
  - role: "商务负责人"
    startTiming: "第 9–12 个月，且仅在拿下付费试点并跑通可重复的采购路径后"
    rationale: "推动已验证试点转化，并发展顾问/集成商引荐；采购流程或定价仍未经证实前，继续由创始人主导销售。"
milestones:
  - horizon: "0–12 个月"
    items:
      - "到第 90 天，完成 10 次合格买家/用户访谈；只有账户证据支持时才选择一条技术栈，并拿到付费试点承诺或有记录的采购路径。"
      - "截至第6个月，用选择器影子回放至少 100 个历史版本，与完整、可信的基线对比，并取得客户对验证范围的批准。"
      - "截至第6个月，展示一套由客户控制的端到端运行器，能追溯求解器运行，并在遇到不确定情况时升级处理；运行器还须通过安全/许可证审查。"
      - "截至第12个月，展示重复使用的试点、明确的预算负责人和转化方案，并提供决策耗时、升级处理比例及测试包维护投入的实测结果。"
  - horizon: "12–24 个月"
    items:
      - "至少将 2 个付费试点转为年度项目订阅，价格不低于经测试的 $15,000 年化下限；否则重新评估买家和定价假设。"
      - "扩张实施或招聘销售人员之前，先部署前三套测试包，并达到既定配置和月度维护工时阈值。"
      - "只有多个目标账户的合格需求明确，且许可证/安全路径审查通过后，才增加第二条 CAD/求解器连接。"
      - "只有直销试点建立证据，并证明工作流价值可供客户引用后，才争取由合作伙伴带来的试点机会。"
  - horizon: "24–36 个月"
    items:
      - "在已验证的客户项目和首个支持的技术栈内扩张，同时跟踪重复使用和年度订阅转化的经济性。"
      - "只有付费客户提供已批准工况、验收限值和验证计划后，才增加第二个物理领域；否则继续只做热领域。"
      - "扩招或进入更广泛的电子、汽车、航空航天或受控技术市场前，先根据合格账户名单重新评估可服务市场。"
risks:
  - risk: "几何到测试工况的选择器漏掉与物理相关的变更，导致回归问题悄悄通过，摧毁工程团队的信任。"
    likelihood: "High"
    impact: "High"
    mitigation: "先以影子模式运行，用完整且可信的运行结果对比至少 100 个版本，公开选择理由，不确定时停止自动放行，并在拦截评审前取得客户批准。"
  - risk: "客户专属的几何、材料、边界条件或评审政策，让每套测试包都变成定制咨询项目。"
    likelihood: "High"
    impact: "High"
    mitigation: "只支持一个技术栈和一种设计类型，首次配置收费，并量出三套测试包的工时；若配置超过 80 小时或每月维护超过 8 小时，就收窄范围或重新定价。"
  - risk: "Ansys、Siemens、Cadence 或资金充足的物理仿真平台，把带版本的测试包和发布关卡捆绑进现有工作流。"
    likelihood: "High"
    impact: "High"
    mitigation: "证明客户认可的证据价值和跨版本安全映射；技术与合同允许时保留可移植性；不要声称公开资料未提及就证明客户部署中没有该功能。"
  - risk: "买家更愿意用现有求解器席位、内部脚本、顾问、完整重跑或实物测试，因此没有单独预算。"
    likelihood: "High"
    impact: "High"
    mitigation: "扩大投入前必须拿到付费试点证据并找到明确的预算负责人；在客户访谈中量化当前工程和样机工作流，若 $15,000 年化底价遭拒就停止。"
  - risk: "知识产权（IP）、出口管制、安全或求解器许可证限制阻止云端处理，或让部署和采购成本高到不划算。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "先采用客户控制的执行方式，导入前确认许可证/API 权限和数据控制要求；受限或跨境项目完成审查前暂缓。"
  - risk: "客户把仿真通过误当成认证，或据此取消必需的实物测试。"
    likelihood: "Medium"
    impact: "High"
    mitigation: "明确适用与验证范围，保留假设和不确定性，让实物关联验证与认证各自独立，并要求产品保证团队复核。"
fundingAsk:
  round: "pre-seed"
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "规划目标，并非根据来源资料测算的成本：用 18 个月搭建并验证一条由客户控制的 CAD/求解器路径，回放历史版本，支持少量付费共创客户，验证测试包导入和年度转化，并覆盖早期热工程、软件、安全及试点支持投入。融资前应按招聘和部署预算自下而上核对这一金额区间。"
