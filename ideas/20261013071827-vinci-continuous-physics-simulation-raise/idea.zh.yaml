problem: >-
  硬件团队依赖仿真专家配置分析任务，前期设置繁重，仿真因此难以跟上每次设计改动，团队只能间歇使用。工程师改动布局或外壳后，团队可能要等到后续设计评审才重跑相关热分析；设计裕度的回退可能要到成本更高的原型阶段才暴露。报道指出了流程摩擦，但没有量化原型阶段后期的失败，也没有量化市场对自动回归门禁的需求。
targetUser:
  primary: 电力电子硬件团队中的热设计工程师，负责反复迭代 PCB 或外壳，并在设计评审前依赖专家运行求解器。
  secondary: 负责在整条硬件产品线上复用分析工况的仿真负责人。
  buyer: 有权为仿真软件和原型降本拨预算的工程副总裁或硬件设计总监。
startupThesis:
  nonObviousInsight: >-
    单次求解跑得更快，并不会自动把物理仿真带进设计闭环。团队还得明确几何变化后哪些项目必须重测，并把审批凭证绑定到准确的设计修订版。把这些测试打包成物理回归检查，可以将求解能力变成日常工程门禁，同时不必替换底层求解器。
  beachhead: >-
    首攻反复修改同一款热约束 PCB 或外壳的电力电子团队：工程师已有可信的热求解器，但仿真专家来不及为每个修订版手动配置任务。
  wedge: >-
    切口是一套带版本的热测试包：把选定的几何工况、冷却与负载边界条件、工程师批准的温度限值绑定到每个 CAD 修订版，并在设计评审前返回通过/失败结果及裕度变化。
  whyNowCatalyst: >-
    Vinci 宣布融资后将拓展物理领域和硬件类型，公司也称生产工程项目可在数分钟内完成分析。如果求解周转时间确如公司所称有所缩短，按修订版运行回归测试会更可行；不过，公开报道中的速度和精度说法尚未经过独立核实。
  ventureScalePath: >-
    先为一套 CAD 与求解器组合提供热回归检查，再把经客户验证的测试包复用于相关产品修订版，并逐步加入振动、电磁学等相邻物理领域。此后可从工程师级改动门禁，扩展为一组经签核的物理测试要求，供各设计团队和合同制造商使用。
solution: >-
  产品为每个硬件项目挂上一套带版本的热测试包，记录设计负责人批准的几何工况、冷却与负载边界条件及温度限值。每次 CAD 修订时，物理感知差异分析会挑出受几何或输入变化影响的测试；如果无法可靠判断改动对应哪些测试，产品会要求扩大求解范围，而不是悄悄跳过某个测试工况。随后，产品调用客户选定的求解器运行这些工况，并把测得的裕度变化、求解器溯源信息和通过/失败记录送入设计评审流程。首版只支持一套 CAD 与求解器技术栈的热检查；只有在测试包经过验证后，才会增加其他物理领域。
goToMarketSeed:
  firstCustomer: 电力电子工程团队，频繁修改 PCB 或外壳、已有热仿真流程，并有一位仿真工程师卡在日常设计评审的关键路径上。
  buyingTrigger: 一次热设计评审或原型周期——工程师需要证明最新几何改动没有突破客户批准的温度限值。
  currentAlternative: 由专家配置商业计算流体动力学或有限元仿真软件，再手动比较不同设计修订版的结果。
  switchingReason: 测试包能在不同修订版之间保留已批准的物理工况，并为每个发生变化的 CAD 模型提供可追溯的通过/失败结果，无须再临时请求求解或手动拼接对比结果。
  pricingHypothesis: 按硬件项目和求解器连接收取年度订阅费，并为自动回归运行提供按用量计费的档位。
whyNow:
  - point: SiliconANGLE 报道称，仿真配置依赖专家且耗时，导致硬件团队只能间歇性使用仿真；这为可重复的修订检查留下了流程切口。
    signalRefs:
      - 专家密集型仿真配置
    sourceRefs:
      - 3
  - point: Advent 称，Vinci 平台已用于生产工程项目，能在数分钟内分析量产级设计。公司声称的仿真周期若属实，可能让更频繁的检查变得可行。
    signalRefs:
      - 制造级仿真可在数分钟内完成的说法
    sourceRefs:
      - 1
  - point: Vinci 表示，新一轮融资将拓展平台支持的物理领域和硬件类型；报道还提到公司计划从热分析拓展到振动和电磁学。
    signalRefs:
      - 拓展至更多物理领域
    sourceRefs:
      - 1
      - 2
  - point: Cadence 和 Synopsys 已提供 AI 仿真工具，因此，能区分产品的应是修订级测试与审批流程，而不是又一个通用求解器方案。
    signalRefs:
      - 成熟工程软件厂商的竞争
    sourceRefs:
      - 2
differentiator: >-
  产品核心不是再造一个求解器，也不是给仿真结果套一层仪表盘；它把工程师批准的物理工况编译成针对具体修订版的测试，并把结果变成设计评审的决策凭证。按变化挑选测试，遇到无法安全映射的特征时明确升级处理，能让团队更频繁地仿真，而不会把不确定的捷径包装成有效通过。
conceptDiagram:
  title: 从 CAD 改动到热测试放行
  mermaid: |
    flowchart LR
      Engineer["Hardware design engineer"] --> Revision["New CAD revision"]
      Revision --> Diff["Physics-aware geometry diff"]
      Cases["Approved thermal test pack"] --> Diff
      Diff --> Solver["Run affected cases in chosen solver"]
      Solver --> Evidence["Margin delta and solver provenance"]
      Evidence --> Gate["Pass or hold design review"]
businessModelCanvas:
  customerSegments:
    - 反复修改受热约束 PCB 或外壳的电力电子硬件团队。
    - 在多个产品项目间维护可复用热分析工况的仿真负责人。
  valuePropositions:
    - 在投入原型前，检查每次有实质影响的 CAD 修订是否符合获批热工况。
    - 无须专家为每项常规测试重新搭建流程，也能生成可追溯的裕度变化和求解器溯源记录。
  channels:
    - 直接向硬件工程和仿真负责人开展技术销售。
    - 通过服务电力电子团队的 CAD 与求解器实施伙伴引荐客户。
  customerRelationships:
    - 由工程师主导配置首套测试包和设计限值。
    - 持续提供软件订阅，并协助随着产品设计演进维护测试工况。
  revenueStreams:
    - 按硬件项目和求解器连接收取年度订阅费。
    - 为高频自动回归运行提供按用量计费的档位。
    - 收取首批客户测试包的配置与验证费用。
  keyResources:
    - 具备物理感知能力的 CAD 修订分析和测试选择软件。
    - 带版本的热测试工况及溯源记录。
    - 热分析和求解器工作流方面的工程专长。
  keyActivities:
    - 将几何与输入变化映射到相关的已批准测试工况。
    - 运行求解器并生成针对具体修订版的凭证。
    - 与客户工程团队一起验证测试包和升级处理逻辑。
  keyPartners:
    - 支持产品所覆盖工作流的 CAD、求解器厂商或实施伙伴。
    - 提供已批准测试工况和验收限值的电力电子设计团队。
    - 能在仿真工作流现代化项目中引入产品的工程服务公司。
  costStructure:
    - 开发 CAD 几何解析和特定求解器执行功能。
    - 为客户配置测试包并完成验证。
    - 安全计算资源、求解器访问和企业销售。
jobsToBeDone:
  - job: 热设计工程师提交 PCB 或外壳修订版时，帮他们对照已批准的物理限值检查改动，让他们无须等待临时安排的专家分析，也能批准下一轮原型。
    currentAlternative: 请仿真专家配置商业求解器任务，再手动对比本次结果与上一修订版。
    successMetric: 从提交 CAD 修订版到拿到可审计的热测试通过或暂缓结论的中位时间，以及合格修订版在设计评审前完成检查的比例。
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      它把高保真求解工作改造成带版本的物理回归测试和设计评审门禁，产品机制不同于销售更快的仿真运行或通用 CAD 辅助工具。历史索引中虽有一个相近的神经芯片测试台，但那个创意会对候选芯片做独立的实物电气测试；本方案则针对不断变化的设计修订版持续执行热检查。
  venturePotential:
    score: 4
    rationale: >-
      设计持续变化，可以支撑按项目续费，并为从热工况拓展到其他物理领域留下空间；但求解器技术栈覆盖范围和客户实际重复运行频率仍须在部署中验证。
  whiteSpace:
    score: 4
    rationale: >-
      历史索引中没有物理回归测试产品，修订级测试编译也不同于初筛提到的现有厂商求解器能力。不过，Cadence 和 Synopsys 地位稳固，也可能把自家的 AI 仿真工具延伸到这套工作流。
  painIntensity:
    score: 3
    rationale: >-
      初筛信息称，专家密集型配置和漫长运行时间导致仿真只能间歇开展；但并未量化原型延误、经济损失，也未说明有多少设计改动未经分析便通过。
  wedgeClarity:
    score: 4
    rationale: >-
      针对反复修改的 CAD 设计做热检查，买方、触发场景和交付结果都很明确；但首期只支持一套 CAD 和求解器技术栈，也缩小了可服务市场。
  evidenceFit:
    score: 3
    rationale: >-
      本次信息聚类证实了流程摩擦，也提及制造级求解速度更快的说法；但尚未验证市场是否需要回归门禁，也未独立核实性能说法。
topRisks:
  - name: 求解器可信度
    description: 如果几何改动可能影响变更检测器未选中的工况，工程师可能不信任选择性重跑。
    mitigation: 让测试选择过程和溯源记录可检查；对不确定的改动升级为更大范围的运行，并用专家复核过的工况验证通过/暂缓结果。
  - name: 集成负担
    description: CAD 与求解器格式、客户边界条件和审批惯例，可能让每套初始测试包都很难配置、成本很高。
    mitigation: 先支持一套 CAD 与求解器组合；在量化并标准化客户导入步骤前，按配置工作收费。
  - name: 现有厂商反击
    description: Cadence 或 Synopsys 可能把修订级检查打包进现有仿真产品，并借助已有的设计工具分销渠道。
    mitigation: 证明跨修订版的凭证工作流可兼容客户自选的求解器技术栈，并让可复用测试包不受单一厂商工具限制。
