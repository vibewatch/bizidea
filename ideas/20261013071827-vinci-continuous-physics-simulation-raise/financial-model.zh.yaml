slug: physics-change-test-gate
date: "2026-10-13"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: 模型周期
    value: "M1 对应 2026-11；36 个月预测期于 2029-10 结束。"
    unit: calendar
    source: "business-plan.yaml date；模型时间安排属于运营规划惯例。"
  - id: A2
    name: 种子前轮期初现金
    value: "M1 开始前到账 $2,000,000；取商业计划中 $2–4M 种子前轮目标区间的下限；不计后续融资款。"
    unit: USD
    source: "business-plan.yaml.fundingAsk.targetFundingRangeUsd and round；这是融资规划目标，并非已测算成本或已承诺的融资额。"
  - id: A3
    name: 单个项目的年度经常性收入
    value: "每年 $25,000，覆盖一个硬件项目和一个求解器连接；取 BP 中未经验证的 $15,000–$30,000 定价假设的中点。"
    unit: USD/program-year
    source: "business-plan.yaml.gtm.pricing and research.yaml.market；研究明确指出，目前没有报价，也没有经验证的付费意愿。"
  - id: A4
    name: 基准情景付费项目启动数
    value: "M1–M11=0；M12=1；M15=1；M18=1；M21=1；M24=1；M26=1；M28=1；M30=1；M32=1；M34=1；M36=1；累计启动 11 次付费项目。"
    unit: "program subscriptions by model month"
    source: "business-plan.yaml milestones and gtm.funnelTargets；这是保守且未经验证的转化爬坡，不代表当前业务进展。"
  - id: A5
    name: 月度付费项目流失率
    value: "预计每月客户流失率为 1.0%；客户数按预期项目等值计算，因此可以是小数。"
    unit: "% monthly"
    source: "年度项目订阅的初创企业财务规划经验值；BP 和研究均没有流失数据。"
  - id: A6
    name: 订阅收入确认时点
    value: "Monthly revenueK = ((prior-month EOP customers × (1 − 1.0% churn)) + current-month EOP customers) ÷ 2 × $25K ÷ 12；新项目按月中开始处理；不计付费试点和设置费。"
    unit: formula
    source: "business-plan.yaml.businessModel and gtm.pricing；仅计经常性项目订阅收入，依据假设 A3–A5。"
  - id: A7
    name: 直接成本与毛利率
    value: "COGS 按订阅收入的 30% 计，运营费用前毛利率为 70%。"
    unit: "% revenue"
    source: "business-plan.yaml.businessModel.targetGrossMarginPct；支持、托管和外包验证的直接成本按 30% 估算，属于规划假设。"
  - id: A8
    name: 全职员工年度全口径现金薪酬
    value: "创始人/CEO $120K；创始工程师 $168K；创始热仿真工程师 $156K；解决方案工程师 $144K；商业负责人 $150K，均按全职岗位计。"
    unit: "USD/FTE-year"
    source: "本模型采用的初创企业财务经验值；商业计划（BP）和研究均未提供薪酬数据。金额为全口径现金薪酬，不含股权。"
  - id: A9
    name: 招聘顺序与稳定期团队规模
    value: "创始人/CEO、创始工程师和创始热仿真工程师于 M1 入职；选定技术栈和共创客户后，解决方案工程师于 M5 入职；启动两个年度项目后，商业负责人于 M19 入职；在客户导入流程可重复之前，截至 M36 不再招聘其他岗位。"
    unit: "FTE 和入职月份"
    source: "business-plan.yaml.team and strategicChoices.sequencingRationale；入职时间属于保守的运营假设，并保留单一技术栈、仅限热仿真的约束。"
  - id: A10
    name: 非薪酬类销售与市场费用
    value: "月支出：M1–M3 为 $3K；M4–M12 为 $5K；M13–M24 为 $7K；M25–M36 为 $9K。"
    unit: "USD thousands/month"
    source: "创始人主导技术销售、有限差旅及后续商业活动的初创企业财务规划经验值；BP 和研究均未提供验证证据，获客渠道和转化尚未得到验证。"
  - id: A11
    name: 非薪酬类研发费用
    value: "月支出：M1–M12 为 $15K；M13–M24 为 $16K；M25–M36 为 $19K。"
    unit: "USD thousands/month"
    source: "单一客户自控连接器、测试基础设施和外部热验证的初创企业财务规划经验值；范围依据 business-plan.yaml.product and operations。"
  - id: A12
    name: 非薪酬类行政管理费用
    value: "月支出：M1–M12 为 $8K；M13–M24 为 $9K；M25–M36 为 $10K。"
    unit: "USD thousands/month"
    source: "法律、安全、出口筛查、保险和会计费用的初创企业财务规划经验值；融资前需逐项自下而上验证。"
  - id: A13
    name: 现金流计算方式
    value: "M1 期初现金为 $2,000K；每月期末现金 = 上月现金 + EBITDA。模型不计资本开支、税费、债务偿付、营运资本变动，也不计种子前轮之后的融资。"
    unit: formula
    source: "business-plan.yaml.fundingAsk；因缺少资产负债表和现金转换数据，现金以 EBITDA 近似。"
  - id: A14
    name: 融资需求与资金分配
    value: "申请 $2.0M 种子前轮融资，覆盖 18 个月：用 12 个月达成证据里程碑，另留六个月缓冲；分配为工程 $1.0M、GTM $300K、G&A $200K、六个月现金缓冲 $500K。"
    unit: USD
    source: "business-plan.yaml.fundingAsk and milestones；金额取 $2–4M 规划区间下限，分配额为建模者估算。"
  - id: A15
    name: CAC 与 LTV 公式
    value: "Y3 CAC = ($108K 非薪酬类销售与市场费用 + $150K 商业负责人薪酬 + $120K CEO 薪酬的 25%) ÷ Y3 新增付费项目启动数 6 = $48K；平均客户存续期 = 1 ÷ 每月流失率 1.0% = 100 个月；LTV = 年度 ARPU $25K × 毛利率 70% × 100 ÷ 12。"
    unit: formula
    source: "依据假设 A3、A5、A7–A10 和 A4 推导；创始人销售投入占比是明确的规划经验值，CAC 并非实际观测值。"
  - id: A16
    name: 下行情景
    value: "年度项目价格 $15K；月度流失率 2%；仅在 M12、M20、M23、M30 和 M36 启动项目；所有固定成本和招聘安排维持基准情景。"
    unit: "scenario inputs"
    source: "business-plan.yaml.gtm.pricing lower bound, kill criteria, and research.yaml.researchCoverage.coverageGap；下行情景的转化和流失率均为压力测试假设。"
  - id: A17
    name: 上行情景
    value: "年度项目价格 $30K；月度流失率 0.5%；同样 11 个项目比基准情景各提前一个月启动；若测试包复用性提高，毛利率为 75%。"
    unit: "scenario inputs"
    source: "business-plan.yaml.gtm.pricing and research.yaml.market $30K sizing case；提前转化、更低流失率和 75% 毛利率均为未经验证的上行情景假设。"
  - id: A18
    name: 敏感性分析口径
    value: >-
      相对基准情景逐项测试：ARPU $15K/$25K/$30K；付费项目启动数为 5/11/11，按所列月度排期；流失率 2.0%/1.0%/0.5%；毛利率 55%/70%/75%；固定 GTM 预算下 CAC 为 $60K/$48K/$40K；商业负责人分别于 M15/M19/M25 入职。收入影响指 Y3 收入相对基准情景的变化，现金影响指 M36 期末现金相对基准情景的变化；所有情景的现金最低点均在 M36。
    unit: formula
    source: "business-plan.yaml.gtm.pricing 提供价格边界；其余上下行情景冲击均标注为套用于假设 A3–A13 的初创企业运营经验值。"
  - id: A19
    name: 保留的运营约束
    value: "仅使用一个通过认证的 CAD/求解器技术栈，仅限热仿真；求解器由客户控制并持证运行；客户批准前采用影子模式，异常时失败即关闭并升级处理；不假设拓展至更多物理仿真领域或受控技术。"
    unit: operating constraint
    source: "来源：business-plan.yaml.strategicChoices, product, operations, and risks；research.yaml.regulatoryTechnicalConstraints。"
  - id: A20
    name: 方向性运营指标
    value: "40 法则 = Y3 收入增长率 + Y3 EBITDA 利润率；烧钱倍数 = Y3 经营现金消耗 ÷ 净新增 ARR；人均收入 = Y3 收入 ÷ 平均 5 FTE。"
    unit: formula
    source: "依据本文件预测及假设 A3–A13、A15 推导；未套用成熟期 SaaS 基准。"
