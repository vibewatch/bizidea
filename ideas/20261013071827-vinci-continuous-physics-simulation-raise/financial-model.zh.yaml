modelSanity:
  - checkName: 收入引擎
    finding: "基准情景按每个已验证项目每年 $25K 收取订阅费；到 Y3 年末，预计付费项目数达到 9.89 个，确认 Y3 收入 $176.61K。"
  - checkName: 成立所需条件
    finding: "模型依赖一条由客户控制的求解器路径、一次经客户批准且关键回归问题零漏检的 100 次修订影子回放，以及商业负责人入职前至少启动两个付费项目。"
  - checkName: 模型失效条件
    finding: "若价格降至 $15K 下限、月度流失率为 2%，且只启动五个项目，则下行情景 Y3 收入降至 $43.69K；不计后续融资时，现金最低点将达到 -$1,065.71K。"
  - checkName: 下一轮融资验证
    finding: "$2M 种子前轮融资用于达成第 12 个月的证据里程碑，并留出六个月缓冲；但基准情景在 M26 现金转负，因此必须在缓冲耗尽前完成后续融资或削减成本。"
sanityChecks:
  ruleOf40: "Y3 收入增长率 178% 加 EBITDA 利润率 -606%，得到方向性 40 法则得分 -428%；业务尚未进入规模化阶段，运营状况离健康水平还很远。"
  burnMultiple: "Y3 经营现金消耗 ÷ 净新增 ARR = 8.3x；早期效率偏低，且订阅基数很小。"
  revenuePerFte: "Y3 收入 $176.61K ÷ 平均 5.0 FTE = 人均收入 $35.3K；业务尚未规模化，不宜拿成熟 SaaS 的基准作比较。"
  flags:
    - "$25K 基准订阅价格只是未经验证的 $15K–$30K 假设中点；没有客户访谈、已签试点、买方预算或实际转化率支撑这项预测。"
    - "不计后续融资，现金将在 M26 跌破零，并于 M36 降至 -$942.14K；六个月储备耗尽前必须新融资，或削减业务范围和招聘。"
    - "70% 毛利率假设测试包交付可以重复，尽管 BP 明确列出 80 小时设置和每月 8 小时维护阈值；若未达这些门槛，服务负担和直接成本都会更高。"
    - "选择性测试关卡仍以三项条件为前提：通过客户批准的 100 次修订影子验证、关键回归问题零漏检，以及全量运行须失败即关闭或升级人工处理；模型未假设获批前存在阻断式工作流。"
    - "现金以 EBITDA 代替，未计税费、资本开支、营运资本、种子前轮之后的融资以及试点/设置收入；实际流动性和总资金需求可能相差很大。"
