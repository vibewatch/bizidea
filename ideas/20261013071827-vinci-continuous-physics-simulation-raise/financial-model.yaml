slug: physics-change-test-gate
date: "2026-10-13"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: Model period
    value: "M1 is 2026-11; the 36-month forecast ends in 2029-10."
    unit: calendar
    source: "business-plan.yaml date; model timing is an operator planning convention."
  - id: A2
    name: Pre-seed opening cash
    value: "$2,000,000 funded before M1; lower end of the business plan's $2–4M pre-seed target range; no follow-on proceeds are included."
    unit: USD
    source: "business-plan.yaml.fundingAsk.targetFundingRangeUsd and round; this is a planning ask, not a costed or committed raise."
  - id: A3
    name: Annual recurring revenue per program
    value: "$25,000 per year for one hardware program and one solver connection; midpoint of the BP's unvalidated $15,000–$30,000 pricing hypothesis."
    unit: USD/program-year
    source: "business-plan.yaml.gtm.pricing and research.yaml.market; research explicitly reports no quoted price or verified willingness to pay."
  - id: A4
    name: Base gross paid-program starts
    value: "M1–M11=0; M12=1; M15=1; M18=1; M21=1; M24=1; M26=1; M28=1; M30=1; M32=1; M34=1; M36=1; 11 gross starts total."
    unit: "program subscriptions by model month"
    source: "business-plan.yaml milestones and gtm.funnelTargets; a conservative, unvalidated conversion ramp, not current traction."
  - id: A5
    name: Monthly paid-program churn
    value: "1.0% monthly expected logo churn; customer counts are expected program equivalents and can be fractional."
    unit: "% monthly"
    source: "Startup-finance planning heuristic for annual program subscriptions; no churn evidence exists in the BP or research."
  - id: A6
    name: Subscription revenue timing
    value: "Monthly revenueK = ((prior-month EOP customers × (1 − 1.0% churn)) + current-month EOP customers) ÷ 2 × $25K ÷ 12; new starts are treated as mid-month. Paid pilot and setup fees are excluded."
    unit: formula
    source: "business-plan.yaml.businessModel and gtm.pricing; recurring program subscription only, using assumptions A3–A5."
  - id: A7
    name: Direct cost and gross margin
    value: "COGS equals 30% of subscription revenue, yielding a 70% gross margin before operating expenses."
    unit: "% revenue"
    source: "business-plan.yaml.businessModel.targetGrossMarginPct; 30% direct support, hosting, and outsourced validation costs are a planning estimate."
  - id: A8
    name: Loaded annual cash compensation
    value: "Founder/CEO $120K; founding engineer $168K; founding thermal simulation engineer $156K; solutions engineer $144K; commercial lead $150K per full-time role."
    unit: "USD/FTE-year"
    source: "Startup-finance heuristic set for this model; neither BP nor research provides compensation data. Figures are fully loaded cash payroll, not equity."
  - id: A9
    name: Hiring sequence and steady-state team
    value: "Founder/CEO, founding engineer, and founding thermal simulation engineer start M1; solutions engineer starts M5 after stack/design-partner selection; commercial lead starts M19 after two annual-program starts; no additional hires through M36 pending repeatable onboarding."
    unit: "FTE and hire month"
    source: "business-plan.yaml.team and strategicChoices.sequencingRationale; start dates are conservative operating assumptions and preserve the one-stack, thermal-only constraint."
  - id: A10
    name: Non-payroll sales and marketing
    value: "Monthly spend: $3K in M1–M3; $5K in M4–M12; $7K in M13–M24; $9K in M25–M36."
    unit: "USD thousands/month"
    source: "Startup-finance planning heuristic for founder-led technical selling, limited travel, and later commercial activity; channels and conversion remain unproven in the BP/research."
  - id: A11
    name: Non-payroll research and development
    value: "Monthly spend: $15K in M1–M12; $16K in M13–M24; $19K in M25–M36."
    unit: "USD thousands/month"
    source: "Startup-finance planning heuristic for one customer-controlled connector, test infrastructure, and external thermal validation; scope follows business-plan.yaml.product and operations."
  - id: A12
    name: Non-payroll general and administrative
    value: "Monthly spend: $8K in M1–M12; $9K in M13–M24; $10K in M25–M36."
    unit: "USD thousands/month"
    source: "Startup-finance planning heuristic for legal, security, export screening, insurance, and accounting; needs bottom-up validation before fundraising."
  - id: A13
    name: Cash flow mechanics
    value: "M1 opening cash is $2,000K; monthly ending cash equals prior cash plus EBITDA. No capex, tax, debt service, working-capital movement, or financing after the pre-seed is modeled."
    unit: formula
    source: "business-plan.yaml.fundingAsk; cash is approximated by EBITDA because no balance-sheet or cash-conversion data was provided."
  - id: A14
    name: Funding ask and allocation
    value: "$2.0M pre-seed for 18 months: a 12-month evidence milestone plus six months of buffer; allocate $1.0M Engineering, $300K GTM, $200K G&A, and $500K six-month buffer."
    unit: USD
    source: "business-plan.yaml.fundingAsk and milestones; amount is the lower edge of the $2–4M planning band and allocations are modeler estimates."
  - id: A15
    name: CAC and LTV formulas
    value: "Y3 CAC = ($108K non-payroll S&M + $150K commercial-lead payroll + 25% of $120K CEO payroll) ÷ 6 Y3 gross starts = $48K; average life = 1 ÷ 1.0% monthly churn = 100 months; LTV = $25K annual ARPU × 70% gross margin × 100 ÷ 12."
    unit: formula
    source: "Derived from assumptions A3, A5, A7–A10 and A4; founder sales allocation is an explicit planning heuristic and CAC is not observed."
  - id: A16
    name: Downside scenario
    value: "Annual program price $15K; monthly churn 2%; starts only in M12, M20, M23, M30, and M36; all fixed costs and hiring stay at base."
    unit: "scenario inputs"
    source: "business-plan.yaml.gtm.pricing lower bound, kill criteria, and research.yaml.researchCoverage.coverageGap; downside conversion and churn are stress assumptions."
  - id: A17
    name: Upside scenario
    value: "Annual program price $30K; monthly churn 0.5%; the same 11 starts arrive one month earlier than base; gross margin is 75% if packs become more reusable."
    unit: "scenario inputs"
    source: "business-plan.yaml.gtm.pricing and research.yaml.market $30K sizing case; earlier conversion, lower churn, and 75% margin are unvalidated upside assumptions."
  - id: A18
    name: Sensitivity convention
    value: >-
      One-variable cases versus base: ARPU $15K/$25K/$30K; paid starts 5/11/11 with the monthly schedules shown;
      churn 2.0%/1.0%/0.5%; gross margin 55%/70%/75%; CAC $60K/$48K/$40K at a fixed GTM budget; and
      commercial-lead hire M15/M19/M25. Revenue impact is Y3 revenue change and cash impact is M36 ending-cash
      change versus base; M36 is the cash low point in all cases.
    unit: formula
    source: "Price bounds from business-plan.yaml.gtm.pricing; remaining downside/upside shocks are labeled startup-finance operating heuristics applied to assumptions A3–A13."
  - id: A19
    name: Preserved operating constraints
    value: "One qualified CAD/solver stack, thermal-only, customer-controlled licensed solver execution, shadow mode and fail-closed escalation before customer approval; no broad physics or controlled-technology expansion is assumed."
    unit: operating constraint
    source: "business-plan.yaml.strategicChoices, product, operations, and risks; research.yaml.regulatoryTechnicalConstraints."
  - id: A20
    name: Directional operating checks
    value: "Rule of 40 = Y3 revenue growth plus Y3 EBITDA margin; burn multiple = Y3 operating cash burn divided by net new ARR; revenue per FTE = Y3 revenue divided by 5 average FTE."
    unit: formula
    source: "Derived from the forecast in this file using assumptions A3–A13 and A15; no mature-stage SaaS benchmark is imposed."
