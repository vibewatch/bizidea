modelDiagram:
  title: "Unit economics flow"
  mermaid: |
    flowchart LR
      Revision["Approved CAD revision"] --> Selector["Fail-closed change-to-test map"]
      Selector --> Runner["Customer-licensed thermal solver"]
      Runner --> Evidence["Approved test-pack result"]
      Evidence --> Subscription["Program subscription"]
      Subscription --> GrossProfit["Gross profit after direct support"]
      GrossProfit --> Cash["Cash after operating burn"]
modelSanity:
  - checkName: Revenue engine
    finding: "The base case monetizes annual subscriptions per validated program at $25K and reaches 9.89 expected paying programs at Y3 close for $176.61K of recognized Y3 revenue."
  - checkName: Must go right
    finding: "The model depends on one customer-controlled solver path, a customer-approved 100-revision shadow replay with no missed critical regression, and at least two paid program starts before commercial hiring."
  - checkName: Model breaks if
    finding: "If only five starts arrive at the $15K price floor with 2% monthly churn, downside Y3 revenue falls to $43.69K and the no-follow-on cash low point reaches -$1,065.71K."
  - checkName: Next-round proof
    finding: "The $2M pre-seed funds a month-12 evidence milestone plus six months of buffer, but the base case turns cash-negative in M26 so a follow-on or cost reset is needed before the buffer is consumed."
sanityChecks:
  ruleOf40: "Y3 revenue growth 178% plus EBITDA margin -606% equals a directional Rule-of-40 score of -428%; the business is pre-scale and far below a healthy operating profile."
  burnMultiple: "8.3x Y3 operating cash burn divided by net new ARR; poor early efficiency, based on a very small subscription base."
  revenuePerFte: "Y3 revenue $176.61K divided by 5.0 average FTE = $35.3K per FTE; pre-scale and not a mature SaaS benchmark."
  flags:
    - "The $25K base subscription price is only a midpoint of an unvalidated $15K–$30K hypothesis; no customer interview, signed pilot, buyer budget, or observed conversion rate supports the forecast."
    - "Cash falls below zero in M26 and reaches -$942.14K in M36 without a follow-on; a new raise or scope and hiring cuts are needed before the six-month reserve is exhausted."
    - "The 70% gross margin assumes pack delivery becomes repeatable despite the BP's explicit 80-hour setup and 8-hour monthly maintenance thresholds; missed thresholds would make the service burden and direct costs higher."
    - "The selective test gate remains conditional on 100-revision customer-approved shadow validation, zero missed critical regressions, and fail-closed full-run or human escalation; no blocking workflow is assumed before approval."
    - "Cash uses EBITDA as a proxy and omits taxes, capex, working capital, financing after the pre-seed, and pilot/setup revenue; actual liquidity and total capital need may differ materially."
