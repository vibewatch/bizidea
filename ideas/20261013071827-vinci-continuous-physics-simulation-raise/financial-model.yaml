scenarios:
  downside:
    description: "The $15K annual price floor, slower paid conversion, and 2% monthly churn expose the funding risk while preserving base hiring and operating costs."
    y3RevenueK: 43.69
    y3EbitdaK: -1163.42
    cashLowPointK: -1065.71
    keyAssumptionChanges:
      - "Annual subscription price falls to $15K."
      - "Gross paid starts fall from 11 to 5 across the 36-month horizon."
      - "Monthly churn rises from 1% to 2%; hiring and fixed opex remain at base."
  base:
    description: "Base case uses the $25K annual program subscription, 11 staged starts, 1% monthly churn, 70% gross margin, and only conditional hires."
    y3RevenueK: 176.61
    y3EbitdaK: -1070.39
    cashLowPointK: -942.14
    keyAssumptionChanges:
      - "No scenario adjustment; reconciles to totals.y3."
  upside:
    description: "The upper-end $30K price, earlier starts, 0.5% monthly churn, and more reusable packs lift revenue but do not make the business profitable by Y3."
    y3RevenueK: 235.75
    y3EbitdaK: -1017.19
    cashLowPointK: -865.59
    keyAssumptionChanges:
      - "Annual subscription price rises to $30K."
      - "The same 11 starts arrive one month earlier."
      - "Monthly churn falls to 0.5% and gross margin reaches 75%."
