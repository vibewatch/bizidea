slug: robot-cell-safety-warranty
date: "2026-10-24"
executiveSummary: >-
  公司计划向美国第三方物流（3PL）仓库运营商销售一份由独立方见证、针对特定配置的自动移动机器人（AMR）单元验收记录；只有在条件具备时，才搭配持牌合作方提供的限额补救保障。首阶段聚焦一个站点、一家集成商、一种机器人型号，切入试点转量产交接——此时运营商必须验收该单元，并明确剩余补救责任由谁承担。本产品补充运行时控制、OEM 与集成商测试以及雇主义务；它既不是安全控制器，也不是认证。研究支持交接流程及相邻的评估和风险转移能力，但未找到 3PL 买家访谈、付费试点、保险报价、已承保保单或增量付费意愿的证据。FORT 所报告的部署和已宣布承诺仅能说明采用背景；不假设 FORT 合作关系或客户需求。研究估算的 TAM $50.3M、SAM $7.5M、五年 SOM $0.38M 是情景估值，依据宽泛的仓库数量以及未经验证的采用率、定价和份额假设，并非预测。前 12 个月应验证一家获授权的风险合作方、一份已签署的付费试点、客观的变更控制规则和现场交付成本，再考虑构建跨厂商软件或组建广泛销售团队。投资判断：在真实的 3PL 买家付费、且持牌合作方提供可审阅的单元级条款之前，维持观望；否则，风险转移切口和创业投资逻辑都尚未得到验证。
problem:
  - "仓库机器人交接同时涉及机器、软件与安全配置、现场布局、任务和人与机器的互动；全行业车队采用率上升，并不能证明具体单元已通过验收，也不能厘清剩余补救责任。"
  - "可替代方案包括集成商/OEM 测试文件、现场 EHS 审查、合同赔偿、保修和一般保险。研究未能证明保障缺口普遍存在、该缺口导致延误，或运营商为新保修产品预留预算。"
  - "配置变更会让验收记录过时；运营商、OEM、集成商和保险方之间的责任归属不清，也会让范围狭窄的补救索赔主张难以裁定。"
solution:
  - "交接时，为单个单元商定明确的运行边界，并现场见证一组既有验收测试；记录机器人和软件标识、地图/布局、任务、安全措施、测试结果、除外事项、签字方和维护义务。"
  - "提供签署并带版本号的证据包和重大变更日志。发生约定变更后，暂停资格，直至重新评估；初期手动导出证据，不假设各厂商 APIs 都能通用。"
  - "只有在适当授权的保险公司、保修义务方或管理方提供保障，书面条款获批且约定测试通过后，才提供有上限的补救保障。证据包不替代运行时安全措施、工程签字、认证或雇主义务。"
whyWeWin:
  - "差异化交易的核心，是以单元级、经见证的运行边界作为获得有限经济追偿的资格条件，而不是单独提供评估；检索到的公开产品页面没有展示完全相同的组合，但现有证据也不能证明它具有独家性。"
  - "它把现场交接记录与明确的保障限额、除外责任和变更触发条件连接起来；评估方、OEMs、集成商、保险公司和经纪商已经掌握相邻环节，也可以打包提供替代方案。"
  - "经许可反复积累的测试、配置变更、补救成本和已裁定的索赔主张及其结果，或可改善承保和续保决策。但这种护城河在启动时并不存在，还需要合作方开放数据并取得客户同意。"
strategicChoices:
  beachhead: "美国 3PL 仓库运营商在单一站点验收首个量产 AMR 部署；运营商有内部 EHS 或自动化负责人，并已签约集成商。"
  wedgeRationale: "试点转量产交接是一项具体、获标准认可的集成流程，参与方明确，也有预算决策。先限定一种型号和一个站点，才能验证见证流程、配置身份和索赔主张条款；需求或承保方尚未验证前，铺开车队平台只会扩大集成范围。"
  sequencingRationale: "接受首单服务占比高、扩张较慢的现实，因为每个单元都需要独立见证，也需要风险合作方愿意界定合规且针对具体配置的保障。先访谈买家并检查真实验收文件，同时取得持牌合作方条款并完成法律审查。随后手动交付一个付费的单元试点，测量交付成本和变更处理情况。只有付费使用证明有重复需求后，才自动化证据采集；首个保障和续保流程跑通后，再增加集成商或第二种机器人型号。"
  notYet:
    - "在 3PL 产品获得一项已付费、已承保的参考部署并完成具体司法辖区审查前，不进入国防、建筑、美国以外市场或一般工业机器人单元市场。"
    - "不开发运行时控制、车队遥测、通用 API 层或认证产品；这些要么重复现有系统，要么暗示证据并不支持的安全保证。"
    - "初期补救承诺不涵盖人身伤害、一般责任或无上限的运营中断；严格限定事故、限额、除外责任、因果关系和索赔主张处理及理赔权限。"
    - "没有签署正式协议前，不把 FORT 或任何具名保险公司/MGA、评估方、OEM、集成商或经纪商视为合作伙伴。"
market:
  tam: "$50.3M 年化情景；以全部仓库为代理口径，并非经过测量的品类规模"
  sam: "$7.5M 年化 3PL 滩头市场情景；3PL 占比 15% 和 AMR 采用率均为假设"
  som: "$0.38M 年化五年情景；按建模 SAM 的 5% 计算，并非收入预测"
  segments:
    - "正在部署 AMR 单元并验收量产交接的美国 3PL 仓库运营商"
    - "希望提供风险范围明确、由独立方见证的交接方案的 AMR 系统集成商"
  buyingProcess: "自动化或 EHS 负责人会与集成商确定验收证据；COO 或运营副总裁很可能掌握部署预算，企业风险、保险、法务、OEM 和集成商也会影响审批。最明确的触发点是试点转量产交接或多站点上线，但没有公开招标记录可查，也没有找到买家访谈或要求购买该产品的现行合同；买家需求主张仍未得到验证。"
product:
  mvp: "面向单一站点、单一 AMR 型号和单一集成商的手动证据流程：商定边界明确的测试规程，见证既有验收测试，记录配置和除外事项，并签发带版本号的记录。未经授权合作方批准书面条款、完成适用的法律审查且满足资格标准前，不附加任何保障。"
  sixMonth: "完成买家和合作方访谈，对照一个站点现有验收文件进行演练，并商定测试/证据模板；在宣传任何兜底保障前，争取取得书面且可审阅的保障意向。"
  twelveMonth: "若各项门槛通过，交付一个到两个付费单元试点，由合作方签发或管理保障，跟踪变更触发条件，记录索赔主张的理赔边界，并核算实际人工和差旅成本。使用安全的手动上传或导出，不依赖 API 接入。"
  twentyFourMonth: "若试点成功承保并转化，将同一 3PL 的少量单元标准化，统一证据和年度审查流程；只有配置字段和合作方条款仍具可比性时，才增加第二种机器人型号。"
  keyBets:
    - "量产交接会暴露出买家认可且有预算支持的剩余补救问题，而现有合同和保险尚未解决它。"
    - "尽管 AMR 损失数据有限，持牌合作方仍会为有上限、针对具体配置的承诺提供承保，并明确索赔主张的归因和变更后的暂停规则。"
    - "独立评估方能够生成可跨系统使用的证据，同时不损害独立性，也不妨碍其查看安全配置。"
    - "重复的手动交付最终可标准化，支持合作方分销，并把成熟期毛利率推至 70% 以上；早期现场工作可能达不到这一目标。"
gtm:
  wedge: "在量产放行前，向运营商销售一次付费、经见证的验收与保障决策服务；先直接服务一家 3PL 及其集成商，报价或承诺保障前先引入持牌风险合作方。"
  channels:
    - "由创始人直接联系近期有 AMR 交接计划的美国 3PL 自动化、EHS、运营和风险负责人；提出试点前，先核实其验收文件和预算负责人。"
    - "与一家同意参与的 AMR 集成商合作，获取现场准入和客户交接引荐；先把它作为测试渠道，而非已签约的分销关系。"
    - "由持牌专业保险公司、MGA、保修管理方和经纪商负责产品条款、承保、安排、续保、索赔主张处理和理赔职责；销售前核实其授权及州级要求。"
    - "由独立工业安全评估方见证测试，并通过合同确保其独立于安装集成商。"
  funnelTargets: "规划假设，不是实际转化：接触 12 家符合条件的 3PL 交接客户，拿下 3 个付费单元试点（25%），并将至少 2 个转为有保障的量产单元（3 个试点中）；目标期限为 12 个月。单独报告买家支付的验证费用与合作方定价的保障费用。"
  pricing: "每个单元收取一次性现场调试和证据验证费；仅在合同和州法律允许时，另收年度单元保障费。持牌合作方设定并保留或管理风险保费；任何创业公司佣金/管理费都必须采用获授权的结构。研究中的每单元每年 $15,000 只是市场测算占位值，并非报价或已验证的付费意愿；取得书面合作方条款并测试买家意愿后，再为试点定价。"
businessModel:
  revenueStreams:
    - "由运营商或签约集成商支付的单元级现场调试与证据验证费。"
    - "每个有保障单元每年收取的证据维护和重新评估费，与合作方保费分开。"
    - "只有合作方协议和司法辖区规则允许时，才收取合作方支付的技术或管理收入。"
  unitOfValue: "一个量产单元年度：配置记录为最新且已签署，完成所有规定的重新评估，并另行明确有效的合作方补救保障限额。"
  targetGrossMarginPct: 70
  expansionLevers:
    - "评估工时和重新评估触发条件变得可重复后，在同一站点增加单元。"
    - "首位客户续约后，将已验证的集成商引荐转为 3PL 多站点交接。"
    - "只有索赔主张记录、理赔结果和变更记录证明风险具有可比性后，才增加年度证据/变更管理费及经合作方批准的第二型号保障。"
strategyMap:
  northStarMetric: "配置证据为最新且合作方确认条款仍有效的有保障量产单元年；没有已承保保障的测试记录不得计作有保障单元。"
  inputMetrics:
    - "已识别预算负责人、站点、集成商和机器人型号的合格 3PL 交接机会数。"
    - "获接受的付费试点报价，以及独立记录的验证收入与合作方保费。"
    - "配置标识齐全、除外事项已签署且资格获合作方批准的试点单元占比。"
    - "每单元评估人员工时和差旅成本中位数、从交接到验收决策的耗时，以及重大变更后的重新评估周转时间。"
    - "试点转量产转化率、年度续约率、合作方报价转承保率，以及有争议或被除外的索赔主张。"
  moatsToBuild:
    - "经许可积累配置、变更、风险暴露、补救成本和索赔主张及理赔结果的纵向数据，改善合作方承保；启动时并不存在专有损失数据集。"
    - "与可信的独立评估方和持牌风险合作方建立关系，并形成可重复的测试标准和合同条款。"
    - "建立厂商中立、可审计的变更历史记录，供运营商和合作方重复使用，但须取得客户同意并获得厂商数据访问权限。"
  killCriteria:
    - "截至第6个月，在接洽至少 3 家合格持牌风险合作方后，若仍没有合作方提供书面、可审阅的意向说明，列明义务承担方、承保补救事件、限额、除外责任、保费计算依据、变更触发条件和索赔主张处理权限，就停止销售风险转移切口。"
    - "截至第12个月，在完成至少 15 次合格买家沟通并发出 3 份报价后，若支付包含增量保障之试点费用的运营商不足 2 家，或没有运营商单独为兜底保障付费，就不要扩大销售或软件投入。"
    - "前 5 个单元交付后，若现场交付耗时中位数超过每单元 3 个工程师工作日，或直接交付成本导致毛利率低于 50%，且没有签约的合作方交付替代方案，就应在拓展渠道前重做方案或停止。"
    - "在进入种子轮规模扩张前，若客户/集成商安装数据无法证明美国 3PL 滩头市场每年有至少 100 次单元交接，就不要把当前代理估算说成足以支撑风险投资规模的市场。"
  mermaid: |
    flowchart LR
      Handover[3PL AMR handover] --> Witness[Witness one cell envelope]
      Witness --> Record[Versioned proof and change rules]
      Record --> Partner[Licensed partner binds capped cover]
      Partner --> PaidProof[Paid production cell and claim data]
      PaidProof --> Repeat[Repeat via proven integrator]
investorMemo:
  verdict:
    call: "观望"
    conviction: "对可验证的交易设计只有偏低至中等信心；买家需求、风险承接能力和市场深度仍未验证。"
    whyBelieve: "A3 的移动机器人集成指南、成熟的评估服务以及相邻的技术风险产品，说明这些组成流程已经存在；但检索到的公开资料中没有展示这套从测试到保障的完整产品组合。"
    whyDoubt: "尚无证据表明买家愿意为兜底保障付费；现有做法可能已经够用，现有厂商也能打包提供替代方案。$7.5M SAM 仍是高度依赖假设的情景估值，并非已验证市场。"
    nextDiligence: "在调整投资判断前，要求拿到一份已签署的 3PL 付费试点，以及持牌合作方针对具体单元和索赔主张边界出具的书面、可依法审阅的保障条款。"
  firstCustomer:
    title: "验收首个量产 AMR 单元的美国 3PL"
    profile: "一家美国第三方物流运营商有一个仓库，正把集成商安装的 AMR 系统从试点转为常规班次运行；运营商有内部 EHS 或自动化负责人，也指定了风险审批人。"
    trigger: "正式验收试点转量产，或批准多站点部署；在系统投入常规运营、且交接文件明确补救责任之前启动。"
    buyer: "运营副总裁或仓库 COO；在访谈中确认实际预算负责人。"
    initialContract: "规划目标：单元试点的服务与保障年化总价值接近 $15,000；仅用于测试的等值范围为 $10,000–$20,000。研究中的 $15,000 只是测算占位值，并非报价。只有合作方签发的条款正式承保后，才转为单元年度续约；创业公司的验证费须与风险保费分开。"
  mustBeTrue:
    - "前 15 家合格 3PL 买家中至少有 2 家会为包含增量补救保障的试点付费，而不是只要求免费评估，或继续依赖现有赔偿承诺和保险。"
    - "至少一家获得适当授权的风险合作方，会为具名 AMR 单元提供书面、可承保条款，明确承保事故、赔付上限、除外责任、索赔主张处理权限和重大变更后的暂停规则。"
    - "一家运营商和一家集成商能够提供界定可重复运行边界所需的标识和测试证据，无须通用 API 接入，也不依赖对方不愿分享的专有数据。"
    - "独立见证能带来 OEM/集成商、OMRON、UL、SICK 或现有厂商中的保险公司无法以更低总成本打包提供、且仍能赢得买家信任的结果。"
    - "经核实的交接数量和每单元允许取得的收入，足以支撑一个可重复经营、规模超过当前代理估算所能证明的美国 3PL 市场，而不依赖未经验证的相邻行业。"
  diligenceQuestions:
    - "目标运营商实际遭遇或预算过哪些具体补救损失？现有哪项保修、赔偿承诺或保单已经能够赔付？"
    - "谁有权签署运行边界？集成商能提供哪些现有验收文件和配置标识？"
    - "哪家持牌义务承担方会签订承诺，承保什么事故和限额？谁决定除外责任、准备金、索赔主张、理赔和代位追偿？"
    - "产品在首发的每个州将如何分类并获得授权？谁可以招揽、管理并收取费用？"
    - "美国 3PL AMR 每年交接多少单元？能否从运营商或集成商记录中核实，而不是从人口普查局的仓库企业数推算？"
    - "集成商、保险公司或评估机构能否以更低成本复制该方案？买家为什么要再增加一家独立供应商？"
operatingAssumptions:
  - assumption: "3PL 风险或运营买家会在交接时为有上限的补救保障额外付费；AMR 普及和 FORT 融资公告都不能证明这一点。"
    basis: research.yaml
    validationTest: "访谈 12–15 位自动化、EHS、运营和风险买家；检查两份近期验收文件及保险清单；发出三份报价，并要求获得付费试点或记录明确的拒绝理由。"
    decisionImpact: "若买家只看重评估，就放弃以保障为核心的论点，重新评估规模更小的服务业务，而不是搭建保险平台。"
  - assumption: "持牌风险合作方能够在美国首发州合法且合算地承保所提议的单元级补救承诺。"
    basis: research.yaml
    validationTest: "取得具名、获授权义务承担方出具的书面意向，涵盖事故、限额、除外责任、保费计算依据、变更触发条件、索赔主张处理权限，并完成州别法律审查。"
    decisionImpact: "没有可审阅的条款，就不报价，也不暗示已有保障；暂停风险转移产品，并决定单独收费的调试服务是否值得继续投入。"
  - assumption: "一家集成商和一种 AMR 型号能提供足够配置数据，在不接入 API 的情况下建立可审计、独立的运行边界。"
    basis: research.yaml
    validationTest: "将见证站点的机器人/软件 IDs、地图、任务、安全措施、测试和变更历史，与现有 SAT/EHS/OEM 文件逐项比对；记录缺失字段和权限限制。"
    decisionImpact: "若无法访问必要字段，就进一步收窄保障的配置范围或停止；不要假设通用数据连接器能解决问题。"
  - assumption: "研究测算使用的每单元每年 $15,000 占位值，可作为服务与保障打包定价的访谈锚点，但不是已确立的价格。"
    basis: research.yaml
    validationTest: "比较三份由运营商付费的报价与合作方书面保费/费用报价，并分别记录买家对见证、管理和风险保障的付费意愿。"
    decisionImpact: "若实际价格无法覆盖合作方风险成本和现场交付成本，就缩小保障范围或退出；不要把该占位值留在收入预测中。"
  - assumption: "标准化流程和合作方交付能让早期服务占比较高的试点毛利率逐步接近 70%。"
    basis: 运营方判断
    validationTest: "跟踪前五个单元的评估工时、差旅、法律/管理负担和合作方分成；用实际发票重算贡献毛利。"
    decisionImpact: "若现场投入仍然很高，且没有合作方承担交付，就维持小规模经营或停止，不要急着组建全国销售团队。"
experimentRoadmap:
  - horizon: 0–90 天
    experiment: "与 12–15 位美国 3PL 自动化、EHS、运营和风险买家进行结构化访谈；获准后检查最近两份验收文件。"
    hypothesis: "交接或索赔主张的责任分配存在实质缺口，且有明确预算负责人；现有赔偿承诺、保修和保险并未妥善解决。"
    successMetric: "至少 5 位买家指出同一个尚未解决的补救决策，3 位接受付费试点报价；证据能区分他们对服务费和保障的兴趣。"
    owner: 创始人/CEO
  - horizon: 0–90 天
    experiment: "向至少 3 家持牌专业风险合作方介绍一项边界明确的 AMR 单元保障方案，并取得书面意向，而非口头兴趣。"
    hypothesis: "合作方愿意考虑将补救事故与经见证、针对具体配置的测试通过结果挂钩，并设置可执行的变更触发条件。"
    successMetric: "至少一份书面意向列明获授权义务承担方、事故、限额、除外责任、保费计算依据、索赔主张处理权限和待解决的州法问题。"
    owner: 创始人/合作拓展负责人及外部保险律师
  - horizon: 0–90 天
    experiment: "在一家同意参与的集成商处，用手动导出资料和独立评估方审查，根据其真实调试及 EHS 文件试跑证据规程。"
    hypothesis: "无需替代规定的签字流程，也不依赖未经支持的厂商 API，就能见证并记录单元运行边界。"
    successMetric: "生成一份已签署样例记录，列明机器人/软件、站点/任务、安全措施、测试结果、除外事项和重大变更规则；记录缺失字段及现场工时。"
    owner: 签约的独立评估方和创始工程师
  - horizon: 3–6 个月
    experiment: "仅在合作方和法律门槛通过后，向一家 3PL 提供付费单元试点；在一个站点与一家集成商、一种机器人型号合作。"
    hypothesis: "量产放行前，运营商愿意同时为验证服务和真正承保、范围有限的补救兜底付费。"
    successMetric: "签署一份付费试点合同，取得合作方签发的保障条款和有记录的买家批准，并测出评估成本及交接耗时基线。"
    owner: 创始人/CEO 和评估负责人
  - horizon: 6–12 个月
    experiment: "在试点单元获批的软件、地图、任务或安全措施发生变更后，实际运行重大变更流程。"
    hypothesis: "运营商与合作方能够一致判定保障何时暂停，以及需要哪些证据才能恢复资格。"
    successMetric: "所有约定的重大变更都在恢复保障运营前被识别并审查；记录重新评估耗时、争议和成本。"
    owner: 评估负责人、运营商 EHS 负责人及合作方索赔主张/理赔联系人
  - horizon: 6–18 个月
    experiment: "首个付费试点完成后，与另一家集成商或经纪商测试引荐流程；比较合作方引荐和创始人直销的获客投入。"
    hypothesis: "交接方案能提升集成商差异化，同时不会增加不可接受的责任；持牌合作方也能通过获授权渠道安排保障。"
    successMetric: "签订一项书面引荐/安排协议并获得两个合格商机；在任一渠道带来已付费且已承保的单元前，不招聘渠道团队。"
    owner: 创始人/合作拓展负责人
  - horizon: 12–18 个月
    experiment: "根据运营商和集成商部署记录，重新统计美国 3PL 单元年数量，并与人口普查局口径的代理估算比较。"
    hypothesis: "滩头市场每年交接量足以支撑聚焦型业务，或者当前建模的 $7.5M SAM 明显高估了可触达需求。"
    successMetric: "记录设施/安装总量、年度交接率、符合条件的单元数量、确认的价格范围，并决定扩大、收窄或停止。"
    owner: 创始人/CEO 和商业分析师
operations:
  - "采用书面测试规程、评估方独立性规则、签字权限、配置模式、除外事项和变更触发矩阵；保留运营商现有的工程与 EHS 审批。"
  - "每份报价都须经过具名持牌义务承担方和司法辖区审查。合作方负责承保、保单或保修条款、索赔主张处理权限，以及所需的保险销售/管理授权。"
  - "分别签约并记录验证收入、合作方保费和任何获授权的管理费；保障正式承保前不得宣传附条件的保障。"
  - "在访问控制、保留期限和审计日志保护下存储客户批准的证据与版本历史；初期使用安全的手动文件传输，避免接入安全关键型运行时系统。"
  - "续约或发生重大变更后，由运营商和合作方确认资格；索赔主张和理赔交由合作方处理，并清楚保留因果关系、除外事项及现有合同救济措施的记录。"
team:
  - role: 创始人/CEO，企业销售与风险合作
    startTiming: 第 0 个月
    rationale: "负责买家访谈、付费试点签约、保险公司/MGA 尽调和决策门槛；不假设已有分销渠道或 FORT 关系。"
  - role: 创始工程师，证据流程
    startTiming: 第 0 个月
    rationale: "只有在手动流程得到验证后，才构建安全、可审计的配置记录和变更日志；暂缓车队 APIs 和运行时产品开发。"
  - role: 独立 AMR 安全评估网络
    startTiming: 第 0 个月，按项目签约
    rationale: "提供合格的现场见证测试，同时保持独立于安装集成商；招聘大型现场团队前，先使用外部交付能力。"
  - role: 保险监管与合同律师
    startTiming: 第 0 个月，外部顾问
    rationale: "在提供任何保障方案前，审查州别分类、授权、保单/保修条款、责任、索赔主张与理赔以及收费结构。"
  - role: 现场评估负责人
    startTiming: 第 4–6 个月，且仅在付费试点和合作方意向明确后
    rationale: "标准化现场交付和变更后重新评估；实际现场工时和单位经济模型明朗前，延后正式招聘。"
milestones:
  - horizon: 0–12 个月
    items:
      - "访谈 12–15 位目标买家并检查两份验收文件；记录实际预算负责人、现有做法，以及付费与免费需求的差别。"
      - "在提供保障前，取得一份书面、可审阅的合作方意向，并确认首发州的法律路径。"
      - "完成一个由合作方支持的付费单元试点，分别测量测试完整度、交接耗时、现场投入、买家支付的验证费和合作方保费。"
      - "执行第 6 个月合作方门槛和第 12 个月付费试点止损标准；不得用 FORT 所报告的部署替代客户验证。"
  - horizon: 12–24 个月
    items:
      - "若首个试点成功承保并续约，运营 5–10 个有保障的量产单元，分布在不超过三个 3PL 站点，并记录重大变更和索赔主张及理赔结果。"
      - "建立两项能持续带来业务的集成商或经纪商引荐关系；只有交付流程和付费转化可重复后，才增加现场团队。"
      - "核实客户/集成商交接数量及每单元实际定价，并与研究中的 $7.5M SAM 情景对照，再决定是否批准第二种型号。"
  - horizon: 24–36 个月
    items:
      - "只有承保率、续约率、索赔主张和理赔边界及贡献毛利均支持时，才以美国 3PL 滩头市场 15–25 个有效有保障单元年为目标。"
      - "首种型号的重新验证流程可重复且合作方条款稳定后，再增加第二种机器人型号；拓展其他行业前，须取得新的买家、市场和监管证据。"
      - "若已核实的市场规模或交付经济性仍未达到既定门槛，就停止扩张并决定改为仅提供服务或关停，而不是宣称已具备风险投资规模。"
risks:
  - risk: "持牌风险合作方拒绝承接风险、施加会抹去产品价值的除外责任，或无法在首发州授权拟议结构。"
    likelihood: High
    impact: High
    mitigation: "产品开发前向多家合格合作方索取书面条款；聘请专业律师，且在获授权义务承担方正式承保前，不销售或描述保障。"
  - risk: "3PL 买家依靠集成商赔偿、OEM 保修、EHS 审查和现有保险，不愿为单独的兜底保障付费。"
    likelihood: High
    impact: High
    mitigation: "检查真实交接文件，提交有价格的方案，分别衡量买家为保障和评估支付费用的意愿；若付费试点未达到门槛，就停止。"
  - risk: "索赔主张无法归因于承保范围内、可测试的偏差，或现有合同引发因果关系、代位追偿和除外责任争议。"
    likelihood: Medium
    impact: High
    mitigation: "试点前与合作方明确界定补救事故、限额、证据要求、变更暂停规则和索赔主张处理权限；初期排除人身伤害和一般责任。"
  - risk: "软件、任务、地图、布局、安全措施、维护或人员配置发生变化，使原运行边界过时，或导致他人不安全地依赖此前的测试通过结果。"
    likelihood: Medium
    impact: High
    mitigation: "为标识和变更日志保留版本记录；约定的重大变更发生时暂停资格并要求重新评估，明确说明测试通过既非认证，也不保证运营安全。"
  - risk: "服务持续依赖大量人工和差旅，而建模的 3PL 市场不足以支撑独立创业公司。"
    likelihood: High
    impact: High
    mitigation: "跟踪每单元实际成本，并用运营商/集成商数据核实交接量；只有重复交付和市场证据经测量站得住脚，才投入软件、招聘渠道团队或拓展相邻行业。"
  - risk: "OEM、集成商、成熟评估方或保险公司以更低获客成本或更可信的责任承接方式，打包提供相同方案。"
    likelihood: Medium
    impact: Medium
    mitigation: "尽可能与其合作，维护评估方独立性，并证明买家认可厂商中立记录和已承保的索赔主张受理与理赔流程；不能只靠新颖性取胜。"
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "运营方判断的规划范围，并非根据 FORT 已宣布的融资推算：用 18 个月完成保险/法律架构设计，开展一到三项付费单元试点，搭建最小化证据/变更记录流程，测算现场经济性，并验证可重复的 3PL 渠道。只有取得书面合作方条款和买家付费验证后，才扩大工程与销售投入。"
