selectionLens:
  championDimension: creativeNovelty
  championScore: 5
  whyThisWins: >-
    它把独立见证、针对具体配置的机器人单元安全验收，转成赔付封顶、由合作方支持的保障服务。卖的是风险共担交易，不是再造已在部署的运行时控制和车队安全层。
  acceptedTradeoff: >-
    我们接受首单需要大量服务投入、扩张较慢：每个单元都要独立测试，保险合作方也得先界定合规且针对具体配置的保障范围，承保才可能形成可重复的流程。
