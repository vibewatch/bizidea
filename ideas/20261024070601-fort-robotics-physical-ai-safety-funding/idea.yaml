      Proof --> Cover["Partner-backed capped warranty"]
      Cover --> Launch["Operator accepts deployment"]
businessModelCanvas:
  customerSegments:
    - U.S. third-party-logistics warehouse operators commissioning autonomous mobile robot cells
    - Robotics integrators seeking a differentiated, risk-bounded customer handover
    - Licensed commercial insurers or warranty administrators seeking testable robotics exposure
  valuePropositions:
    - Configuration-specific acceptance evidence paired with capped remediation cover
    - Explicit change and exclusion rules that prevent old test results from being treated as current after material changes
    - A resellable handover offer for robot integrators without replacing safety controls
  channels:
    - Direct sale to warehouse automation and EHS teams before pilot-to-production acceptance
    - Robotics integrators and OEM commissioning organizations
    - Commercial insurance brokers and industrial risk engineers
  customerRelationships:
    - On-site commissioning and witnessed test for the first cell
    - Annual coverage review and reassessment after material configuration changes
    - Partner-supported claims and remediation coordination
  revenueStreams:
    - Per-cell commissioning and verification fee
    - Partner-administered recurring fee per covered cell-year
    - Contracted distribution or administration revenue from licensed coverage partners
  keyResources:
    - Independent assessor network and repeatable cell-acceptance protocol
    - Licensed insurer, surety, or warranty-administration relationships
    - Configuration-bound test records and claims definitions
  keyActivities:
    - Define and witness scoped acceptance tests with operators and integrators
    - Maintain eligibility, exclusions, and reassessment rules for each cell
    - Coordinate licensed partners and remediation claims
  keyPartners:
    - Licensed commercial insurers or warranty administrators
    - Qualified industrial-safety assessors
    - Warehouse robotics OEMs and system integrators
    - Insurance brokers and industrial risk engineers
  costStructure:
    - On-site assessor time, travel, and test equipment
    - Insurance, warranty administration, legal, and claims-handling costs
    - Integrator onboarding and configuration-record maintenance
    - Partner distribution and customer acquisition
jobsToBeDone:
  - job: >-
      When accepting a new AMR cell from an integrator, help warehouse EHS and automation leads convert witnessed
      safety tests into limited financial recourse, so they can release the cell to production with defined conditions.
    currentAlternative: >-
      Review OEM or integrator safety files, conduct site EHS signoff, and rely on general insurance and negotiated
      indemnities for remaining exposure.
    successMetric: >-
      Time from integrator handover to production acceptance, with no material safety-test exception left unresolved
      and a documented coverage decision for the exact cell configuration.
  - job: >-
      When a covered robot cell changes software, task, or layout, help the operator's risk owner determine whether
      the original acceptance still applies, so they can avoid relying on stale proof.
    currentAlternative: >-
      Track changes through local engineering and EHS procedures and request case-by-case confirmation from the
      integrator or insurer.
    successMetric: >-
      Share of material changes reviewed before the changed cell returns to covered operation.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      The product makes a witnessed, configuration-bound robot-cell acceptance test the eligibility collateral for
      capped risk transfer, rather than selling another runtime controller, alert console, or generic compliance file.
  venturePotential:
    score: 4
    rationale: >-
      A per-cell offer could expand through integrators and multi-site fleets, but distribution and underwriting
      depend on licensed partners and repeatable loss definitions.
  whiteSpace:
    score: 4
    rationale: >-
      The concept occupies the gap between robot safety controls and general liability, though FORT is already an
      established specialist and industrial safety and insurance incumbents are adjacent.
  painIntensity:
    score: 4
    rationale: >-
      A warehouse operator's handover and residual safety exposure are high-consequence problems, but the selected
      sources do not quantify incidents or prove that this specific gap delays deployment.
  wedgeClarity:
    score: 4
    rationale: >-
      One robot model at one warehouse handover defines a concrete initial product, while acceptance authority and
      contract scope still require validation with the operator and insurer.
  evidenceFit:
    score: 3
    rationale: >-
      FORT's company-reported installed base, customers, and named warehouse opportunities support adoption context;
      the coverage mechanism, buyer demand, and willingness to pay remain hypotheses.
topRisks:
  - name: Insurer appetite and regulatory fit
    description: >-
      A licensed insurer may decline robotics exposure or the proposed warranty and distribution structure may
      trigger jurisdiction-specific insurance requirements.
    mitigation: >-
      Co-design a narrowly capped product with a licensed insurer or warranty administrator and obtain specialist
      regulatory review before offering coverage.
  - name: Unproven buyer demand
    description: >-
      The selected cluster contains no evidence that warehouse operators lack coverage or would pay for an additional
      acceptance-linked warranty.
    mitigation: >-
      Validate the handover bottleneck and willingness to pay through a paid, single-cell pilot with an operator,
      integrator, and risk partner before building a broad product.
  - name: Configuration drift and disputed claims
    description: >-
      Layout, task, software, or safeguarding changes can invalidate an acceptance record, while ambiguous loss
      causation could make capped coverage difficult to administer.
    mitigation: >-
      Define auditable configuration identifiers, explicit exclusions, change-triggered reassessment, and a short
      list of covered remediation events before binding each cell.
