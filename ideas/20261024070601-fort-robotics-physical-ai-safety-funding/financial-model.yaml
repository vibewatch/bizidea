slug: robot-cell-safety-warranty
date: "2026-10-24"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: Model period and timing
    value: "36 months, Oct 2026 through Sep 2029; Y1 is monthly and Y2-Y3 are quarterly"
    unit: calendar months
    source: "[business-plan.yaml date and requested three-year model format; model months M1-M12 run Oct 2026-Sep 2027, followed by eight quarters through Sep 2029]"
  - id: A1
    name: Pre-seed ask and planned runway
    value: "$2.4M at M1 within the business plan's $2-4M range; 18-month validation plan plus six-month contingency runway"
    unit: USD millions and months
    source: "[business-plan.yaml fundingAsk: $2-4M planning range and 18-month proof plan; model selects $2.4M as a planning case and allocates a six-month reserve; no existing cash or FORT financing is assumed]"
  - id: A2
    name: Gross paid-cell acquisition and pilot scope
    value: "0 opening customers; 1 paid cell in M6, then 1/1/1/2 gross wins in Y2 and 3/3/3/4 in Y3; 19 gross wins by M36"
    unit: gross paid cell wins
    source: "[business-plan.yaml product.sixMonth, product.twelveMonth, gtm.funnelTargets, milestones, and experimentRoadmap: one paid single-cell pilot by month 6, one to two pilots in year 1, 5-10 active covered cells across no more than three sites by months 12-24, and 15-25 by month 36 are targets rather than observed demand; later wins are a gated modeler ramp after the initial one-site/one-integrator/one-robot pilot]"
  - id: A3
    name: Venture-recognized service ARPU
    value: "$12.0K annualized company service revenue per active cell; partner-set remediation premium is excluded from venture revenue and is not assumed to be passed through"
    unit: USD thousands per active cell-year
    source: "[business-plan.yaml gtm.pricing, businessModel.revenueStreams, investorMemo.firstCustomer.initialContract, and research.yaml market.sam: $15K is only a combined service-and-cover sizing/validation anchor, not a quote; $12K company service revenue is a conservative modeler split, and no premium, commission, administration fee, or willingness-to-pay is verified]"
  - id: A4
    name: Customer retention and life
    value: "2.7778% monthly churn, equivalent to a 36-month expected life under a geometric churn proxy"
    unit: percent per month and months
    source: "[business-plan.yaml operatingAssumptions and investorMemo: no retention or renewal data exists; 36 months and reciprocal monthly churn are explicit startup-finance planning heuristics; fractional customersEop are expected active paid-cell equivalents, and newCustomers are gross wins]"
  - id: A5
    name: External direct delivery cost and gross margin
    value: "COGS is 70% of company revenue in Y1, 48% in Y2, and 42% in Y3; external-cost gross margins are 30%, 52%, and 58%"
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct and killCriteria: repeat delivery should ultimately exceed 70% and the first five cells should avoid sub-50% direct margin; rates are unvalidated modeler estimates for contracted independent witnessing, site travel, and partner or external review costs, with the first pilot deliberately services-heavy; salaried employee costs remain in salaryK and opexK]"
  - id: A6
    name: Hiring and loaded payroll
    value: "2 founders start M1; hire 1 field assessment lead in M7 only after the M6 paid-pilot gate; loaded annual compensation is $120K for CEO, $150K for founding engineer, and $120K for field lead; six-column FTE snapshots are 2, 2, 3, 3, 3, 3"
    unit: FTE and USD thousands per FTE-year
    source: "[business-plan.yaml team and strategicChoices.sequencingRationale: founders start at month 0 and the field lead is gated on paid use; loaded pay rates are labeled early-stage startup-finance heuristics, not sourced salary quotes; independent assessors and insurance counsel remain contractors and are not FTE]"
  - id: A7
    name: Non-payroll operating expense plan
    value: "Y1 monthly S&M $K: 2,2,3,3,4,4,4,5,5,6,6,7; R&D: 12,12,13,14,14,15,16,16,17,18,19,20; G&A: 18,18,18,20,22,24,18,18,20,20,22,24. Y2 quarterly S&M/R&D/G&A $K: 12/24/28, 15/26/28, 18/28/30, 20/30/32. Y3: 20/30/34, 22/32/36, 24/34/38, 26/36/40."
    unit: USD thousands per month in Y1 and per quarter in Y2-Y3
    source: "[business-plan.yaml product, operations, gtm.channels, team, and experimentRoadmap: planning budgets for lean evidence-workflow engineering, founder-led buyer/partner development, legal/regulatory preparation, secure handling, and company overhead; these are modeler estimates, not vendor quotes, and partner risk premiums are excluded]"
  - id: A8
    name: Fully loaded acquisition cost
    value: "Y3 CAC = ($92K non-payroll S&M + 35% of $120K CEO loaded pay) / 13 gross Y3 cell wins = $10.3077K per cell"
    unit: USD thousands per gross paid-cell win
    source: "[business-plan.yaml gtm.channels and sequencingRationale: founder-led sales continues without a dedicated sales hire; 35% CEO time allocation is a modeler assumption; Y3 S&M comes from A7 and gross wins from A2; CAC is allocated from modeled expenses, not an extra P&L charge]"
  - id: A9
    name: Scenario cases
    value: "Downside: $9.6K service ARPU and Y3 gross wins 3/3/2/3; base: $12K and 3/3/3/4; upside: $14.4K and 3/3/4/5; all cases retain the same headcount and non-payroll budget"
    unit: USD thousands per active cell-year and gross cell wins by quarter
    source: "[business-plan.yaml gtm.funnelTargets, product.twelveMonth, milestones, operatingAssumptions, and research.yaml coverageGap: price, partner capacity, and customer conversion are unvalidated; +/-20% ARPU and two fewer or additional Y3 wins are transparent modeler stress cases, not forecasts]"
  - id: A10
    name: Sensitivity shocks
    value: "ARPU +/-20% throughout; two fewer Y3 wins in Q3-Q4; monthly churn +1 percentage point; external gross margin -10 percentage points in each year; non-payroll S&M +25% throughout"
    unit: percent, percentage points, and cell wins
    source: "[business-plan.yaml top-level risks, killCriteria, strategicChoices.sequencingRationale, and operatingAssumptions identify price, sales-cycle, retention, partner/delivery-cost, and hiring uncertainty; shock sizes are modeler stress-test choices]"
  - id: A11
    name: Funding allocation and reserve
    value: "$840K Engineering (35%); $480K GTM and pilot delivery (20%); $480K G&A including legal/regulatory work (20%); $600K six-month buffer (25%); total $2.4M"
    unit: USD and percent of pre-seed
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary and operations: funding supports a minimal evidence workflow, one to three paid single-cell pilots, licensed-partner/legal structuring, independent witnessing, and a contingency reserve; category allocation is a modeler planning judgment, not an approved budget]"
  - id: A12
    name: Cash and accounting convention
    value: "Opening cash is $0; $2.4M arrives in M1; ending cash equals prior cash plus funding inflow plus EBITDA; no follow-on financing, taxes, working-capital movement, capital expenditure, debt service, partner premium, or unbound-cover revenue is modeled"
    unit: USD thousands and modeling convention
    source: "[business-plan.yaml fundingAsk and operatingAssumptions: no current cash, booked contract, bound cover, or financing is disclosed; customer pays the modeled service fee to the venture, while partner-priced risk premium is excluded; EBITDA is used as operating cash flow because other cash items are unquantified]"
