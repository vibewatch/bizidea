    - A1
    - A11
scenarios:
  downside:
    description: "A 20% lower service price and two fewer Y3 cell wins reduce revenue while the lean team and operating budget remain unchanged."
    y3RevenueK: 92.061069
    y3EbitdaK: -708.604580
    cashLowPointK: 216.343873
    keyAssumptionChanges:
      - "A9: annualized company service ARPU falls 20% to $9.6K."
      - "A9: two fewer Y3 gross wins are delivered, one fewer in Q3Y3 and Q4Y3."
      - "A9: staffing, partner premiums excluded from revenue, and non-payroll budgets remain at base."
  base:
    description: "The gated pilot-to-repeat plan reaches 15.3 expected active paid-cell equivalents at M36 on $12K service-only annualized ARPU."
    y3RevenueK: 120.954777
    y3EbitdaK: -691.846229
    cashLowPointK: 236.839337
    keyAssumptionChanges:
      - "A2-A8: one Y1 paid pilot, five Y2 wins, thirteen Y3 wins, 36-month life proxy, lean hiring, and modeled delivery and operating costs."
  upside:
    description: "A 20% higher service price and two additional late-Y3 cell wins improve revenue without adding permanent headcount."
    y3RevenueK: 152.199860
    y3EbitdaK: -673.724081
    cashLowPointK: 258.698599
    keyAssumptionChanges:
      - "A9: annualized company service ARPU rises 20% to $14.4K."
      - "A9: two additional wins arrive, one each in Q3Y3 and Q4Y3, with existing assessor capacity."
sensitivity:
  - variable: ARPU
    downsideCase: "$9.6K annualized company service revenue per cell (-20%) across the horizon."
    baseCase: "$12.0K annualized company service revenue per cell; partner premium excluded."
    upsideCase: "$14.4K annualized company service revenue per cell (+20%) across the horizon."
    y3RevenueImpactK: -24.190955
    cashImpactK: -17.767867
    assumptionRef: A10
  - variable: sales cycle
    downsideCase: "Two fewer Y3 gross wins, one fewer in Q3Y3 and Q4Y3."
    baseCase: "Three wins in each of Q1Y3-Q3Y3 and four in Q4Y3."
    upsideCase: "Two additional Y3 wins, one each in Q3Y3 and Q4Y3, with no added fixed spend."
    y3RevenueImpactK: -5.878440
    cashImpactK: -3.409495
    assumptionRef: A10
  - variable: churn
    downsideCase: "3.7778% monthly churn (+1 percentage point), applied to expected active cells."
    baseCase: "2.7778% monthly churn, equivalent to a 36-month expected life proxy."
    upsideCase: "1.7778% monthly churn (-1 percentage point)."
    y3RevenueImpactK: -6.955176
    cashImpactK: -4.868572
    assumptionRef: A10
  - variable: gross margin / independent-witness cost
    downsideCase: "External delivery gross margin falls 10 percentage points in each year to 20%/42%/48%."
    baseCase: "External delivery gross margin is 30%/52%/58% in Y1/Y2/Y3, before salaried employee costs."
    upsideCase: "External delivery gross margin rises 10 percentage points in each year to 40%/62%/68%."
    y3RevenueImpactK: 0.000000
    cashImpactK: -15.943577
