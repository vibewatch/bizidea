headcountBasis:
  assumptionRefs:
    - A6
  description: "Annualized payroll is snapshot FTE multiplied by role-specific loaded compensation; actual salaryK is 22.5K monthly for the two founders and 32.5K monthly after the field lead starts in M7; all employee payroll appears once in salaryK and is included in opexK. Contract assessors and counsel are non-FTE costs."
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
  customerDefinition: "customersEop is expected active paid-cell equivalents, not unique operator logos; newCustomers is the gross number of paid cell wins. The initial paid pilot is restricted to one 3PL site, one integrator, and one robot model; later cell additions are gated on pilot and partner evidence."
  formula: "For each month or quarter, revenueK equals average customersBop and customersEop multiplied by annualized service ARPU and divided by 12 or 4, respectively. Churn is applied to opening active cells; new wins are phased using the period midpoint convention."
  exclusion: "Only venture service revenue is modeled; partner-retained or separately paid remediation premiums and any unapproved commission/admin fee are excluded. No FORT partnership, customer demand, quote, or bound policy is assumed."
pnlMethodology:
  assumptionRefs:
    - A5
    - A6
    - A7
    - A12
  description: "cogsK is the year-specific external direct-delivery cost percentage; grossProfitK equals revenueK minus cogsK; salaryK is loaded employee payroll; opexK equals salaryK plus salesMarketingK, researchDevelopmentK, and generalAdministrativeK; ebitdaK equals grossProfitK minus opexK; cash rolls forward by funding inflow plus EBITDA. Reported gross margin excludes salaried delivery payroll, which remains in salaryK, so fully burdened contribution margin is lower."
