slug: robot-cell-safety-warranty
date: "2026-10-24"
executiveSummary: >-
  The company would sell U.S. third-party-logistics (3PL) warehouse operators an independently witnessed, configuration-specific acceptance record for an autonomous-mobile-robot (AMR) cell, paired only when available with a licensed partner's capped remediation cover. Start at one site, one integrator, and one robot model during pilot-to-production handover, when the operator must accept the cell and allocate residual remediation responsibility. The product complements runtime controls, OEM and integrator testing, and employer safety duties; it is neither a safety controller nor a certification. Research supports the handover workflow and adjacent assessment and risk-transfer capabilities, but found no 3PL buyer interview, paid pilot, insurer quote, bound policy, or proof of incremental willingness to pay. FORT's reported deployments and announced commitments support adoption context only; no FORT partnership or customer demand is assumed. The researched $50.3M TAM, $7.5M SAM, and $0.38M five-year SOM are scenario estimates built on broad warehouse counts and unverified adoption, pricing, and share assumptions, not forecasts. The first 12 months should validate an authorized risk partner, a signed paid pilot, objective change-control rules, and the cost of on-site delivery before building cross-vendor software or hiring a broad sales team. Investment view: Watch until a real 3PL pays and a licensed partner provides reviewable, cell-specific terms; otherwise the risk-transfer wedge and venture case remain unproven.
problem:
  - Warehouse robot handover combines the machine, software and safety configuration, site layout, task, and worker interactions; general fleet adoption does not establish that the exact cell has been accepted or that residual remediation responsibility is clear.
  - Integrator/OEM test files, site EHS review, contractual indemnities, warranties, and general insurance are the available substitutes. Research does not establish a consistent coverage gap, a delay caused by that gap, or an operator budget for a new warranty.
  - Configuration changes can stale an acceptance record, while attribution among operator, OEM, integrator, and insurer can make a narrowly defined remediation claim difficult to adjudicate.
solution:
  - At handover, agree a bounded operating envelope for one cell and witness a defined set of existing acceptance tests; record the robot and software identifiers, map/layout, task, safeguards, test results, exclusions, signatories, and maintenance obligations.
  - Provide a signed, versioned evidence package and a material-change log. Suspend eligibility after agreed changes until reassessment; begin with manual evidence exports rather than assuming universal vendor APIs.
  - Offer capped remediation cover only through an appropriately authorized insurer, warranty obligor, or administrator, and only after written terms and a passing agreed test. The package does not replace runtime safeguards, engineering signoff, certification, or employer duties.
whyWeWin:
  - The differentiated transaction is a witnessed, cell-specific envelope used as an eligibility condition for limited financial recourse, not the assessment alone; no fetched public product page showed this exact package, but the evidence does not prove it is exclusive.
  - It connects a site handover record to explicit coverage limits, exclusions, and change triggers; assessors, OEMs, integrators, insurers, and brokers already own adjacent pieces and could bundle a substitute.
  - Repeated permissioned test, configuration-change, remediation-cost, and adjudicated-claim data could improve underwriting and renewal decisions. That moat does not exist at launch and requires partner access and customer consent.
strategicChoices:
  beachhead: U.S. 3PL warehouse operators accepting a first production AMR deployment at one site, with an internal EHS or automation lead and a contracted integrator.
  wedgeRationale: Pilot-to-production handover is a concrete, standards-recognized integration workflow with named parties and a budget decision. One model/site makes witnessing, configuration identity, and claims wording testable; a broad fleet platform would add integration scope before demand or a carrier is proven.
  sequencingRationale: Accept a services-heavy first sale and slower scaling because each cell needs independent witnessing and a risk partner willing to define compliant, configuration-specific cover. First interview buyers and inspect actual acceptance files; in parallel obtain licensed-partner terms and legal review. Then run one paid, manual single-cell pilot and measure delivery cost and change handling. Automate only repeated evidence capture after paid use, and add integrators or a second robot model only after the first coverage and renewal process works.
  notYet:
    - Do not enter defense, construction, non-U.S. markets, or general industrial robot cells before the 3PL offer has a paid, bound reference deployment and jurisdiction-specific review.
    - Do not build runtime controls, fleet telemetry, a universal API layer, or a certification product; these duplicate established systems or imply safety assurance beyond the evidence.
    - Do not cover bodily injury, general liability, or unbounded operational interruption in the initial remediation promise; keep event, limit, exclusions, causation, and claims authority narrow.
    - Do not treat FORT, any named insurer/MGA, assessor, OEM, integrator, or broker as a partner without an executed agreement.
market:
  tam: "$50.3M annualized scenario; all-warehouse proxy, not a measured category"
  sam: "$7.5M annualized 3PL beachhead scenario; 15% 3PL share and AMR adoption are assumptions"
  som: "$0.38M annualized five-year scenario; 5% of modeled SAM, not a revenue forecast"
  segments:
    - U.S. 3PL warehouse operators commissioning AMR cells and accepting production handover
    - AMR system integrators seeking a risk-bounded, independently witnessed handover offer
  buyingProcess: "The automation or EHS lead defines acceptance evidence with the integrator; the COO or VP of operations likely controls deployment spend, while enterprise risk, insurance, legal, the OEM, and integrator influence approval. The clearest trigger is pilot-to-production handover or a multi-site go-live, but no public tender, buyer interview, or current contract requiring this product was found."
product:
  mvp: "A manual, one-site evidence workflow for one AMR model and integrator: agree a bounded test protocol, witness existing acceptance tests, capture configuration and exclusions, and issue a signed versioned record. Attach no coverage until an authorized partner has approved written terms, applicable legal review is complete, and eligibility criteria are met."
  sixMonth: "Complete buyer and partner discovery, a dry run against one site's existing acceptance file, and an agreed test/evidence template; seek a written, reviewable coverage indication before marketing any backstop."
  twelveMonth: "If gates pass, deliver one to two paid single-cell pilots with partner-issued or partner-administered cover, tracked change triggers, documented claims boundaries, and actual labor/travel cost. Use secure manual uploads or exports; do not depend on API access."
  twentyFourMonth: "If pilots bind and convert, standardize the evidence and annual review workflow across a small set of cells at the same or a second 3PL site, adding a second robot model only when configuration fields and partner terms remain comparable."
  keyBets:
    - A production handover exposes a buyer-recognized, fundable residual remediation problem that existing contracts and insurance do not already solve.
    - A licensed partner will bind a capped, configuration-specific promise on test evidence despite limited AMR loss data, and will define claims attribution and change suspension.
    - An independent assessor can create portable evidence without compromising independence or access to safety configuration.
    - Repeated manual delivery can be standardized enough to support partner distribution and a mature gross-margin goal above 70%; early site work may fall below that goal.
gtm:
  wedge: Sell the operator a paid, witnessed acceptance-and-coverage decision immediately before production release; start direct with one 3PL and its integrator, and include a licensed risk partner before quoting or promising cover.
  channels:
    - Founder-led direct outreach to U.S. 3PL automation, EHS, operations, and risk leaders with an upcoming AMR handover; validate their acceptance files and budget owner before proposing a pilot.
    - One consenting AMR integrator for site access and customer handover introductions; treat this as a test channel, not a signed distribution relationship.
    - Licensed specialty insurer, MGA, warranty administrator, and broker for product wording, underwriting, placement, renewal, and claims responsibilities; verify authority and state requirements before sale.
    - Independent industrial-safety assessors for witnessed tests, with independence from the installing integrator contractually preserved.
  funnelTargets: "Planning hypothesis, not observed conversion: engage 12 qualified 3PL handover accounts, win 3 paid single-cell pilots (25%), and convert at least 2 of 3 to covered production cells within 12 months; report buyer-paid verification separately from partner-priced coverage."
  pricing: "Charge a one-time per-cell verification fee plus an annual covered-cell fee only where contract and state law permit; the licensed partner sets and retains or administers the risk premium, and any venture commission/admin fee requires authorized structure. Research's $15,000 per cell-year is a market-sizing placeholder, not a quote or validated willingness-to-pay; price a pilot only after written partner terms and buyer testing."
businessModel:
  revenueStreams:
    - Per-cell, on-site commissioning and evidence-verification fee paid by the operator or contracting integrator.
    - Recurring annual evidence-maintenance and reassessment fee per covered cell, separate from any partner premium.
    - Partner-paid technology or administration revenue only if the licensed partner's agreement and jurisdictional rules allow it.
  unitOfValue: One production cell-year with a current, signed configuration record, completed required reassessments, and a separately defined active partner-backed remediation limit.
  targetGrossMarginPct: 70
  expansionLevers:
    - Add cells at the same site after assessment hours and reassessment triggers are repeatable.
    - Convert validated integrator referrals into multi-site 3PL handovers after a first customer renewal.
    - Add annual evidence/change-management fees and partner-approved second-model coverage only after claims and change records establish comparable risk.
strategyMap:
  northStarMetric: "Covered production cell-years with current configuration evidence and partner-confirmed active terms; do not count a test record without bound cover as a covered cell."
  inputMetrics:
    - Qualified 3PL handover opportunities with identified budget owner, site, integrator, and robot model.
    - Paid pilot offers accepted and independently recorded verification revenue versus partner premium.
    - Share of pilot cells with complete configuration identifiers, signed exclusions, and partner-approved eligibility.
    - Median assessor hours and travel cost per cell, time from handover to acceptance decision, and reassessment turnaround after a material change.
    - Pilot-to-production conversion, annual renewal, partner quote-to-bind rate, and disputed or excluded claims.
  moatsToBuild:
    - Permissioned longitudinal configuration, change, exposure, remediation-cost, and claim outcomes that improve partner underwriting; no proprietary loss dataset exists at launch.
    - Trusted independent assessor and licensed-risk-partner relationships with repeatable test criteria and contract language.
    - A vendor-neutral, auditable change-history record that operators and partners can reuse, subject to customer consent and vendor access.
  killCriteria:
    - By month 6, after approaching at least 3 qualified licensed risk partners, no partner provides a written, reviewable indication naming the obligor, covered remediation event, limit, exclusions, premium basis, change triggers, and claims authority; stop selling the cover wedge.
    - By month 12, after at least 15 qualified buyer discussions and 3 priced offers, fewer than 2 operators pay for a pilot that includes incremental coverage or no operator pays separately for the backstop; do not scale sales or software.
    - After the first 5 cells, median field delivery exceeds 3 engineer-days per cell or direct delivery cost leaves below 50% gross margin without a contracted partner-delivery alternative; redesign or stop before channel expansion.
    - Before a seed-scale expansion, customer/integrator installation data cannot substantiate at least 100 annual cell handovers in the U.S. 3PL beachhead; do not present the current proxy as a venture-scale market.
  mermaid: |
    flowchart LR
      Handover[3PL AMR handover] --> Witness[Witness one cell envelope]
      Witness --> Record[Versioned proof and change rules]
      Record --> Partner[Licensed partner binds capped cover]
      Partner --> PaidProof[Paid production cell and claim data]
      PaidProof --> Repeat[Repeat via proven integrator]
investorMemo:
  verdict:
    call: Watch
    conviction: "Low-to-moderate conviction in the testable transaction design; buyer demand, risk capacity, and market depth remain unverified."
    whyBelieve: "A3 mobile-robot integration guidance, established assessment services, and adjacent technology-risk products show that the component workflows exist, while the fetched public set did not show this exact test-to-cover package."
    whyDoubt: "No buyer has been shown to pay for the backstop, the status quo may be sufficient, incumbents can bundle it, and the $7.5M SAM is an assumption-heavy scenario rather than a verified market."
    nextDiligence: "Require one signed paid 3PL pilot plus a licensed partner's written, legally reviewable coverage terms for the exact cell and claims boundary before upgrading the verdict."
  firstCustomer:
    title: U.S. 3PL accepting a first production AMR cell
    profile: "A U.S. third-party-logistics operator has one warehouse moving an integrator-installed AMR system from pilot to routine shifts, with an internal EHS or automation lead and a named risk approver."
    trigger: "Formal pilot-to-production acceptance or multi-site rollout approval, before release to routine operations and before responsibility for remediation is fixed in handover documents."
    buyer: "VP of operations or warehouse COO; confirm the actual budget owner in discovery."
    initialContract: "Planning target: a paid single-cell pilot near $15,000 annualized service-and-cover value, with a $10,000–$20,000 equivalent range only for testing; research's $15,000 is a sizing placeholder, not a quote. Convert to a per-cell annual renewal only after partner-issued terms bind; separate the venture's verification fee from the risk premium."
  mustBeTrue:
    - "At least 2 of the first 15 qualified 3PL buyers will pay for a pilot containing incremental remediation cover, rather than only request a free assessment or rely on existing indemnity and insurance."
    - "At least one appropriately authorized risk partner will provide written, bindable terms for a named AMR cell, including an explicit covered event, cap, exclusions, claims authority, and material-change suspension."
    - "One operator and integrator can expose the identifiers and test evidence needed to define a reproducible envelope without universal API access or proprietary data they will not share."
    - "Independent witnessing adds an outcome the OEM/integrator, OMRON, UL, SICK, or an incumbent insurer cannot bundle at lower total cost while retaining buyer trust."
    - "Verified handover counts and permitted revenue per cell support a repeatable U.S. 3PL market larger than the current proxy can demonstrate, without relying on untested adjacent sectors."
  diligenceQuestions:
    - "What exact remediation loss has the target operator faced or budgeted for, and which current warranty, indemnity, or policy already responds?"
    - "Who has authority to sign the operating envelope, and what existing acceptance documents and configuration identifiers can the integrator provide?"
    - "Which licensed obligor will bind the promise, what event and limit will it cover, and who controls exclusions, reserves, claims, and subrogation?"
    - "How will the product be classified and authorized in each initial state, and who may solicit, administer, and receive fees?"
    - "What annual U.S. 3PL AMR handover count can be verified from operator or integrator records, rather than inferred from Census warehouse establishments?"
    - "Can an integrator, carrier, or assessment firm reproduce the offer more cheaply, and what reason would the buyer have to add a separate vendor?"
operatingAssumptions:
  - assumption: "A 3PL risk or operations buyer will pay incrementally for capped remediation cover at handover; general AMR adoption and the FORT funding announcement do not establish this."
    basis: research.yaml
    validationTest: "Interview 12–15 automation, EHS, operations, and risk buyers; inspect two recent acceptance files and insurance schedules; issue three priced offers and require a paid pilot or documented rejection."
    decisionImpact: "If buyers only value assessment, remove the cover-led thesis and re-underwrite a smaller service business rather than build an insurance platform."
  - assumption: "A licensed risk partner can legally and economically bind the proposed cell-specific remediation promise in the initial U.S. state."
    basis: research.yaml
    validationTest: "Obtain a written indication from a named authorized obligor covering event, limit, exclusions, premium basis, change triggers, claims authority, and state-specific counsel review."
    decisionImpact: "Without reviewable terms, do not quote or imply coverage; pause the risk-transfer product and decide whether paid commissioning alone merits further investment."
  - assumption: "One integrator and one AMR model will provide enough configuration data for an auditable, independent operating envelope without API integration."
    basis: research.yaml
    validationTest: "Compare a witnessed site's robot/software IDs, map, task, safeguards, tests, and change history with existing SAT/EHS/OEM files; record missing fields and permission limits."
    decisionImpact: "If required fields are inaccessible, narrow the covered configuration further or stop; do not assume a universal data connector will solve it."
  - assumption: "The research sizing placeholder of $15,000 per cell-year is a plausible discovery anchor for combined service and cover, not established pricing."
    basis: research.yaml
    validationTest: "Compare three operator-paid offers with a written partner premium/fee quote and record willingness to pay separately for witnessing, administration, and risk."
    decisionImpact: "If the realized price cannot cover partner risk cost and field delivery, reduce the covered scope or exit; do not preserve the placeholder in a revenue forecast."
  - assumption: "Standardized procedures and partner delivery can move gross margin toward 70% after early service-heavy pilots."
    basis: operator judgment
    validationTest: "Track assessor hours, travel, legal/admin burden, and partner share on the first five cells; recalculate contribution margin using actual invoices."
    decisionImpact: "If field effort remains high and no partner absorbs delivery, keep the company small or stop before hiring a national sales team."
experimentRoadmap:
  - horizon: 0–90 days
    experiment: "Run structured discovery with 12–15 U.S. 3PL automation, EHS, operations, and risk buyers; inspect the last two acceptance files where permission is granted."
    hypothesis: "A material handover/claims-allocation gap exists and has a named budget owner, rather than being adequately handled by existing indemnity, warranty, and insurance."
    successMetric: "At least 5 buyers identify the same unresolved remediation decision, 3 accept a priced pilot proposal, and evidence separates service-fee interest from coverage demand."
    owner: Founder/CEO
  - horizon: 0–90 days
    experiment: "Present one bounded AMR-cell coverage concept to at least 3 licensed specialty risk partners and obtain a written indication, not verbal interest."
    hypothesis: "A partner will consider a capped remediation event tied to a witnessed configuration-specific pass with enforceable change triggers."
    successMetric: "One written indication identifies authorized obligor, event, limit, exclusions, premium basis, claims authority, and open state-law issues."
    owner: Founder/partnerships lead with external insurance counsel
  - horizon: 0–90 days
    experiment: "Dry-run the evidence protocol against one consenting integrator's actual commissioning and EHS documents, using manual exports and independent assessor review."
    hypothesis: "The cell envelope can be witnessed and versioned without replacing required signoff or relying on an unsupported vendor API."
    successMetric: "One signed sample record identifies robot/software, site/task, safeguards, test results, exclusions, and a material-change rule; missing fields and field hours are logged."
    owner: Contracted independent assessor and founding engineer
  - horizon: 3–6 months
    experiment: "Offer a paid single-cell pilot to a 3PL only after partner and legal gates; run at one site with one integrator and one robot model."
    hypothesis: "The operator will pay for both verification and a genuinely bound, limited remediation backstop before production release."
    successMetric: "One executed paid pilot, partner-issued coverage terms, documented buyer approval, and a measured baseline for assessment cost and handover time."
    owner: Founder/CEO and assessment lead
  - horizon: 6–12 months
    experiment: "Exercise the material-change process after an approved software, map, task, or safeguard change at a pilot cell."
    hypothesis: "The operator and partner can consistently determine when coverage suspends and what evidence restores eligibility."
    successMetric: "All agreed material changes are identified and reviewed before return to covered operation; record reassessment time, disputes, and cost."
    owner: Assessment lead with operator EHS and partner claims contact
  - horizon: 6–18 months
    experiment: "Test a referral workflow with one additional integrator or broker after the first paid pilot; compare partner-sourced and founder-sourced acquisition effort."
    hypothesis: "The handover offer improves integrator differentiation without adding unacceptable liability, and licensed partners can place it through an authorized channel."
    successMetric: "One written referral/placement arrangement and two qualified opportunities; no channel hiring until one produces a paid, bound cell."
    owner: Founder/partnerships lead
  - horizon: 12–18 months
    experiment: "Rebuild the U.S. 3PL cell-year count from operator and integrator deployment records and compare it with the Census-based proxy."
    hypothesis: "The beachhead has enough annual handovers to support a focused business, or the current $7.5M modeled SAM materially overstates reachable demand."
    successMetric: "Documented facility/installation denominator, annual handover rate, eligible cell count, confirmed price range, and a decision to scale, narrow, or stop."
    owner: Founder/CEO and commercial analyst
operations:
  - "Use a written test protocol, assessor independence rules, signatory authority, configuration schema, exclusions, and change-trigger matrix; retain the operator's existing engineering and EHS approval."
  - "Gate every offer on a named licensed obligor and jurisdictional review. Partner owns underwriting, policy or warranty wording, claims authority, and required producer/administrator permissions."
  - "Keep verification revenue, partner premium, and any authorized administration fee separately contracted and tracked; no contingent cover is advertised before binding."
  - "Store customer-approved evidence and version history with access controls, retention terms, and audit logs; begin with secure manual document transfer and avoid safety-critical runtime integration."
  - "At renewal or after a material change, have the operator and partner confirm eligibility; route claims through the partner and preserve a clear record of causation, exclusions, and existing contractual remedies."
team:
  - role: Founder/CEO, enterprise sales and risk partnerships
    startTiming: Month 0
    rationale: "Own buyer discovery, paid-pilot contracting, insurer/MGA diligence, and the decision gates; no distribution or FORT relationship is assumed."
  - role: Founding engineer, evidence workflow
    startTiming: Month 0
    rationale: "Build only a secure, auditable configuration record and change log after validating the manual workflow; defer fleet APIs and runtime product work."
  - role: Independent AMR safety assessor network
    startTiming: Month 0, contracted per engagement
    rationale: "Provide competent witnessed testing while remaining independent from the installing integrator; use external capacity before hiring a large field team."
  - role: Insurance regulatory and contract counsel
    startTiming: Month 0, external
    rationale: "Review state-specific classification, authorization, policy/warranty wording, liability, claims, and fee structure before any coverage offer."
  - role: Field assessment lead
    startTiming: Month 4–6, only after a paid pilot and partner indication
    rationale: "Standardize site delivery and change reassessment; delay permanent hiring until actual field hours and unit economics are known."
milestones:
  - horizon: 0–12 months
    items:
      - "Interview 12–15 target buyers and inspect two acceptance files; document the real budget owner, status quo, and paid-versus-unpaid demand."
      - "Obtain one written, reviewable partner indication and legal pathway for the initial state before offering cover."
      - "Complete one paid, partner-backed single-cell pilot and measure test completeness, handover time, field effort, buyer-paid verification, and partner premium separately."
      - "Apply the month-6 partner and month-12 paid-pilot kill criteria; do not substitute FORT's reported deployments for customer proof."
  - horizon: 12–24 months
    items:
      - "If the first pilot binds and renews, operate 5–10 covered production cells across no more than three 3PL sites and record material changes and claims outcomes."
      - "Secure two producing integrator or broker referral relationships; hire field capacity only if delivery process and paid conversion repeat."
      - "Reconcile customer/integrator handover counts and actual per-cell pricing against the research's $7.5M SAM scenario before approving a second model."
  - horizon: 24–36 months
    items:
      - "Target 15–25 active covered cell-years in the U.S. 3PL beachhead only if bind rate, renewal, claims boundaries, and contribution margin support it."
      - "Add a second robot model only after the first has repeatable revalidation and partner terms; assess another sector only with fresh buyer, market, and regulatory evidence."
      - "If verified market size or delivery economics remain below the stated gates, stop expansion and present a service-only or shutdown decision rather than assert venture scale."
risks:
  - risk: "A licensed risk partner declines the exposure, imposes exclusions that remove the value, or cannot authorize the proposed structure in the launch state."
    likelihood: High
    impact: High
    mitigation: "Seek written terms from multiple qualified partners before product build; use specialist counsel and do not sell or describe cover until an authorized obligor binds it."
  - risk: "3PL buyers rely on integrator indemnity, OEM warranty, EHS review, and existing insurance instead of paying for a separate backstop."
    likelihood: High
    impact: High
    mitigation: "Inspect real handover files, make priced offers, measure buyer-paid cover separately from assessment interest, and stop if the paid-pilot threshold fails."
  - risk: "A claim cannot be attributed to a covered testable deviation, or existing contracts create disputes over causation, subrogation, and exclusions."
    likelihood: Medium
    impact: High
    mitigation: "Define a narrow remediation event, cap, evidence burden, change suspension, and claims authority with the partner before pilot; exclude bodily injury and general liability initially."
  - risk: "Software, task, map, layout, safeguards, maintenance, or staffing changes make the original envelope stale or create unsafe reliance on a prior pass."
    likelihood: Medium
    impact: High
    mitigation: "Version identifiers and signed change logs, suspend eligibility on agreed material changes, require reassessment, and explicitly state that a pass is neither certification nor a guarantee of safe operation."
  - risk: "The service remains labor- and travel-intensive while the modeled 3PL market is too small for a standalone venture."
    likelihood: High
    impact: High
    mitigation: "Track actual cost per cell and verify handovers from operator/integrator data; gate software, channel hiring, and adjacent-sector expansion on measured repeatability and market evidence."
  - risk: "An OEM, integrator, established assessor, or carrier bundles the same offer with lower acquisition cost or more trusted accountability."
    likelihood: Medium
    impact: Medium
    mitigation: "Partner where possible, preserve assessor independence, and prove a buyer-valued vendor-neutral record and bound claim process; do not rely on novelty alone."
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "Operator-judgment planning range, not inferred from FORT's announced financing: 18 months to complete insurance/legal structuring, run one to three paid single-cell pilots, build a minimal evidence/change-record workflow, measure field economics, and verify a repeatable 3PL channel. Release broader engineering and sales spend only after written partner terms and paid buyer proof."
