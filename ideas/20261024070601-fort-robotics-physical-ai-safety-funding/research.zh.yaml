competitors:
  - name: OMRON 安全服务
    stage: 成熟的工业自动化与安全服务商
    wedge: 提供 AMR 应用支持，覆盖设计到集成，包括风险评估、测试、验证和 ISO 3691-4 专业服务。
    pricing: 按报价收费；未见公开的 AMR 评估价格。
    strength: 具备机器安全领域的既有信誉和全生命周期经验；无需引入新供应商关系即可提供评估。
    weaknessVsUs: 公开页面介绍的是工程咨询，并非与特定配置交付挂钩的第三方经济赔付；但 OMRON 仍可能通过合作或扩展服务进入这一领域。
    sourceRefs:
      - 8
  - name: UL Solutions 与 SICK 安全服务
    stage: 成熟的全球安全与工业技术服务商
    wedge: UL 介绍了第三方设备安全验证、差距分析和工厂调试服务；SICK 则介绍移动机器人风险降低技术与服务。
    pricing: 按报价收费；未找到相关的单元级公开价格。
    strength: 技术能力获认可，也能触达工业买方；其服务可替代大部分现场见证和安全证据工作。
    weaknessVsUs: 抓取到的页面没有提供合作方支持的 AMR 修复保修；其调试服务覆盖范围也宽于拟议的仓库单元场景。
    sourceRefs:
      - 9
      - 10
  - name: FORT Robotics Trust Layer（机器人信任层）
    stage: 商业化运行时安全产品
    wedge: 为自主机器人提供人在回路控制、机载规则安全逻辑和环境感知，定位为机器人原生防护的补充。
    pricing: 按需询价；未见公开定价。
    strength: 直接处理运行时危险和部署集成问题，是自主机器安全领域的成熟专业厂商。
    weaknessVsUs: 这是运行时控制层，并非独立单元验收测试或限额修复赔付的证明。产品部署情况的报道不能证明市场需要保险。
    sourceRefs:
      - 11
  - name: Munich Re、ATA、PolySea、OnePark 和 PeoplesAlly 的风险转移产品
    stage: 成熟的保险公司/再保险公司，以及专业中介和新兴 MGA 定位
    wedge: 公开页面介绍 IoT 性能保障、AI 性能保险、机器人保险，或定制化机器人责任险和财产险方案；PolySea 则面向 Physical AI 推广基于工程控制和遥测数据的承保。
    pricing: 按报价收费；未见公开的 AMR 单元级保费或已生效保障条款。
    strength: 现有的承保、保单、理赔主张处理、经纪或保修能力可以提供风险转移部分，也可能打包所需评估。
    weaknessVsUs: 公开产品介绍没有把现场见证、针对具体站点的 AMR 运行边界列为修复保障的标准资格条件；现有承保能力和约束性条款仍需直接核实。
    sourceRefs:
      - 12
      - 13
      - 14
      - 15
      - 16
      - 29
  - name: 集成商验收、OEM 保修、内部 EHS 审查和现有保险
    stage: 现有厂商的工作流与现状替代方案
    wedge: 依靠现有现场验收测试、OEM/集成商文件、内部签字、服务协议、合同赔偿条款，以及运营方已经购买的保险。
    pricing: 通常包含在项目、服务或保险合同中；拟议保障尚无已确认的额外价格。
    strength: 采购路径熟悉，责任和服务渠道现成，也无需增加评估方或管理机构。
    weaknessVsUs: 记录和责任可能分散在多个主体之间，运营方也可能缺少可移交的独立记录和预先约定的修复资金；但这一缺口是否存在、经济影响有多大，尚未得到验证。
    sourceRefs:
      - 17
      - 18
      - 19
      - 20
      - 27
      - 28
regulatoryTechnicalConstraints:
  - point: ANSI/A3 R15.08-2 规定了在现场集成、配置和定制移动机器人系统的要求；额外测试必须起到补充作用，不能歪曲合规情况，也不能取代集成商和雇主的安全责任。
    sourceRefs:
      - 4
      - 5
      - 7
      - 23
  - point: 软件、地图、任务、附件、布局、防护、维护或人员发生变化后，单元验收记录可能失效；合同必须明确暂停资格和重新测试的触发条件。
    sourceRefs:
      - 4
      - 7
      - 27
      - 28
  - point: 修复承诺可能因条款措辞、义务方、风险转移方式和州法律不同，被认定为保险、服务合同或保修；许可、登记、资金支持和理赔主张处理都需要由合作方主导法律审查。
    sourceRefs:
      - 25
      - 26
  - point: 安全测试通过并不能厘清机器人 OEM、控制系统供应商、集成商、运营方和保险公司之间的因果关系或第三方责任；除外责任和代位求偿安排必须与现有合同一致。
    sourceRefs:
      - 13
      - 15
      - 17
      - 26
  - point: 不同机器人厂商的车队软件和 APIs 各不相同；地图、配置标识符和日志不一定能访问，因此不能假设存在通用的插件式数据层。
    sourceRefs:
      - 11
      - 27
      - 28
validationSignals:
  - point: A3 的 R15.08-2 出版物和培训材料明确涵盖移动机器人系统集成、风险评估、验证、设施因素和变更管理。
    sourceRefs:
