      - 5
      - 7
  - point: OMRON 和 UL 已在市场上提供独立测试和调试服务；这家创业公司必须证明自己卖得动额外的风险转移结果，而不只是重新包装一项评估服务。
    sourceRefs:
      - 8
      - 9
  - point: 机器人保险和技术支持型保证已作为相邻供给存在，但抓取到的材料没有显示客户对这款 AMR 单元产品的需求。
    sourceRefs:
      - 12
      - 13
      - 14
      - 15
      - 16
      - 29
  - point: DHL 报告了合同物流中的大规模 AMR 部署，并介绍了运营效率和用工方面的驱动因素；但没有提到购买单元级保险或修复保修。
    sourceRefs:
      - 20
openQuestions:
  - 谁有权界定并签署运行边界：运营方、集成商、评估方、OEM，还是保险公司？
  - 保修究竟针对哪些事件、支付哪些修复成本？哪些人身伤害或第三方责任仍在除外范围内？
  - 没有多年 AMR 损失经验或标准化理赔主张数据，保险公司会愿意为单个站点的单个单元承保吗？
  - 集成商能否跨厂商提供可靠的机器人、软件、地图、任务和防护标识符？
  - 美国 3PL 合同目前是否要求第三方验收证明，还是内部 EHS 和集成商签字就足够？
