slug: robot-cell-safety-warranty
date: "2026-10-24"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: "模型周期与时间安排"
    value: "共 36 个月，覆盖 Oct 2026 至 Sep 2029；Y1 按月建模，Y2-Y3 按季度建模"
    unit: "日历月"
    source: "[business-plan.yaml 日期及三年模型格式要求；模型月份 M1-M12 覆盖 Oct 2026-Sep 2027，随后按季度延续八个季度至 Sep 2029]"
  - id: A1
    name: "种子前轮融资额与计划现金跑道"
    value: "M1 到账 $2.4M，处于商业计划 $2-4M 融资区间内；用于支持 18 个月验证计划，另留六个月应急现金跑道"
    unit: "USD 百万元及月数"
    source: "[business-plan.yaml fundingAsk：$2-4M 规划区间和 18 个月验证计划；模型选取 $2.4M 作为规划情景，并留出六个月储备；不假设已有现金或 FORT 融资]"
  - id: A2
    name: "付费单元新增签约与试点范围"
    value: "期初客户数为 0；M6 新增签约 1 个付费单元，随后 Y2 各季度新增 1/1/1/2 个、Y3 各季度新增 3/3/3/4 个；截至 M36 累计新增签约 19 个"
    unit: "新增付费单元签约总数"
    source: "[business-plan.yaml 的 product.sixMonth、product.twelveMonth、gtm.funnelTargets、milestones 和 experimentRoadmap：截至第 6个月，完成一个付费单元试点；第 1 年完成一到两个试点；第 12-24 个月在不超过三个场地覆盖 5-10 个活跃且已纳入保障的单元；第 36 个月达到 15-25 个——这些都是目标，并非已观察到的需求。首个单场地、单集成商、单机器人型号试点完成后，后续签约按建模者设定的阶段门逐步爬坡]"
  - id: A3
    name: "公司服务收入 ARPU"
    value: "每个活跃单元每年确认 $12.0K 公司服务收入；合作方定价的整改保障保费不计入公司收入，也不假设该保费会转嫁给公司"
    unit: "每活跃单元年对应的 USD 千元"
    source: "[business-plan.yaml 的 gtm.pricing、businessModel.revenueStreams、investorMemo.firstCustomer.initialContract，以及 research.yaml 的 market.sam：$15K 仅是服务与保障合并口径的测算/验证锚点，并非报价；将 $12K 作为公司服务收入是建模者采取的保守拆分，保费、佣金、管理费和付费意愿均未得到验证]"
  - id: A4
    name: "客户留存与生命周期"
    value: "按几何流失率近似，月流失率 2.7778% 对应 36 个月的预期客户生命周期"
    unit: "每月百分比及月数"
    source: "[business-plan.yaml 的 operatingAssumptions 和 investorMemo：目前没有留存或续约数据；36 个月生命周期及其倒数月流失率，是明确采用的初创融资规划经验值；customersEop 中的小数代表预期活跃付费单元当量，newCustomers 表示新增签约总数]"
  - id: A5
    name: "外部直接交付成本与毛利率"
    value: "COGS 占公司收入的比例为 Y1 的 70%、Y2 的 48%、Y3 的 42%；对应的外部成本毛利率分别为 30%、52%、58%"
    unit: "占收入的百分比"
    source: "[business-plan.yaml 的 businessModel.targetGrossMarginPct 和 killCriteria：重复交付最终应超过 70% 毛利率，前五个单元的直接毛利率应避免低于 50%；相关比例是建模者对外包独立见证、现场差旅及合作方或外部审核成本的估算，尚未验证，首个试点刻意采用服务密集型交付；受薪员工成本仍计入 salaryK 和 opexK]"
  - id: A6
    name: "招聘与全口径薪酬成本"
    value: "2 位创始人于 M1 入职；只有通过 M6 付费试点门槛后，才在 M7 招聘 1 位现场评估负责人；CEO、创始工程师和现场评估负责人的全口径年薪分别为 $120K、$150K 和 $120K；六个时点的 FTE 快照依次为 2、2、3、3、3、3"
    unit: "FTE 数及每 FTE 年对应的 USD 千元薪酬"
    source: "[business-plan.yaml 的 team 和 strategicChoices.sequencingRationale：创始人从第 0 个月开始，只有出现付费使用后才招聘现场评估负责人；全口径薪酬是早期初创融资的经验估算，并非来自薪资报价；独立评估人员和保险法律顾问均为合同人员，不计入 FTE]"
  - id: A7
    name: "非薪酬运营费用计划"
    value: "Y1 月度 S&M（$K）：2,2,3,3,4,4,4,5,5,6,6,7；R&D：12,12,13,14,14,15,16,16,17,18,19,20；G&A：18,18,18,20,22,24,18,18,20,20,22,24。Y2 季度 S&M/R&D/G&A（$K）：12/24/28、15/26/28、18/28/30、20/30/32。Y3：20/30/34、22/32/36、24/34/38、26/36/40。"
    unit: "Y1 按月、Y2-Y3 按季度的 USD 千元"
    source: "[business-plan.yaml 的 product、operations、gtm.channels、team 和 experimentRoadmap：预算用于精简的证据工作流研发、创始人主导的买方/合作方拓展、法律与监管准备、安全数据处理及公司管理开支；这些是建模者估算，并非供应商报价，且不含合作方风险保费]"
  - id: A8
    name: "全口径获客成本"
    value: "Y3 CAC =（$92K 非薪酬 S&M + CEO $120K 全口径薪酬的 35%）/ Y3 付费单元新增签约 13 个 = 每个单元 $10.3077K"
    unit: "每笔新增付费单元签约对应的 USD 千元"
    source: "[business-plan.yaml 的 gtm.channels 和 sequencingRationale：销售继续由创始人主导，不专设销售岗位；CEO 投入 35% 时间是建模假设；Y3 S&M 取自 A7，新增签约数取自 A2；CAC 按模型费用分摊，不作为额外费用计入 P&L]"
  - id: A9
    name: "情景设定"
    value: "下行情景：服务 ARPU 为 $9.6K，Y3 各季度新增签约 3/3/2/3 个；基准情景：$12K、3/3/3/4 个；上行情景：$14.4K、3/3/4/5 个；所有情景的团队人数和非薪酬预算均不变"
    unit: "每活跃单元年对应的 USD 千元及各季度新增单元签约数"
    source: "[business-plan.yaml 的 gtm.funnelTargets、product.twelveMonth、milestones、operatingAssumptions，以及 research.yaml 的 coverageGap：价格、合作方产能和客户转化率均未验证；ARPU +/-20% 以及 Y3 新增签约减少或增加两个，是透明列示的建模压力情景，并非预测]"
  - id: A10
    name: "敏感性冲击"
    value: "全期 ARPU +/-20%；Y3 的 Q3-Q4 合计少签约两个；月流失率 +1 个百分点；各年度外部交付毛利率 -10 个百分点；全期非薪酬 S&M +25%"
    unit: "百分比、百分点及单元签约数"
    source: "[business-plan.yaml 的顶层 risks、killCriteria、strategicChoices.sequencingRationale 和 operatingAssumptions 指出，价格、销售周期、留存、合作方/交付成本及招聘均存在不确定性；冲击幅度由建模者选作压力测试参数]"
  - id: A11
    name: "资金分配与储备"
    value: "$840K 用于工程（35%）；$480K 用于 GTM 和试点交付（20%）；$480K 用于 G&A（含法律与监管工作，20%）；$600K 用作六个月缓冲资金（25%）；合计 $2.4M"
    unit: "USD 金额及占种子前轮融资额的百分比"
    source: "[business-plan.yaml 的 fundingAsk.useOfFundsSummary 和 operations：资金用于搭建最精简的证据工作流、开展一到三个付费单元试点、设计持牌合作方合作结构及法律安排、独立见证和应急储备；各类别的分配是建模者的规划判断，并非已批准预算]"
  - id: A12
    name: "现金与会计口径"
    value: "期初现金为 $0；$2.4M 于 M1 到账；期末现金 = 上期期末现金 + 融资流入 + EBITDA；模型不计后续融资、税费、营运资本变动、资本开支、债务偿付、合作方保费或尚未绑定保障的收入"
    unit: "USD 千元及建模口径"
    source: "[business-plan.yaml 的 fundingAsk 和 operatingAssumptions：未披露现有现金、已签合同、已绑定保障或融资；客户向公司支付模型中的服务费，合作方定价的风险保费不计入；由于其他现金项目尚无法量化，模型以 EBITDA 作为经营现金流]"
