headcountBasis:
  assumptionRefs:
    - A6
  description: "年化薪酬成本 = 快照 FTE 人数 × 各岗位全口径薪酬；两位创始人的实际 salaryK 为每月 22.5K，现场评估负责人 M7 入职后为每月 32.5K；所有员工薪酬只计入一次，列在 salaryK 并纳入 opexK。合同评估人员和法律顾问不计入 FTE，相关费用不属于员工薪酬。"
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
  customerDefinition: "customersEop 表示预期活跃付费单元当量，而非按运营商客户去重的客户数；newCustomers 表示新增付费单元签约总数。首个付费试点限定在一个 3PL 场地、一家集成商和一种机器人型号；后续增加单元须以试点结果和合作方证据为前提。"
  formula: "每个月或季度的 revenueK，按 customersBop 与 customersEop 的平均值乘以年化服务 ARPU，再分别除以 12 或 4 计算。流失率作用于期初活跃单元；新增签约按期间中点法分摊。"
  exclusion: "模型只计公司服务收入；合作方留存或单独收取的整改保障保费，以及任何未经批准的佣金/管理费，均不计入。模型不假设与 FORT 已建立合作、不假设存在客户需求或报价，也不假设保单已绑定。"
pnlMethodology:
  assumptionRefs:
    - A5
    - A6
    - A7
    - A12
  description: "cogsK 是各年度适用的外部直接交付成本率；grossProfitK = revenueK - cogsK；salaryK 是员工全口径薪酬；opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK；ebitdaK = grossProfitK - opexK；现金按融资流入加 EBITDA 逐期结转。模型列示的毛利率未计入受薪交付人员薪酬；这部分仍列在 salaryK 中，因此全成本贡献毛利率更低。"
