modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      Operator["One-site 3PL pilot"] --> Witness["Independent witness and bounded cell evidence"]
      Witness --> Partner["Authorized partner binds capped remediation cover"]
      Partner --> Cell["Paid service cell-year; partner retains risk premium"]
      Cell --> Revenue["Company revenue = active cells x $12K service ARPU"]
      Revenue --> Delivery["Contract assessor and travel COGS"]
      Delivery --> Cash["Cash after payroll, engineering, GTM, and G&A"]
modelSanity:
  - checkName: "收入引擎"
    finding: "模型从 M6 的一个付费试点起步，到 M36 达到 15.3 个预期活跃单元当量；按 $12K 年化 ARPU 计算，Y3 公司服务收入为 $121.0K，不含合作方保费。"
  - checkName: "成功前提"
    finding: "后续单元签约要支撑仅计服务收入的 $12K ARPU，授权合作方必须先绑定限额保障，买方也必须为单场地、单集成商、单机器人试点付费。"
  - checkName: "模型失效条件"
    finding: "销售与营销计划支出增加 25%，模型期末现金将减少 $52K；若无法绑定合作方保障，则会面临致命但尚未定价的风险。"
  - checkName: "下一轮融资验证"
    finding: "第 18 个月的验证门槛包括：完成一到三个付费单元试点，取得可供审阅的合作方条款和法律条款，测出评估人员及差旅成本，并书面记录扩大、收窄或停止的决定。"
sanityChecks:
  ruleOf40: "方向性测算为 -299%：Y3 营收增长率 272.6% 加 EBITDA 利润率 -572.0%；在规模小、利润率为负的验证阶段，这一结果没有实际意义。"
  burnMultiple: "烧钱倍数为 5.7x，即 Y3 EBITDA 烧钱额 $691.8K 除以预期活跃单元增加带来的约 $121.7K 净新增 ARR；未计营运资本和资本开支。"
  revenuePerFte: "Y3 人均收入为 $40.3K，按平均 3.0 FTE 计算；这里没有引用外部基准，团队仍处于验证阶段。"
  flags:
    - "目前没有经验证的 3PL 买方访谈、付费合同、合作方意向、已绑定保障、保费报价、留存结果或客户成果；模型也未将 FORT 的融资和部署表述作为需求或合作证据。"
    - "研究中的 $15K 市场测算锚点是服务与保障的合并价值；预测仅确认假设为 $12K 的公司服务费，不计合作方保费或佣金。"
    - "Y3 的 58% 毛利率未扣除受薪交付人员薪酬，仍低于商业计划中重复交付毛利率超过 70% 的目标；全成本贡献毛利率更低。"
    - "独立评估人员工时、差旅、合作方审核、保障资格和保障索赔主张的处理均未知；Y1 外部 COGS 按 70% 估算以及之后的成本下降均未验证。"
    - "在没有后续融资的情况下，基准情景现金到 M36 降至 $236.8K；若合作方授权延迟、成本超支或招聘超过三人 FTE 编制，可腾挪的空间有限。"
    - "Y3 EBITDA 仍亏损 $691.8K，每 FTE 收入为 $40.3K；增长率和 Rule-of-40 的计算结果都未显示出规模化经济性。"
    - "模型假设 Y3 新增签约 13 个单元，以达到 15.3 个活跃单元当量；这接近商业计划 15-25 个目标的低端，也依赖可复制的合作方和集成商渠道。"
