slug: portable-agent-resume-capsules
date: "2026-10-24"
executiveSummary: >-
  Portable Agent Resume Capsules 是一套执行层 SDK 和服务，可在另一个兼容沙箱中，根据经验证的安全检查点状态包重建编码智能体任务。滩头市场是承接长周期、多步骤代码仓库迁移或依赖升级任务的编码智能体厂商；首批客户是能够开放循环边界、衡量重跑成本的平台工程负责人。MVP 会采集代码仓库差异、固定版本的运行时清单，以及智能体可见的工具历史，再验证能否干净恢复；它不会迁移任意进程内存，也不会重放外部副作用。研究支持有状态暂停、恢复和分叉的需求，也显示托管沙箱周边已有预算，但尚未量化进度丢失的频率，也未证明市场需要可移植恢复。Daytona、E2B、AWS、框架持久化能力和原生智能体会话已覆盖这套工作流中的重要环节，因此只有买家确实需要跨服务商迁移或恢复时，公司才有胜算。研究测算的 TAM 为 $250M、SAM 为 $25M、SOM 为 $1.25M；这些只是基于假设账户数和每年 $50,000 支出的情景估算，并非经过验证的市场数据。创始人主导销售将先确认客户是否确有这类需求，再开展付费恢复试点；只有实际测出节省的工作量并通过安全审批后，才推动转化。pre-seed 融资应支持团队运营 18 个月，验证一个智能体循环适配器能否打通两家执行服务商、签下三个付费试点，并确认可重复恢复能否支撑独立业务。
problem:
  - 编码智能体团队遇到长周期代码仓库任务中断，或任务转移到其他运行环境时，可能丢失工作区改动和工具返回的上下文，导致重跑或人工恢复。
  - 从提示词或最近一次已提交补丁重新开始，可能重复消耗模型和算力；若沿用不完整上下文继续执行，又可能产生过时或不安全的改动。
  - 研究证实了生命周期管理需求和沙箱周边支出，但未量化中断频率、可避免的损失或客户对状态包的付费意愿。
solution:
  - 为一个编码智能体循环提供 SDK 适配器，只在明确声明的安全工具轮次边界生成状态包。
  - 将源码版本和 worktree（工作树）差异绑定到固定版本的依赖与运行时清单、智能体可见的对话记录及工具结果；排除凭证，也绝不声称能迁移任意进程内存。
  - 在全新的兼容沙箱中重建任务，校验哈希并运行必要的本地检查；遇到不支持的状态就安全中止，不自动重放外部副作用。
  - 通过客户安全审查后，提供加密状态包存储和按验证通过的恢复次数计费；有要求时允许客户自行管理密钥或存储。
whyWeWin:
  - 这套方案把智能体循环状态、代码仓库改动、运行时要求和失败即关闭的恢复校验串在一起；已审阅的原生快照和会话 APIs 则受各自服务商或框架的范围限制。
  - 跨服务商兼容性矩阵和真实恢复失败案例库，长期可以降低集成风险；但这些是需要逐步建成的护城河，并非现有优势。
  - 产品保持中立，不靠销售沙箱算力参与竞争；只用一家服务商且对原生恢复满意的买家，不是目标客户。
strategicChoices:
  beachhead: 承接多步骤代码仓库迁移或依赖升级任务、能够开放安全工具轮次边界，且确实需要跨沙箱服务商迁移或恢复的编码智能体厂商。
  wedgeRationale: 这类任务有明确的代码仓库产物和可测试的完成检查，因此比宽泛的助手工作流更快看清进度节省和恢复是否正确。恢复仅覆盖受支持的循环边界和应用层状态，不包括任意进程内存；这限制了覆盖范围，也增加了适配器工作。只有原生快照不够用时，跨服务商迁移才有价值。
  sequencingRationale: 先埋点量化进度损失，并验证一个循环能否跨两家服务商运行；再拿下付费试点并完成安全审查；只有恢复能力经反复验证后，团队才扩展框架适配器、托管存储规模或服务商合作。按这个顺序推进，可避免买家尚未证明价值前就投入适配器和数据留存工作。
  notYet:
    - 不支持任意进程内存迁移、未建模的 OS 状态，也不自动重放非幂等外部工具。
    - 不自建或运营沙箱执行云；使用服务商的运行环境，专注建立中立的兼容性协议。
    - 在厂商滩头市场实现转化前，暂缓拓展至更广泛的企业开发者平台团队、通用工作流编排、其他智能体框架和市场分发渠道。
market:
  tam: "$250M 年度情景：假设全球有 5,000 家符合条件的账户，每家每年支出 $50,000；账户数和付费意愿都未经测量。"
  sam: "$25M 年度情景：假设有 500 家账户具备兼容的循环接入点，且确实需要跨服务商迁移或恢复；每家年支出仍按假设的 $50,000 计算。"
  som: "$1.25M 经常性收入情景：25 家付费账户，每家年化支出 $50,000；这是采用情景，不是预测。"
  segments:
    - 在临时工作区运行大量代码仓库改动任务的编码智能体厂商。
    - 需要可移植检查点协议的智能体框架维护者和执行云运营商。
  buyingProcess: 平台工程团队会验证安全边界集成和恢复正确性；可能的预算负责人是 VP 或总监，安全和基础设施团队则可以否决新增的代码与对话记录存储边界。先围绕真实的服务商切换、抢占或恢复案例确认需求，再争取付费试点，之后才进入生产采购。
product:
  mvp: 交付一个编码智能体循环适配器，在声明的安全轮次采集源码版本、worktree 差异、固定版本的运行时/依赖清单和工具返回上下文。在第二家服务商的干净沙箱中恢复，校验哈希并运行选定测试；遇到不支持的状态或外部副作用重放就拒绝继续。
  sixMonth: 让一个受支持的循环在两家服务商之间完成成对恢复，公布受支持的运行时矩阵，并与客户敲定安全审查认可的加密或存储控制，开展付费试点。
  twelveMonth: 将校验器、状态包版本管理、留存/删除控制、审计事件和用量计费做到生产可用；只有试点客户反复提出同一种集成需求时，才新增第二个智能体适配器。
  twentyFourMonth: 根据客户实际需求扩充受支持的运行时配置和第二个智能体循环；买家批准后提供托管存储，并公布中立于服务商的兼容性结果，但不承诺迁移任意进程。
  keyBets:
    - 只有真实的恢复或服务商切换事件令原生快照不够用时，买家才会为可移植性付费。
    - 声明明确的循环边界，加上代码仓库和运行时状态，可以恢复一部分有价值的编码任务，无需迁移完整进程。
    - 校验与失败即关闭的机制，能让应用层恢复足够安全，适用于生产编码工作流。
    - 客户自主管理加密和存储的选项可以通过安全审查，同时不至于让部署与支持成本失去经济性。
gtm:
  wedge: 由创始人主导付费试点，面向代码仓库任务周期长、已记录重跑成本且确有跨服务商恢复需求的编码智能体厂商；从一个框架适配器和两种运行时配置起步。
  channels:
    - 面向开发者的 SDK、可运行示例和兼容性结果，发布在所选框架的文档及软件包生态中。
    - 创始人直接联系编码智能体厂商的平台工程负责人，确认其是否确实存在多服务商使用、任务抢占或服务商迁移需求。
    - 与框架维护者建立共创合作，拿到稳定的安全边界接入点；中立恢复方案跑通后，再接触执行服务商。
  funnelTargets: "运营目标，并非实际转化数据：12 个月内，从 30 家合格账户推进到 10 家已完成任务数据埋点、并参与需求访谈或共创的客户，再争取 3 个付费试点；截至第18个月，至少 50% 的试点转为生产使用。"
  pricing: 先测试 $10,000–$20,000、周期为 6–8 周的付费试点，再按检查点 GB-hours 和验证通过的恢复次数制定年度用量价格；每增加一种运行时配置兼容性测试，另行收费。试点费和年度价格都只是待验证假设，需要用实际避免的重跑和恢复成本检验；相邻沙箱产品的价格不能证明客户对状态包的付费意愿。
businessModel:
  revenueStreams:
    - 按 GB-hours 计量的加密检查点存储使用费。
    - 按验证通过的恢复次数收费，企业级上限和留存期限写入合同。
    - 新增智能体循环或运行时配置的付费兼容性测试与支持。
  unitOfValue: 一个符合条件的编码智能体任务恢复到经验证的可用状态，且无需重做已经完成的工具调用。
  targetGrossMarginPct: 70
  expansionLevers:
    - 每位生产客户带来更多符合条件的任务和更长的留存时间。
    - 增加经过验证的运行时配置和智能体循环适配器。
    - 按需提供企业控制、客户自管密钥，以及客户自托管存储支持。
strategyMap:
  northStarMetric: 符合条件的暂停任务中，有多少恢复到经验证的可用状态且没有重做已完成的工具调用。
  inputMetrics:
    - 每位活跃客户采集到的符合条件的安全边界检查点数。
    - 按循环和运行时配置统计的恢复校验通过率。
    - 每次成功恢复节省的模型/算力工作量中位数，以及人工恢复时间中位数。
    - 付费试点转生产的比例，以及每个生产账户反复验证通过的恢复次数。
    - 每次验证通过的恢复所产生的存储、读取和支持可变成本。
  moatsToBuild:
    - 版本化的安全边界适配器，以及覆盖不同智能体循环和沙箱配置的公开兼容性矩阵。
    - 恢复校验器和经客户同意、不含内容的失败结果；这些结果可改善兼容性，但不会把客户源码或对话记录留存为数据护城河。
    - 可信的中立集成和安全控制，降低客户采用多家执行服务商的成本。
  killCriteria:
    - 与 10 个合格团队访谈并埋点后，如果确认存在有预算支持、且可量化可避免成本的跨服务商或恢复问题的团队少于 3 家，就收窄客群或放弃托管产品方向。
    - 在受支持矩阵内完成 100 次符合条件任务的成对恢复后，如果通过必要工作区校验的比例低于 95%，或任何一次恢复重复触发非幂等外部副作用，就暂停生产推广并重新评估边界协议。
    - 截至第12个月，签下付费试点的合格买家少于 3 家；或截至第18个月，没有任何试点转为生产使用。出现任一情况，都不扩大团队或适配器范围。
    - 完成 3 个生产试点后，若按买家接受的价格测算，毛利率仍低于 70%，就先调整留存、存储或价格，再扩大规模。
  mermaid: |
    flowchart LR
      Pain[Measured cross-provider recovery pain] --> Adapter[One safe-boundary adapter]
      Adapter --> Pilot[Paid two-provider pilot]
      Pilot --> Restore[Verified restore and avoided-work proof]
      Restore --> Production[Production usage contract]
      Production --> Matrix[Compatibility matrix and selective expansion]
investorMemo:
  verdict:
    call: Watch
    conviction: 偏低至中等；生命周期问题和技术切口有一定合理性，但跨服务商需求的紧迫性和独立付费意愿仍未得到验证。
    whyBelieve: Daytona、E2B 和框架文档证实了有状态生命周期管理需求，也显示执行服务周边支出可观；已审阅的公开文档尚未展示这套精确的、经过验证的跨服务商协议。
    whyDoubt: 原生快照、框架和编码智能体会话持久化、重启工作流都是有力替代方案；Crab 预印本也涉及按轮次感知的检查点。研究还没有找到经过测量的进度损失率或付费状态包客户。
    nextDiligence: 要求一位付费共创客户把同一个代码仓库任务从 Daytona 恢复到另一家独立服务商，并验证状态、确认没有重复副作用，测出节省的工作量。
  firstCustomer:
    title: 编码智能体厂商的平台工程团队
    profile: 厂商在临时沙箱中运行多步骤代码仓库迁移或依赖升级任务，并能记录安全工具轮次边界。
    trigger: 计划切换执行服务商、反复遇到任务抢占，或恢复成本过高时，就会暴露出服务商专属快照无法把已有工作带入目标运行环境的问题。
    buyer: VP 或平台工程总监
    initialContract: "测试 $10,000–$20,000、周期为 6–8 周的付费试点；若反复恢复和节省的工作量证明其价值，再转为每年 $30,000–$60,000 的用量合同。这些是运营方对价格的假设，并非已观察到的状态包定价。"
  mustBeTrue:
    - 最初 10 家合格编码智能体厂商中，至少有 3 家存在有预算支持的跨服务商或恢复需求，而原生快照不足以满足这些需求。
    - 目标任务中可记录的模型、算力或人工恢复成本足够高且反复出现，买家才有理由用节省的成本证明拟议年度合同划算。
    - 一个受支持的智能体循环能在两家独立服务商之间恢复任务：至少 95% 的符合条件测试任务通过工作区检查，且没有重复触发非幂等副作用。
    - 至少 3 家合格买家付费试点；截至第18个月，已完成试点中至少一半转为生产用量。
    - 生产客户接受状态包安全模型和用量定价，且存在一条毛利率至少达到 70% 的路径；公司不必为建立数据护城河而留存源码内容。
  diligenceQuestions:
    - 过去 90 天的代码仓库智能体任务中，被中断或迁移的占比是多少？每次造成多少模型、算力和人工恢复成本？
    - 哪些目标账户确实让同一智能体工作流跨服务商运行？什么具体情况会让原生快照不够用？
    - 成对恢复能否保留必要的对话记录、工具输出、worktree 和依赖，同时妥善处理凭证与外部副作用？
    - 平台和安全买家是否会批准付费试点拟议的存储边界、留存、删除、密钥控制、数据驻留和处理方条款？
    - 至少三家买家愿意签下什么价格和年度用量承诺？预计存储、出口流量和支持成本后，毛利率是否可行？
operatingAssumptions:
  - assumption: 至少有一小部分编码智能体厂商因进度损失严重或频繁更换服务商，愿意为可移植恢复投入预算。
    basis: research.yaml
    validationTest: 与 10 个共创客户团队一起记录失败、暂停、抢占和迁移任务；量化重复消耗的 token、算力、工具工作和人工恢复，再与原生快照恢复结果对比。
    decisionImpact: 如果这类事件少见或成本低，就收窄到任务特别长或受监管的代码仓库工作；如果没有任何细分客群存在明显可避免成本，就停止独立服务方向。
  - assumption: 一个开放的智能体循环边界和兼容的运行时清单，就足以在两家服务商之间重建有价值的代码仓库任务。
    basis: idea.yaml
    validationTest: 在 Daytona 与 E2B 或 AWS 之间运行 100 个成对任务；比较代码仓库哈希、必要测试、对话记录/工具返回连续性和副作用日志，遇到未知状态就安全中止。
    decisionImpact: 如果可靠恢复必须依赖任意进程内存或重放外部效果，就缩小支持的工作流范围或放弃可移植方案，不要声称能无缝迁移。
  - assumption: 情景 TAM 账户中，大约 10% 有跨服务商或恢复需求，也具备兼容的循环接入点。
    basis: research.yaml
    validationTest: 审核至少 30 家具名账户的运行时/服务商清单和资格评估结果；区分真正的跨服务商需求和同一家服务商内的多区域使用。
    decisionImpact: 如果符合条件的比例明显更低，就重算 SAM/SOM；只有相邻买家也有相同的验证恢复任务时，才测试那个客群。
  - assumption: 买家愿意接受新增的状态包数据边界，并由客户自管密钥或存储。
    basis: research.yaml
    validationTest: 与五家目标买家完成安全和隐私审查，覆盖加密、排除机密信息、租户隔离、留存、删除、审计事件、数据驻留和处理方条款。
    decisionImpact: 如果托管存储阻碍采用，只有部署和支持成本仍可控时才提供客户自托管存储模式；否则停止存储状态包内容。
  - assumption: 按 GB-hours 计费的存储和按验证通过的恢复次数收费，能以节省的工作量所支撑的价格实现至少 70% 毛利率。
    basis: 运营判断
    validationTest: 在三个试点中测量存储、读取、出口流量、支持和恢复校验成本；用买家认可的节省金额检验价格和留存档位。
    decisionImpact: 如果买家不接受最低价格，或用量成本高于该价格，就缩短留存、压缩载荷、调整计价单位，或不扩大托管服务。
experimentRoadmap:
  - horizon: 0–90 天
    experiment: 访谈并埋点记录 10 个合格编码智能体平台团队的任务中断频率、原生恢复情况和恢复成本。
    hypothesis: 部分团队存在可量化的恢复损失，也有明确的服务商切换或任务抢占触发点。
    successMetric: 至少 3 个团队披露有预算支持、且可量化可避免成本的用例，并同意参加技术设计讨论。
    owner: CEO / 创始商务负责人
  - horizon: 0–90 天
    experiment: 构建一个安全边界适配器，在 Daytona 与 E2B 或 AWS 之间运行成对代码仓库任务。
    hypothesis: 无需迁移进程内存，也能恢复并验证工作区、工具返回上下文和固定版本的依赖。
    successMetric: 100 次受支持任务恢复中至少 95 次通过必要检查，且没有重复触发非幂等外部效果。
    owner: 创始系统工程师
  - horizon: 3–6 个月
    experiment: 向最合适的共创客户提供固定范围的付费试点，测试拟议的试点费和用量价格。
    hypothesis: 买家愿意为可测量的恢复结果付费，而不是继续依赖原生快照或内部脚本。
    successMetric: 签下三个试点，每个至少 $10,000；否则在增加集成前调整客群和价格。
    owner: CEO / 创始商务负责人
  - horizon: 3–6 个月
    experiment: 与平台安全、隐私和采购团队审查状态包数据流以及密钥/存储选项。
    hypothesis: 客户自主管理加密，并明确控制留存和删除，就能通过试点审查。
    successMetric: 五次目标安全审查中有四次没有提出必须存储机密信息或不受支持的进程状态的阻断性要求。
    owner: 创始系统工程师与外部安全顾问
  - horizon: 6–12 个月
    experiment: 与合作团队开展接近生产环境的恢复演练，发布版本化兼容性和失败矩阵。
    hypothesis: 可重复使用的校验器和受支持配置协议，能在服务商 APIs 变化时维持恢复质量。
    successMetric: 连续三次月度测试中，两家服务商之间符合条件的恢复校验通过率至少达到 95%，且所有不支持的情况都安全中止。
    owner: 集成工程师
  - horizon: 12–18 个月
    experiment: 在新增第二个智能体适配器前，衡量试点转生产比例、重复使用、客户认可的节省和可变交付成本。
    hypothesis: 成功恢复会反复发生，足以支撑年度用量合同和目标毛利率。
    successMetric: 已完成试点中至少 50% 转化；生产账户反复完成校验通过的恢复；按买家接受的价格测算，毛利率达到 70%。
    owner: CEO / 创始商务负责人
operations:
  - 为每种受支持的智能体循环和运行时配置维护版本化状态包格式及自动兼容性测试套件；公布不支持状态时的处理方式。
  - 从状态包中排除凭证；尽可能使用客户自管密钥加密内容，尽量减少留存数据；生产前支持明确的留存、删除和审计控制。
  - 在安全边界采集已完成的工具结果；任何外部效果都必须满足幂等要求或经运营人员批准，绝不自动重放会产生副作用的工具调用。
  - 在安全敏感的试点中使用客户运营或指定的对象存储；只有数据流和采购审批通过后才增加托管存储。
  - 与框架维护者和至少两家执行服务商建立非独家共创合作；状态包不得依赖任何一家服务商的私有格式。
team:
  - role: 创始系统工程师
    startTiming: 第 0 个月
    rationale: 从首个原型起负责状态包格式、安全边界适配器、恢复校验器，以及中立于服务商的可靠性。
  - role: CEO / 创始商务负责人
    startTiming: 第 0 个月
    rationale: 招募共创客户、衡量买家痛点和付费意愿、主导付费试点，并根据证据关口控制范围。
  - role: 集成工程师
    startTiming: 第 4–6 个月，待共创客户验证安全边界可接入后
    rationale: 构建并维护第二种服务商配置，自动化兼容性测试；如果首个适配器没有已承诺的试点，就延后招聘。
  - role: 安全/平台工程师
    startTiming: 第 6–9 个月，且须在付费试点需求明确之后
    rationale: 生产前强化密钥管理、租户隔离、留存、删除、审计和客户自托管存储路径。
  - role: 解决方案工程师
    startTiming: 第 12–18 个月，且仅在至少两个试点进入生产后
    rationale: 支持可重复执行的客户接入和安全审查，避免创始人偏离产品验证和直接销售。
milestones:
  - horizon: 0–12 个月
    items:
      - 记录 10 个合格团队的实际中断、恢复、原生快照和服务商切换案例。
      - 交付一个智能体循环适配器、版本化状态包格式、失败即关闭的校验器，以及双服务商兼容性测试。
      - 签下三个付费试点，衡量恢复成功率、节省的工作量、安全异议和买家认可的价格。
  - horizon: 12–24 个月
    items:
      - 已完成试点中至少一半转为生产使用，并验证受支持运行时配置下的重复恢复能力。
      - 按买家接受的价格达到 70% 毛利率；否则在扩张前调整存储、留存和服务范围。
      - 只有多家付费客户提出相同集成需求时，才增加第二个智能体适配器并公布兼容性结果。
  - horizon: 24–36 个月
    items:
      - 只有生产用量和续约能够支撑成本时，才扩展到更多运行时配置和框架集成。
      - 按研究测算的 SOM 情景，目标最多 25 家付费账户；账户数和每年 $50,000 的等值支出仍是假设，未经验证。
      - 建立可重复的安全接入流程和非独家服务商/框架合作，不自建执行云。
risks:
  - risk: 原生服务商快照或智能体会话持久化已能满足大多数买家需求，导致迁移功能很少用到。
    likelihood: High
    impact: High
    mitigation: 只针对真实的跨服务商需求确认客户资格；每个试点都评测原生恢复；若付费需求未达到既定关口，就停止扩张。
  - risk: 状态包遗漏进程或工具状态，或恢复任务重复触发外部副作用。
    likelihood: High
    impact: High
    mitigation: 只支持明确声明的边界，采集已完成的工具输出，未知状态一律安全中止，禁止自动重放副作用。
  - risk: 源码和对话记录引发安全、隐私、数据驻留或采购阻碍。
    likelihood: High
    impact: High
    mitigation: 排除机密信息、尽量精简载荷、提供客户自管密钥或存储，并在生产前明确留存、删除、审计和处理方控制。
  - risk: 服务商 API 和运行时差异令适配器维护成本高企，削弱产品中立性。
    likelihood: Medium
    impact: High
    mitigation: 从两种配置起步，自动化兼容性测试，为状态包协议做版本管理；有付费客户提出需求前，暂缓接入新服务商。
  - risk: 买家认可节省的工作量，却不接受独立定价；或恢复次数太少，无法支撑经常性收入。
    likelihood: High
    impact: High
    mitigation: 按试点中测得的结果收费，用客户认可的节省金额检验用量费，并在扩招前验证毛利率和重复使用情况。
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "资金支持小型创始工程与商务团队运营 18 个月：记录买家痛点，构建一个安全边界适配器和双服务商校验器，完成符合安全要求的付费试点，并在扩展框架或运行时矩阵前验证转化率和毛利率。"
