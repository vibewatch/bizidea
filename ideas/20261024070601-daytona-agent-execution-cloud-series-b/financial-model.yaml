      percentage: 21.82
scenarios:
  downside:
    description: "Four gross wins, lower $35K annual pricing, 2% monthly churn, 60% gross margin, and no M25 seed; base hiring and expenses are held fixed."
    y3RevenueK: 84.948
    y3EbitdaK: -1317.03
    cashLowPointK: -718.026
    keyAssumptionChanges:
      - "Only four gross production wins by M36, with one conversion by M18."
      - "Annual ARPU falls to $35K, monthly churn rises to 2%, and gross margin falls to 60%."
      - "The conditional $1.5M M25 seed does not close."
  base:
    description: "Eight gross production wins, $50K annualized ARPU, 1% monthly churn, 75% modeled gross margin, and a conditional M25 seed after the proof gate."
    y3RevenueK: 282.865
    y3EbitdaK: -1155.852
    cashLowPointK: 656.645
    keyAssumptionChanges:
      - "Eight gross production additions are scheduled from M15 to M35, including two conversions by M18."
      - "The $1.5M seed is conditional on passing the M24 operating proof gate and is included in base cash."
  upside:
    description: "The BP's 25-account SOM scenario is approached through 21 Y3 gross wins, $60K annual ARPU, 0.5% monthly churn, 80% gross margin, and the conditional M25 seed."
    y3RevenueK: 924.115
    y3EbitdaK: -628.707
    cashLowPointK: 678.476
    keyAssumptionChanges:
      - "Production additions accelerate to 21 gross wins during Y3, reaching about 24.1 expected active accounts at M36."
      - "Annual ARPU increases to $60K, monthly churn falls to 0.5%, and gross margin reaches 80%."
      - "The conditional $1.5M M25 seed closes."
sensitivity:
  - variable: ARPU
    downsideCase: "$35K annual ARPU"
    baseCase: "$50K annual ARPU"
    upsideCase: "$60K annual ARPU; about +$56.6K Y3 revenue and +$57.0K cash versus base."
    y3RevenueImpactK: -84.861
    cashImpactK: -85.437
  - variable: "Sales cycle / production wins"
    downsideCase: "Four cumulative gross wins by M36"
    baseCase: "Eight cumulative gross wins by M36"
    upsideCase: "21 gross wins in Y3; about +$466.6K Y3 revenue and +$349.9K cash versus base."
    y3RevenueImpactK: -151.862
    cashImpactK: -159.09
  - variable: churn
    downsideCase: "2.0% monthly logo churn"
    baseCase: "1.0% monthly logo churn"
    upsideCase: "0.5% monthly logo churn; about +$12.4K Y3 revenue and +$10.5K cash versus base."
    y3RevenueImpactK: -22.794
    cashImpactK: -19.354
  - variable: "Gross margin"
    downsideCase: "60% gross margin"
    baseCase: "75% modeled gross margin"
    upsideCase: "80% gross margin; about +$19.0K cash versus base over the forecast."
    y3RevenueImpactK: 0.0
    cashImpactK: -56.956
  - variable: CAC
    downsideCase: "$120K CAC for the same eight gross wins"
    baseCase: "$84K CAC"
    upsideCase: "$65K CAC; saves about $152K versus base."
    y3RevenueImpactK: 0.0
    cashImpactK: -288.0
