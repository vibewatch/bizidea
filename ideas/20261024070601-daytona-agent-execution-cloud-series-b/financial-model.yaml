slug: portable-agent-resume-capsules
date: "2026-10-24"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: Model period
    value: "M1 is November 2026; M12 is October 2027; M36 is October 2029."
    unit: calendar
    source: "[business-plan.yaml.date and research.yaml.date] The first full month after the shared report date starts the forecast."
  - id: A2
    name: Starting production customers and paid-pilot treatment
    value: "0 production customers at M1; target 3 paid pilots by M12, but pilots are excluded from the recurring-customer count."
    unit: customers
    source: "[business-plan.yaml.executiveSummary, gtm.funnelTargets, and milestones] The plan names no signed account and targets 3 paid pilots; pilot fees are excluded from modeled revenue and cash as a conservative simplification."
  - id: A3
    name: Production annual revenue per customer
    value: "$50,000 annualized per production account; an unvalidated midpoint of the BP $30,000-$60,000 contract hypothesis and the research $50,000 annual-spend sizing proxy."
    unit: USD per customer-year
    source: "[business-plan.yaml.investorMemo.firstCustomer.initialContract and research.yaml.bottomUpSizingDrivers] Neither source reports capsule-specific willingness to pay."
  - id: A4
    name: Revenue recognition method
    value: "Monthly revenueK = ending active production customers x $50,000 / 12; new accounts are active for a full addition month, churn applies to the opening base before additions, and no pilot, compatibility-test, or support revenue is modeled."
    unit: method
    source: "[business-plan.yaml.businessModel.revenueStreams and gtm.pricing] Startup-finance recurring-revenue timing heuristic; billing and collection lag are not modeled."
  - id: A5
    name: Base gross production-account additions
    value: "One new production account in each of M15, M18, M20, M23, M26, M29, M32, and M35; 8 gross wins by M36, including 2 conversions by M18 from the 3-pilot target."
    unit: customers and schedule
    source: "[business-plan.yaml.gtm.funnelTargets, milestones, and research.yaml.market.som] Two conversions meet the BP 50% pilot-conversion goal; later wins are a conservative but unvalidated extension beyond the initial funnel."
  - id: A6
    name: Monthly customer churn
    value: "1.0% of opening production accounts per month; expected customer counts are fractional."
    unit: percent per month
    source: "Startup-finance early B2B SaaS retention heuristic; no capsule-specific retention or renewal data was found in research.yaml."
  - id: A7
    name: Fully loaded annual payroll by role
    value: "CEO / founding commercial lead $144,000; founding systems engineer $180,000; integration engineer $156,000; security / platform engineer $168,000; solutions engineer $144,000 per FTE-year, including employer costs and benefits."
    unit: USD per FTE-year
    source: "[business-plan.yaml.team] Compensation is an explicitly labeled early-stage software startup planning heuristic, not a company pay history or external benchmark."
  - id: A8
    name: Hiring schedule and payroll roll-up
    value: "CEO and founding systems engineer start M1; integration engineer M5; security / platform engineer M8; solutions engineer M18 after the second pilot conversion. No further hires are included through M36; quarterly headcount and salariesK follow these start dates and A7."
    unit: schedule
    source: "[business-plan.yaml.team and strategicChoices.sequencingRationale] M5 and M8 follow the stated Month 4-6 and Month 6-9 gates; M18 is within the Month 12-18 window and waits for two production conversions."
  - id: A9
    name: Variable cost of revenue and gross margin
    value: "COGS is 25% of recognized revenue, implying a 75% modeled gross margin; all employee payroll is operating expense, with no separate direct-delivery payroll allocation."
    unit: percent of revenue
    source: "[business-plan.yaml.businessModel.targetGrossMarginPct and research.yaml.reportMemo.willingnessToPay] The BP goal is at least 70%; 25% COGS is an early software infrastructure, storage, egress, restore-verification, and variable-support heuristic without measured cost data."
  - id: A10
    name: Annual non-payroll operating budgets
    value: "Y1 sales and marketing $96,000, R&D $240,000, G&A $120,000; Y2 $144,000, $192,000, and $144,000; Y3 $216,000, $180,000, and $180,000, respectively."
    unit: USD by year and function
    source: "[business-plan.yaml.product, gtm, operations, and team] Lean startup-finance budget heuristics for provider testing, security work, founder-led sales, legal, insurance, and administration; no vendor quotes or actual expenses were supplied."
  - id: A11
    name: Fully loaded customer acquisition cost
    value: "$84,000 per gross production win = ($456,000 three-year non-payroll sales and marketing + 50% of $432,000 CEO payroll) / 8 gross wins; the founder-time allocation is assumed."
    unit: USD per customer
    source: "[A5, A7, A8, and A10; business-plan.yaml.gtm.wedge] Fully loaded CAC includes a 50% allocation of founder commercial time, not an observed acquisition cohort."
  - id: A12
    name: Current pre-seed ask and use of funds
    value: "$2.75M received in M1, within the BP $2M-$4M range; plan to fund the 18-month proof milestone plus a $600,000 six-month buffer for M19-M24. Uses: Engineering $1.25M, GTM $450,000, G&A $450,000, and buffer $600,000."
    unit: USD and months
    source: "[business-plan.yaml.fundingAsk and milestones] The 18-month target and funding band are from the BP; the selected amount and allocation are model estimates."
  - id: A13
    name: Conditional follow-on financing
    value: "$1.50M seed inflow in M25, after the 24-month restore, conversion, repeat-usage, and gross-margin proof gate; not committed and excluded from the current $2.75M ask."
    unit: USD and timing
    source: "[business-plan.yaml.milestones and investorMemo.mustBeTrue] Amount and close timing are explicit financing heuristics; base-case cash includes this conditional round."
  - id: A14
    name: Cash bridge
    value: "CashEOP = prior cash + EBITDA + financing inflow; no debt, taxes, capital expenditure, working-capital movement, collection lag, or pilot receipts are modeled."
    unit: method
    source: "Early-stage software cash-planning heuristic; same-month collection is optimistic and should be replaced with contract terms and actual payment behavior."
  - id: A15
    name: Scenario definitions
    value: "Downside: 4 gross wins at M18, M23, M29, and M35; $35,000 annual price; 2.0% monthly churn; 60% gross margin; no M25 seed; hold base hiring and spending. Upside: base Y2 wins, 21 Y3 gross wins (M25 one, M26-M35 two per month), $60,000 annual price, 0.5% monthly churn, 80% gross margin, and the same conditional M25 seed."
    unit: downside, base, and upside cases
    source: "[business-plan.yaml.gtm.pricing, milestones, operatingAssumptions, and research.yaml.market.som] Stress cases bound the unvalidated price, conversion pace, retention, cost, and financing assumptions; the upside approaches the 25-account SOM scenario."
  - id: A16
    name: Sensitivity ranges
    value: "ARPU $35,000/$50,000/$60,000; cumulative gross wins 4/8/21 Y3 additions; monthly churn 2.0%/1.0%/0.5%; gross margin 60%/75%/80%; CAC $120,000/$84,000/$65,000; seed fails/closes M25/closes M24; solutions hire M12/M18/M22."
    unit: downside, base, and upside
    source: "[A3-A13 and business-plan.yaml.operatingAssumptions] One-variable cash and revenue tests except where funding or customer-addition changes are explicitly named."
  - id: A17
    name: Directional operating-efficiency comparison
    value: "Compare annual revenue per FTE directionally with $200,000-$400,000 per FTE, the illustrative startup SaaS range in the supplied financial-model template; not a company target or a validated peer set."
    unit: USD per FTE-year
    source: "Startup-finance heuristic shown in the supplied financial-model template; use only as a directional scale check."
modelTraceability:
  period: "A1; date follows the upstream artifacts and M1 begins in 2026-11."
  revenue: "A2-A6; monthly revenueK = customersEop x A3 / 12 after A6 churn and A5 gross additions; paid pilot fees are excluded."
  costs: "A7-A10; salariesK rolls up the role-by-role hiring schedule; cogsK = 25% of revenueK; opexK = salariesK + salesMarketingK + researchDevelopmentK + generalAdministrativeK."
  cash: "A12-A14; cashEopK rolls from EBITDA and financingInflowK, including the conditional M25 seed in A13."
  unitEconomics: "A3, A6, A9, and A11; LTV = monthly gross profit / monthly churn; CAC uses allocated founder sales time and non-payroll S&M."
  scenarios: "A15-A16; the base case matches totals, downside removes the seed, and upside tests the BP 25-account SOM path."
