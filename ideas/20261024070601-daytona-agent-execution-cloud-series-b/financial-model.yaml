modelDiagram:
  title: unit economics flow
  mermaid: |
    flowchart LR
      Accounts[Qualified platform accounts] --> Pilots[Paid restore pilots]
      Pilots --> Conversion[Production conversion]
      Conversion --> Usage[Validated restores and storage]
      Usage --> Revenue[Recurring account revenue]
      Revenue --> COGS[Cloud, egress, and variable support]
      COGS --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Cash after payroll and operating costs]
modelSanity:
  - checkName: Revenue engine
    finding: "At $50K production ARPU, eight gross wins leave 7.2 expected active accounts at M36 and drive $282.9K of Y3 revenue."
  - checkName: Must go right
    finding: "Two of three paid pilots must convert by M18 and cross-provider restores must support at least 70% gross margin before the conditional M25 seed."
  - checkName: Model breaks if
    finding: "If the $1.5M M25 seed fails, base cash reaches about -$499K by M36, while the lower-sales downside reaches -$718K."
  - checkName: Next-round proof
    finding: "The M24 gate for the conditional seed is at least 95% verified restores, two pilot conversions, repeat usage, and an accepted path to 70% gross margin."
sanityChecks:
  ruleOf40: "Y3 revenue growth ~192% + EBITDA margin ~-409% = ~-217% Rule of 40; not a meaningful scale metric at this low revenue base."
  burnMultiple: "About 6.9x Y3 EBITDA cash burn / $167.7K net new ARR, excluding financing; this is unsustainable without materially faster conversion or lower spend."
  revenuePerFte: "About $56.6K Y3 revenue per 5 average FTE versus the directional $200K-$400K SaaS heuristic in A17."
  flags:
    - "Base cash depends on an uncommitted $1.5M seed in M25; without that financing the otherwise-base case reaches about -$499K by M36."
    - "The downside case combines weaker adoption and no seed, reaches a -$718K cash low point, and would require earlier financing or expense cuts."
    - "Base case reaches only about 7.2 active production accounts by M36, well below the BP and research 25-account SOM scenario."
    - "No capsule-specific paid demand, retention, or restore-cost evidence exists; $50K ARPU, 1% monthly churn, and 25% COGS remain hypotheses."
    - "Pilot receipts are excluded even though the BP targets three paid pilots by M12, so forecast revenue is conservative and pilot unit economics are not represented."
    - "CAC payback is 26.9 months and LTV/CAC is 3.7x under the assumed churn; payback exceeds the 18-month pre-seed runway."
    - "Y3 Rule of 40 is about -217%, burn multiple is about 6.9x, and revenue per FTE is below the directional SaaS range; the base case is pre-scale."
