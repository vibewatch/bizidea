slug: portable-agent-resume-capsules
date: "2026-10-24"
executiveSummary: >-
  Portable Agent Resume Capsules is an execution-layer SDK and service for reconstructing a coding-agent task from a verified safe-point capsule in a different compatible sandbox. The beachhead is coding-agent vendors running long, multi-step repository migration or dependency-upgrade jobs, sold first to platform engineering leaders who can expose loop boundaries and measure rerun costs. The MVP captures a repository delta, pinned runtime manifest, and agent-visible tool history, then verifies a clean restore; it does not migrate arbitrary process memory or replay external side effects. Research supports stateful pause, resume, and fork requirements and shows adjacent budget for managed sandboxes, but it does not quantify lost-progress frequency or demand for portable restores. Daytona, E2B, AWS, framework persistence, and native agent sessions already solve meaningful parts of this workflow, so the company wins only when a buyer has a real cross-provider or provider-change requirement. The researched $250M TAM, $25M SAM, and $1.25M SOM are scenario estimates based on assumed accounts and $50,000 annual spend, not validated market measurements. Founder-led sales will qualify that requirement, run paid restore pilots, and convert only after measured avoided work and security approval. A pre-seed round should fund 18 months to prove one agent-loop adapter across two execution providers, secure three paid pilots, and establish whether repeatable restores support a standalone business.
problem:
  - Coding-agent teams may lose workspace changes and tool-return context when a long repository task is interrupted or moved to another runtime, causing reruns or manual recovery.
  - Restarting from a prompt or last committed patch can repeat model and compute work, while continuing from incomplete context can create stale or unsafe changes.
  - The research establishes lifecycle needs and adjacent sandbox spend, but does not quantify interruption frequency, avoidable loss, or capsule-specific willingness to pay.
solution:
  - Provide an SDK adapter for one coding-agent loop that emits a capsule only at declared safe tool-turn boundaries.
  - Bind source revision and worktree delta to a pinned dependency/runtime manifest and agent-visible transcript and tool results; exclude credentials and never claim arbitrary process-memory migration.
  - Reconstruct in a fresh compatible sandbox, verify hashes and required local checks, and fail closed on unsupported state; do not automatically replay external side effects.
  - Offer encrypted capsule storage and validated-restore metering after customer security review, with customer-controlled keys or storage where required.
whyWeWin:
  - The proposed contract joins agent-loop state, repository changes, runtime requirements, and a fail-closed restore check; reviewed native snapshots and session APIs are provider- or framework-scoped.
  - A cross-provider conformance matrix and real restore-failure corpus can reduce integration risk over time, but are a moat to build, not an existing advantage.
  - The product stays neutral across execution providers rather than competing to sell sandbox compute; buyers who are single-provider and satisfied with native recovery are not target customers.
strategicChoices:
  beachhead: Coding-agent vendors with multi-step repository migration or dependency-upgrade jobs, exposed safe tool-turn boundaries, and a concrete need to change or recover across sandbox providers.
  wedgeRationale: These jobs have explicit repository artifacts and testable completion checks, making saved progress and restore correctness observable faster than broad assistant workflows. Resumption is limited to supported loop boundaries and application-level state rather than arbitrary process memory, which limits coverage and adds adapter work; cross-provider mobility matters only when native snapshots are insufficient.
  sequencingRationale: First instrument loss and prove one loop across two providers; then close paid pilots and security reviews; only after repeatable restores should the team add framework adapters, managed storage scale, or provider partnerships. This order limits adapter and data-retention work before a buyer demonstrates value.
  notYet:
    - Do not support arbitrary process-memory migration, unmodeled OS state, or automatic replay of non-idempotent external tools.
    - Do not build or operate a sandbox execution cloud; use provider runtimes and invest in a neutral compatibility contract.
    - Defer broad enterprise developer-platform teams, general workflow orchestration, additional agent frameworks, and marketplace distribution until the vendor beachhead converts.
market:
  tam: "$250M annual scenario: 5,000 assumed eligible global accounts at $50,000 annual spend each; neither account count nor willingness to pay is measured."
  sam: "$25M annual scenario: 500 assumed accounts with compatible loop hooks and a real cross-provider or recovery need at the same assumed $50,000 annual spend."
  som: "$1.25M recurring-revenue scenario: 25 paying accounts at $50,000 annual equivalent; this is an adoption scenario, not a forecast."
  segments:
    - Coding-agent vendors running high-volume repository-changing jobs in disposable workspaces.
    - Agent framework maintainers and execution-cloud operators that need a portable checkpoint contract.
  buyingProcess: The platform engineering team validates safe-boundary integration and restore correctness; its VP or director owns the likely budget, while security and infrastructure teams can veto a new code-and-transcript storage boundary. Qualify on an actual provider-change, preemption, or recovery case, then seek a paid pilot before production procurement.
product:
  mvp: Ship one coding-agent-loop adapter that captures source revision, worktree delta, pinned runtime/dependency manifest, and tool-return context at declared safe turns. Restore into a clean sandbox on a second provider, verify hashes and selected tests, and refuse unsupported state or external-side-effect replay.
  sixMonth: Complete paired restores for one supported loop across two providers, publish the supported runtime matrix, and run paid pilots with customer-controlled encryption or storage controls agreed during security review.
  twelveMonth: Productionize the verifier, capsule versioning, retention/deletion controls, audit events, and usage metering; add a second agent adapter only if pilot demand repeats the same integration need.
  twentyFourMonth: Expand supported runtime profiles and a second agent loop from customer pull, offer managed storage where buyers approve it, and publish provider-neutral conformance results without promising arbitrary process migration.
  keyBets:
    - Buyers will pay for portability only when a concrete recovery or provider-change event makes native snapshots insufficient.
    - Declared loop boundaries plus repository/runtime state can restore a useful subset of coding tasks without requiring full process migration.
    - Verification and fail-closed behavior can make an application-level restore safe enough for production coding workflows.
    - Customer-controlled encryption and storage options can clear security review without making deployment and support uneconomic.
gtm:
  wedge: Founder-led paid pilots for coding-agent vendors with long repository jobs, instrumented rerun cost, and a verified cross-provider recovery need; start with one framework adapter and two runtime profiles.
  channels:
    - Developer-first SDK, executable sample, and compatibility results published in the selected framework's documentation and package ecosystem.
    - Direct founder outreach to platform engineering leaders at coding-agent vendors, qualifying actual multi-provider use, preemption, or provider migration.
    - Framework-maintainer design partnerships for stable safe-boundary hooks; approach execution providers only after a working neutral restore exists.
  funnelTargets: "Operating target, not observed conversion: 30 qualified accounts to 10 instrumented discovery/design partners to 3 paid pilots in 12 months; convert at least 50% of pilots to production by month 18."
  pricing: Start with an assumed $10,000–$20,000 paid 6–8 week pilot, then price annual usage on checkpoint GB-hours plus validated restores, with a paid fee for each additional runtime-profile compatibility test. The pilot and annual price are hypotheses to test against measured avoided rerun and recovery cost; adjacent sandbox prices are not evidence of capsule willingness to pay.
businessModel:
  revenueStreams:
    - Usage fees for encrypted checkpoint storage measured in GB-hours.
    - Fees per validated restore, with enterprise limits and retention configured by contract.
    - Paid compatibility tests and support for additional agent-loop or runtime profiles.
  unitOfValue: One eligible coding-agent job restored to a verified working state without repeating completed tool calls.
  targetGrossMarginPct: 70
  expansionLevers:
    - More eligible jobs and longer retention per production customer.
    - Additional validated runtime profiles and agent-loop adapters.
    - Enterprise controls, customer-managed keys, and support for customer-hosted storage where demanded.
strategyMap:
  northStarMetric: Share of eligible paused jobs restored to a verified working state without repeating completed tool calls.
  inputMetrics:
    - Eligible safe-boundary checkpoints captured per active customer.
    - Restore verification pass rate by loop and runtime profile.
    - Median avoided model/compute work and human recovery time per successful restore.
    - Paid-pilot-to-production conversion and repeat validated restores per production account.
    - Variable storage, retrieval, and support cost per validated restore.
  moatsToBuild:
    - Versioned safe-boundary adapters and a public compatibility matrix across agent loops and sandbox profiles.
    - Restore verifier and consented, non-content failure outcomes that improve compatibility without retaining customer source or transcripts as a data moat.
    - Trusted neutral integrations and security controls that reduce the cost of adopting more than one execution provider.
  killCriteria:
    - After interviews and instrumentation with 10 qualified teams, fewer than 3 confirm a funded cross-provider or recovery problem with measurable avoidable cost; narrow the segment or stop the managed-product thesis.
    - Across 100 paired eligible task restores on the supported matrix, fewer than 95% pass required workspace verification, or any resume duplicates a non-idempotent external side effect; halt production rollout and reassess the boundary contract.
    - Fewer than 3 qualified buyers sign paid pilots by month 12, or no pilot converts to production by month 18; do not expand the team or adapter scope.
    - After 3 production pilots, modeled gross margin remains below 70% at prices buyers accept; revise retention, storage, or price before scaling.
  mermaid: |
    flowchart LR
      Pain[Measured cross-provider recovery pain] --> Adapter[One safe-boundary adapter]
      Adapter --> Pilot[Paid two-provider pilot]
      Pilot --> Restore[Verified restore and avoided-work proof]
      Restore --> Production[Production usage contract]
      Production --> Matrix[Compatibility matrix and selective expansion]
investorMemo:
  verdict:
    call: Watch
    conviction: Low-to-moderate; the lifecycle problem and technical wedge are plausible, but cross-provider urgency and standalone willingness to pay remain unproven.
    whyBelieve: Daytona, E2B, and framework documentation confirm stateful lifecycle needs and substantial adjacent execution spend, while reviewed public docs do not show this exact verified cross-provider contract.
    whyDoubt: Native snapshots, framework and coding-agent session persistence, and restart workflows are strong substitutes; the Crab preprint also overlaps turn-aware checkpointing, while research found no measured lost-progress rate or paid capsule customer.
    nextDiligence: Require a paid design partner to restore the same repository task across Daytona and one independent provider, with verified state, no duplicated side effects, and measured avoided work.
  firstCustomer:
    title: Platform engineering team at a coding-agent vendor
    profile: A vendor runs multi-step repository migration or dependency-upgrade jobs in disposable sandboxes and can instrument safe tool-turn boundaries.
    trigger: A planned move between execution providers, recurring preemption, or costly recovery exposes work that provider-specific snapshots cannot carry to the target runtime.
    buyer: VP or Director of Platform Engineering
    initialContract: "Test a $10,000–$20,000 paid 6–8 week pilot, then convert to a $30,000–$60,000 annual usage contract if repeated restores and avoided work support it; these are operator price hypotheses, not observed capsule pricing."
  mustBeTrue:
    - At least 3 of the first 10 qualified coding-agent vendors have a funded cross-provider or recovery requirement rather than relying adequately on native snapshots.
    - Instrumented target jobs incur repeatable model, compute, or human recovery cost large enough that buyers can justify the proposed annual contract from avoided work.
    - One supported agent loop restores across two independent providers with at least 95% of eligible test tasks passing workspace checks and zero duplicated non-idempotent side effects.
    - At least 3 qualified buyers pay for pilots and at least half of completed pilots convert to production usage by month 18.
    - Production buyers accept the capsule security model and usage pricing at a path to at least 70% gross margin without the company retaining source content for a data moat.
  diligenceQuestions:
    - For the last 90 days of repository-agent jobs, what share were interrupted or moved, and what model, compute, and human recovery cost did each create?
    - Which target accounts actually run the same agent workflow across providers, and what specific trigger makes native snapshots insufficient?
    - Can a paired restore preserve required transcript, tool outputs, worktree, and dependencies while safely handling credentials and external side effects?
    - Will platform and security buyers approve the proposed storage boundary, retention, deletion, key control, and data-residency terms for a paid pilot?
    - What price and annual usage commitment will at least three buyers sign, and does expected storage, egress, and support cost leave a viable gross margin?
operatingAssumptions:
  - assumption: At least a small subset of coding-agent vendors loses enough useful progress or faces enough provider changes to fund portable recovery.
    basis: research.yaml
    validationTest: Instrument failed, paused, preempted, and migrated jobs with 10 design-partner teams; quantify repeat tokens, compute, tool work, and human recovery, and compare native-snapshot outcomes.
    decisionImpact: If incidents are rare or cheap, narrow to unusually long or regulated repository jobs; if no segment has material avoidable cost, stop the standalone service.
  - assumption: One exposed agent-loop boundary and a compatible runtime manifest are sufficient to reconstruct useful repository tasks across two providers.
    basis: idea.yaml
    validationTest: Run 100 paired tasks across Daytona and E2B or AWS; compare repository hashes, required tests, transcript/tool-return continuity, and side-effect logs, failing closed on unknown state.
    decisionImpact: If reliable restore requires arbitrary process memory or external-effect replay, reduce supported workflow scope or abandon portability rather than claim transparent migration.
  - assumption: Roughly 10% of the scenario TAM accounts have a cross-provider or recovery need and compatible loop hooks.
    basis: research.yaml
    validationTest: Review runtime/provider inventories and qualification outcomes across at least 30 named accounts; separate true cross-provider need from multi-region use within one provider.
    decisionImpact: If the eligible share is materially lower, reset SAM/SOM and test an adjacent buyer only if it has the same verified restore job.
  - assumption: Buyers will accept a new capsule data boundary with customer-controlled keys or storage.
    basis: research.yaml
    validationTest: Complete security and privacy reviews with five target buyers covering encryption, secret exclusion, tenant isolation, retention, deletion, audit events, residency, and processor terms.
    decisionImpact: If managed storage blocks adoption, offer a customer-hosted storage mode only if deployment and support economics remain viable; otherwise stop storing capsule contents.
  - assumption: GB-hour storage and per-validated-restore pricing can support at least 70% gross margin at a price justified by avoided work.
    basis: operator judgment
    validationTest: Measure storage, retrieval, egress, support, and restore-verification costs in three pilots; test price and retention tiers against buyer-approved savings.
    decisionImpact: If buyers reject the price floor or usage costs exceed it, reduce retention and payload size, change the unit of value, or do not scale the managed service.
experimentRoadmap:
  - horizon: 0–90 days
    experiment: Interview and instrument 10 qualified coding-agent platform teams on interrupted-job frequency, native recovery, and recovery cost.
    hypothesis: A subset has measurable recovery loss and a concrete provider-change or preemption trigger.
    successMetric: At least 3 teams disclose a funded use case with quantified avoidable cost and agree to a technical design session.
    owner: CEO / founding commercial lead
  - horizon: 0–90 days
    experiment: Build one safe-boundary adapter and run paired repository tasks between Daytona and E2B or AWS.
    hypothesis: Workspace, tool-return context, and pinned dependencies can be restored and verified without migrating process memory.
    successMetric: At least 95 of 100 supported task restores pass required checks, with zero duplicated non-idempotent external effects.
    owner: Founding systems engineer
  - horizon: 3–6 months
    experiment: Offer a fixed-scope paid pilot to the best-qualified design partners and test the proposed pilot and usage price.
    hypothesis: Buyers will pay for a measurable restore outcome rather than relying on native snapshots or internal scripts.
    successMetric: Three signed pilots at $10,000 or more each, or revise the segment and price before adding integrations.
    owner: CEO / founding commercial lead
  - horizon: 3–6 months
    experiment: Review the capsule data-flow and key/storage options with platform security, privacy, and procurement teams.
    hypothesis: Customer-controlled encryption and explicit retention/deletion controls can clear pilot review.
    successMetric: Four of five target security reviews identify no blocking requirement that requires storing secrets or unsupported process state.
    owner: Founding systems engineer with external security counsel
  - horizon: 6–12 months
    experiment: Run production-like restore drills with partner teams and publish a versioned compatibility and failure matrix.
    hypothesis: A repeatable verifier and supported-profile contract can keep restore quality high as provider APIs change.
    successMetric: At least 95% eligible restore verification across two providers for three consecutive monthly test runs, with all unsupported cases failing closed.
    owner: Integration engineer
  - horizon: 12–18 months
    experiment: Measure pilot-to-production conversion, repeat usage, customer-approved savings, and variable delivery cost before adding a second agent adapter.
    hypothesis: Successful restores recur often enough to support annual usage contracts and target gross margin.
    successMetric: At least 50% of completed pilots convert, production accounts repeat validated restores, and modeled gross margin reaches 70% at accepted pricing.
    owner: CEO / founding commercial lead
operations:
  - Maintain a versioned capsule schema and automated conformance suite for every supported agent-loop and runtime profile; publish unsupported-state behavior.
  - Exclude credentials from capsules, encrypt content with customer-controlled keys where possible, minimize retained data, and support explicit retention, deletion, and audit controls before production.
  - Capture completed tool results at safe boundaries; require idempotency or operator approval for any external effect, and never replay a side-effecting tool call automatically.
  - Use customer-run or customer-selected object storage in security-sensitive pilots; add managed storage only after data-flow and procurement approval.
  - Secure non-exclusive design partnerships with framework maintainers and at least two execution providers; do not make the capsule depend on one provider's private format.
team:
  - role: Founding systems engineer
    startTiming: Month 0
    rationale: Own the capsule format, safe-boundary adapter, restore verifier, and provider-neutral reliability from the first prototype.
  - role: CEO / founding commercial lead
    startTiming: Month 0
    rationale: Recruit design partners, measure buyer pain and willingness to pay, run founder-led pilots, and control scope against the evidence gates.
  - role: Integration engineer
    startTiming: Month 4–6, after a design partner validates safe-boundary access
    rationale: Build and maintain the second provider profile and automate compatibility tests; delay this hire if the first adapter lacks a committed pilot.
  - role: Security / platform engineer
    startTiming: Month 6–9, after paid-pilot demand is established
    rationale: Harden key management, tenant isolation, retention, deletion, audit, and customer-hosted storage paths before production.
  - role: Solutions engineer
    startTiming: Month 12–18, only after at least two pilots enter production
    rationale: Support repeatable onboarding and security reviews without diverting the founders from product proof and direct selling.
milestones:
  - horizon: 0–12 months
    items:
      - Instrument 10 qualified teams and document actual interruption, recovery, native-snapshot, and provider-change cases.
      - Ship one agent-loop adapter, versioned capsule format, fail-closed verifier, and two-provider compatibility test.
      - Secure three paid pilots and measure restore success, avoided work, security objections, and buyer-approved pricing.
  - horizon: 12–24 months
    items:
      - Convert at least half of completed pilots to production and verify repeated restores across supported runtime profiles.
      - Reach the 70% gross-margin target at accepted pricing or revise storage, retention, and service scope before expansion.
      - Add a second agent adapter only when multiple paying customers request the same integration and publish conformance results.
  - horizon: 24–36 months
    items:
      - Expand to additional runtime profiles and framework integrations only where production usage and renewal support the cost.
      - Target up to 25 paying accounts as the researched SOM scenario, while treating the account count and $50,000 annual equivalent as unvalidated assumptions.
      - Establish repeatable security onboarding and non-exclusive provider/framework partnerships without building an execution cloud.
risks:
  - risk: Native provider snapshots or agent-session persistence satisfy most buyers, leaving portability an infrequent migration feature.
    likelihood: High
    impact: High
    mitigation: Qualify on real cross-provider requirements, benchmark native recovery in every pilot, and stop expansion if paid demand misses the stated gates.
  - risk: A capsule omits process or tool state, or a resumed task duplicates an external side effect.
    likelihood: High
    impact: High
    mitigation: Support declared boundaries only, capture completed tool outputs, fail closed on unknown state, and prohibit automatic side-effect replay.
  - risk: Source code and transcripts create security, privacy, residency, or procurement blockers.
    likelihood: High
    impact: High
    mitigation: Exclude secrets, minimize payloads, offer customer-controlled keys or storage, and establish retention, deletion, audit, and processor controls before production.
  - risk: Provider API and runtime differences make adapter maintenance expensive and weaken neutrality.
    likelihood: Medium
    impact: High
    mitigation: Start with two profiles, automate compatibility tests, version the capsule contract, and defer new providers until paid pull exists.
  - risk: Buyers value avoided work but reject standalone pricing or generate too few restores to support recurring revenue.
    likelihood: High
    impact: High
    mitigation: Charge for measured pilot outcomes, compare usage fees with customer-approved savings, and test margin and repeat usage before hiring for scale.
fundingAsk:
  round: pre-seed
  targetFundingRangeUsd: "$2–4M"
  runwayMonths: 18
  useOfFundsSummary: "Funds 18 months for a small founding engineering and commercial team to instrument buyer pain, build one safe-boundary adapter and two-provider verifier, complete security-ready paid pilots, and test conversion and gross margin before expanding the framework or runtime matrix."
