modelDiagram:
  title: 单位经济模型流程
  mermaid: |
    flowchart LR
      Accounts[Qualified platform accounts] --> Pilots[Paid restore pilots]
      Pilots --> Conversion[Production conversion]
      Conversion --> Usage[Validated restores and storage]
      Usage --> Revenue[Recurring account revenue]
      Revenue --> COGS[Cloud, egress, and variable support]
      COGS --> GrossProfit[Gross profit]
      GrossProfit --> Cash[Cash after payroll and operating costs]
modelSanity:
  - checkName: 收入引擎
    finding: "正式客户 ARPU 为 $50K 时，新增签约八个客户，预计有 7.2 个活跃账户，到 M36 带来 Y3 收入 $282.9K。"
  - checkName: 必须跑通的条件
    finding: "三个付费试点中必须有两个截至 M18 转化，且跨服务商恢复能力必须支撑至少 70% 的毛利率，之后才可获得有条件的 M25 种子轮融资。"
  - checkName: 模型失效情形
    finding: "若 $1.5M 的 M25 种子轮融资未能完成，基准情景现金到 M36 将降至约 -$499K；销售更弱的下行情景则降至 -$718K。"
  - checkName: 下一轮融资所需验证
    finding: "有条件种子轮融资的 M24 关口要求至少 95% 的恢复得到验证、完成两个试点转化、出现重复使用，并让毛利率达到 70% 的路径获得认可。"
sanityChecks:
  ruleOf40: "Y3 收入增长约 192% + EBITDA 利润率约 -409% = 约 -217% 的 Rule of 40；在如此低的收入基数下，这不是有意义的规模指标。"
  burnMultiple: "不含融资时，以 Y3 EBITDA 现金消耗除以新增 ARR $167.7K 计算，烧钱倍数（burn multiple）约为 6.9x；若不能显著加快转化或削减支出，这一水平难以持续。"
  revenuePerFte: "Y3 平均 FTE 为 5 人，每 FTE 收入约 $56.6K；A17 的 SaaS 方向性经验区间为 $200K-$400K。"
  flags:
    - "基准情景现金依赖一笔尚未承诺的 M25 $1.5M 种子轮融资；若没有这笔融资，其他条件仍按基准情景时，M36 现金将降至约 -$499K。"
    - "下行情景同时假设客户采用较弱且没有种子轮融资，现金最低降至 -$718K；届时需要提前融资或削减开支。"
    - "基准情景到 M36 仅有约 7.2 个活跃正式客户，远低于 BP 和研究中的 25 个客户 SOM 情景。"
    - "目前没有胶囊产品专属的付费需求、留存或恢复成本证据；$50K ARPU、每月 1% 流失率和 25% COGS 仍是假设。"
    - "尽管 BP 目标是截至 M12 完成三个付费试点，模型仍未计入试点回款，因此预测收入较为保守，也未体现试点的单位经济模型。"
    - "在假设的流失率下，CAC 回本期为 26.9 个月，LTV/CAC 为 3.7x；回本时间超过 18 个月的 pre-seed 资金跑道。"
    - "Y3 的 Rule of 40 约为 -217%，烧钱倍数（burn multiple）约为 6.9x，每 FTE 收入低于 SaaS 方向性区间；基准情景尚未进入规模化阶段。"
