slug: portable-agent-resume-capsules
date: "2026-10-24"
currency: USD
modelStartMonth: "2026-11"
assumptions:
  - id: A1
    name: 模型周期
    value: "M1 为 2026 年十一月，M12 为 2027 年十月，M36 为 2029 年十月。"
    unit: calendar
    source: "[business-plan.yaml.date 与 research.yaml.date] 预测从共同报告日期之后的第一个完整月份开始。"
  - id: A2
    name: 期初正式客户数及付费试点处理
    value: "M1 正式客户数为 0；目标是截至 M12 完成 3 个付费试点，但试点不计入经常性客户数。"
    unit: customers
    source: "[business-plan.yaml.executiveSummary、gtm.funnelTargets 与 milestones] 计划未列明任何已签约客户，目标是完成 3 个付费试点；为保持保守，模型简化处理，不把试点费用计入收入和现金流。"
  - id: A3
    name: 正式客户年收入
    value: "每个正式客户年化收入 $50,000；这是尚未验证的中位假设，取 BP 的 $30,000-$60,000 合同假设中点，并参考研究中每年 $50,000 支出的市场规模测算代理值。"
    unit: USD/客户年
    source: "[business-plan.yaml.investorMemo.firstCustomer.initialContract 与 research.yaml.bottomUpSizingDrivers] 两份资料均未报告胶囊产品专属的付费意愿。"
  - id: A4
    name: 收入确认方法
    value: "月收入 revenueK = 期末活跃正式客户数 x $50,000 / 12；新增客户从新增当月起按整月计入，流失先作用于期初客户基数，再计入新增；模型不计入试点、兼容性测试或支持收入。"
    unit: method
    source: "[business-plan.yaml.businessModel.revenueStreams 与 gtm.pricing] 这是初创企业财务模型常用的经常性收入时点经验假设；模型未计入开票和回款滞后。"
  - id: A5
    name: 基准情景正式客户新增签约数
    value: "M15、M18、M20、M23、M26、M29、M32、M35 各新增一个正式客户；截至 M36 累计新增签约 8 个，其中 2 个由目标中的 3 个试点转化而来，并于 M18 前完成。"
    unit: customers and schedule
    source: "[business-plan.yaml.gtm.funnelTargets、milestones 与 research.yaml.market.som] 两次转化达到 BP 50% 的试点转化目标；后续签约是超出初始销售漏斗的保守但尚未验证的延伸。"
  - id: A6
    name: 月度客户流失率
    value: "每月按期初正式客户数的 1.0% 计算流失；预期客户数允许为小数。"
    unit: percent per month
    source: "这是初创企业财务模型中早期 B2B SaaS 留存率的经验假设；research.yaml 中未发现胶囊产品专属的留存或续约数据。"
  - id: A7
    name: 各岗位年度全口径薪酬
    value: "CEO / 创始商业负责人每 FTE 年薪 $144,000；创始系统工程师 $180,000；集成工程师 $156,000；安全 / 平台工程师 $168,000；解决方案工程师 $144,000，均包含雇主成本和福利。"
    unit: USD/FTE年
    source: "[business-plan.yaml.team] 这些薪酬明确标注为早期软件创业公司的规划经验假设，并非公司历史薪酬数据或外部基准。"
  - id: A8
    name: 招聘时间表及薪酬汇总
    value: "CEO 和创始系统工程师于 M1 入职；集成工程师于 M5 入职，安全 / 平台工程师于 M8 入职；第二个试点转化后，解决方案工程师于 M18 入职。截至 M36 均不再纳入其他招聘；季度人数和 salariesK 按这些入职时间及 A7 汇总。"
    unit: schedule
    source: "[business-plan.yaml.team 与 strategicChoices.sequencingRationale] M5 和 M8 分别符合第 4-6 个月、第 6-9 个月的既定关口；M18 落在第 12-18 个月窗口内，并以两名试点客户转为正式客户为前提。"
  - id: A9
    name: 收入变动成本及毛利率
    value: "COGS 为确认收入的 25%，对应模型毛利率 75%；所有员工薪酬均计入运营费用，不单独分摊直接交付人员薪酬。"
    unit: percent of revenue
    source: "[business-plan.yaml.businessModel.targetGrossMarginPct 与 research.yaml.reportMemo.willingnessToPay] BP 的目标是至少 70%；25% 的 COGS 是针对早期软件基础设施、存储、流量出口、恢复验证和可变支持成本的经验假设，目前没有实测成本数据。"
  - id: A10
    name: 年度非薪酬运营预算
    value: "Y1 销售与营销 $96,000、研发 $240,000、G&A $120,000；Y2 分别为 $144,000、$192,000 和 $144,000；Y3 分别为 $216,000、$180,000 和 $180,000。"
    unit: USD by year and function
    source: "[business-plan.yaml.product、gtm、operations 与 team] 这是面向服务商测试、安全工作、创始人主导销售、法律、保险和行政管理的精益初创预算经验值；未提供供应商报价或实际费用。"
  - id: A11
    name: 全口径获客成本
    value: "每笔新增正式客户签约的全口径 CAC 为 $84,000 =（三年非薪酬销售与营销费用 $456,000 + CEO 薪酬 $432,000 的 50%）/ 8 笔新增签约；创始人时间分摊比例为假设。"
    unit: USD per customer
    source: "[A5、A7、A8、A10；business-plan.yaml.gtm.wedge]（切口）全口径 CAC 包含创始人商务时间的 50% 分摊，并非基于实际获客群组的观测值。"
  - id: A12
    name: 本轮 pre-seed 融资申请及资金用途
    value: "$2.75M 于 M1 到账，处于 BP 的 $2M-$4M 区间内；计划覆盖 18 个月验证里程碑，并为 M19-M24 预留 $600,000、相当于六个月的运营缓冲。资金用途：工程 $1.25M、GTM $450,000、G&A $450,000、缓冲 $600,000。"
    unit: USD and months
    source: "[business-plan.yaml.fundingAsk 与 milestones] 18 个月目标和融资区间来自 BP；具体融资金额及分配为模型估算。"
  - id: A13
    name: 有条件的后续融资
    value: "通过 24 个月的恢复、转化、重复使用和毛利验证关口后，M25 计入 $1.50M 种子轮融资流入；该轮融资尚未承诺，也不包含在当前 $2.75M 融资申请中。"
    unit: USD and timing
    source: "[business-plan.yaml.milestones 与 investorMemo.mustBeTrue] 融资金额和交割时间是明确列出的融资经验假设；基准情景现金流计入这笔有条件融资。"
  - id: A14
    name: 现金流桥接
    value: "CashEOP = 上期现金 + EBITDA + 融资流入；模型不计债务、税款、资本支出、营运资金变动、回款滞后或试点回款。"
    unit: method
    source: "这是早期软件公司现金规划的经验假设；同月回款的设定偏乐观，后续应依据合同条款和实际付款行为调整。"
  - id: A15
    name: 情景定义
    value: "下行：新增签约 4 个正式客户，分别于 M18、M23、M29、M35 完成；年价 $35,000；月流失率 2.0%；毛利率 60%；M25 无种子轮融资；招聘和支出维持基准情景。上行：Y2 新增客户数与基准情景一致，新增签约 21 个客户（Y3；M25 新增一个，M26-M35 每月新增两个）；年价 $60,000；月流失率 0.5%；毛利率 80%；同样计入有条件的 M25 种子轮融资。"
    unit: 下行、基准和上行情景
    source: "[business-plan.yaml.gtm.pricing、milestones、operatingAssumptions 与 research.yaml.market.som] 压力情景用于界定尚未验证的定价、转化速度、客户留存、成本和融资假设范围；上行情景接近 25 个客户的 SOM 情景。"
  - id: A16
    name: 敏感性区间
    value: "ARPU $35,000/$50,000/$60,000；新增签约数：下行/基准累计 4/8 个，上行情景 Y3 新增 21 个；月流失率 2.0%/1.0%/0.5%；毛利率 60%/75%/80%；CAC $120,000/$84,000/$65,000；种子轮未能完成/M25 完成/M24 完成；解决方案工程师于 M12/M18/M22 入职。"
    unit: 下行、基准和上行
    source: "[A3-A13 与 business-plan.yaml.operatingAssumptions] 除明确注明融资或客户新增数变化的情景外，其余均为单变量现金流和收入测试。"
  - id: A17
    name: 运营效率方向性比较
    value: "将每 FTE 年收入与所附 financial-model 模板中的 $200,000-$400,000/FTE 示例性 SaaS 初创公司区间作方向性比较；该区间不是公司目标，也不代表经过验证的同业样本。"
    unit: USD/FTE年
    source: "这是所附 financial-model 模板中的初创企业财务经验值，只用于方向性规模检查。"
modelTraceability:
  period: "A1；日期沿用上游文件，M1 从 2026-11 开始。"
  revenue: "A2-A6；月度 revenueK = customersEop x A3 / 12，在计入 A6 流失和 A5 新增签约后计算；不计付费试点费用。"
  costs: "A7-A10；salariesK 按岗位招聘时间表汇总；cogsK = revenueK 的 25%；opexK = salariesK + salesMarketingK + researchDevelopmentK + generalAdministrativeK。"
  cash: "A12-A14；cashEopK 根据 EBITDA 和 financingInflowK 滚动计算，其中计入 A13 的有条件 M25 种子轮融资。"
  unitEconomics: "A3、A6、A9、A11；LTV = 月度毛利 / 月度流失率；CAC 按创始人销售时间分摊额和非薪酬 S&M 计算。"
  scenarios: "A15-A16；基准情景与模型汇总数一致，下行情景剔除种子轮融资，上行情景测试 BP 的 25 个客户 SOM 路径。"
