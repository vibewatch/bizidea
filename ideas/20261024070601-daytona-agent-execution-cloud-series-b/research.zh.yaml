competitors:
  - name: Daytona
    stage: B 轮智能体执行云提供商
    wedge: 快速、隔离的沙箱，支持持久快照、VM 内存捕获、暂停/恢复，并提供多种运行环境选择。
    pricing: 公开按量费率包括每 vCPU 小时 $0.0504、每 GiB 小时 $0.0162，存储另行计量；企业条款通过销售团队洽谈。
    strength: 原生运行时控制、快照工作流，以及每月处理数十万个沙箱的公开客户案例。
    weaknessVsUs: 审阅的文档介绍了 Daytona 内部的恢复和快照功能，没有提到厂商中立的状态胶囊。这只是公开文档未提及，不代表私人功能不存在。
    sourceRefs:
      - 2
      - 3
      - 4
      - 20
      - 21
  - name: E2B
    stage: 商业化 AI 沙箱提供商
    wedge: 面向智能体的 Linux microVM，支持文件系统与内存快照、一对多创建沙箱，以及同一沙箱的暂停/恢复。
    pricing: 公开 Pro 计划为 $150 per month，另加用量费；Enterprise 公开的月最低消费为 $3,000 monthly，其他条款需协商。
    strength: 快照 APIs 清晰，会话、并发和用量限制也有公开说明，是同一提供商内恢复的强力直接替代方案。
    weaknessVsUs: 审阅文档中的快照 IDs 和恢复流程均为 E2B 专属；创建快照时连接还可能中断，客户端也必须处理这种情况。
    sourceRefs:
      - 5
      - 6
      - 7
  - name: Amazon Bedrock AgentCore 与 Bedrock 会话
    stage: 商业化超大规模云平台
    wedge: 隔离的智能体 microVM 会话、可配置生命周期、持久文件系统选项，以及存取工作流状态和对话检查点的 APIs。
    pricing: 引用的文档页面没有标价；AWS 费用取决于账户和具体服务。
    strength: AWS IAM、KMS 和托管会话基础设施可以把状态处理能力捆绑进现有云服务合同。
    weaknessVsUs: 引用的 APIs 和运行时生命周期都限定在 AWS 范围内；工作流检查点不会自动重建另一家提供商的完整沙箱环境。
    sourceRefs:
      - 26
      - 27
      - 28
      - 30
  - name: Temporal 与 LangGraph
    stage: 商业化持久执行平台 + 开源智能体框架
    wedge: 保存图或工作流进度、重试失败活动，并在长时间等待或编排中断后继续执行，无需让进程一直运行。
    pricing: LangGraph 为开源项目；引用的博客没有说明 Temporal Cloud 定价。
    strength: 支持持久工作流执行，并在应用定义的节点上恢复，直接覆盖进程故障和等待人工处理的场景。
    weaknessVsUs: 这些层保存的是工作流状态和执行历史，而非任意沙箱文件系统、进程及运行时状态的可移植且经验证副本。
    sourceRefs:
      - 10
      - 11
      - 13
  - name: 原生编码智能体会话持久化
    stage: 成熟且快速演进的产品功能
    wedge: Claude Code 回退、OpenAI Agents SDK 会话和 GitHub Copilot SDK 持久化，可以在多次运行及特定重启后保留受支持的对话、工具或规划状态。
    pricing: 已捆绑在各自的智能体或 API 产品中；没有引用独立检查点价格。
    strength: 对已经选定同一编码智能体产品及其受支持会话后端的客户来说，集成成本低。
    weaknessVsUs: 审阅的文档没有定义智能体厂商和沙箱提供商之间的通用交换格式；应用会话历史也不等同于完整、可移植的 OS/运行时快照。
    sourceRefs:
      - 12
      - 15
      - 16
      - 17
regulatoryTechnicalConstraints:
  - point: 仓库和对话记录可能包含个人数据或机密代码；托管存储必须明确数据处理者角色、保留/删除控制、访问边界，以及数据跨司法辖区时适用的传输条款。
    sourceRefs:
      - 20
      - 23
  - point: 自 2 August 2026 起生效的 EU AI Act 透明度规则影响某些面向客户的 AI 交互和生成内容，但不会自动把基础设施检查点 SDK 变成高风险 AI 系统。
    sourceRefs:
      - 22
  - point: 完整进程恢复依赖 OS 可见资源，例如进程树、内存映射、文件描述符和共享资源；应用层状态胶囊必须明确排除不支持的运行时状态。
    sourceRefs:
      - 13
      - 14
  - point: 不同提供商的快照 APIs 各不相同，而且可能中断活动流；要实现可移植性，需要适配器、重连处理和兼容性测试，而不是寄希望于一个通用恢复调用。
    sourceRefs:
      - 3
      - 5
      - 26
  - point: 不能假设外部工具产生的影响可以撤销或安全重放；产品应捕获已完成的结果，只在明确边界恢复，并遵循副作用处理规则。
    sourceRefs:
      - 11
      - 13
validationSignals:
  - point: WRITER 报告称，其内部平台在日处理量超过 20,000 个沙箱后变得难以维护，随后用 Daytona 在一个月内创建了 300,000 个沙箱；这些数字是供应商发布的客户说法。
    sourceRefs:
      - 20
  - point: AfterQuery 表示，它用 Daytona 替代基于 GKE 的方案，为智能体试验管理沙箱状态版本，每周节省 40 多个工程工时；这同样是供应商发布的客户案例。
    sourceRefs:
      - 21
  - point: Daytona 和 E2B 都公开了快照、暂停及恢复功能，证明客户确有相关需求，也说明同一提供商内的替代方案很强；这并不证明市场需要跨提供商状态胶囊。
    sourceRefs:
      - 3
      - 5
  - point: Stack Overflow 2025 年调查显示，31% 的受访者目前使用 AI 智能体，46% 不信任 AI 输出的准确度；这既说明有采用空间，也表明验证和信任仍是障碍。
    sourceRefs:
      - 19
  - point: Crab 是一篇独立技术预印本，评估了智能体沙箱检查点/恢复并报告工作负载层面的恢复结果；这削弱了“安全边界检查点机制尚无人涉足”的主张。
    sourceRefs:
      - 13
openQuestions:
  - 仓库智能体任务需要多长时间，或容易被中断到什么程度，才值得采用可移植恢复？
  - 目标买家中有多少确实会在同一智能体工作流中使用多家沙箱提供商？
  - 状态胶囊能否恢复智能体可见的对话记录和工作区，同时不漏掉保证正确性所需的进程或工具状态？
  - 要存储私有仓库，至少需要怎样的安全水平、自托管和数据驻留选项？
  - 客户更偏好标准格式加自有存储，还是托管式加密状态胶囊服务？
  - 哪些智能体循环钩子能够暴露安全边界，而不要求大幅改动框架？
  - 产品如何证明恢复没有重复触发外部副作用或泄露凭证？
  - 假设中的全球 5,000 个买家账户和每年 $50,000 预算，究竟有多接近真实情况？
