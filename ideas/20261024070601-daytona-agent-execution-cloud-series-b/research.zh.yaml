championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: Daytona 将智能体计算环境描述为短时、有状态、需要暂停和分叉的任务；独立报道也证实执行云需求存在，且沙箱可快速启动。这验证了运行时生命周期痛点，却不能证明客户愿意为跨提供商状态胶囊付费。
      sourceRefs:
        - 1
        - 31
    - point: 审阅过的运行时和框架文档只展示了限定于特定提供商或框架的持久化能力，没有说明存在可交换格式，能在另一家兼容执行提供商中重建并验证仓库智能体任务。这留下了一个合理、可测试的可移植性切口，但还不能证明检查点底层机制新颖。
      sourceRefs:
        - 3
        - 5
        - 10
        - 26
        - 30
    - point: 如果状态胶囊把智能体循环上下文、仓库变更、锁定的环境清单和失败即关闭的恢复校验器绑定起来，就可能解决比 VM 快照或对话检查点更窄的互操作问题；审阅过的产品页面没有展示过这种精确的跨提供商契约。
      sourceRefs:
        - 2
        - 12
        - 13
        - 16
  evidenceAgainst:
    - point: 检查点、暂停/恢复和分支能力在沙箱中已很常见：Daytona 提供持久快照和 VM 内存捕获，E2B 则支持包含完整文件系统与内存的快照，并能恢复沙箱。
      sourceRefs:
        - 3
        - 5
        - 7
    - point: 原生编码智能体和框架产品已经能在多次运行之间保留对话、工具或图状态，包括 Claude Code 回退、GitHub Copilot SDK 持久化、OpenAI 会话和 LangGraph 检查点。
      sourceRefs:
        - 10
        - 12
        - 15
        - 16
        - 17
    - point: 独立研究论文 Crab 明确提出面向智能体沙箱、能感知交互轮次的检查点/恢复方案，并报告恢复正确性有所提升。它与安全边界机制存在重叠，但没有证明商业化的跨提供商状态胶囊产品已经出现。
      sourceRefs:
        - 13
  revisedClaim: 站得住脚的新颖性主张，不是智能体检查点或沙箱恢复很少见。潜在创新在于建立一套厂商中立、可经安全审计的交换契约，把受支持的智能体循环边界与可复现的仓库状态绑定，并能在另一种运行时中验证重建结果。公开证据尚不能证明这套契约独一无二、市场有需求，或执行提供商难以将其捆绑进现有产品。
reportMemo:
  executiveTakeaways:
    - 高频智能体执行基础设施的痛点确实存在，但公开证据更指向沙箱运营成本、工程运维负担和扩容压力，而非跨提供商时智能体进度丢失。
    - Daytona、E2B、AWS、智能体框架和编码智能体厂商已经提供检查点与恢复流程中的关键组件。剩下较窄的切口是跨提供商重建和验证。
    - 目前的预算投向沙箱计算和托管执行。没有找到买家为独立的可移植状态胶囊或经验证的恢复功能付费。
    - 该机制的新颖性判断喜忧参半：安全点检查点和有状态检查点并不罕见，Crab 研究也涉及相近技术机制；跨厂商制品可移植性仍是未经验证的差异化点。
    - 按情景自下而上测算，TAM 为 $250M，首期 SAM 为 $25M，可触达 SOM 为 $1.25M；这些是由假设推导的客户账户情景，并非公开市场规模估算。
    - 最有力的证伪情景是：多数合格买家只用一家执行提供商，可以从其原生快照恢复，而且失败任务造成的成本不足以抵消新增 SDK、存储边界和安全审查的负担。
  marketDefinition: 相关市场是增量基础设施软件：在明确的智能体循环边界保存合格的编码智能体进度，再将其重建到另一家兼容的沙箱提供商中。市场不包括规模大得多的 AI 编码助手、模型推理、通用工作流编排和沙箱计算。买家是智能体平台厂商；后续也包括工程平台团队，其长时仓库修改任务需要在更换提供商或执行环境后保留工作区、工具结果和运行时配置。
  customerAndBuyer: 主要用户是编码智能体厂商的平台工程师或智能体运行时维护者；可能的预算负责人是平台工程或基础设施副总裁、总监。首批用户必须能暴露可靠的智能体循环边界，并在一次性沙箱中运行多步骤仓库任务。安全、隐私和基础设施采购团队都可能否决托管状态胶囊存储。Daytona 客户案例显示，企业已有沙箱基础设施和替代内部自建系统的预算，但尚未看到专门用于跨提供商检查点可移植性的预算科目。
  buyingTriggers:
    - point: 当沙箱吞吐量升到一定规模，自建执行环境就会占用工程产能；WRITER 表示，其自研系统在日处理量超过 20,000 个沙箱后，已变成需要全职维护的运营负担。
      sourceRefs:
        - 20
    - point: 运行数小时、且需要反复为环境做版本管理的智能体任务，会促使团队测试持久状态捕获。AfterQuery 描述了手动保存环境状态的做法，并称迁移到托管提供商后每周节省 40 多个工程工时。
      sourceRefs:
        - 21
    - point: 计划更换运行时厂商、提供商发生故障，或采用竞价/可抢占实例策略，都可能让同一提供商内的快照不够用；这只是筛选客户时的假设，尚无事故频率数据支持。
      sourceRefs:
        - 3
        - 5
        - 13
    - point: 生产环境中的编码智能体采用率和平台工程关注度都已显现，但开发者调查仍显示，目前只有 31% 的受访者在使用 AI 智能体。
      sourceRefs:
        - 18
        - 19
        - 25
  willingnessToPay:
    summary: 相邻的沙箱支出可以观察到：Daytona 公布了按量计费的 vCPU、内存和存储费率；E2B 的 Pro 计划月费为 $150 monthly，Enterprise 的月最低消费为 $3,000 monthly。Daytona 客户案例还称，替代内部自建系统带来了显著节省，并释放了工程时间。这些只能证明执行环境有预算，不能直接证明客户对可移植检查点的付费意愿；也没有找到付费恢复试点或针对状态胶囊的客户报价。
    sourceRefs:
      - 4
      - 6
      - 20
      - 21
      - 31
  competitiveLandscape: 直接相邻的竞争者包括有状态沙箱提供商 Daytona 和 E2B，它们能为自己的环境创建快照或恢复环境；AWS Bedrock AgentCore 则在自家服务中提供隔离会话、持久会话状态和工作流检查点 APIs。Modal 提供安全的代码执行沙箱和持久卷，但审阅范围内没有公开页面记录同类快照流程。替代方案包括 LangGraph 检查点、Temporal 持久执行、OpenAI Agents SDK 会话、GitHub Copilot SDK 会话持久化、Claude Code 回退、特定提供商的 VM 快照、基于 CRIU 的内部方案、保存日志、Git/工作树检查点，以及从提示词重新启动。没有公开页面说明存在这里设想的、经过签名、加密和验证的状态胶囊格式；公开文档未提及，不代表私人方案或定制系统中不存在。
  incumbentThesis:
    - incumbentClass: 智能体沙箱与执行云提供商
      point: Daytona、E2B 和 AWS 可以让任务留在自家运行时里，也已提供快照、有状态会话或生命周期 APIs。客户只用一家云、重视低延迟，或无需迁移进行中的任务时，通常会默认选择原生方案；只有当提供商选择权或迁移风险足以抵消新增数据边界的代价，可移植产品才有价值。
      sourceRefs:
        - 2
        - 3
        - 5
        - 26
        - 30
    - incumbentClass: 智能体框架与持久工作流平台
      point: LangGraph 保存图状态，Temporal 则能让受支持的工作流跨故障、重试和人工等待继续运行。它们本身不承诺任意沙箱 OS 状态都可移植；但如果团队能在框架边界上表达工具产生的影响，这类方案就是强有力的默认选择。
      sourceRefs:
        - 10
        - 11
        - 13
    - incumbentClass: 原生编码智能体会话持久化
      point: Claude Code、GitHub Copilot SDK 和 OpenAI Agents SDK 已能为受支持的会话保留或重新载入对话与工具状态。客户继续使用同一智能体和运行时时，原生方案更简单；但现有文档没有证明它们能提供跨智能体、跨沙箱通用的工作区格式。
      sourceRefs:
        - 12
        - 15
        - 16
        - 17
    - incumbentClass: 云 IaaS 与内部平台团队
      point: 团队可以基于 Kubernetes、VM 快照、对象存储和 Git 自建，而不必再引入供应商。当定制控制权或已有云服务承诺更重要时，自建方案更占优；WRITER 和 AfterQuery 案例显示，至少有一些团队后来愿意付费摆脱运维负担，不过这些案例均由公司发布。
      sourceRefs:
        - 14
        - 20
        - 21
    - incumbentClass: 从提示词、日志或已提交补丁重启
      point: 当任务较短、源代码变更已提交，或工具影响可以重现时，重启是一种成本低、便于审计的现状方案。缺点是重复消耗模型调用和计算资源，也会丢失瞬时状态；但审阅的来源没有衡量这类损失的频率和成本。
      sourceRefs:
        - 12
        - 13
        - 19
  regulatoryLandscape: 状态胶囊可能包含专有源代码、智能体对话记录、工具输出，以及从仓库或日志复制来的个人数据。处理个人数据时，GDPR 即适用；托管提供商需要明确处理者角色、保留期限、访问和删除机制，以及跨境传输安排。欧盟委员会指出，相关跨境传输可使用标准合同条款。EU AI Act 中于 2 August 2026 生效的透明度规则适用于某些 AI 交互和生成内容；基础设施 SDK 不会仅仅因为承载智能体状态就自动成为高风险 AI 系统，因此需要结合客户具体情形判断角色和义务。NIST《生成式 AI 概况》是自愿性风险管理指南，不是产品认证。
  technologyLandscape: 实现方案远不止复制工作树：工具返回上下文、依赖版本、密钥、运行时清单、进程、套接字和外部副作用都可能发生偏差。Daytona 区分仅含文件系统的容器快照，以及同时包含文件系统和内存的 VM 快照；E2B 提醒，创建快照会短暂中断活动连接。CRIU 展示了进程恢复涉及的 OS 资源，Crab 论文则指出智能体可见检查点与 OS 侧副作用之间存在缺口。只有明确支持的循环边界和兼容的运行时配置，才可能使用应用层状态胶囊；它不能安全承诺任意进程迁移，也不能承诺重放外部副作用。
  distributionChannels:
    - point: 先推出面向开发者的 SDK 和示例适配器，通过智能体框架文档与软件包生态分发；LangGraph、OpenAI Agents SDK 和 GitHub Copilot SDK 都提供会话或持久化接口，可作为早期集成入口。
      sourceRefs:
        - 10
        - 15
        - 16
    - point: 直接向编码智能体厂商的平台工程团队销售付费恢复试点，并用当前沙箱扩容压力及替换内部自建系统的需求筛选客户。
      sourceRefs:
        - 20
        - 21
    - point: 只有跨提供商恢复真正跑通后，再与执行提供商和云市场联合推广兼容性测试；现有提供商 APIs 都是各自产品专属的集成接口。
      sourceRefs:
        - 3
        - 5
        - 26
  partnershipEcosystem:
    - point: 框架维护者可以开放安全边界钩子和稳定的序列化契约，降低每个智能体适配器的风险。
      sourceRefs:
        - 10
        - 15
        - 16
    - point: 沙箱提供商可以提供运行时配置、快照元数据、存储传输和测试环境；合作必须保持厂商中立，不能让状态胶囊依赖单一提供商。
      sourceRefs:
        - 2
        - 3
        - 5
        - 26
    - point: 企业安全团队以及 KMS 或客户自管存储提供商都是关键伙伴，因为状态胶囊可能包含代码和工具调用轨迹。
      sourceRefs:
        - 20
        - 23
        - 30
  dataMoats:
    - point: 潜在护城河是不断扩大的兼容性矩阵，覆盖智能体循环、运行时配置、恢复校验和故障案例；只有真实集成落地并积累经客户同意的结果数据后，这项资产才会存在。
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - point: 留存客户源代码或对话记录本身并不能构成可靠护城河，反而会带来安全责任。更好的做法是只保留最少元数据，并在客户主动选择加入后，用不含内容的恢复结果来学习兼容性。
      sourceRefs:
        - 17
        - 20
        - 23
  geographicConsiderations:
    - point: 首批买家和文中引用的沙箱提供商主要面向美国（US）市场；跨区域存储、数据驻留要求和企业安全审查都可能影响提供商选择。
      sourceRefs:
        - 20
        - 31
    - point: 欧洲部署若涉及个人数据，必须明确数据处理角色和传输条款；AI Act 透明度义务也可能影响面向客户的智能体产品。
      sourceRefs:
        - 22
        - 23
  sensitivityCases:
    - case: 原生快照和会话持久化已足以满足大多数客户。
      impact: 差异化的可移植层将退化为可选迁移功能，重复使用率偏低；提供商原生存储或工作流工具更可能胜出。
      sourceRefs:
        - 3
        - 5
        - 10
        - 26
    - case: 智能体任务大多较短，或能通过 Git 和日志安全重启。
      impact: 每次恢复省下的模型调用和计算量太少，不足以支撑新增 SDK 和安全审查；滩头市场会收窄到长时任务或频繁中断的任务。
      sourceRefs:
        - 12
        - 13
        - 19
    - case: 应用层状态胶囊可以恢复仓库状态，却无法恢复瞬时工具状态或进程状态。
      impact: 产品仍可能适用于写代码任务，但必须收窄成功主张，并会失去依赖非幂等工具或长时运行进程的任务。
      sourceRefs:
        - 10
        - 13
        - 14
  validationPlan:
    - priority: high
      question: 目标仓库智能体任务有多频繁会丢失可恢复进度？每次事故造成多少成本？
      evidenceToGather: 至少在 10 个共创客户团队中，对失败、暂停、被抢占及迁移提供商的任务做埋点；记录重复消耗的模型 token、计算时间、工具调用次数、人工恢复分钟数，以及原生快照是否已经恢复任务。
    - priority: high
      question: 同一个受支持的智能体循环，能否在两家互相独立的沙箱提供商之间恢复任务，且不重放副作用？
      evidenceToGather: 先做一个窄范围适配器，在 Daytona 与 E2B 或 AWS 之间进行成对恢复；核验仓库哈希、依赖/运行时清单、对话和工具返回的连续性、测试结果，以及遇到未知状态时失败即关闭的行为。
    - priority: high
      question: 平台买家是否愿意为独立的可移植性和经验证恢复服务付费？
      evidenceToGather: 至少取得三家合格编码智能体厂商的付费试点承诺，并将拟议合同与其现有原生快照、内部检查点代码和重启流程做比较。
    - priority: medium
      question: 状态胶囊要保存私有仓库状态，必须满足哪些数据与安全控制？
      evidenceToGather: 与平台和企业买家完成安全审查，覆盖客户控制的加密密钥、自托管对象存储、租户隔离、保留期限、删除、审计事件和密钥排除。
    - priority: medium
      question: 有多少买家确实在运营多个执行提供商，或需要迁移正在运行的任务？
      evidenceToGather: 访谈平台团队并检查运行时/厂商清单；区分真正的跨提供商恢复需求与同一厂商内部的多区域运行。
    - priority: medium
      question: 与提示词加 Git 重启相比，恢复状态胶囊能否降低总成本并提高代码验收质量？
      evidenceToGather: 用有代表性的迁移和依赖升级仓库开展盲测、成对任务；比较恢复成功率、重复模型调用、人工修正时间、测试通过率和外部副作用安全性。
  marketMapDiagram:
    title: 智能体状态可移植性格局
    mermaid: |
      quadrantChart
        title Agent-state products by specialization and urgency
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed capsule: [0.9, 0.7]
        Daytona and E2B snapshots: [0.65, 0.75]
        AWS AgentCore sessions: [0.45, 0.7]
        LangGraph and Temporal: [0.65, 0.8]
        Native coding-agent sessions: [0.4, 0.6]
        CRIU and Crab research: [0.9, 0.4]
  fiveForces:
    supplierPower:
      score: 4
      rationale: 运行时提供商掌控状态格式、计算兼容性、存储访问和恢复 APIs；可否保持中立，取决于能否接入多家厂商，不过客户也可以在多个运行时之间选择。
      sourceRefs:
        - 3
        - 5
        - 26
    buyerPower:
      score: 4
      rationale: 买家可以使用内置快照、框架持久化、开源工具或重启；在迁移仓库数据前，也可以要求满足安全和自托管条款。
      sourceRefs:
        - 5
        - 10
        - 14
        - 20
    threatOfEntrants:
      score: 4
      rationale: 框架维护者或沙箱厂商都能加入自有检查点契约；CRIU 和公开研究降低了通用检查点概念的门槛，但跨运行时的可靠性仍难保证。
      sourceRefs:
        - 13
        - 14
        - 16
    threatOfSubstitutes:
      score: 5
      rationale: 提供商原生快照、智能体会话、图检查点、持久执行、Git/工作树快照以及从提示词重启，已经覆盖这项工作的大部分环节。
      sourceRefs:
        - 3
        - 5
        - 10
        - 11
        - 12
        - 16
    competitiveRivalry:
      score: 4
      rationale: 沙箱和智能体状态已是 Daytona、E2B、AWS、Modal、各类框架及编码智能体厂商的相邻产品重点；功能捆绑可能压缩独立可移植层的空间。
      sourceRefs:
        - 2
        - 5
        - 8
        - 9
        - 26
        - 30
  pestle:
    - factor: economic
      impact: positive
      point: 智能体工作负载增长带动沙箱基础设施支出，客户案例也称托管执行释放了工程产能；但没有来源把这笔支出归因于可移植性。
      sourceRefs:
        - 18
        - 20
        - 21
    - factor: social
      impact: negative
      point: 开发者使用 AI 智能体的比例仍低于广义 AI 工具使用率；许多受访者对可信度不足或安全风险表示担忧，采用尚未普及。
      sourceRefs:
        - 19
    - factor: technological
      impact: neutral
      point: 沙箱可以快速捕获状态，但智能体可见的历史记录不会自动覆盖 OS 可见的副作用；完整进程恢复也受环境约束。
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - factor: legal
      impact: negative
      point: 仓库或对话记录中的个人数据会触发隐私和跨境处理审查；AI Act 透明度义务适用于某些面向客户的 AI 交互和输出。
      sourceRefs:
        - 22
        - 23
    - factor: political
      impact: neutral
      point: 公共风险管理指南鼓励组织治理生成式 AI 的安全与隐私风险，但 NIST 概况是自愿性指南，并未强制要求采用本产品。
      sourceRefs:
        - 24
  adoptionFrictionMatrix:
    - friction: 敏感源代码和智能体对话记录跨入新的存储边界。
      severity: high
      affectedBuyer: 企业平台工程与安全团队
      mitigation: 支持客户自管密钥或客户托管存储，尽量少存内容、排除凭证，并明确保留、删除、访问和审计控制。
      sourceRefs:
        - 17
        - 20
        - 23
    - friction: 跨内核、架构、进程状态和提供商 APIs 时，运行时与框架兼容性可能失效。
      severity: high
      affectedBuyer: 智能体运行时与基础设施维护者
      mitigation: 从一种循环和两种运行时配置开始，公开兼容性矩阵，验证哈希与测试，并在声明的安全边界之外失败即关闭。
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - friction: 现有原生快照可能让客户无需在提供商之间迁移状态。
      severity: high
      affectedBuyer: 只使用一家执行云的编码智能体平台团队
      mitigation: 优先筛选确有更换提供商、多云、故障或抢占需求的买家；销售可移植性前，先对比原生恢复效果。
      sourceRefs:
        - 3
        - 5
        - 26
    - friction: 工具调用可能产生检查点无法回滚或安全重放的外部副作用。
      severity: high
      affectedBuyer: 使用外部工具运行仓库智能体的平台团队
      mitigation: 捕获已完成的工具输出，只在声明安全的轮次之后创建检查点；副作用必须满足幂等条件或取得操作人员明确批准，绝不自动重放调用。
      sourceRefs:
        - 11
        - 13
        - 14
    - friction: 企业采购可能要求在试点前提供 DPA、数据驻留、删除机制和安全证据。
      severity: medium
      affectedBuyer: 安全、隐私与采购团队
      mitigation: 正式集成前准备数据流图、数据处理条款、保留控制、区域存储选项和安全架构审查材料。
      sourceRefs:
        - 20
        - 22
        - 23
market:
  tam:
    value: $250M
    rationale: 这是针对狭义软件品类的情景估算，并非公开市场数据：假设全球有 5,000 家平台团队或智能体厂商运行高吞吐量仓库智能体任务，每个账户每年为可移植检查点存储、恢复和兼容性支付 $50,000。计算：5,000 × $50,000 = 年度 TAM $250M。GitHub 报告的 180M 以上开发者规模，以及 Stack Overflow 调查中目前使用 AI 智能体的 31% 开发者，说明开发者生态规模庞大，但都没有衡量符合条件的买家账户数。年度预算也只是运营方假设，仅参考了相邻沙箱的价格。
    isEstimate: true
    sourceRefs:
      - 4
      - 6
      - 19
      - 25
  sam:
    value: $25M
    rationale: 首期可服务市场情景假设：TAM 组织中有 10%、即 500 个账户拥有暴露安全边界的编码智能体工作流，并确实需要跨提供商迁移或恢复；按同样假设的每年 $50,000 支出计算，500 × $50,000 = $25M。10% 的筛选比例没有来源支持，必须通过买家访谈验证。
    isEstimate: true
    sourceRefs:
      - 3
      - 5
      - 10
      - 26
  som:
    value: $1.25M
    rationale: 首个商业切口的可触达情景：数年内拿下 25 个付费平台账户，按假设的每年 $50,000 合同等值计算，可带来 $1.25M 经常性收入。这是采用情景，不是预测；前提是取得付费证据，并成功接入至少两家执行提供商。
    isEstimate: true
    sourceRefs:
      - 4
      - 6
      - 20
      - 21
bottomUpSizingDrivers:
  - driver: 开发者生态背景
    value: GitHub 报告开发者人数超过 180 百万；Stack Overflow 发现，受访开发者中目前有 31% 使用 AI 智能体。
    source: "[19] 和 [25]；并非买家账户数"
  - driver: 符合条件的买家组织
    value: TAM 假设为全球 5,000 家高吞吐量编码智能体平台团队或厂商；现有公开数据没有衡量这一数量。
    source: 估算
  - driver: 每个合格买家的年度预算
    value: 假设每年为状态胶囊和恢复预算 $50,000；这不是经验证的付费意愿。
    source: 估算；相邻执行服务定价见 [4] 和 [6]
  - driver: 首期可服务账户
    value: 假设有 500 家组织需要跨提供商恢复，且其智能体循环边界兼容。
    source: 估算
  - driver: 近期可争取客户
    value: 首期 SOM 情景假设有 25 个付费账户；需要聚焦的 SDK 和两家提供商间的兼容能力。
    source: 估算
