    signalRefs:
      - 有状态的智能体任务需要生命周期控制
    sourceRefs:
      - 1
  - point: >-
      Tech Funding News 报道称，Daytona 的收入年化运行率自年初以来增长约 25 倍，并根据公司披露列出多家客户；但起始基数未披露，因此这只能说明采用趋势，不能证明市场需要检查点。
    signalRefs:
      - 已披露的采用情况缺少基数
    sourceRefs:
