problem: >-
  编码智能体团队在暂停、重试或把仓库任务迁移到其他执行环境时，可能不得不依赖服务商专属快照，或从最后一个可见产物重新开始。重启可能丢掉工作区改动和工具返回的上下文，也可能重复模型和计算工作；若用不完整上下文恢复，则可能产生过时或不安全的改动。现有来源证实任务需要带状态的暂停、恢复和分叉，但没有量化进度损失及其成本。
targetUser:
  primary: >-
    编码智能体厂商的平台工程负责人，负责在一次性工作区运行需要安全暂停和接续的仓库修改任务。
  secondary: >-
    寻求可移植检查点规范的智能体框架维护者和执行云运营方。
  buyer: >-
    编码智能体厂商的平台工程副总裁或总监。
startupThesis:
  nonObviousInsight: >-
    保住智能体任务的有效进度，不一定要迁移运行中的虚拟机：只要在智能体循环暴露的边界保存检查点，就能用源代码版本、工作树差异、工具返回上下文和固定的运行环境，在干净运行时里重建任务。
  beachhead: >-
    先服务运行多步骤仓库迁移或依赖升级任务的编码智能体厂商。这类任务可以在声明的工具轮次后保存检查点，并在不重放外部副作用的情况下恢复。
  wedge: >-
    为一种编码智能体循环提供 SDK 适配器，再配上经签名并加密的应用层检查点胶囊，以及一个在恢复后校验工作区的验证器。
  whyNowCatalyst: >-
    Daytona 的公告明确指出，带状态的智能体任务需要暂停、恢复和分叉。其披露的多环境执行云，加上 Fortune 对沙箱速度的比较，让任务能否在全新运行时中可移植地恢复，成为值得此时验证的假设。但没有来源验证任务中断率或付费意愿。
  ventureScalePath: >-
    先覆盖一种编码智能体循环和仓库工作区，再向更多智能体框架和执行服务商授权胶囊格式、托管检查点存储；随后为不同运行时配置提供安全恢复兼容性测试并收费。
solution: >-
  SDK 包装受支持的编码智能体循环，只在声明的安全边界生成胶囊。每个加密胶囊固定源代码版本、工作区差异、依赖与运行时清单，以及智能体可见的对话记录和工具输出；凭证只作引用，绝不存入胶囊。恢复时，系统在干净且兼容的沙箱中重建工作区和智能体上下文，再校验哈希，并确认必要的本地检查通过，然后继续任务；它不会迁移进程内存，也不会重放外部副作用。团队还可以从胶囊分出另一条执行路径，在接受其中一个方案前比较生成的工作树改动。
goToMarketSeed:
  firstCustomer: >-
    一家编码智能体厂商，其仓库迁移任务横跨多个会话，平台团队也能在安全的工具轮次边界埋点。
  buyingTrigger: >-
    客户开始部署运行时间更长的仓库智能体，或计划更换执行服务商；重复已完成的工作变得足够昂贵，值得付费试点恢复功能。
  currentAlternative: >-
    有条件时使用服务商专属快照，自行编写框架专属检查点代码，保存日志，或从原始提示词、最后一次提交的补丁重新启动智能体。
  switchingReason: >-
    可移植且经过验证的应用层胶囊能保留智能体工作区和工具返回上下文，再在新的兼容沙箱中重建任务，不必把后续执行绑在某一家服务商的机器镜像上。
  pricingHypothesis: >-
    按检查点每 GB-hour 收取托管存储费，每次通过验证的恢复另行计费；每增加一种运行时配置，再收取兼容性测试费用。
