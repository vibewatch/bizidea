    - 运行多步骤仓库修改任务的编码智能体厂商
    - 提供安全工具轮次边界的智能体框架团队
  valuePropositions:
    - 在兼容的执行服务商之间保留智能体工作区和工具返回上下文
    - 在智能体继续运行前验证重建后的状态
