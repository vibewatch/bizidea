jobsToBeDone:
  - job: >-
      当仓库智能体必须暂停或迁移到兼容运行时时，帮助平台工程师从最后一次安全工具轮次接续任务，避免重放已完成的工作。
    currentAlternative: >-
      使用服务商专属快照、自行维护框架检查点，或根据保存的日志和原始提示词重新启动。
    successMetric: >-
      符合条件的暂停任务中，通过工作区验证且无需重跑已完成工具调用便成功恢复的占比。
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      它把智能体任务在安全点的应用状态视为可移植、可验证的执行产物，而不是服务商专属机器快照；历史创意中没有采用这一机制的方案。
  venturePotential:
    score: 4
    rationale: >-
      按量计费的检查点服务和兼容性测试有机会扩展到更多智能体框架与执行服务商，但前提是有足够多的运行时开放安全边界。
  whiteSpace:
    score: 4
    rationale: >-
      历史索引中有相邻的故障恢复和沙箱演练概念，却没有智能体检查点可移植产品；云服务商和智能体运行时已经提供相邻的原生生命周期功能。
  painIntensity:
    score: 4
    rationale: >-
      智能体进度丢失可能导致重复计算和工具操作；这组新闻材料明确提到带状态的任务需要暂停和恢复。实际损失频率及成本仍未测量。
  wedgeClarity:
    score: 4
    rationale: >-
      一种编码智能体适配器、仓库工作树胶囊和恢复验证器，构成了可测试的首款产品；但仍需针对不同框架逐一集成。
  evidenceFit:
    score: 3
    rationale: >-
      来源支持带状态任务的暂停、恢复和分叉需求、沙箱快速配置，以及有关采用增长的报道；但没有证明任务失败率、工作损失成本或可移植性需求。
topRisks:
  - name: 恢复状态不完整
    description: >-
      工作区快照和对话记录可能无法涵盖框架状态或外部副作用，导致任务损坏或重复执行。
    mitigation: >-
      只支持声明过的安全边界，捕获工具返回但不重放副作用；哈希或本地检查不匹配时一律停止恢复。
  - name: 胶囊含敏感数据
    description: >-
      如果存储或访问不当，仓库内容和智能体对话记录可能泄露专有代码或客户上下文。
    mitigation: >-
      使用客户控制的密钥在客户端加密，尽量缩小保留内容，隔离租户，并允许客户自行托管存储。
  - name: 原生功能捆绑
    description: >-
      执行服务商可能改进自家的暂停和恢复功能，买家也可能觉得可移植性不够重要，不愿再增加一个组件。
    mitigation: >-
      与跨服务商共创客户验证付费恢复能节省的成本，并公开兼容性测试，让客户在采用服务前自行衡量可移植性。
