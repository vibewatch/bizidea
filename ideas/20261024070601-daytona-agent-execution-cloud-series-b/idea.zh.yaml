differentiator: >-
  运行时服务商可以暂停或快照自家的工作区；这款产品则把声明过的智能体循环检查点做成可移植的应用层产物，并在另一个兼容沙箱中重建后加以验证。它不承诺透明迁移进程，也不承诺确定性地重放模型调用。初期价值在于保住任务进度，而不是打造新的执行云或通用编排层。
