championThesisTest:
  declaredDimension: creativeNovelty
  verdict: mixed
  evidenceFor:
    - point: >-
        Daytona itself describes agent computers as short-lived, stateful jobs that need to pause and fork, while
        independent reporting confirms the execution-cloud demand and fast sandbox setup. This validates the runtime
        lifecycle problem, not paid demand for cross-provider capsules.
      sourceRefs:
        - 1
        - 31
    - point: >-
        The reviewed runtime and framework documentation exposes provider- or framework-scoped persistence, not a
        documented interchange format that reconstructs and verifies a repository agent task in another compatible
        execution provider. That leaves a plausible, testable portability wedge rather than proof of a novel
        checkpoint primitive.
      sourceRefs:
        - 3
        - 5
        - 10
        - 26
        - 30
    - point: >-
        A capsule that binds agent-loop context to a repository delta, pinned environment manifest, and fail-closed
        restore verifier could solve a narrower interoperability problem than either a VM snapshot or a conversation
        checkpoint; no product page reviewed demonstrated that exact cross-provider contract.
      sourceRefs:
        - 2
        - 12
        - 13
        - 16
  evidenceAgainst:
    - point: >-
        Checkpointing, pause/resume, and branching are already common sandbox capabilities: Daytona documents
        persistent snapshots and VM memory capture, while E2B documents full filesystem-and-memory snapshots and
        resuming a sandbox.
      sourceRefs:
        - 3
        - 5
        - 7
    - point: >-
        Native coding-agent and framework products already preserve conversation, tool, or graph state across runs,
        including Claude Code rewind, GitHub Copilot SDK persistence, OpenAI sessions, and LangGraph checkpointers.
      sourceRefs:
        - 10
        - 12
        - 15
        - 16
        - 17
    - point: >-
        The independent Crab research paper explicitly proposes turn-aware checkpoint/restore for agent sandboxes
        and reports recovery correctness improvements; it overlaps the safe-boundary mechanism even though it does
        not establish a commercial cross-provider capsule product.
      sourceRefs:
        - 13
  revisedClaim: >-
    The defensible creative claim is not that agent checkpointing or sandbox restore is rare. The possible novelty is
    a vendor-neutral, security-auditable interchange contract that couples a supported agent-loop boundary to
    reproducible repository state and verified reconstruction in a different runtime. Public evidence does not
    establish that this contract is unique, demanded, or hard for an execution provider to bundle.
reportMemo:
  executiveTakeaways:
    - >-
      Pain is real for high-volume agent execution infrastructure, but public evidence points more strongly to
      sandbox operating cost, engineering toil, and scaling than to lost agent progress across providers.
    - >-
      Daytona, E2B, AWS, agent frameworks, and coding-agent vendors already provide important pieces of the
      checkpoint and resume workflow. The narrow remaining wedge is cross-provider reconstruction and verification.
    - >-
      Current spend is budgeted for sandbox compute and managed execution. No source found a buyer paying for a
      standalone portability capsule or validated restore.
    - >-
      The mechanism is mixed on creative novelty: safe-point and stateful checkpointing are not uncommon, and Crab
      research overlaps the technical mechanism; cross-vendor artifact portability remains the unverified
      differentiator.
    - >-
      A scenario-based bottom-up model yields a $250M TAM, $25M initial SAM, and $1.25M reachable SOM; these are
      assumption-led account scenarios, not published market estimates.
    - >-
      The strongest falsifier is that most qualified buyers use one execution provider, can restore from its native
      snapshot, and do not incur enough failed-run cost to justify another SDK, storage boundary, and security review.
  marketDefinition: >-
    The relevant market is incremental infrastructure software for preserving eligible coding-agent progress at a
    declared loop boundary and rebuilding it in a compatible but different sandbox provider. It excludes the much
    larger AI coding-assistant, model-inference, general workflow-orchestration, and sandbox-compute markets. Buyers
    are agent-platform vendors and, later, engineering platform teams with long-running repository-changing jobs
    whose workspace, tool results, and runtime configuration must survive a provider or execution-environment
    change.
  customerAndBuyer: >-
    The primary user is a platform engineer or agent-runtime maintainer at a coding-agent vendor; the likely budget
    owner is a VP or director of platform engineering or infrastructure. The initial user must expose reliable
    agent-loop boundaries and run multi-step repository work in disposable sandboxes. Security, privacy, and
    infrastructure procurement can veto a managed capsule store. Daytona's customer stories show budget for
    sandbox infrastructure and internal-build replacement, but not yet a budget line for cross-provider checkpoint
    portability.
  buyingTriggers:
    - point: >-
        A platform team reaches enough sandbox throughput that maintaining an in-house execution environment
        consumes engineering capacity; WRITER says its homegrown system became a full-time operational burden after
        passing 20,000 sandboxes a day.
      sourceRefs:
        - 20
    - point: >-
        Agent tasks that run for hours and require repeated environment versioning create a trigger to test durable
        state capture; AfterQuery describes manual environment-state saves and more than 40 engineering hours per
        week saved after moving to a managed provider.
      sourceRefs:
        - 21
    - point: >-
        A planned move between runtime vendors, provider incident, or spot/preemptible execution policy could make
        same-provider snapshots insufficient; this is a qualification hypothesis, not a quantified incident pattern.
      sourceRefs:
        - 3
        - 5
        - 13
    - point: >-
        Production coding-agent adoption and interest in platform engineering are visible, but the developer survey
        still finds that only 31% of respondents currently use AI agents.
      sourceRefs:
        - 18
        - 19
        - 25
  willingnessToPay:
    summary: >-
      Adjacent sandbox spending is observable: Daytona publishes pay-as-you-go vCPU, memory, and storage rates,
      while E2B publishes a $150 monthly Pro plan and a $3,000 monthly Enterprise minimum. Daytona customer stories
      report substantial internal-build savings and engineering time reclaimed. These are evidence of budget for
      execution environments, not direct willingness to pay for portable checkpoints, and no paid restore pilot or
      capsule-specific customer price was found.
    sourceRefs:
      - 4
      - 6
      - 20
      - 21
      - 31
  competitiveLandscape: >-
    Direct adjacent competitors are stateful sandbox providers Daytona and E2B, which snapshot or resume their own
    environments, and AWS Bedrock AgentCore, which provides isolated sessions, persistent session state, and
    workflow checkpoint APIs within its service. Modal offers secure code-execution sandboxes and persistent
    volumes, while the reviewed docs do not expose the same snapshot workflow. Substitutes include LangGraph
    checkpointers, Temporal durable execution, OpenAI Agents SDK sessions, GitHub Copilot SDK session persistence,
    Claude Code rewind, provider-specific VM snapshots, CRIU-based internal builds, saved logs, Git/worktree
    checkpoints, and restarting from a prompt. No public page reviewed documented the exact signed, encrypted,
    verified capsule format proposed here; absence from public docs is not evidence of absence in private or
    custom-built systems.
  incumbentThesis:
    - incumbentClass: Agent sandbox and execution-cloud providers
      point: >-
        Daytona, E2B, and AWS can keep work inside their own runtime and already provide snapshots, stateful
        sessions, or lifecycle APIs. They win by default when a customer is single-cloud, wants low latency, or does
        not need to move an in-flight task; the portability product matters only when provider choice or migration
        risk is valuable enough to justify another data boundary.
      sourceRefs:
        - 2
        - 3
        - 5
        - 26
        - 30
    - incumbentClass: Agent frameworks and durable workflow platforms
      point: >-
        LangGraph stores graph state and Temporal can make supported workflows durable across failures, retries,
        and human waits. They do not by themselves promise portability of arbitrary sandbox OS state, but are a
        strong default for teams whose tool effects are represented at framework boundaries.
      sourceRefs:
        - 10
        - 11
        - 13
    - incumbentClass: Native coding-agent session persistence
      point: >-
        Claude Code, GitHub Copilot SDK, and OpenAI Agents SDK already retain or reload conversational and tool
        state for supported sessions. They are simpler when the customer stays with that agent and runtime, while
        their documented scopes do not establish a common cross-agent and cross-sandbox workspace format.
      sourceRefs:
        - 12
        - 15
        - 16
        - 17
    - incumbentClass: Cloud IaaS and internal platform teams
      point: >-
        Teams can build on Kubernetes, VM snapshots, object storage, and Git rather than add a vendor. That choice
        wins when bespoke control or existing cloud commitments dominate; the WRITER and AfterQuery stories show
        that at least some teams later pay to replace the operating burden, although the cases are company-published.
      sourceRefs:
        - 14
        - 20
        - 21
    - incumbentClass: Restart from prompt, logs, or committed patch
      point: >-
        Restart is a low-cost, auditable status quo when jobs are short, source changes are committed, or tool
        effects are reproducible. Its disadvantage is repeated model and compute work and missing transient state,
        but the frequency and cost of this loss were not measured in the sources reviewed.
      sourceRefs:
        - 12
        - 13
        - 19
  regulatoryLandscape: >-
    The capsule may contain proprietary source, agent transcripts, tool outputs, and possibly personal data copied
    from repositories or logs. GDPR applies when personal data is processed; a hosted provider would need an
    appropriate processor, retention, access, deletion, and cross-border-transfer posture, and the European
    Commission identifies standard contractual clauses for relevant transfers. The EU AI Act transparency rules
    effective 2 August 2026 apply to certain AI interactions and generated content; an infrastructure SDK is not
    automatically a high-risk AI system merely because it carries agent state, so roles and duties need customer-
    specific review. NIST's Generative AI Profile is voluntary risk-management guidance, not a product certification.
  technologyLandscape: >-
    The implementation is more than copying a worktree: tool-return context, dependency versions, secrets, runtime
    manifests, processes, sockets, and external side effects can diverge. Daytona distinguishes filesystem-only
    container snapshots from filesystem-plus-memory VM snapshots; E2B notes that snapshotting briefly interrupts
    active connections. CRIU illustrates the OS resources involved in process restore, while the Crab paper
    describes the gap between agent-visible checkpoints and OS-side effects. A portable application-level capsule
    is plausible only for explicitly supported loop boundaries and compatible runtime profiles; it cannot safely
    promise arbitrary process migration or replay of external side effects.
  distributionChannels:
    - point: >-
        Ship a developer-first SDK and sample adapters through agent-framework documentation and package
        ecosystems; LangGraph, OpenAI Agents SDK, and GitHub Copilot SDK expose session or persistence interfaces
        that could host early integrations.
      sourceRefs:
        - 10
        - 15
        - 16
    - point: >-
        Sell paid restore pilots directly to platform-engineering teams at coding-agent vendors, using current
        sandbox scaling and internal-build replacement as qualification signals.
      sourceRefs:
        - 20
        - 21
    - point: >-
        Co-market compatibility tests with execution providers and cloud marketplaces only after a working
        cross-provider restore exists; existing provider APIs are product-specific integration surfaces.
      sourceRefs:
        - 3
        - 5
        - 26
  partnershipEcosystem:
    - point: >-
        Framework maintainers can expose safe boundary hooks and stable serialization contracts, reducing per-agent
        adapter risk.
      sourceRefs:
        - 10
        - 15
        - 16
    - point: >-
        Sandbox providers can supply runtime profiles, snapshot metadata, storage transfer, and a test environment;
        partnerships would need to preserve neutrality rather than make the capsule dependent on one provider.
      sourceRefs:
        - 2
        - 3
        - 5
        - 26
    - point: >-
        Enterprise security teams and KMS or customer-managed-storage providers are essential partners because
        capsule data can include code and tool traces.
      sourceRefs:
        - 20
        - 23
        - 30
  dataMoats:
    - point: >-
        A potential moat is a growing compatibility matrix of agent loops, runtime profiles, restore checks, and
        failure cases; it does not exist until real integrations and consented outcome data accumulate.
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - point: >-
        Retaining customer source or transcripts is not itself a defensible moat and creates security liability.
        Prefer minimal metadata and opt-in, non-content restore outcomes for compatibility learning.
      sourceRefs:
        - 17
        - 20
        - 23
  geographicConsiderations:
    - point: >-
        The initial buyer and the cited sandbox-provider market are primarily US-oriented; cross-region storage,
        data residency, and enterprise security review can influence provider selection.
      sourceRefs:
        - 20
        - 31
    - point: >-
        European deployments need clear processing roles and transfer terms when source, transcripts, or tool
        outputs include personal data; AI Act transparency duties may also affect customer-facing agent products.
      sourceRefs:
        - 22
        - 23
  sensitivityCases:
    - case: Native snapshots and session persistence become sufficient for most customers.
      impact: >-
        The differentiated portability layer becomes an optional migration feature with weak recurring usage, and
        provider-native storage or workflow tools likely win.
      sourceRefs:
        - 3
        - 5
        - 10
        - 26
    - case: Agent tasks are mostly short or safely restartable from Git and logs.
      impact: >-
        The saved model and compute work per restore is too small to fund another SDK and security review; the
        beachhead narrows to long-running or frequently interrupted tasks.
      sourceRefs:
        - 12
        - 13
        - 19
    - case: The application-level capsule can restore repository state but not transient tool or process state.
      impact: >-
        The product may still help with code-writing tasks but would need a narrower success claim and would lose
        jobs with non-idempotent tools or long-lived processes.
      sourceRefs:
        - 10
        - 13
        - 14
  validationPlan:
    - priority: high
      question: How frequently do target repository-agent jobs lose recoverable progress, and what is the cost per incident?
      evidenceToGather: >-
        Instrument at least 10 design-partner teams for failed, paused, preempted, and provider-migrated jobs; record
        repeated model tokens, compute time, tool calls, human recovery minutes, and whether native snapshots already
        recovered the job.
    - priority: high
      question: Can one supported loop restore the same task in two independent sandbox providers without replaying side effects?
      evidenceToGather: >-
        Build a narrow adapter and run paired restores across Daytona and E2B or AWS; verify repository hashes,
        dependency/runtime manifests, transcript/tool-return continuity, test outcomes, and fail-closed behavior for
        unrecognized state.
    - priority: high
      question: Will a platform buyer pay for a standalone portability and validated-restore service?
      evidenceToGather: >-
        Obtain paid pilot commitments from at least three qualified coding-agent vendors and compare the offered
        contract to their current native snapshots, internal checkpoint code, and restart workflow.
    - priority: medium
      question: Which data and security controls are mandatory before a capsule can contain private repository state?
      evidenceToGather: >-
        Complete security reviews with platform and enterprise buyers for customer-controlled encryption keys,
        self-hosted object storage, tenant isolation, retention, deletion, audit events, and secret exclusion.
    - priority: medium
      question: How many buyers genuinely operate more than one execution provider or need to migrate an active task?
      evidenceToGather: >-
        Interview platform teams and inspect runtime/vendor inventories; distinguish true cross-provider restore
        requirements from multi-region operation within one vendor.
    - priority: medium
      question: Does restoring a capsule outperform prompt-plus-Git restart on total cost and accepted-code quality?
      evidenceToGather: >-
        Run blinded paired tasks with representative migration and dependency-upgrade repositories; compare restore
        success, repeated model usage, human correction time, test pass rates, and external side-effect safety.
  marketMapDiagram:
    title: "Agent-state portability landscape"
    mermaid: |
      quadrantChart
        title Agent-state products by specialization and urgency
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed capsule: [0.9, 0.7]
        Daytona and E2B snapshots: [0.65, 0.75]
        AWS AgentCore sessions: [0.45, 0.7]
        LangGraph and Temporal: [0.65, 0.8]
        Native coding-agent sessions: [0.4, 0.6]
        CRIU and Crab research: [0.9, 0.4]
  fiveForces:
    supplierPower:
      score: 4
      rationale: >-
        Runtime providers control state formats, compute compatibility, storage access, and restore APIs; neutrality
        depends on integrating with several vendors, although customers can choose among multiple runtimes.
      sourceRefs:
        - 3
        - 5
        - 26
    buyerPower:
      score: 4
      rationale: >-
        Buyers can use built-in snapshots, framework persistence, open-source tooling, or restart, and can demand
        security and self-hosting terms before moving repository data.
      sourceRefs:
        - 5
        - 10
        - 14
        - 20
    threatOfEntrants:
      score: 4
      rationale: >-
        A framework maintainer or sandbox vendor can add its own checkpoint contract; CRIU and public research make
        the general checkpointing concept accessible, though cross-runtime reliability is difficult.
      sourceRefs:
        - 13
        - 14
        - 16
    threatOfSubstitutes:
      score: 5
      rationale: >-
        Native provider snapshots, agent sessions, graph checkpointers, durable execution, Git/worktree snapshots,
        and restarting from a prompt cover substantial portions of the job.
      sourceRefs:
        - 3
        - 5
        - 10
        - 11
        - 12
        - 16
    competitiveRivalry:
      score: 4
      rationale: >-
        Sandboxes and agent state are adjacent product priorities for Daytona, E2B, AWS, Modal, frameworks, and
        coding-agent vendors; feature bundling can compress a standalone portability layer.
      sourceRefs:
        - 2
        - 5
        - 8
        - 9
        - 26
        - 30
  pestle:
    - factor: economic
      impact: positive
      point: >-
        Agent workload growth creates spend on sandbox infrastructure, and customer stories describe engineering
        capacity returned by managed execution; no source attributes this spend to portability.
      sourceRefs:
        - 18
        - 20
        - 21
    - factor: social
      impact: negative
      point: >-
        Developer use of AI agents remains below broad AI-tool use, and many respondents report low trust or
        security concerns, so adoption is not yet universal.
      sourceRefs:
        - 19
    - factor: technological
      impact: neutral
      point: >-
        Sandboxes can capture state quickly, but agent-visible history does not automatically represent OS-visible
        effects, and full process restore has environmental constraints.
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - factor: legal
      impact: negative
      point: >-
        Personal data in repositories or transcripts triggers privacy and cross-border processing review; AI Act
        transparency duties apply to certain customer-facing AI interactions and outputs.
      sourceRefs:
        - 22
        - 23
    - factor: political
      impact: neutral
      point: >-
        Public risk-management guidance encourages organizations to govern generative-AI security and privacy, but
        NIST's profile is voluntary and does not mandate this product.
      sourceRefs:
        - 24
  adoptionFrictionMatrix:
    - friction: Sensitive source code and agent transcripts cross a new storage boundary.
      severity: high
      affectedBuyer: Enterprise platform engineering and security teams
      mitigation: >-
        Offer customer-managed keys or customer-hosted storage, minimize content, exclude credentials, and document
        retention, deletion, access, and audit controls.
      sourceRefs:
        - 17
        - 20
        - 23
    - friction: Runtime and framework compatibility can fail across kernels, architectures, process state, and provider APIs.
      severity: high
      affectedBuyer: Agent-runtime and infrastructure maintainers
      mitigation: >-
        Start with one loop and two runtime profiles, publish a compatibility matrix, validate hashes and tests, and
        fail closed outside the declared safe boundary.
      sourceRefs:
        - 3
        - 5
        - 13
        - 14
    - friction: Existing native snapshots may remove the need to move state between providers.
      severity: high
      affectedBuyer: Coding-agent platform teams using one execution cloud
      mitigation: >-
        Qualify buyers with a real provider-change, multi-cloud, outage, or preemption requirement and benchmark
        native restore before selling portability.
      sourceRefs:
        - 3
        - 5
        - 26
    - friction: Tool calls can create external side effects that a checkpoint cannot roll back or safely replay.
      severity: high
      affectedBuyer: Platform teams running repository agents with external tools
      mitigation: >-
        Capture completed tool outputs, checkpoint only after declared safe turns, require idempotency or explicit
        operator approval for side effects, and never replay a call automatically.
      sourceRefs:
        - 11
        - 13
        - 14
    - friction: Enterprise procurement can require a DPA, residency, deletion, and security evidence before a pilot.
      severity: medium
      affectedBuyer: Security, privacy, and procurement teams
      mitigation: >-
        Prepare a data-flow map, processor terms, retention controls, regional storage options, and a security
        architecture review before production integration.
      sourceRefs:
        - 20
        - 22
        - 23
market:
  tam:
    value: "$250M"
    rationale: >-
      Scenario estimate for the narrow software category, not a published market figure: assume 5,000 global
      platform teams or agent vendors with high-volume repository-agent jobs and $50,000 per account per year for
      portable checkpoint storage, restores, and compatibility. Calculation: 5,000 × $50,000 = $250M annual TAM.
      GitHub's 180M-plus developer population and Stack Overflow's 31% current AI-agent use show a large developer
      ecosystem, but neither measures eligible buyer accounts. The annual budget is also an operator assumption
      anchored only to adjacent sandbox price points.
    isEstimate: true
    sourceRefs:
      - 4
      - 6
      - 19
      - 25
  sam:
    value: "$25M"
    rationale: >-
      Initial serviceable scenario assumes 500 accounts, or 10% of the assumed TAM organizations, have coding-agent
      workflows with exposed safe boundaries and a real cross-provider or recovery need; at the same assumed
      $50,000 annual spend, 500 × $50,000 = $25M. The 10% filter is not sourced and must be validated with buyer
      interviews.
    isEstimate: true
    sourceRefs:
      - 3
      - 5
      - 10
      - 26
  som:
    value: "$1.25M"
    rationale: >-
      Reachable scenario for a first commercial wedge: 25 paying platform accounts within several years at the
      assumed $50,000 annual contract equivalent, or $1.25M recurring revenue. This is an adoption scenario, not
      a forecast; it requires paid evidence and successful integrations across at least two execution providers.
    isEstimate: true
    sourceRefs:
      - 4
      - 6
      - 20
      - 21
bottomUpSizingDrivers:
  - driver: Developer ecosystem context
    value: "GitHub reported more than 180 million developers; Stack Overflow found 31% of surveyed developers currently use AI agents."
    source: "[19] and [25]; not a buyer-account count"
  - driver: Eligible buyer organizations
    value: "5,000 global high-volume coding-agent platform teams or vendors assumed for TAM; not measured in available public data."
    source: "est."
  - driver: Annual budget per eligible buyer
    value: "$50,000 annual capsule and restore budget assumed; not a validated willingness-to-pay figure."
    source: "est.; adjacent execution pricing in [4] and [6]"
  - driver: Initial serviceable accounts
    value: "500 organizations assumed to have a cross-provider restore need and compatible agent-loop boundaries."
    source: "est."
  - driver: Near-term obtainable customers
    value: "25 paying accounts assumed for the initial SOM scenario; requires a focused SDK and two-provider compatibility."
    source: "est."
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: >-
        DORA surveyed nearly 5,000 technology professionals and describes AI as an established software-development
        amplifier; GitHub reports more than 1.1 million public repositories using an LLM SDK.
      sourceRefs:
        - 18
        - 25
    - point: >-
        Daytona customer cases describe high-volume sandbox use and replacement of internal infrastructure, showing
        current execution-cloud spend among some agent companies.
      sourceRefs:
        - 20
        - 21
    - point: >-
        Provider snapshots and agent session persistence make durable work state technically relevant, although the
        same features are also competitive substitutes.
      sourceRefs:
        - 3
        - 5
        - 16
        - 30
  headwinds:
    - point: >-
        Portable agent checkpoints are not a separately measured market category; broad AI coding and sandbox
        market estimates would overstate this product's reachable spend.
      sourceRefs:
        - 19
        - 25
    - point: >-
        Only 31% of Stack Overflow's surveyed developers said they currently use AI agents, while security and
        accuracy concerns persist.
      sourceRefs:
        - 19
    - point: >-
        Native pause, resume, snapshots, and framework persistence can satisfy users who do not need portability.
      sourceRefs:
        - 3
        - 5
        - 10
        - 26
competitors:
  - name: Daytona
    stage: Series B agent execution-cloud provider
    wedge: >-
      Fast isolated sandboxes with persistent snapshots, VM memory capture, pause/resume, and broad operating
      environment choices.
    pricing: >-
      Public pay-as-you-go rates include $0.0504 per vCPU-hour and $0.0162 per GiB-hour, plus metered storage;
      enterprise terms are sales-led.
    strength: >-
      Native runtime control, snapshot workflows, and published customer cases at hundreds of thousands of
      sandboxes per month.
    weaknessVsUs: >-
      Reviewed documentation describes restore and snapshots within Daytona; a vendor-neutral capsule is not
      documented. This is a public-documentation gap, not proof of a missing private feature.
    sourceRefs:
      - 2
      - 3
      - 4
      - 20
      - 21
  - name: E2B
    stage: Commercial AI sandbox provider
    wedge: >-
      Agent-oriented Linux microVMs with filesystem-and-memory snapshots, one-to-many sandbox creation, and
      pause/resume for the same sandbox.
    pricing: >-
      Public Pro plan is $150 per month plus usage; Enterprise has a published $3,000 monthly minimum plus
      negotiated terms.
    strength: >-
      Clear snapshot APIs and published session, concurrency, and usage limits make it a strong direct substitute
      for same-provider recovery.
    weaknessVsUs: >-
      Snapshot IDs and restore flows are E2B-specific in the reviewed docs; clients must also handle dropped
      connections during snapshot creation.
    sourceRefs:
      - 5
      - 6
      - 7
  - name: Amazon Bedrock AgentCore and Bedrock sessions
    stage: Commercial hyperscaler platform
    wedge: >-
      Isolated agent microVM sessions, configurable lifecycles, persistent filesystem options, and APIs for
      storing and retrieving workflow state and conversation checkpoints.
    pricing: "Not stated on the cited documentation pages; AWS usage is account and service dependent."
    strength: >-
      AWS IAM, KMS, and managed session infrastructure can bundle state handling into an existing cloud contract.
    weaknessVsUs: >-
      The cited APIs and runtime lifecycle are AWS-scoped; workflow checkpoints do not automatically recreate
      another provider's full sandbox environment.
    sourceRefs:
      - 26
      - 27
      - 28
      - 30
  - name: Temporal with LangGraph
    stage: Commercial durable-execution platform plus open-source agent framework
    wedge: >-
      Checkpoint graph or workflow progress, retry failed activities, and resume long waits or interrupted
      orchestration without holding a process open.
    pricing: "LangGraph is open source; Temporal Cloud pricing is not stated in the cited blog."
    strength: >-
      Supports durable workflow execution and recovery at application-defined nodes, directly addressing process
      failure and human-wait use cases.
    weaknessVsUs: >-
      These layers persist workflow state and execution history, not a portable, verified copy of arbitrary
      sandbox filesystem, process, and runtime state.
    sourceRefs:
      - 10
      - 11
      - 13
  - name: Native coding-agent session persistence
    stage: Mature and rapidly evolving product features
    wedge: >-
      Claude Code rewind, OpenAI Agents SDK sessions, and GitHub Copilot SDK persistence preserve supported
      conversation, tool, or planning state across runs and selected restarts.
    pricing: "Bundled into the respective agent or API product; no standalone checkpoint price cited."
    strength: >-
      Low integration cost for a customer already committed to the same coding-agent product and its supported
      session backend.
    weaknessVsUs: >-
      The reviewed docs do not define a common interchange across agent vendors and sandbox providers, and
      application-session history is not equivalent to a complete portable OS/runtime snapshot.
    sourceRefs:
      - 12
      - 15
      - 16
      - 17
regulatoryTechnicalConstraints:
  - point: >-
      Repositories and transcripts can contain personal data or confidential code; a managed store needs a
      documented processor role, retention/deletion controls, access boundaries, and transfer terms when data
      crosses jurisdictions.
    sourceRefs:
      - 20
      - 23
  - point: >-
      EU AI Act transparency rules effective from 2 August 2026 affect certain customer-facing AI interactions and
      generated content, but do not automatically make an infrastructure checkpoint SDK a high-risk AI system.
    sourceRefs:
      - 22
  - point: >-
      Full process restoration depends on OS-visible resources such as process trees, memory maps, file descriptors,
      and shared resources; an application-level capsule must explicitly exclude unsupported runtime state.
    sourceRefs:
      - 13
      - 14
  - point: >-
      Snapshot APIs differ across providers and can interrupt active streams; portability requires adapters,
      reconnection behavior, and compatibility tests rather than a single universal restore call.
    sourceRefs:
      - 3
      - 5
      - 26
  - point: >-
      External tool effects cannot be assumed reversible or safe to replay; the product should capture completed
      results and resume only at explicit boundaries with side-effect policies.
    sourceRefs:
      - 11
      - 13
validationSignals:
  - point: >-
      WRITER reports provisioning 300,000 sandboxes in one month with Daytona after its in-house platform became
      burdensome at more than 20,000 daily sandboxes; these figures are vendor-published customer claims.
    sourceRefs:
      - 20
  - point: >-
      AfterQuery says it replaced a GKE-based setup with Daytona and saved 40-plus engineering hours weekly while
      versioning sandbox state for agent trials; this is also a vendor-published customer case.
    sourceRefs:
      - 21
  - point: >-
      Daytona and E2B publish snapshot, pause, and resume features, confirming both customer need and strong
      same-provider substitutes, not demand for cross-provider capsules.
    sourceRefs:
      - 3
      - 5
  - point: >-
      Stack Overflow's 2025 survey reports 31% of respondents currently use AI agents and 46% do not trust AI
      output accuracy, supporting adoption potential alongside a verification and trust barrier.
    sourceRefs:
      - 19
  - point: >-
      Crab is an independent technical preprint that evaluates agent sandbox checkpoint/restore and reports
      workload-level recovery results, weakening any claim that safe-point checkpointing itself is an untouched
      mechanism.
    sourceRefs:
      - 13
openQuestions:
  - How many repository-agent jobs are long enough or interruption-prone enough to justify portable recovery?
  - What fraction of target buyers actually use more than one sandbox provider for the same agent workflow?
  - Can a capsule restore the agent-visible transcript and workspace without omitting process or tool state required for correctness?
  - What minimum security posture, self-hosting, and data-residency options are required to store private repositories?
  - Do customers prefer a standard format and their own storage, or a managed encrypted capsule service?
  - Which agent-loop hooks expose safe boundaries without requiring invasive framework changes?
  - How will the product prove that a restore did not duplicate external side effects or leak credentials?
  - Is the assumed 5,000-account global buyer pool and $50,000 annual budget remotely accurate?
