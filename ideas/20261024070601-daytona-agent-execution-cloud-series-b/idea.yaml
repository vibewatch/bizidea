jobsToBeDone:
  - job: >-
      When a repository agent must pause or move to a compatible runtime, help platform engineers
      resume from its last safe tool turn so they can avoid replaying completed work.
    currentAlternative: >-
      Use provider-specific snapshots, maintain a custom framework checkpoint, or relaunch from
      saved logs and the original prompt.
    successMetric: >-
      Share of eligible paused jobs that pass workspace verification and resume without re-running
      completed tool calls.
ideaScorecard:
  creativeNovelty:
    score: 5
    rationale: >-
      It treats the safe-point application state of an agent job as a portable, verifiable
      execution artifact rather than a provider-specific machine snapshot; no historical idea uses
      this mechanism.
  venturePotential:
    score: 4
    rationale: >-
      A metered checkpoint service and compatibility tests could expand across agent frameworks
      and execution providers, but adoption depends on enough runtimes exposing safe boundaries.
  whiteSpace:
    score: 4
    rationale: >-
      The history index has adjacent outage-recovery and sandbox-rehearsal concepts but no agent
      checkpoint portability product; cloud providers and agent runtimes already offer adjacent
      native lifecycle features.
  painIntensity:
    score: 4
    rationale: >-
      Lost agent progress can plausibly repeat compute and tool work, and the cluster specifically
      describes stateful jobs requiring pause and resume; actual loss frequency and cost remain
      unmeasured.
  wedgeClarity:
    score: 4
    rationale: >-
      One coding-agent adapter, repository worktree capsules, and a restore verifier define a
      testable first product, although framework-specific integration remains necessary.
  evidenceFit:
    score: 3
    rationale: >-
      Sources support stateful pause/resume/fork requirements, fast sandbox setup, and reported
      adoption, but do not establish failed-run rates, lost-work costs, or demand for portability.
topRisks:
  - name: Incomplete resume state
    description: >-
      Framework state or external side effects may not be represented by a workspace snapshot and
      transcript, leading to a corrupted or duplicated task.
    mitigation: >-
      Support declared safe boundaries only, capture tool returns without replaying side effects,
      and fail closed when hashes or local checks do not match.
  - name: Sensitive capsule data
    description: >-
      Repository contents and agent transcripts may expose proprietary code or customer context
      if stored or accessed improperly.
    mitigation: >-
      Encrypt client-side with customer-controlled keys, minimize retained payloads, isolate
      tenants, and allow customers to self-host storage.
  - name: Native-feature bundling
    description: >-
      Execution providers may improve their own pause and resume features, while buyers may not
      value portability enough to add another component.
    mitigation: >-
      Prove paid restore savings with a cross-provider design partner and publish compatibility
      tests that let customers measure portability before adopting the service.
