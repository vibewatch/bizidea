problem: >-
  Coding-agent teams that pause, retry, or move a repository task between execution environments
  may have to rely on provider-specific snapshots or restart from the last visible artifact.
  Restarting can discard workspace changes and tool-return context or repeat model and compute
  work, while resuming an incomplete context can produce stale or unsafe changes. The selected
  sources establish stateful pause/resume/fork needs but do not quantify lost progress or its cost.
targetUser:
  primary: >-
    Platform engineering lead at a coding-agent vendor running repository-changing tasks in
    disposable workspaces that need safe pause and continuation.
  secondary: >-
    Agent framework maintainers and execution-cloud operators seeking a portable checkpoint contract.
  buyer: >-
    VP or director of platform engineering at a coding-agent vendor.
startupThesis:
  nonObviousInsight: >-
    An agent task need not migrate a live virtual machine to preserve useful progress: at an
    exposed agent-loop boundary, the source revision, working-tree delta, tool-return context, and
    pinned environment can reconstruct the task in a clean runtime.
  beachhead: >-
    Coding-agent vendors running multi-step repository migration or dependency-upgrade jobs that
    can checkpoint after a declared tool turn and resume without replaying external side effects.
  wedge: >-
    An SDK adapter for one coding-agent loop, plus a signed and encrypted application-level
    checkpoint capsule and a verifier that checks the restored workspace before continuation.
  whyNowCatalyst: >-
    Daytona's announcement explicitly describes stateful agent jobs needing pause, resume, and
    fork; its reported multi-environment execution cloud and Fortune's sandbox-speed comparison
    make portable fresh-runtime restoration a timely hypothesis, though no source validates lost-run
    rates or willingness to pay.
  ventureScalePath: >-
    Start with one coding-agent loop and repository workspaces, then license the capsule format and
    managed checkpoint storage to more agent frameworks and execution providers; add paid
    compatibility tests for safe resumes across runtime profiles.
solution: >-
  The SDK wraps a supported coding-agent loop and emits capsules only at declared safe boundaries.
  Each encrypted capsule pins the source revision, workspace delta, dependency and runtime manifest,
  and agent-visible transcript and tool outputs; credentials are referenced, never stored in the
  capsule. On resume, a clean compatible sandbox reconstructs the workspace and agent context, then
  verifies hashes and required local checks before continuing; it does not migrate process memory
  or replay external side effects. Teams can branch a capsule for an alternate execution path and
  compare the resulting worktree changes before accepting one.
goToMarketSeed:
  firstCustomer: >-
    A coding-agent vendor whose repository-migration jobs span multiple sessions and whose platform
    team can instrument safe tool-turn boundaries.
  buyingTrigger: >-
    A launch of longer-running repository agents or a move between execution providers that makes
    rerunning completed work costly enough to justify a paid restore pilot.
  currentAlternative: >-
    Provider-specific snapshots where available, framework-specific checkpoint code, saved logs,
    and restarting the agent from its original prompt or last committed patch.
  switchingReason: >-
    A portable, verified application-level capsule preserves the agent's workspace and returned
    tool context while rebuilding in a fresh compatible sandbox rather than tying continuation to
    one provider's machine image.
  pricingHypothesis: >-
    Meter managed storage by checkpoint GB-hour and charge per validated restore, with a paid
    compatibility test for each additional runtime profile.
