differentiator: >-
  Runtime vendors can pause or snapshot their own workspaces; this product makes a declared
  agent-loop checkpoint a portable application-level artifact that can be verified after
  reconstruction in another compatible sandbox. It does not promise transparent process migration
  or deterministic model replay, and its initial value is saved task progress rather than a new
  execution cloud or general-purpose orchestration layer.
