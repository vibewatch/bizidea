  whyThisWins: >-
    It makes an agent's safe-point work state portable across disposable runtimes, so teams can
    switch compute without relying on provider-specific machine snapshots or restarting the task.
  acceptedTradeoff: >-
    Resumption works only at supported agent-loop boundaries and reconstructs application-level
    state rather than migrating arbitrary process memory, limiting coverage and adding adapter work.
