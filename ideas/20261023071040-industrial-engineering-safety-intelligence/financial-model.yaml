scenarios:
  downside:
    description: "A weaker price test and slower site conversion leave only two Y3 gross wins; fixed operating spend is not reduced."
    y3RevenueK: 75.740836
    y3EbitdaK: -1251.716598
    cashLowPointK: 680.230093
    keyAssumptionChanges:
      - "A9: annualized ARPU falls 20% to $24K across the forecast."
      - "A9: Y3 gross wins fall from four to two, both in Q3Y3-Q4Y3."
      - "Hiring and non-payroll budgets stay at base levels, making this a cash downside."
  base:
    description: "The gated pilot-to-capacity plan produces eight gross paid-site wins by M36 at the $30K annualized planning ARPU."
    y3RevenueK: 135.871118
    y3EbitdaK: -1208.422794
    cashLowPointK: 733.698070
    keyAssumptionChanges:
      - "A2-A8: base customer ramp, $30K annualized ARPU, churn, delivery margin, hiring, and operating budgets."
  upside:
    description: "Repeatable partner referrals support a higher realized price and two additional Y3 wins without adding fixed headcount or sales budget."
    y3RevenueK: 180.680663
    y3EbitdaK: -1176.159923
    cashLowPointK: 776.135114
    keyAssumptionChanges:
      - "A9: annualized ARPU rises 20% to $36K across the forecast."
      - "A9: Y3 gross wins rise from four to six; the existing sales budget absorbs the added referrals."
sensitivity:
  - variable: ARPU
    downsideCase: "$24K per site-year (-20%); shock applies across all forecast years."
    baseCase: "$30K per site-year."
    upsideCase: "$36K per site-year (+20%); shock applies across all forecast years."
    y3RevenueImpactK: -27.174224
    cashImpactK: -29.739614
    assumptionRef: A10
  - variable: sales cycle
    downsideCase: "Two fewer Y3 site wins; only Q3Y3 and Q4Y3 add one each."
    baseCase: "One new gross paid site in each Y3 quarter."
    upsideCase: "Two additional Y3 wins, one each in Q3Y3 and Q4Y3, with no extra fixed spend."
    y3RevenueImpactK: -41.195075
    cashImpactK: -29.660454
    assumptionRef: A10
  - variable: churn
    downsideCase: "3.78% monthly churn (+1 percentage point), applied to expected active paid sites."
    baseCase: "2.78% monthly churn, or a 36-month life proxy."
    upsideCase: "1.78% monthly churn (-1 percentage point)."
    y3RevenueImpactK: -11.595570
    cashImpactK: -11.245894
    assumptionRef: A10
  - variable: gross margin
    downsideCase: "Y3 gross margin falls to 62%."
    baseCase: "Y3 gross margin is 72%."
    upsideCase: "Y3 gross margin improves to 82%."
    y3RevenueImpactK: 0.000000
    cashImpactK: -13.587112
    assumptionRef: A10
  - variable: CAC
    downsideCase: "CAC rises 25% to $67.89K per win; four Y3 wins add $54.31K selling cost."
    baseCase: "$54.31K CAC per Y3 gross paid-site win."
    upsideCase: "CAC falls 25% to $40.73K per win, saving $54.31K at four wins."
    y3RevenueImpactK: 0.000000
    cashImpactK: -54.312500
    assumptionRef: A10
  - variable: hiring pace
