modelSanity:
  - checkName: Revenue engine
    finding: "The base case moves from two gross paid pilots by M12 to eight gross site wins by M36 at $30K annualized ARPU, producing about $135.9K of Y3 revenue after modeled churn."
  - checkName: Must go right
    finding: "At least one pilot must convert to repeat capacity by M18 and repeat delivery must sustain 72% gross margin, or the 1.19x LTV/CAC and 30.2-month payback do not support scaling."
  - checkName: Model breaks if
    finding: "A 20% ARPU haircut plus two fewer Y3 wins cuts Y3 revenue to $75.7K and cash low point to $680.2K while fixed hiring and delivery spend continue."
  - checkName: Next-round proof
    finding: "Further financing requires two paid pilots, one repeat-capacity conversion, second-site mapping reuse, and repeat gross margin above 70% by the month-18 to month-24 proof gate."
sanityChecks:
  ruleOf40: "Not meaningful at this scale: Y3 revenue growth 101.1% plus EBITDA margin -889.4% = -788.3%, dominated by the small revenue base and validation payroll."
  burnMultiple: "15.3x Y3 EBITDA burn / net-new ARR: $1,208.4K burn divided by about $79.2K net ARR added from the change in expected active site equivalents; excludes working capital and capex."
  revenuePerFte: "Y3 revenue is $23.6K per average 5.75 FTE; no external benchmark is used, and loaded salary is $135K/FTE/year."
  flags:
    - "No named buyer, paid contract, pricing, churn, or customer outcome is validated; the $30K ARPU is an order-of-magnitude proxy from the market-sizing assumption, not willingness-to-pay evidence."
    - "EBITDA remains negative in all three years; Y3 EBITDA is -$1.21M and the mechanical Rule-of-40 result is not a meaningful scale metric."
    - "LTV/CAC is only 1.19x and CAC payback is 30.2 months against an assumed 36-month life, leaving little room for integration overruns or higher churn."
    - "The 72% Y3 gross margin is aspirational and depends on repeat deployment reuse; neither the second-site reuse threshold nor paid repeat volume has been demonstrated."
    - "Base cash declines to $733.7K by M36; no follow-on financing, working capital, taxes, capital expenditure, or debt is modeled, so slower sales or cost overruns would reduce runway."
    - "Y3 revenue per FTE is $23.6K, well below the $135K loaded payroll assumption; this is a proof-stage team investment rather than a scaled revenue run-rate."
    - "Fractional customersEop are expected active-site equivalents under a 2.78% monthly churn heuristic, not literal fractional plant customers or observed retention."
