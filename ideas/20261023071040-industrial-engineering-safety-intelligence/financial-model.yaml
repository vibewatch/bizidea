headcountBasis:
  assumptionRefs:
    - A6
  description: "Annualized payroll equals snapshot FTE multiplied by $135K fully loaded compensation; salaryK is actual period payroll and is included in opexK. Fractional functional-safety review is not FTE."
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
  customerDefinition: "customersEop is expected active paid-site equivalents, so it can be fractional after applying modeled monthly churn; newCustomers is gross paid site wins. A pilot-to-capacity contract conversion changes contract type, not customer count."
  formula: "For each month or quarter, revenueK = average of customersBop and customersEop multiplied by annualized ARPU and divided by 12 or 4, respectively. This midpoint convention phases new wins through the period; monthly and quarterly churn is applied to opening paid-site equivalents."
  exclusion: "No Indurex customer, contract, price, or outcome is assumed to be verified; the forecast is a gated operating hypothesis."
pnlMethodology:
  assumptionRefs:
    - A5
    - A6
    - A7
    - A12
  description: "cogsK is the year-specific direct-cost percentage of revenue; grossProfitK = revenueK - cogsK; salaryK is loaded employee payroll; opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK; ebitdaK = grossProfitK - opexK. Cash rolls forward by funding inflow plus EBITDA."
