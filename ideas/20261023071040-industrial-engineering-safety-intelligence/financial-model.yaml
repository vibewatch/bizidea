slug: safety-change-release-proof
date: "2026-10-23"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: Model period
    value: "36 months, Oct 2026 through Sep 2029"
    unit: calendar months
    source: "[business-plan.yaml date and requested three-year financial-model format; model months M1-M12 run Oct 2026-Sep 2027, followed by eight quarters through Sep 2029]"
  - id: A1
    name: Seed funding and planning runway
    value: "$3.75M seed at M1; 18-month proof plan plus 6-month buffer, or 24-month planned runway"
    unit: USD millions and months
    source: "[business-plan.yaml fundingAsk and operatingAssumptions: $2-4M planning band and an 18-month validation plan; model selects $3.75M within that unverified range and adds the requested six-month buffer; no current Indurex cash or financing is assumed]"
  - id: A2
    name: Gross paid-site acquisition schedule
    value: "1 new paid pilot in M6, 1 in M11, 1 in Q2Y2, 1 in Q4Y2, then 1 in each Y3 quarter; 8 gross wins by M36. One Y1 pilot converts to site capacity by M18 without counting as a new customer."
    unit: gross paid site wins
    source: "[business-plan.yaml gtm.funnelTargets, product.sixMonth, product.twelveMonth, milestones, and experimentRoadmap: one paid pilot by M6, two by M12, and at least 50% pilot-to-annual-capacity conversion by M18 are targets, not observed demand; later wins are a conservative modeler ramp]"
  - id: A3
    name: Annualized revenue per active paid site
    value: "$30.0K per site-year, or $2.5K per site-month; blended pilot, packet, and capacity revenue with no separate onboarding fee"
    unit: USD thousands per paid site-year
    source: "[business-plan.yaml gtm.pricing and businessModel.unitOfValue: fixed onboarding plus per-packet fees, with site capacity only after repeat use; research.yaml market.tam/sam/som uses an assumed €30,000 annual site-equivalent value for sizing only. The USD $30K is an independent order-of-magnitude planning proxy, not a currency conversion, quote, or willingness-to-pay evidence]"
  - id: A4
    name: Churn and customer-life proxy
    value: "36-month average customer life; 2.7778% monthly churn, calculated as 1/36"
    unit: months and percent per month
    source: "[business-plan.yaml investorMemo and research.yaml openQuestions: no retention or contract-term evidence is available; 36 months and the reciprocal monthly churn are explicit startup-finance planning heuristics. Fractional customersEop represent expected active paid-site equivalents; newCustomers are gross site wins]"
  - id: A5
    name: Direct delivery cost and gross margin
    value: "COGS is 45% of revenue in Y1, 40% in Y2, and 28% in Y3, producing gross margins of 55%, 60%, and 72%"
    unit: percent of revenue
    source: "[business-plan.yaml businessModel.targetGrossMarginPct and product.twentyFourMonth: greater than 70% gross margin is a future repeat-delivery target, while early integration and qualified review constrain software margins; year-by-year COGS rates are unvalidated operator planning assumptions for reviewer, integration, security, and delivery costs]"
  - id: A6
    name: Hiring ramp and loaded payroll
    value: "2 FTE at M1; implementation engineer at M7; integration/product engineer at M10; second implementation engineer at M19; second integration/product engineer at M28. Six-column FTE snapshots are 2, 2, 3, 4, 5, 6. Loaded compensation is $135K/FTE/year."
    unit: FTE and USD thousands per FTE-year
    source: "[business-plan.yaml team and strategicChoices.sequencingRationale: founders start at M0, implementation hire is gated on a paid pilot, and dedicated sales/connectors are deferred until repeat use; later engineering hires are gated model assumptions. $135K fully loaded compensation is a named startup-finance planning heuristic, not a sourced salary quote. Fractional safety review is contracted, excluded from FTE, and included in COGS]"
  - id: A7
    name: Non-payroll operating expense
    value: "Y1 monthly S&M $K: 4,4,4,6,6,6,8,8,8,10,10,10; R&D: 15,15,15,18,18,18,20,20,20,25,25,25; G&A: 8,8,8,10,10,10,12,12,12,14,14,14. Y2 quarterly S&M/R&D/G&A $K: 25/35/25, 30/40/30, 35/45/35, 40/50/40. Y3 quarterly: 35/45/30, 40/50/35, 45/55/40, 50/60/45."
    unit: USD thousands per month in Y1 and per quarter in Y2-Y3
    source: "[business-plan.yaml product, operations, gtm.channels, team, and experimentRoadmap: planned engineering validation, secure site onboarding, founder-led travel, legal/security work, and partner testing; spend cadence is a startup-finance planning estimate, not a vendor quote]"
  - id: A8
    name: Fully loaded customer acquisition cost
    value: "Y3 CAC = ($170K Y3 non-payroll S&M + 35% of $135K founder/GTM loaded pay) / 4 gross Y3 site wins = $54.3125K per win"
    unit: USD thousands per new paid site
    source: "[business-plan.yaml gtm.channels and sequencingRationale: founder-led selling continues and no dedicated sales hire is planned; the 35% founder time allocation and four gross Y3 wins from A2 are model assumptions. CAC is allocated from P&L expenses and is not an additional expense]"
  - id: A9
    name: Combined scenario cases
    value: "Downside applies $24K annualized ARPU and only two Y3 gross wins, in Q3Y3 and Q4Y3; upside applies $36K ARPU and six Y3 gross wins, one in each of Q1Y3-Q2Y3 and two in each of Q3Y3-Q4Y3. Base keeps A2-A3."
    unit: USD thousands per site-year and gross site wins
    source: "[business-plan.yaml operatingAssumptions, gtm.funnelTargets, top-level risks, and research.yaml coverageGap: price and conversion remain unvalidated. The 20% pricing and site-win shocks are explicit startup-finance stress-test assumptions, not researched forecasts]"
  - id: A10
    name: Sensitivity shocks
    value: "One-variable cases: ARPU +/-20% across the horizon; two fewer or two additional Y3 site wins; monthly churn +/-1 percentage point; Y3 gross margin +/-10 percentage points; CAC +/-25%; and the sixth FTE hired one quarter earlier or later. Extra Y3 wins assume the existing budget has capacity."
    unit: percent, percentage points, site wins, and quarters
    source: "[business-plan.yaml topRisks, strategicChoices.sequencingRationale, milestones, and operatingAssumptions identify pricing, sales-cycle, retention, integration-cost, and hiring risks; shock sizes and capacity assumption are modeler stress-test choices]"
  - id: A11
    name: Funding allocation and six-month reserve
    value: "$1.875M Engineering (50%); $562.5K GTM (15%); $562.5K G&A (15%); $750K six-month buffer (20%); total $3.75M"
    unit: USD and percent of seed
    source: "[business-plan.yaml fundingAsk.useOfFundsSummary and operatingAssumptions: staged engineering, two to three paid pilots, safety/OT review, and a six-month buffer; modeler allocation is a planning judgment and not an approved budget]"
  - id: A12
    name: Cash and accounting convention
    value: "Opening cash is $0; $3.75M seed arrives in M1; ending cash = prior ending cash + funding inflow + EBITDA. No follow-on financing, taxes, working-capital movement, capital expenditure, or debt service is modeled."
    unit: USD thousands and modeling convention
    source: "[business-plan.yaml fundingAsk and operatingAssumptions: no existing cash or round use is disclosed; the model treats EBITDA as operating cash flow and excludes unquantified tax, working-capital, capital, and financing items]"
