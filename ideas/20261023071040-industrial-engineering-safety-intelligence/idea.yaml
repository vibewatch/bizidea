problem: >-
  At industrial operators using DCS and safety-instrumented systems, engineering deviations can be flagged across
  control, safety, historian, alarm, and IT-security signals, but the source materials describe human review rather
  than a repeatable evidence artifact for each change. When a safety-function change must be reviewed before a unit
  returns to service, assembling the configuration, test, and approval record is a plausible but unverified handoff
  burden. The beachhead hypothesis is evidence-complete change closure, not another alert stream.
targetUser:
  primary: >-
    Functional-safety or SIS engineering leads at European energy and process-manufacturing sites that use
    safety-instrumented systems; the first scope is one site, one unit, and one upcoming safety-function change.
  secondary: Plant maintenance or management-of-change coordinators assembling engineering turnover evidence.
  buyer: Plant engineering or process-safety director at an energy or manufacturing operator.
startupThesis:
  nonObviousInsight: >-
    The durable wedge is not detecting another anomaly; it is making the human disposition of one engineering
    deviation inseparable from the exact configuration revision and verification evidence required to close that
    change.
  beachhead: >-
    European energy and process-manufacturing operators with SIS engineering teams, starting with evidence closure
    for one safety-instrumented function after an approved change and before return to service.
  wedge: >-
    A read-only, per-change evidence packet that links the approved change, relevant SIS configuration revision,
    affected safety function, verification records, and qualified human sign-off.
  whyNowCatalyst: >-
    Indurex's newly disclosed €7 million round and product description show commercial attention to engineering and
    safety data; trade coverage also reports operational disruption from ICS/OT incidents and distinguishes
    safety-function engineering from network-focused monitoring.
  ventureScalePath: >-
    Repeat the packet workflow across more safety functions and units at the first site, then standardize
    version-bound evidence handling across additional SIS families and multi-site operators, with qualified review
    partners supporting deployments.
solution: >-
  Start with one safety-instrumented function and a read-only export of its approved change record, configuration
  revision, relevant alarms or historian evidence, and completed verification records. The product maps the change
  to the affected function and assembles a version-bound evidence checklist, marking missing or inconsistent
  references for a qualified plant reviewer rather than declaring the function safe. The reviewer records a
  disposition and any required follow-up, then the system exports a signed, traceable release packet for the
  operator's change record. It does not write setpoints, modify controller configuration, or authorize equipment
  operation.
goToMarketSeed:
  firstCustomer: >-
    A European energy or process-manufacturing operator with an internal SIS engineering team and an upcoming
    safety-function modification; this is a target profile, not a named Indurex customer.
  buyingTrigger: >-
    A scheduled SIS modification or readiness review that requires the operator to close its change evidence before
    returning the affected unit to service.
  currentAlternative: >-
    Existing SIS and management-of-change procedures supported by engineering review, configuration records,
    test sheets, spreadsheets, and turnover files; network-focused OT monitoring may flag activity but does not itself
    produce this per-change proof packet.
  switchingReason: >-
    The packet ties each reviewer decision to the exact configuration and evidence revision, reducing manual
    reconciliation while keeping the operator's qualified engineer in control.
  pricingHypothesis: >-
    Begin with a paid, single-unit onboarding and charge per completed change-evidence packet; offer an annual site
    capacity subscription only after repeat volume is demonstrated.
