differentiator: >-
  Indurex's reported product is a cross-system layer that flags engineering deviations for review; this concept
  deliberately begins with a nominated safety-function change and ends with a signed, version-bound release record.
  Its value is evidence closure at a specific return-to-service boundary, not continuous monitoring or automated
  control, and it has no write path to plant controllers.
conceptDiagram:
  title: From change to release proof
  mermaid: |
    flowchart LR
      Operator["Plant engineer"] --> Change["Approved change"]
      Sources["SIS revision + alarms + test record"] --> Packet["Change-evidence packet"]
      Change --> Packet
      Packet --> Reviewer["Qualified human review"]
      Reviewer --> Proof["Version-bound release proof"]
businessModelCanvas:
  customerSegments:
    - European energy and process-manufacturing operators with safety-instrumented systems and recurring engineering changes
    - SIS engineering and functional-safety teams responsible for evidence closure
  valuePropositions:
    - Version-bound proof of review and verification for a changed safety function
    - Faster evidence assembly without automated safety decisions or controller writes
  channels:
    - Direct outreach to plant engineering and process-safety leaders around scheduled change windows
    - Referrals from functional-safety consultants and SIS integrators
  customerRelationships:
    - Paid, scoped onboarding for one site, unit, and SIS family
    - Repeat change-packet service with annual site capacity after workflow validation
  revenueStreams:
    - Per-change evidence packet fees during initial pilots
    - Annual site subscription priced by reviewed change capacity
  keyResources:
    - Read-only mapping for supported SIS configuration exports
    - Traceable change-to-evidence data model and qualified review capability
  keyActivities:
    - Normalize configuration and test evidence into version-bound packets
    - Map changes to safety functions and surface missing references for review
    - Maintain secure site onboarding and reviewer workflows
  keyPartners:
    - Functional-safety consultants
    - SIS and DCS integrators
    - Plant management-of-change software providers
  costStructure:
    - Site-specific integration and onboarding
    - Qualified reviewer labor and industrial security controls
    - Long-cycle enterprise sales and partner enablement
jobsToBeDone:
  - job: >-
      When an approved engineering change affects a safety-instrumented function, help the SIS engineer prove that
      the exact configuration revision and required verification evidence were reviewed before return to service, so
      the operator can close the change with an auditable record.
    currentAlternative: >-
      Existing management-of-change procedures, engineer-led review, and manually assembled configuration and
      test records.
    successMetric: >-
      Median time from approved change to evidence-complete review, plus the share of packets with all required
      source-linked records at first review.
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: >-
      The human-approved release artifact is a distinct product boundary, though it builds on familiar industrial
      change-management and monitoring workflows.
  venturePotential:
    score: 4
    rationale: >-
      A repeatable per-change workflow could expand across units, SIS families, and multi-site operators, but
      integration work and industrial procurement may constrain early growth.
  whiteSpace:
    score: 5
    rationale: >-
      The available evidence describes deviation detection and human review, while no historical idea covers a
      version-bound SIS change-release proof; this is a specific whitespace hypothesis, not proof that no competitor
      exists.
  painIntensity:
    score: 4
    rationale: >-
      The triage rates pain at 4, and cited ICS/OT incidents can disrupt operations, but sources do not measure this
      proposed evidence-assembly burden directly.
  wedgeClarity:
    score: 5
    rationale: >-
      One site, one SIS family, one safety-function change, and one release packet create a narrow pilot with a
      measurable time-to-evidence outcome.
  evidenceFit:
    score: 4
    rationale: >-
      Sources explicitly cover SIS and engineering deviations for human review; they do not verify this workflow,
      its buyer, or willingness to pay.
topRisks:
  - name: Site-specific integration
    description: >-
      SIS exports, engineering records, and evidence formats may vary enough to make each deployment bespoke.
    mitigation: >-
      Start with one SIS family and customer-controlled read-only exports, then support only formats proven in paid
      pilots.
  - name: Safety liability
    description: >-
      An evidence packet could be misread as a guarantee that a safety function is fit for operation.
    mitigation: >-
      Limit the product to provenance and completeness checks, require qualified human disposition, and never write
      to controllers or authorize operation.
  - name: Slow incumbent-led sales
    description: >-
      Critical-infrastructure procurement and established SIS or management-of-change vendors may make adoption slow.
    mitigation: >-
      Sell a scoped paid pilot around a scheduled modification through trusted functional-safety consultants or
      integrators and measure evidence-assembly time.
