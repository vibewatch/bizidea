championThesisTest:
  declaredDimension: whiteSpace
  verdict: mixed
  evidenceFor:
    - point: >-
        Regulators expect formal, traceable technical review and accurate change records, while Indurex describes
        surfacing engineering deviations for human review; a per-change, version-bound disposition is a coherent
        transaction distinct from continuous alerts.
      sourceRefs:
        - 1
        - 4
        - 5
    - point: >-
        Public product descriptions reviewed did not establish that a single tool binds the approved change,
        exact SIS revision, verification evidence, and qualified human disposition into the proposed portable
        release packet.
      sourceRefs:
        - 2
        - 19
        - 20
        - 22
  evidenceAgainst:
    - point: >-
        ProofCheck is a close adjacent product: it captures electronic SIS validation and proof-test data,
        checks safety logic CRCs for supported systems, and documents equipment readiness for safe return
        to operations. The proposed release boundary is therefore not unoccupied.
      sourceRefs:
        - 19
    - point: >-
        SIS lifecycle software already supports safety requirements, testing, lifecycle documentation, and
        data exchange, while general management-of-change products already provide approvals, risk review,
        checklists, and auditable records.
      sourceRefs:
        - 2
        - 20
        - 21
        - 22
    - point: >-
        Indurex itself now markets a cross-system engineering, safety, and cybersecurity intelligence layer
        and says it flags engineering deviations for human attention; its reported customers and outcomes
        remain unnamed and unverified.
      sourceRefs:
        - 1
        - 4
        - 18
  revisedClaim: >-
    The credible white-space claim is narrower than the original: a vendor-neutral, read-only packet that
    binds one approved SIS change to the exact affected safety-function revision, verification evidence, and
    qualified human disposition may be differentiated from monitoring, lifecycle calculation, generic MOC,
    and periodic proof-test tools. Existing products overlap materially, and the distinctiveness and paid
    demand of this exact transaction remain hypotheses until buyer workflow comparisons and paid pilots prove them.
reportMemo:
  executiveTakeaways:
    - >-
      Safety-related change review is current and procedure-backed: HSE guidance calls for formal procedures,
      traceable technical review, competent authorization, testing, and accurate records. This validates an
      evidence obligation, not a quantified paperwork burden.
    - >-
      The proposed mechanism is not wholly novel. Proconex ProofCheck already captures SIS test and validation
      evidence, verifies selected logic CRCs, and supports safe return to operation; exida, Kenexis, Siemens,
      and generic MOC products cover adjacent lifecycle or approval workflows.
    - >-
      European scope is large enough to test but not yet a venture-scale proof: the EU reports over 11,000
      Seveso installations, but the SIS-equipped share, relevant annual change frequency, and spend per site
      are unknown. The bottom-up values below are assumption-led envelopes, not measured demand.
    - >-
      Budget evidence is indirect. SANS reports rising ICS/OT cybersecurity budgets, but this concept is a
      process-safety engineering workflow, not an OT security control; no source verifies a budget owner,
      paid pilot, or price for a per-change release packet.
    - >-
      The most defensible thesis is a narrow integration and evidence-provenance wedge. It depends on a
      measurable reduction in time-to-close and on proving that existing SIS/MOC systems do not already
      produce an acceptable record.
  marketDefinition: >-
    Software and implementation services that assemble and preserve evidence for an approved change to a
    safety-instrumented function before return to service. The beachhead is one European process-industry or
    energy site, one SIS family, and one scheduled modification. It excludes general OT anomaly monitoring,
    SIS hardware, automatic safety decisions, and broad enterprise MOC replacement.
  customerAndBuyer: >-
    Daily users are SIS/functional-safety engineers and MOC coordinators; the likely economic buyer is a
    plant engineering or process-safety director, with OT security, site IT, procurement, and legal/safety
    assurance able to block deployment. Evonik's public SIS engineering role lists lifecycle, periodic test,
    validation, and modification responsibilities, but it is a US role and does not validate the European
    beachhead's buyer or buying authority.
  buyingTriggers:
    - point: >-
        A planned SIS modification or pre-commissioning review creates a concrete point to verify the
        changed function, required test evidence, authorization, and record closure before restart.
      sourceRefs:
        - 5
        - 7
        - 14
    - point: >-
        An audit finding, overdue action, or inability to reconcile change records across engineering and
        operations would make completeness and traceability more urgent; no source quantified the frequency
        of these triggers.
      sourceRefs:
        - 5
        - 8
    - point: >-
        A plant already using electronic proof testing or SIS lifecycle software may consider a change packet
        only if it closes a gap those tools demonstrably leave, rather than duplicating a current workflow.
      sourceRefs:
        - 19
        - 20
        - 21
  willingnessToPay:
    summary: >-
      Unproven for the proposed packet. exida lists an exSILentia v4 Online offering at $4,260, showing that
      adjacent SIS lifecycle tooling is commercially sold, and SANS found 55% of surveyed organizations
      reported ICS/OT security budget growth over two years. Neither is a price benchmark or proof of budget
      for version-bound safety-change closure; close alternatives mostly require a sales quote and no public
      customer contract was verified.
    sourceRefs:
      - 2
      - 17
  competitiveLandscape: >-
    The competitive set spans a close SIS testing substitute (Proconex ProofCheck), SIS lifecycle calculation
    and documentation tools (exida, Kenexis, Siemens), general MOC workflow systems (IsoMetrix), cross-system
    industrial engineering intelligence (Indurex), and service-enabled internal processes using plant
    engineers, integrators, spreadsheets, test sheets, and turnover records. ProofCheck is the closest
    evidence-handling analogue; no reviewed source proves it already sells the exact change-to-release packet.
  incumbentThesis:
    - incumbentClass: SIS proof-test and validation products
      point: >-
        These products already capture test evidence, reports, device response, and return-to-operation
        checks. A new product cannot win merely by digitizing safety evidence; it must show that change
        authorization and exact revision provenance are still fragmented after those tools are used.
      sourceRefs:
        - 19
        - 2
    - incumbentClass: SIS lifecycle engineering tools
      point: >-
        They handle calculations, SRS, lifecycle documentation, and safety-system workflows; they may not
        be the default for this packet because the cited pages emphasize lifecycle design and testing, not
        cross-record change closure. This is a scope observation, not evidence that integrations are absent.
      sourceRefs:
        - 2
        - 20
        - 21
    - incumbentClass: generic management-of-change and EHS platforms
      point: >-
        General MOC software already routes approvals, risk assessment, checklists, and auditable change
        records, so it can satisfy much of the administrative job. The remaining hypothesis is that it lacks
        SIS-family-specific revision and verification semantics without customization.
      sourceRefs:
        - 22
        - 5
    - incumbentClass: OT monitoring and engineering-intelligence platforms
      point: >-
        Indurex describes cross-domain visibility and human review of deviations, not the specific release
        transaction in its public materials. It is a funded and well-positioned adjacent incumbent, so
        channel partnership or product competition is plausible rather than ruled out.
      sourceRefs:
        - 1
        - 4
        - 18
    - incumbentClass: internal engineering teams and SIS integrators
      point: >-
        Qualified plant staff already own approvals and field verification and can assemble a record using
        controlled procedures, test sheets, and existing engineering systems. They retain trust and authority;
        a new vendor must prove a meaningful time or completeness improvement without displacing that control.
      sourceRefs:
        - 5
        - 14
        - 19
  regulatoryLandscape: >-
    The Seveso III regime covers more than 11,000 EU industrial installations and establishes risk-based
    obligations around prevention and mitigation of major accidents. UK HSE's COMAH guidance, which implements
    Seveso III in the UK, describes formal management of plant changes, traceable review, competent authorization,
    testing, and accurate change records. These requirements support documentation relevance but do not mandate
    this software or a vendor-generated release packet. IEC 61511 is cited in product and regulator materials;
    the standard itself was not directly accessible in this research session, so no clause-level compliance
    claim is made. Safety sign-off remains the operator's responsibility.
  technologyLandscape: >-
    Read-only exports can be technically plausible: OPC UA supports permissioned data access and security
    mechanisms, NIST emphasizes that OT has safety, reliability, and performance constraints, and ProofCheck
    demonstrates structured evidence collection across HART, OPC variables, manual checks, and selected SIS
    CRCs. These do not establish a universal read-only SIS configuration interface. Each deployment may need
    customer-approved exports, source-system identifiers, configuration revision handling, and secure
    mapping to the operator's MOC and test records. A complete packet must fail closed on missing or stale
    evidence and avoid representing a software check as a safety determination.
  distributionChannels:
    - point: >-
        Direct outreach around a scheduled SIS modification is a testable beachhead because the trigger is
        time-bound and tied to an existing engineering review.
      sourceRefs:
        - 5
        - 14
    - point: >-
        Functional-safety consultancies and SIS integrators are plausible trusted implementation and referral
        channels, but no partnership or reseller agreement was verified.
      sourceRefs:
        - 3
        - 20
        - 19
    - point: >-
        Existing SIS and MOC vendors could bundle an integration or evidence workflow; their installed base
        and ability to extend current products make standalone distribution uncertain.
      sourceRefs:
        - 19
        - 21
        - 22
  partnershipEcosystem:
    - point: >-
        Functional-safety consultants can provide qualified review capacity and help validate the evidence
        checklist, while keeping final disposition with the operator.
      sourceRefs:
        - 3
        - 20
    - point: >-
        SIS/DCS integrators and lifecycle-software vendors may enable customer-controlled exports and
        configuration mapping; proof-test integrations should remain read-only for this product.
      sourceRefs:
        - 19
        - 20
        - 21
    - point: >-
        MOC/EHS platform vendors are potential integration partners and substitutes; their workflow APIs,
        customer overlap, and willingness to partner are unknown.
      sourceRefs:
        - 22
  dataMoats:
    - point: >-
        A defensible asset could be a validated crosswalk among change identifiers, SIS revision identifiers,
        safety-function IDs, verification evidence, and reviewer dispositions across repeat changes at a site.
        No data network effect or proprietary data right was verified; site data ownership and exportability
        may limit reuse across operators.
      sourceRefs:
        - 5
        - 19
        - 20
    - point: >-
        Repeatable, vendor-specific parsers and tested provenance rules may lower onboarding effort over
        time, but the idea's stated site-specific export variation is a delivery-cost risk before it is a moat.
      sourceRefs:
        - 19
        - 20
        - 21
  geographicConsiderations:
    - point: >-
        EU Seveso installation counts provide a relevant upper-bound universe; actual SIS use and software
        procurement differ by country, site, and operator and are not enumerated in the evidence.
      sourceRefs:
        - 8
    - point: >-
        UK HSE/COMAH guidance is useful process-safety evidence but is not identical to each EU member
        state's transposition, inspection practice, or procurement rule.
      sourceRefs:
        - 7
        - 8
    - point: >-
        Evonik's posting is a US-based example of SIS lifecycle staffing, not evidence that European buyer
        roles, budgets, or job demand are equivalent.
      sourceRefs:
        - 14
  sensitivityCases:
    - case: Only 10% of Seveso installations are suitable SIS-equipped prospects, at an assumed €15,000 annual site value
      impact: >-
        The European serviceable envelope falls to roughly €16.5M per year; the project would likely need
        integration-led economics or adjacent non-Seveso sites to support meaningful scale.
      sourceRefs:
        - 8
    - case: 40% of Seveso installations fit and the assumed annual site value is €50,000
      impact: >-
        The theoretical European envelope rises to about €220M, but neither fit rate nor spend assumption
        is supported by observed customer contracts.
      sourceRefs:
        - 8
    - case: Current SIS/MOC tools already generate the exact evidence packet or plant changes are too infrequent
      impact: >-
        Incremental software value may collapse; the concept would need to prove unmet exception handling
        or shorten closure time enough to justify an integration or service fee.
      sourceRefs:
        - 19
        - 20
        - 22
  validationPlan:
    - priority: high
      question: >-
        Do SIS engineers actually spend material time reconciling change approval, configuration revision,
        verification results, and sign-off for one change?
      evidenceToGather: >-
        Observe at least five completed change records at target European sites; time the reconciliation,
        count handoffs and missing references, and compare against the existing SIS/MOC tools.
    - priority: high
      question: >-
        Can a site supply a customer-approved, read-only configuration revision and test-evidence export for
        one SIS family without a custom controller connection?
      evidenceToGather: >-
        Obtain one redacted export set, map source identifiers to a safety function, and have the site's
        functional-safety lead verify completeness and provenance.
    - priority: high
      question: >-
        Will a plant engineering or process-safety buyer pay for the packet separately from existing SIS,
        MOC, integrator, or proof-test contracts?
      evidenceToGather: >-
        Seek a paid, scoped pilot and a budget-owner decision; document the price anchor, procurement route,
        and which incumbent budget or service line would be displaced.
    - priority: medium
      question: >-
        Does ProofCheck or an installed lifecycle/MOC product already satisfy the version-bound release
        packet need at target sites?
      evidenceToGather: >-
        Compare actual site workflows and exports against the proposed packet, including CRC/version controls,
        change approvals, test records, human disposition, and audit acceptance.
    - priority: medium
      question: >-
        Can users distinguish a completeness/provenance packet from a guarantee that the safety function is
        fit for operation?
      evidenceToGather: >-
        Conduct a safety/legal review of proposed language, sign-off boundaries, liability terms, and whether
        reviewers will accept the output as supporting rather than replacing their documented judgment.
analysisModels:
  marketMapDiagram:
    title: SIS change evidence map
    mermaid: |
      quadrantChart
        title Specialization and urgency of SIS evidence workflows
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed startup: [0.88, 0.86]
        SIS ProofCheck: [0.82, 0.78]
        SIS lifecycle tools: [0.68, 0.62]
        Generic MOC software: [0.42, 0.58]
        OT monitoring: [0.38, 0.70]
        Manual plant procedure: [0.25, 0.52]
  fiveForces:
    supplierPower:
      score: 3
      rationale: >-
        SIS vendors and experienced integrators control source-system formats and access; OPC UA offers
        permissioned access mechanisms, but no universal export contract was verified.
      sourceRefs:
        - 15
        - 19
        - 21
    buyerPower:
      score: 4
      rationale: >-
        Operators control safety approval and can keep using internal MOC, engineers, and installed lifecycle
        tools; public pricing for close products is sparse, and the buyer's willingness to pay is unverified.
      sourceRefs:
        - 2
        - 5
        - 22
    threatOfEntrants:
      score: 2
      rationale: >-
        A basic workflow can be built, but plant access, SIS-specific semantics, qualified-review credibility,
        and site validation make trusted deployment harder than ordinary workflow SaaS.
      sourceRefs:
        - 5
        - 6
        - 11
    threatOfSubstitutes:
      score: 5
      rationale: >-
        Proof-test systems, lifecycle tools, generic MOC, integrator services, and existing spreadsheets or
        turnover files can all satisfy parts of the job, with ProofCheck already covering return-to-operation
        evidence.
      sourceRefs:
        - 19
        - 20
        - 22
        - 5
    competitiveRivalry:
      score: 4
      rationale: >-
        Established SIS suppliers, lifecycle specialists, MOC platforms, and a funded engineering-intelligence
        entrant overlap with the use case; exact release-packet competition remains unconfirmed.
      sourceRefs:
        - 1
        - 2
        - 19
        - 21
        - 22
  pestle:
    - factor: political
      impact: positive
      point: >-
        EU major-accident policy and inspections maintain attention on documented prevention and safety
        management; they do not require this specific software.
      sourceRefs:
        - 8
        - 7
    - factor: economic
      impact: negative
      point: >-
        European chemicals face weak demand, energy-cost pressure, import pressure, and capacity utilization
        below the pre-crisis level, which may constrain discretionary tooling budgets.
      sourceRefs:
        - 9
    - factor: social
      impact: positive
      point: >-
        Safety-critical decisions remain a qualified human responsibility; a product that clarifies evidence
        without claiming to declare a function safe better fits that boundary.
      sourceRefs:
        - 5
        - 11
    - factor: technological
      impact: neutral
      point: >-
        Secure, permissioned industrial data exchange is technically available, but local SIS exports,
        revision semantics, and validation remain product-specific integration work.
      sourceRefs:
        - 15
        - 19
        - 11
    - factor: legal
      impact: positive
      point: >-
        Seveso/COMAH regimes reinforce formal change and safety-management practices; software must not
        imply certification, substitute for competent review, or authorize operation.
      sourceRefs:
        - 7
        - 8
    - factor: environmental
      impact: neutral
      point: >-
        Major-accident prevention protects people and the environment, but no evidence links this specific
        packet product to a measured environmental outcome.
      sourceRefs:
        - 8
        - 5
  adoptionFrictionMatrix:
    - friction: SIS export formats and identifiers differ by vendor and site
      severity: high
      affectedBuyer: SIS engineering lead and site OT/IT
      mitigation: >-
        Start with one customer-approved, read-only export and one SIS family; reject incomplete or
        unmapped evidence rather than inventing a universal connector.
      sourceRefs:
        - 19
        - 20
        - 21
    - friction: Safety liability or confusion about who declares readiness
      severity: high
      affectedBuyer: Process-safety director, functional-safety engineer, legal
      mitigation: >-
        Limit outputs to provenance and completeness checks, require named qualified human disposition,
        and never write to controllers or authorize return to service.
      sourceRefs:
        - 5
        - 6
        - 11
    - friction: Existing SIS proof-test, lifecycle, or MOC software may already suffice
      severity: high
      affectedBuyer: Plant engineering director and SIS owner
      mitigation: >-
        Run a workflow comparison against live site records before selling; demonstrate a missing cross-system
        link and incremental reduction in time-to-close.
      sourceRefs:
        - 19
        - 20
        - 22
    - friction: OT security review can reject cloud transfer or any controller write path
      severity: high
      affectedBuyer: OT security lead and plant operations
      mitigation: >-
        Use customer-controlled exports or an approved on-premise boundary, document data flow, and keep
        the product non-actuating and read-only.
      sourceRefs:
        - 11
        - 15
        - 16
    - friction: Procurement and budget ownership are split between engineering, safety, and OT security
      severity: medium
      affectedBuyer: Plant director, procurement, IT/OT security
      mitigation: >-
        Tie the pilot to a scheduled modification and identify the accountable budget owner before integration;
        SANS survey allocation findings are not proof of a process-safety budget.
      sourceRefs:
        - 17
        - 14
    - friction: Long validation and change windows slow evaluation
      severity: medium
      affectedBuyer: SIS engineer and site project manager
      mitigation: >-
        Use a completed historical change for shadow-mode evaluation before the next live modification, then
        request customer approval for any operational use.
      sourceRefs:
        - 5
        - 7
market:
  tam:
    value: €330M annual spend envelope
    rationale: >-
      Bottom-up EU upper bound: more than 11,000 Seveso installations [8] multiplied by an assumed €30,000
      annual software-equivalent value per site. This is not a market-reported category spend, includes sites
      that may lack SIS or relevant change volume, and is only a ceiling for the European regulated-site
      universe, not a validated forecast or pricing recommendation.
    isEstimate: true
    sourceRefs:
      - 8
  sam:
    value: €82.5M annual spend envelope
    rationale: >-
      Apply an operator assumption that 25% of the 11,000-plus EU Seveso installations have an SIS, recurring
      engineering changes, and sufficient digital readiness (2,750 sites), then multiply by the same
      assumed €30,000 annual site-equivalent value. The 25% fit rate and spend are unverified and should be
      replaced with country/site counts and buyer interviews.
    isEstimate: true
    sourceRefs:
      - 8
  som:
    value: €1.5M annual spend envelope
    rationale: >-
      A scenario of 50 paying European sites, approximately 1.8% of the assumed 2,750-site SAM, multiplied
      by €30,000 annual site-equivalent value. This is an arithmetic reach scenario, not a sales forecast;
      paid demand, sales cycle, and service margin are not established.
    isEstimate: true
    sourceRefs:
      - 8
bottomUpSizingDrivers:
  - driver: EU Seveso industrial installations, broad upper-bound universe
    value: More than 11,000 installations
    source: "[8]"
  - driver: SIS/change-workflow fit rate
    value: 25% assumed, yielding about 2,750 serviceable sites
    source: est.
  - driver: Annual software-equivalent value per suitable site
    value: €30,000 assumed for sizing only; no willingness-to-pay evidence for this product
    source: est.
  - driver: Reachable paying sites in the SOM scenario
    value: 50 sites, or about 1.8% of the assumed SAM
    source: est.
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: >-
        EU policy covers more than 11,000 industrial installations and reported fewer than 22 major
        industrial accidents per year on average in 2019-2022, sustaining prevention and assurance attention.
      sourceRefs:
        - 8
    - point: >-
        SANS's 2025 ICS/OT survey reports 22% of organizations experienced an incident and 40% of those
        incidents caused operational disruption; this supports the broader importance of operational
        resilience, not demand for the proposed packet.
      sourceRefs:
        - 10
    - point: >-
        SANS's separate budget survey reports that 55% of respondents saw ICS/OT security budget growth
        over the prior two years, although budget ownership is mixed and this is not safety-engineering spend.
      sourceRefs:
        - 17
  headwinds:
    - point: >-
        European chemical businesses report weak demand, elevated energy prices, import pressure, and
        capacity utilization below pre-crisis levels, all of which can delay discretionary software projects.
      sourceRefs:
        - 9
    - point: >-
        The most relevant substitute products already sell proof-test, lifecycle, and MOC capabilities, while
        exact product pricing and customer switching evidence are largely private.
      sourceRefs:
        - 2
        - 19
        - 20
        - 22
competitors:
  - name: Proconex SIS ProofCheck
    stage: Established industrial software/product line
    wedge: >-
      Electronic SIS validation and proof-test procedures; captures field and manual evidence, validates
      test criteria, can verify selected SIS logic CRCs, and generates records for safe return to operations.
    pricing: Quote-based on the fetched product page; no public price found.
    strength: >-
      Closest functional overlap: real-time evidence capture, validation, audit reports, and return-to-service
      workflow in an existing SIS testing context.
    weaknessVsUs: >-
      Public materials emphasize validation and periodic proof testing rather than a vendor-neutral packet
      binding an approved change, exact configuration revision, and human disposition; this is an observed
      documentation gap, not proof the product cannot be extended.
    sourceRefs:
      - 19
  - name: exida exSILentia
    stage: Established specialist vendor
    wedge: >-
      Modular SIS lifecycle and process-safety engineering tools, including analysis, SIL verification,
      proof-test development, and operations modules.
    pricing: exSILentia v4 Online displayed at $4,260; package, term, and scope need confirmation.
    strength: >-
      Domain-specific lifecycle scope, safety-engineering workflow, and a public purchase path provide a
      credible alternative for some documentation and test-planning needs.
    weaknessVsUs: >-
      The fetched description centers lifecycle modules and engineering analyses, not an event-driven,
      cross-record release packet after one approved field change.
    sourceRefs:
      - 2
  - name: Kenexis SIS
    stage: Specialist engineering software vendor
    wedge: >-
      SIL verification, SRS and cause-and-effect documentation, structured SIF data, CSV import/export,
      and optional API-based integration.
    pricing: Subscription pricing is not public on the fetched page; API is described as a separate purchase.
    strength: >-
      Structured safety data and flexible exports directly address lifecycle data movement and make it a
      plausible incumbent integration or alternative.
    weaknessVsUs: >-
      The public feature description emphasizes verification, SRS, and data access rather than change
      authorization and a signed, version-bound return-to-service packet.
    sourceRefs:
      - 20
  - name: IsoMetrix Management of Change
    stage: Established EHS/risk software vendor
    wedge: >-
      Configurable change request, risk assessment, approval, action, checklist, and audit-trail workflows
      across enterprise systems.
    pricing: Quote-based; no public price found.
    strength: >-
      Can own the approval and governance record already, making it a strong workflow substitute and
      integration point for the buyer.
    weaknessVsUs: >-
      Its public page describes general MOC rather than SIS-family configuration revision and test-evidence
      semantics; custom configuration could narrow that gap.
    sourceRefs:
      - 22
  - name: Indurex SafeGuard AI
    stage: Early-stage funded company; €7M disclosed in October 2026
    wedge: >-
      Cross-system engineering intelligence that ingests DCS, SIS, historian, alarm, and security data and
      surfaces engineering deviations for human attention.
    pricing: Not public.
    strength: >-
      Closest strategic adjacency: the company addresses engineering and safety signals rather than only
      network alerts and says it has early operator customers.
    weaknessVsUs: >-
      Public materials describe continuous visibility, anomaly surfacing, and reporting rather than the
      exact per-change release transaction; customer names and independent outcomes are not disclosed.
    sourceRefs:
      - 1
      - 4
regulatoryTechnicalConstraints:
  - point: >-
      Seveso III covers more than 11,000 EU installations and sets a prevention/mitigation framework; it
      does not require this product, a SaaS record, or a specific release-packet format.
    sourceRefs:
      - 8
  - point: >-
      UK COMAH/HSE guidance calls for formal management procedures, traceable safety and engineering review,
      competent authorization, testing against design intent, and accurate change records; the operator
      remains accountable for applicable duties.
    sourceRefs:
      - 5
      - 6
      - 7
  - point: >-
      IEC 61511 is referenced by regulator and vendor materials, but the standard text was not directly
      fetched; do not claim clause-level conformity or certification based on these sources.
    sourceRefs:
      - 5
      - 19
      - 21
  - point: >-
      NIST guidance highlights OT's distinctive safety, reliability, and performance requirements. Cloud
      connectivity or automated inference must not compromise a plant's approved process or be mistaken
      for a safety action.
    sourceRefs:
      - 11
  - point: >-
      OPC UA offers permissioned access, encryption, signing, authentication, and audit features, but it does
      not standardize each vendor's change record, SIS revision, SIF linkage, or customer export policy.
    sourceRefs:
      - 15
      - 19
validationSignals:
  - point: >-
      Formal, traceable, authorized plant modification review and change recording are described as good
      practice by HSE, supporting a real workflow obligation.
    sourceRefs:
      - 5
      - 7
  - point: >-
      Dedicated SIS engineering responsibilities include lifecycle management, periodic test, validation,
      modifications, and IEC 61508/61511 knowledge in a public industrial job listing.
    sourceRefs:
      - 14
  - point: >-
      Adjacent commercial products publish lifecycle, proof-test, change-workflow, or product-pricing
      details, showing that buyers procure neighboring tools while leaving this packet's purchase unproven.
    sourceRefs:
      - 2
      - 19
      - 20
      - 22
  - point: >-
      Indurex announced a €7M funding round and describes early customers, but the company release names
      no customers and the claims are not independent evidence of paid use or outcomes.
    sourceRefs:
      - 1
openQuestions:
  - >-
    At target European sites, how many SIS changes per year require a documented verification and release
    packet, and how many staff hours are spent assembling one?
  - >-
    Which configuration export, revision identifier, and approved test record can the target SIS family
    expose read-only, and who authorizes that access?
  - >-
    Do ProofCheck, exida, Kenexis, Siemens, or the site's MOC platform already meet the exact change-to-release
    requirement after configuration, integration, and local procedures are considered?
  - >-
    Which budget owner would fund this product, what existing tool or service budget would it displace, and
    will that owner pay for a single completed packet?
  - >-
    What acceptance language and liability boundary let the operator use the packet as an audit record
    without interpreting it as an automated safety-integrity decision?
