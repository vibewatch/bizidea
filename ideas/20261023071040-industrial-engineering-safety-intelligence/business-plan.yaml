slug: safety-change-release-proof
date: '2026-10-23'
executiveSummary: >-
  This plan tests a narrow Indurex product-line thesis: turn one approved SIS change into a read-only,
  source-linked release packet rather than expand the continuous alert surface. Indurex says SafeGuard AI
  ingests DCS, SIS, historian, alarm-management, and IT-security data to flag engineering deviations for
  human review, but its funding release names no customers or independently verified outcomes (research
  source 1). UK HSE plant-modification guidance calls for traceable review, competent authorization,
  testing, and accurate change records, but it neither mandates this software nor quantifies the paperwork
  burden (source 5). The first customer is a European energy or process-industry site with an SIS engineer
  and a scheduled modification; the likely plant engineering or process-safety budget owner remains
  unverified. The product would map customer-approved read-only records for one SIS family to the exact
  change and safety-function revision, then leave disposition and return-to-service authority with a
  qualified operator. The European Commission counts more than 11,000 Seveso installations, but SIS fit,
  change frequency, and willingness to pay are unknown; the €330M TAM, €82.5M SAM, and €1.5M SOM below
  are assumption-led envelopes, not verified demand. Proconex ProofCheck already captures SIS validation
  and proof-test evidence and supports return-to-operation records, while lifecycle tools, MOC platforms,
  integrators, and plant engineers are material substitutes (research sources 19, 2, 20, and 22).
  Recommendation: Watch until a paid shadow-mode pilot demonstrates incremental value; Indurex's round
  type, remaining runway, team size, and price for this workflow are not disclosed.
problem:
  - >-
    HSE's plant-modification guidance describes formal procedures, traceable technical review, competent
    authorization, testing, and accurate change records; it supports a real obligation, not a quantified
    manual-work burden or a mandated vendor packet (research sources 5 and 7).
  - >-
    The proposed gap is whether approved change records, the exact SIS configuration revision, verification
    evidence, and qualified human disposition are reconciled across systems before return to service.
    Research found no measured time study or named customer proving this is a material bottleneck.
  - >-
    ProofCheck captures SIS test evidence and return-to-operation records; SIS lifecycle tools and general
    MOC software cover adjacent tasks, while internal engineers and integrators already own the trusted
    review. A new product must prove an unfilled cross-record need rather than digitize existing work
    (research competitive review and sources 19, 2, 20, 21, and 22).
solution:
  - >-
    For one approved change, one safety-instrumented function, and one supported SIS family, ingest
    customer-approved read-only exports; link the change identifier, exact configuration revision,
    verification records, relevant evidence, and reviewer disposition in a version-bound packet. Mark
    missing, stale, or inconsistent references for correction rather than infer safety.
  - >-
    Record the qualified reviewer and export a traceable release packet for the operator's change file.
    The product does not write setpoints, modify controller configuration, certify compliance, declare a
    function safe, or authorize operation.
whyWeWin:
  - >-
    The proposed boundary is a per-change release transaction, not another network alert or continuous
    monitoring view; differentiation is plausible but remains a hypothesis against ProofCheck and installed
    MOC/SIS workflows (research sources 1, 4, 19, and 22).
  - >-
    A validated crosswalk among change IDs, SIS revisions, safety-function IDs, test evidence, and human
    dispositions could make repeat deployment faster; research explicitly warns that site-specific formats
    are a delivery-cost risk before they become a moat.
  - >-
    Indurex's reported cross-system ingestion may provide a starting point for source mapping, but reuse
    for this evidence packet, customer permissions, and a lower integration cost have not been demonstrated
    (research source 1).
strategicChoices:
  beachhead: >-
    One European Seveso/COMAH-regulated energy or process-manufacturing site, one SIS family, one
    safety-instrumented function, and one scheduled modification before return to service.
  wedgeRationale: >-
    A scheduled change creates a bounded buyer trigger and a measurable baseline: time from approved
    change to evidence-complete review. A read-only packet tests a specific gap between MOC approval,
    configuration provenance, and verification evidence without replacing the engineer or the installed
    monitoring stack.
  sequencingRationale: >-
    First compare historical records and incumbent outputs; then validate one customer-approved export
    and reviewer checklist in shadow mode; sell a scoped pilot before adding integrations; add a second
    SIS family and annual capacity pricing only after a second deployment reuses the mapping. Keep early
    selling founder-led and use functional-safety reviewers before building a dedicated sales or connector
    team. Accept that plant-specific SIS exports and approval processes require integration work and qualified
    human review, constraining early software margins and sales velocity; defer broader connector coverage
    until reuse is measured.
  notYet:
    - General OT anomaly monitoring, alert triage, or an asset-wide dashboard.
    - Automated safety-integrity conclusions, controller writes, or authorization to restart equipment.
    - Replacing enterprise MOC, SIS lifecycle, or proof-testing systems.
    - Multi-vendor connectors, non-European expansion, and broad multi-site rollout before repeatable paid use.
market:
  tam: >-
    €330M annual spend envelope: 11,000+ EU Seveso installations multiplied by an assumed €30,000
    annual site value. This is a researched upper-bound scenario, not reported category spend, and includes
    sites without SIS fit or relevant change volume (European Commission Seveso report; researched TAM scenario).
  sam: >-
    €82.5M annual envelope: an assumed 25% fit rate, or about 2,750 of the 11,000+ installations,
    multiplied by the same assumed €30,000 annual site value. Both inputs are unverified (researched SAM scenario).
  som: >-
    €1.5M annual reach scenario: 50 paying sites at an assumed €30,000 annual site value, about 1.8% of
    the assumed SAM. This is not a sales forecast; customer count, contract value, and conversion are
    unproven (researched SOM scenario).
  segments:
    - >-
      Primary: European Seveso/COMAH process-industry and energy sites with an internal SIS team and
      recurring safety-function modifications.
    - >-
      Secondary, after proof: other European manufacturing and energy sites with SIS teams and recurring
      changes; site count and serviceable value are not quantified in the research.
  buyingProcess: >-
    A scheduled SIS modification or pre-commissioning readiness review is the trigger; SIS engineers and
    MOC coordinators use the workflow, while a plant engineering or process-safety director is the likely
    economic buyer. OT security, site IT, procurement, legal, and safety assurance can block deployment;
    actual budget ownership, procurement duration, and purchase authority for this product are unknown.
product:
  mvp: >-
    Accept customer-approved read-only exports for one SIS family and one change; map the approved change,
    affected safety function, exact configuration revision, and completed verification records into a
    reviewer checklist and signed disposition. Fail closed on missing or stale references and export a
    traceable packet without any controller write path.
  sixMonth: >-
    Support one validated SIS export format and one MOC/change-record format; complete a shadow-mode
    pilot using historical and scheduled changes at one site, with baseline time and completeness measured.
    Do not add live plant connectivity unless the site separately approves it.
  twelveMonth: >-
    Target two paid pilots across two operators and at least one repeat change at the first site. Compare
    actual packets with ProofCheck, lifecycle, and MOC outputs; pursue annual site-capacity pricing only
    if the buyer pays for repeat use.
  twentyFourMonth: >-
    If pilots convert and a second site reuses the first mapping, support at most two or three SIS families,
    offer an annual site-capacity contract, and target greater than 70% gross margin on repeat delivery.
    Otherwise retain a single-family, service-assisted product or stop expansion.
  keyBets:
    - A target site can supply revision-specific evidence through an approved read-only export without a custom controller connection.
    - The existing site workflow leaves a real change-to-revision evidence gap that ProofCheck or MOC configuration does not already close.
    - A packet reduces evidence-assembly time by at least 30% and is complete on first review at least 90% of the time; these are pilot targets, not observed results.
    - Qualified human disposition, clear product boundaries, and customer acceptance can address safety-liability concerns without implying certification.
gtm:
  wedge: >-
    Sell a paid, one-site/one-unit/one-function pilot around an upcoming SIS modification; start in
    shadow mode against a completed or scheduled change, then convert repeat packet demand to annual site
    capacity only after the buyer confirms the workflow is not already covered.
  channels:
    - >-
      Founder-led direct outreach to plant engineering and process-safety leaders before scheduled
      modification or pre-commissioning windows.
    - >-
      Test referrals and implementation support from functional-safety consultancies and SIS integrators;
      the research verified plausible partners but no signed partnership or reseller.
  funnelTargets: >-
    Operating targets, not researched benchmarks: 10 qualified buyer conversations to 5 record-workflow
    reviews, 2 scoped pilots, and 1 paid pilot by month 6; target at least 50% paid-pilot-to-annual-site
    conversion by month 18.
  pricing: >-
    Begin with a fixed-fee, tightly scoped onboarding plus a fee per completed evidence packet; price by
    the evidence transaction, not monitored assets or alert volume. Offer annual site capacity only after
    repeat volume is observed. No source validates a price for this packet; the €30,000 site value is only
    a market-sizing assumption, not a quote or willingness-to-pay benchmark.
businessModel:
  revenueStreams:
    - Fixed-fee onboarding for one site, one SIS family, and customer-approved read-only data mapping.
    - Per-change evidence-packet fees during initial pilots.
    - Annual site-capacity subscription after repeat packet volume and conversion are demonstrated.
  unitOfValue: >-
    One completed, source-linked evidence packet for an approved change to one safety-instrumented
    function, including the qualified human disposition; per packet is the initial pricing basis.
  targetGrossMarginPct: 70
  expansionLevers:
    - More completed changes per unit, then more units at the same site.
    - Reuse validated revision and evidence mappings across additional SIS families.
    - Convert repeat packet fees to annual site capacity after demonstrated volume.
    - Add consultant or integrator delivery referrals after customer acceptance and repeatable onboarding.
strategyMap:
  northStarMetric: >-
    Median elapsed time from approved SIS change to qualified-reviewer-approved, evidence-complete packet;
    establish each site's baseline before claiming improvement.
  inputMetrics:
    - Share of packets with correct change, function, revision, and verification links at first review.
    - Staff hours to map a new site's export and direct reviewer labor per completed packet.
    - Paid pilot-to-repeat-packet and paid-pilot-to-annual-capacity conversion.
  moatsToBuild:
    - Validated, vendor-specific parsers and tested crosswalks among change IDs, SIS revisions, safety functions, and evidence.
    - Provenance rules, fail-closed handling, and audit records accepted by qualified plant reviewers.
    - Trusted implementation relationships with functional-safety consultants and SIS integrators; no network effect or proprietary data rights are assumed.
  killCriteria:
    - >-
      Stop or redefine the workflow if five observed changes across at least three target sites show less
      than 20% median staff-time reduction and no meaningful first-pass completeness improvement.
    - >-
      Stop the standalone packet if the installed ProofCheck/MOC/SIS workflow already produces an
      operator-accepted exact-revision and verification packet for at least four of five reviewed changes.
    - >-
      Do not expand the connector team if two paid pilots are not secured from budget-owning buyers by
      month 12, or if the second deployment cannot reuse at least half of the first deployment's mapping work.
    - >-
      Do not build annual capacity pricing if no pilot customer buys repeat packet volume by month 18.
  mermaid: |
    flowchart LR
      Change["Scheduled SIS change"] --> Export["Customer-approved read-only export"]
      Export --> Packet["Version-bound evidence packet"]
      Packet --> Review["Qualified human disposition"]
      Review --> Proof["Traceable release record"]
      Proof --> Repeat["Repeat changes and site capacity"]
      Repeat --> Expand["Additional units and SIS families"]
investorMemo:
  verdict:
    call: Watch
    conviction: >-
      Low-to-moderate conviction in the workflow thesis; customer pain intensity, product differentiation,
      and willingness to pay remain unverified.
    whyBelieve: >-
      HSE change guidance supports a real traceability obligation, and a per-change packet could connect
      records that continuous monitoring and general MOC do not necessarily bind together.
    whyDoubt: >-
      ProofCheck already captures SIS test evidence and return-to-operation records, adjacent MOC/SIS tools
      and internal teams are strong substitutes, and no paid demand or site-level market fit was verified.
    nextDiligence: >-
      Observe five completed changes at target European sites, compare each packet with the installed
      ProofCheck/MOC workflow, and secure one paid shadow-mode pilot from a named budget owner.
  firstCustomer:
    title: European SIS change owner at a process or energy site
    profile: >-
      A Seveso/COMAH-regulated European operator with an internal SIS engineer, established MOC records,
      and one scheduled safety-function modification; this is a target profile, not a named customer.
    trigger: >-
      A scheduled SIS modification or pre-commissioning review requires evidence and qualified disposition
      before the affected unit returns to service (HSE sources 5 and 7).
    buyer: Plant engineering or process-safety director; budget authority is unverified.
    initialContract: >-
      No evidence-backed pilot or ACV range is available. Proposed entry is a fixed-fee one-site,
      one-unit, one-function pilot for one change, followed by per-packet fees and annual site capacity
      only after repeat use.
  mustBeTrue:
    - >-
      Across at least five completed changes at three target sites, the workflow reduces median staff time
      to an evidence-complete review by at least 30% and achieves at least 90% first-pass completeness.
    - >-
      At least two target sites provide approved read-only configuration-revision and verification exports
      for one SIS family without a custom controller connection.
    - >-
      Live workflow comparisons show an unmet revision-to-evidence linkage in at least three of five
      reviewed changes after accounting for ProofCheck, the site's SIS lifecycle tools, and MOC software.
    - >-
      At least two plant engineering or process-safety budget owners sign paid, scoped pilots and identify
      a budget path for repeat use; interest without a paid commitment does not qualify.
    - >-
      The second deployment reuses at least half of first-site mapping work, and at least one pilot converts
      to repeat packet volume or annual capacity without relying on unpriced reviewer labor.
  diligenceQuestions:
    - Which SIS families and revision identifiers are present at target sites, and can operators provide approved read-only exports?
    - For five recent changes, how many staff hours and handoffs were required, and what did the installed ProofCheck, MOC, or lifecycle tools already produce?
    - Who owns the budget and signs a paid pilot, which existing tool or service budget would pay, and what price threshold is acceptable?
    - How many safety-function modifications per target site occur annually, and which share need a documented evidence packet?
    - What acceptance language, liability terms, and human sign-off boundary will plant safety, legal, and OT security teams approve?
    - Can the second site reuse parsers and evidence mappings, and what integration and reviewer labor remains per packet?
operatingAssumptions:
  - assumption: >-
      Evidence reconciliation takes enough time or causes enough missing references at target sites to
      justify a separate workflow; mandatory change-control procedures alone do not establish this burden.
    basis: research.yaml
    validationTest: >-
      Observe and time at least five completed SIS changes across three target European sites; record
      handoffs, missing links, first-pass acceptance, and incumbent-system outputs.
    decisionImpact: >-
      If median time savings are below 20% and completeness does not improve, stop the packet thesis or
      narrow it to a demonstrably costly exception workflow.
  - assumption: >-
      One SIS family can provide a customer-approved, read-only revision and verification export with
      enough identifiers to build a trustworthy packet; no universal SIS export interface was verified.
    basis: research.yaml
    validationTest: >-
      Obtain one redacted export set, map it to a safety function, and have the site's functional-safety
      lead confirm source identity, revision, and completeness within four weeks.
    decisionImpact: >-
      If access requires controller writes or repeated bespoke extraction, stop that connector and test
      another SIS family before committing to multi-vendor coverage.
  - assumption: >-
      A plant engineering or process-safety director will fund the packet separately from existing SIS,
      MOC, integrator, or proof-test contracts; no willingness-to-pay evidence was found.
    basis: research.yaml
    validationTest: >-
      Conduct 10 budget-owner interviews, document the displacing budget and procurement path, and secure
      two paid scoped pilots rather than relying on nonbinding interest.
    decisionImpact: >-
      If no budget owner pays, test an integration or service-partner channel once; if that also fails,
      do not scale direct sales or product scope.
  - assumption: >-
      Repeat deployments can reduce integration and review labor enough to support a long-run gross-margin
      target above 70%; the idea and research both identify early service effort as a constraint.
    basis: idea.yaml
    validationTest: >-
      Cost two pilots by engineering, reviewer, security, and support hours; require the second deployment
      to reuse at least half of first-site mapping work and model direct delivery cost against paid pricing.
    decisionImpact: >-
      If repeat delivery remains bespoke or labor-heavy, keep the offer service-led with explicit scope,
      seek a qualified partner, or abandon a software-margin thesis.
  - assumption: >-
      Functional-safety consultants or SIS integrators will make credible introductions and assist with
      export mapping; research identifies them as plausible channels but verifies no agreement.
    basis: research.yaml
    validationTest: >-
      Ask three relevant consultants or integrators for a named buyer introduction or pilot role and secure
      one qualified referral tied to an upcoming change.
    decisionImpact: >-
      If no partner engages, retain founder-led direct selling and do not hire a channel team or depend on
      reseller-led acquisition.
  - assumption: >-
      A separate $2–4M seed ask can fund 18 months of this product-wedge validation; this is an operator
      planning assumption, not a reported Indurex financing need, and the disclosed €7M round's type,
      use, and remaining runway are unknown.
    basis: operator judgment
    validationTest: >-
      Reconcile Indurex's actual round documents, current cash and runway, product-team allocation, and
      staged hiring and pilot costs before presenting an external ask.
    decisionImpact: >-
      If existing proceeds cover the milestones, do not raise a separate round; if the stage or cost base
      differs, re-size both the round and runway before the financial model is finalized.
experimentRoadmap:
  - horizon: 0–90 days
    experiment: >-
      Observe and time five completed SIS changes across at least three European target sites, including
      the outputs of each site's existing MOC and SIS tools.
    hypothesis: >-
      Change approval, exact revision, test evidence, and disposition are not consistently joined in one
      accepted record, leaving measurable reconciliation effort.
    successMetric: >-
      Five records time-stamped; baseline median assembly time, missing-link rate, first-pass acceptance,
      and incumbent coverage documented; at least three show a specific unclosed linkage.
    owner: Founder and fractional functional-safety lead
  - horizon: 0–90 days
    experiment: >-
      Obtain a redacted, customer-approved read-only export for one SIS family and build a shadow packet
      from one historical modification.
    hypothesis: >-
      The exact revision and verification evidence can be mapped without a controller connection and
      checked by the site's qualified reviewer.
    successMetric: >-
      One reviewer-accepted mapping with source IDs and revision provenance verified; no controller write
      or unsupported inference; complete the mapping within four weeks of access.
    owner: Founding engineer with customer SIS engineer
  - horizon: 0–90 days
    experiment: >-
      Run an incumbent workflow comparison using the same change record in ProofCheck, the site's MOC
      system, and any SIS lifecycle tool in use.
    hypothesis: >-
      At least some target changes lack an operator-accepted artifact binding the approved change to exact
      revision, evidence, and human disposition.
    successMetric: >-
      Compare five changes; at least three contain a documented linkage gap not already closed by the
      installed system or procedure, or stop the standalone product thesis.
    owner: Product founder and functional-safety reviewer
  - horizon: 3–6 months
    experiment: >-
      Sell and run one paid shadow-mode pilot around a scheduled change; measure before/after evidence
      assembly and have the plant reviewer sign the disposition.
    hypothesis: >-
      A plant engineering or process-safety director will pay to test time and completeness improvements
      without transferring safety authority.
    successMetric: >-
      Signed paid pilot, at least 30% lower median evidence-assembly time, at least 90% first-pass
      completeness, and no unauthorized controller access.
    owner: Founder-led GTM and founding engineer
  - horizon: 6–12 months
    experiment: >-
      Repeat the deployment at a second operator using the same SIS family and seek one referral from a
      functional-safety consultant or SIS integrator.
    hypothesis: >-
      The source mapping and reviewer checklist are reusable and a trusted partner can introduce a
      qualified buyer without making services the entire product.
    successMetric: >-
      Second paid pilot; at least half of mapping work reused; implementation hours and partner-sourced
      pipeline recorded; no unverified reseller assumption.
    owner: Implementation lead and founder
  - horizon: 12–18 months
    experiment: >-
      Offer annual site capacity to the first pilot customers only after observing repeat packet demand;
      test per-packet and capacity pricing with each budget owner.
    hypothesis: >-
      Recurring change volume and customer-perceived value support a predictable annual contract rather
      than a one-off engineering service.
    successMetric: >-
      At least one signed repeat or annual-capacity contract and a documented path to greater than 70%
      gross margin on repeat delivery; otherwise retain per-packet scope or stop subscription development.
    owner: Founder and finance lead
operations:
  - >-
    Start from customer-controlled exports in an approved security boundary; document data flow and access
    before deployment. NIST OT guidance emphasizes safety, reliability, and performance constraints,
    and OPC UA security features do not create a universal SIS export schema (research sources 11 and 15).
  - >-
    Preserve source identifiers, revision timestamps, reviewer identity, disposition, and audit history;
    fail closed on stale or missing evidence and keep controller writes out of product scope.
  - >-
    Use a qualified functional-safety reviewer to validate checklists and sign-off language; the operator
    retains safety duties. Do not claim IEC 61511 certification or clause-level conformity because the
    standard text was not directly reviewed in the research.
  - >-
    Test functional-safety consultancies, SIS/DCS integrators, and MOC vendors as implementation or
    referral partners; validate data access and partner terms before promising integrations.
team:
  - role: Founding engineer
    startTiming: Month 0
    rationale: >-
      Build one read-only export path, provenance model, fail-closed checks, and auditable reviewer flow;
      current Indurex team size and available engineering capacity are undisclosed.
  - role: Founder, industrial GTM
    startTiming: Month 0
    rationale: >-
      Run record-based discovery, identify the actual budget owner, and sell scoped pilots around scheduled
      changes before adding a sales team; no buyer or sales-cycle evidence is verified.
  - role: Fractional functional-safety lead
    startTiming: Month 0
    rationale: >-
      Validate safety-function mapping, evidence checklist, human sign-off boundary, and acceptance
      language; consultant or reviewer partnerships are not yet verified.
  - role: Implementation engineer
    startTiming: Month 6, gated on a paid pilot and approved export
    rationale: >-
      Reduce repeat-site onboarding effort and harden the first parser only after customer access and
      paid use demonstrate need; site-specific integration is a researched high-severity risk.
milestones:
  - horizon: 0–12 months
    items:
      - Complete five-record workflow and incumbent comparison across three target sites by day 90.
      - Validate one approved read-only SIS-family export and one reviewer-accepted shadow packet.
      - Secure two paid scoped pilots across two operators and measure time savings, completeness, and delivery labor.
      - Decide whether the packet is incremental to ProofCheck/MOC and whether recurring price is plausible before adding connectors.
  - horizon: 12–24 months
    items:
      - Convert at least one pilot to repeat packet volume or annual site capacity by month 18.
      - Reuse at least half of first-site mapping work on the second deployment before adding another SIS family.
      - Support no more than two or three SIS families unless paid demand justifies each integration.
      - Demonstrate a path to greater than 70% gross margin on repeat delivery or retain explicit service economics.
  - horizon: 24–36 months
    items:
      - Expand across additional units and operators only after repeat contracts and accepted evidence packets.
      - Target a multi-site, partner-assisted motion with three validated SIS-family mappings, gated on paid site demand.
      - Reassess the 50-site SOM scenario against observed site fit, annual change frequency, realized price, and procurement conversion.
risks:
  - risk: >-
      Existing tools may already satisfy the proposed packet need. Proconex ProofCheck captures SIS test
      evidence and return-to-operation records, and MOC/lifecycle tools cover approvals and audit trails
      (research sources 19, 20, and 22).
    likelihood: High
    impact: High
    mitigation: >-
      Compare actual site records with incumbent outputs before product build; stop if four of five sampled
      changes already have an accepted exact-revision evidence packet.
  - risk: >-
      SIS export formats, revision identifiers, and access approvals vary by vendor and site; research
      found no universal read-only configuration interface (sources 15, 19, 20, and 21).
    likelihood: High
    impact: High
    mitigation: >-
      Support one customer-approved SIS family and fail closed on incomplete mapping; require the second
      deployment to reuse at least half of the first mapping before adding connectors.
  - risk: >-
      The packet could be misread as an automated safety determination or guarantee, increasing liability
      in a safety-critical workflow (HSE sources 5–7 and NIST source 11).
    likelihood: Medium
    impact: High
    mitigation: >-
      Require named qualified human disposition, describe outputs as evidence completeness and provenance,
      prohibit controller writes, and obtain plant legal and safety-assurance review before operational use.
  - risk: >-
      Budget ownership and willingness to pay are unknown, while ProofCheck and MOC products are established
      alternatives and procurement can involve engineering, safety, OT security, and site IT (research
      sources 2, 17, 19, and 22).
    likelihood: High
    impact: High
    mitigation: >-
      Name the economic buyer and displacing budget before integration; require a paid pilot around a
      scheduled change and defer annual subscription until repeat demand is demonstrated.
  - risk: >-
      The serviceable market may be smaller than the Seveso upper bound, and Cefic reports weak demand,
      energy-cost pressure, import pressure, and below-pre-crisis capacity use in European chemicals
      (research sources 8 and 9).
    likelihood: Medium
    impact: High
    mitigation: >-
      Validate SIS fit, annual change frequency, and spend at target sites; do not scale against the
      €82.5M SAM or €1.5M SOM scenarios until their assumed fit rate and price are replaced with buyer data.
fundingAsk:
  round: seed
  targetFundingRangeUsd: "$2–4M planning band; not a reported Indurex financing need"
  runwayMonths: 18
  useOfFundsSummary: >-
    A planning case for 18 months to validate one SIS-family export, build the non-actuating evidence
    packet and audit trail, run two to three paid pilots, complete safety and OT-security review, and test
    repeat delivery and annual pricing. Keep hiring and connector expansion gated on paid demand. Indurex
    disclosed a €7M round, but its round type, use of proceeds, current cash, and remaining runway are
    unknown; confirm that a separate seed ask is needed before fundraising.
