headcountBasis:
  assumptionRefs:
    - A6
  description: "年化薪酬 = 季度快照 FTE × 每 FTE $135K 全成本薪酬；salaryK 是当期实际薪酬，计入 opexK。部分工时功能安全审查由外部签约，不计入 FTE。"
revenueModel:
  assumptionRefs:
    - A2
    - A3
    - A4
  customerDefinition: "customersEop 表示模型预期的活跃付费站点当量，因此应用月流失率后可以是小数；newCustomers 表示新增付费站点总数。试点转为容量合同只改变合同类型，不改变客户数。"
  formula: "按月或按季度计算，revenueK =（customersBop 与 customersEop 的平均值）× 年化 ARPU ÷ 12 或 4。按期中值分摊新增站点在当期贡献的收入；月度或季度流失率作用于期初付费站点当量。"
  exclusion: "模型不假定 Indurex 的任何客户、合同、价格或结果已获核实；这份预测只是一个带阶段门槛的经营假设。"
pnlMethodology:
  assumptionRefs:
    - A5
    - A6
    - A7
    - A12
  description: "cogsK 是按年度适用的收入直接成本比例；grossProfitK = revenueK - cogsK；salaryK 是含雇主成本的员工薪酬；opexK = salaryK + salesMarketingK + researchDevelopmentK + generalAdministrativeK；ebitdaK = grossProfitK - opexK。现金余额按融资流入和 EBITDA 逐期滚动。"
