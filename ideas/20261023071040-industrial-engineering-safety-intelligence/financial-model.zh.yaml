modelDiagram:
  title: "单位经济模型流程"
  mermaid: |
    flowchart LR
      Buyer["Plant engineering budget owner"] --> Change["Approved SIS change"]
      Evidence["Revision and verification records"] --> Packet["Read-only version-bound evidence packet"]
      Change --> Packet
      Packet --> Reviewer["Qualified human disposition"]
      Reviewer --> Paid["Paid packet or site-capacity contract"]
      Paid --> Revenue["Revenue = active paid sites x annualized ARPU"]
      Revenue --> GrossProfit["Revenue less reviewer and integration COGS"]
      GrossProfit --> Cash["Cash after payroll and operating spend"]
modelSanity:
  - checkName: "收入引擎"
    finding: "到 M12，基准情景累计新增两个付费试点；到 M36，累计新增八个付费站点。按 $30K 年化 ARPU 计算，计入模型流失后，Y3 收入约 $135.9K。"
  - checkName: "必须满足的条件"
    finding: "截至 M18，至少一个试点须转为持续的站点容量收入，重复交付须维持 72% 毛利率；否则，1.19x LTV/CAC 和 30.2 个月的 CAC 回本周期不足以支撑扩张。"
  - checkName: "失效条件"
    finding: "若 ARPU 下调 20%，且 Y3 少新增两个站点，Y3 收入将降至 $75.7K、现金低点降至 $680.2K；固定招聘和交付支出仍会继续。"
  - checkName: "下一轮融资验证门槛"
    finding: "到第 18 至第 24 个月的验证关口，后续融资还要求拿下两个付费试点、至少一个转为持续容量付费、验证第二站点映射复用，且重复交付毛利率超过 70%。"
sanityChecks:
  ruleOf40: "当前规模下，该指标不具参考意义：Y3 收入增长率 101.1% + EBITDA 利润率 -889.4% = -788.3%；小收入基数和验证期薪酬主导了结果。"
  burnMultiple: "Y3 EBITDA 消耗额 / 新增净 ARR 的现金消耗倍数为 15.3x：$1,208.4K 消耗额除以约 $79.2K 新增净 ARR；新增净 ARR 按预期活跃站点当量变化计算，未计营运资金和资本支出。"
  revenuePerFte: "Y3 平均 5.75 FTE 对应的人均收入为 $23.6K；未使用外部基准，含雇主成本薪酬假设为 $135K/FTE/year。"
  flags:
    - "没有经过验证的具名买方、付费合同、定价、流失率或客户结果；$30K ARPU 是市场规模假设中的数量级代理值，不是付费意愿证据。"
    - "三年 EBITDA 均为负；Y3 EBITDA 为 -$1.21M，机械套用的 Rule of 40 结果不能作为有意义的规模指标。"
    - "LTV/CAC 仅为 1.19x，CAC 回本周期为 30.2 个月，而假设客户生命周期为 36 个月；集成超支或流失率上升几乎没有缓冲空间。"
    - "Y3 毛利率 72% 仍是目标，依赖重复部署时复用交付；第二站点复用门槛和付费复购量都尚未得到验证。"
    - "基准情景现金到 M36 降至 $733.7K；模型未计后续融资、营运资金、税费、资本支出或债务，因此销售变慢或成本超支都会压缩现金跑道。"
    - "Y3 每 FTE 收入为 $23.6K，远低于 $135K 的全成本薪酬假设；这反映的是验证阶段的团队投入，不是规模化后的收入运行水平。"
    - "customersEop 的小数表示按月流失率 2.78% 这一经验假设测算的预期活跃站点当量，不代表现实中存在小数个工厂客户，也不是已观察到的留存率。"
