slug: safety-change-release-proof
date: "2026-10-23"
currency: USD
modelStartMonth: "2026-10"
assumptions:
  - id: A0
    name: "模型周期"
    value: "36 个月，Oct 2026 至 Sep 2029"
    unit: "自然月"
    source: "[business-plan.yaml 的日期与要求的三年财务模型格式；M1-M12 对应 Oct 2026-Sep 2027，之后按八个季度列示至 Sep 2029]"
  - id: A1
    name: "种子轮资金与规划现金跑道"
    value: "M1 到账 $3.75M 种子轮资金；18 个月验证计划加 6 个月缓冲，规划现金跑道共 24 个月"
    unit: "USD 百万元和月"
    source: "[business-plan.yaml 的 fundingAsk 和 operatingAssumptions：规划资金区间为 $2-4M，验证计划为 18 个月；模型在这个未经验证的区间内选取 $3.75M，并加入要求的六个月缓冲；未假设 Indurex 目前持有现金或已获得融资]"
  - id: A2
    name: "付费站点新增节奏"
    value: "M6 新增 1 个付费试点，M11 再新增 1 个，Q2Y2 新增 1 个，Q4Y2 新增 1 个；Y3 每季度新增 1 个，到 M36 累计新增 8 个。到 M18 时，Y1 的一个试点转为站点容量合同，但不计作新客户。"
    unit: "新增付费站点总数"
    source: "[business-plan.yaml 的 gtm.funnelTargets、product.sixMonth、product.twelveMonth、milestones 和 experimentRoadmap：截至 M6 拿下一个付费试点、截至 M12 拿下两个试点，且至少 50% 的试点在 M18 前转为年度容量合同，均属目标而非已观察到的需求；后续新增采用建模者设定的保守爬坡假设]"
  - id: A3
    name: "活跃付费站点年化收入"
    value: "每站点年收入 $30.0K，即每站点月收入 $2.5K；收入由试点、证据包和容量合同混合构成，不另收导入费"
    unit: "每个付费站点年度收入（USD 千元）"
    source: "[business-plan.yaml 的 gtm.pricing 和 businessModel.unitOfValue：固定导入费与按证据包计费结合，只有客户重复使用后才提供站点容量；research.yaml 的 market.tam/sam/som 仅在市场测算中采用假设性的 €30,000 年度站点当量价值。模型中的 USD $30K 是独立采用的数量级规划代理值，并非货币换算、报价或付费意愿证据]"
  - id: A4
    name: "流失率与客户生命周期代理值"
    value: "平均客户生命周期按 36 个月估算；月流失率为 2.7778%，按 1/36 计算"
    unit: "月和月流失率百分比"
    source: "[business-plan.yaml 的 investorMemo 和 research.yaml 的 openQuestions：目前没有留存率或合同期限证据；36 个月及其倒数月流失率是明确采用的初创公司财务规划经验值。小数 customersEop 表示预期活跃付费站点当量；newCustomers 表示新增付费站点总数]"
  - id: A5
    name: "直接交付成本与毛利率"
    value: "COGS 占收入的比例：Y1 为 45%、Y2 为 40%、Y3 为 28%，对应毛利率分别为 55%、60% 和 72%"
    unit: "收入占比"
    source: "[business-plan.yaml 的 businessModel.targetGrossMarginPct 和 product.twentyFourMonth：毛利率超过 70% 是未来重复交付的目标；早期集成和合格审查会压低软件毛利率。各年度 COGS 比率尚未验证，是针对审查、集成、安全和交付成本的经营规划假设]"
  - id: A6
    name: "招聘节奏与全成本薪酬"
    value: "M1 配置 2 FTE；M7 招聘实施工程师；M10 招聘集成/产品工程师；M19 再招一名实施工程师；M28 再招一名集成/产品工程师。六个季度节点的 FTE 快照依次为 2、2、3、4、5、6。全成本薪酬为 $135K/FTE/year。"
    unit: "FTE 和 USD 千元/每 FTE 年"
    source: "[business-plan.yaml 的 team 和 strategicChoices.sequencingRationale：创始人从 M0 开始；实施岗位须等拿下付费试点后才招聘，专职销售和连接器开发则延后到客户重复使用后；后续工程招聘均为设有阶段门槛的模型假设。$135K 全成本薪酬是初创公司财务规划经验值，并非有来源支持的薪酬报价。功能安全审查按部分工时签约，不计入 FTE，但计入 COGS]"
  - id: A7
    name: "非工资运营费用"
    value: "Y1 月度 S&M（$K）：4,4,4,6,6,6,8,8,8,10,10,10；R&D：15,15,15,18,18,18,20,20,20,25,25,25；G&A：8,8,8,10,10,10,12,12,12,14,14,14。Y2 每季度 S&M/R&D/G&A（$K）：25/35/25、30/40/30、35/45/35、40/50/40。Y3 每季度：35/45/30、40/50/35、45/55/40、50/60/45。"
    unit: "Y1 按月、Y2-Y3 按季度，单位为 USD 千元"
    source: "[business-plan.yaml 的 product、operations、gtm.channels、team 和 experimentRoadmap：支出用于计划中的工程验证、安全站点导入、创始人主导的差旅、法务与安全工作及合作伙伴测试；支出节奏是初创公司财务规划估算，并非供应商报价]"
  - id: A8
    name: "全成本客户获取成本"
    value: "Y3 CAC =（Y3 非工资 S&M $170K + 创始人/GTM 全成本薪酬 $135K 的 35%）/ Y3 新增付费站点总数 4 个 = 每个新增付费站点 $54.3125K"
    unit: "每个新增付费站点的 CAC（USD 千元）"
    source: "[business-plan.yaml 的 gtm.channels 和 sequencingRationale：创始人继续主导销售，且不计划招聘专职销售；创始人 35% 的时间投入和 A2 中 Y3 新增四个站点均为模型假设。CAC 按损益表支出分摊，不构成额外费用]"
  - id: A9
    name: "综合情景假设"
    value: "下行情景采用 $24K 年化 ARPU，且 Y3 只新增两个付费站点，分别在 Q3Y3 和 Q4Y3；上行情景采用 $36K ARPU，Y3 共新增六个付费站点，其中 Q1Y3、Q2Y3 各新增一个，Q3Y3、Q4Y3 各新增两个。基准情景沿用 A2-A3。"
    unit: "每站点年收入（USD 千元）和新增付费站点总数"
    source: "[business-plan.yaml 的 operatingAssumptions、gtm.funnelTargets、top-level risks 和 research.yaml 的 coverageGap：价格和转化率尚未验证。20% 定价冲击及站点新增量冲击是明确列出的初创公司财务压力测试假设，并非研究所得预测]"
  - id: A10
    name: "敏感性冲击设定"
    value: "单变量情景：整个预测期 ARPU 上下浮动 20%；Y3 站点新增数减少两个或增加两个；月流失率上下浮动 1 个百分点；Y3 毛利率上下浮动 10 个百分点；CAC 上下浮动 25%；第六个 FTE 提前或延后一个季度入职。额外新增的 Y3 站点假设现有预算可以承接。"
    unit: "百分比、百分点、站点新增数和季度"
    source: "[business-plan.yaml 的 topRisks、strategicChoices.sequencingRationale、milestones 和 operatingAssumptions 指出了定价、销售周期、留存、集成成本及招聘风险；冲击幅度和预算承载假设由建模者设定，用于压力测试]"
  - id: A11
    name: "资金分配与六个月储备"
    value: "$1.875M 工程（50%）；$562.5K GTM（15%）；$562.5K G&A（15%）；$750K 六个月缓冲（20%）；合计 $3.75M"
    unit: "USD 及种子轮占比"
    source: "[business-plan.yaml 的 fundingAsk.useOfFundsSummary 和 operatingAssumptions：资金用于分阶段工程开发、两到三个付费试点、安全/OT 审查及六个月缓冲；这份资金分配是建模者的规划判断，并非已批准预算]"
  - id: A12
    name: "现金与会计口径"
    value: "期初现金为 $0；$3.75M 种子轮资金于 M1 到账；期末现金 = 上期期末现金 + 融资流入 + EBITDA。不建模后续融资、税费、营运资金变动、资本支出或偿债支出。"
    unit: "USD 千元及建模口径"
    source: "[business-plan.yaml 的 fundingAsk 和 operatingAssumptions：未披露现有现金或本轮资金用途；模型将 EBITDA 视为经营现金流，并排除未量化的税费、营运资金、资本支出和融资事项]"
