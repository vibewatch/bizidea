championThesisTest:
  declaredDimension: whiteSpace
  verdict: mixed
  evidenceFor:
    - point: 监管方要求正式、可追溯的技术审查和准确的变更记录；Indurex 则称会把工程偏差呈现给人员审查。每次变更都绑定版本并由人员作出处置，构成一笔独立、完整的业务交易，有别于持续告警。
      sourceRefs:
        - 1
        - 4
        - 5
    - point: 审阅过的公开产品介绍并未证明有单一工具能把已批准的变更、确切的 SIS 修订版本、验证证据和合格人员的处置结果，汇入这份可移交的放行证据包。
      sourceRefs:
        - 2
        - 19
        - 20
        - 22
  evidenceAgainst:
    - point: ProofCheck 是一个高度相邻的产品：它采集电子化 SIS 验证与证明测试数据，核验其支持系统的安全逻辑 CRCs，并记录设备安全恢复运行的准备情况。因此，拟议的放行环节并非无人涉足。
      sourceRefs:
        - 19
    - point: SIS 生命周期软件已支持安全要求、测试、生命周期文档和数据交换；通用变更管理产品也已提供审批、风险审查、检查清单和可审计记录。
      sourceRefs:
        - 2
        - 20
        - 21
        - 22
    - point: Indurex 目前也在推广跨系统的工程、安全与网络安全智能层，并称会标出工程偏差供人员关注；但其所称客户和成果仍未具名，也未经核实。
      sourceRefs:
        - 1
        - 4
        - 18
  revisedClaim: >-
    可信的空白市场主张比最初版本更窄：厂商中立、只读的证据包，把一项已批准的 SIS 变更与受影响安全功能的确切修订版本、验证证据及合格人员的处置结果绑定起来；它或许能与监控、生命周期计算、通用 MOC
    和定期证明测试工具区分开。现有产品已有明显重叠。在买方工作流对比和付费试点证明之前，这笔具体交易的独特性与付费需求仍只是待验证假设。
reportMemo:
  executiveTakeaways:
    - 安全相关变更审查是现实且有程序依据的需求：HSE 指南要求遵循正式程序、开展可追溯的技术审查、由胜任人员授权、完成测试并准确记录。这证明了证据留存义务存在，却没有量化文书负担。
    - >-
      拟议机制并非全新。Proconex ProofCheck 已能采集 SIS 测试与验证证据、核验部分逻辑 CRCs，并支持安全恢复运行；exida、Kenexis、Siemens 和通用 MOC
      产品也覆盖相邻的生命周期或审批流程。
    - >-
      欧洲市场规模足以开展验证，但还不能证明具备风险投资级规模：EU 报告称有超过 11,000 个 Seveso 装置，但其中配备 SIS
      的比例、相关年度变更频次以及单站支出均未知。以下自下而上的测算值是基于假设推算的市场空间上限，并非实测需求。
    - 预算证据只是间接信号。SANS 报告称 ICS/OT 网络安全预算在增长，但这个概念属于工艺安全工程工作流，不是 OT 安全控制；没有来源证实谁拥有预算、是否有付费试点，或每次变更的放行证据包能卖多少钱。
    - 最站得住脚的主张，是从一个狭窄的集成与证据溯源切口切入。它既要实测缩短结案时间，也要证明现有 SIS/MOC 系统还不能生成可接受的记录。
  marketDefinition: >-
    这类软件与实施服务会在安全仪表功能获批变更后、恢复运行前，汇集并留存相关证据。滩头市场限定为欧洲一家流程工业或能源站点、一个 SIS 系列和一项计划内改造；不包括通用 OT 异常监控、SIS
    硬件、自动安全决策，也不打算全面替换企业级 MOC 系统。
  customerAndBuyer: >-
    日常用户是 SIS/功能安全工程师和 MOC 协调员；可能的预算决策人是装置工程或工艺安全负责人。OT 安全、站点 IT、采购以及法务/安全保证团队都可能阻止部署。Evonik 公开招聘的 SIS
    工程岗位列有生命周期管理、定期测试、验证和改造职责，但该岗位在美国（US），不能证明欧洲滩头市场的买方及其采购权限。
  buyingTriggers:
    - point: 计划中的 SIS 改造或投运前审查，提供了一个明确时点：在重启前核实功能变更、所需测试证据、授权和记录归档。
      sourceRefs:
        - 5
        - 7
        - 14
    - point: 审计发现、逾期行动项，或工程与运营记录无法对账，都会让记录完整性和可追溯性变得更紧迫；目前没有来源量化这些触发因素的出现频率。
      sourceRefs:
        - 5
        - 8
    - point: 已经使用电子化证明测试或 SIS 生命周期软件的工厂，只有在新证据包能补上这些工具确实留下的缺口、而非重复现有流程时，才可能考虑采用。
      sourceRefs:
        - 19
        - 20
        - 21
  willingnessToPay:
    summary: >-
      拟议证据包的付费意愿尚未得到验证。exida 将 exSILentia v4 Online 标价 $4,260，说明相邻的 SIS 生命周期工具已在商业销售；SANS 则发现，55% 的受访组织称其
      ICS/OT 安全预算在两年内增长。但这两项都不是绑定版本的安全变更结案服务的价格基准，也不能证明其预算来源。相近替代品大多需要询价，且尚无公开客户合同得到核实。
    sourceRefs:
      - 2
      - 17
  competitiveLandscape: >-
    竞品涵盖多类方案：高度相邻的 SIS 测试替代品 Proconex ProofCheck；SIS 生命周期计算与文档工具 exida、Kenexis、Siemens；通用 MOC 工作流系统
    IsoMetrix；跨系统工业工程智能产品 Indurex；以及依靠工厂工程师、集成商、电子表格、测试表和交接记录运转的内部流程。ProofCheck
    是最接近的证据处理类比产品，但没有经审阅的来源证明它已经在销售这款从变更到放行的完整证据包。
  incumbentThesis:
    - incumbentClass: SIS 证明测试与验证产品
      point: 这些产品已经能采集测试证据、报告、设备响应和恢复运行检查结果。新产品不能只靠把安全证据数字化取胜；它必须证明，即使使用了这些工具，变更授权和确切版本溯源仍然分散。
      sourceRefs:
        - 19
        - 2
    - incumbentClass: SIS 生命周期工程工具
      point: 这类工具负责计算、SRS、生命周期文档和安全系统工作流；但它们未必会成为这份证据包的默认工具，因为引用页面强调生命周期设计与测试，而非跨记录的变更结案。这只是对产品范围的观察，并不能证明它们没有集成能力。
      sourceRefs:
        - 2
        - 20
        - 21
    - incumbentClass: 通用变更管理（MOC）与 EHS 平台
      point: 通用 MOC 软件已能流转审批、风险评估、检查清单和可审计的变更记录，因此足以处理大部分行政工作。尚待验证的假设是：若不做定制，它就无法理解 SIS 系列特有的版本和验证语义。
      sourceRefs:
        - 22
        - 5
    - incumbentClass: OT 监控与工程智能平台
      point: Indurex 公开材料强调跨领域可视性和人员审查偏差，并未描述这笔具体的放行交易。它已获得融资，是定位有利的相邻现有厂商；因此，它既可能成为渠道伙伴，也可能成为产品竞争者，不能排除任一可能。
      sourceRefs:
        - 1
        - 4
        - 18
    - incumbentClass: 内部工程团队与 SIS 集成商
      point: 具备资质的工厂员工本就负责审批和现场验证，也能借助受控程序、测试表和现有工程系统整理记录。他们掌握信任和决策权；新厂商必须在不夺走这份控制权的前提下，证明能显著节省时间或提高记录完整度。
      sourceRefs:
        - 5
        - 14
        - 19
  regulatoryLandscape: >-
    Seveso III 覆盖 EU 超过 11,000 个工业装置，并以风险为基础要求预防和减轻重大事故。UK HSE 的 COMAH 指南负责在 UK 落实 Seveso
    III，介绍了装置变更的正式管理、可追溯审查、胜任人员授权、测试和准确记录要求。这些要求说明相关文档确有必要，但并未强制使用这款软件或由厂商生成放行证据包。产品和监管材料都引用 IEC
    61511；本次研究无法直接查阅标准原文，因此不作条款级合规主张。安全签署仍由运营方负责。
  technologyLandscape: >-
    只读导出从技术上看有实现可能：OPC UA 支持权限控制和安全机制；NIST 强调 OT 受安全性、可靠性和性能要求约束；ProofCheck 则展示了如何结构化采集 HART、OPC 变量、人工检查及部分 SIS
    CRCs 证据。但这些都不能证明存在通用的 SIS 配置只读接口。每次部署可能都需要客户批准导出、映射源系统标识、处理配置版本，并安全地关联运营方的 MOC
    和测试记录。缺少证据或证据过期时，系统必须默认不放行；不得把软件检查说成安全判定。
  distributionChannels:
    - point: 围绕计划内 SIS 改造开展直接触达，是可验证的滩头市场打法：触发时点明确，而且与现有工程审查直接相关。
      sourceRefs:
        - 5
        - 14
    - point: 功能安全咨询公司和 SIS 集成商可能成为可信的实施与转介渠道，但目前未核实任何合作或经销协议。
      sourceRefs:
        - 3
        - 20
        - 19
    - point: 现有 SIS 和 MOC 厂商可能会捆绑集成或证据工作流；它们已有的装机基础和扩展现有产品的能力，让独立销售渠道前景不明。
      sourceRefs:
        - 19
        - 21
        - 22
  partnershipEcosystem:
    - point:     功能安全顾问能提供具备资质的审查人员、协助核验证据清单，同时把最终处置权留给运营方。
      sourceRefs:
        - 3
        - 20
    - point: SIS/DCS 集成商和生命周期软件厂商可能帮助客户实现自主导出与配置映射；本产品对接证明测试系统时应保持只读。
      sourceRefs:
        - 19
        - 20
        - 21
    - point: MOC/EHS 平台厂商既可能成为集成伙伴，也可能成为替代品；其工作流 APIs、客户重合度和合作意愿均未知。
      sourceRefs:
        - 22
  dataMoats:
    - point: >-
        可能形成护城河的资产，是经过验证的映射关系：把同一站点多次变更中的变更标识、SIS 版本标识、安全功能
        IDs、验证证据和审查人处置结果连起来。目前未核实数据网络效应或专有数据权利；站点对数据的所有权及导出限制，可能让数据无法跨运营方复用。
      sourceRefs:
        - 5
        - 19
        - 20
    - point: 可重复使用的厂商专属解析器和经过测试的溯源规则，可能逐步降低客户导入成本；但构想中提到的站点间导出差异，首先是交付成本风险，还谈不上护城河。
      sourceRefs:
        - 19
        - 20
        - 21
  geographicConsiderations:
    - point: EU Seveso 装置数量构成相关的市场上限；但不同国家、站点和运营方的 SIS 使用情况与软件采购各不相同，现有证据没有逐一统计。
      sourceRefs:
        - 8
    - point: UK HSE/COMAH 指南能为工艺安全提供参考，但并不等同于每个 EU 成员国的法规转置、检查做法或采购规则。
      sourceRefs:
        - 7
        - 8
    - point: Evonik 的招聘信息只是美国（US）SIS 生命周期岗位配置的例子，不能证明欧洲买方角色、预算或岗位需求与之相同。
      sourceRefs:
        - 14
  sensitivityCases:
    - case: 假设只有 10% 的 Seveso 装置适合作为配备 SIS 的潜在客户，且每站年价值为 €15,000
      impact: 欧洲可服务市场上限将降至每年约 €16.5M；项目很可能需要依靠集成服务收入，或拓展到相邻的非 Seveso 站点，才能达到有意义的规模。
      sourceRefs:
        - 8
    - case: 假设 40% 的 Seveso 装置符合条件，且每站年价值为 €50,000
      impact: 理论上的欧洲市场上限将升至约 €220M，但客户合同并未验证适配比例或支出假设。
      sourceRefs:
        - 8
    - case: 现有 SIS/MOC 工具已能生成完全相同的证据包，或工厂变更频率过低
      impact: 软件带来的增量价值可能归零；这个概念必须证明仍有未解决的例外处理需求，或能大幅缩短结案时间，足以支撑集成费或服务费。
      sourceRefs:
        - 19
        - 20
        - 22
  validationPlan:
    - priority: high
      question: SIS 工程师是否真的要花大量时间，才能把一次变更的审批、配置版本、验证结果和签署记录对齐？
      evidenceToGather: 观察目标欧洲站点至少五份已完成的变更记录；测量对账耗时，统计交接次数和缺失引用，再与现有 SIS/MOC 工具对比。
    - priority: high
      question: 站点能否针对一个 SIS 系列，提供经客户批准的只读配置版本和测试证据导出，而不需要定制控制器连接？
      evidenceToGather: 获取一套脱敏导出数据，把源标识映射到某项安全功能，再请站点的功能安全负责人核验完整性和来源链。
    - priority: high
      question: 装置工程或工艺安全买方是否愿意在现有 SIS、MOC、集成商或证明测试合同之外，单独为这份证据包付费？
      evidenceToGather: 争取一项范围明确的付费试点，并取得预算负责人决定；记录价格锚点、采购路径，以及将被替代的现有厂商预算或服务项目。
    - priority: medium
      question: ProofCheck 或已部署的生命周期/MOC 产品，是否已经能满足目标站点对版本绑定放行证据包的需求？
      evidenceToGather: 将站点的实际工作流和导出数据与拟议证据包逐项对比，包括 CRC/版本控制、变更审批、测试记录、人员处置和审计认可度。
    - priority: medium
      question: 用户能否区分完整性/溯源证据包与“安全功能适合运行”的保证？
      evidenceToGather:       由安全与法务团队审查拟用措辞、签署边界和责任条款，并确认审查人是否接受该输出作为辅助材料，而不以它取代记录在案的判断。
analysisModels:
  marketMapDiagram:
    title: SIS 变更证据图
    mermaid: |
      quadrantChart
        title Specialization and urgency of SIS evidence workflows
        x-axis Low specialization --> High specialization
        y-axis Low urgency --> High urgency
        Proposed startup: [0.88, 0.86]
        SIS ProofCheck: [0.82, 0.78]
        SIS lifecycle tools: [0.68, 0.62]
        Generic MOC software: [0.42, 0.58]
        OT monitoring: [0.38, 0.70]
        Manual plant procedure: [0.25, 0.52]
  fiveForces:
    supplierPower:
      score: 3
      rationale: SIS 厂商和经验丰富的集成商掌握源系统格式与访问权限；OPC UA 提供权限控制机制，但目前未核实通用导出协议。
      sourceRefs:
        - 15
        - 19
        - 21
    buyerPower:
      score: 4
      rationale: 运营方掌握安全审批权，也可以继续使用内部 MOC、工程师和已部署的生命周期工具；相近产品的公开定价很少，买方付费意愿也未获验证。
      sourceRefs:
        - 2
        - 5
        - 22
    threatOfEntrants:
      score: 2
      rationale: 基础工作流并不难搭建，但要取得工厂访问权限、处理 SIS 专属语义、建立合格审查的公信力并通过站点验证，因此可信部署比普通工作流 SaaS 难得多。
      sourceRefs:
        - 5
        - 6
        - 11
    threatOfSubstitutes:
      score: 5
      rationale: 证明测试系统、生命周期工具、通用 MOC、集成服务、现有电子表格或交接文件都能完成部分工作；ProofCheck 已覆盖恢复运行证据。
      sourceRefs:
        - 19
        - 20
        - 22
        - 5
    competitiveRivalry:
      score: 4
      rationale: 成熟 SIS 供应商、生命周期软件专家、MOC 平台和已获融资的工程智能新玩家都与该用例重叠；是否有人直接竞争这款放行证据包仍未确认。
      sourceRefs:
        - 1
        - 2
        - 19
        - 21
        - 22
  pestle:
    - factor: 政治
      impact: positive
      point: EU 重大事故政策与检查持续推动有据可查的事故预防和安全管理，但并不要求使用这款特定软件。
      sourceRefs:
        - 8
        - 7
    - factor: 经济
      impact: negative
      point: 欧洲化工行业面临需求疲软、能源成本压力、进口挤压，产能利用率也低于危机前水平；这些因素可能压缩非必需工具预算。
      sourceRefs:
        - 9
    - factor: 社会
      impact: positive
      point: 安全关键决策仍须由具备资质的人员负责；产品若只梳理证据、不宣称能判定功能安全，更符合这一边界。
      sourceRefs:
        - 5
        - 11
    - factor: 技术
      impact: neutral
      point: 安全且受权限控制的工业数据交换在技术上已可实现，但本地 SIS 导出、版本语义和验证仍需针对具体产品开展集成。
      sourceRefs:
        - 15
        - 19
        - 11
    - factor: 法律
      impact: positive
      point: Seveso/COMAH 制度强化了正式变更管理和安全管理实践；软件不得暗示自身具备认证资质、替代合格审查或授权设备运行。
      sourceRefs:
        - 7
        - 8
    - factor: 环境
      impact: neutral
      point: 预防重大事故有助于保护人员和环境，但没有证据表明这款特定证据包产品带来了可测量的环境成效。
      sourceRefs:
        - 8
        - 5
  adoptionFrictionMatrix:
    - friction: SIS 导出格式和标识因厂商、站点而异
      severity: high
      affectedBuyer: SIS 工程负责人及站点 OT/IT
      mitigation: 先支持一份经客户批准的只读导出和一个 SIS 系列；证据不全或无法映射时就拒收，不要臆造通用连接器。
      sourceRefs:
        - 19
        - 20
        - 21
    - friction: 安全责任风险，或无法明确由谁判定已具备运行条件
      severity: high
      affectedBuyer: 工艺安全负责人、功能安全工程师、法务
      mitigation: 输出仅限来源链和完整性检查，必须由具名合格人员作出处置；绝不写入控制器，也不授权恢复运行。
      sourceRefs:
        - 5
        - 6
        - 11
    - friction: 现有 SIS 证明测试、生命周期或 MOC 软件可能已经够用
      severity: high
      affectedBuyer: 装置工程负责人和 SIS 负责人
      mitigation: 销售前先用站点真实记录对比工作流；证明跨系统关联确有缺口，并能进一步缩短结案时间。
      sourceRefs:
        - 19
        - 20
        - 22
    - friction: OT 安全审查可能否决云端传输或任何控制器写入路径
      severity: high
      affectedBuyer: OT 安全负责人和工厂运营团队
      mitigation: 使用客户自行控制的导出数据或经批准的本地部署边界，记录数据流，并确保产品不触发动作、保持只读。
      sourceRefs:
        - 11
        - 15
        - 16
    - friction: 采购与预算权分散在工程、安全和 OT 安全团队之间
      severity: medium
      affectedBuyer: 装置负责人、采购、IT/OT 安全
      mitigation: 让试点绑定一项计划内改造，并在集成前找到负有责任的预算负责人；SANS 调查中的预算分配结果不能证明工艺安全预算存在。
      sourceRefs:
        - 17
        - 14
    - friction: 验证周期和变更窗口较长，拖慢评估
      severity: medium
      affectedBuyer: SIS 工程师和站点项目经理
      mitigation: 在下一次实际改造前，先用已完成的历史变更进行影子模式评估；若要用于实际运营，再取得客户批准。
      sourceRefs:
        - 5
        - 7
market:
  tam:
    value: €330M 年度支出上限
    rationale: >-
      EU 自下而上的市场上限：超过 11,000 个 Seveso 装置 [8]，乘以假设的每站每年 €30,000 软件等值支出。这不是市场报告统计的品类支出，也包含可能没有 SIS
      或相关变更量不足的站点；它只是欧洲受监管站点总盘子的上限，不是经过验证的预测，也不是定价建议。
    isEstimate: true
    sourceRefs:
      - 8
  sam:
    value: €82.5M 年度支出上限
    rationale: >-
      按运营方假设，EU 11,000 多个 Seveso 装置中有 25% 配备 SIS、存在持续工程变更且数字化程度足够，共 2,750 个站点；再乘以同样假设的每站每年 €30,000 等值支出。25%
      的适配比例和支出均未获验证，应以国家/站点数量和买方访谈数据替代。
    isEstimate: true
    sourceRefs:
      - 8
  som:
    value: €1.5M 年度支出上限
    rationale: >-
      假设欧洲有 50 个付费站点，约占假设中 2,750 个 SAM 站点的 1.8%，再乘以每站每年 €30,000
      等值支出。这只是按算术推演的触达情景，不是销售预测；付费需求、销售周期和服务毛利均未得到验证。
    isEstimate: true
    sourceRefs:
      - 8
bottomUpSizingDrivers:
  - driver: EU Seveso 工业装置：宽口径市场上限
    value: 超过 11,000 个装置
    source: '[8]'
  - driver: SIS/变更工作流适配比例
    value: 假设为 25%，对应约 2,750 个可服务站点
    source: 估算
  - driver: 每个适配站点的年度软件等值价值
    value: 仅用于测算，假设为 €30,000；没有证据证明客户愿为该产品付费
    source: 估算
  - driver: SOM 情景下可触达的付费站点
    value: 50 个站点，约占假设 SAM 的 1.8%
    source: 估算
categoryDynamics:
  growthRate: null
  growthRateSourceRefs: []
  tailwinds:
    - point: EU 政策覆盖超过 11,000 个工业装置；报告显示，2019-2022 年平均每年发生的重大工业事故少于 22 起，持续强化了事故预防和安全保证的关注度。
      sourceRefs:
        - 8
    - point: SANS 的 2025 年 ICS/OT 调查显示，22% 的组织遭遇过安全事件，其中 40% 的事件造成运营中断。这说明运营韧性具有普遍重要性，却不能证明市场需要拟议的证据包。
      sourceRefs:
        - 10
    - point: SANS 另一项预算调查显示，55% 的受访者称过去两年 ICS/OT 安全预算有所增长；但预算归属分散，而且这不是安全工程支出。
      sourceRefs:
        - 17
  headwinds:
    - point: 欧洲化工企业称需求疲软、能源价格高企、进口压力加大，产能利用率也低于危机前水平；这些因素都可能推迟非必需软件项目。
      sourceRefs:
        - 9
    - point: 最相关的替代产品已经在销售证明测试、生命周期和 MOC 功能；但具体产品定价及客户切换证据大多未公开。
      sourceRefs:
        - 2
        - 19
        - 20
        - 22
competitors:
  - name: Proconex SIS ProofCheck
    stage: 成熟工业软件/产品线
    wedge: 电子化 SIS 验证和证明测试程序；采集现场及人工证据、核验测试标准、检查部分 SIS 逻辑 CRCs，并生成安全恢复运行的记录。
    pricing: 已抓取的产品页面显示需询价；没有公开价格。
    strength: 功能重叠度最高：在现有 SIS 测试场景中实时采集证据、开展验证、生成审计报告并支持恢复运行流程。
    weaknessVsUs: 公开材料强调验证和定期证明测试，而非把获批变更、确切配置版本和人员处置绑定起来的厂商中立证据包。这只是从现有文档中观察到的缺口，并不能证明产品无法扩展。
    sourceRefs:
      - 19
  - name: exida exSILentia
    stage: 成熟专业厂商
    wedge: 模块化 SIS 生命周期与工艺安全工程工具，涵盖分析、SIL 验证、证明测试开发和运营模块。
    pricing: exSILentia v4 Online 标价 $4,260；套餐、期限和适用范围仍需确认。
    strength: 其垂直领域生命周期功能、安全工程工作流和公开购买渠道，为部分文档与测试规划需求提供了可信替代方案。
    weaknessVsUs: 已抓取的介绍聚焦生命周期模块与工程分析，并未涉及单次现场变更获批后、由事件触发并关联多份记录的放行证据包。
    sourceRefs:
      - 2
  - name: Kenexis SIS
    stage: 专业工程软件厂商
    wedge: SIL 验证、SRS 与因果关系文档、结构化 SIF 数据、CSV 导入/导出，以及可选的 API 集成。
    pricing: 已抓取页面未公开订阅价格；页面称 API 需单独购买。
    strength: 结构化安全数据和灵活导出直接解决生命周期数据流转问题，使其成为可能的现有厂商集成对象或替代方案。
    weaknessVsUs: 公开功能介绍强调验证、SRS 和数据访问，而非变更授权以及经签署、与版本绑定的恢复运行证据包。
    sourceRefs:
      - 20
  - name: IsoMetrix Management of Change
    stage: 成熟 EHS/风险管理软件厂商
    wedge: 可配置的企业级工作流，涵盖变更申请、风险评估、审批、行动项、检查清单和审计追踪。
    pricing: 需询价；没有公开价格。
    strength: 它已经可以承载审批与治理记录，因此是强有力的工作流替代品，也可能成为买方的集成入口。
    weaknessVsUs: 其公开页面介绍的是通用 MOC，而非 SIS 系列配置版本和测试证据语义；定制配置可能缩小这一差距。
    sourceRefs:
      - 22
  - name: Indurex SafeGuard AI
    stage: 早期融资公司；2026 年十月披露融资 €7M
    wedge: 跨系统工程智能产品，接入 DCS、SIS、历史数据库、告警和安全数据，并呈现工程偏差供人员关注。
    pricing: 未公开。
    strength: 战略位置最接近：该公司关注工程与安全信号，而非只看网络告警；公司称已拥有早期运营方客户。
    weaknessVsUs: 公开材料描述持续监测、呈现异常和报告，并未涉及每次变更的具体放行交易；客户名称和经独立核实的成果均未披露。
    sourceRefs:
      - 1
      - 4
regulatoryTechnicalConstraints:
  - point: Seveso III 覆盖 EU 超过 11,000 个装置，并建立事故预防/减缓框架；它并不要求使用这款产品、SaaS 记录或特定格式的放行证据包。
    sourceRefs:
      - 8
  - point: UK COMAH/HSE 指南要求采用正式管理程序、开展可追溯的安全与工程审查、由胜任人员授权、按设计意图测试并准确记录变更；运营方仍须对适用义务负责。
    sourceRefs:
      - 5
      - 6
      - 7
  - point: 监管方和厂商材料都引用 IEC 61511，但本次未能直接获取标准原文；不能据此声称符合具体条款或获得认证。
    sourceRefs:
      - 5
      - 19
      - 21
  - point: NIST 指南强调 OT 对安全性、可靠性和性能有独特要求。云连接或自动推断不得损害工厂已批准的流程，也不能被误认为安全操作。
    sourceRefs:
      - 11
  - point: OPC UA 提供权限控制、加密、签名、身份验证和审计功能，但并未统一各厂商的变更记录、SIS 版本、SIF 关联方式或客户导出政策。
    sourceRefs:
      - 15
      - 19
validationSignals:
  - point: HSE 将正式、可追溯且经授权的装置改造审查和变更记录列为良好实践，证明这是一项真实的工作流义务。
    sourceRefs:
      - 5
      - 7
  - point: 一则公开工业岗位招聘明确要求专职 SIS 工程人员负责生命周期管理、定期测试、验证和改造，并掌握 IEC 61508/61511。
    sourceRefs:
      - 14
  - point: 相邻商业产品公开了生命周期、证明测试、变更工作流或产品定价信息，说明买方会采购相关工具，但这份证据包是否有人购买仍尚未得到验证。
    sourceRefs:
      - 2
      - 19
      - 20
      - 22
  - point: Indurex 宣布完成 €7M 融资，并称已有早期客户；但公司公告没有披露客户名称，这些说法也不是付费使用或客户成果的独立证据。
    sourceRefs:
      - 1
openQuestions:
  - 在目标欧洲站点，每年有多少项 SIS 变更需要留存验证和放行证据包？汇集一份证据包要耗费多少人时？
  - 目标 SIS 系列能以只读方式导出哪些配置、版本标识和已批准测试记录？由谁授权访问？
  - 考虑配置、集成和本地程序后，ProofCheck、exida、Kenexis、Siemens 或站点的 MOC 平台是否已经满足从变更到放行的具体要求？
  - 由哪位预算负责人为产品买单？它会挤占哪项现有工具或服务预算？该负责人是否愿意为单份已完成的证据包付费？
  - 怎样界定验收措辞和责任边界，才能让运营方把证据包用作审计记录，同时不把它误解为自动化安全完整性判定？
