slug: safety-change-release-proof
date: '2026-10-23'
executiveSummary: >-
  本计划只验证 Indurex 产品线中的一个窄切口：把一项已批准的 SIS 变更整理成只读、来源可追溯的放行资料包，而不是扩大持续告警范围。Indurex 称 SafeGuard AI 会接入 DCS、SIS、历史数据库、报警管理和 IT 安全数据，标记工程偏差供人工审核；但其融资公告没有披露客户或经独立核实的结果（研究来源 1）。UK HSE（英国健康与安全执行局）的工厂改造指南要求审查过程可追溯、由具备资质的人员授权、完成测试并准确记录变更；但指南既未要求使用这类软件，也没有量化文书负担（来源 5）。首批客户应是欧洲能源或流程工业厂区，配有 SIS 工程师且有已排期的改造；最可能的预算负责人是工厂工程或工艺安全部门，但尚未核实。产品将针对一个 SIS 家族，把客户批准的只读记录映射到准确的变更及安全功能版本，处置和恢复运行授权仍由具备资质的操作人员掌握。欧盟委员会统计的 Seveso 装置超过 11,000 个，但 SIS 适配度、变更频率和付费意愿均未知；下文 €330M TAM、€82.5M SAM、€1.5M SOM 都是基于假设测算的市场空间，并非已验证需求。Proconex ProofCheck 已能留存 SIS 验证和定期验证测试证据，并支持恢复运行记录；生命周期工具、MOC 平台、集成商和厂区工程师也都是重要替代方案（研究来源 19、2、20 和 22）。建议：先观察，直到付费影子模式试点证明产品有增量价值；Indurex 的融资轮次类型、剩余资金跑道、团队规模，以及该工作流的定价均未披露。
problem:
  - >-
    HSE 的工厂改造指南要求制定正式流程、确保技术审查可追溯、由具备资质的人员授权、完成测试并准确记录变更；这些要求证明义务确实存在，却没有量化人工工作量，也没有要求使用供应商提供的资料包（研究来源 5 和 7）。
  - >-
    需要验证的缺口是：在恢复运行前，已批准的变更记录、准确的 SIS 配置版本、验证证据和具备资质人员的处置结论，是否已在各系统间核对一致。研究没有找到衡量耗时的研究，也没有具名客户证明这是重大瓶颈。
  - >-
    ProofCheck 已能记录 SIS 测试证据和恢复运行记录；SIS 生命周期工具及通用 MOC 软件覆盖相邻任务，内部工程师和集成商也已负责可信审查。新产品必须证明跨记录核对存在尚未满足的需求，而不是把现有工作搬到线上（研究竞争分析及来源 19、2、20、21 和 22）。
solution:
  - >-
    针对一项已批准变更、一个安全仪表功能和一个受支持的 SIS 家族，接入客户批准的只读导出数据；将变更编号、准确配置版本、验证记录、相关证据和审核处置结论绑定到同一版本的资料包。发现引用缺失、过期或不一致时，标出待修正项，不推断安全性。
  - >-
    记录具备资质审核人的身份，并导出可追溯的放行资料包，供运营方归档到变更文件。产品不会写入设定值、修改控制器配置、认证合规性、宣称该功能安全，也不会授权设备运行。
whyWeWin:
  - >-
    产品边界是围绕单次变更完成放行，而不是再做一套网络告警或持续监控视图；相较 ProofCheck 和已部署的 MOC/SIS 工作流，差异化有可能成立，但目前仍是假设（研究来源 1、4、19 和 22）。
  - >-
    如果能验证变更编号（IDs）、SIS 版本、安全功能编号、测试证据和人工处置结论之间的对应关系，后续部署可能更快；研究明确指出，各厂区格式不同会带来交付成本风险，在复用得到证明前还谈不上护城河。
  - >-
    Indurex 所称的跨系统数据接入能力或可作为来源映射的起点，但这套能力能否复用于证据资料包、客户是否授权，以及能否降低集成成本，都尚未得到证明（研究来源 1）。
strategicChoices:
  beachhead: >-
    欧洲一处受 Seveso/COMAH 监管的能源或流程制造厂区，限定一个 SIS 家族、一个安全仪表功能，以及一次计划中的改造；流程覆盖到恢复运行前。
  wedgeRationale: >-
    计划内变更能触发一个边界清晰的采购需求，也便于测量基线：从变更获批到证据齐全的审核完成需要多久。只读资料包可以验证 MOC 审批、配置来源和验证证据之间是否存在具体缺口，同时不取代工程师或已安装的监控系统。
  sequencingRationale: >-
    先对照历史记录和现有厂商的输出；再用影子模式验证一份客户批准的导出文件和审核清单；确认范围后销售试点，再增加集成；只有第二次部署复用了映射，才扩展到第二个 SIS 家族并采用年度容量定价。早期销售由创始人主导，并请功能安全审核人员把关，再考虑组建专职销售或连接器团队。接受厂区特定的 SIS 导出格式和审批流程会增加集成工作、需要具备资质的人工审核，因而压低早期软件毛利并拖慢销售；在复用得到测量前，不扩大连接器覆盖范围。
  notYet:
    - >-
      暂不做通用 OT 异常监控、告警分流或全资产仪表盘。
    - >-
      暂不自动判断安全完整性、不写入控制器，也不授权设备重启。
    - >-
      暂不取代企业级 MOC、SIS 生命周期或定期验证测试系统。
    - >-
      在付费使用尚未形成可重复模式前，暂不开发多厂商连接器、不扩展至欧洲以外市场，也不大规模铺开多厂区部署。
market:
  tam: >-
    €330M 年度支出空间：以 EU 内 11,000+ 个 Seveso 装置乘以假设的 €30,000 单厂年价值。这是基于研究形成的上限情景，并非已报告的品类支出；其中也包括 SIS 不适配或相关变更量不足的厂区（欧盟委员会 Seveso 报告；TAM 研究情景）。
  sam: >-
    €82.5M 年度空间：假设适配率为 25%，即 11,000+ 个装置中约有 2,750 个适配，再乘以同一假设的 €30,000 单厂年价值。两个输入都未经验证（SAM 研究情景）。
  som: >-
    €1.5M 年度可触达情景：按 50 个付费厂区、每厂假设年价值 €30,000 计算，约占假设 SAM 的 1.8%。这不是销售预测；客户数、合同金额和转化率都尚未证明（SOM 研究情景）。
  segments:
    - >-
      首要客群：欧洲受 Seveso/COMAH 监管的流程工业和能源厂区，设有内部 SIS 团队，且安全功能变更频繁。
    - >-
      次要客群，待验证后拓展：欧洲其他设有 SIS 团队且经常发生变更的制造和能源厂区；研究尚未量化其数量或可服务价值。
  buyingProcess: >-
    计划中的 SIS 改造或投产前准备审查是采购触发点；SIS 工程师和 MOC 协调人员使用工作流，工厂工程或工艺安全总监可能是经济买家。OT 安全、厂区 IT、采购、法务和安全保障团队都可能阻止部署；实际预算归属、采购周期和采购授权均未知。
product:
  mvp: >-
    接收一个 SIS 家族、一次变更所需的客户批准只读导出文件；把获批变更、受影响的安全功能、准确配置版本和已完成的验证记录整理进审核清单，由审核人签署处置结论。遇到缺失或过期引用时不放行，并导出可追溯资料包，不提供任何控制器写入路径。
  sixMonth: >-
    支持一种已验证的 SIS 导出格式和一种 MOC/变更记录格式；在一个厂区针对历史变更和计划中的变更完成影子模式试点，并测量基线耗时和完整度。除非厂区另行批准，否则不接入生产现场。
  twelveMonth: >-
    目标是在两家运营方完成两个付费试点，并在首个厂区至少再次处理一次变更。将实际资料包与 ProofCheck、生命周期工具和 MOC 的输出进行比较；只有买家愿意为重复使用付费时，才推进年度厂区容量定价。
  twentyFourMonth: >-
    如果试点转化，且第二个厂区复用了第一个厂区的映射，则最多支持两三个 SIS 家族，提供年度厂区容量合同，并将重复交付的毛利率目标设在超过 70%。否则保留单一 SIS 家族、由服务团队辅助的产品形态，或停止扩张。
  keyBets:
    - >-
      目标厂区能够通过获批的只读导出，提供带具体版本信息的证据，无需定制控制器连接。
    - >-
      厂区现有工作流确实存在变更与版本证据之间的缺口，ProofCheck 或 MOC 配置尚未补上这一缺口。
    - >-
      资料包能将证据整理时间至少缩短 30%，并且至少 90% 的资料包首次审核即可通过；这些是试点目标，不是已观察到的结果。
    - >-
      由具备资质的人员作出处置、明确产品边界并取得客户认可，可以回应安全责任顾虑，而不暗示产品已获认证。
gtm:
  wedge: >-
    围绕即将发生的 SIS 改造，销售一个付费、单厂区/单装置/单功能的试点；先针对已完成或计划中的变更运行影子模式，只有买家确认现有工作流尚未覆盖这一需求，才把重复资料包需求转为年度厂区容量合同。
  channels:
    - >-
      由创始人主导直销，在计划改造或投产前窗口到来前，直接联系工厂工程和工艺安全负责人。
    - >-
      验证功能安全咨询公司和 SIS 集成商能否带来转介绍并协助实施；研究确认这些合作方具备可行性，但尚未核实任何已签合作或经销协议。
  funnelTargets: >-
    这是运营目标，不是研究基准：截至第6个月，完成 10 次合格买家交流、5 次记录处理流程评审、2 个范围明确的试点，并拿下 1 个付费试点；到第18个月，付费试点转年度厂区合同的转化率目标至少为 50%。
  pricing: >-
    初期按严格限定的范围收取客户导入固定费用，再按每份已完成的证据资料包收费；按证据处理交易定价，而不是按监控资产数或告警量收费。观察到重复需求后，再提供年度厂区容量方案。没有来源验证这类资料包的定价；€30,000 单厂价值只是市场测算假设，并非报价或付费意愿基准。
businessModel:
  revenueStreams:
    - >-
      固定费用：为一个厂区、一个 SIS 家族配置客户批准的只读数据映射。
    - >-
      初期试点按每次变更收取证据资料包费用。
    - >-
      证明客户重复使用资料包并完成转化后，收取年度厂区容量订阅费。
  unitOfValue: >-
    一份已批准变更对应一个安全仪表功能的完整、可追溯证据资料包，其中包括具备资质人员的处置结论；初期按份计价。
  targetGrossMarginPct: 70
  expansionLevers:
    - >-
      先增加单个装置完成的变更数，再拓展至同一厂区的更多装置。
    - >-
      将已验证的版本和证据映射复用到更多 SIS 家族。
    - >-
      观察到明确的重复需求后，把资料包费用转为年度厂区容量收费。
    - >-
      客户认可且导入流程可重复后，再引入咨询公司或集成商转介交付。
strategyMap:
  northStarMetric: >-
    从 SIS 变更获批到证据齐全的资料包通过具备资质的审核人审核，所需时间的中位数；先建立每个厂区的基线，再宣称有所改善。
  inputMetrics:
    - >-
      首次审核时，变更、功能、版本和验证链接均正确的资料包占比。
    - >-
      为新厂区导出数据建立映射所需的员工工时，以及每份完整资料包所需的审核人员直接工时。
    - >-
      付费试点转重复资料包、付费试点转年度容量合同的转化率。
  moatsToBuild:
    - >-
      针对不同厂商的解析器，以及经过测试的变更编号（IDs）、SIS 版本、安全功能和证据之间的对应关系。
    - >-
      具备资质的厂区审核人员认可的来源追溯规则、缺失时不放行的处理方式和审计记录。
    - >-
      与功能安全咨询公司和 SIS 集成商建立可信的实施合作关系；不假设存在网络效应或专有数据权利。
  killCriteria:
    - >-
      如果在至少三个目标厂区观察五次变更后，员工工时中位数降幅不足 20%，且首次审核完整度没有实质改善，就停止或重新定义这套工作流。
    - >-
      如果抽查的五次变更中，至少四次的现有 ProofCheck/MOC/SIS 工作流已能产出运营方认可、版本准确且验证证据齐全的资料包，就停止独立资料包产品。
    - >-
      截至第12个月，如果还没有从掌握预算的买家处拿下两个付费试点，或第二次部署无法复用第一次至少一半的映射工作，就不要扩充连接器团队。
    - >-
      到第18个月，如果没有试点客户为重复资料包需求付费，就不要开发年度容量定价。
  mermaid: |
    flowchart LR
      Change["Scheduled SIS change"] --> Export["Customer-approved read-only export"]
      Export --> Packet["Version-bound evidence packet"]
      Packet --> Review["Qualified human disposition"]
      Review --> Proof["Traceable release record"]
      Proof --> Repeat["Repeat changes and site capacity"]
      Repeat --> Expand["Additional units and SIS families"]
investorMemo:
  verdict:
    call: 观望
    conviction: >-
      对工作流假设的信心偏低至中等；客户痛点强度、产品差异化和付费意愿仍未验证。
    whyBelieve: >-
      HSE 的变更指南证明可追溯义务确实存在；按次变更生成的资料包，或可把持续监控和通用 MOC 未必能绑定在一起的记录串起来。
    whyDoubt: >-
      ProofCheck 已能留存 SIS 测试证据和恢复运行记录；相邻的 MOC/SIS 工具及内部团队都是强有力的替代方案，也没有证据证明客户愿意付费或产品适配具体厂区。
    nextDiligence: >-
      观察欧洲目标厂区的五次已完成变更，将每份资料包与现有 ProofCheck/MOC 工作流逐一对照，并从具名预算负责人处拿下一个付费影子模式试点。
  firstCustomer:
    title: 欧洲流程工业或能源厂区的 SIS 变更负责人
    profile: >-
      一家受 Seveso/COMAH 监管的欧洲运营方，设有内部 SIS 工程师、已建立 MOC 记录，并有一次计划中的安全功能改造；这是目标客户画像，不是具名客户。
    trigger: >-
      计划中的 SIS 改造或投产前审查，要求在受影响装置恢复运行前备齐证据并由具备资质的人员作出处置（HSE 来源 5 和 7）。
    buyer: >-
      工厂工程或工艺安全总监；预算授权尚未核实。
    initialContract: >-
      目前没有经证据验证的试点方案或 ACV 区间。建议先以固定费用开展一次范围明确的付费试点，限定一个厂区、一个装置、一个功能和一次变更；只有客户重复使用后，才按份收费并提供年度厂区容量方案。
  mustBeTrue:
    - >-
      在三个目标厂区累计至少五次已完成变更中，工作流能把证据齐全审核的员工工时中位数至少缩短 30%，且首次审核完整度不低于 90%。
    - >-
      至少两个目标厂区能够提供一个 SIS 家族经批准的只读配置版本及验证导出文件，无需定制控制器连接。
    - >-
      将 ProofCheck、厂区 SIS 生命周期工具和 MOC 软件都纳入比较后，五次受审变更中仍有至少三次存在尚未满足的版本与证据关联需求。
    - >-
      至少两位工厂工程或工艺安全预算负责人签署范围明确的付费试点，并说明重复使用的预算来源；只有兴趣、没有付费承诺，不算通过。
    - >-
      第二次部署至少复用第一次一半的映射工作；并且至少一个试点在不依赖未定价审核人力的情况下，转为重复资料包用量或年度容量合同。
  diligenceQuestions:
    - >-
      目标厂区采用哪些 SIS 家族和版本标识？运营方能否提供获批的只读导出文件？
    - >-
      最近五次变更分别耗费多少员工工时、经历多少次交接？现有 ProofCheck、MOC 或生命周期工具已经产出什么？
    - >-
      谁掌握预算并签署付费试点？由哪项现有工具或服务预算买单？可接受的价格门槛是多少？
    - >-
      每个目标厂区每年发生多少次安全功能改造？其中有多少需要留存书面证据资料包？
    - >-
      厂区安全、法务和 OT 安全团队会认可怎样的验收措辞、责任条款和人工签核边界？
    - >-
      第二个厂区能否复用解析器和证据映射？每份资料包仍需多少集成和审核工时？
operatingAssumptions:
  - assumption: >-
      目标厂区的证据核对耗时足够长，或引用缺失足够常见，因而值得另建工作流；仅有强制变更控制流程，并不能证明这项负担确实存在。
    basis: research.yaml
    validationTest: >-
      在欧洲三个目标厂区观察并计时至少五次已完成的 SIS 变更；记录交接、缺失链接、首次审核通过情况和现有厂商系统的输出。
    decisionImpact: >-
      如果工时中位数节省不足 20%，且完整度没有改善，就停止资料包假设，或将产品收窄到确实成本高昂的例外流程。
  - assumption: >-
      一个 SIS 家族能够提供经客户批准的只读版本和验证导出文件，并包含足以生成可信资料包的标识；研究尚未验证通用 SIS 导出接口。
    basis: research.yaml
    validationTest: >-
      获取一组脱敏导出文件，将其映射到一个安全功能，并在四周内请厂区功能安全负责人确认来源身份、版本和完整度。
    decisionImpact: >-
      如果访问数据必须写入控制器，或需要反复定制提取流程，就停止开发该连接器，并在承诺覆盖多个厂商前测试另一个 SIS 家族。
  - assumption: >-
      工厂工程或工艺安全总监愿意从现有 SIS、MOC、集成商或定期验证测试合同之外单独为资料包付费；研究没有发现付费意愿证据。
    basis: research.yaml
    validationTest: >-
      访谈 10 位预算负责人，记录由哪项预算支付、采购路径如何，并拿下两个范围明确的付费试点，而不是依赖非约束性的兴趣表达。
    decisionImpact: >-
      如果没有预算负责人愿意付费，只测试一次集成或服务合作渠道；如果这条路也走不通，就不要扩大直销团队或产品范围。
  - assumption: >-
      重复部署能降低集成和审核工时，支撑长期毛利率超过 70% 的目标；这项构想和研究都指出，早期服务投入会限制毛利。
    basis: idea.yaml
    validationTest: >-
      按工程、审核、安全和支持工时核算两个试点；要求第二次部署至少复用第一次一半的映射工作，并按付费价格测算直接交付成本。
    decisionImpact: >-
      如果后续交付仍高度定制或耗费大量人力，就明确范围、保留服务主导的方案，寻找具备资质的合作方，或放弃软件毛利假设。
  - assumption: >-
      功能安全咨询公司或 SIS 集成商愿意提供可信引荐并协助映射导出数据；研究认为它们是可行渠道，但没有核实任何合作协议。
    basis: research.yaml
    validationTest: >-
      向三家相关咨询公司或集成商提出具名买家引荐或试点合作请求，并争取一个与即将发生的变更直接相关的合格引荐。
    decisionImpact: >-
      如果没有合作方愿意参与，就继续由创始人主导直销，不招聘渠道团队，也不依赖经销商获客。
  - assumption: >-
      单独寻求 $2–4M 种子轮融资，可支持这款产品切口验证 18 个月；这是运营规划假设，并非 Indurex 已披露的融资需求。已披露的 €7M 融资轮次类型、资金用途和剩余资金跑道均未知。
    basis: 运营判断
    validationTest: >-
      对外提出融资需求前，核实 Indurex 实际融资文件、当前现金和资金跑道、产品团队投入，以及分阶段招聘和试点成本。
    decisionImpact: >-
      如果现有融资款足以覆盖里程碑，就不单独融资；如果公司阶段或成本基础不同，则在定稿财务模型前重新测算融资额和资金跑道。
experimentRoadmap:
  - horizon: 0–90 天
    experiment: >-
      在至少三个欧洲目标厂区观察并计时五次已完成的 SIS 变更，同时记录各厂区现有 MOC 和 SIS 工具的输出。
    hypothesis: >-
      变更审批、准确版本、测试证据和处置结论没有稳定地汇总进一份获认可的记录，因此产生了可测量的核对工作。
    successMetric: >-
      为五份记录加上时间戳；记录资料整理耗时中位数、链接缺失率、首次审核通过率和现有厂商覆盖情况；至少三次变更存在明确且尚未解决的关联缺口。
    owner: 创始人和兼职功能安全负责人
  - horizon: 0–90 天
    experiment: >-
      获取一个 SIS 家族经客户批准的脱敏只读导出文件，并根据一次历史改造生成影子资料包。
    hypothesis: >-
      无需连接控制器即可映射准确版本和验证证据，并由厂区具备资质的审核人核验。
    successMetric: >-
      完成一份审核人认可的映射，核实来源编号（IDs）和版本追溯信息；不写入控制器、不作无依据推断；取得访问权限后四周内完成映射。
    owner: 创始工程师与客户 SIS 工程师
  - horizon: 0–90 天
    experiment: >-
      使用同一份变更记录，对照 ProofCheck、厂区 MOC 系统及正在使用的 SIS 生命周期工具，比较现有厂商的工作流。
    hypothesis: >-
      至少部分目标变更缺少一份获运营方认可、能把已批准变更与准确版本、证据及人工处置结论绑定的资料。
    successMetric: >-
      比较五次变更；至少三次存在有据可查的关联缺口，且现有系统或流程尚未补上；否则停止独立产品假设。
    owner: 产品创始人和功能安全审核人
  - horizon: 3–6 个月
    experiment: >-
      围绕一次计划中的变更销售并运行付费影子模式试点；测量证据整理耗时的前后变化，并由厂区审核人签署处置结论。
    hypothesis: >-
      工厂工程或工艺安全总监愿意付费验证耗时和完整度改善，同时不转移安全授权责任。
    successMetric: >-
      签下付费试点；证据整理耗时中位数至少降低 30%，首次审核完整度至少达到 90%，且没有未经授权的控制器访问。
    owner: 创始人主导 GTM，创始工程师负责工程
  - horizon: 6–12 个月
    experiment: >-
      在第二家运营方使用同一 SIS 家族重复部署，并争取功能安全咨询公司或 SIS 集成商提供一次转介。
    hypothesis: >-
      来源映射和审核清单可以复用，可信合作方也能引荐合格买家，而不让服务工作吞掉整个产品。
    successMetric: >-
      拿下第二个付费试点；至少复用一半映射工作；记录实施工时和合作方带来的销售线索；不把未经验证的经销商假设当成事实。
    owner: 实施负责人和创始人
  - horizon: 12–18 个月
    experiment: >-
      观察到重复资料包需求后，再向首批试点客户提供年度厂区容量方案；与每位预算负责人测试按份和按容量定价。
    hypothesis: >-
      重复变更量和客户感知价值足以支撑可预测的年度合同，而非一次性的工程服务。
    successMetric: >-
      至少签下一份重复用量或年度容量合同，并证明重复交付的毛利率有望超过 70%；否则保留按份计价，或停止开发订阅方案。
    owner: 创始人和财务负责人
operations:
  - >-
    从客户控制、位于获批安全边界内的导出文件开始；部署前记录数据流和访问权限。NIST 的 OT 指南强调安全、可靠性和性能约束；OPC UA 的安全功能并不会带来通用 SIS 导出格式（研究来源 11 和 15）。
  - >-
    保留来源编号、版本时间戳、审核人身份、处置结论和审计历史；证据缺失或过期时不放行，并将控制器写入排除在产品范围之外。
  - >-
    请具备资质的功能安全审核人验证清单和签核措辞；运营方仍承担安全职责。由于研究没有直接审阅 IEC 61511 标准文本，不宣称获得该标准认证或符合其具体条款。
  - >-
    验证功能安全咨询公司、SIS/DCS 集成商和 MOC 厂商能否成为实施或转介合作方；承诺集成前，先确认数据访问和合作条款。
team:
  - role: 创始工程师
    startTiming: 第 0 个月
    rationale: >-
      搭建一条只读导出路径、来源追溯模型、缺失时不放行的检查机制和可审计的审核流程；Indurex 当前团队规模和可投入的工程产能均未披露。
  - role: 创始人（工业领域 GTM）
    startTiming: 第 0 个月
    rationale: >-
      围绕记录开展客户访谈，找到真正的预算负责人，并在组建销售团队前，围绕计划中的变更销售范围明确的试点；目前没有经核实的买家或销售周期证据。
  - role: 兼职功能安全负责人
    startTiming: 第 0 个月
    rationale: >-
      验证安全功能映射、证据清单、人工签核边界和验收措辞；咨询或审核合作关系尚未核实。
  - role: 实施工程师
    startTiming: 第 6 个月，前提是拿下付费试点并获批导出文件
    rationale: >-
      只有客户批准导出文件且付费使用证明确有需求后，才降低后续厂区导入成本并完善首个解析器；研究已将厂区特定集成列为高严重性风险。
milestones:
  - horizon: 0–12 个月
    items:
      - >-
        截至第 90 天，完成对三个目标厂区五次变更的工作流观察，并与现有厂商的输出对照。
      - >-
        验证一个经批准的只读 SIS 家族导出格式，并生成一份获审核人认可的影子资料包。
      - >-
        在两家运营方拿下两个范围明确的付费试点，并测量耗时节省、完整度和交付工时。
      - >-
        增加连接器前，先判断资料包相较 ProofCheck/MOC 是否带来增量价值，以及客户是否可能接受重复收费。
  - horizon: 12–24 个月
    items:
      - >-
        到第 18 个月，至少一个试点转为重复资料包用量或年度厂区容量合同。
      - >-
        增加另一个 SIS 家族前，第二次部署至少复用第一次一半的映射工作。
      - >-
        除非每次集成都有付费需求支撑，否则最多支持两三个 SIS 家族。
      - >-
        证明重复交付的毛利率有望超过 70%；否则保留明确的服务经济模型。
  - horizon: 24–36 个月
    items:
      - >-
        只有在重复合同和获认可的证据资料包得到验证后，才拓展到更多装置和运营方。
      - >-
        以已验证的厂区付费需求为前提，发展多厂区、合作伙伴辅助的销售模式，并完成三个 SIS 家族映射验证。
      - >-
        根据观察到的厂区适配度、年度变更频率、实际成交价和采购转化情况，重新评估 50 个厂区的 SOM 情景。
risks:
  - risk: >-
      现有工具可能已经满足资料包需求。Proconex ProofCheck 能记录 SIS 测试证据和恢复运行记录，MOC/生命周期工具也覆盖审批和审计线索（研究来源 19、20 和 22）。
    likelihood: High
    impact: High
    mitigation: >-
      开发产品前，先将真实厂区记录与现有厂商的系统输出逐一比较；如果抽样的五次变更中至少有四次已具备运营方认可、明确对应准确版本的证据资料包，就停止项目。
  - risk: >-
      SIS 导出格式、版本标识和访问审批因厂商及厂区而异；研究没有发现通用的只读配置接口（来源 15、19、20 和 21）。
    likelihood: High
    impact: High
    mitigation: >-
      只支持一个经客户批准的 SIS 家族，映射不完整时不放行；增加连接器前，要求第二次部署至少复用第一次一半的映射工作。
  - risk: >-
      在安全关键工作流中，用户可能把资料包误读为自动安全判断或安全保证，从而加大责任风险（HSE 来源 5–7 和 NIST 来源 11）。
    likelihood: Medium
    impact: High
    mitigation: >-
      要求具名且具备资质的人员作出处置；明确说明输出只涉及证据完整度和来源追溯；禁止控制器写入；投入运行前取得厂区法务和安全保障团队审核。
  - risk: >-
      预算归属和付费意愿未知；ProofCheck 和 MOC 产品已是成熟替代方案，采购还可能涉及工程、安全、OT 安全和厂区 IT 团队（研究来源 2、17、19 和 22）。
    likelihood: High
    impact: High
    mitigation: >-
      集成前确认经济买家及被替代的预算来源；围绕计划中的变更拿下付费试点，并在重复需求得到证明前暂缓年度订阅。
  - risk: >-
      可服务市场可能远小于 Seveso 上限；Cefic 报告称，欧洲化工行业需求疲弱，承受能源成本和进口压力，产能利用率仍低于危机前水平（研究来源 8 和 9）。
    likelihood: Medium
    impact: High
    mitigation: >-
      在目标厂区验证 SIS 适配度、年度变更频率和支出；在买家数据替代假设的适配率和价格之前，不按 €82.5M SAM 或 €1.5M SOM 情景扩张。
fundingAsk:
  round: seed
  targetFundingRangeUsd: "$2–4M 规划区间；并非 Indurex 已披露的融资需求"
  runwayMonths: 18
  useOfFundsSummary: >-
    这是一个为期 18 个月的规划方案，用于验证一个 SIS 家族的导出格式、构建只读且不控制设备的证据资料包和审计追踪、运行两到三个付费试点、完成安全和 OT 安全审查，并验证重复交付和年度定价。招聘和连接器扩展都要以付费需求为前提。Indurex 披露曾完成 €7M 融资，但融资轮次类型、资金用途、当前现金和剩余资金跑道均未知；筹资前先确认是否确实需要另寻种子轮资金。
