problem: >-
  使用 DCS 和安全仪表系统的工业运营商，可从控制、安全、历史数据库、报警和 IT 安全信号中标记工程偏差；但现有材料只描述人工审核，并未提及每项变更都能形成可重复使用的证据凭证。安全功能变更必须在装置恢复运行前审核，汇总配置、测试和审批记录可能带来交接负担，但这一点尚未核实。滩头市场假设是补齐变更证据并完成闭环，而不是再增加一条告警流。
targetUser:
  primary: >-
    欧洲能源和流程制造工厂的功能安全或 SIS 工程负责人；这些工厂使用安全仪表系统。首期范围限定为一个站点、一台装置和一项即将实施的安全功能变更。
  secondary: 负责整理工程移交证据的工厂维护或变更管理协调人员。
  buyer: 能源或制造业运营商的工厂工程总监或流程安全总监。
startupThesis:
  nonObviousInsight: >-
    真正的切口不是再发现一种异常，而是把某项工程偏差的人工处置意见，与完成该变更所需的确切配置修订版和验证证据牢牢绑定。
  beachhead: >-
    面向拥有 SIS 工程团队的欧洲能源和流程制造运营商，先围绕一项已获批的安全仪表功能变更，在装置恢复运行前完成证据闭环。
  wedge: >-
    每项变更生成一份只读证据包，串联已批准的变更、相关 SIS 配置修订版、受影响的安全功能、验证记录和具备资质人员的签字。
  whyNowCatalyst: >-
    Indurex 新近披露的 €7 million 融资和产品描述，显示市场正关注工程与安全数据；行业报道还提到 ICS/OT 事件会扰乱运营，并将安全功能工程与聚焦网络的监控区分开来。
  ventureScalePath: >-
    先在首个站点把证据包工作流复制到更多安全功能和装置，再将与版本绑定的证据处理标准化，覆盖更多 SIS 系列和多站点运营商，并由具备资质的审核合作方支持部署。
solution: >-
  从一项安全仪表功能入手，只读接入其获批变更记录、配置版本、相关报警或历史数据证据，以及已完成的验证记录。产品将变更映射到受影响的功能，汇总成与版本绑定的证据清单，并标出缺失或不一致的记录引用，交由具备资质的工厂审核人员处理，而不是自行判定该功能安全。审核人员记录处置意见和任何后续要求，系统再为运营方的变更记录导出一份带签名、可追溯的放行证据包。系统不会写入设定值、修改控制器配置，也不会授权设备运行。
goToMarketSeed:
  firstCustomer: >-
    拥有内部 SIS 工程团队、即将修改安全功能的欧洲能源或流程制造运营商；这是目标客户画像，并非 Indurex 已披露的客户。
  buyingTrigger: >-
    运营方按计划修改 SIS 或开展就绪评审，并须在受影响装置恢复运行前补齐变更证据。
  currentAlternative: >-
    沿用现有 SIS 和变更管理流程，由工程人员审核，整理配置记录、测试表、电子表格和移交文件；聚焦网络的 OT 监控或许能标记活动，但本身不会生成这类逐项变更的放行证明包。
  switchingReason: >-
    证据包把每项审核决定与准确的配置和证据版本绑定，减少人工核对，同时仍由运营方具备资质的工程师掌握审核权。
  pricingHypothesis: >-
    先围绕单台装置开展付费导入，并按已完成的变更证据包收费；只有重复业务量得到验证后，才提供年度站点容量订阅。
whyNow:
  - point: >-
      Indurex 宣布完成 €7 million 融资，投向关键基础设施与工业运营领域的工程智能，显示该品类获得新一轮投资。
    signalRefs:
      - 工程偏差需由人工处置
    sourceRefs:
      - 1
  - point: >-
      Indurex 描述的产品接入 DCS、安全系统、历史数据库、报警管理和 IT 安全数据，并标记工程偏差供人工审核，为聚焦证据闭环的切口提供了依据。
    signalRefs:
      - 工程偏差需由人工处置
    sourceRefs:
      - 1
  - point: >-
      行业报道提到 ICS/OT 事件曾扰乱运营，且有些事件耗时超过一个月才解决；这提高了运营可见性不足的代价，但不能证明市场需要这一特定工作流。
    signalRefs:
      - OT 事件可能扰乱运营
    sourceRefs:
      - 2
  - point: >-
      报道将安全功能和工程配置分析，与主要聚焦网络活动的 OT 产品区分开来，因此仍有空间验证逐项变更的人工审核凭证。
    signalRefs:
      - 聚焦安全功能，不同于网络监控
    sourceRefs:
      - 2
differentiator: >-
  据报道，Indurex 的产品是跨系统标记工程偏差供人审核；本概念则从指定的一项安全功能变更切入，以带签名、与版本绑定的放行记录收尾。它的价值在于特定恢复运行节点上的证据闭环，而不是持续监控或自动控制，也不具备写入工厂控制器的通道。
conceptDiagram:
  title: 从变更到放行证明
  mermaid: |
    flowchart LR
      Operator["Plant engineer"] --> Change["Approved change"]
      Sources["SIS revision + alarms + test record"] --> Packet["Change-evidence packet"]
      Change --> Packet
      Packet --> Reviewer["Qualified human review"]
      Reviewer --> Proof["Version-bound release proof"]
businessModelCanvas:
  customerSegments:
    - 使用安全仪表系统、且工程变更频繁的欧洲能源和流程制造运营商
    - 负责完成证据闭环的 SIS 工程和功能安全团队
  valuePropositions:
    - 为变更后的安全功能提供与版本绑定的审核和验证证明
    - 更快汇总证据，不自动作出安全决策，也不写入控制器
  channels:
    - 围绕计划变更窗口，直接联系工厂工程和流程安全负责人
    - 通过功能安全顾问和 SIS 集成商转介
  customerRelationships:
    - 为单个站点、单台装置和一个 SIS 系列提供付费、限定范围的导入服务
    - 工作流验证后，提供持续的变更证据包服务及年度站点容量方案
  revenueStreams:
    - 初期试点按每份变更证据包收费
    - 按审核变更容量定价的年度站点订阅
  keyResources:
    - 支持只读接入的 SIS 配置导出映射
    - 可追溯的变更到证据数据模型及具备资质的审核能力
  keyActivities:
    - 统一配置和测试证据格式，生成与版本绑定的证据包
    - 把变更映射到安全功能，并标出缺失引用供审核
    - 维护安全的站点接入和审核工作流
  keyPartners:
    - 功能安全顾问
    - SIS 和 DCS 集成商
    - 工厂变更管理软件提供商
  costStructure:
    - 按站点定制的集成和接入
    - 具备资质的审核人员成本及工业安全控制
    - 企业销售周期长、合作伙伴培训与支持
jobsToBeDone:
  - job: >-
      获批的工程变更影响一项安全仪表功能时，帮助 SIS 工程师证明：装置恢复运行前，准确的配置版本和所需验证证据都已审核，让运营方能以可审计记录完成变更闭环。
    currentAlternative: >-
      现有变更管理流程、工程师主导的审核，以及人工整理的配置和测试记录。
    successMetric: >-
      从变更获批到证据齐备且审核完成的中位耗时，以及首次审核时就包含全部必需来源关联记录的证据包占比。
ideaScorecard:
  creativeNovelty:
    score: 4
    rationale: >-
      经人工批准的放行凭证划出了一个独立的产品边界，但它建立在熟悉的工业变更管理和监控工作流之上。
  venturePotential:
    score: 4
    rationale: >-
      可重复的逐项变更工作流有望扩展到更多装置、SIS 系列和多站点运营商，但集成工作和工业采购可能限制早期增长。
  whiteSpace:
    score: 5
    rationale: >-
      现有证据描述了偏差检测和人工审核，历史想法中则没有覆盖与版本绑定的 SIS 变更放行证明；这是一个具体的白地假设，并不能证明市场上没有竞争者。
  painIntensity:
    score: 4
    rationale: >-
      机会筛选将痛点强度评为 4，引用的 ICS/OT 事件也可能扰乱运营；但来源没有直接衡量这里提出的证据整理负担。
  wedgeClarity:
    score: 5
    rationale: >-
      一个站点、一个 SIS 系列、一项安全功能变更和一份放行证据包，构成范围明确的试点，并能量化从变更到证据齐备所需的时间。
  evidenceFit:
    score: 4
    rationale: >-
      来源明确提及 SIS、工程偏差和人工审核，但没有验证这一工作流、其买方或客户付费意愿。
topRisks:
  - name: 站点集成各不相同
    description: >-
      SIS 导出内容、工程记录和证据格式可能差异很大，导致每次部署都要定制。
    mitigation: >-
      从一个 SIS 系列和由客户控制的只读导出开始；之后只支持已在付费试点中验证过的格式。
  - name: 安全责任风险
    description: >-
      用户可能把证据包误读为安全功能适合运行的保证。
    mitigation: >-
      产品只检查来源可追溯性和证据完整性，要求具备资质的人员作出处置意见，绝不写入控制器或授权设备运行。
  - name: 现有厂商主导下销售周期缓慢
    description: >-
      关键基础设施采购流程，以及现有 SIS 或变更管理厂商，都可能拖慢采用速度。
    mitigation: >-
      围绕计划中的修改，通过可信的功能安全顾问或集成商销售范围明确的付费试点，并衡量证据整理耗时。
