qualityPolicyVersion: 2
slug: safety-change-release-proof
date: '2026-10-23'
sector: industrial
pitch: 装置恢复运行前，证明每项安全系统变更符合获批功能要求。
selectionLens:
  championDimension: whiteSpace
  championScore: 5
  whyThisWins: >-
    它把一项已标记的工程偏差，转成与确切版本绑定、经人工批准的放行证明，且只对应一项安全功能。这是一笔独立的变更交付，网络告警和宽泛监控视图都无法完成这项交付。
  acceptedTradeoff: >-
    各工厂的 SIS 导出和审批流程各不相同，早期部署需要集成工作和具备资质的人工审核，软件毛利与销售速度都会受限。
originalityAudit:
  archetypesConsidered:
    - workflow-product
    - service-enabled-software
    - marketplace
    - infrastructure
    - risk-transfer
    - data-product
    - hardware-enabled-service
  rejectedCliches:
    - 用 AI 助手泛泛审查工厂数据
    - 为 OT 异常提供仪表盘和告警
    - 覆盖多个供应商的宽泛数据接入平台
    - 无需具备资质的审核人员就自动作出安全决策
  rareMechanism: >-
    针对每项变更生成一份不触发控制动作的放行证明，把确切的 SIS 配置修订版、已审核的偏差、验证证据和人工处置意见绑定到一项安全功能上；初期价值指标是每份已完成的证据包，而不是受监控资产数或告警量。
  nearestHistoricalIdeas:
    - slug: physics-change-test-gate
      similarity: mechanism
      decisiveDifference: >-
        那个想法为电力电子设计评审设置热设计 CAD 修订版的准入关口；本想法则把 SIS 配置变更与人工审核的安全证据关联起来，确保运行装置恢复服务前完成审核。
    - slug: fusion-interface-acceptance-escrow
      similarity: business-model
      decisiveDifference: >-
        两者都在技术放行节点使用证据，但本想法面向运营方销售安全变更记录，不会把供应商款项放入托管账户。
